# Change checks (P03.S3.T1). Path filters keep CI minutes down without skipping the checks a change needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      content: ${{ steps.f.outputs.content }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "api=$(has '^(apps/api/|content/|packages/contracts/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(apps/web/|packages/contracts/|apps/api/|content/|pnpm-lock\.yaml|package\.json|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "content=$(has '^(content/|education_knowledge/indexes/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(has '^(apps/mobile/|packages/contracts/|pnpm-lock\.yaml|\.github/)')" >> "$GITHUB_OUTPUT"

  security:
    # P18.S2.T3 (SUPPLY-CHAIN-01): known-vulnerable dependencies and committed secrets fail every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Python dependency audit (runtime dependencies)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --progress-spinner off
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript dependency audit (production, high and above; reviewed exceptions in package.json)
        run: pnpm audit --prod --audit-level=high
      - name: Leaked-credential scan (findings beyond the reviewed baseline fail)
        run: |
          git ls-files -z \
            | grep -zvE '(^|/)(migrations/versions/|pnpm-lock\.yaml$|uv\.lock$|packages/contracts/|content/catalogue/|content/source_registry\.json$|\.secrets\.baseline$)' \
            | xargs -0 uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline

  content:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1
      - name: Stable catalogue identity rules
        run: python -m pytest content/tools -q
      - name: Catalogue is reproducible from the committed indexes (same IDs, nothing retired)
        run: |
          python content/tools/build_catalogue.py --today 2026-10-07
          git diff --exit-code -- content/

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-ci-only
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Models and migrations agree
        env:
          PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI contract has no drift
        run: |
          uv run python -m portal_api.export_openapi ../../packages/contracts/openapi.json
          git diff --exit-code -- ../../packages/contracts/openapi.json

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Expo dependency/config checks
        run: pnpm doctor
      - name: Production variant refuses to build without an explicit API origin
        run: |
          if APP_VARIANT=production npx expo config --type public > /dev/null 2>&1; then
            echo "expected failure without PORTAL_API_ORIGIN"; exit 1
          fi
          APP_VARIANT=production PORTAL_API_ORIGIN=https://api.example.invalid npx expo config --type public --json > /tmp/prod.json
          APP_VARIANT=preview PORTAL_API_ORIGIN=https://api.example.invalid npx expo config --type public --json > /tmp/preview.json
          node -e '
            const p = require("/tmp/prod.json"), v = require("/tmp/preview.json");
            if (p.ios.bundleIdentifier !== "pk.punjablearningportal.student") throw new Error("production id");
            if (v.ios.bundleIdentifier === p.ios.bundleIdentifier) throw new Error("preview must not share the production identity");
            if (p.extra.apiOrigin !== "https://api.example.invalid") throw new Error("api origin");
          '

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-ci-only
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal
      PORTAL_API_INTERNAL_ORIGIN: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated contract types are current
        run: |
          pnpm --filter @portal/contracts generate
          git diff --exit-code -- packages/contracts/src/generated.ts
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - name: Production build (no API needed at build time)
        run: pnpm --filter web build
      - name: The same build refuses missing or development configuration for production (exit 78)
        working-directory: apps/web
        run: |
          set +e
          PORTAL_ROLE=production PORTAL_API_INTERNAL_ORIGIN= timeout 60 npx next start -p 3199; a=$?
          PORTAL_ROLE=production PORTAL_API_INTERNAL_ORIGIN=http://localhost:8100 timeout 60 npx next start -p 3198; b=$?
          echo "exit codes: missing=$a dev-host=$b"
          test "$a" = 78 && test "$b" = 78
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Start API on the real imported catalogue
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run portal-import-catalogue --apply
          uv run portal-dev-seed-staff   # development-only staff fixtures for the studio journeys
          uv run portal-dev-seed-practice   # development-only technical-fixture questions for practice journeys
          nohup uv run uvicorn portal_api.main:app --host 127.0.0.1 --port 8100 > /tmp/api.log 2>&1 &
          nohup uv run portal-written-worker --interval 1 > /tmp/worker.log 2>&1 &   # written regrade jobs (W06-06)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8100/readyz && break; sleep 1; done
      - name: Start web
        working-directory: apps/web
        run: |
          nohup pnpm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end journeys
        run: pnpm --filter web exec playwright test
        env:
          CI: "1"
      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log /tmp/worker.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
