# Change checks (P03.S3.T1). Path filters keep CI minutes down without skipping the checks a change needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      content: ${{ steps.f.outputs.content }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "api=$(has '^(apps/api/|content/|packages/contracts/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(apps/web/|packages/contracts/|apps/api/|content/|pnpm-lock\.yaml|package\.json|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "content=$(has '^(content/|education_knowledge/indexes/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(has '^(apps/mobile/|packages/contracts/|pnpm-lock\.yaml|\.github/)')" >> "$GITHUB_OUTPUT"

  security:
    # P18.S2.T3 (SUPPLY-CHAIN-01): known-vulnerable dependencies and committed secrets fail every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Python dependency audit (runtime dependencies)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --progress-spinner off
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript dependency audit (production, high and above; reviewed exceptions in package.json)
        run: pnpm audit --prod --audit-level=high
      - name: Component inventory (CycloneDX SBOM of runtime dependencies)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm list -r --prod --json --depth Infinity > /tmp/pnpm-prod.json
          uvx pytest==9.1.1 tools -q
          python3 tools/sbom.py --python /tmp/requirements.txt --node /tmp/pnpm-prod.json -o /tmp/sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          retention-days: 90
      - name: Leaked-credential scan (findings beyond the reviewed baseline fail)
        run: |  # pragma: allowlist secret (the block names the scan baseline file, not a credential)
          # The hook also exits non-zero when it only refreshes line numbers of reviewed findings; fail on new ones.
          set +e
          out=$(git ls-files -z \
            | grep -zvE '(^|/)(migrations/versions/|pnpm-lock\.yaml$|uv\.lock$|packages/contracts/|content/catalogue/|content/lessons/|content/source_registry\.json$|\.secrets\.baseline$)' \
            | xargs -0 uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline 2>&1)
          echo "$out"
          if echo "$out" | grep -q "Potential secrets about to be committed"; then exit 1; fi
          echo "No findings beyond the reviewed baseline."

  content:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1
      - name: Stable catalogue identity rules
        run: python -m pytest content/tools -q
      - name: Catalogue is reproducible from the committed indexes (same IDs, nothing retired)
        run: |
          python content/tools/build_catalogue.py --today 2026-10-07
          git diff --exit-code -- content/

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-ci-only
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Models and migrations agree
        env:
          PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI contract has no drift
        run: |
          uv run python -m portal_api.export_openapi ../../packages/contracts/openapi.json
          git diff --exit-code -- ../../packages/contracts/openapi.json
      - name: Migration rules and release manifest (P17.S3.T2)
        run: |
          uv run python -m portal_api.release check
          uv run python -m portal_api.qualification check  # P20.S4.T4: records name a measured build
          uv run python -m portal_api.release manifest > /tmp/release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: /tmp/release-manifest.json
          retention-days: 30

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Host-side tests of the native logic (page drafts, submit gate; not device evidence)
        run: pnpm test
      - name: App and web colour tokens match (P02.S2.T1, TOKENS-01)
        working-directory: .
        run: node apps/web/scripts/check-tokens.mjs
      # EXPO-CHECK-01: `pnpm doctor` ran pnpm's own built-in command, not expo-doctor, so this step checked nothing.
      # The version check compares with Expo's newest patch releases online, so it reports drift without failing the
      # build; updating the app's packages is done with a device build (B09, B14). The config checks below block.
      - name: Expo SDK version drift (online report, does not fail the build)
        continue-on-error: true
        run: npx expo install --check
      - name: Expo app config resolves
        run: npx expo config --type public > /dev/null
      - name: Production variant refuses to build without an explicit API origin
        run: |
          if APP_VARIANT=production npx expo config --type public > /dev/null 2>&1; then
            echo "expected failure without PORTAL_API_ORIGIN"; exit 1
          fi
          APP_VARIANT=production PORTAL_API_ORIGIN=https://api.example.invalid npx expo config --type public --json > /tmp/prod.json
          APP_VARIANT=preview PORTAL_API_ORIGIN=https://api.example.invalid npx expo config --type public --json > /tmp/preview.json
          node -e '
            const p = require("/tmp/prod.json"), v = require("/tmp/preview.json");
            if (p.ios.bundleIdentifier !== "pk.punjablearningportal.student") throw new Error("production id");
            if (v.ios.bundleIdentifier !== "pk.punjablearningportal.student.preview") throw new Error("preview id");
            if (p.extra.apiOrigin !== "https://api.example.invalid") throw new Error("api origin");
            if (v.extra.apiOrigin !== "https://api.example.invalid") throw new Error("preview origin");
            if (v.extra.variant !== "preview") throw new Error("preview variant");
            if (!v.ios.infoPlist.NSLocalNetworkUsageDescription) throw new Error("local network description");
            if (v.ios.infoPlist.NSAppTransportSecurity?.NSAllowsLocalNetworking !== true) throw new Error("preview transport");
            if (p.ios.infoPlist?.NSAppTransportSecurity?.NSAllowsLocalNetworking) throw new Error("production transport");
          '

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-ci-only
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal-ci-only@127.0.0.1:5432/portal
      PORTAL_API_INTERNAL_ORIGIN: http://127.0.0.1:8100
      # WORKLOAD-GUARD-01: the guard's MCQ save-latency and error rules are for real traffic; on a shared runner they
      # would pause written tests at random. The API tests cover them; the database and scoring rules stay on here.
      PORTAL_HEALTH_SAMPLE_S: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated contract types are current
        run: |
          pnpm --filter @portal/contracts generate
          git diff --exit-code -- packages/contracts/src/generated.ts
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - name: Production build (no API needed at build time)
        run: pnpm --filter web build
      - name: Browser bundle ships no source maps, credentials or server configuration names (P18.S2.T3)
        run: node apps/web/scripts/check-bundle.mjs
      - name: Web and app colour tokens match (P02.S2.T1, TOKENS-01)
        run: node apps/web/scripts/check-tokens.mjs
      - name: The same build refuses missing or development configuration for production (exit 78)
        working-directory: apps/web
        run: |
          set +e
          PORTAL_ROLE=production PORTAL_API_INTERNAL_ORIGIN= timeout 60 npx next start -p 3199; a=$?
          PORTAL_ROLE=production PORTAL_API_INTERNAL_ORIGIN=http://localhost:8100 timeout 60 npx next start -p 3198; b=$?
          echo "exit codes: missing=$a dev-host=$b"
          test "$a" = 78 && test "$b" = 78
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Start API on the real imported catalogue
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run portal-import-catalogue --apply
          uv run portal-dev-seed-staff   # development-only staff fixtures for the studio journeys
          uv run portal-dev-seed-practice   # development-only technical-fixture questions for practice journeys
          nohup uv run uvicorn portal_api.main:app --host 127.0.0.1 --port 8100 > /tmp/api.log 2>&1 &
          nohup uv run portal-written-worker --interval 1 > /tmp/worker.log 2>&1 &   # written regrade jobs (W06-06)
          nohup uv run portal-import-worker --interval 1 > /tmp/import-worker.log 2>&1 &   # bulk imports (IMPORT-BULK-01)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8100/readyz && break; sleep 1; done
          # Class XI Biology Chapter 1 pilot drafts (private; never published here) for the staff preview journeys.
          python3 ../../content/tools/import_lessons.py --api http://127.0.0.1:8100
      - name: Start web
        working-directory: apps/web
        run: |
          nohup pnpm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit  # P19.S2.T1 (BROWSERS-01)
      - name: End-to-end journeys
        run: pnpm --filter web exec playwright test
        env:
          CI: "1"
      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log /tmp/worker.log /tmp/import-worker.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    # P03.S3.T2: build the API and web images and keep their digests. Nothing is pushed to a registry (B03).
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image and check it answers without migrating
        if: needs.changes.outputs.api == 'true'
        run: |
          docker buildx build -f apps/api/Dockerfile -t portal-api:ci --load --metadata-file /tmp/api-image.json .
          docker run -d --name portal-api -p 8100:8100 -e PORTAL_ROLE=development -e PORTAL_HEALTH_SAMPLE_S=0 portal-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8100/healthz
      - name: Build the web image
        if: needs.changes.outputs.web == 'true'
        run: docker buildx build -f apps/web/Dockerfile -t portal-web:ci --load --metadata-file /tmp/web-image.json .
      - uses: actions/upload-artifact@v7
        with:
          name: image-digests
          path: /tmp/*-image.json
          retention-days: 14
          if-no-files-found: error
