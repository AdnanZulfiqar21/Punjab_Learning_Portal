<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original summary of topic 24.3.2: with nitrous acid (NaNO2 + HCl) primary aliphatic amines give an unstable diazonium salt and bubbles of nitrogen, secondary amines a yellow oily N-nitrosoamine, and tertiary amines a soluble nitrite salt with no visible change. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Primary, secondary and tertiary amines with nitrous acid</text>
  <rect x="15.0" y="55.0" width="870.0" height="70.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="98.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">nitrous acid is made in the tube: NaNO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + HCl -&gt; HNO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + NaCl (kept cold)</tspan></text>
  <rect x="15.0" y="140.0" width="870.0" height="110.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="40.0" y="170.0" font-size="16" fill="#0f7a62" text-anchor="start" font-weight="700">primary</text>
  <text x="520.0" y="172.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HNO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HCl -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">N</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">+</tspan><tspan dy="5.9"> Cl</tspan><tspan dy="-5.9" font-size="9.8">-</tspan><tspan dy="5.9"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="520.0" y="200.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the alkyl diazonium ion breaks down at once, giving N2 gas</text>
  <text x="520.0" y="228.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">observation: bubbles of nitrogen</text>
  <rect x="15.0" y="260.0" width="870.0" height="110.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="40.0" y="290.0" font-size="16" fill="#d98b2b" text-anchor="start" font-weight="700">secondary</text>
  <text x="520.0" y="292.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NHCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + HNO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">N(CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)-N=O + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="520.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">N-methyl-N-nitrosoethanamine</text>
  <text x="520.0" y="348.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">observation: yellow oily liquid</text>
  <rect x="15.0" y="380.0" width="870.0" height="110.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="40.0" y="410.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">tertiary</text>
  <text x="520.0" y="412.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">N(CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HNO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; [CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH(CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">]</tspan><tspan dy="-5.9" font-size="9.8">+</tspan><tspan dy="5.9"> NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">-</tspan></text>
  <text x="520.0" y="440.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a soluble nitrite salt</text>
  <text x="520.0" y="468.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">observation: no visible change</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
