<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="220" fill="#ffffff"/>
  <!-- Making cement: limestone and clay in a rotary kiln, then ground with gypsum (our own flow for topic 32.13). -->
  <rect x="10.0" y="40.0" width="210.0" height="130.0" rx="14" stroke="#4b5563" stroke-width="3" fill="#f1f3f6"/>
  <text x="115.0" y="96.9" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">limestone</tspan></text>
  <text x="115.0" y="132.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">+ clay</tspan></text>
  <rect x="265.0" y="40.0" width="230.0" height="130.0" rx="14" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <text x="380.0" y="96.9" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">rotary kiln</tspan></text>
  <text x="380.0" y="132.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">about 1500 &#176;C</tspan></text>
  <rect x="540.0" y="40.0" width="220.0" height="130.0" rx="14" stroke="#d98b2b" stroke-width="3" fill="#fff1dc"/>
  <text x="650.0" y="96.9" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">ground with</tspan></text>
  <text x="650.0" y="132.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">gypsum</tspan></text>
  <rect x="805.0" y="40.0" width="185.0" height="130.0" rx="14" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="897.5" y="114.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">cement</tspan></text>
  <line x1="222.0" y1="105.0" x2="249.2" y2="105.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M262.0 105.0 L247.5 111.8 L247.5 98.2 Z" fill="#14181f"/>
  <line x1="497.0" y1="105.0" x2="524.2" y2="105.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M537.0 105.0 L522.5 111.8 L522.5 98.2 Z" fill="#14181f"/>
  <line x1="762.0" y1="105.0" x2="789.2" y2="105.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M802.0 105.0 L787.5 111.8 L787.5 98.2 Z" fill="#14181f"/>
</svg>
