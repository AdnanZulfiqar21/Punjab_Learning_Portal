<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figs 14.4 to 14.7: the shadow of a ball on a turning turntable moves in S.H.M.; a point P moving round a circle of radius xo at angular speed w has a projection Q on the diameter with x = xo cos(wt), speed w sqrt(xo2 - x2) and acceleration -w2 x. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">S.H.M. as the projection of uniform circular motion (after Figs 14.4 to 14.7)</text>
  <rect x="15.0" y="55.0" width="340.0" height="440.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="185.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">turntable shadow (Fig 14.4)</text>
  <line x1="80.0" y1="125.0" x2="80.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80.0 165.0 L77.0 158.7 L83.0 158.7 Z" fill="#4b5563"/>
