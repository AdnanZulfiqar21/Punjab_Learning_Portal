  <path d="M140.0 165.0 L137.0 158.7 L143.0 158.7 Z" fill="#4b5563"/>
  <line x1="170.0" y1="125.0" x2="170.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M170.0 165.0 L167.0 158.7 L173.0 158.7 Z" fill="#4b5563"/>
  <line x1="200.0" y1="125.0" x2="200.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M200.0 165.0 L197.0 158.7 L203.0 158.7 Z" fill="#4b5563"/>
  <line x1="230.0" y1="125.0" x2="230.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M230.0 165.0 L227.0 158.7 L233.0 158.7 Z" fill="#4b5563"/>
  <line x1="260.0" y1="125.0" x2="260.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260.0 165.0 L257.0 158.7 L263.0 158.7 Z" fill="#4b5563"/>
  <line x1="290.0" y1="125.0" x2="290.0" y2="159.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M290.0 165.0 L287.0 158.7 L293.0 158.7 Z" fill="#4b5563"/>
  <text x="185.0" y="115.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">light from a projector</text>
  <ellipse cx="185.0" cy="220.0" rx="95.0" ry="30.0" stroke="#4b5563" stroke-width="2" fill="#e5e7eb"/>
  <circle cx="270.0" cy="228.0" r="12.0" stroke="#d7322f" stroke-width="2" fill="#f87171"/>
  <path d="M100 260 Q185 300 270 260" stroke="#14181f" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M270.0 260.0 L264.8 267.4 L261.0 260.8 Z" fill="#14181f"/>
  <text x="185.0" y="300.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">turntable turning at constant w</text>
  <path d="M60.0 400.0 L310.0 400.0 L340.0 440.0 L30.0 440.0 Z" stroke="#4b5563" stroke-width="1.5" fill="#f1f5f9" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="185.0" cy="420.0" rx="22.0" ry="8.0" stroke="#14181f" stroke-width="1" fill="#374151"/>
  <line x1="150.0" y1="420.0" x2="96.4" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M90.0 420.0 L97.3 416.6 L97.3 423.4 Z" fill="#14181f"/>
  <line x1="220.0" y1="420.0" x2="273.6" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
