  <text x="185.0" y="465.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the shadow moves to and fro</text>
  <text x="185.0" y="481.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">across the screen in S.H.M.</text>
  <rect x="370.0" y="55.0" width="515.0" height="440.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="627.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">P on the circle, Q on the diameter</text>
  <circle cx="560.0" cy="270.0" r="150.0" stroke="#7c3aed" stroke-width="2.2" fill="none"/>
  <line x1="390.0" y1="270.0" x2="730.0" y2="270.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="560.0" y1="100.0" x2="560.0" y2="440.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="560.0" y1="270.0" x2="674.9" y2="173.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="674.9" cy="173.6" r="7.0" stroke="#d7322f" stroke-width="1.8" fill="#f87171"/>
  <text x="684.9" y="165.6" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">P</text>
  <line x1="674.9" y1="173.6" x2="674.9" y2="270.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="674.9" cy="270.0" r="6.0" stroke="#0f7a62" stroke-width="1.8" fill="#86efac"/>
  <text x="680.9" y="292.0" font-size="15" fill="#0f7a62" text-anchor="start" font-weight="700">Q</text>
  <text x="546.0" y="290.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">O</text>
  <line x1="566.4" y1="310.0" x2="668.5" y2="310.0" stroke="#0f7a62" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M674.9 310.0 L667.7 313.4 L667.7 306.6 Z" fill="#0f7a62"/>
  <path d="M560.0 310.0 L567.3 306.6 L567.3 313.4 Z" fill="#0f7a62"/>
  <text x="617.5" y="328.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">x = x</tspan><tspan dy="4.2" font-size="9.1">o</tspan><tspan dy="-4.2"> cos(wt)</tspan></text>
  <path d="M600 270 A40 40 0 0 0 590.6 244.3" stroke="#14181f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="608.0" y="258.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">wt</text>
  <line x1="674.9" y1="173.6" x2="621.7" y2="110.2" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M617.1 104.6 L625.2 108.4 L619.4 113.3 Z" fill="#1f6fb5"/>
  <text x="633.1" y="110.6" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">v</tspan><tspan dy="4.2" font-size="9.1">p</tspan><tspan dy="-4.2"> = x</tspan><tspan dy="4.2" font-size="9.1">o</tspan><tspan dy="-4.2">w</tspan></text>
  <line x1="674.9" y1="173.6" x2="626.8" y2="213.9" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M621.3 218.6 L625.1 210.4 L630.0 216.2 Z" fill="#d7322f"/>
  <text x="632.7" y="177.7" font-size="13" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">a</tspan><tspan dy="4.2" font-size="9.1">p</tspan><tspan dy="-4.2"> = x</tspan><tspan dy="4.2" font-size="9.1">o</tspan><tspan dy="-4.2">w</tspan><tspan dy="-5.5" font-size="9.1">2</tspan></text>
  <text x="394.0" y="262.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">B</text>
  <text x="726.0" y="262.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">A</text>
  <text x="395.0" y="440.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">x = x</tspan><tspan dy="4.5" font-size="9.8">o</tspan><tspan dy="-4.5"> cos(wt)</tspan></text>
  <text x="395.0" y="462.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">v = x</tspan><tspan dy="4.5" font-size="9.8">o</tspan><tspan dy="-4.5"> w sin(wt) = w sqrt(x</tspan><tspan dy="4.5" font-size="9.8">o</tspan><tspan dy="-10.4" font-size="9.8">2</tspan><tspan dy="5.9"> - x</tspan><tspan dy="-5.9" font-size="9.8">2</tspan><tspan dy="5.9">)</tspan></text>
  <text x="395.0" y="484.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">a = -w</tspan><tspan dy="-5.9" font-size="9.8">2</tspan><tspan dy="5.9"> x</tspan></text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
