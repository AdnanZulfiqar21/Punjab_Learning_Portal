<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original redraw after Figure 9.35: a thermistor and a fixed resistor in a potential divider switch an alarm when the temperature rises. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Thermistor in a potential divider: fire alarm</text>
  <path d="M180.0 90.0 L180.0 410.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="160" y="230" width="40" height="40" fill="#ffffff"/>
  <line x1="164.0" y1="246.0" x2="196.0" y2="246.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="172.0" y1="255.0" x2="188.0" y2="255.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="160.0" y="254.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">battery</text>
  <path d="M180.0 90.0 L420.0 90.0 L420.0 120.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="400" y="120" width="40" height="110" fill="#ffffff"/>
  <path d="M420.0 120.0 L420.0 136.5 L408.0 142.0 L432.0 153.0 L408.0 164.0 L432.0 175.0 L408.0 186.0 L432.0 197.0 L408.0 208.0 L420.0 213.5 L420.0 230.0" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="442.0" y="180.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">fixed R</text>
  <path d="M420.0 230.0 L420.0 270.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="420.0" cy="250.0" r="6.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="404.0" y="256.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="700">B</text>
  <rect x="404.0" y="270.0" width="32.0" height="100.0" rx="0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <line x1="390.0" y1="360.0" x2="450.0" y2="280.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <text x="442.0" y="330.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">thermistor</text>
  <path d="M420.0 370.0 L420.0 410.0 L180.0 410.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M420.0 250.0 L560.0 250.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M560.0 225.0 L560.0 275.0 L605.0 250.0 Z" stroke="#7c3aed" stroke-width="2.5" fill="#efe7fd" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="611.0" cy="250.0" r="6.0" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="582.0" y="300.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">NOT gate</text>
  <path d="M617.0 250.0 L700.0 250.0 L700.0 300.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="700.0" cy="322.0" r="22.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="700.0" y="328.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">siren</text>
  <path d="M700.0 344.0 L700.0 410.0 L420.0 410.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="560.0" y="438.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="400">earth (0 V)</text>
  <rect x="600.0" y="90.0" width="285.0" height="130.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="614.0" y="118.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">Heat lowers the thermistor's</text>
  <text x="614.0" y="137.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">resistance, so the voltage</text>
  <text x="614.0" y="157.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">across it (at B) falls. The NOT</text>
  <text x="614.0" y="176.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">gate's input goes low, its</text>
  <text x="614.0" y="196.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">output goes high: siren on.</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
