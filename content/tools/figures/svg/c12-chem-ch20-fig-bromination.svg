<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original mechanism after the book: general electrophilic substitution (electrophile attacks the pi system, sigma complex, loss of H+), and bromination in which AlBr3 forms Br+ and [AlBr4]-, Br+ attacks the ring and [AlBr4]- removes H+ to give bromobenzene, HBr and AlBr3. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Electrophilic aromatic substitution: bromination</text>
  <rect x="15.0" y="55.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">general mechanism (three steps)</text>
  <path d="M100.0 143.0 L127.7 159.0 L127.7 191.0 L100.0 207.0 L72.3 191.0 L72.3 159.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="175.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="160.0" y="125.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">E</tspan><tspan dy="-7.1" font-size="11.9">+</tspan></text>
  <path d="M110.0 153.0 Q130.0 117.0 152.0 129.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M152.0 129.0 L142.0 128.4 L146.1 120.9 Z" fill="#d7322f"/>
  <line x1="180.0" y1="175.0" x2="236.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M245.0 175.0 L235.0 179.6 L235.0 170.4 Z" fill="#14181f"/>
  <text x="212.5" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">slow</tspan></text>
  <path d="M330.0 151.0 L357.7 167.0 L357.7 199.0 L330.0 215.0 L302.3 199.0 L302.3 167.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M344.2 171.1 A18.56 18.56 0 1 1 315.8 171.1" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330.0" y="189.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="330.0" y1="151.0" x2="317.7" y2="131.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="311.1" y="125.8" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="330.0" y1="151.0" x2="342.3" y2="131.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="348.9" y="125.8" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">E</tspan></text>
  <text x="330.0" y="241.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">sigma complex</text>
  <line x1="410.0" y1="175.0" x2="471.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M480.0 175.0 L470.0 179.6 L470.0 170.4 Z" fill="#14181f"/>
  <text x="445.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">fast, - H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <path d="M560.0 151.0 L587.7 167.0 L587.7 199.0 L560.0 215.0 L532.3 199.0 L532.3 167.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="560.0" cy="183.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="560.0" y1="151.0" x2="560.0" y2="133.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="560.0" y="125.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">E</tspan></text>
  <text x="740.0" y="145.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">1 make the electrophile</text>
  <text x="740.0" y="167.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">2 pi electrons attack it</text>
  <text x="740.0" y="189.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">3 lose H+: ring restored</text>
  <rect x="15.0" y="272.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="302.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">bromination with an aluminium bromide catalyst</text>
  <text x="80.0" y="341.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br-Br</tspan></text>
  <text x="160.0" y="341.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ AlBr</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <line x1="210.0" y1="335.0" x2="261.2" y2="335.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M270.0 335.0 L260.0 339.6 L260.0 330.4 Z" fill="#14181f"/>
  <text x="350.0" y="341.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan><tspan dy="-7.6" font-size="12.6">+</tspan><tspan dy="7.6"> + [AlBr</tspan><tspan dy="5.8" font-size="12.6">4</tspan><tspan dy="-5.8">]</tspan><tspan dy="-7.6" font-size="12.6">-</tspan></text>
  <text x="530.0" y="341.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">Lewis acid makes the electrophile</text>
  <path d="M85.0 415.0 L111.0 430.0 L111.0 460.0 L85.0 475.0 L59.0 460.0 L59.0 430.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="85.0" cy="445.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="145.0" y="397.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan><tspan dy="-6.7" font-size="11.2">+</tspan></text>
  <path d="M95.0 425.0 Q115.0 391.0 136.0 401.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M136.0 401.0 L126.0 400.9 L129.6 393.3 Z" fill="#d7322f"/>
  <line x1="165.0" y1="445.0" x2="216.2" y2="445.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M225.0 445.0 L215.0 449.6 L215.0 440.4 Z" fill="#14181f"/>
  <path d="M300.0 423.0 L326.0 438.0 L326.0 468.0 L300.0 483.0 L274.0 468.0 L274.0 438.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M313.3 441.8 A17.4 17.4 0 1 1 286.7 441.8" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300.0" y="459.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="300.0" y1="423.0" x2="288.4" y2="405.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="281.8" y="399.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="300.0" y1="423.0" x2="311.6" y2="405.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="318.2" y="399.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="370.0" y1="445.0" x2="461.2" y2="445.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470.0 445.0 L460.0 449.6 L460.0 440.4 Z" fill="#14181f"/>
  <text x="420.0" y="435.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[AlBr</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">]</tspan><tspan dy="-5.5" font-size="9.1">-</tspan></text>
  <path d="M545.0 423.0 L571.0 438.0 L571.0 468.0 L545.0 483.0 L519.0 468.0 L519.0 438.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="545.0" cy="453.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="545.0" y1="423.0" x2="545.0" y2="406.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="545.0" y="399.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="715.0" y="457.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HBr + AlBr</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <text x="715.0" y="485.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">catalyst regenerated</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
