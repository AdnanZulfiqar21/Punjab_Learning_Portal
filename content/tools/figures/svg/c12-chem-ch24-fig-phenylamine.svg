<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <!-- Original diagram for topic 24.3.3: phenylamine with bromine water gives 2,4,6-tribromophenylamine and HBr; with nitrous acid below 10 C it gives benzenediazonium chloride, which on warming with water gives phenol, nitrogen and HCl. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reactions of phenylamine</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">with bromine water: a white precipitate at once</text>
  <path d="M100.0 137.0 L124.2 151.0 L124.2 179.0 L100.0 193.0 L75.8 179.0 L75.8 151.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="165.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="100.0" y1="137.0" x2="100.0" y2="121.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100.0" y="114.1" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="170.0" y="171.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3Br</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="215.0" y1="165.0" x2="276.2" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M285.0 165.0 L275.0 169.6 L275.0 160.4 Z" fill="#14181f"/>
  <path d="M365.0 137.0 L389.2 151.0 L389.2 179.0 L365.0 193.0 L340.8 179.0 L340.8 151.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="365.0" cy="165.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="365.0" y1="137.0" x2="365.0" y2="121.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="365.0" y="115.1" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.2" font-size="9.1">2</tspan></text>
  <line x1="389.2" y1="151.0" x2="402.6" y2="143.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="406.0" y="142.3" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="340.8" y1="151.0" x2="327.4" y2="143.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="324.0" y="142.3" font-size="13" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="365.0" y1="193.0" x2="365.0" y2="208.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="365.0" y="224.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="470.0" y="171.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3HBr</tspan></text>
  <text x="365.0" y="245.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">2,4,6-tribromophenylamine</text>
  <text x="700.0" y="150.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">NH2 activates the ring and</text>
  <text x="700.0" y="168.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">directs to 2, 4 and 6</text>
  <rect x="15.0" y="265.0" width="870.0" height="355.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">with nitrous acid: diazotisation, then phenol</text>
  <path d="M100.0 347.0 L124.2 361.0 L124.2 389.0 L100.0 403.0 L75.8 389.0 L75.8 361.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="375.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="100.0" y1="347.0" x2="100.0" y2="331.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100.0" y="324.1" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="190.0" y="381.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HNO</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + HCl</tspan></text>
  <line x1="265.0" y1="375.0" x2="326.2" y2="375.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M335.0 375.0 L325.0 379.6 L325.0 370.4 Z" fill="#14181f"/>
  <text x="300.0" y="365.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">below 10 C</tspan></text>
  <path d="M415.0 347.0 L439.2 361.0 L439.2 389.0 L415.0 403.0 L390.8 389.0 L390.8 361.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="415.0" cy="375.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="415.0" y1="347.0" x2="415.0" y2="331.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="415.0" y="324.6" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">+</tspan><tspan dy="5.9"> Cl</tspan><tspan dy="-5.9" font-size="9.8">-</tspan></text>
  <text x="510.0" y="381.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 2H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="415.0" y="435.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzenediazonium chloride</text>
  <path d="M100.0 502.0 L124.2 516.0 L124.2 544.0 L100.0 558.0 L75.8 544.0 L75.8 516.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="530.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="100.0" y1="502.0" x2="100.0" y2="486.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100.0" y="479.6" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">+</tspan><tspan dy="5.9"> Cl</tspan><tspan dy="-5.9" font-size="9.8">-</tspan></text>
  <text x="180.0" y="536.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <line x1="225.0" y1="530.0" x2="291.2" y2="530.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300.0 530.0 L290.0 534.6 L290.0 525.4 Z" fill="#14181f"/>
  <text x="262.5" y="520.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">warm</tspan></text>
  <path d="M380.0 502.0 L404.2 516.0 L404.2 544.0 L380.0 558.0 L355.8 544.0 L355.8 516.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="380.0" cy="530.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="380.0" y1="502.0" x2="380.0" y2="486.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="380.0" y="479.6" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="480.0" y="536.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ N</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + HCl</tspan></text>
  <text x="380.0" y="590.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">phenol</text>
  <text x="720.0" y="440.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">aryl diazonium ions are fairly</text>
  <text x="720.0" y="458.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">stable in the cold because the</text>
  <text x="720.0" y="476.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">positive charge is delocalised</text>
  <text x="720.0" y="494.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">over the ring; alkyl diazonium</text>
  <text x="720.0" y="512.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ions break down at once</text>
  <text x="450.0" y="641" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
