<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="625" fill="#ffffff"/>
  <!-- Original chart after the book's examples: primary amines (methanamine, ethanamine, propan-1-amine, phenylamine), secondary (N-methylmethanamine, N-methylethanamine, diphenylamine), tertiary (N,N-dimethylmethanamine, triphenylamine) and the quaternary salt tetramethylammonium chloride. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Primary, secondary and tertiary amines</text>
  <rect x="15.0" y="70.0" width="870.0" height="104.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="30.0" y="96.0" font-size="15" fill="#0f7a62" text-anchor="start" font-weight="700">primary: one group on N (-NH2)</text>
  <text x="120.0" y="132.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="120.0" y="156.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">methanamine</text>
  <text x="335.0" y="132.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="335.0" y="156.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">ethanamine</text>
  <text x="550.0" y="132.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="550.0" y="156.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">propan-1-amine</text>
  <text x="765.0" y="132.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="765.0" y="156.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">phenylamine (aniline)</text>
  <rect x="15.0" y="188.0" width="870.0" height="104.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="30.0" y="214.0" font-size="15" fill="#d98b2b" text-anchor="start" font-weight="700">secondary: two groups on N (-NH-)</text>
  <text x="120.0" y="250.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">NHCH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <text x="120.0" y="274.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">N-methylmethanamine</text>
  <text x="335.0" y="250.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">NHCH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <text x="335.0" y="274.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">N-methylethanamine</text>
  <text x="550.0" y="250.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">NH</tspan></text>
  <text x="550.0" y="274.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">diphenylamine</text>
  <rect x="15.0" y="306.0" width="870.0" height="104.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="30.0" y="332.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">tertiary: three groups on N</text>
  <text x="120.0" y="368.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">N</tspan></text>
  <text x="120.0" y="392.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">N,N-dimethylmethanamine</text>
  <text x="335.0" y="368.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">N</tspan></text>
  <text x="335.0" y="392.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">triphenylamine</text>
  <rect x="15.0" y="424.0" width="870.0" height="104.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="30.0" y="450.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">quaternary ammonium salt: four groups on N+</text>
  <text x="450.0" y="486.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[(CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">4</tspan><tspan dy="-5.4">N]</tspan><tspan dy="-7.1" font-size="11.9">+</tspan><tspan dy="7.1"> Cl</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="450.0" y="510.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">tetramethylammonium chloride</text>
  <text x="450.0" y="596.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the class depends on how many groups are attached to the nitrogen atom, not to the carbon next to it</text>
  <text x="450.0" y="616" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
