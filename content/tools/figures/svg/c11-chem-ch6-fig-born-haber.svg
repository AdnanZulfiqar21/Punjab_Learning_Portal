<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 6.8 and 6.9: the Born-Haber cycle of sodium chloride with the printed values; levels not to scale. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .l{font-size:14px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Born-Haber cycle of sodium chloride (Figure 6.9, not to scale)</text>
  <path d="M80 600 V70" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="50" y="340" transform="rotate(-90 50 340)" text-anchor="middle">enthalpy</text>
  <!-- levels -->
  <g stroke="#14181f" stroke-width="3">
    <path d="M140 440 H340"/>
    <path d="M140 372 H340"/>
    <path d="M140 290 H340"/>
    <path d="M140 110 H340"/>
    <path d="M400 230 H600"/>
    <path d="M400 570 H600"/>
  </g>
  <g class="l">
    <text x="150" y="432">Na(s) + 1/2 Cl2(g)</text>
    <text x="150" y="364">Na(g) + 1/2 Cl2(g)</text>
    <text x="150" y="282">Na(g) + Cl(g)</text>
    <text x="150" y="102">Na+(g) + e- + Cl(g)</text>
    <text x="410" y="222">Na+(g) + Cl-(g)</text>
    <text x="410" y="562">NaCl(s)</text>
  </g>
  <!-- step arrows -->
  <g stroke="#0f7a62" stroke-width="2.5">
    <path d="M360 440 V378" marker-end="url(#ag)"/>
    <path d="M360 372 V296" marker-end="url(#ag)"/>
    <path d="M360 290 V116" marker-end="url(#ag)"/>
  </g>
  <path d="M385 112 L400 226" stroke="#d7322f" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M620 230 V562" stroke="#d7322f" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M120 440 Q100 520 392 568" fill="none" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#a)"/>
  <g class="t">
    <text x="370" y="412" style="fill:#0f7a62">atomization of Na: +108</text>
    <text x="370" y="338" style="fill:#0f7a62">atomization of 1/2 Cl2: +121</text>
    <text x="370" y="200" style="fill:#0f7a62">first ionization energy of Na: +496</text>
    <text x="420" y="140" style="fill:#d7322f">first electron affinity of Cl: -349</text>
    <text x="630" y="392" style="fill:#d7322f">lattice energy = ?</text>
    <text x="160" y="520" style="fill:#1f6fb5">enthalpy of formation: -411</text>
  </g>
  <rect x="700" y="80" width="440" height="300" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="920" y="108">Reading the cycle (kJ per mol)</text>
  <g class="t">
    <text x="720" y="136">Hess: delta Hx + delta H latt = delta Hf, where delta Hx is</text>
    <text x="720" y="154">everything from the elements to the gaseous ions:</text>
    <text x="720" y="180">delta Hx = 108 + 496 + 121 + (-349) = +376</text>
    <text x="720" y="206">delta H latt = delta Hf - delta Hx = -411 - 376 = -787</text>
    <text x="720" y="240">lattice energy cannot be measured directly; the cycle</text>
    <text x="720" y="258">combines measurable steps (an application of Hess's law)</text>
    <text x="720" y="292" style="font-weight:700;fill:#14181f">Sample 6.9: formation of NaF from its cycle</text>
    <text x="720" y="312">delta Hf = latt + at(Na) + IE(Na) + 1/2 E(F-F) + EA(F)</text>
    <text x="720" y="330">= -939 + 109 + 494 + 79 + (-328) = -585 kJ per mol</text>
    <text x="720" y="362">green: endothermic steps up; red and blue: exothermic steps down</text>
  </g>
  <rect x="700" y="400" width="440" height="200" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="920" y="428">Definitions used</text>
  <g class="t">
    <text x="720" y="456">atomization: one mole of gaseous atoms from the element</text>
    <text x="720" y="474">(1/2 H2 to H, +218; H-H bond energy 436)</text>
    <text x="720" y="498">first ionization energy: Na(g) to Na+(g) + e-</text>
    <text x="720" y="522">first electron affinity: Cl(g) + e- to Cl-(g), -348.8 (exothermic)</text>
    <text x="720" y="546">lattice energy: one mole of ionic solid from its gaseous ions</text>
    <text x="720" y="570">formation: one mole of compound from elements in standard states</text>
  </g>
  <text class="s" x="600" y="640">All at standard conditions, 25 degrees C (298 K) and 1 atm; values as printed in Figure 6.9 and the sample problems.</text>
</svg>
