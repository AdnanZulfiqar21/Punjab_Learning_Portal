<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original mechanism after the book: nitric and sulphuric acids form the nitronium ion NO2+, which attacks benzene to give a sigma complex that loses H+ to give nitrobenzene; H+ and HSO4- re-form sulphuric acid. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Nitration of benzene</text>
  <rect x="15.0" y="55.0" width="870.0" height="105.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1 forming the electrophile, the nitronium ion</text>
  <text x="450.0" y="125.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HNO</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1"> + H</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">SO</tspan><tspan dy="6.1" font-size="13.3">4</tspan><tspan dy="-6.1"> -&gt; NO</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-14.1" font-size="13.3">+</tspan><tspan dy="8.0"> + HSO</tspan><tspan dy="6.1" font-size="13.3">4</tspan><tspan dy="-14.1" font-size="13.3">-</tspan><tspan dy="8.0"> + H</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">O</tspan></text>
  <rect x="15.0" y="170.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="200.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">2 attack and 3 loss of a proton</text>
  <path d="M100.0 238.0 L127.7 254.0 L127.7 286.0 L100.0 302.0 L72.3 286.0 L72.3 254.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="270.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="160.0" y="220.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-11.8" font-size="11.2">+</tspan></text>
  <path d="M110.0 248.0 Q130.0 212.0 152.0 224.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M152.0 224.0 L142.0 223.4 L146.1 215.9 Z" fill="#d7322f"/>
  <line x1="190.0" y1="270.0" x2="241.2" y2="270.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250.0 270.0 L240.0 274.6 L240.0 265.4 Z" fill="#14181f"/>
  <path d="M335.0 246.0 L362.7 262.0 L362.7 294.0 L335.0 310.0 L307.3 294.0 L307.3 262.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M349.2 266.1 A18.56 18.56 0 1 1 320.8 266.1" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="335.0" y="284.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="335.0" y1="246.0" x2="322.7" y2="226.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="316.1" y="220.8" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="335.0" y1="246.0" x2="347.3" y2="226.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="353.9" y="220.8" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <line x1="410.0" y1="270.0" x2="471.2" y2="270.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M480.0 270.0 L470.0 274.6 L470.0 265.4 Z" fill="#14181f"/>
  <text x="445.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">- H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <path d="M560.0 246.0 L587.7 262.0 L587.7 294.0 L560.0 310.0 L532.3 294.0 L532.3 262.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="560.0" cy="278.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="560.0" y1="246.0" x2="560.0" y2="228.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="560.0" y="220.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="560.0" y="334.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">nitrobenzene</text>
  <text x="760.0" y="276.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3"> + HSO</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-11.1" font-size="10.5">-</tspan><tspan dy="6.3"> -&gt; H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">SO</tspan><tspan dy="4.8" font-size="10.5">4</tspan></text>
  <text x="760.0" y="302.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">sulphuric acid regenerated</text>
  <rect x="15.0" y="355.0" width="870.0" height="80.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="390.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">overall: C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1"> + HNO</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1"> -&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">NO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O (conc. H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">SO</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">, below about 50 C)</tspan></text>
  <text x="450.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">at higher temperatures a second NO2 group enters, giving 1,3-dinitrobenzene</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
