<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="615" fill="#ffffff"/>
  <!-- Answer figure (original): Rh-positive man Dd x Rh-negative woman dd, Punnett square. -->
  <text x="225" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Man: Rh-positive (Dd)</text>
  <text x="450" y="54" font-size="34" text-anchor="middle" font-weight="700" fill="#14181f">&#215;</text>
  <text x="675" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Woman: Rh-negative (dd)</text>
  <text x="560" y="118" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563">Gametes of woman</text>
  <text x="232" y="335" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563" transform="rotate(-90 232 335)">Gametes of man</text>
  <circle cx="445.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">d</text>
  <circle cx="675.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">d</text>
  <circle cx="290" cy="275.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="284.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">D</text>
  <circle cx="290" cy="395.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="404.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">d</text>
  <rect x="330" y="215" width="230" height="120" fill="#fde2e1" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">Dd</text>
  <text x="445.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Rh-positive</text>
  <rect x="560" y="215" width="230" height="120" fill="#fde2e1" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">Dd</text>
  <text x="675.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Rh-positive</text>
  <rect x="330" y="335" width="230" height="120" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">dd</text>
  <text x="445.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Rh-negative</text>
  <rect x="560" y="335" width="230" height="120" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">dd</text>
  <text x="675.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Rh-negative</text>
  <text x="450.0" y="515" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Dd (Rh-positive) = 1/2: such a baby is at risk</text>
  <text x="450.0" y="555" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">dd (Rh-negative) = 1/2: not at risk</text>
</svg>
