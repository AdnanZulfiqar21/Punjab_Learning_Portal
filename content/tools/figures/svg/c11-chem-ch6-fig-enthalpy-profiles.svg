<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 6.1 and 6.2: enthalpy diagrams and energy profiles of exothermic and endothermic reactions with the activation energy. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Energy profile diagrams: enthalpy change and activation energy</text>
  <!-- exothermic -->
  <text class="k" x="320" y="70">(a) Exothermic: products lower, delta H negative</text>
  <path d="M80 440 V90 M80 440 H560" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="40" y="265" transform="rotate(-90 40 265)" text-anchor="middle">enthalpy</text>
  <text class="s" x="320" y="462">progress of reaction</text>
  <path d="M110 220 H200 Q280 120 330 150 Q380 180 420 360 H520" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M110 220 H200" stroke="#14181f" stroke-width="3"/><path d="M420 360 H520" stroke="#14181f" stroke-width="3"/>
  <text class="t" x="110" y="210">reactants, HR</text><text class="t" x="430" y="385">products, HP</text>
  <path d="M200 220 V140" stroke="#1f6fb5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ab)"/><text class="t" x="206" y="175" style="fill:#1f6fb5">Ea</text>
  <path d="M470 220 V355" stroke="#d7322f" stroke-width="2" marker-end="url(#ar)"/><path d="M110 220 H470" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><text class="t" x="478" y="295" style="fill:#d7322f">delta H negative</text>
  <text class="s" x="320" y="490">heat flows out to the surroundings: C + O2 gives CO2, delta H = -393.7 kJ per mol</text>
  <!-- endothermic -->
  <text class="k" x="900" y="70">(b) Endothermic: products higher, delta H positive</text>
  <path d="M660 440 V90 M660 440 H1140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="620" y="265" transform="rotate(-90 620 265)" text-anchor="middle">enthalpy</text>
  <text class="s" x="900" y="462">progress of reaction</text>
  <path d="M690 360 H780 Q860 110 910 140 Q960 170 1000 220 H1100" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M690 360 H780" stroke="#14181f" stroke-width="3"/><path d="M1000 220 H1100" stroke="#14181f" stroke-width="3"/>
  <text class="t" x="690" y="385">reactants, HR</text><text class="t" x="1010" y="210">products, HP</text>
  <path d="M780 360 V132" stroke="#1f6fb5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ab)"/><text class="t" x="786" y="250" style="fill:#1f6fb5">Ea (larger)</text>
  <path d="M1050 360 V226" stroke="#d7322f" stroke-width="2" marker-end="url(#ar)"/><path d="M690 360 H1050" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><text class="t" x="1058" y="300" style="fill:#d7322f">delta H positive</text>
  <text class="s" x="900" y="490">heat is absorbed from the surroundings: NH4Cl dissolving, delta H = +16.2 kJ per mol (cold packs)</text>
  <rect x="80" y="515" width="1040" height="65" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="540">Enthalpy H is the heat content from structure and physical state; delta H = HP - HR. Bonds in the reactants must break before new bonds form,</text>
  <text class="s" x="600" y="562">so colliding molecules need at least the activation energy Ea to cross the barrier; the hump's height is Ea, the level difference is delta H.</text>
</svg>
