<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.1 to 3.5 and topic 3.1: the radian, angular displacement, velocity and acceleration, v = r omega, and the angular equations of motion. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Angular measurements: radian, angular displacement, velocity and acceleration</text>
  <!-- radian -->
  <rect x="50" y="55" width="340" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="220" y="83">One radian (Figs. 3.1, 3.3)</text>
  <circle cx="200" cy="215" r="95" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M200 215 L295 215" stroke="#4b5563" stroke-width="2"/>
  <path d="M200 215 L251 135" stroke="#4b5563" stroke-width="2"/>
  <path d="M295 215 A 95 95 0 0 0 251 135" fill="none" stroke="#d7322f" stroke-width="4"/>
  <path d="M230 215 A 30 30 0 0 0 216 190" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="226" y="200">theta</text>
  <text class="l" x="188" y="230">O</text>
  <text class="l" x="300" y="230">A</text>
  <text class="l" x="252" y="128">B</text>
  <text class="l" x="245" y="238">r</text>
  <text class="l" x="290" y="170" style="fill:#d7322f">S = r</text>
  <g class="t">
    <text x="70" y="326">arc AB equal to the radius r subtends 1 rad at O; theta = S/r,</text>
    <text x="70" y="342">S = r theta (3.1); 1 rev = 2 pi rad = 360 degrees; 1 rad = 57.3 degrees</text>
  </g>
  <!-- displacement -->
  <rect x="410" y="55" width="380" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Angular displacement (Fig. 3.2)</text>
  <circle cx="560" cy="215" r="95" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M440 215 H690" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M560 330 V100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M560 215 L642 167" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M560 215 L595 127" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M600 215 A 40 40 0 0 0 594 192" fill="none" stroke="#4b5563" stroke-width="1"/>
  <path d="M620 215 A 60 60 0 0 0 583 159" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
  <text class="l" x="604" y="205">theta</text>
  <text class="l" x="612" y="150" style="fill:#d7322f">delta theta</text>
  <text class="l" x="650" y="165" style="fill:#1f6fb5">P1 (at t)</text>
  <text class="l" x="598" y="120" style="fill:#d7322f">P2 (at t + delta t)</text>
  <text class="l" x="690" y="232">x</text>
  <text class="l" x="566" y="110">y</text>
  <text class="l" x="548" y="230">O</text>
  <g class="t">
    <text x="430" y="326">rod OP pivoted at O turns in the plane; the z-axis is the axis of</text>
    <text x="430" y="342">rotation; delta theta positive counter-clockwise; right-hand rule</text>
  </g>
  <!-- v = r omega -->
  <rect x="810" y="55" width="340" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Linear and angular (Fig. 3.5)</text>
  <ellipse cx="980" cy="230" rx="110" ry="40" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M980 300 V110" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/>
  <text class="l" x="990" y="118" style="fill:#1f6fb5">omega (along z)</text>
  <path d="M980 230 L1070 250" stroke="#4b5563" stroke-width="2"/>
  <circle cx="1070" cy="250" r="5" fill="#d7322f"/>
  <path d="M1070 250 L1050 275" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="1020" y="232">r</text>
  <text class="l" x="1076" y="246">P</text>
  <text class="l" x="1030" y="292" style="fill:#d7322f">v (tangent)</text>
  <g class="f">
    <text x="830" y="322">delta S = r delta theta  ->  v = r omega (3.7)</text>
    <text x="830" y="342">a_t = r alpha (3.8)</text>
  </g>
  <!-- bottom -->
  <rect x="50" y="375" width="1100" height="280" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Definitions and the angular equations of motion</text>
  <g class="f">
    <text x="70" y="430">omega_av = delta theta / delta t  (3.2)</text><text x="520" y="430">omega = lim (delta theta / delta t), delta t -&gt; 0  (3.3)</text><text x="1000" y="430">rad s^-1, rpm</text>
    <text x="70" y="452">alpha_av = (omega_f - omega_i)/(t_f - t_i) = delta omega / delta t  (3.4)</text><text x="640" y="452">alpha = lim (delta omega / delta t)  (3.5)</text><text x="1000" y="452">rad s^-2</text>
  </g>
  <g class="t b"><text x="70" y="486">linear</text><text x="330" y="486">angular</text><text x="620" y="486">equation</text></g>
  <path d="M70 492 H1130" stroke="#9ca3af" stroke-width="1"/>
  <g class="f">
    <text x="70" y="512">vf = vi + a t</text><text x="330" y="512">omega_f = omega_i + alpha t</text><text x="620" y="512">(3.9)</text>
    <text x="70" y="534">2 a S = vf^2 - vi^2</text><text x="330" y="534">2 alpha theta = omega_f^2 - omega_i^2</text><text x="620" y="534">(3.10)</text>
    <text x="70" y="556">S = vi t + (1/2) a t^2</text><text x="330" y="556">theta = omega_i t + (1/2) alpha t^2</text><text x="620" y="556">(3.11)</text>
  </g>
  <g class="t">
    <text x="700" y="512">valid only when the axis of rotation is fixed, so the angular</text>
    <text x="700" y="528">vectors all point one way and can be handled as scalars</text>
    <text x="700" y="556"><tspan class="b">Example 3.1:</tspan> fan at 3 rev s^-1 stops in 18.0 s:</text>
    <text x="700" y="572">alpha = (0 - 3.0)/18.0 = -0.167 rev s^-2;</text>
    <text x="700" y="588">theta = 3.0 x 18.0 + (1/2)(-0.167)(18.0)^2 = 27 rev</text>
    <text x="70" y="590">points at different distances from the axis have different speeds and accelerations (v = r omega, a_t = r alpha),</text>
    <text x="70" y="606">but every point of a rigid body has the same angular displacement, angular speed and angular acceleration;</text>
    <text x="70" y="622">the velocity of P is always along the tangent (tangential velocity); a wheel turning through theta lays out S = r theta</text>
    <text x="70" y="644">rigid body: the reference line OP (perpendicular from a point P to the axis) rotates with the body's omega and alpha (Fig. 3.4)</text>
  </g>
  <text class="s" x="600" y="672" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
