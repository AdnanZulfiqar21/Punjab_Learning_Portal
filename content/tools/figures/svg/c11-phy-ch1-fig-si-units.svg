<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Tables 1.1 to 1.3 and topics 1.1 and 1.2: base and derived SI units, prefixes, scientific notation and the writing conventions. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="600" y="32">The International System of Units (SI): base units, derived units, prefixes and conventions</text>
  <!-- base units -->
  <rect x="50" y="55" width="300" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="200" y="83">Seven base units (Table 1.1)</text>
  <g class="t b"><text x="70" y="108">quantity</text><text x="200" y="108">unit</text><text x="285" y="108">symbol</text></g>
  <path d="M70 114 H330" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="70" y="136">length</text><text x="200" y="136">metre</text><text x="285" y="136">m</text>
    <text x="70" y="160">mass</text><text x="200" y="160">kilogram</text><text x="285" y="160">kg</text>
    <text x="70" y="184">time</text><text x="200" y="184">second</text><text x="285" y="184">s</text>
    <text x="70" y="208">electric current</text><text x="200" y="208">ampere</text><text x="285" y="208">A</text>
    <text x="70" y="232">temperature</text><text x="200" y="232">kelvin</text><text x="285" y="232">K</text>
    <text x="70" y="256">luminous intensity</text><text x="200" y="256">candela</text><text x="285" y="256">cd</text>
    <text x="70" y="280">amount of substance</text><text x="200" y="280">mole</text><text x="285" y="280">mol</text>
  </g>
  <text class="r" x="70" y="310">base quantities: not defined via other quantities (1.1)</text>
  <!-- derived units -->
  <rect x="370" y="55" width="460" height="270" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Derived units (Table 1.2)</text>
  <g class="t b"><text x="390" y="108">quantity</text><text x="500" y="108">unit</text><text x="580" y="108">symbol</text><text x="640" y="108">in base units</text></g>
  <path d="M390 114 H810" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="390" y="136">plane angle</text><text x="500" y="136">radian</text><text x="580" y="136">rad</text><text x="640" y="136">dimensionless</text>
    <text x="390" y="160">solid angle</text><text x="500" y="160">steradian</text><text x="580" y="160">sr</text><text x="640" y="160">dimensionless</text>
    <text x="390" y="184">force</text><text x="500" y="184">newton</text><text x="580" y="184">N</text><text x="640" y="184">kg m s^-2</text>
    <text x="390" y="208">work</text><text x="500" y="208">joule</text><text x="580" y="208">J</text><text x="640" y="208">N m = kg m^2 s^-2</text>
    <text x="390" y="232">power</text><text x="500" y="232">watt</text><text x="580" y="232">W</text><text x="640" y="232">J s^-1 = kg m^2 s^-3</text>
    <text x="390" y="256">electric charge</text><text x="500" y="256">coulomb</text><text x="580" y="256">C</text><text x="640" y="256">A s</text>
    <text x="390" y="280">pressure</text><text x="500" y="280">pascal</text><text x="580" y="280">Pa</text><text x="640" y="280">N m^-2 = kg m^-1 s^-2</text>
  </g>
  <text class="r" x="390" y="310">derived units depend on the base units; rad and sr counted as derived since 1995</text>
  <!-- prefixes -->
  <rect x="850" y="55" width="300" height="270" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="1000" y="83">Prefixes (Table 1.3)</text>
  <g class="f">
    <text x="868" y="110">atto  a  10^-18</text><text x="1018" y="110">deca  da 10^1</text>
    <text x="868" y="130">femto f  10^-15</text><text x="1018" y="130">hecto h  10^2</text>
    <text x="868" y="150">pico  p  10^-12</text><text x="1018" y="150">kilo  k  10^3</text>
    <text x="868" y="170">nano  n  10^-9</text><text x="1018" y="170">mega  M  10^6</text>
    <text x="868" y="190">micro u  10^-6</text><text x="1018" y="190">giga  G  10^9</text>
    <text x="868" y="210">milli m  10^-3</text><text x="1018" y="210">tera  T  10^12</text>
    <text x="868" y="230">centi c  10^-2</text><text x="1018" y="230">peta  P  10^15</text>
    <text x="868" y="250">deci  d  10^-1</text><text x="1018" y="250">exa   E  10^18</text>
  </g>
  <text class="r" x="868" y="282">steps of 1000, plus centi, deci, deca and hecto</text>
  <text class="r" x="868" y="298">from earlier usage; u stands for the Greek mu</text>
  <text class="r" x="868" y="314">134.7 = 1.347 x 10^2; 0.0023 = 2.3 x 10^-3</text>
  <!-- conventions -->
  <rect x="50" y="345" width="1100" height="330" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="373">Conventions for using SI units (the sixteen rules, condensed)</text>
  <g class="t">
    <text x="70" y="400"><tspan class="b">1</tspan> one symbol per unit, the same in every language: A not amp, s not sec, SI not S.I.</text>
    <text x="70" y="420"><tspan class="b">2</tspan> unit names start in lower case (newton, metre), except Celsius</text>
    <text x="70" y="440"><tspan class="b">3</tspan> symbols in lower case (m, s), except L for litre</text>
    <text x="70" y="460"><tspan class="b">4</tspan> symbols named after scientists start with a capital: N, Pa, W</text>
    <text x="70" y="480"><tspan class="b">5</tspan> symbols and prefixes in upright (roman) type: a distance of 50 m</text>
    <text x="70" y="500"><tspan class="b">6</tspan> no plurals: 1 mm, 100 mm, 1 kg, 60 kg</text>
    <text x="70" y="520"><tspan class="b">7</tspan> no full stop after a symbol, except at the end of a sentence</text>
    <text x="70" y="540"><tspan class="b">8</tspan> prefix joined to the unit without a space: mL not m L, ms not m s</text>
    <text x="70" y="560"><tspan class="b">9</tspan> base units one space apart, and a space between number and symbol: 1 kg, 10 m s^-1</text>
    <text x="620" y="400"><tspan class="b">10</tspan> no compound prefixes: 1 uuF should be 1 pF</text>
    <text x="620" y="420"><tspan class="b">11</tspan> a power applies to the whole multiple: 1 km^2 = (10^3 m)^2 = 1 x 10^6 m^2</text>
    <text x="620" y="440"><tspan class="b">12</tspan> negative index (m s^-1) instead of the solidus (m/s)</text>
    <text x="620" y="460"><tspan class="b">13</tspan> scientific notation, one non-zero digit left of the decimal: 143.7 = 1.437 x 10^2</text>
    <text x="620" y="480"><tspan class="b">14</tspan> do not mix symbols and names: metre per second or m s^-1, not metre/sec</text>
    <text x="620" y="500"><tspan class="b">15</tspan> record practical work in the instrument's convenient unit (screw gauge in mm),</text>
    <text x="620" y="520">but give final results in the appropriate base units</text>
    <text x="620" y="540"><tspan class="b">16</tspan> no former CGS units: dyne, erg, gauss, poise, torr</text>
    <text x="70" y="590"><tspan class="b">also accepted with SI:</tspan> degree, arcminute, arcsecond; minute, hour, day, year; bel and decibel; litre and tonne;</text>
    <text x="70" y="608">atomic mass unit (u) and electron volt (eV); nautical mile and knot; acre and hectare; bar (millibar, kilobar); angstrom and barn</text>
    <text x="70" y="640"><tspan class="b">measuring a base quantity (1.1):</tspan> first choose a standard, then a procedure for comparing the quantity with the standard,</text>
    <text x="70" y="658">so that a number and a unit are obtained; the SI was agreed by an international committee in 1960</text>
  </g>
  <text class="s" x="600" y="692" style="font-size:11px">Original diagram for this lesson; the textbook's tables are redrawn from their content, its pictures are not reproduced.</text>
</svg>
