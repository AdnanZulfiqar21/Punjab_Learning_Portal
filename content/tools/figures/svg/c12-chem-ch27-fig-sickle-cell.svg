<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <!-- Box beside 27.2.1 (sickle cell anemia): a normal red blood cell (biconcave disc) and a sickle cell (crescent). Original drawing after the printed picture. -->
  <defs>
    <radialGradient id="rbc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f08a8c"/>
      <stop offset="45%" stop-color="#e6474b"/>
      <stop offset="100%" stop-color="#c81d23"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="245" r="165" fill="url(#rbc)" stroke="#7a0d0d" stroke-width="3"/>
  <circle cx="300" cy="245" r="78" fill="none" stroke="#a8161b" stroke-width="3" stroke-dasharray="2 0" opacity="0.55"/>
  <path d="M218 150 A120 120 0 0 1 335 128" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M690 60 Q915 245 690 430 Q805 245 690 60 Z" fill="#d6262b" stroke="#7a0d0d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M718 120 Q835 245 724 368" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>
  <text x="300" y="480" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan x="300" dy="0">Normal Red</tspan><tspan x="300" dy="36">Blood Cell</tspan></text>
  <text x="760" y="480" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">Sickle Cell</tspan></text>
</svg>
