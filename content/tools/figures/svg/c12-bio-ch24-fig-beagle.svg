<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="575" fill="#ffffff"/>
  <!-- Original schematic after Figure 24.1: the main stops of HMS Beagle in order, from Plymouth in 1831 through Cape Verde, Brazil, Argentina, Tierra del Fuego, Chile, the Galapagos Islands in 1835, Tahiti, New Zealand, Australia and South Africa back to England in 1836. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The voyage of HMS Beagle, 1831-1836 (schematic route)</text>
  <path d="M120 110 L150 210 L230 310 L270 390 L330 460 L430 400 L470 290 L590 330 L700 430 L790 370 L690 210 L560 110" stroke="#1f6fb5" stroke-width="2.5" fill="none" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="120.0" cy="110.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="134.0" y="108.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">England (Plymouth)</text>
  <text x="134.0" y="125.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">Dec 1831</text>
  <circle cx="150.0" cy="210.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="164.0" y="208.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Cape Verde Islands</text>
  <circle cx="230.0" cy="310.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="244.0" y="308.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Brazil (Bahia, Rio)</text>
  <text x="244.0" y="325.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">1832</text>
  <circle cx="270.0" cy="390.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="284.0" y="388.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Argentina, Uruguay</text>
  <circle cx="330.0" cy="460.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="344.0" y="458.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Tierra del Fuego</text>
  <text x="344.0" y="475.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">1833</text>
  <circle cx="430.0" cy="400.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="444.0" y="398.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Chile (Valparaiso)</text>
  <text x="444.0" y="415.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">1834</text>
  <circle cx="470.0" cy="290.0" r="11.0" stroke="#d7322f" stroke-width="2.5" fill="#fecaca"/>
  <text x="484.0" y="288.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">Galapagos Islands</text>
  <text x="484.0" y="305.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">Sep 1835</text>
  <circle cx="590.0" cy="330.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="604.0" y="328.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Tahiti</text>
  <circle cx="700.0" cy="430.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="686.0" y="428.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">New Zealand</text>
  <circle cx="790.0" cy="370.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="776.0" y="368.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">Australia (Sydney)</text>
  <text x="776.0" y="385.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="700">1836</text>
  <circle cx="690.0" cy="210.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="704.0" y="208.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">South Africa (Cape Town)</text>
  <circle cx="560.0" cy="110.0" r="8.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbeafe"/>
  <text x="574.0" y="108.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">England</text>
  <text x="574.0" y="125.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">Oct 1836</text>
  <rect x="40.0" y="495.0" width="820.0" height="50.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="517.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">a five-year voyage round the world; the Galapagos Islands (red) gave Darwin his key observations</text>
  <text x="450.0" y="535.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">schematic order of the main stops, not drawn to geographic scale</text>
  <text x="450.0" y="566" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
