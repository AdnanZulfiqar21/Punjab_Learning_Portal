<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: AI, IoT, cloud computing and blockchain around a shared centre. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Four emerging technologies working together (after Fig 8.1)</text>
  <circle cx="450.0" cy="230.0" r="75.0" stroke="#14181f" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="222.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">smarter</text>
  <text x="450.0" y="242.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">systems</text>
  <rect x="55.0" y="85.0" width="270.0" height="70.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="190.0" y="118.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Artificial Intelligence</text>
  <text x="190.0" y="134.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">learns from data; decides</text>
  <line x1="325.0" y1="120.0" x2="388.0" y2="195.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="575.0" y="85.0" width="270.0" height="70.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="710.0" y="118.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Internet of Things</text>
  <text x="710.0" y="134.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">devices sense and act</text>
  <line x1="575.0" y1="120.0" x2="512.0" y2="195.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="55.0" y="305.0" width="270.0" height="70.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="190.0" y="338.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Cloud Computing</text>
  <text x="190.0" y="354.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">storage and computing online</text>
  <line x1="325.0" y1="340.0" x2="388.0" y2="265.0" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="575.0" y="305.0" width="270.0" height="70.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="710.0" y="338.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Blockchain</text>
  <text x="710.0" y="354.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">shared, tamper-proof records</text>
  <line x1="575.0" y1="340.0" x2="512.0" y2="265.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="450.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Used across healthcare, education, transport and agriculture; they also raise security and ethical questions.</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
