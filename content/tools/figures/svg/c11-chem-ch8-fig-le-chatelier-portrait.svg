<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" font-family="'Times New Roman', Times, serif">
  <!-- Vis8-1 (C11-CHEM, PDF p179): portrait of Henry-Louis Le Chatelier in the side box, with the printed name above and the dates below; flat drawing after the printed sepia photograph: head and shoulders turned slightly to the left, short brushed-up grey hair, round wire-rimmed spectacles with a cord, full moustache, high white collar, dark tie and dark jacket, on a soft cream vignette. No photograph is reproduced. -->
  <rect width="1000" height="1200" fill="#ffffff"/>
  <text x="500" y="80" text-anchor="middle" font-size="54" font-weight="bold" fill="#111111">Henry-Louis Le Chatelier</text>
  <ellipse cx="500" cy="600" rx="420" ry="460" fill="#f3e6d3"/>
  <clipPath id="oval"><ellipse cx="500" cy="600" rx="420" ry="460"/></clipPath>
  <g clip-path="url(#oval)">
    <!-- dark jacket -->
    <path d="M110 1100 C 130 960 230 900 370 870 L 500 960 L 630 870 C 770 900 870 960 890 1100 Z" fill="#3d2f27"/>
    <!-- high white collar and dark tie -->
    <path d="M380 820 L 620 820 L 640 900 L 500 960 L 360 900 Z" fill="#f6f2ea" stroke="#c9bba5" stroke-width="3"/>
    <path d="M470 900 L 530 900 L 548 970 L 500 1000 L 452 970 Z" fill="#2a211c"/>
    <!-- neck -->
    <path d="M410 760 L 590 760 L 600 830 L 400 830 Z" fill="#dbb898"/>
    <!-- ears -->
    <ellipse cx="318" cy="520" rx="26" ry="48" fill="#d6b292"/>
    <ellipse cx="682" cy="520" rx="26" ry="48" fill="#d6b292"/>
    <!-- face -->
    <path d="M325 420 C 325 320 400 270 500 270 C 600 270 675 320 675 420 L 675 580 C 675 690 600 780 500 780 C 400 780 325 690 325 580 Z" fill="#e6c6a7"/>
    <!-- short grey hair brushed up -->
    <path d="M320 440 C 300 330 360 220 470 205 C 520 190 600 205 650 260 C 690 300 690 380 680 440 C 660 380 640 340 600 320 C 540 300 460 300 400 320 C 360 340 336 390 320 440 Z" fill="#b8b2a8"/>
    <path d="M390 270 C 430 240 480 232 520 236 M440 300 C 480 280 540 278 590 296 M560 236 C 600 246 630 270 650 300" stroke="#a39c91" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M370 445 C 395 432 430 430 455 440 M545 440 C 570 430 605 432 630 445" stroke="#8b7b6a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="412" cy="482" rx="16" ry="8" fill="#5a4a3e"/>
    <ellipse cx="588" cy="482" rx="16" ry="8" fill="#5a4a3e"/>
    <!-- round wire spectacles with a cord -->
    <g fill="none" stroke="#4a3b30" stroke-width="5">
      <ellipse cx="412" cy="482" rx="50" ry="38"/>
      <ellipse cx="588" cy="482" rx="50" ry="38"/>
      <path d="M462 478 C 480 466 520 466 538 478"/>
      <path d="M362 476 L 325 470 M638 476 L 675 470"/>
    </g>
    <path d="M325 470 C 300 560 296 680 320 820" stroke="#4a3b30" stroke-width="3" fill="none"/>
    <!-- nose -->
    <path d="M500 480 L 486 590 C 494 602 512 602 522 592" stroke="#b98f6e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- full moustache -->
    <path d="M500 620 C 470 604 420 606 384 640 C 372 652 380 664 398 660 C 430 652 470 650 500 644 C 530 650 570 652 602 660 C 620 664 628 652 616 640 C 580 606 530 604 500 620 Z" fill="#9c8f80"/>
    <path d="M462 696 C 480 704 520 704 538 696" stroke="#a57b60" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="500" y="1160" text-anchor="middle" font-size="48" fill="#111111">(1850-1936)</text>
</svg>
