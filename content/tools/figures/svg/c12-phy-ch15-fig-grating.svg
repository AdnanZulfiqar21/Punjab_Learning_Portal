<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="530" fill="#ffffff"/>
  <!-- Original diagram after Figs 15.16 and 15.17: parallel light falls on many slits a distance d apart, each diffracted path longer than the next by d sin(theta); a laser through a grating gives sharp orders n = 0, +/-1, +/-2 on a screen, with d sin(theta) = n lambda. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A diffraction grating (after Figs 15.16 and 15.17)</text>
  <rect x="15.0" y="55.0" width="430.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">path difference between adjacent slits</text>
  <line x1="200.0" y1="120.0" x2="200.0" y2="455.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="45.0" y1="145.0" x2="189.6" y2="145.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M196.0 145.0 L188.7 148.4 L188.7 141.6 Z" fill="#d7322f"/>
  <line x1="200.0" y1="145.0" x2="380.0" y2="240.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="45.0" y1="200.0" x2="189.6" y2="200.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M196.0 200.0 L188.7 203.4 L188.7 196.6 Z" fill="#d7322f"/>
  <line x1="200.0" y1="200.0" x2="380.0" y2="295.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="45.0" y1="255.0" x2="189.6" y2="255.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M196.0 255.0 L188.7 258.4 L188.7 251.6 Z" fill="#d7322f"/>
  <line x1="200.0" y1="255.0" x2="380.0" y2="350.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="45.0" y1="310.0" x2="189.6" y2="310.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M196.0 310.0 L188.7 313.4 L188.7 306.6 Z" fill="#d7322f"/>
  <line x1="200.0" y1="310.0" x2="380.0" y2="405.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="45.0" y1="365.0" x2="189.6" y2="365.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M196.0 365.0 L188.7 368.4 L188.7 361.6 Z" fill="#d7322f"/>
  <line x1="200.0" y1="365.0" x2="380.0" y2="460.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="200.0" y1="200.0" x2="222.7" y2="157.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="200.0" y1="255.0" x2="222.7" y2="212.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="200.0" y1="310.0" x2="222.7" y2="267.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="200.0" y1="365.0" x2="222.7" y2="322.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="170.0" y1="149.8" x2="170.0" y2="195.2" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M170.0 200.0 L167.5 194.6 L172.5 194.6 Z" fill="#4b5563"/>
  <path d="M170.0 145.0 L172.5 150.4 L167.5 150.4 Z" fill="#4b5563"/>
  <text x="162.0" y="182.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">d</text>
  <text x="230.0" y="110.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">each path is longer by d sin(theta)</text>
  <rect x="455.0" y="55.0" width="430.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">orders on the screen</text>
  <rect x="475.0" y="250.0" width="50.0" height="22.0" rx="3" stroke="#14181f" stroke-width="1.5" fill="#374151"/>
  <text x="500.0" y="292.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">laser</text>
  <line x1="525.0" y1="261.0" x2="590.0" y2="261.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="590.0" y1="200.0" x2="590.0" y2="320.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="590.0" y="345.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">grating</text>
  <line x1="840.0" y1="90.0" x2="840.0" y2="440.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="590.0" y1="261.0" x2="840.0" y2="120.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="840.0" cy="120.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#ef4444"/>
  <text x="855.0" y="125.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 2</text>
  <line x1="590.0" y1="261.0" x2="840.0" y2="190.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="840.0" cy="190.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#ef4444"/>
  <text x="855.0" y="195.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 1</text>
  <line x1="590.0" y1="261.0" x2="840.0" y2="261.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="840.0" cy="261.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#ef4444"/>
  <text x="855.0" y="266.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 0</text>
  <line x1="590.0" y1="261.0" x2="840.0" y2="332.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="840.0" cy="332.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#ef4444"/>
  <text x="855.0" y="337.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = -1</text>
  <line x1="590.0" y1="261.0" x2="840.0" y2="402.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="840.0" cy="402.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#ef4444"/>
  <text x="855.0" y="407.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = -2</text>
  <text x="450.0" y="500.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">d sin(theta) = n lambda    (n = 0, +/-1, +/-2, ...)</tspan></text>
  <text x="450.0" y="521" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
