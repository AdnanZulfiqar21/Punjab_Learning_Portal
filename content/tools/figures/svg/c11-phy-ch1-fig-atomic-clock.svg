<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif">
  <!-- For Your Information: Atomic Clock (C11-PHY, PDF p15): photograph of the long caesium atomic frequency standard: a row of dark instrument cabinets with grey frames and panels, a long tube on top, receding to the right in front of a red wall on a pale floor; flat drawing after the printed photograph. No photograph is reproduced. -->
  <rect width="1100" height="760" fill="#ffffff"/>
  <!-- red wall and pale floor -->
  <rect x="0" y="0" width="1100" height="300" fill="#c8402e"/>
  <polygon points="0,300 1100,140 1100,760 0,760" fill="#e6e3dc"/>
  <polygon points="0,300 1100,140 1100,180 0,330" fill="#b8b4ab"/>
  <!-- long tube along the top, receding to the right -->
  <polygon points="40,110 1100,40 1100,90 40,230" fill="#3b4250" stroke="#1d222b" stroke-width="4"/>
  <polygon points="40,110 1100,40 1100,56 40,140" fill="#8c95a6"/>
  <!-- receding cabinets with grey frames -->
  <g stroke="#1b1d22" stroke-width="4">
    <polygon points="300,230 1100,120 1100,420 300,600" fill="#2b2e35"/>
    <!-- frame sections -->
    <polygon points="330,250 470,231 470,560 330,590" fill="#3a3e47"/>
    <polygon points="490,228 620,210 620,520 490,552" fill="#3a3e47"/>
    <polygon points="640,207 760,190 760,488 640,515" fill="#3a3e47"/>
    <polygon points="780,187 890,172 890,458 780,483" fill="#3a3e47"/>
    <polygon points="905,170 1000,157 1000,436 905,455" fill="#3a3e47"/>
  </g>
  <!-- panels with dials -->
  <g stroke="#555b66" stroke-width="3">
    <rect x="350" y="300" width="100" height="70" fill="#d7dbe0" transform="skewY(-7.5)"/>
    <rect x="505" y="330" width="95" height="60" fill="#c9ced6" transform="skewY(-7.5)"/>
    <rect x="655" y="360" width="90" height="56" fill="#e4e7ea" transform="skewY(-7.5)"/>
  </g>
  <g fill="#1f2228"><circle cx="400" cy="345" r="10"/><circle cx="550" cy="368" r="9"/><circle cx="700" cy="392" r="8"/></g>
  <!-- frame legs -->
  <g stroke="#9aa0aa" stroke-width="10" stroke-linecap="square">
    <line x1="330" y1="590" x2="330" y2="660"/><line x1="470" y1="560" x2="470" y2="625"/><line x1="620" y1="520" x2="620" y2="580"/><line x1="760" y1="488" x2="760" y2="540"/><line x1="890" y1="458" x2="890" y2="505"/><line x1="1000" y1="436" x2="1000" y2="478"/>
  </g>
  <!-- front control unit at the left -->
  <polygon points="0,150 300,170 300,690 0,720" fill="#24272e" stroke="#111318" stroke-width="5"/>
  <polygon points="0,150 300,170 300,230 0,215" fill="#4a505c"/>
  <g fill="#e2e5e8" stroke="#6a707a" stroke-width="3">
    <rect x="40" y="270" width="70" height="40"/><rect x="130" y="275" width="70" height="40"/>
    <rect x="40" y="360" width="160" height="60"/>
    <rect x="40" y="470" width="80" height="50"/><rect x="140" y="470" width="80" height="50"/>
  </g>
  <g fill="#1d2026"><circle cx="230" cy="290" r="14"/><circle cx="240" cy="390" r="14"/><circle cx="250" cy="560" r="14"/></g>
  <rect x="40" y="560" width="180" height="40" fill="#9b6a2c" stroke="#5c3d14" stroke-width="3"/>
  <rect x="20" y="620" width="260" height="20" fill="#3a3e47"/>
</svg>
