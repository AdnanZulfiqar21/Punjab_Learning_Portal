<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis3-8 (C11-PHY, PDF p64): photograph "Astronaut floating inside the cabin of a spaceship." (no printed caption number); flat drawing after the printed photograph: inside a pale blue-white spaceship cabin with panels, handrails and two long ceiling lights, an astronaut in a white suit with red trim floats diagonally, arms spread, nobody touching the floor. No photograph is reproduced. -->
  <defs>
    <clipPath id="frame"><rect x="20" y="20" width="1160" height="720"/></clipPath>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="1160" height="720" fill="#bfe0ea"/>
    <!-- cabin walls in perspective -->
    <path d="M20 20 L330 170 L330 600 L20 740 Z" fill="#8fbccb"/>
    <path d="M1180 20 L880 170 L880 600 L1180 740 Z" fill="#a9d2de"/>
    <path d="M20 20 L1180 20 L880 170 L330 170 Z" fill="#d6edf3"/>
    <path d="M20 740 L1180 740 L880 600 L330 600 Z" fill="#7aa9b9"/>
    <rect x="330" y="170" width="550" height="430" fill="#cfe9f1" stroke="#9cc6d3" stroke-width="3"/>
    <!-- wall panels and equipment -->
    <g fill="#e9f5f8" stroke="#8dbac8" stroke-width="3">
      <rect x="370" y="210" width="140" height="110" rx="6"/><rect x="540" y="210" width="140" height="110" rx="6"/><rect x="710" y="210" width="130" height="110" rx="6"/>
      <rect x="370" y="460" width="200" height="110" rx="6"/><rect x="600" y="460" width="240" height="110" rx="6"/>
    </g>
    <g fill="#2f4f5c"><rect x="60" y="200" width="200" height="40" rx="6"/><rect x="60" y="300" width="160" height="30" rx="6"/><rect x="70" y="560" width="190" height="50" rx="8"/></g>
    <g fill="#c74a3a"><rect x="70" y="250" width="70" height="26" rx="5"/><rect x="60" y="430" width="40" height="80" rx="6"/></g>
    <g stroke="#5f8d9c" stroke-width="10" fill="none" stroke-linecap="round"><path d="M80 380 L260 340"/><path d="M940 300 L1120 340"/></g>
    <!-- long ceiling lights on the right -->
    <path d="M920 90 L1040 50" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    <path d="M960 420 L1120 520" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <!-- floating astronaut, diagonal, arms spread -->
    <g transform="translate(610 380) rotate(-35)" stroke="#9aa2ab" stroke-width="4" stroke-linejoin="round">
      <rect x="-70" y="-100" width="140" height="170" rx="30" fill="#dde2e7"/>
      <rect x="-60" y="-110" width="120" height="190" rx="36" fill="#f5f6f8"/>
      <path d="M-55 -90 L-55 70 M55 -90 L55 70" stroke="#c73a3a" stroke-width="7"/>
      <circle cx="0" cy="-150" r="52" fill="#f5f6f8"/>
      <ellipse cx="0" cy="-146" rx="34" ry="30" fill="#2a2f36" stroke="#1a1d22"/>
      <ellipse cx="-10" cy="-156" rx="9" ry="7" fill="#7a8794" stroke="none"/>
      <path d="M-60 -80 Q-150 -120 -200 -180" stroke="#8e98a3" stroke-width="52" stroke-linecap="round" fill="none"/>
      <path d="M-60 -80 Q-150 -120 -200 -180" stroke="#f5f6f8" stroke-width="44" stroke-linecap="round" fill="none"/>
      <path d="M-60 -80 Q-150 -120 -200 -180" stroke="#c73a3a" stroke-width="5" fill="none" stroke-dasharray="0 70 10 400"/>
      <circle cx="-205" cy="-188" r="22" fill="#e3e6ea"/>
      <path d="M60 -80 Q150 -60 210 0" stroke="#8e98a3" stroke-width="52" stroke-linecap="round" fill="none"/>
      <path d="M60 -80 Q150 -60 210 0" stroke="#f5f6f8" stroke-width="44" stroke-linecap="round" fill="none"/>
      <circle cx="215" cy="8" r="22" fill="#e3e6ea"/>
      <path d="M-30 80 L-50 250" stroke="#8e98a3" stroke-width="60" stroke-linecap="round" fill="none"/>
      <path d="M-30 80 L-50 250" stroke="#f5f6f8" stroke-width="52" stroke-linecap="round" fill="none"/>
      <path d="M30 80 L70 245" stroke="#8e98a3" stroke-width="60" stroke-linecap="round" fill="none"/>
      <path d="M30 80 L70 245" stroke="#f5f6f8" stroke-width="52" stroke-linecap="round" fill="none"/>
      <path d="M-34 160 L-46 170 M36 160 L50 168" stroke="#c73a3a" stroke-width="6"/>
      <ellipse cx="-52" cy="282" rx="30" ry="20" fill="#e3e6ea"/>
      <ellipse cx="74" cy="278" rx="30" ry="20" fill="#e3e6ea"/>
    </g>
  </g>
  <rect x="20" y="20" width="1160" height="720" fill="none" stroke="#9aa3ad" stroke-width="2"/>
</svg>
