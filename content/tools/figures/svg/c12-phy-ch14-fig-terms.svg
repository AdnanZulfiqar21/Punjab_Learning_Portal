<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.1: a simple pendulum swinging between extreme positions A and B through the mean position O, with the amplitude marked, and definitions of displacement, amplitude, time period, frequency and angular frequency. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Terms used for oscillation (after Fig 14.1)</text>
  <rect x="15.0" y="55.0" width="530.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="280.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a simple pendulum</text>
  <line x1="200.0" y1="95.0" x2="360.0" y2="95.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="280.0" y1="95.0" x2="193.8" y2="308.3" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="193.8" cy="308.3" r="14.0" stroke="#7c3aed" stroke-width="2" fill="#e9d5ff"/>
  <line x1="280.0" y1="95.0" x2="280.0" y2="325.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="280.0" cy="325.0" r="14.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="280.0" y1="95.0" x2="366.2" y2="308.3" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="366.2" cy="308.3" r="14.0" stroke="#7c3aed" stroke-width="2" fill="#e9d5ff"/>
  <path d="M193.8 330.3 Q280 359 366.2 330.3" stroke="#d98b2b" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="173.8" y="313.3" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">A</text>
  <text x="280.0" y="365.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O (mean position)</text>
  <text x="386.2" y="313.3" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">B</text>
  <line x1="286.4" y1="395.0" x2="359.8" y2="395.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M366.2 395.0 L358.9 398.4 L358.9 391.6 Z" fill="#d7322f"/>
  <path d="M280.0 395.0 L287.3 391.6 L287.3 398.4 Z" fill="#d7322f"/>
  <text x="323.1" y="418.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">amplitude x</tspan><tspan dy="4.5" font-size="9.8">o</tspan><tspan dy="-4.5"> = OB</tspan></text>
  <text x="40.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">one vibration:</text>
  <text x="40.0" y="158.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">A -&gt; B -&gt; A</text>
  <rect x="560.0" y="55.0" width="325.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="722.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">definitions</text>
  <text x="578.0" y="110.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">displacement x</tspan></text>
  <text x="578.0" y="134.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">distance from O at any instant</text>
  <text x="578.0" y="174.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">amplitude x</tspan><tspan dy="4.8" font-size="10.5">o</tspan></text>
  <text x="578.0" y="198.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the largest displacement</text>
  <text x="578.0" y="238.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">time period T</tspan></text>
  <text x="578.0" y="262.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">time for one vibration, T = 1/f</text>
  <text x="578.0" y="302.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">frequency f</tspan></text>
  <text x="578.0" y="326.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">vibrations per second (Hz)</text>
  <text x="578.0" y="366.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700"><tspan dy="0.0">angular frequency w</tspan></text>
  <text x="578.0" y="390.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">w = 2 pi f = 2 pi / T (rad s^-1)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
