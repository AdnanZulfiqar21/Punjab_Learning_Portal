  <text x="730.0" y="173.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan><tspan dy="-5.5" font-size="8.8">D</tspan><tspan dy="5.5"> Y</tspan></text>
