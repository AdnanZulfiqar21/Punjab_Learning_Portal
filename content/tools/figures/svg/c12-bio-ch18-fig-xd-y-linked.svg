  <circle cx="176.2" cy="505.0" r="15.3" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="176.2" y="543.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X X</tspan></text>
  <line x1="283.8" y1="470.0" x2="283.8" y2="488.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="269.4" y="490.6" width="28.8" height="28.8" rx="0" stroke="#14181f" stroke-width="2" fill="#7c3aed"/>
  <text x="283.8" y="543.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X Y</tspan><tspan dy="-5.0" font-size="8.2">t</tspan></text>
  <line x1="391.2" y1="470.0" x2="391.2" y2="488.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="376.9" y="490.6" width="28.8" height="28.8" rx="0" stroke="#14181f" stroke-width="2" fill="#7c3aed"/>
  <text x="391.2" y="543.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X Y</tspan><tspan dy="-5.0" font-size="8.2">t</tspan></text>
  <text x="230.0" y="574.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">father to every son; never to daughters</text>
  <rect x="455.0" y="330.0" width="430.0" height="260.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="360.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">notes</text>
  <text x="475.0" y="400.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">X-linked dominant (book): vitamin D-resistant</text>
  <text x="475.0" y="422.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">rickets, Rett syndrome, Aicardi syndrome.</text>
  <text x="475.0" y="444.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">One D allele is enough in either sex.</text>
  <text x="475.0" y="466.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="475.0" y="488.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Y-linked (holandric) genes lie on the part of</text>
  <text x="475.0" y="510.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">the Y with no matching X region; the book's</text>
  <text x="475.0" y="532.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">examples: hypertrichosis of the ear rim,</text>
  <text x="475.0" y="554.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">'porcupine man', webbed toes.</text>
  <text x="450.0" y="616.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">filled = shows the trait;  t = allele on the Y chromosome only</text>
  <text x="450.0" y="641" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
