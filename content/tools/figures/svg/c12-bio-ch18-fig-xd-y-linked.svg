  <line x1="723.8" y1="195.0" x2="723.8" y2="213.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="709.4" y="215.6" width="28.8" height="28.8" rx="0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="723.8" y="268.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan><tspan dy="-5.0" font-size="8.2">d</tspan><tspan dy="5.0"> Y</tspan></text>
  <line x1="831.2" y1="195.0" x2="831.2" y2="213.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="816.9" y="215.6" width="28.8" height="28.8" rx="0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="831.2" y="268.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan><tspan dy="-5.0" font-size="8.2">d</tspan><tspan dy="5.0"> Y</tspan></text>
  <text x="670.0" y="299.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">all daughters, no sons</text>
  <rect x="15.0" y="330.0" width="430.0" height="260.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="360.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">Y-linked: affected father</text>
  <circle cx="170.0" cy="410.0" r="17.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <rect x="274.0" y="394.0" width="32.0" height="32.0" rx="0" stroke="#14181f" stroke-width="2" fill="#7c3aed"/>
  <line x1="187.0" y1="410.0" x2="274.0" y2="410.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="448.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X X</tspan></text>
  <text x="290.0" y="448.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X Y</tspan><tspan dy="-5.5" font-size="8.8">t</tspan></text>
  <line x1="230.0" y1="410.0" x2="230.0" y2="470.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
