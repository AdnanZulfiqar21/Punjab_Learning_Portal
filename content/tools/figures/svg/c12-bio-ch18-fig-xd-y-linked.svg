  <line x1="391.2" y1="195.0" x2="391.2" y2="213.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="376.9" y="215.6" width="28.8" height="28.8" rx="0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="391.2" y="268.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan><tspan dy="-5.0" font-size="8.2">d</tspan><tspan dy="5.0"> Y</tspan></text>
  <text x="230.0" y="299.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">half of her children (sons or daughters)</text>
