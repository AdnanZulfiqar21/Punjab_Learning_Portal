  <text x="176.2" y="268.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan><tspan dy="-5.0" font-size="8.2">d</tspan><tspan dy="5.0"> X</tspan><tspan dy="-5.0" font-size="8.2">d</tspan></text>
  <line x1="283.8" y1="195.0" x2="283.8" y2="213.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
