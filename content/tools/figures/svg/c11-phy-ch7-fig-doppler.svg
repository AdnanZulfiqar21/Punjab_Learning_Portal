<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 7.12 to 7.14 and topics 7.11 and 7.12: the Doppler effect for a moving source and its applications. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">The Doppler effect and its applications</text>
  <rect x="50" y="55" width="560" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="330" y="83">A moving source of sound (7.11, Fig. 7.12)</text>
  <g fill="none" stroke="#1f6fb5" stroke-width="1.5"><circle cx="312" cy="225" r="30"/><circle cx="294" cy="225" r="60"/><circle cx="276" cy="225" r="90"/><circle cx="258" cy="225" r="120"/></g>
  <circle cx="330" cy="225" r="6" fill="#d7322f"/>
  <path d="M336 225 H372" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="318" y="214">S</text>
  <text class="l" x="344" y="248" style="fill:#d7322f">u_s</text>
  <circle cx="440" cy="225" r="8" fill="#0f7a62"/>
  <circle cx="110" cy="225" r="8" fill="#0f7a62"/>
  <text class="l" x="454" y="230">C: higher f</text>
  <text class="l" x="64" y="262">D: lower f</text>
  <g class="r">
    <text x="460" y="120">source S moves at u_s</text>
    <text x="460" y="135">through still air; both</text>
    <text x="460" y="150">observers are at rest</text>
  </g>
  <text class="r" x="70" y="366">wavefronts crowd ahead of the moving source (shorter wavelength) and spread out behind it (longer)</text>
  <rect x="630" y="55" width="520" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="890" y="83">Apparent frequency (7.11)</text>
  <g class="t">
    <text x="650" y="110">Doppler effect: the apparent change in frequency (pitch) due to</text>
    <text x="650" y="126">relative motion of source and observer: a train whistle rises</text>
    <text x="650" y="142">as the engine approaches and falls as it moves away</text>
  </g>
  <text class="f" x="650" y="168">f = v / lambda (source at rest)</text>
  <text class="t" x="650" y="192"><tspan class="b">towards C:</tspan> the same number of waves fills less space</text>
  <g class="f">
    <text x="650" y="212">delta lambda = u_s / f</text>
    <text x="650" y="230">lambda_C = lambda - delta lambda = (v - u_s)/f</text>
    <text x="650" y="248">f_C = (v / (v - u_s)) f, greater than f</text>
  </g>
  <text class="t" x="650" y="272"><tspan class="b">away from D:</tspan> the waves are stretched out</text>
  <g class="f">
    <text x="650" y="292">lambda_D = lambda + delta lambda = (v + u_s)/f</text>
    <text x="650" y="310">f_D = (v / (v + u_s)) f, less than f</text>
  </g>
  <g class="t">
    <text x="650" y="338">delta lambda is the Doppler shift; the print cites 'Fig. 7.13 (c), (d)'</text>
    <text x="650" y="354">for the figure it numbers 7.12, and names the discoverer 'John Doppler'</text>
  </g>
  <rect x="50" y="405" width="700" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="400" y="433">Applications (7.12, Figs. 7.13, 7.14) and Example 7.12</text>
  <defs><linearGradient id="sp" x1="0" x2="1"><stop offset="0" stop-color="#7b3fbf"/><stop offset="0.3" stop-color="#1f6fb5"/><stop offset="0.55" stop-color="#3ca55c"/><stop offset="0.75" stop-color="#f2c12e"/><stop offset="1" stop-color="#d7322f"/></linearGradient></defs>
  <rect x="70" y="446" width="200" height="16" fill="url(#sp)"/>
  <path d="M170 446 V462" stroke="#14181f" stroke-width="3"/>
  <text class="r" x="282" y="458">star at rest</text>
  <rect x="70" y="472" width="200" height="16" fill="url(#sp)"/>
  <path d="M205 472 V488" stroke="#14181f" stroke-width="3"/>
  <text class="r" x="282" y="484">receding: red shift</text>
  <rect x="70" y="498" width="200" height="16" fill="url(#sp)"/>
  <path d="M135 498 V514" stroke="#14181f" stroke-width="3"/>
  <text class="r" x="282" y="510">approaching: blue shift</text>
  <g class="r">
    <text x="450" y="456">spectrum line moves to longer wavelength (red)</text>
    <text x="450" y="471">for a receding star, shorter (blue) for an</text>
    <text x="450" y="486">approaching one; all distant galaxies recede</text>
  </g>
  <g class="t">
    <text x="70" y="548">radar (radio detection and ranging): waves reflected from an approaching aeroplane are shorter,</text>
    <text x="70" y="564">from a receding one longer; radar speed traps time microwave bursts reflected from moving cars;</text>
    <text x="70" y="580">sonar (sound navigation and ranging): echoes locate submarines and mines and measure sea depth;</text>
    <text x="70" y="596">also satellite navigation and communication, Doppler weather radar and Earth-surface motion;</text>
    <text x="70" y="612">Doppler echocardiography and ultrasound measure blood flow (stenosis, regurgitation, pacemakers)</text>
    <text x="70" y="628">Example 7.12: Ca line at 478 nm, 397 nm in the lab: f = 7.56 x 10^14 Hz, f' = 6.28 x 10^14 Hz;</text>
    <text x="70" y="644">f' is less than f, so the galaxy recedes; f' = (c / (c + u_s)) f gives u_s = 6.12 x 10^7 m s^-1</text>
  </g>
  <rect x="770" y="405" width="380" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="960" y="433">Hearing ranges and examples</text>
  <text class="l" x="790" y="458">organism</text>
  <text class="l" x="900" y="458">range (Hz)</text>
  <text class="r" x="790" y="475">dolphin</text>
  <text class="r" x="900" y="475">150 - 150 000</text>
  <text class="r" x="790" y="492">bat</text>
  <text class="r" x="900" y="492">1000 - 120 000</text>
  <text class="r" x="790" y="509">cat</text>
  <text class="r" x="900" y="509">60 - 70 000</text>
  <text class="r" x="790" y="526">dog</text>
  <text class="r" x="900" y="526">15 - 50 000</text>
  <text class="r" x="790" y="543">human</text>
  <text class="r" x="900" y="543">20 - 20 000</text>
  <g class="t">
    <text x="790" y="568">Ex 7.10: Q (source, 20 m s^-1) behind P (12 m s^-1):</text>
    <text x="790" y="584">relative 8 m s^-1; 830 = (340/332) f_Q, f_Q = 810.47 Hz</text>
    <text x="790" y="600">Ex 7.11: 1200 Hz heard as 1140 Hz after 50 s leaving:</text>
    <text x="790" y="616">340 + u_s = 340 x 1200/1140, u_s = 17.89 m s^-1;</text>
    <text x="790" y="632">S = (0 + 17.89)/2 x 50 = 447 m (printed 448 m)</text>
    <text x="790" y="648">faster than sound, the fronts pile into a shockwave</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
