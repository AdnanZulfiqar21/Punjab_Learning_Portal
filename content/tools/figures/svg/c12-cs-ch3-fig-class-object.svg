  <text x="165.0" y="133.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">class Person</text>
  <line x1="50.0" y1="144.0" x2="280.0" y2="144.0" stroke="#0f7a62" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62.0" y="162.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">name</text>
  <text x="62.0" y="182.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">age</text>
  <text x="62.0" y="202.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">gender</text>
  <line x1="50.0" y1="212.0" x2="280.0" y2="212.0" stroke="#0f7a62" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62.0" y="228.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">eat()</text>
  <text x="62.0" y="248.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">sleep()</text>
  <text x="62.0" y="268.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">work()</text>
  <text x="165.0" y="95.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">class (blueprint)</text>
  <rect x="560.0" y="70.0" width="280.0" height="174.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="700.0" y="93.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">object p1</text>
  <line x1="560.0" y1="104.0" x2="840.0" y2="104.0" stroke="#1f6fb5" stroke-width="1.5" stroke-linecap="round"/>
  <text x="572.0" y="122.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">name = "Bob"</text>
  <text x="572.0" y="142.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">age = 34</text>
  <text x="572.0" y="162.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">gender = "Male"</text>
  <line x1="560.0" y1="172.0" x2="840.0" y2="172.0" stroke="#1f6fb5" stroke-width="1.5" stroke-linecap="round"/>
  <text x="572.0" y="188.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">eat()</text>
  <text x="572.0" y="208.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">sleep()</text>
  <text x="572.0" y="228.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">work()</text>
  <rect x="560.0" y="265.0" width="280.0" height="174.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="700.0" y="288.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">object p2</text>
  <line x1="560.0" y1="299.0" x2="840.0" y2="299.0" stroke="#1f6fb5" stroke-width="1.5" stroke-linecap="round"/>
  <text x="572.0" y="317.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">name = "Jenny"</text>
  <text x="572.0" y="337.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">age = 27</text>
  <text x="572.0" y="357.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">gender = "Female"</text>
  <line x1="560.0" y1="367.0" x2="840.0" y2="367.0" stroke="#1f6fb5" stroke-width="1.5" stroke-linecap="round"/>
  <text x="572.0" y="383.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">eat()</text>
  <text x="572.0" y="403.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">sleep()</text>
  <text x="572.0" y="423.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">work()</text>
  <line x1="285.0" y1="170.0" x2="543.4" y2="121.6" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M552.0 120.0 L543.1 126.4 L541.3 117.3 Z" fill="#0f7a62"/>
  <line x1="285.0" y1="230.0" x2="543.6" y2="312.3" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M552.0 315.0 L541.1 316.4 L543.9 307.5 Z" fill="#0f7a62"/>
  <text x="415.0" y="128.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">p1 = Person(...)</text>
  <text x="415.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">p2 = Person(...)</text>
  <text x="165.0" y="345.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one class,</text>
  <text x="165.0" y="363.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">many objects;</text>
  <text x="165.0" y="381.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">each object has</text>
  <text x="165.0" y="399.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">its own values</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
