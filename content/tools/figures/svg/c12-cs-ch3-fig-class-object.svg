<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: class Person with attributes and methods, and two objects with their own values. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A class is a blueprint; objects are instances (after Fig 3.1)</text>
