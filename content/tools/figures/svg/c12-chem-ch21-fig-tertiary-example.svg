<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- Tertiary halogenoalkane as printed on p76: 2-chloro-2-methylpropane, a carbon carrying Cl and three CH3 groups (H3C left, CH3 above and below). -->
  <text x="450.0" y="181.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="310.0" y="181.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6">C</tspan></text>
  <text x="580.0" y="181.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="450.0" y="71.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="450.0" y="291.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <line x1="431.8" y1="170.0" x2="344.3" y2="170.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="468.2" y1="170.0" x2="557.2" y2="170.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="450.0" y1="148.0" x2="450.0" y2="82.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="450.0" y1="192.0" x2="450.0" y2="258.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="450.0" y="340.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">2-chloro-2-methylpropane</tspan></text>
</svg>
