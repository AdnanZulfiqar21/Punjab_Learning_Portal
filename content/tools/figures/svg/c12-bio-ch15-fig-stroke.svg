<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Figure 15.21: an ischaemic stroke, where a clot blocks a vessel, and a haemorrhagic stroke, where a vessel bursts. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two main kinds of stroke</text>
  <rect x="15.0" y="55.0" width="425.0" height="370.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ischaemic: a blocked vessel</text>
  <rect x="460.0" y="55.0" width="425.0" height="370.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">haemorrhagic: a burst vessel</text>
  <ellipse cx="227.0" cy="230.0" rx="170.0" ry="130.0" stroke="#9d174d" stroke-width="2.5" fill="#fbcfe8"/>
  <ellipse cx="672.0" cy="230.0" rx="170.0" ry="130.0" stroke="#9d174d" stroke-width="2.5" fill="#fbcfe8"/>
  <path d="M80 230 C150 200 200 260 260 220 C300 195 330 210 360 200" stroke="#d7322f" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="250.0" cy="226.0" rx="16.0" ry="10.0" stroke="#7f1d1d" stroke-width="1.5" fill="#450a0a"/>
  <path d="M262 222 C300 196 330 212 360 202" stroke="#fca5a5" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="330.0" cy="260.0" rx="50.0" ry="34.0" stroke="#9ca3af" stroke-width="2" fill="#e5e7eb" stroke-dasharray="6 4"/>
  <text x="250.0" y="196.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">clot</text>
  <text x="330.0" y="314.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">tissue starved</text>
  <text x="330.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">of blood</text>
  <path d="M525 230 C595 200 645 260 705 220 C745 195 775 210 805 200" stroke="#d7322f" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
