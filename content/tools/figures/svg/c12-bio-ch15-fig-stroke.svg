  <circle cx="717.0" cy="263.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="734.0" cy="286.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="751.0" cy="259.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="708.0" cy="282.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="725.0" cy="255.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="742.0" cy="278.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="759.0" cy="251.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="716.0" cy="274.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <circle cx="733.0" cy="247.0" r="9.0" stroke="#7f1d1d" stroke-width="1" fill="#dc2626"/>
  <text x="705.0" y="312.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">blood leaks into the brain</text>
  <text x="450.0" y="410.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">transient ischaemic attack (mini-stroke): a short drop in blood supply, as short as five minutes</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
