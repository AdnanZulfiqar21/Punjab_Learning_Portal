<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- Oil layer on water blocks sunlight and reduces oxygen exchange (our own drawing for the Roman Urdu lesson; the book's Fig 33.3b is a photograph). -->
  <circle cx="110.0" cy="100.0" r="60.0" stroke="#b45309" stroke-width="3" fill="#fde68a"/>
  <line x1="165.0" y1="140.0" x2="318.7" y2="261.1" stroke="#d98b2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M330.0 270.0 L312.5 265.9 L321.9 253.9 Z" fill="#d98b2b"/>
  <text x="285.0" y="195.0" font-size="48" fill="#d7322f" text-anchor="middle" font-weight="800">X</text>
  <text x="200.0" y="50.0" font-size="32" fill="#b45309" text-anchor="start" font-weight="700">dhoop ruk jati</text>
  <text x="200.0" y="88.0" font-size="28" fill="#4b5563" text-anchor="start" font-weight="500">(sunlight blocked)</text>
  <text x="640.0" y="164.0" font-size="40" fill="#0e9aa7" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="12.8" font-size="28.0">2</tspan></text>
  <line x1="640.0" y1="180.0" x2="640.0" y2="257.6" stroke="#0e9aa7" stroke-width="5" stroke-linecap="round"/>
  <path d="M640.0 272.0 L632.4 255.7 L647.6 255.7 Z" fill="#0e9aa7"/>
  <text x="700.0" y="245.0" font-size="48" fill="#d7322f" text-anchor="middle" font-weight="800">X</text>
  <text x="740.0" y="140.0" font-size="30" fill="#0e9aa7" text-anchor="start" font-weight="700">oxygen ka</text>
  <text x="740.0" y="176.0" font-size="30" fill="#0e9aa7" text-anchor="start" font-weight="700">tabadla kam</text>
  <rect x="0" y="300" width="1000" height="220" fill="#bfdbfe"/>
  <rect x="40.0" y="284.0" width="800.0" height="24.0" rx="10" stroke="#111827" stroke-width="2" fill="#1f2937"/>
  <text x="440.0" y="360.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700">tel ki tah (oil layer)</text>
  <path d="M560 450 C600 410 680 410 710 450 C680 490 600 490 560 450 Z" stroke="#1e3a8a" stroke-width="3" fill="#93c5fd" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M710 450 L750 420 L750 480 Z" stroke="#1e3a8a" stroke-width="3" fill="#93c5fd" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="585.0" cy="442.0" r="5.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
