  <polygon points="955.0,179.8 932.0,219.7 886.0,219.7 863.0,179.8 886.0,140.0 932.0,140.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="921.6" y1="210.9" x2="896.4" y2="210.9" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="875.8" y1="175.2" x2="888.4" y2="153.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="929.6" y1="153.4" x2="942.2" y2="175.2" stroke="#111" stroke-width="3" stroke-linecap="round"/>
</svg>
