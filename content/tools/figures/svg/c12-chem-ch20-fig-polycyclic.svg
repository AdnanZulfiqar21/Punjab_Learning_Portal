<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="Arial, Helvetica, sans-serif">
  <!-- Example of polycyclic benzenes (C12-CHEM, PDF p63): as printed, each name in pink with its formula above the structure: naphthalene C10H8 (two fused rings), anthracene C14H10 (three rings in a line) and phenanthrene C14H10 (three rings joined at an angle, the middle ring on top). -->
  <rect width="1000" height="280" fill="#ffffff"/>
  <text x="170.0" y="44.0" font-size="26" fill="#c2185b" text-anchor="middle" font-weight="bold">Naphthalene</text>
  <text x="170.0" y="78.0" font-size="24" fill="#111" text-anchor="middle" font-weight="normal">C<tspan baseline-shift="sub" font-size="75%">10</tspan>H<tspan baseline-shift="sub" font-size="75%">8</tspan></text>
  <polygon points="130.2,119.0 170.0,142.0 170.0,188.0 130.2,211.0 90.3,188.0 90.3,142.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="134.8" y1="131.8" x2="156.6" y2="144.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="156.6" y1="185.6" x2="134.8" y2="198.2" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="99.1" y1="177.6" x2="99.1" y2="152.4" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <polygon points="209.8,119.0 249.7,142.0 249.7,188.0 209.8,211.0 170.0,188.0 170.0,142.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="214.5" y1="131.8" x2="236.2" y2="144.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="236.2" y1="185.6" x2="214.5" y2="198.2" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="500.0" y="44.0" font-size="26" fill="#c2185b" text-anchor="middle" font-weight="bold">Anthracene</text>
  <text x="500.0" y="78.0" font-size="24" fill="#111" text-anchor="middle" font-weight="normal">C<tspan baseline-shift="sub" font-size="75%">14</tspan>H<tspan baseline-shift="sub" font-size="75%">10</tspan></text>
  <polygon points="420.3,119.0 460.2,142.0 460.2,188.0 420.3,211.0 380.5,188.0 380.5,142.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="389.3" y1="177.6" x2="389.3" y2="152.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="425.0" y1="131.8" x2="446.7" y2="144.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="446.7" y1="185.6" x2="425.0" y2="198.2" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <polygon points="500.0,119.0 539.8,142.0 539.8,188.0 500.0,211.0 460.2,188.0 460.2,142.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="504.7" y1="131.8" x2="526.4" y2="144.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="526.4" y1="185.6" x2="504.7" y2="198.2" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <polygon points="579.7,119.0 619.5,142.0 619.5,188.0 579.7,211.0 539.8,188.0 539.8,142.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="584.3" y1="131.8" x2="606.1" y2="144.4" stroke="#111" stroke-width="3" stroke-linecap="round"/><line x1="606.1" y1="185.6" x2="584.3" y2="198.2" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="840.0" y="44.0" font-size="26" fill="#c2185b" text-anchor="middle" font-weight="bold">Phenanthrene</text>
  <text x="840.0" y="78.0" font-size="24" fill="#111" text-anchor="middle" font-weight="normal">C<tspan baseline-shift="sub" font-size="75%">14</tspan>H<tspan baseline-shift="sub" font-size="75%">10</tspan></text>
  <polygon points="886.0,140.0 863.0,179.8 817.0,179.8 794.0,140.0 817.0,100.2 863.0,100.2" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="827.4" y1="108.9" x2="852.6" y2="108.9" stroke="#111" stroke-width="3" stroke-linecap="round"/>
