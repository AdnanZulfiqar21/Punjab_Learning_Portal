<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Tidbit photo, 20.4.2 (C12-BIO, PDF p163): transgenic mice carrying the green-glowing protein gene beside a normal mouse; clean flat drawing after the printed photograph (no photograph reproduced) -->
  <defs>
    <radialGradient id="tg" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#e9f6ff"/><stop offset="0.55" stop-color="#7fc6f2"/><stop offset="1" stop-color="#2f86d6"/></radialGradient>
    <radialGradient id="nm" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#d9e2f5"/><stop offset="1" stop-color="#9fb0d8"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d8ff6a"/><stop offset="0.6" stop-color="#4ee06a"/><stop offset="1" stop-color="#4ee06a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1100" height="820" fill="#05080f"/>
  <text x="40" y="62" font-size="34" font-weight="700" fill="#7fe08a">Transgenic mice carry a gene of protein which</text>
  <text x="40" y="104" font-size="34" font-weight="700" fill="#7fe08a">glows green</text>
  <!-- glowing tails across the background -->
  <path d="M330 300 C 470 230, 700 200, 1060 190" stroke="#2fbf5a" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M40 470 C 120 430, 170 420, 220 425" stroke="#2fbf5a" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- right transgenic mouse (behind) -->
  <g>
    <ellipse cx="830" cy="380" rx="200" ry="150" fill="url(#tg)" transform="rotate(18 830 380)"/>
    <path d="M900 420 C 980 420, 1040 470, 1050 540 C 1060 610, 1010 650, 960 640 C 910 630, 870 580, 860 520 Z" fill="url(#tg)"/>
    <path d="M1000 470 C 1040 420, 1080 420, 1085 470 C 1088 510, 1050 520, 1020 505 Z" fill="#8fd8a0" stroke="#3cbf6a" stroke-width="3"/>
    <path d="M885 455 C 860 410, 900 380, 930 410 C 945 430, 935 460, 910 470 Z" fill="#8fd8a0" stroke="#3cbf6a" stroke-width="3"/>
    <circle cx="992" cy="560" r="20" fill="url(#glow)"/><circle cx="992" cy="560" r="9" fill="#c8ff4a"/>
    <circle cx="1015" cy="640" r="22" fill="url(#glow)"/><ellipse cx="1012" cy="636" rx="12" ry="9" fill="#a6f04a"/>
    <ellipse cx="955" cy="668" rx="16" ry="9" fill="#5fe07a"/>
  </g>
  <!-- middle normal mouse -->
  <g>
    <ellipse cx="560" cy="390" rx="250" ry="170" fill="url(#nm)" transform="rotate(14 560 390)"/>
    <path d="M620 470 C 720 450, 800 510, 805 610 C 808 690, 760 730, 700 725 C 640 720, 600 660, 595 590 Z" fill="url(#nm)"/>
    <path d="M745 525 C 770 470, 820 470, 825 520 C 828 565, 790 585, 760 570 Z" fill="#e3e9f8" stroke="#a9b6da" stroke-width="3"/>
    <path d="M610 520 C 590 470, 640 450, 670 480 C 690 505, 675 545, 645 550 Z" fill="#e3e9f8" stroke="#a9b6da" stroke-width="3"/>
    <circle cx="738" cy="640" r="10" fill="#5a1020"/><circle cx="735" cy="637" r="3" fill="#ffffff"/>
    <ellipse cx="712" cy="718" rx="12" ry="9" fill="#e7b9c4"/>
    <g stroke="#c9d3ea" stroke-width="1.6"><line x1="700" y1="712" x2="630" y2="700"/><line x1="700" y1="716" x2="625" y2="722"/><line x1="725" y1="712" x2="790" y2="696"/><line x1="725" y1="716" x2="795" y2="720"/></g>
  </g>
  <!-- left transgenic mouse (front) -->
  <g>
    <ellipse cx="300" cy="560" rx="230" ry="140" fill="url(#tg)" transform="rotate(16 300 560)"/>
    <path d="M380 590 C 470 580, 540 630, 550 700 C 558 760, 515 800, 465 795 C 410 790, 370 740, 360 680 Z" fill="url(#tg)"/>
    <path d="M495 640 C 520 590, 570 590, 572 640 C 574 680, 535 695, 508 680 Z" fill="#8fd8a0" stroke="#3cbf6a" stroke-width="3"/>
    <path d="M375 640 C 352 595, 395 570, 425 598 C 442 618, 432 650, 405 660 Z" fill="#8fd8a0" stroke="#3cbf6a" stroke-width="3"/>
    <circle cx="470" cy="718" r="22" fill="url(#glow)"/><circle cx="470" cy="718" r="10" fill="#c8ff4a"/>
    <circle cx="500" cy="792" r="24" fill="url(#glow)"/><ellipse cx="497" cy="788" rx="13" ry="10" fill="#a6f04a"/>
    <ellipse cx="420" cy="800" rx="18" ry="10" fill="#5fe07a"/>
    <ellipse cx="560" cy="790" rx="18" ry="10" fill="#5fe07a"/>
  </g>
  <!-- printed labels -->
  <rect x="740" y="232" width="220" height="50" fill="#d6e04a" opacity="0.9"/>
  <text x="850" y="268" font-size="32" fill="#2d3a1c" text-anchor="middle">Transgenic</text>
  <rect x="438" y="300" width="160" height="50" fill="#d6e04a" opacity="0.9"/>
  <text x="518" y="336" font-size="32" fill="#2d3a1c" text-anchor="middle">Normal</text>
  <rect x="170" y="470" width="220" height="50" fill="#d6e04a" opacity="0.9"/>
  <text x="280" y="506" font-size="32" fill="#2d3a1c" text-anchor="middle">Transgenic</text>
</svg>
