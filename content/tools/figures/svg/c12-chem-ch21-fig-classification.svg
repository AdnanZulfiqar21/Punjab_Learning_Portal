  <text x="837.5" y="175.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="785.0" y1="181.0" x2="785.0" y2="201.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="785.0" y="225.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="774.0" y1="170.0" x2="754.0" y2="170.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="732.5" y="175.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="785.0" y="175.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="785.0" y="270.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">tri-halogenoalkane</text>
  <rect x="15.0" y="310.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="340.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">primary, secondary or tertiary: the C carrying X has 1, 2 or 3 C neighbours</text>
  <text x="160.0" y="410.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">-CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">-Cl</tspan></text>
  <text x="160.0" y="450.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">chloroethane</text>
  <text x="160.0" y="478.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">primary</text>
  <text x="450.0" y="410.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">-CHCl-CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan></text>
  <text x="450.0" y="450.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">2-chloropropane</text>
  <text x="450.0" y="478.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">secondary</text>
  <text x="740.0" y="410.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C-Cl</tspan></text>
  <text x="740.0" y="450.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">2-chloro-2-methylpropane</text>
  <text x="740.0" y="478.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">tertiary</text>
  <text x="450.0" y="530.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">also primary: chloromethane (no other C), 1-chloropropane; also secondary: 2-chlorobutane</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
