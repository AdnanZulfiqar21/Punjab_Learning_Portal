  <text x="595.0" y="125.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="606.0" y1="170.0" x2="626.0" y2="170.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="647.5" y="175.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="595.0" y1="181.0" x2="595.0" y2="201.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="595.0" y="225.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
