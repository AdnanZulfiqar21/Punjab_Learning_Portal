  <text x="195.0" y="180.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="155.0" y="278.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">CF3-CHClBr</text>
