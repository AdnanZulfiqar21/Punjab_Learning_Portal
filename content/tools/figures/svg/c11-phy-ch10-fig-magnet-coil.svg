<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.15: a bar magnet pushed into a coil induces a current shown by a galvanometer. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Pushing a magnet into a coil induces a current</text>
  <rect x="80.0" y="190.0" width="90.0" height="60.0" rx="0" stroke="#d7322f" stroke-width="2.5" fill="#f8b4b1"/>
  <rect x="170.0" y="190.0" width="90.0" height="60.0" rx="0" stroke="#1f6fb5" stroke-width="2.5" fill="#bcd7f3"/>
  <text x="125.0" y="228.0" font-size="22" fill="#d7322f" text-anchor="middle" font-weight="700">S</text>
  <text x="215.0" y="228.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">N</text>
  <line x1="160.0" y1="290.0" x2="279.6" y2="290.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M290.0 290.0 L278.2 295.5 L278.2 284.5 Z" fill="#14181f"/>
  <text x="225.0" y="318.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">magnet moves in</text>
  <ellipse cx="360.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="392.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="424.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="456.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="488.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="520.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="552.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <ellipse cx="584.0" cy="220.0" rx="14.0" ry="62.0" stroke="#b45309" stroke-width="3" fill="none"/>
  <path d="M360.0 282.0 L360.0 380.0 L500.0 380.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="530.0" cy="380.0" r="24.0" stroke="#14181f" stroke-width="2.2" fill="#ffffff"/>
  <text x="530.0" y="387.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">G</text>
  <path d="M554.0 380.0 L584.0 380.0 L584.0 282.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="512.0" y1="360.0" x2="541.8" y2="353.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M548.0 352.0 L541.7 356.9 L540.2 350.3 Z" fill="#14181f"/>
  <text x="530.0" y="425.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">galvanometer deflects</text>
  <text x="476.0" y="128.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">the coil's near end becomes N:</text>
  <text x="476.0" y="148.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">it repels the magnet (Lenz's law)</text>
  <rect x="640.0" y="180.0" width="240.0" height="120.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="654.0" y="208.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">changing flux induces</text>
  <text x="654.0" y="227.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">an emf; the faster the</text>
  <text x="654.0" y="247.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">magnet moves, the larger</text>
  <text x="654.0" y="266.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">the emf</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
