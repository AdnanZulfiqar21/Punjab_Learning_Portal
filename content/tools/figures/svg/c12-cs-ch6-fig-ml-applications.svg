<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: machine learning at the centre with healthcare, business, education and daily-life uses. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Applications of machine learning (after Fig 6.5)</text>
  <circle cx="450.0" cy="240.0" r="70.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="450.0" y="236.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">machine</text>
  <text x="450.0" y="256.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">learning</text>
  <rect x="20.0" y="60.0" width="260.0" height="140.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="150.0" y="88.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Healthcare</text>
  <text x="150.0" y="120.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">medical diagnosis</text>
  <text x="150.0" y="142.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">predicting risk</text>
  <text x="150.0" y="164.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">drug discovery</text>
  <line x1="280.0" y1="130.0" x2="388.0" y2="210.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <rect x="620.0" y="60.0" width="260.0" height="140.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="750.0" y="88.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Business</text>
  <text x="750.0" y="120.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">customer insights</text>
  <text x="750.0" y="142.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">fraud detection</text>
  <text x="750.0" y="164.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sales forecasting</text>
  <line x1="620.0" y1="130.0" x2="512.0" y2="210.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <rect x="20.0" y="280.0" width="260.0" height="140.0" rx="12" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="150.0" y="308.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Education</text>
  <text x="150.0" y="340.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">adaptive learning</text>
  <text x="150.0" y="362.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">student assessment</text>
  <text x="150.0" y="384.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">tutoring systems</text>
  <line x1="280.0" y1="350.0" x2="388.0" y2="270.0" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <rect x="620.0" y="280.0" width="260.0" height="140.0" rx="12" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="750.0" y="308.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Daily life</text>
  <text x="750.0" y="340.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">virtual assistants</text>
  <text x="750.0" y="362.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">recommendations</text>
  <text x="750.0" y="384.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">smart homes</text>
  <line x1="620.0" y1="350.0" x2="512.0" y2="270.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
