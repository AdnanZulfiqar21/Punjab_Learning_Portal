<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original chart for topic 32.10: Pakistan's raw materials (natural gas, Khewra rock salt, limestone, gypsum, Muslim Bagh chromite, crude oil, sulphur, with air and water) and the products made from them. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Raw materials for Pakistan's chemical industry</text>
  <text x="450.0" y="70.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Air: nitrogen for fertilisers, oxygen for steel. Water: solvent, coolant and a source of hydrogen.</text>
  <rect x="25.0" y="92.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="118.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">natural gas</text>
  <text x="170.0" y="138.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mainly methane, CH4</text>
  <line x1="318.0" y1="122.0" x2="345.6" y2="122.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 122.0 L344.7 125.4 L344.7 118.6 Z" fill="#14181f"/>
  <rect x="356.0" y="92.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="128.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">urea fertiliser, petrochemicals; fuel and source of hydrogen</text>
  <rect x="25.0" y="166.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="192.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">rock salt (Khewra)</text>
  <text x="170.0" y="212.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">sodium chloride, NaCl</text>
  <line x1="318.0" y1="196.0" x2="345.6" y2="196.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 196.0 L344.7 199.4 L344.7 192.6 Z" fill="#14181f"/>
  <rect x="356.0" y="166.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="202.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">soda ash (Na2CO3), caustic soda (NaOH), chlorine</text>
  <rect x="25.0" y="240.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="266.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">limestone</text>
  <text x="170.0" y="286.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">calcium carbonate, CaCO3</text>
  <line x1="318.0" y1="270.0" x2="345.6" y2="270.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 270.0 L344.7 273.4 L344.7 266.6 Z" fill="#14181f"/>
  <rect x="356.0" y="240.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="276.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">cement (abundant in the Salt Range and Sindh)</text>
  <rect x="25.0" y="314.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="340.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">gypsum</text>
  <text x="170.0" y="360.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">calcium sulphate</text>
  <line x1="318.0" y1="344.0" x2="345.6" y2="344.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 344.0 L344.7 347.4 L344.7 340.6 Z" fill="#14181f"/>
  <rect x="356.0" y="314.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="350.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">cement, plaster; source of Ca and S; soil conditioner</text>
  <rect x="25.0" y="388.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="414.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">chromite (Muslim Bagh)</text>
  <text x="170.0" y="434.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">chromium ore</text>
  <line x1="318.0" y1="418.0" x2="345.6" y2="418.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 418.0 L344.7 421.4 L344.7 414.6 Z" fill="#14181f"/>
  <rect x="356.0" y="388.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="424.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">stainless steel and pigments</text>
  <rect x="25.0" y="462.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="488.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">crude oil</text>
  <text x="170.0" y="508.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mixture of hydrocarbons</text>
  <line x1="318.0" y1="492.0" x2="345.6" y2="492.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 492.0 L344.7 495.4 L344.7 488.6 Z" fill="#14181f"/>
  <rect x="356.0" y="462.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="498.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">fuels and petrochemicals after refining</text>
  <rect x="25.0" y="536.0" width="290.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="170.0" y="562.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">sulphur</text>
  <text x="170.0" y="582.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">S</text>
  <line x1="318.0" y1="566.0" x2="345.6" y2="566.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M352.0 566.0 L344.7 569.4 L344.7 562.6 Z" fill="#14181f"/>
  <rect x="356.0" y="536.0" width="520.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="372.0" y="572.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">sulphuric acid (H2SO4), a key industrial chemical</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
