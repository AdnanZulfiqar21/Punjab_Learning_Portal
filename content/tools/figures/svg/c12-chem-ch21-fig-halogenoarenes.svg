<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram for topics 21.5 and 21.5.1: benzene + X2 with FeX3 gives a halogenoarene and HX; in chlorobenzene a chlorine lone pair is delocalised into the ring, giving the C-Cl bond partial double-bond character. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Halogenoarenes</text>
  <rect x="15.0" y="55.0" width="870.0" height="170.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">making chlorobenzene or bromobenzene</text>
  <path d="M110.0 125.0 L136.0 140.0 L136.0 170.0 L110.0 185.0 L84.0 170.0 L84.0 140.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="110.0" cy="155.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="180.0" y="161.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ X</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="220.0" y1="155.0" x2="311.2" y2="155.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320.0 155.0 L310.0 159.6 L310.0 150.4 Z" fill="#14181f"/>
  <text x="270.0" y="145.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">FeX</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2"> (anhydrous)</tspan></text>
  <text x="270.0" y="177.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">room temperature</tspan></text>
  <path d="M400.0 131.0 L426.0 146.0 L426.0 176.0 L400.0 191.0 L374.0 176.0 L374.0 146.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="400.0" cy="161.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="400.0" y1="131.0" x2="400.0" y2="114.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="400.0" y="107.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <text x="480.0" y="165.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HX</tspan></text>
  <text x="700.0" y="161.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">electrophilic substitution (X = Cl or Br)</text>
  <rect x="15.0" y="235.0" width="870.0" height="210.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="265.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">why chlorobenzene is unreactive to nucleophiles</text>
  <path d="M200.0 306.0 L238.1 328.0 L238.1 372.0 L200.0 394.0 L161.9 372.0 L161.9 328.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="200.0" cy="350.0" rx="34.0" ry="22.0" stroke="#ec4899" stroke-width="2" fill="#fbcfe8"/>
  <line x1="238.1" y1="328.0" x2="295.0" y2="318.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="315.0" cy="312.0" rx="22.0" ry="16.0" stroke="#ec4899" stroke-width="2" fill="#fbcfe8"/>
  <text x="315.0" y="317.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <path d="M302.0 328.0 Q280.0 346.0 252.0 336.0" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M252.0 336.0 L262.0 335.1 L259.1 343.0 Z" fill="#7c3aed"/>
  <text x="560.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">a lone pair on Cl overlaps with the ring's pi system,</text>
  <text x="560.0" y="321.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">so the C-Cl bond gets partial double-bond character:</text>
  <text x="560.0" y="342.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">it is shorter and stronger than in chloroethane</text>
  <text x="560.0" y="363.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="560.0" y="384.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the ring's electrons also repel nucleophiles, and the</text>
  <text x="560.0" y="405.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ring blocks attack from the back of the C-Cl bond</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
