<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: decomposition, patterns, abstraction and algorithm, with an evaluate-and-improve loop. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Computational thinking: four habits, then evaluate (after 2.1)</text>
  <rect x="25.0" y="80.0" width="196.0" height="170.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="123.0" y="112.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 break it down</text>
  <text x="123.0" y="150.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">split a big problem into</text>
  <text x="123.0" y="168.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">smaller parts (decomposition)</text>
  <line x1="223.0" y1="165.0" x2="233.8" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M241.0 165.0 L232.8 168.8 L232.8 161.2 Z" fill="#14181f"/>
  <rect x="243.0" y="80.0" width="196.0" height="170.0" rx="12" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="341.0" y="112.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 look for patterns</text>
  <text x="341.0" y="150.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">spot what repeats in</text>
  <text x="341.0" y="168.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">problems and solutions</text>
  <line x1="441.0" y1="165.0" x2="451.8" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M459.0 165.0 L450.8 168.8 L450.8 161.2 Z" fill="#14181f"/>
  <rect x="461.0" y="80.0" width="196.0" height="170.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="559.0" y="112.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 remove details</text>
  <text x="559.0" y="150.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">keep only what matters</text>
  <text x="559.0" y="168.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">(abstraction)</text>
  <line x1="659.0" y1="165.0" x2="669.8" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M677.0 165.0 L668.8 168.8 L668.8 161.2 Z" fill="#14181f"/>
  <rect x="679.0" y="80.0" width="196.0" height="170.0" rx="12" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="777.0" y="112.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 write clear steps</text>
  <text x="777.0" y="150.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">an ordered set of steps</text>
  <text x="777.0" y="168.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">(algorithm)</text>
  <rect x="300.0" y="302.0" width="300.0" height="56.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="450.0" y="328.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">evaluate and improve</text>
  <text x="450.0" y="344.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">test it, fix mistakes, make it simpler or faster</text>
  <path d="M780 250 Q790 330 600 330" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M600.0 330.0 L609.1 325.8 L609.1 334.2 Z" fill="#d7322f"/>
  <path d="M300 330 Q110 330 120 252" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120.0 252.0 L124.2 261.1 L115.8 261.1 Z" fill="#d7322f"/>
  <text x="450.0" y="420.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">The steps can be followed by a person or by a computer.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
