<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- Roman Urdu figure for 2.1 (not in the book): the four habits of computational thinking named in the 2.1 text, in order. -->
  <rect x="30.0" y="30.0" width="440.0" height="180.0" rx="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <circle cx="68.0" cy="68.0" r="26.0" fill="#1f6fb5" stroke="none" stroke-width="2"/>
  <text x="68.0" y="79.0" font-size="30" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">1</text>
  <text x="250.0" y="130.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Bare masle ko</text>
  <text x="250.0" y="172.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">chhote hisson mein torein</text>
  <rect x="530.0" y="30.0" width="440.0" height="180.0" rx="14" fill="#e3f3ec" stroke="#0f7a62" stroke-width="3"/>
  <circle cx="568.0" cy="68.0" r="26.0" fill="#0f7a62" stroke="none" stroke-width="2"/>
  <text x="568.0" y="79.0" font-size="30" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">2</text>
  <text x="750.0" y="130.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Masail aur hal mein</text>
  <text x="750.0" y="172.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">naqsh (patterns) dhoondein</text>
  <rect x="30.0" y="260.0" width="440.0" height="180.0" rx="14" fill="#fdebd3" stroke="#c9761c" stroke-width="3"/>
  <circle cx="68.0" cy="298.0" r="26.0" fill="#c9761c" stroke="none" stroke-width="2"/>
  <text x="68.0" y="309.0" font-size="30" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">3</text>
  <text x="250.0" y="360.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Ghair zaroori tafseel</text>
  <text x="250.0" y="402.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">hata kar ahem par tawajjuh</text>
  <rect x="530.0" y="260.0" width="440.0" height="180.0" rx="14" fill="#ece4fd" stroke="#6d3fd6" stroke-width="3"/>
  <circle cx="568.0" cy="298.0" r="26.0" fill="#6d3fd6" stroke="none" stroke-width="2"/>
  <text x="568.0" y="309.0" font-size="30" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">4</text>
  <text x="750.0" y="360.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Hal ke wazeh qadam</text>
  <text x="750.0" y="402.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">tarteeb se banayein</text>
  <line x1="472.0" y1="120.0" x2="510.7" y2="120.0" stroke="#1d2330" stroke-width="4" stroke-linecap="butt"/>
  <path d="M526.0 120.0 L509.8 127.8 L509.8 112.2 Z" fill="#1d2330"/>
  <path d="M750 212 L750 236 L250 236 L250 252" fill="none" stroke="#1d2330" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M250.0 258.0 L241.4 242.2 L258.6 242.2 Z" fill="#1d2330"/>
  <line x1="472.0" y1="350.0" x2="510.7" y2="350.0" stroke="#1d2330" stroke-width="4" stroke-linecap="butt"/>
  <path d="M526.0 350.0 L509.8 357.8 L509.8 342.2 Z" fill="#1d2330"/>
</svg>
