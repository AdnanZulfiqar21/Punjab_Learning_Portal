  <text x="80" y="88" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">def calculate_area(radius):</text>
  <text x="52" y="124" font-size="18" fill="#8a919c" text-anchor="end" font-family="Consolas, Courier New, monospace">2</text>
  <text x="80" y="124" font-size="21" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    # Set a breakpoint here to pause and check the value of 'radius'</text>
