  <text x="80" y="160" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    area = 3.14 * radius ** 2</text>
  <text x="52" y="196" font-size="18" fill="#8a919c" text-anchor="end" font-family="Consolas, Courier New, monospace">4</text>
  <text x="80" y="196" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    return area</text>
