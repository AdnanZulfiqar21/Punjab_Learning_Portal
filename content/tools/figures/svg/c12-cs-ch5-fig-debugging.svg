  <text x="52" y="268" font-size="18" fill="#8a919c" text-anchor="end" font-family="Consolas, Courier New, monospace">6</text>
  <text x="80" y="268" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">def main():</text>
