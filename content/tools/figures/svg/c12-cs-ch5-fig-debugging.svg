<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: code with breakpoints, a watch panel showing radius and area, and the stepping commands. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Debugging with breakpoints and watches (after Fig 5.2)</text>
  <rect x="60.0" y="70.0" width="470.0" height="252.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="72.0" y="93.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def calculate_area(radius):</text>
  <rect x="63.0" y="104.0" width="464.0" height="26.0" rx="2" stroke="#fde68a" stroke-width="0" fill="#fde68a"/>
  <text x="102.8" y="119.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">area = 3.14 * radius ** 2</text>
  <text x="102.8" y="145.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">return area</text>
  <text x="72.0" y="171.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400"></text>
  <text x="72.0" y="197.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def main():</text>
  <text x="102.8" y="223.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">radius = 5</text>
  <text x="102.8" y="249.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">print("Area:", calculate_area(radius))</text>
  <text x="102.8" y="275.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">radius = 10</text>
  <text x="102.8" y="301.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">print("Area:", calculate_area(radius))</text>
  <circle cx="45.0" cy="118.0" r="8.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <circle cx="45.0" cy="222.0" r="8.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <circle cx="45.0" cy="274.0" r="8.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="45.0" y="345.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">breakpoints</text>
  <text x="295.0" y="342.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">paused here (highlighted line)</text>
  <rect x="570.0" y="70.0" width="300.0" height="150.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="720.0" y="96.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">watches</text>
  <text x="590.0" y="130.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">radius = 5</text>
  <text x="590.0" y="152.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">area   = 78.5</text>
  <text x="590.0" y="174.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">(next run: radius = 10,</text>
  <text x="590.0" y="196.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"> area = 314.0)</text>
  <rect x="575.0" y="237.0" width="130.0" height="36.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="640.0" y="259.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Step Into</text>
  <text x="715.0" y="260.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">go inside calculate_area()</text>
  <rect x="575.0" y="287.0" width="130.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="640.0" y="309.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Step Over</text>
  <text x="715.0" y="310.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">run this line, go to next</text>
  <rect x="575.0" y="337.0" width="130.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="640.0" y="359.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Continue</text>
  <text x="715.0" y="360.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">run to the next breakpoint</text>
  <text x="450.0" y="440.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Breakpoints pause the program; watches show variable values; stepping moves one line at a time.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
