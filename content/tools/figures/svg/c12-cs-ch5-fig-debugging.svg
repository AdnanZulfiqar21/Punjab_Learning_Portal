  <text x="104.0" y="70.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">def calculate_area(radius):</text>
  <text x="104.0" y="112.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve">    # Set a breakpoint here to pause and check the value of 'radius'</text>
  <text x="104.0" y="154.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    area = 3.14 * radius ** 2</text>
  <text x="104.0" y="196.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    return area</text>
  <text x="104.0" y="280.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">def main():</text>
  <text x="104.0" y="322.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve">    # Step-by-step debugging: starting from here</text>
  <text x="104.0" y="364.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    radius = 5</text>
  <text x="104.0" y="406.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    print("Area of circle:", calculate_area(radius))</text>
  <text x="104.0" y="490.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Start the program</text>
  <text x="104.0" y="532.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">if __name__ == "__main__":</text>
  <text x="104.0" y="574.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    main()</text>
