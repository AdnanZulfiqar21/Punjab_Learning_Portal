  <text x="80" y="304" font-size="21" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    # Step-by-step debugging: starting from here</text>
  <text x="52" y="340" font-size="18" fill="#8a919c" text-anchor="end" font-family="Consolas, Courier New, monospace">8</text>
  <text x="80" y="340" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    radius = 5</text>
  <text x="52" y="376" font-size="18" fill="#8a919c" text-anchor="end" font-family="Consolas, Courier New, monospace">9</text>
  <text x="80" y="376" font-size="21" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    print(&quot;Area of circle:&quot;, calculate_area(radius))</text>
