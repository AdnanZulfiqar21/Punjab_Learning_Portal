<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Fig 16.6: two parallel plates of area A a distance d apart, connected through a switch S to a battery of voltage V, carrying +Q and -Q; Q = CV and C = A eo / d (A eo er / d with a dielectric). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A parallel-plate capacitor (after Fig 16.6)</text>
  <path d="M330.0 110.0 L370.0 80.0 L370.0 260.0 L330.0 290.0 Z" stroke="#d98b2b" stroke-width="2" fill="#fde68a" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M420.0 110.0 L460.0 80.0 L460.0 260.0 L420.0 290.0 Z" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="345.0" y="72.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+Q</text>
  <text x="440.0" y="72.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">-Q</text>
  <line x1="355.6" y1="310.0" x2="434.4" y2="310.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M440.0 310.0 L433.7 313.0 L433.7 307.0 Z" fill="#4b5563"/>
  <path d="M350.0 310.0 L356.3 307.0 L356.3 313.0 Z" fill="#4b5563"/>
  <text x="395.0" y="330.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <text x="320.0" y="130.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">area A</text>
  <path d="M330.0 200.0 L120.0 200.0 L120.0 380.0 L330.0 380.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="336.0" y1="364.0" x2="336.0" y2="396.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="345.0" y1="372.0" x2="345.0" y2="388.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="332.0" y="362.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">+</text>
  <text x="352.0" y="362.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">-</text>
  <text x="340.0" y="415.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">V</text>
  <path d="M345.0 380.0 L420.0 380.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="420.0" y1="380.0" x2="455.0" y2="362.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="420.0" cy="380.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="462.0" cy="380.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="440.0" y="405.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">S</text>
  <path d="M462.0 380.0 L520.0 380.0 L520.0 200.0 L460.0 200.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="560.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Q is proportional to V:</text>
  <text x="560.0" y="132.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Q = CV, C = Q/V</text>
  <text x="560.0" y="154.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="560.0" y="176.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">SI unit: farad (F) = C/V</text>
  <text x="560.0" y="230.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.8" font-size="12.6">vac</tspan><tspan dy="-5.8"> = A e</tspan><tspan dy="5.8" font-size="12.6">o</tspan><tspan dy="-5.8"> / d</tspan></text>
  <text x="560.0" y="265.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.8" font-size="12.6">med</tspan><tspan dy="-5.8"> = A e</tspan><tspan dy="5.8" font-size="12.6">o</tspan><tspan dy="-5.8"> e</tspan><tspan dy="5.8" font-size="12.6">r</tspan><tspan dy="-5.8"> / d</tspan></text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
