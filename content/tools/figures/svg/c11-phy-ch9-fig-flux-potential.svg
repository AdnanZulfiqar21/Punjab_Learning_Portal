  <circle cx="76" cy="455" r="9" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="76" y="459" style="text-anchor:middle">+</text>
  <circle cx="76" cy="525" r="9" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="76" y="529" style="text-anchor:middle">-</text>
  <text class="r" x="420" y="430">+ plate</text>
  <text class="r" x="420" y="560">- plate</text>
  <text class="r" x="420" y="495">E downward</text>
  <g class="r">
    <text x="70" y="590">F = qE (9.26); E = V / d (9.27); a = qE / m</text>
    <text x="70" y="605">20 V across 2.0 cm: E = 1000 N C^-1; an electron gets a = 1.76 x 10^14 m s^-2 and,</text>
    <text x="70" y="620">from rest, reaches the positive plate at v = 2.65 x 10^6 m s^-1 (2aS = vf^2 - vi^2)</text>
    <text x="70" y="635">a particle entering across the field follows a parabola, like a projectile: its horizontal</text>
    <text x="70" y="650">velocity stays constant while its vertical velocity grows; + bends to the - plate</text>
    <text x="70" y="665">moving along the field the path is a straight line</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="880" y="403">Shielding: the Faraday cage (9.9, Fig. 9.19)</text>
