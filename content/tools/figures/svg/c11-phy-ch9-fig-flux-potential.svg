<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.10 to 9.19 and topics 9.3 to 9.9: electric flux, Gauss's law, electric potential and the electron volt, charged particles between plates and the Faraday cage. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Electric flux, Gauss's law, potential, charged particles in a field and shielding</text>
  <rect x="50" y="55" width="360" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Electric flux (9.3, Figs. 9.10, 9.11)</text>
  <path d="M70 110 L160 110" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M70 140 L160 140" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M70 170 L160 170" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M70 200 L160 200" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M115 195 L115 115" stroke="#0f7a62" stroke-width="5"/>
  <path d="M115 155 L149 155" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="l" x="85" y="232">maximum</text>
  <path d="M185 110 L275 110" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M185 140 L275 140" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M185 170 L275 170" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M185 200 L275 200" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M190 155 L270 155" stroke="#0f7a62" stroke-width="5"/>
  <path d="M230 155 L230 121" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="l" x="200" y="232">zero</text>
  <path d="M300 110 L390 110" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M300 140 L390 140" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M300 170 L390 170" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M300 200 L390 200" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M319 186 L371 124" stroke="#0f7a62" stroke-width="5"/>
  <path d="M345 155 L371 133" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="l" x="315" y="232">inclined</text>
  <g class="r">
    <text x="70" y="254">the area A is a vector along its normal (blue); E is red</text>
    <text x="70" y="269">normal along E: phi = EA; area along E: phi = 0;</text>
    <text x="70" y="284">in between: phi = EA cos theta = E.A (9.10)</text>
    <text x="70" y="299">flux: a scalar, N m^2 C^-1; it counts the lines through</text>
    <text x="70" y="314">the area (4 through A and 2 through B in Fig. 9.10)</text>
    <text x="70" y="329">theta: angle between E and the normal to the area</text>
  </g>
  <rect x="430" y="55" width="340" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Gauss's law (9.4, Figs. 9.12 to 9.15)</text>
  <path d="M470 175 C 470 95, 560 85, 590 120 C 625 160, 610 270, 545 268 C 480 266, 470 230, 470 175 Z" fill="#fbe7c6" stroke="#d98b2b" stroke-width="1.5"/>
  <circle cx="538" cy="180" r="48" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
  <path d="M554 180 L618 180" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M549 191 L595 237" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M538 196 L538 260" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M527 191 L481 237" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M522 180 L458 180" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M527 169 L481 123" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M538 164 L538 100" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <path d="M549 169 L595 123" stroke="#d7322f" stroke-width="1.4" marker-end="url(#p)"/>
  <circle cx="538" cy="180" r="11" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="538" y="184" style="text-anchor:middle">+</text>
  <text class="r" x="462" y="290">sphere and any closed</text>
  <text class="r" x="462" y="303">surface S: same flux</text>
  <g class="r">
    <text x="640" y="100">sphere round q:</text>
    <text x="640" y="115">phi = E x 4 pi r^2</text>
    <text x="640" y="130">  = q / eps0 (9.13)</text>
    <text x="640" y="160">many charges:</text>
    <text x="640" y="175">phi = Q / eps0 (9.14)</text>
    <text x="640" y="190">Q = total charge</text>
    <text x="640" y="205">inside; the shape</text>
    <text x="640" y="220">does not matter</text>
    <text x="640" y="250">charged sphere,</text>
    <text x="640" y="265">outside: E = k q / r^2</text>
  </g>
  <g class="r">
    <text x="450" y="330">flux through a closed surface = charge enclosed / eps0;</text>
    <text x="450" y="344">outside, a charged sphere acts as a point charge</text>
  </g>
  <rect x="790" y="55" width="360" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Electric potential (9.5, 9.6, Fig. 9.16)</text>
  <rect x="815" y="100" width="150" height="8" fill="#f8c8b8" stroke="#d7322f"/>
  <rect x="815" y="222" width="150" height="8" fill="#bcdcf0" stroke="#1f6fb5"/>
  <path d="M830 112 L830 216" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M855 112 L855 216" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M930 112 L930 216" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M955 112 L955 216" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <circle cx="890" cy="165" r="6" fill="#f8c8b8" stroke="#d7322f"/>
  <path d="M890 158 L890 128" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M890 172 L890 202" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="800" y="100">B</text>
  <text class="l" x="800" y="232">A</text>
  <text class="r" x="896" y="138">F</text>
  <text class="r" x="896" y="198">qE</text>
  <g class="r">
    <text x="980" y="100">delta U = W_AB (9.16)</text>
    <text x="980" y="115">delta V = W_AB / q</text>
    <text x="980" y="130">  (9.17)</text>
    <text x="980" y="145">V = W / q (9.20)</text>
    <text x="980" y="160">1 V = 1 J C^-1</text>
    <text x="980" y="175">E = -delta V / delta d</text>
    <text x="980" y="190">  (9.23); V m^-1 = N C^-1</text>
    <text x="980" y="205">delta U = q delta V</text>
  </g>
  <g class="r">
    <text x="810" y="262">Ex 9.4: 12 V across plates 1.0 cm apart: E = 1200 V m^-1</text>
    <text x="810" y="276">Ex 9.5: an electron through 12 V: v = 2.1 x 10^6 m s^-1</text>
    <text x="810" y="290">electron volt: 1 eV = 1.6 x 10^-19 J (9.25); Ex 9.6: a 2e</text>
    <text x="810" y="304">charge through 3.0 V gains 6.0 eV = 9.6 x 10^-19 J</text>
    <text x="810" y="318">potential: work per unit charge from infinity; a scalar</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="320" y="403">Charged particles between plates (9.7, 9.8, Figs. 9.17, 9.18)</text>
  <rect x="110" y="420" width="300" height="8" fill="#f8c8b8" stroke="#d7322f"/>
  <rect x="110" y="552" width="300" height="8" fill="#bcdcf0" stroke="#1f6fb5"/>
