  <g class="r">
    <text x="920" y="430">Faraday (1836): a hollow</text>
    <text x="920" y="445">conductor's free electrons</text>
    <text x="920" y="460">rearrange on its surface so</text>
    <text x="920" y="475">the field inside is zero;</text>
    <text x="920" y="490">lines meet the surface at</text>
    <text x="920" y="505">right angles (no parallel</text>
    <text x="920" y="520">component at equilibrium)</text>
  </g>
  <g class="r">
    <text x="630" y="600">any excess charge resides on the surface of a conductor; only conductors, with</text>
    <text x="630" y="615">free electrons, can make a cage, not insulators; examples: cars in thunderstorms</text>
    <text x="630" y="630">(charge runs over the metal body to the ground), a microwave oven's metal body,</text>
    <text x="630" y="645">aircraft frames struck by lightning, metal boxes that shield circuits</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
