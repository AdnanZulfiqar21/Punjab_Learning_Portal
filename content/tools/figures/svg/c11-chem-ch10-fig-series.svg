<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure 10.9: standard electrode potentials for some oxidizing and reducing agents (original drawing after the textbook's Figure 10.9) -->
  <rect width="1200" height="800" fill="#ffffff"/>
  <path d="M230.0 650.0 L230.0 200.0 L244.0 200.0 L215.0 150.0 L186.0 200.0 L200.0 200.0 L200.0 650.0 Z" stroke="none" stroke-width="0" fill="#8a8a8a" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="70.0" y="30.0" width="300.0" height="96.0" rx="16" stroke="#e0201b" stroke-width="3.5" fill="#ffffff"/>
  <text x="220.0" y="70.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Strongest</tspan></text>
  <text x="220.0" y="108.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Oxidizing agent</tspan></text>
  <text x="40.0" y="650.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(-90 40.0 650.0)"><tspan>Oxidizing power is increasing</tspan></text>
  <text x="74.0" y="650.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(-90 74.0 650.0)"><tspan>for ions/molecules on left of</tspan></text>
  <text x="108.0" y="650.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(-90 108.0 650.0)"><tspan>equation</tspan></text>
  <text x="140.0" y="650.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 140.0 650.0)"><tspan>(Tendency to gain electrons is</tspan></text>
  <text x="174.0" y="650.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 174.0 650.0)"><tspan>increased)</tspan></text>
  <path d="M970.0 150.0 L970.0 600.0 L956.0 600.0 L985.0 650.0 L1014.0 600.0 L1000.0 600.0 L1000.0 150.0 Z" stroke="none" stroke-width="0" fill="#8a8a8a" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="830.0" y="676.0" width="300.0" height="96.0" rx="16" stroke="#e0201b" stroke-width="3.5" fill="#ffffff"/>
  <text x="980.0" y="716.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Strongest</tspan></text>
  <text x="980.0" y="754.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Reducing agent</tspan></text>
  <text x="1164.0" y="150.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(90 1164.0 150.0)"><tspan>Reducing power is increasing</tspan></text>
  <text x="1130.0" y="150.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(90 1130.0 150.0)"><tspan>for ions/molecules on right side</tspan></text>
  <text x="1102.0" y="150.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" transform="rotate(90 1102.0 150.0)"><tspan>of equation</tspan></text>
  <text x="1060.0" y="150.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(90 1060.0 150.0)"><tspan>(Tendency to lose electrons is</tspan></text>
  <text x="1026.0" y="150.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(90 1026.0 150.0)"><tspan>increased)</tspan></text>
  <text x="520.0" y="240.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>Cl</tspan><tspan dy="7.5" font-size="20.4">2</tspan><tspan dy="-7.5">  +  2e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="225.0" x2="616.0" y2="225.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="225.0" x2="604.0" y2="217.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="235.0" x2="616.0" y2="235.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="235.0" x2="544.0" y2="242.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="240.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>2Cl</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4">(aq)</tspan></text>
  <text x="770.0" y="240.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = +1.36 V</tspan></text>
  <text x="520.0" y="314.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>Ag</tspan><tspan dy="-11.4" font-size="20.4">+</tspan><tspan dy="11.4">(aq)  +  e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="299.0" x2="616.0" y2="299.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="299.0" x2="604.0" y2="291.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="309.0" x2="616.0" y2="309.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="309.0" x2="544.0" y2="316.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="314.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>Ag(s)</tspan></text>
  <text x="770.0" y="314.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = +0.80 V</tspan></text>
  <text x="520.0" y="388.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>Cu</tspan><tspan dy="-11.4" font-size="20.4">2+</tspan><tspan dy="11.4">(aq) + 2e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="373.0" x2="616.0" y2="373.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="373.0" x2="604.0" y2="365.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="383.0" x2="616.0" y2="383.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="383.0" x2="544.0" y2="390.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="388.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>Cu(s)</tspan></text>
  <text x="770.0" y="388.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = +0.34 V</tspan></text>
  <text x="520.0" y="462.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>H</tspan><tspan dy="-11.4" font-size="20.4">+</tspan><tspan dy="11.4">(aq)  +  e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="447.0" x2="616.0" y2="447.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="447.0" x2="604.0" y2="439.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="457.0" x2="616.0" y2="457.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="457.0" x2="544.0" y2="464.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="462.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>&#189;H</tspan><tspan dy="7.5" font-size="20.4">2</tspan><tspan dy="-7.5">(g)</tspan></text>
  <text x="770.0" y="462.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = +0.00 V</tspan></text>
  <text x="520.0" y="536.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>Zn</tspan><tspan dy="-11.4" font-size="20.4">2+</tspan><tspan dy="11.4">(aq) + 2e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="521.0" x2="616.0" y2="521.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="521.0" x2="604.0" y2="513.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="531.0" x2="616.0" y2="531.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="531.0" x2="544.0" y2="538.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="536.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>Zn(s)</tspan></text>
  <text x="770.0" y="536.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = &#8722;0.76 V</tspan></text>
  <text x="520.0" y="610.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan>Mg</tspan><tspan dy="-11.4" font-size="20.4">2+</tspan><tspan dy="11.4">(aq) + 2e</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="11.4"> </tspan></text>
  <line x1="532.0" y1="595.0" x2="616.0" y2="595.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="616.0" y1="595.0" x2="604.0" y2="587.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="605.0" x2="616.0" y2="605.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="532.0" y1="605.0" x2="544.0" y2="612.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630.0" y="610.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>Mg(s)</tspan></text>
  <text x="770.0" y="610.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="-11.4" font-size="20.4">o</tspan><tspan dy="11.4"> = &#8722;2.38 V</tspan></text>
</svg>
