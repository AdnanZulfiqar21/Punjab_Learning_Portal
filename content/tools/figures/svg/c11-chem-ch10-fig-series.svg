<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.9: half-reactions in order of standard electrode potential; oxidising power rises up the left, reducing power down the right. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Standard electrode potentials: oxidising and reducing power</text>
  <rect x="220.0" y="88.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="116.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Cl2 + 2e- = 2Cl-</text>
  <text x="660.0" y="116.0" font-size="16" fill="#d7322f" text-anchor="end" font-weight="700">E = +1.36 V</text>
  <rect x="220.0" y="144.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="172.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Ag+ + e- = Ag</text>
  <text x="660.0" y="172.0" font-size="16" fill="#d7322f" text-anchor="end" font-weight="700">E = +0.80 V</text>
  <rect x="220.0" y="200.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="228.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Cu2+ + 2e- = Cu</text>
  <text x="660.0" y="228.0" font-size="16" fill="#d7322f" text-anchor="end" font-weight="700">E = +0.34 V</text>
  <rect x="220.0" y="256.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="284.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">2H+ + 2e- = H2</text>
  <text x="660.0" y="284.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">E = 0.00 V</text>
  <rect x="220.0" y="312.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="340.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Zn2+ + 2e- = Zn</text>
  <text x="660.0" y="340.0" font-size="16" fill="#1f6fb5" text-anchor="end" font-weight="700">E = -0.76 V</text>
  <rect x="220.0" y="368.0" width="460.0" height="44.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="250.0" y="396.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Mg2+ + 2e- = Mg</text>
  <text x="660.0" y="396.0" font-size="16" fill="#1f6fb5" text-anchor="end" font-weight="700">E = -2.38 V</text>
  <line x1="160.0" y1="420.0" x2="160.0" y2="100.4" stroke="#d7322f" stroke-width="6" stroke-linecap="round"/>
  <path d="M160.0 90.0 L165.5 101.8 L154.5 101.8 Z" fill="#d7322f"/>
  <text x="130.0" y="255.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700" transform="rotate(-90 130.0 255.0)">oxidising power of the left side increases</text>
  <text x="160.0" y="76.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">strongest oxidising agent: Cl2</text>
  <line x1="740.0" y1="90.0" x2="740.0" y2="409.6" stroke="#1f6fb5" stroke-width="6" stroke-linecap="round"/>
  <path d="M740.0 420.0 L734.5 408.2 L745.5 408.2 Z" fill="#1f6fb5"/>
  <text x="770.0" y="255.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700" transform="rotate(90 770.0 255.0)">reducing power of the right side increases</text>
  <text x="740.0" y="448.0" font-size="13" fill="#1f6fb5" text-anchor="end" font-weight="700">strongest reducing agent: Mg</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
