<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>
  <!-- Original drawing after Figure 16.7 of the Class XII Biology textbook (positive feedback of oxytocin). -->
  <rect x="45" y="56.2" width="420" height="127.5" rx="10" stroke="#6b7280" stroke-width="2.5" fill="#ffffff"/>
  <text x="255" y="97.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Hypothalamus triggers the</text>
  <text x="255" y="129.8" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">release of oxytocin from</text>
  <text x="255" y="162.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">posterior pituitary.</text>
  <circle cx="443" cy="175.8" r="17" stroke="#3b3f8f" stroke-width="1" fill="#3b3f8f"/>
  <text x="443" y="183.8" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <rect x="535" y="56.2" width="420" height="127.5" rx="10" stroke="#6b7280" stroke-width="2.5" fill="#ffffff"/>
  <text x="745" y="97.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Oxytocin reaches uterus and</text>
  <text x="745" y="129.8" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">stimulates it to produce</text>
  <text x="745" y="162.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">more contractions.</text>
  <circle cx="555" cy="175.8" r="17" stroke="#3b3f8f" stroke-width="1" fill="#3b3f8f"/>
  <text x="555" y="183.8" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <rect x="45" y="336.2" width="420" height="127.5" rx="10" stroke="#6b7280" stroke-width="2.5" fill="#ffffff"/>
  <text x="255" y="377.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Uterus contracts and</text>
  <text x="255" y="409.8" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">sensory neurons send</text>
  <text x="255" y="442.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">signals to hypothalamus.</text>
  <circle cx="443" cy="455.8" r="17" stroke="#3b3f8f" stroke-width="1" fill="#3b3f8f"/>
  <text x="443" y="463.8" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <rect x="535" y="336.2" width="420" height="127.5" rx="10" stroke="#6b7280" stroke-width="2.5" fill="#ffffff"/>
  <text x="745" y="377.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Message of stronger</text>
  <text x="745" y="409.8" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">contractions</text>
  <text x="745" y="442.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">reaches hypothalamus.</text>
  <circle cx="555" cy="455.8" r="17" stroke="#3b3f8f" stroke-width="1" fill="#3b3f8f"/>
  <text x="555" y="463.8" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <rect x="280" y="604.2" width="440" height="127.5" rx="10" stroke="#6b7280" stroke-width="2.5" fill="#ffffff"/>
  <text x="500" y="645.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Hypothalamus triggers the</text>
  <text x="500" y="677.8" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">release of more oxytocin</text>
  <text x="500" y="710.2" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">from posterior pituitary.</text>
  <circle cx="500" cy="604.2" r="17" stroke="#3b3f8f" stroke-width="1" fill="#3b3f8f"/>
  <text x="500" y="612.2" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
  <path d="M140 342 Q150 260 190 208" stroke="#3b3f8f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M196 200 L193.1 223.8 L174.6 210.9 Z" fill="#3b3f8f"/>
  <path d="M468 106 L520 106" stroke="#3b3f8f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M534 106 L512.8 117.3 L512.8 94.7 Z" fill="#3b3f8f"/>
  <path d="M820 196 Q860 260 868 322" stroke="#3b3f8f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M870 336 L856.9 315.9 L879.4 313.9 Z" fill="#3b3f8f"/>
  <path d="M870 470 Q880 600 740 660" stroke="#3b3f8f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M726 664 L742.1 646.2 L749.8 667.3 Z" fill="#3b3f8f"/>
  <path d="M278 668 Q130 650 110 486" stroke="#3b3f8f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M108 472 L121.1 492.1 L98.6 494.1 Z" fill="#3b3f8f"/>
</svg>
