<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 21.14: the Earth with latitude lines at 0, 30 and 60 degrees north and south and three circulation loops in each hemisphere, the Hadley cell (0-30 degrees), the Ferrel cell (30-60 degrees) and the Polar cell (60-90 degrees). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Three atmospheric cells in each hemisphere (after Fig 21.14)</text>
  <circle cx="300.0" cy="255.0" r="170.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="215.0" y1="402.2" x2="385.0" y2="402.2" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="209.0" y="406.2" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">60S</text>
  <line x1="152.8" y1="340.0" x2="447.2" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="146.8" y="344.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">30S</text>
  <line x1="130.0" y1="255.0" x2="470.0" y2="255.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="124.0" y="259.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">0</text>
  <line x1="152.8" y1="170.0" x2="447.2" y2="170.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="146.8" y="174.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">30N</text>
  <line x1="215.0" y1="107.8" x2="385.0" y2="107.8" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="209.0" y="111.8" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">60N</text>
  <path d="M397.0 107.8 Q442.0 96.4 312.0 85.0" stroke="#7c3aed" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M312.0 85.0 L320.5 81.9 L319.8 89.5 Z" fill="#7c3aed"/>
  <text x="452.0" y="100.4" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">Polar cell</text>
  <path d="M397.0 402.2 Q442.0 413.6 312.0 425.0" stroke="#7c3aed" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M312.0 425.0 L319.8 420.5 L320.5 428.1 Z" fill="#7c3aed"/>
  <path d="M459.2 170.0 Q504.2 138.9 397.0 107.8" stroke="#0f7a62" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M397.0 107.8 L405.9 106.4 L403.8 113.7 Z" fill="#0f7a62"/>
  <text x="514.2" y="142.9" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">Ferrel cell</text>
  <path d="M459.2 340.0 Q504.2 371.1 397.0 402.2" stroke="#0f7a62" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M397.0 402.2 L403.8 396.3 L405.9 403.6 Z" fill="#0f7a62"/>
  <path d="M482.0 255.0 Q527.0 212.5 459.2 170.0" stroke="#d7322f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M459.2 170.0 L468.2 171.1 L464.1 177.6 Z" fill="#d7322f"/>
  <text x="537.0" y="216.5" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">Hadley cell</text>
  <path d="M482.0 255.0 Q527.0 297.5 459.2 340.0" stroke="#d7322f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M459.2 340.0 L464.1 332.4 L468.2 338.9 Z" fill="#d7322f"/>
  <text x="700.0" y="120.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">Warm air rises at the equator</text>
  <text x="700.0" y="141.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">and sinks near 30 degrees</text>
  <text x="700.0" y="162.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">(Hadley cell); air sinks at</text>
  <text x="700.0" y="183.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the poles and rises near</text>
  <text x="700.0" y="204.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">60 degrees (Polar cell);</text>
  <text x="700.0" y="225.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the Ferrel cell lies between.</text>
  <text x="700.0" y="246.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="700.0" y="267.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">The Coriolis effect turns the</text>
  <text x="700.0" y="288.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">surface flows into the trade</text>
  <text x="700.0" y="309.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">winds, westerlies and polar</text>
  <text x="700.0" y="330.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">easterlies.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
