<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <!-- Original diagram after Figures 8.12 to 8.15: meristems, the zones of primary growth in a root, secondary growth and annual rings. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .c{font-size:17px;fill:#4b5563;text-anchor:middle}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- plant with meristems -->
  <text class="h" x="200" y="40">Meristems</text>
  <path d="M200 420 V120" stroke="#0f7a62" stroke-width="10"/>
  <path d="M200 200 q-60 -40 -80 -10 q30 30 80 10 M200 280 q60 -40 80 -10 q-30 30 -80 10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <circle cx="200" cy="115" r="14" fill="#d98b2b"/>
  <path d="M200 420 q-40 60 -60 120 M200 420 q40 60 60 120 M200 420 v130" fill="none" stroke="#8a4b00" stroke-width="7"/>
  <circle cx="200" cy="552" r="12" fill="#d98b2b"/><circle cx="140" cy="542" r="10" fill="#d98b2b"/><circle cx="260" cy="542" r="10" fill="#d98b2b"/>
  <rect x="192" y="150" width="16" height="250" fill="#5b3fb5" opacity="0.5"/>
  <circle cx="200" cy="330" r="10" fill="#1f6fb5"/>
  <path class="lead" d="M214 115 L280 90"/><text class="k" x="285" y="85">Apical meristems</text><text class="s" x="285" y="108">tips of shoot and root;</text><text class="s" x="285" y="130">primary growth (length)</text>
  <path class="lead" d="M208 280 L300 300"/><text class="k" x="305" y="300">Lateral meristems</text><text class="s" x="305" y="323">vascular cambium and cork</text><text class="s" x="305" y="345">cambium; secondary growth (girth)</text>
  <path class="lead" d="M210 330 L300 400"/><text class="k" x="305" y="405">Intercalary meristems</text><text class="s" x="305" y="428">at the bases of internodes</text><text class="s" x="305" y="450">(grasses); temporary</text>
  <!-- root tip zones -->
  <text class="h" x="660" y="40">Primary growth in a root tip</text>
  <path d="M620 120 h80 v300 q0 60 -40 80 q-40 -20 -40 -80 z" fill="#fff4e2" stroke="#8a4b00" stroke-width="5"/>
  <path d="M580 500 q40 -40 80 0 q40 40 80 0 q-40 60 -80 50 q-40 10 -80 -50 z" fill="#c9b27a" stroke="#8a4b00" stroke-width="3"/>
  <g stroke="#8a4b00" stroke-width="2"><path d="M620 180 h80 M620 300 h80"/></g>
  <g fill="#d98b2b"><circle cx="640" cy="440" r="4"/><circle cx="660" cy="455" r="4"/><circle cx="680" cy="440" r="4"/><circle cx="650" cy="470" r="4"/><circle cx="670" cy="470" r="4"/></g>
  <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="630" y="320" width="20" height="40"/><rect x="665" y="330" width="20" height="40"/><rect x="640" y="380" width="20" height="36"/></g>
  <g stroke="#0f7a62" stroke-width="3"><path d="M620 200 l-25 10 M620 240 l-25 10 M700 220 l25 10 M700 260 l25 10"/></g>
  <text class="k" x="740" y="150">Zone of differentiation</text><text class="s" x="740" y="173">cells specialise; root hairs</text>
  <text class="k" x="740" y="250">Zone of elongation</text><text class="s" x="740" y="273">cells take in water, vacuolate</text><text class="s" x="740" y="295">and lengthen</text>
  <text class="k" x="740" y="440">Zone of cell division</text><text class="s" x="740" y="463">small, non-vacuolated cells of</text><text class="s" x="740" y="485">the apical meristem</text>
  <text class="s" x="660" y="590" text-anchor="middle">root cap</text>
  <!-- secondary growth and rings -->
  <text class="h" x="660" y="640">Secondary growth</text>
  <g fill="none" stroke-width="3">
    <circle cx="500" cy="730" r="55" fill="#fff4e2" stroke="#8a4b00"/>
    <circle cx="500" cy="730" r="40" fill="none" stroke="#c9b27a" stroke-width="8"/><circle cx="500" cy="730" r="28" fill="none" stroke="#8a4b00" stroke-width="3"/><circle cx="500" cy="730" r="18" fill="none" stroke="#c9b27a" stroke-width="7"/>
    <circle cx="500" cy="730" r="48" stroke="#0f7a62" stroke-width="3"/>
  </g>
  <text class="c" x="500" y="800" style="font-size:15px">annual rings: pale wide spring</text><text class="c" x="500" y="820" style="font-size:15px">wood, dark narrow autumn wood</text>
  <text class="k" x="600" y="690">vascular cambium</text><text class="s" x="600" y="712">outer side: secondary phloem;</text><text class="s" x="600" y="734">inner side: secondary xylem (wood)</text>
  <text class="k" x="880" y="690">cork cambium</text><text class="s" x="880" y="712">makes cork, replacing the epidermis;</text><text class="s" x="880" y="734">phloem + cork cambium + cork = bark</text>
  <text class="s" x="600" y="770">Dendrochronology dates and reads tree rings;</text><text class="s" x="600" y="792">the change from autumn to the next spring wood is abrupt.</text>
</svg>
