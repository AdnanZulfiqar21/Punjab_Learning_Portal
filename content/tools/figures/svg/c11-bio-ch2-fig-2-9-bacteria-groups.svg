<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 2.9 (C11-BIO, PDF p43): flat drawing after the eight printed micrographs in two columns and four rows, each named below in italics (Mycoplasmas upright): Escherichia coli (orange rods on dark red), Anabaena (beaded green filaments on grey), Mycoplasmas (round orange cells of different sizes), Treponema (pink spiral cells on purple), Pseudomonas (a pink rod with a tuft of flagella at one end on purple), Mycobacterium tuberculosis (thick yellow-white rods), Azotobacter (blue oval rods on dark blue) and Nitrosomonas (two dividing blue oval cells with inner membranes on pale blue). No photograph is reproduced. -->
  <rect width="900" height="1240" fill="#ffffff"/>
  <defs>
    <clipPath id="a"><rect x="10" y="10" width="430" height="250"/></clipPath>
    <clipPath id="b"><rect x="460" y="10" width="430" height="250"/></clipPath>
    <clipPath id="c"><rect x="10" y="320" width="430" height="250"/></clipPath>
    <clipPath id="d"><rect x="460" y="320" width="430" height="250"/></clipPath>
    <clipPath id="e"><rect x="10" y="630" width="430" height="250"/></clipPath>
    <clipPath id="f"><rect x="460" y="630" width="430" height="250"/></clipPath>
    <clipPath id="g"><rect x="10" y="940" width="430" height="250"/></clipPath>
    <clipPath id="h"><rect x="460" y="940" width="430" height="250"/></clipPath>
  </defs>
  <!-- E. coli -->
  <g clip-path="url(#a)">
    <rect x="10" y="10" width="430" height="250" fill="#5a1a0e"/>
    <g fill="#8a2a14"><circle cx="60" cy="200" r="50"/><circle cx="380" cy="60" r="60"/><circle cx="250" cy="230" r="40"/></g>
    <g fill="#f08a30" stroke="#ffc070" stroke-width="3">
      <rect x="80" y="40" width="70" height="22" rx="11" transform="rotate(40 115 51)"/>
      <rect x="200" y="50" width="80" height="22" rx="11" transform="rotate(-15 240 61)"/>
      <rect x="60" y="140" width="80" height="22" rx="11" transform="rotate(-5 100 151)"/>
      <rect x="170" y="150" width="80" height="22" rx="11" transform="rotate(5 210 161)"/>
      <rect x="290" y="120" width="80" height="22" rx="11" transform="rotate(50 330 131)"/>
      <rect x="320" y="190" width="70" height="22" rx="11" transform="rotate(-70 355 201)"/>
      <rect x="130" y="95" width="60" height="20" rx="10" transform="rotate(60 160 105)"/>
    </g>
  </g>
  <!-- Anabaena -->
  <g clip-path="url(#b)">
    <rect x="460" y="10" width="430" height="250" fill="#a8aca8"/>
    <g>
      <g id="chainA" fill="#5a9a6a" stroke="#2e6a3e" stroke-width="2"><circle cx="470" cy="60" r="9"/><circle cx="488" cy="56" r="9"/><circle cx="506" cy="53" r="9"/><circle cx="524" cy="52" r="9"/><circle cx="542" cy="53" r="9"/><circle cx="560" cy="56" r="9"/><circle cx="578" cy="60" r="9"/><circle cx="596" cy="65" r="9"/><circle cx="614" cy="70" r="9"/><circle cx="632" cy="74" r="9"/><circle cx="650" cy="76" r="9"/><circle cx="668" cy="76" r="9"/><circle cx="686" cy="74" r="9"/><circle cx="704" cy="70" r="9"/><circle cx="722" cy="65" r="9"/><circle cx="740" cy="60" r="9"/><circle cx="758" cy="56" r="9"/><circle cx="776" cy="53" r="9"/><circle cx="794" cy="52" r="9"/><circle cx="812" cy="53" r="9"/><circle cx="830" cy="56" r="9"/><circle cx="848" cy="60" r="9"/><circle cx="866" cy="65" r="9"/><circle cx="884" cy="70" r="9"/></g>
    </g>
    <use href="#chainA" transform="translate(0 70)"/>
    <use href="#chainA" transform="translate(-20 140)"/>
    <use href="#chainA" transform="translate(10 200)"/>
    <circle cx="650" cy="146" r="13" fill="#c8d8a0" stroke="#6a8a40" stroke-width="2"/>
  </g>
  <!-- Mycoplasmas -->
  <g clip-path="url(#c)">
    <rect x="10" y="320" width="430" height="250" fill="#8a3a10"/>
    <g fill="#f07a2a" stroke="#ffd070" stroke-width="3">
      <circle cx="60" cy="360" r="24"/><circle cx="130" cy="400" r="34"/><circle cx="220" cy="370" r="20"/><circle cx="300" cy="400" r="30"/><circle cx="390" cy="370" r="26"/><circle cx="80" cy="470" r="30"/><circle cx="180" cy="480" r="22"/><circle cx="260" cy="500" r="36"/><circle cx="360" cy="480" r="24"/><circle cx="40" cy="550" r="20"/><circle cx="140" cy="550" r="26"/><circle cx="350" cy="555" r="22"/><circle cx="420" cy="530" r="18"/>
    </g>
    <path d="M30 400 L50 470" stroke="#f07a2a" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Treponema -->
  <g clip-path="url(#d)">
    <rect x="460" y="320" width="430" height="250" fill="#5a2a6a"/>
    <g fill="none" stroke="#f0a8c0" stroke-width="9" stroke-linecap="round">
      <path d="M520 450 C530 430 545 430 550 450 C555 470 570 470 575 450 C580 430 595 430 600 450 C605 470 620 470 625 450"/>
      <path d="M650 470 C660 450 675 450 680 470 C685 490 700 490 705 470 C710 450 725 450 730 470 C735 490 750 490 755 470 C760 450 775 450 780 470"/>
      <path d="M560 370 C568 355 580 355 585 370 C590 385 602 385 607 370 C612 355 624 355 629 370"/>
      <path d="M760 380 C768 365 780 365 785 380 C790 395 802 395 807 380 C812 365 824 365 829 380"/>
      <path d="M520 540 C528 525 540 525 545 540 C550 555 562 555 567 540"/>
      <path d="M760 540 C768 525 780 525 785 540 C790 555 802 555 807 540 C812 525 824 525 829 540"/>
    </g>
  </g>
  <!-- Pseudomonas -->
  <g clip-path="url(#e)">
    <rect x="10" y="630" width="430" height="250" fill="#3a2a4a"/>
    <g stroke="#e8e0f0" stroke-width="1.5" fill="none">
      <path d="M150 790 C110 800 80 790 40 810 M150 795 C110 820 80 840 40 860 M152 785 C110 770 80 760 30 770 M155 800 C130 840 100 860 70 880 M150 790 C100 750 80 720 40 700 M150 800 C120 820 60 830 20 840"/>
    </g>
    <rect x="145" y="720" width="230" height="70" rx="35" fill="#f0889a" stroke="#ffd0d8" stroke-width="4" transform="rotate(-30 260 755)"/>
    <g fill="#ffd0d8"><circle cx="220" cy="770" r="4"/><circle cx="260" cy="750" r="4"/><circle cx="300" cy="730" r="4"/><circle cx="240" cy="745" r="3"/><circle cx="280" cy="770" r="3"/></g>
  </g>
  <!-- Mycobacterium tuberculosis -->
  <g clip-path="url(#f)">
    <rect x="460" y="630" width="430" height="250" fill="#2a2a20"/>
    <g fill="#f2e2b0" stroke="#c8a040" stroke-width="4">
      <rect x="480" y="640" width="50" height="200" rx="25" transform="rotate(-20 505 740)"/>
      <rect x="540" y="620" width="55" height="230" rx="27" transform="rotate(10 567 735)"/>
      <rect x="610" y="650" width="50" height="210" rx="25" transform="rotate(-35 635 755)"/>
      <rect x="700" y="610" width="55" height="220" rx="27" transform="rotate(25 727 720)"/>
      <rect x="780" y="660" width="50" height="200" rx="25" transform="rotate(-10 805 760)"/>
      <rect x="640" y="760" width="220" height="50" rx="25" transform="rotate(-8 750 785)"/>
    </g>
    <circle cx="860" cy="820" r="14" fill="#f0c030"/>
  </g>
  <!-- Azotobacter -->
  <g clip-path="url(#g)">
    <rect x="10" y="940" width="430" height="250" fill="#0e1e4a"/>
    <g fill="#5a86d0" stroke="#b8d0f8" stroke-width="3">
      <rect x="20" y="960" width="160" height="60" rx="30" transform="rotate(20 100 990)"/>
      <rect x="150" y="1000" width="180" height="65" rx="32" transform="rotate(-10 240 1032)"/>
      <rect x="290" y="960" width="140" height="60" rx="30" transform="rotate(30 360 990)"/>
      <rect x="40" y="1100" width="190" height="70" rx="35" transform="rotate(-5 135 1135)"/>
      <rect x="260" y="1100" width="170" height="65" rx="32" transform="rotate(15 345 1132)"/>
    </g>
    <ellipse cx="330" cy="975" rx="60" ry="30" fill="#e8f0ff" opacity="0.8"/>
  </g>
  <!-- Nitrosomonas -->
  <g clip-path="url(#h)">
    <rect x="460" y="940" width="430" height="250" fill="#dfe4f4"/>
    <g fill="#4a58b0" stroke="#1e2a70" stroke-width="4">
      <ellipse cx="600" cy="1050" rx="120" ry="80" transform="rotate(-20 600 1050)"/>
      <ellipse cx="770" cy="1100" rx="110" ry="78" transform="rotate(-20 770 1100)"/>
    </g>
    <g fill="none" stroke="#c0c8f0" stroke-width="3">
      <ellipse cx="600" cy="1050" rx="95" ry="60" transform="rotate(-20 600 1050)"/>
      <ellipse cx="600" cy="1050" rx="75" ry="45" transform="rotate(-20 600 1050)"/>
      <ellipse cx="770" cy="1100" rx="88" ry="58" transform="rotate(-20 770 1100)"/>
      <ellipse cx="770" cy="1100" rx="68" ry="42" transform="rotate(-20 770 1100)"/>
    </g>
    <circle cx="610" cy="1045" r="14" fill="#101030"/><circle cx="765" cy="1100" r="14" fill="#101030"/>
  </g>
  <g font-size="26" fill="#1a1a1a" text-anchor="middle">
    <text x="225" y="296" font-style="italic">Escherichia coli</text>
    <text x="675" y="296" font-style="italic">Anabaena</text>
    <text x="225" y="606">Mycoplasmas</text>
    <text x="675" y="606" font-style="italic">Treponema</text>
    <text x="225" y="916" font-style="italic">Pseudomonas</text>
    <text x="675" y="916" font-style="italic">Mycobacterium tuberculosis</text>
    <text x="225" y="1226" font-style="italic">Azotobacter</text>
    <text x="675" y="1226" font-style="italic">Nitrosomonas</text>
  </g>
</svg>
