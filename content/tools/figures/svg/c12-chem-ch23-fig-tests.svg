  <text x="450.0" y="385.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Tollens': AgNO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 3NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">OH -&gt; [Ag(NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">]OH + NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">NO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O; Ag</tspan><tspan dy="-5.9" font-size="9.8">+</tspan><tspan dy="5.9"> is reduced to silver</tspan></text>
  <text x="450.0" y="415.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Fehling's: RCHO + 2Cu(OH)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + NaOH -&gt; RCOONa + Cu</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + 3H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="450.0" y="445.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">iodoform: CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 3I</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4NaOH -&gt; CHI</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COONa + 3NaI + 3H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="450.0" y="472.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">aldehydes are easily oxidised; ketones are not oxidised by these mild reagents</text>
