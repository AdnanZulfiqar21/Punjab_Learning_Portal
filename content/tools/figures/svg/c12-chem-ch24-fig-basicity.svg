<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="590" fill="#ffffff"/>
  <!-- Original diagram for topic 24.3.1 and Figure 24.1: ammonia, ethanamine and phenylamine accept protons from water; pKb ethanamine 3.29 &lt; ammonia 4.75 &lt; phenylamine 9.38; in phenylamine the nitrogen lone pair overlaps with the ring's delocalised pi system. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Basicity of amines</text>
  <rect x="15.0" y="55.0" width="870.0" height="165.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">amines accept a proton on the nitrogen lone pair</text>
  <text x="450.0" y="122.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O &lt;=&gt; NH</tspan><tspan dy="5.4" font-size="11.9">4</tspan><tspan dy="-12.6" font-size="11.9">+</tspan><tspan dy="7.1"> + OH</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="450.0" y="155.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O &lt;=&gt; CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-12.6" font-size="11.9">+</tspan><tspan dy="7.1"> + OH</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="450.0" y="188.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O &lt;=&gt; C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-12.6" font-size="11.9">+</tspan><tspan dy="7.1"> + OH</tspan><tspan dy="-7.1" font-size="11.9">-</tspan><tspan dy="7.1"> (very little)</tspan></text>
  <rect x="15.0" y="230.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="260.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">pKb (book's Table 24.1)</text>
  <text x="140.0" y="300.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">ethanamine</text>
  <rect x="152.0" y="281.0" width="230.7" height="28.0" rx="5" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <text x="390.7" y="300.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">3.29</text>
  <text x="140.0" y="370.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">ammonia</text>
  <rect x="152.0" y="351.0" width="184.0" height="28.0" rx="5" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="344.0" y="370.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">4.75</text>
  <text x="140.0" y="440.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">phenylamine</text>
  <rect x="152.0" y="421.0" width="35.8" height="28.0" rx="5" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="195.8" y="440.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">9.38</text>
  <text x="227.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">longer bar = stronger base (smaller pKb)</text>
  <text x="227.0" y="525.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ethanamine &gt; ammonia &gt; phenylamine</text>
  <rect x="460.0" y="230.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="260.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">why phenylamine is a weak base</text>
  <ellipse cx="600.0" cy="359.0" rx="86.0" ry="26.0" stroke="#0f7a62" stroke-width="2" fill="#86efac"/>
  <ellipse cx="600.0" cy="359.0" rx="46.0" ry="10.0" stroke="#0f7a62" stroke-width="2" fill="#f7f9fc"/>
  <ellipse cx="600.0" cy="411.0" rx="86.0" ry="26.0" stroke="#0f7a62" stroke-width="2" fill="#86efac"/>
  <ellipse cx="600.0" cy="411.0" rx="46.0" ry="10.0" stroke="#0f7a62" stroke-width="2" fill="#f7f9fc"/>
  <path d="M670.0 385.0 L635.0 411.0 L565.0 411.0 L530.0 385.0 L565.0 359.0 L635.0 359.0 Z" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="670.0" y1="385.0" x2="702.0" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="710.0" cy="359.0" rx="11.0" ry="24.0" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <ellipse cx="710.0" cy="411.0" rx="11.0" ry="24.0" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <text x="710.0" y="390.9" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <line x1="718.0" y1="378.0" x2="742.0" y2="357.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="362.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">H</text>
  <line x1="718.0" y1="392.0" x2="742.0" y2="413.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="418.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">H</text>
  <text x="672.0" y="480.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the N lone pair is in a p orbital that</text>
  <text x="672.0" y="497.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">overlaps with the ring's pi system,</text>
  <text x="672.0" y="514.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">so it is less free to take a proton</text>
  <text x="450.0" y="581" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
