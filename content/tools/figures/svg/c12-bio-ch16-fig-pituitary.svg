<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 16.2 and 16.3: neurosecretory cells of the hypothalamus linked to the posterior pituitary by axons and to the anterior pituitary by blood vessels, and the pituitary hormones with their targets. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The hypothalamus, the pituitary and its targets</text>
  <rect x="15.0" y="55.0" width="400.0" height="550.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="215.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">hypothalamus and pituitary</text>
  <path d="M40 110 L390 110 L390 230 L40 230 Z" stroke="#9d174d" stroke-width="2" fill="#fce7f3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="55.0" y="135.0" font-size="15" fill="#9d174d" text-anchor="start" font-weight="700">hypothalamus</text>
  <text x="380.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">neurosecretory cells</text>
  <circle cx="110.0" cy="175.0" r="12.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <path d="M110 187 L120 320 L150 420" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160.0" cy="175.0" r="12.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <path d="M160 187 L170 320 L200 420" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="270.0" cy="175.0" r="12.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <line x1="270.0" y1="187.0" x2="240.0" y2="236.0" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="320.0" cy="175.0" r="12.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <line x1="320.0" y1="187.0" x2="290.0" y2="236.0" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190 230 L240 230 L232 300 L198 300 Z" stroke="#78716c" stroke-width="2" fill="#e7e5e4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="30.0" y="300.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">infundibulum (stalk)</text>
  <line x1="150.0" y1="296.0" x2="198.0" y2="280.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <path d="M220 240 C300 260 300 300 270 330" stroke="#d7322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M240 245 C320 270 320 310 290 340" stroke="#d7322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330.0" y="262.0" font-size="11" fill="#d7322f" text-anchor="start" font-weight="700">blood</text>
  <text x="330.0" y="276.0" font-size="11" fill="#d7322f" text-anchor="start" font-weight="700">vessels</text>
  <ellipse cx="150.0" cy="420.0" rx="70.0" ry="60.0" stroke="#7c3aed" stroke-width="2.5" fill="#ede9fe"/>
  <ellipse cx="290.0" cy="410.0" rx="85.0" ry="70.0" stroke="#d98b2b" stroke-width="2.5" fill="#ffedd5"/>
  <rect x="208.0" y="360.0" width="12.0" height="110.0" rx="4" stroke="#78716c" stroke-width="1.5" fill="#d6d3d1"/>
  <text x="150.0" y="416.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">posterior</text>
  <text x="150.0" y="432.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">pituitary</text>
  <text x="295.0" y="406.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">anterior</text>
  <text x="295.0" y="422.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">pituitary</text>
  <text x="214.0" y="498.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">intermediate (MSH)</text>
  <text x="30.0" y="530.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Posterior: axons bring oxytocin and ADH made</text>
  <text x="30.0" y="547.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">in the hypothalamus; it stores and releases them.</text>
  <text x="30.0" y="564.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Anterior: releasing or inhibiting hormones arrive</text>
  <text x="30.0" y="581.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">by blood vessels; it makes its own hormones.</text>
  <rect x="430.0" y="55.0" width="455.0" height="550.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="657.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">hormones and their targets</text>
  <rect x="445.0" y="92.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="115.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">GH</text>
  <line x1="537.0" y1="110.0" x2="558.6" y2="110.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 110.0 L557.7 113.4 L557.7 106.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="115.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">muscles, bones, other tissues: growth</text>
  <rect x="445.0" y="146.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="169.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">ACTH</text>
  <line x1="537.0" y1="164.0" x2="558.6" y2="164.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 164.0 L557.7 167.4 L557.7 160.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="169.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">adrenal cortex: corticosteroids</text>
  <rect x="445.0" y="200.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="223.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">TSH</text>
  <line x1="537.0" y1="218.0" x2="558.6" y2="218.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 218.0 L557.7 221.4 L557.7 214.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="223.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">thyroid: thyroxine</text>
  <rect x="445.0" y="254.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="277.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">LH</text>
  <line x1="537.0" y1="272.0" x2="558.6" y2="272.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 272.0 L557.7 275.4 L557.7 268.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="270.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">ovaries: estrogen, progesterone, ovulation</text>
  <text x="572.0" y="286.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">testes: testosterone</text>
  <rect x="445.0" y="308.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="331.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">FSH</text>
  <line x1="537.0" y1="326.0" x2="558.6" y2="326.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 326.0 L557.7 329.4 L557.7 322.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="324.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">ovarian follicles</text>
  <text x="572.0" y="340.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">sperm development</text>
  <rect x="445.0" y="362.0" width="90.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="385.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">prolactin</text>
  <line x1="537.0" y1="380.0" x2="558.6" y2="380.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 380.0 L557.7 383.4 L557.7 376.6 Z" fill="#d98b2b"/>
  <text x="572.0" y="385.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">mammary glands: milk production</text>
  <rect x="445.0" y="416.0" width="90.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="439.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">ADH</text>
  <line x1="537.0" y1="434.0" x2="558.6" y2="434.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 434.0 L557.7 437.4 L557.7 430.6 Z" fill="#7c3aed"/>
  <text x="572.0" y="439.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">kidneys: water retention</text>
  <rect x="445.0" y="470.0" width="90.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="493.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">oxytocin</text>
  <line x1="537.0" y1="488.0" x2="558.6" y2="488.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 488.0 L557.7 491.4 L557.7 484.6 Z" fill="#7c3aed"/>
  <text x="572.0" y="486.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">uterus: contractions</text>
  <text x="572.0" y="502.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">mammary glands: milk ejection</text>
  <rect x="445.0" y="524.0" width="90.0" height="36.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <text x="490.0" y="547.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">MSH</text>
  <line x1="537.0" y1="542.0" x2="558.6" y2="542.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M565.0 542.0 L557.7 545.4 L557.7 538.6 Z" fill="#4b5563"/>
  <text x="572.0" y="547.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">melanocytes of skin and hair: melanin</text>
  <text x="657.0" y="590.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">orange: anterior; purple: posterior; grey: intermediate</text>
  <text x="450.0" y="611" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
