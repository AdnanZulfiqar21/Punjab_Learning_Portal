<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original redraw after Figure 6.1: enthalpy diagrams of an exothermic reaction (delta H negative) and an endothermic reaction (delta H positive). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Enthalpy diagrams</text>
  <line x1="90.0" y1="380.0" x2="90.0" y2="90.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M90.0 80.0 L95.5 91.8 L84.5 91.8 Z" fill="#14181f"/>
  <line x1="90.0" y1="380.0" x2="440.0" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="80.0" y="90.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">H</text>
  <text x="265.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">progress of reaction</text>
  <line x1="120.0" y1="140.0" x2="230.0" y2="140.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="175.0" y="130.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">reactants</text>
  <line x1="270.0" y1="300.0" x2="400.0" y2="300.0" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <text x="335.0" y="290.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">products</text>
  <line x1="250.0" y1="140.0" x2="250.0" y2="289.6" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M250.0 300.0 L244.5 288.2 L255.5 288.2 Z" fill="#d7322f"/>
  <text x="258.0" y="220.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">delta H</text>
  <text x="265.0" y="60.0" font-size="1" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <line x1="520.0" y1="380.0" x2="520.0" y2="90.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M520.0 80.0 L525.5 91.8 L514.5 91.8 Z" fill="#14181f"/>
  <line x1="520.0" y1="380.0" x2="870.0" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="510.0" y="90.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">H</text>
  <text x="695.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">progress of reaction</text>
  <line x1="550.0" y1="300.0" x2="660.0" y2="300.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="605.0" y="290.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">reactants</text>
  <line x1="700.0" y1="140.0" x2="830.0" y2="140.0" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <text x="765.0" y="130.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">products</text>
  <line x1="680.0" y1="300.0" x2="680.0" y2="150.4" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M680.0 140.0 L685.5 151.8 L674.5 151.8 Z" fill="#d7322f"/>
  <text x="688.0" y="220.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">delta H</text>
  <text x="695.0" y="60.0" font-size="1" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="255.0" y="60.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(a) exothermic: H(products) &lt; H(reactants), delta H negative</text>
  <text x="690.0" y="60.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(b) endothermic: H(products) &gt; H(reactants), delta H positive</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
