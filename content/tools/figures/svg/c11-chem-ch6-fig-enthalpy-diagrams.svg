  <text x="775.0" y="150.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan>H</tspan><tspan dy="7.5" font-size="20.4">P</tspan><tspan dy="-7.5"> </tspan></text>
  <text x="880.0" y="346.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>reactants</tspan></text>
  <text x="1065.0" y="126.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>products</tspan></text>
  <text x="991.0" y="205.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>&#8757; H</tspan><tspan dy="7.5" font-size="20.4">R</tspan><tspan dy="-7.5"> &lt; H</tspan><tspan dy="7.5" font-size="20.4">P</tspan><tspan dy="-7.5"> </tspan></text>
  <text x="991.0" y="249.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>&#8756; &#916;H = positive</tspan></text>
  <text x="690.0" y="300.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Enthalpy</tspan></text>
  <line x1="761.0" y1="312.0" x2="761.0" y2="272.4" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
