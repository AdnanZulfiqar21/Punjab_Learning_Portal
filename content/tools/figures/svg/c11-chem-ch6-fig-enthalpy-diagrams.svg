<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Times New Roman, Georgia, serif">
  <!-- Figure 6.1 Enthalpy diagram of (a) exothermic and (b) endothermic reaction (original drawing after the textbook's Figure 6.1) -->
