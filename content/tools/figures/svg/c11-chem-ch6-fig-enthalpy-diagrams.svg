  <text x="391.0" y="249.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>&#8756; &#916;H = negative</tspan></text>
  <text x="90.0" y="300.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Enthalpy</tspan></text>
  <text x="380.0" y="520.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Progress of Reaction</tspan></text>
  <text x="380.0" y="565.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>(a)</tspan></text>
