  <text x="175.0" y="370.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan>H</tspan><tspan dy="7.5" font-size="20.4">P</tspan><tspan dy="-7.5"> </tspan></text>
  <text x="280.0" y="126.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>reactants</tspan></text>
  <text x="465.0" y="346.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>products</tspan></text>
