<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>
  <!-- Original E scale for topic 18.10: MnO4-/Mn2+ +1.52 V, Fe3+/Fe2+ +0.77 V, I2/I- +0.54 V and Cu2+/Cu+ +0.15 V, with E cell = E(reduction) - E(oxidation) for MnO4- and Fe2+ (+0.75 V) and Cu2+ and I- (-0.39 V). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Standard electrode potentials used in this chapter</text>
  <line x1="150.0" y1="440.0" x2="150.0" y2="79.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="144.0" y1="403.0" x2="150.0" y2="403.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="408.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">0.0 V</text>
  <line x1="144.0" y1="310.5" x2="150.0" y2="310.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="315.5" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">+0.5 V</text>
  <line x1="144.0" y1="218.0" x2="150.0" y2="218.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="223.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">+1.0 V</text>
  <line x1="144.0" y1="125.5" x2="150.0" y2="125.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="130.5" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">+1.5 V</text>
  <circle cx="150.0" cy="121.8" r="5.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <line x1="155.0" y1="121.8" x2="175.0" y2="121.8" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="185.0" y="127.8" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">MnO</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-11.8" font-size="11.2">-</tspan><tspan dy="6.7"> + 8H</tspan><tspan dy="-6.7" font-size="11.2">+</tspan><tspan dy="6.7"> + 5e</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> -&gt; Mn</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan><tspan dy="6.7"> + 4H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O</tspan></text>
  <text x="560.0" y="127.8" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">E = +1.52 V</text>
  <circle cx="150.0" cy="260.6" r="5.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <line x1="155.0" y1="260.6" x2="175.0" y2="260.6" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="185.0" y="266.6" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Fe</tspan><tspan dy="-6.7" font-size="11.2">3+</tspan><tspan dy="6.7"> + e</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> -&gt; Fe</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan></text>
  <text x="560.0" y="266.6" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">E = +0.77 V</text>
  <circle cx="150.0" cy="303.1" r="5.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <line x1="155.0" y1="303.1" x2="175.0" y2="303.1" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="185.0" y="309.1" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">1/2 I</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + e</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> -&gt; I</tspan><tspan dy="-6.7" font-size="11.2">-</tspan></text>
  <text x="560.0" y="309.1" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">E = +0.54 V</text>
  <circle cx="150.0" cy="375.2" r="5.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <line x1="155.0" y1="375.2" x2="175.0" y2="375.2" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="185.0" y="381.2" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Cu</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan><tspan dy="6.7"> + e</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> -&gt; Cu</tspan><tspan dy="-6.7" font-size="11.2">+</tspan></text>
  <text x="560.0" y="381.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">E = +0.15 V</text>
  <line x1="70.0" y1="300.0" x2="70.0" y2="118.8" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70.0 110.0 L74.6 120.0 L65.4 120.0 Z" fill="#1f6fb5"/>
  <text x="58.0" y="205.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700" transform="rotate(-90 58.0 205.0)">stronger oxidising agent on the left</text>
  <rect x="185.0" y="440.0" width="690.0" height="70.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="530.0" y="468.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">MnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-9.6" font-size="9.1">-</tspan><tspan dy="5.5"> with Fe</tspan><tspan dy="-5.5" font-size="9.1">2+</tspan><tspan dy="5.5">: E cell = 1.52 - 0.77 = +0.75 V, so the reaction is feasible</tspan></text>
  <text x="530.0" y="494.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cu</tspan><tspan dy="-5.5" font-size="9.1">2+</tspan><tspan dy="5.5"> with I</tspan><tspan dy="-5.5" font-size="9.1">-</tspan><tspan dy="5.5">: E cell = 0.15 - 0.54 = -0.39 V, yet CuI precipitating drives it forward</tspan></text>
  <text x="450.0" y="536" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
