<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <!-- Original diagram for topic 23.6: delocalisation of the charge over both oxygens of ethanoate; the book's Ka and pKa values (RCOOH 5, ArOH 10, HOH 14, ROH 16); and pKa of ethanoic (4.74), chloro- (2.86), dichloro- (1.26) and trichloroethanoic acid (0.64). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Why carboxylic acids are acidic</text>
  <rect x="15.0" y="55.0" width="870.0" height="195.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the ethanoate ion is stabilised by delocalisation</text>
  <text x="250.0" y="156.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="240.0" y1="150.0" x2="200.0" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="168.0" y="155.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">C</tspan></text>
  <line x1="254.9" y1="140.8" x2="280.8" y2="114.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="259.2" y1="145.1" x2="285.1" y2="119.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="257.1" y1="157.1" x2="282.9" y2="182.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="302.0" y="106.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="304.0" y="205.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="630.0" y="156.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="620.0" y1="150.0" x2="580.0" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="548.0" y="155.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">C</tspan></text>
  <line x1="637.1" y1="142.9" x2="662.9" y2="117.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="639.2" y1="154.9" x2="665.1" y2="180.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="634.9" y1="159.2" x2="660.8" y2="185.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="682.0" y="106.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="684.0" y="205.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="353.0" y1="150.0" x2="517.0" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M525.0 150.0 L515.9 154.2 L515.9 145.8 Z" fill="#14181f"/>
  <path d="M345.0 150.0 L354.1 145.8 L354.1 154.2 Z" fill="#14181f"/>
  <text x="450.0" y="238.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the negative charge is shared equally by the two oxygens</text>
  <rect x="15.0" y="260.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="290.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">Ka and pKa (book's Table 23.1)</text>
  <text x="110.0" y="355.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">RCOOH</tspan></text>
  <text x="240.0" y="355.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">10</tspan><tspan dy="-6.7" font-size="11.2">-5</tspan></text>
  <text x="360.0" y="360.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <text x="110.0" y="403.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ArOH</tspan></text>
  <text x="240.0" y="403.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">10</tspan><tspan dy="-6.7" font-size="11.2">-10</tspan></text>
  <text x="360.0" y="408.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">10</text>
  <text x="110.0" y="451.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOH</tspan></text>
  <text x="240.0" y="451.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">10</tspan><tspan dy="-6.7" font-size="11.2">-14</tspan></text>
  <text x="360.0" y="456.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">14</text>
  <text x="110.0" y="499.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ROH</tspan></text>
  <text x="240.0" y="499.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">10</tspan><tspan dy="-6.7" font-size="11.2">-16</tspan></text>
  <text x="360.0" y="504.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">16</text>
  <text x="240.0" y="318.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">Ka</text>
  <text x="360.0" y="318.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">pKa</text>
  <text x="227.0" y="560.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">pKa = -log Ka: lower pKa, stronger acid</text>
  <rect x="460.0" y="260.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="290.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">chlorine atoms strengthen the acid (-I)</text>
  <text x="600.0" y="335.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOH</tspan></text>
  <rect x="612.0" y="318.0" width="13.0" height="24.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="633.0" y="335.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">pKa 4.74</text>
  <text x="600.0" y="387.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">ClCH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">COOH</tspan></text>
  <rect x="612.0" y="370.0" width="107.0" height="24.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="727.0" y="387.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">pKa 2.86</text>
  <text x="600.0" y="439.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CHCOOH</tspan></text>
  <rect x="612.0" y="422.0" width="187.0" height="24.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="807.0" y="439.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">pKa 1.26</text>
  <text x="600.0" y="491.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CCOOH</tspan></text>
  <rect x="612.0" y="474.0" width="218.0" height="24.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="838.0" y="491.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">pKa 0.64</text>
  <text x="672.0" y="560.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">also: HCOOH (pKa 3.75) is stronger than CH3COOH</text>
  <text x="450.0" y="601" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
