<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 3.3 (PDF page 56), original drawing after the printed figure: arc PP1 of length S subtends angle theta at the centre O of a circle of radius r. -->
  <rect width="900" height="600" fill="#ffffff"/>
  <circle cx="410.0" cy="300.0" r="245.0" stroke="#e0197d" stroke-width="5" fill="none"/>
  <path d="M655.0 300.0 A245.0 245.0 0 0 0 550.5 99.3" stroke="#a5104f" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="410.0" y1="300.0" x2="655.0" y2="300.0" stroke="#555555" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="410.0" y1="300.0" x2="550.5" y2="99.3" stroke="#555555" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M474.0 300.0 A64.0 64.0 0 0 0 446.7 247.6" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="410.0" cy="300.0" r="6.0" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>
  <text x="491.6" y="269.5" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">θ</text>
  <text x="392.0" y="314.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">O</text>
  <text x="673.0" y="312.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400">P</text>
  <text x="560.5" y="83.3" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400">P<tspan dy="10.9" font-size="23.1">1</tspan><tspan dy="-10.9">​</tspan></text>
  <text x="661.5" y="183.2" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="italic">S</text>
  <text x="532.5" y="344.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="italic">r</text>
</svg>
