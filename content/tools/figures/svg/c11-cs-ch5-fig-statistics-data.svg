  <text class="r" x="730" y="597">A</text>
  <path d="M390 565 L462 565" stroke="#0f7a62" stroke-width="2.5" marker-end="url(#g)"/>
  <g class="r">
    <text x="860" y="495">missing grade options:</text>
    <text x="860" y="511">imputation: fill with the class</text>
    <text x="860" y="527">average (e.g. 82)</text>
    <text x="860" y="543">flagging: note that it is missing</text>
    <text x="860" y="559">removal: leave the record out</text>
    <text x="860" y="575">of that analysis</text>
    <text x="860" y="607">transformation: reshape clean data,</text>
    <text x="860" y="623">e.g. class averages, not rows</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
