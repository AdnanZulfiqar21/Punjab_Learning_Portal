  <rect x="630" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="684" y="129">Survey</text>
  <text class="l" x="800" y="122">ask set questions</text>
  <text class="r" x="800" y="140">grocery store asks 50 customers</text>
  <rect x="630" y="185" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="667" y="209">Observation</text>
  <text class="l" x="800" y="202">watch without interfering</text>
  <text class="r" x="800" y="220">restaurant notes lunch seating</text>
  <rect x="630" y="265" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="670" y="289">Experiment</text>
  <text class="l" x="800" y="282">change one variable</text>
  <text class="r" x="800" y="300">printed notes vs lectures only</text>
  <g class="r">
    <text x="630" y="352">the method depends on the research objective and</text>
    <text x="630" y="368">the type of data needed</text>
  </g>
  <rect x="50" y="435" width="1100" height="260" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
