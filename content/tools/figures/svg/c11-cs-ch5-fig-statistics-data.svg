  <circle cx="299.0" cy="140.0" r="6" fill="#1f6fb5" stroke="#ffffff" stroke-width="1"/>
  <circle cx="320.0" cy="140.0" r="6" fill="#1f6fb5" stroke="#ffffff" stroke-width="1"/>
