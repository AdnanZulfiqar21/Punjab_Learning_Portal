  <g class="r">
    <text x="70" y="376">variance = average of (x - mean)^2: Class A 12.56, Class B 454;</text>
    <text x="70" y="392">standard deviation = square root of variance: 3.54 and 21.31</text>
  </g>
  <rect x="610" y="55" width="540" height="360" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
