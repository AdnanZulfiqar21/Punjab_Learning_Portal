  <rect x="470" y="579" width="75" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="496" y="597">Sara</text>
  <rect x="545" y="579" width="75" height="28" rx="6" fill="#e6f4ef" stroke="#d98b2b" stroke-width="1.5"/>
