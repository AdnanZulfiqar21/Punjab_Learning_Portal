<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 6.2: a responsibility stack comparing own PC, IaaS, PaaS and SaaS, virtualization and the core cloud ideas, and the public, private, hybrid and multi-cloud deployment models. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Cloud computing: who manages what, and where the cloud lives</text>
  <rect x="50" y="55" width="640" height="400" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="370" y="83">Service models: IaaS, PaaS, SaaS (6.2.2)</text>
  <text class="l" x="145" y="116" style="text-anchor:middle">On your own PC</text>
  <rect x="80" y="126" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="111" y="147">Applications</text>
  <rect x="80" y="164" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="134" y="185">Data</text>
  <rect x="80" y="202" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="125" y="223">Runtime</text>
  <rect x="80" y="240" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="100" y="261">Operating system</text>
  <rect x="80" y="278" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="106" y="299">Virtualization</text>
  <rect x="80" y="316" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="123" y="337">Hardware</text>
  <text class="l" x="295" y="116" style="text-anchor:middle">IaaS</text>
  <rect x="230" y="126" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="261" y="147">Applications</text>
  <rect x="230" y="164" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="284" y="185">Data</text>
  <rect x="230" y="202" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="275" y="223">Runtime</text>
  <rect x="230" y="240" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="250" y="261">Operating system</text>
  <rect x="230" y="278" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="256" y="299">Virtualization</text>
  <rect x="230" y="316" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="273" y="337">Hardware</text>
  <text class="l" x="445" y="116" style="text-anchor:middle">PaaS</text>
  <rect x="380" y="126" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="411" y="147">Applications</text>
  <rect x="380" y="164" width="130" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="434" y="185">Data</text>
  <rect x="380" y="202" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="425" y="223">Runtime</text>
  <rect x="380" y="240" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="400" y="261">Operating system</text>
  <rect x="380" y="278" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="406" y="299">Virtualization</text>
  <rect x="380" y="316" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="423" y="337">Hardware</text>
  <text class="l" x="595" y="116" style="text-anchor:middle">SaaS</text>
  <rect x="530" y="126" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="561" y="147">Applications</text>
  <rect x="530" y="164" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="584" y="185">Data</text>
  <rect x="530" y="202" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="575" y="223">Runtime</text>
  <rect x="530" y="240" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="550" y="261">Operating system</text>
  <rect x="530" y="278" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="556" y="299">Virtualization</text>
  <rect x="530" y="316" width="130" height="34" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="573" y="337">Hardware</text>
  <rect x="80" y="375" width="16" height="12" fill="#ffffff" stroke="#d98b2b"/>
  <text class="r" x="102" y="386">you manage</text>
  <rect x="200" y="375" width="16" height="12" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="222" y="386">provider manages</text>
  <g class="r">
    <text x="80" y="416">IaaS: rent virtual servers (AWS, Azure, Google Compute Engine); PaaS: build and deploy</text>
    <text x="80" y="432">apps (Google App Engine, Heroku); SaaS: just use the software (Gmail, Google Docs, Office 365)</text>
  </g>
  <rect x="710" y="55" width="440" height="400" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="930" y="83">Core ideas (6.2.1)</text>
  <rect x="740" y="105" width="120" height="60" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="769" y="139">1 machine</text>
  <rect x="900" y="95" width="90" height="24" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="934" y="111">VM 1</text>
  <rect x="900" y="125" width="90" height="24" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="934" y="141">VM 2</text>
  <rect x="900" y="155" width="90" height="24" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="934" y="171">VM 3</text>
  <path d="M862 135 L896 135" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <text class="r" x="1000" y="140">virtualization</text>
  <g class="r">
    <text x="730" y="210">scalability: add servers for Eid or 14 August sales</text>
    <text x="730" y="226">elasticity: the cloud adds and removes servers</text>
    <text x="730" y="242">automatically as traffic rises and falls</text>
    <text x="730" y="258">on-demand access: get storage or computing</text>
    <text x="730" y="274">instantly, like turning on a tap</text>
    <text x="730" y="290">pay as you go: pay only for what you use</text>
  </g>
  <rect x="50" y="475" width="1100" height="220" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="503">Deployment models (6.2.3)</text>
  <rect x="80" y="525" width="240" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="179" y="549">Public</text>
  <g class="r">
    <text x="86" y="590">shared, run by a provider</text>
    <text x="86" y="608">e.g. AWS for businesses</text>
    <text x="86" y="626">cheaper, less control</text>
  </g>
  <rect x="345" y="525" width="240" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="441" y="549">Private</text>
  <g class="r">
    <text x="351" y="590">one organization only</text>
    <text x="351" y="608">e.g. a bank's own cloud</text>
    <text x="351" y="626">secure, costly</text>
  </g>
  <rect x="610" y="525" width="240" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="709" y="549">Hybrid</text>
  <g class="r">
    <text x="616" y="590">public + private</text>
    <text x="616" y="608">e.g. busy-time overflow</text>
    <text x="616" y="626">flexible</text>
  </g>
  <rect x="875" y="525" width="240" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="957" y="549">Multi-cloud</text>
  <g class="r">
    <text x="881" y="590">several providers</text>
    <text x="881" y="608">e.g. GCP + Azure + AWS</text>
    <text x="881" y="626">resilient</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
