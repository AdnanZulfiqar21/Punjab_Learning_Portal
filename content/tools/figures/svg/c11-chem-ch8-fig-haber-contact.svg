<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.4 and Tables 8.1 and 8.2: ammonia yield against temperature at several pressures (schematic), Kc for ammonia synthesis, and the SO3 equilibrium. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Industry: the Haber process for ammonia and the contact process for sulfur trioxide</text>
  <!-- yield graph -->
  <text class="k" x="330" y="70">Yield of NH3 against temperature at five pressures (Figure 8.4, schematic)</text>
  <path d="M100 420 V90 M100 420 H556" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="60" y="255" transform="rotate(-90 60 255)" text-anchor="middle">yield of NH3, per cent</text>
  <text class="s" x="330" y="458">temperature, degrees C</text>
  <g class="s" style="font-size:11px"><text x="100" y="438">200</text><text x="190" y="438">300</text><text x="280" y="438">400</text><text x="370" y="438">500</text><text x="460" y="438">600</text><text x="550" y="438">700</text></g>
  <g class="t" style="font-size:11px" text-anchor="end"><text x="94" y="96">100</text><text x="94" y="258">50</text><text x="94" y="424">0</text></g>
  <g fill="none" stroke-width="2.5">
    <path d="M100 96 C 200 100, 300 180, 550 330" stroke="#d7322f"/>
    <path d="M100 110 C 200 125, 300 230, 550 360" stroke="#d98b2b"/>
    <path d="M100 140 C 200 170, 300 280, 550 385" stroke="#0f7a62"/>
    <path d="M100 190 C 200 240, 300 330, 550 400" stroke="#1f6fb5"/>
    <path d="M100 300 C 200 340, 300 390, 550 412" stroke="#5b3fb5"/>
  </g>
  <g class="t" style="font-size:11px"><text x="562" y="334" style="fill:#d7322f">1000 atm</text><text x="562" y="364" style="fill:#d98b2b">600 atm</text><text x="562" y="389" style="fill:#0f7a62">300 atm</text><text x="562" y="404" style="fill:#1f6fb5">100 atm</text><text x="562" y="418" style="fill:#5b3fb5">10 atm</text></g>
  <circle cx="290" cy="265" r="22" fill="none" stroke="#14181f" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="t" x="340" y="150" style="font-weight:700;fill:#14181f">industrial conditions (dashed circle):</text><text class="t" x="340" y="168" style="font-weight:700;fill:#14181f">200 to 300 atm, about 400 degrees C</text>
  <text class="s" x="330" y="485">high pressure and low temperature give the highest yield</text>
  <text class="s" x="330" y="503">(98.3 per cent at 200 degrees C and 1000 atm),</text>
  <text class="s" x="330" y="521">but the rate is then too slow to be economic</text>
  <!-- tables -->
  <rect x="620" y="60" width="520" height="200" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="880" y="88">Haber process: N2 + 3H2 gives 2NH3, delta H = -46.11 kJ per mol</text>
  <g class="t">
    <text x="640" y="116">Kc falls as temperature rises (Table 8.1):</text>
    <text x="640" y="136">200 K 7.15 x 10^15; 300 K 2.69 x 10^8; 400 K 3.94 x 10^4; 500 K 1.72 x 10^2;</text>
    <text x="640" y="156">600 K 4.53; 700 K 2.96 x 10^-1; 800 K 3.96 x 10^-2</text>
    <text x="640" y="186">to raise the yield: remove ammonia as it forms, use high pressure (4 moles to 2),</text>
    <text x="640" y="206">keep the temperature moderate (exothermic) and use a catalyst for speed</text>
    <text x="640" y="236">optimum: 200 to 300 atm, about 673 K, iron catalyst in fused MgO, Al2O3 and SiO2</text>
  </g>
  <rect x="620" y="285" width="520" height="220" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="313">Contact process: 2SO2 + O2 gives 2SO3, delta H = -97.9 kJ per mol</text>
  <g font-size="13" fill="#4b5563">
    <text x="640" y="342" font-weight="700" fill="#14181f">Temperature, degrees C</text><text x="860" y="342">200</text><text x="910" y="342">300</text><text x="960" y="342">400</text><text x="1010" y="342">500</text><text x="1060" y="342">600</text><text x="1110" y="342">700</text>
    <text x="640" y="366" font-weight="700" fill="#14181f">Kc</text><text x="860" y="366">5500</text><text x="910" y="366">690</text><text x="960" y="366">160</text><text x="1010" y="366">55</text><text x="1060" y="366">25</text><text x="1110" y="366">13</text>
    <text x="640" y="390" font-weight="700" fill="#14181f">Mole per cent SO3</text><text x="860" y="390">98</text><text x="910" y="390">91</text><text x="960" y="390">75</text><text x="1010" y="390">61</text><text x="1060" y="390">46</text><text x="1110" y="390">31</text>
  </g>
  <path d="M630 350 H1130" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="640" y="420">at 1 atm (Table 8.2): low temperature gives a large Kc and high yield but a slow</text>
    <text x="640" y="440">approach to equilibrium; a higher temperature is faster but the SO3 yield drops</text>
    <text x="640" y="468">optimum: SO2 and air at 1 atm over solid V2O5; the exothermic reaction heats the gas</text>
    <text x="640" y="488">to 600 degrees C, so the mixture is recycled at 400 to 500 degrees C to raise the yield</text>
  </g>
  <text class="s" x="600" y="545">Both processes balance yield (favoured by low temperature) against rate (favoured by high temperature) with a catalyst and chosen pressure.</text>
  <text class="s" x="600" y="570">Curves are schematic after Figure 8.4; printed table values are reproduced as printed.</text>
</svg>
