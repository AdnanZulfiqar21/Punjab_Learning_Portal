<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- For your information box (C12-PHY, PDF p107): flat drawing after the printed photograph of a half-wave rectifier trainer board: a mains plug and red-blue lead (left) feed a yellow board titled HALF WAVE RECTIFIER with a step-down transformer T1, a diode 1N5402, a 1000 µF capacitor, a 1K resistor and an LED, output sockets 12 V and GND, and a POWER ON / OFF switch. No photograph is reproduced. -->
  <rect width="1300" height="750" fill="#ffffff"/>
  <rect x="260" y="20" width="1020" height="710" fill="#111" />
  <rect x="290" y="45" width="960" height="660" fill="#f4e53a" stroke="#222" stroke-width="3"/>
  <text x="770" y="115" font-size="56" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="#222" stroke-width="3" font-family="Georgia, serif">HALF WAVE RECTIFIER</text>
  <g fill="none" stroke="#111" stroke-width="5">
    <path d="M330 170 L520 170 L520 230 M560 230 L560 170 L700 170 L760 170 M820 170 L900 170 L900 650 M900 170 L1050 170 L1050 650 L900 650"/>
    <path d="M330 170 L330 650 L560 650 L560 590 M520 590 L520 650"/>
    <path d="M560 650 L900 650"/>
    <path d="M1050 300 L1150 300 M1050 460 L1150 460"/>
  </g>
  <text x="340" y="215" font-size="24" font-weight="700" fill="#111">AC 230 V</text>
  <path d="M760 145 L760 195 L820 170 Z" fill="#111"/><line x1="820" y1="145" x2="820" y2="195" stroke="#111" stroke-width="5"/>
  <text x="790" y="235" font-size="24" font-weight="700" text-anchor="middle" fill="#111">1N5402</text>
  <rect x="380" y="320" width="180" height="200" rx="10" fill="#c8a23c" stroke="#5e4a12" stroke-width="4"/>
  <rect x="350" y="300" width="40" height="240" fill="#4b4f56"/>
  <g stroke="#5e4a12" stroke-width="3"><line x1="400" y1="350" x2="540" y2="350"/><line x1="400" y1="400" x2="540" y2="400"/><line x1="400" y1="450" x2="540" y2="450"/><line x1="400" y1="500" x2="540" y2="500"/></g>
  <g fill="none" stroke-width="7"><path d="M560 360 Q600 380 640 340" stroke="#2fa84f"/><path d="M560 420 Q610 430 640 420" stroke="#ffffff"/><path d="M560 480 Q600 470 640 520" stroke="#2fa84f"/></g>
  <g stroke="#555" stroke-width="3"><line x1="640" y1="240" x2="640" y2="600"/><line x1="655" y1="240" x2="655" y2="600"/></g>
  <text x="710" y="420" font-size="22" font-weight="700" fill="#111" transform="rotate(90 710 420)" text-anchor="middle">STEPDOWN TRANSFORMER</text>
  <text x="440" y="635" font-size="24" font-weight="700" fill="#111">T1</text>
  <circle cx="850" cy="420" r="28" fill="#2f5fd0" stroke="#111" stroke-width="3"/>
  <text x="785" y="420" font-size="22" font-weight="700" fill="#111" transform="rotate(90 785 420)" text-anchor="middle">1000 µF</text>
  <rect x="955" y="360" width="30" height="110" rx="10" fill="#d9b58c" stroke="#111" stroke-width="3"/>
  <text x="930" y="410" font-size="24" font-weight="700" fill="#111" text-anchor="end">1K</text>
  <circle cx="975" cy="230" r="22" fill="#e9ecef" stroke="#111" stroke-width="3"/>
  <text x="1000" y="215" font-size="24" font-weight="700" fill="#111">LED</text>
  <circle cx="1170" cy="300" r="34" fill="#f4e53a" stroke="#111" stroke-width="7"/>
  <circle cx="1170" cy="460" r="34" fill="#f4e53a" stroke="#111" stroke-width="7"/>
  <text x="1170" y="250" font-size="26" font-weight="700" text-anchor="middle" fill="#111">12 V</text>
  <text x="1170" y="530" font-size="26" font-weight="700" text-anchor="middle" fill="#111">GND</text>
  <text x="660" y="600" font-size="24" font-weight="700" fill="#111">POWER ON / OFF</text>
  <rect x="660" y="620" width="140" height="56" rx="10" fill="#111"/>
  <rect x="35" y="60" width="70" height="120" rx="14" fill="#2a2d33"/>
  <g stroke="#9aa0a8" stroke-width="10" stroke-linecap="round"><line x1="55" y1="60" x2="55" y2="20"/><line x1="85" y1="60" x2="85" y2="20"/></g>
  <g fill="none" stroke-width="8"><path d="M70 180 Q40 400 120 520 Q200 640 120 700 Q60 730 160 720 Q260 700 210 560 Q170 430 300 360" stroke="#c0392b"/><path d="M80 180 Q55 400 135 515 Q215 635 135 695 Q80 728 175 712 Q265 690 225 555 Q190 430 300 380" stroke="#2c3e9e"/></g>
</svg>
