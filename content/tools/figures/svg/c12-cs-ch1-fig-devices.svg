  <circle cx="748.7" cy="152.7" r="22.5" stroke="#1f6fb5" stroke-width="2" fill="#eef5fc"/>
  <circle cx="772.7" cy="133.8" r="22.5" stroke="#1f6fb5" stroke-width="2" fill="#eef5fc"/>
  <circle cx="809.5" cy="129.5" r="22.5" stroke="#1f6fb5" stroke-width="2" fill="#eef5fc"/>
  <circle cx="841.8" cy="141.9" r="22.5" stroke="#1f6fb5" stroke-width="2" fill="#eef5fc"/>
  <ellipse cx="800.0" cy="165.0" rx="60.2" ry="40.0" stroke="#eef5fc" stroke-width="0" fill="#eef5fc"/>
  <text x="800.0" y="169.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">ISP and</text>
  <text x="800.0" y="190.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Internet</text>
  <line x1="100.0" y1="160.0" x2="190.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="300.0" y1="165.0" x2="370.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="480.0" y1="165.0" x2="550.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
