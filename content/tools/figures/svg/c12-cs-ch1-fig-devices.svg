  <line x1="490.0" y1="302.0" x2="545.0" y2="316.0" stroke="#0e9aa7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="290.0" y="370.0" font-size="12" fill="#0e9aa7" text-anchor="middle" font-weight="700">Wi-Fi</text>
  <text x="560.0" y="370.0" font-size="12" fill="#0e9aa7" text-anchor="middle" font-weight="700">Wi-Fi</text>
  <text x="75.0" y="265.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">joins a device to</text>
  <text x="75.0" y="279.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">the network; has a</text>
  <text x="75.0" y="293.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">unique MAC address</text>
  <text x="245.0" y="112.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">sends data to the</text>
  <text x="245.0" y="126.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">correct device</text>
  <text x="425.0" y="112.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">joins different networks;</text>
  <text x="425.0" y="126.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">routes packets by IP</text>
  <text x="605.0" y="112.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">converts digital data to</text>
  <text x="605.0" y="126.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">line signals and back</text>
  <text x="425.0" y="405.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">access point: gives wireless (Wi-Fi) devices a way into the network</text>
  <text x="425.0" y="421.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">and extends coverage in large buildings</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
