<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Times New Roman', Times, serif">
  <!-- Fig 7.4 (C12-MATH, PDF p225): velocity-time graph laid out as printed (pale yellow panel, magenta axes, navy AB a > 0, cyan BC, green CD a < 0). The book labels the vertical axis x and BC 'v = 0' (copied from Fig 7.1); drawn corrected as v and a = 0 (Book correction in the lesson). -->
  <title>Velocity-time graph: AB a &gt; 0, BC a = 0, CD a &lt; 0 (Figure 7.4)</title>
  <rect width="1000" height="720" fill="#ffffff"/>
  <rect x="6" y="6" width="988" height="708" fill="#FFFAC2" stroke="#231F20" stroke-width="1.5"/>
  <line x1="120" y1="628" x2="120" y2="40" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M125.7 51.7 L120 40 L114.3 51.7" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <line x1="102" y1="610" x2="965" y2="610" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M953.3 615.7 L965 610 L953.3 604.3" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <path d="M120 610 L400 190" fill="none" stroke="#2E3192" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400 190 L700 190" fill="none" stroke="#00AEEF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M700 190 L890 470" fill="none" stroke="#00A651" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="96" y="62" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">v</text>
  <text x="952" y="660" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">t</text>
  <text x="82" y="656" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">A</text>
  <text x="368" y="172" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">B</text>
  <text x="718" y="172" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">C</text>
  <text x="902" y="505" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">D</text>
  <text x="550" y="172" font-size="32" text-anchor="middle" fill="#231F20"><tspan font-style="italic">a</tspan> = 0</text>
  <text x="240" y="386.7" font-size="32" text-anchor="middle" fill="#231F20" transform="rotate(-56.3 240 386.7)"><tspan font-style="italic">a</tspan> &gt; 0</text>
  <text x="814.9" y="316.5" font-size="32" text-anchor="middle" fill="#231F20" transform="rotate(55.8 814.9 316.5)"><tspan font-style="italic">a</tspan> &lt; 0</text>
</svg>
