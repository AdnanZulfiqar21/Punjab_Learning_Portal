<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram for topic 24.3.3: benzenediazonium ions couple with phenol in cold alkali at the para position to give orange 4-hydroxyazobenzene; with N,N-dimethylphenylamine they give butter yellow; diazotised sulphanilic acid gives methyl orange; the -N=N- chromophore gives the colour. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Coupling reactions and azo dyes</text>
  <rect x="15.0" y="55.0" width="870.0" height="195.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">coupling with phenol in alkali</text>
  <path d="M85.0 139.0 L107.5 152.0 L107.5 178.0 L85.0 191.0 L62.5 178.0 L62.5 152.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="85.0" cy="165.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="107.5" y1="152.0" x2="119.9" y2="144.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="123.4" y="143.8" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">N</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">+</tspan></text>
  <text x="175.0" y="171.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <path d="M235.0 145.0 L257.5 158.0 L257.5 184.0 L235.0 197.0 L212.5 184.0 L212.5 158.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="235.0" cy="171.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="235.0" y1="145.0" x2="235.0" y2="130.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="235.0" y="123.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="295.0" y1="165.0" x2="361.2" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M370.0 165.0 L360.0 169.6 L360.0 160.4 Z" fill="#14181f"/>
  <text x="332.5" y="155.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaOH, cold</tspan></text>
  <path d="M450.0 139.0 L472.5 152.0 L472.5 178.0 L450.0 191.0 L427.5 178.0 L427.5 152.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="450.0" cy="165.0" r="15.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <text x="520.0" y="171.0" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700"><tspan dy="0.0">-N=N-</tspan></text>
  <path d="M595.0 139.0 L617.5 152.0 L617.5 178.0 L595.0 191.0 L572.5 178.0 L572.5 152.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="595.0" cy="165.0" r="15.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <line x1="476.0" y1="165.0" x2="492.0" y2="165.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="548.0" y1="165.0" x2="569.0" y2="165.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="621.0" y1="165.0" x2="640.0" y2="165.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="648.0" y="171.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="545.0" y="217.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">4-hydroxyazobenzene (an orange solid)</text>
  <text x="790.0" y="140.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the diazonium ion is</text>
  <text x="790.0" y="157.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the electrophile; it</text>
  <text x="790.0" y="174.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">attacks the ring at</text>
  <text x="790.0" y="191.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the para position</text>
  <rect x="15.0" y="260.0" width="870.0" height="170.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="290.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">butter yellow</text>
  <text x="450.0" y="320.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">N</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-11.8" font-size="11.2">+</tspan><tspan dy="6.7"> Cl</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> + C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">N(CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> -&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">-N=N-C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">-N(CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + HCl</tspan></text>
  <text x="450.0" y="350.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">in ethanoic acid; the product, 4-dimethylaminoazobenzene, was once a food colour</text>
  <text x="450.0" y="372.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">but is now banned because it can cause cancer</text>
  <rect x="15.0" y="440.0" width="870.0" height="170.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="470.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">methyl orange (an acid-base indicator)</text>
  <text x="450.0" y="500.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">S-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-N</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-11.1" font-size="10.5">+</tspan><tspan dy="6.3"> + C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8">N(CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">)</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> -&gt; NaO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">S-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-N=N-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-N(CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">)</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="450.0" y="530.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">from diazotised sulphanilic acid and N,N-dimethylphenylamine</text>
  <text x="450.0" y="555.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">the -N=N- group joining two aromatic rings (the chromophore) gives azo dyes their strong colours</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
