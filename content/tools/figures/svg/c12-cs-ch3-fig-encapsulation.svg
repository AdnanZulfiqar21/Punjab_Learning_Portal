<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: outside code uses public methods; private data __balance cannot be reached directly; the three naming levels. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Encapsulation: data hidden behind methods (after Fig 3.2)</text>
  <circle cx="90.0" cy="170.0" r="30.0" stroke="#14181f" stroke-width="2" fill="#f1f3f6"/>
  <text x="90.0" y="176.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">user</text>
  <text x="90.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">outside code</text>
  <rect x="300.0" y="70.0" width="560.0" height="290.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#f7f9fc"/>
  <text x="580.0" y="96.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">class BankAccount</text>
  <rect x="330.0" y="115.0" width="500.0" height="90.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="580.0" y="138.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">public methods (the interface)</text>
  <rect x="340.0" y="158.0" width="140.0" height="34.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="410.0" y="179.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">deposit()</text>
  <rect x="510.0" y="158.0" width="140.0" height="34.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="580.0" y="179.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">withdraw()</text>
  <rect x="680.0" y="158.0" width="140.0" height="34.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="750.0" y="179.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">get_balance()</text>
  <rect x="330.0" y="255.0" width="500.0" height="80.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="420.0" y="280.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">private data</text>
  <rect x="460.0" y="296.0" width="280.0" height="32.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="600.0" y="316.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">self.__balance  (two underscores)</text>
  <line x1="600.0" y1="207.0" x2="600.0" y2="284.0" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <path d="M600.0 292.0 L595.8 282.9 L604.2 282.9 Z" fill="#0f7a62"/>
  <line x1="122.0" y1="160.0" x2="316.2" y2="160.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M325.0 160.0 L315.0 164.6 L315.0 155.4 Z" fill="#0f7a62"/>
  <text x="220.0" y="150.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">allowed</text>
  <path d="M118 190 Q200 300 440 312" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="165.0" y="300.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">direct access</text>
  <text x="165.0" y="316.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">blocked</text>
  <circle cx="445.0" cy="312.0" r="10.0" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <line x1="439.0" y1="306.0" x2="451.0" y2="318.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="451.0" y1="306.0" x2="439.0" y2="318.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <rect x="40.0" y="380.0" width="820.0" height="70.0" rx="8" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="60.0" y="405.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">public: name</text>
  <text x="60.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">use anywhere</text>
  <text x="320.0" y="405.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">protected: _name (one _)</text>
  <text x="320.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">convention: class and subclasses</text>
  <text x="610.0" y="405.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">private: __name (two _)</text>
  <text x="610.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">name mangling hides it</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
