<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.27 to 3.32 and the printed box diagrams: sp3, sp2 and sp hybridization of C, B and Be. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
      .s{font-size:13px;fill:#4b5563}
      .c{font-size:13px;fill:#4b5563;text-anchor:middle}
      .b{font-size:12px;fill:#14181f;text-anchor:middle}
      .a{font-size:14px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Hybridization: mixing orbitals of one atom into equal new orbitals</text>
  <!-- helper: box rows -->
  <!-- sp3 carbon -->
  <text class="k" x="60" y="80">sp3: carbon in CH4 (one s + three p = four sp3, tetrahedral, 109.5&#176;)</text>
  <g font-size="12" fill="#4b5563">
    <text x="60" y="112">ground</text><text x="60" y="152">excited</text><text x="60" y="192">hybridized</text>
  </g>
  <g fill="none" stroke="#4b5563" stroke-width="2">
    <rect x="140" y="96" width="26" height="22"/><rect x="190" y="96" width="26" height="22"/><rect x="220" y="96" width="26" height="22"/><rect x="250" y="96" width="26" height="22"/>
    <rect x="140" y="136" width="26" height="22"/><rect x="190" y="136" width="26" height="22"/><rect x="220" y="136" width="26" height="22"/><rect x="250" y="136" width="26" height="22"/>
  </g>
  <g fill="none" stroke="#0f7a62" stroke-width="2"><rect x="140" y="176" width="26" height="22"/><rect x="170" y="176" width="26" height="22"/><rect x="200" y="176" width="26" height="22"/><rect x="230" y="176" width="26" height="22"/></g>
  <g stroke="#14181f" stroke-width="2"><path d="M148 114 v-14 M158 100 v14 M203 114 v-14 M233 114 v-14"/><path d="M153 154 v-14 M203 154 v-14 M233 154 v-14 M263 154 v-14"/></g>
  <g stroke="#0f7a62" stroke-width="2"><path d="M153 194 v-14 M183 194 v-14 M213 194 v-14 M243 194 v-14"/></g>
  <g class="b"><text x="153" y="92">2s</text><text x="233" y="92">2p</text><text x="198" y="214">four sp3</text></g>
  <text class="s" x="300" y="112">2s2 2p2: two unpaired</text><text class="s" x="300" y="152">one 2s electron promoted: four unpaired</text><text class="s" x="300" y="192">four equal sp3 orbitals, below 2p in energy</text>
  <!-- CH4 picture -->
  <g transform="translate(700 150)">
    <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="1.5"><ellipse cx="0" cy="-45" rx="14" ry="34"/><ellipse cx="42" cy="22" rx="14" ry="34" transform="rotate(-120 42 22)"/><ellipse cx="-42" cy="22" rx="14" ry="34" transform="rotate(120 -42 22)"/><ellipse cx="6" cy="36" rx="11" ry="26" transform="rotate(170 6 36)" opacity="0.6"/></g>
    <circle cx="0" cy="0" r="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="0" y="4">C</text>
    <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"><circle cx="0" cy="-88" r="12"/><circle cx="76" cy="44" r="12"/><circle cx="-76" cy="44" r="12"/><circle cx="12" cy="70" r="12"/></g>
    <g class="b"><text x="0" y="-84">H</text><text x="76" y="48">H</text><text x="-76" y="48">H</text><text x="12" y="74">H</text></g>
  </g>
  <text class="c" x="700" y="245">four sp3-s sigma bonds to the corners of a tetrahedron</text>
  <text class="s" x="840" y="100">each sp3 orbital has a big lobe and a small one;</text><text class="s" x="840" y="118">the small lobe is usually left out</text>
  <text class="s" x="840" y="150">rules: only orbitals of close energy mix;</text><text class="s" x="840" y="168">the number of hybrids equals the number mixed;</text><text class="s" x="840" y="186">mixing happens within one atom or ion</text>
  <!-- sp2 boron -->
  <path d="M60 270 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="60" y="300">sp2: boron in BF3 (one s + two p = three sp2, trigonal planar, 120&#176;)</text>
  <g font-size="12" fill="#4b5563"><text x="60" y="332">ground</text><text x="60" y="372">excited</text><text x="60" y="412">hybridized</text></g>
  <g fill="none" stroke="#4b5563" stroke-width="2">
    <rect x="140" y="316" width="26" height="22"/><rect x="190" y="316" width="26" height="22"/><rect x="220" y="316" width="26" height="22"/><rect x="250" y="316" width="26" height="22"/>
    <rect x="140" y="356" width="26" height="22"/><rect x="190" y="356" width="26" height="22"/><rect x="220" y="356" width="26" height="22"/><rect x="250" y="356" width="26" height="22"/>
  </g>
  <g fill="none" stroke="#0f7a62" stroke-width="2"><rect x="140" y="396" width="26" height="22"/><rect x="170" y="396" width="26" height="22"/><rect x="200" y="396" width="26" height="22"/></g>
  <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"><rect x="250" y="396" width="26" height="22"/></g>
  <g stroke="#14181f" stroke-width="2"><path d="M148 334 v-14 M158 320 v14 M203 334 v-14"/><path d="M153 374 v-14 M203 374 v-14 M233 374 v-14"/></g>
  <g stroke="#0f7a62" stroke-width="2"><path d="M153 414 v-14 M183 414 v-14 M213 414 v-14"/></g>
  <g class="b"><text x="153" y="312">2s</text><text x="233" y="312">2p</text><text x="183" y="434">three sp2</text><text x="263" y="434">2p left</text></g>
  <text class="s" x="300" y="332">2s2 2p1</text><text class="s" x="300" y="372">one 2s electron promoted: three unpaired</text><text class="s" x="300" y="412">three sp2 hybrids in a plane; one p unused</text>
  <g transform="translate(700 380)">
    <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="1.5"><ellipse cx="0" cy="-42" rx="13" ry="30"/><ellipse cx="36" cy="21" rx="13" ry="30" transform="rotate(-120 36 21)"/><ellipse cx="-36" cy="21" rx="13" ry="30" transform="rotate(120 -36 21)"/></g>
    <circle cx="0" cy="0" r="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="0" y="4">B</text>
    <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="0" cy="-82" r="12"/><circle cx="70" cy="40" r="12"/><circle cx="-70" cy="40" r="12"/></g>
    <g class="b"><text x="0" y="-78">F</text><text x="70" y="44">F</text><text x="-70" y="44">F</text></g>
  </g>
  <text class="c" x="700" y="450">three sp2-p sigma bonds</text>
  <!-- sp beryllium -->
  <path d="M60 480 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="60" y="510">sp: beryllium in BeCl2 (one s + one p = two sp, linear, 180&#176;)</text>
  <g font-size="12" fill="#4b5563"><text x="60" y="542">ground</text><text x="60" y="582">excited</text><text x="60" y="622">hybridized</text></g>
  <g fill="none" stroke="#4b5563" stroke-width="2">
    <rect x="140" y="526" width="26" height="22"/><rect x="190" y="526" width="26" height="22"/><rect x="220" y="526" width="26" height="22"/><rect x="250" y="526" width="26" height="22"/>
    <rect x="140" y="566" width="26" height="22"/><rect x="190" y="566" width="26" height="22"/><rect x="220" y="566" width="26" height="22"/><rect x="250" y="566" width="26" height="22"/>
  </g>
  <g fill="none" stroke="#0f7a62" stroke-width="2"><rect x="140" y="606" width="26" height="22"/><rect x="170" y="606" width="26" height="22"/></g>
  <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"><rect x="220" y="606" width="26" height="22"/><rect x="250" y="606" width="26" height="22"/></g>
  <g stroke="#14181f" stroke-width="2"><path d="M148 544 v-14 M158 530 v14"/><path d="M153 584 v-14 M203 584 v-14"/></g>
  <g stroke="#0f7a62" stroke-width="2"><path d="M153 624 v-14 M183 624 v-14"/></g>
  <g class="b"><text x="153" y="522">2s</text><text x="233" y="522">2p</text><text x="168" y="644">two sp</text><text x="248" y="644">2p left</text></g>
  <text class="s" x="300" y="542">2s2</text><text class="s" x="300" y="582">one 2s electron promoted: two unpaired</text><text class="s" x="300" y="622">two sp hybrids, opposite; two p unused</text>
  <g transform="translate(700 585)">
    <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="1.5"><ellipse cx="-42" cy="0" rx="30" ry="13"/><ellipse cx="42" cy="0" rx="30" ry="13"/></g>
    <circle cx="0" cy="0" r="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="0" y="4">Be</text>
    <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="-88" cy="0" r="13"/><circle cx="88" cy="0" r="13"/></g>
    <g class="b"><text x="-88" y="4">Cl</text><text x="88" y="4">Cl</text></g>
  </g>
  <text class="c" x="700" y="640">two sp-p sigma bonds, 180&#176; apart</text>
  <rect x="820" y="300" width="320" height="330" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="s">
    <text x="840" y="328" style="font-weight:700;fill:#14181f">Summary</text>
    <text x="840" y="356">sp3: 4 hybrids, tetrahedral, 109.5&#176;</text><text x="840" y="374">CH4, NH3, H2O, SiH4, CCl4</text>
    <text x="840" y="404">sp2: 3 hybrids, trigonal planar, 120&#176;</text><text x="840" y="422">BF3, BCl3, AlH3</text>
    <text x="840" y="452">sp: 2 hybrids, linear, 180&#176;</text><text x="840" y="470">BeCl2, BeH2</text>
    <text x="840" y="506">the hybrids have the same energy and shape;</text><text x="840" y="524">their energy lies between s and p;</text><text x="840" y="542">unused p orbitals stay available for pi bonds</text>
    <text x="840" y="578">arrows: electrons; green boxes: hybrid orbitals;</text><text x="840" y="596">dashed boxes: p orbitals not mixed</text>
  </g>
</svg>
