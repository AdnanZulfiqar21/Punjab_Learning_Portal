<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <!-- Original redraw after Figure 6.5: at constant pressure the work done by a gas is the rectangle under the line on a P-V diagram. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">On a P-V diagram, work is the area under the line</text>
  <line x1="120.0" y1="370.0" x2="789.6" y2="370.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M800.0 370.0 L788.2 375.5 L788.2 364.5 Z" fill="#14181f"/>
  <line x1="120.0" y1="370.0" x2="120.0" y2="80.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M120.0 70.0 L125.5 81.8 L114.5 81.8 Z" fill="#14181f"/>
  <text x="800.0" y="400.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700">volume V</text>
  <text x="132.0" y="84.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">pressure P</text>
  <rect x="270.0" y="170.0" width="380.0" height="200.0" rx="0" stroke="#d98b2b" stroke-width="0" fill="#fff1dc"/>
  <line x1="270.0" y1="170.0" x2="639.6" y2="170.0" stroke="#d7322f" stroke-width="4" stroke-linecap="round"/>
  <path d="M650.0 170.0 L638.2 175.5 L638.2 164.5 Z" fill="#d7322f"/>
  <line x1="270.0" y1="170.0" x2="270.0" y2="370.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="650.0" y1="170.0" x2="650.0" y2="370.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="120.0" y1="170.0" x2="270.0" y2="170.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="108.0" y="176.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700">P</text>
  <text x="270.0" y="396.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">V1</text>
  <text x="650.0" y="396.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">V2</text>
  <text x="260.0" y="160.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700">A</text>
  <text x="660.0" y="160.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700">B</text>
  <text x="460.0" y="150.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">constant pressure</text>
  <text x="460.0" y="280.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">area = P (V2 - V1) = P delta V = W</text>
  <text x="450.0" y="441" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
