<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <!-- Original: security, privacy, ethics and teamwork, and global connectivity around an online user. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Working safely in a connected world (after Fig 9.1)</text>
  <circle cx="450.0" cy="220.0" r="70.0" stroke="#14181f" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="214.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">you,</text>
  <text x="450.0" y="234.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">online</text>
  <rect x="50.0" y="85.0" width="280.0" height="70.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="190.0" y="118.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">security</text>
  <text x="190.0" y="134.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">protect devices, accounts and data</text>
  <line x1="330.0" y1="120.0" x2="392.0" y2="182.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="570.0" y="85.0" width="280.0" height="70.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="710.0" y="118.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">privacy</text>
  <text x="710.0" y="134.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">control what you share</text>
  <line x1="570.0" y1="120.0" x2="508.0" y2="182.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="50.0" y="285.0" width="280.0" height="70.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="190.0" y="318.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">ethics and teamwork</text>
  <text x="190.0" y="334.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">respectful, honest collaboration</text>
  <line x1="330.0" y1="320.0" x2="392.0" y2="258.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="570.0" y="285.0" width="280.0" height="70.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="710.0" y="318.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">global connectivity</text>
  <text x="710.0" y="334.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">people and ideas across the world</text>
  <line x1="570.0" y1="320.0" x2="508.0" y2="258.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="450.0" y="422.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">This chapter: safe habits, cyber threats and defences, collaboration, digital business, and the laws and impacts of computing.</text>
  <text x="450.0" y="441" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
