<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.39 to 4.43: a nucleotide, the bases, the phosphodiester bond, ATP and NAD. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .c{font-size:19px;fill:#ffffff;text-anchor:middle;font-weight:700}
      .n{font-size:15px;fill:#4b5563;text-anchor:middle}
    </style>
    <g id="pent"><polygon points="-45,8 -28,-34 28,-34 45,8 0,38" fill="#fff4e2" stroke="#d98b2b" stroke-width="4" stroke-linejoin="round"/></g>
    <g id="phos"><circle cx="0" cy="0" r="24" fill="#1f6fb5"/><text x="0" y="7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">P</text></g>
  </defs>
  <!-- nucleotide -->
  <text class="h" x="220" y="50">A nucleotide</text>
  <use href="#phos" x="90" y="190"/>
  <path d="M114 190 H150" stroke="#14181f" stroke-width="4"/>
  <g transform="translate(200,195)"><use href="#pent"/></g>
  <text class="n" x="200" y="200">pentose</text>
  <text class="n" x="158" y="166">5'</text><text class="n" x="245" y="172">1'</text><text class="n" x="245" y="236">3'</text>
  <path d="M245 180 H280" stroke="#14181f" stroke-width="4"/>
  <rect x="280" y="150" width="110" height="60" rx="10" fill="#5b3fb5"/><text class="c" x="335" y="186">base</text>
  <text class="s" x="220" y="290">base + sugar = nucleoside</text>
  <text class="s" x="220" y="316">nucleoside + phosphate = nucleotide</text>
  <text class="s" x="220" y="342">phosphate is ester-linked at C-5'</text>
  <text class="s" x="220" y="368">base attaches at C-1'</text>
  <!-- bases -->
  <text class="h" x="700" y="50">Nitrogenous bases</text>
  <text class="s" x="580" y="90">pyrimidines: one ring</text>
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="4">
    <polygon points="500,150 525,120 565,120 590,150 565,180 525,180"/><polygon points="610,150 635,120 675,120 700,150 675,180 635,180"/><polygon points="720,150 745,120 785,120 810,150 785,180 745,180"/>
  </g>
  <text class="n" x="545" y="205">cytosine (C)</text><text class="n" x="655" y="205">thymine (T)</text><text class="n" x="765" y="205">uracil (U)</text>
  <text class="n" x="545" y="225">DNA and RNA</text><text class="n" x="655" y="225">DNA only</text><text class="n" x="765" y="225">RNA only</text>
  <text class="s" x="950" y="90">purines: two rings</text>
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="4">
    <polygon points="860,150 885,120 925,120 950,150 925,180 885,180"/><polygon points="950,150 975,125 1000,150 975,175"/>
    <polygon points="1010,150 1035,120 1075,120 1100,150 1075,180 1035,180"/><polygon points="1100,150 1125,125 1150,150 1125,175"/>
  </g>
  <text class="n" x="925" y="205">adenine (A)</text><text class="n" x="1075" y="205">guanine (G)</text>
  <text class="n" x="1000" y="225">both in DNA and RNA</text>
  <text class="s" x="700" y="270">pentose: ribose in RNA, deoxyribose in DNA</text>
  <!-- phosphodiester bond -->
  <text class="h" x="220" y="440">Phosphodiester bond</text>
  <use href="#phos" x="90" y="530"/>
  <path d="M114 530 H150" stroke="#14181f" stroke-width="4"/>
  <g transform="translate(200,535)"><use href="#pent"/></g>
  <rect x="280" y="505" width="90" height="50" rx="10" fill="#5b3fb5"/><text class="c" x="325" y="537">base</text>
  <path d="M245 520 H280" stroke="#14181f" stroke-width="4"/>
  <path d="M225 573 L190 630" stroke="#14181f" stroke-width="4"/>
  <text class="n" x="230" y="585">3'</text>
  <use href="#phos" x="175" y="655"/>
  <path d="M199 655 H235" stroke="#14181f" stroke-width="4"/>
  <g transform="translate(285,660)"><use href="#pent"/></g>
  <rect x="365" y="630" width="90" height="50" rx="10" fill="#5b3fb5"/><text class="c" x="410" y="662">base</text>
  <path d="M330 645 H365" stroke="#14181f" stroke-width="4"/>
  <text class="n" x="243" y="632">5'</text>
  <circle cx="175" cy="655" r="34" fill="none" stroke="#d98b2b" stroke-width="4" stroke-dasharray="6 4"/>
  <text class="s" x="220" y="740">one phosphate with two ester links:</text><text class="s" x="220" y="766">C-5' of one sugar and C-3' of the next</text>
  <text class="s" x="220" y="800">the chain keeps a free 5' phosphate and a free 3' OH</text>
  <!-- ATP and NAD -->
  <text class="h" x="760" y="440">ATP and NAD</text>
  <rect x="540" y="500" width="100" height="50" rx="10" fill="#5b3fb5"/><text class="c" x="590" y="532">adenine</text>
  <g transform="translate(700,530)"><use href="#pent"/></g><text class="n" x="700" y="536">ribose</text>
  <path d="M640 525 H655" stroke="#14181f" stroke-width="4"/>
  <use href="#phos" x="790" y="525"/><use href="#phos" x="865" y="525"/><use href="#phos" x="940" y="525"/>
  <path d="M745 525 H766" stroke="#14181f" stroke-width="4"/>
  <path d="M814 525 q13 -26 27 0 M889 525 q13 -26 27 0" stroke="#d7322f" stroke-width="5" fill="none"/>
  <text class="n" x="880" y="485" style="fill:#d7322f">high-energy bonds</text>
  <text class="s" x="760" y="590">ATP: adenine, ribose and three phosphates; the energy currency,</text>
  <text class="s" x="760" y="616">losing phosphates in turn to give ADP and AMP</text>
  <rect x="540" y="670" width="100" height="50" rx="10" fill="#5b3fb5"/><text class="c" x="590" y="702">adenine</text>
  <g transform="translate(700,700)"><use href="#pent"/></g>
  <use href="#phos" x="790" y="695"/><use href="#phos" x="850" y="695"/>
  <g transform="translate(940,700)"><use href="#pent"/></g>
  <rect x="1000" y="670" width="150" height="50" rx="10" fill="#0f7a62"/><text class="c" x="1075" y="702">nicotinamide</text>
  <path d="M640 695 H655 M745 695 H766 M814 695 H826 M874 695 H895 M985 695 H1000" stroke="#14181f" stroke-width="4"/>
  <text class="s" x="860" y="760">NAD: a dinucleotide (two nucleotides joined through their phosphates);</text>
  <text class="s" x="860" y="786">a coenzyme that accepts hydrogen in oxidation-reduction reactions</text>
</svg>
