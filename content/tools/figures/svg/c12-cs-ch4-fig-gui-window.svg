<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: a Tkinter window with a label, entry and button, and the click event. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A simple Tkinter window and its widgets (after Fig 4.1)</text>
  <rect x="250.0" y="80.0" width="330.0" height="260.0" rx="6" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <rect x="250.0" y="80.0" width="330.0" height="30.0" rx="6" stroke="#14181f" stroke-width="2" fill="#e5e7eb"/>
  <text x="262.0" y="101.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Simple GUI Example</text>
  <text x="566.0" y="101.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">x</text>
  <rect x="530.0" y="92.0" width="12.0" height="2.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="548.0" y="89.0" width="9.0" height="9.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <text x="415.0" y="160.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="400">Welcome to Tkinter</text>
  <rect x="325.0" y="202.0" width="180.0" height="26.0" rx="2" stroke="#4b5563" stroke-width="1.5" fill="#ffffff"/>
  <rect x="360.0" y="260.0" width="110.0" height="30.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
  <text x="415.0" y="280.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="400">Click Me</text>
  <line x1="640.0" y1="160.0" x2="522.2" y2="160.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M515.0 160.0 L523.2 156.2 L523.2 163.8 Z" fill="#1f6fb5"/>
  <text x="650.0" y="158.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">Label</text>
  <text x="650.0" y="175.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">shows text</text>
  <line x1="640.0" y1="215.0" x2="522.2" y2="215.0" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M515.0 215.0 L523.2 211.2 L523.2 218.8 Z" fill="#0f7a62"/>
  <text x="650.0" y="213.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">Entry</text>
  <text x="650.0" y="230.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">takes typed input</text>
  <line x1="640.0" y1="275.0" x2="522.2" y2="275.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M515.0 275.0 L523.2 271.2 L523.2 278.8 Z" fill="#d98b2b"/>
  <text x="650.0" y="273.0" font-size="14" fill="#d98b2b" text-anchor="start" font-weight="700">Button</text>
  <text x="650.0" y="290.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">runs a function when clicked</text>
  <line x1="230.0" y1="95.0" x2="247.8" y2="95.0" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M255.0 95.0 L246.8 98.8 L246.8 91.2 Z" fill="#7c3aed"/>
  <text x="220.0" y="92.0" font-size="13" fill="#7c3aed" text-anchor="end" font-weight="700">window = tk.Tk()</text>
  <text x="220.0" y="109.0" font-size="13" fill="#7c3aed" text-anchor="end" font-weight="700">main window</text>
  <path d="M415 292 Q415 380 300 395" stroke="#d98b2b" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300.0 395.0 L308.2 391.2 L308.2 398.8 Z" fill="#d98b2b"/>
  <text x="60.0" y="380.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">command=on_click</text>
  <text x="60.0" y="398.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">click -&gt; on_click() runs</text>
  <text x="60.0" y="416.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">and prints 'Button Clicked!'</text>
  <text x="450.0" y="445.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">window.mainloop() keeps the window open and waiting for events.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
