<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Arial, sans-serif" font-size="24">
  <!-- Unit circle sector, theta = 40 degrees, scale 540 px per unit. O(90,520), A(630,520),
       B = (cos40, sin40) -> (503.67, 172.89), C = (cos40, 0) -> (503.67, 520), D = (1, tan40) -> (630, 66.89) -->
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <!-- sector OAB lightly shaded -->
  <path d="M 90 520 L 630 520 A 540 540 0 0 0 503.67 172.89 Z" fill="#fde7ef" stroke="none"/>
  <!-- triangle OAD outline -->
  <line x1="90" y1="520" x2="630" y2="520" stroke="#c2185b" stroke-width="3"/>
  <line x1="90" y1="520" x2="630" y2="66.89" stroke="#c2185b" stroke-width="3"/>
  <line x1="630" y1="520" x2="630" y2="66.89" stroke="#c2185b" stroke-width="3"/>
  <!-- arc AB of the unit circle -->
  <path d="M 630 520 A 540 540 0 0 0 503.67 172.89" fill="none" stroke="#7b1fa2" stroke-width="3"/>
  <!-- chord AB and perpendicular BC -->
  <line x1="503.67" y1="172.89" x2="630" y2="520" stroke="#0288d1" stroke-width="3"/>
  <line x1="503.67" y1="172.89" x2="503.67" y2="520" stroke="#0288d1" stroke-width="3"/>
  <!-- right-angle marks at C and A -->
  <polyline points="503.67,496 527.67,496 527.67,520" fill="none" stroke="#333333" stroke-width="2"/>
  <polyline points="606,520 606,496 630,496" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- angle theta at O -->
  <path d="M 160 520 A 70 70 0 0 0 143.62 475.00" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="168" y="500" font-size="26" font-style="italic">θ</text>
  <!-- points -->
  <circle cx="90" cy="520" r="6" fill="#222222"/>
  <circle cx="630" cy="520" r="6" fill="#222222"/>
  <circle cx="503.67" cy="172.89" r="6" fill="#222222"/>
  <circle cx="503.67" cy="520" r="6" fill="#222222"/>
  <circle cx="630" cy="66.89" r="6" fill="#222222"/>
  <!-- labels -->
  <text x="58" y="530" font-size="28" font-style="italic">O</text>
  <text x="642" y="548" font-size="28" font-style="italic">A</text>
  <text x="478" y="160" font-size="28" font-style="italic">B</text>
  <text x="494" y="556" font-size="28" font-style="italic">C</text>
  <text x="642" y="70" font-size="28" font-style="italic">D</text>
  <text x="300" y="556" font-size="24"><tspan font-style="italic">r</tspan> = 1</text>
  <text x="250" y="330" font-size="24" transform="rotate(-40 250 330)"><tspan font-style="italic">r</tspan> = 1</text>
  <text x="646" y="300" font-size="22">tan θ</text>
  <text x="400" y="360" font-size="22">sin θ</text>
  <text x="250" y="590" font-size="22" fill="#555555">unit circle, 0 &lt; θ &lt; π/2 (drawn for θ = 40°)</text>
</svg>
