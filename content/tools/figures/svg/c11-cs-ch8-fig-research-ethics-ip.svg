<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 8.2 to 8.5: six research steps from question to report, five principles of research ethics, and five types of intellectual property with what they protect and the book's examples. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">From question to findings: research steps, ethics and intellectual property</text>
  <rect x="50" y="55" width="1100" height="200" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">A research project, step by step (8.2 to 8.3)</text>
  <rect x="75" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="122" y="134">Question</text>
  <text class="r" x="150" y="176" style="text-anchor:middle">clear and specific</text>
  <path d="M227 130 L251 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="255" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="296" y="134">Hypothesis</text>
  <text class="r" x="330" y="176" style="text-anchor:middle">a testable guess</text>
  <path d="M407 130 L431 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="435" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="469" y="134">Find sources</text>
  <text class="r" x="510" y="176" style="text-anchor:middle">libraries, databases</text>
  <path d="M587 130 L611 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="615" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="662" y="134">Evaluate</text>
  <text class="r" x="690" y="176" style="text-anchor:middle">peer-reviewed?</text>
  <path d="M767 130 L791 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="795" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="842" y="134">Organize</text>
  <text class="r" x="870" y="176" style="text-anchor:middle">folders, notes</text>
  <path d="M947 130 L971 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="975" y="110" width="150" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="1029" y="134">Report</text>
  <text class="r" x="1050" y="176" style="text-anchor:middle">cite every source</text>
  <g class="r">
    <text x="75" y="222">peer-reviewed: checked by other experts before publication; Google Scholar and university libraries give access to journals</text>
  </g>
  <rect x="50" y="275" width="440" height="420" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="270" y="303">Research ethics (8.4)</text>
  <rect x="70" y="320" width="180" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="105" y="342">Informed consent</text>
  <g class="r">
    <text x="262" y="343">explain the purpose; ask permission</text>
  </g>
  <rect x="70" y="390" width="180" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="108" y="412">Confidentiality</text>
  <g class="r">
    <text x="262" y="413">keep answers private</text>
  </g>
  <rect x="70" y="460" width="180" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="129" y="482">Integrity</text>
  <g class="r">
    <text x="262" y="483">no fake data, no plagiarism</text>
  </g>
  <rect x="70" y="530" width="180" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="136" y="552">Respect</text>
  <g class="r">
    <text x="262" y="553">never harm participants</text>
  </g>
  <rect x="70" y="600" width="180" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="126" y="622">Avoid bias</text>
  <g class="r">
    <text x="262" y="623">let evidence decide</text>
  </g>
  <rect x="510" y="275" width="640" height="420" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="830" y="303">Intellectual property (8.5)</text>
  <text class="l" x="600" y="320" style="text-anchor:middle">type</text>
  <text class="l" x="800" y="320" style="text-anchor:middle">protects</text>
  <text class="l" x="1010" y="320" style="text-anchor:middle">book's example</text>
  <rect x="530" y="340" width="150" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="584" y="362">Patent</text>
  <text class="r" x="800" y="363" style="text-anchor:middle">an invention</text>
  <text class="r" x="1010" y="363" style="text-anchor:middle">efficient solar panel</text>
  <rect x="530" y="398" width="150" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="574" y="420">Trademark</text>
  <text class="r" x="800" y="421" style="text-anchor:middle">a brand name or logo</text>
  <text class="r" x="1010" y="421" style="text-anchor:middle">National Foods logo</text>
  <rect x="530" y="456" width="150" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="574" y="478">Copyright</text>
  <text class="r" x="800" y="479" style="text-anchor:middle">books, music, software</text>
  <text class="r" x="1010" y="479" style="text-anchor:middle">a Pakistani novel</text>
  <rect x="530" y="514" width="150" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="546" y="536">Industrial design</text>
  <text class="r" x="800" y="537" style="text-anchor:middle">a product's look</text>
  <text class="r" x="1010" y="537" style="text-anchor:middle">a new bottle shape</text>
  <rect x="530" y="572" width="150" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="564" y="594">Trade secret</text>
  <text class="r" x="800" y="595" style="text-anchor:middle">confidential know-how</text>
  <text class="r" x="1010" y="595" style="text-anchor:middle">a soft-drink recipe</text>
  <g class="r">
    <text x="530" y="650">register patents, trademarks and designs with IPO Pakistan;</text>
    <text x="530" y="666">keep trade secrets confidential with legal agreements</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
