<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original: a research question leading to a null and an alternative hypothesis. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">From a research question to two hypotheses (after 7.2)</text>
  <rect x="170.0" y="72.0" width="560.0" height="56.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="450.0" y="98.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">research question</text>
  <text x="450.0" y="114.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">Does study time affect students' exam scores?</text>
  <line x1="380.0" y1="130.0" x2="236.8" y2="182.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M230.0 185.0 L236.3 178.6 L239.0 185.8 Z" fill="#14181f"/>
  <line x1="520.0" y1="130.0" x2="663.2" y2="182.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M670.0 185.0 L661.0 185.8 L663.7 178.6 Z" fill="#14181f"/>
  <rect x="40.0" y="190.0" width="380.0" height="120.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="218.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">null hypothesis H0</text>
  <text x="230.0" y="248.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">no effect or difference:</text>
  <text x="230.0" y="266.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">study time has no significant</text>
  <text x="230.0" y="284.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">relationship with scores</text>
  <rect x="480.0" y="190.0" width="380.0" height="120.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="670.0" y="218.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">alternative hypothesis H1 (Ha)</text>
  <text x="670.0" y="248.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">an effect or difference:</text>
  <text x="670.0" y="266.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">study time significantly</text>
  <text x="670.0" y="284.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">affects scores</text>
  <text x="450.0" y="350.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">The test starts by assuming H0; strong evidence against it means rejecting H0 in favour of H1.</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
