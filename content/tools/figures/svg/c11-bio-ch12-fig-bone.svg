<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.1 to 12.3: a long bone, a Haversian system, the bone cells and ossification. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f}
      .s{font-size:15px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <!-- long bone -->
  <text class="h" x="200" y="40">A long bone</text>
  <path d="M140 80 q60 -20 120 0 q10 40 -20 60 v280 q30 20 20 60 q-60 20 -120 0 q-10 -40 20 -60 v-280 q-30 -20 -20 -60 z" fill="#fff4e2" stroke="#c9b27a" stroke-width="5"/>
  <rect x="172" y="150" width="56" height="260" fill="#f2b134" opacity="0.6"/>
  <rect x="186" y="160" width="28" height="240" fill="#f6d5cf"/>
  <g fill="#c9b27a"><circle cx="165" cy="105" r="5"/><circle cx="200" cy="95" r="5"/><circle cx="230" cy="110" r="5"/><circle cx="185" cy="125" r="5"/><circle cx="215" cy="130" r="5"/><circle cx="165" cy="455" r="5"/><circle cx="200" cy="465" r="5"/><circle cx="230" cy="450" r="5"/><circle cx="185" cy="435" r="5"/><circle cx="215" cy="430" r="5"/></g>
  <text class="s" x="270" y="100">epiphysis: broad end;</text><text class="s" x="270" y="118">spongy bone, red marrow</text>
  <text class="s" x="270" y="250">diaphysis (shaft): compact</text><text class="s" x="270" y="268">bone under the periosteum;</text><text class="s" x="270" y="286">yellow marrow (fat) inside</text>
  <path class="lead" d="M265 262 L228 262"/>
  <text class="s" x="270" y="450">epiphysis</text>
  <text class="s" x="40" y="520">bone is living, moist tissue;</text><text class="s" x="40" y="538">all bones are under 20% of body mass</text>
  <text class="s" x="40" y="570">red marrow (spongy bone, ends of long</text><text class="s" x="40" y="588">bones, ribs, vertebrae, sternum, pelvis)</text><text class="s" x="40" y="606">makes RBCs, platelets and WBCs; yellow</text><text class="s" x="40" y="624">marrow in the shafts stores fat and can</text><text class="s" x="40" y="642">turn red after severe blood loss</text>
  <!-- Haversian system -->
  <text class="h" x="620" y="40">A Haversian system (compact bone)</text>
  <g fill="none" stroke="#c9b27a" stroke-width="3"><circle cx="620" cy="220" r="140"/><circle cx="620" cy="220" r="110"/><circle cx="620" cy="220" r="80"/><circle cx="620" cy="220" r="50"/></g>
  <circle cx="620" cy="220" r="22" fill="#f6d5cf" stroke="#d7322f" stroke-width="3"/>
  <g fill="#14181f"><ellipse cx="620" cy="95" rx="9" ry="5"/><ellipse cx="500" cy="220" rx="5" ry="9"/><ellipse cx="740" cy="220" rx="5" ry="9"/><ellipse cx="620" cy="345" rx="9" ry="5"/><ellipse cx="540" cy="140" rx="8" ry="5"/><ellipse cx="700" cy="300" rx="8" ry="5"/><ellipse cx="700" cy="140" rx="8" ry="5"/><ellipse cx="540" cy="300" rx="8" ry="5"/><ellipse cx="560" cy="200" rx="6" ry="4"/><ellipse cx="680" cy="240" rx="6" ry="4"/></g>
  <g stroke="#4b5563" stroke-width="1" fill="none"><path d="M620 100 v15 M620 325 v15 M505 220 h15 M720 220 h15 M548 145 l10 10 M690 290 l-10 -10 M692 145 l-10 10 M548 290 l10 -10"/></g>
  <text class="k" x="790" y="110">Lamellae</text><text class="s" x="790" y="130">concentric layers of mineralised matrix:</text><text class="s" x="790" y="148">collagen fibres (flexible but weak) and</text><text class="s" x="790" y="166">calcium phosphate crystals (rigid but</text><text class="s" x="790" y="184">brittle), so bone is strong and flexible</text>
  <path class="lead" d="M785 125 L735 150"/>
  <text class="k" x="790" y="225">Haversian canal</text><text class="s" x="790" y="245">central canal with blood vessels, nerves</text><text class="s" x="790" y="263">and lymph vessels; cross channels join</text><text class="s" x="790" y="281">canals to each other and the periosteum</text>
  <path class="lead" d="M785 235 L642 222"/>
  <text class="k" x="790" y="320">Lacunae with osteocytes</text><text class="s" x="790" y="340">mature bone cells in small spaces between</text><text class="s" x="790" y="358">the lamellae, linked to each other and to</text><text class="s" x="790" y="376">the canal by tiny channels, the canaliculi</text>
  <path class="lead" d="M785 330 L708 300"/>
  <!-- bone cells and ossification -->
  <text class="h" x="620" y="430">Bone cells and ossification</text>
  <rect x="380" y="450" width="240" height="60" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="k" x="395" y="474">Osteoblasts</text><text class="s" x="395" y="494">form bone; secrete the matrix</text>
  <rect x="640" y="450" width="240" height="60" rx="10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/><text class="k" x="655" y="474">Osteocytes</text><text class="s" x="655" y="494">mature; maintain bone and Ca</text>
  <rect x="900" y="450" width="240" height="60" rx="10" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="k" x="915" y="474">Osteoclasts</text><text class="s" x="915" y="494">from macrophages; resorb bone</text>
  <path d="M620 480 H635" stroke="#4b5563" stroke-width="3"/>
  <text class="s" x="380" y="540">an osteoblast surrounded by matrix becomes an osteocyte; remodelling (osteoclasts break old bone,</text><text class="s" x="380" y="558">osteoblasts build new) goes on all life</text>
  <text class="s" x="380" y="590">Long bones (femur, humerus): the centre of a cartilage model calcifies, its chondrocytes die, blood</text><text class="s" x="380" y="608">vessels bring osteoblasts and osteoclasts, and bone replaces cartilage (ossification) at a first and</text><text class="s" x="380" y="626">then a second site, until only articular cartilage remains.</text>
  <text class="s" x="380" y="656">Some skull bones form directly from embryonic connective tissue, their osteocytes fusing into</text><text class="s" x="380" y="674">flat plates, without cartilage first.</text>
  <text class="s" x="380" y="710">Cream: compact bone. Orange: spongy bone. Pink: marrow cavity and the Haversian canal. Black: osteocytes in lacunae.</text>
</svg>
