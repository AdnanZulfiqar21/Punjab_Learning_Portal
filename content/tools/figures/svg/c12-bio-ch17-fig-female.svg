  <text x="700.0" y="311.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">basal + functional layers</text>
  <text x="40.0" y="405.0" font-size="12" fill="#9d174d" text-anchor="start" font-weight="700">body of the uterus</text>
