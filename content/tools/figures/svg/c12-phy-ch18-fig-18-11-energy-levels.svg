<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="680" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Fig 18.11: four horizontal energy levels, the ground state E0 (n = 1) and the excited states E1, E2, E3 (n = 2, 3, 4), with an Energy arrow pointing up. -->
  <line x1="80.0" y1="470.0" x2="80.0" y2="133.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M80.0 120.0 L88.5 135.9 L71.5 135.9 Z" fill="#14181f"/>
  <text x="56.0" y="330.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400" transform="rotate(-90 56.0 330.0)">Energy</text>
  <text x="730.0" y="70.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Excited state</text>
  <line x1="150.0" y1="560.0" x2="560.0" y2="560.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="590.0" y="570.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">E<tspan dy="8.4" font-size="20.4">0</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="700.0" y="570.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">n=1</text>
  <line x1="150.0" y1="440.0" x2="560.0" y2="440.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="590.0" y="450.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">E<tspan dy="8.4" font-size="20.4">1</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="700.0" y="450.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">n=2</text>
  <line x1="150.0" y1="300.0" x2="560.0" y2="300.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="590.0" y="310.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">E<tspan dy="8.4" font-size="20.4">2</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="700.0" y="310.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">n=3</text>
  <line x1="150.0" y1="140.0" x2="560.0" y2="140.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="590.0" y="150.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">E<tspan dy="8.4" font-size="20.4">3</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="700.0" y="150.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">n=4</text>
  <line x1="330.0" y1="560.0" x2="315.0" y2="610.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320.0" y="650.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Ground state</text>
</svg>
