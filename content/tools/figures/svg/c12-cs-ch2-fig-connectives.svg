<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="Times New Roman, Times, serif">
  <rect width="1080" height="640" fill="#ffffff"/>
  <!-- Fig 2.4 (C12-CS, PDF p28): AND, OR and NOT, each as input circles, an arrow with its rule, and the result shaded on a Venn diagram (NOT shown as a struck-out circle A). -->
  <defs><pattern id="hy" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3e3bd"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a7a52" stroke-width="2"/></pattern><pattern id="hb" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#3f93d8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#1d4f86" stroke-width="2"/></pattern><pattern id="hg" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#5fae6a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#2c6b35" stroke-width="2"/></pattern></defs>
  <defs><clipPath id="cA1"><circle cx="880" cy="110" r="66"/></clipPath><clipPath id="cA2"><circle cx="880" cy="320" r="66"/></clipPath></defs>
  <text x="78.0" y="122.0" font-size="36" fill="#3d1f63" text-anchor="middle" font-family="Times New Roman, Times, serif">AND</text>
  <line x1="240.0" y1="110.0" x2="360.0" y2="110.0" stroke="#1d2330" stroke-width="2" stroke-linecap="round"/>
  <circle cx="228.0" cy="110.0" r="66.0" fill="#f6e6bf" stroke="#1d2330" stroke-width="2"/>
  <circle cx="372.0" cy="110.0" r="66.0" fill="#4a9fe0" stroke="#1d2330" stroke-width="2"/>
  <text x="228.0" y="122.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A</text>
  <text x="372.0" y="122.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">B</text>
  <text x="625.0" y="80.0" font-size="38" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A and B</text>
  <path d="M550.0 102.0 L660.0 102.0 L660.0 90.0 L700.0 116.0 L660.0 142.0 L660.0 130.0 L550.0 130.0 Z" fill="#3a3a3a" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="625.0" y="176.0" font-size="25" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">True if both A and B are true.</text>
  <circle cx="880.0" cy="110.0" r="66.0" fill="#f6e6bf" stroke="#1d2330" stroke-width="2"/>
  <circle cx="970.0" cy="110.0" r="66.0" fill="#4a9fe0" stroke="#1d2330" stroke-width="2"/>
  <circle cx="970" cy="110" r="66" fill="url(#hg)" clip-path="url(#cA1)"/>
  <circle cx="880.0" cy="110.0" r="66.0" fill="none" stroke="#1d2330" stroke-width="2"/>
  <circle cx="970.0" cy="110.0" r="66.0" fill="none" stroke="#1d2330" stroke-width="2"/>
  <text x="858.0" y="122.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A</text>
  <text x="992.0" y="122.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">B</text>
  <line x1="30.0" y1="210.0" x2="1050.0" y2="210.0" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="78.0" y="332.0" font-size="36" fill="#3d1f63" text-anchor="middle" font-family="Times New Roman, Times, serif">OR</text>
  <line x1="240.0" y1="320.0" x2="360.0" y2="320.0" stroke="#1d2330" stroke-width="2" stroke-linecap="round"/>
  <circle cx="228.0" cy="320.0" r="66.0" fill="#f6e6bf" stroke="#1d2330" stroke-width="2"/>
  <circle cx="372.0" cy="320.0" r="66.0" fill="#4a9fe0" stroke="#1d2330" stroke-width="2"/>
  <text x="228.0" y="332.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A</text>
  <text x="372.0" y="332.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">B</text>
  <text x="625.0" y="290.0" font-size="38" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A or B</text>
  <path d="M550.0 312.0 L660.0 312.0 L660.0 300.0 L700.0 326.0 L660.0 352.0 L660.0 340.0 L550.0 340.0 Z" fill="#3a3a3a" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="625.0" y="386.0" font-size="25" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">True if A or B is true (or both).</text>
  <circle cx="880" cy="320" r="66" fill="url(#hy)"/>
  <circle cx="970" cy="320" r="66" fill="url(#hb)"/>
  <circle cx="970" cy="320" r="66" fill="url(#hg)" clip-path="url(#cA2)"/>
  <circle cx="880.0" cy="320.0" r="66.0" fill="none" stroke="#1d2330" stroke-width="2"/>
  <circle cx="970.0" cy="320.0" r="66.0" fill="none" stroke="#1d2330" stroke-width="2"/>
  <text x="858.0" y="332.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A</text>
  <text x="992.0" y="332.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">B</text>
  <line x1="30.0" y1="420.0" x2="1050.0" y2="420.0" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="78.0" y="542.0" font-size="36" fill="#3d1f63" text-anchor="middle" font-family="Times New Roman, Times, serif">NOT</text>
  <circle cx="300.0" cy="530.0" r="66.0" fill="#f6e6bf" stroke="#1d2330" stroke-width="2"/>
  <text x="300.0" y="542.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">A</text>
  <text x="625.0" y="500.0" font-size="38" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">Not A</text>
  <path d="M550.0 522.0 L660.0 522.0 L660.0 510.0 L700.0 536.0 L660.0 562.0 L660.0 550.0 L550.0 550.0 Z" fill="#3a3a3a" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="625.0" y="596.0" font-size="25" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">True if A is false.</text>
  <circle cx="925.0" cy="530.0" r="66.0" fill="#f6e6bf" stroke="#1d2330" stroke-width="2"/>
  <line x1="880.0" y1="484.0" x2="970.0" y2="576.0" stroke="#1d2330" stroke-width="9" stroke-linecap="round"/>
  <line x1="30.0" y1="630.0" x2="1050.0" y2="630.0" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
