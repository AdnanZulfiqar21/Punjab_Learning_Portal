<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original: Venn diagrams for AND, OR and NOT. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Logical connectives AND, OR and NOT (after Figs 2.4-2.5)</text>
  <text x="155.0" y="85.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A AND B</text>
  <rect x="30.0" y="105.0" width="250.0" height="170.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="120.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <circle cx="190.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <clipPath id="c155"><circle cx="120" cy="190" r="60"/></clipPath>
  <circle cx="190" cy="190" r="60" fill="#9cc3e6" clip-path="url(#c155)"/>
  <circle cx="120.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="none"/>
  <circle cx="190.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="none"/>
  <text x="95.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="215.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="155.0" y="305.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">true only if both are true</text>
  <text x="450.0" y="85.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A OR B</text>
  <rect x="325.0" y="105.0" width="250.0" height="170.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="415.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="485.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="415.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="none"/>
  <text x="390.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="510.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="450.0" y="305.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">true if at least one is true</text>
  <text x="745.0" y="85.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">NOT A</text>
  <rect x="620.0" y="105.0" width="250.0" height="170.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#f1f3f6"/>
  <rect x="620.0" y="105.0" width="250.0" height="170.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#9cc3e6"/>
  <circle cx="745.0" cy="190.0" r="60.0" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="745.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="745.0" y="305.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">true if A is false</text>
  <text x="450.0" y="360.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">Shaded part = where the expression is true.</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
