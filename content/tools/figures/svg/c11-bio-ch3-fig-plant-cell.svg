<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="940" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.9: ultrastructure of a plant cell. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- cell wall, membrane, cytoplasm -->
  <rect x="250" y="120" width="700" height="660" rx="30" fill="#c9b27a"/>
  <rect x="272" y="142" width="656" height="616" rx="24" fill="#1f6fb5"/>
  <rect x="284" y="154" width="632" height="592" rx="20" fill="#eef6fb"/>
  <!-- central vacuole -->
  <path d="M520 300 q170 -40 300 60 q40 160 -40 300 q-150 60 -260 0 q-60 -200 0 -360 z" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
  <text class="t" x="590" y="470">Central vacuole</text><text class="s" x="560" y="500">cell sap, tonoplast around it</text>
  <!-- nucleus pushed to the side -->
  <circle cx="400" cy="300" r="90" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="7"/>
  <circle cx="400" cy="300" r="75" fill="none" stroke="#5b3fb5" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="420" cy="320" r="24" fill="#5b3fb5"/>
  <path d="M345 270 q20 -20 40 0 t40 0 M350 320 q25 20 50 0" stroke="#5b3fb5" stroke-width="4" fill="none"/>
  <!-- rough ER around nucleus -->
  <path d="M310 400 q60 20 120 0 M315 425 q60 20 120 0 M320 450 q60 20 120 0" stroke="#0f7a62" stroke-width="6" fill="none"/>
  <g fill="#d98b2b"><circle cx="330" cy="398" r="4"/><circle cx="360" cy="407" r="4"/><circle cx="395" cy="408" r="4"/><circle cx="335" cy="424" r="4"/><circle cx="370" cy="433" r="4"/><circle cx="405" cy="432" r="4"/><circle cx="345" cy="449" r="4"/><circle cx="380" cy="458" r="4"/></g>
  <!-- smooth ER -->
  <path d="M310 500 q40 30 80 0 q40 -30 80 0" stroke="#0f7a62" stroke-width="6" fill="none"/>
  <!-- chloroplasts -->
  <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="4">
    <ellipse cx="760" cy="230" rx="60" ry="32"/><ellipse cx="840" cy="640" rx="60" ry="32"/><ellipse cx="400" cy="640" rx="60" ry="32"/>
  </g>
  <g stroke="#0f7a62" stroke-width="3"><path d="M720 230 h80 M720 222 h80 M720 238 h80 M800 640 h80 M800 632 h80 M800 648 h80 M360 640 h80 M360 632 h80 M360 648 h80"/></g>
  <!-- mitochondria -->
  <g fill="#f3e9d2" stroke="#d98b2b" stroke-width="4"><ellipse cx="600" cy="200" rx="48" ry="24"/><ellipse cx="600" cy="700" rx="48" ry="24"/></g>
  <path d="M570 185 v30 M585 180 v40 M600 180 v40 M615 180 v40 M630 185 v30 M570 685 v30 M585 680 v40 M600 680 v40 M615 680 v40 M630 685 v30" stroke="#d98b2b" stroke-width="3"/>
  <!-- Golgi -->
  <path d="M840 360 q40 -8 80 0 M836 378 q44 -8 88 0 M832 396 q48 -8 96 0 M836 414 q44 -8 88 0 M840 432 q40 -8 80 0" stroke="#8a4b00" stroke-width="6" fill="none"/>
  <g fill="#8a4b00"><circle cx="820" cy="340" r="6"/><circle cx="900" cy="455" r="6"/><circle cx="880" cy="340" r="6"/></g>
  <!-- ribosomes free -->
  <g fill="#d98b2b"><circle cx="320" cy="560" r="4"/><circle cx="340" cy="580" r="4"/><circle cx="300" cy="600" r="4"/><circle cx="860" cy="520" r="4"/><circle cx="880" cy="560" r="4"/><circle cx="850" cy="580" r="4"/></g>
  <!-- peroxisome -->
  <circle cx="320" cy="700" r="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/>
  <!-- plasmodesma -->
  <rect x="930" y="540" width="20" height="14" fill="#eef6fb"/>
  <!-- labels -->
  <path class="lead" d="M255 200 L120 150"/><text class="t" x="40" y="130">Cell wall</text>
  <path class="lead" d="M278 240 L140 240"/><text class="t" x="20" y="245">Plasma membrane</text>
  <path class="lead" d="M330 300 L140 330"/><text class="t" x="30" y="335">Nucleus</text><text class="s" x="30" y="360">with nucleolus</text>
  <path class="lead" d="M330 430 L140 430"/><text class="t" x="20" y="435">Rough ER</text>
  <path class="lead" d="M330 510 L140 510"/><text class="t" x="20" y="515">Smooth ER</text>
  <path class="lead" d="M340 640 L140 640"/><text class="t" x="20" y="645">Chloroplast</text>
  <path class="lead" d="M320 716 L140 760"/><text class="t" x="20" y="790">Peroxisome</text>
  <path class="lead" d="M600 176 L600 60"/><text class="t" x="490" y="50">Mitochondrion</text>
  <path class="lead" d="M780 215 L920 110"/><text class="t" x="930" y="110">Chloroplast</text>
  <path class="lead" d="M920 396 L1000 340"/><text class="t" x="985" y="330">Golgi apparatus</text>
  <path class="lead" d="M940 548 L990 548"/><text class="t" x="995" y="553">Plasmodesma</text>
  <path class="lead" d="M880 580 L990 640"/><text class="t" x="995" y="650">Ribosomes</text>
  <path class="lead" d="M600 724 L600 820"/><text class="t" x="490" y="850">Mitochondrion</text>
  <text class="s" x="260" y="915">Plant cell: cell wall, large central vacuole and chloroplasts; no centrioles.</text>
</svg>
