<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after the Did You Know box and Figure 30.2: tetramethylsilane, Si(CH3)4, whose 12 equivalent protons give one peak at 0.0 ppm; and the 1H NMR spectrum of methanol with peaks at 3.35 ppm (CH3) and 4.80 ppm (O-H) measured from TMS. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">TMS as the reference, and the spectrum of methanol</text>
  <rect x="15.0" y="55.0" width="300.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="165.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">tetramethylsilane (TMS)</text>
  <text x="165.0" y="217.0" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">Si</tspan></text>
  <line x1="165.0" y1="196.0" x2="165.0" y2="164.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="165.0" y="146.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="165.0" y1="224.0" x2="165.0" y2="256.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="165.0" y="284.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="151.0" y1="210.0" x2="109.0" y2="210.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="81.0" y="215.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="179.0" y1="210.0" x2="221.0" y2="210.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="249.0" y="215.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <text x="165.0" y="340.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">all 12 H are equivalent: one sharp</text>
  <text x="165.0" y="358.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">peak, set at delta = 0.0 ppm</text>
  <text x="165.0" y="376.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">inert, volatile, and its peak lies</text>
  <text x="165.0" y="394.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">to the right of most others</text>
  <rect x="330.0" y="55.0" width="555.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="607.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1H NMR of methanol (sketch from Figure 30.2)</text>
  <line x1="380.0" y1="360.0" x2="850.0" y2="360.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="380.0" y1="360.0" x2="380.0" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="380.0" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <line x1="458.3" y1="360.0" x2="458.3" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="458.3" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <line x1="536.7" y1="360.0" x2="536.7" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="536.7" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <line x1="615.0" y1="360.0" x2="615.0" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="615.0" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <line x1="693.3" y1="360.0" x2="693.3" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="693.3" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2</text>
  <line x1="771.7" y1="360.0" x2="771.7" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="771.7" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <line x1="850.0" y1="360.0" x2="850.0" y2="366.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="850.0" y="380.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <text x="615.0" y="398.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">chemical shift, delta (ppm)</text>
  <line x1="474.0" y1="360.0" x2="474.0" y2="240.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="480.0" y="232.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">O-H 4.80</text>
  <line x1="587.6" y1="360.0" x2="587.6" y2="160.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="593.6" y="152.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">CH3 3.35</text>
  <line x1="850.0" y1="360.0" x2="850.0" y2="210.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <text x="844.0" y="202.0" font-size="12" fill="#0f7a62" text-anchor="end" font-weight="700">TMS</text>
  <text x="615.0" y="130.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the chemical shift is measured from the TMS peak</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
