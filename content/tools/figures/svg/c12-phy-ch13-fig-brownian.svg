  <rect x="500.0" y="55.0" width="385.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="692.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">what affects it</text>
  <text x="520.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">Molecules hit the particle unevenly</text>
  <text x="520.0" y="133.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">from all sides, so it moves in a</text>
  <text x="520.0" y="156.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">random, zig-zag path.</text>
  <text x="520.0" y="179.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="202.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">Lighter (smaller) particles gain</text>
  <text x="520.0" y="225.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">larger speeds from the collisions.</text>
  <text x="520.0" y="248.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="271.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">A fluid of low viscosity (less internal</text>
  <text x="520.0" y="294.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">friction) gives faster Brownian motion.</text>
  <text x="520.0" y="317.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="340.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">Explained by Einstein (1905);</text>
  <text x="520.0" y="363.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">confirmed by Perrin (1908).</text>
