<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="578" fill="#ffffff"/>
  <!-- Original diagram after Figure 25.1: six widening bands for species, population, community, ecosystem, biome and biosphere, each with its meaning and a Pakistani example from the book. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Levels of ecological organization</text>
  <rect x="230.0" y="80.0" width="440.0" height="62.0" rx="12" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="246.0" y="106.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">1. species</text>
  <text x="246.0" y="128.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">can interbreed, fertile young</text>
  <text x="654.0" y="118.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">Indus river dolphin</text>
  <rect x="192.0" y="155.0" width="516.0" height="62.0" rx="12" stroke="#0e9aa7" stroke-width="2.5" fill="#ffffff"/>
  <text x="208.0" y="181.0" font-size="15" fill="#0e9aa7" text-anchor="start" font-weight="700">2. population</text>
  <text x="208.0" y="203.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">one species, one place, one time</text>
  <text x="692.0" y="193.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">Markhors of Chitral Gol</text>
  <rect x="154.0" y="230.0" width="592.0" height="62.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="170.0" y="256.0" font-size="15" fill="#0f7a62" text-anchor="start" font-weight="700">3. community</text>
  <text x="170.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">all species living together</text>
  <text x="730.0" y="268.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">mangroves, crabs, mudskippers, birds</text>
  <rect x="116.0" y="305.0" width="668.0" height="62.0" rx="12" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="132.0" y="331.0" font-size="15" fill="#d98b2b" text-anchor="start" font-weight="700">4. ecosystem</text>
  <text x="132.0" y="353.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">biotic + abiotic parts</text>
  <text x="768.0" y="343.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">Thar Desert: life + heat, sand, rain</text>
  <rect x="78.0" y="380.0" width="744.0" height="62.0" rx="12" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="94.0" y="406.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">5. biome</text>
  <text x="94.0" y="428.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">large region of one climate</text>
  <text x="806.0" y="418.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">coniferous forest, desert, freshwater</text>
  <rect x="40.0" y="455.0" width="820.0" height="62.0" rx="12" stroke="#d7322f" stroke-width="2.5" fill="#ffffff"/>
  <text x="56.0" y="481.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">6. biosphere</text>
  <text x="56.0" y="503.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">the global ecosystem</text>
  <text x="844.0" y="493.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">all of Earth where life exists</text>
  <text x="450.0" y="552.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">each level includes the one above it; complexity increases downward</text>
  <text x="450.0" y="569" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
