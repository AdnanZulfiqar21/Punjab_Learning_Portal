<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original: firewall, IDS, antivirus and login checks as rings around data, and the two steps of 2FA. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Layers of protection (after 9.2)</text>
  <circle cx="270.0" cy="250.0" r="180.0" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <circle cx="270.0" cy="250.0" r="140.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <circle cx="270.0" cy="250.0" r="100.0" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <circle cx="270.0" cy="250.0" r="60.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="270.0" y="268.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">your data</text>
  <text x="270.0" y="96.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">firewall</text>
  <text x="270.0" y="136.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">IDS</text>
  <text x="270.0" y="176.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">antivirus</text>
  <text x="270.0" y="232.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">login</text>
  <text x="30.0" y="458.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">firewall: blocks harmful traffic; IDS: spots suspicious activity;</text>
  <text x="30.0" y="474.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">antivirus: removes malware; login: 2FA and biometrics</text>
  <rect x="500.0" y="80.0" width="370.0" height="340.0" rx="10" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="685.0" y="106.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">two-factor authentication</text>
  <rect x="515.0" y="138.0" width="150.0" height="44.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="590.0" y="158.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 password</text>
  <text x="590.0" y="174.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">something you know</text>
  <rect x="705.0" y="138.0" width="150.0" height="44.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="780.0" y="158.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">2 code</text>
  <text x="780.0" y="174.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">sent to your phone</text>
  <line x1="667.0" y1="160.0" x2="696.6" y2="160.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M703.0 160.0 L695.7 163.4 L695.7 156.6 Z" fill="#14181f"/>
  <rect x="769.6" y="220.8" width="20.8" height="36.8" rx="5" stroke="#14181f" stroke-width="2" fill="#e6f4ef"/>
  <rect x="772.8" y="225.6" width="14.4" height="25.6" rx="2" stroke="#0f7a62" stroke-width="1" fill="#ffffff"/>
  <text x="800.0" y="238.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">482 913</text>
  <text x="685.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">biometrics: fingerprint, face or voice</text>
  <text x="685.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(something you are)</text>
  <text x="685.0" y="360.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">A stolen password alone is not enough</text>
  <text x="685.0" y="378.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">to get in.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
