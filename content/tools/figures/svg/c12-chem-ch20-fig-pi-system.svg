  <text x="450.0" y="340.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">one unhybridised p orbital on each C,</text>
  <text x="450.0" y="357.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">upright to the ring; they overlap sideways</text>
  <rect x="605.0" y="55.0" width="280.0" height="335.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(c) delocalised pi system</text>
