  <circle cx="107.4" cy="172.5" r="9.0" stroke="#14181f" stroke-width="1.5" fill="#e2e8f0"/>
  <text x="155.0" y="340.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">C-C: sp2-sp2 sigma</text>
  <text x="155.0" y="357.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">C-H: sp2-s sigma, all at 120</text>
