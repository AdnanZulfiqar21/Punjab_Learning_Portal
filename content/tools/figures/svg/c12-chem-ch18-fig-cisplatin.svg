<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original square planar sketches after Figure 18.11: cis-[Pt(NH3)2Cl2] with the two Cl at 90 degrees (polar) and trans with them at 180 degrees (non-polar). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cis and trans isomers of a square planar complex</text>
  <text x="450.0" y="70.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">[Pt(NH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">Cl</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">]</tspan></text>
  <path d="M140.0 130.0 L310.0 130.0 L310.0 300.0 L140.0 300.0 Z" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="225.0" y1="215.0" x2="155.0" y2="145.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="123.0" y="123.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="225.0" y1="215.0" x2="295.0" y2="145.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="327.0" y="123.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="225.0" y1="215.0" x2="295.0" y2="285.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="327.0" y="319.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="225.0" y1="215.0" x2="155.0" y2="285.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="123.0" y="319.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <circle cx="225.0" cy="215.0" r="20.0" stroke="#64748b" stroke-width="2" fill="#e2e8f0"/>
  <text x="225.0" y="221.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Pt</text>
  <path d="M196.7 243.3 A40 40 0 0 1 196.7 186.7" stroke="#d7322f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="161.0" y="221.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">90&#176;</text>
  <text x="225.0" y="355.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">cis-platin</text>
  <text x="225.0" y="378.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">polar: the bond dipoles do not cancel</text>
  <path d="M590.0 130.0 L760.0 130.0 L760.0 300.0 L590.0 300.0 Z" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="675.0" y1="215.0" x2="605.0" y2="145.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="573.0" y="123.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="675.0" y1="215.0" x2="745.0" y2="145.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="777.0" y="123.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="675.0" y1="215.0" x2="745.0" y2="285.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="777.0" y="319.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="675.0" y1="215.0" x2="605.0" y2="285.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="573.0" y="319.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">N</tspan></text>
  <circle cx="675.0" cy="215.0" r="20.0" stroke="#64748b" stroke-width="2" fill="#e2e8f0"/>
  <text x="675.0" y="221.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Pt</text>
  <text x="709.0" y="211.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700">180&#176;</text>
  <text x="675.0" y="355.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">trans-platin</text>
  <text x="675.0" y="378.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">non-polar: the bond dipoles cancel</text>
  <line x1="450.0" y1="90.0" x2="450.0" y2="390.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
  <text x="450.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">square planar complexes: the two Cl at 90 degrees (cis) or 180 degrees (trans)</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
