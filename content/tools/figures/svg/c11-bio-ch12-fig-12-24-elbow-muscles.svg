<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 12.24 (C11-BIO, PDF p278): a bent right arm seen from the side: the fist at upper left, the forearm going down-right to the elbow and the upper arm going up-right to the shoulder. Under the skin: the biceps (front) with its belly and tendon, the triceps (back), the humerus, ulna and radius. Labels as printed: Origins of biceps, Belly, Scapula, Flexion, Tendon, Extension, Origins of triceps, Ulna, Radius, Humerus, Insertion of biceps, Insertion of triceps. Blue arrows show flexion and extension. Original flat drawing after the printed figure. -->
  <defs>
    <marker id="bl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3aa8d8"/></marker>
  </defs>
  <rect width="990" height="690" fill="#ffffff"/>
  <g transform="scale(1.5)">
    <!-- skin -->
    <path d="M62 122 C58 102 80 92 102 96 C124 94 142 106 142 126 C142 150 152 166 172 182 C200 205 232 228 260 248 C268 200 280 148 300 104 C316 70 352 44 402 42 C442 42 462 72 456 112 C450 182 440 240 412 298 C382 340 322 362 272 356 C240 352 200 322 162 282 C132 252 108 228 92 212 C70 196 64 162 62 122 Z" fill="#f2c4a0" stroke="#c88a60" stroke-width="2"/>
    <!-- fist details -->
    <path d="M70 120 C80 112 96 112 104 120 M74 142 C86 134 102 136 110 144 M78 164 C90 156 106 158 112 166 M104 100 C118 104 126 118 124 136 C122 150 120 160 126 172" stroke="#c88a60" stroke-width="2" fill="none"/>
    <!-- scapula -->
    <path d="M402 70 C420 56 446 58 456 74 L452 108 C440 112 424 108 410 98 Z" fill="#f4eee8" stroke="#c8b8a8" stroke-width="1.5"/>
    <!-- humerus -->
    <path d="M412 92 C380 160 330 250 278 332" stroke="#b8a070" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M412 92 C380 160 330 250 278 332" stroke="#f4e8c4" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="418" cy="86" r="13" fill="#f4e8c4" stroke="#b8a070" stroke-width="2"/>
    <!-- triceps -->
    <path d="M426 104 C446 160 436 238 386 296 C362 320 330 334 290 340 C326 302 372 236 402 150 C408 130 414 112 426 104 Z" fill="#8e2420" stroke="#5a1410" stroke-width="2"/>
    <path d="M420 130 C410 190 380 250 330 310 M432 160 C420 220 392 270 350 316" stroke="#a83a30" stroke-width="2" fill="none"/>
    <path d="M426 104 L416 84 M434 120 L440 80" stroke="#f8f0e8" stroke-width="4"/>
    <!-- biceps -->
    <path d="M398 94 C340 108 284 160 272 222 C268 258 280 278 296 270 C336 236 378 166 406 104 Z" fill="#c03a2e" stroke="#7a1a12" stroke-width="2"/>
    <path d="M380 108 C330 140 296 190 286 240 M394 116 C350 160 316 210 302 254" stroke="#d8584a" stroke-width="2" fill="none"/>
    <path d="M398 94 L412 78 M404 100 L424 82" stroke="#f8f0e8" stroke-width="4"/>
    <!-- tendon to radius -->
    <path d="M282 262 C272 280 262 296 250 310" stroke="#f8f0e8" stroke-width="7" stroke-linecap="round"/>
    <path d="M282 262 C272 280 262 296 250 310" stroke="#c8b8a8" stroke-width="1" fill="none"/>
    <!-- ulna and radius -->
    <path d="M276 338 C230 300 180 250 136 212" stroke="#b8a070" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M276 338 C230 300 180 250 136 212" stroke="#f4e8c4" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M252 314 C214 276 180 232 150 186" stroke="#b8a070" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M252 314 C214 276 180 232 150 186" stroke="#f4e8c4" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="280" cy="340" r="9" fill="#f4e8c4" stroke="#b8a070" stroke-width="2"/>
    <!-- triceps insertion -->
    <path d="M290 340 L280 346" stroke="#f8f0e8" stroke-width="6"/>
    <!-- flexion / extension arrows -->
    <path d="M148 126 L200 130" stroke="#3aa8d8" stroke-width="6" marker-end="url(#bl)"/>
    <path d="M72 200 L68 246" stroke="#3aa8d8" stroke-width="6" marker-end="url(#bl)"/>
    <!-- labels -->
    <g font-size="15" fill="#222">
      <text x="104" y="52">Origins of biceps</text>
      <text x="216" y="100">Belly</text>
      <text x="472" y="96">Scapula</text>
      <text x="146" y="158">Flexion</text>
      <text x="184" y="196">Tendon</text>
      <text x="16" y="276">Extension</text>
      <text x="420" y="258">Origins of triceps</text>
      <text x="84" y="316">Ulna</text>
      <text x="60" y="356">Radius</text>
      <text x="448" y="332">Humerus</text>
      <text x="100" y="398">Insertion</text><text x="100" y="422">of biceps</text>
      <text x="322" y="402">Insertion</text><text x="322" y="426">of triceps</text>
    </g>
    <g stroke="#7a5a3a" stroke-width="1.2" fill="none">
      <path d="M232 48 L300 46 L404 90"/>
      <path d="M258 96 L268 96 L298 180"/>
      <path d="M470 91 L436 86"/>
      <path d="M232 192 L252 192 L264 262"/>
      <path d="M418 253 L410 253 L420 132"/>
      <path d="M120 311 L194 282"/>
      <path d="M108 351 L176 262"/>
      <path d="M444 327 L352 252"/>
      <path d="M208 396 L250 312"/>
      <path d="M320 396 L284 350"/>
    </g>
  </g>
</svg>
