<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.10: immunity divided into inborn (innate, non-specific, present at birth) and acquired (specific); acquired immunity is active or passive, and active immunity is natural or artificial (vaccination). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Types of immunity</text>
  <rect x="360.0" y="70.0" width="180.0" height="50.0" rx="10" stroke="#14181f" stroke-width="2" fill="#f8fafc"/>
  <text x="450.0" y="100.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">immunity</text>
  <rect x="90.0" y="170.0" width="260.0" height="80.0" rx="10" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
  <text x="220.0" y="197.0" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">inborn (innate) immunity</text>
  <text x="220.0" y="215.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">non-specific: 1st and 2nd lines</text>
  <text x="220.0" y="233.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">present at birth</text>
  <rect x="550.0" y="170.0" width="260.0" height="80.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="680.0" y="197.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">acquired immunity</text>
  <text x="680.0" y="215.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">specific: 3rd line</text>
  <text x="680.0" y="233.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">develops during growth</text>
  <line x1="450.0" y1="120.0" x2="220.0" y2="170.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="450.0" y1="120.0" x2="680.0" y2="170.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <rect x="450.0" y="300.0" width="200.0" height="80.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="550.0" y="327.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">active</text>
  <text x="550.0" y="345.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the body makes its</text>
  <text x="550.0" y="363.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">own antibodies</text>
  <rect x="700.0" y="300.0" width="180.0" height="80.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="790.0" y="327.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">passive</text>
  <text x="790.0" y="345.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">antibodies are given;</text>
  <text x="790.0" y="363.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">short-lived</text>
  <line x1="680.0" y1="250.0" x2="550.0" y2="300.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="680.0" y1="250.0" x2="790.0" y2="300.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <rect x="300.0" y="420.0" width="230.0" height="80.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="415.0" y="447.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">natural active</text>
  <text x="415.0" y="465.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">after meeting the antigens</text>
  <text x="415.0" y="483.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">(most effective)</text>
  <rect x="560.0" y="420.0" width="230.0" height="80.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="675.0" y="447.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">artificial active</text>
  <text x="675.0" y="465.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">vaccination with weakened</text>
  <text x="675.0" y="483.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">antigens</text>
  <line x1="550.0" y1="380.0" x2="415.0" y2="420.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="550.0" y1="380.0" x2="675.0" y2="420.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="531" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
