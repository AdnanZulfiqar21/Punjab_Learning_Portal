<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" font-family="'Times New Roman', Times, serif">
  <!-- Polar grid (C11-MATH, PDF p19): four cyan circles r = 1 to 4, magenta lines along 0/180, 90/270 and 135/315 degrees, black line along 45/225 degrees with P(r, theta), angle labels in degrees and radians, Polar axis; the pole labelled 0° as printed. Original drawing after the printed figure. -->
  <rect width="1180" height="1120" fill="#ffffff"/>
  <rect width="1180" height="1120" fill="#FFFAC2"/>
  <circle cx="560" cy="560" r="84" fill="none" stroke="#1d9fe0" stroke-width="3"/>
  <circle cx="560" cy="560" r="168" fill="none" stroke="#1d9fe0" stroke-width="3"/>
  <circle cx="560" cy="560" r="252" fill="none" stroke="#1d9fe0" stroke-width="3"/>
  <circle cx="560" cy="560" r="336" fill="none" stroke="#1d9fe0" stroke-width="3"/>
  <line x1="194" y1="560" x2="952" y2="560" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M966 560 L946 569 L951 560 L946 551 Z" fill="#e0197d"/>
  <line x1="560" y1="224" x2="560" y2="896" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <line x1="322.4" y1="322.4" x2="797.6" y2="797.6" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <line x1="322.4" y1="797.6" x2="797.6" y2="322.4" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <text x="656" y="592" font-size="44.2" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="740" y="592" font-size="44.2" text-anchor="middle" fill="#1a1a1a">2</text>
  <text x="824" y="592" font-size="44.2" text-anchor="middle" fill="#1a1a1a">3</text>
  <text x="908" y="592" font-size="44.2" text-anchor="middle" fill="#1a1a1a">4</text>
  <rect x="484" y="562" width="66" height="42" fill="#ffffff"/>
  <text x="546" y="594" font-size="44.2" text-anchor="end" fill="#1a1a1a">0°</text>
  <text x="974" y="569" font-size="46.8" text-anchor="start" fill="#1a1a1a">0  0°</text>
  <text x="560" y="114" font-size="46.8" text-anchor="middle" fill="#1a1a1a">90°</text>
  <g><text x="560" y="168" font-size="44.2" text-anchor="middle" fill="#1a1a1a">π</text><line x1="544.8" y1="174" x2="575.2" y2="174" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="213.8" font-size="44.2" text-anchor="middle" fill="#1a1a1a">2</text></g>
  <g><text x="560" y="934" font-size="44.2" text-anchor="middle" fill="#1a1a1a">3π</text><line x1="532.7" y1="940" x2="587.3" y2="940" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="979.8" font-size="44.2" text-anchor="middle" fill="#1a1a1a">2</text></g>
  <text x="560" y="1030" font-size="46.8" text-anchor="middle" fill="#1a1a1a">270°</text>
  <g><text x="828.7" y="285.3" font-size="44.2" text-anchor="middle" fill="#1a1a1a">π</text><line x1="813.5" y1="291.3" x2="843.9" y2="291.3" stroke="#1a1a1a" stroke-width="2"/><text x="828.7" y="331.1" font-size="44.2" text-anchor="middle" fill="#1a1a1a">4</text></g>
  <text x="875.4" y="252.6" font-size="46.8" text-anchor="middle" fill="#1a1a1a" transform="rotate(45 875.4 252.6)">45°</text>
  <g><text x="291.3" y="285.3" font-size="44.2" text-anchor="middle" fill="#1a1a1a">3π</text><line x1="264" y1="291.3" x2="318.6" y2="291.3" stroke="#1a1a1a" stroke-width="2"/><text x="291.3" y="331.1" font-size="44.2" text-anchor="middle" fill="#1a1a1a">4</text></g>
  <text x="244.6" y="252.6" font-size="46.8" text-anchor="middle" fill="#1a1a1a" transform="rotate(-45 244.6 252.6)">135°</text>
  <g><text x="291.3" y="822.7" font-size="44.2" text-anchor="middle" fill="#1a1a1a">5π</text><line x1="264" y1="828.7" x2="318.6" y2="828.7" stroke="#1a1a1a" stroke-width="2"/><text x="291.3" y="868.5" font-size="44.2" text-anchor="middle" fill="#1a1a1a">4</text></g>
  <text x="244.6" y="883.4" font-size="46.8" text-anchor="middle" fill="#1a1a1a" transform="rotate(45 244.6 883.4)">225°</text>
  <g><text x="828.7" y="822.7" font-size="44.2" text-anchor="middle" fill="#1a1a1a">7π</text><line x1="801.4" y1="828.7" x2="856" y2="828.7" stroke="#1a1a1a" stroke-width="2"/><text x="828.7" y="868.5" font-size="44.2" text-anchor="middle" fill="#1a1a1a">4</text></g>
  <text x="875.4" y="883.4" font-size="46.8" text-anchor="middle" fill="#1a1a1a" transform="rotate(-45 875.4 883.4)">315°</text>
  <circle cx="738.2" cy="381.8" r="7" fill="#1a1a1a"/>
  <text x="756.2" y="391.8" font-size="46.8" text-anchor="start" fill="#1a1a1a" transform="rotate(45 756.2 391.8)"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">r</tspan>, θ)</text>
  <text x="591.5" y="487.7" font-size="46.8" text-anchor="middle" fill="#1a1a1a" font-style="italic">r</text>
  <path d="M631.4 560 A71.39999999999999 71.39999999999999 0 0 0 615.3 514.8" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M610.5 509.5 L625.9 515.3 L618.4 517.5 L616.3 524.9 Z" fill="#1a1a1a"/>
  <text x="648.2" y="528.1" font-size="46.8" text-anchor="middle" fill="#1a1a1a">θ</text>
  <path d="M936 652 Q906 630 904 582" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M902 570 L909.5 583.4 L902.9 580.5 L896.9 584.5 Z" fill="#1a1a1a"/>
  <text x="940" y="664" font-size="46.8" text-anchor="start" fill="#1a1a1a">Polar axis</text>
</svg>
