<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original graph after Fig 16.10: V against Q for a charging capacitor is a straight line; the work to add each small charge dQ is a thin strip, and the total is the triangle's area, W = (1/2)QV = (1/2)CV2; energy density (1/2) eo er E2. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Energy stored in a capacitor (after Fig 16.10)</text>
  <line x1="120.0" y1="370.0" x2="582.8" y2="370.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M590.0 370.0 L581.8 373.8 L581.8 366.2 Z" fill="#14181f"/>
  <line x1="120.0" y1="370.0" x2="120.0" y2="87.2" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M120.0 80.0 L123.8 88.2 L116.2 88.2 Z" fill="#14181f"/>
