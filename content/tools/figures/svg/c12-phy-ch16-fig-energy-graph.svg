  <rect x="164.0" y="314.0" width="44.0" height="56.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="208.0" y="286.0" width="44.0" height="84.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="252.0" y="258.0" width="44.0" height="112.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="296.0" y="230.0" width="44.0" height="140.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="340.0" y="202.0" width="44.0" height="168.0" rx="0" stroke="#d98b2b" stroke-width="1.2" fill="#fed7aa"/>
  <rect x="384.0" y="174.0" width="44.0" height="196.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="428.0" y="146.0" width="44.0" height="224.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="472.0" y="118.0" width="44.0" height="252.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <rect x="516.0" y="90.0" width="44.0" height="280.0" rx="0" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <line x1="120.0" y1="370.0" x2="560.0" y2="90.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <text x="566.0" y="86.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">B</text>
  <text x="560.0" y="390.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="110.0" y="388.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">O</text>
  <text x="620.0" y="120.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">each strip: work dW = (dQ) V</text>
  <text x="620.0" y="142.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">to add a small charge dQ</text>
  <text x="620.0" y="164.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="620.0" y="186.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">total work = area of</text>
  <text x="620.0" y="208.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">triangle OAB:</text>
  <text x="620.0" y="260.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">W = (1/2) Q V</tspan></text>
  <text x="620.0" y="296.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">W = (1/2) C V</tspan><tspan dy="-6.7" font-size="11.2">2</tspan><tspan dy="6.7"> = Q</tspan><tspan dy="-6.7" font-size="11.2">2</tspan><tspan dy="6.7"> / 2C</tspan></text>
  <text x="620.0" y="332.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">energy density = (1/2) e</tspan><tspan dy="5.1" font-size="11.2">o</tspan><tspan dy="-5.1"> e</tspan><tspan dy="5.1" font-size="11.2">r</tspan><tspan dy="-5.1"> E</tspan><tspan dy="-6.7" font-size="11.2">2</tspan></text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
