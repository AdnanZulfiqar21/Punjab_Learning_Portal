<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original sketch for topic 30.4.3: the ethanol spectrum before and after shaking with D2O; the O-H signal disappears because R-O-H + D2O &lt;=&gt; R-O-D + HOD and deuterium gives no 1H signal. -->
