  <text x="460.0" y="388.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">chemical shift, delta (ppm)</text>
  <text x="253.7" y="330.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">gone</text>
  <line x1="427.8" y1="350.0" x2="427.8" y2="326.7" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
