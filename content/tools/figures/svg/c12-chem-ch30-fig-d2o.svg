  <text x="731.4" y="195.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <line x1="840.0" y1="175.0" x2="840.0" y2="181.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="840.0" y="195.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <text x="460.0" y="213.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">chemical shift, delta (ppm)</text>
  <line x1="253.7" y1="175.0" x2="253.7" y2="115.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
