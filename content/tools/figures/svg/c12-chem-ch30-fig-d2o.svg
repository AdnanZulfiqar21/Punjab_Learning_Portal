  <line x1="405.7" y1="175.0" x2="405.7" y2="181.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="405.7" y="195.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <line x1="514.3" y1="175.0" x2="514.3" y2="181.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="514.3" y="195.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
