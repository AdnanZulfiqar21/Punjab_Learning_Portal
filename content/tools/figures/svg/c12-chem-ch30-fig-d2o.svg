  <line x1="709.7" y1="350.0" x2="709.7" y2="260.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="716.7" y1="350.0" x2="716.7" y2="305.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450.0" y="430.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-O-H + D</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O &lt;=&gt; R-O-D + HOD</tspan></text>
  <text x="450.0" y="458.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">deuterium does not absorb at the proton frequency, so the O-H signal disappears</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
