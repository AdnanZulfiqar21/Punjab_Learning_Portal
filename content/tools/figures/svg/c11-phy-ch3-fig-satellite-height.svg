<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.11: a satellite at height h far greater than the Earth's radius R. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A satellite far above the Earth</text>
  <circle cx="230.0" cy="260.0" r="95.0" stroke="#1f6fb5" stroke-width="2.5" fill="#cfe6fa"/>
  <text x="230.0" y="267.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700">Earth</text>
  <path d="M671.7 99.3 A470 470 0 0 1 671.7 420.7" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="673.4" y="311.4" width="44.0" height="28.0" rx="5" stroke="#7c3aed" stroke-width="2.5" fill="#efe7fd"/>
  <line x1="655.4" y1="325.4" x2="673.4" y2="325.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="717.4" y1="325.4" x2="735.4" y2="325.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <text x="743.4" y="331.4" font-size="18" fill="#7c3aed" text-anchor="start" font-weight="700">satellite</text>
  <line x1="695.4" y1="303.4" x2="684.8" y2="225.7" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M683.4 215.4 L690.5 226.3 L679.6 227.8 Z" fill="#d7322f"/>
  <text x="699.4" y="225.4" font-size="20" fill="#d7322f" text-anchor="start" font-weight="700">v</text>
  <line x1="230.0" y1="260.0" x2="294.8" y2="205.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M302.8 198.9 L297.3 210.7 L290.2 202.3 Z" fill="#14181f"/>
  <text x="255.0" y="225.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700">R</text>
  <line x1="338.4" y1="274.8" x2="639.2" y2="321.8" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M649.4 323.4 L636.9 327.0 L638.6 316.2 Z" fill="#0f7a62"/>
  <path d="M328.1 273.2 L340.6 269.6 L338.9 280.5 Z" fill="#0f7a62"/>
  <text x="509.8" y="287.3" font-size="19" fill="#0f7a62" text-anchor="middle" font-weight="700">height h</text>
  <rect x="40.0" y="385.0" width="300.0" height="60.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="190.0" y="410.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="400">h is much greater than R,</text>
  <text x="190.0" y="433.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="400">so the orbit radius r = R + h</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
