<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Figure 17.1: atoms of Be, Mg, Ca, Sr and Ba drawn to scale from their metallic radii (112 to 222 pm), with their much smaller M2+ ions (31 to 135 pm) below. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Relative sizes of Group 2 atoms and ions</text>
  <circle cx="125.0" cy="200.0" r="37.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="125.0" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Be</text>
  <text x="125.0" y="261.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">112 pm</text>
  <circle cx="125.0" cy="370.0" r="10.2" stroke="#94a3b8" stroke-width="2" fill="#94a3b8"/>
  <text x="125.0" y="406.2" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Be</tspan><tspan dy="-5.9" font-size="9.8">2+</tspan></text>
  <text x="125.0" y="424.2" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">31 pm</text>
  <circle cx="250.7" cy="200.0" r="52.8" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="250.7" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Mg</text>
  <text x="250.7" y="276.8" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">160 pm</text>
  <circle cx="250.7" cy="370.0" r="21.4" stroke="#a3e635" stroke-width="2" fill="#a3e635"/>
  <text x="250.7" y="417.4" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg</tspan><tspan dy="-5.9" font-size="9.8">2+</tspan></text>
  <text x="250.7" y="435.4" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">65 pm</text>
  <circle cx="404.5" cy="200.0" r="65.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="404.5" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Ca</text>
  <text x="404.5" y="289.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">197 pm</text>
  <circle cx="404.5" cy="370.0" r="32.7" stroke="#f97316" stroke-width="2" fill="#f97316"/>
  <text x="404.5" y="428.7" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-5.9" font-size="9.8">2+</tspan></text>
  <text x="404.5" y="446.7" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">99 pm</text>
  <circle cx="576.5" cy="200.0" r="71.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="576.5" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Sr</text>
  <text x="576.5" y="294.9" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">215 pm</text>
  <circle cx="576.5" cy="370.0" r="37.3" stroke="#ef4444" stroke-width="2" fill="#ef4444"/>
  <text x="576.5" y="433.3" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Sr</tspan><tspan dy="-5.9" font-size="9.8">2+</tspan></text>
  <text x="576.5" y="451.3" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">113 pm</text>
  <circle cx="756.7" cy="200.0" r="73.3" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="756.7" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">Ba</text>
  <text x="756.7" y="297.3" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">222 pm</text>
  <circle cx="756.7" cy="370.0" r="44.6" stroke="#22c55e" stroke-width="2" fill="#22c55e"/>
  <text x="756.7" y="440.6" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ba</tspan><tspan dy="-5.9" font-size="9.8">2+</tspan></text>
  <text x="756.7" y="458.6" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">135 pm</text>
  <text x="40.0" y="120.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">atoms (metallic radius)</text>
  <text x="40.0" y="320.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">ions</text>
  <line x1="120.0" y1="90.0" x2="792.0" y2="90.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M800.0 90.0 L790.9 94.2 L790.9 85.8 Z" fill="#1f6fb5"/>
  <text x="460.0" y="78.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">left to right = down the group: bigger atoms, lower ionization energy, more reactive</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
