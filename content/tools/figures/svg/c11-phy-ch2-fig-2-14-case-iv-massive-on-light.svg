<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 2.14 (PDF page 43), original drawing after the printed figure: case (iv), a massive ball m1 hits a light ball m2 at rest; m1 goes on with about v1 and m2 moves off with about 2v1. -->
  <defs><radialGradient id="ballB" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#f2fbff"/><stop offset="0.45" stop-color="#7fd3f3"/><stop offset="1" stop-color="#1e98cf"/></radialGradient><radialGradient id="ballR" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#fff1ea"/><stop offset="0.45" stop-color="#f6a184"/><stop offset="1" stop-color="#d9603d"/></radialGradient></defs>
  <rect width="900" height="680" fill="#ffffff"/>
  <text x="40.0" y="46.0" font-size="32" fill="#2b8fc9" text-anchor="start" font-weight="700">case (iv)</text>
  <circle cx="150.0" cy="190.0" r="62.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="110.0" y1="102.0" x2="174.0" y2="102.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M190.0 102.0 L170.0 110.4 L170.0 93.6 Z" fill="#1a1a1a"/>
  <text x="150.0" y="86.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="150.0" y="288.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="380.0" cy="210.0" r="24.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <text x="380.0" y="144.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan> = 0</text>
  <text x="380.0" y="270.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="265.0" y="334.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="700">Before collision</text>
  <circle cx="520.0" cy="480.0" r="62.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="480.0" y1="392.0" x2="544.0" y2="392.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M560.0 392.0 L540.0 400.4 L540.0 383.6 Z" fill="#1a1a1a"/>
  <text x="520.0" y="376.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan>′<tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan> ≈ <tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="520.0" y="578.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="780.0" cy="500.0" r="24.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <line x1="700.0" y1="450.0" x2="844.0" y2="450.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M860.0 450.0 L840.0 458.4 L840.0 441.6 Z" fill="#1a1a1a"/>
  <text x="780.0" y="434.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan>′<tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan> ≈ 2<tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="780.0" y="560.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="650.0" y="624.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="700">After collision</text>
</svg>
