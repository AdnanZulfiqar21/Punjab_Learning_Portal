<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <!-- How penicillin acts on bacteria (our own flow for topic 32.3.1; not a textbook figure). -->
  <rect x="40.0" y="20.0" width="920.0" height="130.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="500.0" y="76.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">the cell-wall enzyme takes up penicillin</tspan></text>
  <text x="500.0" y="114.2" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">in place of its normal building block</tspan></text>
  <line x1="500.0" y1="152.0" x2="500.0" y2="179.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500.0 192.0 L493.2 177.5 L506.8 177.5 Z" fill="#14181f"/>
  <rect x="40.0" y="192.0" width="920.0" height="130.0" rx="14" stroke="#d98b2b" stroke-width="3" fill="#fff1dc"/>
  <text x="500.0" y="248.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">the beta-lactam ring opens and binds</tspan></text>
  <text x="500.0" y="286.2" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">to the enzyme: the enzyme is blocked</tspan></text>
  <line x1="500.0" y1="324.0" x2="500.0" y2="351.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500.0 364.0 L493.2 349.5 L506.8 349.5 Z" fill="#14181f"/>
  <rect x="40.0" y="364.0" width="920.0" height="130.0" rx="14" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <text x="500.0" y="420.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">the bacterium cannot build its</tspan></text>
  <text x="500.0" y="458.2" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">cell wall and bursts</tspan></text>
  <line x1="500.0" y1="496.0" x2="500.0" y2="523.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500.0 536.0 L493.2 521.5 L506.8 521.5 Z" fill="#14181f"/>
  <rect x="40.0" y="536.0" width="920.0" height="130.0" rx="14" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="500.0" y="592.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">human cells have no cell wall,</tspan></text>
  <text x="500.0" y="630.2" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">so they are not harmed</tspan></text>
</svg>
