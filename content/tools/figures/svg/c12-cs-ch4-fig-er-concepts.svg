<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original: Student and Course entities, attributes, the enrols-in relationship and the Roll Number identifier. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Entity, attribute, relationship and identifier (after 4.2)</text>
  <rect x="125.0" y="173.0" width="150.0" height="54.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="200.0" y="198.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Student</text>
  <text x="200.0" y="214.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">entity</text>
  <rect x="625.0" y="173.0" width="150.0" height="54.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="700.0" y="198.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Course</text>
  <text x="700.0" y="214.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">entity</text>
  <path d="M450.0 160.0 L540.0 200.0 L450.0 240.0 L360.0 200.0 Z" stroke="#d98b2b" stroke-width="2" fill="#fff1dc" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="198.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">enrols in</text>
  <text x="450.0" y="216.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">relationship</text>
  <line x1="275.0" y1="200.0" x2="360.0" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="540.0" y1="200.0" x2="625.0" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="90.0" cy="90.0" rx="62.0" ry="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="90.0" y="95.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Roll Number</text>
  <line x1="50.0" y1="99.0" x2="130.0" y2="99.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90.0" y1="112.0" x2="200.0" y2="173.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="220.0" cy="80.0" rx="62.0" ry="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="220.0" y="85.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Name</text>
  <line x1="220.0" y1="102.0" x2="200.0" y2="173.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="90.0" cy="320.0" rx="62.0" ry="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="90.0" y="325.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Class</text>
  <line x1="90.0" y1="298.0" x2="200.0" y2="227.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="230.0" cy="330.0" rx="62.0" ry="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="230.0" y="335.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Age</text>
  <line x1="230.0" y1="308.0" x2="200.0" y2="227.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90.0" y="60.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700">identifier (unique)</text>
  <text x="560.0" y="300.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">entity: a thing we store data about</text>
  <text x="560.0" y="319.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">attribute: a property of an entity</text>
  <text x="560.0" y="338.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">relationship: how entities are linked</text>
  <text x="560.0" y="357.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">identifier: uniquely picks out one record</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
