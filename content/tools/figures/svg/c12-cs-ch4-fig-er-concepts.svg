<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <!-- Roman Urdu figure: entity Student with attributes Roll Number (identifier), Name, Class and Age, joined by the relationship enrols in to the entity Course. -->
  <line x1="270.0" y1="80.0" x2="320.0" y2="300.0" stroke="#5a6170" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270.0" y1="220.0" x2="320.0" y2="300.0" stroke="#5a6170" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270.0" y1="360.0" x2="320.0" y2="300.0" stroke="#5a6170" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270.0" y1="500.0" x2="320.0" y2="300.0" stroke="#5a6170" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="150.0" cy="80.0" rx="130.0" ry="50.0" fill="#e6f4ee" stroke="#1e7a5a" stroke-width="3"/>
  <text x="150.0" y="91.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Roll Number</text>
  <line x1="66.8" y1="98.0" x2="233.2" y2="98.0" stroke="#1d2330" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="150.0" cy="220.0" rx="130.0" ry="50.0" fill="#e6f4ee" stroke="#1e7a5a" stroke-width="3"/>
  <text x="150.0" y="231.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Name</text>
  <ellipse cx="150.0" cy="360.0" rx="130.0" ry="50.0" fill="#e6f4ee" stroke="#1e7a5a" stroke-width="3"/>
  <text x="150.0" y="371.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Class</text>
  <ellipse cx="150.0" cy="500.0" rx="130.0" ry="50.0" fill="#e6f4ee" stroke="#1e7a5a" stroke-width="3"/>
  <text x="150.0" y="511.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Age</text>
  <text x="150.0" y="22.0" font-size="24" fill="#c0392b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">identifier (pehchan)</text>
  <rect x="320.0" y="240.0" width="200.0" height="120.0" rx="12" fill="#dbe8f6" stroke="#2f6fb0" stroke-width="3"/>
  <text x="420.0" y="302.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Student</text>
  <text x="420.0" y="338.0" font-size="26" fill="#4a5160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">entity</text>
  <line x1="520.0" y1="300.0" x2="540.0" y2="300.0" stroke="#1d2330" stroke-width="3" stroke-linecap="round"/>
  <path d="M540.0 300.0 L680.0 200.0 L820.0 300.0 L680.0 400.0 Z" fill="#fdebd3" stroke="#d9892e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="680.0" y="298.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">enrols in</text>
  <text x="680.0" y="332.0" font-size="23" fill="#4a5160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">relationship</text>
  <line x1="820.0" y1="300.0" x2="840.0" y2="300.0" stroke="#1d2330" stroke-width="3" stroke-linecap="round"/>
  <rect x="840.0" y="240.0" width="150.0" height="120.0" rx="12" fill="#dbe8f6" stroke="#2f6fb0" stroke-width="3"/>
  <text x="915.0" y="302.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Course</text>
  <text x="915.0" y="338.0" font-size="26" fill="#4a5160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">entity</text>
  <text x="330.0" y="560.0" font-size="26" fill="#1e7a5a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">attributes</text>
