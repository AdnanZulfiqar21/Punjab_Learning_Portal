<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig. 9.2(a), Example 9.1: q1 = +40 uC at the corner; q2 = -60 uC at r2 = 0.15 m along the base; q3 = -50 uC at r3 = 0.12 m along a line at 60 degrees; forces F2 and F3 on q1 point towards q2 and q3. -->
  <rect width="1000" height="560" fill="#ffffff"/>
  <line x1="230.0" y1="440.0" x2="750.0" y2="440.0" stroke="#e0197d" stroke-width="3" stroke-linecap="round"/>
  <line x1="230.0" y1="440.0" x2="438.0" y2="79.7" stroke="#e0197d" stroke-width="3" stroke-linecap="round"/>
  <line x1="230.0" y1="440.0" x2="657.6" y2="440.0" stroke="#e0197d" stroke-width="5" stroke-linecap="butt"/>
  <path d="M680.0 440.0 L652.0 451.8 L652.0 428.2 Z" fill="#e0197d"/>
  <line x1="230.0" y1="440.0" x2="391.8" y2="159.8" stroke="#e0197d" stroke-width="5" stroke-linecap="butt"/>
  <path d="M403.0 140.4 L399.2 170.5 L378.8 158.7 Z" fill="#e0197d"/>
  <circle cx="230.0" cy="440.0" r="12.0" stroke="#1a1a1a" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="750.0" cy="440.0" r="12.0" stroke="#1a1a1a" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="438.0" cy="79.7" r="12.0" stroke="#1a1a1a" stroke-width="2.5" fill="#ffffff"/>
  <path d="M270.0 370.7 A80.0 80.0 0 0 1 310.0 440.0" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="328.0" y="406.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">60°</text>
  <text x="600.0" y="418.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">F</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="412.0" y="189.7" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan font-weight="700">F</tspan><tspan dy="9.6" font-size="20.4">3</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="204.0" y="422.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">q</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="200.0" y="484.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">+40 μC</text>
  <text x="740.0" y="416.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">q</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="760.0" y="486.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">−60 μC</text>
  <text x="414.0" y="73.7" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">q</tspan><tspan dy="9.6" font-size="20.4">3</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="448.0" y="49.7" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">−50 μC</text>
  <text x="520.0" y="486.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">r</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan> = 0.15 m</text>
  <text x="308.0" y="263.9" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400" transform="rotate(-60 308.0 263.9)"><tspan font-style="italic">r</tspan><tspan dy="9.6" font-size="20.4">3</tspan><tspan dy="-9.6">​</tspan> = 0.12 m</text>
</svg>
