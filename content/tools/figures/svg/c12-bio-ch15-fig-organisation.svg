<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>
  <!-- Original diagram after Figure 15.8: the nervous system divided into CNS and PNS, the PNS into sensory and motor pathways, and the motor pathway into somatic and autonomic (sympathetic, parasympathetic) systems. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">How the human nervous system is organised</text>
  <line x1="450.0" y1="102.0" x2="200.0" y2="148.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="450.0" y1="102.0" x2="680.0" y2="148.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="680.0" y1="192.0" x2="560.0" y2="228.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="680.0" y1="192.0" x2="800.0" y2="228.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="800.0" y1="272.0" x2="430.0" y2="318.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="800.0" y1="272.0" x2="720.0" y2="318.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="720.0" y1="398.0" x2="600.0" y2="438.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="720.0" y1="398.0" x2="800.0" y2="438.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <rect x="340.0" y="58.0" width="220.0" height="44.0" rx="10" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="86.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">nervous system</text>
  <rect x="50.0" y="148.0" width="300.0" height="44.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="200.0" y="176.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">central (CNS)</text>
  <text x="200.0" y="210.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">brain and spinal cord</text>
  <rect x="530.0" y="148.0" width="300.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="680.0" y="176.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">peripheral (PNS)</text>
  <rect x="460.0" y="228.0" width="200.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="560.0" y="256.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">sensory pathway</text>
  <rect x="715.0" y="228.0" width="170.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="800.0" y="256.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">motor pathway</text>
  <rect x="315.0" y="318.0" width="230.0" height="44.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="430.0" y="346.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">somatic (voluntary)</text>
  <text x="430.0" y="380.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">skeletal muscles</text>
  <rect x="600.0" y="318.0" width="240.0" height="44.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="720.0" y="346.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">autonomic (involuntary)</text>
  <rect x="510.0" y="438.0" width="180.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="600.0" y="466.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">sympathetic</text>
  <text x="600.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">fight or flight</text>
  <rect x="710.0" y="438.0" width="180.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="800.0" y="466.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">parasympathetic</text>
  <text x="800.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">rest and restore</text>
  <text x="200.0" y="260.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">12 pairs of cranial nerves and</text>
  <text x="200.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">31 pairs of spinal nerves</text>
  <text x="200.0" y="296.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">make up the PNS</text>
  <text x="720.0" y="388.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">smooth muscles and glands</text>
  <text x="450.0" y="536" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
