<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original summary of topic 22.3: alcohols from ethene and steam (H3PO4), ethene with cold dilute KMnO4 (a diol), bromoethane with NaOH(aq), reduction of aldehydes, ketones (NaBH4 or LiAlH4) and carboxylic acids (LiAlH4), and ester hydrolysis. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making alcohols</text>
  <rect x="365.0" y="272.0" width="170.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="307.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">alcohol</tspan></text>
  <rect x="20.0" y="70.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="160.0" y="98.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">=CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O(g)</tspan></text>
  <text x="160.0" y="120.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">PO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, heat</tspan></text>
  <text x="160.0" y="142.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">-&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH</tspan></text>
  <line x1="270.2" y1="154.0" x2="391.9" y2="266.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M397.8 272.0 L388.3 268.9 L394.0 262.7 Z" fill="#4b5563"/>
  <rect x="310.0" y="63.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="91.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">=CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + [O]</tspan></text>
  <text x="450.0" y="113.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">cold dilute KMnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="450.0" y="135.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">-&gt; HOCH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH (a diol)</tspan></text>
  <line x1="450.0" y1="147.0" x2="450.0" y2="264.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 272.0 L445.8 262.9 L454.2 262.9 Z" fill="#4b5563"/>
  <rect x="600.0" y="70.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="740.0" y="98.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">Br + NaOH(aq)</tspan></text>
  <text x="740.0" y="120.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">heat</tspan></text>
  <text x="740.0" y="142.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">-&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH + NaBr</tspan></text>
  <line x1="629.8" y1="154.0" x2="508.1" y2="266.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M502.2 272.0 L506.0 262.7 L511.7 268.9 Z" fill="#4b5563"/>
  <rect x="20.0" y="463.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="160.0" y="491.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CHO + 2[H]</tspan></text>
  <text x="160.0" y="513.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaBH</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2"> or LiAlH</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="160.0" y="535.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">aldehyde -&gt; primary alcohol</tspan></text>
  <line x1="270.2" y1="463.0" x2="392.3" y2="333.8" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M397.8 328.0 L394.6 337.5 L388.5 331.7 Z" fill="#4b5563"/>
  <rect x="310.0" y="478.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="506.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 2[H]</tspan></text>
  <text x="450.0" y="528.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaBH</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2"> or LiAlH</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="450.0" y="550.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">ketone -&gt; secondary alcohol</tspan></text>
  <line x1="450.0" y1="478.0" x2="450.0" y2="336.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 328.0 L454.2 337.1 L445.8 337.1 Z" fill="#4b5563"/>
  <rect x="600.0" y="463.0" width="280.0" height="84.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="740.0" y="491.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOH + 4[H]</tspan></text>
  <text x="740.0" y="513.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">LiAlH</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="740.0" y="535.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">-&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH + H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O</tspan></text>
  <line x1="629.8" y1="463.0" x2="507.7" y2="333.8" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M502.2 328.0 L511.5 331.7 L505.4 337.5 Z" fill="#4b5563"/>
  <text x="450.0" y="605.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">also: ester + water (dilute acid or alkali, heat) -&gt; carboxylic acid + alcohol</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
