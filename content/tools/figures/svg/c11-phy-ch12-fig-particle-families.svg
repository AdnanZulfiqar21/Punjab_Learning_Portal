<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- Our own diagram for the Roman Urdu lesson of topic 12.5 (not a textbook figure): particles divide into hadrons (baryons of three quarks and mesons of a quark and an antiquark) and leptons, with the examples the book names. -->
  <line x1="500.0" y1="80.0" x2="290.0" y2="130.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="500.0" y1="80.0" x2="770.0" y2="130.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="290.0" y1="230.0" x2="160.0" y2="280.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="290.0" y1="230.0" x2="430.0" y2="280.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <rect x="360.0" y="20.0" width="280" height="60" rx="16" fill="#f1f3f6" stroke="#6b7280" stroke-width="2.5"/>
  <text x="500.0" y="60.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">Particles</text>
  <rect x="100.0" y="130.0" width="380" height="100" rx="16" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2.5"/>
  <text x="290.0" y="166.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">Hadrons</text>
  <text x="290.0" y="198.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">strong force mehsoos karte hain</text>
  <rect x="570.0" y="130.0" width="400" height="168" rx="16" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2.5"/>
  <text x="770.0" y="166.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">Leptons</text>
  <text x="770.0" y="198.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">strong force mehsoos nahi karte</text>
  <text x="770.0" y="228.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">electron, muon, tau</text>
  <text x="770.0" y="258.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">aur un ke neutrinos</text>
  <rect x="25.0" y="280.0" width="270" height="98" rx="16" fill="#eef5fb" stroke="#1f6fb5" stroke-width="2.5"/>
  <text x="160.0" y="316.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">Baryons</text>
  <text x="160.0" y="348.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">3 quarks: proton, neutron</text>
  <rect x="305.0" y="280.0" width="250" height="98" rx="16" fill="#eef5fb" stroke="#1f6fb5" stroke-width="2.5"/>
  <text x="430.0" y="316.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">Mesons</text>
  <text x="430.0" y="348.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400">quark + antiquark: pion</text>
</svg>
