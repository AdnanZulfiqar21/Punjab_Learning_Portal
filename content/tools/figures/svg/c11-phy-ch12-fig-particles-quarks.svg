<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.7 and 12.8 and topics 12.5 to 12.12: classifying particles, quarks and the make-up of the proton and neutron, the Higgs boson and conservation laws, and the Standard Model. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Fundamental particles, quarks, the Higgs boson and the Standard Model</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Classifying particles (12.5)</text>
  <rect x="250" y="90" width="120" height="30" rx="6" fill="#ffffff" stroke="#4b5563"/><text class="l" x="275" y="110">particles</text>
  <path d="M310 120 L170 156" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="80" y="158" width="210" height="28" rx="6" fill="#ffffff" stroke="#4b5563"/><text class="r" x="90" y="176">hadrons (feel the strong force)</text>
  <path d="M310 120 L460 156" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="370" y="158" width="160" height="28" rx="6" fill="#ffffff" stroke="#4b5563"/><text class="r" x="380" y="176">leptons (do not)</text>
  <path d="M130 186 L100 222" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M200 186 L240 222" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="224" width="120" height="44" rx="6" fill="#ffffff" stroke="#4b5563"/><text class="r" x="70" y="242">baryons: 3 quarks</text><text class="r" x="70" y="258">p, n, Lambda, Sigma</text>
  <rect x="190" y="224" width="120" height="44" rx="6" fill="#ffffff" stroke="#4b5563"/><text class="r" x="198" y="242">mesons: q + anti-q</text><text class="r" x="198" y="258">pions, kaons</text>
  <text class="r" x="380" y="206">e, mu, tau and their neutrinos;</text>
  <text class="r" x="380" y="220">spin 1/2; no inner structure</text>
  <g class="r">
    <text x="70" y="290">fermions (spin 1/2) obey Pauli's exclusion principle; bosons (spin 0, 1)</text>
    <text x="70" y="304">obey Bose-Einstein statistics;</text>
    <text x="70" y="318">strange particles come in pairs: pi- + p -&gt; K0 + Lambda0;</text>
    <text x="70" y="332">Table 12.3: electron 0.511, muon 105.7, tau 1777 MeV/c^2, each with a neutrino;</text>
    <text x="70" y="346">  the charged leptons carry charge -1, their antiparticles +1</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Quarks (12.6, Table 12.4, Fig. 12.7)</text>
  <text class="l" x="630" y="102">quark</text>
  <text class="l" x="720" y="102">charge</text>
  <text class="l" x="780" y="102">mass (MeV/c^2)</text>
  <text class="r" x="630" y="121">up u</text>
  <text class="r" x="720" y="121">+2/3</text>
  <text class="r" x="780" y="121">5</text>
  <text class="r" x="630" y="140">down d</text>
  <text class="r" x="720" y="140">-1/3</text>
  <text class="r" x="780" y="140">10</text>
  <text class="r" x="630" y="159">charm c</text>
  <text class="r" x="720" y="159">+2/3</text>
  <text class="r" x="780" y="159">1500</text>
  <text class="r" x="630" y="178">strange s</text>
  <text class="r" x="720" y="178">-1/3</text>
  <text class="r" x="780" y="178">200</text>
  <text class="r" x="630" y="197">top t</text>
  <text class="r" x="720" y="197">+2/3</text>
  <text class="r" x="780" y="197">175000</text>
  <text class="r" x="630" y="216">bottom b</text>
  <text class="r" x="720" y="216">-1/3</text>
  <text class="r" x="780" y="216">4300</text>
  <circle cx="960" cy="140" r="44" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <circle cx="942" cy="124" r="14" fill="#1f6fb5" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="942" y="128" style="text-anchor:middle;fill:#ffffff">u</text>
  <circle cx="978" cy="124" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="978" y="128" style="text-anchor:middle;fill:#ffffff">u</text>
  <circle cx="960" cy="158" r="14" fill="#0f7a62" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="960" y="162" style="text-anchor:middle;fill:#ffffff">d</text>
  <circle cx="1080" cy="140" r="44" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <circle cx="1062" cy="124" r="14" fill="#1f6fb5" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="1062" y="128" style="text-anchor:middle;fill:#ffffff">u</text>
  <circle cx="1098" cy="124" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="1098" y="128" style="text-anchor:middle;fill:#ffffff">d</text>
  <circle cx="1080" cy="158" r="14" fill="#0f7a62" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="1080" y="162" style="text-anchor:middle;fill:#ffffff">d</text>
  <text class="l" x="926" y="202">proton uud</text>
  <text class="l" x="1036" y="202">neutron udd</text>
  <g class="r">
    <text x="630" y="246">Gell-Mann and Zweig (1964); quarks never appear alone</text>
    <text x="630" y="261">proton: 2/3 + 2/3 - 1/3 = +1; neutron: 2/3 - 1/3 - 1/3 = 0</text>
    <text x="630" y="276">pi+ = u + anti-d: 2/3 + 1/3 = +1</text>
    <text x="630" y="291">colour: red, green, blue; baryons and mesons are colourless; the strong (colour) force: QCD</text>
    <text x="630" y="306">beta decay: d -&gt; u + e- + antineutrino; free neutrons decay (half-life about 900 s)</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Higgs boson, conservation laws, the universe (12.7 to 12.10)</text>
  <g class="r">
    <text x="70" y="450">force carriers: photons (electromagnetic), gluons (strong), W+, W-, Z (weak),</text>
    <text x="70" y="464">  gravitons (gravity); Higgs boson: CERN Large Hadron Collider, 2012, about</text>
    <text x="70" y="478">  125 GeV; particles gain mass from the Higgs field (W, Z strongly, photons not)</text>
    <text x="70" y="506">nuclear reactions conserve energy, momentum, charge, nucleon number,</text>
    <text x="70" y="520">  baryon number and lepton number</text>
    <text x="70" y="548">the universe is almost all matter (ordinary matter 5%); a baryon imbalance</text>
    <text x="70" y="562">  is suspected, but the asymmetry remains an unsolved mystery</text>
    <text x="70" y="590">dark matter about 27% and dark energy about 68%: about 95% of the universe is unknown;</text>
    <text x="70" y="604">  the book argues that most of the matter we see, mainly hydrogen and helium, is plasma</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Standard Model and theories of force (12.11, 12.12, Fig. 12.8)</text>
  <circle cx="650" cy="460" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="650" y="464" style="text-anchor:middle;fill:#ffffff">u</text>
  <circle cx="690" cy="460" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="690" y="464" style="text-anchor:middle;fill:#ffffff">c</text>
  <circle cx="730" cy="460" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="730" y="464" style="text-anchor:middle;fill:#ffffff">t</text>
  <circle cx="650" cy="496" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="650" y="500" style="text-anchor:middle;fill:#ffffff">d</text>
  <circle cx="690" cy="496" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="690" y="500" style="text-anchor:middle;fill:#ffffff">s</text>
  <circle cx="730" cy="496" r="14" fill="#7c3aed" stroke="#14181f" stroke-width="1.2"/>
  <text class="l" x="730" y="500" style="text-anchor:middle;fill:#ffffff">b</text>
  <circle cx="650" cy="548" r="14" fill="#0f7a62" stroke="#14181f" stroke-width="1.2"/><text class="r" x="650" y="552" style="text-anchor:middle;fill:#ffffff">e</text>
  <circle cx="650" cy="584" r="14" fill="#6dbf9f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="650" y="588" style="text-anchor:middle">nu</text>
  <circle cx="690" cy="548" r="14" fill="#0f7a62" stroke="#14181f" stroke-width="1.2"/><text class="r" x="690" y="552" style="text-anchor:middle;fill:#ffffff">mu</text>
  <circle cx="690" cy="584" r="14" fill="#6dbf9f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="690" y="588" style="text-anchor:middle">nu</text>
  <circle cx="730" cy="548" r="14" fill="#0f7a62" stroke="#14181f" stroke-width="1.2"/><text class="r" x="730" y="552" style="text-anchor:middle;fill:#ffffff">tau</text>
  <circle cx="730" cy="584" r="14" fill="#6dbf9f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="730" y="588" style="text-anchor:middle">nu</text>
  <circle cx="790" cy="460" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="790" y="464" style="text-anchor:middle;fill:#ffffff">g</text>
  <circle cx="790" cy="496" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="790" y="500" style="text-anchor:middle;fill:#ffffff">gam</text>
  <circle cx="790" cy="532" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="790" y="536" style="text-anchor:middle;fill:#ffffff">Z</text>
  <circle cx="790" cy="568" r="14" fill="#d7322f" stroke="#14181f" stroke-width="1.2"/><text class="r" x="790" y="572" style="text-anchor:middle;fill:#ffffff">W</text>
  <circle cx="840" cy="514" r="16" fill="#d98b2b" stroke="#14181f" stroke-width="1.2"/><text class="l" x="840" y="519" style="text-anchor:middle;fill:#ffffff">H</text>
  <text class="r" x="630" y="620">quarks (purple), leptons (green),</text>
  <text class="r" x="630" y="634">force carriers (red), Higgs (orange)</text>
  <g class="r">
    <text x="880" y="452">matter, about 5% of the</text>
    <text x="880" y="467">universe, is quarks and</text>
    <text x="880" y="482">leptons; the bosons carry</text>
    <text x="880" y="497">electromagnetism, the strong</text>
    <text x="880" y="512">and the weak force</text>
    <text x="880" y="542">not yet explained: gravity,</text>
    <text x="880" y="557">dark matter (27%), dark</text>
    <text x="880" y="572">energy (68%)</text>
    <text x="880" y="602">quantum field theory: forces</text>
    <text x="880" y="617">by exchange of field quanta;</text>
    <text x="880" y="632">string theory: vibrating</text>
    <text x="880" y="647">strings, still unproved</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
