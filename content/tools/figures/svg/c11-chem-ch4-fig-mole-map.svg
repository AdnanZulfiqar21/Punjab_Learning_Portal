<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after the printed mole-relationship charts on pages 77 and 80: the mole as the hub linking mass, particles, gas volume and solution concentration. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .f{font-family:Consolas, Courier New, monospace;font-size:15px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">The mole links mass, particles, gas volume and concentration</text>
  <!-- hub -->
  <circle cx="600" cy="300" r="78" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="600" y="292">Number of</text><text class="k" x="600" y="314">moles, n</text>
  <text class="s" x="600" y="402">1 mol = 6.02 x 10^23 particles</text>
  <!-- mass box -->
  <rect x="80" y="120" width="260" height="110" rx="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="210" y="150">Mass in grams, m</text>
  <text class="f" x="210" y="180">n = m / M</text>
  <text class="s" x="210" y="205">M = molar mass in g/mol</text>
  <path d="M340 190 L535 262" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="430" y="212">divide by M</text>
  <!-- particles box -->
  <rect x="860" y="120" width="260" height="110" rx="14" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/>
  <text class="k" x="990" y="150">Number of particles</text>
  <text class="f" x="990" y="180">n = N / NA</text>
  <text class="s" x="990" y="205">NA = 6.02 x 10^23 per mol</text>
  <path d="M860 190 L665 262" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="770" y="212">divide by NA</text>
  <!-- gas volume box -->
  <rect x="80" y="400" width="260" height="110" rx="14" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="210" y="430">Gas volume at STP, V</text>
  <text class="f" x="210" y="460">n = V / 22.4</text>
  <text class="s" x="210" y="485">Vm = 22.4 dm3 per mol</text>
  <path d="M340 440 L535 340" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="430" y="412">divide by 22.4 dm3</text>
  <!-- concentration box -->
  <rect x="860" y="400" width="260" height="110" rx="14" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="990" y="430">Solution: C and V</text>
  <text class="f" x="990" y="460">n = C x V</text>
  <text class="s" x="990" y="485">C in mol/dm3, V in dm3</text>
  <path d="M860 440 L665 340" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="770" y="412">multiply C by V</text>
  <rect x="80" y="545" width="1040" height="75" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="572">Reverse each arrow to go back: m = n x M, N = n x NA, V = n x 22.4 dm3 (at STP), C = n / V.</text>
  <text class="s" x="600" y="598">22.4 dm3 of CO2 at STP = 44.0 g = 6.02 x 10^23 molecules = 1 mole; for a gas at STP, molar mass = density x 22.4.</text>
</svg>
