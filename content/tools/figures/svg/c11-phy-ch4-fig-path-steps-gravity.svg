  <text x="460.0" y="441.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">horizontal steps (orange): no work against gravity.  Up steps (red) - down steps (green) = h,</text>
  <text x="460.0" y="461.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">so the total work against gravity is mgh</text>
