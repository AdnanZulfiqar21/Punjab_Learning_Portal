<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.9 and 1.3: how the periodic properties and metallic character change across a period and down a group. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="36">Periodic trends at a glance</text>
  <!-- table outline -->
  <rect x="300" y="110" width="600" height="340" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="300" style="font-size:22px;fill:#9ca3af">the periodic table</text>
  <!-- across arrows above -->
  <path d="M310 98 H890" stroke="#0f7a62" stroke-width="5" marker-end="url(#ag)"/>
  <text class="k" x="600" y="66" style="fill:#0f7a62">across a period, left to right: ionization energy, electron affinity, electronegativity and non-metallic character increase</text>
  <!-- across arrow below, reversed -->
  <path d="M890 470 H310" stroke="#1f6fb5" stroke-width="5" marker-end="url(#ab)"/>
  <text class="k" x="600" y="500" style="fill:#1f6fb5">right to left: atomic radius and metallic character increase</text>
  <!-- down arrows -->
  <path d="M270 120 V440" stroke="#1f6fb5" stroke-width="5" marker-end="url(#ab)"/>
  <text class="k" x="140" y="250" style="fill:#1f6fb5">down a group:</text><text class="s" x="140" y="274">atomic radius and</text><text class="s" x="140" y="296">metallic character</text><text class="s" x="140" y="318">increase</text>
  <path d="M930 440 V120" stroke="#0f7a62" stroke-width="5" marker-end="url(#ag)"/>
  <text class="k" x="1060" y="250" style="fill:#0f7a62">up a group:</text><text class="s" x="1060" y="274">ionization energy,</text><text class="s" x="1060" y="296">electron affinity and</text><text class="s" x="1060" y="318">electronegativity increase</text>
  <!-- corners -->
  <text class="s" x="330" y="140" text-anchor="start" style="font-weight:700;fill:#14181f">most metallic: Cs, Fr (bottom left)</text>
  <text class="s" x="870" y="435" text-anchor="end" style="font-weight:700;fill:#14181f">most electronegative: F (top right, after the noble gases)</text>
  <text class="s" x="600" y="545">Metallic character is the tendency to lose electrons: strong on the left and at the bottom (large atoms, well shielded valence electrons),</text>
  <text class="s" x="600" y="567">weak on the right and at the top; cesium is far more reactive and electropositive than sodium or lithium.</text>
  <text class="s" x="600" y="600">All these trends follow from two things: the effective nuclear charge felt by the valence electrons, and how many shells lie inside them.</text>
</svg>
