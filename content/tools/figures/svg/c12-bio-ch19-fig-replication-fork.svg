  <line x1="610.0" y1="330.0" x2="880.0" y2="330.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <line x1="620.0" y1="304.0" x2="620.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
