<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 19.10 and 19.11: helicase opening the double helix with gyrase ahead and single-strand binding proteins, the leading strand made continuously by DNA polymerase III from one RNA primer, and the lagging strand made as Okazaki fragments with primase, Pol III, Pol I and ligase. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">DNA replication at a replication fork</text>
