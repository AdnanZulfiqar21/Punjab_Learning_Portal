  <text x="478.0" y="217.8" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Pol III</text>
  <text x="70.0" y="246.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">RNA primer</text>
  <text x="200.0" y="270.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">leading strand: one primer, continuous, towards the fork</text>
  <text x="30.0" y="176.0" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">3'</text>
  <text x="30.0" y="206.0" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700"></text>
  <text x="30.0" y="434.0" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">5'</text>
  <line x1="70.0" y1="416.0" x2="190.0" y2="416.0" stroke="#60a5fa" stroke-width="7" stroke-linecap="butt"/>
  <circle cx="200.0" cy="416.0" r="9.0" stroke="#0f766e" stroke-width="1.5" fill="#99f6e4"/>
  <line x1="192.0" y1="416.0" x2="220.0" y2="416.0" stroke="#60a5fa" stroke-width="7" stroke-linecap="butt"/>
  <text x="200.0" y="398.0" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="700">ligase</text>
  <line x1="220.0" y1="416.0" x2="308.0" y2="416.0" stroke="#60a5fa" stroke-width="7" stroke-linecap="butt"/>
  <line x1="308.0" y1="416.0" x2="330.0" y2="416.0" stroke="#f472b6" stroke-width="7" stroke-linecap="butt"/>
  <ellipse cx="320.0" cy="390.0" rx="26.0" ry="15.0" stroke="#6d28d9" stroke-width="2" fill="#f5f3ff"/>
  <text x="320.0" y="393.5" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">Pol I</text>
  <line x1="410.0" y1="416.0" x2="468.0" y2="416.0" stroke="#60a5fa" stroke-width="7" stroke-linecap="butt"/>
  <line x1="468.0" y1="416.0" x2="490.0" y2="416.0" stroke="#dc2626" stroke-width="7" stroke-linecap="butt"/>
  <path d="M406.0 416.0 L416.0 411.4 L416.0 420.6 Z" fill="#60a5fa"/>
  <ellipse cx="400.0" cy="390.0" rx="32.0" ry="16.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="400.0" y="393.5" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">Pol III</text>
  <line x1="515.0" y1="416.0" x2="555.0" y2="416.0" stroke="#dc2626" stroke-width="7" stroke-linecap="butt"/>
  <ellipse cx="573.0" cy="390.0" rx="30.0" ry="16.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <text x="573.0" y="393.5" font-size="10" fill="#be185d" text-anchor="middle" font-weight="700">primase</text>
  <text x="250.0" y="470.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">lagging strand: Okazaki fragments, each from its own primer, built away from the fork</text>
  <text x="630.0" y="270.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">fork moves this way</text>
  <line x1="630.0" y1="280.0" x2="723.6" y2="280.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M730.0 280.0 L722.7 283.4 L722.7 276.6 Z" fill="#4b5563"/>
  <rect x="40.0" y="500.0" width="820.0" height="120.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <line x1="70.0" y1="528.0" x2="110.0" y2="528.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <text x="120.0" y="533.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">parent (template) strand</text>
  <line x1="340.0" y1="528.0" x2="380.0" y2="528.0" stroke="#60a5fa" stroke-width="7" stroke-linecap="butt"/>
  <text x="390.0" y="533.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">new DNA (made 5' to 3')</text>
  <line x1="610.0" y1="528.0" x2="650.0" y2="528.0" stroke="#dc2626" stroke-width="7" stroke-linecap="butt"/>
  <text x="660.0" y="533.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">RNA primer (5-10 nucleotides)</text>
  <text x="70.0" y="562.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Pol III adds nucleotides only to a 3' end, so one new strand grows towards the fork and the other away from it.</text>
  <text x="70.0" y="584.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dNTPs supply the nucleotides; two phosphates are split off each one, giving energy. Pol I removes primers; ligase seals gaps.</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
