  <line x1="748.0" y1="304.0" x2="748.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="764.0" y1="304.0" x2="764.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
