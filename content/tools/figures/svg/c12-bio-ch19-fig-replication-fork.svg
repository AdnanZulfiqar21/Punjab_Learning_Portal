  <line x1="812.0" y1="304.0" x2="812.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="828.0" y1="304.0" x2="828.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="844.0" y1="304.0" x2="844.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="860.0" y1="304.0" x2="860.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="876.0" y1="304.0" x2="876.0" y2="326.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="790.0" cy="315.0" rx="34.0" ry="28.0" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <text x="790.0" y="318.9" font-size="11" fill="#0e7490" text-anchor="middle" font-weight="700">gyrase</text>
  <text x="790.0" y="368.0" font-size="11" fill="#0e7490" text-anchor="middle" font-weight="700">gyrase (topoisomerase)</text>
  <text x="790.0" y="384.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">relieves supercoils ahead</text>
  <path d="M40 190 L510 190 Q560 190 610 300" stroke="#1e3a8a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40 440 L510 440 Q560 440 610 330" stroke="#1e3a8a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
