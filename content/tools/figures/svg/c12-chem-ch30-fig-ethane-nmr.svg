<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original diagram after Fig 30.6: the high-resolution 1H NMR spectrum of ethane, a single unsplit peak near 0.9 ppm because all six hydrogen atoms are equivalent. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">High-resolution 1H NMR spectrum of ethane (after Fig 30.6)</text>
  <line x1="90.0" y1="350.0" x2="830.0" y2="350.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="830.0" y1="350.0" x2="830.0" y2="358.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="830.0" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <line x1="583.3" y1="350.0" x2="583.3" y2="358.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="583.3" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <line x1="336.7" y1="350.0" x2="336.7" y2="358.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="336.7" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2</text>
  <line x1="90.0" y1="350.0" x2="90.0" y2="358.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="90.0" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <line x1="706.7" y1="350.0" x2="706.7" y2="355.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460.0" y1="350.0" x2="460.0" y2="355.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="213.3" y1="350.0" x2="213.3" y2="355.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460.0" y="404.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">chemical shift, delta / ppm (TMS = 0)</text>
  <path d="M603.8666666666667 350 C613.8666666666667 350 615.8666666666667 130 617.8666666666667 130 C619.8666666666667 130 621.8666666666667 350 631.8666666666667 350" stroke="#d7322f" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="260.0" y="150.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="7.0" font-size="15.4">3</tspan><tspan dy="-7.0">C-CH</tspan><tspan dy="7.0" font-size="15.4">3</tspan></text>
  <text x="260.0" y="182.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">all six H atoms are equivalent,</text>
  <text x="260.0" y="200.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">so they do not split each other</text>
  <line x1="517.9" y1="150.0" x2="598.7" y2="150.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M605.9 150.0 L597.7 153.8 L597.7 146.2 Z" fill="#4b5563"/>
  <text x="509.9" y="140.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">one unsplit peak</text>
  <text x="509.9" y="158.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">(singlet) near 0.9 ppm</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
