<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figure 9.6: the regions of the stomach, the layers of its wall and a gastric gland. Schematic. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <!-- stomach outline -->
  <text class="h" x="300" y="40">The stomach</text>
  <path d="M250 80 V150" stroke="#d98b2b" stroke-width="22"/>
  <text class="s" x="290" y="110">oesophagus</text>
  <path d="M250 150 q-90 -40 -130 40 q-30 90 30 180 q60 90 160 100 q120 10 170 -60 q30 -40 20 -70" fill="#f6d5cf" stroke="#d7322f" stroke-width="6"/>
  <path d="M225 150 h50" stroke="#14181f" stroke-width="8" stroke-linecap="round"/>
  <text class="s" x="300" y="150">cardiac sphincter</text>
  <path d="M500 340 q20 -40 70 -30" fill="none" stroke="#f2b134" stroke-width="22" stroke-linecap="round"/>
  <path d="M485 332 l30 12" stroke="#14181f" stroke-width="8" stroke-linecap="round"/>
  <text class="s" x="540" y="365">pyloric sphincter</text><text class="s" x="560" y="300">duodenum</text>
  <text class="k" x="150" y="215">Fundus</text>
  <text class="k" x="265" y="240">Cardiac portion</text>
  <text class="k" x="200" y="300">Body</text>
  <text class="k" x="340" y="400">Pyloric portion</text>
  <text class="s" x="80" y="470">J-shaped elastic bag on the left of the abdomen,</text><text class="s" x="80" y="492">just below the diaphragm; churns food and</text><text class="s" x="80" y="514">mixes it with gastric juice; heat melts fats</text>
  <text class="s" x="80" y="550">after 3-4 hours the mix is a semi-liquid acidic</text><text class="s" x="80" y="572">chyme, released through the pyloric sphincter</text>
  <!-- wall layers -->
  <text class="h" x="800" y="40">Layers of the wall</text>
  <g>
    <rect x="660" y="70" width="280" height="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="960" y="92">serosa (outermost)</text>
    <rect x="660" y="100" width="280" height="30" fill="#f6d5cf" stroke="#b5463a" stroke-width="2"/><text class="s" x="960" y="122">longitudinal muscle</text>
    <rect x="660" y="130" width="280" height="30" fill="#f2b7af" stroke="#b5463a" stroke-width="2"/><text class="s" x="960" y="152">circular muscle</text>
    <rect x="660" y="160" width="280" height="30" fill="#e89a90" stroke="#b5463a" stroke-width="2"/><text class="s" x="960" y="182">oblique muscle (inner)</text>
    <rect x="660" y="190" width="280" height="30" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="960" y="212">submucosa</text>
    <rect x="660" y="220" width="280" height="36" fill="#f2b134" stroke="#d98b2b" stroke-width="2"/><text class="s" x="960" y="244">mucosa, with gastric glands</text>
  </g>
  <text class="s" x="660" y="290">three muscle layers in the stomach (two elsewhere)</text>
  <!-- gastric gland -->
  <text class="h" x="800" y="350">A gastric gland</text>
  <rect x="660" y="370" width="280" height="30" fill="#f2b134" stroke="#d98b2b" stroke-width="2"/>
  <path d="M780 370 v30 q0 10 -10 10 h-20 M820 370 v30 q0 10 10 10 h20" fill="none" stroke="#d98b2b" stroke-width="3"/>
  <text class="s" x="960" y="392">gastric pit (opening)</text>
  <path d="M770 410 v230 q30 30 60 0 v-230" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <g>
    <rect x="774" y="420" width="52" height="50" fill="#dbe9f5"/><text class="k" x="850" y="438">Mucous cells</text><text class="s" x="850" y="460">mucus coats and protects the lining</text>
    <rect x="774" y="480" width="52" height="60" fill="#f6d5cf"/><text class="k" x="850" y="500">Parietal (oxyntic) cells</text><text class="s" x="850" y="522">HCl: pH 2-3, softens food, activates</text><text class="s" x="850" y="544">pepsinogen, kills microbes</text>
    <rect x="774" y="550" width="52" height="70" fill="#b2dbcc"/><text class="k" x="850" y="580">Chief cells</text><text class="s" x="850" y="602">pepsinogen, inactive until HCl</text><text class="s" x="850" y="624">turns it into pepsin</text>
  </g>
  <text class="s" x="600" y="690" text-anchor="middle">All the secretions together are gastric juice; pepsin cuts proteins into polypeptides and peptides.</text>
  <text class="s" x="600" y="716" text-anchor="middle">In infants the juice also has rennin, which coagulates milk proteins.</text>
  <text class="s" x="600" y="742" text-anchor="middle">The mucosa is protected from its own acid and pepsin by viscous mucus and by bicarbonate.</text>
</svg>
