<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Roman Urdu figure: the try, except and finally paths of the sqlite3 insert example. -->
  <rect x="220.0" y="15.0" width="560.0" height="110.0" rx="14" fill="#dbe8f6" stroke="#2f6fb0" stroke-width="3"/>
  <text x="500.0" y="62.0" font-size="29" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">try:</text>
  <text x="500.0" y="98.3" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">connect, data insert</text>
  <rect x="20.0" y="255.0" width="460.0" height="130.0" rx="14" fill="#dcefe4" stroke="#1e7a4f" stroke-width="3"/>
  <text x="250.0" y="293.9" font-size="29" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Koi error nahi</text>
  <text x="250.0" y="330.1" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">commit() data save karta hai</text>
  <text x="250.0" y="366.4" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">'Data inserted successfully'</text>
  <rect x="520.0" y="255.0" width="460.0" height="130.0" rx="14" fill="#fbe0e0" stroke="#c0392b" stroke-width="3"/>
  <text x="750.0" y="293.9" font-size="29" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">except sqlite3.Error</text>
  <text x="750.0" y="330.1" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">error dikhata hai</text>
  <text x="750.0" y="366.4" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">rollback() tabdeeli wapas</text>
  <rect x="220.0" y="515.0" width="560.0" height="110.0" rx="14" fill="#ece3fa" stroke="#7a4fd0" stroke-width="3"/>
  <text x="500.0" y="562.0" font-size="29" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">finally:</text>
  <text x="500.0" y="598.3" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">connection close, 'Connection closed'</text>
  <line x1="400.0" y1="126.0" x2="310.6" y2="238.7" stroke="#1e7a4f" stroke-width="4" stroke-linecap="butt"/>
  <path d="M300.0 252.0 L304.4 232.5 L318.0 243.3 Z" fill="#1e7a4f"/>
  <line x1="600.0" y1="126.0" x2="689.4" y2="238.7" stroke="#c0392b" stroke-width="4" stroke-linecap="butt"/>
  <path d="M700.0 252.0 L682.0 243.3 L695.6 232.5 Z" fill="#c0392b"/>
  <line x1="250.0" y1="386.0" x2="406.3" y2="501.9" stroke="#1d2330" stroke-width="4" stroke-linecap="butt"/>
  <path d="M420.0 512.0 L400.4 508.3 L410.7 494.3 Z" fill="#1d2330"/>
  <line x1="750.0" y1="386.0" x2="593.7" y2="501.9" stroke="#1d2330" stroke-width="4" stroke-linecap="butt"/>
  <path d="M580.0 512.0 L589.3 494.3 L599.6 508.3 Z" fill="#1d2330"/>
</svg>
