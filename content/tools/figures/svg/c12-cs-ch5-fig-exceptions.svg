<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: the try path to commit, the except path to rollback, and finally closing the connection. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Exception handling with try, except and finally (after the example)</text>
  <rect x="270.0" y="65.0" width="360.0" height="50.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="450.0" y="95.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">try: connect, insert, commit</text>
  <line x1="360.0" y1="117.0" x2="256.7" y2="185.6" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250.0 190.0 L255.2 181.5 L259.9 188.5 Z" fill="#0f7a62"/>
  <line x1="540.0" y1="117.0" x2="643.3" y2="185.6" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M650.0 190.0 L640.1 188.5 L644.8 181.5 Z" fill="#d7322f"/>
  <text x="270.0" y="150.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">no error</text>
  <text x="612.0" y="145.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">sqlite3.Error raised</text>
  <rect x="80.0" y="190.0" width="300.0" height="50.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="230.0" y="213.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">commit() saves the data</text>
  <text x="230.0" y="229.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">'Data inserted successfully'</text>
  <rect x="520.0" y="190.0" width="300.0" height="50.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="670.0" y="213.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">except: show the error</text>
  <text x="670.0" y="229.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">rollback() undoes the changes</text>
  <line x1="230.0" y1="242.0" x2="413.3" y2="317.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M420.0 320.0 L411.0 320.4 L413.9 313.4 Z" fill="#14181f"/>
  <line x1="670.0" y1="242.0" x2="486.7" y2="317.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M480.0 320.0 L486.1 313.4 L489.0 320.4 Z" fill="#14181f"/>
  <rect x="280.0" y="320.0" width="340.0" height="50.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="450.0" y="343.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">finally: close the connection</text>
  <text x="450.0" y="359.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">runs whether or not an error happened</text>
  <text x="450.0" y="425.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">The program does not crash: every path ends in finally.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
