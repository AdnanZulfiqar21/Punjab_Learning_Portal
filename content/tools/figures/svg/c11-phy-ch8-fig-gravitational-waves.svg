<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.9 and topics 8.6 and 8.7: gravitational waves from a binary system and their effect on a ring of masses, their types and characteristics, and the laser interferometer. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Gravitational waves and the laser interferometer</text>
  <rect x="50" y="55" width="560" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="330" y="83">Gravitational waves from a binary system (8.6)</text>
  <circle cx="190" cy="230" r="24" fill="none" stroke="#1f6fb5" stroke-width="1.5" opacity="0.85"/>
  <circle cx="190" cy="230" r="42" fill="none" stroke="#1f6fb5" stroke-width="1.5" opacity="0.74"/>
  <circle cx="190" cy="230" r="60" fill="none" stroke="#1f6fb5" stroke-width="1.5" opacity="0.62"/>
  <circle cx="190" cy="230" r="78" fill="none" stroke="#1f6fb5" stroke-width="1.5" opacity="0.51"/>
  <circle cx="190" cy="230" r="96" fill="none" stroke="#1f6fb5" stroke-width="1.5" opacity="0.40"/>
  <circle cx="178" cy="230" r="9" fill="#14181f"/><circle cx="204" cy="230" r="7" fill="#14181f"/>
  <path d="M168 215 A 24 14 0 0 1 214 215" fill="none" stroke="#d7322f" stroke-width="1.5" marker-end="url(#p)"/>
  <text class="r" x="120" y="352">binary system radiating outward</text>
  <ellipse cx="360" cy="215" rx="22" ry="22" fill="none" stroke="#0f7a62" stroke-width="2"/>
  <text class="r" x="348" y="262">t = 0</text>
  <ellipse cx="420" cy="215" rx="30" ry="16" fill="none" stroke="#0f7a62" stroke-width="2"/>
  <text class="r" x="408" y="262">T/4</text>
  <ellipse cx="480" cy="215" rx="22" ry="22" fill="none" stroke="#0f7a62" stroke-width="2"/>
  <text class="r" x="468" y="262">T/2</text>
  <ellipse cx="540" cy="215" rx="16" ry="30" fill="none" stroke="#0f7a62" stroke-width="2"/>
  <text class="r" x="528" y="262">3T/4</text>
  <text class="r" x="336" y="160">a ring of free masses as a wave</text>
  <text class="r" x="336" y="174">passes through the page:</text>
  <g class="r">
    <text x="336" y="290">stretched one way, squeezed the other,</text>
    <text x="336" y="305">periodically: spacetime distortion</text>
    <text x="336" y="320">(tidal forces); amplitude only</text>
    <text x="336" y="335">10^-21 to 10^-22 m at the Earth</text>
  </g>
  <g class="t">
    <text x="70" y="106">ripples in the fabric of spacetime from violent cosmic events,</text>
    <text x="70" y="122">travelling at the speed of light; predicted by Einstein (1916)</text>
  </g>
  <rect x="630" y="55" width="520" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="890" y="83">Prediction, types and characteristics</text>
  <g class="r">
    <text x="650" y="102">general relativity: gravity is not a force but a curvature of spacetime made by</text>
    <text x="650" y="117">massive bodies, like a dent in a mattress; accelerating masses send out ripples</text>
    <text x="650" y="147">1 continuous: one massive body spinning steadily (a neutron star), same</text>
    <text x="650" y="162">frequency and amplitude; white dwarf binaries</text>
    <text x="650" y="177">2 compact binary inspiral: binary neutron stars or black holes, or a neutron</text>
    <text x="650" y="192">star and a black hole, spiralling together; frequency and amplitude grow</text>
    <text x="650" y="207">3 burst: violent events such as supernovae, gamma-ray bursts, cosmic strings</text>
    <text x="650" y="222">4 stochastic: weak random signals from many distant sources; hardest to detect</text>
    <text x="650" y="252">characteristics depend on the masses, the orbital period and frequency and</text>
    <text x="650" y="267">the eccentricity e of the orbit: e = 0 circle, 0 &lt; e &lt; 1 ellipse,</text>
    <text x="650" y="282">e = 1 parabola, e &gt; 1 hyperbola; Earth's masses and accelerations are</text>
    <text x="650" y="297">far too small to make detectable waves</text>
  </g>
  <rect x="50" y="405" width="620" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="360" y="433">Michelson laser interferometer (8.7, Fig. 8.9)</text>
  <rect x="70" y="560" width="54" height="26" rx="4" fill="#fde8e7" stroke="#d7322f"/><text class="r" x="80" y="577">laser</text>
  <path d="M124 573 H234" stroke="#d7322f" stroke-width="2"/>
  <path d="M150 552 V594" stroke="#1f6fb5" stroke-width="5"/>
  <path d="M226 589 L254 557" stroke="#4b5563" stroke-width="4"/>
  <path d="M240 573 H600" stroke="#d7322f" stroke-width="2"/>
  <path d="M240 573 V462" stroke="#d7322f" stroke-width="2"/>
  <path d="M240 573 V618" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M285 556 V590" stroke="#1f6fb5" stroke-width="5"/>
  <path d="M604 552 V594" stroke="#1f6fb5" stroke-width="6"/>
  <path d="M222 530 H258" stroke="#1f6fb5" stroke-width="5"/>
  <path d="M218 458 H262" stroke="#1f6fb5" stroke-width="6"/>
  <rect x="222" y="624" width="36" height="22" rx="3" fill="#ffffff" stroke="#4b5563"/>
  <text class="r" x="128" y="612">power recycling</text>
  <text class="r" x="146" y="624">mirror</text>
  <text class="r" x="170" y="548">beam splitter</text>
  <text class="r" x="292" y="608">input mirror</text>
  <text class="r" x="560" y="612">end mirror</text>
  <text class="r" x="268" y="534">input mirror</text>
  <text class="r" x="268" y="462">end mirror</text>
  <text class="r" x="266" y="662">photodetector</text>
  <path d="M300 566 H596" stroke="#0f7a62" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="r" x="380" y="558">Fabry-Perot cavity (arm)</text>
  <text class="r" x="268" y="500">Fabry-Perot cavity</text>
  <g class="r">
    <text x="400" y="470">the splitter sends the laser down two</text>
    <text x="400" y="485">perpendicular arms; mirrors return the</text>
    <text x="400" y="500">beams, which recombine and interfere</text>
  </g>
  <g class="r">
    <text x="380" y="636">a passing wave changes the arm lengths a little,</text>
    <text x="380" y="651">shifting the phase and the interference pattern;</text>
    <text x="380" y="666">LIGO is 1000 times larger and uses a laser</text>
  </g>
  <rect x="690" y="405" width="460" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="920" y="433">Components and detections</text>
  <g class="r">
    <text x="710" y="452">1 laser: stable, high-intensity beam; 2 power recycling mirror: sends</text>
    <text x="710" y="467">used light back in; 3 beam splitter: two perpendicular beams; 4 mirrors:</text>
    <text x="710" y="482">two perpendicular arms; 5 Fabry-Perot cavity: two facing mirrors that</text>
    <text x="710" y="497">lengthen the path; 6 photodetectors: tiny phase shifts; 7 arm cavities:</text>
    <text x="710" y="512">build up the light and the sensitivity</text>
    <text x="710" y="542">14 September 2015: LIGO (USA) recorded the first waves, from two black</text>
    <text x="710" y="557">holes colliding 1.3 billion years ago; Nobel Prize 2017 to Weiss, Barish</text>
    <text x="710" y="572">and Thorne; Nergis Mavalvala (MIT) is from Pakistan</text>
    <text x="710" y="587">Virgo (Cascina near Pisa, Italy): 3 km arms against LIGO's 4 km; first</text>
    <text x="710" y="602">detection in 2017</text>
    <text x="710" y="632">Ex 8.5: 4000 km: f = 3 x 10^8 / 4 x 10^6 = 75 Hz</text>
    <text x="710" y="647">Ex 8.6: 0.1 Hz: lambda = 3 x 10^8 / 0.1 = 3 x 10^9 m</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
