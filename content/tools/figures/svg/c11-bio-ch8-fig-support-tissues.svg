<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.6: parenchyma, collenchyma and sclerenchyma cells. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="200" y="40">(a) Parenchyma</text>
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="3">
    <path d="M90 120 q60 -40 110 0 q40 50 0 100 q-60 30 -110 0 q-30 -50 0 -100 z"/>
    <path d="M210 110 q60 -30 100 10 q30 50 -10 90 q-50 30 -100 0 q-30 -50 10 -100 z"/>
    <path d="M110 230 q60 -30 110 0 q30 50 0 100 q-60 30 -110 0 q-30 -50 0 -100 z"/>
    <path d="M230 230 q60 -30 100 10 q30 50 -10 90 q-50 30 -100 0 q-30 -50 10 -100 z"/>
  </g>
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><ellipse cx="145" cy="170" rx="35" ry="30"/><ellipse cx="255" cy="165" rx="35" ry="30"/><ellipse cx="165" cy="280" rx="35" ry="30"/><ellipse cx="275" cy="280" rx="35" ry="30"/></g>
  <text class="s" x="200" y="400">thin walls; large vacuole;</text><text class="s" x="200" y="424">turgor pressure gives support</text><text class="s" x="200" y="448">to soft, herbaceous parts</text>
  <text class="h" x="600" y="40">(b) Collenchyma</text>
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="3">
    <polygon points="500,110 580,100 600,170 540,200 480,170"/><polygon points="600,110 680,100 700,170 640,200 580,170"/><polygon points="520,210 600,200 620,270 560,300 500,270"/><polygon points="620,210 700,200 720,270 660,300 600,270"/>
  </g>
  <g fill="#0f7a62"><circle cx="500" cy="110" r="10"/><circle cx="580" cy="100" r="10"/><circle cx="600" cy="170" r="10"/><circle cx="540" cy="200" r="10"/><circle cx="480" cy="170" r="10"/><circle cx="680" cy="100" r="10"/><circle cx="700" cy="170" r="10"/><circle cx="640" cy="200" r="10"/><circle cx="620" cy="270" r="10"/><circle cx="560" cy="300" r="10"/><circle cx="500" cy="270" r="10"/><circle cx="720" cy="270" r="10"/><circle cx="660" cy="300" r="10"/></g>
  <text class="s" x="600" y="400">primary walls thickened at the</text><text class="s" x="600" y="424">corners with extra cellulose;</text><text class="s" x="600" y="448">living; supports young growing parts</text>
  <text class="h" x="1000" y="40">(c) Sclerenchyma</text>
  <g fill="#8a4b00" stroke="#5a2e00" stroke-width="3">
    <path d="M900 110 h60 v180 h-60 z"/><path d="M980 110 h60 v180 h-60 z"/>
  </g>
  <g fill="#fff4e2"><rect x="920" y="130" width="20" height="140"/><rect x="1000" y="130" width="20" height="140"/></g>
  <g fill="#8a4b00" stroke="#5a2e00" stroke-width="3"><circle cx="1100" cy="160" r="34"/><circle cx="1100" cy="250" r="34"/></g>
  <g fill="#fff4e2"><circle cx="1100" cy="160" r="8"/><circle cx="1100" cy="250" r="8"/></g>
  <text class="s" x="970" y="320">fibres</text><text class="s" x="1100" y="320">sclereids</text>
  <text class="s" x="1000" y="400">thick lignified secondary walls;</text><text class="s" x="1000" y="424">mostly dead at maturity; fibres,</text><text class="s" x="1000" y="448">sclereids (seed coats) and vessels</text>
  <text class="s" x="600" y="540">Supporting tissues: parenchyma (turgor), collenchyma (young stems and leaf stalks), sclerenchyma (lignin), xylem and phloem.</text>
  <text class="s" x="600" y="580">Turgor pressure: the tonoplast pumps ions into the vacuole, water follows, and the swollen cell presses on its wall.</text>
</svg>
