  <text x="980.0" y="210.8" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">+ N</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"> + HCl</tspan></text>
</svg>
