  <line x1="110.0" y1="140.0" x2="110.0" y2="106.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="110.0" y="97.3" font-size="28" fill="#6a3fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="200.0" y1="190.0" x2="387.2" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M400.0 190.0 L385.5 196.8 L385.5 183.2 Z" fill="#14181f"/>
  <text x="300.0" y="176.0" font-size="27" fill="#d7322f" text-anchor="middle" font-weight="400"><tspan dy="0.0">NaNO</tspan><tspan dy="8.1" font-size="19.4">2</tspan><tspan dy="-8.1"></tspan></text>
  <text x="300.0" y="225.0" font-size="27" fill="#d7322f" text-anchor="middle" font-weight="400"><tspan dy="0.0">HCl, &lt; 10&#176;C</tspan></text>
  <path d="M510.0 140.0 L553.3 165.0 L553.3 215.0 L510.0 240.0 L466.7 215.0 L466.7 165.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="510.0" cy="190.0" r="29.0" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="510.0" y1="140.0" x2="510.0" y2="106.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="510.0" y="94.0" font-size="30" fill="#6a3fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <circle cx="530.0" cy="56.0" r="10.0" stroke="#14181f" stroke-width="2.4" fill="#ffffff"/>
  <line x1="524.5" y1="56.0" x2="535.5" y2="56.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="530.0" y1="50.5" x2="530.0" y2="61.5" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="530.0" y1="84.0" x2="585.0" y2="84.0" stroke="#6a3fb5" stroke-width="3" stroke-linecap="round"/>
  <line x1="530.0" y1="74.0" x2="585.0" y2="74.0" stroke="#6a3fb5" stroke-width="3" stroke-linecap="round"/>
  <line x1="530.0" y1="94.0" x2="585.0" y2="94.0" stroke="#6a3fb5" stroke-width="3" stroke-linecap="round"/>
  <text x="602.0" y="94.0" font-size="30" fill="#6a3fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <text x="652.0" y="94.0" font-size="30" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="-12.0" font-size="21.6">&#8722;</tspan><tspan dy="12.0"></tspan></text>
  <line x1="620.0" y1="190.0" x2="807.2" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M820.0 190.0 L805.5 196.8 L805.5 183.2 Z" fill="#14181f"/>
  <text x="720.0" y="176.0" font-size="27" fill="#d7322f" text-anchor="middle" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="8.1" font-size="19.4">2</tspan><tspan dy="-8.1">O</tspan></text>
  <text x="720.0" y="225.0" font-size="27" fill="#d7322f" text-anchor="middle" font-weight="400"><tspan dy="0.0">warm</tspan></text>
