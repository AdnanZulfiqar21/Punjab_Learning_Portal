<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="330" fill="#ffffff"/>
  <!-- After p95 (22.5): phenylamine, NaNO2 over and 'HCl, &lt; 10 degrees C' under the arrow, gives benzenediazonium chloride (N+ triple bond N, Cl-), which on warming with water gives phenol + N2 + HCl. The book prints NaOH over the last arrow and + NaCl + N2; drawn with the correct reagent and products, as the book gives on p125. -->
  <path d="M110.0 140.0 L153.3 165.0 L153.3 215.0 L110.0 240.0 L66.7 215.0 L66.7 165.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
