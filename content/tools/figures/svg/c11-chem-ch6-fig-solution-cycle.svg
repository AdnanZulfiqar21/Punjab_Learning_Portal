<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 6.5 to 6.7: hydration of ions, lattice energy trends, and the energy cycle of solution with the NaF numbers of Sample Problem 6.8. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .b{font-size:14px;font-weight:700;fill:#14181f;text-anchor:middle}
      .e{font-size:11px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Dissolving an ionic solid: lattice energy, hydration and the enthalpy of solution</text>
  <!-- hydration picture -->
  <text class="k" x="200" y="72">Hydration (Figure 6.5)</text>
  <circle cx="200" cy="170" r="26" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="b" x="200" y="175">Na+</text>
  <g>
    <g transform="translate(200 110)"><circle cx="0" cy="0" r="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/><text class="e" x="0" y="4">O</text><circle cx="-10" cy="-12" r="5" fill="#f3f4f6" stroke="#9ca3af"/><circle cx="10" cy="-12" r="5" fill="#f3f4f6" stroke="#9ca3af"/></g>
    <g transform="translate(200 230)"><circle cx="0" cy="0" r="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/><text class="e" x="0" y="4">O</text><circle cx="-10" cy="12" r="5" fill="#f3f4f6" stroke="#9ca3af"/><circle cx="10" cy="12" r="5" fill="#f3f4f6" stroke="#9ca3af"/></g>
    <g transform="translate(140 170)"><circle cx="0" cy="0" r="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/><text class="e" x="0" y="4">O</text><circle cx="-12" cy="-10" r="5" fill="#f3f4f6" stroke="#9ca3af"/><circle cx="-12" cy="10" r="5" fill="#f3f4f6" stroke="#9ca3af"/></g>
    <g transform="translate(260 170)"><circle cx="0" cy="0" r="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/><text class="e" x="0" y="4">O</text><circle cx="12" cy="-10" r="5" fill="#f3f4f6" stroke="#9ca3af"/><circle cx="12" cy="10" r="5" fill="#f3f4f6" stroke="#9ca3af"/></g>
  </g>
  <text class="s" x="200" y="275">the delta- oxygen ends of water face a cation;</text><text class="s" x="200" y="293">the delta+ hydrogen ends face an anion: ion-dipole forces</text>
  <g class="t">
    <text x="60" y="325" style="font-weight:700;fill:#14181f">Enthalpy of hydration: always released</text>
    <text x="60" y="345">larger with charge density (charge per unit area):</text>
    <text x="60" y="363">Na+ &lt; Mg2+ &lt; Al3+ (more charge); Sr2+ &lt; Ca2+ &lt; Mg2+ (smaller ion)</text>
    <text x="60" y="391" style="font-weight:700;fill:#14181f">Lattice energy: gaseous ions to the solid, always released</text>
    <text x="60" y="411">NaCl -787 kJ per mol; falls as either ion grows (LiF to CsI);</text>
    <text x="60" y="429">rises steeply with charge: LiF -1049 but MgO -3923 kJ per mol</text>
  </g>
  <!-- lattice energy schematic chart -->
  <text class="k" x="360" y="470">Alkali metal halides (Figure 6.6)</text>
  <path d="M100 630 V485 M100 630 H440" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="80" y="560" transform="rotate(-90 80 560)" text-anchor="middle" style="font-size:11px">lattice energy, more negative upward</text>
  <g class="s" style="font-size:11px"><text x="150" y="645">F-</text><text x="230" y="645">Cl-</text><text x="310" y="645">Br-</text><text x="390" y="645">I-</text></g>
  <g fill="none" stroke-width="2"><polyline points="150,500 230,545 310,560 390,580" stroke="#d7322f"/><polyline points="150,540 230,575 310,588 390,602" stroke="#d98b2b"/><polyline points="150,575 230,598 310,608 390,618" stroke="#1f6fb5"/></g>
  <g class="t" style="font-size:11px"><text x="395" y="582" style="fill:#d7322f">Li+</text><text x="395" y="604" style="fill:#d98b2b">Na+</text><text x="395" y="620" style="fill:#1f6fb5">K+ and larger</text></g>
  <text class="s" x="270" y="658" style="font-size:11px">schematic: printed values are not reproduced</text>
  <!-- energy cycle -->
  <text class="k" x="830" y="72">Energy cycle of solution (Figure 6.7) with Sample 6.8, NaF</text>
  <rect x="560" y="110" width="200" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="660" y="139">Na+(g) + F-(g)</text>
  <rect x="560" y="330" width="200" height="46" rx="10" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><text class="b" x="660" y="359">NaF(s)</text>
  <rect x="920" y="330" width="220" height="46" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="1030" y="359">Na+(aq) + F-(aq)</text>
  <path d="M660 156 V322" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/><text class="t" x="672" y="230">lattice energy</text><text class="t" x="672" y="248">delta H latt = -902</text>
  <path d="M760 133 L1030 322" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/><text class="t" x="900" y="190">hydration of both ions</text><text class="t" x="900" y="208">delta H hyd = -406 + (-506) = -912</text>
  <path d="M760 353 H912" stroke="#d7322f" stroke-width="3" marker-end="url(#a)"/><text class="s" x="836" y="343" style="fill:#d7322f">delta H sol = ?</text>
  <rect x="560" y="400" width="580" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="t">
    <text x="580" y="428">Hess: the route through the gaseous ions equals the direct route, so</text>
    <text x="580" y="450" style="font-weight:700;fill:#14181f">delta H latt + delta H sol = delta H hyd</text>
    <text x="580" y="476">delta H sol = delta H hyd - delta H latt = (-406 - 506) - (-902) = -10 kJ per mol</text>
    <text x="580" y="506">dissolving: expand the solvent, expand the solute, let them interact;</text>
    <text x="580" y="524">delta H sol is + when the lattice wins (NH4Cl +16.2), - when hydration wins (Na2CO3 -25)</text>
  </g>
  <text class="s" x="850" y="585">Heats of solution (Table 6.2, kJ per mol): NaCl 4.98, KCl 17.8, KBr 19.9, KI 21.4, NH4Cl 16.2, NH4NO3 26.0</text>
  <text class="s" x="850" y="610">Group 2 hydroxides: lattice energy falls faster than hydration, so solubility rises down the group;</text>
  <text class="s" x="850" y="628">sulfates: the large sulfate ion makes hydration the deciding factor, so solubility falls from MgSO4 to BaSO4</text>
</svg>
