<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics For Your Information box (PDF page 126), original drawing after the printed chart: heat flowing into the system is positive (+Q), heat flowing out negative (-Q); work done on the system is negative (-W), work done by the system positive (+W). -->
