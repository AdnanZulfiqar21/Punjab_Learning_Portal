  <line x1="110.0" y1="78.0" x2="395.2" y2="78.0" stroke="#2f7fd8" stroke-width="5" stroke-linecap="butt"/>
  <path d="M416.0 78.0 L390.0 88.9 L390.0 67.1 Z" fill="#2f7fd8"/>
  <text x="130.0" y="60.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">Heat</text>
  <text x="130.0" y="124.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">positive</text>
  <text x="720.0" y="90.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">+<tspan font-style="italic">Q</tspan></text>
  <rect x="380.0" y="220.0" width="200.0" height="76.0" rx="6" stroke="#c57f12" stroke-width="3" fill="#f8c873"/>
  <text x="480.0" y="269.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">System</text>
  <line x1="584.0" y1="258.0" x2="859.2" y2="258.0" stroke="#2f7fd8" stroke-width="5" stroke-linecap="butt"/>
  <path d="M880.0 258.0 L854.0 268.9 L854.0 247.1 Z" fill="#2f7fd8"/>
  <text x="870.0" y="240.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400">Heat</text>
  <text x="870.0" y="304.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400">negative</text>
  <text x="280.0" y="270.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">−<tspan font-style="italic">Q</tspan></text>
