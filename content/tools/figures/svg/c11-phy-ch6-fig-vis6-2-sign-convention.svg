  <line x1="110.0" y1="458.0" x2="395.2" y2="458.0" stroke="#2f7fd8" stroke-width="5" stroke-linecap="butt"/>
  <path d="M416.0 458.0 L390.0 468.9 L390.0 447.1 Z" fill="#2f7fd8"/>
  <text x="130.0" y="440.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">Work</text>
  <text x="130.0" y="504.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">negative</text>
  <text x="720.0" y="470.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">−<tspan font-style="italic">W</tspan></text>
  <rect x="380.0" y="600.0" width="200.0" height="76.0" rx="6" stroke="#c57f12" stroke-width="3" fill="#f8c873"/>
