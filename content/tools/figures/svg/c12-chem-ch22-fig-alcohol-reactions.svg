<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original summary of topic 22.4: ethanol burns (delta H = -1367 kJ/mol), gives chloroethane with HCl and ZnCl2, gives sodium ethoxide and hydrogen with sodium, and is dehydrated to ethene over hot Al2O3. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Other reactions of ethanol</text>
  <rect x="365.0" y="207.0" width="170.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="242.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">OH</tspan></text>
  <rect x="20.0" y="50.0" width="330.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="185.0" y="77.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">combustion</text>
  <text x="185.0" y="101.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH + 3O</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; 2CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 3H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="185.0" y="125.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">delta H = -1367 kJ/mol</tspan></text>
  <line x1="383.8" y1="200.0" x2="298.2" y2="157.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M291.0 153.8 L301.0 154.1 L297.2 161.6 Z" fill="#4b5563"/>
  <rect x="550.0" y="50.0" width="330.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="715.0" y="77.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">substitution</text>
  <text x="715.0" y="101.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH + HCl -&gt; C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">Cl + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="715.0" y="125.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">ZnCl</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8"> (also SOCl</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">, PX</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">, PCl</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">)</tspan></text>
  <line x1="516.2" y1="200.0" x2="601.8" y2="157.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M609.0 153.8 L602.8 161.6 L599.0 154.1 Z" fill="#4b5563"/>
  <rect x="20.0" y="335.0" width="330.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="185.0" y="362.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">with sodium</text>
  <text x="185.0" y="386.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH + 2Na -&gt; 2C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">ONa + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="185.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">bubbles of H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">: a test for -OH</tspan></text>
  <line x1="383.8" y1="271.2" x2="298.1" y2="315.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M291.0 319.1 L297.1 311.2 L301.0 318.7 Z" fill="#4b5563"/>
  <rect x="550.0" y="335.0" width="330.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="715.0" y="362.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">dehydration</text>
  <text x="715.0" y="386.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">=CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="715.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">Al</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8"> heat, or conc. H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">SO</tspan><tspan dy="3.8" font-size="8.4">4</tspan><tspan dy="-3.8"> / H</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">PO</tspan><tspan dy="3.8" font-size="8.4">4</tspan></text>
  <line x1="516.2" y1="271.2" x2="601.9" y2="315.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M609.0 319.1 L599.0 318.7 L602.9 311.2 Z" fill="#4b5563"/>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
