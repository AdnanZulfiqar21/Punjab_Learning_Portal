<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="730" fill="#ffffff"/>
  <!-- Original diagram after topics 14.1.1 and 14.1.2: a nephron with its renal corpuscle, PCT, loop of Henle, DCT and collecting duct across cortex and medulla, the afferent and efferent arterioles, peritubular capillaries and vasa recta, and the route of blood through the kidney. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">A nephron and the blood supply of the kidney</text>
  <rect x="50" y="55" width="700" height="655" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="400" y="83">One nephron in the cortex and medulla (14.1.1, 14.1.2)</text>
  <rect x="70" y="95" width="660" height="250" fill="#f8e6d8"/>
  <rect x="70" y="345" width="660" height="345" fill="#efd3c3"/>
  <path d="M70 345 H730" fill="none" stroke="#8a4b2f" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text class="l" x="655" y="336" style="fill:#8a4b2f">renal cortex</text>
  <text class="l" x="655" y="362" style="fill:#8a4b2f">renal medulla</text>
  <path d="M235 108 L314 160" fill="none" stroke="#d7322f" stroke-width="7" stroke-linecap="round"/>
  <path d="M346 160 L430 112" fill="none" stroke="#d7322f" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="330" cy="180" r="38" fill="#fde9c8" stroke="#b45309" stroke-width="3"/>
  <circle cx="320" cy="174" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="338" cy="171" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="324" cy="189" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="340" cy="187" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="330" cy="180" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <path d="M300 205 C270 240 230 200 200 232 S140 255 165 285 S235 300 250 325 V600 Q250 628 275 628 Q300 628 300 600 V262" fill="none" stroke="#b45309" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 205 C270 240 230 200 200 232 S140 255 165 285 S235 300 250 325 V600 Q250 628 275 628 Q300 628 300 600 V262" fill="none" stroke="#fde9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 262 C300 232 360 272 392 242 S455 222 475 258 S560 268 640 248" fill="none" stroke="#b45309" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 262 C300 232 360 272 392 242 S455 222 475 258 S560 268 640 248" fill="none" stroke="#fde9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 110 V670" fill="none" stroke="#b45309" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 110 V670" fill="none" stroke="#fde9c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 340 V625 Q228 652 275 652" fill="none" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M275 652 Q322 652 322 625 V340" fill="none" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <rect x="335" y="208" width="285" height="95" rx="30" fill="none" stroke="#d7322f" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M430 112 H612 V208" fill="none" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <text class="r" x="228" y="104" style="fill:#d7322f;text-anchor:end">afferent arteriole (wider)</text>
  <text class="r" x="438" y="100" style="fill:#d7322f">efferent arteriole (narrower)</text>
  <text class="l" x="378" y="172">Bowman's capsule</text>
  <text class="r" x="378" y="188" style="fill:#d7322f">glomerulus (capillaries)</text>
  <text class="r" x="470" y="136" style="fill:#d7322f">peritubular capillaries</text>
  <text class="r" x="470" y="150" style="fill:#d7322f">(around PCT and DCT)</text>
  <text class="r" x="85" y="318">proximal convoluted</text>
  <text class="r" x="85" y="333">tubule (PCT)</text>
  <text class="r" x="400" y="322">distal convoluted tubule (DCT)</text>
  <text class="r" x="218" y="470" style="text-anchor:end">descending limb</text>
  <text class="r" x="334" y="470">ascending limb</text>
  <text class="l" x="275" y="676" style="text-anchor:middle">loop of Henle</text>
  <text class="r" x="334" y="560">vasa recta: straight capillaries</text>
  <text class="r" x="334" y="574">beside the loop</text>
  <text class="r" x="655" y="400">collecting</text>
  <text class="r" x="655" y="414">duct (many</text>
  <text class="r" x="655" y="428">nephrons)</text>
  <path d="M640 672 L640 690" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="630" y="686" style="text-anchor:end">to papillary ducts and the renal pelvis</text>
  <rect x="770" y="55" width="380" height="655" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="960" y="83">Blood route through the kidney</text>
  <rect x="800" y="98" width="320" height="30" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="884" y="117">renal artery (at the hilum)</text>
  <path d="M960 128 L960 142" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="144" width="320" height="30" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="907" y="163">afferent arterioles</text>
  <path d="M960 174 L960 188" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="190" width="320" height="30" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="898" y="209">glomerulus: filtration</text>
  <path d="M960 220 L960 234" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="236" width="320" height="30" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="910" y="255">efferent arteriole</text>
  <path d="M960 266 L960 280" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="282" width="320" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="r" x="896" y="301">peritubular capillaries</text>
  <path d="M960 312 L960 326" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="328" width="320" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="r" x="884" y="347">vasa recta (juxtamedullary)</text>
  <path d="M960 358 L960 372" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="374" width="320" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="912" y="393">venules and veins</text>
  <path d="M960 404 L960 418" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="420" width="320" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="932" y="439">renal vein</text>
  <path d="M960 450 L960 464" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="800" y="466" width="320" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="910" y="485">inferior vena cava</text>
  <g class="r">
    <text x="795" y="535">about one million nephrons in each kidney</text>
    <text x="795" y="551">cortical nephrons, about 85%: short loops of Henle</text>
    <text x="795" y="567">juxtamedullary nephrons: long loops deep into the</text>
    <text x="795" y="583">medulla; their efferent arterioles form the vasa recta</text>
    <text x="795" y="599">the kidneys receive about 20 to 25% of cardiac output</text>
  </g>
  <text class="s" x="600" y="722" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
