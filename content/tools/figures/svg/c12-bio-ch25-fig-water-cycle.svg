<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <!-- Original diagram after Figure 25.2: the sun drives evaporation from the ocean, vapour condenses into clouds, precipitation falls on land, water runs off to rivers and the sea or infiltrates to groundwater, and plants return water by transpiration. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The water cycle</text>
  <rect x="0.0" y="380.0" width="900.0" height="200.0" rx="0" stroke="none" stroke-width="0" fill="#e7e5e4"/>
  <path d="M0 380 L520 380 L560 340 L640 300 L720 330 L900 330 L900 580 L0 580 Z" stroke="#78350f" stroke-width="2" fill="#d6c4a8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="0.0" y="380.0" width="360.0" height="200.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="160.0" y="430.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">ocean (Arabian Sea)</text>
  <circle cx="80.0" cy="80.0" r="34.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <circle cx="380.0" cy="110.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <circle cx="420.0" cy="110.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <circle cx="460.0" cy="110.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <circle cx="580.0" cy="90.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <circle cx="620.0" cy="90.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <circle cx="660.0" cy="90.0" r="30.0" stroke="#64748b" stroke-width="2" fill="#f1f5f9"/>
  <text x="520.0" y="60.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">condensation: clouds</text>
  <line x1="170.0" y1="360.0" x2="295.4" y2="157.5" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M300.0 150.0 L298.7 160.9 L290.8 156.0 Z" fill="#d98b2b"/>
  <text x="140.0" y="260.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">evaporation</text>
  <text x="140.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(86% from oceans)</text>
  <line x1="570.0" y1="130.0" x2="560.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="588.0" y1="130.0" x2="578.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="606.0" y1="130.0" x2="596.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="624.0" y1="130.0" x2="614.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="642.0" y1="130.0" x2="632.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="660.0" y1="130.0" x2="650.0" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <text x="640.0" y="200.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">precipitation</text>
  <path d="M650 300 L655 260 L640 260 L660 230 L680 260 L665 260 L670 300 Z" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="662.0" y1="225.0" x2="696.4" y2="175.3" stroke="#0e9aa7" stroke-width="2" stroke-linecap="round"/>
  <path d="M700.0 170.0 L698.7 177.9 L693.1 174.0 Z" fill="#0e9aa7"/>
  <text x="710.0" y="165.0" font-size="12" fill="#0e9aa7" text-anchor="start" font-weight="700">transpiration</text>
  <line x1="560.0" y1="345.0" x2="387.8" y2="383.3" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M380.0 385.0 L387.9 378.9 L389.8 387.2 Z" fill="#1f6fb5"/>
  <text x="470.0" y="352.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">surface runoff to rivers</text>
  <line x1="640.0" y1="400.0" x2="640.0" y2="462.8" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M640.0 470.0 L636.2 461.8 L643.8 461.8 Z" fill="#1e3a8a"/>
  <text x="650.0" y="450.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">infiltration</text>
  <line x1="380.0" y1="500.0" x2="900.0" y2="500.0" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 5"/>
  <text x="800.0" y="520.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">groundwater</text>
  <text x="800.0" y="380.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">animals drink and eat;</text>
  <text x="800.0" y="398.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">respiration, excretion,</text>
  <text x="800.0" y="416.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">sweat, decay return water</text>
  <text x="450.0" y="571" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
