<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topic 26.2: hexane-1,6-diamine and hexanedioic acid give nylon-6,6, [-NH-(CH2)6-NH-CO-(CH2)4-CO-]n, and water; the seven-membered caprolactam ring opens to give nylon-6, [-NH-(CH2)5-CO-]n. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Nylon-6,6 and nylon-6</text>
  <rect x="15.0" y="55.0" width="870.0" height="230.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">nylon-6,6</text>
  <text x="230.0" y="120.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">N-(CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">6</tspan><tspan dy="-5.8">-NH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="230.0" y="148.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">hexane-1,6-diamine</text>
  <text x="450.0" y="126.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <text x="660.0" y="120.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOOC-(CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">4</tspan><tspan dy="-5.8">-COOH</tspan></text>
  <text x="660.0" y="148.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">hexanedioic (adipic) acid</text>
  <line x1="450.0" y1="165.0" x2="450.0" y2="191.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 200.0 L445.4 190.0 L454.6 190.0 Z" fill="#14181f"/>
  <text x="450.0" y="240.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[-NH-(CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">6</tspan><tspan dy="-5.8">-NH-CO-(CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">4</tspan><tspan dy="-5.8">-CO-]</tspan><tspan dy="5.8" font-size="12.6">n</tspan><tspan dy="-5.8"> + 2n H</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">O</tspan></text>
  <text x="450.0" y="268.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">six carbons in each monomer: hence 6,6</text>
  <rect x="15.0" y="295.0" width="870.0" height="240.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="325.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">nylon-6 from caprolactam</text>
  <line x1="189.0" y1="362.3" x2="211.6" y2="373.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="222.9" y1="387.3" x2="228.5" y2="411.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="224.5" y1="429.4" x2="208.8" y2="449.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="192.6" y1="456.9" x2="167.4" y2="456.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="151.2" y1="449.0" x2="135.5" y2="429.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="131.5" y1="411.8" x2="137.1" y2="387.3" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="148.4" y1="373.2" x2="171.0" y2="362.3" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="180.0" y="363.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="220.7" y="382.8" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <text x="230.7" y="426.8" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="202.6" y="462.1" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="157.4" y="462.1" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="129.3" y="426.8" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="139.3" y="382.8" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="177.5" y1="348.0" x2="177.5" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="182.5" y1="348.0" x2="182.5" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="180.0" y="315.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="246.7" y="364.5" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="180.0" y="495.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">caprolactam (six carbons, one N)</text>
  <line x1="300.0" y1="410.0" x2="371.2" y2="410.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380.0 410.0 L370.0 414.6 L370.0 405.4 Z" fill="#14181f"/>
  <text x="340.0" y="398.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ring opens</text>
  <text x="610.0" y="416.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[-NH-(CH</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">5</tspan><tspan dy="-6.1">-CO-]</tspan><tspan dy="6.1" font-size="13.3">n</tspan></text>
  <text x="610.0" y="460.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">no small molecule is removed, but it is classed</text>
  <text x="610.0" y="478.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">as a condensation polymer because of its amide links</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
