<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <!-- Original diagram after Figure 27.12: the steroid nucleus of three fused six-membered rings (A, B, C) and one five-membered ring (D), with methyl groups at two ring junctions and a side chain R on ring D. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The steroid nucleus</text>
  <path d="M250.0 188.0 L286.4 209.0 L286.4 251.0 L250.0 272.0 L213.6 251.0 L213.6 209.0 Z" stroke="#14181f" stroke-width="2.5" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="238.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">A</text>
  <path d="M322.7 188.0 L359.1 209.0 L359.1 251.0 L322.7 272.0 L286.4 251.0 L286.4 209.0 Z" stroke="#14181f" stroke-width="2.5" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="322.7" y="238.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">B</text>
  <path d="M359.1 125.0 L395.5 146.0 L395.5 188.0 L359.1 209.0 L322.7 188.0 L322.7 146.0 Z" stroke="#14181f" stroke-width="2.5" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="359.1" y="175.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">C</text>
  <path d="M395.5 188.0 L395.5 146.0 L435.4 133.0 L460.1 167.0 L435.4 201.0 Z" stroke="#14181f" stroke-width="2.5" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="424.4" y="175.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">D</text>
  <line x1="286.4" y1="209.0" x2="286.4" y2="179.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="286.4" y="172.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <line x1="395.5" y1="146.0" x2="395.5" y2="116.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="395.5" y="109.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <line x1="435.4" y1="133.0" x2="453.4" y2="107.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="461.4" y="100.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="720.0" y="170.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">three six-membered rings (A, B, C)</text>
  <text x="720.0" y="190.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">and one five-membered ring (D)</text>
  <text x="720.0" y="210.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">fused together</text>
  <text x="720.0" y="230.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="720.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">examples: cholesterol, bile salts,</text>
  <text x="720.0" y="270.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">vitamin D, steroid hormones</text>
  <text x="450.0" y="371" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
