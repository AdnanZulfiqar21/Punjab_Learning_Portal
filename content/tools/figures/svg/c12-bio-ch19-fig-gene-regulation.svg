<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.21: a repressor on the operator blocks RNA polymerase (negative regulation), and an activator on a regulatory site helps RNA polymerase bind the promoter (positive regulation). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Switching genes off and on at transcription</text>
  <rect x="15.0" y="55.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">negative regulation: a repressor blocks</text>
  <line x1="40.0" y1="195.0" x2="860.0" y2="195.0" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
  <rect x="220.0" y="181.0" width="140.0" height="28.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="290.0" y="200.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">promoter</text>
  <rect x="370.0" y="181.0" width="110.0" height="28.0" rx="4" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="425.0" y="200.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">operator</text>
  <rect x="490.0" y="181.0" width="340.0" height="28.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="660.0" y="200.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">gene</text>
  <ellipse cx="425.0" cy="155.0" rx="50.0" ry="24.0" stroke="#d7322f" stroke-width="2" fill="#fee2e2"/>
  <text x="425.0" y="159.2" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">repressor</text>
  <ellipse cx="260.0" cy="145.0" rx="70.0" ry="30.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="260.0" y="149.2" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">RNA pol</text>
  <text x="660.0" y="155.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">RNA polymerase cannot pass:</text>
  <text x="660.0" y="173.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">transcription stops or slows</text>
  <rect x="15.0" y="285.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="315.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">positive regulation: an activator helps</text>
  <line x1="40.0" y1="425.0" x2="860.0" y2="425.0" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
  <rect x="220.0" y="411.0" width="140.0" height="28.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="290.0" y="430.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">promoter</text>
  <rect x="370.0" y="411.0" width="110.0" height="28.0" rx="4" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="425.0" y="430.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">regulatory site</text>
  <rect x="490.0" y="411.0" width="340.0" height="28.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="660.0" y="430.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">gene</text>
  <ellipse cx="400.0" cy="385.0" rx="50.0" ry="24.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="400.0" y="389.2" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">activator</text>
  <ellipse cx="290.0" cy="383.0" rx="70.0" ry="30.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="290.0" y="387.2" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">RNA pol</text>
  <line x1="500.0" y1="385.0" x2="811.2" y2="385.0" stroke="#0f7a62" stroke-width="3" stroke-linecap="round"/>
  <path d="M820.0 385.0 L810.0 389.6 L810.0 380.4 Z" fill="#0f7a62"/>
  <text x="660.0" y="373.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">transcription starts / speeds up</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
