<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <!-- Fig 15.6 (C12-PHY, PDF p49): the printed bench seen at an angle. A microwave transmitter on a stand (front left) faces three upright metal sheets standing on L-shaped feet, which leave two narrow gaps; behind them a microwave probe on a stand is wired to a meter on the right. A power unit is cut off at the left edge. Labels as printed. -->
  <!-- table top -->
  <path d="M0 250 L520 40 L1200 230 L1200 900 L0 900 Z" fill="#f6dba8" stroke="#e0b46a" stroke-width="3" stroke-linejoin="round"/>
  <!-- power unit at the left edge (cut off) -->
  <path d="M0 150 L70 125 L70 430 L0 460 Z" fill="#c7cdd4" stroke="#7d858f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M70 125 L100 140 L100 440 L70 430 Z" fill="#a9b1ba" stroke="#7d858f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="34" cy="330" r="16" fill="#5d646d" stroke="#3d434a" stroke-width="2"/>
  <circle cx="86" cy="370" r="8" fill="#14181f"/>
  <circle cx="86" cy="408" r="8" fill="#d8332b"/>
  <!-- leads from the power unit to the transmitter -->
  <!-- transmitter stand -->
  <path d="M180 850 L330 805 L380 830 L232 880 Z" fill="#4f555d" stroke="#30353b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="248" y="690" width="22" height="150" fill="#9aa2ab" stroke="#5d646d" stroke-width="2"/>
  <!-- transmitter box -->
  <path d="M60 520 L270 440 L450 520 L240 610 Z" fill="#dfe4ea" stroke="#7d858f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 520 L240 610 L240 730 L60 640 Z" fill="#c2c9d1" stroke="#7d858f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M240 610 L450 520 L450 640 L240 730 Z" fill="#aab2bc" stroke="#7d858f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="92" cy="560" r="9" fill="#d8332b" stroke="#8a1f1a" stroke-width="1.5"/>
  <circle cx="92" cy="600" r="9" fill="#d8332b" stroke="#8a1f1a" stroke-width="1.5"/>
  <path d="M86 370 C 130 420, 30 470, 92 560" stroke="#14181f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M86 408 C 20 470, 20 600, 92 600" stroke="#14181f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- metal sheet 1 (left, wide) -->
  <path d="M440 470 L585 530 L560 575 L410 512 Z" fill="#c9dbea" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M440 170 Q 445 158 458 162 L585 215 L585 530 L440 470 Z" fill="#dce9f4" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- metal sheet 2 (middle, narrow) -->
  <path d="M610 572 L652 590 L630 628 L588 610 Z" fill="#c9dbea" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M610 238 Q 612 228 622 232 L652 245 L652 590 L610 572 Z" fill="#dce9f4" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- probe on its stand, behind the sheets -->
  <path d="M770 245 L850 215 L905 240 L825 272 Z" fill="#5d646d" stroke="#30353b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M770 245 L825 272 L825 300 L770 273 Z" fill="#454b52" stroke="#30353b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M825 272 L905 240 L905 268 L825 300 Z" fill="#3b4046" stroke="#30353b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="826" y="62" width="18" height="185" fill="#5d646d" stroke="#30353b" stroke-width="2"/>
  <rect x="822" y="48" width="26" height="22" rx="6" fill="#8a9097" stroke="#30353b" stroke-width="2"/>
  <circle cx="790" cy="252" r="7" fill="#d8332b"/>
  <circle cx="885" cy="236" r="7" fill="#14181f"/>
  <path d="M790 252 C 760 200, 830 170, 860 200" stroke="#14181f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- metal sheet 3 (right, wide, in front of the probe) -->
  <path d="M690 650 L840 712 L815 760 L662 695 Z" fill="#c9dbea" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M690 290 Q 692 279 704 283 L840 340 L840 712 L690 650 Z" fill="#dce9f4" stroke="#8aa3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- meter -->
  <path d="M985 320 L1130 270 L1170 290 L1170 395 L1025 445 L985 425 Z" fill="#9aa2ab" stroke="#5d646d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M985 320 L1130 270 L1130 375 L985 425 Z" fill="#e9ecef" stroke="#5d646d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M1010 345 L1105 312 L1105 350 L1010 383 Z" fill="#ffffff" stroke="#5d646d" stroke-width="2"/>
  <path d="M1022 370 Q 1056 322 1096 332" stroke="#14181f" stroke-width="2.5" fill="none"/>
  <line x1="1052" y1="372" x2="1078" y2="334" stroke="#d8332b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1020" cy="405" r="8" fill="#14181f"/>
  <circle cx="1100" cy="378" r="8" fill="#d8332b"/>
  <!-- leads from the probe stand to the meter -->
  <path d="M885 236 C 900 330, 960 430, 1020 405" stroke="#14181f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M905 255 C 950 400, 1070 440, 1100 378" stroke="#14181f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- labels -->
  <text x="990" y="60" font-size="30" fill="#14181f" text-anchor="middle">microwave</text>
  <text x="990" y="96" font-size="30" fill="#14181f" text-anchor="middle">probe</text>
  <line x1="930" y1="86" x2="852" y2="70" stroke="#14181f" stroke-width="2"/>
  <text x="1160" y="500" font-size="30" fill="#14181f" text-anchor="end">meter</text>
  <text x="1110" y="590" font-size="30" fill="#14181f" text-anchor="middle">metal</text>
  <text x="1110" y="626" font-size="30" fill="#14181f" text-anchor="middle">sheets</text>
  <line x1="1050" y1="590" x2="790" y2="520" stroke="#14181f" stroke-width="2"/>
  <text x="640" y="760" font-size="30" fill="#14181f" text-anchor="middle">microwave</text>
  <text x="640" y="796" font-size="30" fill="#14181f" text-anchor="middle">transmitter</text>
  <line x1="560" y1="740" x2="380" y2="610" stroke="#14181f" stroke-width="2"/>
</svg>
