<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.18 to 4.22: amylose, amylopectin, glycogen, cellulose and chitin. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
    </style>
    <g id="u"><rect x="-13" y="-10" width="26" height="20" rx="5" fill="#0f7a62"/></g>
    <g id="ui"><rect x="-13" y="-10" width="26" height="20" rx="5" fill="#2f9a7e"/><path d="M-8 -10 L8 10" stroke="#fff" stroke-width="2"/></g>
  </defs>
  <!-- amylose: coiled unbranched chain -->
  <text class="h" x="200" y="50">Amylose</text>
  <text class="s" x="200" y="78">alpha 1,4 chain; unbranched, coils into a helix</text>
  <path d="M110 150 q90 -60 180 0 q-90 60 -180 0 M110 190 q90 -60 180 0 q-90 60 -180 0 M110 230 q90 -60 180 0 q-90 60 -180 0 M110 270 q90 -60 180 0 q-90 60 -180 0" fill="none" stroke="#0f7a62" stroke-width="10" stroke-linecap="round"/>
  <!-- amylopectin: chain with branches -->
  <text class="h" x="600" y="50">Amylopectin</text>
  <text class="s" x="600" y="78">alpha 1,4 chain with alpha 1,6 branches</text>
  <g>
    <use href="#u" x="470" y="200"/><use href="#u" x="500" y="200"/><use href="#u" x="530" y="200"/><use href="#u" x="560" y="200"/><use href="#u" x="590" y="200"/><use href="#u" x="620" y="200"/><use href="#u" x="650" y="200"/><use href="#u" x="680" y="200"/><use href="#u" x="710" y="200"/>
    <use href="#u" x="560" y="160"/><use href="#u" x="560" y="130"/><use href="#u" x="560" y="100"/>
    <use href="#u" x="650" y="240"/><use href="#u" x="650" y="270"/><use href="#u" x="650" y="300"/>
  </g>
  <text class="s" x="600" y="340">more ends, so amylase breaks it faster</text>
  <text class="s" x="600" y="366">starch = amylose + amylopectin (plant store)</text>
  <!-- glycogen: highly branched -->
  <text class="h" x="1000" y="50">Glycogen</text>
  <text class="s" x="1000" y="78">like amylopectin but far more branched</text>
  <g>
    <use href="#u" x="1000" y="200"/><use href="#u" x="970" y="200"/><use href="#u" x="940" y="200"/><use href="#u" x="1030" y="200"/><use href="#u" x="1060" y="200"/>
    <use href="#u" x="950" y="170"/><use href="#u" x="930" y="145"/><use href="#u" x="910" y="120"/>
    <use href="#u" x="1050" y="170"/><use href="#u" x="1070" y="145"/><use href="#u" x="1090" y="120"/>
    <use href="#u" x="950" y="230"/><use href="#u" x="930" y="255"/><use href="#u" x="910" y="280"/>
    <use href="#u" x="1050" y="230"/><use href="#u" x="1070" y="255"/><use href="#u" x="1090" y="280"/>
    <use href="#u" x="1000" y="160"/><use href="#u" x="1000" y="130"/><use href="#u" x="1000" y="240"/><use href="#u" x="1000" y="270"/>
  </g>
  <text class="s" x="1000" y="340">animal store in muscle and liver;</text>
  <text class="s" x="1000" y="366">broken to glucose very quickly</text>
  <!-- cellulose -->
  <text class="h" x="330" y="450">Cellulose</text>
  <text class="s" x="330" y="478">beta 1,4 chain; every second glucose inverted; straight</text>
  <g>
    <use href="#u" x="130" y="540"/><use href="#ui" x="160" y="540"/><use href="#u" x="190" y="540"/><use href="#ui" x="220" y="540"/><use href="#u" x="250" y="540"/><use href="#ui" x="280" y="540"/><use href="#u" x="310" y="540"/><use href="#ui" x="340" y="540"/><use href="#u" x="370" y="540"/><use href="#ui" x="400" y="540"/><use href="#u" x="430" y="540"/><use href="#ui" x="460" y="540"/><use href="#u" x="490" y="540"/><use href="#ui" x="520" y="540"/>
    <use href="#u" x="130" y="580"/><use href="#ui" x="160" y="580"/><use href="#u" x="190" y="580"/><use href="#ui" x="220" y="580"/><use href="#u" x="250" y="580"/><use href="#ui" x="280" y="580"/><use href="#u" x="310" y="580"/><use href="#ui" x="340" y="580"/><use href="#u" x="370" y="580"/><use href="#ui" x="400" y="580"/><use href="#u" x="430" y="580"/><use href="#ui" x="460" y="580"/><use href="#u" x="490" y="580"/><use href="#ui" x="520" y="580"/>
    <use href="#u" x="130" y="620"/><use href="#ui" x="160" y="620"/><use href="#u" x="190" y="620"/><use href="#ui" x="220" y="620"/><use href="#u" x="250" y="620"/><use href="#ui" x="280" y="620"/><use href="#u" x="310" y="620"/><use href="#ui" x="340" y="620"/><use href="#u" x="370" y="620"/><use href="#ui" x="400" y="620"/><use href="#u" x="430" y="620"/><use href="#ui" x="460" y="620"/><use href="#u" x="490" y="620"/><use href="#ui" x="520" y="620"/>
  </g>
  <g stroke="#4b5563" stroke-width="2" stroke-dasharray="4 4"><path d="M175 550 V570 M235 550 V570 M295 550 V570 M355 550 V570 M415 550 V570 M475 550 V570 M175 590 V610 M235 590 V610 M295 590 V610 M355 590 V610 M415 590 V610 M475 590 V610"/></g>
  <text class="s" x="330" y="680">hundreds of chains hydrogen-bond (dashed) into microfibrils,</text>
  <text class="s" x="330" y="706">then fibrils: strong, rigid plant cell walls, paper, cotton</text>
  <text class="s" x="330" y="732">amylase cannot cut beta bonds; cellulase can (some bacteria, protozoans)</text>
  <!-- chitin -->
  <text class="h" x="900" y="450">Chitin</text>
  <text class="s" x="900" y="478">cellulose-like chain; each glucose carries a nitrogen group</text>
  <g>
    <use href="#u" x="780" y="560"/><use href="#ui" x="820" y="560"/><use href="#u" x="860" y="560"/><use href="#ui" x="900" y="560"/><use href="#u" x="940" y="560"/><use href="#ui" x="980" y="560"/><use href="#u" x="1020" y="560"/>
  </g>
  <g fill="#5b3fb5"><circle cx="780" cy="600" r="9"/><circle cx="820" cy="520" r="9"/><circle cx="860" cy="600" r="9"/><circle cx="900" cy="520" r="9"/><circle cx="940" cy="600" r="9"/><circle cx="980" cy="520" r="9"/><circle cx="1020" cy="600" r="9"/></g>
  <text class="s" x="900" y="650">purple: nitrogen-containing group (NHCOCH3)</text>
  <text class="s" x="900" y="690">exoskeletons of crabs, lobsters and insects;</text>
  <text class="s" x="900" y="716">cell walls of fungi; few organisms digest it</text>
  <text class="s" x="600" y="800">Also building polysaccharides: pectin and lignin (plant walls), agar (red algae walls), murein (prokaryote walls).</text>
</svg>
