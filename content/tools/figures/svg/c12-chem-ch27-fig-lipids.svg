  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 27.10 and 27.11: a triglyceride made from glycerol and three fatty acids joined by ester links; a phospholipid with a polar head and two non-polar tails; and the bilayer phospholipids form in water. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Lipids: triglycerides and phospholipids</text>
