  <text x="285.0" y="378.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">hydrophilic (likes water)</text>
  <text x="285.0" y="396.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="285.0" y="414.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">two fatty acid tails:</text>
  <text x="285.0" y="432.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">hydrophobic (avoids water)</text>
