  <text x="95.0" y="270.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">glycerol</text>
  <text x="395.0" y="270.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">fatty acid chains (saturated: straight; unsaturated: C=C, kinked)</text>
  <text x="740.0" y="140.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">saturated fatty acids give</text>
  <text x="740.0" y="158.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">fats (solid); unsaturated</text>
  <text x="740.0" y="176.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">give oils (liquid)</text>
  <text x="740.0" y="194.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"></text>
  <text x="740.0" y="212.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">energy store, insulation,</text>
  <text x="740.0" y="230.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">protection of organs</text>
