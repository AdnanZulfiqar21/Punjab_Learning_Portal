  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a triglyceride: glycerol + three fatty acids, joined by ester links</text>
  <text x="95.0" y="116.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
