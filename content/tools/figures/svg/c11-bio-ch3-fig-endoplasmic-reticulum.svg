<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.15 and 3.16: rough and smooth endoplasmic reticulum joined to the nuclear envelope. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- part of the nucleus on the left -->
  <path d="M60 120 q240 100 0 540" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="12"/>
  <path d="M60 120 q240 100 0 540" fill="none" stroke="#e8dff7" stroke-width="4"/>
  <text class="t" x="70" y="400">Nucleus</text>
  <!-- rough ER: stacked flattened sacs (cisternae) continuous with the envelope -->
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="5">
    <path d="M190 200 h330 q20 0 20 20 v20 q0 20 -20 20 h-330 z"/>
    <path d="M195 290 h350 q20 0 20 20 v20 q0 20 -20 20 h-350 z"/>
    <path d="M190 380 h330 q20 0 20 20 v20 q0 20 -20 20 h-330 z"/>
    <path d="M180 470 h300 q20 0 20 20 v20 q0 20 -20 20 h-300 z"/>
  </g>
  <!-- ribosomes studding the rough ER -->
  <g fill="#d98b2b">
    <circle cx="230" cy="196" r="6"/><circle cx="290" cy="196" r="6"/><circle cx="350" cy="196" r="6"/><circle cx="410" cy="196" r="6"/><circle cx="470" cy="196" r="6"/>
    <circle cx="260" cy="264" r="6"/><circle cx="320" cy="264" r="6"/><circle cx="380" cy="264" r="6"/><circle cx="440" cy="264" r="6"/><circle cx="500" cy="264" r="6"/>
    <circle cx="240" cy="286" r="6"/><circle cx="300" cy="286" r="6"/><circle cx="360" cy="286" r="6"/><circle cx="420" cy="286" r="6"/><circle cx="480" cy="286" r="6"/><circle cx="540" cy="286" r="6"/>
    <circle cx="260" cy="354" r="6"/><circle cx="320" cy="354" r="6"/><circle cx="380" cy="354" r="6"/><circle cx="440" cy="354" r="6"/><circle cx="500" cy="354" r="6"/>
    <circle cx="230" cy="376" r="6"/><circle cx="290" cy="376" r="6"/><circle cx="350" cy="376" r="6"/><circle cx="410" cy="376" r="6"/><circle cx="470" cy="376" r="6"/>
    <circle cx="250" cy="444" r="6"/><circle cx="310" cy="444" r="6"/><circle cx="370" cy="444" r="6"/><circle cx="430" cy="444" r="6"/><circle cx="490" cy="444" r="6"/>
    <circle cx="220" cy="466" r="6"/><circle cx="280" cy="466" r="6"/><circle cx="340" cy="466" r="6"/><circle cx="400" cy="466" r="6"/>
    <circle cx="240" cy="534" r="6"/><circle cx="300" cy="534" r="6"/><circle cx="360" cy="534" r="6"/><circle cx="420" cy="534" r="6"/>
  </g>
  <!-- smooth ER: branching tubules on the right -->
  <g fill="none" stroke="#0f7a62" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M580 230 q60 40 120 0 t120 0 t100 30"/>
    <path d="M640 230 q20 60 0 110 q-20 50 40 90"/>
    <path d="M700 230 q40 60 0 120 q-30 60 60 100 t120 20"/>
    <path d="M820 230 q30 50 0 100 q-30 60 20 110"/>
    <path d="M600 340 q60 30 120 0 t120 0"/>
  </g>
  <g fill="none" stroke="#e1f3ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M580 230 q60 40 120 0 t120 0 t100 30"/>
    <path d="M640 230 q20 60 0 110 q-20 50 40 90"/>
    <path d="M700 230 q40 60 0 120 q-30 60 60 100 t120 20"/>
    <path d="M820 230 q30 50 0 100 q-30 60 20 110"/>
    <path d="M600 340 q60 30 120 0 t120 0"/>
  </g>
  <!-- vesicle budding off towards Golgi -->
  <circle cx="560" cy="560" r="22" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5"/>
  <path d="M590 580 L700 660" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="705" y="690">transport vesicle to the Golgi apparatus</text>
  <!-- labels -->
  <path class="lead" d="M350 230 L350 110"/><text class="t" x="250" y="90">Rough ER (RER)</text><text class="s" x="200" y="115">ribosomes attached; makes proteins</text>
  <path class="lead" d="M760 250 L760 120"/><text class="t" x="680" y="90">Smooth ER (SER)</text><text class="s" x="660" y="115">no ribosomes; lipids, calcium, detox</text>
  <path class="lead" d="M190 210 L120 90"/><text class="s" x="30" y="70">continuous with the nuclear envelope</text>
  <text class="s" x="380" y="328" style="fill:#14181f">cisterna (lumen)</text>
  <text class="s" x="40" y="730">All cisternae connect into one convoluted lumen, the cisternal space, more than 10 percent of the cell's volume.</text>
</svg>
