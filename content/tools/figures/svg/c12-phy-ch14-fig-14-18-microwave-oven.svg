<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 14.18 (C12-PHY, PDF p37): Microwave oven, as printed: a black microwave oven seen from the front left, the door with a silver frame and an amber see-through window on the left, and a control panel on the right with two round silver dials. Flat drawing after the printed photograph; no photograph is reproduced. -->
  <rect width="1100" height="700" fill="#ffffff"/>
  <!-- top and side in perspective -->
  <path d="M90 140 L150 70 L1060 70 L1030 140 Z" fill="#4a4c50" stroke="#1d1e20" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1030 140 L1060 70 L1060 580 L1030 650 Z" fill="#2b2c2f" stroke="#1d1e20" stroke-width="4" stroke-linejoin="round"/>
  <!-- front -->
  <rect x="90" y="140" width="940" height="510" rx="14" fill="#1f2023" stroke="#111214" stroke-width="4"/>
  <!-- door -->
  <rect x="115" y="165" width="690" height="460" rx="10" fill="#2a2b2e" stroke="#0d0e10" stroke-width="3"/>
  <rect x="770" y="165" width="35" height="460" rx="6" fill="#b9bdc4" stroke="#7d828a" stroke-width="2"/>
  <rect x="778" y="175" width="10" height="440" fill="#e7e9ec"/>
  <!-- amber window -->
  <rect x="185" y="230" width="500" height="320" rx="6" fill="#b5781e" stroke="#5a3a0c" stroke-width="4"/>
  <rect x="200" y="245" width="470" height="290" fill="#cf9536"/>
  <g stroke="#a86f18" stroke-width="1.5" opacity="0.7">
    <path d="M200 270 H670 M200 300 H670 M200 330 H670 M200 360 H670 M200 390 H670 M200 420 H670 M200 450 H670 M200 480 H670 M200 510 H670"/>
    <path d="M230 245 V535 M270 245 V535 M310 245 V535 M350 245 V535 M390 245 V535 M430 245 V535 M470 245 V535 M510 245 V535 M550 245 V535 M590 245 V535 M630 245 V535"/>
  </g>
  <rect x="410" y="575" width="50" height="16" rx="3" fill="#b8312a"/>
  <!-- control panel -->
  <rect x="830" y="165" width="175" height="460" rx="6" fill="#18191b" stroke="#0d0e10" stroke-width="3"/>
  <g fill="#8d9097"><circle cx="860" cy="215" r="5"/><circle cx="860" cy="400" r="5"/></g>
  <rect x="880" y="210" width="60" height="8" rx="3" fill="#5c5f66"/><rect x="880" y="395" width="60" height="8" rx="3" fill="#5c5f66"/>
  <circle cx="918" cy="300" r="52" fill="#9da1a8" stroke="#55585e" stroke-width="5"/>
  <circle cx="918" cy="300" r="38" fill="#c9ccd1"/>
  <rect x="910" y="258" width="16" height="84" rx="5" fill="#6d7077"/>
  <circle cx="918" cy="490" r="52" fill="#9da1a8" stroke="#55585e" stroke-width="5"/>
  <circle cx="918" cy="490" r="38" fill="#c9ccd1"/>
  <rect x="910" y="448" width="16" height="84" rx="5" fill="#6d7077"/>
  <g fill="#6d7077"><circle cx="860" cy="300" r="3"/><circle cx="975" cy="300" r="3"/><circle cx="918" cy="240" r="3"/><circle cx="860" cy="490" r="3"/><circle cx="975" cy="490" r="3"/><circle cx="918" cy="430" r="3"/></g>
</svg>
