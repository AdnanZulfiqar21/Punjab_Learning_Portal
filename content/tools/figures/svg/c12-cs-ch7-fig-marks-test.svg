<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original: the ten marks as dots above a number line with the old mean 70 and the sample mean 77, and the t-test working. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Worked example: has the new teaching method raised marks? (after 7.4)</text>
  <line x1="80.0" y1="230.0" x2="800.0" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="95.0" y1="230.0" x2="95.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="95.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">68</text>
  <line x1="185.0" y1="230.0" x2="185.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="185.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">70</text>
  <line x1="275.0" y1="230.0" x2="275.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="275.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">72</text>
  <line x1="365.0" y1="230.0" x2="365.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="365.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">74</text>
  <line x1="455.0" y1="230.0" x2="455.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="455.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">76</text>
  <line x1="545.0" y1="230.0" x2="545.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="545.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">78</text>
  <line x1="635.0" y1="230.0" x2="635.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="635.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">80</text>
  <line x1="725.0" y1="230.0" x2="725.0" y2="236.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="725.0" y="254.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="400">82</text>
  <circle cx="275.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="410.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="545.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="365.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="500.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="635.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="455.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="590.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="680.0" cy="216.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <circle cx="545.0" cy="194.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <line x1="185.0" y1="110.0" x2="185.0" y2="232.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="185.0" y="102.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">old mean 70 (H0)</text>
  <line x1="500.0" y1="110.0" x2="500.0" y2="232.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <text x="500.0" y="102.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">sample mean 77</text>
  <rect x="60.0" y="290.0" width="780.0" height="110.0" rx="8" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="80.0" y="318.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">n = 10, sum = 770, mean = 77; s = sqrt(70 / 9) = 2.79</text>
  <text x="80.0" y="344.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">t = (77 - 70) / (2.79 / sqrt(10)) = 7 / 0.88 = 7.93, df = 9</text>
  <text x="80.0" y="370.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">p &lt; 0.05, so reject H0: the new method raised marks.</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
