<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.12: a macrophage activates a helper T cell, which leads to six events: proliferation, activation of macrophages, induction in the thymus, attack by cytotoxic T cells, suppression after 1-2 weeks and memory T cells. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cell-mediated immunity (T cells)</text>
  <ellipse cx="110.0" cy="120.0" rx="60.0" ry="40.0" stroke="#b45309" stroke-width="2" fill="#ffedd5"/>
  <rect x="140.0" y="104.0" width="16.0" height="12.0" rx="2" stroke="#b45309" stroke-width="1.5" fill="#fde68a"/>
  <text x="110.0" y="180.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">macrophage shows</text>
  <text x="110.0" y="194.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">special proteins</text>
  <line x1="180.0" y1="120.0" x2="233.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M240.0 120.0 L232.7 123.4 L232.7 116.6 Z" fill="#14181f"/>
  <circle cx="280.0" cy="120.0" r="22.0" stroke="#0e7490" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="280.0" cy="120.0" r="12.1" stroke="#0e7490" stroke-width="1" fill="#0e7490"/>
  <text x="280.0" y="158.0" font-size="11" fill="#0e7490" text-anchor="middle" font-weight="700">helper T activated</text>
  <line x1="320.0" y1="120.0" x2="373.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M380.0 120.0 L372.7 123.4 L372.7 116.6 Z" fill="#14181f"/>
  <text x="560.0" y="110.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">starts two responses: cell-mediated (here)</text>
  <text x="560.0" y="130.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">and antibody-mediated (next figure)</text>
  <rect x="40.0" y="230.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="167.0" y="256.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 proliferation</text>
  <text x="167.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">T cell growth factor:</text>
  <text x="167.0" y="348.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">large clones of T cells</text>
  <circle cx="107.0" cy="294.0" r="11.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <circle cx="137.0" cy="294.0" r="11.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <circle cx="167.0" cy="294.0" r="11.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <circle cx="197.0" cy="294.0" r="11.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <circle cx="227.0" cy="294.0" r="11.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <rect x="325.0" y="230.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="452.0" y="256.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 activation</text>
  <text x="452.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a second factor calls</text>
  <text x="452.0" y="348.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">macrophages to the site</text>
  <ellipse cx="412.0" cy="294.0" rx="26.0" ry="16.0" stroke="#b45309" stroke-width="1.5" fill="#ffedd5"/>
  <line x1="442.0" y1="294.0" x2="486.4" y2="294.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M492.0 294.0 L485.7 297.0 L485.7 291.0 Z" fill="#14181f"/>
  <circle cx="512.0" cy="294.0" r="10.0" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <rect x="610.0" y="230.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="737.0" y="256.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 induction</text>
  <text x="737.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">inducer T cells in the</text>
  <text x="737.0" y="348.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">thymus mature more T cells</text>
  <ellipse cx="737.0" cy="294.0" rx="40.0" ry="20.0" stroke="#7c3aed" stroke-width="1.5" fill="#ede9fe"/>
  <text x="737.0" y="298.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">thymus</text>
  <rect x="40.0" y="410.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="167.0" y="436.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 attack</text>
  <text x="167.0" y="510.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">cytotoxic T cells bind</text>
  <text x="167.0" y="528.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">infected cells; they burst</text>
  <circle cx="137.0" cy="474.0" r="14.0" stroke="#be123c" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="187.0" cy="474.0" r="22.0" stroke="#b45309" stroke-width="2" fill="#fff7ed" stroke-dasharray="4 3"/>
  <line x1="207.0" y1="464.0" x2="219.0" y2="460.0" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="213.0" y1="472.0" x2="225.0" y2="468.0" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="219.0" y1="480.0" x2="231.0" y2="476.0" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <rect x="325.0" y="410.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="452.0" y="436.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">5 suppression</text>
  <text x="452.0" y="510.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">after 1-2 weeks suppressor</text>
  <text x="452.0" y="528.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">T cells stop the attack</text>
  <circle cx="432.0" cy="474.0" r="14.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <line x1="456.0" y1="474.0" x2="482.0" y2="474.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="498.0" cy="474.0" r="14.0" stroke="#be123c" stroke-width="2" fill="#ffffff" stroke-dasharray="3 2"/>
  <rect x="610.0" y="410.0" width="255.0" height="150.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"/>
  <text x="737.0" y="436.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">6 memory</text>
  <text x="737.0" y="510.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">memory helper and cytotoxic</text>
  <text x="737.0" y="528.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">T cells last for years</text>
  <circle cx="697.0" cy="474.0" r="13.0" stroke="#0e7490" stroke-width="2.5" fill="#fef9c3"/>
  <circle cx="737.0" cy="474.0" r="13.0" stroke="#be123c" stroke-width="2.5" fill="#fef9c3"/>
  <circle cx="777.0" cy="474.0" r="13.0" stroke="#0e7490" stroke-width="2.5" fill="#fef9c3"/>
  <text x="450.0" y="595.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cytotoxic T cells kill like natural killer cells: they puncture the membrane of the infected or cancer cell</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
