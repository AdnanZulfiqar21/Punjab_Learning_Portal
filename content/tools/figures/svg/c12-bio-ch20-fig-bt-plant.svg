<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram after Figure 20.7: a Bt gene from the soil bacterium Bacillus thuringiensis is put into a plant cell, which grows into a transgenic plant whose leaves kill the caterpillars that eat them. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Insect-resistant plants with a gene from Bacillus thuringiensis</text>
  <rect x="40.0" y="120.0" width="120.0" height="50.0" rx="25" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <line x1="70.0" y1="145.0" x2="130.0" y2="145.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <text x="100.0" y="200.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">B. thuringiensis</text>
  <text x="100.0" y="216.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">(soil bacterium)</text>
  <line x1="170.0" y1="145.0" x2="222.8" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 145.0 L221.8 148.8 L221.8 141.2 Z" fill="#14181f"/>
  <line x1="245.0" y1="145.0" x2="315.0" y2="145.0" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <text x="280.0" y="128.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Bt gene</text>
  <line x1="325.0" y1="145.0" x2="377.8" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M385.0 145.0 L376.8 148.8 L376.8 141.2 Z" fill="#14181f"/>
  <rect x="400.0" y="95.0" width="120.0" height="100.0" rx="18" stroke="#15803d" stroke-width="3" fill="#ecfdf5"/>
  <circle cx="460.0" cy="145.0" r="22.0" stroke="#7c3aed" stroke-width="1.5" fill="#ede9fe"/>
  <line x1="448.0" y1="145.0" x2="472.0" y2="145.0" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="460.0" y="222.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">plant cell takes</text>
  <text x="460.0" y="238.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">up the gene</text>
  <line x1="530.0" y1="145.0" x2="582.8" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M590.0 145.0 L581.8 148.8 L581.8 141.2 Z" fill="#14181f"/>
  <text x="560.0" y="128.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">grows</text>
  <line x1="690.0" y1="270.0" x2="690.0" y2="110.0" stroke="#166534" stroke-width="5" stroke-linecap="round"/>
  <path d="M690 140 q-50 -30 -90 -10 q40 30 90 10 Z" stroke="#166534" stroke-width="2" fill="#86efac" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M690 175 q50 -30 90 -10 q-40 30 -90 10 Z" stroke="#166534" stroke-width="2" fill="#86efac" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M690 210 q-50 -30 -90 -10 q40 30 90 10 Z" stroke="#166534" stroke-width="2" fill="#86efac" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M690 240 q50 -30 90 -10 q-40 30 -90 10 Z" stroke="#166534" stroke-width="2" fill="#86efac" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="690.0" y="300.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">transgenic plant: every cell</text>
  <text x="690.0" y="316.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">makes the insect-killing protein</text>
  <circle cx="790.0" cy="160.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <circle cx="803.0" cy="163.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <circle cx="816.0" cy="160.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <circle cx="829.0" cy="163.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <circle cx="842.0" cy="160.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <circle cx="855.0" cy="163.0" r="8.0" stroke="#854d0e" stroke-width="1.5" fill="#fde68a"/>
  <text x="820.0" y="140.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">caterpillar</text>
  <text x="830.0" y="190.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700">eats leaf, dies</text>
  <rect x="40.0" y="350.0" width="820.0" height="110.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="378.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Plant cells are totipotent: one transgenic cell can grow into a whole plant.</text>
  <text x="60.0" y="402.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Bt genes are in cotton, rice, maize, potato, tomato, brinjal, cauliflower, cabbage and others.</text>
  <text x="60.0" y="426.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Their proteins kill insect pests but, the book notes, do not harm other useful insects.</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
