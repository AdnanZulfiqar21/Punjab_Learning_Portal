  <rect x="870" y="720" width="110" height="200" rx="40" transform="rotate(-25 925 820)" fill="#f2f3f5" stroke="#8a9099" stroke-width="4"/>
  <circle cx="905" cy="790" r="12" fill="#e8590c"/><circle cx="935" cy="805" r="12" fill="#e8590c"/>
  <g fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round"><path d="M860 700 Q880 680 900 700"/><path d="M845 680 Q880 645 915 680"/></g>
</svg>
