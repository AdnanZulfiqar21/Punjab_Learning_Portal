<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Do you know? box (C12-PHY, PDF p102): flat drawing after the printed picture of a 1.5 ton split air conditioner: a white wall unit with a small dark display panel at the right blows a cool blue stream (left, with green leaves) and a warm orange stream (centre) over an icy, snowy scene; a hand at the lower right holds a remote control. No photograph is reproduced. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f5"/><stop offset="1" stop-color="#eaf5fb"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b25b" stop-opacity="0.9"/><stop offset="1" stop-color="#fbe3b5" stop-opacity="0.15"/></linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc4ea" stop-opacity="0.85"/><stop offset="1" stop-color="#d7eefa" stop-opacity="0.2"/></linearGradient>
  </defs>
  <rect width="1100" height="1000" fill="url(#sky)"/>
  <path d="M0 330 L120 250 L220 320 L330 240 L460 330 L600 280 L760 300 L880 220 L1000 290 L1100 260 L1100 420 L0 420 Z" fill="#ffffff" stroke="#a9c9de" stroke-width="3"/>
