  <path d="M120 200 L560 200 L380 960 L60 960 Z" fill="url(#cool)"/>
  <path d="M560 200 L780 200 L900 900 L560 900 Z" fill="url(#warm)"/>
  <rect x="100" y="60" width="900" height="170" rx="18" fill="#ffffff" stroke="#9aa6b0" stroke-width="5"/>
  <rect x="180" y="200" width="700" height="18" fill="#3a3f46"/>
  <rect x="850" y="85" width="120" height="110" rx="8" fill="#2a2d33"/>
  <rect x="868" y="100" width="84" height="34" fill="#e03131"/>
  <circle cx="885" cy="165" r="10" fill="#6b7280"/><circle cx="910" cy="165" r="10" fill="#6b7280"/><circle cx="935" cy="165" r="10" fill="#6b7280"/>
  <g fill="#3fa34d" stroke="#21662b" stroke-width="3">
    <path d="M250 330 Q290 300 300 350 Q270 370 250 330 Z"/>
    <path d="M330 470 Q380 430 385 490 Q350 510 330 470 Z"/>
