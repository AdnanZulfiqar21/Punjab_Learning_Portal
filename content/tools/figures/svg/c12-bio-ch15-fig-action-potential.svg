  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) what keeps the inside at about -70 mV</text>
  <text x="60.0" y="150.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">outside: Na+ about 10x higher</text>
  <rect x="40.0" y="170.0" width="820.0" height="30.0" rx="0" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
