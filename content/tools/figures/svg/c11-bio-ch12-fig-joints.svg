<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 12.10: the three kinds of joint and the structure of a synovial joint. Schematic. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
      .t{font-size:15px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2;fill:none}
    </style>
  </defs>
  <!-- fibrous -->
  <text class="h" x="160" y="40">Fibrous joint</text>
  <rect x="60" y="80" width="90" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/><rect x="170" y="80" width="90" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/>
  <path d="M150 90 q10 10 20 0 q-10 20 0 40 q10 20 0 40 q-10 20 0 30" fill="none" stroke="#8a4b00" stroke-width="4"/>
  <text class="s" x="160" y="230">bones bound by collagen fibres;</text><text class="s" x="160" y="250">no movement: skull sutures,</text><text class="s" x="160" y="270">tibia-fibula, teeth in their sockets</text>
  <!-- cartilaginous -->
  <text class="h" x="440" y="40">Cartilaginous joint</text>
  <rect x="340" y="80" width="90" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/><rect x="450" y="80" width="90" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/>
  <rect x="430" y="85" width="20" height="110" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="s" x="440" y="230">a layer of cartilage joins the bones;</text><text class="s" x="440" y="250">slight movement: hyaline (first rib</text><text class="s" x="440" y="270">to sternum) or fibrocartilage (pubic</text><text class="s" x="440" y="290">symphysis, intervertebral discs)</text>
  <!-- synovial structure -->
  <text class="h" x="880" y="40">Synovial joint: structure</text>
  <path d="M800 70 h120 q20 60 -60 70 q-80 -10 -60 -70 z" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/>
  <path d="M800 270 h120 q20 -60 -60 -70 q-80 10 -60 70 z" fill="#fff4e2" stroke="#c9b27a" stroke-width="4"/>
  <path d="M770 138 q90 20 180 0" fill="none" stroke="#1f6fb5" stroke-width="7"/><path d="M770 202 q90 -20 180 0" fill="none" stroke="#1f6fb5" stroke-width="7"/>
  <rect x="750" y="130" width="220" height="80" rx="20" fill="#b2dbcc" opacity="0.5" stroke="#0f7a62" stroke-width="3"/>
  <path d="M752 128 q-20 40 0 84 M968 128 q20 40 0 84" fill="none" stroke="#8a4b00" stroke-width="5"/>
  <text class="k" x="990" y="90">bone 1</text><text class="k" x="990" y="265">bone 2</text>
  <text class="t" x="1000" y="135">articular cartilage: smooth</text><text class="t" x="1000" y="153">hyaline cover on each end</text>
  <path class="lead" d="M995 140 L940 138"/>
  <text class="t" x="1000" y="185">synovial membrane and fluid</text><text class="t" x="1000" y="203">in the cavity: lubrication</text>
  <path class="lead" d="M995 190 L960 175"/>
  <text class="t" x="560" y="100">fibrous capsule: outer</text><text class="t" x="560" y="118">ligaments and inner</text><text class="t" x="560" y="136">synovial membrane</text>
  <path class="lead" d="M715 128 L752 150"/>
  <text class="t" x="1000" y="335">ligaments: strong bands</text><text class="t" x="1000" y="353">joining the bones</text>
  <text class="s" x="880" y="310">most common; free movement</text>
  <!-- six synovial types -->
  <rect x="60" y="340" width="1080" height="200" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="80" y="368">Six kinds of synovial joint, by range of motion</text>
  <g font-size="15" fill="#4b5563">
    <text x="80" y="396">1. ball-and-socket: motion in all directions (shoulder, hip)</text>
    <text x="80" y="420">2. hinge: one plane, like a door (elbow, knee)</text>
    <text x="80" y="444">3. pivot: rotation about one axis (first and second neck vertebrae)</text>
    <text x="620" y="396">4. ellipsoidal: two planes, no rotation (wrist with the radius)</text>
    <text x="620" y="420">5. saddle: two planes, concave on convex (thumb)</text>
    <text x="620" y="444">6. gliding: bones slide (between vertebrae; wrist and ankle bones)</text>
    <text x="80" y="486">Joint transplantation: total or partial replacement with metal, plastic or ceramic parts; allograft of a donor joint (ankle, knee);</text>
    <text x="80" y="508">or implantation of the patient's own chondrocytes (knee).</text>
  </g>
  <text class="s" x="600" y="580">Cream: bone. Blue: cartilage. Green: synovial cavity. Brown: ligaments of the capsule or collagen of a fibrous joint.</text>
  <text class="s" x="600" y="615">Poor posture misaligns vertebrae (back and neck pain, herniated discs), strains joints (pain, inflammation, arthritis) and unbalances muscles.</text>
</svg>
