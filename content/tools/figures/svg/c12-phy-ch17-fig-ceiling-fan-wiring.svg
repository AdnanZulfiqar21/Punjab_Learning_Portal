<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Brain Teaser picture of ceiling-fan wiring: the live wire passes through an ON/OFF switch; the top wire carries the running winding (stator) and returns down the right side to the neutral wire; a branch from the switch side carries the capacitor and the starting winding (stator) down to the neutral wire; the rotor sits in the middle; an arrow marks the single phase supply. -->
