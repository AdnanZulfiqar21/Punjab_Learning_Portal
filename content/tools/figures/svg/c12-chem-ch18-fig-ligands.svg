<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original structures of 1,2-diaminoethane (two N donors), the ethanedioate ion (two O donors) and EDTA (two N and four O donors). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Bidentate and hexadentate ligands</text>
  <rect x="15.0" y="55.0" width="255.0" height="345.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="142.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1,2-diaminoethane (en)</text>
  <line x1="80.0" y1="245.0" x2="103.0" y2="213.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="128.0" y1="200.0" x2="157.0" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="182.0" y1="213.0" x2="205.0" y2="245.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="62.0" y="262.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">N</tspan></text>
  <text x="115.0" y="205.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="170.0" y="205.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="224.0" y="262.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <circle cx="68.0" cy="278.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="76.0" cy="278.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="210.0" cy="278.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="218.0" cy="278.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <text x="142.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">two N atoms each give</text>
  <text x="142.0" y="348.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one lone pair: bidentate</text>
  <rect x="280.0" y="55.0" width="225.0" height="345.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="392.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ethanedioate</text>
  <line x1="375.0" y1="215.0" x2="410.0" y2="215.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="359.4" y1="204.6" x2="340.4" y2="173.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="364.6" y1="201.4" x2="345.6" y2="170.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="420.4" y1="201.4" x2="439.4" y2="170.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="425.6" y1="204.6" x2="444.6" y2="173.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="362.0" y1="227.0" x2="343.0" y2="255.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="423.0" y1="227.0" x2="442.0" y2="255.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="368.0" y="221.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="417.0" y="221.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="338.0" y="166.0" font-size="17" fill="#4b5563" text-anchor="middle" font-weight="700">O</text>
  <text x="447.0" y="166.0" font-size="17" fill="#4b5563" text-anchor="middle" font-weight="700">O</text>
  <text x="340.0" y="274.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="448.0" y="274.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <circle cx="332.0" cy="290.0" r="2.2" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <circle cx="340.0" cy="290.0" r="2.2" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <circle cx="440.0" cy="290.0" r="2.2" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <circle cx="448.0" cy="290.0" r="2.2" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="392.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one O from each carboxylate</text>
  <text x="392.0" y="348.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">(COO-) group: bidentate</text>
  <rect x="515.0" y="55.0" width="370.0" height="345.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="700.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">EDTA (hexadentate)</text>
  <text x="655.0" y="226.0" font-size="18" fill="#0f7a62" text-anchor="middle" font-weight="700">N</text>
  <text x="745.0" y="226.0" font-size="18" fill="#0f7a62" text-anchor="middle" font-weight="700">N</text>
  <circle cx="651.0" cy="242.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="659.0" cy="242.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="741.0" cy="242.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <circle cx="749.0" cy="242.0" r="2.2" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <line x1="666.0" y1="220.0" x2="672.0" y2="220.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="700.0" y="226.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan></text>
  <line x1="728.0" y1="220.0" x2="734.0" y2="220.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="645.0" y1="210.0" x2="622.0" y2="168.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="628.0" y="160.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="593.0" y="160.0" font-size="15" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="-6.3" font-size="10.5">-</tspan><tspan dy="6.3">OOC</tspan></text>
  <line x1="645.0" y1="230.0" x2="622.0" y2="282.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="628.0" y="296.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="593.0" y="296.0" font-size="15" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="-6.3" font-size="10.5">-</tspan><tspan dy="6.3">OOC</tspan></text>
  <line x1="755.0" y1="210.0" x2="778.0" y2="168.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="772.0" y="160.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-</tspan></text>
  <text x="812.0" y="160.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">COO</tspan><tspan dy="-6.3" font-size="10.5">-</tspan></text>
  <line x1="755.0" y1="230.0" x2="778.0" y2="282.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="772.0" y="296.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-</tspan></text>
  <text x="812.0" y="296.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">COO</tspan><tspan dy="-6.3" font-size="10.5">-</tspan></text>
  <text x="700.0" y="340.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">six donor atoms: 2 N (green) and one O</text>
  <text x="700.0" y="358.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">in each of the 4 COO- groups (red)</text>
  <text x="450.0" y="428.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">donor atoms carry the lone pairs that form dative bonds to the metal ion</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
