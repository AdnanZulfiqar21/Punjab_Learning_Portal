L831.1 262.0 L831.9 260.3 L832.7 258.7 L833.5 257.0 L834.3 255.3 L835.1 253.6 L835.9 251.8 L836.7 250.0 L837.5 248.2 L838.2 246.3 L839.0 244.4 L839.8 242.5 L840.6 240.6 L841.4 238.7 L842.2 236.7 L843.0 234.7 L843.8 232.7 L844.6 230.7 L845.4 228.7 L846.2 226.6 L847.0 224.6 L847.8 222.5 L848.5 220.4 L849.3 218.4 L850.1 216.3 L850.9 214.2 L851.7 212.1 L852.5 210.0 L853.3 207.9 L854.1 205.8 L854.9 203.7 L855.7 201.6 L856.5 199.6 L857.2 197.5 L858.0 195.4 L858.8 193.4 L859.6 191.3 L860.4 189.3 L861.2 187.3 L862.0 185.3 L862.8 183.3 L863.6 181.3 L864.4 179.4 L865.2 177.5 L866.0 175.6 L866.8 173.7 L867.5 171.8 L868.3 170.0 L869.1 168.2 L869.9 166.4 L870.7 164.7 L871.5 163.0 L872.3 161.3 L873.1 159.7 L873.9 158.0 L874.7 156.5 L875.5 154.9 L876.2 153.4 L877.0 152.0 L877.8 150.5 L878.6 149.2 L879.4 147.8 L880.2 146.5 L881.0 145.3 L881.8 144.1 L882.6 142.9 L883.4 141.8 L884.2 140.7 L885.0 139.7 L885.8 138.7 L886.5 137.8 L887.3 136.9 L888.1 136.1 L888.9 135.3 L889.7 134.6 L890.5 133.9 L891.3 133.3 L892.1 132.7 L892.9 132.2 L893.7 131.7 L894.5 131.3 L895.2 131.0 L896.0 130.7 L896.8 130.4 L897.6 130.2 L898.4 130.1 L899.2 130.0 L900.0 130.0" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <text class="r" x="718" y="114">I0</text>
  <text class="r" x="790" y="306">90 deg</text>
  <text class="r" x="884" y="306">180</text>
  <text class="r" x="700" y="306">0</text>
  <text class="r" x="896" y="282">theta</text>
  <text class="r" x="740" y="140">I = I0 cos^2 theta</text>
  <path d="M1035 290 V156" stroke="#14181f" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1035 290 L1101 196" stroke="#0f7a62" stroke-width="2.5"/>
  <path d="M1035 290 L969 244" stroke="#d7322f" stroke-width="2"/>
  <path d="M1101 196 L1035 150" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <path d="M969 244 L1035 150" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text class="l" x="1009" y="144">A0</text>
  <text class="r" x="1074" y="250" style="fill:#0f7a62">A0 cos theta</text>
  <text class="r" x="899" y="248" style="fill:#d7322f">A0 sin theta</text>
  <text class="r" x="1039" y="250">theta</text>
  <text class="r" x="975" y="306">analyzer axis tilted</text>
  <g class="r">
    <text x="690" y="322">only A = A0 cos theta passes and I is proportional to A^2: I = I0 cos^2 theta</text>
    <text x="690" y="336">theta = 0: I = I0; theta = 90 deg: I = 0 (extinction)</text>
    <text x="690" y="350">Ex 8.3: 75 W m^-2, 30 deg: 56.25 W m^-2; Ex 8.4: 5 units, 60 deg: 2.5 units</text>
    <text x="690" y="364">tourmaline and calcite polarize; so do reflection, refraction and scattering</text>
  </g>
  <rect x="50" y="405" width="560" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="330" y="433">Optical activity (Fig. 8.8)</text>
  <path d="M70 490 H590" stroke="#1f6fb5" stroke-width="1.5" marker-end="url(#bl)"/>
  <path d="M105 490 L125.0 490.0" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L85.0 490.0" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L119.1 504.1" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L90.9 475.9" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L105.0 510.0" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L105.0 470.0" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L90.9 504.1" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M105 490 L119.1 475.9" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <rect x="161" y="455" width="18" height="70" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M166 459 V521" stroke="#4b5563" stroke-width="1"/>
  <path d="M170 459 V521" stroke="#4b5563" stroke-width="1"/>
  <path d="M174 459 V521" stroke="#4b5563" stroke-width="1"/>
  <text class="r" x="170" y="449" style="text-anchor:middle">polarizer</text>
  <path d="M225 490 L225 510" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M225 490 L225 470" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <rect x="265" y="465" width="110" height="50" rx="6" fill="#fbe7c6" stroke="#d98b2b" stroke-width="1.5"/><text class="r" x="276" y="494">optically active</text>
  <path d="M420 490 L432 511" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M420 490 L408 469" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M420 466 V514" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text class="r" x="396" y="456">rotated by theta</text>
  <rect x="511" y="455" width="18" height="70" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M516 459 V521" stroke="#4b5563" stroke-width="1"/>
  <path d="M520 459 V521" stroke="#4b5563" stroke-width="1"/>
  <path d="M524 459 V521" stroke="#4b5563" stroke-width="1"/>
  <text class="r" x="520" y="449" style="text-anchor:middle">analyzer</text>
  <g class="t">
    <text x="70" y="560">some substances rotate the plane of polarization: quartz, cinnabar (HgS),</text>
    <text x="70" y="576">sugar water, insulin, collagen; the rotation depends on (i) the substance,</text>
    <text x="70" y="592">(ii) its concentration, (iii) the distance the light travels in it and</text>
    <text x="70" y="608">(iv) the wavelength; it comes from asymmetric (helical) molecules; a few mm</text>
    <text x="70" y="624">of crystal rotate it by many degrees; sugar and tartaric acid in solution</text>
    <text x="70" y="640">rotate it too, so the rotation measures their concentration</text>
  </g>
  <rect x="630" y="405" width="520" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="890" y="433">Importance and two main applications</text>
  <g class="r">
    <text x="650" y="452">optics and photonics: polarized sunglasses, LCD screens, optical communication</text>
    <text x="650" y="467">imaging and microscopy: less glare, better contrast; medical imaging</text>
    <text x="650" y="482">medicine: cancer diagnosis, tissue imaging and laser surgery tell tissues apart</text>
    <text x="650" y="497">astronomy: polarization of starlight and of the cosmic microwave background</text>
    <text x="650" y="527">1 sky photography: a polaroid on the camera cuts the glare and haze from</text>
    <text x="650" y="542">light scattered by small particles in the air and improves the contrast</text>
    <text x="650" y="572">2 stress analysis (photoelasticity): stressed plastics, metals or glass</text>
    <text x="650" y="587">change how they pass polarized light; the fringes show stress patterns,</text>
    <text x="650" y="602">weaknesses and defects, used in engineering and quality control</text>
    <text x="650" y="632">polarized sunglasses: glare reflected from a road vibrates parallel to it</text>
    <text x="650" y="647">and is blocked by the vertical axis of the lenses</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
