  <path d="M216 201 L211.1 208.5" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <circle cx="228" cy="209" r="3" fill="#14181f"/>
  <path d="M185 181 L189.9 173.5" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M185 181 L180.1 188.5" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <circle cx="197" cy="189" r="3" fill="#14181f"/>
  <circle cx="304" cy="201" r="3" fill="#14181f"/>
  <circle cx="335" cy="181" r="3" fill="#14181f"/>
  <circle cx="367" cy="161" r="3" fill="#14181f"/>
  <text class="r" x="90" y="120">unpolarized light</text>
  <text class="r" x="330" y="120">plane polarized (dots:</text>
  <text class="r" x="330" y="134">vibrations across the page)</text>
  <text class="l" x="204" y="160">theta_p</text>
  <text class="l" x="266" y="330">theta_r</text>
  <text class="l" x="306" y="222">90 deg between reflected and refracted</text>
  <text class="r" x="80" y="222">medium 1: air, n1</text>
  <text class="r" x="80" y="252">medium 2: glass, n2</text>
  <text class="r" x="330" y="352">refracted ray</text>
  <g class="f">
    <text x="410" y="252">theta_p + theta_r = 90 deg</text>
    <text x="410" y="270">n1 sin theta_p = n2 sin theta_r</text>
    <text x="410" y="288">  = n2 cos theta_p</text>
    <text x="410" y="306">tan theta_p = n2 / n1 = n</text>
  </g>
  <g class="r">
    <text x="410" y="330">about 57 deg for glass (Malus, 1808)</text>
    <text x="410" y="344">Ex 8.1: n = sqrt 3: theta_B = 60 deg,</text>
    <text x="410" y="358">theta_r = 30 deg</text>
    <text x="410" y="372">Ex 8.2: theta_p = 54.5 deg: n = 1.4</text>
  </g>
  <rect x="670" y="55" width="480" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="910" y="83">Malus's law (8.5, Fig. 8.7)</text>
  <path d="M700 290 H920" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M710 300 V100" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
