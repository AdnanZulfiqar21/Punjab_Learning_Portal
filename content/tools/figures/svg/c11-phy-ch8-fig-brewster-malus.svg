  <path d="M260 230 L386 148" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M260 230 L331 339" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
