  <text class="h" x="600" y="32">Polarization by reflection, Brewster's law, Malus's law and optical activity</text>
  <rect x="50" y="55" width="600" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="350" y="83">Polarization by reflection: Brewster's law (8.4, Fig. 8.6)</text>
  <rect x="70" y="230" width="330" height="140" fill="#cfe3f2" opacity="0.7"/>
  <path d="M70 230 H400" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M260 90 V370" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="r" x="266" y="100">normal</text>
