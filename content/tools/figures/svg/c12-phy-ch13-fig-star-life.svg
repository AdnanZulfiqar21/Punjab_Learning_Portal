  <path d="M198.0 305.0 L191.5 300.4 L197.3 297.0 Z" fill="#14181f"/>
  <text x="450.0" y="400.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">The final fate of a star depends mainly on its mass.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
