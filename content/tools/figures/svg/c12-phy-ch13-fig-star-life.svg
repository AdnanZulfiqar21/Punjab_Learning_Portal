<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original flow chart after Fig 13.5: a stellar nebula forms an average star (red giant, planetary nebula, white dwarf) or a massive star (red supergiant, supernova, then a neutron star or a black hole). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Life cycle of a star (after Fig 13.5)</text>
  <rect x="20.0" y="175.0" width="130.0" height="70.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="85.0" y="205.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">stellar nebula</text>
  <text x="85.0" y="223.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(gas and dust)</text>
  <rect x="200.0" y="80.0" width="150.0" height="64.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="275.0" y="107.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">average star</text>
  <text x="275.0" y="125.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(like the Sun)</text>
  <line x1="352.0" y1="112.0" x2="366.6" y2="112.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M373.0 112.0 L365.7 115.4 L365.7 108.6 Z" fill="#14181f"/>
  <rect x="375.0" y="80.0" width="150.0" height="64.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="450.0" y="116.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">red giant</text>
  <line x1="527.0" y1="112.0" x2="541.6" y2="112.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M548.0 112.0 L540.7 115.4 L540.7 108.6 Z" fill="#14181f"/>
  <rect x="550.0" y="80.0" width="150.0" height="64.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="625.0" y="107.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">planetary</text>
  <text x="625.0" y="125.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">nebula</text>
  <line x1="702.0" y1="112.0" x2="716.6" y2="112.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M723.0 112.0 L715.7 115.4 L715.7 108.6 Z" fill="#14181f"/>
  <rect x="725.0" y="80.0" width="150.0" height="64.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="800.0" y="116.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">white dwarf</text>
  <rect x="200.0" y="280.0" width="150.0" height="64.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="275.0" y="316.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">massive star</text>
  <line x1="352.0" y1="312.0" x2="366.6" y2="312.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M373.0 312.0 L365.7 315.4 L365.7 308.6 Z" fill="#14181f"/>
  <rect x="375.0" y="280.0" width="150.0" height="64.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="450.0" y="316.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">red supergiant</text>
  <line x1="527.0" y1="312.0" x2="541.6" y2="312.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M548.0 312.0 L540.7 315.4 L540.7 308.6 Z" fill="#14181f"/>
  <rect x="550.0" y="280.0" width="150.0" height="64.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="625.0" y="316.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">supernova</text>
