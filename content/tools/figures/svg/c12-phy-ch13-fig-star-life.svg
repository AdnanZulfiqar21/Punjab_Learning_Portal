  <path d="M738.0 275.0 L734.0 281.9 L730.1 276.4 Z" fill="#14181f"/>
  <line x1="702.0" y1="322.0" x2="732.5" y2="339.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M738.0 343.0 L730.0 342.3 L733.4 336.4 Z" fill="#14181f"/>
  <line x1="152.0" y1="195.0" x2="194.7" y2="125.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
