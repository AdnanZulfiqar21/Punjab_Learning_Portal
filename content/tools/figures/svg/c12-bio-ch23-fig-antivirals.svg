<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <!-- Original RU-only picture of the book's boxed statement in topic 23.3 (antiretrovirals inside antivirals; not a textbook figure). -->
  <ellipse cx="500" cy="280" rx="470" ry="260" stroke="#1f6fb5" stroke-width="5" fill="#eef5fe"/>
  <text x="270" y="190" font-size="32" fill="#1f6fb5" text-anchor="middle" font-weight="700">Antiviral drugs</text>
  <text x="270" y="250" font-size="27" fill="#1d2430" text-anchor="middle" font-weight="400">hepatitis</text>
  <text x="270" y="288" font-size="27" fill="#1d2430" text-anchor="middle" font-weight="400">influenza</text>
  <text x="270" y="326" font-size="27" fill="#1d2430" text-anchor="middle" font-weight="400">herpes viruses</text>
  <ellipse cx="680" cy="290" rx="230" ry="160" stroke="#d0322f" stroke-width="5" fill="#fde2e2"/>
  <text x="680" y="270" font-size="30" fill="#d0322f" text-anchor="middle" font-weight="700">Antiretroviral drugs</text>
  <text x="680" y="320" font-size="27" fill="#1d2430" text-anchor="middle" font-weight="400">retroviruses, e.g. HIV</text>
</svg>
