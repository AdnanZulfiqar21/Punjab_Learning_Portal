<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram for topic 23.3: a large circle of antiviral drugs (against hepatitis, influenza and herpes viruses) containing a smaller circle of antiretroviral drugs, which treat retroviruses such as HIV that use reverse transcriptase. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Antiviral and antiretroviral drugs</text>
  <ellipse cx="420.0" cy="215.0" rx="360.0" ry="165.0" stroke="#1f6fb5" stroke-width="3" fill="#eff6ff"/>
  <ellipse cx="560.0" cy="225.0" rx="130.0" ry="80.0" stroke="#d7322f" stroke-width="3" fill="#fee2e2"/>
  <text x="240.0" y="150.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">antiviral drugs</text>
  <text x="120.0" y="190.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">stop viruses growing and</text>
  <text x="120.0" y="210.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">multiplying in the body:</text>
  <text x="120.0" y="230.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">hepatitis, influenza,</text>
  <text x="120.0" y="250.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">herpes viruses</text>
  <text x="560.0" y="205.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">antiretroviral drugs</text>
  <text x="560.0" y="230.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">treat retroviruses</text>
  <text x="560.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">such as HIV</text>
  <text x="450.0" y="395.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">all antiretrovirals are antivirals, but not all antivirals are antiretrovirals</text>
  <text x="470.0" y="328.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">retrovirus: RNA genome, uses reverse transcriptase</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
