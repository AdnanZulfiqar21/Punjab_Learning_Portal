<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.1 and the active-site text: a globular enzyme with its active site, and a cofactor reshaping the site. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:22px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="50">The active site</text>
  <!-- globular enzyme with a cleft -->
  <path d="M120 360 q0 -200 180 -220 q150 -10 200 100 q40 90 -20 150 l-60 -40 l-60 60 l-40 -50 q-60 70 -140 40 q-60 -30 -60 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="7" stroke-linejoin="round"/>
  <!-- substrate fitting the cleft -->
  <path d="M300 300 l60 40 l60 -60 l40 50 l-30 50 l-70 10 l-60 -40 z" fill="#f2b134" stroke="#8a4b00" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>
  <text class="t" x="330" y="360" style="font-size:18px">substrate</text>
  <path class="lead" d="M330 390 L250 520"/><text class="t" x="80" y="550">Active site</text><text class="s" x="40" y="578">a small cleft of a few amino acids;</text><text class="s" x="40" y="602">three-dimensional with a specific charge</text>
  <path class="lead" d="M380 330 L560 250"/><text class="t" x="565" y="245" style="font-size:20px">binding site</text><text class="s" x="565" y="270">holds the substrate by</text><text class="s" x="565" y="294">weak bonds (hydrogen bonds)</text>
  <path class="lead" d="M420 390 L560 420"/><text class="t" x="565" y="415" style="font-size:20px">catalytic site</text><text class="s" x="565" y="440">stresses the bonds; turns</text><text class="s" x="565" y="464">substrate into products</text>
  <text class="s" x="40" y="120">globular protein of coiled polypeptide chains</text>
  <!-- cofactor panel -->
  <text class="h" x="950" y="50">A cofactor reshapes the site</text>
  <path d="M820 300 q0 -110 100 -120 q90 -5 110 60 q10 60 -30 70 q-70 -20 -90 20 q-50 30 -90 -30 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/>
  <text class="s" x="840" y="250">non-functional</text><text class="s" x="840" y="274">active site</text>
  <path d="M960 360 L960 420" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="990" cy="390" r="18" fill="#d98b2b"/><text class="s" x="1015" y="396">cofactor, e.g. Mg2+</text>
  <path d="M820 600 q0 -110 100 -120 q90 -5 110 60 q10 60 -30 70 l-40 -40 l-40 50 l-30 -40 q-50 30 -70 -20 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="900" cy="560" r="14" fill="#d98b2b"/>
  <text class="s" x="800" y="650">functional active site: the substrate fits</text>
  <text class="s" x="40" y="690">Apoenzyme = the protein part; holoenzyme = enzyme plus cofactor. Cofactors: metal ions, prosthetic groups, coenzymes.</text>
</svg>
