<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Tables 3.2 to 3.4: bond energy and bond length trends, and the relative strengths of bonds and intermolecular forces. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .v{font-size:12px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Bond energy, bond length, and how bonds compare with intermolecular forces</text>
  <!-- bond energy bars H-X -->
  <text class="k" x="230" y="72">H-X bond energy and electronegativity difference</text>
  <path d="M80 300 V90 M80 300 H400" stroke="#4b5563" stroke-width="2"/>
  <g fill="#1f6fb5"><rect x="110" y="96" width="50" height="204"/><rect x="180" y="146" width="50" height="154"/><rect x="250" y="169" width="50" height="131"/><rect x="320" y="194" width="50" height="106"/></g>
  <g class="v" fill="#ffffff"><text x="135" y="118" style="fill:#fff">565</text><text x="205" y="168" style="fill:#fff">427</text><text x="275" y="191" style="fill:#fff">363</text><text x="345" y="216" style="fill:#fff">295</text></g>
  <g class="s"><text x="135" y="320">H-F</text><text x="205" y="320">H-Cl</text><text x="275" y="320">H-Br</text><text x="345" y="320">H-I</text></g>
  <text class="s" x="230" y="345">kJ per mol, Table 3.2; greater polarity adds attraction</text>
  <!-- multiple bonds -->
  <text class="k" x="600" y="72">Multiple bonds: stronger and shorter</text>
  <path d="M460 300 V90 M460 300 H760" stroke="#4b5563" stroke-width="2"/>
  <g fill="#0f7a62"><rect x="490" y="213" width="60" height="87"/><rect x="580" y="146" width="60" height="154"/><rect x="670" y="90" width="60" height="210"/></g>
  <g class="v"><text x="520" y="232" style="fill:#fff">347</text><text x="610" y="165" style="fill:#fff">614</text><text x="700" y="109" style="fill:#fff">839</text></g>
  <g class="s"><text x="520" y="320">C-C 154 pm</text><text x="610" y="320">C=C 133 pm</text><text x="700" y="320">C triple C 120 pm</text></g>
  <text class="s" x="610" y="345">energy in kJ per mol (bars), length in picometres (labels)</text>
  <!-- bond length factors -->
  <text class="k" x="980" y="72">Bond length: size and polarity</text>
  <g class="t">
    <text x="820" y="104">larger atoms, longer bond:</text>
    <text x="820" y="124">C-F 135 pm, C-Cl 180, C-Br 196, C-I 214</text>
    <text x="820" y="156">bigger electronegativity difference, shorter bond:</text>
    <text x="820" y="176">Si-F measured 155 pm; covalent radii</text>
    <text x="820" y="196">Si 117 + F 64 would give 181 pm;</text>
    <text x="820" y="216">ionic character pulls the atoms closer</text>
    <text x="820" y="248">length is measured by electron diffraction,</text>
    <text x="820" y="268">X-ray diffraction or spectra;</text>
    <text x="820" y="288">energy is the average needed to break</text>
    <text x="820" y="308">one mole of that bond (kJ per mol)</text>
  </g>
  <!-- comparison chart -->
  <path d="M60 370 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="600" y="400">Relative strengths (Table 3.4, kJ per mol)</text>
  <path d="M250 420 V600" stroke="#4b5563" stroke-width="2"/>
  <g class="t" text-anchor="end">
    <text x="240" y="440">ionic bond in NaCl</text><text x="240" y="470">O-H bond in water</text><text x="240" y="500">metallic bond (average)</text><text x="240" y="530">hydrogen bonding</text><text x="240" y="560">permanent dipole-dipole</text><text x="240" y="590">van der Waals (London)</text>
  </g>
  <g>
    <rect x="250" y="428" width="760" height="18" fill="#d7322f"/><text class="v" x="1030" y="442" style="text-anchor:start">760</text>
    <rect x="250" y="458" width="464" height="18" fill="#1f6fb5"/><text class="v" x="724" y="472" style="text-anchor:start">464</text>
    <rect x="250" y="488" width="125" height="18" fill="#d98b2b"/><text class="v" x="385" y="502" style="text-anchor:start">100 to 150</text>
    <rect x="250" y="518" width="35" height="18" fill="#5b3fb5"/><text class="v" x="295" y="532" style="text-anchor:start">20 to 50 (text: 20 to 25)</text>
    <rect x="250" y="548" width="15" height="18" fill="#0f7a62"/><text class="v" x="275" y="562" style="text-anchor:start">5 to 20</text>
    <rect x="250" y="578" width="12" height="18" fill="#9ca3af"/><text class="v" x="272" y="592" style="text-anchor:start">1 to 20</text>
  </g>
  <text class="s" x="600" y="625">Ionic, covalent and metallic bonds are true chemical bonds and are much stronger than intermolecular forces; the metallic bond is weakened by delocalized electrons.</text>
</svg>
