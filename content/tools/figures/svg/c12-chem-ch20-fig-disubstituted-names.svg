  <text x="658.9" y="231.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">2</tspan></text>
  <text x="614.0" y="263.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">1</tspan></text>
  <text x="600.0" y="345.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">4-isopropylphenol</tspan></text>
  <text x="600.0" y="376.2" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">(4-(1-methylethyl)-phenol)</tspan></text>
  <text x="600.0" y="407.4" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">The phenol alcohol is C-1</tspan></text>
