  <text x="265.5" y="213.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">3</tspan></text>
  <text x="200.0" y="345.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">3-hydroxybenzoic acid</tspan></text>
  <text x="200.0" y="376.2" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">acid is higher priority</tspan></text>
  <text x="200.0" y="407.4" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">than alcohol.</tspan></text>
  <path d="M600.0 140.0 L643.3 165.0 L643.3 215.0 L600.0 240.0 L556.7 215.0 L556.7 165.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
