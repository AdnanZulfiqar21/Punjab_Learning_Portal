  <line x1="600.0" y1="140.0" x2="600.0" y2="100.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="600.0" y1="100.0" x2="564.0" y2="78.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
