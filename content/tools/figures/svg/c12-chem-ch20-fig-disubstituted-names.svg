<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="440" fill="#ffffff"/>
  <!-- Names of disubstituted benzenes as printed on p63: 3-hydroxybenzoic acid, 4-isopropylphenol and 1-bromo-2-chlorobenzene, with the ring carbons numbered and the book's short notes. -->
  <path d="M200.0 150.0 L243.3 175.0 L243.3 225.0 L200.0 250.0 L156.7 225.0 L156.7 175.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
