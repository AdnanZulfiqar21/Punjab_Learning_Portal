  <line x1="996.2" y1="237.8" x2="969.2" y2="222.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="969.2" y1="177.8" x2="996.2" y2="162.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
