  <text x="1093.6" y="156.1" font-size="28" fill="#d81b60" text-anchor="middle" font-weight="400"><tspan dy="0.0">Cl</tspan></text>
  <text x="1014.0" y="143.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">1</tspan></text>
  <text x="1061.5" y="205.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">2</tspan></text>
  <text x="1000.0" y="345.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">1-bromo-2-chlorobenzene</tspan></text>
  <text x="1000.0" y="376.2" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">bromo is before chloro in</tspan></text>
  <text x="1000.0" y="407.4" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">the alphabet</tspan></text>
