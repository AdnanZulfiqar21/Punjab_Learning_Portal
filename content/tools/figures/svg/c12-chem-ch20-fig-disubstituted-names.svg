  <line x1="200.0" y1="114.0" x2="228.9" y2="93.3" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="243.3" y1="225.0" x2="272.7" y2="242.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="296.9" y="266.0" font-size="28" fill="#d81b60" text-anchor="middle" font-weight="400"><tspan dy="0.0">OH</tspan></text>
  <text x="186.0" y="139.9" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">1</tspan></text>
