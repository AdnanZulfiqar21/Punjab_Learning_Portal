<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original flow for the book's worked experiment: question, hypothesis, independent, dependent and controlled variables, control and experimental groups of mice, an 8-week procedure, analysis of average weight gain and the conclusion. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Planning an experiment: high-fat diet and weight gain in mice</text>
  <rect x="40.0" y="75.0" width="820.0" height="52.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="107.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">1 question</text>
  <text x="220.0" y="107.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Does a high-fat diet cause more weight gain?</text>
  <rect x="40.0" y="135.0" width="820.0" height="52.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="167.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">2 hypothesis</text>
  <text x="220.0" y="167.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">high-fat diet mice will gain more weight</text>
  <rect x="40.0" y="195.0" width="820.0" height="74.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="227.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">3 variables</text>
  <text x="220.0" y="227.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">independent: diet; dependent: weight gain;</text>
  <text x="220.0" y="249.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">controlled: age, strain, sex, cage, light, feeding</text>
  <rect x="40.0" y="277.0" width="820.0" height="52.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="309.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">4 groups</text>
  <text x="220.0" y="309.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">control: normal diet; experimental: high-fat</text>
  <rect x="40.0" y="337.0" width="820.0" height="74.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="369.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">5 procedure</text>
  <text x="220.0" y="369.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">matched mice, random groups, same housing,</text>
  <text x="220.0" y="391.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">diet for 8 weeks, weigh every week</text>
  <rect x="40.0" y="419.0" width="820.0" height="52.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="451.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">6 analyse</text>
  <text x="220.0" y="451.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">compare average weight gain (graphs, tests)</text>
  <rect x="40.0" y="479.0" width="820.0" height="52.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="511.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">7 conclude</text>
  <text x="220.0" y="511.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">support or reject the hypothesis</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
