<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- For your information box "Types of chokes" (C12-PHY, PDF p95): flat drawing after the four printed photographs, two by two: filter choke (top left), high frequency choke (top right), radio frequency choke (bottom left), A.C controlling choke (bottom right), each with its printed label. No photograph is reproduced. -->
