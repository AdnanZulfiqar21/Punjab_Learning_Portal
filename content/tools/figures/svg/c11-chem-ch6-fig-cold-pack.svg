<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800">
  <!-- Vis6-1 (C11-CHEM, PDF p119): cold pack photo in the Interesting information box; flat drawing after the printed photograph: an arm comes in from the right with the hand loosely closed at the left; a white instant cold pack is wrapped over the top of the wrist and held there from below by the other hand, which comes in from the bottom right with its thumb pressing the pack; mottled blue background. No photograph is reproduced. -->
  <rect width="1100" height="800" fill="#ffffff"/>
  <clipPath id="card"><rect x="10" y="10" width="1080" height="780" rx="60"/></clipPath>
  <g clip-path="url(#card)">
    <rect x="10" y="10" width="1080" height="780" fill="#4f78ad"/>
    <g fill="#6d93c2" opacity="0.8">
      <ellipse cx="160" cy="160" rx="170" ry="100"/>
      <ellipse cx="560" cy="120" rx="220" ry="80"/>
      <ellipse cx="200" cy="720" rx="220" ry="90"/>
      <ellipse cx="640" cy="760" rx="160" ry="60"/>
    </g>
    <g fill="#a9c3df" opacity="0.6">
      <ellipse cx="380" cy="220" rx="90" ry="40"/>
      <ellipse cx="760" cy="90" rx="80" ry="30"/>
      <ellipse cx="110" cy="420" rx="70" ry="40"/>
      <ellipse cx="500" cy="700" rx="80" ry="34"/>
    </g>
    <!-- upper arm and forearm coming in from the right -->
    <path d="M1090 160 L 1090 300 C 1000 420 950 520 860 590 L 820 380 C 900 330 1000 260 1090 160 Z" fill="#dba886"/>
    <path d="M1090 160 C 1000 260 900 330 820 380" stroke="#c48d6b" stroke-width="4" fill="none"/>
    <path d="M820 380 L 860 590 L 560 610 L 520 400 Z" fill="#e0b190"/>
    <!-- loosely closed hand at the left, fingers curled -->
    <path d="M540 400 C 470 380 380 380 300 400 C 240 412 200 440 180 470 L 520 600 Z" fill="#e3b796" stroke="#c48d6b" stroke-width="3"/>
    <path d="M520 600 C 440 640 360 650 300 640 L 260 600 L 340 560 Z" fill="#dca988"/>
    <g fill="#e3b796" stroke="#c48d6b" stroke-width="3">
      <path d="M300 410 C 240 410 150 440 125 480 C 115 500 135 515 165 505 L 300 470 Z"/>
      <path d="M300 470 C 240 480 160 510 140 545 C 132 562 152 575 180 565 L 310 525 Z"/>
      <path d="M310 525 C 250 540 190 570 175 605 C 170 620 190 630 215 620 L 320 580 Z"/>
      <path d="M320 580 C 280 600 240 630 235 655 C 233 672 255 676 275 662 L 340 620 Z"/>
    </g>
    <path d="M300 410 C 260 430 240 470 250 500 L 330 480 C 330 450 320 430 300 410 Z" fill="#e8c0a2" stroke="#c48d6b" stroke-width="3"/>
    <!-- white cold pack wrapped over the wrist -->
    <path d="M470 340 C 560 318 700 322 790 350 L 870 610 C 790 630 690 630 620 625 L 560 540 Z" fill="#f7f7f5" stroke="#c9c9c5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M520 370 C 600 356 690 360 770 380 M560 430 C 640 420 720 426 800 446 M600 500 C 660 494 740 500 820 520" stroke="#dcdcd8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M470 340 L 452 362 L 500 372 Z M790 350 L 812 336 L 806 380 Z" fill="#ececea" stroke="#c9c9c5" stroke-width="3"/>
    <!-- the other hand from the bottom right, thumb pressing the pack -->
    <path d="M1090 800 L 1090 680 C 960 650 860 640 780 610 C 720 590 640 600 560 620 C 520 632 520 660 560 668 L 700 680 C 760 720 820 760 870 800 Z" fill="#e8c2a6" stroke="#c48d6b" stroke-width="3"/>
    <path d="M720 610 C 712 560 712 510 724 470 C 732 450 760 454 762 478 L 772 600 Z" fill="#e8c2a6" stroke="#c48d6b" stroke-width="3"/>
  </g>
</svg>
