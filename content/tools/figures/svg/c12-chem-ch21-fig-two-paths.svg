<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram after the book's two schemes: a nucleophile attacks the delta+ carbon and the halide leaves (substitution); a base removes H from the neighbouring carbon and HX is lost to form an alkene (elimination). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two kinds of reaction of halogenoalkanes</text>
  <rect x="15.0" y="55.0" width="425.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">nucleophilic substitution (SN)</text>
  <text x="70.0" y="196.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">Nu</tspan><tspan dy="-7.6" font-size="12.6">-</tspan></text>
  <circle cx="68.0" cy="172.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="76.0" cy="172.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <line x1="180.0" y1="179.0" x2="180.0" y2="157.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="180.0" y="143.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="191.0" y1="190.0" x2="213.0" y2="190.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="234.5" y="195.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="180.0" y1="201.0" x2="180.0" y2="223.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="180.0" y="247.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="169.0" y1="190.0" x2="147.0" y2="190.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="125.5" y="195.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="180.0" y="195.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="196.0" y="176.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="256.0" y="172.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <path d="M88.0 180.0 Q120.0 150.0 162.0 178.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M162.0 178.0 L152.1 176.5 L156.8 169.5 Z" fill="#d7322f"/>
  <path d="M200.0 196.0 Q226.0 214.0 248.0 200.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M248.0 200.0 L242.6 208.4 L238.1 201.3 Z" fill="#d7322f"/>
  <line x1="290.0" y1="190.0" x2="321.2" y2="190.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 190.0 L320.0 194.6 L320.0 185.4 Z" fill="#14181f"/>
  <text x="382.0" y="196.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-Nu</tspan></text>
  <text x="382.0" y="225.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ X</tspan><tspan dy="-6.3" font-size="10.5">-</tspan></text>
  <text x="227.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the nucleophile replaces the halogen</text>
  <text x="227.0" y="319.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">(the leaving group)</text>
  <rect x="460.0" y="55.0" width="425.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">elimination (E)</text>
  <text x="560.0" y="206.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="560.0" y1="189.0" x2="560.0" y2="161.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="560.0" y="145.9" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="560.0" y1="211.0" x2="560.0" y2="234.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="650.0" y="206.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="650.0" y1="189.0" x2="650.0" y2="161.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="650.0" y="145.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">X</tspan></text>
  <line x1="650.0" y1="211.0" x2="650.0" y2="234.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="571.0" y1="200.0" x2="639.0" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="540.0" y="122.0" width="130.0" height="34.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="605.0" y="116.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">H and X removed</text>
  <line x1="690.0" y1="200.0" x2="721.2" y2="200.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730.0 200.0 L720.0 204.6 L720.0 195.4 Z" fill="#14181f"/>
  <line x1="765.0" y1="196.5" x2="835.0" y2="196.5" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="765.0" y1="203.5" x2="835.0" y2="203.5" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="800.0" y="240.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">alkene + HX</text>
  <text x="672.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">a base removes H from the carbon next</text>
  <text x="672.0" y="319.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">to C-X (the beta carbon); X leaves</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
