<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" font-family="Times New Roman, Georgia, serif">
  <!-- Step (i) of bromination: ethene (high area of electron density, non-polar) and Br2 with an induced dipole, delta+ Br as electrophile (original drawing after the drawing printed on p260 of the textbook) -->
  <rect width="1150" height="470" fill="#ffffff"/>
  <ellipse cx="244.0" cy="120.0" rx="32.0" ry="11.0" stroke="#7cc3ef" stroke-width="1.5" fill="#9fd3f2"/>
  <path d="M233.0 142.0 L255.0 142.0 L255.0 252.0 L266.0 252.0 L244.0 280.0 L222.0 252.0 L233.0 252.0 Z" stroke="#14181f" stroke-width="2.4" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="244.0" y="345.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>High area of electron density</tspan></text>
  <text x="244.0" y="385.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Non-polar molecule</tspan></text>
  <circle cx="700.0" cy="120.0" r="46.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/>
  <circle cx="800.0" cy="120.0" r="46.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/>
  <text x="700.0" y="112.0" font-size="28" fill="#d9262b" text-anchor="middle" font-weight="400"><tspan>&#948;+</tspan></text>
  <text x="800.0" y="112.0" font-size="28" fill="#d9262b" text-anchor="middle" font-weight="400"><tspan>&#948;&#8722;</tspan></text>
  <text x="700.0" y="150.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Br</tspan></text>
  <text x="800.0" y="150.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Br</tspan></text>
  <circle cx="828.0" cy="135.5" r="3.0" stroke="none" stroke-width="0" fill="#14181f"/>
  <circle cx="828.0" cy="144.5" r="3.0" stroke="none" stroke-width="0" fill="#14181f"/>
  <text x="600.0" y="46.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Electrophile</tspan></text>
  <path d="M585.0 60.0 C540.0 80.0 545.0 140.0 642.3 140.0" stroke="#14181f" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M650.0 140.0 L637.6 146.6 L637.6 133.4 Z" fill="#14181f"/>
  <path d="M780.0 170.0 C754.0 190.0 760.0 230.0 800.3 226.6" stroke="#14181f" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M808.0 226.0 L796.2 233.6 L795.1 220.5 Z" fill="#14181f"/>
  <text x="820.0" y="236.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Induced Dipole</tspan></text>
  <text x="610.0" y="290.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>The double bond repels the electrons</tspan></text>
  <text x="610.0" y="330.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>away from the closest Br atom</tspan></text>
