<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 3.3 and 3.4: a Venn diagram of P, NP, NP-hard and NP-complete with examples, solvable and tractable examples, and sketched growth curves for O(1), O(log n), O(n) and O(n^2). -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Solvability, complexity classes and Big O growth</text>
  <rect x="50" y="55" width="540" height="640" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Complexity classes (3.3)</text>
  <ellipse cx="220" cy="230" rx="160" ry="115" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.8"/>
  <ellipse cx="430" cy="230" rx="145" ry="140" fill="#fdecea" fill-opacity="0.55" stroke="#d7322f" stroke-width="1.8"/>
  <ellipse cx="160" cy="240" rx="70" ry="55" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.8"/>
  <text class="l" x="160" y="236" style="fill:#0f7a62;text-anchor:middle">P</text>
  <text class="r" x="160" y="254" style="text-anchor:middle">sorting</text>
  <text class="l" x="200" y="148" style="fill:#1f6fb5;text-anchor:middle">NP</text>
  <text class="r" x="200" y="166" style="text-anchor:middle">Sudoku</text>
  <text class="l" x="332" y="224" style="fill:#7a2f86;text-anchor:middle">NP-</text>
  <text class="l" x="332" y="240" style="fill:#7a2f86;text-anchor:middle">complete</text>
  <text class="r" x="332" y="258" style="text-anchor:middle">knapsack</text>
  <text class="l" x="480" y="216" style="fill:#d7322f;text-anchor:middle">NP-hard</text>
  <text class="r" x="480" y="234" style="text-anchor:middle">TSP</text>
  <g class="r">
    <text x="70" y="400">P: solved quickly (polynomial time)</text>
    <text x="70" y="416">NP: a given solution can be checked quickly</text>
    <text x="70" y="432">NP-hard: at least as hard as the hardest NP problems</text>
    <text x="70" y="448">NP-complete: in NP and NP-hard</text>
    <text x="70" y="464">drawn assuming P is not NP, which is still unproved</text>
    <text x="70" y="496">solvable: GCD by the Euclidean algorithm</text>
    <text x="70" y="512">unsolvable: the Halting Problem (Alan Turing)</text>
    <text x="70" y="528">tractable: polynomial time, e.g. merge sort O(n log n)</text>
    <text x="70" y="544">intractable: TSP routes grow factorially:</text>
    <text x="70" y="560">5 cities 120; 10 cities 3,628,800; 20 cities about 2.43 x 10^18</text>
  </g>
  <rect x="610" y="55" width="540" height="640" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">How running time grows (3.4)</text>
  <path d="M680 420 H1110" stroke="#14181f" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M680 420 V105" stroke="#14181f" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="r" x="1100" y="442" style="text-anchor:end">input size n</text>
  <text class="r" x="670" y="100" style="text-anchor:end">time</text>
