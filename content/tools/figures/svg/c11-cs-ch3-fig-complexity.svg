  <text class="l" x="1068.0" y="134.0" style="fill:#d7322f">O(n^2)</text>
  <path d="M680.0 420.0 L683.8 418.2 L687.6 416.4 L691.4 414.6 L695.2 412.8 L699.0 411.0 L702.8 409.2 L706.6 407.4 L710.4 405.6 L714.2 403.8 L718.0 402.0 L721.8 400.2 L725.6 398.4 L729.4 396.6 L733.2 394.8 L737.0 393.0 L740.8 391.2 L744.6 389.4 L748.4 387.6 L752.2 385.8 L756.0 384.0 L759.8 382.2 L763.6 380.4 L767.4 378.6 L771.2 376.8 L775.0 375.0 L778.8 373.2 L782.6 371.4 L786.4 369.6 L790.2 367.8 L794.0 366.0 L797.8 364.2 L801.6 362.4 L805.4 360.6 L809.2 358.8 L813.0 357.0 L816.8 355.2 L820.6 353.4 L824.4 351.6 L828.2 349.8 L832.0 348.0 L835.8 346.2 L839.6 344.4 L843.4 342.6 L847.2 340.8 L851.0 339.0 L854.8 337.2 L858.6 335.4 L862.4 333.6 L866.2 331.8 L870.0 330.0 L873.8 328.2 L877.6 326.4 L881.4 324.6 L885.2 322.8 L889.0 321.0 L892.8 319.2 L896.6 317.4 L900.4 315.6 L904.2 313.8 L908.0 312.0 L911.8 310.2 L915.6 308.4 L919.4 306.6 L923.2 304.8 L927.0 303.0 L930.8 301.2 L934.6 299.4 L938.4 297.6 L942.2 295.8 L946.0 294.0 L949.8 292.2 L953.6 290.4 L957.4 288.6 L961.2 286.8 L965.0 285.0 L968.8 283.2 L972.6 281.4 L976.4 279.6 L980.2 277.8 L984.0 276.0 L987.8 274.2 L991.6 272.4 L995.4 270.6 L999.2 268.8 L1003.0 267.0 L1006.8 265.2 L1010.6 263.4 L1014.4 261.6 L1018.2 259.8 L1022.0 258.0 L1025.8 256.2 L1029.6 254.4 L1033.4 252.6 L1037.2 250.8 L1041.0 249.0 L1044.8 247.2 L1048.6 245.4 L1052.4 243.6 L1056.2 241.8 L1060.0 240.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <text class="l" x="1068.0" y="244.0" style="fill:#d98b2b">O(n)</text>
  <path d="M680.0 420.0 L683.8 414.5 L687.6 409.5 L691.4 404.9 L695.2 400.6 L699.0 396.6 L702.8 392.9 L706.6 389.4 L710.4 386.1 L714.2 383.0 L718.0 380.0 L721.8 377.2 L725.6 374.5 L729.4 371.9 L733.2 369.5 L737.0 367.1 L740.8 364.9 L744.6 362.7 L748.4 360.6 L752.2 358.6 L756.0 356.6 L759.8 354.7 L763.6 352.9 L767.4 351.1 L771.2 349.4 L775.0 347.7 L778.8 346.1 L782.6 344.5 L786.4 343.0 L790.2 341.5 L794.0 340.0 L797.8 338.6 L801.6 337.2 L805.4 335.8 L809.2 334.5 L813.0 333.2 L816.8 331.9 L820.6 330.7 L824.4 329.5 L828.2 328.3 L832.0 327.1 L835.8 326.0 L839.6 324.9 L843.4 323.8 L847.2 322.7 L851.0 321.6 L854.8 320.6 L858.6 319.6 L862.4 318.6 L866.2 317.6 L870.0 316.6 L873.8 315.6 L877.6 314.7 L881.4 313.8 L885.2 312.9 L889.0 312.0 L892.8 311.1 L896.6 310.2 L900.4 309.4 L904.2 308.5 L908.0 307.7 L911.8 306.9 L915.6 306.1 L919.4 305.3 L923.2 304.5 L927.0 303.7 L930.8 303.0 L934.6 302.2 L938.4 301.5 L942.2 300.7 L946.0 300.0 L949.8 299.3 L953.6 298.6 L957.4 297.9 L961.2 297.2 L965.0 296.5 L968.8 295.8 L972.6 295.2 L976.4 294.5 L980.2 293.8 L984.0 293.2 L987.8 292.6 L991.6 291.9 L995.4 291.3 L999.2 290.7 L1003.0 290.1 L1006.8 289.5 L1010.6 288.9 L1014.4 288.3 L1018.2 287.7 L1022.0 287.1 L1025.8 286.5 L1029.6 286.0 L1033.4 285.4 L1037.2 284.9 L1041.0 284.3 L1044.8 283.8 L1048.6 283.2 L1052.4 282.7 L1056.2 282.1 L1060.0 281.6" stroke="#1f6fb5" stroke-width="2.4" fill="none"/>
  <text class="l" x="1068.0" y="285.6" style="fill:#1f6fb5">O(log n)</text>
  <path d="M680.0 398.0 L683.8 398.0 L687.6 398.0 L691.4 398.0 L695.2 398.0 L699.0 398.0 L702.8 398.0 L706.6 398.0 L710.4 398.0 L714.2 398.0 L718.0 398.0 L721.8 398.0 L725.6 398.0 L729.4 398.0 L733.2 398.0 L737.0 398.0 L740.8 398.0 L744.6 398.0 L748.4 398.0 L752.2 398.0 L756.0 398.0 L759.8 398.0 L763.6 398.0 L767.4 398.0 L771.2 398.0 L775.0 398.0 L778.8 398.0 L782.6 398.0 L786.4 398.0 L790.2 398.0 L794.0 398.0 L797.8 398.0 L801.6 398.0 L805.4 398.0 L809.2 398.0 L813.0 398.0 L816.8 398.0 L820.6 398.0 L824.4 398.0 L828.2 398.0 L832.0 398.0 L835.8 398.0 L839.6 398.0 L843.4 398.0 L847.2 398.0 L851.0 398.0 L854.8 398.0 L858.6 398.0 L862.4 398.0 L866.2 398.0 L870.0 398.0 L873.8 398.0 L877.6 398.0 L881.4 398.0 L885.2 398.0 L889.0 398.0 L892.8 398.0 L896.6 398.0 L900.4 398.0 L904.2 398.0 L908.0 398.0 L911.8 398.0 L915.6 398.0 L919.4 398.0 L923.2 398.0 L927.0 398.0 L930.8 398.0 L934.6 398.0 L938.4 398.0 L942.2 398.0 L946.0 398.0 L949.8 398.0 L953.6 398.0 L957.4 398.0 L961.2 398.0 L965.0 398.0 L968.8 398.0 L972.6 398.0 L976.4 398.0 L980.2 398.0 L984.0 398.0 L987.8 398.0 L991.6 398.0 L995.4 398.0 L999.2 398.0 L1003.0 398.0 L1006.8 398.0 L1010.6 398.0 L1014.4 398.0 L1018.2 398.0 L1022.0 398.0 L1025.8 398.0 L1029.6 398.0 L1033.4 398.0 L1037.2 398.0 L1041.0 398.0 L1044.8 398.0 L1048.6 398.0 L1052.4 398.0 L1056.2 398.0 L1060.0 398.0" stroke="#0f7a62" stroke-width="2.4" fill="none"/>
  <text class="l" x="1068.0" y="402.0" style="fill:#0f7a62">O(1)</text>
  <g class="r">
    <text x="630" y="470">O(1): reach an array item by its index</text>
    <text x="630" y="486">O(log n): guessing game that halves the range each time</text>
    <text x="630" y="502">O(n): look through n student IDs one by one</text>
    <text x="630" y="518">O(n^2): compare every pair, about n(n - 1)/2 comparisons</text>
    <text x="630" y="534">bubble sort O(n^2): double the input, about 4 times the time</text>
    <text x="630" y="566">space complexity uses the same notation: a few variables</text>
    <text x="630" y="582">O(1); a list O(n); an n x n matrix O(n^2)</text>
    <text x="630" y="598">Big O describes the worst case (an upper bound)</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
