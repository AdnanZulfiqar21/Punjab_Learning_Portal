  <path d="M180.0 60.0 L240.6 95.0 L240.6 165.0 L180.0 200.0 L119.4 165.0 L119.4 95.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <text x="470.0" y="80.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400">b)</text>
