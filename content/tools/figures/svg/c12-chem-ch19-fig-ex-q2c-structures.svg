  <line x1="650.0" y1="200.0" x2="730.0" y2="120.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="730.0" y1="120.0" x2="810.0" y2="200.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="749.8" y1="124.2" x2="805.8" y2="180.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="940.0" y="80.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400">c)</text>
