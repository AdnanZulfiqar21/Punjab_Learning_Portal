<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Inter, Arial, sans-serif">
<!-- Figure in 14.3.7(a) (C11-MATH, PDF p285): parallelogram on u and v, the other two sides dashed, the height h = |u| sin theta dotted and labelled along it  Printed on a pale yellow panel (#FFFAC2), drawn so. -->
<rect x="0" y="0" width="1000" height="480" fill="#FFFAC2"/>
<line x1="260.0" y1="110.0" x2="860.0" y2="110.0" stroke="#1fa3dc" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
<line x1="860.0" y1="110.0" x2="660.0" y2="420.0" stroke="#1fa3dc" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
<line x1="260.0" y1="114.0" x2="260.0" y2="420.0" stroke="#1fa3dc" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/>
<line x1="60.0" y1="420.0" x2="642.4" y2="420.0" stroke="#c2185b" stroke-width="4" stroke-linecap="round"/>
<path d="M660.0,420.0 L638.0,429.0 L638.0,411.0 Z" fill="#c2185b"/>
<line x1="60.0" y1="420.0" x2="250.5" y2="124.8" stroke="#c2185b" stroke-width="4" stroke-linecap="round"/>
<path d="M260.0,110.0 L255.6,133.4 L240.5,123.6 Z" fill="#c2185b"/>
<path d="M140.0,420.0 A80,80 0 0 0 103.4,352.8" fill="none" stroke="#111111" stroke-width="2.5"/>
<text x="294.0" y="280.0" font-size="28" text-anchor="middle" font-style="italic" fill="#111111" paint-order="stroke" stroke="#FFFAC2" stroke-width="6" stroke-linejoin="round" transform="rotate(-90.0 294.0 280.0)">h = |<tspan text-decoration="underline" font-weight="700">u</tspan>| sin θ</text>
<text x="122.0" y="260.0" font-size="28" text-anchor="end" font-style="italic" fill="#111111" paint-order="stroke" stroke="#FFFAC2" stroke-width="6" stroke-linejoin="round">|<tspan text-decoration="underline" font-weight="700">u</tspan>|</text>
<text x="260.0" y="92.0" font-size="30" text-anchor="middle" font-style="italic" font-weight="700" text-decoration="underline" fill="#111111" paint-order="stroke" stroke="#FFFAC2" stroke-width="6" stroke-linejoin="round">u</text>
<text x="360.0" y="466.0" font-size="28" text-anchor="middle" font-style="italic" fill="#111111" paint-order="stroke" stroke="#FFFAC2" stroke-width="6" stroke-linejoin="round">|<tspan text-decoration="underline" font-weight="700">v</tspan>|</text>
<text x="660.0" y="466.0" font-size="30" text-anchor="middle" font-style="italic" font-weight="700" text-decoration="underline" fill="#111111" paint-order="stroke" stroke="#FFFAC2" stroke-width="6" stroke-linejoin="round">v</text>
</svg>
