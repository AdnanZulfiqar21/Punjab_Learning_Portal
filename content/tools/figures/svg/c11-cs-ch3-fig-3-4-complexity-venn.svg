<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="800" fill="#ffffff"/>
  <!-- Fig 3.4 (C11-CS, PDF p77): Venn diagram of P, NP, NP-hard and NP-complete; NP-Hard circle on top overlapping NP, P ellipse resting on the bottom of NP, as printed -->
  <circle cx="450.0" cy="250.0" r="235.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <circle cx="450.0" cy="545.0" r="195.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <ellipse cx="450.0" cy="680.0" rx="120.0" ry="60.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <text x="450.0" y="221.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP-Hard</text>
  <text x="450.0" y="422.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP-Complete</text>
  <text x="450.0" y="560.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP</text>
  <text x="450.0" y="690.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">P</text>
</svg>
