  <rect width="900" height="800" fill="#ffffff"/>
  <!-- Figure 3.4 Venn diagram of the complexity classes P, NP, NP-hard and NP-complete, drawn after the textbook figure -->
  <circle cx="450.0" cy="250.0" r="225.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <circle cx="450.0" cy="555.0" r="200.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <ellipse cx="450.0" cy="678.0" rx="92.0" ry="52.0" stroke="#111111" stroke-width="2.6" fill="none"/>
  <text x="450.0" y="221.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP-Hard</text>
  <text x="450.0" y="429.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP-Complete</text>
  <text x="450.0" y="571.5" font-size="32" fill="#111111" text-anchor="middle" font-weight="600">NP</text>
