<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1300" height="920" fill="#ffffff"/>
  <!-- Answer figure (original): sequence diagram of placing a food delivery order (long question 5). -->
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14181f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#14181f" stroke-width="1.6"/></marker></defs>
  <rect x="25" y="40" width="210" height="56" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="130" y="77" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">Customer</text>
  <line x1="130" y1="96" x2="130" y2="900" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="285" y="40" width="210" height="56" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="390" y="77" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">App</text>
  <line x1="390" y1="96" x2="390" y2="900" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="545" y="40" width="210" height="56" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="650" y="77" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">Payment Service</text>
  <line x1="650" y1="96" x2="650" y2="900" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="805" y="40" width="210" height="56" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="910" y="77" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">Restaurant</text>
  <line x1="910" y1="96" x2="910" y2="900" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="1065" y="40" width="210" height="56" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="1170" y="77" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">Rider</text>
  <line x1="1170" y1="96" x2="1170" y2="900" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="130" y1="160" x2="386" y2="160" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="260.0" y="142" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">1. order items</text>
  <line x1="390" y1="244" x2="646" y2="244" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="520.0" y="226" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">2. request payment</text>
  <line x1="650" y1="328" x2="394" y2="328" stroke="#14181f" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ao)"/>
  <text x="520.0" y="310" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">3. payment confirmed</text>
  <line x1="390" y1="412" x2="906" y2="412" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="520" y="394" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">4. send order</text>
  <line x1="910" y1="496" x2="394" y2="496" stroke="#14181f" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ao)"/>
  <text x="780" y="478" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">5. order accepted</text>
  <line x1="390" y1="580" x2="1166" y2="580" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="520" y="562" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">6. assign delivery</text>
  <line x1="910" y1="664" x2="1166" y2="664" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="1040.0" y="646" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">7. hand over food</text>
  <line x1="1170" y1="748" x2="134" y2="748" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="1040" y="730" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">8. deliver order</text>
  <line x1="390" y1="832" x2="134" y2="832" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="260.0" y="814" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">9. order delivered</text>
</svg>
