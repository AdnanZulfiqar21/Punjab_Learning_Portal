<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original: a window split into a top frame and a bottom frame. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Frames divide a window into sections (after the frames example)</text>
  <rect x="230.0" y="70.0" width="440.0" height="300.0" rx="6" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <rect x="230.0" y="70.0" width="440.0" height="30.0" rx="6" stroke="#14181f" stroke-width="2" fill="#e5e7eb"/>
  <text x="242.0" y="91.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Tkinter Frames Example</text>
  <text x="656.0" y="91.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">x</text>
  <rect x="620.0" y="82.0" width="12.0" height="2.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="638.0" y="79.0" width="9.0" height="9.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <rect x="232.0" y="100.0" width="436.0" height="90.0" rx="0" stroke="#1f6fb5" stroke-width="1.5" fill="#dbe9f5"/>
  <text x="450.0" y="152.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="400">Top Frame</text>
  <rect x="232.0" y="190.0" width="436.0" height="178.0" rx="0" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="450.0" y="285.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="400">Bottom Frame</text>
  <text x="700.0" y="140.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">top_frame:</text>
  <text x="700.0" y="157.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">lightblue,</text>
  <text x="700.0" y="174.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">height 100</text>
  <text x="700.0" y="270.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">bottom_frame:</text>
  <text x="700.0" y="287.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">lightgreen;</text>
  <text x="700.0" y="304.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">fill='both',</text>
  <text x="700.0" y="321.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">expand=True</text>
  <text x="40.0" y="160.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">each frame</text>
  <text x="40.0" y="178.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">holds its own</text>
  <text x="40.0" y="196.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">widgets (here</text>
  <text x="40.0" y="214.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">one label each)</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
