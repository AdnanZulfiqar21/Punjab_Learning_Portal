<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Times New Roman, Georgia, serif">
  <!-- Figure 11.15 HBr molecule polarity: delta+ H (electrophile) - Br delta-, dipole arrow; Br pulls the electrons more strongly; H has lower electronegativity and is electron deficient (original drawing after the textbook's Figure 11.15) -->
  <rect width="1000" height="470" fill="#ffffff"/>
  <ellipse cx="200.0" cy="132.0" rx="46.0" ry="66.0" stroke="#3aa335" stroke-width="2.4" fill="none"/>
  <text x="200.0" y="156.0" font-size="46" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>H</tspan></text>
  <text x="400.0" y="156.0" font-size="46" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Br</tspan></text>
  <line x1="234.0" y1="140.0" x2="360.0" y2="140.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="200.0" y="106.0" font-size="30" fill="#d9262b" text-anchor="middle" font-weight="400"><tspan>&#948;+</tspan></text>
  <text x="400.0" y="106.0" font-size="30" fill="#d9262b" text-anchor="middle" font-weight="400"><tspan>&#948;&#8722;</tspan></text>
  <line x1="250.0" y1="40.0" x2="358.8" y2="40.0" stroke="#d9262b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M370.0 40.0 L357.6 46.6 L357.6 33.4 Z" fill="#d9262b"/>
  <line x1="268.0" y1="28.0" x2="268.0" y2="52.0" stroke="#d9262b" stroke-width="2.4" stroke-linecap="round"/>
  <text x="200.0" y="222.0" font-size="40" fill="#3aa335" text-anchor="middle" font-weight="400"><tspan>Electrophile</tspan></text>
  <rect x="560.0" y="170.0" width="420.0" height="96.0" rx="6" stroke="#4a2a4a" stroke-width="2.2" fill="#e2c6e0"/>
  <text x="580.0" y="208.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Pulls the electrons more</tspan></text>
  <text x="580.0" y="250.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>strongly towards itself</tspan></text>
  <path d="M560.0 218.0 L400.0 218.0 L400.0 180.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M406.6 184.4 L400.0 172.0 L393.4 184.4" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="420.0" y="310.0" width="520.0" height="96.0" rx="6" stroke="#4a2a4a" stroke-width="2.2" fill="#e2c6e0"/>
  <text x="440.0" y="348.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Has lower electronegativity than</tspan></text>
  <text x="440.0" y="390.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Br so is electron deficient</tspan></text>
  <path d="M420.0 360.0 L160.0 360.0 L160.0 248.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M166.6 252.4 L160.0 240.0 L153.4 252.4" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
