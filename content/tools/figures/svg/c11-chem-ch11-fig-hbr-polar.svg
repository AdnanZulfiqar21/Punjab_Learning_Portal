<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Original redraw after Figure 11.15: in H-Br the more electronegative bromine pulls the bonding electrons, leaving the hydrogen partially positive. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Hydrogen bromide is polar</text>
  <text x="330.0" y="174.4" font-size="40" fill="#0f7a62" text-anchor="middle" font-weight="700">H</text>
  <text x="560.0" y="174.4" font-size="40" fill="#d7322f" text-anchor="middle" font-weight="700">Br</text>
  <line x1="360.0" y1="160.0" x2="530.0" y2="160.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="330.0" y="106.0" font-size="20" fill="#0f7a62" text-anchor="middle" font-weight="700">d+</text>
  <text x="560.0" y="106.0" font-size="20" fill="#d7322f" text-anchor="middle" font-weight="700">d-</text>
  <line x1="360.0" y1="80.0" x2="519.6" y2="80.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M530.0 80.0 L518.2 85.5 L518.2 74.5 Z" fill="#14181f"/>
  <line x1="374.0" y1="70.0" x2="374.0" y2="90.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="330.0" y="240.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">electron deficient H:</text>
  <text x="330.0" y="262.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">the electrophile</text>
  <text x="560.0" y="240.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">Br is more electronegative:</text>
  <text x="560.0" y="262.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">it pulls the bond electrons</text>
  <text x="450.0" y="321" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
