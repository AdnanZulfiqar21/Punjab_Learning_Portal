<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.1 to 15.5 and topics 15.1 to 15.4.1: filtration with filter paper and crucibles, and the steps of crystallization. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Filtration and crystallization: separating and purifying solids</text>
  <!-- filtration -->
  <rect x="50" y="55" width="560" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="330" y="83">Filtration (15.1, Figures 15.1 to 15.4)</text>
  <!-- funnel apparatus -->
  <path d="M110 120 L210 120 L160 190 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M118 124 L202 124 L160 184 Z" fill="#f5e6c8" stroke="#9ca3af" stroke-width="1"/>
  <path d="M160 190 V240" stroke="#4b5563" stroke-width="3"/>
  <path d="M130 300 L140 240 H180 L190 300 Q190 312 178 312 H142 Q130 312 130 300 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="134" y="285" width="52" height="24" fill="#bcdcf0"/>
  <text class="r" x="160" y="108">mixture poured in</text>
  <text class="r" x="250" y="150" style="text-anchor:start">filter paper cone in a 60-degree funnel</text>
  <text class="r" x="250" y="166" style="text-anchor:start">residue (sand) stays on the paper</text>
  <text class="r" x="160" y="332">conical flask: the filtrate</text>
  <text class="r" x="160" y="346">(salt solution) collects here</text>
  <!-- fluted paper and crucibles text -->
  <g class="t" style="font-size:12px">
    <text x="350" y="200" style="font-weight:700;fill:#14181f">filter media</text>
    <text x="350" y="218">plain cone: fold in half twice,</text>
    <text x="350" y="234">open to a cone (slow)</text>
    <text x="350" y="252">fluted paper: fan folds, much</text>
    <text x="350" y="268">faster through a conical funnel</text>
    <text x="350" y="286">Gooch crucible: porcelain,</text>
    <text x="350" y="302">perforated base with paper pulp</text>
    <text x="350" y="318">or asbestos; suction; ignition</text>
    <text x="350" y="334">sintered glass crucible: porous</text>
    <text x="350" y="350">glass disc, no preparation</text>
  </g>
  <!-- fluted sketch -->
  <path d="M250 230 L255 200 L260 230 L265 200 L270 230 L275 200 L280 230 L285 200 L290 230 L295 200 L300 230 L305 200 L310 230" fill="none" stroke="#b5600f" stroke-width="2"/>
  <text class="r" x="280" y="246">fluted</text>
  <!-- crucible sketch -->
  <path d="M250 290 L260 340 H300 L310 290 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M262 334 H298" stroke="#4b5563" stroke-width="2" stroke-dasharray="3 3"/>
  <text class="r" x="280" y="358">crucible</text>
  <!-- crystallization -->
  <rect x="630" y="55" width="520" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="890" y="83">Crystallization (15.2, Figure 15.5)</text>
  <g class="t" style="font-size:12px">
    <text x="650" y="110" style="font-weight:700;fill:#14181f">principle: the solute dissolves well in a hot solvent and the excess</text>
    <text x="650" y="126" style="font-weight:700;fill:#14181f">is thrown out as crystals on cooling</text>
    <text x="650" y="152" style="font-weight:700;fill:#14181f">an ideal solvent</text>
    <text x="650" y="170">dissolves much solute hot and little cold; does not react with it;</text>
    <text x="650" y="186">leaves impurities behind (undissolved or in solution); gives well-formed</text>
    <text x="650" y="202">crystals; cheap, safe, easily removed</text>
    <text x="650" y="222">common solvents: water, absolute ethanol, chloroform, carbon</text>
    <text x="650" y="238">tetrachloride, acetic acid; mixed miscible solvents if none fits</text>
    <text x="650" y="258">inflammable solvent: heat on a water bath; crystals appearing in the</text>
    <text x="650" y="274">funnel choke it, so use a hot-water funnel; coloured impurities are</text>
    <text x="650" y="290">adsorbed by boiling with animal charcoal and filtering hot</text>
    <text x="650" y="316">drying: air, oven (if stable at 100 C), or a vacuum desiccator over</text>
    <text x="650" y="332">CaCl2, silica gel or phosphorus pentoxide</text>
    <text x="650" y="360">mother liquor: the solution left after the crystals separate</text>
  </g>
  <!-- steps -->
  <rect x="50" y="405" width="1100" height="230" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="433">Steps of crystallization (printed 15.4.1)</text>
  <g fill="#ffffff" stroke="#0f7a62" stroke-width="2">
    <rect x="70" y="455" width="190" height="70" rx="10"/><rect x="290" y="455" width="190" height="70" rx="10"/><rect x="510" y="455" width="190" height="70" rx="10"/><rect x="730" y="455" width="190" height="70" rx="10"/><rect x="950" y="455" width="180" height="70" rx="10"/>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none"><path d="M260 490 H285" marker-end="url(#a)"/><path d="M480 490 H505" marker-end="url(#a)"/><path d="M700 490 H725" marker-end="url(#a)"/><path d="M920 490 H945" marker-end="url(#a)"/></g>
  <g class="r" style="font-weight:700;fill:#14181f">
    <text x="165" y="478">1 saturate</text><text x="385" y="478">2 filter hot</text><text x="605" y="478">3 cool slowly</text><text x="825" y="478">4 filter crystals</text><text x="1040" y="478">5 dry</text>
  </g>
  <g class="r">
    <text x="165" y="496">make a saturated solution</text><text x="165" y="510">in the solvent, hot</text>
    <text x="385" y="496">remove insoluble impurities;</text><text x="385" y="510">hot-water funnel if needed</text>
    <text x="605" y="496">moderate rate gives</text><text x="605" y="510">medium-sized crystals</text>
    <text x="825" y="496">crystals from mother liquor</text><text x="825" y="510">by Gooch crucible and vacuum</text>
    <text x="1040" y="496">air, oven at 100 C, or</text><text x="1040" y="510">vacuum desiccator</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="550">Figure 15.5 as printed: solution of one solid with insoluble impurity; filter off the excess solid; transfer the hot liquid to an evaporating dish;</text>
    <text x="70" y="566">evaporate to reduce the volume until the solution is saturated; crystals form on leaving to cool</text>
    <text x="70" y="588">filtration (15.1): dissolve the salt (solute) in water (solvent) to a solution; the insoluble sand is left as residue, the liquid that passes is the filtrate</text>
    <text x="70" y="612">five physical methods of separation (15.1): filtration, crystallization, simple distillation, fractional distillation, paper chromatography</text>
  </g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
