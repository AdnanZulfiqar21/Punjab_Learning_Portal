<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram for topic 31.7: energy density in MJ per litre (diesel about 35.8, gasoline about 34.2) and specific energy in MJ per kilogram (hydrogen about 120), with the book's note that CNG has a lower energy density than petrol. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Energy density and specific energy</text>
  <rect x="15.0" y="55.0" width="430.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">energy density: energy per litre</text>
  <line x1="80.0" y1="370.0" x2="410.0" y2="370.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="80.0" y1="370.0" x2="80.0" y2="110.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="74.0" y1="370.0" x2="80.0" y2="370.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68.0" y="374.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">0</text>
  <line x1="74.0" y1="310.0" x2="80.0" y2="310.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68.0" y="314.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">10</text>
  <line x1="74.0" y1="250.0" x2="80.0" y2="250.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68.0" y="254.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">20</text>
  <line x1="74.0" y1="190.0" x2="80.0" y2="190.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68.0" y="194.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">30</text>
  <line x1="74.0" y1="130.0" x2="80.0" y2="130.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68.0" y="134.0" font-size="11" fill="#14181f" text-anchor="end" font-weight="700">40</text>
  <text x="40.0" y="240.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700" transform="rotate(-90 40.0 240.0)">MJ per litre</text>
  <rect x="140.0" y="155.2" width="90.0" height="214.8" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="185.0" y="147.2" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">about 35.8</text>
  <text x="185.0" y="390.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">diesel</text>
  <rect x="290.0" y="164.8" width="90.0" height="205.2" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="335.0" y="156.8" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">about 34.2</text>
  <text x="335.0" y="390.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">gasoline</text>
  <text x="230.0" y="420.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">more energy in the same volume</text>
  <rect x="455.0" y="55.0" width="430.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">specific energy: energy per kilogram</text>
  <text x="475.0" y="115.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">hydrogen gas: about 120 MJ/kg</text>
  <text x="475.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">very high specific energy: useful where</text>
  <text x="475.0" y="160.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">weight matters (aircraft, spacecraft),</text>
  <text x="475.0" y="180.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">but its energy density is low (a gas)</text>
  <text x="475.0" y="230.0" font-size="15" fill="#0f7a62" text-anchor="start" font-weight="700">CNG compared with petrol</text>
  <text x="475.0" y="255.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">lower energy density: a vehicle needs a</text>
  <text x="475.0" y="275.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">larger tank volume for the same energy,</text>
  <text x="475.0" y="295.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">so CNG suits local commuting</text>
  <rect x="510.0" y="360.0" width="70.0" height="45.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="545.0" y="425.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">petrol tank</text>
  <rect x="650.0" y="335.0" width="190.0" height="70.0" rx="30" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="745.0" y="425.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">CNG cylinder (sketch, not to scale)</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
