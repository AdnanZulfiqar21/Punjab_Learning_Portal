<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- Energy density of diesel and gasoline, and a petrol tank beside a CNG cylinder (our own drawing for topic 31.7). -->
  <line x1="110.0" y1="380.0" x2="520.0" y2="380.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="110.0" y1="380.0" x2="110.0" y2="60.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="102.0" y1="380.0" x2="110.0" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="96.0" y="389.0" font-size="24" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">0</tspan></text>
  <line x1="102.0" y1="305.0" x2="110.0" y2="305.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="96.0" y="314.0" font-size="24" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">10</tspan></text>
  <line x1="102.0" y1="230.0" x2="110.0" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="96.0" y="239.0" font-size="24" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">20</tspan></text>
  <line x1="102.0" y1="155.0" x2="110.0" y2="155.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="96.0" y="164.0" font-size="24" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">30</tspan></text>
  <line x1="102.0" y1="80.0" x2="110.0" y2="80.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="96.0" y="89.0" font-size="24" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">40</tspan></text>
  <text x="40.0" y="220.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="600" transform="rotate(-90 40.0 220.0)"><tspan dy="0.0">MJ per litre</tspan></text>
  <rect x="190.0" y="111.5" width="110.0" height="268.5" rx="0" stroke="#d98b2b" stroke-width="3" fill="#fcd7a1"/>
  <text x="245.0" y="99.5" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">35.8</tspan></text>
  <text x="245.0" y="418.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">diesel</tspan></text>
  <rect x="370.0" y="123.5" width="110.0" height="256.5" rx="0" stroke="#d98b2b" stroke-width="3" fill="#fcd7a1"/>
  <text x="425.0" y="111.5" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">34.2</tspan></text>
  <text x="425.0" y="418.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">gasoline</tspan></text>
  <rect x="600.0" y="250.0" width="110.0" height="80.0" rx="10" stroke="#d98b2b" stroke-width="3" fill="#fcd7a1"/>
  <text x="655.0" y="370.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">petrol tank</tspan></text>
  <rect x="740.0" y="190.0" width="240.0" height="140.0" rx="60" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="860.0" y="370.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CNG cylinder</tspan></text>
  <text x="790.0" y="430.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="600"><tspan dy="0.0">same energy, more volume</tspan></text>
</svg>
