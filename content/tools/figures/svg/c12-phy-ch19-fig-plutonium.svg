<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Original diagram after the book's Do You Know box: uranium-238 captures a neutron to become uranium-239 (emitting gamma), which beta-decays in 23.5 minutes to neptunium-239 and then in 2.4 days to plutonium-239. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making plutonium-239 from uranium-238 (after the Do You Know box)</text>
  <circle cx="80.0" cy="160.0" r="9.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="80.0" y="190.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">neutron</text>
  <text x="130.0" y="166.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="200.0" cy="160.0" r="32.0" stroke="#d7322f" stroke-width="2" fill="#fbcfe8"/>
  <text x="200.0" y="166.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">U-238</text>
  <circle cx="370.0" cy="160.0" r="32.0" stroke="#d7322f" stroke-width="2" fill="#fbcfe8"/>
  <text x="370.0" y="166.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">U-239</text>
  <circle cx="560.0" cy="160.0" r="32.0" stroke="#d7322f" stroke-width="2" fill="#fbcfe8"/>
  <text x="560.0" y="166.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Np-239</text>
  <circle cx="750.0" cy="160.0" r="32.0" stroke="#d7322f" stroke-width="2" fill="#fbcfe8"/>
  <text x="750.0" y="166.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Pu-239</text>
  <line x1="235.0" y1="160.0" x2="324.2" y2="160.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M333.0 160.0 L323.0 164.6 L323.0 155.4 Z" fill="#d98b2b"/>
  <text x="284.0" y="190.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">emits gamma</text>
  <line x1="405.0" y1="160.0" x2="514.2" y2="160.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M523.0 160.0 L513.0 164.6 L513.0 155.4 Z" fill="#d98b2b"/>
  <text x="464.0" y="145.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">23.5 min</text>
  <text x="464.0" y="190.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">emits beta (e-) + gamma</text>
  <line x1="595.0" y1="160.0" x2="704.2" y2="160.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M713.0 160.0 L703.0 164.6 L703.0 155.4 Z" fill="#d98b2b"/>
  <text x="654.0" y="145.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">2.4 days</text>
  <text x="654.0" y="190.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">emits beta (e-) + gamma</text>
  <text x="450.0" y="255.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">A non-fissile uranium-238 nucleus captures a neutron; two beta decays then turn it into plutonium-239,</text>
  <text x="450.0" y="275.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">which is fissile and can itself be used as reactor fuel.</text>
  <text x="450.0" y="321" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
