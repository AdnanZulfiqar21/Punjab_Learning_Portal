<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.1 to 4.10 and topics 4.1 to 4.4: work by a constant and a variable force, conservative forces and power. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Work by a constant and a variable force, conservative forces, and power</text>
  <!-- constant force -->
  <rect x="50" y="55" width="360" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Constant force (Figs. 4.2 to 4.4)</text>
  <rect x="80" y="170" width="70" height="40" fill="#f8c8b8" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M150 190 L230 140" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M150 190 H230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M176 190 A 26 26 0 0 0 171 177" fill="none" stroke="#4b5563" stroke-width="1"/>
  <path d="M80 230 H300" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <text class="l" x="228" y="134" style="fill:#d7322f">F</text>
  <text class="l" x="180" y="186">theta</text>
  <text class="l" x="180" y="248" style="fill:#1f6fb5">d (A to B)</text>
  <text class="r" x="236" y="200">F cos theta</text>
  <!-- graph -->
  <path d="M300 180 H395" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M300 180 V110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="135" width="70" height="45" fill="#f8c8b8" opacity="0.6"/>
  <path d="M300 135 H370 V180" stroke="#d7322f" stroke-width="2" fill="none"/>
  <text class="r" x="288" y="139">F</text>
  <text class="r" x="330" y="196">d</text>
  <text class="r" x="306" y="160">area = F d</text>
  <g class="f">
    <text x="70" y="286">W = F d (4.1)</text>
    <text x="70" y="306">W = (F cos theta) d = F d cos theta (4.2)</text>
    <text x="70" y="326">W = F . d (4.3);  1 J = 1 N m</text>
  </g>
  <text class="r" x="70" y="344">scalar; theta below 90: positive, 90: zero, above 90: negative; a wall: no work</text>
  <!-- variable force -->
  <rect x="430" y="55" width="360" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="610" y="83">Variable force (Figs. 4.5 to 4.8)</text>
  <path d="M460 300 H770" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M460 300 V110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 150 Q 560 120 620 200 T 740 230 V300 H480 Z" fill="#c7d9b0" opacity="0.7"/>
  <path d="M480 150 Q 560 120 620 200 T 740 230" fill="none" stroke="#0f7a62" stroke-width="2.5"/>
  <g stroke="#4b5563" stroke-width="1" fill="none"><path d="M510 300 V140 M540 300 V128 M570 300 V140 M600 300 V170"/></g>
  <text class="r" x="470" y="104">F cos theta</text>
  <text class="r" x="476" y="316">P</text><text class="r" x="736" y="316">Q</text><text class="r" x="620" y="330">displacement d</text>
  <text class="r" x="515" y="294" style="fill:#14181f">delta d_i</text>
  <g class="f">
    <text x="450" y="160" style="fill:#14181f"></text>
  </g>
  <text class="f" x="450" y="341" style="font-size:11px">W = sum F_i cos theta_i delta d_i (4.4);</text>
  <text class="f" x="450" y="355" style="font-size:11px">limit delta d -> 0 (4.5): area under the curve</text>
  <!-- conservative -->
  <rect x="810" y="55" width="340" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Conservative force (Figs. 4.9, 4.10)</text>
  <rect x="850" y="110" width="200" height="160" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="850" cy="270" r="5" fill="#4b5563"/><circle cx="1050" cy="110" r="5" fill="#4b5563"/>
  <path d="M850 270 H1050 V110" stroke="#1f6fb5" stroke-width="2.5" fill="none" marker-end="url(#bl)"/>
  <path d="M850 270 V110 H1050" stroke="#d7322f" stroke-width="2.5" fill="none" marker-end="url(#p)"/>
  <path d="M850 270 C 900 150 950 300 1050 110" stroke="#0f7a62" stroke-width="2.5" fill="none"/>
  <text class="l" x="834" y="286">A</text><text class="l" x="1056" y="106">B</text><text class="l" x="1056" y="286">D</text><text class="l" x="834" y="106">C</text>
  <text class="r" x="940" y="286" style="fill:#1f6fb5">path 1 (ADB)</text><text class="r" x="920" y="104" style="fill:#d7322f">path 2 (ACB)</text><text class="r" x="900" y="200" style="fill:#0f7a62">path 3</text>
  <path d="M1080 110 V270" stroke="#4b5563" stroke-width="1" marker-end="url(#a)"/><path d="M1080 270 V110" stroke="#4b5563" stroke-width="1" marker-end="url(#a)"/>
  <text class="l" x="1086" y="196">h</text>
  <g class="t">
    <text x="830" y="300">W_ADB = 0 + (-mgh); W_ACB = -mgh + 0;</text>
    <text x="830" y="316">curved path = steps, W_AB = -mg (sum delta y) = -mgh:</text>
    <text x="830" y="332">independent of the path; zero round a closed path</text>
    <text x="830" y="348">(ACBA). Gravity, electrostatic, spring force</text>
  </g>
  <!-- bottom -->
  <rect x="50" y="375" width="1100" height="300" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Non-conservative forces, Example 4.1, and power (4.4)</text>
  <g class="t">
    <text x="70" y="430"><tspan class="b">non-conservative:</tspan> the work depends on the path and is not zero round a closed path: kinetic friction (negative work equal to f times the path</text>
    <text x="70" y="446">length, so more work on a longer path), air resistance, tension in a string, normal force, propulsion force of a rocket</text>
    <text x="70" y="474"><tspan class="b">Example 4.1 (Fig. 4.8):</tspan> F = 5 N from d = 0 to 4 m, then falling linearly to 0 at 6 m: W = rectangle 4 m x 5 N + triangle (1/2) x 2 m x 5 N = 20 J + 5 J = 25 J</text>
  </g>
  <g class="f">
    <text x="70" y="506">P_av = delta W / delta t (4.6)</text><text x="400" y="506">P = lim delta W / delta t, delta t -> 0 (4.7)</text><text x="800" y="506">P = F . delta d / delta t = F . v (4.8)</text>
  </g>
  <g class="t">
    <text x="70" y="532"><tspan class="b">power</tspan> is the rate at which work is done; SI unit the watt, one joule per second; electrical work in watt seconds; commercial unit the kilowatt-hour,</text>
    <text x="70" y="548">the work done in one hour by an agency of power one kilowatt: 1 kW h = 1000 W x 3600 s = 3.6 x 10^6 J = 3.6 MJ</text>
    <text x="70" y="576"><tspan class="b">Example 4.2:</tspan> a 70 kg man runs up stairs of vertical height 4.5 m in 4.0 s: P = mgh / t = 70 x 9.8 x 4.5 / 4 = 7.7 x 10^2 W</text>
    <text x="70" y="604"><tspan class="b">approximate powers (W):</tspan> jumbo jet aircraft 1.3 x 10^8; car at 90 km h^-1 1.1 x 10^5; electric heater 2 x 10^3; coloured TV 120; flash light (two cells) 1.5;</text>
    <text x="70" y="620">pocket calculator 7.5 x 10^-4.  <tspan class="b">Do You Know:</tspan> about 9 x 10^9 J of energy go into making a car, and it then uses about 1 x 10^12 J of energy from petrol in its lifetime</text>
    <text x="70" y="650">work in a rocket's climb (gravity falls as the inverse square of the distance from the Earth's centre) and in stretching a spring (force grows with stretch) is work by a variable force</text>
  </g>
  <text class="s" x="600" y="692" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
