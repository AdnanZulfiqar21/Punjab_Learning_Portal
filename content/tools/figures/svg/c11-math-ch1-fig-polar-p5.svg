  <text x="106" y="716" font-size="43.7" text-anchor="end" fill="#1a1a1a" font-style="italic">O</text>
  <text x="860" y="722" font-size="43.7" text-anchor="end" fill="#1a1a1a">Polar axis</text>
</svg>
