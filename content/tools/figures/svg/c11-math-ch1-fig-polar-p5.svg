<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Times New Roman', Times, serif">
  <!-- Polar point P(5, pi/4) (C11-MATH, PDF p19): cyan arrow r = 5 at angle pi/4 from the polar axis. Original drawing after the printed figure. -->
  <rect width="900" height="820" fill="#ffffff"/>
  <rect width="900" height="820" fill="#FFFAC2"/>
  <line x1="120" y1="800" x2="120" y2="54" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M120 40 L129 60 L120 55 L111 60 Z" fill="#e0197d"/>
  <line x1="40" y1="680" x2="856" y2="680" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M870 680 L850 689 L855 680 L850 671 Z" fill="#e0197d"/>
  <line x1="120" y1="680" x2="547.5" y2="252.5" stroke="#1d9fe0" stroke-width="4.5" stroke-linecap="butt"/>
  <path d="M558.4 241.6 L549.9 264.2 L546.7 253.3 L535.8 250.1 Z" fill="#1d9fe0"/>
  <text x="488.4" y="191.6" font-size="48.3" text-anchor="start" fill="#1a1a1a" font-style="italic">P</text>
  <text x="518.4" y="202.2" font-size="84.5" fill="#1a1a1a" font-weight="300">(</text>
  <text x="544.9" y="191.6" font-size="48.3" text-anchor="start" fill="#1a1a1a">5,</text>
  <g><text x="612.5" y="171.1" font-size="38" text-anchor="middle" fill="#1a1a1a">π</text><line x1="599.1" y1="177.1" x2="626" y2="177.1" stroke="#1a1a1a" stroke-width="2"/><text x="612.5" y="211.3" font-size="38" text-anchor="middle" fill="#1a1a1a">4</text></g>
  <text x="636.7" y="202.2" font-size="84.5" fill="#1a1a1a" font-weight="300">)</text>
  <text x="319.2" y="440.8" font-size="43.7" text-anchor="middle" fill="#1a1a1a" transform="rotate(-45 319.2 440.8)"><tspan font-style="italic">r</tspan> = 5</text>
  <path d="M240 680 A120 120 0 0 0 212.9 604" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
