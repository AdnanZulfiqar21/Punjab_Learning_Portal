<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1300" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 8.8 and 8.10: the cells of xylem and of phloem. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="350" y="40">Xylem: water and minerals upward</text>
  <!-- tracheid: tapered ends, bordered pits -->
  <path d="M90 110 l30 -30 h30 l30 30 v360 l-30 30 h-30 l-30 -30 z" fill="#fff4e2" stroke="#8a4b00" stroke-width="5"/>
  <g fill="none" stroke="#8a4b00" stroke-width="2"><circle cx="135" cy="200" r="10"/><circle cx="135" cy="260" r="10"/><circle cx="135" cy="320" r="10"/><circle cx="135" cy="380" r="10"/></g>
  <text class="k" x="130" y="530">Tracheid</text><text class="s" x="130" y="554">long, thin,</text><text class="s" x="130" y="576">lignified; tapered;</text><text class="s" x="130" y="598">bordered pits</text>
  <!-- vessel: wide, stacked with perforation plates -->
  <g fill="#fff4e2" stroke="#8a4b00" stroke-width="5"><rect x="240" y="90" width="90" height="140"/><rect x="240" y="230" width="90" height="140"/><rect x="240" y="370" width="90" height="140"/></g>
  <g stroke="#8a4b00" stroke-width="3"><path d="M250 230 h70 M250 370 h70"/></g>
  <g fill="#fff"><circle cx="265" cy="230" r="5"/><circle cx="285" cy="230" r="5"/><circle cx="305" cy="230" r="5"/><circle cx="265" cy="370" r="5"/><circle cx="285" cy="370" r="5"/><circle cx="305" cy="370" r="5"/></g>
  <text class="k" x="285" y="530">Vessel</text><text class="s" x="285" y="554">shorter, broader;</text><text class="s" x="285" y="576">joined end to end;</text><text class="s" x="285" y="598">perforation plates</text>
  <!-- xylem fibre -->
  <path d="M400 110 l15 -25 h20 l15 25 v360 l-15 25 h-20 l-15 -25 z" fill="#8a4b00" stroke="#5a2e00" stroke-width="4"/>
  <rect x="421" y="130" width="8" height="320" fill="#fff4e2"/>
  <text class="k" x="425" y="530">Fibre</text><text class="s" x="425" y="554">thick lignified</text><text class="s" x="425" y="576">wall; dead;</text><text class="s" x="425" y="598">support</text>
  <!-- xylem parenchyma -->
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"><rect x="540" y="150" width="60" height="80" rx="8"/><rect x="540" y="240" width="60" height="80" rx="8"/><rect x="540" y="330" width="60" height="80" rx="8"/></g>
  <g fill="#0f7a62"><circle cx="570" cy="190" r="7"/><circle cx="570" cy="280" r="7"/><circle cx="570" cy="370" r="7"/></g>
  <text class="k" x="570" y="530">Parenchyma</text><text class="s" x="570" y="554">living, thin-walled;</text><text class="s" x="570" y="576">stores water; lateral</text><text class="s" x="570" y="598">movement, repair</text>
  <!-- phloem -->
  <text class="h" x="980" y="40">Phloem: sugars to where needed</text>
  <!-- sieve tube elements stacked with sieve plates -->
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="5"><rect x="800" y="90" width="90" height="140"/><rect x="800" y="230" width="90" height="140"/><rect x="800" y="370" width="90" height="140"/></g>
  <g fill="#5b3fb5"><circle cx="820" cy="230" r="5"/><circle cx="840" cy="230" r="5"/><circle cx="860" cy="230" r="5"/><circle cx="830" cy="222" r="4"/><circle cx="850" cy="238" r="4"/><circle cx="820" cy="370" r="5"/><circle cx="840" cy="370" r="5"/><circle cx="860" cy="370" r="5"/><circle cx="830" cy="362" r="4"/><circle cx="850" cy="378" r="4"/></g>
  <text class="k" x="845" y="530">Sieve tube element</text><text class="s" x="845" y="554">joined end to end; sieve</text><text class="s" x="845" y="576">areas and plates with pores</text>
  <!-- companion cells -->
  <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"><rect x="910" y="110" width="40" height="100" rx="6"/><rect x="910" y="250" width="40" height="100" rx="6"/><rect x="910" y="390" width="40" height="100" rx="6"/></g>
  <g fill="#0f7a62"><circle cx="930" cy="160" r="7"/><circle cx="930" cy="300" r="7"/><circle cx="930" cy="440" r="7"/></g>
  <g stroke="#4b5563" stroke-width="2"><path d="M890 150 h20 M890 170 h20 M890 290 h20 M890 310 h20 M890 430 h20 M890 450 h20"/></g>
  <text class="k" x="930" y="640">Companion cell</text><text class="s" x="930" y="664">linked by plasmodesmata;</text><text class="s" x="930" y="686">supplies ATP and proteins</text>
  <!-- phloem fibre and parenchyma -->
  <path d="M1050 110 l12 -20 h16 l12 20 v360 l-12 20 h-16 l-12 -20 z" fill="#8a4b00" stroke="#5a2e00" stroke-width="4"/>
  <text class="k" x="1070" y="530">Fibre</text><text class="s" x="1070" y="554">support</text>
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"><rect x="1160" y="150" width="60" height="80" rx="8"/><rect x="1160" y="240" width="60" height="80" rx="8"/><rect x="1160" y="330" width="60" height="80" rx="8"/></g>
  <text class="k" x="1190" y="530">Parenchyma</text><text class="s" x="1190" y="554">stores sugars,</text><text class="s" x="1190" y="576">resins, latex,</text><text class="s" x="1190" y="598">mucilage</text>
  <text class="s" x="650" y="735">Xylem is also a structural tissue; phloem lies outside the xylem and forms the inner bark.</text>
</svg>
