<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after topics 14.2 to 14.4.11 and Table 14.1: the classes of air pollutant, their sources, the CFC ozone cycle and POPs. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Air pollutants: the eleven classes, their sources and the CFC attack on ozone</text>
  <!-- pollutant table -->
  <rect x="50" y="55" width="700" height="420" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="400" y="83">Important air pollutants (14.2, 14.4)</text>
  <g font-size="11" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="65" y="108">Pollutant</text><text x="240" y="108">Main sources</text><text x="500" y="108">Note</text></g>
    <text x="65" y="130">1 oxides of carbon CO, CO2</text><text x="240" y="130">incomplete / complete fossil fuel combustion</text><text x="500" y="130">CO binds haemoglobin; CO2 greenhouse gas</text>
    <text x="65" y="152">2 oxides of nitrogen NOx</text><text x="240" y="152">burning fuels: N2 + O2 to 2NO, then NO2</text><text x="500" y="152">N2O from soil microbes, fertilisers</text>
    <text x="65" y="174">3 oxides of sulfur SOx</text><text x="240" y="174">burning coal and oil</text><text x="500" y="174">SO2 the main source of acid deposition</text>
    <text x="65" y="196">4 hydrocarbons (CH4)</text><text x="240" y="196">vegetation, wildfire, seeps; vehicles, spills</text><text x="500" y="196">methane the commonest</text>
    <text x="65" y="218">5 low-altitude ozone O3</text><text x="240" y="218">secondary, from NOx and VOCs in sunlight</text><text x="500" y="218">toxic above 100 ppm; attacks rubber, dyes</text>
    <text x="65" y="240">6 CFCs</text><text x="240" y="240">aerosol propellants, refrigerants</text><text x="500" y="240">deplete stratospheric ozone</text>
    <text x="65" y="262">7 PAHs</text><text x="240" y="262">incomplete combustion, vehicles, grilled food</text><text x="500" y="262">naphthalene, anthracene; carcinogenic</text>
    <text x="65" y="284">8 POPs</text><text x="240" y="284">PCBs (electrical equipment, paints), DDT</text><text x="500" y="284">resist degradation; travel far; accumulate</text>
    <text x="65" y="306">9 VOCs</text><text x="240" y="306">liquid fuels, exhausts, wood, garbage</text><text x="500" y="306">benzene, toluene, formaldehyde; irritation</text>
    <text x="65" y="328">10 particulate matter PM</text><text x="240" y="328">dust storms, fires, sea salt; combustion, smoke</text><text x="500" y="328">solid particles and liquid droplets</text>
    <text x="65" y="350">11 heavy metals Pb, Hg, Cd</text><text x="240" y="350">metallurgy, battery waste, incineration</text><text x="500" y="350">industry and transport</text>
  </g>
  <path d="M60 116 H740" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="65" y="384" style="font-weight:700;fill:#14181f">natural sources (14.3.1)</text>
    <text x="65" y="402">dust and pollen, volcanoes (gases and PM), lightning (NOx), ocean algae (H2S), wind erosion, swamps (CH4)</text>
    <text x="65" y="428" style="font-weight:700;fill:#14181f">human-made sources (14.3.2)</text>
    <text x="65" y="446">mobile (cars, trucks, aircraft, ships) and point sources (factories, power plants); fossil fuels give CO2, CO,</text>
    <text x="65" y="462">hydrocarbons; wood as domestic fuel and coal in brick kilns</text>
  </g>
  <!-- CFC cycle -->
  <rect x="770" y="55" width="380" height="260" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="960" y="83">CFCs destroy ozone (14.4.6)</text>
  <g class="f">
    <text x="790" y="112">CFCl3 --(UV)--> CFCl2 + Cl.</text>
    <text x="790" y="138">Cl. + O3 --> ClO. + O2</text>
    <text x="790" y="164">ClO. + O --> Cl. + O2</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="790" y="192">the chlorine radical is regenerated, so steps 2</text>
    <text x="790" y="208">and 3 repeat many times: one CFC molecule can</text>
    <text x="790" y="224">destroy up to 100,000 ozone molecules</text>
    <text x="790" y="248">CFCs: gases or low-boiling liquids used as</text>
    <text x="790" y="264">aerosol propellants and refrigerants; 100,000</text>
    <text x="790" y="280">times more effective than CO2 at trapping heat</text>
    <text x="790" y="300">(the printed third step is written with O2; read as O)</text>
  </g>
  <!-- primary secondary -->
  <rect x="770" y="335" width="380" height="140" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="960" y="363">Primary and secondary pollutants (14.2)</text>
  <g class="t" style="font-size:12px">
    <text x="790" y="390"><tspan font-weight="700" fill="#14181f">primary:</tspan> emitted directly, e.g. volcanic ash,</text>
    <text x="790" y="406">CO from a vehicle exhaust, SO2, NO, PM</text>
    <text x="790" y="430"><tspan font-weight="700" fill="#14181f">secondary:</tspan> formed by reactions of primary</text>
    <text x="790" y="446">pollutants, e.g. ozone, PAN, H2SO4 and HNO3 in</text>
    <text x="790" y="462">acid rain, NO2 from NO</text>
  </g>
  <!-- carbon oxides -->
  <rect x="50" y="495" width="1100" height="170" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="523">Key equations (14.4.1 to 14.4.3)</text>
  <g class="f">
    <text x="70" y="552">2C + O2 --> 2CO  (incomplete combustion)</text><text x="620" y="552">C + O2 --> CO2  (complete combustion)</text>
    <text x="70" y="576">N2 + O2 --(high temperature)--> 2NO</text><text x="620" y="576">2NO + O2 --> 2NO2</text>
    <text x="70" y="600">S + O2 --> SO2;  2SO2 + O2 --> 2SO3;  SO3 + H2O --> H2SO4  (SOx with water vapour gives acid rain)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="630">CO is highly poisonous: it binds haemoglobin more strongly than oxygen and causes suffocation; poisoning is reversed with high-pressure oxygen</text>
    <text x="70" y="648">N2O depletes the ozone layer and adds to climate change; PM2.5 (up to 2.5 micrometres) penetrates deepest into the lungs</text>
  </g>
  <text class="s" x="600" y="688" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
