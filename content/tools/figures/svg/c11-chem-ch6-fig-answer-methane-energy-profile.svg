<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Times New Roman, Georgia, serif">
  <!-- Answer figure: energy profile for the combustion of methane (exothermic). Original drawing. -->
  <rect width="1200" height="760" fill="#ffffff"/>
  <line x1="150.0" y1="680.0" x2="150.0" y2="66.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M150.0 50.0 L159.4 67.7 L140.6 67.7 Z" fill="#14181f"/>
  <line x1="150.0" y1="680.0" x2="1144.0" y2="680.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M1160.0 680.0 L1142.3 689.4 L1142.3 670.6 Z" fill="#14181f"/>
  <text x="70.0" y="365.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400" transform="rotate(-90 70.0 365.0)"><tspan>Enthalpy</tspan></text>
  <text x="655.0" y="735.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Progress of reaction</tspan></text>
  <line x1="150.0" y1="300.0" x2="700.0" y2="300.0" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8"/>
  <line x1="150.0" y1="560.0" x2="1100.0" y2="560.0" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8"/>
  <text x="138.0" y="310.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan>H</tspan><tspan dy="7.5" font-size="20.4">R</tspan><tspan dy="-7.5"> </tspan></text>
  <text x="138.0" y="570.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan>H</tspan><tspan dy="7.5" font-size="20.4">P</tspan><tspan dy="-7.5"> </tspan></text>
  <path d="M175 300 L460 300 C550 300 560 120 650 120 C740 120 750 560 840 560 L1100 560" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="178.0" y="284.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>CH</tspan><tspan dy="7.5" font-size="20.4">4(g)</tspan><tspan dy="-7.5"> + 2O</tspan><tspan dy="7.5" font-size="20.4">2(g)</tspan><tspan dy="-7.5"> </tspan></text>
  <text x="1100.0" y="544.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan>CO</tspan><tspan dy="7.5" font-size="20.4">2(g)</tspan><tspan dy="-7.5"> + 2H</tspan><tspan dy="7.5" font-size="20.4">2</tspan><tspan dy="-7.5">O</tspan><tspan dy="7.5" font-size="20.4">(l)</tspan><tspan dy="-7.5"> </tspan></text>
  <line x1="650.0" y1="300.0" x2="650.0" y2="137.4" stroke="#14181f" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="9 7"/>
  <path d="M650.0 123.0 L658.5 138.9 L641.5 138.9 Z" fill="#14181f"/>
  <text x="668.0" y="240.0" font-size="32" fill="#14181f" text-anchor="start" font-weight="700"><tspan>E</tspan><tspan dy="8.0" font-size="21.8">a</tspan><tspan dy="-8.0"> </tspan></text>
  <line x1="210.0" y1="300.0" x2="210.0" y2="545.6" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M210.0 560.0 L201.5 544.1 L218.5 544.1 Z" fill="#14181f"/>
  <text x="228.0" y="420.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>&#916;H = &#8722;890.3</tspan></text>
  <text x="228.0" y="460.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>kJ mol</tspan><tspan dy="-11.4" font-size="20.4">&#8722;1</tspan><tspan dy="11.4"> </tspan></text>
  <text x="228.0" y="500.0" font-size="28" fill="#8a8f98" text-anchor="start" font-weight="400"><tspan>(exothermic)</tspan></text>
