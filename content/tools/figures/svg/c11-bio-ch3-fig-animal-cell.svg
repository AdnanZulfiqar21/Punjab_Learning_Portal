<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.10: ultrastructure of an animal cell. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- plasma membrane and cytoplasm (rounded, irregular) -->
  <path d="M600 130 q260 -20 330 200 q60 200 -80 360 q-200 160 -420 60 q-200 -100 -160 -360 q40 -240 330 -260 z" fill="#1f6fb5"/>
  <path d="M600 146 q245 -18 312 190 q56 190 -76 340 q-190 150 -398 56 q-188 -94 -150 -340 q38 -228 312 -246 z" fill="#eef6fb"/>
  <!-- nucleus at centre -->
  <circle cx="600" cy="450" r="120" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="8"/>
  <circle cx="600" cy="450" r="102" fill="none" stroke="#5b3fb5" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="625" cy="470" r="30" fill="#5b3fb5"/>
  <path d="M530 420 q25 -25 50 0 t50 0 M540 490 q30 25 60 0" stroke="#5b3fb5" stroke-width="4" fill="none"/>
  <!-- rough ER hugging the nucleus -->
  <path d="M400 360 q60 30 110 -10 M390 395 q65 30 115 -10 M385 430 q65 30 115 -10" stroke="#0f7a62" stroke-width="6" fill="none"/>
  <g fill="#d98b2b"><circle cx="415" cy="364" r="4"/><circle cx="450" cy="376" r="4"/><circle cx="490" cy="365" r="4"/><circle cx="410" cy="400" r="4"/><circle cx="450" cy="412" r="4"/><circle cx="492" cy="400" r="4"/><circle cx="408" cy="436" r="4"/><circle cx="450" cy="447" r="4"/></g>
  <!-- smooth ER -->
  <path d="M740 380 q40 30 80 0 q40 -30 80 0 M745 420 q40 30 80 0 q40 -30 80 0" stroke="#0f7a62" stroke-width="6" fill="none"/>
  <!-- Golgi -->
  <path d="M700 620 q50 -10 100 0 M695 640 q55 -10 110 0 M690 660 q60 -10 120 0 M695 680 q55 -10 110 0" stroke="#8a4b00" stroke-width="6" fill="none"/>
  <g fill="#8a4b00"><circle cx="680" cy="600" r="6"/><circle cx="830" cy="700" r="6"/><circle cx="760" cy="590" r="6"/></g>
  <!-- mitochondria -->
  <g fill="#f3e9d2" stroke="#d98b2b" stroke-width="4"><ellipse cx="420" cy="620" rx="50" ry="26"/><ellipse cx="760" cy="250" rx="50" ry="26"/></g>
  <path d="M390 605 v30 M405 598 v44 M420 598 v44 M435 598 v44 M450 605 v30 M730 235 v30 M745 228 v44 M760 228 v44 M775 228 v44 M790 235 v30" stroke="#d98b2b" stroke-width="3"/>
  <!-- lysosomes -->
  <g fill="#f2b134" stroke="#8a4b00" stroke-width="3"><circle cx="520" cy="700" r="20"/><circle cx="560" cy="740" r="14"/></g>
  <!-- peroxisome -->
  <circle cx="860" cy="520" r="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/>
  <!-- centrioles (pair at right angles) -->
  <rect x="470" y="230" width="60" height="18" rx="4" fill="#4b5563"/>
  <rect x="545" y="215" width="18" height="60" rx="4" fill="#4b5563"/>
  <!-- small vacuole -->
  <circle cx="380" cy="520" r="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <!-- free ribosomes -->
  <g fill="#d98b2b"><circle cx="640" cy="300" r="4"/><circle cx="665" cy="320" r="4"/><circle cx="700" cy="760" r="4"/><circle cx="650" cy="780" r="4"/><circle cx="330" cy="470" r="4"/><circle cx="860" cy="600" r="4"/></g>
  <!-- cytoskeleton lines -->
  <path d="M300 300 L360 700 M860 300 L880 650" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- labels -->
  <path class="lead" d="M320 270 L140 230"/><text class="t" x="20" y="220">Plasma membrane</text>
  <path class="lead" d="M400 395 L185 352"/><text class="t" x="20" y="350">Rough ER</text><text class="s" x="20" y="375">ribosomes on it</text>
  <path class="lead" d="M358 520 L140 520"/><text class="t" x="20" y="525">Small vacuole</text>
  <path class="lead" d="M370 620 L140 650"/><text class="t" x="20" y="655">Mitochondrion</text>
  <path class="lead" d="M500 700 L300 790"/><text class="t" x="120" y="820">Lysosomes</text>
  <path class="lead" d="M500 240 L430 128"/><text class="t" x="200" y="90">Centrioles</text><text class="s" x="200" y="115">a pair at right angles</text>
  <path class="lead" d="M600 330 L600 60"/><text class="t" x="520" y="50">Nucleus</text>
  <path class="lead" d="M790 235 L920 120"/><text class="t" x="930" y="120">Mitochondrion</text>
  <path class="lead" d="M900 400 L1040 340"/><text class="t" x="1040" y="330">Smooth ER</text>
  <path class="lead" d="M876 520 L1040 500"/><text class="t" x="1045" y="505">Peroxisome</text>
  <path class="lead" d="M810 660 L975 660"/><text class="t" x="980" y="665">Golgi apparatus</text>
  <path class="lead" d="M700 760 L900 820"/><text class="t" x="905" y="830">Free ribosomes</text>
  <path class="lead" d="M310 400 L140 440"/><text class="t" x="20" y="470">Cytoskeleton</text>
  <text class="s" x="240" y="870">Animal cell: no wall, no chloroplasts, small vacuoles, a pair of centrioles; nucleus at the centre.</text>
</svg>
