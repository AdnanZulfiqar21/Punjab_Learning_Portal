  <text x="265.0" y="225.0" font-size="27" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">orange</tspan></text>
  <text x="265.0" y="257.0" font-size="27" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">solution</tspan></text>
