  <path d="M580.0 160.0 L565.5 166.8 L565.5 153.2 Z" fill="#14181f"/>
  <text x="460.0" y="146.0" font-size="27" fill="#d7322f" text-anchor="middle" font-weight="400"><tspan dy="0.0">room temperature</tspan></text>
  <path d="M700.0 110.0 L743.3 135.0 L743.3 185.0 L700.0 210.0 L656.7 185.0 L656.7 135.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
