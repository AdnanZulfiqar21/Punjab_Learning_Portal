  <line x1="743.3" y1="135.0" x2="769.3" y2="120.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="792.7" y="116.5" font-size="28" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="656.7" y1="135.0" x2="630.7" y2="120.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
