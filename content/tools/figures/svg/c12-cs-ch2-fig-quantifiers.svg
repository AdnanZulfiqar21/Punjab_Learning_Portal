<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: a set where every object satisfies P, and a set where at least one does. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Universal and existential quantifiers (after Fig 2.8)</text>
  <rect x="30.0" y="70.0" width="400.0" height="280.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="115.0" font-size="34" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#8704;</text>
  <text x="90.0" y="108.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">universal: for all</text>
  <circle cx="90.0" cy="160.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="160.0" cy="160.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="230.0" cy="160.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="300.0" cy="160.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="370.0" cy="160.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="90.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="160.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="230.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="300.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="370.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="90.0" cy="280.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="160.0" cy="280.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="230.0" cy="280.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="300.0" cy="280.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="370.0" cy="280.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <text x="230.0" y="375.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">for all x, P(x): every x satisfies P</text>
  <rect x="470.0" y="70.0" width="400.0" height="280.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="500.0" y="115.0" font-size="34" fill="#d98b2b" text-anchor="middle" font-weight="700">&#8707;</text>
  <text x="530.0" y="108.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">existential: there exists</text>
  <circle cx="530.0" cy="160.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="600.0" cy="160.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="670.0" cy="160.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="740.0" cy="160.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="810.0" cy="160.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="530.0" cy="220.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="600.0" cy="220.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="670.0" cy="220.0" r="15.0" stroke="#0f7a62" stroke-width="2" fill="#86d4b4"/>
  <circle cx="740.0" cy="220.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="810.0" cy="220.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="530.0" cy="280.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="600.0" cy="280.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="670.0" cy="280.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="740.0" cy="280.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <circle cx="810.0" cy="280.0" r="15.0" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <text x="670.0" y="375.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">there exists x, P(x): at least one x satisfies P</text>
  <text x="450.0" y="402.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">green = the predicate P(x) is true for that object</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
