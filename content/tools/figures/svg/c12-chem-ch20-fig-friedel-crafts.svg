<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="585" fill="#ffffff"/>
  <!-- Original mechanisms after the book: AlCl3 turns (CH3)3CCl into the tertiary carbocation and RCOCl into the acylium ion RCO+; each attacks benzene to form a sigma complex, and [AlCl4]- removes H+, giving the alkyl- or acylbenzene, HCl and AlCl3. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Friedel-Crafts alkylation and acylation</text>
  <rect x="15.0" y="55.0" width="870.0" height="235.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">alkylation: an alkyl group joins the ring</text>
  <text x="120.0" y="126.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">C-Cl + AlCl</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="235.0" y1="120.0" x2="286.2" y2="120.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M295.0 120.0 L285.0 124.6 L285.0 115.4 Z" fill="#14181f"/>
  <text x="410.0" y="126.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">)</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">C</tspan><tspan dy="-7.1" font-size="11.9">+</tspan><tspan dy="7.1"> + [AlCl</tspan><tspan dy="5.4" font-size="11.9">4</tspan><tspan dy="-5.4">]</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="640.0" y="126.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">tertiary carbocation: the electrophile</text>
  <path d="M100.0 195.0 L126.0 210.0 L126.0 240.0 L100.0 255.0 L74.0 240.0 L74.0 210.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="225.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="175.0" y="179.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">C(CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">)</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <path d="M110.0 205.0 Q130.0 169.0 152.0 181.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M152.0 181.0 L142.0 180.4 L146.1 172.9 Z" fill="#d7322f"/>
  <line x1="205.0" y1="225.0" x2="251.2" y2="225.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M260.0 225.0 L250.0 229.6 L250.0 220.4 Z" fill="#14181f"/>
  <path d="M335.0 203.0 L361.0 218.0 L361.0 248.0 L335.0 263.0 L309.0 248.0 L309.0 218.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M348.3 221.8 A17.4 17.4 0 1 1 321.7 221.8" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="335.0" y="239.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="335.0" y1="203.0" x2="323.4" y2="185.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="316.8" y="179.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="335.0" y1="203.0" x2="346.6" y2="185.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="353.2" y="179.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">C(CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">)</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <line x1="420.0" y1="225.0" x2="501.2" y2="225.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M510.0 225.0 L500.0 229.6 L500.0 220.4 Z" fill="#14181f"/>
  <text x="465.0" y="215.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[AlCl</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">]</tspan><tspan dy="-5.5" font-size="9.1">-</tspan></text>
  <path d="M590.0 203.0 L616.0 218.0 L616.0 248.0 L590.0 263.0 L564.0 248.0 L564.0 218.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="590.0" cy="233.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="590.0" y1="203.0" x2="590.0" y2="186.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="590.0" y="179.5" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C(CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="760.0" y="237.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HCl + AlCl</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <rect x="15.0" y="300.0" width="870.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="330.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">acylation: an acyl group (R-C=O) joins the ring</text>
  <text x="120.0" y="366.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-COCl + AlCl</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="215.0" y1="360.0" x2="266.2" y2="360.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M275.0 360.0 L265.0 364.6 L265.0 355.4 Z" fill="#14181f"/>
  <text x="380.0" y="366.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-C</tspan><tspan dy="-7.1" font-size="11.9">+</tspan><tspan dy="7.1">=O + [AlCl</tspan><tspan dy="5.4" font-size="11.9">4</tspan><tspan dy="-5.4">]</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="560.0" y="366.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">acylium ion: the electrophile</text>
  <path d="M100.0 430.0 L126.0 445.0 L126.0 475.0 L100.0 490.0 L74.0 475.0 L74.0 445.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="460.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="165.0" y="414.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">RCO</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <path d="M110.0 440.0 Q130.0 404.0 150.0 416.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M150.0 416.0 L140.1 415.0 L144.4 407.7 Z" fill="#d7322f"/>
  <line x1="200.0" y1="460.0" x2="246.2" y2="460.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M255.0 460.0 L245.0 464.6 L245.0 455.4 Z" fill="#14181f"/>
  <path d="M330.0 438.0 L356.0 453.0 L356.0 483.0 L330.0 498.0 L304.0 483.0 L304.0 453.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M343.3 456.8 A17.4 17.4 0 1 1 316.7 456.8" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330.0" y="474.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="330.0" y1="438.0" x2="318.4" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="311.8" y="414.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="330.0" y1="438.0" x2="341.6" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="348.2" y="414.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">COR</tspan></text>
  <line x1="410.0" y1="460.0" x2="491.2" y2="460.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M500.0 460.0 L490.0 464.6 L490.0 455.4 Z" fill="#14181f"/>
  <text x="455.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[AlCl</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">]</tspan><tspan dy="-5.5" font-size="9.1">-</tspan></text>
  <path d="M580.0 438.0 L606.0 453.0 L606.0 483.0 L580.0 498.0 L554.0 483.0 L554.0 453.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="580.0" cy="468.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="580.0" y1="438.0" x2="580.0" y2="421.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="580.0" y="414.5" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COR</tspan></text>
  <text x="750.0" y="472.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HCl + AlCl</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <text x="580.0" y="524.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">an aryl ketone</text>
  <text x="450.0" y="556.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">e.g. benzene + CH3CH2Cl gives ethylbenzene; benzene + CH3CH2COCl gives C6H5COCH2CH3</text>
  <text x="450.0" y="576" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
