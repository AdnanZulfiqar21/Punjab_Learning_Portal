<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 213" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="213" fill="#ffffff"/>
  <!-- As printed on p120 (24.2 A i): CH3-CH2-Br (bromoethane) + NH3 (excess), ethanol over and High pressure under the arrow, gives CH3-CH2-NH2 (ethanamine) + HBr. The book's 'Highy Pressure' is spelt correctly. -->
  <text x="60.2" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="142.8" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"></tspan></text>
  <text x="217.8" y="92.0" font-size="32" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="94.9" y1="80.5" x2="108.1" y2="80.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="177.3" y1="80.5" x2="190.8" y2="80.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="135.2" y="171.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">bromoethane</tspan></text>
  <text x="267.7" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <text x="356.3" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="356.3" y="171.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">(excess)</tspan></text>
  <line x1="441.8" y1="80.5" x2="658.6" y2="80.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M671.4 80.5 L656.9 87.3 L656.9 73.7 Z" fill="#14181f"/>
  <text x="556.6" y="64.5" font-size="30" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethanol</tspan></text>
  <text x="556.6" y="118.5" font-size="30" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">High pressure</tspan></text>
  <text x="725.7" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="808.3" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"></tspan></text>
  <text x="890.9" y="92.0" font-size="32" fill="#6a3fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"></tspan></text>
  <line x1="760.4" y1="80.5" x2="773.6" y2="80.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="843.0" y1="80.5" x2="856.2" y2="80.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="808.3" y="171.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">(ethanamine)</tspan></text>
  <text x="948.3" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <text x="1005.3" y="92.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HBr</tspan></text>
</svg>
