<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Fig 16.4 (printed as Fig 16.5): charge Q is brought from infinity along a dashed path to point A, where VA = 0, and charge q is brought from infinity to point B, a distance r away, where VB = V. -->
  <line x1="420.0" y1="30.0" x2="206.0" y2="458.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 9"/>
  <circle cx="321.0" cy="228.0" r="20.0" stroke="#a04d00" stroke-width="2" fill="#ffffff"/>
  <text x="321.0" y="237.1" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <text x="273.0" y="238.0" font-size="32" fill="#14181f" text-anchor="end" font-weight="700" font-style="italic">Q</text>
  <path d="M255.0 360.0 L254.4 338.0 L272.9 347.2 Z" fill="#14181f"/>
  <line x1="930.0" y1="60.0" x2="706.0" y2="508.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 9"/>
  <circle cx="826.5" cy="267.0" r="20.0" stroke="#a04d00" stroke-width="2" fill="#ffffff"/>
  <text x="826.5" y="276.1" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <text x="778.5" y="277.0" font-size="32" fill="#14181f" text-anchor="end" font-weight="700" font-style="italic">q</text>
  <path d="M757.5 405.0 L756.9 383.0 L775.4 392.2 Z" fill="#14181f"/>
  <circle cx="200.0" cy="470.0" r="12.0" stroke="none" fill="#14181f"/>
  <circle cx="700.0" cy="520.0" r="12.0" stroke="none" fill="#14181f"/>
  <line x1="214.0" y1="471.0" x2="682.0" y2="519.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 9"/>
  <path d="M686.0 519.0 L667.5 526.6 L669.4 507.9 Z" fill="#14181f"/>
  <text x="180.0" y="480.0" font-size="32" fill="#14181f" text-anchor="end" font-weight="700">A</text>
  <text x="722.0" y="530.0" font-size="32" fill="#14181f" text-anchor="start" font-weight="700">B</text>
  <text x="180.0" y="550.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700">V<tspan dy="9.0" font-size="21.8">A</tspan><tspan dy="-9.0">&#8203;</tspan> = 0</text>
  <text x="740.0" y="600.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700">V<tspan dy="9.0" font-size="21.8">B</tspan><tspan dy="-9.0">&#8203;</tspan> = V</text>
</svg>
