<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Fig 17.19: a coil connected to a battery through a switch; when the switch closes the rising current induces an opposing emf, and the work done against it is stored as energy U = (1/2) L I squared. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Energy stored in an inductor (after Fig 17.19)</text>
  <rect x="110.0" y="124.0" width="300.0" height="72.0" rx="14" stroke="#4b5563" stroke-width="2" fill="#f3e8d8"/>
  <ellipse cx="128.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="150.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="172.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="194.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="216.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="238.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="260.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="282.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="304.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="326.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="348.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="370.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <ellipse cx="392.0" cy="160.0" rx="9.0" ry="36.0" stroke="#d98b2b" stroke-width="2.4" fill="none"/>
  <text x="260.0" y="108.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">coil (inductance L)</text>
  <path d="M120.0 196.0 L120.0 360.0 L220.0 360.0" stroke="#14181f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="220.0" y1="360.0" x2="258.0" y2="340.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="220.0" cy="360.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="262.0" cy="360.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="240.0" y="392.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">switch</text>
  <path d="M262.0 360.0 L330.0 360.0" stroke="#14181f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="342.0" y1="344.0" x2="342.0" y2="376.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="351.0" y1="352.0" x2="351.0" y2="368.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="336.0" y="344.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="358.0" y="344.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="346.0" y="392.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">battery</text>
  <path d="M360.0 360.0 L400.0 360.0 L400.0 196.0" stroke="#14181f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="400.0" y1="250.0" x2="400.0" y2="292.0" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M400.0 300.0 L395.8 290.9 L404.2 290.9 Z" fill="#1f6fb5"/>
  <text x="412.0" y="280.0" font-size="17" fill="#1f6fb5" text-anchor="start" font-weight="700">I</text>
  <line x1="120.0" y1="300.0" x2="120.0" y2="258.0" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M120.0 250.0 L124.2 259.1 L115.8 259.1 Z" fill="#1f6fb5"/>
  <text x="108.0" y="280.0" font-size="17" fill="#1f6fb5" text-anchor="end" font-weight="700">I</text>
  <rect x="470.0" y="60.0" width="415.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="677.5" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">work against the induced emf</text>
  <text x="488.0" y="112.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">When the switch closes, I rises from 0.</tspan></text>
  <text x="488.0" y="138.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">The changing current induces an emf in</tspan></text>
  <text x="488.0" y="164.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">the coil that opposes the battery.</tspan></text>
  <text x="488.0" y="216.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">The battery does work to push charge</tspan></text>
  <text x="488.0" y="242.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">against it: W = (Delta q) e</tspan><tspan dy="4.5" font-size="9.8">L</tspan></text>
  <text x="488.0" y="294.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">This work is stored in the magnetic</tspan></text>
  <text x="488.0" y="320.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">field of the coil:</tspan></text>
  <text x="678.0" y="375.0" font-size="20" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">U = (1/2) L I</tspan><tspan dy="-8.4" font-size="14.0">2</tspan></text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
