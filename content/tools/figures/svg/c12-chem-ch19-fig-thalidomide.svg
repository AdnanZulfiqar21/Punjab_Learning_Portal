  <text x="418.5" y="201.0" font-size="22" fill="#d7322f" text-anchor="middle" font-weight="700">*</text>
  <rect x="690.0" y="95.0" width="195.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="787.0" y="128.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">* the chiral carbon</text>
  <text x="787.0" y="149.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">carries H, N and two</text>
  <text x="787.0" y="170.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">different ring carbons</text>
  <text x="787.0" y="191.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="787.0" y="212.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">it was sold as a</text>
  <text x="787.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">racemic mixture; in the</text>
  <text x="787.0" y="254.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">body each enantiomer</text>
  <text x="787.0" y="275.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">turns into the other</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
