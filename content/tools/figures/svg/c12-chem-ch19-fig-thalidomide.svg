  <line x1="289.1" y1="290.5" x2="307.1" y2="345.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="315.2" y="95.4" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="315.2" y="367.9" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="338.8" y="231.7" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
