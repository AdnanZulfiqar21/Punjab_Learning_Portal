<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original graph after Figure 25.7: number of survivors against age: a Type I convex curve (most live to old age), a Type II straight diagonal (constant risk of death) and a Type III concave curve (very high early mortality). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Survivorship curves</text>
  <line x1="120.0" y1="440.0" x2="820.0" y2="440.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="120.0" y1="440.0" x2="120.0" y2="100.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="470.0" y="476.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">age (proportion of maximum life span)</text>
  <text x="80.0" y="270.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 80.0 270.0)">number of survivors</text>
  <path d="M120 100 C540.0 100 680.0 134.0 820 440" stroke="#1f6fb5" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120 100 L820 440" stroke="#0f7a62" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120 100 C155.0 372.0 260.0 412.8 820 436" stroke="#d7322f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="554.0" y="94.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">Type I: humans, many mammals</text>
  <text x="505.0" y="229.2" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">Type II: birds, lizards, rodents</text>
  <text x="218.0" y="317.6" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">Type III: fishes, many invertebrates</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
