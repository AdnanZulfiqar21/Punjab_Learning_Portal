<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="550" fill="#ffffff"/>
  <!-- Original drawing after Figure 12.5 of the Class XI Physics textbook (PDF page 268): number of alpha particles against kinetic energy, four separate vertical spikes. -->
