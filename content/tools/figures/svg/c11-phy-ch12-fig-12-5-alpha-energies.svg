  <path d="M820.7 484.9 L842.0 470.0 L820.7 455.1" stroke="#8a8f96" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134.9 69.3 L120.0 48.0 L105.1 69.3" stroke="#8a8f96" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86.0" y="268.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" transform="rotate(-90 86.0 268.0)">No. of &#945;-particles (N)</text>
  <text x="480.0" y="520.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">Kinetic Energy (eV)</text>
