  <line x1="417.4" y1="467.0" x2="417.4" y2="92.8" stroke="#4a90d9" stroke-width="7" stroke-linecap="butt"/>
  <line x1="580.8" y1="467.0" x2="580.8" y2="360.8" stroke="#4a90d9" stroke-width="7" stroke-linecap="butt"/>
  <line x1="660.0" y1="467.0" x2="660.0" y2="75.2" stroke="#4a90d9" stroke-width="7" stroke-linecap="butt"/>
