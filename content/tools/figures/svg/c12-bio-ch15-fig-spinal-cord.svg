<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.9, 15.14 and 15.16: the three meninges with cerebrospinal fluid, and the spinal cord in cross-section with its roots and spinal nerves. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The meninges and the spinal cord</text>
  <rect x="15.0" y="55.0" width="320.0" height="470.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="175.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) the meninges</text>
  <rect x="40.0" y="110.0" width="120.0" height="60.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#d6d3d1"/>
  <text x="170.0" y="145.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">skull or vertebra (bone)</text>
  <rect x="40.0" y="170.0" width="120.0" height="40.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#fca5a5"/>
  <text x="170.0" y="195.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dura mater: thick, larger vessels</text>
  <rect x="40.0" y="210.0" width="120.0" height="22.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#e9d5ff"/>
  <text x="170.0" y="226.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">arachnoid: thin barrier</text>
  <rect x="40.0" y="232.0" width="120.0" height="46.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#bfdbfe"/>
  <text x="170.0" y="260.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">cerebrospinal fluid</text>
  <rect x="40.0" y="278.0" width="120.0" height="16.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#fecdd3"/>
  <text x="170.0" y="291.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">pia mater: delicate, capillaries</text>
  <rect x="40.0" y="294.0" width="120.0" height="110.0" rx="0" stroke="#57534e" stroke-width="1.5" fill="#fbcfe8"/>
  <text x="170.0" y="354.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">brain or spinal cord</text>
  <line x1="60.0" y1="228.0" x2="66.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="76.0" y1="228.0" x2="82.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="92.0" y1="228.0" x2="98.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="108.0" y1="228.0" x2="114.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="124.0" y1="228.0" x2="130.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="140.0" y1="228.0" x2="146.0" y2="268.0" stroke="#a78bfa" stroke-width="1" stroke-linecap="round"/>
  <text x="175.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">meninges cover the brain</text>
  <text x="175.0" y="488.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">and the spinal cord</text>
  <rect x="350.0" y="55.0" width="535.0" height="470.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="617.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) the spinal cord in cross-section</text>
  <ellipse cx="640.0" cy="300.0" rx="100.0" ry="80.0" stroke="#a16207" stroke-width="2.5" fill="#fef9c3"/>
  <path d="M584.0 252.0 C608.0 268.0 620.0 284.0 640 290.4 C660.0 284.0 672.0 268.0 696.0 252.0 C688.0 284.0 672.0 300 664.0 308.0 C676.0 324.0 688.0 340.0 684.0 356.0 C664.0 340.0 652.0 320.0 640 314.4 C628.0 320.0 616.0 340.0 596.0 356.0 C592.0 340.0 604.0 324.0 616.0 308.0 C608.0 300 592.0 284.0 584.0 252.0 Z" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="640.0" cy="303.0" r="5.0" stroke="#1f6fb5" stroke-width="1.5" fill="#bfdbfe"/>
  <path d="M584 254 Q530 220 490 264" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="515.0" cy="238.0" rx="15.0" ry="10.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <path d="M596 356 Q535 350 490 272" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="490.0" y1="268.0" x2="440.0" y2="282.0" stroke="#7c2d12" stroke-width="9" stroke-linecap="round"/>
  <path d="M696 254 Q750 220 790 264" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="765.0" cy="238.0" rx="15.0" ry="10.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <path d="M684 356 Q745 350 790 272" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="790.0" y1="268.0" x2="840.0" y2="282.0" stroke="#7c2d12" stroke-width="9" stroke-linecap="round"/>
  <text x="875.0" y="120.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">dorsal (back) up,</text>
  <text x="875.0" y="136.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">ventral (front) down</text>
  <text x="365.0" y="135.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dorsal root ganglion:</text>
  <line x1="507.6" y1="130.0" x2="515.0" y2="238.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="365.0" y="151.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">sensory cell bodies</text>
  <text x="365.0" y="190.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">central canal</text>
  <line x1="454.8" y1="185.0" x2="640.0" y2="303.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="880.0" y="195.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">spinal nerve (mixed)</text>
  <line x1="884.0" y1="190.0" x2="836.0" y2="280.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="365.0" y="425.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">grey matter (H-shaped): cell bodies</text>
  <line x1="600.0" y1="420.0" x2="610.0" y2="330.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="365.0" y="450.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">white matter: myelinated axons</text>
  <line x1="361.0" y1="445.0" x2="560.0" y2="350.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="880.0" y="425.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">ventral root: motor axons</text>
  <line x1="884.0" y1="420.0" x2="740.0" y2="350.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="880.0" y="230.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">dorsal root: sensory</text>
  <line x1="744.0" y1="225.0" x2="740.0" y2="234.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="618.0" y="498.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">31 pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral, 1 coccygeal</text>
  <text x="450.0" y="531" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
