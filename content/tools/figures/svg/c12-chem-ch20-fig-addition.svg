<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <!-- Original diagram after the book: benzene adds three H2 over nickel at about 150 C and high pressure to give cyclohexane (methylbenzene gives methylcyclohexane), and adds three Cl2 in UV light to give 1,2,3,4,5,6-hexachlorocyclohexane. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Addition reactions of benzene</text>
  <rect x="15.0" y="55.0" width="870.0" height="165.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">hydrogenation</text>
  <path d="M100.0 108.0 L127.7 124.0 L127.7 156.0 L100.0 172.0 L72.3 156.0 L72.3 124.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="140.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="170.0" y="146.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3H</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="215.0" y1="140.0" x2="366.2" y2="140.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M375.0 140.0 L365.0 144.6 L365.0 135.4 Z" fill="#14181f"/>
  <text x="295.0" y="130.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ni, about 150 C</tspan></text>
  <text x="295.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">high pressure</tspan></text>
  <path d="M460.0 108.0 L487.7 124.0 L487.7 156.0 L460.0 172.0 L432.3 156.0 L432.3 124.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="460.0" y="196.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">cyclohexane</text>
  <path d="M620.0 120.0 L644.2 134.0 L644.2 162.0 L620.0 176.0 L595.8 162.0 L595.8 134.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="620.0" cy="148.0" r="16.2" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="620.0" y1="120.0" x2="620.0" y2="104.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="620.0" y="97.6" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="680.0" y="152.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3H</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <line x1="715.0" y1="148.0" x2="747.0" y2="148.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M755.0 148.0 L745.9 152.2 L745.9 143.8 Z" fill="#14181f"/>
  <text x="820.0" y="154.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">methylcyclohexane</text>
  <rect x="15.0" y="230.0" width="870.0" height="190.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="260.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">addition of chlorine</text>
  <path d="M100.0 308.0 L127.7 324.0 L127.7 356.0 L100.0 372.0 L72.3 356.0 L72.3 324.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="340.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="170.0" y="346.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3Cl</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="215.0" y1="340.0" x2="321.2" y2="340.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 340.0 L320.0 344.6 L320.0 335.4 Z" fill="#14181f"/>
  <text x="272.5" y="330.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">UV light, heat</tspan></text>
  <path d="M450.0 308.0 L477.7 324.0 L477.7 356.0 L450.0 372.0 L422.3 356.0 L422.3 324.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="450.0" y1="308.0" x2="450.0" y2="292.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="285.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="477.7" y1="324.0" x2="491.6" y2="316.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="502.0" y="315.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="477.7" y1="356.0" x2="491.6" y2="364.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="502.0" y="375.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="450.0" y1="372.0" x2="450.0" y2="388.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="405.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="422.3" y1="356.0" x2="408.4" y2="364.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="398.0" y="375.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="422.3" y1="324.0" x2="408.4" y2="316.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="398.0" y="315.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Cl</text>
  <text x="700.0" y="330.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">1,2,3,4,5,6-hexachlorocyclohexane</text>
  <text x="700.0" y="350.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C6H6Cl6 (one H on each C)</text>
  <text x="450.0" y="441" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
