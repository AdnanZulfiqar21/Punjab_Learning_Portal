<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original: a flowchart for making tea, Start to End. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">An algorithm as ordered steps: making tea (after Fig 2.2)</text>
  <rect x="330.0" y="80.0" width="160.0" height="42.0" rx="21" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="410.0" y="107.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Start</text>
  <line x1="410.0" y1="124.0" x2="410.0" y2="140.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M410.0 148.0 L406.2 139.8 L413.8 139.8 Z" fill="#14181f"/>
  <rect x="300.0" y="150.0" width="220.0" height="42.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="410.0" y="177.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 Boil water</text>
  <line x1="410.0" y1="194.0" x2="410.0" y2="210.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M410.0 218.0 L406.2 209.8 L413.8 209.8 Z" fill="#14181f"/>
  <rect x="300.0" y="220.0" width="220.0" height="42.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="410.0" y="247.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 Steep the tea</text>
  <line x1="410.0" y1="264.0" x2="410.0" y2="280.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M410.0 288.0 L406.2 279.8 L413.8 279.8 Z" fill="#14181f"/>
  <rect x="300.0" y="290.0" width="220.0" height="42.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="410.0" y="317.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 Add milk or lemon</text>
  <line x1="410.0" y1="334.0" x2="410.0" y2="350.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M410.0 358.0 L406.2 349.8 L413.8 349.8 Z" fill="#14181f"/>
  <rect x="300.0" y="360.0" width="220.0" height="42.0" rx="6" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="410.0" y="387.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 Serve the tea</text>
  <line x1="410.0" y1="404.0" x2="410.0" y2="420.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M410.0 428.0 L406.2 419.8 L413.8 419.8 Z" fill="#14181f"/>
  <rect x="330.0" y="430.0" width="160.0" height="42.0" rx="21" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="410.0" y="457.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">End</text>
  <text x="560.0" y="150.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Each step is clear.</text>
  <text x="560.0" y="172.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">The order matters:</text>
  <text x="560.0" y="194.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">serving before boiling</text>
  <text x="560.0" y="216.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">gives the wrong result.</text>
  <text x="560.0" y="238.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="560.0" y="260.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">A computer follows</text>
  <text x="560.0" y="282.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">instructions the same way.</text>
  <text x="80.0" y="150.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">oval: start / end</text>
  <text x="80.0" y="172.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">box: one step</text>
  <text x="80.0" y="194.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">arrow: what comes next</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
