<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="570" fill="#ffffff"/>
  <!-- Original diagram for topic 32.13: petrochemical, cosmetics, cement (limestone and clay heated to about 1500 C in a rotary kiln, then ground with gypsum) and food industries, with the examples given in the text. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Applications of industrial chemistry</text>
  <rect x="15.0" y="55.0" width="430.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">petrochemical industry</text>
  <text x="35.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">crude oil is cracked (broken down) into</text>
  <text x="35.0" y="134.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">smaller molecules: the building blocks for</text>
  <text x="35.0" y="158.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">plastics, synthetic rubber and fibres,</text>
  <text x="35.0" y="182.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">lubricants and waxes</text>
  <rect x="455.0" y="55.0" width="430.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">cosmetics industry</text>
  <text x="475.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">surfactants: for soaps</text>
  <text x="475.0" y="134.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">emulsifiers: keep creams smooth</text>
  <text x="475.0" y="158.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">preservatives: prevent bacterial growth</text>
  <text x="475.0" y="182.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">products are pH-balanced for the skin</text>
  <rect x="15.0" y="265.0" width="430.0" height="270.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">cement industry</text>
  <rect x="35.0" y="305.0" width="120.0" height="50.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="95.0" y="326.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">limestone</text>
  <text x="95.0" y="343.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">+ clay</text>
  <line x1="157.0" y1="330.0" x2="178.6" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M185.0 330.0 L177.7 333.4 L177.7 326.6 Z" fill="#14181f"/>
  <rect x="187.0" y="305.0" width="120.0" height="50.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="247.0" y="326.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">rotary kiln</text>
  <text x="247.0" y="343.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">about 1500 C</text>
  <line x1="309.0" y1="330.0" x2="323.6" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M330.0 330.0 L322.7 333.4 L322.7 326.6 Z" fill="#14181f"/>
  <rect x="332.0" y="305.0" width="98.0" height="50.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="381.0" y="325.7" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">ground with</text>
  <text x="381.0" y="342.7" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">gypsum</text>
  <text x="35.0" y="395.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">the product is cement;</text>
  <text x="35.0" y="419.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">cement reacts with water in an exothermic</text>
  <text x="35.0" y="443.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">hydration reaction, so fresh cement</text>
  <text x="35.0" y="467.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">becomes warm</text>
  <rect x="455.0" y="265.0" width="430.0" height="270.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">food industry</text>
  <text x="475.0" y="320.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">preservatives, e.g. sodium benzoate</text>
  <text x="475.0" y="346.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">hydrogenation turns edible oils into</text>
  <text x="475.0" y="372.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">solid fats such as margarine</text>
  <text x="475.0" y="398.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">leavening agent: sodium bicarbonate</text>
  <text x="475.0" y="424.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">(baking soda) in baking</text>
  <text x="475.0" y="450.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">fortification: iodine in salt,</text>
  <text x="475.0" y="476.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">vitamin A in oil</text>
  <text x="450.0" y="561" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
