  <circle cx="180" cy="160" r="125" fill="url(#ca)" stroke="#14181f" stroke-width="3"/>
  <text x="180.0" y="178.2" font-size="52" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-21.8" font-size="36.4">2+</tspan></text>
  <line x1="345.0" y1="160.0" x2="675.6" y2="160.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
