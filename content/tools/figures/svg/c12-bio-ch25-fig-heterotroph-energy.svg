<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Figure 25.5: the energy in food eaten by a consumer partly leaves in faeces, much is lost as heat in respiration, and only the part built into new body tissue is available to the next trophic level. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">What happens to the energy a consumer eats</text>
  <ellipse cx="450.0" cy="210.0" rx="120.0" ry="80.0" stroke="#92400e" stroke-width="2.5" fill="#fef3c7"/>
  <text x="450.0" y="205.0" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700">consumer</text>
  <text x="450.0" y="226.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(heterotroph)</text>
  <line x1="120.0" y1="210.0" x2="315.4" y2="210.0" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <path d="M325.0 210.0 L314.1 215.1 L314.1 204.9 Z" fill="#0f7a62"/>
  <text x="200.0" y="196.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">food eaten</text>
  <line x1="450.0" y1="292.0" x2="450.0" y2="362.0" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 370.0 L445.8 360.9 L454.2 360.9 Z" fill="#78350f"/>
  <text x="450.0" y="392.0" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">faeces: not absorbed</text>
  <line x1="560.0" y1="160.0" x2="692.8" y2="93.6" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M700.0 90.0 L693.8 97.8 L690.0 90.3 Z" fill="#d7322f"/>
  <text x="710.0" y="90.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">respiration: lost as heat</text>
  <line x1="570.0" y1="230.0" x2="692.1" y2="248.8" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M700.0 250.0 L690.4 252.8 L691.7 244.4 Z" fill="#1f6fb5"/>
  <text x="710.0" y="255.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">growth: new body tissue</text>
  <text x="710.0" y="273.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">(available to the next level)</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
