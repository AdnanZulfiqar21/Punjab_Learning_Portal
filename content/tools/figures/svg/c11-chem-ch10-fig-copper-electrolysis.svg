<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="535" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.2: copper(II) sulfate solution electrolysed between copper electrodes with a battery, ammeter and variable resistor. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Electrolysis of copper(II) sulfate with copper electrodes</text>
  <path d="M214 250 L220 256 L220 460 Q220 470 230 470 L610 470 Q620 470 620 460 L620 256 L626 250" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M221.5 305.0 L221.5 460 Q221.5 468.5 230 468.5 L610 468.5 Q618.5 468.5 618.5 460 L618.5 305.0 Z" stroke="none" stroke-width="0" fill="#bae6fd" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="221.5" y1="305.0" x2="618.5" y2="305.0" stroke="#14181f" stroke-width="1" stroke-linecap="round"/>
  <text x="420.0" y="450.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">CuSO4(aq)</text>
  <rect x="300.0" y="200.0" width="34.0" height="240.0" rx="0" stroke="#9a3412" stroke-width="2" fill="#e2a37a"/>
  <rect x="506.0" y="200.0" width="34.0" height="240.0" rx="0" stroke="#9a3412" stroke-width="2" fill="#e2a37a"/>
  <text x="292.0" y="228.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">anode (+)</text>
  <text x="548.0" y="228.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">cathode (-)</text>
  <path d="M317.0 200.0 L317.0 90.0 L380.0 90.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="380.0" y1="72.0" x2="380.0" y2="108.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="392.0" y1="80.0" x2="392.0" y2="100.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="404.0" y1="72.0" x2="404.0" y2="108.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="416.0" y1="80.0" x2="416.0" y2="100.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="372.0" y="68.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="426.0" y="68.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="398.0" y="128.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">battery</text>
  <path d="M416.0 90.0 L480.0 90.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="500.0" cy="90.0" r="18.0" stroke="#14181f" stroke-width="2.2" fill="#ffffff"/>
  <text x="500.0" y="97.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <path d="M518.0 90.0 L600.0 90.0 L600.0 150.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="588.0" y="150.0" width="24.0" height="40.0" rx="0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <line x1="574.0" y1="190.0" x2="620.9" y2="153.9" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M626.0 150.0 L622.3 157.1 L618.2 151.7 Z" fill="#14181f"/>
