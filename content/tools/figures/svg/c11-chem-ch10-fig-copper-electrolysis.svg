  <path d="M600.0 190.0 L600.0 200.0 L523.0 200.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="170.0" y="300.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">Cu -&gt; Cu2+ + 2e-</text>
  <text x="170.0" y="320.0" font-size="13" fill="#d7322f" text-anchor="end" font-weight="400">(anode dissolves)</text>
  <text x="670.0" y="300.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">Cu2+ + 2e- -&gt; Cu</text>
  <text x="670.0" y="320.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="400">(copper deposits)</text>
  <line x1="176.0" y1="306.0" x2="298.0" y2="320.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <line x1="664.0" y1="306.0" x2="542.0" y2="320.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <text x="450.0" y="498.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">mass deposited depends on the charge passed, Q = I t (Faraday)</text>
  <text x="450.0" y="526" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
