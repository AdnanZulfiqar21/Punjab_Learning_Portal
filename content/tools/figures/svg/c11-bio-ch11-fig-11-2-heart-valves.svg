    <path d="M200 525 L200 455" stroke="#2a3a9a" stroke-width="7" marker-end="url(#ab)"/>
    <path d="M232 280 L262 360" stroke="#2a3a9a" stroke-width="7" marker-end="url(#ab)"/>
    <path d="M300 420 L300 230" stroke="#2a3a9a" stroke-width="7" marker-end="url(#ab)"/>
    <path d="M150 135 L120 135" stroke="#2a3a9a" stroke-width="6" marker-end="url(#ab)"/>
    <path d="M440 132 L490 132" stroke="#2a3a9a" stroke-width="6" marker-end="url(#ab)"/>
    <path d="M150 182 L185 182" stroke="#c8202a" stroke-width="6" marker-end="url(#ar)"/>
    <path d="M530 195 L490 195" stroke="#c8202a" stroke-width="6" marker-end="url(#ar)"/>
    <path d="M420 225 L400 300" stroke="#c8202a" stroke-width="7" marker-end="url(#ar)"/>
    <path d="M390 430 L345 300" stroke="#c8202a" stroke-width="7" marker-end="url(#ar)"/>
    <path d="M272 190 L276 120" stroke="#c8202a" stroke-width="7" marker-end="url(#ar)"/>
    <path d="M440 200 L440 160" stroke="#c8202a" stroke-width="6" marker-end="url(#ar)"/>
    <!-- left labels -->
    <g font-size="17" fill="#222">
      <text x="30" y="105">Superior</text><text x="30" y="125">vena cava</text>
      <text x="30" y="205">Pulmonary</text><text x="30" y="225">trunk</text>
      <text x="30" y="270">Right</text><text x="30" y="290">atrium</text>
      <text x="30" y="335">Pulmonary</text><text x="30" y="355">valve</text>
      <text x="30" y="400">Tricuspid</text><text x="30" y="420">valve</text>
      <text x="30" y="463">Right</text><text x="30" y="483">ventricle</text>
      <text x="30" y="518">Inferior</text><text x="30" y="538">vena cava</text>
      <text x="482" y="78">Aorta</text>
      <text x="560" y="178">Left</text><text x="560" y="198">atrium</text>
      <text x="560" y="238">Aortic</text><text x="560" y="258">valve</text>
      <text x="560" y="286">Bicuspid</text><text x="560" y="306">valve</text>
      <text x="580" y="392">Left</text><text x="580" y="412">ventricle</text>
    </g>
    <g stroke="#333" stroke-width="1.6">
