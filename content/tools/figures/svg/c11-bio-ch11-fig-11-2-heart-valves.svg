      <line x1="110" y1="210" x2="300" y2="250"/>
      <line x1="92" y1="276" x2="205" y2="290"/>
      <line x1="112" y1="340" x2="310" y2="276"/>
      <line x1="108" y1="405" x2="240" y2="372"/>
      <line x1="102" y1="468" x2="270" y2="420"/>
      <line x1="114" y1="524" x2="190" y2="520"/>
      <line x1="478" y1="74" x2="420" y2="100"/>
      <line x1="556" y1="182" x2="430" y2="230"/>
      <line x1="556" y1="244" x2="384" y2="268"/>
      <line x1="556" y1="292" x2="452" y2="292"/>
      <line x1="576" y1="398" x2="430" y2="390"/>
    </g>
    <!-- inset: valves seen from above -->
    <rect x="668" y="88" width="264" height="287" fill="#ffffff" stroke="#555" stroke-width="2"/>
    <path d="M712 285 C705 250 708 195 735 172 C765 148 805 150 830 165 C870 150 902 175 905 215 C908 255 890 290 860 300 C820 315 760 312 712 285 Z" fill="#f2d24a" stroke="#c8a020" stroke-width="2"/>
    <path d="M712 265 C705 225 712 180 740 162 C770 145 805 150 830 160 C865 145 900 168 903 205 C905 240 885 262 860 270 C810 280 760 280 712 265 Z" fill="#e0505a" stroke="#a02a35" stroke-width="2"/>
    <circle cx="755" cy="200" r="42" fill="#a8d8ec" stroke="#2a6a9a" stroke-width="3"/>
    <path d="M755 200 L738 170 M755 200 L790 205 M755 200 L742 238" stroke="#2a6a9a" stroke-width="3"/>
    <circle cx="850" cy="200" r="40" fill="#a8d8ec" stroke="#2a6a9a" stroke-width="3"/>
    <path d="M820 186 C840 205 860 205 880 188" stroke="#2a6a9a" stroke-width="3" fill="none"/>
    <circle cx="795" cy="252" r="21" fill="#3a8ad0" stroke="#1a4a8a" stroke-width="3"/>
    <path d="M795 252 L783 238 M795 252 L812 248 M795 252 L792 270" stroke="#bfe0f8" stroke-width="2.5"/>
    <circle cx="800" cy="300" r="22" fill="#3a8ad0" stroke="#1a4a8a" stroke-width="3"/>
    <path d="M800 300 L788 286 M800 300 L818 296 M800 300 L797 320" stroke="#bfe0f8" stroke-width="2.5"/>
    <g font-size="17" fill="#222">
      <text x="680" y="112">Tricuspid</text><text x="680" y="132">valve</text>
      <text x="845" y="112">Bicuspid</text><text x="845" y="132">valve</text>
      <text x="690" y="340">Aortic</text><text x="690" y="360">valve</text>
      <text x="840" y="330">Pulmonary</text><text x="840" y="350">valve</text>
    </g>
    <g stroke="#333" stroke-width="1.4">
      <line x1="720" y1="138" x2="745" y2="172"/>
      <line x1="878" y1="138" x2="860" y2="175"/>
      <line x1="730" y1="324" x2="784" y2="268"/>
      <line x1="846" y1="322" x2="820" y2="304"/>
    </g>
  </g>
</svg>
