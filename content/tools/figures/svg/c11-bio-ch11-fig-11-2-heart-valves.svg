<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 11.2 (C11-BIO, PDF p237): section of the human heart with blood-flow arrows (blue right side, red left side) and labelled chambers, vessels and valves; on the right a boxed top view of the four valves (tricuspid and bicuspid above, aortic and pulmonary below). Original flat drawing after the printed figure. -->
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a3a9a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c8202a"/></marker>
  </defs>
  <rect width="1240" height="700" fill="#ffffff"/>
  <g transform="translate(10 10) scale(1.2)">
    <!-- pulmonary veins (red stubs) -->
    <path d="M120 170 L190 170 M120 195 L190 195" stroke="#9a2028" stroke-width="22" stroke-linecap="round"/>
    <path d="M120 170 L190 170 M120 195 L190 195" stroke="#ef6a6a" stroke-width="16" stroke-linecap="round"/>
    <path d="M470 180 L540 180 M470 210 L540 210" stroke="#9a2028" stroke-width="22" stroke-linecap="round"/>
    <path d="M470 180 L540 180 M470 210 L540 210" stroke="#ef6a6a" stroke-width="16" stroke-linecap="round"/>
    <!-- right pulmonary artery (blue, behind) -->
    <path d="M130 145 L200 145" stroke="#3a4a9a" stroke-width="22" stroke-linecap="round"/>
    <path d="M130 145 L200 145" stroke="#7a86d8" stroke-width="16" stroke-linecap="round"/>
    <!-- aorta -->
    <path d="M280 300 C270 200 270 120 320 85 C370 55 430 70 440 120 L440 190" stroke="#9a2028" stroke-width="62" fill="none"/>
    <path d="M280 300 C270 200 270 120 320 85 C370 55 430 70 440 120 L440 190" stroke="#ef6a6a" stroke-width="54" fill="none"/>
    <path d="M300 75 L285 15 M340 62 L345 10 M380 66 L400 20" stroke="#9a2028" stroke-width="28" stroke-linecap="round"/>
    <path d="M300 75 L285 15 M340 62 L345 10 M380 66 L400 20" stroke="#ef6a6a" stroke-width="22" stroke-linecap="round"/>
    <!-- superior and inferior vena cava -->
    <path d="M210 20 L210 230" stroke="#3a4a9a" stroke-width="54" stroke-linecap="round"/>
    <path d="M210 20 L210 230" stroke="#8a90e0" stroke-width="46" stroke-linecap="round"/>
    <path d="M200 420 L200 540" stroke="#3a4a9a" stroke-width="50"/>
    <path d="M200 420 L200 540" stroke="#8a90e0" stroke-width="42"/>
    <!-- heart outline (wall) -->
    <path d="M165 250 C150 300 160 380 210 440 C260 500 330 520 390 515 C440 505 500 420 525 330 C540 270 535 220 510 200 C470 170 420 200 380 235 C320 225 220 215 165 250 Z" fill="#c8508a" stroke="#8a2a5a" stroke-width="3"/>
    <!-- left ventricle (red) -->
    <path d="M330 300 C360 275 420 255 470 270 C495 300 490 360 465 420 C440 470 400 495 380 480 C350 440 330 380 330 300 Z" fill="#f08a80"/>
    <!-- left atrium (red) -->
    <path d="M345 245 C370 205 430 190 470 200 C495 215 490 250 470 268 C430 262 380 270 345 290 Z" fill="#f08a80"/>
    <!-- right atrium and ventricle (blue) -->
    <path d="M178 255 C200 225 250 225 285 240 L290 330 C260 350 220 350 190 340 C175 310 172 280 178 255 Z" fill="#a8b0ec"/>
    <path d="M195 350 C230 360 270 350 300 330 L325 360 C330 410 345 460 360 485 C320 500 270 480 235 445 C210 415 195 385 195 350 Z" fill="#a8b0ec"/>
    <!-- pulmonary trunk (blue, in front of aorta) -->
    <path d="M300 335 C300 260 300 200 330 175 C370 145 430 140 480 148" stroke="#3a4a9a" stroke-width="50" fill="none"/>
    <path d="M300 335 C300 260 300 200 330 175 C370 145 430 140 480 148" stroke="#8a90e0" stroke-width="42" fill="none"/>
    <!-- septum -->
    <path d="M318 350 C330 400 345 450 372 490" stroke="#b03a70" stroke-width="14" fill="none"/>
    <!-- valves (white flaps) and chordae -->
    <path d="M200 342 C215 370 235 380 250 372 M258 345 C268 372 285 378 300 365" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M232 378 L262 448 M282 370 L300 440" stroke="#ffffff" stroke-width="3"/>
    <path d="M282 270 C292 285 305 285 312 272 M312 272 C318 285 330 285 338 270" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M352 262 C362 280 375 280 382 266 M382 266 C390 280 402 280 410 264" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M410 268 C420 295 440 300 452 288 M452 288 C440 305 430 330 435 345" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M425 300 L410 400 M445 300 L440 395" stroke="#ffffff" stroke-width="3"/>
