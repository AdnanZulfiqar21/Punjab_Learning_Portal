<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after the chapter opening and Figure 14.1: composition of the atmosphere and its four layers with temperature trends, and the ozone cycle of the stratosphere. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">The atmosphere: composition and the four layers</text>
  <!-- layers -->
  <rect x="50" y="55" width="560" height="560" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="330" y="83">Layers by temperature trend (14.1, after Figure 14.1)</text>
  <g>
    <rect x="90" y="110" width="150" height="90" fill="#1f3fb5" opacity="0.35"/>
    <rect x="90" y="200" width="150" height="90" fill="#1f6fb5" opacity="0.35"/>
    <rect x="90" y="290" width="150" height="110" fill="#2fa36b" opacity="0.35"/>
    <rect x="90" y="400" width="150" height="150" fill="#d98b2b" opacity="0.35"/>
    <rect x="90" y="550" width="150" height="20" fill="#6b4f2a"/>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="end"><text x="84" y="114">600 km</text><text x="84" y="204">85 km</text><text x="84" y="294">50 km</text><text x="84" y="404">12 km</text><text x="84" y="554">0</text></g>
  <g class="l" text-anchor="middle">
    <text x="165" y="150">thermosphere</text><text x="165" y="240">mesosphere</text><text x="165" y="340">stratosphere</text><text x="165" y="470">troposphere</text><text x="165" y="565" style="fill:#ffffff;font-size:10px">earth</text>
  </g>
  <!-- temperature profile -->
  <path d="M330 550 L300 400 L370 290 L300 200 L380 110" fill="none" stroke="#d7322f" stroke-width="3"/>
  <text font-size="11" fill="#d7322f" x="290" y="590">temperature profile (schematic)</text>
  <g class="t" style="font-size:12px">
    <text x="400" y="125">85 to 600 km; temperature rises with</text>
    <text x="400" y="141">altitude as UV and X-rays are absorbed;</text>
    <text x="400" y="157">500 to 2000 C or higher at the top</text>
    <text x="400" y="222">50 to 85 km; temperature falls from</text>
    <text x="400" y="238">-2 to -93 C: the coldest region</text>
    <text x="400" y="312">12 to 50 km; temperature rises from</text>
    <text x="400" y="328">-58 to -2 C; the ozone layer: three</text>
    <text x="400" y="344">regions by the UV that reaches them</text>
    <text x="400" y="420">0 to 12 km; densest layer; N2, O2, CO2;</text>
    <text x="400" y="436">temperature falls from 17 to -58 C;</text>
    <text x="400" y="452">rain, lightning and hurricanes here</text>
  </g>
  <g font-size="11" fill="#4b5563"><text x="250" y="608">17 C at ground, -58 C at 12 km, -2 C at 50 km, -93 C at 85 km</text></g>
  <!-- composition -->
  <rect x="630" y="55" width="520" height="250" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="890" y="83">Composition: major, minor and trace components</text>
  <rect x="660" y="105" width="460" height="26" fill="#1f6fb5" opacity="0.8"/>
  <rect x="660" y="105" width="359" height="26" fill="#1f3fb5" opacity="0.9"/>
  <g font-size="12" font-weight="700" fill="#ffffff"><text x="780" y="123">nitrogen 78.00%</text><text x="1030" y="123">oxygen 21.01%</text></g>
  <g class="t" style="font-size:12px">
    <text x="660" y="158"><tspan font-weight="700" fill="#14181f">major:</tspan> nitrogen 78.00%, oxygen 21.01%</text>
    <text x="660" y="180"><tspan font-weight="700" fill="#14181f">minor:</tspan> argon 0.93%, carbon dioxide 0.04%</text>
    <text x="660" y="202"><tspan font-weight="700" fill="#14181f">trace:</tspan> methane, hydrogen, neon, helium, krypton, xenon</text>
    <text x="660" y="234">the atmosphere is a sphere of gases around the earth;</text>
    <text x="660" y="250">the four layers are set by how temperature changes with</text>
    <text x="660" y="266">altitude (figures as printed)</text>
  </g>
  <!-- ozone -->
  <rect x="630" y="325" width="520" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="890" y="353">Ozone in the stratosphere (14.1)</text>
  <g class="f">
    <text x="650" y="384">upper:  O3 --(UV)--> O2 + O      (absorbs high-energy UV)</text>
    <text x="650" y="410">middle: O2 + O --> O3            (exothermic; ozone layer forms)</text>
    <text x="650" y="436">lower:  little UV, no O atoms, no ozone formed</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="650" y="468">the ozone layer shields the surface by absorbing high-energy</text>
    <text x="650" y="484">ultraviolet radiation; its destruction by chlorine radicals from</text>
    <text x="650" y="500">CFCs is treated in 14.4.6</text>
    <text x="650" y="528">pollutants (14.2): primary = emitted directly (volcanic ash, CO from</text>
    <text x="650" y="544">exhausts); secondary = formed by reactions of primary pollutants</text>
    <text x="650" y="560">(ozone, PAN, acids)</text>
    <text x="650" y="590">eleven classes of pollutant are listed in 14.2 and described in 14.4</text>
  </g>
  <text class="s" x="600" y="632" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced; heights and temperatures as printed.</text>
</svg>
