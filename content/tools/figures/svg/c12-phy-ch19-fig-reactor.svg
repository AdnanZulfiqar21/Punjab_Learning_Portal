<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Fig 19.5: a pressurised-water reactor inside a concrete shield; fuel rods and movable control rods sit in water under pressure in a steel vessel, a pump circulates the hot water through a heat exchanger that makes steam, the steam turns a turbine and generator, and a condenser cooled by river or sea water turns it back into water. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A pressurised-water nuclear power station (after Fig 19.5)</text>
  <rect x="30.0" y="70.0" width="520.0" height="450.0" rx="18" stroke="#4b5563" stroke-width="3" fill="#f1f5f9"/>
  <text x="290.0" y="505.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">concrete shield</text>
  <path d="M90 160 Q90 110 160 110 L220 110 Q290 110 290 160 L290 420 Q290 460 240 460 L140 460 Q90 460 90 420 Z" stroke="#14181f" stroke-width="2.5" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="190.0" y="100.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">steel pressure vessel</text>
  <rect x="125.0" y="230.0" width="18.0" height="140.0" rx="2" stroke="#d7322f" stroke-width="1.2" fill="#f87171"/>
  <rect x="160.0" y="230.0" width="18.0" height="140.0" rx="2" stroke="#d7322f" stroke-width="1.2" fill="#f87171"/>
  <rect x="195.0" y="230.0" width="18.0" height="140.0" rx="2" stroke="#d7322f" stroke-width="1.2" fill="#f87171"/>
  <rect x="230.0" y="230.0" width="18.0" height="140.0" rx="2" stroke="#d7322f" stroke-width="1.2" fill="#f87171"/>
  <rect x="144.0" y="140.0" width="8.0" height="150.0" rx="0" stroke="#14181f" stroke-width="1" fill="#374151"/>
  <rect x="179.0" y="140.0" width="8.0" height="150.0" rx="0" stroke="#14181f" stroke-width="1" fill="#374151"/>
  <rect x="214.0" y="140.0" width="8.0" height="150.0" rx="0" stroke="#14181f" stroke-width="1" fill="#374151"/>
  <text x="190.0" y="128.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">control rods</text>
  <text x="190.0" y="395.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">fuel rods</text>
  <text x="190.0" y="440.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">water under pressure</text>
  <text x="190.0" y="412.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">(moderator and coolant)</text>
  <rect x="330.0" y="120.0" width="36.0" height="70.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="348.0" y="110.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">pressuriser</text>
  <path d="M290.0 200.0 L330.0 200.0" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M290.0 200.0 L420.0 200.0 L420.0 140.0" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="395.0" y="90.0" width="120.0" height="260.0" rx="10" stroke="#d98b2b" stroke-width="2.5" fill="#fff1dc"/>
  <text x="455.0" y="82.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">heat exchanger</text>
  <text x="455.0" y="220.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">steam</text>
  <text x="455.0" y="236.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">generator</text>
  <path d="M420 140 L420 300 L490 300 L490 160" stroke="#d7322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M450.0 330.0 L450.0 400.0 L330.0 400.0" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="310.0" cy="400.0" r="20.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="310.0" y="405.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">pump</text>
  <path d="M290.0 400.0 L290.0 400.0" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M515.0 120.0 L640.0 120.0" stroke="#d98b2b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="580.0" y="110.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">steam</text>
  <path d="M640.0 95.0 L700.0 80.0 L700.0 160.0 L640.0 145.0 Z" stroke="#14181f" stroke-width="2" fill="#e5e7eb" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="632.0" y="180.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">turbine</text>
  <line x1="700.0" y1="120.0" x2="740.0" y2="120.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="775.0" cy="120.0" r="34.0" stroke="#14181f" stroke-width="2" fill="#fef3c7"/>
  <text x="775.0" y="125.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">G</text>
  <text x="775.0" y="175.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">generator</text>
  <path d="M670.0 150.0 L670.0 300.0" stroke="#d98b2b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="620.0" y="300.0" width="120.0" height="60.0" rx="6" stroke="#0e9aa7" stroke-width="2" fill="#dff4f5"/>
  <text x="680.0" y="335.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">condenser</text>
  <path d="M740.0 320.0 L850.0 320.0" stroke="#0e9aa7" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M850.0 345.0 L740.0 345.0" stroke="#0e9aa7" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="850.0" y="310.0" font-size="11" fill="#0e9aa7" text-anchor="end" font-weight="700">river or sea water</text>
  <path d="M620.0 340.0 L515.0 340.0" stroke="#1f6fb5" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="600.0" y="375.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">water returns</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
