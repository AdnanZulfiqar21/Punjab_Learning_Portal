<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- Original diagram: three cross-sections of a worm-like body. Ectoderm grey, mesoderm emerald, endoderm amber. -->
  <defs>
    <style>
      .t{font-size:34px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:26px;fill:#4b5563;text-anchor:middle}
      .k{font-size:28px;fill:#14181f}
    </style>
  </defs>
  <!-- Acoelomate -->
  <g transform="translate(170 300)">
    <circle r="140" fill="#cfd6de"/>
    <circle r="118" fill="#b2dbcc"/>
    <circle r="40" fill="#f3c98b"/>
    <circle r="24" fill="#ffffff"/>
  </g>
  <text class="t" x="170" y="500">Acoelomate</text>
  <text class="s" x="170" y="540">no cavity; parenchyma</text>
  <text class="s" x="170" y="575">fills the space</text>
  <text class="s" x="170" y="625">flatworms</text>
  <!-- Pseudocoelomate -->
  <g transform="translate(500 300)">
    <circle r="140" fill="#cfd6de"/>
    <circle r="118" fill="#b2dbcc"/>
    <circle r="92" fill="#e9f3fb"/>
    <circle r="40" fill="#f3c98b"/>
    <circle r="24" fill="#ffffff"/>
  </g>
  <text class="t" x="500" y="500">Pseudocoelomate</text>
  <text class="s" x="500" y="540">fluid cavity; mesoderm</text>
  <text class="s" x="500" y="575">only on the outer wall</text>
  <text class="s" x="500" y="625">roundworms</text>
  <!-- Coelomate -->
  <g transform="translate(830 300)">
    <circle r="140" fill="#cfd6de"/>
    <circle r="118" fill="#b2dbcc"/>
    <circle r="92" fill="#e9f3fb"/>
    <circle r="62" fill="#b2dbcc"/>
    <circle r="40" fill="#f3c98b"/>
    <circle r="24" fill="#ffffff"/>
  </g>
  <text class="t" x="830" y="500">Coelomate</text>
  <text class="s" x="830" y="540">cavity lined by mesoderm</text>
  <text class="s" x="830" y="575">on both sides</text>
  <text class="s" x="830" y="625">molluscs to chordates</text>
  <!-- key -->
  <g transform="translate(120 720)">
    <rect width="40" height="40" rx="8" fill="#cfd6de"/><text class="k" x="56" y="30">Body wall (ectoderm)</text>
    <rect y="70" width="40" height="40" rx="8" fill="#b2dbcc"/><text class="k" x="56" y="100">Mesoderm</text>
    <rect y="140" width="40" height="40" rx="8" fill="#e9f3fb"/><text class="k" x="56" y="170">Fluid-filled cavity</text>
  </g>
  <g transform="translate(560 720)">
    <rect width="40" height="40" rx="8" fill="#f3c98b"/><text class="k" x="56" y="30">Gut wall (endoderm)</text>
    <rect y="70" width="40" height="40" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="3"/><text class="k" x="56" y="100">Gut cavity</text>
  </g>
</svg>
