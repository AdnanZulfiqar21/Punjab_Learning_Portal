  <!-- After p130 (24.6.1): H3N+-CH(R)-COOH (cationic form, predominant at low pH), equilibrium arrows with OH- over and H+ under, H3N+-CH(R)-COO- (dipolar ion, predominant at isoelectric pH), equilibrium arrows with OH-/H+, H2N-CH(R)-COO- (anionic form, predominant at high pH). The book also writes '+ OH-' after the dipolar ion, which reads as if OH- were formed with it; left out, since OH- is the reagent over the arrow. -->
