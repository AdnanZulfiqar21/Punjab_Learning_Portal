<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after topic 16.5 and Figure 16.6: the acid-base titration of NaOH with HCl using phenolphthalein, the procedure, the readings and the molarity calculation. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Acid-base titration: HCl from the burette into NaOH with phenolphthalein</text>
  <!-- apparatus -->
  <rect x="50" y="55" width="400" height="470" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="250" y="83">Set-up (after Figure 16.6)</text>
  <!-- stand -->
  <rect x="90" y="490" width="160" height="10" fill="#4b5563"/>
  <rect x="100" y="110" width="8" height="380" fill="#4b5563"/>
  <rect x="104" y="150" width="60" height="8" fill="#4b5563"/>
  <!-- burette -->
  <rect x="160" y="100" width="18" height="300" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="162" y="150" width="14" height="248" fill="#bcdcf0"/>
  <g stroke="#4b5563" stroke-width="1"><path d="M160 130 H170 M160 160 H170 M160 190 H170 M160 220 H170 M160 250 H170 M160 280 H170 M160 310 H170 M160 340 H170 M160 370 H170"/></g>
  <rect x="152" y="404" width="34" height="10" rx="3" fill="#4b5563"/>
  <path d="M169 414 V432" stroke="#4b5563" stroke-width="3"/>
  <!-- flask -->
  <rect x="120" y="482" width="100" height="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <path d="M150 436 H188 V452 L212 480 H126 L150 452 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M136 468 L202 468 L212 480 H126 Z" fill="#f8c8d8"/>
  <text class="r" x="169" y="98">0</text>
  <g class="t">
    <text x="200" y="120">burette: rinsed with water, then with</text>
    <text x="200" y="136">the HCl solution; filled by funnel,</text>
    <text x="200" y="152">funnel removed; air bubble run out</text>
    <text x="200" y="168">of the nozzle through the tap</text>
    <text x="200" y="196">reading at eye level with an</text>
    <text x="200" y="212">anti-parallax card or white paper:</text>
    <text x="200" y="228">lower meniscus for colourless liquids</text>
    <text x="200" y="256">volume used = final - initial reading</text>
    <text x="200" y="284">tap: add acid drop by drop near the</text>
    <text x="200" y="300">end point; swirl the flask all the time</text>
    <text x="230" y="420">tap</text>
    <text x="260" y="436">conical flask: 10 cm3 NaOH by pipette</text>
    <text x="260" y="452">(pipette rinsed with water, then NaOH;</text>
    <text x="260" y="468">flask rinsed with water only) + 1 to 2</text>
    <text x="260" y="484">drops of phenolphthalein, pink</text>
    <text x="70" y="514">white paper under the flask shows the colour change</text>
  </g>
  <!-- end point -->
  <rect x="470" y="55" width="340" height="220" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="640" y="83">Indicator and end point</text>
  <g class="t">
    <text x="490" y="110"><tspan class="b">indicator:</tspan> shows the completion of the</text>
    <text x="490" y="126">reaction by a colour change</text>
    <text x="490" y="146"><tspan class="b">end point:</tspan> the moment the indicator</text>
    <text x="490" y="162">changes colour: here the pink NaOH</text>
    <text x="490" y="178">solution turns colourless, and the</text>
    <text x="490" y="194">last persistent light pink is the mark</text>
    <text x="490" y="218"><tspan class="b">phenolphthalein:</tspan> 1 g in 500 cm3 of 50%</text>
    <text x="490" y="234">ethanol; pink to colourless as the pH falls;</text>
    <text x="490" y="250">the pale pink fades as CO2 from the air</text>
    <text x="490" y="266">dissolves in the solution</text>
  </g>
  <!-- readings -->
  <rect x="830" y="55" width="320" height="232" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="990" y="83">Readings</text>
  <g class="f" style="font-size:12px">
    <text x="850" y="112">titration</text><text x="960" y="112">rough</text><text x="1030" y="112">1</text><text x="1070" y="112">2</text><text x="1110" y="112">3</text>
    <text x="850" y="132">final (x)</text><text x="960" y="132">..</text><text x="1030" y="132">..</text><text x="1070" y="132">..</text><text x="1110" y="132">..</text>
    <text x="850" y="152">initial (y)</text><text x="960" y="152">..</text><text x="1030" y="152">..</text><text x="1070" y="152">..</text><text x="1110" y="152">..</text>
    <text x="850" y="172">acid used</text><text x="960" y="172">x-y</text><text x="1030" y="172">..</text><text x="1070" y="172">..</text><text x="1110" y="172">..</text>
  </g>
  <g class="t">
    <text x="850" y="204">a rough titration first, then repeats;</text>
    <text x="850" y="220">take at least three concordant readings</text>
    <text x="850" y="236">that agree within 0.1 cm3</text>
    <text x="850" y="260">volume of HCl used = mean of the</text>
    <text x="850" y="276" style="fill:#4b5563">concordant readings (cm3)</text>
  </g>
  <!-- calculation -->
  <rect x="470" y="295" width="680" height="230" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="810" y="323">Equation and molarity calculation</text>
  <text class="f" x="490" y="352">NaOH(aq) + HCl(aq) -&gt; NaCl(aq) + H2O(l)</text>
  <text class="f" x="490" y="384">M1 V1 / n1 = M2 V2 / n2</text>
  <g class="t">
    <text x="490" y="410">M1, V1, n1: molarity, volume used and moles in the balanced equation for the acid</text>
    <text x="490" y="426">M2, V2, n2: the same for the base (NaOH); here n1 = n2 = 1</text>
    <text x="490" y="452">so M2 = M1 V1 n2 / (n1 V2): the molarity of the NaOH solution</text>
    <text x="490" y="480"><tspan class="b">volumetric analysis:</tspan> a solution of unknown concentration is combined slowly with a</text>
    <text x="490" y="496">known volume of a standard solution until the indicator shows the reaction is complete;</text>
    <text x="490" y="512">either solution may be in the burette, the other in the conical (titration) flask</text>
  </g>
  <!-- materials -->
  <rect x="50" y="545" width="1100" height="90" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="600" y="573">Materials and care</text>
  <g class="t">
    <text x="70" y="598">burette, pipette, funnel, conical flask, HCl solution, NaOH solution, phenolphthalein; burette fixed upright on a clamp stand; check that it does not leak</text>
    <text x="70" y="620">rinsing rule: pipette and burette with water and then with the solution they will hold; the conical flask with water only, never with the solution</text>
  </g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
