<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.12 to 10.15: what pneumonia, tuberculosis and emphysema do to the alveoli, compared with healthy alveoli. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <!-- healthy -->
  <text class="h" x="160" y="40">Healthy alveoli</text>
  <g fill="#fff4e2" stroke="#d98b2b" stroke-width="4"><circle cx="110" cy="130" r="40"/><circle cx="200" cy="120" r="40"/><circle cx="130" cy="220" r="40"/><circle cx="215" cy="215" r="40"/></g>
  <path d="M60 170 q60 40 120 0 q60 -40 120 0" fill="none" stroke="#d7322f" stroke-width="4"/>
  <text class="s" x="160" y="300">thin, air-filled, open;</text><text class="s" x="160" y="322">large surface for exchange</text>
  <!-- pneumonia -->
  <text class="h" x="450" y="40">Pneumonia</text>
  <g fill="#c9d4e0" stroke="#d98b2b" stroke-width="4"><circle cx="400" cy="130" r="40"/><circle cx="490" cy="120" r="40"/><circle cx="420" cy="220" r="40"/><circle cx="505" cy="215" r="40"/></g>
  <g fill="#9ca3af"><circle cx="400" cy="140" r="22"/><circle cx="490" cy="130" r="22"/><circle cx="420" cy="230" r="22"/><circle cx="505" cy="225" r="22"/></g>
  <text class="s" x="450" y="300">alveoli inflamed and filled with</text><text class="s" x="450" y="322">pus and fluid: painful breathing,</text><text class="s" x="450" y="344">less oxygen taken in</text>
  <text class="s" x="450" y="380">bacteria (Streptococcus</text><text class="s" x="450" y="402">pneumoniae), viruses (rhinovirus),</text><text class="s" x="450" y="424">rarely fungi</text>
  <text class="s" x="450" y="460">specific antibiotics, analgesics;</text><text class="s" x="450" y="482">vaccines prevent some types</text>
  <!-- tuberculosis -->
  <text class="h" x="740" y="40">Pulmonary tuberculosis</text>
  <g fill="#fff4e2" stroke="#d98b2b" stroke-width="4"><circle cx="690" cy="130" r="40"/><circle cx="780" cy="120" r="40"/><circle cx="710" cy="220" r="40"/><circle cx="795" cy="215" r="40"/></g>
  <g fill="#14181f"><path d="M680 120 l15 -8 l12 14 l-6 16 l-18 2 z"/><path d="M790 205 l18 -6 l10 14 l-8 14 l-20 -2 z"/><path d="M700 210 l12 -10 l16 10 l-2 18 l-18 4 z"/></g>
  <text class="s" x="740" y="300">Mycobacterium tuberculosis multiplies,</text><text class="s" x="740" y="322">inflames and damages the tissue,</text><text class="s" x="740" y="344">leaving cavities (holes) in the lung</text>
  <text class="s" x="740" y="380">chronic, highly contagious (cough,</text><text class="s" x="740" y="402">sneeze); cough with blood, evening</text><text class="s" x="740" y="424">fever, night sweats, weight loss,</text><text class="s" x="740" y="446">chest pain</text>
  <text class="s" x="740" y="482">many antibiotics for months</text>
  <!-- emphysema -->
  <text class="h" x="1030" y="40">Emphysema (a COPD)</text>
  <path d="M960 100 q60 -30 110 0 q40 40 20 110 q-30 60 -90 50 q-70 -10 -70 -70 q0 -60 30 -90 z" fill="#fff4e2" stroke="#d98b2b" stroke-width="4"/>
  <g stroke="#d98b2b" stroke-width="2" stroke-dasharray="5 4" fill="none"><path d="M1000 110 q10 40 -5 80 M1050 120 q-10 50 10 90"/></g>
  <text class="s" x="1030" y="300">inner walls of the alveoli break down:</text><text class="s" x="1030" y="322">one large space instead of many</text><text class="s" x="1030" y="344">small ones, less surface for exchange</text>
  <text class="s" x="1030" y="380">smoking, long exposure to pollution,</text><text class="s" x="1030" y="402">dust or fumes; alpha-1 antitrypsin</text><text class="s" x="1030" y="424">deficiency</text>
  <text class="s" x="1030" y="460">quit smoking; bronchodilators, inhaled</text><text class="s" x="1030" y="482">steroids, oxygen, rehabilitation</text>
  <rect x="60" y="520" width="1080" height="130" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="550" style="font-weight:700;fill:#14181f">Chronic obstructive pulmonary disease (COPD)</text>
  <text class="s" x="600" y="576">a chronic inflammatory disease of the lungs from tobacco smoke, pollutants and chemical fumes, or alpha-1 antitrypsin deficiency;</text>
  <text class="s" x="600" y="598">persistent cough with sputum, breathlessness, wheezing, fatigue, frequent infections. Incurable; progression slowed by avoiding</text>
  <text class="s" x="600" y="620">smoke, with bronchodilators, inhaled corticosteroids, pulmonary rehabilitation, oxygen therapy, rarely lung transplantation.</text>
  <text class="s" x="600" y="642" style="font-size:14px">Emphysema and chronic bronchitis (inflamed, narrowed, mucus-filled bronchial tubes) are types of COPD.</text>
</svg>
