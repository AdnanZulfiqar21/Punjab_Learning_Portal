<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.32 and 4.33: fatty acids and the dehydration synthesis of a triacylglycerol. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .c{font-size:20px;fill:#14181f;font-family:Consolas, Courier New, monospace}
      .l{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="50">Fatty acids</text>
  <text class="s" x="300" y="78">long hydrocarbon chain (even number of C, 4 to 30) ending in COOH</text>
  <!-- saturated: straight zigzag -->
  <rect x="60" y="120" width="90" height="36" rx="8" fill="#d7322f"/><text x="105" y="145" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">COOH</text>
  <path d="M150 138 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18" fill="none" stroke="#14181f" stroke-width="6" stroke-linejoin="round"/>
  <text class="l" x="330" y="185">saturated: no double bonds; straight chain; high melting point (animal fats)</text>
  <!-- unsaturated: kink at double bond -->
  <rect x="60" y="252" width="90" height="36" rx="8" fill="#d7322f"/><text x="105" y="277" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">COOH</text>
  <path d="M150 270 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18 l30 -18 l30 18" fill="none" stroke="#14181f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M390 270 L420 258" stroke="#d98b2b" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 258 l30 28 l30 -4 l30 28 l30 -4 l30 28" fill="none" stroke="#14181f" stroke-width="6" stroke-linejoin="round"/>
  <text class="l" x="420" y="372">unsaturated: C=C double bonds (orange) bend the chain; low melting point (plant oils)</text>
  <text class="l" x="420" y="398">one double bond: mono-unsaturated; more than one: poly-unsaturated (up to 6)</text>
  <!-- triglyceride synthesis -->
  <text class="h" x="600" y="440">Making a triacylglycerol (dehydration synthesis)</text>
  <g class="c">
    <text x="80" y="470">H2C-OH</text><text x="80" y="520">HC-OH</text><text x="80" y="570">H2C-OH</text>
  </g>
  <text class="l" x="130" y="610">glycerol (3-carbon alcohol)</text>
  <g class="c">
    <text x="230" y="470">HO-CO-(CH2)n-CH3</text><text x="230" y="520">HO-CO-(CH2)n-CH3</text><text x="230" y="570">HO-CO-(CH2)n-CH3</text>
  </g>
  <text class="l" x="330" y="610">three fatty acids</text>
  <path d="M520 520 L600 520" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="l" x="560" y="500">-3 H2O</text>
  <g class="c">
    <text x="640" y="470">H2C-O-CO-(CH2)n-CH3</text><text x="640" y="520">HC-O-CO-(CH2)n-CH3</text><text x="640" y="570">H2C-O-CO-(CH2)n-CH3</text>
  </g>
  <g fill="none" stroke="#d98b2b" stroke-width="3"><rect x="675" y="452" width="62" height="26" rx="6"/><rect x="664" y="502" width="62" height="26" rx="6"/><rect x="675" y="552" width="62" height="26" rx="6"/></g>
  <text class="l" x="800" y="610">triacylglycerol (triglyceride, a neutral lipid): three ester bonds (boxed)</text>
  <text class="s" x="600" y="680">An ester forms when an alcohol reacts with an acid and water is released: OH from the alcohol, H from the acid.</text>
  <text class="s" x="600" y="712">Oils are liquid at room temperature (plants); fats are solid (animals). Many C-H bonds make them rich energy stores.</text>
</svg>
