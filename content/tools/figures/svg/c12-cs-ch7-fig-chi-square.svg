<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: observed frequencies of six die faces against the expected 10, with the chi-square working and decision. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Chi-square test: is the die fair? (after the die example)</text>
  <rect x="90.0" y="190.0" width="50.0" height="130.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="115.0" y="208.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">10</text>
  <text x="115.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 1</text>
  <rect x="175.0" y="164.0" width="50.0" height="156.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="200.0" y="182.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">12</text>
  <text x="200.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 2</text>
  <rect x="260.0" y="216.0" width="50.0" height="104.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="285.0" y="234.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">8</text>
  <text x="285.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 3</text>
  <rect x="345.0" y="138.0" width="50.0" height="182.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="370.0" y="156.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">14</text>
  <text x="370.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 4</text>
  <rect x="430.0" y="203.0" width="50.0" height="117.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="455.0" y="221.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">9</text>
  <text x="455.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 5</text>
  <rect x="515.0" y="229.0" width="50.0" height="91.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#9cc3e6"/>
  <text x="540.0" y="247.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">7</text>
  <text x="540.0" y="342.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">face 6</text>
  <line x1="70.0" y1="190.0" x2="580.0" y2="190.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="575.0" y="182.0" font-size="12" fill="#d7322f" text-anchor="end" font-weight="700">expected 10</text>
  <line x1="70.0" y1="320.0" x2="580.0" y2="320.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="320.0" y="90.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">observed in 60 rolls</text>
  <rect x="640.0" y="120.0" width="230.0" height="210.0" rx="8" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="655.0" y="148.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">sum of (O - E)^2 / E:</text>
  <text x="655.0" y="170.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">0 + 0.4 + 0.4</text>
  <text x="655.0" y="192.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">+ 1.6 + 0.1 + 0.9</text>
  <text x="655.0" y="214.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">= 3.4</text>
  <text x="655.0" y="236.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="655.0" y="258.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">df = 6 - 1 = 5;</text>
  <text x="655.0" y="280.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">critical value at</text>
  <text x="655.0" y="302.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">alpha 0.05 = 11.07</text>
  <text x="450.0" y="390.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">3.4 &lt; 11.07, so H0 (the die is fair) is not rejected: the differences are small enough to be chance.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
