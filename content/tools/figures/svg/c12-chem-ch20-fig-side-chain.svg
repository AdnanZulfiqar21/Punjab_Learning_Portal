<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="585" fill="#ffffff"/>
  <!-- Original diagram after the book: KMnO4 oxidises toluene and other alkylbenzenes with a benzylic H to benzoic acid, tetralin to benzene-1,2-dicarboxylic acid, while a tertiary alkyl group (no benzylic H) does not react. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Side-chain oxidation of alkylbenzenes</text>
  <rect x="15.0" y="55.0" width="870.0" height="150.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <path d="M100.0 105.0 L126.0 120.0 L126.0 150.0 L100.0 165.0 L74.0 150.0 L74.0 120.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="135.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="100.0" y1="105.0" x2="100.0" y2="88.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100.0" y="81.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="100.0" y="190.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">toluene</text>
  <text x="175.0" y="141.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 3[O]</tspan></text>
  <line x1="225.0" y1="135.0" x2="311.2" y2="135.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320.0 135.0 L310.0 139.6 L310.0 130.4 Z" fill="#14181f"/>
  <text x="272.5" y="125.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KMnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, heat</tspan></text>
  <path d="M400.0 111.0 L426.0 126.0 L426.0 156.0 L400.0 171.0 L374.0 156.0 L374.0 126.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="400.0" cy="141.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="400.0" y1="111.0" x2="400.0" y2="94.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="400.0" y="87.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="400.0" y="197.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzoic acid</text>
  <text x="480.0" y="145.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O</tspan></text>
  <text x="700.0" y="110.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">any chain with a benzylic H</text>
  <text x="700.0" y="128.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(an H on the carbon joined</text>
  <text x="700.0" y="146.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">to the ring) becomes -COOH</text>
  <rect x="15.0" y="215.0" width="870.0" height="160.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <path d="M100.0 270.0 L126.0 285.0 L126.0 315.0 L100.0 330.0 L74.0 315.0 L74.0 285.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="300.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="100.0" y1="270.0" x2="100.0" y2="253.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100.0" y="246.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">R</tspan></text>
  <line x1="165.0" y1="300.0" x2="246.2" y2="300.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M255.0 300.0 L245.0 304.6 L245.0 295.4 Z" fill="#14181f"/>
  <text x="210.0" y="290.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KMnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <path d="M330.0 276.0 L356.0 291.0 L356.0 321.0 L330.0 336.0 L304.0 321.0 L304.0 291.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="330.0" cy="306.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="330.0" y1="276.0" x2="330.0" y2="259.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="330.0" y="252.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="330.0" y="362.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzoic acid</text>
  <path d="M540.0 270.0 L566.0 285.0 L566.0 315.0 L540.0 330.0 L514.0 315.0 L514.0 285.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="540.0" cy="300.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <path d="M592.0 270.0 L617.9 285.0 L617.9 315.0 L592.0 330.0 L566.0 315.0 L566.0 285.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="565.0" y="355.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">tetralin</text>
  <line x1="625.0" y1="300.0" x2="696.2" y2="300.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M705.0 300.0 L695.0 304.6 L695.0 295.4 Z" fill="#14181f"/>
  <text x="665.0" y="290.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KMnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <path d="M790.0 276.0 L816.0 291.0 L816.0 321.0 L790.0 336.0 L764.0 321.0 L764.0 291.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="790.0" cy="306.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="816.0" y1="291.0" x2="830.3" y2="282.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="833.7" y="281.7" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <line x1="816.0" y1="321.0" x2="830.3" y2="329.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="833.7" y="340.1" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="760.0" y="362.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzene-1,2-dicarboxylic acid</text>
  <rect x="15.0" y="385.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <path d="M120.0 425.0 L146.0 440.0 L146.0 470.0 L120.0 485.0 L94.0 470.0 L94.0 440.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="120.0" cy="455.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="120.0" y1="425.0" x2="120.0" y2="408.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="120.0" y="401.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CR</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <line x1="185.0" y1="455.0" x2="276.2" y2="455.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M285.0 455.0 L275.0 459.6 L275.0 450.4 Z" fill="#14181f"/>
  <text x="235.0" y="445.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KMnO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <text x="300.0" y="461.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">no reaction</text>
  <text x="650.0" y="435.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a tertiary alkyl group has no benzylic H,</text>
  <text x="650.0" y="453.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">so it is not oxidised; purple KMnO4</text>
  <text x="650.0" y="471.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">stays coloured (a useful test)</text>
  <text x="450.0" y="556.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the ring itself is not attacked; however long the chain, it ends as one -COOH group</text>
  <text x="450.0" y="576" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
