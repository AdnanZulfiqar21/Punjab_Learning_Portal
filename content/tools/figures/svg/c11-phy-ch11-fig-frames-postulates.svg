  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figure 11.1 and topics 11.1 to 11.3: a ball dropped in a moving train, the relativity of simultaneity, inertial and non-inertial frames, and the two postulates. -->
  <defs>
    <style>
