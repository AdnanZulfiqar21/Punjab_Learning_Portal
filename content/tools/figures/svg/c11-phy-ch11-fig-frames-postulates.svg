  </defs>
  <text class="h" x="600" y="32">Relative motion, frames of reference and the postulates of special relativity</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Relative motion: a ball dropped in a train (11.1, Fig. 11.1)</text>
  <rect x="80" y="120" width="160" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="120" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="200" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="140" cy="132" r="5" fill="#d7322f"/>
  <circle cx="140" cy="148" r="4" fill="#d7322f" opacity="0.85"/>
  <circle cx="140" cy="164" r="4" fill="#d7322f" opacity="0.70"/>
  <circle cx="140" cy="180" r="4" fill="#d7322f" opacity="0.55"/>
  <circle cx="140" cy="196" r="4" fill="#d7322f" opacity="0.40"/>
  <path d="M110 100 L170 100" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="176" y="104">v0</text>
  <text class="r" x="80" y="244">inside the train: the ball</text>
  <text class="r" x="80" y="258">falls straight down</text>
  <rect x="300" y="120" width="120" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="340" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="380" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="420" y="120" width="120" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="460" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="500" cy="218" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M340.0 132.0 L340.6 132.0 L341.2 132.0 L341.8 132.0 L342.3 132.0 L342.9 132.0 L343.5 132.0 L344.1 132.1 L344.7 132.1 L345.2 132.1 L345.8 132.1 L346.4 132.1 L347.0 132.2 L347.6 132.2 L348.2 132.2 L348.8 132.2 L349.3 132.3 L349.9 132.3 L350.5 132.4 L351.1 132.4 L351.7 132.4 L352.2 132.5 L352.8 132.5 L353.4 132.6 L354.0 132.6 L354.6 132.7 L355.2 132.8 L355.8 132.8 L356.3 132.9 L356.9 132.9 L357.5 133.0 L358.1 133.1 L358.7 133.1 L359.2 133.2 L359.8 133.3 L360.4 133.4 L361.0 133.4 L361.6 133.5 L362.2 133.6 L362.8 133.7 L363.3 133.8 L363.9 133.9 L364.5 134.0 L365.1 134.1 L365.7 134.2 L366.2 134.2 L366.8 134.4 L367.4 134.5 L368.0 134.6 L368.6 134.7 L369.2 134.8 L369.8 134.9 L370.3 135.0 L370.9 135.1 L371.5 135.2 L372.1 135.4 L372.7 135.5 L373.2 135.6 L373.8 135.7 L374.4 135.9 L375.0 136.0 L375.6 136.1 L376.2 136.3 L376.8 136.4 L377.3 136.6 L377.9 136.7 L378.5 136.8 L379.1 137.0 L379.7 137.1 L380.2 137.3 L380.8 137.4 L381.4 137.6 L382.0 137.8 L382.6 137.9 L383.2 138.1 L383.8 138.2 L384.3 138.4 L384.9 138.6 L385.5 138.8 L386.1 138.9 L386.7 139.1 L387.2 139.3 L387.8 139.5 L388.4 139.7 L389.0 139.8 L389.6 140.0 L390.2 140.2 L390.8 140.4 L391.3 140.6 L391.9 140.8 L392.5 141.0 L393.1 141.2 L393.7 141.4 L394.2 141.6 L394.8 141.8 L395.4 142.0 L396.0 142.2 L396.6 142.5 L397.2 142.7 L397.8 142.9 L398.3 143.1 L398.9 143.3 L399.5 143.6 L400.1 143.8 L400.7 144.0 L401.2 144.2 L401.8 144.5 L402.4 144.7 L403.0 145.0 L403.6 145.2 L404.2 145.4 L404.8 145.7 L405.3 145.9 L405.9 146.2 L406.5 146.4 L407.1 146.7 L407.7 147.0 L408.2 147.2 L408.8 147.5 L409.4 147.7 L410.0 148.0 L410.6 148.3 L411.2 148.5 L411.8 148.8 L412.3 149.1 L412.9 149.4 L413.5 149.6 L414.1 149.9 L414.7 150.2 L415.2 150.5 L415.8 150.8 L416.4 151.1 L417.0 151.4 L417.6 151.7 L418.2 152.0 L418.8 152.2 L419.3 152.6 L419.9 152.9 L420.5 153.2 L421.1 153.5 L421.7 153.8 L422.2 154.1 L422.8 154.4 L423.4 154.7 L424.0 155.0 L424.6 155.4 L425.2 155.7 L425.8 156.0 L426.3 156.3 L426.9 156.7 L427.5 157.0 L428.1 157.3 L428.7 157.7 L429.2 158.0 L429.8 158.4 L430.4 158.7 L431.0 159.0 L431.6 159.4 L432.2 159.7 L432.8 160.1 L433.3 160.4 L433.9 160.8 L434.5 161.2 L435.1 161.5 L435.7 161.9 L436.2 162.2 L436.8 162.6 L437.4 163.0 L438.0 163.4 L438.6 163.7 L439.2 164.1 L439.8 164.5 L440.3 164.9 L440.9 165.3 L441.5 165.6 L442.1 166.0 L442.7 166.4 L443.2 166.8 L443.8 167.2 L444.4 167.6 L445.0 168.0 L445.6 168.4 L446.2 168.8 L446.8 169.2 L447.3 169.6 L447.9 170.0 L448.5 170.4 L449.1 170.9 L449.7 171.3 L450.2 171.7 L450.8 172.1 L451.4 172.5 L452.0 173.0 L452.6 173.4 L453.2 173.8 L453.8 174.2 L454.3 174.7 L454.9 175.1 L455.5 175.6 L456.1 176.0 L456.7 176.4 L457.2 176.9 L457.8 177.3 L458.4 177.8 L459.0 178.2 L459.6 178.7 L460.2 179.2 L460.8 179.6 L461.3 180.1 L461.9 180.5 L462.5 181.0 L463.1 181.5 L463.7 181.9 L464.2 182.4 L464.8 182.9 L465.4 183.4 L466.0 183.8 L466.6 184.3 L467.2 184.8 L467.8 185.3 L468.3 185.8 L468.9 186.3 L469.5 186.8 L470.1 187.3 L470.7 187.8 L471.2 188.2 L471.8 188.8 L472.4 189.3 L473.0 189.8 L473.6 190.3 L474.2 190.8 L474.8 191.3 L475.3 191.8 L475.9 192.3 L476.5 192.8 L477.1 193.4 L477.7 193.9 L478.2 194.4 L478.8 194.9 L479.4 195.5 L480.0 196.0" fill="none" stroke="#d7322f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="340" cy="132" r="5" fill="#d7322f"/><circle cx="480" cy="196" r="5" fill="#d7322f"/>
  <path d="M340 236 H480" stroke="#4b5563" stroke-width="1.2"/><text class="r" x="396" y="250">v0 t</text>
  <text class="r" x="300" y="270">outside: the same ball follows a projectile path</text>
  <g class="r">
    <text x="70" y="296">train at rest: both observers see it fall straight down (Fig. 11.1a)</text>
    <text x="70" y="311">train moving at uniform v0: the ball keeps v0, so train and ball both move v0 t;</text>
    <text x="70" y="326">the passenger sees a vertical fall, a person outside sees a parabola (Fig. 11.1b)</text>
    <text x="70" y="341">rest and motion are relative to the frame of reference used</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Relativity of simultaneity (11.3)</text>
  <rect x="680" y="140" width="400" height="100" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="720" cy="248" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="1040" cy="248" r="9" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="684" y="160" width="14" height="60" fill="#bcdcf0" stroke="#1f6fb5"/>
  <rect x="1062" y="160" width="14" height="60" fill="#bcdcf0" stroke="#1f6fb5"/>
  <circle cx="880" cy="152" r="9" fill="#fff4b0" stroke="#d98b2b" stroke-width="2"/>
  <path d="M868 176 H708" stroke="#d98b2b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <path d="M892 176 H1052" stroke="#d98b2b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <path d="M900 112 L980 112" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="r" x="986" y="116">v = c/2</text>
  <text class="r" x="660" y="270">back door</text>
  <text class="r" x="1040" y="270">front door</text>
  <text class="r" x="850" y="138">lamp</text>
  <g class="r">
    <text x="630" y="300">inside: light reaches both doors together, so they open at the same time</text>
    <text x="630" y="315">outside: the back door moves towards the light and the front door away,</text>
    <text x="630" y="330">so the back door opens first; two events simultaneous in one frame</text>
    <text x="630" y="345">need not be simultaneous in another</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Frames of reference (11.2)</text>
  <g class="t">
    <text x="70" y="452">a frame of reference: any coordinate system relative to which</text>
    <text x="70" y="469">measurements are taken (a room, a laboratory, a moving train, the stars)</text>
    <text x="70" y="503">inertial frame: the law of inertia holds, a body at rest stays at rest</text>
    <text x="70" y="520">unless an unbalanced force acts; the Earth (nearly), a car moving</text>
    <text x="70" y="537">with uniform velocity; any frame moving uniformly relative to an inertial</text>
    <text x="70" y="554">frame is inertial</text>
    <text x="70" y="588">non-inertial frame: an accelerating frame, such as a car that suddenly</text>
    <text x="70" y="605">stops or speeds up; strictly the rotating, revolving Earth is non-inertial,</text>
    <text x="70" y="622">but its acceleration is small</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">The two postulates (11.3)</text>
  <g class="t">
    <text x="630" y="452">1 principle of relativity: the laws of physics are the same in all</text>
    <text x="630" y="469">inertial frames; no experiment can detect uniform motion</text>
    <text x="630" y="503">2 constancy of light: the speed of light in free space has the same</text>
    <text x="630" y="520">value c = 3 x 10^8 m s^-1 for all observers, whatever the motion of</text>
    <text x="630" y="537">the source or the observer (a torch beam measured from a moving car</text>
    <text x="630" y="554">and from the road gives the same c)</text>
    <text x="630" y="588">since c is constant, space and time become relative: moving clocks</text>
    <text x="630" y="605">run slow and moving lengths contract; the Earth's orbital speed,</text>
    <text x="630" y="622">30 km s^-1, is tiny beside 300 000 km s^-1, so Newton's laws work daily</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
