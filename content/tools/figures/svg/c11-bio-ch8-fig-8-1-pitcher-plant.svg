    <path d="M700 150 C 800 120 960 110 1100 140 C 1110 150 1100 160 1090 160 C 960 148 820 160 712 175 C 690 172 690 158 700 150 Z" fill="#cdd57c" stroke="#7d8436" stroke-width="3"/>
