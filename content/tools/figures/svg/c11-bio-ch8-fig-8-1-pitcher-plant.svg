    <path d="M430 260 C 500 230 560 270 580 250 L580 500 L380 500 C 420 430 380 320 430 260 Z" fill="#a37a83" opacity="0.8"/>
    <path d="M60 330 C 100 300 140 330 120 380 C 100 420 60 410 50 380 Z" fill="#b8323b"/>
