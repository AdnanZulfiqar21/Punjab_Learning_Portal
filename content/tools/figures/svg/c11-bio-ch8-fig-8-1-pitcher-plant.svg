      <circle cx="300" cy="330" r="5"/><circle cx="325" cy="350" r="6"/><circle cx="355" cy="330" r="5"/><circle cx="385" cy="355" r="6"/><circle cx="412" cy="330" r="5"/>
      <circle cx="305" cy="390" r="5"/><circle cx="335" cy="410" r="6"/><circle cx="365" cy="390" r="5"/><circle cx="395" cy="410" r="5"/><circle cx="420" cy="380" r="4"/>
      <circle cx="350" cy="440" r="5"/><circle cx="378" cy="438" r="4"/>
    </g>
    <g fill="#d7c98a">
