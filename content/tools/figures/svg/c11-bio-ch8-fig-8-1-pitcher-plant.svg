    <path d="M300 204 C 325 184 372 182 390 198" stroke="#b0303a" stroke-width="6" fill="none"/>
    <!-- lid -->
    <path d="M330 180 C 280 140 270 70 320 40 C 380 10 470 30 480 90 C 488 140 440 170 390 185 Z" fill="#efe3d6" stroke="#9a8576" stroke-width="3"/>
    <path d="M345 160 C 320 120 330 70 370 55 M400 170 C 420 130 440 90 440 60" stroke="#c9b5a6" stroke-width="3" fill="none"/>
    <path d="M330 180 C 345 170 370 170 390 185" stroke="#7a9a3a" stroke-width="6" fill="none"/>
  </g>
  <!-- right photograph -->
