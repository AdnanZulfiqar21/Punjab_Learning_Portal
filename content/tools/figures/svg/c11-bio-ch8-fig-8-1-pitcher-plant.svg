<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="520" fill="#ffffff"/>
  <!-- Fig 8.1 (C11-BIO, PDF p182): two photographs side by side, no labels. Left: a pitcher hanging from its curled tendril against a blurred pink-brown background; the speckled pitcher with its green-red rim and a large pale lid above the mouth. Right: the mouth of a pale yellow-green pitcher against a black background, its flat lid held above the opening and dark trapped insects at the rim. Clean flat drawing after the photographs printed in the textbook; no photograph reproduced. -->
  <defs>
    <clipPath id="pL"><rect x="40" y="20" width="540" height="480"/></clipPath>
    <clipPath id="pR"><rect x="640" y="20" width="520" height="480"/></clipPath>
  </defs>
  <!-- left photograph -->
  <g clip-path="url(#pL)">
