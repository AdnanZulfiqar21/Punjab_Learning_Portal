<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 27.7 to 27.9: the substrate fits the enzyme's active site to form an enzyme-substrate complex, then products leave and the enzyme is unchanged; a competitive inhibitor (e.g. malonate for succinate dehydrogenase) occupies the active site; a non-competitive inhibitor binds elsewhere and distorts the site. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Enzymes: lock and key, and inhibitors</text>
  <rect x="15.0" y="55.0" width="870.0" height="230.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">lock and key: the substrate fits the active site</text>
  <path d="M60 175 A70 60 0 1 0 200 175 L160 175 L145 150 L130 175 L115 150 L100 175 Z" stroke="#1d4ed8" stroke-width="2" fill="#60a5fa" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M100 125 L115 100 L130 125 L145 100 L160 125 L160 85 L100 85 Z" stroke="#991b1b" stroke-width="2" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="130.0" y1="140.0" x2="130.0" y2="153.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M130.0 160.0 L126.6 152.7 L133.4 152.7 Z" fill="#14181f"/>
  <text x="130.0" y="265.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">enzyme + substrate</text>
  <line x1="220.0" y1="175.0" x2="281.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M290.0 175.0 L280.0 179.6 L280.0 170.4 Z" fill="#14181f"/>
  <path d="M310 175 A70 60 0 1 0 450 175 L410 175 L395 150 L380 175 L365 150 L350 175 Z" stroke="#1d4ed8" stroke-width="2" fill="#60a5fa" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M350 175 L365 150 L380 175 L395 150 L410 175 L410 135 L350 135 Z" stroke="#991b1b" stroke-width="2" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="380.0" y="265.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">enzyme-substrate complex</text>
  <line x1="470.0" y1="175.0" x2="531.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M540.0 175.0 L530.0 179.6 L530.0 170.4 Z" fill="#14181f"/>
  <path d="M560 175 A70 60 0 1 0 700 175 L660 175 L645 150 L630 175 L615 150 L600 175 Z" stroke="#1d4ed8" stroke-width="2" fill="#60a5fa" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="740.0" cy="130.0" r="14.0" stroke="#991b1b" stroke-width="2" fill="#ef4444"/>
  <circle cx="780.0" cy="150.0" r="14.0" stroke="#991b1b" stroke-width="2" fill="#fca5a5"/>
  <text x="660.0" y="265.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">enzyme (unchanged) + products</text>
  <rect x="15.0" y="295.0" width="425.0" height="280.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="325.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">competitive (reversible) inhibitor</text>
  <path d="M90 430 A70 60 0 1 0 230 430 L190 430 L175 405 L160 430 L145 405 L130 430 Z" stroke="#1d4ed8" stroke-width="2" fill="#60a5fa" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M130 430 L145 405 L160 430 L175 405 L190 430 L190 390 L130 390 Z" stroke="#374151" stroke-width="2" fill="#9ca3af" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300 400 L315 375 L330 400 L345 375 L360 400 L360 360 L300 360 Z" stroke="#991b1b" stroke-width="2" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="300.0" y1="370.0" x2="360.0" y2="410.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="300.0" y1="410.0" x2="360.0" y2="370.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <text x="227.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the inhibitor has the substrate's shape and</text>
  <text x="227.0" y="522.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">occupies the active site, e.g. malonate</text>
  <text x="227.0" y="539.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(-OOC-CH2-COO-) blocks succinate</text>
  <text x="227.0" y="556.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(-OOC-CH2-CH2-COO-) dehydrogenase</text>
  <rect x="460.0" y="295.0" width="425.0" height="280.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="325.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">non-competitive inhibitor</text>
  <path d="M600 430 A70 60 0 1 0 740 430 L700 430 L690 400 L680 430 L660 430 L650 400 L640 430 Z" stroke="#1d4ed8" stroke-width="2" fill="#60a5fa" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="735.0" y="445.0" width="40.0" height="26.0" rx="4" stroke="#374151" stroke-width="2" fill="#9ca3af"/>
  <text x="785.0" y="463.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">inhibitor</text>
  <path d="M640 380 L655 355 L670 380 L685 355 L700 380 L700 340 L640 340 Z" stroke="#991b1b" stroke-width="2" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="640.0" y1="350.0" x2="700.0" y2="395.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <text x="672.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">binds elsewhere and changes the shape of</text>
  <text x="672.0" y="522.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the active site; the book treats these as</text>
  <text x="672.0" y="539.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">irreversible (poisons, some drugs)</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
