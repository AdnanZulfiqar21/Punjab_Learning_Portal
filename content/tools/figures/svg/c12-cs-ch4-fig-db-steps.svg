<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- Roman Urdu figure: the six steps of the sqlite3 example - connect, cursor, execute, commit, fetch, close - with the method call for each. -->
  <rect x="30.0" y="20.0" width="280.0" height="190.0" rx="14" fill="#dbe8f6" stroke="#2f6fb0" stroke-width="3"/>
  <text x="170.0" y="72.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">1 connect</text>
  <line x1="50.0" y1="94.0" x2="290.0" y2="94.0" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="140.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">sqlite3.connect(</text>
  <text x="170.0" y="176.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">'school.db')</text>
  <rect x="360.0" y="20.0" width="280.0" height="190.0" rx="14" fill="#d9f0f2" stroke="#1c8c99" stroke-width="3"/>
  <text x="500.0" y="72.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">2 cursor</text>
  <line x1="380.0" y1="94.0" x2="620.0" y2="94.0" stroke="#1c8c99" stroke-width="2" stroke-linecap="round"/>
  <text x="500.0" y="140.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">connection.</text>
  <text x="500.0" y="176.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">cursor()</text>
  <rect x="690.0" y="20.0" width="280.0" height="190.0" rx="14" fill="#fdebd3" stroke="#d9892e" stroke-width="3"/>
  <text x="830.0" y="72.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">3 execute</text>
  <line x1="710.0" y1="94.0" x2="950.0" y2="94.0" stroke="#d9892e" stroke-width="2" stroke-linecap="round"/>
  <text x="830.0" y="140.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">cursor.</text>
  <text x="830.0" y="176.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">execute(sql)</text>
  <rect x="30.0" y="300.0" width="280.0" height="190.0" rx="14" fill="#dcefe4" stroke="#1e7a4f" stroke-width="3"/>
  <text x="170.0" y="352.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">4 commit</text>
  <line x1="50.0" y1="374.0" x2="290.0" y2="374.0" stroke="#1e7a4f" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="420.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">connection.</text>
  <text x="170.0" y="456.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">commit()</text>
  <rect x="360.0" y="300.0" width="280.0" height="190.0" rx="14" fill="#ece3fa" stroke="#7a4fd0" stroke-width="3"/>
  <text x="500.0" y="352.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">5 fetch</text>
  <line x1="380.0" y1="374.0" x2="620.0" y2="374.0" stroke="#7a4fd0" stroke-width="2" stroke-linecap="round"/>
  <text x="500.0" y="420.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">cursor.</text>
  <text x="500.0" y="456.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">fetchall()</text>
  <rect x="690.0" y="300.0" width="280.0" height="190.0" rx="14" fill="#fbe0e0" stroke="#c0392b" stroke-width="3"/>
  <text x="830.0" y="352.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">6 close</text>
  <line x1="710.0" y1="374.0" x2="950.0" y2="374.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
  <text x="830.0" y="420.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">connection.</text>
  <text x="830.0" y="456.0" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace">close()</text>
  <line x1="314.0" y1="115.0" x2="338.7" y2="115.0" stroke="#1d2330" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M354.0 115.0 L337.8 122.8 L337.8 107.2 Z" fill="#1d2330"/>
  <line x1="644.0" y1="115.0" x2="668.7" y2="115.0" stroke="#1d2330" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M684.0 115.0 L667.8 122.8 L667.8 107.2 Z" fill="#1d2330"/>
  <line x1="314.0" y1="395.0" x2="338.7" y2="395.0" stroke="#1d2330" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M354.0 395.0 L337.8 402.8 L337.8 387.2 Z" fill="#1d2330"/>
  <line x1="644.0" y1="395.0" x2="668.7" y2="395.0" stroke="#1d2330" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M684.0 395.0 L667.8 402.8 L667.8 387.2 Z" fill="#1d2330"/>
  <path d="M830.0 214 L830.0 256 L170.0 256" fill="none" stroke="#1d2330" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="170.0" y1="256.0" x2="170.0" y2="278.7" stroke="#1d2330" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M170.0 294.0 L162.2 277.8 L177.8 277.8 Z" fill="#1d2330"/>
</svg>
