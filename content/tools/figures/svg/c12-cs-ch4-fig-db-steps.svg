<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- Original: connect, cursor, execute, commit, fetch and close. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Using a database from Python with sqlite3 (after the connection example)</text>
  <rect x="20.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="80.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 connect</text>
  <text x="80.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">sqlite3.connect(</text>
  <text x="80.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">'school.db')</text>
  <line x1="142.0" y1="120.0" x2="157.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M164.0 120.0 L156.7 123.4 L156.7 116.6 Z" fill="#14181f"/>
  <rect x="168.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#dff5f7"/>
  <text x="228.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 cursor</text>
  <text x="228.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">connection.</text>
  <text x="228.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cursor()</text>
  <line x1="290.0" y1="120.0" x2="305.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M312.0 120.0 L304.7 123.4 L304.7 116.6 Z" fill="#14181f"/>
  <rect x="316.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="376.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 execute</text>
  <text x="376.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cursor.</text>
  <text x="376.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">execute(sql)</text>
  <line x1="438.0" y1="120.0" x2="453.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M460.0 120.0 L452.7 123.4 L452.7 116.6 Z" fill="#14181f"/>
  <rect x="464.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="524.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 commit</text>
  <text x="524.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">connection.</text>
  <text x="524.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">commit()</text>
  <line x1="586.0" y1="120.0" x2="601.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M608.0 120.0 L600.7 123.4 L600.7 116.6 Z" fill="#14181f"/>
  <rect x="612.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="672.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">5 fetch</text>
  <text x="672.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cursor.</text>
  <text x="672.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">fetchall()</text>
  <line x1="734.0" y1="120.0" x2="749.6" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M756.0 120.0 L748.7 123.4 L748.7 116.6 Z" fill="#14181f"/>
  <rect x="760.0" y="96.0" width="120.0" height="48.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="820.0" y="125.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">6 close</text>
  <text x="820.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">connection.</text>
  <text x="820.0" y="187.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">close()</text>
  <text x="450.0" y="235.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">commit() saves changes such as INSERT, UPDATE and DELETE; without it they are lost.</text>
  <text x="450.0" y="253.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">fetchall() returns the rows of a SELECT as a list.</text>
  <text x="450.0" y="291" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
