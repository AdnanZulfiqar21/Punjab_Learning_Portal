<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 3.23 (C11-PHY, PDF p70): a tilted gyroscope; flat greyscale drawing after the printed photograph: a toy gyroscope whose dark spinning rotor sits inside two crossed metal gimbal rings, the whole frame tilted steeply to the left, its axle resting on the tip of a small round pedestal stand at the lower right, yet it does not fall. No photograph is reproduced. -->
  <rect width="1000" height="1100" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="1060" fill="#e4e4e2"/>
  <ellipse cx="560" cy="1000" rx="380" ry="40" fill="#cfcfcc"/>
  <!-- pedestal stand -->
  <path d="M740 760 Q725 900 640 960 L880 960 Q800 900 790 760 Z" fill="#9a9a98" stroke="#6e6e6c" stroke-width="4"/>
  <ellipse cx="760" cy="965" rx="125" ry="30" fill="#8a8a88" stroke="#6e6e6c" stroke-width="4"/>
  <ellipse cx="765" cy="760" rx="28" ry="10" fill="#b5b5b3" stroke="#6e6e6c" stroke-width="3"/>
  <!-- tilted gyroscope (axis from upper left to the stand tip) -->
  <g transform="translate(535 425) rotate(-35)">
    <!-- axle -->
    <line x1="0" y1="-420" x2="0" y2="400" stroke="#5a5a58" stroke-width="10" stroke-linecap="round"/>
    <!-- outer ring (frame around the axle) -->
    <ellipse cx="0" cy="0" rx="330" ry="360" fill="none" stroke="#8e8e8c" stroke-width="20"/>
    <ellipse cx="0" cy="0" rx="330" ry="360" fill="none" stroke="#d2d2d0" stroke-width="6"/>
    <!-- second ring crossing at right angles -->
    <ellipse cx="0" cy="0" rx="340" ry="110" fill="none" stroke="#7c7c7a" stroke-width="20"/>
    <ellipse cx="0" cy="0" rx="340" ry="110" fill="none" stroke="#c8c8c6" stroke-width="6"/>
    <!-- dark rotor seen at an angle -->
    <ellipse cx="0" cy="0" rx="250" ry="120" fill="#3a3a3a" stroke="#1e1e1e" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="190" ry="90" fill="none" stroke="#6a6a6a" stroke-width="10"/>
    <ellipse cx="0" cy="0" rx="120" ry="56" fill="none" stroke="#5a5a5a" stroke-width="10"/>
    <ellipse cx="0" cy="0" rx="50" ry="24" fill="#8a8a8a" stroke="#1e1e1e" stroke-width="4"/>
  </g>
</svg>
