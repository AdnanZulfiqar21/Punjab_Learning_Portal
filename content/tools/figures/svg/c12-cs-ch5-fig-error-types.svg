<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 770" font-family="Times New Roman, Times, serif">
  <rect width="1260" height="770" fill="#ffffff"/>
  <!-- Fig 5.1 (C12-CS, PDF p65), laid out as printed: three cards side by side - Logic Error, Runtime Error, Syntax Error - each with its code, result and fix. -->
  <text x="630.0" y="46" font-size="36" fill="#2f6fb0" text-anchor="middle" font-family="Times New Roman, Times, serif" font-weight="700">Types of Program Errors</text>
  <rect x="14" y="74" width="388" height="682" rx="14" fill="#eef3fb" stroke="#9db6dc" stroke-width="2.5"/>
  <circle cx="58" cy="120" r="28" fill="#1f3a7a"/>
  <circle cx="58" cy="116" r="10.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="52.5" y="128" width="11" height="7" rx="1" fill="#ffffff"/>
  <line x1="45" y1="109" x2="40" y2="106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="101" x2="58" y2="95" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="71" y1="109" x2="76" y2="106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50.5" y1="103" x2="47.5" y2="98" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65.5" y1="103" x2="68.5" y2="98" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="98" y="131" font-size="31" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Logic Error</text>
  <rect x="30" y="152" width="356" height="270" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="46" y="192" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">length = 5</text>
  <text x="46" y="226" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">width = 3</text>
  <text x="46" y="284" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">area = length + width</text>
  <text x="46" y="312" font-size="17" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve"># Incorrect logic</text>
  <text x="46" y="370" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">print(area)</text>
  <text x="46" y="398" font-size="17" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve"># Output: 8 (incorrect result)</text>
  <text x="208.0" y="466" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program runs, but the result</text>
  <text x="208.0" y="494" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">is wrong because the formula</text>
  <text x="208.0" y="522" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">is incorrect.</text>
  <rect x="30" y="564" width="356" height="174" rx="10" fill="#e3ecf8" stroke="#9db6dc" stroke-width="2"/>
  <circle cx="60" cy="598" r="18" fill="#1f3a7a"/>
  <path d="M52 598 L58 605 L69 592" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="88" y="607" font-size="24" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Correct logic:</text>
  <text x="54" y="656" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve">area = length * width</text>
  <text x="54" y="710" font-size="17" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve"># Output: 15</text>
  <rect x="436" y="74" width="388" height="682" rx="14" fill="#fdeeee" stroke="#e6a3a0" stroke-width="2.5"/>
  <circle cx="480" cy="120" r="28" fill="#d23b2f"/>
  <path d="M480 103 L462.5 134 L497.5 134 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <rect x="477.2" y="113" width="5.6" height="12" rx="1" fill="#d23b2f"/>
  <circle cx="480" cy="129.5" r="3.2" fill="#d23b2f"/>
  <text x="520" y="131" font-size="31" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Runtime Error</text>
  <rect x="452" y="152" width="356" height="226" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="468" y="192" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">a = 10</text>
  <text x="468" y="226" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">b = 0</text>
  <text x="468" y="292" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">result = a / b</text>
  <text x="468" y="338" font-size="17" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve"># Division by zero</text>
  <rect x="452" y="400" width="356" height="86" rx="10" fill="#f6c9c4" stroke="#d23b2f" stroke-width="2.5"/>
  <text x="470" y="434" font-size="22" fill="#d23b2f" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">&gt;_</text>
  <text x="508" y="434" font-size="22" fill="#c0392b" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">ZeroDivisionError:</text>
  <text x="630.0" y="468" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="700">division by zero</text>
  <text x="630.0" y="530" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program stops during execution</text>
  <text x="630.0" y="558" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">because an invalid operation occurs.</text>
  <rect x="858" y="74" width="388" height="682" rx="14" fill="#fdeeee" stroke="#e6a3a0" stroke-width="2.5"/>
  <circle cx="902" cy="120" r="28" fill="#d23b2f"/>
  <line x1="891.5" y1="109.5" x2="912.5" y2="130.5" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="891.5" y1="130.5" x2="912.5" y2="109.5" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="942" y="131" font-size="31" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Syntax Error</text>
  <rect x="874" y="152" width="356" height="178" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="890" y="192" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">if x &gt; 5</text>
  <text x="890" y="226" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" xml:space="preserve">    print("x is greater")</text>
  <text x="890" y="284" font-size="17" fill="#5b7a3a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve"># Missing colon (:)</text>
  <rect x="874" y="348" width="356" height="86" rx="10" fill="#f6c9c4" stroke="#d23b2f" stroke-width="2.5"/>
  <text x="892" y="382" font-size="22" fill="#d23b2f" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">&gt;_</text>
  <text x="930" y="382" font-size="22" fill="#c0392b" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">SyntaxError:</text>
  <text x="1052.0" y="416" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="700">invalid syntax</text>
  <text x="1052.0" y="476" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program fails to run because</text>
  <text x="1052.0" y="504" font-size="22" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">the Python syntax is wrong.</text>
  <rect x="874" y="564" width="356" height="174" rx="10" fill="#e3ecf8" stroke="#9db6dc" stroke-width="2"/>
  <circle cx="904" cy="598" r="18" fill="#1f3a7a"/>
  <path d="M896 598 L902 605 L913 592" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="932" y="607" font-size="24" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Correct syntax:</text>
  <text x="898" y="656" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve">if x &gt; 5:</text>
  <text x="898" y="692" font-size="22" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700" xml:space="preserve">    print("x is greater")</text>
</svg>
