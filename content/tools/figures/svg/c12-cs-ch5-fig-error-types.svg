<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: logic, runtime and syntax errors, each with a short code example. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Three kinds of programming error (after Fig 5.1)</text>
  <rect x="20.0" y="55.0" width="275.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="157.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">logic error</text>
  <rect x="32.0" y="105.0" width="251.0" height="106.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="44.0" y="128.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">length = 5</text>
  <text x="44.0" y="150.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">width = 3</text>
  <rect x="35.0" y="157.0" width="245.0" height="22.0" rx="2" stroke="#fde68a" stroke-width="0" fill="#fde68a"/>
  <text x="44.0" y="172.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">area = length + width</text>
  <text x="44.0" y="194.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">print(area)   # 8</text>
  <text x="157.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">runs, but the answer is wrong</text>
  <text x="157.0" y="272.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">fix: area = length * width (15)</text>
  <rect x="313.0" y="55.0" width="275.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">runtime error</text>
  <rect x="325.0" y="105.0" width="251.0" height="84.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="337.0" y="128.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">a = 10</text>
  <text x="337.0" y="150.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">b = 0</text>
  <rect x="328.0" y="157.0" width="245.0" height="22.0" rx="2" stroke="#fde68a" stroke-width="0" fill="#fde68a"/>
  <text x="337.0" y="172.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">result = a / b</text>
  <text x="450.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">stops while running:</text>
  <text x="450.0" y="272.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">ZeroDivisionError: division by zero</text>
  <rect x="606.0" y="55.0" width="275.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="743.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">syntax error</text>
  <rect x="618.0" y="105.0" width="251.0" height="84.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="630.0" y="128.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">x = 7</text>
  <rect x="621.0" y="135.0" width="245.0" height="22.0" rx="2" stroke="#fde68a" stroke-width="0" fill="#fde68a"/>
  <text x="630.0" y="150.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">if x &gt; 5</text>
  <text x="658.6" y="172.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">print("x is greater")</text>
  <text x="743.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">will not run at all:</text>
  <text x="743.0" y="272.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">SyntaxError (missing colon)</text>
  <text x="160.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">hardest to spot:</text>
  <text x="160.0" y="347.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">no message appears;</text>
  <text x="160.0" y="364.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">test the results</text>
  <text x="452.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Python shows the error</text>
  <text x="452.0" y="347.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">type and line; guard</text>
  <text x="452.0" y="364.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">with checks or try</text>
  <text x="745.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">fix: if x &gt; 5:</text>
  <text x="745.0" y="347.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">found before the</text>
  <text x="745.0" y="364.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">program starts</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
