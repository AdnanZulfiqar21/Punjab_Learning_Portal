<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1530" font-family="Times New Roman, Times, serif">
  <rect width="900" height="1530" fill="#ffffff"/>
  <!-- Fig 5.1 (C12-CS, PDF p65): Types of Program Errors - logic error (area = length + width), runtime error (a / b with b = 0) and syntax error (if x &gt; 5 without a colon), each with its result and fix. -->
  <text x="450.0" y="40.0" font-size="34" fill="#2f6fb0" text-anchor="middle" font-family="Times New Roman, Times, serif" font-weight="700">Types of Program Errors</text>
  <rect x="14.0" y="70.0" width="872.0" height="470.0" rx="14" fill="#eef3fb" stroke="#9db6dc" stroke-width="2.5"/>
  <circle cx="60.0" cy="116.0" r="30.0" fill="#1f3a7a" stroke="none" stroke-width="2"/>
  <circle cx="60.0" cy="112.0" r="11.4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="54.0" y="125.0" width="12.0" height="8.0" rx="1" fill="#ffffff" stroke="none" stroke-width="0"/>
  <line x1="45.7" y1="103.8" x2="40.5" y2="100.8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60.0" y1="95.5" x2="60.0" y2="89.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74.3" y1="103.8" x2="79.5" y2="100.8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51.8" y1="97.7" x2="48.8" y2="92.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68.2" y1="97.7" x2="71.2" y2="92.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="106.0" y="128.0" font-size="34" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Logic Error</text>
  <rect x="32.0" y="162.0" width="470.0" height="360.0" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="50.0" y="204.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">length = 5</text>
  <text x="50.0" y="240.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">width = 3</text>
  <text x="50.0" y="312.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">area = length + width</text>
  <text x="50.0" y="348.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Incorrect logic</text>
  <text x="50.0" y="420.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">print(area)</text>
  <text x="50.0" y="456.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Output: 8 (incorrect result)</text>
  <text x="695.0" y="190.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program runs, but the result</text>
  <text x="695.0" y="222.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">is wrong because the formula is</text>
  <text x="695.0" y="254.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">incorrect.</text>
  <rect x="522.0" y="332.0" width="346.0" height="180.0" rx="10" fill="#e3ecf8" stroke="#9db6dc" stroke-width="2"/>
  <circle cx="556.0" cy="372.0" r="22.0" fill="#1f3a7a" stroke="none" stroke-width="2"/>
  <path d="M546.1 372.0 L553.8 380.4 L566.6 364.3" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="588.0" y="382.0" font-size="28" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Correct logic:</text>
  <text x="542.0" y="436.0" font-size="24" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve" font-weight="700">area = length * width</text>
  <text x="542.0" y="496.0" font-size="24" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Output: 15</text>
  <rect x="14.0" y="560.0" width="872.0" height="420.0" rx="14" fill="#fdeeee" stroke="#e6a3a0" stroke-width="2.5"/>
  <circle cx="60.0" cy="606.0" r="30.0" fill="#d23b2f" stroke="none" stroke-width="2"/>
  <path d="M60.0 588.0 L41.4 621.0 L78.6 621.0 Z" fill="#ffffff" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="57.0" y="598.5" width="6.0" height="13.5" rx="1" fill="#d23b2f" stroke="none" stroke-width="0"/>
  <circle cx="60.0" cy="616.5" r="3.5" fill="#d23b2f" stroke="none" stroke-width="2"/>
  <text x="106.0" y="618.0" font-size="34" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Runtime Error</text>
  <rect x="32.0" y="652.0" width="470.0" height="300.0" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="50.0" y="694.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">a = 10</text>
  <text x="50.0" y="730.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">b = 0</text>
  <text x="50.0" y="802.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">result = a / b</text>
  <text x="50.0" y="874.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Division by zero</text>
  <rect x="522.0" y="660.0" width="346.0" height="100.0" rx="10" fill="#f6c9c4" stroke="#d23b2f" stroke-width="2.5"/>
  <text x="540.0" y="700.0" font-size="26" fill="#d23b2f" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">&gt;_</text>
  <text x="588.0" y="700.0" font-size="26" fill="#c0392b" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">ZeroDivisionError:</text>
  <text x="588.0" y="738.0" font-size="26" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">division by zero</text>
  <text x="695.0" y="810.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program stops during</text>
  <text x="695.0" y="842.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">execution because an invalid</text>
  <text x="695.0" y="874.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">operation occurs.</text>
  <rect x="14.0" y="1000.0" width="872.0" height="510.0" rx="14" fill="#fdeeee" stroke="#e6a3a0" stroke-width="2.5"/>
  <circle cx="60.0" cy="1046.0" r="30.0" fill="#d23b2f" stroke="none" stroke-width="2"/>
  <line x1="48.6" y1="1034.6" x2="71.4" y2="1057.4" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="48.6" y1="1057.4" x2="71.4" y2="1034.6" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="106.0" y="1058.0" font-size="34" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Syntax Error</text>
  <rect x="32.0" y="1092.0" width="470.0" height="200.0" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="50.0" y="1134.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">if x &gt; 5</text>
  <text x="50.0" y="1170.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    print("x is greater")</text>
  <text x="50.0" y="1242.0" font-size="25" fill="#5b7a3a" font-family="Consolas, Courier New, monospace" xml:space="preserve"># Missing colon (:)</text>
  <rect x="522.0" y="1100.0" width="346.0" height="100.0" rx="10" fill="#f6c9c4" stroke="#d23b2f" stroke-width="2.5"/>
  <text x="540.0" y="1140.0" font-size="26" fill="#d23b2f" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">&gt;_</text>
  <text x="588.0" y="1140.0" font-size="26" fill="#c0392b" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">SyntaxError:</text>
  <text x="588.0" y="1178.0" font-size="26" fill="#1d2330" text-anchor="start" font-family="Consolas, Courier New, monospace" font-weight="700">invalid syntax</text>
  <text x="695.0" y="1250.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The program fails to run because</text>
  <text x="695.0" y="1282.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">the Python syntax is wrong.</text>
  <rect x="32.0" y="1330.0" width="836.0" height="160.0" rx="10" fill="#e3ecf8" stroke="#9db6dc" stroke-width="2"/>
  <circle cx="66.0" cy="1370.0" r="22.0" fill="#1f3a7a" stroke="none" stroke-width="2"/>
  <path d="M56.1 1370.0 L63.8 1378.4 L76.6 1362.3" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="98.0" y="1380.0" font-size="28" fill="#1f3a7a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Correct syntax:</text>
  <text x="98.0" y="1426.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve" font-weight="700">if x &gt; 5:</text>
  <text x="98.0" y="1462.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve" font-weight="700">    print("x is greater")</text>
</svg>
