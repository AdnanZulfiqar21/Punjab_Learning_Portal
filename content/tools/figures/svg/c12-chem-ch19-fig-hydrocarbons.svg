<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <!-- Original classification after the book's scheme: hydrocarbons divide into open-chain (aliphatic: alkanes, alkenes, alkynes) and cyclic (alicyclic such as cyclohexane, aromatic such as benzene, methylbenzene and naphthalene). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Classification of hydrocarbons</text>
  <rect x="285.0" y="60.0" width="330.0" height="40.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="85.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">hydrocarbons: C and H only</text>
  <rect x="75.0" y="135.0" width="300.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="225.0" y="159.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">open chain (acyclic): aliphatic</text>
  <rect x="525.0" y="135.0" width="300.0" height="40.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="675.0" y="159.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">closed chain (cyclic)</text>
  <rect x="20.0" y="210.0" width="200.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="120.0" y="234.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">saturated: alkanes</text>
  <rect x="230.0" y="210.0" width="210.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="335.0" y="234.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">unsaturated: alkenes, alkynes</text>
  <rect x="470.0" y="210.0" width="190.0" height="40.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="565.0" y="234.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">alicyclic</text>
  <rect x="690.0" y="210.0" width="190.0" height="40.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="785.0" y="234.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">aromatic</text>
  <line x1="450.0" y1="100.0" x2="225.0" y2="135.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="450.0" y1="100.0" x2="675.0" y2="135.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="225.0" y1="175.0" x2="120.0" y2="210.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="225.0" y1="175.0" x2="335.0" y2="210.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="675.0" y1="175.0" x2="565.0" y2="210.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="675.0" y1="175.0" x2="785.0" y2="210.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <rect x="15.0" y="275.0" width="300.0" height="245.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="165.0" y="305.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">aliphatic</text>
  <text x="165.0" y="340.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">-CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">   ethane</tspan></text>
  <text x="165.0" y="385.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">C=CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">   ethene</tspan></text>
  <text x="165.0" y="430.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">HC&#8801;CH   ethyne</text>
  <text x="165.0" y="480.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">saturated or unsaturated chains</text>
  <rect x="325.0" y="275.0" width="160.0" height="245.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="405.0" y="305.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">alicyclic</text>
  <path d="M405.0 348.0 L441.4 369.0 L441.4 411.0 L405.0 432.0 L368.6 411.0 L368.6 369.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="405.0" y="470.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">cyclohexane</text>
  <rect x="495.0" y="275.0" width="390.0" height="245.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="690.0" y="305.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">aromatic</text>
  <path d="M565.0 352.0 L597.9 371.0 L597.9 409.0 L565.0 428.0 L532.1 409.0 L532.1 371.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="565.0" cy="390.0" r="22.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <text x="565.0" y="470.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">benzene</text>
  <path d="M680.0 362.0 L712.9 381.0 L712.9 419.0 L680.0 438.0 L647.1 419.0 L647.1 381.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="680.0" cy="400.0" r="22.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <line x1="680.0" y1="362.0" x2="680.0" y2="335.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="680.0" y="328.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="680.0" y="470.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">methylbenzene</text>
  <path d="M815.9 371.0 L815.9 409.0 L783.0 428.0 L750.1 409.0 L750.1 371.0 L783.0 352.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="783.0" cy="390.0" r="20.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <path d="M881.9 371.0 L881.9 409.0 L849.0 428.0 L816.1 409.0 L816.1 371.0 L849.0 352.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="849.0" cy="390.0" r="20.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <text x="816.0" y="470.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">naphthalene</text>
  <text x="450.0" y="550.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">alicyclic rings behave like aliphatic compounds; aromatic compounds contain benzene-type rings</text>
  <text x="450.0" y="571" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
