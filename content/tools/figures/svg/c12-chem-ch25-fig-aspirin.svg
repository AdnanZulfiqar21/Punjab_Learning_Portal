<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram for topic 25.3: retrosynthesis of aspirin (ester C-O disconnection to salicylic acid and ethanoic anhydride, C-C disconnection to phenol and carbon dioxide) and the forward synthesis phenol, salicylic acid, aspirin. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Retrosynthesis and synthesis of aspirin</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">retrosynthesis (working back from the target)</text>
  <text x="40.0" y="115.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">1 disconnection (ester C-O)</text>
  <text x="590.0" y="115.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">aspirin =&gt; 2-carboxyphenoxide synthon + CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CO</tspan><tspan dy="-5.9" font-size="9.8">+</tspan></text>
  <text x="40.0" y="161.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">2 synthetic equivalents</text>
  <text x="590.0" y="161.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">salicylic acid (2-hydroxybenzoic acid) and ethanoic anhydride, (CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CO)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="40.0" y="207.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">3 disconnection (C-C of COOH)</text>
  <text x="590.0" y="207.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">salicylic acid =&gt; 2-hydroxyphenyl anion + </tspan><tspan dy="-5.9" font-size="9.8">+</tspan><tspan dy="5.9">COOH</tspan></text>
  <text x="40.0" y="253.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">4 synthetic equivalents</text>
  <text x="590.0" y="253.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">phenol, C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH, and carbon dioxide, CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <rect x="15.0" y="315.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="345.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">synthesis (forward)</text>
  <path d="M130.0 419.0 L152.5 432.0 L152.5 458.0 L130.0 471.0 L107.5 458.0 L107.5 432.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="130.0" cy="445.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="152.5" y1="432.0" x2="164.9" y2="424.9" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="168.4" y="423.8" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="130.0" y="500.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">phenol (SM)</text>
  <line x1="200.0" y1="445.0" x2="321.2" y2="445.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 445.0 L320.0 449.6 L320.0 440.4 Z" fill="#14181f"/>
  <text x="265.0" y="435.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(i) CO</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">, high T and P</tspan></text>
  <text x="265.0" y="467.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">(ii) H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">SO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <path d="M410.0 419.0 L432.5 432.0 L432.5 458.0 L410.0 471.0 L387.5 458.0 L387.5 432.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="410.0" cy="445.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="410.0" y1="419.0" x2="410.0" y2="404.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="410.0" y="397.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <line x1="432.5" y1="432.0" x2="444.9" y2="424.9" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="448.4" y="423.8" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="410.0" y="500.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">salicylic acid</text>
  <line x1="485.0" y1="445.0" x2="606.2" y2="445.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M615.0 445.0 L605.0 449.6 L605.0 440.4 Z" fill="#14181f"/>
  <text x="550.0" y="435.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CO)</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O</tspan></text>
  <text x="550.0" y="467.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">PO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">, heat</tspan></text>
  <path d="M690.0 419.0 L712.5 432.0 L712.5 458.0 L690.0 471.0 L667.5 458.0 L667.5 432.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="690.0" cy="445.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="690.0" y1="419.0" x2="690.0" y2="404.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="690.0" y="398.2" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <line x1="712.5" y1="432.0" x2="724.9" y2="424.9" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="728.4" y="423.9" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OCOCH</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="700.0" y="500.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">aspirin (TM)</text>
  <text x="450.0" y="548.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the other product of the last step is ethanoic acid</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
