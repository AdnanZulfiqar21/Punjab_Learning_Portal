<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.7 and 3.8: the fluid mosaic model of the plasma membrane. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:20px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <g id="pu"><circle cx="0" cy="0" r="13" fill="#1f6fb5"/><path d="M-5 12 q-4 30 2 60 M5 12 q4 30 -2 60" stroke="#f2b134" stroke-width="4" fill="none"/></g>
    <g id="pd"><circle cx="0" cy="0" r="13" fill="#1f6fb5"/><path d="M-5 -12 q-4 -30 2 -60 M5 -12 q4 -30 -2 -60" stroke="#f2b134" stroke-width="4" fill="none"/></g>
  </defs>
  <text class="s" x="590" y="250">OUTSIDE the cell</text>
  <text class="s" x="590" y="560">INSIDE the cell (cytoplasm)</text>
  <g>
    <use href="#pu" x="70" y="300"/><use href="#pu" x="100" y="300"/><use href="#pu" x="130" y="300"/><use href="#pu" x="160" y="300"/><use href="#pu" x="190" y="300"/>
    <use href="#pu" x="340" y="300"/><use href="#pu" x="370" y="300"/><use href="#pu" x="400" y="300"/><use href="#pu" x="430" y="300"/>
    <use href="#pu" x="580" y="300"/><use href="#pu" x="610" y="300"/><use href="#pu" x="640" y="300"/><use href="#pu" x="670" y="300"/><use href="#pu" x="700" y="300"/>
    <use href="#pu" x="810" y="300"/><use href="#pu" x="840" y="300"/><use href="#pu" x="870" y="300"/><use href="#pu" x="900" y="300"/><use href="#pu" x="930" y="300"/>
    <use href="#pu" x="1090" y="300"/><use href="#pu" x="1120" y="300"/><use href="#pu" x="1150" y="300"/>
    <use href="#pd" x="70" y="470"/><use href="#pd" x="100" y="470"/><use href="#pd" x="130" y="470"/><use href="#pd" x="160" y="470"/><use href="#pd" x="190" y="470"/>
    <use href="#pd" x="340" y="470"/><use href="#pd" x="370" y="470"/><use href="#pd" x="400" y="470"/><use href="#pd" x="430" y="470"/>
    <use href="#pd" x="580" y="470"/><use href="#pd" x="610" y="470"/><use href="#pd" x="640" y="470"/><use href="#pd" x="670" y="470"/><use href="#pd" x="700" y="470"/>
    <use href="#pd" x="810" y="470"/><use href="#pd" x="840" y="470"/><use href="#pd" x="870" y="470"/><use href="#pd" x="900" y="470"/><use href="#pd" x="930" y="470"/>
    <use href="#pd" x="1090" y="470"/><use href="#pd" x="1120" y="470"/><use href="#pd" x="1150" y="470"/>
  </g>
  <!-- channel protein -->
  <path d="M230 285 h35 v200 h-35 z M290 285 h35 v200 h-35 z" fill="#0f7a62" stroke="#0a5a48" stroke-width="3"/>
  <path d="M277 250 L277 520" stroke="#4b5563" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- carrier protein -->
  <path d="M460 285 q50 -20 100 0 v200 q-50 20 -100 0 z" fill="#2f9a7e" stroke="#0a5a48" stroke-width="3"/>
  <!-- receptor with its messenger -->
  <path d="M730 290 h60 v195 h-60 z" fill="#5b3fb5"/><path d="M730 290 q30 -60 60 0" fill="#fff" stroke="#5b3fb5" stroke-width="4"/>
  <circle cx="760" cy="228" r="14" fill="#d98b2b"/>
  <!-- peripheral protein inside -->
  <ellipse cx="870" cy="508" rx="55" ry="22" fill="#8f78d9"/>
  <!-- cholesterol -->
  <rect x="985" y="330" width="14" height="110" rx="4" fill="#8a4b00"/>
  <!-- glycoprotein and glycolipid -->
  <path d="M1010 290 h60 v195 h-60 z" fill="#0f7a62"/>
  <g fill="#d98b2b"><circle cx="1040" cy="260" r="7"/><circle cx="1050" cy="240" r="7"/><circle cx="1040" cy="220" r="7"/><circle cx="1055" cy="202" r="7"/></g>
  <g fill="#d98b2b"><circle cx="160" cy="275" r="7"/><circle cx="170" cy="257" r="7"/><circle cx="162" cy="239" r="7"/></g>
  <path class="lead" d="M100 300 L100 178"/><text class="t" x="40" y="130">Phospholipid bilayer</text><text class="s" x="40" y="160">hydrophilic heads out, hydrophobic tails in</text>
  <path class="lead" d="M277 520 L277 620"/><text class="t" x="190" y="650">Channel protein</text>
  <path class="lead" d="M510 485 L510 690"/><text class="t" x="430" y="720">Carrier protein</text>
  <path class="lead" d="M760 228 L760 130"/><text class="t" x="660" y="110">Receptor</text><text class="s" x="620" y="140">binds a messenger (e.g. a hormone)</text>
  <path class="lead" d="M870 530 L870 620"/><text class="t" x="780" y="650">Peripheral protein</text><text class="s" x="760" y="680">attaches to the cytoskeleton</text>
  <path class="lead" d="M992 440 L1010 560"/><text class="t" x="960" y="590">Cholesterol</text><text class="s" x="930" y="620">keeps fluidity when cold</text>
  <path class="lead" d="M1055 200 L1040 150"/><text class="t" x="960" y="130">Glycoprotein</text>
  <path class="lead" d="M165 240 L230 190"/><text class="t" x="235" y="195">Glycolipid</text><text class="s" x="235" y="222">sugar chains are cell identity marks</text>
  <text class="s" x="40" y="745">Fluid mosaic model (Singer and Nicolson, 1972): proteins float in a fluid phospholipid bilayer.</text>
</svg>
