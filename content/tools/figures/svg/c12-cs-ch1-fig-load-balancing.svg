  <text x="782.0" y="95.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">methods</text>
  <text x="692.0" y="125.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Round Robin:</text>
  <text x="692.0" y="141.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">  1, 2, 3, 1, 2, 3 ...</text>
  <text x="692.0" y="185.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Least Connection:</text>
  <text x="692.0" y="201.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">  to the least busy</text>
  <text x="692.0" y="217.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">  server</text>
  <text x="692.0" y="265.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">IP Hash:</text>
  <text x="692.0" y="281.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">  the user's IP address</text>
  <text x="692.0" y="297.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">  picks the server</text>
  <text x="450.0" y="415.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">If one server fails, the others keep working.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
