<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 6.5 and 6.6: a supply chain from supplier to customer with each hand-over recorded on a ledger, encryption and decryption with a key alongside the sealed-letter analogy, and five future trends. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Blockchain uses, data security and future trends</text>
  <rect x="50" y="55" width="1100" height="210" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="83">Tracking a product from supplier to customer (6.5.1)</text>
  <rect x="80" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="127" y="129">Supplier</text>
  <rect x="125" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="155" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M155 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M232 125 L256 125" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="258" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="292" y="129">Manufacturer</text>
  <rect x="303" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="333" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M333 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M410 125 L434 125" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="436" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="476" y="129">Fabricator</text>
  <rect x="481" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="511" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M511 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M588 125 L612 125" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="614" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="648" y="129">Intermediary</text>
  <rect x="659" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="689" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M689 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M766 125 L790 125" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="792" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="839" y="129">Retailer</text>
  <rect x="837" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="867" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M867 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M944 125 L968 125" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="970" y="105" width="150" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="1017" y="129">Customer</text>
  <rect x="1015" y="180" width="60" height="30" rx="4" fill="#e8f1fb" stroke="#1f6fb5"/>
  <text class="r" x="1045" y="200" style="fill:#1f6fb5;text-anchor:middle">record</text>
  <path d="M1045 145 V178" stroke="#1f6fb5" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M125 225 H1035" stroke="#1f6fb5" stroke-width="2"/>
  <text class="r" x="580" y="248" style="text-anchor:middle">every hand-over is logged on the shared ledger, so the customer can check the product's origin</text>
  <rect x="50" y="285" width="540" height="410" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="313">Securing data like a sealed letter (6.5.3)</text>
  <rect x="90" y="330" width="170" height="36" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="147" y="352">plain text</text>
  <path d="M175 367 L175 380" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <rect x="90" y="382" width="170" height="36" rx="6" fill="#fff4e2" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="140" y="404">encryption</text>
  <path d="M175 419 L175 432" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <rect x="90" y="434" width="170" height="36" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="144" y="456">cipher text</text>
  <path d="M175 471 L175 484" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <rect x="90" y="486" width="170" height="36" rx="6" fill="#fff4e2" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="140" y="508">decryption</text>
  <path d="M175 523 L175 536" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <rect x="90" y="538" width="170" height="36" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="147" y="560">plain text</text>
  <text class="l" x="290" y="403" style="fill:#d98b2b">key</text>
  <text class="l" x="290" y="507" style="fill:#d98b2b">key</text>
  <g class="r">
    <text x="330" y="340">sealing = encryption</text>
    <text x="330" y="357">signing = digital signature</text>
    <text x="330" y="374">(proves who sent it and that</text>
    <text x="330" y="391">it was not changed)</text>
    <text x="330" y="408">trusted courier = blockchain</text>
    <text x="330" y="425">network records each step</text>
    <text x="330" y="442">many copies = decentralization</text>
    <text x="330" y="476">together: very hard to read,</text>
    <text x="330" y="493">forge or alter the data</text>
  </g>
  <rect x="610" y="285" width="540" height="410" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="313">Future trends (6.6)</text>
  <rect x="630" y="330" width="170" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="667" y="352">Edge computing</text>
  <g class="r">
    <text x="815" y="344">process data near its source;</text>
    <text x="815" y="360">low latency (self-driving cars)</text>
  </g>
  <rect x="630" y="400" width="170" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="680" y="422">Serverless</text>
  <g class="r">
    <text x="815" y="414">run code without managing</text>
    <text x="815" y="430">servers; pay per use (AWS Lambda)</text>
  </g>
  <rect x="630" y="470" width="170" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="667" y="492">Blockchain 2.0</text>
  <g class="r">
    <text x="815" y="484">smart contracts and decentralized</text>
    <text x="815" y="500">apps beyond currency</text>
  </g>
  <rect x="630" y="540" width="170" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="663" y="562">AI + blockchain</text>
  <g class="r">
    <text x="815" y="554">analyse trusted ledger data</text>
    <text x="815" y="570">(demand forecasting)</text>
  </g>
  <rect x="630" y="610" width="170" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="660" y="632">IoT + blockchain</text>
  <g class="r">
    <text x="815" y="624">tamper-proof sensor records</text>
    <text x="815" y="640">(soil and crop health)</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
