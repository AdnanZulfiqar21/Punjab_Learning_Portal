<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="730" fill="#ffffff"/>
  <!-- Original diagram for topic 25.2: ethyl ethanoate disconnected at C-O into CH3CO+ and C2H5O- (SE ethanoic acid and ethanol); aniline made from benzene by nitration then reduction; phenylethanone disconnected at C-C into C6H5- and CH3CO+ (SE benzene and ethanoyl chloride, Friedel-Crafts acylation). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Retrosynthesis of three simple targets</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ethyl ethanoate (ethyl acetate)</text>
  <text x="150.0" y="126.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">CO-OC</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">H</tspan><tspan dy="5.8" font-size="12.6">5</tspan></text>
  <line x1="150.0" y1="104.0" x2="160.0" y2="138.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="235.0" y1="116.0" x2="323.0" y2="116.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="235.0" y1="124.0" x2="323.0" y2="124.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M317 108 L335 120 L317 132" stroke="#db2777" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="285.0" y="106.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">disconnection</text>
  <text x="420.0" y="126.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">CO</tspan><tspan dy="-7.1" font-size="11.9">+</tspan></text>
  <text x="520.0" y="126.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <text x="600.0" y="126.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="-7.1" font-size="11.9">-</tspan><tspan dy="7.1">OC</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan></text>
  <text x="420.0" y="150.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">synthon A</text>
  <text x="600.0" y="150.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">synthon B</text>
  <text x="760.0" y="112.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">SE: CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOH</tspan></text>
  <text x="760.0" y="138.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">SE: C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH</tspan></text>
  <text x="450.0" y="215.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">synthesis: CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COOH + C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">OH -&gt; CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COOC</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1"> + H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O (conc. H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">SO</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">)</tspan></text>
  <rect x="15.0" y="265.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">phenylamine (aniline)</text>
  <path d="M110.0 359.0 L132.5 372.0 L132.5 398.0 L110.0 411.0 L87.5 398.0 L87.5 372.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="110.0" cy="385.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="150.0" y1="385.0" x2="246.2" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M255.0 385.0 L245.0 389.6 L245.0 380.4 Z" fill="#14181f"/>
  <text x="202.5" y="375.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HNO</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="202.5" y="407.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">SO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <path d="M310.0 359.0 L332.5 372.0 L332.5 398.0 L310.0 411.0 L287.5 398.0 L287.5 372.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="310.0" cy="385.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="310.0" y1="359.0" x2="310.0" y2="344.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="310.0" y="337.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <line x1="355.0" y1="385.0" x2="451.2" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M460.0 385.0 L450.0 389.6 L450.0 380.4 Z" fill="#14181f"/>
  <text x="407.5" y="375.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Sn + HCl</tspan></text>
  <path d="M515.0 359.0 L537.5 372.0 L537.5 398.0 L515.0 411.0 L492.5 398.0 L492.5 372.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="515.0" cy="385.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="515.0" y1="359.0" x2="515.0" y2="344.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="515.0" y="337.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="730.0" y="355.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">retrosynthesis: FGI NH2 =&gt; NO2;</text>
  <text x="730.0" y="373.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">C-N disconnection gives C6H5- and</text>
  <text x="730.0" y="391.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">NO2+ (SE benzene and HNO3)</text>
  <text x="310.0" y="460.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">NH2 cannot be put on directly; NO2 can (electrophilic substitution)</text>
  <rect x="15.0" y="490.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="520.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">phenylethanone (acetophenone)</text>
  <path d="M110.0 584.0 L132.5 597.0 L132.5 623.0 L110.0 636.0 L87.5 623.0 L87.5 597.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="110.0" cy="610.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="175.0" y="616.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COCl</tspan></text>
  <line x1="245.0" y1="610.0" x2="321.2" y2="610.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 610.0 L320.0 614.6 L320.0 605.4 Z" fill="#14181f"/>
  <text x="287.5" y="600.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">AlCl</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <path d="M395.0 584.0 L417.5 597.0 L417.5 623.0 L395.0 636.0 L372.5 623.0 L372.5 597.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="395.0" cy="610.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="395.0" y1="584.0" x2="395.0" y2="569.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="395.0" y="562.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="475.0" y="616.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HCl</tspan></text>
  <text x="710.0" y="580.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">retrosynthesis: C-C disconnection gives</text>
  <text x="710.0" y="598.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">C6H5- and CH3CO+ (acylium);</text>
  <text x="710.0" y="616.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">SE benzene and ethanoyl chloride</text>
  <text x="710.0" y="634.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(Friedel-Crafts acylation)</text>
  <text x="450.0" y="721" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
