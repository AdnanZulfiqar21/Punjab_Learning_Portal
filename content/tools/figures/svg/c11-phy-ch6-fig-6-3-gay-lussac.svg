<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 6.3 (PDF page 124), original drawing after the printed graph: Gay-Lussac's law, pressure P against temperature T at constant volume, a straight line from the origin. -->
  <rect width="900" height="620" fill="#ffffff"/>
  <line x1="140.0" y1="540.0" x2="830.8" y2="540.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M850.0 540.0 L826.0 550.1 L826.0 529.9 Z" fill="#1a1a1a"/>
  <line x1="140.0" y1="540.0" x2="140.0" y2="59.2" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M140.0 40.0 L150.1 64.0 L129.9 64.0 Z" fill="#1a1a1a"/>
  <line x1="140.0" y1="540.0" x2="780.0" y2="90.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <text x="118.0" y="90.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">P</tspan></text>
