<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.13 and 4.14: ring forms of glucose (alpha and beta), fructose and ribose. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .c{font-size:20px;fill:#14181f;text-anchor:middle;font-family:Consolas, Courier New, monospace}
      .n{font-size:15px;fill:#4b5563;text-anchor:middle}
    </style>
    <g id="pyran"><polygon points="-80,0 -40,-50 40,-50 80,0 40,50 -40,50" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5" stroke-linejoin="round"/><circle cx="40" cy="-50" r="16" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text x="40" y="-44" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">O</text></g>
    <g id="furan"><polygon points="-70,10 -40,-45 40,-45 70,10 0,50" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="-45" r="16" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text x="0" y="-39" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">O</text></g>
  </defs>
  <!-- alpha glucose -->
  <text class="h" x="200" y="50">alpha-D-glucose</text>
  <g transform="translate(200,230)"><use href="#pyran"/></g>
  <text class="n" x="290" y="236">1</text><text class="n" x="250" y="296">2</text><text class="n" x="150" y="296">3</text><text class="n" x="110" y="236">4</text><text class="n" x="150" y="166">5</text>
  <text class="c" x="140" y="150">CH2OH</text>
  <text class="c" x="300" y="300" style="fill:#d98b2b;font-weight:700">OH</text>
  <path d="M280 236 L295 282" stroke="#d98b2b" stroke-width="3"/>
  <text class="s" x="200" y="330">OH on carbon 1 points down</text>
  <text class="s" x="200" y="356">O bridge C1 to C5; six-cornered pyran ring</text>
  <text class="s" x="200" y="382">many alpha-glucose join to make starch</text>
  <!-- beta glucose -->
  <text class="h" x="600" y="50">beta-D-glucose</text>
  <g transform="translate(600,230)"><use href="#pyran"/></g>
  <text class="n" x="690" y="236">1</text><text class="n" x="650" y="296">2</text><text class="n" x="550" y="296">3</text><text class="n" x="510" y="236">4</text><text class="n" x="550" y="166">5</text>
  <text class="c" x="540" y="150">CH2OH</text>
  <text class="c" x="700" y="175" style="fill:#5b3fb5;font-weight:700">OH</text>
  <path d="M680 224 L695 185" stroke="#5b3fb5" stroke-width="3"/>
  <text class="s" x="600" y="330">OH on carbon 1 points up</text>
  <text class="s" x="600" y="356">same ring; only carbon 1 differs</text>
  <text class="s" x="600" y="382">many beta-glucose join to make cellulose</text>
  <!-- fructose -->
  <text class="h" x="1000" y="50">Fructose</text>
  <g transform="translate(1000,235)"><use href="#furan"/></g>
  <text class="n" x="1080" y="248">2</text><text class="n" x="1035" y="300">3</text><text class="n" x="965" y="300">4</text><text class="n" x="920" y="248">5</text>
  <text class="c" x="915" y="170">CH2OH</text><text class="c" x="1090" y="170">CH2OH</text>
  <text class="s" x="1000" y="330">oxygen bridge C2 to C5</text>
  <text class="s" x="1000" y="356">five-cornered furan ring</text>
  <!-- ribose -->
  <text class="h" x="400" y="470">Ribose</text>
  <g transform="translate(400,600)"><use href="#furan"/></g>
  <text class="n" x="480" y="613">1</text><text class="n" x="435" y="665">2</text><text class="n" x="365" y="665">3</text><text class="n" x="320" y="613">4</text>
  <text class="c" x="310" y="535">CH2OH</text>
  <text class="s" x="400" y="700">oxygen bridge C1 to C4; furan ring; C5H10O5</text>
  <text class="s" x="400" y="726">deoxyribose lacks one oxygen (C5H10O4)</text>
  <!-- galactose note -->
  <text class="h" x="850" y="470">Galactose</text>
  <g transform="translate(850,600)"><use href="#pyran"/></g>
  <text class="c" x="790" y="520">CH2OH</text>
  <text class="s" x="850" y="700">oxygen bridge C1 to C5 again: a pyran ring;</text>
  <text class="s" x="850" y="726">differs from glucose only at carbon 4</text>
</svg>
