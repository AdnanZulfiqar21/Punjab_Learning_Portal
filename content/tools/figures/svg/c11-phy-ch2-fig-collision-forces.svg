<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 2.9: two balls before, during and after a collision, with the equal and opposite contact forces. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two balls colliding: momentum is conserved</text>
  <text x="40.0" y="126.0" font-size="18" fill="#4b5563" text-anchor="start" font-weight="700">before</text>
  <text x="40.0" y="251.0" font-size="18" fill="#4b5563" text-anchor="start" font-weight="700">during contact</text>
  <text x="40.0" y="376.0" font-size="18" fill="#4b5563" text-anchor="start" font-weight="700">after</text>
  <circle cx="330.0" cy="120.0" r="30.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="330.0" y="126.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">m1</text>
  <circle cx="560.0" cy="120.0" r="30.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="560.0" y="126.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">m2</text>
  <line x1="370.0" y1="120.0" x2="449.6" y2="120.0" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M460.0 120.0 L448.2 125.5 L448.2 114.5 Z" fill="#1f6fb5"/>
  <text x="415.0" y="105.0" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700">v1</text>
  <line x1="600.0" y1="120.0" x2="649.6" y2="120.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M660.0 120.0 L648.2 125.5 L648.2 114.5 Z" fill="#d7322f"/>
  <text x="630.0" y="105.0" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700">v2</text>
  <text x="780.0" y="126.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="400">v1 &gt; v2</text>
  <circle cx="440.0" cy="245.0" r="30.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="440.0" y="251.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">m1</text>
  <circle cx="500.0" cy="245.0" r="30.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="500.0" y="251.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">m2</text>
  <line x1="405.0" y1="245.0" x2="340.4" y2="245.0" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M330.0 245.0 L341.8 239.5 L341.8 250.5 Z" fill="#1f6fb5"/>
  <text x="320.0" y="238.0" font-size="18" fill="#1f6fb5" text-anchor="end" font-weight="700">F' on m1</text>
  <line x1="535.0" y1="245.0" x2="599.6" y2="245.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M610.0 245.0 L598.2 250.5 L598.2 239.5 Z" fill="#d7322f"/>
  <text x="620.0" y="238.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700">F on m2</text>
  <text x="700.0" y="280.0" font-size="17" fill="#4b5563" text-anchor="middle" font-weight="400">F' = -F (Newton's third law)</text>
  <circle cx="330.0" cy="370.0" r="30.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="330.0" y="376.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">m1</text>
  <circle cx="600.0" cy="370.0" r="30.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="600.0" y="376.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">m2</text>
  <line x1="370.0" y1="370.0" x2="409.6" y2="370.0" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M420.0 370.0 L408.2 375.5 L408.2 364.5 Z" fill="#1f6fb5"/>
  <text x="395.0" y="355.0" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700">v1'</text>
  <line x1="640.0" y1="370.0" x2="749.6" y2="370.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M760.0 370.0 L748.2 375.5 L748.2 364.5 Z" fill="#d7322f"/>
  <text x="700.0" y="355.0" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700">v2'</text>
  <rect x="150.0" y="405.0" width="600.0" height="40.0" rx="8" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="450.0" y="431.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">m1 v1 + m2 v2 = m1 v1' + m2 v2'</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
