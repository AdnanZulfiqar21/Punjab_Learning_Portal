  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.2: octahedral [Fe(CN)6]4- in square brackets with its parts: Fe2+, six CN- ligands, coordination number 6, ligand charge -6, sphere charge -4. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Hexacyanoferrate(II): the parts of a complex</text>
  <line x1="215.0" y1="220.0" x2="215.0" y2="135.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="215.0" y="117.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <line x1="215.0" y1="220.0" x2="215.0" y2="305.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="215.0" y="335.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <line x1="215.0" y1="220.0" x2="130.0" y2="220.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="106.0" y="226.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NC</tspan></text>
  <line x1="215.0" y1="220.0" x2="300.0" y2="220.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="324.0" y="226.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <path d="M215.0 220.0 L159.9 262.3 L168.1 271.2 Z" stroke="#14181f" stroke-width="1" fill="#14181f" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="146.0" y="289.2" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NC</tspan></text>
  <line x1="220.3" y1="213.0" x2="222.5" y2="215.4" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="226.2" y1="206.7" x2="229.3" y2="210.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="232.2" y1="200.3" x2="236.1" y2="204.6" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="238.1" y1="194.0" x2="242.9" y2="199.2" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="244.1" y1="187.7" x2="249.7" y2="193.8" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="250.0" y1="181.4" x2="256.5" y2="188.4" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="256.0" y1="175.1" x2="263.3" y2="183.1" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="284.0" y="162.8" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <circle cx="215.0" cy="220.0" r="21.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="215.0" y="225.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Fe</tspan></text>
  <path d="M85.0 95.0 L70.0 95.0 L70.0 345.0 L85.0 345.0" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M345.0 95.0 L360.0 95.0 L360.0 345.0 L345.0 345.0" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="372.0" y="100.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">4-</text>
  <rect x="430.0" y="70.0" width="450.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="455.0" y="112.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">central metal ion: Fe</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan></text>
  <text x="455.0" y="154.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">ligand: CN</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> (cyano), monodentate</tspan></text>
  <text x="455.0" y="196.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">coordination number: 6</tspan></text>
  <text x="455.0" y="238.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">total charge of ligands: 6 x (-1) = -6</tspan></text>
  <text x="455.0" y="280.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">charge on metal: +2</tspan></text>
  <text x="455.0" y="322.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">charge on the sphere: +2 + (-6) = -4</tspan></text>
  <text x="215.0" y="392.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[Fe(CN)</tspan><tspan dy="5.8" font-size="12.6">6</tspan><tspan dy="-5.8">]</tspan><tspan dy="-7.6" font-size="12.6">4-</tspan></text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
