<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.26 and 3.28: a eukaryotic cilium in cross-section (9 + 2) and its basal body (9 triplets). -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:24px;font-weight:700;fill:#14181f}
      .s{font-size:20px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <g id="dbl"><circle cx="-11" cy="0" r="12" fill="#1f6fb5"/><circle cx="11" cy="0" r="12" fill="#8f78d9"/></g>
    <g id="trp"><circle cx="-22" cy="0" r="11" fill="#1f6fb5"/><circle cx="0" cy="0" r="11" fill="#8f78d9"/><circle cx="22" cy="0" r="11" fill="#1f6fb5"/></g>
  </defs>
  <text class="h" x="320" y="60">Axoneme of a cilium or flagellum</text>
  <text class="s" x="230" y="90">cross-section: "9 + 2"</text>
  <!-- plasma membrane ring -->
  <circle cx="320" cy="380" r="230" fill="#eef6fb" stroke="#1f6fb5" stroke-width="12"/>
  <!-- nine outer doublets -->
  <g transform="translate(320,380)">
    <g transform="rotate(0)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(40)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(80)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(120)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(160)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(200)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(240)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(280)"><use href="#dbl" x="0" y="-170"/></g>
    <g transform="rotate(320)"><use href="#dbl" x="0" y="-170"/></g>
    <!-- dynein arms between doublets -->
    <g fill="none" stroke="#d98b2b" stroke-width="5" stroke-linecap="round">
      <path transform="rotate(20)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(60)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(100)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(140)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(180)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(220)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(260)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(300)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
      <path transform="rotate(340)" d="M-40 -168 q0 -20 20 -24 M-40 -168 q0 20 20 24"/>
    </g>
    <!-- two central singlets -->
    <circle cx="-16" cy="0" r="14" fill="#0f7a62"/><circle cx="16" cy="0" r="14" fill="#0f7a62"/>
  </g>
  <path class="lead" d="M320 380 L540 480"/><text class="s" x="545" y="470">two central</text><text class="s" x="545" y="494">microtubules</text>
  <path class="lead" d="M310 210 L160 150"/><text class="t" x="40" y="140">Outer doublet</text><text class="s" x="40" y="165">one of nine</text>
  <path class="lead" d="M243 253 L120 240"/><text class="s" x="40" y="245" style="text-anchor:start">dynein arms</text>
  <path class="lead" d="M540 300 L560 220"/><text class="t" x="480" y="205">Plasma membrane</text>
  <!-- basal body -->
  <text class="h" x="880" y="60">Basal body (a centriole)</text>
  <text class="s" x="800" y="90">cross-section: nine triplets, no central pair</text>
  <circle cx="880" cy="380" r="200" fill="#fff" stroke="none"/>
  <g transform="translate(880,380)">
    <g transform="rotate(0)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(40)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(80)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(120)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(160)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(200)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(240)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(280)"><use href="#trp" x="0" y="-150"/></g>
    <g transform="rotate(320)"><use href="#trp" x="0" y="-150"/></g>
  </g>
  <path class="lead" d="M880 230 L1040 170"/><text class="t" x="1045" y="165">Triplet</text><text class="s" x="1045" y="190">one of nine</text>
  <text class="s" x="760" y="620">hollow, cylindrical; a pair lies</text><text class="s" x="760" y="646">at right angles near the nucleus</text>
  <text class="s" x="40" y="720">Both are built of microtubules; a prokaryotic flagellum is different, a filament of the protein flagellin with no microtubules.</text>
</svg>
