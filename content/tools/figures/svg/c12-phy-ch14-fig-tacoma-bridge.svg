<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920">
  <!-- Point to ponder! picture (C12-PHY, PDF p39): the collapse of the Tacoma Narrows Bridge, as printed in black and white: a tall tower on the left with its main cables sweeping up to the top right, the deck from the right ending in a broken edge near the tower, a long torn section of the deck hanging down and falling into the water, a cloud of spray, falling pieces, and a dark wooded hillside behind under a pale sky. Flat greyscale drawing after the printed photograph; no photograph is reproduced. -->
  <rect width="1100" height="920" fill="#ffffff"/>
  <rect x="20" y="20" width="1060" height="880" fill="#e6e6e3"/>
  <!-- wooded hillside -->
  <path d="M20 470 Q120 430 200 455 Q280 420 380 450 Q480 425 560 450 Q680 420 800 445 Q920 410 1080 440 L1080 830 L20 830 Z" fill="#5c5d58"/>
  <g fill="#4a4b46"><path d="M60 470 l12 -40 l12 40 Z M150 460 l12 -45 l12 45 Z M260 455 l10 -38 l10 38 Z M440 450 l12 -42 l12 42 Z M620 445 l12 -44 l12 44 Z M760 445 l12 -40 l12 40 Z M900 430 l14 -48 l14 48 Z M1000 440 l12 -42 l12 42 Z M1040 440 l12 -50 l12 50 Z"/></g>
  <path d="M20 650 Q300 630 600 660 Q850 690 1080 660 L1080 830 L20 830 Z" fill="#4f504b"/>
  <!-- water -->
  <rect x="20" y="830" width="1060" height="70" fill="#7b7c78"/>
  <!-- spray cloud -->
  <path d="M380 560 Q420 480 520 500 Q600 470 650 540 Q700 610 650 680 Q600 760 520 760 Q430 760 400 690 Q350 640 380 560 Z" fill="#a9a9a5" opacity="0.85"/>
  <!-- tower -->
  <g fill="#3b3c38" stroke="#262724" stroke-width="3">
    <rect x="270" y="110" width="26" height="760"/>
    <rect x="350" y="110" width="26" height="760"/>
    <rect x="270" y="110" width="106" height="22"/>
    <rect x="270" y="300" width="106" height="20"/>
    <rect x="262" y="96" width="122" height="16"/>
  </g>
  <!-- tower base / pier -->
  <path d="M180 650 L300 560 L400 560 L380 620 L300 640 L300 880 L180 880 Z" fill="#8a8a85" stroke="#4a4b46" stroke-width="3"/>
  <!-- main cables -->
  <g fill="none" stroke="#2b2c29" stroke-width="5">
    <path d="M290 115 Q420 450 640 380 Q760 310 800 20"/>
    <path d="M365 115 Q520 420 720 360 Q850 300 900 20"/>
    <path d="M280 120 Q220 300 210 560"/>
  </g>
  <g stroke="#6b6c68" stroke-width="2"><path d="M680 400 V20 M740 384 V20 M800 367 V20 M860 351 V20 M920 334 V20 M980 318 V20 M1040 301 V20"/></g>
  <!-- intact deck from the right -->
  <path d="M1080 290 L1080 345 Q900 390 700 440 L470 470 L440 520 L420 515 L455 445 L700 395 Q900 345 1080 290 Z" fill="#2f302d" stroke="#1d1e1b" stroke-width="3"/>
  <!-- lamp posts on the deck -->
  <g stroke="#2f302d" stroke-width="4"><path d="M780 380 L770 320 M880 352 L872 290 M960 330 L955 270 M1010 315 L1005 255"/></g>
  <!-- torn deck section falling -->
  <path d="M420 520 L450 525 Q520 700 560 870 L520 880 Q470 720 420 520 Z" fill="#9b9b96" stroke="#3b3c38" stroke-width="3"/>
  <g stroke="#55564f" stroke-width="2"><path d="M430 560 L465 555 M440 610 L480 600 M455 660 L495 650 M470 710 L508 700 M485 760 L522 750 M500 810 L535 800"/></g>
  <!-- falling pieces -->
  <path d="M560 560 L605 575 L595 635 L548 622 Z" fill="none" stroke="#3b3c38" stroke-width="4"/>
  <path d="M640 700 L655 760 L668 700" fill="none" stroke="#ffffff" stroke-width="8"/>
  <rect x="550" y="690" width="10" height="34" fill="#ffffff"/>
  <!-- bushes front right -->
  <path d="M960 900 Q960 800 1000 760 Q1040 740 1060 800 Q1080 840 1080 900 Z" fill="#3b3c38"/>
</svg>
