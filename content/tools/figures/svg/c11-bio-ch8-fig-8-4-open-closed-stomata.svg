<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="680" fill="#ffffff"/>
  <!-- Fig 8.4 (C11-BIO, PDF p183): scanning electron micrograph, no labels. A green-yellow surface of wavy, jigsaw-like epidermal cells with fine ridges; upper left a closed stoma lying on its side (two guard cells pressed together, the pore a thin slit); lower right an open stoma standing upright (two guard cells bowed apart round a dark pore). Clean flat drawing after the micrograph printed in the textbook; no photograph reproduced. -->
  <defs><clipPath id="sem"><rect x="20" y="20" width="960" height="640" rx="6"/></clipPath></defs>
  <g clip-path="url(#sem)">
    <rect x="20" y="20" width="960" height="640" fill="#9fb83a"/>
    <!-- wavy epidermal cells -->
    <g fill="#b6cc4a" stroke="#6d8a22" stroke-width="5" stroke-linejoin="round">
      <path d="M20 20 H 300 C 280 70 320 90 290 140 C 250 180 180 150 140 190 C 100 220 60 200 20 230 Z"/>
      <path d="M300 20 H 620 C 600 70 640 110 600 150 C 560 180 520 140 470 160 C 420 180 380 140 330 150 C 300 120 330 70 300 20 Z"/>
      <path d="M620 20 H 980 V 200 C 930 170 900 220 850 190 C 800 160 760 200 720 170 C 680 140 650 160 600 150 C 640 110 600 70 620 20 Z"/>
      <path d="M20 230 C 60 200 100 220 140 190 C 160 260 120 300 150 350 C 170 400 120 430 80 420 C 50 410 40 450 20 460 Z"/>
      <path d="M150 350 C 200 380 260 340 310 380 C 350 410 330 470 380 490 C 420 510 450 470 500 500 C 520 560 470 600 500 660 H 20 V 460 C 40 450 50 410 80 420 C 120 430 170 400 150 350 Z"/>
      <path d="M470 160 C 520 140 560 180 600 150 C 650 160 680 140 720 170 C 700 230 650 260 600 250 C 560 330 600 380 560 420 C 530 450 520 480 500 500 C 450 470 420 510 380 490 C 420 430 470 420 480 360 C 490 300 440 260 470 160 Z"/>
      <path d="M720 170 C 760 200 800 160 850 190 C 900 220 930 170 980 200 V 430 C 940 410 920 460 880 450 C 860 400 820 380 800 330 C 770 260 730 250 720 170 Z"/>
      <path d="M500 500 C 520 480 530 450 560 420 C 620 470 700 470 760 520 C 800 560 760 620 790 660 H 500 C 470 600 520 560 500 500 Z"/>
      <path d="M760 520 C 800 500 840 470 880 450 C 920 460 940 410 980 430 V 660 H 790 C 760 620 800 560 760 520 Z"/>
    </g>
    <!-- fine ridges -->
    <g stroke="#dce88a" stroke-width="3" fill="none" opacity="0.8">
      <path d="M40 120 C 120 100 200 130 260 100 M340 80 C 420 60 500 90 580 70 M660 80 C 740 60 840 100 940 80"/>
      <path d="M40 300 C 70 280 100 300 120 280 M200 440 C 260 420 330 460 400 440 M120 560 C 200 540 300 580 420 560"/>
      <path d="M520 220 C 560 210 600 230 640 210 M760 300 C 820 280 880 320 950 300 M560 560 C 620 540 680 580 740 560 M820 560 C 870 540 920 580 960 560"/>
    </g>
    <!-- closed stoma, upper left, lying on its side -->
    <g transform="rotate(-18 300 270)">
      <ellipse cx="300" cy="270" rx="125" ry="72" fill="#c9d65a" stroke="#6d8a22" stroke-width="6"/>
      <path d="M190 270 C 230 228 370 228 410 270 C 370 312 230 312 190 270 Z" fill="#d8e27a" stroke="#6d8a22" stroke-width="4"/>
      <path d="M200 270 H 400" stroke="#3a4a14" stroke-width="7" stroke-linecap="round"/>
      <path d="M230 250 C 280 238 330 238 380 250 M230 290 C 280 302 330 302 380 290" stroke="#a9bb48" stroke-width="3" fill="none"/>
    </g>
    <!-- open stoma, lower right, upright -->
    <g transform="rotate(18 690 470)">
      <ellipse cx="690" cy="470" rx="88" ry="140" fill="#c9d65a" stroke="#6d8a22" stroke-width="6"/>
      <path d="M690 345 C 640 390 640 550 690 595 C 740 550 740 390 690 345 Z" fill="#d8e27a" stroke="#6d8a22" stroke-width="4"/>
      <path d="M690 380 C 665 420 665 520 690 560 C 715 520 715 420 690 380 Z" fill="#141a08" stroke="#3a4a14" stroke-width="4"/>
      <path d="M650 400 C 640 450 640 500 652 545 M730 400 C 740 450 740 500 728 545" stroke="#a9bb48" stroke-width="3" fill="none"/>
    </g>
  </g>
</svg>
