<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 7.1 and 7.2: the five common clauses of terms of use with examples and users' rights, and a table matching spam, spyware, cookies, phishing and pharming to what they do and how to defend against them. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Terms of use, online threats and how to guard against them</text>
  <rect x="50" y="55" width="400" height="640" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="250" y="83">Terms of Use (7.1)</text>
  <rect x="70" y="100" width="360" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="195" y="120">User obligations</text>
  <text class="r" x="76" y="152">valid phone number, no misuse (Careem)</text>
  <rect x="70" y="178" width="360" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="171" y="198">Limitation of liability</text>
  <text class="r" x="76" y="230">bank app down: limited liability</text>
  <rect x="70" y="256" width="360" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="181" y="276">Privacy and data use</text>
  <text class="r" x="76" y="308">how messages are stored (WhatsApp)</text>
  <rect x="70" y="334" width="360" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="178" y="354">Intellectual property</text>
  <text class="r" x="76" y="386">no copying articles or logos</text>
  <rect x="70" y="412" width="360" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="174" y="432">Termination of service</text>
  <text class="r" x="76" y="464">accounts spreading hate can be suspended</text>
  <g class="r">
    <text x="70" y="510">they protect rights, give clarity and protect</text>
    <text x="70" y="526">the business; breaking them can mean fines,</text>
    <text x="70" y="542">lawsuits or a ban</text>
    <text x="70" y="574">your rights: privacy, being informed,</text>
    <text x="70" y="590">withdrawing consent, asking for your data</text>
    <text x="70" y="606">to be corrected or deleted</text>
  </g>
  <rect x="470" y="55" width="680" height="640" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="810" y="83">Threats and defences (7.2)</text>
  <text class="l" x="600" y="106" style="fill:#d7322f;text-anchor:middle">threat</text>
  <text class="l" x="820" y="106" style="text-anchor:middle">what it does</text>
  <text class="l" x="1050" y="106" style="fill:#0f7a62;text-anchor:middle">defence</text>
  <rect x="500" y="126" width="200" height="40" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="586" y="150">Spam</text>
  <g class="r">
    <text x="715" y="142">unwanted messages: fake prizes,</text>
    <text x="715" y="159">cheap loans; may trick you</text>
  </g>
  <path d="M936 146 L956 146" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="958" y="126" width="172" height="40" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="1013" y="150">spam filter</text>
  <rect x="500" y="218" width="200" height="40" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="576" y="242">Spyware</text>
  <g class="r">
    <text x="715" y="234">hidden software that watches</text>
    <text x="715" y="251">what you do</text>
  </g>
  <path d="M936 238 L956 238" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="958" y="218" width="172" height="40" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="1019" y="242">antivirus</text>
  <rect x="500" y="310" width="200" height="40" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="576" y="334">Cookies</text>
  <g class="r">
    <text x="715" y="326">small files that remember logins</text>
    <text x="715" y="343">but can track browsing</text>
  </g>
  <path d="M936 330 L956 330" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="958" y="310" width="172" height="40" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="1005" y="334">manage cookies</text>
  <rect x="500" y="402" width="200" height="40" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="572" y="426">Phishing</text>
  <g class="r">
    <text x="715" y="418">fake email or SMS 'from your</text>
    <text x="715" y="435">bank' asks for details</text>
  </g>
  <path d="M936 422 L956 422" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="958" y="402" width="172" height="40" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="982" y="426">check sender, no links</text>
  <rect x="500" y="494" width="200" height="40" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="572" y="518">Pharming</text>
  <g class="r">
    <text x="715" y="510">redirects you to a fake copy</text>
    <text x="715" y="527">of a real website</text>
  </g>
  <path d="M936 514 L956 514" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <rect x="958" y="494" width="172" height="40" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="980" y="518">check https and padlock</text>
  <g class="r">
    <text x="500" y="600">severity: spam is mostly a nuisance; spyware and cookies hurt privacy;</text>
    <text x="500" y="616">phishing and pharming can cause money loss and account takeover</text>
    <text x="500" y="632">use several defences together; report cyber crime to the official agency</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
