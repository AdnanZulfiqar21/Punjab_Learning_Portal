<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <!-- Original: IPv4 192.168.1.10 and IPv6 2001:0db8:85a3:0000:0000:8a2e:0370:7334 split into parts. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">IPv4 and IPv6 addresses (after the book's breakdown tables)</text>
  <text x="40.0" y="85.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">IPv4: 4 numbers (0-255), 8 bits each = 32 bits</text>
  <rect x="40.0" y="105.0" width="130.0" height="50.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="105.0" y="137.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">192</text>
  <text x="105.0" y="175.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">8 bits</text>
  <text x="180.0" y="140.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">.</text>
  <rect x="190.0" y="105.0" width="130.0" height="50.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="255.0" y="137.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">168</text>
  <text x="255.0" y="175.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">8 bits</text>
  <text x="330.0" y="140.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">.</text>
  <rect x="340.0" y="105.0" width="130.0" height="50.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="405.0" y="137.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <text x="405.0" y="175.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">8 bits</text>
  <text x="480.0" y="140.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">.</text>
  <rect x="490.0" y="105.0" width="130.0" height="50.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="555.0" y="137.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">10</text>
  <text x="555.0" y="175.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">8 bits</text>
  <text x="245.0" y="205.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">network part: 192.168.1 (like the street)</text>
  <text x="555.0" y="205.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">host part: 10 (like the house)</text>
  <text x="40.0" y="255.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">IPv6: 8 groups of 4 hex digits, 16 bits each = 128 bits</text>
  <rect x="40.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="87.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">2001</text>
  <rect x="144.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="191.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">0db8</text>
  <rect x="248.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="295.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">85a3</text>
  <rect x="352.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="399.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">0000</text>
  <rect x="456.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="503.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">0000</text>
  <rect x="560.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="607.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">8a2e</text>
  <rect x="664.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="711.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">0370</text>
  <rect x="768.0" y="275.0" width="94.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="815.0" y="304.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">7334</text>
  <text x="180.0" y="345.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">global routing prefix (48 bits)</text>
  <text x="180.0" y="362.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">ISP or region</text>
  <text x="399.0" y="345.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">subnet ID (16)</text>
  <text x="399.0" y="362.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">local network</text>
  <text x="659.0" y="345.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">interface ID (64 bits)</text>
  <text x="659.0" y="362.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">the device</text>
  <text x="450.0" y="400.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">IPv4: about 4.29 billion addresses (2^32); IPv6: about 3.4 x 10^38 (2^128).</text>
  <text x="450.0" y="421" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
