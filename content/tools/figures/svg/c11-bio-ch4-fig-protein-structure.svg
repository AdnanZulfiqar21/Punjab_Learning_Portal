<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.27 and 4.29: the four levels of protein structure, with insulin and haemoglobin. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- primary -->
  <text class="h" x="180" y="50">Primary</text>
  <text class="s" x="180" y="78">linear sequence of amino acids</text>
  <g>
    <circle cx="70" cy="200" r="16" fill="#1f6fb5"/><circle cx="106" cy="200" r="16" fill="#d98b2b"/><circle cx="142" cy="200" r="16" fill="#0f7a62"/><circle cx="178" cy="200" r="16" fill="#5b3fb5"/><circle cx="214" cy="200" r="16" fill="#d98b2b"/><circle cx="250" cy="200" r="16" fill="#1f6fb5"/><circle cx="286" cy="200" r="16" fill="#0f7a62"/>
    <path d="M86 200 H90 M122 200 H126 M158 200 H162 M194 200 H198 M230 200 H234 M266 200 H270" stroke="#14181f" stroke-width="4"/>
  </g>
  <text class="s" x="180" y="260">peptide bonds; number, type and</text><text class="s" x="180" y="286">order set by the DNA</text>
  <text class="s" x="180" y="330">insulin: alpha chain 21, beta 30</text>
  <!-- secondary -->
  <text class="h" x="480" y="50">Secondary</text>
  <text class="s" x="480" y="78">coiling or folding of the chain</text>
  <path d="M400 130 q25 -25 50 0 t50 0 M400 160 q25 -25 50 0 t50 0 M400 190 q25 -25 50 0 t50 0 M400 220 q25 -25 50 0 t50 0" fill="none" stroke="#1f6fb5" stroke-width="8" stroke-linecap="round"/>
  <text class="s" x="450" y="260">alpha helix</text>
  <path d="M540 130 l20 20 l-20 20 l20 20 l-20 20 l20 20 M570 130 l20 20 l-20 20 l20 20 l-20 20 l20 20" fill="none" stroke="#d98b2b" stroke-width="8" stroke-linejoin="round"/>
  <text class="s" x="565" y="260">pleated sheet</text>
  <text class="s" x="480" y="310">held by hydrogen bonds between</text><text class="s" x="480" y="336">amino and carboxyl groups</text>
  <!-- tertiary -->
  <text class="h" x="780" y="50">Tertiary</text>
  <text class="s" x="780" y="78">folds into a globular shape</text>
  <path d="M720 130 q60 -20 80 30 q20 60 -40 70 q-60 10 -40 -40 q10 -30 60 -20 q50 20 20 70 q-30 40 -70 10" fill="none" stroke="#0f7a62" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#d98b2b" stroke-width="4" stroke-dasharray="5 4"><path d="M740 165 L770 200 M790 150 L800 190"/></g>
  <text class="s" x="770" y="300">ionic, hydrogen, disulphide bonds;</text><text class="s" x="770" y="326">hydrophobic R groups buried inside,</text><text class="s" x="770" y="352">hydrophilic ones face the water</text>
  <!-- quaternary -->
  <text class="h" x="1050" y="50">Quaternary</text>
  <text class="s" x="1060" y="78">several folded chains together</text>
  <g>
    <path d="M980 140 q40 -30 70 10 q10 40 -30 50 q-40 0 -40 -60" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="5"/>
    <path d="M1060 140 q40 -30 70 10 q10 40 -30 50 q-40 0 -40 -60" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
    <path d="M980 220 q40 -30 70 10 q10 40 -30 50 q-40 0 -40 -60" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
    <path d="M1060 220 q40 -30 70 10 q10 40 -30 50 q-40 0 -40 -60" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="5"/>
  </g>
  <text class="s" x="1065" y="300">haemoglobin: 2 alpha (141)</text><text class="s" x="1065" y="326">and 2 beta (146) chains</text>
  <path d="M320 400 L380 400" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><path d="M620 400 L680 400" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><path d="M900 400 L960 400" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="600" y="470">Fibrous proteins stop at primary or secondary structure (silk, keratin, collagen, fibrin): structural, insoluble, elastic.</text>
  <text class="s" x="600" y="500">Globular proteins reach tertiary or quaternary structure (enzymes, antibodies, haemoglobin, some hormones): functional, soluble.</text>
  <!-- sickle cell inset -->
  <text class="h" x="600" y="580">Why the sequence matters: sickle cell haemoglobin</text>
  <g font-family="Consolas, Courier New, monospace" font-size="22" text-anchor="middle" fill="#14181f">
    <text x="420" y="640">normal beta chain:  Val-His-Leu-Thr-Pro-</text><text x="700" y="640" fill="#0f7a62" font-weight="700">Glu</text><text x="760" y="640">-Glu ...</text>
    <text x="420" y="690">sickle beta chain:  Val-His-Leu-Thr-Pro-</text><text x="700" y="690" fill="#d7322f" font-weight="700">Val</text><text x="760" y="690">-Glu ...</text>
  </g>
  <text class="s" x="600" y="740">One amino acid at position 6 of each beta chain is wrong (valine instead of glutamic acid): red cells become</text>
  <text class="s" x="600" y="766">sickle-shaped and carry too little oxygen (sickle cell anaemia).</text>
</svg>
