<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <!-- Original: examples of propositions and of sentences that are not propositions. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Propositions: statements that are either true or false (after Fig 2.3)</text>
  <rect x="15.0" y="55.0" width="430.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">propositions</text>
  <rect x="35.0" y="109.0" width="390.0" height="56.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="50.0" y="135.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">P: The sun rises in the east.</text>
  <text x="50.0" y="155.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">value: true</text>
  <rect x="35.0" y="191.0" width="390.0" height="56.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="50.0" y="217.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">Q: 2 + 2 = 5</text>
  <text x="50.0" y="237.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">value: false</text>
  <rect x="35.0" y="273.0" width="390.0" height="56.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="50.0" y="299.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">R: It is raining.</text>
  <text x="50.0" y="319.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">value: true or false today</text>
  <text x="230.0" y="385.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">exactly one value, never both</text>
  <rect x="460.0" y="55.0" width="425.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">not propositions</text>
  <rect x="480.0" y="109.0" width="385.0" height="56.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="495.0" y="135.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">Close the door.</text>
  <text x="495.0" y="155.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">a command</text>
  <rect x="480.0" y="191.0" width="385.0" height="56.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="495.0" y="217.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">What time is it?</text>
  <text x="495.0" y="237.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">a question</text>
  <rect x="480.0" y="273.0" width="385.0" height="56.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="495.0" y="299.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">x is greater than 5</text>
  <text x="495.0" y="319.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">depends on x (a predicate)</text>
  <text x="672.0" y="385.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">no fixed true or false value</text>
  <text x="450.0" y="421" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
