<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis3-5 (C11-PHY, PDF p61): Tid-bits photograph of a banked race track (no printed caption number); flat drawing after the printed photograph: a pack of colourful racing cars sweeps round a steeply banked grey curve, the outer edge (top) higher than the inner edge, with a white lane line and a pale apron on the inside of the turn. No photograph is reproduced. -->
  <defs>
    <clipPath id="frame"><rect x="20" y="20" width="960" height="660"/></clipPath>
    <linearGradient id="bank" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d8288"/><stop offset="1" stop-color="#4d5156"/></linearGradient>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="960" height="660" fill="#2f3236"/>
    <!-- outer wall (high side) -->
    <path d="M20 20 L980 20 L980 70 Q600 110 20 120 Z" fill="#c9ccd0"/>
    <path d="M20 120 Q600 110 980 70" stroke="#9a9ea3" stroke-width="8" fill="none"/>
    <!-- banked racing surface curving round to the lower right -->
    <path d="M20 125 Q600 115 980 75 L980 420 Q830 470 760 680 L20 680 Z" fill="url(#bank)"/>
    <!-- inner apron and infield -->
    <path d="M980 420 Q830 470 760 680 L980 680 Z" fill="#1f2124"/>
    <path d="M980 470 Q870 500 815 680" stroke="#a7abb0" stroke-width="40" fill="none"/>
    <!-- white lane line -->
    <path d="M20 560 Q520 520 760 420 Q860 380 980 330" stroke="#f2f2f2" stroke-width="6" fill="none"/>
    <!-- cars (seen from above, pointing round the curve to the right) -->
    <g stroke="#1b1b1b" stroke-width="2">
      <g transform="translate(140 470) rotate(-12)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#e03b2f"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(150 560) rotate(-12)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#2d6fd6"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(270 430) rotate(-14)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#f2c230"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(290 520) rotate(-14)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#36a852"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(240 340) rotate(-10)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#7a4fc4"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(400 380) rotate(-16)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#f07c2a"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(420 470) rotate(-18)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#e8e8e8"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(390 270) rotate(-10)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#2d6fd6"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(540 320) rotate(-18)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#d8d8d8"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(540 210) rotate(-8)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#e03b2f"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(680 250) rotate(-16)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#36a852"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(700 160) rotate(-8)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#e8e8e8"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(840 200) rotate(-14)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#f2c230"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(860 120) rotate(-6)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#2d6fd6"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
      <g transform="translate(560 560) rotate(-30)"><rect x="-55" y="-24" width="110" height="48" rx="14" fill="#2348a8"/><rect x="-10" y="-16" width="34" height="32" rx="6" fill="#2a2a2a"/></g>
    </g>
  </g>
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#9aa3ad" stroke-width="2"/>
</svg>
