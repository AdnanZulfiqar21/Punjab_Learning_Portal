<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original diagram after Figure 17.3: GnRH from the hypothalamus makes the anterior pituitary release FSH (to Sertoli cells, spermatogenesis) and LH (to Leydig cells, testosterone), with inhibin and testosterone feeding back. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Hormonal control of the male reproductive system</text>
  <rect x="320.0" y="61.0" width="260.0" height="48.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="450.0" y="90.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">hypothalamus: GnRH</text>
  <rect x="320.0" y="161.0" width="260.0" height="48.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="450.0" y="190.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">anterior pituitary</text>
  <rect x="90.0" y="271.0" width="260.0" height="48.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="220.0" y="292.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Sertoli cells (in the</text>
  <text x="220.0" y="308.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">seminiferous tubules)</text>
  <rect x="550.0" y="271.0" width="260.0" height="48.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="680.0" y="292.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Leydig cells (between</text>
  <text x="680.0" y="308.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the tubules)</text>
  <rect x="90.0" y="376.0" width="260.0" height="48.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="220.0" y="405.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">spermatogenesis</text>
  <rect x="550.0" y="376.0" width="260.0" height="48.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="680.0" y="397.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">testosterone: germinal</text>
  <text x="680.0" y="413.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">epithelium, male traits</text>
  <line x1="450.0" y1="109.0" x2="450.0" y2="153.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 161.0 L445.8 151.9 L454.2 151.9 Z" fill="#7c3aed"/>
  <line x1="400.0" y1="209.0" x2="267.3" y2="267.8" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M260.0 271.0 L266.6 263.5 L270.0 271.2 Z" fill="#1f6fb5"/>
  <text x="300.0" y="236.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">FSH</text>
  <line x1="500.0" y1="209.0" x2="632.7" y2="267.8" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M640.0 271.0 L630.0 271.2 L633.4 263.5 Z" fill="#d7322f"/>
  <text x="600.0" y="236.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">LH</text>
  <line x1="220.0" y1="319.0" x2="220.0" y2="368.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220.0 376.0 L215.8 366.9 L224.2 366.9 Z" fill="#1f6fb5"/>
  <line x1="680.0" y1="319.0" x2="680.0" y2="368.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M680.0 376.0 L675.8 366.9 L684.2 366.9 Z" fill="#d7322f"/>
  <path d="M90 295 C40 260 60 190 320 185" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M320.0 185.0 L310.9 189.2 L310.9 180.8 Z" fill="#4b5563"/>
  <text x="60.0" y="240.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">inhibin:</text>
  <text x="60.0" y="256.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">stops FSH</text>
  <path d="M810 400 C880 360 880 120 580 85" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M580.0 85.0 L589.4 81.6 L588.7 90.0 Z" fill="#4b5563"/>
  <text x="780.0" y="200.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">testosterone</text>
  <text x="780.0" y="216.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">stops LH, GnRH</text>
  <text x="450.0" y="456.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">dashed arrows: negative feedback</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
