<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figs 15.11 to 15.15: rays reflected from the top and bottom of a thin film, an air wedge between two glass plates with alternating fringes and a dark line of contact, and Newton's rings: a plano-convex lens on flat glass giving concentric rings with a dark centre. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Thin films, the air wedge and Newton's rings (after Figs 15.11 to 15.15)</text>
  <rect x="15.0" y="55.0" width="430.0" height="220.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">thin film of thickness t (Fig 15.11)</text>
  <rect x="40.0" y="170.0" width="380.0" height="40.0" rx="0" stroke="#1f6fb5" stroke-width="1.6" fill="#dbeafe"/>
  <text x="400.0" y="196.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">film, index n</text>
  <text x="60.0" y="150.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">air</text>
  <line x1="100.0" y1="100.0" x2="174.6" y2="165.3" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M180.0 170.0 L171.4 167.5 L176.4 161.8 Z" fill="#7c3aed"/>
  <line x1="180.0" y1="170.0" x2="254.6" y2="104.7" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M260.0 100.0 L256.4 108.2 L251.4 102.5 Z" fill="#7c3aed"/>
  <line x1="180.0" y1="170.0" x2="220.0" y2="208.0" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="220.0" y1="208.0" x2="260.0" y2="170.0" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="260.0" y1="170.0" x2="334.6" y2="104.7" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M340.0 100.0 L336.4 108.2 L331.4 102.5 Z" fill="#7c3aed"/>
  <line x1="430.0" y1="179.8" x2="430.0" y2="200.2" stroke="#14181f" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M430.0 205.0 L427.5 199.6 L432.5 199.6 Z" fill="#14181f"/>
  <path d="M430.0 175.0 L432.5 180.4 L427.5 180.4 Z" fill="#14181f"/>
  <text x="426.0" y="230.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">t</text>
  <text x="230.0" y="245.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">one ray reflects at the top surface, the other at the</text>
  <text x="230.0" y="260.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">bottom; they interfere differently for each colour</text>
  <rect x="455.0" y="55.0" width="430.0" height="220.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">air wedge (Fig 15.13)</text>
  <path d="M480.0 210.0 L860.0 210.0 L860.0 222.0 L480.0 222.0 Z" stroke="#4b5563" stroke-width="1.5" fill="#e0f2fe" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M480.0 208.0 L860.0 170.0 L860.0 182.0 L480.0 220.0 Z" stroke="#4b5563" stroke-width="1.5" fill="#e0f2fe" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="845.0" y="182.0" width="10.0" height="28.0" rx="0" stroke="#14181f" stroke-width="1" fill="#9ca3af"/>
  <text x="870.0" y="196.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">h</text>
  <line x1="522.0" y1="150.0" x2="522.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="564.0" y1="150.0" x2="564.0" y2="165.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="606.0" y1="150.0" x2="606.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="648.0" y1="150.0" x2="648.0" y2="165.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="690.0" y1="150.0" x2="690.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="732.0" y1="150.0" x2="732.0" y2="165.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="774.0" y1="150.0" x2="774.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="816.0" y1="150.0" x2="816.0" y2="165.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <text x="670.0" y="240.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">path difference about 2t; the line of contact</text>
  <text x="670.0" y="255.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">is dark because one reflection has a half-cycle shift</text>
  <rect x="15.0" y="290.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="320.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">Newton's rings (Figs 15.14 and 15.15)</text>
  <path d="M80 380 Q230 470 380 380 Z" stroke="#1f6fb5" stroke-width="1.8" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="60.0" y1="425.0" x2="400.0" y2="425.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="230.0" y="455.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">plano-convex lens on a flat glass plate</text>
  <text x="230.0" y="475.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(a thin air film between them)</text>
  <circle cx="610.0" cy="415.0" r="66.3" stroke="none" stroke-width="0" fill="#f3f4f6"/>
  <circle cx="610.0" cy="415.0" r="59.5" stroke="none" stroke-width="0" fill="#1f2937"/>
  <circle cx="610.0" cy="415.0" r="52.7" stroke="none" stroke-width="0" fill="#f3f4f6"/>
  <circle cx="610.0" cy="415.0" r="45.9" stroke="none" stroke-width="0" fill="#1f2937"/>
  <circle cx="610.0" cy="415.0" r="39.1" stroke="none" stroke-width="0" fill="#f3f4f6"/>
  <circle cx="610.0" cy="415.0" r="32.3" stroke="none" stroke-width="0" fill="#1f2937"/>
  <circle cx="610.0" cy="415.0" r="25.5" stroke="none" stroke-width="0" fill="#f3f4f6"/>
  <circle cx="610.0" cy="415.0" r="18.7" stroke="none" stroke-width="0" fill="#1f2937"/>
  <circle cx="610.0" cy="415.0" r="11.9" stroke="none" stroke-width="0" fill="#f3f4f6"/>
  <circle cx="610.0" cy="415.0" r="8.0" stroke="#14181f" stroke-width="1" fill="#111827"/>
  <text x="740.0" y="360.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dark centre:</text>
  <text x="740.0" y="378.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the film is</text>
  <text x="740.0" y="396.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">almost zero thick</text>
  <text x="740.0" y="414.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">and one reflection</text>
  <text x="740.0" y="432.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">is shifted by half</text>
  <text x="740.0" y="450.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">a cycle</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
