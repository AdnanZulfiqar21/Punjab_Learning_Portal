<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- As printed on p108 (23.4): two ethanoic acid molecules joined in a ring by two O...H-O hydrogen bonds (dashed), delta- on each C=O oxygen and delta+ on each O-H hydrogen. The printed label 'Dimeric from' is spelt 'Dimeric form'. -->
  <text x="300.0" y="242.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">C</tspan></text>
  <text x="200.0" y="242.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="10.2" font-size="24.5">3</tspan><tspan dy="-10.2">C</tspan></text>
  <text x="370.0" y="122.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">O</tspan></text>
  <text x="370.0" y="362.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">OH</tspan></text>
  <text x="600.0" y="242.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">C</tspan></text>
  <text x="700.0" y="242.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="10.2" font-size="24.5">3</tspan><tspan dy="-10.2"></tspan></text>
  <text x="530.0" y="122.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">HO</tspan></text>
  <text x="530.0" y="362.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">O</tspan></text>
  <line x1="281.0" y1="230.0" x2="236.0" y2="230.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="305.2" y1="207.3" x2="352.8" y2="125.7" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="317.2" y1="214.3" x2="364.8" y2="132.7" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="311.2" y1="249.2" x2="357.8" y2="329.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="619.0" y1="230.0" x2="664.0" y2="230.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="588.8" y1="210.8" x2="542.2" y2="131.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="594.8" y1="252.7" x2="547.2" y2="334.3" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="582.8" y1="245.7" x2="535.2" y2="327.3" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="392.0" y1="110.0" x2="500.0" y2="110.0" stroke="#c2185b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <line x1="408.0" y1="350.0" x2="510.0" y2="350.0" stroke="#c2185b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <text x="370.0" y="62.0" font-size="26" fill="#1a9fd0" text-anchor="middle" font-weight="400"><tspan dy="0.0">&#948;&#8722;</tspan></text>
  <text x="512.0" y="62.0" font-size="26" fill="#1a9fd0" text-anchor="middle" font-weight="400"><tspan dy="0.0">&#948;+</tspan></text>
  <text x="393.0" y="305.0" font-size="26" fill="#1a9fd0" text-anchor="middle" font-weight="400"><tspan dy="0.0">&#948;+</tspan></text>
  <text x="530.0" y="305.0" font-size="26" fill="#1a9fd0" text-anchor="middle" font-weight="400"><tspan dy="0.0">&#948;&#8722;</tspan></text>
  <text x="450.0" y="425.0" font-size="26" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">Dimeric form of acetic acid formed due to the hydrogen bonding</tspan></text>
</svg>
