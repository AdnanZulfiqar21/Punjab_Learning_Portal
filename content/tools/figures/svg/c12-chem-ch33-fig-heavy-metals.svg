<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topic 33.3: sources and health effects of mercury (including methylmercury and Minamata disease), lead (anaemia, nervous-system damage) and cadmium (itai-itai disease, kidney damage), and Cd2+ replacing Ca2+ in bone. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Heavy metals in water: sources and health effects</text>
  <rect x="15.0" y="55.0" width="280.0" height="345.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="155.0" y="85.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">mercury (Hg)</text>
  <text x="31.0" y="115.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">sources:</text>
  <text x="31.0" y="142.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">coal burning, gold mining,</text>
  <text x="31.0" y="169.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">thermometer and battery industries;</text>
  <text x="31.0" y="196.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">bacteria in sediments make</text>
  <text x="31.0" y="223.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">methylmercury, [CH3Hg]+</text>
  <text x="31.0" y="250.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">effects:</text>
  <text x="31.0" y="277.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">fat-soluble; biomagnifies;</text>
  <text x="31.0" y="304.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">neurotoxin that crosses the</text>
  <text x="31.0" y="331.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">blood-brain barrier; Minamata</text>
  <text x="31.0" y="358.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">disease (ataxia, numbness)</text>
  <rect x="310.0" y="55.0" width="280.0" height="345.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="450.0" y="85.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700">lead (Pb)</text>
  <text x="326.0" y="115.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">sources:</text>
  <text x="326.0" y="142.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">leaded petrol (now banned),</text>
  <text x="326.0" y="169.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">old lead pipes (Pb2+ by corrosion),</text>
  <text x="326.0" y="196.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">lead-acid batteries, paints</text>
  <text x="326.0" y="223.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="326.0" y="250.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">effects:</text>
  <text x="326.0" y="277.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">interferes with haemoglobin</text>
  <text x="326.0" y="304.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">production: anaemia;</text>
  <text x="326.0" y="331.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">children: irreversible damage</text>
  <text x="326.0" y="358.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">to the nervous system</text>
  <rect x="605.0" y="55.0" width="280.0" height="345.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="745.0" y="85.0" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="700">cadmium (Cd)</text>
  <text x="621.0" y="115.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">sources:</text>
  <text x="621.0" y="142.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">metal plating, plastic</text>
  <text x="621.0" y="169.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">stabilisers, impurities in</text>
  <text x="621.0" y="196.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">phosphate fertilisers</text>
  <text x="621.0" y="223.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="621.0" y="250.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">effects:</text>
  <text x="621.0" y="277.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">replaces calcium in bones:</text>
  <text x="621.0" y="304.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">itai-itai disease (brittle</text>
  <text x="621.0" y="331.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">bones); severe kidney</text>
  <text x="621.0" y="358.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">damage (nephrotoxicity)</text>
  <rect x="15.0" y="415.0" width="870.0" height="120.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <circle cx="110.0" cy="475.0" r="36.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="110.0" y="481.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-7.1" font-size="11.9">2+</tspan></text>
  <line x1="155.0" y1="475.0" x2="237.8" y2="475.0" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M245.0 475.0 L236.8 478.8 L236.8 471.2 Z" fill="#d7322f"/>
  <circle cx="290.0" cy="475.0" r="34.0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="290.0" y="481.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cd</tspan><tspan dy="-7.1" font-size="11.9">2+</tspan></text>
  <text x="350.0" y="465.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Cd2+ has the same charge as Ca2+ and a very similar size,</text>
  <text x="350.0" y="487.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">so it can take the place of Ca2+ in bone and weaken it.</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
