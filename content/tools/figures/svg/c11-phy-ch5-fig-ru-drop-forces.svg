<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Arial, Helvetica, sans-serif">
  <!-- Roman Urdu lesson only (our own sketch, not a book figure), topic 5.14: forces on a falling water drop; its weight w = mg acts down and the air drag F = 6 pi eta r v acts up, opposite to its velocity v. -->
  <rect width="900" height="760" fill="#ffffff"/>
  <path d="M450 260 C480 320 530 370 530 420 C530 470 490 500 450 500 C410 500 370 470 370 420 C370 370 420 320 450 260 Z" fill="#a9dcf5" stroke="#1f6f9c" stroke-width="3"/>
  <circle cx="450.0" cy="410.0" r="6.0" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>
  <line x1="450.0" y1="410.0" x2="450.0" y2="697.6" stroke="#d6342c" stroke-width="7" stroke-linecap="butt"/>
  <path d="M450.0 720.0 L438.2 692.0 L461.8 692.0 Z" fill="#d6342c"/>
  <text x="474.0" y="690.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">weight <tspan font-style="italic">w</tspan> = <tspan font-style="italic">mg</tspan></text>
  <line x1="450.0" y1="410.0" x2="450.0" y2="62.4" stroke="#1d9a52" stroke-width="7" stroke-linecap="butt"/>
  <path d="M450.0 40.0 L461.8 68.0 L438.2 68.0 Z" fill="#1d9a52"/>
  <text x="474.0" y="70.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">drag <tspan font-style="italic">F</tspan> = 6π<tspan font-style="italic">ηrv</tspan></text>
  <line x1="200.0" y1="260.0" x2="200.0" y2="500.8" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M200.0 520.0 L189.9 496.0 L210.1 496.0 Z" fill="#1a1a1a"/>
  <text x="180.0" y="400.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">v</tspan></text>
</svg>
