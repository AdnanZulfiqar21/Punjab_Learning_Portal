<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after topics 9.8 (salt hydrolysis) to 9.9.2, Figures 9.3 and 9.4 and Table 9.7: two titration curves (schematic), indicator ranges and salt hydrolysis. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Titration curves, indicators and salt hydrolysis</text>
  <!-- graph 1: strong acid - strong base -->
  <text class="k" x="235" y="66">HCl titrated with NaOH (Figure 9.3, schematic)</text>
  <rect x="70" y="179" width="330" height="40" fill="#f3c2d8" opacity="0.6"/>
  <rect x="70" y="301" width="330" height="28" fill="#f9d9a6" opacity="0.7"/>
  <path d="M70 400 V80 M70 400 H410" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" fill="#4b5563" text-anchor="end"><text x="64" y="404">0</text><text x="64" y="249">7</text><text x="64" y="94">14</text></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="70" y="418">0</text><text x="235" y="418">25</text><text x="400" y="418">50</text></g>
  <text class="s" x="235" y="438">volume of NaOH added, cm3</text>
  <text class="t" x="40" y="240" transform="rotate(-90 40 240)" style="text-anchor:middle">pH</text>
  <path d="M70 378 C 160 374, 220 345, 231 300 L 239 190 C 250 140, 310 122, 400 116" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M70 245 H235" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="235" cy="245" r="5" fill="#14181f"/>
  <text class="t" x="250" y="262" style="font-size:12px;font-weight:700;fill:#14181f">equivalence point, pH 7.0</text>
  <text class="t" x="250" y="278" style="font-size:12px">steep jump from about pH 4 to 10</text>
  <text class="t" x="80" y="195" style="font-size:11px;fill:#b0306e">phenolphthalein 8.2 to 10.0</text>
  <text class="t" x="80" y="322" style="font-size:11px;fill:#b5600f">methyl orange 3.2 to 4.5</text>
  <text class="t" x="76" y="352" style="font-size:11px">pH very low at start</text>
  <!-- graph 2: weak base titrated with strong acid -->
  <text class="k" x="605" y="66">NH3(aq) titrated with HCl (Figure 9.4, schematic)</text>
  <rect x="440" y="301" width="330" height="28" fill="#f9d9a6" opacity="0.7"/>
  <path d="M440 400 V80 M440 400 H780" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" fill="#4b5563" text-anchor="end"><text x="434" y="404">0</text><text x="434" y="249">7</text><text x="434" y="94">14</text></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="440" y="418">0</text><text x="605" y="418">25</text><text x="770" y="418">50</text></g>
  <text class="s" x="605" y="438">volume of HCl added, cm3</text>
  <path d="M440 155 C 500 172, 560 190, 596 232 L 611 325 C 625 352, 680 362, 770 368" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M440 284 H605" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="605" cy="284" r="5" fill="#14181f"/>
  <text class="t" x="618" y="270" style="font-size:12px;font-weight:700;fill:#14181f">equivalence point, pH 5.27</text>
  <text class="t" x="618" y="286" style="font-size:12px">NH4+ gives NH3 + H+: acidic</text>
  <text class="t" x="452" y="118" style="font-size:11px">weak base: start above 7 but below a strong base</text>
  <text class="t" x="452" y="134" style="font-size:11px">buffer-like region: pH falls gradually</text>
  <text class="t" x="450" y="322" style="font-size:11px;fill:#b5600f">methyl orange changes here</text>
  <text class="t" x="665" y="340" style="font-size:11px">excess strong acid</text>
  <!-- indicators box -->
  <rect x="810" y="50" width="340" height="395" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="980" y="78">Acid-base indicators (9.9)</text>
  <g class="f">
    <text x="830" y="106">HIn  =  H+ + In-</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="830" y="128">acid: H+ drives it to HIn (acid colour)</text>
    <text x="830" y="146">base: OH- removes H+, more In- (base colour)</text>
    <text x="830" y="164">weak organic acids or bases; range about 2 pH units</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="830" y="196">Indicator</text><text x="960" y="196">Colours</text><text x="1075" y="196">pH range</text></g>
    <text x="830" y="220">methyl orange</text><text x="960" y="220">orange to yellow</text><text x="1075" y="220">3.2 to 4.5</text>
    <text x="830" y="240">methyl red</text><text x="960" y="240">red to yellow</text><text x="1075" y="240">4.4 to 6.2</text>
    <text x="830" y="260">phenolphthalein</text><text x="960" y="260">colourless to red</text><text x="1075" y="260">8.2 to 10.0</text>
  </g>
  <path d="M825 204 H1140" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="830" y="292">choosing (9.9.1): the indicator's change should be</text>
    <text x="830" y="310">close to the equivalence point and sharp</text>
    <text x="830" y="336">strong acid - strong base: phenolphthalein</text>
    <text x="830" y="354">(or methyl orange; Table 9.7)</text>
    <text x="830" y="372">strong acid - weak base: methyl orange</text>
    <text x="830" y="390">weak acid - strong base: phenolphthalein</text>
    <text x="830" y="416">end point: colour change; equivalence point:</text>
    <text x="830" y="434">titrant exactly neutralises the analyte</text>
  </g>
  <!-- hydrolysis -->
  <rect x="50" y="465" width="1100" height="185" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="493">Salt hydrolysis: which ion reacts with water decides the pH</text>
  <g font-size="13" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="160" y="522">Salt from</text><text x="360" y="522">Example</text><text x="700" y="522">Ion that hydrolyses</text><text x="1040" y="522">Solution</text></g>
    <text x="160" y="548">strong acid + strong base</text><text x="360" y="548">NaCl</text><text x="700" y="548">neither Na+ nor Cl- reacts</text><text x="1040" y="548">neutral</text>
    <text x="160" y="572">strong acid + weak base</text><text x="360" y="572">NH4Cl</text><text x="700" y="572">NH4+ + H2O gives NH3 + H3O+</text><text x="1040" y="572">acidic</text>
    <text x="160" y="596">weak acid + strong base</text><text x="360" y="596">CH3COONa</text><text x="700" y="596">CH3COO- + H2O gives CH3COOH + OH-</text><text x="1040" y="596">basic</text>
    <text x="160" y="620">weak acid + weak base</text><text x="360" y="620">NH4CH3COO</text><text x="700" y="620">both NH4+ and CH3COO- hydrolyse</text><text x="1040" y="620">depends on relative strengths</text>
  </g>
  <path d="M80 532 H1120" stroke="#9ca3af" stroke-width="1"/>
  <text class="s" x="600" y="642" style="font-size:11px">Curves are schematic after Figures 9.3 and 9.4; indicator colours and ranges as printed in Table 9.7 and the text.</text>
</svg>
