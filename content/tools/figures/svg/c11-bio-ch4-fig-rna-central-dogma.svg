<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.45 and 4.46: the three RNAs and the central dogma. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .t{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:26px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="50">Three kinds of RNA, all single-stranded ribonucleotide chains</text>
  <!-- mRNA: straight single strand with bases -->
  <text class="t" x="200" y="110">mRNA</text>
  <path d="M60 170 H340" stroke="#d98b2b" stroke-width="8" stroke-linecap="round"/>
  <g fill="#5b3fb5"><rect x="80" y="178" width="18" height="26" rx="4"/><rect x="120" y="178" width="18" height="26" rx="4"/><rect x="160" y="178" width="18" height="26" rx="4"/><rect x="200" y="178" width="18" height="26" rx="4"/><rect x="240" y="178" width="18" height="26" rx="4"/><rect x="280" y="178" width="18" height="26" rx="4"/><rect x="320" y="178" width="18" height="26" rx="4"/></g>
  <text class="s" x="200" y="250">messenger: copy of one DNA strand;</text><text class="s" x="200" y="276">carries the message to the ribosome;</text><text class="s" x="200" y="302">3 to 4 percent of cell RNA</text>
  <!-- tRNA clover leaf -->
  <text class="t" x="600" y="110">tRNA</text>
  <g fill="none" stroke="#d98b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 130 V170"/><path d="M600 170 q-60 0 -60 30 q0 30 60 30"/><path d="M600 170 q60 0 60 30 q0 30 -60 30"/><path d="M600 230 V270"/><path d="M600 270 q-30 10 -20 30 q10 20 20 0 q10 20 20 0 q10 -20 -20 -30"/>
  </g>
  <circle cx="600" cy="120" r="10" fill="#0f7a62"/>
  <text class="s" x="600" y="250" style="font-size:16px">anticodon loop</text>
  <text class="s" x="600" y="340">transfer: small, clover-leaf shaped;</text><text class="s" x="600" y="366">brings amino acids to the ribosome;</text><text class="s" x="600" y="392">10 to 15 percent of cell RNA</text>
  <!-- rRNA with protein = ribosome -->
  <text class="t" x="1000" y="110">rRNA</text>
  <ellipse cx="1000" cy="200" rx="70" ry="30" fill="#b2dbcc" stroke="#0f7a62" stroke-width="5"/>
  <ellipse cx="1000" cy="160" rx="50" ry="22" fill="#b2dbcc" stroke="#0f7a62" stroke-width="5"/>
  <path d="M950 190 q25 -15 50 0 t50 0 M960 210 q20 15 40 0 t40 0" stroke="#d98b2b" stroke-width="5" fill="none"/>
  <text class="s" x="1000" y="260">ribosomal: made by the DNA of nucleoli,</text><text class="s" x="1000" y="286">joined with protein to form ribosomes;</text><text class="s" x="1000" y="312">about 80 percent of cell RNA</text>
  <!-- central dogma -->
  <text class="h" x="600" y="470">The central dogma</text>
  <rect x="160" y="520" width="220" height="80" rx="16" fill="#5b3fb5"/><text class="b" x="270" y="570">DNA</text>
  <path d="M390 560 H500" stroke="#4b5563" stroke-width="5" marker-end="url(#ar)"/>
  <text class="s" x="445" y="540">transcription</text>
  <rect x="510" y="520" width="220" height="80" rx="16" fill="#d98b2b"/><text class="b" x="620" y="570">RNA</text>
  <path d="M740 560 H850" stroke="#4b5563" stroke-width="5" marker-end="url(#ar)"/>
  <text class="s" x="795" y="540">translation</text>
  <rect x="860" y="520" width="220" height="80" rx="16" fill="#0f7a62"/><text class="b" x="970" y="570">Protein</text>
  <text class="s" x="600" y="650">Transcription: an RNA copy of a gene is made, in front of the DNA strand. Translation: the ribosome reads</text>
  <text class="s" x="600" y="676">the RNA and builds the protein. Through this flow DNA controls the properties and activities of the cell.</text>
  <text class="s" x="600" y="730">DNA stays in chromosomes (with about 2 percent in mitochondria and chloroplasts); RNA is in nucleolus, ribosomes and cytosol.</text>
</svg>
