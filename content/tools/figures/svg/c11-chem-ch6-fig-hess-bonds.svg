<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 6.4 (Hess cycle), the bond-energy Hess cycle and Sample Problems 6.1, 6.3 and 6.7. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .b{font-size:14px;font-weight:700;fill:#14181f;text-anchor:middle}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Hess's law: the enthalpy change does not depend on the route</text>
  <!-- Hess cycle A to B -->
  <text class="k" x="250" y="72">Direct and indirect routes (Figure 6.4)</text>
  <rect x="60" y="150" width="90" height="44" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="105" y="178">A</text>
  <rect x="350" y="150" width="90" height="44" rx="10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/><text class="b" x="395" y="178">B</text>
  <path d="M150 172 H342" stroke="#d7322f" stroke-width="3" marker-end="url(#a)"/><text class="s" x="246" y="162" style="fill:#d7322f">direct route: delta Hr</text>
  <rect x="200" y="230" width="90" height="40" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="245" y="256">M + N</text>
  <path d="M110 194 L220 230" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="130" y="232">delta H1</text>
  <path d="M290 250 L390 196" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="330" y="240">delta H2</text>
  <rect x="100" y="320" width="70" height="40" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="135" y="346">X</text>
  <rect x="300" y="320" width="100" height="40" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="350" y="346">Y + Z</text>
  <path d="M105 194 L125 318" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="70" y="290">delta H3</text>
  <path d="M170 340 H292" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="205" y="380">delta H4</text>
  <path d="M370 320 L392 196" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="395" y="290">delta H5</text>
  <g class="t">
    <text x="60" y="420">indirect route 1: delta Hr = delta H1 + delta H2</text>
    <text x="60" y="440">indirect route 2: delta Hr = delta H3 + delta H4 + delta H5</text>
    <text x="60" y="468">M, N, X, Y, Z are reaction intermediates; the first law of</text>
    <text x="60" y="486">thermodynamics (energy is conserved) makes every route equal</text>
    <text x="60" y="514" style="font-weight:700;fill:#14181f">Sample 6.3: CO from combustion data</text>
    <text x="60" y="534">C + O2 to CO2: -393.5; CO + 1/2 O2 to CO2: -283</text>
    <text x="60" y="552">C + 1/2 O2 to CO: -393.5 - (-283) = -110.5 kJ per mol</text>
  </g>
  <!-- bond energy cycle -->
  <text class="k" x="860" y="72">Bond energies: break everything, then build the products</text>
  <rect x="600" y="150" width="150" height="44" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="675" y="178">reactants</text>
  <rect x="1000" y="150" width="150" height="44" rx="10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/><text class="b" x="1075" y="178">products</text>
  <rect x="800" y="270" width="150" height="44" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="875" y="298">gaseous atoms</text>
  <path d="M750 172 H992" stroke="#d7322f" stroke-width="3" marker-end="url(#a)"/><text class="s" x="870" y="162" style="fill:#d7322f">delta Hr = sum ER - sum EP</text>
  <path d="M700 194 L830 268" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="690" y="245">+ sum ER (bonds broken)</text>
  <path d="M920 268 L1050 196" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text class="t" x="990" y="245">- sum EP (bonds formed)</text>
  <g class="t">
    <text x="600" y="350" style="font-weight:700;fill:#14181f">Sample 6.7: H2 + Cl2 gives 2 HCl</text>
    <text x="600" y="370">break: H-H 436 + Cl-Cl 242 = 678 kJ absorbed (printed '478')</text>
    <text x="600" y="388">make: 2 x H-Cl = 2 x 431 = 862 kJ released</text>
    <text x="600" y="406">delta Hr = 678 - 862 = -184 kJ for 2 mol HCl; formation of HCl -92 kJ per mol</text>
    <text x="600" y="440" style="font-weight:700;fill:#14181f">Sample 6.1: H2 + 1/2 O2 gives H2O(g)</text>
    <text x="600" y="460">break: 436 + 1/2 x 495 = 683.5; make: 2 x 463 = 926</text>
    <text x="600" y="478">delta Hr = 683.5 - 926 = -242.5 kJ per mol</text>
    <text x="600" y="512">bond breaking absorbs energy (+), bond making releases it (-);</text>
    <text x="600" y="530">more released than absorbed: exothermic, otherwise endothermic</text>
    <text x="600" y="558">average bond energies (Table 6.1) are used in place of exact ones:</text>
    <text x="600" y="576">C-C is 376 in ethane, 356 in propane, 352 in butane, about 348 on average</text>
  </g>
  <text class="s" x="600" y="620">Values as printed in Table 6.1 and the sample problems; the estimate holds for gas-phase reactions.</text>
</svg>
