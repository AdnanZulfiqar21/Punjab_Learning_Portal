  <text x="720.0" y="206.8" font-size="48" fill="#d12a2a" text-anchor="middle" font-weight="600"><tspan dy="0.0">H</tspan></text>
  <text x="430.0" y="91.8" font-size="48" fill="#2d3a9e" text-anchor="middle" font-weight="600"><tspan dy="0.0">H</tspan></text>
