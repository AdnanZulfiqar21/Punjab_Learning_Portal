<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 778" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="778" fill="#ffffff"/>
  <!-- The steps of metallurgy (our own summary flow for topic 31.1.1; not a textbook figure). -->
  <rect x="15.0" y="10.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="65.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">i. Mining</tspan></text>
  <rect x="440.0" y="10.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="66.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">ore dug out, e.g. Fe</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">O</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="215.0" y1="102.0" x2="215.0" y2="123.2" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215.0 136.0 L208.2 121.5 L221.8 121.5 Z" fill="#14181f"/>
  <rect x="15.0" y="138.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="193.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ii. Concentration</tspan></text>
  <rect x="440.0" y="138.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="194.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">impurities removed</tspan></text>
  <line x1="215.0" y1="230.0" x2="215.0" y2="251.2" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215.0 264.0 L208.2 249.5 L221.8 249.5 Z" fill="#14181f"/>
  <rect x="15.0" y="266.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="321.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">iii. Roasting / calcination</tspan></text>
  <rect x="440.0" y="266.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="322.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">ZnCO</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"> &#8594; ZnO + CO</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="215.0" y1="358.0" x2="215.0" y2="379.2" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215.0 392.0 L208.2 377.5 L221.8 377.5 Z" fill="#14181f"/>
  <rect x="15.0" y="394.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="449.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">iv. Reduction</tspan></text>
  <rect x="440.0" y="394.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="450.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">Fe</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">O</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"> + 3CO &#8594; 2Fe + 3CO</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="215.0" y1="486.0" x2="215.0" y2="507.2" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215.0 520.0 L208.2 505.5 L221.8 505.5 Z" fill="#14181f"/>
  <rect x="15.0" y="522.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="577.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">v. Refining</tspan></text>
  <rect x="440.0" y="522.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="578.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">Cu for wires: 99.99% pure</tspan></text>
  <line x1="215.0" y1="614.0" x2="215.0" y2="635.2" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215.0 648.0 L208.2 633.5 L221.8 633.5 Z" fill="#14181f"/>
  <rect x="15.0" y="650.0" width="400.0" height="92.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="215.0" y="705.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">vi. Alloying</tspan></text>
  <rect x="440.0" y="650.0" width="545.0" height="92.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="712.0" y="706.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">e.g. brass, bronze, steel</tspan></text>
</svg>
