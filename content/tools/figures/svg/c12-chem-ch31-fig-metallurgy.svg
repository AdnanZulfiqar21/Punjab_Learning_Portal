<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="760" fill="#ffffff"/>
  <!-- Original flow chart for topic 31.1.1: mining, ore concentration, conversion to the oxide (roasting 2ZnS + 3O2 -&gt; 2ZnO + 2SO2; calcination ZnCO3 -&gt; ZnO + CO2), reduction (by CO for iron; electrolysis for Na, K, Al), refining (Cu 99.99%) and alloying. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Extraction of metals (metallurgy)</text>
  <rect x="20.0" y="64.0" width="245.0" height="62.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="101.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">i. Mining</text>
  <rect x="280.0" y="60.0" width="605.0" height="70.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="86.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the ore is dug out of the earth's crust</text>
  <text x="296.0" y="109.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">e.g. haematite, Fe</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">, an ore of iron</tspan></text>
  <line x1="142.0" y1="126.0" x2="142.0" y2="146.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M142.0 154.0 L138.2 145.8 L145.8 145.8 Z" fill="#4b5563"/>
  <rect x="20.0" y="154.0" width="245.0" height="62.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="191.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">ii. Ore concentration</text>
  <rect x="280.0" y="150.0" width="605.0" height="70.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="176.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">impurities (gangue) are removed as far as possible</text>
  <line x1="142.0" y1="216.0" x2="142.0" y2="236.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M142.0 244.0 L138.2 235.8 L145.8 235.8 Z" fill="#4b5563"/>
  <rect x="20.0" y="244.0" width="245.0" height="117.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="308.5" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">iii. Conversion to oxide</text>
  <rect x="280.0" y="240.0" width="605.0" height="125.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="266.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">roasting: a sulphide ore is heated in excess air</text>
  <text x="296.0" y="289.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">2ZnS + 3O</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> -&gt; 2ZnO + 2SO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="296.0" y="315.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">calcination: a carbonate ore is heated in little or no air</text>
  <text x="296.0" y="338.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">ZnCO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> -&gt; ZnO + CO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <line x1="142.0" y1="361.0" x2="142.0" y2="381.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M142.0 389.0 L138.2 380.8 L145.8 380.8 Z" fill="#4b5563"/>
  <rect x="20.0" y="389.0" width="245.0" height="142.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="466.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">iv. Reduction to metal</text>
  <rect x="280.0" y="385.0" width="605.0" height="150.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="411.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">metals below carbon: carbon forms CO, which removes the oxygen</text>
  <text x="296.0" y="434.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">C + 1/2 O</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> -&gt; CO ;  Fe</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> + 3CO -&gt; 2Fe + 3CO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="296.0" y="460.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">metals above carbon (Na, K, Al): electrolysis of the molten</text>
  <text x="296.0" y="483.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">compound; metal ions gain electrons at the cathode</text>
  <line x1="142.0" y1="531.0" x2="142.0" y2="551.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M142.0 559.0 L138.2 550.8 L145.8 550.8 Z" fill="#4b5563"/>
  <rect x="20.0" y="559.0" width="245.0" height="67.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="598.5" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">v. Refining</text>
  <rect x="280.0" y="555.0" width="605.0" height="75.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="581.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">thermal, chemical or electrochemical purification</text>
  <text x="296.0" y="604.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">e.g. copper for electric wiring must be 99.99% pure</text>
  <line x1="142.0" y1="626.0" x2="142.0" y2="646.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M142.0 654.0 L138.2 645.8 L145.8 645.8 Z" fill="#4b5563"/>
  <rect x="20.0" y="654.0" width="245.0" height="67.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="142.0" y="693.5" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">vi. Alloying</text>
  <rect x="280.0" y="650.0" width="605.0" height="75.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="296.0" y="676.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">mixing with other metals or a non-metal</text>
  <text x="296.0" y="699.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">to improve strength, corrosion resistance and more</text>
  <text x="450.0" y="751" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
