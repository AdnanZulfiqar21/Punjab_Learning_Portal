<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after topics 9.3 to 9.5.1, Table 9.2, Figure 9.1 and Table 9.3: ionic product of water, the pH scale, Ka and the weak-acid approximation. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f}
    </style>
    <linearGradient id="ph" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d7322f"/><stop offset="0.5" stop-color="#2fa36b"/><stop offset="1" stop-color="#1f3fb5"/>
    </linearGradient>
  </defs>
  <text class="h" x="600" y="32">Water, pH and the strength of acids: Kw, pH, pOH and Ka</text>
  <!-- Kw box -->
  <rect x="50" y="55" width="540" height="215" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Ionic product of water (Kw)</text>
  <g class="f">
    <text x="70" y="112">H2O + H2O  =  H3O+ + OH-     (net: H2O = H+ + OH-)</text>
    <text x="70" y="138">Kc = [H+][OH-] / [H2O] = 1.8 x 10^-16 mol dm-3</text>
    <text x="70" y="164">[H2O] = 1000 / 18 = 55.5 mol dm-3 (constant)</text>
    <text x="70" y="190">Kw = Kc [H2O] = [H+][OH-] = 1.01 x 10^-14 at 25 C</text>
  </g>
  <text class="t" x="70" y="222">neutral water: [H+] = [OH-] = 10^-7 mol dm-3. Adding acid or base changes</text>
  <text class="t" x="70" y="242">[H+] and [OH-] but not their product; Kw rises about 75 times from 0 to 100 C.</text>
  <!-- Kw table -->
  <rect x="610" y="55" width="540" height="215" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="880" y="83">Kw at various temperatures (Table 9.2)</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="720" y="112">Temperature, degrees C</text><text x="1010" y="112">Kw</text></g>
    <text x="720" y="140">0</text><text x="1010" y="140">0.11 x 10^-14</text>
    <text x="720" y="162">10</text><text x="1010" y="162">0.30 x 10^-14</text>
    <text x="720" y="184">25</text><text x="1010" y="184">1.0 x 10^-14</text>
    <text x="720" y="206">40</text><text x="1010" y="206">3.00 x 10^-14</text>
    <text x="720" y="228">100</text><text x="1010" y="228">7.5 x 10^-14</text>
  </g>
  <path d="M640 120 H1120" stroke="#9ca3af" stroke-width="1"/>
  <text class="s" x="880" y="256">(the print writes the exponent as 10^14; the values are read as 10^-14)</text>
  <!-- pH scale -->
  <rect x="50" y="290" width="1100" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="318">The pH scale (Sorenson, 1909): pH = -log[H+], pOH = -log[OH-], pH + pOH = 14 at 25 C</text>
  <rect x="120" y="335" width="960" height="26" rx="6" fill="url(#ph)" opacity="0.85"/>
  <g font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">
    <text x="120" y="378">0</text><text x="257" y="378">2</text><text x="394" y="378">4</text><text x="531" y="378">6</text><text x="600" y="378">7</text><text x="669" y="378">8</text><text x="806" y="378">10</text><text x="943" y="378">12</text><text x="1080" y="378">14</text>
  </g>
  <path d="M600 335 V361" stroke="#ffffff" stroke-width="3"/>
  <g class="s" style="font-weight:700">
    <text x="300" y="404" style="fill:#d7322f">acidic: [H+] greater than [OH-], pH below 7</text>
    <text x="600" y="404" style="fill:#0f7a62">neutral: pH 7</text>
    <text x="900" y="404" style="fill:#1f3fb5">basic: [OH-] greater than [H+], pH above 7</text>
  </g>
  <text class="s" x="600" y="428">Sample 9.1: pH 9.2 gives pOH 4.8, [H+] = 10^-9.2 = 6.3 x 10^-10 and [OH-] = 10^-4.8 = 1.6 x 10^-5 mol dm-3; their product is 1.01 x 10^-14</text>
  <!-- Ka box -->
  <rect x="50" y="460" width="540" height="200" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="488">Ionization constant of an acid (Ka)</text>
  <g class="f">
    <text x="70" y="516">HA + H2O  =  H3O+ + A-</text>
    <text x="70" y="542">Ka = Kc [H2O] = [H3O+][A-] / [HA]</text>
  </g>
  <g class="t">
    <text x="70" y="572">Ka greater than 1: strong (HCl, HNO3, H2SO4: very large)</text>
    <text x="70" y="592">Ka from 1 to 10^-3: moderately strong; below 10^-3: weak</text>
    <text x="70" y="612">Table 9.3: HSO4- 1.3 x 10^-4 (printed as strong), HF 6.7 x 10^-5,</text>
    <text x="70" y="632">CH3COOH 1.85 x 10^-5, H2S 1.0 x 10^-7, HCO3- 4.7 x 10^-12</text>
  </g>
  <!-- weak acid box -->
  <rect x="610" y="460" width="540" height="200" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="488">[H3O+] of a weak acid from Ka and C (9.5.1)</text>
  <g class="f">
    <text x="630" y="516">HA = H3O+ + A-   start C, 0, 0;  equilibrium C-x, x, x</text>
    <text x="630" y="542">Ka = x^2 / (C - x)  and  C - x is about C, so Ka = x^2 / C</text>
    <text x="630" y="568">[H3O+] = x = square root of (Ka x C)</text>
  </g>
  <g class="t">
    <text x="630" y="600">Sample 9.3: 0.1 M acetic acid, Ka = 1.8 x 10^-5</text>
    <text x="630" y="620">[H3O+] = square root of (1.8 x 10^-5 x 0.1) = square root of (1.8 x 10^-6)</text>
    <text x="630" y="640">= 1.34 x 10^-3 mol dm-3 (the print shows 0.18 x 10^-6 for 1.8 x 10^-6)</text>
  </g>
</svg>
