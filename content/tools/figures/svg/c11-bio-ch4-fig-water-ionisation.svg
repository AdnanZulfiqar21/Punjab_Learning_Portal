  <circle cx="477.0" cy="188.0" r="34.0" stroke="#3d6f93" stroke-width="2" fill="#d8d86a"/>
  <text x="514.0" y="136.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600">O</text>
  <text x="477.0" y="198.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600">H</text>
