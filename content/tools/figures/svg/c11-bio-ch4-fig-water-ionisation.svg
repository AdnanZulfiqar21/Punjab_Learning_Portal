  <circle cx="207.5" cy="173.3" r="34.0" stroke="#3d6f93" stroke-width="2" fill="#d8d86a"/>
  <circle cx="112.5" cy="173.3" r="34.0" stroke="#3d6f93" stroke-width="2" fill="#d8d86a"/>
  <text x="160.0" y="150.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600">O</text>
  <text x="207.5" y="183.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600">H</text>
  <text x="112.5" y="183.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600">H</text>
  <line x1="275.0" y1="140.0" x2="359.6" y2="140.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
