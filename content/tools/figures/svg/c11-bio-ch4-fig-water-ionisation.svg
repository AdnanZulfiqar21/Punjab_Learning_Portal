<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="350" fill="#ffffff"/>
  <!-- Original redraw after Figure 4.11: a water molecule ionises into a hydroxyl ion and a hydrogen ion. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ionisation of water</text>
  <circle cx="187.7" cy="171.7" r="14.4" stroke="#64748b" stroke-width="1.5" fill="#f8fafc"/>
  <circle cx="132.3" cy="171.7" r="14.4" stroke="#64748b" stroke-width="1.5" fill="#f8fafc"/>
  <circle cx="160.0" cy="150.0" r="24.0" stroke="#b91c1c" stroke-width="1.8" fill="#fca5a5"/>
  <text x="160.0" y="158.0" font-size="20.8" fill="#7f1d1d" text-anchor="middle" font-weight="700">O</text>
  <text x="160.0" y="250.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">water molecule, H2O</text>
  <line x1="260.0" y1="150.0" x2="349.6" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M360.0 150.0 L348.2 155.5 L348.2 144.5 Z" fill="#14181f"/>
  <circle cx="470.0" cy="140.0" r="24.0" stroke="#b91c1c" stroke-width="2" fill="#fca5a5"/>
  <text x="470.0" y="147.0" font-size="20" fill="#7f1d1d" text-anchor="middle" font-weight="700">O</text>
  <circle cx="452.0" cy="176.0" r="14.0" stroke="#64748b" stroke-width="2" fill="#f8fafc"/>
  <text x="452.0" y="181.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <text x="504.0" y="118.0" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="470.0" y="250.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">hydroxyl ion, OH-</text>
  <text x="470.0" y="270.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">keeps both bond electrons</text>
  <text x="590.0" y="155.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="700.0" cy="150.0" r="16.0" stroke="#64748b" stroke-width="2" fill="#f8fafc"/>
  <text x="700.0" y="156.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <text x="726.0" y="130.0" font-size="24" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="700.0" y="250.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">hydrogen ion, H+</text>
  <text x="450.0" y="310.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">H2O &lt;=&gt; H+ + OH-  (only a tiny fraction of water molecules ionise at any moment)</text>
  <text x="450.0" y="341" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
