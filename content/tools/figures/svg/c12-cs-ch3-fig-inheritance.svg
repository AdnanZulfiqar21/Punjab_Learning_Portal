<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original: single, multiple and multilevel inheritance as UML-style class boxes. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Types of inheritance (after Figs 3.3-3.5)</text>
  <rect x="15.0" y="55.0" width="280.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">single</text>
  <rect x="310.0" y="55.0" width="280.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">multiple</text>
  <rect x="605.0" y="55.0" width="280.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">multilevel</text>
  <rect x="80.0" y="113.0" width="150.0" height="44.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="155.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Animal</text>
  <text x="155.0" y="149.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">parent</text>
  <rect x="80.0" y="278.0" width="150.0" height="44.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="155.0" y="298.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Dog</text>
  <text x="155.0" y="314.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">child</text>
  <line x1="155.0" y1="278.0" x2="155.0" y2="172.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M155.0 158.0 L146.0 173.0 L164.0 173.0 Z" stroke="#14181f" stroke-width="2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="155.0" y="360.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">class Dog(Animal):</text>
  <text x="155.0" y="378.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one parent</text>
  <rect x="325.0" y="113.0" width="120.0" height="44.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="385.0" y="133.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Father</text>
  <text x="385.0" y="149.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">parent 1</text>
  <rect x="465.0" y="113.0" width="120.0" height="44.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="525.0" y="133.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Mother</text>
  <text x="525.0" y="149.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">parent 2</text>
  <rect x="385.0" y="278.0" width="140.0" height="44.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="455.0" y="298.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Child</text>
  <text x="455.0" y="314.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">child</text>
  <line x1="430.0" y1="278.0" x2="385.0" y2="172.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="480.0" y1="278.0" x2="525.0" y2="172.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M385.0 158.0 L376.0 173.0 L394.0 173.0 Z" stroke="#14181f" stroke-width="2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M525.0 158.0 L516.0 173.0 L534.0 173.0 Z" stroke="#14181f" stroke-width="2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="455.0" y="360.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">class Child(Father, Mother):</text>
  <text x="455.0" y="378.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">two or more parents</text>
  <rect x="670.0" y="95.0" width="150.0" height="40.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="745.0" y="113.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Vehicle</text>
  <text x="745.0" y="129.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">grandparent</text>
  <rect x="670.0" y="200.0" width="150.0" height="40.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="745.0" y="218.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Car</text>
  <text x="745.0" y="234.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">parent</text>
  <rect x="670.0" y="305.0" width="150.0" height="40.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="745.0" y="323.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">ElectricCar</text>
  <text x="745.0" y="339.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">child</text>
  <line x1="745.0" y1="305.0" x2="745.0" y2="255.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M745.0 240.0 L736.0 255.0 L754.0 255.0 Z" stroke="#14181f" stroke-width="2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="745.0" y1="200.0" x2="745.0" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M745.0 135.0 L736.0 150.0 L754.0 150.0 Z" stroke="#14181f" stroke-width="2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="745.0" y="380.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">a chain: the child gets</text>
  <text x="745.0" y="398.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Car's and Vehicle's methods</text>
  <text x="450.0" y="462.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">The hollow arrowhead points from the child to the class it inherits from.</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
