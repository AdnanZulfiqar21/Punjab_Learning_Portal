<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="330" fill="#ffffff"/>
  <!-- As printed on p109 (23.4.1 d): methylbenzene + 3[O] (KMnO4 over the arrow; dil. H2SO4; Heat under it) -&gt; benzene carboxylic acid (benzoic acid) + H2O, rings drawn. -->
  <path d="M160.0 110.0 L220.6 145.0 L220.6 215.0 L160.0 250.0 L99.4 215.0 L99.4 145.0 Z" stroke="#14181f" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160.0" cy="180.0" r="40.6" stroke="#14181f" stroke-width="2.8" fill="none"/>
  <line x1="160.0" y1="110.0" x2="160.0" y2="76.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="160.0" y="67.1" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="280.0" y="191.0" font-size="32" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ 3[O]</tspan></text>
  <line x1="410.0" y1="180.0" x2="668.0" y2="180.0" stroke="#14181f" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M680.0 180.0 L666.4 186.3 L666.4 173.7 Z" fill="#14181f"/>
  <text x="545.0" y="164.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">KMnO</tspan><tspan dy="8.4" font-size="20.2">4</tspan><tspan dy="-8.4"></tspan></text>
  <text x="545.0" y="222.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">dil. H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">SO</tspan><tspan dy="8.4" font-size="20.2">4</tspan><tspan dy="-8.4"> ;Heat</tspan></text>
  <path d="M800.0 110.0 L860.6 145.0 L860.6 215.0 L800.0 250.0 L739.4 215.0 L739.4 145.0 Z" stroke="#14181f" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="800.0" cy="180.0" r="40.6" stroke="#14181f" stroke-width="2.8" fill="none"/>
  <line x1="800.0" y1="110.0" x2="800.0" y2="76.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="800.0" y="67.1" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">COOH</tspan></text>
  <text x="900.0" y="191.0" font-size="32" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ H</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6">O</tspan></text>
  <text x="160.0" y="305.0" font-size="28" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">methylbenzene</tspan></text>
  <text x="800.0" y="305.0" font-size="28" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">benzene carboxylic acid</tspan></text>
</svg>
