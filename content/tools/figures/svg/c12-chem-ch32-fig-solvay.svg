<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original flow diagram for the Solvay process in topic 32.12: ammoniated brine is carbonated to precipitate NaHCO3, which is heated to sodium carbonate; limestone gives CO2 and lime; lime regenerates ammonia from NH4Cl, leaving calcium chloride as the by-product. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The Solvay process for sodium carbonate</text>
  <rect x="25.0" y="130.0" width="200.0" height="80.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="125.0" y="164.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">brine (NaCl)</text>
  <text x="125.0" y="184.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">+ ammonia</text>
  <rect x="270.0" y="130.0" width="220.0" height="80.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="380.0" y="164.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">carbonating tower:</text>
  <text x="380.0" y="184.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">CO2 passed in</text>
  <rect x="535.0" y="130.0" width="150.0" height="80.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="610.0" y="164.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">filter:</text>
  <text x="610.0" y="184.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">solid NaHCO3</text>
  <rect x="725.0" y="130.0" width="160.0" height="80.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="805.0" y="164.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">heat</text>
  <text x="805.0" y="184.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">the NaHCO3</text>
  <line x1="227.0" y1="170.0" x2="260.8" y2="170.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M268.0 170.0 L259.8 173.8 L259.8 166.2 Z" fill="#14181f"/>
  <line x1="492.0" y1="170.0" x2="525.8" y2="170.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M533.0 170.0 L524.8 173.8 L524.8 166.2 Z" fill="#14181f"/>
  <line x1="687.0" y1="170.0" x2="715.8" y2="170.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M723.0 170.0 L714.8 173.8 L714.8 166.2 Z" fill="#14181f"/>
  <rect x="725.0" y="265.0" width="160.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="805.0" y="290.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sodium carbonate</text>
  <text x="805.0" y="308.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(soda ash) product</text>
  <line x1="805.0" y1="212.0" x2="805.0" y2="255.8" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M805.0 263.0 L801.2 254.8 L808.8 254.8 Z" fill="#14181f"/>
  <path d="M805 128 Q805 82 600 82 Q400 82 390 126" stroke="#0f7a62" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M390.0 126.0 L387.2 115.4 L396.3 117.0 Z" fill="#0f7a62"/>
  <text x="600.0" y="74.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">CO2 recycled</text>
  <rect x="380.0" y="380.0" width="230.0" height="80.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="495.0" y="414.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">lime kiln: limestone</text>
  <text x="495.0" y="434.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">heated</text>
  <rect x="25.0" y="380.0" width="300.0" height="80.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#dff4f5"/>
  <text x="175.0" y="414.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">ammonia recovery:</text>
  <text x="175.0" y="434.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">lime + NH4Cl solution</text>
  <line x1="460.0" y1="378.0" x2="426.5" y2="221.0" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M425.0 214.0 L430.4 221.2 L423.0 222.8 Z" fill="#0f7a62"/>
  <text x="452.0" y="296.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">CO2</text>
  <path d="M610 212 L610 345 L250 345 L250 372" stroke="#d98b2b" stroke-width="2.2" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M250.0 376.0 L245.4 366.0 L254.6 366.0 Z" fill="#d98b2b"/>
  <text x="545.0" y="337.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">NH4Cl solution</text>
  <line x1="378.0" y1="425.0" x2="335.2" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M328.0 425.0 L336.2 421.2 L336.2 428.8 Z" fill="#14181f"/>
  <text x="353.0" y="416.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">CaO</text>
  <line x1="125.0" y1="378.0" x2="125.0" y2="219.2" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M125.0 212.0 L128.8 220.2 L121.2 220.2 Z" fill="#1f6fb5"/>
  <text x="132.0" y="300.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">NH3 recycled</text>
  <line x1="175.0" y1="462.0" x2="175.0" y2="488.6" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M175.0 495.0 L171.6 487.7 L178.4 487.7 Z" fill="#4b5563"/>
  <text x="175.0" y="513.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">calcium chloride (by-product)</text>
  <text x="230.0" y="560.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaCl + NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O -&gt; NaHCO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">Cl</tspan></text>
  <text x="670.0" y="560.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2NaHCO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; Na</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="230.0" y="595.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CaCO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; CaO + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="670.0" y="595.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CaO + 2NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">Cl -&gt; CaCl</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
