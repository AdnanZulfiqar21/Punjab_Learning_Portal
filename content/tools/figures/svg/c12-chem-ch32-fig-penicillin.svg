<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 32.3.1: the penicillin core drawn after Figure 32.2, a four-membered beta-lactam ring (shaded orange) fused to a five-membered thiazolidine ring with S, two methyl groups and COOH, and an R-CO-NH side chain; and the steps by which penicillin blocks the cell-wall enzyme. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Penicillin: structure and action</text>
  <rect x="15.0" y="55.0" width="445.0" height="435.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="237.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">structure (after Figure 32.2)</text>
  <path d="M200.0 210.0 L260.0 210.0 L260.0 270.0 L200.0 270.0 Z" stroke="none" stroke-width="0" fill="#fed7aa" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M260.0 210.0 L312.0 182.0 L350.0 228.0 L318.0 278.0 L260.0 270.0 Z" stroke="none" stroke-width="0" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="200.0" y1="210.0" x2="260.0" y2="210.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="260.0" y1="219.0" x2="260.0" y2="261.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="251.0" y1="270.0" x2="209.0" y2="270.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="200.0" y1="270.0" x2="200.0" y2="210.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="267.9" y1="205.7" x2="304.1" y2="186.3" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="317.7" y1="188.9" x2="344.3" y2="221.1" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="350.0" y1="228.0" x2="318.0" y2="278.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="309.1" y1="276.8" x2="268.9" y2="271.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="260.0" y="276.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <text x="312.0" y="188.3" font-size="18" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">S</tspan></text>
  <line x1="202.1" y1="271.3" x2="177.1" y2="313.3" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="197.9" y1="268.7" x2="172.9" y2="310.7" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="168.0" y="330.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="193.5" y1="203.8" x2="166.5" y2="178.2" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="160.0" y="178.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <text x="160.0" y="153.2" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="152.2" y1="176.5" x2="119.8" y2="195.5" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="114.5" y1="200.0" x2="114.5" y2="248.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="109.5" y1="200.0" x2="109.5" y2="248.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="112.0" y="268.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="112.0" y1="200.0" x2="70.0" y2="175.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="58.0" y="174.3" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="350.0" y1="228.0" x2="398.0" y2="205.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="350.0" y1="228.0" x2="398.0" y2="250.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="418.0" y="204.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="418.0" y="259.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <line x1="318.0" y1="278.0" x2="340.0" y2="320.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="365.0" y="339.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <rect x="40.0" y="375.0" width="20.0" height="16.0" rx="3" stroke="#d98b2b" stroke-width="1.2" fill="#fed7aa"/>
  <text x="70.0" y="388.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">beta-lactam ring (four-membered, strained)</text>
  <rect x="40.0" y="403.0" width="20.0" height="16.0" rx="3" stroke="#1f6fb5" stroke-width="1.2" fill="#dbeafe"/>
  <text x="70.0" y="416.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">thiazolidine ring (five-membered, with S)</text>
  <text x="40.0" y="444.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">R = side chain (different penicillins differ here)</text>
  <rect x="475.0" y="55.0" width="410.0" height="435.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="680.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">how it kills bacteria</text>
  <rect x="495.0" y="100.0" width="370.0" height="58.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="680.0" y="124.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the cell-wall enzyme takes up penicillin</text>
  <text x="680.0" y="142.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">in place of its normal building block</text>
  <line x1="680.0" y1="159.0" x2="680.0" y2="173.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M680.0 179.0 L677.0 172.7 L683.0 172.7 Z" fill="#4b5563"/>
  <rect x="495.0" y="180.0" width="370.0" height="58.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="680.0" y="204.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the beta-lactam ring opens and binds</text>
  <text x="680.0" y="222.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">permanently: the enzyme is blocked</text>
  <line x1="680.0" y1="239.0" x2="680.0" y2="253.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M680.0 259.0 L677.0 252.7 L683.0 252.7 Z" fill="#4b5563"/>
  <rect x="495.0" y="260.0" width="370.0" height="58.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="680.0" y="284.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the bacterium grows without a working</text>
  <text x="680.0" y="302.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">cell wall and bursts</text>
  <line x1="680.0" y1="319.0" x2="680.0" y2="333.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M680.0 339.0 L677.0 332.7 L683.0 332.7 Z" fill="#4b5563"/>
  <rect x="495.0" y="340.0" width="370.0" height="58.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="680.0" y="364.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">human cells have no cell wall,</text>
  <text x="680.0" y="382.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">so they are not harmed</text>
  <text x="680.0" y="438.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">beta-lactamase enzymes of some bacteria</text>
  <text x="680.0" y="455.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">attack this ring and deactivate penicillin</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
