<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.12 to 2.14 and Table 2.6: the energy order of subshells by n + l, and box diagrams showing the Pauli principle and Hund's rule. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
      .t{font-size:15px;fill:#4b5563}
      .b{font-size:14px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="300" y="34">Energy of the subshells (Aufbau order)</text>
  <!-- energy ladder: boxes per subshell at increasing heights -->
  <g font-size="13" fill="#14181f" text-anchor="middle">
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="640" width="26" height="22"/></g><text x="133" y="680">1s</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="580" width="26" height="22"/></g><text x="133" y="620">2s</text>
    <g fill="none" stroke="#d98b2b" stroke-width="2"><rect x="200" y="555" width="26" height="22"/><rect x="230" y="555" width="26" height="22"/><rect x="260" y="555" width="26" height="22"/></g><text x="243" y="595">2p</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="500" width="26" height="22"/></g><text x="133" y="540">3s</text>
    <g fill="none" stroke="#d98b2b" stroke-width="2"><rect x="200" y="475" width="26" height="22"/><rect x="230" y="475" width="26" height="22"/><rect x="260" y="475" width="26" height="22"/></g><text x="243" y="515">3p</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="415" width="26" height="22"/></g><text x="133" y="455">4s</text>
    <g fill="none" stroke="#5b3fb5" stroke-width="2"><rect x="330" y="395" width="26" height="22"/><rect x="360" y="395" width="26" height="22"/><rect x="390" y="395" width="26" height="22"/><rect x="420" y="395" width="26" height="22"/><rect x="450" y="395" width="26" height="22"/></g><text x="403" y="435">3d</text>
    <g fill="none" stroke="#d98b2b" stroke-width="2"><rect x="200" y="365" width="26" height="22"/><rect x="230" y="365" width="26" height="22"/><rect x="260" y="365" width="26" height="22"/></g><text x="243" y="405">4p</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="315" width="26" height="22"/></g><text x="133" y="355">5s</text>
    <g fill="none" stroke="#5b3fb5" stroke-width="2"><rect x="330" y="295" width="26" height="22"/><rect x="360" y="295" width="26" height="22"/><rect x="390" y="295" width="26" height="22"/><rect x="420" y="295" width="26" height="22"/><rect x="450" y="295" width="26" height="22"/></g><text x="403" y="335">4d</text>
    <g fill="none" stroke="#d98b2b" stroke-width="2"><rect x="200" y="265" width="26" height="22"/><rect x="230" y="265" width="26" height="22"/><rect x="260" y="265" width="26" height="22"/></g><text x="243" y="305">5p</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="215" width="26" height="22"/></g><text x="133" y="255">6s</text>
    <g fill="none" stroke="#0f7a62" stroke-width="2"><rect x="480" y="195" width="18" height="22"/><rect x="501" y="195" width="18" height="22"/><rect x="522" y="195" width="18" height="22"/><rect x="543" y="195" width="18" height="22"/><rect x="564" y="195" width="18" height="22"/><rect x="585" y="195" width="18" height="22"/><rect x="606" y="195" width="18" height="22"/></g><text x="552" y="235">4f</text>
    <g fill="none" stroke="#5b3fb5" stroke-width="2"><rect x="330" y="175" width="26" height="22"/><rect x="360" y="175" width="26" height="22"/><rect x="390" y="175" width="26" height="22"/><rect x="420" y="175" width="26" height="22"/><rect x="450" y="175" width="26" height="22"/></g><text x="403" y="215">5d</text>
    <g fill="none" stroke="#d98b2b" stroke-width="2"><rect x="200" y="145" width="26" height="22"/><rect x="230" y="145" width="26" height="22"/><rect x="260" y="145" width="26" height="22"/></g><text x="243" y="185">6p</text>
    <g fill="none" stroke="#1f6fb5" stroke-width="2"><rect x="120" y="95" width="26" height="22"/></g><text x="133" y="135">7s</text>
  </g>
  <path d="M80 670 V80" stroke="#4b5563" stroke-width="2"/><text class="t" x="60" y="380" transform="rotate(-90 60 380)" text-anchor="middle">energy increases</text>
  <text class="s" x="330" y="700">each box is one orbital; order 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s</text>
  <!-- rules -->
  <g class="t">
    <text class="k" x="650" y="80">Aufbau: lower n + l fills first; equal n + l, lower n first</text>
    <text x="650" y="104">4s (4 + 0 = 4) before 3d (3 + 2 = 5); 3d (n = 3) before 4p (4 + 1 = 5)</text>
    <text class="k" x="650" y="150">Pauli: no two electrons share all four quantum numbers</text>
    <text x="650" y="174">helium's 1s pair: n = 1, l = 0, m = 0, s = +1/2 and -1/2 (opposite spins)</text>
    <text class="k" x="650" y="220">Hund: degenerate orbitals fill singly, same spin, before pairing</text>
  </g>
  <!-- Hund example -->
  <g font-size="14" fill="#14181f" text-anchor="middle">
    <text x="760" y="262">wrong</text>
    <g fill="none" stroke="#d7322f" stroke-width="2"><rect x="715" y="270" width="30" height="26"/><rect x="750" y="270" width="30" height="26"/><rect x="785" y="270" width="30" height="26"/></g>
    <path d="M725 292 v-16 M735 276 v16" stroke="#d7322f" stroke-width="2"/><path d="M765 292 v-16" stroke="#d7322f" stroke-width="2"/>
    <text x="930" y="262">right</text>
    <g fill="none" stroke="#0f7a62" stroke-width="2"><rect x="885" y="270" width="30" height="26"/><rect x="920" y="270" width="30" height="26"/><rect x="955" y="270" width="30" height="26"/></g>
    <path d="M900 292 v-16 M935 292 v-16 M970 292 v-16" stroke="#0f7a62" stroke-width="2"/>
    <text x="850" y="320" style="fill:#4b5563">three electrons in the three p orbitals</text>
  </g>
  <!-- C N O boxes -->
  <g font-size="14" fill="#14181f">
    <text x="650" y="372" font-weight="700">Carbon 2p2</text>
    <g fill="none" stroke="#4b5563" stroke-width="2"><rect x="820" y="352" width="30" height="26"/><rect x="855" y="352" width="30" height="26"/><rect x="890" y="352" width="30" height="26"/></g>
    <path d="M835 374 v-16 M870 374 v-16" stroke="#14181f" stroke-width="2"/>
    <text x="650" y="422" font-weight="700">Nitrogen 2p3</text>
    <g fill="none" stroke="#4b5563" stroke-width="2"><rect x="820" y="402" width="30" height="26"/><rect x="855" y="402" width="30" height="26"/><rect x="890" y="402" width="30" height="26"/></g>
    <path d="M835 424 v-16 M870 424 v-16 M905 424 v-16" stroke="#14181f" stroke-width="2"/>
    <text x="650" y="472" font-weight="700">Oxygen 2p4</text>
    <g fill="none" stroke="#4b5563" stroke-width="2"><rect x="820" y="452" width="30" height="26"/><rect x="855" y="452" width="30" height="26"/><rect x="890" y="452" width="30" height="26"/></g>
    <path d="M829 474 v-16 M841 458 v16 M870 474 v-16 M905 474 v-16" stroke="#14181f" stroke-width="2"/>
    <text x="960" y="372" style="fill:#4b5563">two singly</text><text x="960" y="422" style="fill:#4b5563">three singly, half filled</text><text x="960" y="472" style="fill:#4b5563">one pair forced</text>
  </g>
  <g class="t">
    <text x="650" y="520">electrons of like charge repel, so they spread over a subshell's orbitals</text>
    <text x="650" y="542">with parallel spins and pair only when no empty orbital is left;</text>
    <text x="650" y="564">a pair is shown by two opposite arrows in one box</text>
    <text x="650" y="604">boron 1s2 2s2 2p1: 1s pair, 2s pair, one arrow in 2px, 2py and 2pz empty</text>
    <text x="650" y="644">chromium 3d5 4s1 and copper 3d10 4s1 (Table 2.7): a half-filled</text>
    <text x="650" y="666">or full d subshell is preferred</text>
  </g>
</svg>
