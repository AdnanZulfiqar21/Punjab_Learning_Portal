<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.2 and 3.4: how a light microscope, a TEM and an SEM form an image. -->
  <defs>
    <style>
      .h{font-size:30px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:22px;fill:#14181f;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563;text-anchor:middle}
      .l{font-size:20px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="200" y="60">Light microscope</text>
  <text class="h" x="600" y="60">TEM</text>
  <text class="s" x="600" y="90">transmission electron</text>
  <text class="h" x="1000" y="60">SEM</text>
  <text class="s" x="1000" y="90">scanning electron</text>
  <!-- light microscope: lamp below, light up through specimen, two lenses, eye -->
  <rect x="160" y="700" width="80" height="40" rx="8" fill="#d98b2b"/>
  <text class="s" x="200" y="770">light source</text>
  <path d="M200 700 L200 150" stroke="#f2b134" stroke-width="10" marker-end="url(#ar)"/>
  <rect x="120" y="560" width="160" height="14" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <text class="l" x="300" y="572">specimen (live or stained)</text><text class="l" x="60" y="660">up to 1500X</text><text class="l" x="60" y="690">resolves 0.2 µm</text>
  <ellipse cx="200" cy="460" rx="70" ry="18" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/>
  <text class="l" x="300" y="467">objective lens: first image</text>
  <ellipse cx="200" cy="300" rx="70" ry="18" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/>
  <text class="l" x="300" y="307">eyepiece lens: enlarges it again</text>
  <circle cx="200" cy="120" r="22" fill="#fff" stroke="#14181f" stroke-width="4"/><circle cx="200" cy="120" r="8" fill="#14181f"/>
  <text class="l" x="300" y="127">eye sees the image</text>
  <!-- TEM: gun at top, beam down through a thin specimen and magnetic lenses to a screen -->
  <rect x="560" y="120" width="80" height="40" rx="8" fill="#5b3fb5"/>
  <text class="s" x="600" y="180">electron gun</text>
  <path d="M600 190 L600 700" stroke="#8f78d9" stroke-width="10" marker-end="url(#ar)"/>
  <rect x="540" y="250" width="120" height="26" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <rect x="540" y="500" width="120" height="26" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <text class="l" x="680" y="268">magnetic lens</text>
  <text class="l" x="680" y="518">magnetic lens</text>
  <rect x="550" y="380" width="100" height="8" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <text class="l" x="680" y="390">very thin, dead specimen</text>
  <rect x="520" y="705" width="160" height="16" fill="#d9f2b0" stroke="#4b5563" stroke-width="3"/>
  <text class="s" x="600" y="760">fluorescent screen or film</text>
  <text class="l" x="680" y="600">internal structure</text><text class="l" x="680" y="628">up to 250,000X</text>
  <!-- SEM: beam scanned across a metal-coated surface; reflected electrons reach a detector -->
  <rect x="960" y="120" width="80" height="40" rx="8" fill="#5b3fb5"/>
  <text class="s" x="1000" y="180">electron gun</text>
  <path d="M1000 190 L1000 300" stroke="#8f78d9" stroke-width="10"/>
  <path d="M1000 300 L960 540 M1000 300 L1000 540 M1000 300 L1040 540" stroke="#8f78d9" stroke-width="5" fill="none"/>
  <rect x="940" y="250" width="120" height="26" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <text class="l" x="1070" y="268">scanning coils</text>
  <rect x="900" y="560" width="200" height="40" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <path d="M900 560 q25 -30 50 0 t50 0 t50 0 t50 0" fill="#b2dbcc" stroke="#c9b27a" stroke-width="6"/>
  <text class="s" x="1000" y="640">metal-coated surface</text>
  <path d="M1030 540 L1110 430" stroke="#d98b2b" stroke-width="6" marker-end="url(#ar)"/>
  <rect x="1100" y="370" width="60" height="50" rx="6" fill="#d98b2b"/>
  <text class="s" x="1130" y="355">detector</text>
  <text class="t" x="1000" y="700">surface detail · up to 100,000X</text>
  <text class="s" x="700" y="785">Electron microscopes resolve 0.2 nm; a light microscope resolves 0.2 µm, a thousand times coarser.</text>
</svg>
