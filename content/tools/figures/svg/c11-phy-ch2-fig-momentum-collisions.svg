<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.9 to 2.18 and topics 2.7 to 2.12: momentum, impulse, conservation of momentum, elastic and inelastic collisions in one and two dimensions, and rocket propulsion. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="32">Momentum, impulse, collisions and rocket propulsion</text>
  <!-- momentum -->
  <rect x="50" y="55" width="360" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Momentum and impulse (2.7)</text>
  <g class="f">
    <text x="70" y="110">p = m v   (kg m s^-1 = N s)          (2.25)</text>
    <text x="70" y="132">F x t = m vf - m vi                 (2.26)</text>
    <text x="70" y="154">Impulse = F x t = m vf - m vi       (2.27)</text>
  </g>
  <g class="t">
    <text x="70" y="182">second law in terms of momentum: the time rate of</text>
    <text x="70" y="198">change of momentum of a body equals the applied force;</text>
    <text x="70" y="214">more general than F = ma, it allows for a changing mass</text>
    <text x="70" y="230">(a rocket burning fuel)</text>
    <text x="70" y="256"><tspan class="b">Example 2.6:</tspan> 1500 kg car, 20 to 15 m s^-1 in 3.0 s:</text>
    <text x="70" y="272">F = (1500 x 15 - 1500 x 20)/3.0 = -2500 N = -2.5 kN (retarding)</text>
    <text x="70" y="296">conservation: the total linear momentum of an</text>
    <text x="70" y="312">isolated system stays constant</text>
  </g>
  <!-- elastic 1-D -->
  <rect x="430" y="55" width="360" height="270" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="610" y="83">Elastic collision in one dimension (2.8)</text>
  <circle cx="480" cy="120" r="14" fill="#bcdcf0" stroke="#4b5563"/><circle cx="560" cy="120" r="16" fill="#f8c8b8" stroke="#4b5563"/>
  <path d="M496 120 H520" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/><path d="M578 120 H598" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="470" y="146">m1, v1</text><text class="r" x="548" y="146">m2, v2</text>
  <text class="r" x="620" y="124">before</text>
  <circle cx="680" cy="120" r="14" fill="#bcdcf0" stroke="#4b5563"/><circle cx="750" cy="120" r="16" fill="#f8c8b8" stroke="#4b5563"/>
  <path d="M696 120 H714" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/><path d="M768 120 H790" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="668" y="146">v1'</text><text class="r" x="742" y="146">v2'</text>
  <text class="r" x="700" y="162">after</text>
  <g class="f">
    <text x="450" y="188">v1' = (m1-m2)/(m1+m2) v1 + 2m2/(m1+m2) v2</text>
    <text x="450" y="206">v2' = 2m1/(m1+m2) v1 + (m2-m1)/(m1+m2) v2</text>
    <text x="450" y="226">v1 - v2 = -(v1' - v2')</text>
  </g>
  <g class="t">
    <text x="450" y="250">relative velocity of approach = relative velocity of separation</text>
    <text x="450" y="268">(i) m1 = m2: velocities exchanged;</text>
    <text x="450" y="284">(ii) m2 at rest: m1 stops, m2 moves with v1;</text>
    <text x="450" y="300">(iii) light m1 on massive m2 at rest: v1' = -v1, v2' = 0;</text>
    <text x="450" y="316">(iv) massive m1 on light m2 at rest: v1' about v1, v2' about 2 v1</text>
  </g>
  <!-- inelastic -->
  <rect x="810" y="55" width="340" height="270" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Inelastic collisions (2.10, 2.11)</text>
  <circle cx="860" cy="120" r="14" fill="#bcdcf0" stroke="#4b5563"/><circle cx="940" cy="120" r="16" fill="#f8c8b8" stroke="#4b5563"/>
  <path d="M876 120 H900" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <circle cx="1060" cy="120" r="20" fill="#f8c8b8" stroke="#4b5563"/><circle cx="1050" cy="120" r="9" fill="#bcdcf0" stroke="#4b5563"/>
  <path d="M1082 120 H1110" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="846" y="146">m1, v1i</text><text class="r" x="926" y="146">m2 at rest</text><text class="r" x="1030" y="150">m1 + m2, vf</text>
  <g class="f">
    <text x="830" y="178">vf = m1 v1i / (m1 + m2)           (2.37)</text>
    <text x="830" y="196">KE lost / KEi = m2 / (m1 + m2)    (2.38)</text>
  </g>
  <g class="t">
    <text x="830" y="222">perfectly inelastic: the bodies stick together;</text>
    <text x="830" y="238">momentum conserved, kinetic energy not (heat,</text>
    <text x="830" y="254">sound, deformation): karate chop, car crash, bat and ball</text>
    <text x="830" y="276">2-D (Fig. 2.17): M vf cos phi = sum of x-momenta,</text>
    <text x="830" y="292">M vf sin phi = sum of y-momenta;</text>
    <text x="830" y="308">KEf = (1/2) M vf^2, less than KEi</text>
  </g>
  <!-- 2-D elastic -->
  <rect x="50" y="365" width="560" height="250" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="330" y="393">Elastic glancing collision in two dimensions (2.9, Fig. 2.15)</text>
  <path d="M80 480 H330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M230 560 V400" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="110" cy="480" r="10" fill="#bcdcf0" stroke="#4b5563"/>
  <path d="M124 480 H190" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <circle cx="230" cy="480" r="12" fill="#f8c8b8" stroke="#4b5563"/>
  <path d="M230 480 L310 420" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M230 480 L300 540" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="96" y="504">m1, v1i</text><text class="r" x="236" y="504">m2 at rest</text>
  <text class="r" x="300" y="418">m1, v1f (theta1)</text><text class="r" x="300" y="556">m2, v2f (theta2)</text>
  <g class="f">
    <text x="400" y="440">x: m1 v1i = m1 v1f cos theta1</text>
    <text x="400" y="458">       + m2 v2f cos theta2</text>
    <text x="400" y="476">y: 0 = m1 v1f sin theta1</text>
    <text x="400" y="494">       - m2 v2f sin theta2</text>
    <text x="400" y="512">KE: m1 v1i^2 = m1 v1f^2 + m2 v2f^2</text>
  </g>
  <g class="t">
    <text x="400" y="536">four unknowns v1f, v2f, theta1, theta2</text>
    <text x="70" y="576"><tspan class="b">Example 2.9:</tspan> 1 kg at 5 m s^-1 on 1 kg at rest: after, 3 m s^-1 at 30 degrees and</text>
    <text x="70" y="592">4 m s^-1 at 53 degrees; px 2.60 + 2.40 = 5 kg m s^-1, KE 4.5 + 8 = 12.5 J: elastic</text>
  </g>
  <!-- rocket -->
  <rect x="630" y="365" width="520" height="250" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="890" y="393">Rocket propulsion (2.12, Fig. 2.18)</text>
  <path d="M700 400 L720 380 L740 400 V520 H700 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="704" y="420" width="32" height="40" fill="#bcdcf0"/><rect x="704" y="466" width="32" height="30" fill="#dbe9f5"/>
  <path d="M700 520 L690 540 H750 L740 520" fill="#4b5563"/>
  <path d="M705 545 Q720 580 735 545" fill="#f5a623"/>
  <text class="r" x="748" y="436">fuel (liquid hydrogen)</text><text class="r" x="748" y="482">liquid oxygen</text><text class="r" x="748" y="532">combustion chamber</text>
  <text class="r" x="748" y="568">hot gas out at over</text>
  <text class="r" x="748" y="582">4000 m s^-1</text>
  <g class="f"><text x="900" y="410">a = m v / M                (2.42)</text></g>
  <g class="t">
    <text x="900" y="436">m = mass of gas ejected per second, v its</text>
    <text x="900" y="452">velocity relative to the rocket; m v = thrust;</text>
    <text x="900" y="468">M = mass of the rocket, which falls as fuel</text>
    <text x="900" y="484">burns, so the acceleration increases</text>
    <text x="900" y="508">a typical rocket burns about 10 000 kg s^-1;</text>
    <text x="900" y="524">over 80% of the launch mass is fuel; multi-</text>
    <text x="900" y="540">stage rockets discard each stage when spent</text>
    <text x="900" y="564">gain in momentum of the gases = gain in</text>
    <text x="900" y="580">momentum of the rocket, opposite directions</text>
  </g>
  <!-- bottom -->
  <rect x="50" y="635" width="1100" height="120" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="663">Conservation of momentum (Fig. 2.9) and the worked examples</text>
  <g class="t">
    <text x="70" y="670">two balls on one line: F t = m1 v1' - m1 v1 and F' t = m2 v2' - m2 v2 with F' = -F, so m1 v1 + m2 v2 = m1 v1' + m2 v2' (2.28); an isolated system has no external force</text>
    <text x="70" y="690"><tspan class="b">2.7:</tspan> 2.0 kg at 6.0 m s^-1 meets 3.0 kg at 4 m s^-1 head on (12 - 12 = 0); if the 3 kg ball leaves at 3.0 m s^-1, 0 = 2 v1' - 9, v1' = 4.5 m s^-1</text>
    <text x="70" y="710"><tspan class="b">2.8:</tspan> 70 g at 9 m s^-1 on 140 g at rest, elastic: v1' = (70-140)/(210) x 9 = -3 m s^-1; v2' = 2 x 70/210 x 9 = 6 m s^-1</text>
    <text x="70" y="730"><tspan class="b">2.10:</tspan> 2 kg at 4 m s^-1 sticks to 3 kg at rest, vf = 1.6 m s^-1: p = 8 kg m s^-1 before and after; KE 16 J before, 6.4 J after, 9.6 J lost</text>
  </g>
  <text class="s" x="600" y="788" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
