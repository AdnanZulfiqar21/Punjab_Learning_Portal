<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="q" cx="50%" cy="50%" r="60%" fx="50%" fy="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f3b9bd"/></radialGradient>
  </defs>
  <rect width="900" height="370" fill="#ffffff"/>
  <!-- Original drawing after the uncaptioned proton and neutron discs beside Table 12.4 of the Class XI Physics textbook (PDF page 272): a red disc Proton with quarks u, u, d and a green disc Neutron with quarks u, d, d. -->
  <text x="230.0" y="44.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">Proton</text>
  <circle cx="230.0" cy="205.0" r="130.0" stroke="#e8232b" stroke-width="2" fill="#e8232b"/>
  <circle cx="170.0" cy="160.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="170.0" y="170.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <circle cx="282.0" cy="160.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="282.0" y="170.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <circle cx="230.0" cy="267.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="230.0" y="277.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <text x="670.0" y="44.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">Neutron</text>
  <circle cx="670.0" cy="205.0" r="130.0" stroke="#0f9d4a" stroke-width="2" fill="#0f9d4a"/>
  <circle cx="610.0" cy="160.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="610.0" y="170.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <circle cx="722.0" cy="160.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="722.0" y="170.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <circle cx="670.0" cy="267.0" r="28.0" stroke="#ffffff" stroke-width="2.5" fill="url(#q)"/>
  <text x="670.0" y="277.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
