<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 1.23 (C11-BIO, PDF p25): flat drawing after the printed plate of five amphibians on white, each named below. Top row: Salamander (a red-orange salamander with pale spots, head lower left), Newt (a slender green newt with a red belly stripe and a long curved tail), Frog (a yellow frog with black blotches, sitting). Bottom row: Caecilian (a dark brown legless worm-like amphibian lying in loops) and Toad (a warty brown toad, sitting). No photograph is reproduced. -->
  <rect width="1100" height="560" fill="#ffffff"/>
  <!-- Salamander -->
  <path d="M60 190 C40 170 60 140 100 140 C140 140 170 120 220 110 C280 98 330 90 380 80 C400 76 405 88 390 94 C330 115 280 135 230 150 C200 160 170 175 140 195 C110 212 75 210 60 190 Z" fill="#d84a3a" stroke="#8a2418" stroke-width="3"/>
  <path d="M120 150 L105 120 L95 118 M150 175 L135 215 L125 222 M230 140 L240 110 L252 104 M240 150 L265 175 L275 180" stroke="#c03a2a" stroke-width="9" fill="none" stroke-linecap="round"/>
