  <circle cx="690" cy="360" r="9" fill="#2a1a08"/><circle cx="693" cy="357" r="3" fill="#e8c060"/>
  <g font-size="24" fill="#1a1a1a" text-anchor="middle">
    <text x="210" y="265">Salamander</text>
    <text x="560" y="245">Newt</text>
    <text x="920" y="265">Frog</text>
