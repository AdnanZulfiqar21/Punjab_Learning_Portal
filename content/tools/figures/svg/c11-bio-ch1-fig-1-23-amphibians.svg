  <path d="M480 140 C520 158 560 172 600 178 C640 184 680 180 700 168" stroke="#e8402a" stroke-width="7" fill="none"/>
  <path d="M480 110 L470 80 L460 76 M500 145 L495 180 M600 150 L615 120 L628 116 M610 180 L630 210" stroke="#2e8a3a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="428" cy="112" r="5" fill="#101010"/>
  <!-- Frog -->
  <path d="M840 190 C830 140 860 95 910 90 C950 86 990 110 1000 150 C1010 180 1000 205 980 210 L860 212 C848 208 842 200 840 190 Z" fill="#e2c530" stroke="#7a6a10" stroke-width="3"/>
  <path d="M860 205 C830 210 820 225 850 228 L900 225 M985 205 C1020 205 1040 220 1020 228 L960 226" stroke="#c8a820" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#2a2a10"><ellipse cx="900" cy="120" rx="12" ry="8"/><ellipse cx="940" cy="150" rx="14" ry="9"/><ellipse cx="970" cy="125" rx="10" ry="7"/><ellipse cx="880" cy="165" rx="10" ry="7"/><ellipse cx="960" cy="185" rx="12" ry="7"/></g>
  <circle cx="875" cy="105" r="9" fill="#101010"/><circle cx="878" cy="102" r="3" fill="#ffffff"/>
  <!-- Caecilian -->
  <path d="M200 380 C220 330 340 320 420 340 C500 360 510 410 460 430 C400 455 280 450 230 430 C190 412 230 390 300 395 C360 400 420 400 440 385" fill="none" stroke="#3a2a14" stroke-width="30" stroke-linecap="round"/>
  <path d="M200 380 C220 330 340 320 420 340 C500 360 510 410 460 430 C400 455 280 450 230 430 C190 412 230 390 300 395 C360 400 420 400 440 385" fill="none" stroke="#6a5028" stroke-width="22" stroke-linecap="round" stroke-dasharray="3 9"/>
  <path d="M440 385 C470 375 500 380 520 395" stroke="#3a2a14" stroke-width="28" fill="none" stroke-linecap="round"/>
  <circle cx="524" cy="392" r="4" fill="#101010"/>
