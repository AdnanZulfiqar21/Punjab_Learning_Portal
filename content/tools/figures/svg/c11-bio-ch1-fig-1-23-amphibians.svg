  <path d="M650 450 C640 390 680 340 740 330 C790 322 830 350 840 400 C845 430 835 455 810 460 L680 462 C662 460 652 456 650 450 Z" fill="#a8783a" stroke="#5a3a14" stroke-width="3"/>
