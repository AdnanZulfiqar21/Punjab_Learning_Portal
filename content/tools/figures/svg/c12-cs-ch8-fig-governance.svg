<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original: nested circles of international frameworks, national policy and developers around people, and an interdisciplinary team. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Responsible innovation and AI governance (after Fig 8.7)</text>
  <circle cx="300.0" cy="250.0" r="180.0" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <circle cx="300.0" cy="250.0" r="135.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <circle cx="300.0" cy="250.0" r="90.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <circle cx="300.0" cy="250.0" r="45.0" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="300.0" y="255.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">people</text>
  <text x="300.0" y="185.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">developers</text>
  <text x="300.0" y="140.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">national policy</text>
  <text x="300.0" y="95.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">international frameworks</text>
  <rect x="540.0" y="80.0" width="330.0" height="330.0" rx="10" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="705.0" y="106.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">working together</text>
  <text x="560.0" y="145.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">legal experts</text>
  <text x="560.0" y="164.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">compliance with laws</text>
  <text x="560.0" y="197.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">sociologists</text>
  <text x="560.0" y="216.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">social impact</text>
  <text x="560.0" y="249.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">ethicists</text>
  <text x="560.0" y="268.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">moral decisions</text>
  <text x="560.0" y="301.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">engineers</text>
  <text x="560.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">safe, working systems</text>
  <text x="560.0" y="353.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">users and communities</text>
  <text x="560.0" y="372.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">needs, languages, access</text>
  <text x="450.0" y="462.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Put people first: technology should improve lives fairly, not only earn profit.</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
