<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.3: the heavy-oxygen experiment showing water is the source of the oxygen released. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .b{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="plant"><rect x="-40" y="40" width="80" height="60" rx="8" fill="#8a4b00"/><path d="M0 40 V-60" stroke="#0f7a62" stroke-width="8"/><path d="M0 -20 q-60 -40 -70 10 q40 20 70 -10 M0 -50 q60 -40 70 10 q-40 20 -70 -10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/></g>
  </defs>
  <text class="h" x="320" y="50">Group 1 plants</text>
  <text class="h" x="880" y="50">Group 2 plants</text>
  <g transform="translate(320,300)"><use href="#plant"/></g>
  <g transform="translate(880,300)"><use href="#plant"/></g>
  <!-- inputs group 1 -->
  <rect x="60" y="160" width="150" height="56" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="b" x="135" y="196">H2 18O</text>
  <text class="s" x="135" y="240">heavy-oxygen water</text>
  <rect x="60" y="360" width="150" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text class="b" x="135" y="396">C 16O2</text>
  <text class="s" x="135" y="440">normal carbon dioxide</text>
  <path d="M215 190 L270 250" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><path d="M215 385 L270 330" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M370 250 L440 190" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="440" y="150" width="150" height="56" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="b" x="515" y="186" style="fill:#1f6fb5">18O2 released</text>
  <!-- inputs group 2 -->
  <rect x="620" y="160" width="150" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text class="b" x="695" y="196">H2 16O</text>
  <text class="s" x="695" y="240">normal water</text>
  <rect x="620" y="360" width="150" height="56" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="b" x="695" y="396">C 18O2</text>
  <text class="s" x="695" y="440">heavy-oxygen carbon dioxide</text>
  <path d="M775 190 L830 250" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><path d="M775 385 L830 330" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M930 250 L1000 190" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="1000" y="150" width="150" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text class="b" x="1075" y="186">16O2 released</text>
  <text class="s" x="600" y="520">The heavy isotope appears in the oxygen gas only when it was supplied in the water.</text>
  <text class="s" x="600" y="548">So the oxygen released in photosynthesis comes from water, as Van Niel had hypothesised in the 1930s.</text>
  <text class="s" x="600" y="600">Water is split (photolysis); its hydrogen reduces NADP to NADPH, the reducing power for turning CO2 into sugar.</text>
</svg>
