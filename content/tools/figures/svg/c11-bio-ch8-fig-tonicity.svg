<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.16: a plant cell in hypotonic, isotonic and hypertonic solutions. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <!-- hypotonic -->
  <text class="h" x="200" y="40">Hypotonic solution</text>
  <text class="s" x="200" y="68">less solute outside than inside</text>
  <rect x="80" y="110" width="240" height="200" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <rect x="90" y="120" width="220" height="180" rx="10" fill="#c9b27a"/>
  <rect x="100" y="130" width="200" height="160" rx="8" fill="#1f6fb5"/>
  <rect x="106" y="136" width="188" height="148" rx="6" fill="#dbe9f5"/>
  <g stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"><path d="M60 210 L100 210"/><path d="M340 210 L300 210"/><path d="M200 90 L200 128"/></g>
  <text class="s" x="200" y="350">water enters; cell swells and</text><text class="s" x="200" y="374">becomes turgid; the wall stops</text><text class="s" x="200" y="398">it bursting</text>
  <!-- isotonic -->
  <text class="h" x="600" y="40">Isotonic solution</text>
  <text class="s" x="600" y="68">same solute concentration</text>
  <rect x="480" y="110" width="240" height="200" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <rect x="490" y="120" width="220" height="180" rx="10" fill="#c9b27a"/>
  <rect x="504" y="134" width="192" height="152" rx="8" fill="#1f6fb5"/>
  <rect x="510" y="140" width="180" height="140" rx="6" fill="#dbe9f5"/>
  <g stroke="#1f6fb5" stroke-width="4"><path d="M460 200 L500 200" marker-end="url(#ab)"/><path d="M500 220 L460 220" marker-end="url(#ab)"/></g>
  <text class="s" x="600" y="350">no net movement of water;</text><text class="s" x="600" y="374">the cell keeps its shape</text>
  <!-- hypertonic -->
  <text class="h" x="1000" y="40">Hypertonic solution</text>
  <text class="s" x="1000" y="68">more solute outside than inside</text>
  <rect x="880" y="110" width="240" height="200" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <rect x="890" y="120" width="220" height="180" rx="10" fill="#c9b27a"/>
  <path d="M950 160 q50 -20 100 0 q20 40 0 80 q-50 20 -100 0 q-20 -40 0 -80 z" fill="#1f6fb5"/>
  <path d="M958 168 q42 -16 84 0 q16 34 0 68 q-42 16 -84 0 q-16 -34 0 -68 z" fill="#dbe9f5"/>
  <g stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"><path d="M940 200 L900 200"/><path d="M1060 200 L1100 200"/></g>
  <text class="s" x="1000" y="350">water leaves; the protoplast</text><text class="s" x="1000" y="374">shrinks away from the wall:</text><text class="s" x="1000" y="398">plasmolysis</text>
  <text class="s" x="600" y="470">Osmoregulation keeps the internal balance of water and solutes steady whatever the surroundings.</text>
  <text class="s" x="600" y="520">Marine hydrophytes face hypertonic water and excrete salt; freshwater hydrophytes face hypotonic water and expel excess water.</text>
  <text class="s" x="600" y="560">Brown: cell wall. Blue: plasma membrane. Pale: cytoplasm and vacuole.</text>
</svg>
