<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 12.20 (C11-BIO, PDF p275): a skeletal muscle joined by its tendon to a bone (left); a bundle of muscle fibres; one muscle fibre (a cell) arching to the right and cut across to show its myofibrils wrapped in sarcoplasmic reticulum under the sarcolemma; one striped myofibril curving down to the left with a sarcomere bracketed and actin and myosin myofilaments coming out of its end; a boxed part enlarged at lower right (H zone, I band, A band, Z line, myosin, actin); inset top right: sarcolemma makes T-tubules. Original flat drawing after the printed figure. -->
