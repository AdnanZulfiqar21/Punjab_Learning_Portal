  <text x="280.0" y="85.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">high meadows above the tree line</text>
  <rect x="560.0" y="60.0" width="325.0" height="380.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#ffffff"/>
  <text x="576.0" y="92.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">where</text>
  <text x="584.0" y="112.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Gilgit-Baltistan, Chitral, Swat,</text>
  <text x="584.0" y="130.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">AJK, Deosai Plains</text>
  <text x="576.0" y="156.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">climate</text>
  <text x="584.0" y="176.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">mean 1 to 10 C; heavy snow</text>
  <text x="584.0" y="194.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(up to 6 feet)</text>
  <text x="576.0" y="220.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">plants</text>
  <text x="584.0" y="240.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">stunted junipers, birch, willow,</text>
  <text x="584.0" y="258.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">alpine grasses and wild flowers</text>
  <text x="576.0" y="284.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">animals</text>
  <text x="584.0" y="304.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">snow leopard, brown bear, ibex,</text>
  <text x="584.0" y="322.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">musk deer, marmot; monal, eagle</text>
  <text x="576.0" y="348.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">status</text>
  <text x="584.0" y="368.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">fragile: sensitive to warming</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
