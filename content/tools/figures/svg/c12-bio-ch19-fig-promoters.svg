<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.13: prokaryotic promoter boxes TTGACA at -35 and TATAAT at -10, eukaryotic CAAT box at -70 and TATA box at -25 before the +1 start point, and the five subunits of prokaryotic RNA polymerase. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Promoters: where RNA polymerase starts</text>
  <text x="40.0" y="90.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">prokaryote</text>
  <line x1="40.0" y1="120.0" x2="860.0" y2="120.0" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <rect x="416.5" y="104.0" width="82.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="457.5" y="126.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">TTGACA</text>
  <text x="457.5" y="160.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">-35 sequence</text>
  <rect x="604.0" y="104.0" width="82.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="645.0" y="126.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">TATAAT</text>
  <text x="645.0" y="160.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">-10 sequence</text>
  <line x1="720.0" y1="120.0" x2="720.0" y2="86.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="720.0" y1="86.0" x2="782.8" y2="86.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M790.0 86.0 L781.8 89.8 L781.8 82.2 Z" fill="#0f7a62"/>
  <text x="724.0" y="160.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">+1 start</text>
  <text x="40.0" y="240.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">eukaryote</text>
  <line x1="40.0" y1="270.0" x2="860.0" y2="270.0" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <rect x="137.5" y="254.0" width="115.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="195.0" y="276.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">GGCCAATCT</text>
  <text x="195.0" y="310.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">CAAT box (-70)</text>
  <rect x="491.5" y="254.0" width="82.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="532.5" y="276.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">TATAAA</text>
  <text x="532.5" y="310.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">TATA box (-25)</text>
  <line x1="720.0" y1="270.0" x2="720.0" y2="236.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="720.0" y1="236.0" x2="782.8" y2="236.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M790.0 236.0 L781.8 239.8 L781.8 232.2 Z" fill="#0f7a62"/>
  <text x="724.0" y="310.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">+1 start</text>
  <text x="450.0" y="384.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the promoter is a signal on the DNA; it is not itself transcribed</text>
  <rect x="30.0" y="405.0" width="840.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="435.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">prokaryotic RNA polymerase: five subunits</text>
  <ellipse cx="140.0" cy="470.0" rx="60.0" ry="24.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="140.0" y="474.9" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">2 x alpha</text>
  <text x="140.0" y="516.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">bind regulatory proteins</text>
  <ellipse cx="340.0" cy="470.0" rx="60.0" ry="24.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="340.0" y="474.9" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">beta'</text>
  <text x="340.0" y="516.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">binds template DNA</text>
  <ellipse cx="540.0" cy="470.0" rx="60.0" ry="24.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="540.0" y="474.9" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">beta</text>
  <text x="540.0" y="516.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">binds RNA nucleotides</text>
  <ellipse cx="740.0" cy="470.0" rx="60.0" ry="24.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="740.0" y="474.9" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">sigma</text>
  <text x="740.0" y="516.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">finds promoter, starts</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
