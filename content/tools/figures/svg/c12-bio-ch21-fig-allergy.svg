<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.16: an allergen makes plasma cells produce E-antibodies that coat mast cells; on later exposure the allergen binds them and the mast cell releases histamine, causing allergy symptoms; treatment by antihistamines or desensitization. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">An allergic response</text>
  <rect x="15.0" y="55.0" width="420.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">first exposure: sensitisation</text>
  <circle cx="60.0" cy="120.0" r="7.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <circle cx="80.0" cy="150.0" r="7.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <circle cx="50.0" cy="165.0" r="7.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <text x="70.0" y="200.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">allergen</text>
  <text x="70.0" y="216.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">(pollen, dust...)</text>
  <line x1="105.0" y1="145.0" x2="143.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M150.0 145.0 L142.7 148.4 L142.7 141.6 Z" fill="#14181f"/>
  <ellipse cx="200.0" cy="145.0" rx="40.0" ry="30.0" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
  <text x="200.0" y="196.0" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">plasma cells make</text>
  <text x="200.0" y="212.0" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">E-antibodies (IgE)</text>
  <line x1="245.0" y1="145.0" x2="283.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M290.0 145.0 L282.7 148.4 L282.7 141.6 Z" fill="#14181f"/>
  <circle cx="355.0" cy="160.0" r="48.0" stroke="#be185d" stroke-width="2" fill="#fdf2f8"/>
  <circle cx="340.0" cy="150.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="367.0" cy="145.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="360.0" cy="172.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="337.0" cy="175.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="375.0" cy="168.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <line x1="306.5" y1="132.0" x2="317.4" y2="138.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="306.5" y1="132.0" x2="292.6" y2="134.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="306.5" y1="132.0" x2="301.6" y2="118.8" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="335.8" y1="107.4" x2="340.2" y2="119.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="335.8" y1="107.4" x2="323.7" y2="100.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="335.8" y1="107.4" x2="340.6" y2="94.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="374.2" y1="107.4" x2="369.8" y2="119.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="374.2" y1="107.4" x2="369.4" y2="94.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="374.2" y1="107.4" x2="386.3" y2="100.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="403.5" y1="132.0" x2="392.6" y2="138.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="403.5" y1="132.0" x2="408.4" y2="118.8" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="403.5" y1="132.0" x2="417.4" y2="134.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <text x="355.0" y="236.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">mast cell coated</text>
  <text x="355.0" y="252.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">with IgE</text>
  <text x="225.0" y="310.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mast cells sit in connective tissue near blood vessels</text>
  <rect x="465.0" y="55.0" width="420.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="675.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">later exposure: histamine release</text>
  <circle cx="600.0" cy="170.0" r="48.0" stroke="#be185d" stroke-width="2" fill="#fdf2f8"/>
  <line x1="551.5" y1="142.0" x2="562.4" y2="148.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="551.5" y1="142.0" x2="537.6" y2="144.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="551.5" y1="142.0" x2="546.6" y2="128.8" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <circle cx="537.6" cy="134.0" r="6.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <line x1="580.8" y1="117.4" x2="585.2" y2="129.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="580.8" y1="117.4" x2="568.7" y2="110.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="580.8" y1="117.4" x2="585.6" y2="104.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <circle cx="575.4" cy="102.3" r="6.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <line x1="619.2" y1="117.4" x2="614.8" y2="129.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="619.2" y1="117.4" x2="614.4" y2="104.2" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="619.2" y1="117.4" x2="631.3" y2="110.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <circle cx="624.6" cy="102.3" r="6.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <line x1="648.5" y1="142.0" x2="637.6" y2="148.3" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="648.5" y1="142.0" x2="653.4" y2="128.8" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="648.5" y1="142.0" x2="662.4" y2="144.4" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <circle cx="662.4" cy="134.0" r="6.0" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <circle cx="670.0" cy="190.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="690.0" cy="210.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="680.0" cy="170.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="705.0" cy="185.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <circle cx="695.0" cy="230.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <text x="760.0" y="160.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">histamine</text>
  <text x="500.0" y="268.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">vessels widen, fluid leaks: sneezing,</text>
  <text x="500.0" y="287.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">runny nose, itching; sometimes</text>
  <text x="500.0" y="306.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">anaphylactic shock (hard to breathe)</text>
  <rect x="40.0" y="375.0" width="820.0" height="165.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="402.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">treatment</text>
  <text x="60.0" y="430.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">antihistamine drugs block histamine and give temporary relief</text>
  <text x="60.0" y="454.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">desensitization: injected allergen extracts make the body produce G-antibodies (IgG),</text>
  <text x="60.0" y="478.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">which destroy the allergen before it can reach the E-antibodies on mast cells</text>
  <text x="60.0" y="502.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">allergens: dust, moulds, pollen, cat dander, some foods, some medicines (e.g. penicillin)</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
