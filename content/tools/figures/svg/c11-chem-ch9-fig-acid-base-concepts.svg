<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after topics 9.1 and 9.2 and Table 9.1: Bronsted-Lowry proton transfer with conjugate pairs, and Lewis electron-pair donation forming adducts. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:15px;fill:#14181f;text-anchor:middle}
      .l{font-size:11px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Acids and bases: proton transfer (Bronsted-Lowry) and electron-pair transfer (Lewis)</text>
  <!-- Bronsted-Lowry -->
  <rect x="50" y="55" width="540" height="250" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="83">Bronsted-Lowry (1923): acid donates H+, base accepts H+</text>
  <g class="f">
    <text x="110" y="135">HCl</text><text x="160" y="135">+</text><text x="215" y="135">H2O</text><text x="380" y="135">H3O+</text><text x="440" y="135">+</text><text x="500" y="135">Cl-</text>
  </g>
  <path d="M250 130 H340" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 138 H260" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M120 113 C 160 95, 190 95, 212 113" stroke="#d7322f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="l" x="165" y="97" style="fill:#d7322f">H+</text>
  <g class="l">
    <text x="110" y="155" style="fill:#d7322f">acid</text><text x="215" y="155" style="fill:#1f6fb5">base</text>
    <text x="380" y="155" style="fill:#d7322f">conjugate acid</text><text x="500" y="155" style="fill:#1f6fb5">conjugate base</text>
  </g>
  <g class="f">
    <text x="110" y="205">NH3</text><text x="160" y="205">+</text><text x="215" y="205">H2O</text><text x="380" y="205">NH4+</text><text x="440" y="205">+</text><text x="500" y="205">OH-</text>
  </g>
  <path d="M250 200 H340" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 208 H260" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M205 183 C 185 165, 150 165, 122 183" stroke="#d7322f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="l" x="165" y="167" style="fill:#d7322f">H+</text>
  <g class="l">
    <text x="110" y="225" style="fill:#1f6fb5">base</text><text x="215" y="225" style="fill:#d7322f">acid</text>
    <text x="380" y="225" style="fill:#d7322f">conjugate acid</text><text x="500" y="225" style="fill:#1f6fb5">conjugate base</text>
  </g>
  <text class="s" x="320" y="256">pairs: HCl / Cl-, H2O / H3O+, NH3 / NH4+, H2O / OH- (members differ by one H+)</text>
  <text class="s" x="320" y="274">water is amphoteric: a base with HCl, an acid with NH3</text>
  <text class="s" x="320" y="292">no solvent needed: HCl(g) + NH3(g) gives NH4Cl(s), HCl still the acid</text>
  <!-- Lewis -->
  <rect x="610" y="55" width="540" height="250" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="880" y="83">Lewis (1923): acid accepts an electron pair, base donates one</text>
  <g class="f">
    <text x="690" y="135">2 :NH3</text><text x="760" y="135">+</text><text x="810" y="135">Ag+</text><text x="1010" y="135">[H3N-Ag-NH3]+</text>
  </g>
  <path d="M845 130 H910" stroke="#1f6fb5" stroke-width="2" marker-end="url(#ab)"/>
  <g class="l">
    <text x="690" y="155" style="fill:#1f6fb5">Lewis base (donor)</text><text x="810" y="155" style="fill:#d7322f">Lewis acid</text><text x="1010" y="155" style="fill:#0f7a62">adduct, charge +1</text>
  </g>
  <g class="f">
    <text x="690" y="205">:F-</text><text x="760" y="205">+</text><text x="810" y="205">BF3</text><text x="1010" y="205">[BF4]-</text>
  </g>
  <path d="M845 200 H910" stroke="#1f6fb5" stroke-width="2" marker-end="url(#ab)"/>
  <g class="l">
    <text x="690" y="225" style="fill:#1f6fb5">Lewis base (donor)</text><text x="810" y="225" style="fill:#d7322f">Lewis acid (6 e-)</text><text x="1010" y="225" style="fill:#0f7a62">adduct, charge -1</text>
  </g>
  <text class="s" x="880" y="256">the donated pair becomes a coordinate covalent bond</text>
  <text class="s" x="880" y="274">boron in BF3 has an incomplete octet, so BF3 is a strong Lewis acid</text>
  <text class="s" x="880" y="292">the charge on the adduct equals the sum of the charges on the left</text>
  <!-- Table 9.1 -->
  <rect x="50" y="330" width="1100" height="180" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="358">Conjugate acid-base pairs of common species (Table 9.1)</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="200" y="388">Acid</text><text x="450" y="388">Base</text><text x="750" y="388">Conjugate acid</text><text x="1000" y="388">Conjugate base</text></g>
    <text x="200" y="418">HNO3</text><text x="450" y="418">H2O</text><text x="750" y="418">H3O+</text><text x="1000" y="418">NO3-</text>
    <text x="200" y="446">H2SO4</text><text x="450" y="446">H2O</text><text x="750" y="446">H3O+</text><text x="1000" y="446">HSO4-</text>
    <text x="200" y="474">H2O</text><text x="450" y="474">CO3 2-</text><text x="750" y="474">HCO3-</text><text x="1000" y="474">OH-</text>
  </g>
  <path d="M80 398 H1120" stroke="#9ca3af" stroke-width="1"/>
  <text class="s" x="600" y="498">in each row the acid and the conjugate base form one pair, the base and the conjugate acid the other</text>
  <text class="s" x="600" y="545">Arrhenius: acids and bases in water only. Bronsted-Lowry: any solvent, or none. Lewis: no proton required at all.</text>
  <text class="s" x="600" y="570">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
