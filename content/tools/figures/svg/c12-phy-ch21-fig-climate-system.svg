<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original diagram after Fig 21.10: the climate system at the centre linked by two-way arrows to its five components: the atmosphere (air), hydrosphere (water), cryosphere (ice and permafrost), lithosphere (rocky upper layer) and biosphere (living things). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Earth's climate system: five interacting parts (after Fig 21.10)</text>
  <circle cx="450.0" cy="255.0" r="70.0" stroke="#d98b2b" stroke-width="2" fill="#fff7cc"/>
  <text x="450.0" y="250.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">climate</text>
  <text x="450.0" y="268.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">system</text>
  <rect x="360.0" y="65.0" width="180.0" height="60.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="92.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">atmosphere</text>
  <text x="450.0" y="112.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">air</text>
  <line x1="450.0" y1="173.6" x2="450.0" y2="132.6" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M450.0 126.2 L453.4 133.5 L446.6 133.5 Z" fill="#4b5563"/>
  <path d="M450.0 180.0 L446.6 172.7 L453.4 172.7 Z" fill="#4b5563"/>
  <rect x="569.2" y="175.6" width="180.0" height="60.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ffffff"/>
  <text x="659.2" y="202.6" font-size="15" fill="#0e9aa7" text-anchor="middle" font-weight="700">hydrosphere</text>
  <text x="659.2" y="222.6" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">water, oceans</text>
  <line x1="527.5" y1="230.2" x2="580.3" y2="216.8" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M586.5 215.2 L580.3 220.3 L578.6 213.7 Z" fill="#4b5563"/>
  <path d="M521.3 231.8 L527.5 226.8 L529.2 233.3 Z" fill="#4b5563"/>
  <rect x="489.3" y="354.4" width="180.0" height="60.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="579.3" y="381.4" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">cryosphere</text>
  <text x="579.3" y="401.4" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ice, permafrost</text>
  <line x1="498.4" y1="320.4" x2="530.0" y2="354.5" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M534.3 359.2 L526.9 356.2 L531.9 351.6 Z" fill="#4b5563"/>
  <path d="M494.1 315.7 L501.5 318.7 L496.5 323.3 Z" fill="#4b5563"/>
  <rect x="230.7" y="354.4" width="180.0" height="60.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="320.7" y="381.4" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">lithosphere</text>
  <text x="320.7" y="401.4" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">rocky upper layer</text>
  <line x1="401.6" y1="320.4" x2="370.0" y2="354.5" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M365.7 359.2 L368.1 351.6 L373.1 356.2 Z" fill="#4b5563"/>
  <path d="M405.9 315.7 L403.5 323.3 L398.5 318.7 Z" fill="#4b5563"/>
  <rect x="150.8" y="175.6" width="180.0" height="60.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="240.8" y="202.6" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">biosphere</text>
  <text x="240.8" y="222.6" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">living things</text>
  <line x1="372.5" y1="230.2" x2="319.7" y2="216.8" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M313.5 215.2 L321.4 213.7 L319.7 220.3 Z" fill="#4b5563"/>
  <path d="M378.7 231.8 L370.8 233.3 L372.5 226.8 Z" fill="#4b5563"/>
  <text x="450.0" y="462.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Sunlight drives the system; a change in one part (for example melting ice) changes the others.</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
