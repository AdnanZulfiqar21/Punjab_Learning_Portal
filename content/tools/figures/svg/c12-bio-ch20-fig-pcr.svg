  <text x="240.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cycle 1</text>
  <line x1="210.0" y1="432.0" x2="270.0" y2="432.0" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
