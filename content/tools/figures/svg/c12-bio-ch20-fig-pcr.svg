  <line x1="470.0" y1="468.0" x2="530.0" y2="468.0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="470.0" y1="477.0" x2="530.0" y2="477.0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="470.0" y1="486.0" x2="530.0" y2="486.0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="470.0" y1="495.0" x2="530.0" y2="495.0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <text x="500.0" y="590.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">8 copies</text>
  <text x="630.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cycle 4</text>
  <line x1="600.0" y1="432.0" x2="660.0" y2="432.0" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="600.0" y1="441.0" x2="660.0" y2="441.0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
