  <text x="370.0" y="590.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">4 copies</text>
  <text x="500.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cycle 3</text>
  <line x1="470.0" y1="432.0" x2="530.0" y2="432.0" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
