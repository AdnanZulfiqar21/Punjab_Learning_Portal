<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 20.6: PCR as denaturation at about 98 C, annealing of primers at about 60 C and extension by Taq polymerase at 72 C, repeated so that 1 copy becomes 2, 4, 8 and 16, and more than a million after 20 cycles. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Polymerase chain reaction (PCR)</text>
  <rect x="40.0" y="55.0" width="265.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="172.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1. denaturation</text>
  <text x="172.0" y="112.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">about 98 C</text>
  <line x1="82.0" y1="170.0" x2="262.0" y2="170.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round"/>
  <line x1="82.0" y1="250.0" x2="262.0" y2="250.0" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <line x1="172.0" y1="190.0" x2="172.0" y2="224.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M172.0 230.0 L169.0 223.7 L175.0 223.7 Z" fill="#4b5563"/>
  <text x="172.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">strands separate</text>
  <line x1="308.0" y1="205.0" x2="317.4" y2="205.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M323.0 205.0 L316.7 208.0 L316.7 202.0 Z" fill="#14181f"/>
  <rect x="325.0" y="55.0" width="265.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="457.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">2. annealing</text>
  <text x="457.0" y="112.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">about 60 C</text>
  <line x1="367.0" y1="170.0" x2="547.0" y2="170.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round"/>
  <line x1="367.0" y1="250.0" x2="547.0" y2="250.0" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <line x1="507.0" y1="186.0" x2="547.0" y2="186.0" stroke="#0f7a62" stroke-width="7" stroke-linecap="round"/>
  <line x1="367.0" y1="234.0" x2="407.0" y2="234.0" stroke="#0f7a62" stroke-width="7" stroke-linecap="round"/>
  <text x="527.0" y="206.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">primer</text>
  <text x="387.0" y="222.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">primer</text>
  <text x="457.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">primers bind</text>
  <line x1="593.0" y1="205.0" x2="602.4" y2="205.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M608.0 205.0 L601.7 208.0 L601.7 202.0 Z" fill="#14181f"/>
  <rect x="610.0" y="55.0" width="265.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="742.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">3. extension</text>
  <text x="742.0" y="112.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">72 C, Taq polymerase</text>
  <line x1="652.0" y1="170.0" x2="832.0" y2="170.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round"/>
  <line x1="652.0" y1="250.0" x2="832.0" y2="250.0" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
