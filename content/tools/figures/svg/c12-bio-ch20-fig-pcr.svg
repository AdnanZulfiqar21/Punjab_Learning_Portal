  <path d="M796.0 234.0 L786.0 238.6 L786.0 229.4 Z" fill="#93c5fd"/>
  <text x="742.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">new strands made</text>
  <rect x="40.0" y="370.0" width="820.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="400.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">4. repeat: each cycle (1-2 minutes) doubles the DNA</text>
