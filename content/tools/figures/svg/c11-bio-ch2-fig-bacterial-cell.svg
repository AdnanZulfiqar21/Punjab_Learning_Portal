<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.1: a generalised bacterium, cut open lengthwise. -->
  <defs>
    <style>
      .t{font-size:28px;font-weight:700;fill:#14181f}
      .s{font-size:22px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- capsule, wall, membrane -->
  <rect x="150" y="250" width="620" height="300" rx="150" fill="#f3e9d2" stroke="#c9b27a" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="178" y="278" width="564" height="244" rx="122" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="12"/>
  <rect x="196" y="296" width="528" height="208" rx="104" fill="#eef6fb" stroke="#0f7a62" stroke-width="5"/>
  <!-- mesosome infoldings -->
  <path d="M250 320 c20 30 -10 60 15 85 M640 480 c-20 -30 10 -60 -15 -85" stroke="#0f7a62" stroke-width="5" fill="none"/>
  <!-- nucleoid -->
  <path d="M420 400 c20 -50 80 -50 100 -10 c20 40 -20 70 -50 50 c-30 -20 -70 20 -50 -40 c15 -40 60 -30 60 0 c0 30 -40 40 -60 0 z" fill="none" stroke="#5b3fb5" stroke-width="7" stroke-linejoin="round"/>
  <!-- plasmid -->
  <circle cx="600" cy="360" r="22" fill="none" stroke="#5b3fb5" stroke-width="6"/>
  <!-- ribosomes -->
  <g fill="#d98b2b">
    <circle cx="260" cy="440" r="7"/><circle cx="300" cy="470" r="7"/><circle cx="340" cy="330" r="7"/><circle cx="380" cy="470" r="7"/>
    <circle cx="560" cy="450" r="7"/><circle cx="620" cy="420" r="7"/><circle cx="660" cy="350" r="7"/><circle cx="520" cy="320" r="7"/><circle cx="300" cy="380" r="7"/>
  </g>
  <!-- flagellum -->
  <path d="M770 400 c40 -40 60 40 100 0 s60 40 90 0" stroke="#14181f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- pili -->
  <g stroke="#14181f" stroke-width="4" stroke-linecap="round">
    <path d="M300 250 l-15 -45"/><path d="M400 250 l-5 -45"/><path d="M520 250 l8 -45"/><path d="M620 252 l18 -42"/>
    <path d="M330 550 l-12 45"/><path d="M470 550 l4 45"/><path d="M590 548 l16 42"/>
  </g>
  <!-- labels -->
  <path class="lead" d="M165 300 L80 170"/><text class="t" x="40" y="150">Capsule</text>
  <path class="lead" d="M250 285 L250 130"/><text class="t" x="190" y="115">Cell wall</text>
  <path class="lead" d="M420 300 L440 125"/><text class="t" x="400" y="110">Cell membrane</text>
  <path class="lead" d="M452 410 L470 660"/><text class="t" x="380" y="700">Nucleoid</text><text class="s" x="380" y="730">circular DNA</text>
  <path class="lead" d="M600 338 L700 150"/><text class="t" x="650" y="135">Plasmid</text>
  <path class="lead" d="M620 420 L760 640"/><text class="t" x="700" y="680">Ribosomes</text><text class="s" x="700" y="710">70S</text>
  <path class="lead" d="M262 380 L120 620"/><text class="t" x="40" y="660">Mesosome</text>
  <path class="lead" d="M900 380 L900 200"/><text class="t" x="820" y="185">Flagellum</text>
  <path class="lead" d="M405 215 L360 60"/><text class="t" x="300" y="45">Pili</text>
</svg>
