<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.11 to 3.13: the nucleus, its envelope, a pore complex and the nucleolus. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- envelope: two membranes with perinuclear space -->
  <circle cx="450" cy="400" r="250" fill="#5b3fb5"/>
  <circle cx="450" cy="400" r="236" fill="#e8dff7"/>
  <circle cx="450" cy="400" r="222" fill="#5b3fb5"/>
  <circle cx="450" cy="400" r="210" fill="#c9b6ea"/>
  <!-- nuclear lamina -->
  <circle cx="450" cy="400" r="202" fill="none" stroke="#8f78d9" stroke-width="5" stroke-dasharray="6 6"/>
  <!-- pores: gaps in the envelope -->
  <g fill="#c9b6ea">
    <rect x="435" y="140" width="30" height="50"/><rect x="435" y="610" width="30" height="50"/>
    <rect x="190" y="385" width="50" height="30"/><rect x="660" y="385" width="50" height="30"/>
  </g>
  <g fill="none" stroke="#d98b2b" stroke-width="5">
    <rect x="433" y="142" width="34" height="46" rx="6"/><rect x="433" y="612" width="34" height="46" rx="6"/>
    <rect x="192" y="383" width="46" height="34" rx="6"/><rect x="662" y="383" width="46" height="34" rx="6"/>
  </g>
  <!-- chromatin -->
  <path d="M330 320 q40 -40 80 0 t80 0 t60 40 M320 420 q50 40 100 0 t90 10 M350 500 q60 -30 120 0 t80 -20" stroke="#5b3fb5" stroke-width="5" fill="none"/>
  <!-- nucleolus -->
  <circle cx="500" cy="400" r="48" fill="#5b3fb5"/>
  <circle cx="500" cy="400" r="48" fill="none" stroke="#3d2a80" stroke-width="3"/>
  <!-- RER continuous with outer membrane -->
  <path d="M700 400 q60 0 100 -40 M708 420 q70 0 110 -30 M716 440 q80 0 120 -20" stroke="#0f7a62" stroke-width="6" fill="none"/>
  <g fill="#d98b2b"><circle cx="740" cy="395" r="4"/><circle cx="770" cy="380" r="4"/><circle cx="750" cy="418" r="4"/><circle cx="790" cy="403" r="4"/><circle cx="770" cy="438" r="4"/><circle cx="810" cy="428" r="4"/></g>
  <!-- labels -->
  <path class="lead" d="M450 160 L450 80"/><text class="t" x="330" y="60">Nuclear pore complex</text><text class="s" x="300" y="85">controls traffic in and out; a basket on the inner side</text>
  <path class="lead" d="M238 262 L150 225"/><text class="t" x="30" y="160">Nuclear envelope</text><text class="s" x="30" y="185">two membranes with the</text><text class="s" x="30" y="208">perinuclear space between</text>
  <path class="lead" d="M250 400 L110 440"/><text class="t" x="20" y="470">Nuclear lamina</text><text class="s" x="20" y="495">protein lining; binds chromatin</text>
  <path class="lead" d="M380 490 L200 640"/><text class="t" x="60" y="670">Chromatin</text><text class="s" x="40" y="695">DNA + histone proteins</text>
  <path class="lead" d="M520 430 L640 640"/><text class="t" x="600" y="670">Nucleolus</text><text class="s" x="560" y="695">makes ribosomal subunits at NORs</text>
  <path class="lead" d="M830 378 L880 305"/><text class="t" x="840" y="262">Rough ER</text><text class="s" x="780" y="288">continuous with the outer membrane</text>
  <text class="t" x="400" y="300" style="fill:#3d2a80">Nucleoplasm</text>
  <text class="s" x="40" y="770">About 10 percent of a eukaryotic cell's volume; the envelope breaks down during division and re-forms afterwards.</text>
</svg>
