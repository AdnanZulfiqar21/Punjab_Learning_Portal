<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <!-- Original diagram for the relativity of simultaneity in topic 11.3: inside a carriage a lamp in the middle reaches both doors together; seen from outside, with the carriage moving at half the speed of light, the back door meets the light first. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The relativity of simultaneity (topic 11.3)</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">inside the carriage</text>
  <rect x="140.0" y="120.0" width="620.0" height="110.0" rx="14" stroke="#14181f" stroke-width="2.6" fill="#ffffff"/>
  <rect x="148.0" y="138.0" width="16.0" height="74.0" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <rect x="736.0" y="138.0" width="16.0" height="74.0" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <circle cx="450.0" cy="144.0" r="12.0" stroke="#d98b2b" stroke-width="2.2" fill="#fff1a8"/>
  <line x1="434.0" y1="175.0" x2="179.6" y2="175.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M170.0 175.0 L180.9 169.9 L180.9 180.1 Z" fill="#d98b2b"/>
  <line x1="466.0" y1="175.0" x2="720.4" y2="175.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M730.0 175.0 L719.1 180.1 L719.1 169.9 Z" fill="#d98b2b"/>
  <text x="450.0" y="220.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">same distance each way</text>
  <text x="156.0" y="255.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">back door</text>
  <text x="744.0" y="255.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">front door</text>
  <text x="450.0" y="282.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700">light reaches both doors together: they open at the same time</text>
  <rect x="15.0" y="320.0" width="870.0" height="270.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="350.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">seen from outside: the carriage moves at half the speed of light</text>
  <rect x="140.0" y="400.0" width="620.0" height="110.0" rx="14" stroke="#14181f" stroke-width="2.6" fill="none" stroke-dasharray="7 6"/>
  <rect x="148.0" y="418.0" width="16.0" height="74.0" rx="3" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
  <rect x="736.0" y="418.0" width="16.0" height="74.0" rx="3" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
  <text x="180.0" y="392.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">start</text>
  <rect x="230.0" y="400.0" width="620.0" height="110.0" rx="14" stroke="#14181f" stroke-width="2.6" fill="#ffffff"/>
  <rect x="238.0" y="418.0" width="16.0" height="74.0" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <rect x="826.0" y="418.0" width="16.0" height="74.0" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <line x1="720.0" y1="378.0" x2="820.4" y2="378.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M830.0 378.0 L819.1 383.1 L819.1 372.9 Z" fill="#14181f"/>
  <text x="710.0" y="384.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">v = c/2</text>
  <circle cx="540.0" cy="424.0" r="12.0" stroke="#d1d5db" stroke-width="2" fill="#f3f4f6"/>
  <circle cx="450.0" cy="455.0" r="9.0" stroke="#d98b2b" stroke-width="2.2" fill="#fff1a8"/>
  <text x="450.0" y="485.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">where the light flashed</text>
  <line x1="434.0" y1="455.0" x2="269.6" y2="455.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M260.0 455.0 L270.9 449.9 L270.9 460.1 Z" fill="#d98b2b"/>
  <line x1="466.0" y1="455.0" x2="810.4" y2="455.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M820.0 455.0 L809.1 460.1 L809.1 449.9 Z" fill="#d98b2b"/>
  <text x="246.0" y="535.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">back door</text>
  <text x="834.0" y="535.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">front door</text>
  <text x="450.0" y="565.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">the back door moves towards the light, the front door away: the back door opens first</text>
  <text x="450.0" y="601" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
