<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <!-- Our own sketch for the Roman Urdu lesson (no book figure): light from the middle of a carriage, seen inside and from outside at v = c/2 -->
  <rect width="1000" height="600" fill="#ffffff"/>
  <rect x="150" y="40" width="700" height="150" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="164.0" y="65.0" width="22.0" height="100.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <rect x="814.0" y="65.0" width="22.0" height="100.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <circle cx="500.0" cy="80.0" r="20.0" stroke="#d98b2b" stroke-width="3" fill="#fff3b0"/>
  <line x1="480.0" y1="125.0" x2="212.6" y2="125.0" stroke="#d98b2b" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M195.0 125.0 L217.0 115.8 L217.0 134.2 Z" fill="#d98b2b"/>
  <line x1="520.0" y1="125.0" x2="787.4" y2="125.0" stroke="#d98b2b" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M805.0 125.0 L783.0 134.2 L783.0 115.8 Z" fill="#d98b2b"/>
  <text x="175.0" y="230.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400">back door</text>
  <text x="825.0" y="230.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400">front door</text>
  <rect x="100" y="340" width="700" height="150" rx="18" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="250" y="340" width="700" height="150" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="264.0" y="365.0" width="22.0" height="100.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <rect x="914.0" y="365.0" width="22.0" height="100.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <line x1="720.0" y1="315.0" x2="882.4" y2="315.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M900.0 315.0 L878.0 324.2 L878.0 305.8 Z" fill="#1a1a1a"/>
  <text x="705.0" y="325.0" font-size="28" fill="#1a1a1a" text-anchor="end" font-weight="400">v = c/2</text>
  <circle cx="450.0" cy="425.0" r="14.0" stroke="#d98b2b" stroke-width="3" fill="#fff3b0"/>
  <line x1="436.0" y1="440.0" x2="312.6" y2="440.0" stroke="#d98b2b" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M295.0 440.0 L317.0 430.8 L317.0 449.2 Z" fill="#d98b2b"/>
  <line x1="464.0" y1="440.0" x2="887.4" y2="440.0" stroke="#d98b2b" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M905.0 440.0 L883.0 449.2 L883.0 430.8 Z" fill="#d98b2b"/>
  <text x="450.0" y="530.0" font-size="26" fill="#b4690e" text-anchor="middle" font-weight="400">where the light flashed</text>
  <line x1="450.0" y1="505.0" x2="450.0" y2="455.0" stroke="#b4690e" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="275.0" y="585.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400">back door</text>
  <text x="925.0" y="585.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400">front door</text>
</svg>
