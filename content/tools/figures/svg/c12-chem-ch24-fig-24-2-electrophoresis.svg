  <rect x="110.0" y="40.0" width="880.0" height="120.0" rx="0" stroke="#14181f" stroke-width="2.4" fill="#fff200"/>
  <circle cx="60.0" cy="100.0" r="26.0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="45.7" y1="100.0" x2="74.3" y2="100.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1040.0" cy="100.0" r="26.0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="1025.7" y1="100.0" x2="1054.3" y2="100.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="1040.0" y1="85.7" x2="1040.0" y2="114.3" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210.0" cy="100.0" r="16.0" stroke="#c2185b" stroke-width="0" fill="#c2185b"/>
  <line x1="210.0" y1="255.0" x2="210.0" y2="134.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <path d="M210.0 122.0 L216.8 136.5 L203.2 136.5 Z" fill="#c62828"/>
  <text x="210.0" y="298.0" font-size="30" fill="#c62828" text-anchor="middle" font-weight="700"><tspan dy="0.0">Lysine (pI = 9.74)</tspan></text>
  <circle cx="550.0" cy="100.0" r="16.0" stroke="#c2185b" stroke-width="0" fill="#c2185b"/>
  <line x1="550.0" y1="255.0" x2="550.0" y2="134.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <path d="M550.0 122.0 L556.8 136.5 L543.2 136.5 Z" fill="#c62828"/>
  <text x="550.0" y="298.0" font-size="30" fill="#c62828" text-anchor="middle" font-weight="700"><tspan dy="0.0">Alanine (pI = 6.02)</tspan></text>
  <circle cx="890.0" cy="100.0" r="16.0" stroke="#c2185b" stroke-width="0" fill="#c2185b"/>
