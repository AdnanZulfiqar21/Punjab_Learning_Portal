<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figs 18.10 to 18.12: the four visible Balmer lines of hydrogen at 656, 486, 434 and 410 nm, and an energy-level diagram (-21.8, -5.45, -2.42, -1.36 and -0.86 x 10^-19 J for n = 1 to 5) with downward transitions forming the Lyman (to n = 1), Balmer (to n = 2) and Paschen (to n = 3) series. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Spectra of atomic hydrogen (after Figs 18.10 to 18.12)</text>
  <rect x="15.0" y="55.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">the four visible lines of the Balmer series</text>
  <rect x="80.0" y="100.0" width="740.0" height="40.0" rx="0" stroke="#14181f" stroke-width="0" fill="#111827"/>
  <rect x="715.2" y="100.0" width="6.0" height="40.0" rx="0" stroke="none" stroke-width="0" fill="#ef4444"/>
  <text x="718.2" y="158.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">656 nm</text>
  <rect x="322.1" y="100.0" width="6.0" height="40.0" rx="0" stroke="none" stroke-width="0" fill="#22d3ee"/>
  <text x="325.1" y="158.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">486 nm</text>
  <rect x="201.9" y="100.0" width="6.0" height="40.0" rx="0" stroke="none" stroke-width="0" fill="#3b82f6"/>
  <text x="218.9" y="158.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">434 nm</text>
  <rect x="146.4" y="100.0" width="6.0" height="40.0" rx="0" stroke="none" stroke-width="0" fill="#8b5cf6"/>
  <text x="135.4" y="158.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">410 nm</text>
  <text x="80.0" y="182.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">violet (short wavelength)</text>
  <text x="820.0" y="182.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="700">red (long wavelength)</text>
  <rect x="15.0" y="205.0" width="870.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="232.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">energy levels and transitions (energies in 10^-19 J, not to scale)</text>
  <line x1="140.0" y1="560.0" x2="820.0" y2="560.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="565.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-21.8</text>
  <text x="830.0" y="565.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 1</text>
  <line x1="140.0" y1="435.0" x2="820.0" y2="435.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="440.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-5.45</text>
  <text x="830.0" y="440.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 2</text>
  <line x1="140.0" y1="365.0" x2="820.0" y2="365.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="370.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-2.42</text>
  <text x="830.0" y="370.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 3</text>
  <line x1="140.0" y1="328.0" x2="820.0" y2="328.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="333.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-1.36</text>
  <text x="830.0" y="333.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 4</text>
  <line x1="140.0" y1="306.0" x2="820.0" y2="306.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="311.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-0.86</text>
  <text x="830.0" y="311.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 5</text>
  <line x1="140.0" y1="288.0" x2="820.0" y2="288.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="293.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">-0.6</text>
  <text x="830.0" y="293.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = 6</text>
  <line x1="140.0" y1="266.0" x2="820.0" y2="266.0" stroke="#14181f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="130.0" y="271.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">0</text>
  <text x="830.0" y="271.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">n = inf</text>
  <line x1="200.0" y1="435.0" x2="200.0" y2="550.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M200.0 556.0 L197.0 549.7 L203.0 549.7 Z" fill="#7c3aed"/>
  <line x1="235.0" y1="365.0" x2="235.0" y2="550.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M235.0 556.0 L232.0 549.7 L238.0 549.7 Z" fill="#7c3aed"/>
  <line x1="270.0" y1="328.0" x2="270.0" y2="550.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M270.0 556.0 L267.0 549.7 L273.0 549.7 Z" fill="#7c3aed"/>
  <line x1="305.0" y1="306.0" x2="305.0" y2="550.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M305.0 556.0 L302.0 549.7 L308.0 549.7 Z" fill="#7c3aed"/>
  <text x="325.0" y="520.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">Lyman (UV)</text>
  <line x1="420.0" y1="365.0" x2="420.0" y2="425.4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M420.0 431.0 L417.0 424.7 L423.0 424.7 Z" fill="#ef4444"/>
  <line x1="455.0" y1="328.0" x2="455.0" y2="425.4" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M455.0 431.0 L452.0 424.7 L458.0 424.7 Z" fill="#06b6d4"/>
  <line x1="490.0" y1="306.0" x2="490.0" y2="425.4" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M490.0 431.0 L487.0 424.7 L493.0 424.7 Z" fill="#3b82f6"/>
  <line x1="525.0" y1="288.0" x2="525.0" y2="425.4" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <path d="M525.0 431.0 L522.0 424.7 L528.0 424.7 Z" fill="#8b5cf6"/>
  <text x="470.0" y="455.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Balmer (visible)</text>
  <line x1="640.0" y1="328.0" x2="640.0" y2="355.4" stroke="#d98b2b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M640.0 361.0 L637.0 354.7 L643.0 354.7 Z" fill="#d98b2b"/>
  <line x1="675.0" y1="306.0" x2="675.0" y2="355.4" stroke="#d98b2b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M675.0 361.0 L672.0 354.7 L678.0 354.7 Z" fill="#d98b2b"/>
  <line x1="710.0" y1="288.0" x2="710.0" y2="355.4" stroke="#d98b2b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M710.0 361.0 L707.0 354.7 L713.0 354.7 Z" fill="#d98b2b"/>
  <text x="680.0" y="386.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">Paschen (IR)</text>
  <text x="150.0" y="572.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">ground state</text>
  <text x="450.0" y="611" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
