  <text x="95.0" y="330.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">solution of one</text>
  <text x="95.0" y="348.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">solid + insoluble</text>
