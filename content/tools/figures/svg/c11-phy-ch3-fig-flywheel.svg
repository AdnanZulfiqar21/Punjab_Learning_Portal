<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.21: a flywheel with a heavy rim stores rotational kinetic energy. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A flywheel stores rotational energy</text>
  <circle cx="300.0" cy="225.0" r="160.0" stroke="#334155" stroke-width="3" fill="#94a3b8"/>
  <circle cx="300.0" cy="225.0" r="120.0" stroke="#334155" stroke-width="2.5" fill="#e2e8f0"/>
  <line x1="330.0" y1="225.0" x2="420.0" y2="225.0" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="315.0" y1="251.0" x2="360.0" y2="328.9" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="285.0" y1="251.0" x2="240.0" y2="328.9" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="270.0" y1="225.0" x2="180.0" y2="225.0" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="285.0" y1="199.0" x2="240.0" y2="121.1" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="315.0" y1="199.0" x2="360.0" y2="121.1" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300.0" cy="225.0" r="30.0" stroke="#334155" stroke-width="2.5" fill="#cbd5e1"/>
  <circle cx="300.0" cy="225.0" r="10.0" stroke="#334155" stroke-width="1" fill="#334155"/>
  <path d="M154.2 122.9 A178 178 0 0 1 375.2 63.7" stroke="#d98b2b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M375.2 63.7 L364.2 63.7 L368.2 55.3 Z" fill="#d98b2b"/>
  <text x="118.0" y="112.0" font-size="18" fill="#d98b2b" text-anchor="end" font-weight="700">rotation</text>
  <line x1="440.0" y1="165.0" x2="560.0" y2="120.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="568.0" y="104.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">heavy rim: most of the mass is</text>
  <text x="568.0" y="126.1" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">far from the axle, so the</text>
  <text x="568.0" y="148.2" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">moment of inertia is large</text>
  <line x1="330.0" y1="225.0" x2="560.0" y2="240.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="568.0" y="246.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">axle (axis of rotation)</text>
  <rect x="560.0" y="300.0" width="310.0" height="80.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="715.0" y="333.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">rotational KE = (1/2) I omega^2</text>
  <text x="715.0" y="360.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="400">large I keeps the speed steady</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
