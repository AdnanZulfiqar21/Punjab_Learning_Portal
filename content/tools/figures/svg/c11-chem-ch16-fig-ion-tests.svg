<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after topics 16.6 and 16.7 and Figure 16.7: the tests for the anions and for the cations with NaOH(aq) and NH3(aq). -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="600" y="32">Identifying anions and cations in salt analysis</text>
  <!-- anions -->
  <rect x="50" y="55" width="1100" height="290" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Anions (acid radicals, 16.6): about 2 g of the solid, 5 cm3 of water, then the reagent</text>
  <g class="t b" style="font-size:12px">
    <text x="70" y="108">ion</text><text x="170" y="108">reagent</text><text x="520" y="108">observation</text><text x="860" y="108">reaction</text>
  </g>
  <path d="M70 114 H1130" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="70" y="136" class="b">CO3 2-</text>
    <text x="170" y="136">dilute HCl on the solid; pass the gas</text><text x="170" y="152">into lime water</text>
    <text x="520" y="136">brisk effervescence; the gas turns</text><text x="520" y="152">lime water milky (white CaCO3)</text>
    <text x="70" y="184" class="b">Cl-, Br-, I-</text>
    <text x="170" y="184">a few drops of dilute HNO3 (destroys</text><text x="170" y="200">carbonate), then 5 cm3 AgNO3(aq)</text>
    <text x="520" y="184">Cl-: thick white ppt, dissolves in NH3(aq)</text><text x="520" y="200">Br-: cream-yellow ppt; I-: bright yellow ppt</text>
    <text x="70" y="232" class="b">NO3-</text>
    <text x="170" y="232">5 cm3 NaOH(aq), then 3 g aluminium</text><text x="170" y="248">powder (Al reduces nitrate: redox)</text>
    <text x="520" y="232">smell of ammonia at the mouth of the</text><text x="520" y="248">tube; the gas turns red litmus blue</text>
    <text x="70" y="280" class="b">SO4 2-</text>
    <text x="170" y="280">a few drops of dilute HNO3, then</text><text x="170" y="296">5 cm3 barium nitrate solution</text>
    <text x="520" y="280">heavy white precipitate of BaSO4</text>
  </g>
  <g class="f">
    <text x="860" y="136">CO3 2- + 2H+ -&gt; H2O + CO2</text>
    <text x="860" y="152">Ca(OH)2 + CO2 -&gt; CaCO3 + H2O</text>
    <text x="860" y="184">Ag+ + Cl- -&gt; AgCl (white)</text>
    <text x="860" y="200">Ag+ + Br- -&gt; AgBr; Ag+ + I- -&gt; AgI</text>
    <text x="860" y="232">3NO3- + 8Al + 5OH- + 18H2O</text>
    <text x="860" y="248">-&gt; 3NH3 + 8[Al(OH)4]-</text>
    <text x="860" y="280">SO4 2- + Ba2+ -&gt; BaSO4 (white)</text>
  </g>
  <g><circle cx="1040" cy="316" r="7" fill="#ffffff" stroke="#9ca3af"/><circle cx="1086" cy="316" r="7" fill="#f3e3a0" stroke="#9ca3af"/><circle cx="1130" cy="316" r="7" fill="#f5d020" stroke="#9ca3af"/></g>
  <text class="r" x="860" y="320">silver halides, Figure 16.7:</text>
  <text class="r" x="1028" y="336">AgCl</text><text class="r" x="1074" y="336">AgBr</text><text class="r" x="1121" y="336">AgI</text>
  <text class="r" x="70" y="326">the dilute HNO3 in the halide and sulfate tests stops carbonate ions precipitating with the silver or barium salts</text>
  <!-- cations -->
  <rect x="50" y="365" width="1100" height="320" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="393">Cations (basic radicals, 16.7): about 4 g of the solid in 10 cm3 of water, split into two parts</text>
  <g class="t b" style="font-size:12px">
    <text x="70" y="418">ion</text><text x="150" y="418">with NaOH(aq)</text><text x="520" y="418">with aqueous ammonia</text><text x="880" y="418">precipitate</text>
  </g>
  <path d="M70 424 H1130" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="70" y="446" class="b">Al3+</text><text x="150" y="446">white gelatinous precipitate</text><text x="520" y="446">white precipitate</text>
    <text x="70" y="474" class="b">NH4+</text><text x="150" y="474">warm: ammonia gas, distinct smell, moist red litmus blue</text><text x="520" y="474">(no ammonia test printed)</text>
    <text x="70" y="502" class="b">Ca2+</text><text x="150" y="502">white precipitate, insoluble in excess NaOH</text><text x="520" y="502">only a slight turbidity, or no precipitate</text>
    <text x="70" y="530" class="b">Cr3+</text><text x="150" y="530">green precipitate, gives a green solution in excess</text><text x="520" y="530">green precipitate, insoluble in excess</text>
    <text x="70" y="558" class="b">Cu2+</text><text x="150" y="558">light-blue precipitate</text><text x="520" y="558">deep blue solution</text>
    <text x="70" y="586" class="b">Fe2+</text><text x="150" y="586">green precipitate, turns orange-brown on standing</text><text x="520" y="586">Fe(OH)2 precipitate, quickly oxidised to red-brown Fe(OH)3</text>
    <text x="70" y="614" class="b">Fe3+</text><text x="150" y="614">orange-brown precipitate</text><text x="520" y="614">orange-brown precipitate</text>
    <text x="70" y="642" class="b">Zn2+</text><text x="150" y="642">white precipitate, soluble in excess NaOH</text><text x="520" y="642">white precipitate, dissolves in excess ammonia</text>
  </g>
  <g class="f" style="font-size:11px">
    <text x="880" y="446">Al3+ + 3OH- -&gt; Al(OH)3</text>
    <text x="880" y="474">NH4+ + OH- -&gt; NH3 + H2O</text>
    <text x="880" y="502">Ca2+ + 2OH- -&gt; Ca(OH)2</text>
    <text x="880" y="530">Cr3+ + 3OH- -&gt; Cr(OH)3</text>
    <text x="880" y="558">Cu2+ + 2OH- -&gt; Cu(OH)2</text>
    <text x="880" y="586">Fe2+ + 2OH- -&gt; Fe(OH)2</text>
    <text x="880" y="614">Fe3+ + 3OH- -&gt; Fe(OH)3</text>
    <text x="880" y="642">Zn2+ + 2OH- -&gt; Zn(OH)2</text>
  </g>
  <g>
    <rect x="1100" y="436" width="14" height="14" fill="#ffffff" stroke="#9ca3af"/><rect x="1100" y="492" width="14" height="14" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="1100" y="520" width="14" height="14" fill="#5a9e5a" stroke="#9ca3af"/><rect x="1100" y="548" width="14" height="14" fill="#9fc5e8" stroke="#9ca3af"/>
    <rect x="1100" y="576" width="14" height="14" fill="#7fae7f" stroke="#9ca3af"/><rect x="1100" y="604" width="14" height="14" fill="#c0692a" stroke="#9ca3af"/>
    <rect x="1100" y="632" width="14" height="14" fill="#ffffff" stroke="#9ca3af"/>
  </g>
  <text class="r" x="70" y="672">white with NaOH: Ca2+ (insoluble in excess), Zn2+ (soluble in excess), Al3+ (gelatinous); ammonia then separates them: Ca2+ gives almost nothing, Zn2+ redissolves</text>
  <text class="s" x="600" y="708" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
