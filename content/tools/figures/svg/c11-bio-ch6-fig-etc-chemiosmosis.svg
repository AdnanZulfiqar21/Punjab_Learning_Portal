<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.18 and 5.19: the electron transport chain and chemiosmosis in the mitochondrion. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .n{font-size:18px;fill:#14181f;text-anchor:middle;font-weight:700}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="40">Electron transport chain and chemiosmosis in the mitochondrion</text>
  <text class="s" x="600" y="130">intermembrane space (high H+)</text>
  <rect x="60" y="300" width="1080" height="130" fill="#fff4e2"/>
  <rect x="60" y="300" width="1080" height="16" fill="#d98b2b"/><rect x="60" y="414" width="1080" height="16" fill="#d98b2b"/>
  <text class="s" x="330" y="470">inner membrane</text>
  <text class="s" x="600" y="600">matrix (low H+)</text>
  <!-- carriers -->
  <rect x="120" y="310" width="100" height="110" rx="10" fill="#9ca3af"/><text class="b" x="170" y="370">CoQ</text>
  <rect x="290" y="310" width="100" height="110" rx="10" fill="#5b3fb5"/><text class="b" x="340" y="370">cyt b</text>
  <rect x="460" y="310" width="100" height="110" rx="10" fill="#5b3fb5"/><text class="b" x="510" y="370">cyt c</text>
  <rect x="630" y="310" width="120" height="110" rx="10" fill="#5b3fb5"/><text class="b" x="690" y="360">cyt a</text><text class="b" x="690" y="382">cyt a3</text>
  <g stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"><path d="M225 365 H285"/><path d="M395 365 H455"/><path d="M565 365 H625"/></g>
  <!-- electron sources -->
  <rect x="60" y="500" width="120" height="46" rx="10" fill="#1f6fb5"/><text class="b" x="120" y="530">NADH</text>
  <path d="M140 495 L160 428" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="210" y="500" width="120" height="46" rx="10" fill="#1f6fb5"/><text class="b" x="270" y="530">FADH2</text>
  <path d="M250 495 L200 428" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="330" y="575">oxidised to NAD+ and FAD; electrons enter at CoQ</text>
  <!-- oxygen -->
  <rect x="640" y="500" width="130" height="46" rx="10" fill="#9ca3af"/><text class="b" x="705" y="530">1/2 O2 + 2H+</text>
  <path d="M690 428 L700 495" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="800" y="500" width="100" height="46" rx="10" fill="#dbe9f5"/><text class="b" x="850" y="530" style="fill:#14181f">H2O</text>
  <path d="M775 523 H795" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- H+ pumping -->
  <g stroke="#d7322f" stroke-width="4" marker-end="url(#arr)"><path d="M170 310 V240"/><path d="M510 310 V240"/><path d="M690 310 V240"/></g>
  <g fill="#d7322f" font-size="17" font-weight="700" text-anchor="middle"><text x="170" y="225">H+</text><text x="510" y="225">H+</text><text x="690" y="225">H+</text><text x="300" y="200">H+</text><text x="420" y="190">H+</text><text x="600" y="200">H+</text><text x="820" y="190">H+</text></g>
  <!-- ATP synthase -->
  <path d="M960 300 h70 v130 h-70 z" fill="#0f7a62"/><circle cx="995" cy="455" r="30" fill="#0f7a62"/>
  <text class="b" x="995" y="360" style="font-size:14px">ATP</text><text class="b" x="995" y="378" style="font-size:14px">synthase</text>
  <path d="M995 240 V300" stroke="#d7322f" stroke-width="5" marker-end="url(#arr)"/>
  <text class="n" x="1090" y="520">ADP + Pi</text><path d="M1035 500 L1060 480" stroke="#4b5563" stroke-width="3"/>
  <text class="n" x="1090" y="560" style="fill:#0f7a62">ATP</text>
  <text class="s" x="600" y="650">Electrons lose energy from carrier to carrier (each is reduced, then oxidised); the energy pumps H+ out of the matrix.</text>
  <text class="s" x="600" y="678">H+ flows back through ATP synthase, which bonds Pi to ADP. One NADH gives 3 ATP; one FADH2 gives 2 ATP.</text>
  <text class="s" x="600" y="706">Oxygen takes the electrons and H+ to form water.</text>
  <text class="s" x="600" y="740">Substrate-level phosphorylation: an enzyme moves a phosphate from a substrate (such as PEP) to ADP, no membrane needed.</text>
</svg>
