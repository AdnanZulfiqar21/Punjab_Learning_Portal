<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>
  <!-- Revenue split into costs and profit for the book's school-bag shop (Roman Urdu teaching figure; the book prints no figure) -->
  <line x1="150.0" y1="540.0" x2="860.0" y2="540.0" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <text x="138.0" y="548.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">0</text>
  <line x1="150.0" y1="444.0" x2="860.0" y2="444.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="452.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">10k</text>
  <line x1="150.0" y1="348.0" x2="860.0" y2="348.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="356.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">20k</text>
  <line x1="150.0" y1="252.0" x2="860.0" y2="252.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="260.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">30k</text>
  <line x1="150.0" y1="156.0" x2="860.0" y2="156.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="164.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">40k</text>
  <line x1="150.0" y1="60.0" x2="860.0" y2="60.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="138.0" y="68.0" font-size="22" fill="#374151" text-anchor="end" font-weight="500">50k</text>
  <text x="40.0" y="300.0" font-size="24" fill="#111111" text-anchor="middle" font-weight="700" transform="rotate(-90 40.0 300.0)">Rupay</text>
  <rect x="240.0" y="60.0" width="200.0" height="480.0" rx="0" stroke="#1f6fb5" stroke-width="2.6" fill="#dbe9f5"/>
  <text x="340.0" y="310.1" font-size="28" fill="#111111" text-anchor="middle" font-weight="700">Rs 50,000</text>
  <text x="340.0" y="583.4" font-size="26" fill="#111111" text-anchor="middle" font-weight="700">Revenue</text>
  <text x="340.0" y="618.6" font-size="24" fill="#374151" text-anchor="middle" font-weight="500">100 x Rs 500</text>
  <rect x="560.0" y="252.0" width="200.0" height="288.0" rx="0" stroke="#b45309" stroke-width="2.6" fill="#fff1dc"/>
  <text x="660.0" y="390.0" font-size="26" fill="#111111" text-anchor="middle" font-weight="700">Kharche</text>
  <text x="660.0" y="420.7" font-size="26" fill="#111111" text-anchor="middle" font-weight="700">Rs 30,000</text>
  <rect x="560.0" y="60.0" width="200.0" height="192.0" rx="0" stroke="#0f7a62" stroke-width="2.6" fill="#e6f4ef"/>
  <text x="660.0" y="150.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700">Profit</text>
  <text x="660.0" y="180.7" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700">Rs 20,000</text>
  <line x1="440.0" y1="60.0" x2="560.0" y2="60.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="660.0" y="583.4" font-size="26" fill="#111111" text-anchor="middle" font-weight="700">Kharche + Profit</text>
  <text x="660.0" y="618.6" font-size="24" fill="#374151" text-anchor="middle" font-weight="500">= Revenue</text>
</svg>
