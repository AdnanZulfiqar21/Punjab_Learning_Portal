<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Original drawing after Figure 19.23 of the Class XII Biology textbook (point mutations). -->
  <rect x="10" y="10" width="980" height="620" rx="8" stroke="none" stroke-width="0" fill="#fdf6dc"/>
  <text x="300" y="80" font-size="30" fill="#1d2430" text-anchor="end" font-weight="700">Normal DNA</text>
  <text x="300" y="132" font-size="30" fill="#4b5260" text-anchor="end" font-weight="400">Protein</text>
  <text x="340" y="80" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">TAT  CAT  CCT  AAG  GTA</text>
  <text x="340" y="132" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">Tyr - His - Pro - Lys - Val</text>
  <text x="300" y="225" font-size="30" fill="#1d2430" text-anchor="end" font-weight="700">Substitution</text>
  <text x="300" y="277" font-size="30" fill="#4b5260" text-anchor="end" font-weight="400">Protein</text>
  <text x="340" y="225" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">TAT  CAT  C<tspan fill="#d62828">G</tspan>T  AAG  GTA</text>
  <text x="340" y="277" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">Tyr - His - <tspan fill="#d62828">Arg</tspan> - Lys - Val</text>
  <text x="300" y="370" font-size="30" fill="#1d2430" text-anchor="end" font-weight="700">Insertion</text>
  <text x="300" y="422" font-size="30" fill="#4b5260" text-anchor="end" font-weight="400">Protein</text>
  <text x="340" y="370" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">TAT  CAT  C<tspan fill="#d62828">G</tspan>C  TAA  GGT  A</text>
  <text x="340" y="422" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">Tyr - His - <tspan fill="#d62828">Arg - Stop</tspan></text>
  <text x="300" y="515" font-size="30" fill="#1d2430" text-anchor="end" font-weight="700">Deletion</text>
  <text x="300" y="567" font-size="30" fill="#4b5260" text-anchor="end" font-weight="400">Protein</text>
  <text x="340" y="515" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">TAT  CTC  CTA  AGG  TA</text>
  <text x="340" y="567" font-size="30" fill="#3a3f47" font-weight="400" xml:space="preserve">Tyr - <tspan fill="#d62828">Leu - Leu - Arg - ...</tspan></text>
</svg>
