<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 7.6 and 7.7: orthologs and paralogs, and structural homology. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="340" y="40">Sequence homology</text>
  <rect x="240" y="80" width="200" height="50" rx="10" fill="#5b3fb5"/><text class="b" x="340" y="112">ancestral gene</text>
  <!-- speciation branch -->
  <path d="M300 135 L180 220" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M380 135 L500 220" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="340" y="190">speciation</text>
  <rect x="80" y="225" width="200" height="50" rx="10" fill="#0f7a62"/><text class="b" x="180" y="257">gene A in species 1</text>
  <rect x="400" y="225" width="200" height="50" rx="10" fill="#0f7a62"/><text class="b" x="500" y="257">gene A in species 2</text>
  <path d="M285 250 H395" stroke="#d98b2b" stroke-width="4" stroke-dasharray="8 6"/>
  <text class="k" x="340" y="305" style="fill:#d98b2b">orthologs</text>
  <text class="s" x="340" y="330">same gene in different species; usually the same function</text>
  <!-- duplication -->
  <path d="M180 280 L180 380" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="290" y="365">gene duplication</text>
  <rect x="90" y="385" width="130" height="50" rx="10" fill="#1f6fb5"/><text class="b" x="155" y="417">gene A</text>
  <rect x="240" y="385" width="130" height="50" rx="10" fill="#1f6fb5"/><text class="b" x="305" y="417">gene A'</text>
  <path d="M225 410 H235" stroke="#d98b2b" stroke-width="4"/>
  <text class="k" x="230" y="470" style="fill:#1f6fb5">paralogs</text>
  <text class="s" x="230" y="495">copies within one species; may evolve new functions</text>
  <text class="s" x="320" y="560">Homologous sequences share an ancestor, so they reveal</text><text class="s" x="320" y="584">evolutionary history and hint at the function of an</text><text class="s" x="320" y="608">unknown gene: BLAST and FASTA search for them.</text>
  <!-- structural homology -->
  <text class="h" x="900" y="40">Structural homology</text>
  <path d="M740 260 q20 -100 90 -90 q70 10 80 70 q10 60 -40 90 q-70 30 -110 -10 q-40 -30 -20 -60 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="5"/>
  <path d="M770 230 q20 -25 40 0 t40 0 t30 20" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <path d="M960 260 q20 -100 90 -90 q70 10 80 70 q10 60 -40 90 q-70 30 -110 -10 q-40 -30 -20 -60 z" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <path d="M990 230 q20 -25 40 0 t40 0 t30 20" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <text class="k" x="830" y="360">protein X</text><text class="k" x="1050" y="360">protein Y</text>
  <g font-family="Consolas, Courier New, monospace" font-size="18" text-anchor="middle" fill="#14181f">
    <text x="830" y="400">M K T A Y I A</text><text x="1050" y="400">M R S V F L G</text>
  </g>
  <text class="s" x="940" y="440">different sequences, same fold</text>
  <text class="s" x="920" y="500">Similar 3D structures from shared ancestry;</text><text class="s" x="920" y="524">similar shape usually means similar function, even</text><text class="s" x="920" y="548">when the sequences differ. Used to predict function</text><text class="s" x="920" y="572">and to design drugs.</text>
  <text class="s" x="600" y="650">The sequences and shapes shown are schematic examples, not real proteins.</text>
</svg>
