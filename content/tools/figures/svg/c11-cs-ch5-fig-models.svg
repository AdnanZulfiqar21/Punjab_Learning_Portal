  <rect x="610" y="435" width="540" height="260" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="463">Steps to build and judge a model (5.4)</text>
  <rect x="640" y="480" width="200" height="32" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="684" y="500">1 define the problem</text>
  <rect x="640" y="520" width="200" height="32" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="701" y="540">2 collect data</text>
  <rect x="640" y="560" width="200" height="32" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="681" y="580">3 choose an algorithm</text>
  <rect x="640" y="600" width="200" height="32" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="692" y="620">4 train the model</text>
  <rect x="640" y="640" width="200" height="32" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="678" y="660">5 evaluate on new data</text>
