<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 5.4: the fruit-stall regression line with its data, prediction and test point, an S-shaped logistic curve over pass/fail data, K-means clusters of five students' scores, and the five model-building steps. -->
