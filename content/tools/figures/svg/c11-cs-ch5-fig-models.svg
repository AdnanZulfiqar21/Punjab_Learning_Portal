  <text class="h" x="600" y="32">Building models: linear regression, logistic regression and K-means</text>
  <rect x="50" y="55" width="540" height="360" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Linear regression: earnings = 100 + 40 x customers</text>
