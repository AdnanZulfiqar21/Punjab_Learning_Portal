<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <!-- Original flow diagram for topic 21.2.4 (Roman Urdu lesson only): macrophages release pyrogens, which stimulate the hypothalamus to raise body temperature, causing fever. -->
  <rect x="140.0" y="20.0" width="620.0" height="102.0" rx="12" stroke="#b45309" stroke-width="2.5" fill="#ffedd5"/>
  <text x="450.0" y="64.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">Macrophages attack</text>
  <text x="450.0" y="97.6" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">the invading microbes</text>
  <line x1="450.0" y1="126.0" x2="450.0" y2="159.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 172.0 L443.2 157.5 L456.8 157.5 Z" fill="#14181f"/>
  <rect x="140.0" y="178.0" width="620.0" height="136.0" rx="12" stroke="#d98b2b" stroke-width="2.5" fill="#fff7ed"/>
  <text x="450.0" y="222.2" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">They release pyrogens,</text>
  <text x="450.0" y="255.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">which pass through the</text>
  <text x="450.0" y="289.4" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">bloodstream to the brain</text>
  <line x1="450.0" y1="318.0" x2="450.0" y2="351.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 364.0 L443.2 349.5 L456.8 349.5 Z" fill="#14181f"/>
  <rect x="140.0" y="370.0" width="620.0" height="102.0" rx="12" stroke="#7c3aed" stroke-width="2.5" fill="#f5f3ff"/>
  <text x="450.0" y="414.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">Pyrogens stimulate the hypothalamus</text>
  <text x="450.0" y="447.6" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">(the body's thermostat)</text>
  <line x1="450.0" y1="476.0" x2="450.0" y2="509.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 522.0 L443.2 507.5 L456.8 507.5 Z" fill="#14181f"/>
  <rect x="140.0" y="528.0" width="620.0" height="102.0" rx="12" stroke="#d7322f" stroke-width="2.5" fill="#fee2e2"/>
  <text x="450.0" y="572.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">Core temperature rises above</text>
  <text x="450.0" y="605.6" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600">37 &#176;C (98.6 &#176;F): fever (pyrexia)</text>
</svg>
