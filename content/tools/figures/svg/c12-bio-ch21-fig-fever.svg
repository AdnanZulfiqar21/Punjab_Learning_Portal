<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <!-- Original flow diagram for topic 21.2.4: macrophages attacking microbes release pyrogens, which reach the hypothalamus and raise the body's set point, causing fever, with its effects and danger levels. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">How fever is set off</text>
  <rect x="30.0" y="90.0" width="195.0" height="100.0" rx="12" stroke="#b45309" stroke-width="2.5" fill="#ffedd5"/>
  <text x="127.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">macrophages attack</text>
  <text x="127.0" y="155.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">microbes</text>
  <line x1="227.0" y1="140.0" x2="236.6" y2="140.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M243.0 140.0 L235.7 143.4 L235.7 136.6 Z" fill="#14181f"/>
  <rect x="245.0" y="90.0" width="195.0" height="100.0" rx="12" stroke="#d98b2b" stroke-width="2.5" fill="#fff7ed"/>
  <text x="342.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">release pyrogens</text>
  <text x="342.0" y="155.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">into the blood</text>
  <line x1="442.0" y1="140.0" x2="451.6" y2="140.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M458.0 140.0 L450.7 143.4 L450.7 136.6 Z" fill="#14181f"/>
  <rect x="460.0" y="90.0" width="195.0" height="100.0" rx="12" stroke="#7c3aed" stroke-width="2.5" fill="#f5f3ff"/>
  <text x="557.0" y="125.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">hypothalamus (the</text>
  <text x="557.0" y="145.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">body's thermostat)</text>
  <text x="557.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">raises the set point</text>
  <line x1="657.0" y1="140.0" x2="666.6" y2="140.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M673.0 140.0 L665.7 143.4 L665.7 136.6 Z" fill="#14181f"/>
  <rect x="675.0" y="90.0" width="195.0" height="100.0" rx="12" stroke="#d7322f" stroke-width="2.5" fill="#fee2e2"/>
  <text x="772.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">fever: above</text>
  <text x="772.0" y="155.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">37 C (98.6 F)</text>
  <rect x="40.0" y="220.0" width="820.0" height="130.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="250.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Fever hinders the reproduction of bacteria and viruses; some temperature-sensitive microbes die.</text>
  <text x="60.0" y="276.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">It speeds up neutrophils and macrophages, and more cytokines (interferons) are released.</text>
  <text x="60.0" y="302.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Above about 103 F (39.4 C) fever is dangerous; above about 105 F (40.5 C) it is often fatal.</text>
  <text x="450.0" y="371" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
