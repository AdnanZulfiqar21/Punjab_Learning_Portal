<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original flow diagram for topic 17.7.1: seawater treated with calcium hydroxide precipitates magnesium hydroxide, which hydrochloric acid turns into magnesium chloride; the dried, molten chloride is electrolysed to magnesium and chlorine. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Magnesium from seawater: the Dow process</text>
  <rect x="20.0" y="140.0" width="160.0" height="120.0" rx="12" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="100.0" y="185.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">seawater</tspan></text>
  <text x="100.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg</tspan><tspan dy="-5.0" font-size="8.4">2+</tspan><tspan dy="5.0">(aq)</tspan></text>
  <line x1="182.0" y1="200.0" x2="187.4" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M193.0 200.0 L186.7 203.0 L186.7 197.0 Z" fill="#14181f"/>
  <rect x="195.0" y="140.0" width="160.0" height="120.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="275.0" y="185.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ Ca(OH)</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="275.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg(OH)</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8"> precipitates</tspan></text>
  <line x1="357.0" y1="200.0" x2="362.4" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M368.0 200.0 L361.7 203.0 L361.7 197.0 Z" fill="#14181f"/>
  <rect x="370.0" y="140.0" width="160.0" height="120.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="450.0" y="185.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 2HCl</tspan></text>
  <text x="450.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">MgCl</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">(aq) + 2H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O</tspan></text>
  <line x1="532.0" y1="200.0" x2="537.4" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M543.0 200.0 L536.7 203.0 L536.7 197.0 Z" fill="#14181f"/>
  <rect x="545.0" y="140.0" width="160.0" height="120.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="625.0" y="185.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">concentrate, dry, melt</tspan></text>
  <text x="625.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">molten MgCl</tspan><tspan dy="3.8" font-size="8.4">2</tspan></text>
  <line x1="707.0" y1="200.0" x2="712.4" y2="200.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M718.0 200.0 L711.7 203.0 L711.7 197.0 Z" fill="#14181f"/>
  <rect x="720.0" y="140.0" width="160.0" height="120.0" rx="12" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="800.0" y="185.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">electrolysis</tspan></text>
  <text x="800.0" y="222.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg (cathode), Cl</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8"> (anode)</tspan></text>
  <text x="450.0" y="320.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan><tspan dy="6.7">(aq) + 2OH</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7">(aq) -&gt; Mg(OH)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">(s)</tspan></text>
  <text x="450.0" y="350.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg(OH)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">(s) + 2HCl(aq) -&gt; MgCl</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">(aq) + 2H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O(l)</tspan></text>
  <text x="450.0" y="380.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">MgCl</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">(l) -&gt; Mg(l) + Cl</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">(g)   (electrolysis)</tspan></text>
  <text x="450.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the calcium hydroxide comes from limestone or oyster shells</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
