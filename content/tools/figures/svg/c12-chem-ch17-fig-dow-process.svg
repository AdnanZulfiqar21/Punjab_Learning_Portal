<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="900" fill="#ffffff"/>
  <!-- Roman Urdu lesson only (the book prints no figure here): the steps of the Dow process for magnesium from seawater. Original diagram. -->
  <rect x="100.0" y="30.0" width="700.0" height="128.0" rx="18" stroke="#1f6fb5" stroke-width="4" fill="#e3eef9"/>
  <text x="450.0" y="84.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">seawater</tspan></text>
  <text x="450.0" y="132.0" font-size="32" fill="#374151" text-anchor="middle" font-weight="600"><tspan dy="0.0">Mg</tspan><tspan dy="-12.8" font-size="23.0">2+</tspan><tspan dy="12.8">(aq)</tspan></text>
  <line x1="450.0" y1="162.0" x2="450.0" y2="188.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 204.0 L441.5 185.9 L458.5 185.9 Z" fill="#14181f"/>
  <rect x="100.0" y="208.0" width="700.0" height="128.0" rx="18" stroke="#0f7a62" stroke-width="4" fill="#e3f3ee"/>
  <text x="450.0" y="262.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ Ca(OH)</tspan><tspan dy="10.8" font-size="25.9">2</tspan><tspan dy="-10.8"></tspan></text>
  <text x="450.0" y="310.0" font-size="32" fill="#374151" text-anchor="middle" font-weight="600"><tspan dy="0.0">Mg(OH)</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"> precipitates</tspan></text>
  <line x1="450.0" y1="340.0" x2="450.0" y2="366.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 382.0 L441.5 363.9 L458.5 363.9 Z" fill="#14181f"/>
  <rect x="100.0" y="386.0" width="700.0" height="128.0" rx="18" stroke="#0f7a62" stroke-width="4" fill="#e3f3ee"/>
  <text x="450.0" y="440.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">filter, then + 2HCl</tspan></text>
  <text x="450.0" y="488.0" font-size="32" fill="#374151" text-anchor="middle" font-weight="600"><tspan dy="0.0">MgCl</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6">(aq) + 2H</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6">O</tspan></text>
  <line x1="450.0" y1="518.0" x2="450.0" y2="544.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 560.0 L441.5 541.9 L458.5 541.9 Z" fill="#14181f"/>
  <rect x="100.0" y="564.0" width="700.0" height="128.0" rx="18" stroke="#0f7a62" stroke-width="4" fill="#e3f3ee"/>
  <text x="450.0" y="618.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">concentrate, dry, melt</tspan></text>
  <text x="450.0" y="666.0" font-size="32" fill="#374151" text-anchor="middle" font-weight="600"><tspan dy="0.0">molten MgCl</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"></tspan></text>
  <line x1="450.0" y1="696.0" x2="450.0" y2="722.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 738.0 L441.5 719.9 L458.5 719.9 Z" fill="#14181f"/>
  <rect x="100.0" y="742.0" width="700.0" height="128.0" rx="18" stroke="#6d28d9" stroke-width="4" fill="#efe7fd"/>
  <text x="450.0" y="796.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">electrolysis</tspan></text>
  <text x="450.0" y="844.0" font-size="32" fill="#374151" text-anchor="middle" font-weight="600"><tspan dy="0.0">Mg (cathode), Cl</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"> (anode)</tspan></text>
</svg>
