<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <!-- Fig 9.2 (C11-BIO, PDF p207): location of salivary glands. A face turned three-quarters to the left with fair hair; the skin of the lower cheek, jaw and neck is removed to show the red muscles, the lower jaw cut open with the teeth and tongue, the yellow lobed parotid gland in front of the ear with its duct running forward across the cheek, the submaxillary gland below the jaw and the sublingual gland under the tongue. Labels as printed: Parotid gland (right), Sublingual gland and Submaxillary gland (below). -->
  <!-- neck and back of head -->
  <path d="M640 560 C 700 620 720 700 700 780 L 380 780 C 380 720 360 680 330 650 Z" fill="#f3d6bf" stroke="#b98a6a" stroke-width="3"/>
  <!-- head (skin) -->
  <path d="M300 160 C 360 90 470 60 580 70 C 700 80 800 150 830 260 C 850 340 830 420 790 480 C 760 520 720 550 690 570 L 640 560 C 600 600 560 620 520 640 L 330 650 C 300 640 285 620 290 600 C 270 590 262 570 270 552 C 250 540 245 520 260 505 C 240 490 228 470 236 450 C 210 440 190 420 200 400 C 215 370 240 350 250 320 C 255 280 260 210 300 160 Z" fill="#f6dcc8" stroke="#b98a6a" stroke-width="3" stroke-linejoin="round"/>
  <!-- hair -->
  <path d="M290 175 C 330 90 450 40 590 45 C 720 50 830 120 860 230 C 875 290 870 360 850 410 C 830 380 815 330 800 300 C 790 250 760 210 720 190 C 650 160 560 170 480 150 C 420 135 360 150 320 190 C 305 200 290 195 290 175 Z" fill="#f2d98a" stroke="#c9a94a" stroke-width="3"/>
  <path d="M340 150 C 420 100 520 90 600 110 M420 120 C 520 70 650 80 740 140 M560 80 C 680 80 780 140 830 230 M380 175 C 450 140 540 140 600 160" stroke="#d9b95a" stroke-width="4" fill="none"/>
  <!-- ear -->
  <path d="M700 330 C 740 300 790 320 790 370 C 790 420 750 450 715 440" fill="#f0c4a8" stroke="#b98a6a" stroke-width="3"/>
  <!-- eye, brow, nose, lips -->
  <path d="M330 300 C 360 280 410 280 440 295" stroke="#b08a4a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M345 340 C 370 320 410 320 430 340 C 410 355 370 356 345 340 Z" fill="#ffffff" stroke="#6a4a3a" stroke-width="3"/>
  <circle cx="390" cy="338" r="13" fill="#3a8a5a"/><circle cx="390" cy="338" r="6" fill="#1a1a1a"/>
  <path d="M255 320 C 240 360 225 395 212 420 C 230 432 255 432 270 425" stroke="#b98a6a" stroke-width="3" fill="none"/>
  <!-- dissected region: cheek, jaw and neck muscles -->
  <path d="M300 470 C 380 450 470 430 560 400 C 620 380 680 400 700 440 C 720 500 700 560 650 600 C 630 660 640 720 660 780 L 450 780 C 430 720 410 690 380 670 C 340 650 300 640 290 600 C 270 590 262 570 270 552 C 255 530 262 500 300 470 Z" fill="#c8453e" stroke="#7a1f1a" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#e57a6e" stroke-width="4" fill="none">
    <path d="M560 420 C 570 500 580 560 560 620"/><path d="M600 410 C 610 490 615 560 600 620"/><path d="M640 420 C 650 500 650 560 630 610"/>
    <path d="M480 700 C 520 640 560 600 620 560"/><path d="M510 760 C 540 700 580 650 650 610"/><path d="M560 780 C 590 720 620 680 660 660"/>
    <path d="M420 640 C 460 610 500 600 540 600"/>
  </g>
  <!-- open lower jaw with teeth and tongue -->
  <path d="M285 500 C 330 490 400 492 440 505 C 450 540 440 570 410 585 C 360 595 310 590 290 575 C 272 555 270 525 285 500 Z" fill="#5a1414" stroke="#3a0a0a" stroke-width="3"/>
  <path d="M292 500 L 296 520 L 306 520 L 308 500 Z M312 498 L 315 518 L 326 518 L 328 497 Z" fill="#fbf6ea" stroke="#8a7a6a" stroke-width="1.5"/>
  <path d="M296 560 C 330 545 380 545 420 556 C 410 575 360 584 310 578 Z" fill="#d86a6a" stroke="#8a2a2a" stroke-width="2"/>
  <path d="M275 600 C 290 620 330 630 380 625" stroke="#a0302a" stroke-width="5" fill="none"/>
  <!-- sublingual gland under the tongue -->
  <g fill="#e9b23a" stroke="#9a6a10" stroke-width="2">
    <circle cx="318" cy="590" r="14"/><circle cx="342" cy="595" r="15"/><circle cx="368" cy="595" r="14"/><circle cx="392" cy="590" r="13"/><circle cx="330" cy="604" r="10"/><circle cx="380" cy="606" r="10"/>
  </g>
  <!-- submaxillary gland below the jaw -->
  <g fill="#e9b23a" stroke="#9a6a10" stroke-width="2">
    <circle cx="430" cy="628" r="18"/><circle cx="458" cy="636" r="19"/><circle cx="486" cy="630" r="17"/><circle cx="444" cy="652" r="15"/><circle cx="474" cy="656" r="15"/>
  </g>
  <!-- parotid gland in front of the ear, with its duct -->
  <path d="M640 470 C 560 470 470 485 400 505" stroke="#7a8a3a" stroke-width="6" fill="none"/>
  <g fill="#e9b23a" stroke="#9a6a10" stroke-width="2">
    <circle cx="660" cy="430" r="26"/><circle cx="694" cy="452" r="26"/><circle cx="668" cy="476" r="25"/><circle cx="700" cy="498" r="24"/><circle cx="672" cy="520" r="22"/><circle cx="640" cy="458" r="20"/><circle cx="690" cy="410" r="20"/>
  </g>
  <!-- labels -->
  <line x1="700" y1="500" x2="860" y2="640" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="700" cy="500" r="3.5" fill="#14181f"/>
  <text x="840" y="680" font-size="28" fill="#14181f">Parotid</text>
  <text x="840" y="714" font-size="28" fill="#14181f">gland</text>
  <line x1="342" y1="595" x2="342" y2="810" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="342" cy="595" r="3.5" fill="#14181f"/>
  <text x="300" y="840" font-size="28" fill="#14181f">Sublingual</text>
  <text x="300" y="874" font-size="28" fill="#14181f">gland</text>
  <line x1="458" y1="636" x2="500" y2="810" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="458" cy="636" r="3.5" fill="#14181f"/>
  <text x="480" y="840" font-size="28" fill="#14181f">Submaxillary</text>
  <text x="480" y="874" font-size="28" fill="#14181f">gland</text>
</svg>
