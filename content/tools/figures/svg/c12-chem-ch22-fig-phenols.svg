  <!-- Original diagram for topic 22.5: phenol, 2-naphthol and 1-naphthol; phenylamine reacts with nitrous acid (NaNO2 + HCl, below 10 C) to give benzenediazonium chloride, which on warming with water gives phenol, nitrogen and HCl. -->
