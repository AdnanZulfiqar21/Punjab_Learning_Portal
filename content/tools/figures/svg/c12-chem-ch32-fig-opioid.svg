<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- An opiate binding its receptor: calcium channel closed, potassium channel open (our own sketch for topic 32.3.2). -->
  <rect x="20.0" y="220.0" width="960.0" height="50.0" rx="0" stroke="#d98b2b" stroke-width="3" fill="#fde4c2"/>
  <rect x="110.0" y="160.0" width="140.0" height="62.0" rx="0" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <rect x="155.0" y="130.0" width="50.0" height="70.0" rx="0" stroke="#d7322f" stroke-width="3" fill="#f9a8a8"/>
  <text x="180.0" y="110.0" font-size="26" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">opiate (key)</tspan></text>
  <text x="180.0" y="315.0" font-size="26" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">receptor (lock)</tspan></text>
  <rect x="470.0" y="200.0" width="34.0" height="90.0" rx="8" stroke="#7c3aed" stroke-width="3" fill="#efe7fd"/>
  <rect x="520.0" y="200.0" width="34.0" height="90.0" rx="8" stroke="#7c3aed" stroke-width="3" fill="#efe7fd"/>
  <rect x="500.0" y="200.0" width="24.0" height="90.0" rx="0" stroke="#7c3aed" stroke-width="0" fill="#7c3aed"/>
  <text x="512.0" y="180.0" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">closed</tspan></text>
  <text x="512.0" y="330.0" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-10.4" font-size="18.7">2+</tspan><tspan dy="10.4"> channel</tspan></text>
  <rect x="760.0" y="200.0" width="34.0" height="90.0" rx="8" stroke="#0e9aa7" stroke-width="3" fill="#dff4f6"/>
  <rect x="830.0" y="200.0" width="34.0" height="90.0" rx="8" stroke="#0e9aa7" stroke-width="3" fill="#dff4f6"/>
  <line x1="812.0" y1="290.0" x2="812.0" y2="144.4" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <path d="M812.0 130.0 L819.6 146.3 L804.4 146.3 Z" fill="#0f7a62"/>
  <text x="812.0" y="110.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">K</tspan><tspan dy="-10.4" font-size="18.7">+</tspan><tspan dy="10.4"> flows out</tspan></text>
  <text x="812.0" y="330.0" font-size="26" fill="#0e9aa7" text-anchor="middle" font-weight="700"><tspan dy="0.0">K</tspan><tspan dy="-10.4" font-size="18.7">+</tspan><tspan dy="10.4"> channel</tspan></text>
  <text x="500.0" y="400.0" font-size="26" fill="#d98b2b" text-anchor="middle" font-weight="700"><tspan dy="0.0">nerve-cell membrane</tspan></text>
</svg>
