<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 32.3.2: an opiate fits its receptor like a key in a lock; calcium channels close and potassium channels open, hyperpolarising the neuron so the pain signal is blocked; and the mu, kappa and delta receptors with their roles. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Opiates and opioid receptors</text>
  <rect x="15.0" y="55.0" width="485.0" height="435.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="257.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">an opiate binding its receptor</text>
  <rect x="35.0" y="250.0" width="445.0" height="26.0" rx="0" stroke="#d98b2b" stroke-width="1.5" fill="#fde7c7"/>
  <text x="40.0" y="326.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">nerve-cell membrane (outside of the cell is above)</text>
  <path d="M95 250 L95 205 L120 205 L120 228 L150 228 L150 205 L175 205 L175 250" stroke="#1f6fb5" stroke-width="2.2" fill="#dbe9f5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M122 175 L122 226 L148 226 L148 175 Z" stroke="#d7322f" stroke-width="2" fill="#fca5a5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="135.0" y="165.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">opiate (key)</text>
  <text x="135.0" y="300.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">receptor (lock)</text>
  <rect x="268.0" y="240.0" width="16.0" height="46.0" rx="4" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <rect x="296.0" y="240.0" width="16.0" height="46.0" rx="4" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <rect x="284.0" y="240.0" width="12.0" height="46.0" rx="0" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <text x="290.0" y="220.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">closed</text>
  <text x="290.0" y="300.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Ca2+ channel</text>
  <rect x="388.0" y="240.0" width="16.0" height="46.0" rx="4" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <rect x="416.0" y="240.0" width="16.0" height="46.0" rx="4" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <line x1="410.0" y1="286.0" x2="410.0" y2="212.2" stroke="#0f7a62" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M410.0 205.0 L413.8 213.2 L406.2 213.2 Z" fill="#0f7a62"/>
  <text x="410.0" y="196.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">K+ flows out</text>
  <text x="410.0" y="300.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">K+ channel</text>
  <text x="250.0" y="366.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the neuron becomes hyperpolarised, so it is</text>
  <text x="250.0" y="386.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">much harder for it to send the pain signal;</text>
  <text x="250.0" y="406.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">dopamine released in the brain's reward centre</text>
  <text x="250.0" y="426.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">gives relief and well-being (and addiction)</text>
  <rect x="515.0" y="55.0" width="370.0" height="435.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="700.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">three kinds of opioid receptor</text>
  <rect x="535.0" y="100.0" width="330.0" height="98.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="560.0" y="128.0" font-size="22" fill="#d7322f" text-anchor="middle" font-weight="700">&#956;</text>
  <text x="580.0" y="126.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">mu</text>
  <text x="552.0" y="150.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">brain and spinal cord; main target of</text>
  <text x="552.0" y="167.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">morphine; pain relief, but also slowed</text>
  <text x="552.0" y="184.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">breathing and intense euphoria</text>
  <rect x="535.0" y="212.0" width="330.0" height="98.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="560.0" y="240.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#954;</text>
  <text x="580.0" y="238.0" font-size="16" fill="#1f6fb5" text-anchor="start" font-weight="700">kappa</text>
  <text x="552.0" y="262.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">spinal pain relief and sedation;</text>
  <text x="552.0" y="279.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">less linked to euphoria</text>
  <rect x="535.0" y="324.0" width="330.0" height="98.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="560.0" y="352.0" font-size="22" fill="#0f7a62" text-anchor="middle" font-weight="700">&#948;</text>
  <text x="580.0" y="350.0" font-size="16" fill="#0f7a62" text-anchor="start" font-weight="700">delta</text>
  <text x="552.0" y="374.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">emotional response and</text>
  <text x="552.0" y="391.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">mood regulation</text>
  <text x="700.0" y="446.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">endorphins: the body's own painkillers,</text>
  <text x="700.0" y="463.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">which bind these receptors</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
