<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.15: a force perpendicular to a light rod turns a mass m about an axis O. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Torque on a mass that can turn about O</text>
  <circle cx="330.0" cy="260.0" r="180.0" stroke="#4b5563" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>
  <line x1="70.0" y1="260.0" x2="590.0" y2="260.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <line x1="330.0" y1="260.0" x2="485.9" y2="170.0" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330.0" cy="260.0" r="9.0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <text x="316.0" y="290.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700">O (axis)</text>
  <circle cx="485.9" cy="170.0" r="20.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="485.9" y="177.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">m</text>
  <text x="397.9" y="199.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">r</text>
  <line x1="474.9" y1="150.9" x2="438.6" y2="88.1" stroke="#1f6fb5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M433.4 79.1 L444.0 86.5 L434.5 92.0 Z" fill="#1f6fb5"/>
  <text x="423.4" y="101.1" font-size="18" fill="#1f6fb5" text-anchor="end" font-weight="700">F (perpendicular to r)</text>
  <path d="M390.6 225.0 A70 70 0 0 1 400.0 260.0" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="410.0" y="246.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">theta</text>
  <rect x="600.0" y="330.0" width="270.0" height="110.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="616.0" y="360.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="400">torque = F r</text>
  <text x="616.0" y="383.4" font-size="18" fill="#14181f" text-anchor="start" font-weight="400">F = m a = m r alpha</text>
  <text x="616.0" y="406.8" font-size="18" fill="#14181f" text-anchor="start" font-weight="400">torque = m r^2 alpha</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
