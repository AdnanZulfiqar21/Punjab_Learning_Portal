<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Figs 21.1 and 21.2: light from a star spreads over areas that grow as r2, so the flux at r, 2r and 3r is F, F/4 and F/9; F = L/(4 pi d2); a standard candle of known luminosity gives its distance from the measured flux. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The inverse-square law and standard candles (after Figs 21.1 and 21.2)</text>
  <circle cx="90.0" cy="220.0" r="22.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="90.0" y="262.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">star</text>
  <path d="M291.0 190.0 L309.0 194.5 L309.0 245.5 L291.0 250.0 Z" stroke="#1f6fb5" stroke-width="1.6" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="112.0" y1="210.0" x2="291.0" y2="190.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="112.0" y1="230.0" x2="291.0" y2="250.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="300.0" y="272.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">r</text>
  <text x="300.0" y="178.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <path d="M492.0 160.0 L528.0 169.0 L528.0 271.0 L492.0 280.0 Z" stroke="#1f6fb5" stroke-width="1.6" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="510.0" y1="164.5" x2="510.0" y2="275.5" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="492.0" y1="220.0" x2="528.0" y2="220.0" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="112.0" y1="210.0" x2="492.0" y2="160.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="112.0" y1="230.0" x2="492.0" y2="280.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="510.0" y="302.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">2r</text>
  <text x="510.0" y="148.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">F/4</text>
  <path d="M693.0 130.0 L747.0 143.5 L747.0 296.5 L693.0 310.0 Z" stroke="#1f6fb5" stroke-width="1.6" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="711.0" y1="134.5" x2="711.0" y2="305.5" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="693.0" y1="190.0" x2="747.0" y2="194.5" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="729.0" y1="139.0" x2="729.0" y2="301.0" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="693.0" y1="250.0" x2="747.0" y2="245.5" stroke="#1f6fb5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="112.0" y1="210.0" x2="693.0" y2="130.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="112.0" y1="230.0" x2="693.0" y2="310.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="720.0" y="332.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">3r</text>
  <text x="720.0" y="118.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">F/9</text>
  <text x="760.0" y="130.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">area grows as r^2,</text>
  <text x="760.0" y="150.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">so the flux through</text>
  <text x="760.0" y="170.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">each square falls</text>
  <text x="760.0" y="190.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">as 1/r^2</text>
  <text x="450.0" y="360.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">radiant flux intensity  F = L / (4 pi d</tspan><tspan dy="-7.6" font-size="12.6">2</tspan><tspan dy="7.6">)</tspan></text>
  <text x="450.0" y="400.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Standard candles (Cepheid variables, Type Ia supernovae) have known luminosity L;</text>
  <text x="450.0" y="420.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">measuring F on Earth then gives the distance d = sqrt(L / 4 pi F).</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
