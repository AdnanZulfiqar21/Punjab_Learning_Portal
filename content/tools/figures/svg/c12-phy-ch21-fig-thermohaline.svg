<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original simplified diagram after Fig 21.15: warm, less dense surface water flows from the tropics towards the poles, cools and becomes saltier as sea ice forms, sinks, flows back along the deep ocean towards the equator and eventually rises again; a full cycle takes about 1000 years. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Thermohaline circulation (after Fig 21.15, simplified)</text>
  <rect x="40.0" y="80.0" width="820.0" height="250.0" rx="10" stroke="#1f6fb5" stroke-width="1.5" fill="#eff6ff"/>
  <text x="60.0" y="105.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">polar region: water cools, sea ice forms, salinity rises,</text>
  <text x="60.0" y="121.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dense water sinks</text>
  <text x="840.0" y="105.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">tropics: warm, less dense</text>
  <text x="840.0" y="121.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">surface water</text>
  <path d="M780 150 Q450 140 140 170" stroke="#d7322f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M140.0 170.0 L151.3 163.5 L152.2 174.4 Z" fill="#d7322f"/>
  <path d="M120 185 Q100 230 130 280" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M130.0 280.0 L120.8 270.8 L131.1 267.0 Z" fill="#1f6fb5"/>
  <path d="M140 300 Q450 320 760 290" stroke="#1f6fb5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M760.0 290.0 L748.7 296.5 L747.8 285.6 Z" fill="#1f6fb5"/>
  <path d="M780 280 Q800 220 785 165" stroke="#d7322f" stroke-width="5" fill="none" stroke-dasharray="8 5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M785.0 165.0 L792.5 175.6 L781.6 177.6 Z" fill="#d7322f"/>
  <text x="450.0" y="135.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">warm shallow current (towards the poles)</text>
  <text x="450.0" y="352.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">cold deep current (back towards the equator)</text>
  <text x="805.0" y="225.0" font-size="11" fill="#d7322f" text-anchor="start" font-weight="700">upwelling</text>
  <text x="450.0" y="388.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Driven by differences in temperature and salinity (density); one full cycle takes about 1000 years</text>
  <text x="450.0" y="406.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">and carries heat from the tropics to the polar regions.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
