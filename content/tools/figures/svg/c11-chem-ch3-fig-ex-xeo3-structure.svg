<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif">
  <!-- Vis3-9 (C11-CHEM, PDF p71), Short Q2(c): structure of xenon trioxide as printed: Xe at the top with one lone pair (two dots), joined by double bonds to three O atoms, one to the left, one straight down and one to the right. Original drawing after the textbook. -->
  <rect width="500" height="250" fill="#ffffff"/>
  <text x="250" y="90" font-size="40" text-anchor="middle" fill="#14181f">Xe</text>
  <circle cx="242" cy="42" r="4" fill="#14181f"/>
  <circle cx="256" cy="42" r="4" fill="#14181f"/>
  <line x1="217.0" y1="98.8" x2="137.0" y2="144.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="223.0" y1="109.2" x2="143.0" y2="155.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="244.0" y1="108.0" x2="244.0" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="256.0" y1="108.0" x2="256.0" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="279.0" y1="109.2" x2="357.0" y2="155.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="285.0" y1="98.8" x2="363.0" y2="144.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="172" font-size="40" text-anchor="middle" fill="#14181f">O</text>
  <text x="250" y="220" font-size="40" text-anchor="middle" fill="#14181f">O</text>
  <text x="380" y="172" font-size="40" text-anchor="middle" fill="#14181f">O</text>
</svg>
