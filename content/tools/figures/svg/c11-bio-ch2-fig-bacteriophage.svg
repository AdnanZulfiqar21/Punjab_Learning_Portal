<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="1000" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.11: a T4 bacteriophage. -->
  <defs>
    <style>
      .t{font-size:28px;font-weight:700;fill:#14181f}
      .s{font-size:21px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- head: elongated hexagonal prism -->
  <polygon points="450,60 560,130 560,330 450,400 340,330 340,130" fill="#b2dbcc" stroke="#0f7a62" stroke-width="7" stroke-linejoin="round"/>
  <path d="M450 60 V400 M340 130 L560 330 M560 130 L340 330" stroke="#0f7a62" stroke-width="2" opacity="0.5"/>
  <!-- DNA coil inside -->
  <path d="M400 150 c40 -20 60 20 100 0 c-40 40 -60 60 -100 80 c40 20 60 60 100 80 c-40 20 -60 40 -100 20" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="430" y="400" width="40" height="30" fill="#0f7a62"/>
  <!-- tail: sheath and core -->
  <rect x="405" y="430" width="90" height="300" rx="12" fill="#2f9a7e" stroke="#0f7a62" stroke-width="5"/>
  <rect x="440" y="430" width="20" height="300" fill="#e1f3ec"/>
  <!-- end plate -->
  <rect x="370" y="730" width="160" height="26" rx="8" fill="#0f7a62"/>
  <!-- tail fibres -->
  <g stroke="#14181f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 756 L300 820 L250 920"/><path d="M420 756 L360 850 L330 950"/><path d="M450 756 L450 870 L430 960"/>
    <path d="M520 756 L600 820 L650 920"/><path d="M480 756 L540 850 L570 950"/><path d="M450 756 L450 870 L470 960"/>
  </g>
  <!-- labels -->
  <path class="lead" d="M560 200 L680 140"/><text class="t" x="690" y="130">Head</text><text class="s" x="690" y="160">hexagonal prism,</text><text class="s" x="690" y="186">protein capsid</text>
  <path class="lead" d="M470 230 L640 290"/><text class="t" x="650" y="300">DNA</text><text class="s" x="650" y="328">double-stranded</text>
  <path class="lead" d="M470 415 L640 430"/><text class="t" x="650" y="440">Neck</text>
  <path class="lead" d="M495 560 L640 560"/><text class="t" x="650" y="570">Sheath</text>
  <path class="lead" d="M450 620 L250 560"/><text class="t" x="120" y="550">Inner core</text>
  <path class="lead" d="M370 745 L240 700"/><text class="t" x="80" y="690">End plate</text>
  <path class="lead" d="M600 820 L720 820"/><text class="t" x="730" y="830">Tail fibres</text><text class="s" x="730" y="858">six; attach to</text><text class="s" x="730" y="884">the bacterial wall</text>
</svg>
