<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <!-- Fig 18.18 (C12-BIO, PDF p109): Dichromacy & monochromacy: five columns of six colour swatches side by side (normal vision, green-blindness, red-blindness, blue-blindness, red-green blindness), each name printed vertically, reading downwards, just right of its column. Swatch colours as printed. -->
  <rect x="40" y="20" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#ee2029"/>
  <rect x="40" y="110" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#f79729"/>
  <rect x="40" y="200" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#f8ee3a"/>
  <rect x="40" y="290" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#1b9747"/>
  <rect x="40" y="380" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#4a59a7"/>
  <rect x="40" y="470" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#86459b"/>
  <text transform="translate(182 20) rotate(90)" x="0" y="0" font-size="23" fill="#14181f">Normal vision (trichromacy)</text>
  <rect x="230" y="20" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#a91e23"/>
  <rect x="230" y="110" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#e3c828"/>
  <rect x="230" y="200" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#fbeb35"/>
  <rect x="230" y="290" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#c53065"/>
  <rect x="230" y="380" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#567bbd"/>
  <rect x="230" y="470" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#607bbd"/>
  <text transform="translate(372 20) rotate(90)" x="0" y="0" font-size="23" fill="#14181f">Green-blindness (deuteranopia)</text>
  <rect x="420" y="20" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#0f6764"/>
  <rect x="420" y="110" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#d3bb2d"/>
  <rect x="420" y="200" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#fbee31"/>
  <rect x="420" y="290" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#1b9747"/>
  <rect x="420" y="380" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#5d7ebf"/>
  <rect x="420" y="470" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#3d62ad"/>
  <text transform="translate(562 20) rotate(90)" x="0" y="0" font-size="23" fill="#14181f">Red-blindness (protanopia)</text>
  <rect x="610" y="20" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#f16522"/>
  <rect x="610" y="110" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#f59baf"/>
  <rect x="610" y="200" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#fbee31"/>
  <rect x="610" y="290" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#1b9747"/>
  <rect x="610" y="380" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#cce5f0"/>
  <rect x="610" y="470" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#ac5570"/>
  <text transform="translate(752 20) rotate(90)" x="0" y="0" font-size="23" fill="#14181f">Blue-blindness (tritanopia)</text>
  <rect x="800" y="20" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#343264"/>
  <rect x="800" y="110" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#e46364"/>
  <rect x="800" y="200" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#fbed12"/>
  <rect x="800" y="290" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#bfaa30"/>
  <rect x="800" y="380" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#5479bc"/>
  <rect x="800" y="470" width="130" height="90" stroke="#ffffff" stroke-width="2" fill="#5f7abc"/>
  <text transform="translate(942 20) rotate(90)" x="0" y="0" font-size="23" fill="#14181f">Red-green blindness (blue-cone monochromacy)</text>
</svg>
