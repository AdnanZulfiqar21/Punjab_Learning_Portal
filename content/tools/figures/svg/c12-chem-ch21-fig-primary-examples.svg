  <path d="M55.0 126 L295.0 126" stroke="#29a8dc" stroke-width="6" stroke-linecap="round"/>
  <text x="175.0" y="94.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"> &#8211; Cl</tspan></text>
  <text x="175.0" y="185.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">chloromethane</tspan></text>
  <rect x="380.0" y="40.0" width="360.0" height="84.0" rx="40" stroke="#29a8dc" stroke-width="0" fill="#cdeefb"/>
  <path d="M410.0 126 L710.0 126" stroke="#29a8dc" stroke-width="6" stroke-linecap="round"/>
  <text x="560.0" y="94.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"> &#8211; CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"> &#8211; Cl</tspan></text>
  <text x="560.0" y="185.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">chloroethane</tspan></text>
  <rect x="775.0" y="40.0" width="400.0" height="84.0" rx="40" stroke="#29a8dc" stroke-width="0" fill="#cdeefb"/>
  <path d="M805.0 126 L1145.0 126" stroke="#29a8dc" stroke-width="6" stroke-linecap="round"/>
  <text x="975.0" y="94.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"> &#8211; CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"> &#8211; CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"> &#8211; Cl</tspan></text>
  <text x="975.0" y="185.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">1-chloropropane</tspan></text>
</svg>
