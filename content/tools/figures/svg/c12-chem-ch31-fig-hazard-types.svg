<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="260" fill="#ffffff"/>
  <!-- Three kinds of hazard (our own tiles for topic 31.2.1; not a textbook figure). -->
  <rect x="15.0" y="20.0" width="310.0" height="220.0" rx="14" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <text x="170.0" y="121.6" font-size="28" fill="#d7322f" text-anchor="middle" font-weight="800"><tspan dy="0.0">Health</tspan></text>
  <text x="170.0" y="158.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">chromium compounds</tspan></text>
  <rect x="345.0" y="20.0" width="310.0" height="220.0" rx="14" stroke="#d98b2b" stroke-width="3" fill="#fff1dc"/>
  <text x="500.0" y="121.6" font-size="28" fill="#d98b2b" text-anchor="middle" font-weight="800"><tspan dy="0.0">Physical</tspan></text>
  <text x="500.0" y="158.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">flammable, explosive</tspan></text>
  <rect x="675.0" y="20.0" width="310.0" height="220.0" rx="14" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="830.0" y="121.6" font-size="28" fill="#0f7a62" text-anchor="middle" font-weight="800"><tspan dy="0.0">Environmental</tspan></text>
  <text x="830.0" y="158.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">Pb, Hg, Cd in soil</tspan></text>
</svg>
