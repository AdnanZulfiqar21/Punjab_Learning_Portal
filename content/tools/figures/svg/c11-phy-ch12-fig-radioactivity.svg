<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.4 to 12.6 and topic 12.4: alpha, beta and gamma radiation in an electric field, the decay equations, their energy spectra and Table 12.2. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Radioactivity: alpha, beta and gamma radiation and their energy spectra</text>
  <rect x="50" y="55" width="620" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="360" y="83">Three radiations in an electric field (12.4, Fig. 12.4)</text>
  <rect x="80" y="170" width="110" height="80" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/><rect x="120" y="198" width="70" height="24" fill="#4b5563"/>
  <circle cx="132" cy="210" r="7" fill="#1f6fb5"/><text class="r" x="80" y="268">lead block and source</text>
  <path d="M190 210 H300" stroke="#1f6fb5" stroke-width="7"/>
  <rect x="300" y="160" width="160" height="8" fill="#f8c8b8" stroke="#d7322f"/><text class="l" x="466" y="168">+</text>
  <rect x="300" y="252" width="160" height="8" fill="#bcdcf0" stroke="#1f6fb5"/><text class="l" x="466" y="262">-</text>
  <path d="M300 210 Q 420 210 590 110" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M300 210 H600" stroke="#d98b2b" stroke-width="3"/>
  <path d="M300 210 Q 440 212 590 262" fill="none" stroke="#d7322f" stroke-width="3"/>
  <rect x="600" y="90" width="10" height="200" fill="#e5e7eb" stroke="#4b5563"/>
  <text class="l" x="520" y="120" style="fill:#1f6fb5">beta (-)</text>
  <text class="l" x="520" y="202" style="fill:#d98b2b">gamma</text>
  <text class="l" x="520" y="276" style="fill:#d7322f">alpha (+)</text>
  <text class="r" x="560" y="306">photographic plate</text>
  <g class="r">
    <text x="70" y="322">alpha bends a little to the - plate (positive, heavy); beta bends more to the + plate</text>
    <text x="70" y="336">(negative, light); gamma goes straight; natural radioactivity: Z above 82; artificial:</text>
    <text x="70" y="350">radioisotopes made by bombarding stable nuclei</text>
  </g>
  <rect x="690" y="55" width="460" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="920" y="83">Decay equations (12.4)</text>
  <g class="f">
    <text x="710" y="104">alpha: A Z X -&gt; (A-4)(Z-2) Y + 4 2 He   (12.2)</text>
    <text x="710" y="125">  226 88 Ra -&gt; 222 86 Rn + 4 2 He   (12.3)</text>
    <text x="710" y="146">beta-: n -&gt; p + e- + antineutrino</text>
    <text x="710" y="167">  A Z X -&gt; A (Z+1) Y + e- + antineutrino</text>
    <text x="710" y="188">  thorium -&gt; 234 91 Pa + e- + antineutrino</text>
    <text x="710" y="209">beta+: p -&gt; n + e+ + neutrino</text>
    <text x="710" y="230">  A Z X -&gt; A (Z-1) Y + e+ + neutrino</text>
    <text x="710" y="251">  19 10 Ne -&gt; 19 9 F + e+ + neutrino</text>
    <text x="710" y="272">gamma: A Z X* -&gt; A Z X + gamma</text>
  </g>
  <g class="r">
    <text x="710" y="306">A and Z written as numbers before the symbol (mass over charge);</text>
    <text x="710" y="320">Q-value: the mass lost appears as disintegration energy</text>
    <text x="710" y="334">Pauli proposed the neutrino (1930); Reines and Cowan detected</text>
    <text x="710" y="348">it in 1953 (Nobel Prize to Reines, 1995)</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Energy spectra (Figs. 12.5, 12.6)</text>
  <path d="M90 620 H300" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M90 620 V460" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M140 620 V550" stroke="#d7322f" stroke-width="3"/>
  <path d="M190 620 V490" stroke="#d7322f" stroke-width="3"/>
  <path d="M240 620 V575" stroke="#d7322f" stroke-width="3"/>
  <path d="M270 620 V480" stroke="#d7322f" stroke-width="3"/>
  <text class="r" x="100" y="456">number of alphas</text>
  <text class="r" x="190" y="640">kinetic energy</text>
  <text class="l" x="110" y="664" style="fill:#d7322f">alpha: discrete lines</text>
  <path d="M340 620 H560" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M340 620 V460" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
