  <text class="r" x="350" y="456">number of betas</text>
  <text class="r" x="440" y="640">kinetic energy</text>
  <text class="l" x="350" y="664" style="fill:#1f6fb5">beta: continuous range</text>
  <g class="r">
    <text x="70" y="686">beta energy is shared with an (anti)neutrino: zero to a maximum</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Table 12.2: alpha, beta and gamma</text>
  <text class="l" x="630" y="452"></text>
  <text class="l" x="740" y="452">alpha</text>
  <text class="l" x="870" y="452">beta</text>
  <text class="l" x="1010" y="452">gamma</text>
  <text class="l" x="630" y="478">nature</text>
  <text class="r" x="740" y="478">He nuclei, 2e</text>
  <text class="r" x="870" y="478">e- or e+, +/-e</text>
  <text class="r" x="1010" y="478">photons, 0</text>
  <text class="l" x="630" y="504">source</text>
  <text class="r" x="740" y="504">radon-222</text>
  <text class="r" x="870" y="504">strontium-94</text>
  <text class="r" x="1010" y="504">cobalt-60</text>
  <text class="l" x="630" y="530">ion pairs/mm</text>
  <text class="r" x="740" y="530">about 10^4</text>
  <text class="r" x="870" y="530">about 10^2</text>
  <text class="r" x="1010" y="530">about 1</text>
  <text class="l" x="630" y="556">range in air</text>
  <text class="r" x="740" y="556">a few cm</text>
  <text class="r" x="870" y="556">a few m</text>
  <text class="r" x="1010" y="556">inverse square</text>
  <text class="l" x="630" y="582">stopped by</text>
  <text class="r" x="740" y="582">paper</text>
  <text class="r" x="870" y="582">1-5 mm Al</text>
  <text class="r" x="1010" y="582">1-10 cm lead</text>
  <text class="l" x="630" y="608">energies</text>
  <text class="r" x="740" y="608">one value</text>
  <text class="r" x="870" y="608">variable</text>
  <text class="r" x="1010" y="608">variable</text>
  <text class="l" x="630" y="634">speed</text>
  <text class="r" x="740" y="634">about 10^7 m/s</text>
  <text class="r" x="870" y="634">about 1 x 10^8 m/s</text>
  <text class="r" x="1010" y="634">3 x 10^8 m/s</text>
  <g class="r">
    <text x="630" y="676">beta speed up to 0.9995 c; alpha a few per cent of c (text); gamma: highest penetration</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
