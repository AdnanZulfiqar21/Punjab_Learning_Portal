<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.19: a mitochondrion cut lengthwise. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- outer membrane -->
  <rect x="150" y="200" width="800" height="360" rx="180" fill="#d98b2b"/>
  <!-- intermembrane space -->
  <rect x="166" y="216" width="768" height="328" rx="164" fill="#fff4e2"/>
  <!-- inner membrane boundary -->
  <rect x="186" y="236" width="728" height="288" rx="144" fill="#8a4b00"/>
  <!-- matrix -->
  <rect x="200" y="250" width="700" height="260" rx="130" fill="#f3e9d2"/>
  <!-- cristae: infoldings of the inner membrane -->
  <g fill="#8a4b00">
    <path d="M300 250 q-30 110 0 220 q20 -110 0 -220 z"/>
    <path d="M300 250 q30 110 0 220" fill="none" stroke="#8a4b00" stroke-width="2"/>
    <path d="M400 250 q-35 120 0 240 q25 -120 0 -240 z"/>
    <path d="M500 250 q-30 90 0 180 q20 -90 0 -180 z"/>
    <path d="M600 510 q-35 -120 0 -240 q25 120 0 240 z"/>
    <path d="M700 510 q-30 -100 0 -200 q20 100 0 200 z"/>
    <path d="M800 250 q-30 90 0 180 q20 -90 0 -180 z"/>
  </g>
  <!-- F1 particles on cristae (knobs facing the matrix) -->
  <g fill="#0f7a62"><circle cx="286" cy="300" r="6"/><circle cx="312" cy="340" r="6"/><circle cx="286" cy="400" r="6"/><circle cx="386" cy="330" r="6"/><circle cx="414" cy="400" r="6"/><circle cx="486" cy="310" r="6"/><circle cx="614" cy="430" r="6"/><circle cx="686" cy="400" r="6"/><circle cx="714" cy="340" r="6"/><circle cx="786" cy="330" r="6"/></g>
  <!-- circular DNA and ribosomes in matrix -->
  <ellipse cx="560" cy="300" rx="34" ry="20" fill="none" stroke="#5b3fb5" stroke-width="5"/>
  <g fill="#d98b2b" stroke="#8a4b00" stroke-width="2"><circle cx="650" cy="290" r="6"/><circle cx="670" cy="310" r="6"/><circle cx="640" cy="320" r="6"/></g>
  <!-- labels -->
  <path class="lead" d="M550 200 L550 100"/><text class="t" x="440" y="80">Outer membrane</text><text class="s" x="400" y="105">smooth; a sieve that stops large molecules</text>
  <path class="lead" d="M166 380 L100 460"/><text class="t" x="30" y="490" style="font-size:22px">Intermembrane</text><text class="t" x="30" y="516" style="font-size:22px">space</text>
  <path class="lead" d="M400 480 L330 640"/><text class="t" x="200" y="670">Cristae</text><text class="s" x="140" y="695">infoldings of the inner membrane; more surface area</text>
  <path class="lead" d="M560 300 L700 160"/><text class="t" x="700" y="150">Circular DNA</text><text class="s" x="700" y="175">and 70S ribosomes</text>
  <path class="lead" d="M786 330 L950 640"/><text class="t" x="900" y="670">F1 particles</text><text class="s" x="860" y="695">ATP synthase on the cristae</text>
  <path class="lead" d="M700 520 L690 578"/><text class="t" x="640" y="605">Matrix</text><text class="s" x="580" y="630">enzymes of the Krebs cycle</text>
  <text class="s" x="30" y="740">Rod-shaped power generator: respiration makes ATP here; replicates on its own like a prokaryote.</text>
</svg>
