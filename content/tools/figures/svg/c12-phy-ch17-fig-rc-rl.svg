  <text x="315.0" y="420.0" font-size="12" fill="#0e9aa7" text-anchor="start" font-weight="700">V_C = I X_C</text>
  <text x="175.0" y="445.0" font-size="12" fill="#7c3aed" text-anchor="end" font-weight="700">V = I Z</text>
