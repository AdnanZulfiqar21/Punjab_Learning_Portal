  <text x="670.0" y="515.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Z = sqrt(R</tspan><tspan dy="-5.5" font-size="9.1">2</tspan><tspan dy="5.5"> + (wL)</tspan><tspan dy="-5.5" font-size="9.1">2</tspan><tspan dy="5.5">);  tan(theta) = wL/R</tspan></text>
