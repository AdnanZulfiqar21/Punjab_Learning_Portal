<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original: the seven OSI layers on the sender and receiver with each layer's job. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The OSI model: seven layers (after Fig 1.13)</text>
  <text x="120.0" y="78.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">sender</text>
  <text x="780.0" y="78.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">receiver</text>
  <rect x="40.0" y="95.0" width="160.0" height="44.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="120.0" y="123.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">7 Application</text>
  <rect x="700.0" y="95.0" width="160.0" height="44.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="780.0" y="123.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">7 Application</text>
  <text x="450.0" y="123.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">services for users: HTTP, FTP, email</text>
  <rect x="40.0" y="153.0" width="160.0" height="44.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="120.0" y="181.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">6 Presentation</text>
  <rect x="700.0" y="153.0" width="160.0" height="44.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="780.0" y="181.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">6 Presentation</text>
  <text x="450.0" y="181.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">format, encryption, compression</text>
  <rect x="40.0" y="211.0" width="160.0" height="44.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="120.0" y="239.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">5 Session</text>
  <rect x="700.0" y="211.0" width="160.0" height="44.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="780.0" y="239.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">5 Session</text>
  <text x="450.0" y="239.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">start, keep and end sessions</text>
  <rect x="40.0" y="269.0" width="160.0" height="44.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="120.0" y="297.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">4 Transport</text>
  <rect x="700.0" y="269.0" width="160.0" height="44.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="780.0" y="297.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">4 Transport</text>
  <text x="450.0" y="297.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">reliable, ordered delivery; segments</text>
  <rect x="40.0" y="327.0" width="160.0" height="44.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="120.0" y="355.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">3 Network</text>
  <rect x="700.0" y="327.0" width="160.0" height="44.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="780.0" y="355.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">3 Network</text>
  <text x="450.0" y="355.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">IP addresses; best route</text>
  <rect x="40.0" y="385.0" width="160.0" height="44.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#dff5f7"/>
  <text x="120.0" y="413.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">2 Data link</text>
  <rect x="700.0" y="385.0" width="160.0" height="44.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#dff5f7"/>
  <text x="780.0" y="413.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">2 Data link</text>
  <text x="450.0" y="413.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">frames; error detection; access</text>
  <rect x="40.0" y="443.0" width="160.0" height="44.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="120.0" y="471.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 Physical</text>
  <rect x="700.0" y="443.0" width="160.0" height="44.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="780.0" y="471.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 Physical</text>
  <text x="450.0" y="471.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">bits as electrical, light or radio signals</text>
  <line x1="25.0" y1="105.0" x2="25.0" y2="470.4" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M25.0 480.0 L19.9 469.1 L30.1 469.1 Z" fill="#d7322f"/>
  <text x="18.0" y="300.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700" transform="rotate(-90 18.0 300.0)">data goes down</text>
  <line x1="875.0" y1="480.0" x2="875.0" y2="114.6" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M875.0 105.0 L880.1 115.9 L869.9 115.9 Z" fill="#1f6fb5"/>
  <text x="888.0" y="300.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700" transform="rotate(90 888.0 300.0)">data goes up</text>
  <line x1="120.0" y1="487.0" x2="120.0" y2="525.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="120.0" y1="525.0" x2="780.0" y2="525.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="780.0" y1="525.0" x2="780.0" y2="487.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="450.0" y="548.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">physical medium: cable, fibre or radio</text>
  <text x="450.0" y="572.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Lower layers move the data; upper layers serve the user's application.</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
