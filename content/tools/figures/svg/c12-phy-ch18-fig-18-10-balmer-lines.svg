<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Fig 18.10: the Balmer lines of hydrogen on a dark background at 656 nm (red), 486 nm (blue-green), 434 nm (blue) and 410 nm (violet), with further violet lines towards the UV. -->
  <rect x="60.0" y="200.0" width="900.0" height="140.0" rx="0" stroke="none" fill="#2b2b2b"/>
  <line x1="129.7" y1="200.0" x2="129.7" y2="340.0" stroke="#ff0000" stroke-width="5" stroke-linecap="butt"/>
  <line x1="623.2" y1="200.0" x2="623.2" y2="340.0" stroke="#00eeff" stroke-width="5" stroke-linecap="butt"/>
  <line x1="774.2" y1="200.0" x2="774.2" y2="340.0" stroke="#2800ff" stroke-width="5" stroke-linecap="butt"/>
  <line x1="843.9" y1="200.0" x2="843.9" y2="340.0" stroke="#7f00dd" stroke-width="5" stroke-linecap="butt"/>
  <line x1="881.6" y1="200.0" x2="881.6" y2="340.0" stroke="#7b4fc0" stroke-width="4" stroke-linecap="butt"/>
  <line x1="904.8" y1="200.0" x2="904.8" y2="340.0" stroke="#7b4fc0" stroke-width="4" stroke-linecap="butt"/>
  <text x="139.7" y="180.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 139.7 180.0)">656 nm</text>
  <text x="633.2" y="180.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 633.2 180.0)">486 nm</text>
  <text x="784.2" y="180.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 784.2 180.0)">434 nm</text>
  <text x="853.9" y="180.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400" transform="rotate(-90 853.9 180.0)">410 nm</text>
  <text x="129.7" y="390.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Red</text>
  <text x="623.2" y="390.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Blue</text>
  <text x="623.2" y="428.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Green</text>
  <text x="760.2" y="390.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Blue</text>
  <text x="869.9" y="390.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Violet</text>
  <text x="961.0" y="376.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">UV</text>
</svg>
