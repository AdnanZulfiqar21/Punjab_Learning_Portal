<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original block diagram after Fig 17.13a: mains AC goes to a rectifier, which charges a battery through a charger; an inverter turns the battery's DC back into AC for the appliance. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A UPS (uninterruptible power supply) at home (after Fig 17.13a)</text>
  <rect x="20.0" y="110.0" width="140.0" height="80.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#f1f3f6"/>
  <text x="90.0" y="146.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700">220 V AC</text>
  <text x="90.0" y="166.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700">mains</text>
  <rect x="200.0" y="110.0" width="140.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2.4" fill="#dbe9f5"/>
  <text x="270.0" y="146.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">rectifier</text>
  <text x="270.0" y="166.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">AC -&gt; DC</text>
  <rect x="380.0" y="110.0" width="140.0" height="80.0" rx="10" stroke="#0f7a62" stroke-width="2.4" fill="#e6f4ef"/>
  <text x="450.0" y="146.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">battery</text>
  <text x="450.0" y="166.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">stores DC</text>
  <rect x="560.0" y="110.0" width="140.0" height="80.0" rx="10" stroke="#7c3aed" stroke-width="2.4" fill="#efe7fd"/>
  <text x="630.0" y="146.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">inverter</text>
  <text x="630.0" y="166.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">DC -&gt; AC</text>
  <rect x="740.0" y="110.0" width="140.0" height="80.0" rx="10" stroke="#d7322f" stroke-width="2.4" fill="#fde2e1"/>
  <text x="810.0" y="146.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">AC</text>
  <text x="810.0" y="166.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">appliance</text>
  <line x1="160.0" y1="150.0" x2="186.4" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M196.0 150.0 L185.1 155.1 L185.1 144.9 Z" fill="#14181f"/>
  <line x1="340.0" y1="150.0" x2="366.4" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M376.0 150.0 L365.1 155.1 L365.1 144.9 Z" fill="#14181f"/>
  <line x1="520.0" y1="150.0" x2="546.4" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M556.0 150.0 L545.1 155.1 L545.1 144.9 Z" fill="#14181f"/>
  <line x1="700.0" y1="150.0" x2="726.4" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M736.0 150.0 L725.1 155.1 L725.1 144.9 Z" fill="#14181f"/>
  <rect x="200.0" y="280.0" width="140.0" height="80.0" rx="10" stroke="#d98b2b" stroke-width="2.4" fill="#fff1dc"/>
  <text x="270.0" y="316.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">battery</text>
  <text x="270.0" y="336.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">charger</text>
  <line x1="270.0" y1="190.0" x2="270.0" y2="266.4" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M270.0 276.0 L264.9 265.1 L275.1 265.1 Z" fill="#14181f"/>
  <path d="M340.0 320.0 L450.0 320.0" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="450.0" y1="320.0" x2="450.0" y2="203.6" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 194.0 L455.1 204.9 L444.9 204.9 Z" fill="#14181f"/>
  <text x="470.0" y="300.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">When the mains is on, the rectifier</text>
  <text x="470.0" y="320.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">charges the battery; when it fails,</text>
  <text x="470.0" y="340.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">the inverter runs the appliance</text>
  <text x="470.0" y="360.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">from the battery (backup power).</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
