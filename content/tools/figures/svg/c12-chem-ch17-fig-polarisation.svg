<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for the book's polarisation sketch: a small Mg2+ ion pulling the electron cloud of a carbonate ion out of shape, and a large Ba2+ ion leaving it nearly undistorted, explaining why thermal stability increases down Group 2. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Why carbonates lower in Group 2 are more stable</text>
  <rect x="30.0" y="55.0" width="420.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <circle cx="140.0" cy="200.0" r="26.0" stroke="#b91c1c" stroke-width="2" fill="#fecaca"/>
  <text x="140.0" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan></text>
  <circle cx="320.0" cy="200.0" r="10.0" stroke="#14181f" stroke-width="1.5" fill="#e5e7eb"/>
  <text x="320.0" y="204.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <line x1="320.0" y1="200.0" x2="320.0" y2="148.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="320.0" cy="148.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="320.0" y="152.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <line x1="320.0" y1="200.0" x2="252.5" y2="239.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="252.5" cy="239.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="252.5" y="243.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <line x1="320.0" y1="200.0" x2="365.0" y2="226.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="365.0" cy="226.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="365.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <ellipse cx="296.0" cy="208.0" rx="100.0" ry="68.0" stroke="#0f7a62" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="240.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">small, high charge density:</text>
  <text x="240.0" y="342.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">strongly polarises the carbonate ion</text>
  <rect x="470.0" y="55.0" width="420.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <circle cx="580.0" cy="200.0" r="48.0" stroke="#1d4ed8" stroke-width="2" fill="#bfdbfe"/>
  <text x="580.0" y="206.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ba</tspan><tspan dy="-6.7" font-size="11.2">2+</tspan></text>
  <circle cx="790.0" cy="200.0" r="10.0" stroke="#14181f" stroke-width="1.5" fill="#e5e7eb"/>
  <text x="790.0" y="204.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <line x1="790.0" y1="200.0" x2="790.0" y2="148.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="790.0" cy="148.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="790.0" y="152.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <line x1="790.0" y1="200.0" x2="745.0" y2="226.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="745.0" cy="226.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="745.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <line x1="790.0" y1="200.0" x2="835.0" y2="226.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="835.0" cy="226.0" r="16.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="835.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <ellipse cx="790.0" cy="200.0" rx="78.0" ry="74.0" stroke="#0f7a62" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="680.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">large, low charge density:</text>
  <text x="680.0" y="342.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">hardly distorts the carbonate ion</text>
  <rect x="40.0" y="390.0" width="820.0" height="55.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="413.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">a distorted carbonate ion breaks into CO2 and O2- more easily, so MgCO3 decomposes at 540 C</text>
  <text x="450.0" y="433.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">but BaCO3 needs 1360 C (book's Table 17.3); nitrates follow the same trend</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
