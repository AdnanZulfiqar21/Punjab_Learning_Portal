<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 6.3 (glass calorimeter) and Sample Problem 6.2, with the calorie content of glucose. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:15px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Measuring an enthalpy change with a glass calorimeter</text>
  <!-- calorimeter drawing -->
  <text class="k" x="230" y="72">Glass calorimeter (Figure 6.3)</text>
  <rect x="130" y="130" width="200" height="200" rx="6" fill="#ece9e2" stroke="#9ca3af" stroke-width="2"/>
  <rect x="160" y="150" width="140" height="180" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="162" y="230" width="136" height="98" fill="#dbe9f5"/>
  <rect x="150" y="130" width="160" height="16" rx="4" fill="#9ca3af"/>
  <rect x="200" y="90" width="6" height="200" fill="#4b5563"/><rect x="194" y="280" width="18" height="6" fill="#4b5563"/>
  <rect x="250" y="80" width="8" height="220" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><rect x="252" y="200" width="4" height="98" fill="#d7322f"/>
  <g class="t">
    <text x="345" y="100">thermometer</text>
    <text x="345" y="140">loose-fitting lid (atmospheric pressure)</text>
    <text x="345" y="180">stirrer</text>
    <text x="345" y="240">cotton wool insulation round the beaker</text>
    <text x="345" y="290">reaction mixture (dilute solution)</text>
  </g>
  <text class="s" x="230" y="362">suits reactions in solution; not for gases that escape</text>
  <text class="s" x="230" y="380">or products that reach high temperatures</text>
  <!-- formula box -->
  <rect x="80" y="400" width="440" height="140" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="f" x="300" y="430">q = m x c x delta T</text>
  <text class="s" x="300" y="455">c of water = 4.18 J per g per K (4.2 in the sample); delta T = Tf - Ti</text>
  <text class="f" x="300" y="485">delta H = - q / n = - m c delta T / n</text>
  <text class="s" x="300" y="510">q in J, divide by 1000 for kJ; n = moles reacting;</text>
  <text class="s" x="300" y="528">the minus sign gives a negative delta H for heat evolved</text>
  <!-- sample problem steps -->
  <text class="k" x="860" y="72">Sample 6.2: enthalpy of neutralization</text>
  <rect x="600" y="90" width="540" height="250" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <g class="t">
    <text x="620" y="118">100 cm3 of 0.5 mol/dm3 NaOH + 100 cm3 of 0.5 mol/dm3 HCl, both at 25 degrees C</text>
    <text x="620" y="146">1. mass of mixture: 200 cm3 of dilute solution, density about 1 g/cm3, so 200 g</text>
    <text x="620" y="172">2. temperature rise: 28.5 - 25.0 = 3.5 degrees C = 3.5 K</text>
    <text x="620" y="198">3. heat evolved: q = 200 x 4.2 x 3.5 = 2940 J = 2.94 kJ</text>
    <text x="620" y="224">4. moles of water formed: n = C x V = 0.5 x 100/1000 = 0.05 mol</text>
    <text x="620" y="250">5. delta Hn = -2.94 kJ / 0.05 mol = -58.8 kJ per mol</text>
    <text x="620" y="286">strong acid + strong alkali is always close to -57.1 kJ per mol,</text>
    <text x="620" y="304">because the only change is H+(aq) + OH-(aq) giving H2O(l)</text>
  </g>
  <!-- calorie content -->
  <rect x="600" y="360" width="540" height="180" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="870" y="388">Food as fuel: calorie content (topic 6.7)</text>
  <g class="t">
    <text x="620" y="414">glucose: C6H12O6 + 6 O2 gives 6 CO2 + 6 H2O, delta H = -2803 kJ per mol</text>
    <text x="620" y="440">per gram: 2803 / 180 = 15.57 kJ per g</text>
    <text x="620" y="466">calorie content = 15.57 / 4.184 = 3.72 kcal per g</text>
    <text x="620" y="500">digesting food releases the same energy as burning it (bomb calorimeter);</text>
    <text x="620" y="518">energy intake must be balanced by energy spent in work and exercise</text>
  </g>
</svg>
