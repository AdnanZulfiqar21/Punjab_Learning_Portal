  <line x1="1058.1" y1="168.0" x2="1115.5" y2="168.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="1106.1" y="218.1" font-size="28" fill="#1aa3c9" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="1116.5" y="278.6" font-size="28" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
