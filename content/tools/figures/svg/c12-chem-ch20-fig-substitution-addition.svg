<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <!-- The book's comparison on p64: benzene + Br2 (FeBr3) gives bromobenzene + HBr, the H replaced by Br (electrophilic substitution); cyclohexene + Br2 gives 1,2-dibromocyclohexane, two Br added to the double bond (electrophilic addition). The book crosses out the cyclohexene arrow; the addition does take place, so the arrow is drawn without the cross. -->
  <text x="270.0" y="40.0" font-size="26" fill="#1b9e4b" text-anchor="middle" font-weight="700"><tspan dy="0.0">electrophilic substitution</tspan></text>
  <path d="M75.0 146.0 L113.1 168.0 L113.1 212.0 L75.0 234.0 L36.9 212.0 L36.9 168.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
