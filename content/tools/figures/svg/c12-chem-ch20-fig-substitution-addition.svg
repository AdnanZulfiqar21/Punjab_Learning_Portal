  <line x1="356.6" y1="223.3" x2="332.9" y2="209.5" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="332.9" y1="170.5" x2="356.6" y2="156.7" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="360.0" y1="146.0" x2="360.0" y2="116.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="360.0" y="107.3" font-size="28" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="425.0" y="200.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <text x="452" y="200" font-size="28" font-weight="700"><tspan fill="#1aa3c9">H</tspan><tspan fill="#14181f">Br</tspan></text>
  <text x="270.0" y="330.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">The H has been replaced by the Br</tspan></text>
  <text x="880.0" y="40.0" font-size="26" fill="#1b9e4b" text-anchor="middle" font-weight="700"><tspan dy="0.0">electrophilic addition</tspan></text>
  <path d="M680.0 146.0 L718.1 168.0 L718.1 212.0 L680.0 234.0 L641.9 212.0 L641.9 168.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
