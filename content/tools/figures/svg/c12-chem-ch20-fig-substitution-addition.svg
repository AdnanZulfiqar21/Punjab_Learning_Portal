  <text x="75.0" y="107.3" font-size="28" fill="#1aa3c9" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="140.0" y1="190.0" x2="277.2" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
