  <text x="215.0" y="176.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="400"><tspan dy="0.0">Br</tspan><tspan dy="7.8" font-size="18.7">2</tspan><tspan dy="-7.8"></tspan></text>
  <text x="215.0" y="224.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">FeBr</tspan><tspan dy="7.8" font-size="18.7">3</tspan><tspan dy="-7.8"></tspan></text>
  <path d="M360.0 146.0 L398.1 168.0 L398.1 212.0 L360.0 234.0 L321.9 212.0 L321.9 168.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
