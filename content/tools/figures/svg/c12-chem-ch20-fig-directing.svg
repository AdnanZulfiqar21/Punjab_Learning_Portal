<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="585" fill="#ffffff"/>
  <!-- Original diagram after the book's examples: methylbenzene with Cl2 and AlCl3 gives 2- and 4-chloromethylbenzene (CH3 is an ortho-para director); nitrobenzene gives 3-chloronitrobenzene (NO2 is a meta director). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Directing effects of substituents</text>
  <rect x="15.0" y="55.0" width="870.0" height="235.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ortho-para directors (activating): -R, -OH, -OR, -NR2, -SH, -SR</text>
  <path d="M90.0 145.0 L116.0 160.0 L116.0 190.0 L90.0 205.0 L64.0 190.0 L64.0 160.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="90.0" cy="175.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="90.0" y1="145.0" x2="90.0" y2="128.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="90.0" y="121.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="160.0" y="181.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ Cl</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="200.0" y1="175.0" x2="276.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M285.0 175.0 L275.0 179.6 L275.0 170.4 Z" fill="#14181f"/>
  <text x="242.5" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">AlCl</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="242.5" y="197.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">no UV light</tspan></text>
  <path d="M370.0 151.0 L396.0 166.0 L396.0 196.0 L370.0 211.0 L344.0 196.0 L344.0 166.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="370.0" cy="181.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="370.0" y1="151.0" x2="370.0" y2="134.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="370.0" y="127.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <line x1="396.0" y1="166.0" x2="410.3" y2="157.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="413.7" y="156.6" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="370.0" y="247.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">2-chloromethylbenzene</text>
  <text x="475.0" y="185.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <path d="M580.0 151.0 L606.0 166.0 L606.0 196.0 L580.0 211.0 L554.0 196.0 L554.0 166.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="580.0" cy="181.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="580.0" y1="151.0" x2="580.0" y2="134.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="580.0" y="127.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <line x1="580.0" y1="211.0" x2="580.0" y2="227.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="580.0" y="245.5" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="580.0" y="260.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">4-chloromethylbenzene</text>
  <text x="700.0" y="185.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HCl</tspan></text>
  <text x="800.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">CH3 pushes</text>
  <text x="800.0" y="152.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">electrons into</text>
  <text x="800.0" y="169.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the ring: 2 and 4</text>
  <text x="800.0" y="186.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">positions react</text>
  <rect x="15.0" y="300.0" width="870.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="330.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">meta directors (deactivating): -NO2, -CN, -CHO, -COR, -COOH</text>
  <path d="M90.0 390.0 L116.0 405.0 L116.0 435.0 L90.0 450.0 L64.0 435.0 L64.0 405.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="90.0" cy="420.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="90.0" y1="390.0" x2="90.0" y2="373.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="90.0" y="366.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="160.0" y="426.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ Cl</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <line x1="200.0" y1="420.0" x2="276.2" y2="420.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M285.0 420.0 L275.0 424.6 L275.0 415.4 Z" fill="#14181f"/>
  <text x="242.5" y="410.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">AlCl</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <path d="M370.0 396.0 L396.0 411.0 L396.0 441.0 L370.0 456.0 L344.0 441.0 L344.0 411.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="370.0" cy="426.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="370.0" y1="396.0" x2="370.0" y2="379.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="370.0" y="372.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <line x1="396.0" y1="441.0" x2="410.3" y2="449.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="413.7" y="460.9" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="370.0" y="500.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">3-chloronitrobenzene</text>
  <text x="480.0" y="430.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HCl</tspan></text>
  <text x="700.0" y="390.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">NO2 pulls electrons out of the ring;</text>
  <text x="700.0" y="408.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the ring reacts more slowly and</text>
  <text x="700.0" y="426.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the new group goes to position 3</text>
  <text x="450.0" y="556.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">electron-donating groups activate the ring; electron-withdrawing groups deactivate it</text>
  <text x="450.0" y="576" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
