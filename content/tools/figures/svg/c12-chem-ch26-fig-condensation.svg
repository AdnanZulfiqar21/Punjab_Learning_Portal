<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Figure 26.3: monomers H-X-H and HO-Y-OH join alternately, each new bond releasing a water molecule, to give H-X-Y-X-Y-OH and 3H2O. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Condensation polymerisation</text>
  <text x="110.0" y="116.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="700">H-</text>
  <rect x="112.0" y="92.0" width="36.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="130.0" y="116.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <text x="150.0" y="116.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">-H</text>
  <text x="260.0" y="116.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="700">HO-</text>
  <circle cx="284.0" cy="110.0" r="18.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="284.0" y="116.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <text x="304.0" y="116.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">-OH</text>
  <text x="560.0" y="116.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">two kinds of monomer, each with two reactive ends</text>
  <text x="70.0" y="206.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">H-</text>
  <rect x="96.0" y="182.0" width="36.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="114.0" y="206.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <rect x="136.0" y="184.0" width="72.0" height="32.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2" stroke-dasharray="4 3"/>
  <text x="172.0" y="206.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">H+HO</text>
  <circle cx="232.0" cy="200.0" r="18.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="232.0" y="206.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <rect x="254.0" y="184.0" width="72.0" height="32.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2" stroke-dasharray="4 3"/>
  <text x="290.0" y="206.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">OH+H</text>
  <rect x="332.0" y="182.0" width="36.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="350.0" y="206.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <rect x="372.0" y="184.0" width="72.0" height="32.0" rx="4" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2" stroke-dasharray="4 3"/>
  <text x="408.0" y="206.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">H+HO</text>
  <circle cx="468.0" cy="200.0" r="18.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="468.0" y="206.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <text x="490.0" y="206.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">-OH</text>
  <line x1="450.0" y1="235.0" x2="450.0" y2="273.8" stroke="#d98b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 285.0 L444.1 272.3 L455.9 272.3 Z" fill="#d98b2b"/>
  <text x="470.0" y="266.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">condensation: H and OH leave as water</text>
  <text x="260.0" y="336.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="700">H-</text>
  <rect x="262.0" y="312.0" width="36.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="280.0" y="336.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <circle cx="332.0" cy="330.0" r="18.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="332.0" y="336.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <line x1="298.0" y1="330.0" x2="314.0" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="366.0" y="312.0" width="36.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="384.0" y="336.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <line x1="350.0" y1="330.0" x2="366.0" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="436.0" cy="330.0" r="18.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="436.0" y="336.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <line x1="402.0" y1="330.0" x2="418.0" y2="330.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="456.0" y="336.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">-OH + 3H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O</tspan></text>
  <text x="450.0" y="400.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the small molecule lost may also be HCl, CH3OH or NH3</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
