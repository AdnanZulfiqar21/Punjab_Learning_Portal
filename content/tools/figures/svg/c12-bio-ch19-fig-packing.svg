  <!-- Original diagram after Figures 19.3 and 19.4: DNA (2 nm) wraps round histone octamers into a nucleosome string (11 nm), which coils into a chromatin fibre (30 nm), loops into a supercoil (300 nm) and condenses into a chromatid (700 nm). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">How DNA is packed into a chromosome</text>
