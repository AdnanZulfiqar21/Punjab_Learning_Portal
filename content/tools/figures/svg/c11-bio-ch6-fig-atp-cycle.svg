<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.1 and 5.2 of the Bioenergetics chapter: the ATP molecule and the ATP-ADP cycle. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .b{font-size:20px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .n{font-size:17px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="phos"><circle cx="0" cy="0" r="26" fill="#1f6fb5"/><text x="0" y="7" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">P</text></g>
  </defs>
  <text class="h" x="330" y="50">ATP: adenosine triphosphate</text>
  <rect x="60" y="150" width="130" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="125" y="187">adenine</text>
  <polygon points="250,150 300,120 350,150 335,205 265,205" fill="#fff4e2" stroke="#d98b2b" stroke-width="5" stroke-linejoin="round"/>
  <text class="n" x="300" y="175">ribose</text>
  <path d="M190 180 H250" stroke="#14181f" stroke-width="4"/>
  <use href="#phos" x="420" y="180"/><use href="#phos" x="510" y="180"/><use href="#phos" x="600" y="180"/>
  <path d="M350 180 H394" stroke="#14181f" stroke-width="4"/>
  <path d="M446 180 q19 -30 38 0 M536 180 q19 -30 38 0" stroke="#d7322f" stroke-width="5" fill="none"/>
  <text class="s" x="555" y="125" style="fill:#d7322f">high-energy bonds</text>
  <text class="s" x="330" y="400">three subunits: adenine (a nitrogen base),</text><text class="s" x="330" y="426">ribose (a five-carbon sugar) and three phosphates</text>
  <text class="s" x="330" y="470">discovered by Karl Lohmann (1929); Fritz Lipmann (1941)</text><text class="s" x="330" y="496">proposed it as the main energy-transfer molecule</text>
  <!-- cycle -->
  <text class="h" x="900" y="50">The ATP-ADP cycle</text>
  <rect x="800" y="130" width="200" height="70" rx="14" fill="#0f7a62"/><text class="b" x="900" y="173" style="font-size:26px">ATP</text>
  <rect x="800" y="520" width="200" height="70" rx="14" fill="#d98b2b"/><text class="b" x="900" y="563" style="font-size:26px">ADP + Pi</text>
  <path d="M1010 200 q120 160 0 320" fill="none" stroke="#4b5563" stroke-width="5" marker-end="url(#ar)"/>
  <path d="M790 520 q-120 -160 0 -320" fill="none" stroke="#4b5563" stroke-width="5" marker-end="url(#ar)"/>
  <text class="s" x="1090" y="330">breakdown of ATP</text><text class="s" x="1090" y="356">+ H2O; energy out</text><text class="s" x="1090" y="382">7.3 kcal per mole</text>
  <text class="s" x="700" y="560">formation of ATP:</text><text class="s" x="700" y="586">energy from the</text><text class="s" x="700" y="612">oxidation of food</text>
  <text class="s" x="900" y="640">ATP + H2O gives ADP + Pi + energy;</text><text class="s" x="900" y="666">ADP + H2O gives AMP + Pi + energy</text>
  <text class="s" x="600" y="705">ATP is made in energy-releasing processes and broken in energy-consuming ones: it transfers energy between reactions.</text>
</svg>
