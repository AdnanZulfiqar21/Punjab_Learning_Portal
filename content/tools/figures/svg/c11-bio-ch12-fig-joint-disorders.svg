<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.14 to 12.18: the three types of arthritis, osteoporosis, dislocation, sprain and first aid. Schematic. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <defs>
    <g id="joint">
      <path d="M0 0 h100 q10 50 -50 55 q-60 -5 -50 -55 z" fill="#fff4e2" stroke="#c9b27a" stroke-width="3"/>
      <path d="M0 130 h100 q10 -50 -50 -55 q-60 5 -50 55 z" fill="#fff4e2" stroke="#c9b27a" stroke-width="3"/>
    </g>
  </defs>
  <!-- osteoarthritis -->
  <text class="h" x="160" y="40">Osteoarthritis</text>
  <use href="#joint" x="110" y="60"/>
  <path d="M120 115 q40 10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5" stroke-dasharray="8 6"/><path d="M120 135 q40 -10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5" stroke-dasharray="8 6"/>
  <text class="s" x="160" y="220">the most common type: the articular</text><text class="s" x="160" y="240">cartilage softens and breaks down;</text><text class="s" x="160" y="260">knee, hip and intervertebral joints</text>
  <!-- rheumatoid -->
  <text class="h" x="450" y="40">Rheumatoid arthritis</text>
  <use href="#joint" x="400" y="60"/>
  <path d="M410 115 q40 10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5"/><path d="M410 135 q40 -10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5"/>
  <rect x="395" y="108" width="110" height="34" rx="12" fill="#d7322f" opacity="0.45"/>
  <text class="s" x="450" y="220">an autoimmune disorder inflames</text><text class="s" x="450" y="240">the synovial membrane; mostly</text><text class="s" x="450" y="260">the wrist and hands</text>
  <!-- gout -->
  <text class="h" x="740" y="40">Gouty arthritis (gout)</text>
  <use href="#joint" x="690" y="60"/>
  <path d="M700 115 q40 10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5"/><path d="M700 135 q40 -10 80 0" fill="none" stroke="#1f6fb5" stroke-width="5"/>
  <g fill="#f2b134" stroke="#8a4b00" stroke-width="1"><path d="M715 122 l6 -8 l6 8 l-6 8 z M735 128 l6 -8 l6 8 l-6 8 z M755 120 l6 -8 l6 8 l-6 8 z"/></g>
  <text class="s" x="740" y="220">uric acid builds up in the blood and</text><text class="s" x="740" y="240">crystallises in the joint: usually the</text><text class="s" x="740" y="260">big toe; also knees, wrists, fingers</text>
  <!-- osteoporosis -->
  <text class="h" x="1030" y="40">Osteoporosis</text>
  <rect x="950" y="70" width="70" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="3"/>
  <g stroke="#c9b27a" stroke-width="4" fill="none"><path d="M960 90 h50 M960 115 h50 M960 140 h50 M960 165 h50 M975 80 v100 M995 80 v100"/></g>
  <rect x="1040" y="70" width="70" height="120" rx="8" fill="#fff4e2" stroke="#c9b27a" stroke-width="3"/>
  <g stroke="#c9b27a" stroke-width="2" fill="none"><path d="M1050 95 h20 M1085 120 h20 M1055 150 h25 M1065 80 v30 M1095 140 v35"/></g>
  <text class="s" x="985" y="212" style="font-size:13px">normal</text><text class="s" x="1075" y="212" style="font-size:13px">porous</text>
  <text class="s" x="1030" y="240">bone density falls and bones become</text><text class="s" x="1030" y="260">fragile: ageing, low oestrogen after</text><text class="s" x="1030" y="280">menopause, little calcium or vitamin D,</text><text class="s" x="1030" y="300">no weight-bearing exercise, long</text><text class="s" x="1030" y="320">corticosteroid use, smoking, alcohol</text>
  <!-- dislocation and sprain -->
  <text class="h" x="230" y="370">Dislocation</text>
  <use href="#joint" x="110" y="390" transform="translate(70,0)"/>
  <path d="M180 520 h100 q10 -50 -50 -55 q-60 5 -50 55 z" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
  <path d="M215 520 h100 q10 -50 -50 -55 q-60 5 -50 55 z" fill="#fff4e2" stroke="#d7322f" stroke-width="3"/>
  <text class="s" x="230" y="560">bones forced out of position by a</text><text class="s" x="230" y="580">sudden impact (or by rheumatoid</text><text class="s" x="230" y="600">arthritis); muscles, ligaments and</text><text class="s" x="230" y="620">tendons may tear; swelling, intense</text><text class="s" x="230" y="640">pain, immobility; corrected by a</text><text class="s" x="230" y="660">physiotherapist, sometimes surgery</text>
  <text class="h" x="600" y="370">Sprain</text>
  <use href="#joint" x="550" y="390"/>
  <path d="M548 420 q-25 45 0 90" fill="none" stroke="#8a4b00" stroke-width="5" stroke-dasharray="6 5"/><path d="M652 420 q25 45 0 90" fill="none" stroke="#8a4b00" stroke-width="5"/>
  <text class="s" x="600" y="560">a ligament stretched or torn when the</text><text class="s" x="600" y="580">joint is forced beyond its range;</text><text class="s" x="600" y="600">ankle, knee and wrist; the foot turned</text><text class="s" x="600" y="620">inward tears the outer ligament,</text><text class="s" x="600" y="640">outward the inner; physical therapy</text><text class="s" x="600" y="660">and a dressing for support</text>
  <rect x="800" y="380" width="340" height="280" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="970" y="410">First aid for dislocation or sprain</text>
  <text class="s" x="970" y="440">1. immobilise: do not try to realign;</text><text class="s" x="970" y="460">support with a sling or splint</text>
  <text class="s" x="970" y="490">2. apply ice or a cold compress</text><text class="s" x="970" y="510">to reduce swelling and pain</text>
  <text class="s" x="970" y="540">3. elevate the limb above the</text><text class="s" x="970" y="560">body if possible</text>
  <text class="s" x="970" y="590">4. seek medical attention: call</text><text class="s" x="970" y="610">emergency services 1122 or go</text><text class="s" x="970" y="630">to hospital</text>
  <text class="s" x="600" y="690">Cream: bone. Blue: articular cartilage. Red tint: inflamed synovial membrane. Yellow: uric acid crystals. Brown: ligaments (dashed = torn).</text>
</svg>
