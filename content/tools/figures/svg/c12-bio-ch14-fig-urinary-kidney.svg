<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="655" fill="#ffffff"/>
  <!-- Original diagram after topics 14.1 and 14.1.1: the kidneys, ureters, bladder and urethra in front view with the main vessels, and a kidney in section showing capsule, cortex, medulla with pyramids, pelvis, hilum and ureter. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">The human urinary system and the inside of a kidney</text>
  <rect x="50" y="55" width="540" height="580" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Organs of the urinary system (14.1)</text>
  <rect x="305" y="110" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="132" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="154" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="176" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="198" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="220" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="242" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="264" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="286" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="308" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="330" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="352" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="374" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="396" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="305" y="418" width="30" height="18" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
  <path d="M288 110 V420" fill="none" stroke="#1f6fb5" stroke-width="8" stroke-linecap="round"/>
  <path d="M352 110 V420" fill="none" stroke="#d7322f" stroke-width="7" stroke-linecap="round"/>
  <text class="r" x="282" y="104" style="fill:#1f6fb5;text-anchor:end">inferior vena cava</text>
  <text class="r" x="358" y="104" style="fill:#d7322f">aorta</text>
  <path d="M190 155 C130 155 130 315 190 315 C240 315 240 263 215 235 C240 207 240 155 190 155 Z" fill="#f2c4a8" stroke="#8a4b2f" stroke-width="2.5"/>
  <path d="M450 135 C510 135 510 295 450 295 C400 295 400 243 425 215 C400 187 400 135 450 135 Z" fill="#f2c4a8" stroke="#8a4b2f" stroke-width="2.5"/>
  <path d="M165 157 L215 157 L193 127 Z" fill="#f6d58e" stroke="#d98b2b" stroke-width="2"/>
  <path d="M425 137 L475 137 L447 107 Z" fill="#f6d58e" stroke="#d98b2b" stroke-width="2"/>
  <path d="M352 205 H426" fill="none" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M352 226 H216" fill="none" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M426 222 H288" fill="none" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M216 244 H288" fill="none" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 250 C240 320 262 390 300 452" fill="none" stroke="#d98b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 230 C400 320 380 390 340 452" fill="none" stroke="#d98b2b" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="320" cy="478" rx="58" ry="38" fill="#fff1c9" stroke="#d98b2b" stroke-width="2.5"/>
  <path d="M320 516 V575" fill="none" stroke="#d98b2b" stroke-width="5" stroke-linecap="round"/>
  <text class="l" x="65" y="225">right kidney</text>
  <text class="r" x="65" y="241">(a little lower</text>
  <text class="r" x="65" y="256">and smaller)</text>
  <text class="l" x="500" y="205">left kidney</text>
  <text class="r" x="482" y="118">adrenal gland</text>
  <path d="M480 114 L462 122" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="100" y="372">ureter (about 25 cm)</text>
  <path d="M212 368 L252 372" stroke="#6b7280" stroke-width="1"/>
  <text class="l" x="386" y="482">urinary bladder</text>
  <text class="r" x="386" y="498">(pelvic cavity)</text>
  <text class="r" x="332" y="560">urethra</text>
  <text class="r" x="65" y="300" style="fill:#d7322f">renal artery</text>
  <text class="r" x="65" y="314" style="fill:#1f6fb5">renal vein</text>
  <g class="r">
    <text x="65" y="600">front view: the body's right side is on the left of the picture;</text>
    <text x="65" y="616">kidneys lie between the 12th thoracic and 3rd lumbar vertebrae</text>
  </g>
  <rect x="610" y="55" width="540" height="580" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Inside the kidney (14.1.1)</text>
  <path d="M728 158 L800 158 L770 116 Z" fill="#f6d58e" stroke="#d98b2b" stroke-width="2"/>
  <path d="M760 155 C595 155 595 545 760 545 C895 545 895 418 828 350 C895 282 895 155 760 155 Z" fill="#f2c4a8" stroke="#5b2a17" stroke-width="3.5"/>
  <path d="M801 203 L748 232 L816 295 Z" fill="#c9765a" stroke="#8a4b2f" stroke-width="1.5"/>
  <path d="M732 247 L701 298 L792 318 Z" fill="#c9765a" stroke="#8a4b2f" stroke-width="1.5"/>
  <path d="M695 320 L695 380 L783 350 Z" fill="#c9765a" stroke="#8a4b2f" stroke-width="1.5"/>
  <path d="M701 402 L732 453 L792 382 Z" fill="#c9765a" stroke="#8a4b2f" stroke-width="1.5"/>
  <path d="M748 468 L801 497 L816 405 Z" fill="#c9765a" stroke="#8a4b2f" stroke-width="1.5"/>
  <path d="M814 292 Q835 350 788 316 Q835 350 779 350 Q835 350 788 384 Q835 350 814 408 L863 390 L863 310 Z" fill="#fff1c9" stroke="#d98b2b" stroke-width="2"/>
  <path d="M855 380 C905 410 915 490 905 585" fill="none" stroke="#d98b2b" stroke-width="9" stroke-linecap="round"/>
  <path d="M835 298 L850 298 H950" fill="none" stroke="#d7322f" stroke-width="6" stroke-linecap="round"/>
  <path d="M850 318 H950" fill="none" stroke="#1f6fb5" stroke-width="7" stroke-linecap="round"/>
  <text class="r" x="958" y="302" style="fill:#d7322f">renal artery (in)</text>
  <text class="r" x="958" y="322" style="fill:#1f6fb5">renal vein (out)</text>
  <text class="r" x="958" y="128">adrenal gland</text>
  <path d="M955 124 L790 132" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="168">renal capsule (fibrous cover)</text>
  <path d="M955 164 L800 158" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="208">renal cortex: about a third</text>
  <text class="r" x="958" y="222">of the kidney's mass</text>
  <path d="M955 204 L845 240" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="252">renal medulla: about two thirds</text>
  <path d="M955 248 L735 345" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="372">renal pyramid (cone-shaped)</text>
  <path d="M955 368 L741 412" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="412">renal pelvis (funnel)</text>
  <path d="M955 408 L850 385" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="958" y="452">renal hilum: vessels and</text>
  <text class="r" x="958" y="466">ureter pass here</text>
  <path d="M955 448 L870 400" stroke="#6b7280" stroke-width="1"/>
  <text class="r" x="920" y="580" style="fill:#d98b2b">ureter: urine to the bladder</text>
  <text class="s" x="600" y="647" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
