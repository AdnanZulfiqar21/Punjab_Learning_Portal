<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Tables 13.1 to 13.4 and Figure 13.1: properties, volatility, bond energies and oxidising power of the halogens. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">The halogens: colour, volatility, bond strength and oxidising power down group 17</text>
  <!-- table -->
  <rect x="50" y="55" width="620" height="250" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="360" y="83">Atomic and physical properties (Table 13.1)</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="108">Property</text><text x="290" y="108">F</text><text x="375" y="108">Cl</text><text x="455" y="108">Br</text><text x="575" y="108">I</text></g>
    <text x="70" y="130">proton number</text><text x="290" y="130">9</text><text x="375" y="130">17</text><text x="455" y="130">35</text><text x="575" y="130">53</text>
    <text x="70" y="150">outer shell</text><text x="290" y="150">2s2 2p5</text><text x="375" y="150">3s2 3p5</text><text x="455" y="150">4s2 4p5</text><text x="575" y="150">5s2 5p5</text>
    <text x="70" y="170">relative atomic mass</text><text x="290" y="170">19.0</text><text x="375" y="170">35.5</text><text x="455" y="170">79.9</text><text x="575" y="170">126.9</text>
    <text x="70" y="190">state at 20 C; colour</text><text x="290" y="190">gas; yellow</text><text x="375" y="190">gas; green</text><text x="455" y="190">liquid; red-brown</text><text x="575" y="190">solid; grey</text>
    <text x="70" y="210">m.p. / b.p. (C)</text><text x="290" y="210">-220 / -188</text><text x="375" y="210">-101 / -35</text><text x="455" y="210">-7 / 59</text><text x="575" y="210">113 / 183</text>
    <text x="70" y="230">dH vaporisation (kJ/mol)</text><text x="290" y="230">+3.3</text><text x="375" y="230">+10.2</text><text x="455" y="230">+15</text><text x="575" y="230">+30</text>
    <text x="70" y="250">solubility (g/100 g water)</text><text x="290" y="250">reacts</text><text x="375" y="250">0.59</text><text x="455" y="250">3.6</text><text x="575" y="250">0.018</text>
  </g>
  <path d="M60 116 H660" stroke="#9ca3af" stroke-width="1"/>
  <text class="s" x="360" y="276" style="font-size:12px">diatomic X2 in all phases; colours darken from chlorine to iodine</text><text class="s" x="360" y="292" style="font-size:12px">(light absorption by electron transitions); iodine sublimes to a violet vapour</text>
  <!-- volatility -->
  <rect x="690" y="55" width="460" height="250" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="920" y="83">Volatility (13.1, 13.2, Table 13.2)</text>
  <g class="t" style="font-size:12px">
    <text x="710" y="110">halogens are non-polar: only instantaneous dipole-induced</text>
    <text x="710" y="126">dipole (London) forces hold the molecules together</text>
    <text x="710" y="150">larger, more polarisable molecule: stronger forces, higher</text>
    <text x="710" y="166">boiling point, lower volatility (volatility is inverse to b.p.)</text>
  </g>
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="760" y="196">Size</text><text x="840" y="196">Polarisability</text><text x="930" y="196">id-id forces</text><text x="1015" y="196">B.p.</text><text x="1090" y="196">Volatility</text></g>
    <text x="760" y="216">small</text><text x="840" y="216">small</text><text x="930" y="216">weak</text><text x="1015" y="216">lower</text><text x="1090" y="216">higher</text>
    <text x="760" y="234">large</text><text x="840" y="234">high</text><text x="930" y="234">strong</text><text x="1015" y="234">higher</text><text x="1090" y="234">lower</text>
  </g>
  <path d="M720 204 H1130" stroke="#9ca3af" stroke-width="1"/>
  <text class="s" x="920" y="262" style="font-size:12px">F2, Cl2 gases (weak forces); Br2 liquid; I2 solid (strongest forces)</text>
  <text class="s" x="920" y="282" style="font-size:12px">volatility: Cl2 greater than Br2 greater than I2 (print calls chlorine a liquid)</text>
  <!-- bond energies -->
  <rect x="50" y="325" width="540" height="310" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="353">Bond energy of X2 (13.3, Table 13.3)</text>
  <path d="M110 560 V380 M110 560 H420" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="140" y="449" width="40" height="111" fill="#d98b2b" opacity="0.85"/>
    <rect x="210" y="387" width="40" height="173" fill="#0f7a62" opacity="0.85"/>
    <rect x="280" y="423" width="40" height="137" fill="#b5600f" opacity="0.85"/>
    <rect x="350" y="453" width="40" height="107" fill="#5b3fb5" opacity="0.85"/>
  </g>
  <g class="r" style="font-weight:700;fill:#14181f"><text x="160" y="442">156</text><text x="230" y="380">243</text><text x="300" y="416">193</text><text x="370" y="446">151</text></g>
  <g class="r"><text x="160" y="576">F2</text><text x="230" y="576">Cl2</text><text x="300" y="576">Br2</text><text x="370" y="576">I2</text></g>
  <text class="r" x="90" y="470" transform="rotate(-90 90 470)">bond energy, kJ mol-1</text>
  <g class="t" style="font-size:12px">
    <text x="430" y="400">bonds weaken from Cl2 to I2:</text>
    <text x="430" y="416">larger atoms, longer bonds</text>
    <text x="430" y="440">F2 is the exception: tiny atoms</text>
    <text x="430" y="456">bring the lone pairs so close that</text>
    <text x="430" y="472">repulsion weakens the bond</text>
    <text x="430" y="496">H-X bonds (Table 13.5): HF 569,</text>
    <text x="430" y="512">HCl 431, HBr 366, HI 299 kJ/mol</text>
    <text x="430" y="528">so thermal stability HF greater</text>
    <text x="430" y="544">than HCl than HBr than HI</text>
  </g>
  <text class="s" x="320" y="612" style="font-size:12px">'halogen' = salt-former (Greek halos, gen); At and Ts are rare and radioactive</text>
  <!-- oxidising power -->
  <rect x="610" y="325" width="540" height="310" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="353">Oxidising power (13.4, Table 13.4): F2 &gt; Cl2 &gt; Br2 &gt; I2</text>
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="680" y="384">X2</text><text x="780" y="384">E (X2/X-), V</text><text x="960" y="384">displaces from solution</text></g>
    <text x="680" y="406">F2</text><text x="780" y="406">+2.87</text><text x="960" y="406">Cl-, Br-, I-</text>
    <text x="680" y="426">Cl2</text><text x="780" y="426">+1.36</text><text x="960" y="426">Br-, I-</text>
    <text x="680" y="446">Br2</text><text x="780" y="446">+1.07</text><text x="960" y="446">I-</text>
    <text x="680" y="466">I2</text><text x="780" y="466">+0.54</text><text x="960" y="466">none</text>
  </g>
  <path d="M640 392 H1120" stroke="#9ca3af" stroke-width="1"/>
  <g class="f">
    <text x="630" y="498">2Na + Cl2 --> 2NaCl</text><text x="880" y="498">F2 + 2Cl- --> 2F- + Cl2</text>
    <text x="630" y="518">Cl2 + 2Br- --> 2Cl- + Br2</text><text x="880" y="518">Br2 + 2I- --> 2Br- + I2</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="630" y="546">halogens gain electrons to form halide ions; the more positive E,</text>
    <text x="630" y="562">the stronger the oxidising agent; power depends on dissociation</text>
    <text x="630" y="578">energy (low), electron affinity (high), hydration energy of X- (high)</text>
    <text x="630" y="594">and, for Br2 and I2, the heat of vaporisation</text>
    <text x="630" y="616">halide ions as reducing agents run the other way: I- strongest, F- weakest (13.7)</text>
  </g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
