  <text x="410.0" y="400.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">urea solution sprayed in;</text>
  <text x="410.0" y="418.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">it gives NH3</text>
  <line x1="280.0" y1="240.0" x2="280.0" y2="300.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="280.0" y="318.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">oxidation catalyst:</text>
  <text x="280.0" y="336.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">CO, HC -&gt; CO2 + H2O</text>
  <line x1="580.0" y1="240.0" x2="580.0" y2="300.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="580.0" y="318.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">SCR catalyst (TiO2, zeolite):</text>
  <text x="580.0" y="336.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">NOx + NH3 -&gt; N2 + H2O</text>
  <line x1="725.0" y1="160.0" x2="725.0" y2="110.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="725.0" y="82.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">NH3 oxidation catalyst:</text>
  <text x="725.0" y="100.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">removes leftover NH3</text>
  <text x="892.0" y="280.0" font-size="13" fill="#0f7a62" text-anchor="end" font-weight="700">N2, H2O, CO2</text>
