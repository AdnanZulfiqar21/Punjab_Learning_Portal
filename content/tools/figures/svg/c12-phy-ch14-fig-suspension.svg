<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original schematic after Fig 14.16: a car body joined to a wheel by a coil spring and a shock absorber (a piston moving in oil), which damps the oscillation after a bump. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Suspension of a vehicle: spring and shock absorber (after Fig 14.16)</text>
  <rect x="70.0" y="70.0" width="380.0" height="60.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#e5e7eb"/>
  <text x="260.0" y="108.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">car body</text>
  <path d="M200.0 130.0 L226.0 141.1 L174.0 152.2 L226.0 163.3 L174.0 174.4 L226.0 185.6 L174.0 196.7 L226.0 207.8 L174.0 218.9 L226.0 230.0 L174.0 241.1 L226.0 252.2 L174.0 263.3 L226.0 274.4 L174.0 285.6 L226.0 296.7 L174.0 307.8 L226.0 318.9 L200.0 330.0" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="296.0" y="150.0" width="44.0" height="120.0" rx="6" stroke="#d98b2b" stroke-width="2.4" fill="#fff1dc"/>
  <line x1="318.0" y1="130.0" x2="318.0" y2="210.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <rect x="300.0" y="205.0" width="36.0" height="10.0" rx="2" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <line x1="304.0" y1="230.0" x2="332.0" y2="230.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="304.0" y1="245.0" x2="332.0" y2="245.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="304.0" y1="260.0" x2="332.0" y2="260.0" stroke="#d98b2b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="318.0" y1="270.0" x2="318.0" y2="330.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <rect x="150.0" y="330.0" width="220.0" height="18.0" rx="6" stroke="#4b5563" stroke-width="2" fill="#d1d5db"/>
  <circle cx="260.0" cy="410.0" r="62.0" stroke="#14181f" stroke-width="3" fill="#4b5563"/>
  <circle cx="260.0" cy="410.0" r="26.0" stroke="#4b5563" stroke-width="2" fill="#e5e7eb"/>
  <path d="M40 478 Q100 458 160 478 T280 478 T400 478 T480 478" stroke="#7fb069" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="60.0" y="505.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">bumpy road</text>
  <line x1="178.0" y1="230.0" x2="120.0" y2="230.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="30.0" y="236.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">coil spring</text>
  <line x1="342.0" y1="230.0" x2="400.0" y2="230.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="404.0" y="236.0" font-size="14" fill="#d98b2b" text-anchor="start" font-weight="700">shock absorber</text>
  <rect x="560.0" y="70.0" width="325.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="722.5" y="100.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">how it works</text>
  <text x="578.0" y="120.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">The spring lets the wheel move over</text>
  <text x="578.0" y="142.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">bumps and stores the energy.</text>
  <text x="578.0" y="164.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="578.0" y="186.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">The shock absorber is a piston in</text>
  <text x="578.0" y="208.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">oil: moving it does work against</text>
  <text x="578.0" y="230.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">the oil, so the oscillation dies</text>
  <text x="578.0" y="252.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">away quickly (damping).</text>
  <text x="578.0" y="274.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="578.0" y="296.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Near-critical damping returns the car</text>
  <text x="578.0" y="318.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">to rest without bouncing.</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
