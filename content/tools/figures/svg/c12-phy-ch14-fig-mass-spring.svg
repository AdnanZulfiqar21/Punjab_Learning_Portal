<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.2: a mass on a spring on a smooth surface at rest at O, pulled to A where the restoring force F = -kx acts towards O, and overshooting to B where the spring is compressed; a = -(k/m)x, w = sqrt(k/m) and T = 2 pi sqrt(m/k). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A mass on a spring (after Fig 14.2)</text>
  <rect x="40.0" y="80.0" width="18.0" height="260.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="#9ca3af"/>
  <line x1="58.0" y1="352.0" x2="860.0" y2="352.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M58.0 125.0 L74.5 136.0 L91.0 114.0 L107.5 136.0 L124.0 114.0 L140.5 136.0 L157.0 114.0 L173.5 136.0 L190.0 114.0 L206.5 136.0 L223.0 114.0 L239.5 136.0 L256.0 114.0 L272.5 136.0 L289.0 114.0 L305.5 136.0 L322.0 114.0 L338.5 136.0 L355.0 114.0 L371.5 136.0 L388.0 114.0 L404.5 136.0 L421.0 114.0 L437.5 136.0 L454.0 114.0 L470.5 136.0 L487.0 114.0 L503.5 136.0 L520.0 125.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="520.0" y="101.0" width="64.0" height="48.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="552.0" y="131.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">m</text>
  <text x="80.0" y="95.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">at rest at the mean position O</text>
  <path d="M58.0 215.0 L78.8 226.0 L99.6 204.0 L120.4 226.0 L141.1 204.0 L161.9 226.0 L182.7 204.0 L203.5 226.0 L224.3 204.0 L245.1 226.0 L265.9 204.0 L286.6 226.0 L307.4 204.0 L328.2 226.0 L349.0 204.0 L369.8 226.0 L390.6 204.0 L411.4 226.0 L432.1 204.0 L452.9 226.0 L473.7 204.0 L494.5 226.0 L515.3 204.0 L536.1 226.0 L556.9 204.0 L577.6 226.0 L598.4 204.0 L619.2 226.0 L640.0 215.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="640.0" y="191.0" width="64.0" height="48.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="672.0" y="221.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">m</text>
  <text x="80.0" y="185.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">pulled to A: the spring pulls back, F = -kx</text>
  <line x1="672.0" y1="247.0" x2="587.2" y2="247.0" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M580.0 247.0 L588.2 243.2 L588.2 250.8 Z" fill="#d7322f"/>
  <text x="570.0" y="252.0" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700">F</text>
  <path d="M58.0 305.0 L75.1 316.0 L92.2 294.0 L109.3 316.0 L126.4 294.0 L143.5 316.0 L160.6 294.0 L177.7 316.0 L194.8 294.0 L211.9 316.0 L229.0 294.0 L246.1 316.0 L263.2 294.0 L280.3 316.0 L297.4 294.0 L314.5 316.0 L331.6 294.0 L348.7 316.0 L365.8 294.0 L382.9 316.0 L400.0 305.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="400.0" y="281.0" width="64.0" height="48.0" rx="4" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="432.0" y="311.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">m</text>
  <text x="80.0" y="275.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">released: it overshoots to B and the spring pushes back</text>
  <line x1="432.0" y1="337.0" x2="512.8" y2="337.0" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M520.0 337.0 L511.8 340.8 L511.8 333.2 Z" fill="#d7322f"/>
  <text x="530.0" y="342.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700">F</text>
  <line x1="552.0" y1="70.0" x2="552.0" y2="345.0" stroke="#1f6fb5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="552.0" y="372.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">O</text>
  <line x1="558.4" y1="180.0" x2="665.6" y2="180.0" stroke="#1f6fb5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M672.0 180.0 L664.7 183.4 L664.7 176.6 Z" fill="#1f6fb5"/>
  <path d="M552.0 180.0 L559.3 176.6 L559.3 183.4 Z" fill="#1f6fb5"/>
  <text x="612.0" y="198.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">x</text>
  <text x="450.0" y="412.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">F = -kx  and  F = ma   so   a = -(k/m) x = -w</tspan><tspan dy="-7.6" font-size="12.6">2</tspan><tspan dy="7.6"> x</tspan></text>
  <text x="450.0" y="447.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">w = sqrt(k/m)      f = (1/2 pi) sqrt(k/m)      T = 2 pi sqrt(m/k)</tspan></text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
