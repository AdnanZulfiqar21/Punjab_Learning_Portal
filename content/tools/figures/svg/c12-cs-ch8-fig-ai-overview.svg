<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: data, algorithms and computing power feed an AI model that sees, understands language and decides; benefits and challenges. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Artificial intelligence: how it works, benefits and challenges (after Fig 8.2)</text>
  <rect x="30.0" y="87.0" width="160.0" height="46.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="110.0" y="114.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">data</text>
  <line x1="192.0" y1="110.0" x2="263.3" y2="175.7" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M268.0 180.0 L260.4 177.6 L265.0 172.6 Z" fill="#14181f"/>
  <rect x="30.0" y="157.0" width="160.0" height="46.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="110.0" y="184.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">algorithms</text>
  <line x1="192.0" y1="180.0" x2="261.6" y2="180.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M268.0 180.0 L260.7 183.4 L260.7 176.6 Z" fill="#14181f"/>
  <rect x="30.0" y="227.0" width="160.0" height="46.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="110.0" y="254.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">computing power</text>
  <line x1="192.0" y1="250.0" x2="263.3" y2="184.3" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M268.0 180.0 L265.0 187.4 L260.4 182.4 Z" fill="#14181f"/>
  <rect x="275.0" y="150.0" width="130.0" height="60.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="340.0" y="178.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">AI model</text>
  <text x="340.0" y="194.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">machine learning</text>
  <line x1="408.0" y1="180.0" x2="463.8" y2="114.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M468.0 110.0 L465.8 117.7 L460.7 113.3 Z" fill="#14181f"/>
  <rect x="470.0" y="87.0" width="240.0" height="46.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="590.0" y="114.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">vision: images, faces</text>
  <line x1="408.0" y1="180.0" x2="461.6" y2="180.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M468.0 180.0 L460.7 183.4 L460.7 176.6 Z" fill="#14181f"/>
  <rect x="470.0" y="157.0" width="240.0" height="46.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="590.0" y="184.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">speech and language (NLP)</text>
  <line x1="408.0" y1="180.0" x2="463.8" y2="245.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M468.0 250.0 L460.7 246.7 L465.8 242.3 Z" fill="#14181f"/>
  <rect x="470.0" y="227.0" width="240.0" height="46.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="590.0" y="254.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">decisions and predictions</text>
  <rect x="40.0" y="300.0" width="400.0" height="140.0" rx="10" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="240.0" y="325.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">benefits</text>
  <text x="60.0" y="352.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">faster repetitive work; diagnosis support</text>
  <text x="60.0" y="371.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(e.g. predicting eye disease from scans);</text>
  <text x="60.0" y="390.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">chatbots for many customers at once;</text>
  <text x="60.0" y="409.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">personalised learning; crop monitoring</text>
  <rect x="460.0" y="300.0" width="400.0" height="140.0" rx="10" stroke="#d7322f" stroke-width="1.5" fill="#fde2e1"/>
  <text x="660.0" y="325.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">challenges</text>
  <text x="480.0" y="352.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">data privacy</text>
  <text x="480.0" y="371.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">job displacement</text>
  <text x="480.0" y="390.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">bias leading to unfair outcomes</text>
  <text x="480.0" y="409.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">decisions that affect people's lives</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
