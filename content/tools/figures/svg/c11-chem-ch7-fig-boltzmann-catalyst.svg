<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 7.6 to 7.8: the Boltzmann distribution at two temperatures with the activation energy, and the energy path of a catalysed and an uncatalysed reaction. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Temperature and catalysts: who can get over the activation energy barrier</text>
  <!-- Boltzmann -->
  <text class="k" x="320" y="70">Boltzmann distribution at T1 and T2 (Figures 7.6 and 7.7)</text>
  <path d="M80 420 V90 M80 420 H560" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="40" y="255" transform="rotate(-90 40 255)" text-anchor="middle">number of molecules</text>
  <text class="s" x="320" y="445">molecular energy</text>
  <!-- shaded areas beyond Ea -->
  <path d="M380 420 L380 340 C 420 345, 470 390, 540 418 Z" fill="#dbe9f5"/>
  <path d="M380 420 L380 300 C 430 310, 480 375, 540 416 Z" fill="#f6d5cf" opacity="0.7"/>
  <path d="M80 420 C 120 120, 220 110, 300 250 C 340 320, 420 390, 540 418" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M80 420 C 140 200, 260 150, 340 270 C 380 330, 450 390, 540 416" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M380 420 V110" stroke="#14181f" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t" x="386" y="125" style="font-weight:700;fill:#14181f">Ea</text>
  <text class="t" x="140" y="150" style="fill:#1f6fb5;font-weight:700">T1 (lower)</text>
  <text class="t" x="290" y="330" style="fill:#d7322f;font-weight:700">T2 (higher)</text>
  <g class="t">
    <text x="60" y="480">area under a curve = total number of molecules; the shaded area beyond Ea = those able to react</text>
    <text x="60" y="500">at the higher temperature the curve flattens and its peak moves right, so the shaded area grows:</text>
    <text x="60" y="520">a 10 degree C rise roughly doubles (or triples) the rate; molecules also collide more often</text>
    <text x="60" y="548">concentration, surface area and pressure (for gases) raise the rate by raising collision frequency;</text>
    <text x="60" y="566">only collisions with at least Ea and the right orientation are effective (collision theory)</text>
  </g>
  <!-- catalyst energy path -->
  <text class="k" x="880" y="70">Energy path with and without a catalyst (Figure 7.8)</text>
  <path d="M660 420 V90 M660 420 H1140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="620" y="255" transform="rotate(-90 620 255)" text-anchor="middle">potential energy</text>
  <text class="s" x="900" y="445">path of reaction</text>
  <path d="M690 250 H760 Q850 100 900 150 Q950 200 1010 330 H1100" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M690 250 H760 Q850 180 900 215 Q950 250 1010 330" fill="none" stroke="#0f7a62" stroke-width="3"/>
  <path d="M690 250 H760" stroke="#14181f" stroke-width="3"/><path d="M1010 330 H1100" stroke="#14181f" stroke-width="3"/>
  <text class="t" x="690" y="240">reactants</text><text class="t" x="1020" y="355">products</text>
  <text class="t" x="905" y="130" style="fill:#d7322f">uncatalysed: higher Ea</text>
  <text class="t" x="1005" y="232" style="fill:#0f7a62">catalysed: lower Ea</text>
  <text class="t" x="770" y="300">activated complex at the peak</text>
  <g class="t">
    <text x="640" y="480">a catalyst alters the rate but is chemically unchanged at the end; it provides a new</text>
    <text x="640" y="500">path with a lower activation energy, so more molecules can cross; delta H is unchanged</text>
    <text x="640" y="528">homogeneous: same phase (NO in the contact process; H2SO4 in ester hydrolysis)</text>
    <text x="640" y="546">heterogeneous: different phases (Pt gauze oxidising NH3; Ni hydrogenating C2H4)</text>
    <text x="640" y="574">enzymes are nature's protein catalysts; vitamins act as coenzymes</text>
  </g>
  <text class="s" x="600" y="620">Curves are schematic, after Figures 7.6 to 7.8.</text>
</svg>
