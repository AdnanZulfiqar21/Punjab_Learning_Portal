<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original: a browser asks a DNS server for an IP address, then contacts the web server. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">DNS name resolution (after Fig 1.14)</text>
  <rect x="68.0" y="143.0" width="54.0" height="38.0" rx="4" stroke="#14181f" stroke-width="2" fill="#dbe9f5"/>
  <rect x="73.0" y="148.0" width="44.0" height="28.0" rx="2" stroke="#1f6fb5" stroke-width="1.2" fill="#ffffff"/>
  <line x1="95.0" y1="181.0" x2="95.0" y2="191.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="81.0" y1="192.0" x2="109.0" y2="192.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="95.0" y="211.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">your browser</text>
  <text x="95.0" y="112.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">www.example.com</text>
  <rect x="428.0" y="140.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="463.0" cy="149.0" r="2.5" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <rect x="428.0" y="160.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="463.0" cy="169.0" r="2.5" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <rect x="428.0" y="180.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="463.0" cy="189.0" r="2.5" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="450.0" y="216.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">DNS server</text>
  <rect x="768.0" y="140.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="803.0" cy="149.0" r="2.5" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <rect x="768.0" y="160.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="803.0" cy="169.0" r="2.5" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <rect x="768.0" y="180.0" width="44.0" height="18.0" rx="3" stroke="#14181f" stroke-width="1.8" fill="#e5e7eb"/>
  <circle cx="803.0" cy="189.0" r="2.5" stroke="#0f7a62" stroke-width="1" fill="#0f7a62"/>
  <text x="790.0" y="216.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">web server</text>
  <line x1="140.0" y1="145.0" x2="401.2" y2="145.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M410.0 145.0 L400.0 149.6 L400.0 140.4 Z" fill="#1f6fb5"/>
  <text x="275.0" y="118.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">1 What is the IP of</text>
  <text x="275.0" y="134.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">www.example.com?</text>
  <line x1="410.0" y1="195.0" x2="148.8" y2="195.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140.0 195.0 L150.0 190.4 L150.0 199.6 Z" fill="#0f7a62"/>
  <text x="275.0" y="220.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">2 It is 93.184.216.34</text>
  <path d="M120 250 Q450 340 770 250" stroke="#d98b2b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M770.0 250.0 L763.5 258.9 L759.0 250.7 Z" fill="#d98b2b"/>
  <text x="450.0" y="318.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">3 the browser connects to 93.184.216.34 and loads the page</text>
  <text x="450.0" y="360.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Users remember names; DNS turns each name into the number computers use.</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
