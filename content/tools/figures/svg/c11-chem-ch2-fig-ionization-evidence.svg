<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.4 and 2.5: the successive ionization energies of magnesium and the first ionization energies against atomic number, both drawn qualitatively. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .t{font-size:14px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="320" y="36">Successive ionization energies of magnesium</text>
  <path d="M80 420 V70 M80 420 H560" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="30" y="250" transform="rotate(-90 30 250)" text-anchor="middle">log of ionization energy</text>
  <text class="s" x="320" y="468">number of electrons removed</text>
  <!-- shell 3: 2 electrons low; shell 2: 8 electrons mid; shell 1: 2 electrons high -->
  <g fill="#1f6fb5"><circle cx="110" cy="380" r="6"/><circle cx="150" cy="365" r="6"/></g>
  <g fill="#0f7a62"><circle cx="190" cy="280" r="6"/><circle cx="230" cy="270" r="6"/><circle cx="270" cy="262" r="6"/><circle cx="310" cy="254" r="6"/><circle cx="350" cy="246" r="6"/><circle cx="390" cy="238" r="6"/><circle cx="430" cy="228" r="6"/><circle cx="470" cy="215" r="6"/></g>
  <g fill="#d7322f"><circle cx="510" cy="110" r="6"/><circle cx="545" cy="95" r="6"/></g>
  <g class="t" text-anchor="middle"><text x="110" y="440">1</text><text x="150" y="440">2</text><text x="190" y="440">3</text><text x="230" y="440">4</text><text x="270" y="440">5</text><text x="310" y="440">6</text><text x="350" y="440">7</text><text x="390" y="440">8</text><text x="430" y="440">9</text><text x="470" y="440">10</text><text x="510" y="440">11</text><text x="545" y="440">12</text></g>
  <text class="t" x="90" y="330" style="fill:#1f6fb5">3rd shell: 2 electrons, easy</text>
  <text class="t" x="250" y="310" style="fill:#0f7a62">2nd shell: 8 electrons, gradual rise</text>
  <text class="t" x="400" y="130" style="fill:#d7322f">1st shell: 2 electrons,</text><text class="t" x="400" y="150" style="fill:#d7322f">next to the nucleus</text>
  <path d="M175 350 L185 300" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/><text class="t" x="165" y="205">big jump</text><path d="M490 200 L500 130" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="s" x="320" y="500">two large jumps: the twelve electrons of Mg sit in three shells (2, 8, 2)</text>
  <!-- first IE plot -->
  <text class="h" x="900" y="36">First ionization energies against atomic number</text>
  <path d="M660 420 V70 M660 420 H1140" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="620" y="250" transform="rotate(-90 620 250)" text-anchor="middle">first ionization energy</text>
  <text class="s" x="900" y="468">atomic number (first 20 elements shown)</text>
  <polyline points="680,260 705,100 730,370 755,330 780,340 805,300 830,260 855,265 880,220 905,170 930,385 955,355 980,375 1005,345 1030,320 1055,325 1080,290 1105,245 1125,400 1140,390" fill="none" stroke="#d7322f" stroke-width="3"/>
  <g class="t" text-anchor="middle"><text x="705" y="90">He</text><text x="905" y="160">Ne</text><text x="1105" y="235">Ar</text><text x="730" y="395">Li</text><text x="930" y="408">Na</text><text x="1125" y="420">K</text></g>
  <g class="t">
    <text x="660" y="500">all ionization energies are endothermic</text>
    <text x="660" y="522">down a group (He, Ne, Ar or Li, Na, K) they fall: more shells, weaker hold</text>
    <text x="660" y="544">across a period they rise: same shell, more protons, stronger pull;</text>
    <text x="660" y="566">alkali metals lowest in each period, noble gases highest</text>
  </g>
  <text class="s" x="600" y="610">Heights are schematic: they follow the shapes described in the text, not measured values.</text>
</svg>
