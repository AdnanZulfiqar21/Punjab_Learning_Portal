<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after topics 11.8.1 (reactions 3 to 8), 11.9, 11.10, 11.10.1 and 11.11: reactions of ethene, conjugated dienes, types of isomerism and organic redox. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Reactions of ethene, conjugated dienes, isomerism and organic redox</text>
  <!-- reactions wheel as table -->
  <rect x="50" y="55" width="620" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="360" y="83">Reactions of ethene (11.8.1): all start from CH2=CH2</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="110">Reaction</text><text x="200" y="110">Reagent and conditions</text><text x="440" y="110">Product</text></g>
    <text x="70" y="134">hydrogenation</text><text x="200" y="134">H2, Ni or Pt, 250 to 300 degrees C</text><text x="440" y="134">CH3-CH3 ethane (oil to margarine)</text>
    <text x="70" y="156">hydrohalogenation</text><text x="200" y="156">dry HBr gas, room temperature</text><text x="440" y="156">CH3-CH2Br bromoethane</text>
    <text x="70" y="178">halogenation</text><text x="200" y="178">Br2 in CCl4 (bromine water decolourised)</text><text x="440" y="178">BrCH2-CH2Br 1,2-dibromoethane</text>
    <text x="70" y="200">hydration</text><text x="200" y="200">steam, high T and p, conc. H2SO4</text><text x="440" y="200">C2H5OH ethanol (via carbocation)</text>
    <text x="70" y="222">halohydration</text><text x="200" y="222">Br2 in water</text><text x="440" y="222">BrCH2-CH2OH 2-bromoethanol</text>
    <text x="70" y="244">epoxidation</text><text x="200" y="244">O2, Ag catalyst (or oxidising agents)</text><text x="440" y="244">epoxide, then ethane-1,2-diol</text>
    <text x="70" y="266">ozonolysis</text><text x="200" y="266">O3, then Zn / H2O (reduction)</text><text x="440" y="266">ozonide, then 2 CH2O (methanal)</text>
    <text x="70" y="288">polymerisation</text><text x="200" y="288">many monomers, pi bonds open</text><text x="440" y="288">poly(ethene) -[CH2-CH2]n-</text>
  </g>
  <path d="M60 118 H660" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="70" y="316">ozonolysis locates the double bond: propene gives ethanal + methanal</text>
    <text x="70" y="332">(Zn/H2O), which can be reduced to ethanol and methanol</text>
    <text x="70" y="352">addition polymerisation: C=C becomes C-C in the repeating unit;</text>
    <text x="70" y="368">chloroethene gives poly(chloroethene), PVC; the plastics industry</text>
  </g>
  <!-- dienes -->
  <rect x="690" y="55" width="460" height="150" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="920" y="83">Conjugated dienes (11.9)</text>
  <text class="f" x="710" y="110" style="font-size:14px">CH2=CH-CH=CH2   buta-1,3-diene</text>
  <g fill="none" stroke="#14181f" stroke-width="2.5"><path d="M760 150 L800 128 L840 150 L880 128 M764 156 L800 136 M844 156 L880 134"/></g>
  <path d="M750 160 C 790 120, 850 120, 890 160" fill="none" stroke="#d7322f" stroke-width="2" stroke-dasharray="5 3"/>
  <text font-size="11" fill="#d7322f" x="820" y="178" text-anchor="middle">p orbitals overlap on all four carbons</text>
  <g class="t" style="font-size:12px">
    <text x="900" y="132">C=C bonds separated by one C-C bond;</text>
    <text x="900" y="148">delocalisation stabilises the molecule</text>
    <text x="900" y="164">and changes its reactivity</text>
    <text x="900" y="196">buta-1,3-diene gives synthetic rubber</text>
  </g>
  <!-- isomerism -->
  <rect x="690" y="225" width="460" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="920" y="253">Isomerism (11.10): same formula, different structure</text>
  <g class="t" style="font-size:12px">
    <text x="710" y="280" style="font-weight:700;fill:#14181f">A. Structural isomerism (atoms arranged differently)</text>
    <text x="710" y="300">1 chain: butane and 2-methylpropane; pentane has 3 isomers</text>
    <text x="710" y="318">2 position: 1- and 2-chloropropane; but-1-ene and but-2-ene</text>
    <text x="710" y="336">3 functional group: ethanol and methoxymethane (C2H6O)</text>
    <text x="710" y="354">4 metamerism: ethoxyethane and methoxypropane;</text>
    <text x="710" y="370">   pentan-2-one and pentan-3-one (C5H10O)</text>
    <text x="710" y="388">5 tautomerism: proton shifts within the molecule (amino</text>
    <text x="710" y="404">   acid and its zwitterion)</text>
    <text x="710" y="430" style="font-weight:700;fill:#14181f">B. Stereoisomerism (same structure, different arrangement in space)</text>
    <text x="710" y="450">geometrical (cis-trans) and optical; studied in Class XII</text>
    <text x="710" y="476">first alkane with isomers: butane C4H10; C4H9Cl has two</text>
    <text x="710" y="492">(1- and 2-chlorobutane) with different physical properties</text>
    <text x="710" y="508">the number of isomers rises rapidly with carbon number</text>
  </g>
  <!-- redox -->
  <rect x="50" y="405" width="620" height="120" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="360" y="433">Organic redox (11.11)</text><text class="s" x="360" y="455">oxidation adds O or removes H; reduction adds H or removes O</text>
  <g class="f">
    <text x="70" y="478" style="font-size:11px">C2H6 + 7/2 O2 -> 2CO2 + 3H2O (combustion);  C2H5OH + 2[O] -> CH3COOH + H2O (K2Cr2O7/H+)</text>
    <text x="70" y="496" style="font-size:11px">ozonolysis and epoxidation are oxidations; reduction: CH2=CH2 + H2 -> CH3CH3</text>
    <text x="70" y="514" style="font-size:11px">CH3CHO + 2[H] -> CH3CH2OH (LiAlH4); other reducing agents: NaBH4, Sn + conc. HCl</text>
  </g>
  <!-- polymer box -->
  <rect x="50" y="545" width="1100" height="120" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="573">Addition polymerisation and the repeating unit</text>
  <text class="f" x="70" y="600" style="font-size:14px">n CH2=CH2 --> -[CH2-CH2]n-</text><text class="f" x="600" y="600" style="font-size:14px">n CH2=CHCl --> -[CH2-CHCl]n- (PVC)</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="626">the repeating unit is the smallest group of atoms that, joined one after another, makes the chain; shown in square brackets;</text>
    <text x="70" y="642">for a poly(alkene) it is the monomer with the C=C changed to C-C; the only product is the polymer; sp2 carbons become sp3 (109.5 degrees)</text>
  </g>
  <text class="s" x="600" y="688" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
