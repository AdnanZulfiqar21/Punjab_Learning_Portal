  <line x1="450.0" y1="130.0" x2="287.2" y2="130.0" stroke="#f08a24" stroke-width="9" stroke-linecap="butt"/>
  <path d="M260.0 130.0 L294.0 113.0 L294.0 147.0 Z" fill="#f08a24"/>
