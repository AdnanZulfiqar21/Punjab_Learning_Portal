<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.31 to 3.33: protein/peptide signalling against steroid signalling. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:22px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="50">Protein / peptide signal</text>
  <text class="s" x="170" y="80">water-soluble: cannot cross the membrane</text>
  <text class="h" x="900" y="50">Steroid signal</text>
  <text class="s" x="790" y="80">lipid-soluble: diffuses through the membrane</text>
  <!-- divider -->
  <path d="M600 100 V800" stroke="#e5e7eb" stroke-width="3"/>
  <!-- LEFT cell: membrane band at y=220, cytoplasm below, nucleus at bottom -->
  <text class="s" x="40" y="150">outside</text>
  <rect x="40" y="200" width="520" height="40" fill="#1f6fb5"/>
  <rect x="40" y="240" width="520" height="540" fill="#eef6fb"/>
  <!-- receptor in membrane -->
  <path d="M230 185 h60 v80 h-60 z" fill="#5b3fb5"/><path d="M230 185 q30 -50 60 0" fill="#fff" stroke="#5b3fb5" stroke-width="4"/>
  <circle cx="260" cy="130" r="14" fill="#d98b2b"/>
  <path d="M260 100 L260 118" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="285" y="135">ligand binds</text>
  <text class="t" x="300" y="285">1 Reception</text>
  <text class="s" x="300" y="310">receptor changes shape</text>
  <!-- second messenger cascade -->
  <path d="M260 270 L260 350" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <g fill="#f2b134" stroke="#8a4b00" stroke-width="2"><circle cx="260" cy="375" r="12"/><circle cx="220" cy="420" r="12"/><circle cx="300" cy="420" r="12"/><circle cx="190" cy="465" r="12"/><circle cx="250" cy="465" r="12"/><circle cx="330" cy="465" r="12"/></g>
  <path d="M260 388 L225 408 M260 388 L295 408 M220 433 L195 453 M220 433 L248 453 M300 433 L328 453" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="360" y="400">2 Transduction</text>
  <text class="s" x="360" y="425">second messengers (cAMP,</text><text class="s" x="360" y="448">Ca ions, IP3) amplify the signal</text>
  <!-- nucleus -->
  <ellipse cx="300" cy="650" rx="190" ry="90" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="6"/>
  <path d="M260 480 L280 560" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="t" x="170" y="640">3 Response</text>
  <text class="s" x="140" y="665">genes switched on or off;</text><text class="s" x="140" y="688">metabolism, growth, division,</text><text class="s" x="140" y="711">differentiation or apoptosis</text>
  <!-- RIGHT cell -->
  <text class="s" x="640" y="150">outside</text>
  <rect x="640" y="200" width="520" height="40" fill="#1f6fb5"/>
  <rect x="640" y="240" width="520" height="540" fill="#eef6fb"/>
  <!-- steroid passes straight through -->
  <circle cx="860" cy="130" r="14" fill="#8a4b00"/>
  <path d="M860 150 L860 320" stroke="#4b5563" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <text class="s" x="885" y="135">steroid hormone</text>
  <text class="s" x="885" y="290">diffuses through the bilayer</text>
  <!-- intracellular receptor -->
  <path d="M830 340 h60 v50 h-60 z" fill="#5b3fb5"/><circle cx="860" cy="340" r="14" fill="#8a4b00"/>
  <text class="t" x="905" y="360">Intracellular receptor</text>
  <text class="s" x="905" y="385">in cytoplasm or nucleus</text>
  <path d="M860 395 L860 560" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="880" y="480">receptor-hormone complex</text><text class="s" x="880" y="503">moves into the nucleus</text>
  <!-- nucleus with DNA -->
  <ellipse cx="900" cy="650" rx="190" ry="90" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="6"/>
  <path d="M760 650 q30 -30 60 0 t60 0 t60 0 t60 0 t60 0" stroke="#5b3fb5" stroke-width="5" fill="none"/>
  <path d="M860 600 h40 v30 h-40 z" fill="#5b3fb5"/><circle cx="880" cy="600" r="10" fill="#8a4b00"/>
  <text class="s" x="760" y="700">complex binds specific DNA sequences;</text><text class="s" x="760" y="723">transcription goes up or down</text>
  <text class="s" x="40" y="805">Both routes end with a cellular response; the difference is where the receptor sits.</text>
</svg>
