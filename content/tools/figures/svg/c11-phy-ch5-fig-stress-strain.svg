<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 5.5 (PDF page 98), original drawing after the printed figure: stress-strain curve of a typical ductile material; straight from O to A, curving through B up to the highest point C and down to D. OA is drawn straight, as the text states (proportional region). -->
  <rect width="900" height="700" fill="#ffffff"/>
  <line x1="150.0" y1="570.0" x2="150.0" y2="70.0" stroke="#8a8d92" stroke-width="4" stroke-linecap="round"/>
  <line x1="150.0" y1="570.0" x2="850.0" y2="570.0" stroke="#8a8d92" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 570 L240 290 C265 250 280 230 310 200 C400 130 500 130 620 130 C670 130 690 150 740 170" stroke="#e0197d" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="240.0" cy="290.0" r="8.0" stroke="#e0197d" stroke-width="3" fill="#ffffff"/>
  <circle cx="310.0" cy="200.0" r="8.0" stroke="#e0197d" stroke-width="3" fill="#ffffff"/>
  <circle cx="620.0" cy="130.0" r="8.0" stroke="#e0197d" stroke-width="3" fill="#ffffff"/>
  <text x="130.0" y="590.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">O</text>
  <text x="222.0" y="294.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">A</text>
  <text x="294.0" y="184.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">B</text>
  <text x="620.0" y="106.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">C</text>
  <text x="756.0" y="178.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400">D</text>
  <text x="500.0" y="628.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Strain</text>
  <text x="110.0" y="330.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400" transform="rotate(-90 110.0 330.0)">Stress (σ)</text>
</svg>
