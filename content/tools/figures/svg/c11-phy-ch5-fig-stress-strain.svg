<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 5.5: the stress-strain curve of a ductile material with its proportional limit, elastic limit, ultimate stress and breaking point. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Stress-strain curve of a ductile material</text>
  <line x1="110.0" y1="390.0" x2="809.6" y2="390.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M820.0 390.0 L808.2 395.5 L808.2 384.5 Z" fill="#14181f"/>
  <line x1="110.0" y1="390.0" x2="110.0" y2="80.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M110.0 70.0 L115.5 81.8 L104.5 81.8 Z" fill="#14181f"/>
  <text x="820.0" y="420.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700">strain</text>
  <text x="120.0" y="84.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">stress</text>
  <rect x="112" y="200" width="258" height="188" fill="#e6f4ef" opacity="0.5"/>
  <line x1="110.0" y1="390.0" x2="300.0" y2="200.0" stroke="#d7322f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M300 200 Q340 170 370 160 Q480 105 600 115 Q660 115 720 165" stroke="#d7322f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="300.0" cy="200.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="286.0" y="194.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">A: proportional limit</text>
  <circle cx="370.0" cy="160.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="356.0" y="150.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">B: elastic limit (yield point)</text>
  <circle cx="600.0" cy="115.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="600.0" y="95.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">C: ultimate tensile stress</text>
  <circle cx="720.0" cy="165.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="734.0" y="165.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">D: breaking point</text>
  <text x="200.0" y="350.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700">elastic region</text>
  <text x="520.0" y="350.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700">plastic region</text>
  <text x="200.0" y="372.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="400">(Hooke's law up to A)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
