<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="555" fill="#ffffff"/>
  <!-- Original diagram after Figure 24.6: a large prokaryote engulfs an aerobic bacterium and a photosynthetic bacterium without digesting them; they become the mitochondrion and chloroplast of a eukaryotic cell, whose nucleus and ER came from infolded membrane. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Endosymbiotic theory: how eukaryotic cells arose</text>
  <ellipse cx="140.0" cy="230.0" rx="110.0" ry="90.0" stroke="#475569" stroke-width="2.5" fill="#f1f5f9"/>
  <path d="M70 230 q30 -40 70 -10 q40 30 70 -10" stroke="#1e3a8a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="345.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">large prokaryote</text>
  <ellipse cx="280.0" cy="140.0" rx="30.0" ry="16.0" stroke="#b91c1c" stroke-width="2" fill="#fecaca"/>
  <text x="280.0" y="115.0" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">aerobic bacterium</text>
  <ellipse cx="280.0" cy="330.0" rx="30.0" ry="16.0" stroke="#15803d" stroke-width="2" fill="#bbf7d0"/>
  <text x="280.0" y="370.0" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">photosynthetic bacterium</text>
  <line x1="250.0" y1="150.0" x2="219.5" y2="180.5" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <path d="M215.0 185.0 L217.7 177.5 L222.5 182.3 Z" fill="#b91c1c"/>
  <line x1="250.0" y1="320.0" x2="219.2" y2="284.8" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  <path d="M215.0 280.0 L222.3 283.2 L217.2 287.7 Z" fill="#15803d"/>
  <line x1="330.0" y1="230.0" x2="411.2" y2="230.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M420.0 230.0 L410.0 234.6 L410.0 225.4 Z" fill="#14181f"/>
  <text x="375.0" y="215.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">engulfed,</text>
  <text x="375.0" y="252.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">not digested</text>
  <ellipse cx="620.0" cy="230.0" rx="190.0" ry="150.0" stroke="#475569" stroke-width="2.5" fill="#f8fafc"/>
  <circle cx="600.0" cy="200.0" r="48.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="600.0" y="205.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">nucleus</text>
  <path d="M560 250 q20 30 60 20 q40 -10 60 20" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="640.0" y="300.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">ER</text>
  <ellipse cx="690.0" cy="150.0" rx="34.0" ry="18.0" stroke="#b91c1c" stroke-width="2" fill="#fecaca"/>
  <path d="M664 150 q8 -10 16 0 q8 10 16 0 q8 -10 16 0" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="690.0" y="186.0" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">mitochondrion</text>
  <ellipse cx="710.0" cy="290.0" rx="36.0" ry="18.0" stroke="#15803d" stroke-width="2" fill="#bbf7d0"/>
  <line x1="686.0" y1="282.0" x2="686.0" y2="298.0" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  <line x1="704.0" y1="282.0" x2="704.0" y2="298.0" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  <line x1="722.0" y1="282.0" x2="722.0" y2="298.0" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  <text x="710.0" y="326.0" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">chloroplast</text>
  <text x="620.0" y="405.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">eukaryotic cell</text>
  <rect x="40.0" y="425.0" width="820.0" height="100.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="452.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Evidence: mitochondria and chloroplasts are the size of bacteria, have their own circular DNA,</text>
  <text x="60.0" y="476.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">divide by binary fission and have membranes more like those of prokaryotes.</text>
  <text x="60.0" y="500.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Membrane invagination theory: infolding of the cell membrane formed the nucleus and ER.</text>
  <text x="450.0" y="546" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
