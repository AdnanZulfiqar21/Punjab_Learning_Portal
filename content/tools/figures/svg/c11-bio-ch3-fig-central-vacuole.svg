<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="485" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.25: a plant cell whose large central vacuole, bounded by the tonoplast and full of cell sap, fills most of the cell. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The central vacuole of a plant cell</text>
  <rect x="120.0" y="60.0" width="460.0" height="360.0" rx="16" stroke="#713f12" stroke-width="10" fill="#d9f99d"/>
  <rect x="132.0" y="72.0" width="436.0" height="336.0" rx="10" stroke="#65a30d" stroke-width="2" fill="#ecfccb"/>
  <rect x="170.0" y="100.0" width="360.0" height="280.0" rx="60" stroke="#1d4ed8" stroke-width="3" fill="#bfdbfe"/>
  <ellipse cx="160.0" cy="300.0" rx="22.0" ry="30.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <circle cx="160.0" cy="300.0" r="8.0" stroke="#7c3aed" stroke-width="1" fill="#a78bfa"/>
  <ellipse cx="250.0" cy="86.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80"/>
  <ellipse cx="380.0" cy="86.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80"/>
  <ellipse cx="550.0" cy="200.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80" transform="rotate(90 550.0 200.0)"/>
  <ellipse cx="300.0" cy="394.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80"/>
  <ellipse cx="450.0" cy="394.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80"/>
  <ellipse cx="148.0" cy="160.0" rx="13.0" ry="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#4ade80" transform="rotate(90 148.0 160.0)"/>
  <text x="350.0" y="230.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">cell sap</text>
  <text x="350.0" y="256.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="400">(water, sugars, salts, pigments)</text>
  <text x="640.0" y="85.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">cell wall</text>
  <line x1="634.0" y1="80.0" x2="575.0" y2="80.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="640.0" y="125.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">plasma membrane</text>
  <line x1="634.0" y1="120.0" x2="566.0" y2="120.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="640.0" y="165.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">cytoplasm</text>
  <line x1="634.0" y1="160.0" x2="548.0" y2="160.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="640.0" y="235.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">tonoplast (vacuole membrane)</text>
  <line x1="634.0" y1="230.0" x2="531.0" y2="230.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="640.0" y="305.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">chloroplast</text>
  <line x1="634.0" y1="300.0" x2="563.0" y2="300.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="640.0" y="375.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">nucleus pushed aside</text>
  <line x1="634.0" y1="370.0" x2="182.0" y2="312.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="350.0" y="448.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the central vacuole fills 80% or more of the cell; when full, it presses outward (turgor)</text>
  <text x="450.0" y="476" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
