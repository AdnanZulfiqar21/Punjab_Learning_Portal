<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.7 to 12.10 and Table 12.4: the S8 crown, properties of sulfur, oxidation states, a schematic Frost diagram, reactions and uses of sulfur. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Sulfur: the S8 crown, oxidation states and their stability, reactions and uses</text>
  <!-- S8 and properties -->
  <rect x="50" y="55" width="380" height="250" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="240" y="83">Sulfur (12.8, Table 12.4, Figure 12.7)</text>
  <g fill="none" stroke="#b5600f" stroke-width="2.5">
    <path d="M150 120 L190 128 L210 160 L200 200 L160 215 L120 200 L105 160 L120 128 Z"/>
  </g>
  <g font-size="11" font-weight="700" fill="#b5600f" text-anchor="middle">
    <text x="150" y="117">S</text><text x="193" y="125">S</text><text x="216" y="163">S</text><text x="205" y="206">S</text><text x="160" y="226">S</text><text x="116" y="206">S</text><text x="100" y="163">S</text><text x="116" y="125">S</text>
  </g>
  <text class="r" x="160" y="250" text-anchor="middle">S8 crown ring (catenation)</text>
  <g class="r">
    <text x="225" y="118">group 16 chalcogen; Z 16; Ar 32.06</text>
    <text x="225" y="134">[Ne] 3s2 3p4; yellow solid; d 2.07</text>
    <text x="225" y="150">m.p. 113 C; b.p. 445 C</text>
    <text x="225" y="166">EN 2.5; IE1 1000 kJ mol-1</text>
    <text x="225" y="182">radius: covalent 104, ionic 184 pm</text>
    <text x="225" y="198">electron affinity -200 kJ mol-1</text>
    <text x="225" y="214">common states +4 and +6; covalent</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="274">S-S single bonds, not double (poor p overlap),</text>
    <text x="70" y="290">so sulfur catenates into rings and chains (12.8.1)</text>
  </g>
  <!-- oxidation states -->
  <rect x="450" y="55" width="330" height="250" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="615" y="83">Oxidation states (12.8.2, Figure 12.8)</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="470" y="108">State</text><text x="530" y="108">Unpaired e-</text><text x="640" y="108">Example</text></g>
    <text x="470" y="130">-2</text><text x="530" y="130">2 (3p4)</text><text x="640" y="130">H2S, S2-</text>
    <text x="470" y="150">0</text><text x="530" y="150">-</text><text x="640" y="150">S8</text>
    <text x="470" y="170">+2</text><text x="530" y="170">2</text><text x="640" y="170">SCl2</text>
    <text x="470" y="190">+4</text><text x="530" y="190">4 (one 3p to 3d)</text><text x="640" y="190">SO2, SO3 2-</text>
    <text x="470" y="210">+6</text><text x="530" y="210">6 (3s and 3p to 3d)</text><text x="640" y="210">SO3, SO4 2-, SF6</text>
  </g>
  <path d="M460 116 H770" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="470" y="240">S + O2 gives SO2 (+4) under standard conditions;</text>
    <text x="470" y="256">SO3 (+6) needs high energy, a catalyst and heat</text>
    <text x="470" y="276">the oxidation state follows the number of</text>
    <text x="470" y="292">unpaired electrons after promotion to 3d</text>
  </g>
  <!-- Frost diagram -->
  <rect x="800" y="55" width="350" height="250" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="975" y="83">Frost diagram, schematic (12.9, Figure 12.9)</text>
  <path d="M850 260 V100 M850 260 H1130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g class="r" text-anchor="middle"><text x="870" y="276">-II</text><text x="920" y="276">0</text><text x="970" y="276">II</text><text x="1020" y="276">IV</text><text x="1070" y="276">VI</text></g>
  <text class="r" x="1000" y="292" text-anchor="middle">oxidation state n</text>
  <text class="r" x="830" y="180" transform="rotate(-90 830 180)" text-anchor="middle">nE / V</text>
  <path d="M870 150 L920 170 L1020 120 L1070 100" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <path d="M870 185 L920 170 L1020 210 L1070 245" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
  <g font-size="10" fill="#d7322f"><text x="1075" y="104">SO4 2-</text><text x="1030" y="142">SO2(aq)</text><text x="858" y="146">H2S</text></g>
  <g font-size="10" fill="#1f6fb5"><text x="1075" y="250">SO4 2-</text><text x="985" y="238">SO3 2-</text><text x="858" y="198">S2-</text></g>
  <text font-size="10" fill="#14181f" font-weight="700" x="920" y="184" text-anchor="middle">S8</text>
  <g class="r"><text x="1060" y="176" style="fill:#d7322f;font-weight:700">acidic (pH 0)</text><text x="1060" y="190" style="fill:#1f6fb5;font-weight:700">basic (pH 14)</text></g>
  <!-- stability text -->
  <rect x="50" y="325" width="560" height="150" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="330" y="353">Reading the Frost diagram (12.9)</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="378">plot of nE (= -delta G / F) against oxidation state n for the couple X(n)/X(0), at pH 0 and pH 14</text>
    <text x="70" y="396">lowest point = most stable state (most negative Gibbs energy); steep positive slope = good oxidising</text>
    <text x="70" y="412">agent, steep negative slope = good reducing agent</text>
    <text x="70" y="434">sulfur: +6 (sulfate) is the most stable state and non-oxidising in strong base; in strong acid all the</text>
    <text x="70" y="450">oxidised states lie above elemental sulfur (less stable), in base they lie below it (more stable)</text>
  </g>
  <!-- reactions -->
  <rect x="630" y="325" width="520" height="150" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="890" y="353">Reactions of sulfur (12.10)</text>
  <g class="f">
    <text x="650" y="378">S + O2 --> SO2 (blue flame);  2SO2 + O2 --(Pt)--> 2SO3</text>
    <text x="650" y="396">S + 6HNO3 --> H2SO4 + 6NO2 + 2H2O</text>
    <text x="650" y="414">2Ag + S --> Ag2S;  Hg + S --> HgS;  2Cu + S --> Cu2S (tarnish)</text>
    <text x="650" y="432">KCN + S --> KSCN (thiocyanate, a pseudohalide; tests Fe3+)</text>
    <text x="650" y="450">S + 3F2 --> SF6 (inert insulator gas);  2S + Cl2 --> S2Cl2</text>
  </g>
  <text class="t" x="650" y="468" style="font-size:11px">unreactive to water, dilute non-oxidising acids and noble gases; no reaction with Au or Pt</text>
  <!-- uses -->
  <rect x="50" y="495" width="1100" height="175" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="523">Uses of sulfur (12.11) and sulfur in organic synthesis (12.12)</text>
  <!-- vulcanisation sketch -->
  <g stroke="#4b5563" stroke-width="2" fill="none"><path d="M80 560 Q120 545 160 560 T240 560 T320 560"/><path d="M80 600 Q120 585 160 600 T240 600 T320 600"/></g>
  <g stroke="#b5600f" stroke-width="2"><path d="M140 560 V600 M240 560 V600"/></g>
  <g font-size="10" fill="#b5600f" font-weight="700"><text x="146" y="584">S-S</text><text x="246" y="584">S-S</text></g>
  <text class="r" x="200" y="622" text-anchor="middle">vulcanisation: S cross-links rubber chains (Figure 12.10)</text>
  <g class="t" style="font-size:12px">
    <text x="360" y="552">fertiliser: sulfur-containing N/P fertilisers, sulfur-coated urea, gypsum (CaSO4.2H2O; printed 5H2O)</text>
    <text x="360" y="570">gunpowder: 75% KNO3 (oxidiser), 15% charcoal (fuel), 10% sulfur (extra fuel, faster burning)</text>
    <text x="360" y="588">10KNO3 + 3S + 8C --> 2K2CO3 + 3K2SO4 + 6CO2 + 5N2</text>
    <text x="360" y="612">organic: C-S bonds in thiols (mercaptans), thioethers, sulfoxides, sulfones; sulfa drugs (sulfonamides),</text>
    <text x="360" y="628">omeprazole (a sulfoxide); sulfur dyes by thionation (black, brown, khaki, blue, green);</text>
    <text x="360" y="644">mercaptans odorise natural gas; thioterpineol gives grapefruit its aroma; oxathiane in fine fragrances</text>
  </g>
  <text class="s" x="600" y="690" style="font-size:11px">Original diagram for this lesson; the Frost curves are schematic; the textbook's pictures are not reproduced.</text>
</svg>
