<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 23.1: a bacterial cell showing where four antibiotic classes act: penicillin on the cell wall, tetracycline on 30S ribosome subunits, fluoroquinolones on DNA gyrase and topoisomerase IV, and sulfonamides on folate synthesis. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Four classes of antibiotics and where they act</text>
  <rect x="80.0" y="160.0" width="440.0" height="320.0" rx="140" stroke="#15803d" stroke-width="10" fill="none"/>
  <rect x="90.0" y="170.0" width="420.0" height="300.0" rx="130" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
  <path d="M190 280 q40 -50 90 -10 q50 40 100 0 q30 -20 30 30 q-20 60 -90 40 q-60 -20 -100 10 q-40 10 -30 -70" stroke="#1e3a8a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160.0" cy="400.0" r="9.0" stroke="#7c3aed" stroke-width="1.5" fill="#ddd6fe"/>
  <circle cx="168.0" cy="394.0" r="6.0" stroke="#7c3aed" stroke-width="1.2" fill="#c4b5fd"/>
  <circle cx="200.0" cy="420.0" r="9.0" stroke="#7c3aed" stroke-width="1.5" fill="#ddd6fe"/>
  <circle cx="208.0" cy="414.0" r="6.0" stroke="#7c3aed" stroke-width="1.2" fill="#c4b5fd"/>
  <circle cx="240.0" cy="405.0" r="9.0" stroke="#7c3aed" stroke-width="1.5" fill="#ddd6fe"/>
  <circle cx="248.0" cy="399.0" r="6.0" stroke="#7c3aed" stroke-width="1.2" fill="#c4b5fd"/>
  <circle cx="420.0" cy="410.0" r="9.0" stroke="#7c3aed" stroke-width="1.5" fill="#ddd6fe"/>
  <circle cx="428.0" cy="404.0" r="6.0" stroke="#7c3aed" stroke-width="1.2" fill="#c4b5fd"/>
  <circle cx="450.0" cy="380.0" r="9.0" stroke="#7c3aed" stroke-width="1.5" fill="#ddd6fe"/>
  <circle cx="458.0" cy="374.0" r="6.0" stroke="#7c3aed" stroke-width="1.2" fill="#c4b5fd"/>
  <circle cx="340.0" cy="290.0" r="12.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <text x="340.0" y="294.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <rect x="130.0" y="210.0" width="70.0" height="34.0" rx="6" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2"/>
  <text x="165.0" y="232.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">folate</text>
  <text x="560.0" y="125.0" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">cell wall (peptidoglycan)</text>
  <line x1="556.0" y1="120.0" x2="480.0" y2="180.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="480.0" cy="180.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="165.0" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">PENICILLIN: blocks cross-links,</text>
  <line x1="556.0" y1="160.0" x2="505.0" y2="220.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="505.0" cy="220.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="180.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the wall bursts (bactericidal)</text>
  <text x="560.0" y="255.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">TETRACYCLINE: binds 30S</text>
  <line x1="556.0" y1="250.0" x2="450.0" y2="380.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="450.0" cy="380.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="270.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">ribosome subunit, blocks tRNA</text>
  <text x="560.0" y="288.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">at the A site (bacteriostatic)</text>
  <text x="560.0" y="365.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">FLUOROQUINOLONES: trap DNA</text>
  <line x1="556.0" y1="360.0" x2="352.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="352.0" cy="290.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="380.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">gyrase / topoisomerase IV;</text>
  <text x="560.0" y="398.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">DNA breaks (bactericidal)</text>
  <text x="560.0" y="475.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">SULFONAMIDES: block folate</text>
  <line x1="556.0" y1="470.0" x2="200.0" y2="227.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="200.0" cy="227.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="490.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">synthesis (bacteriostatic)</text>
  <text x="40.0" y="215.0" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA</text>
  <line x1="65.5" y1="210.0" x2="200.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="200.0" cy="290.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="40.0" y="465.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">ribosomes</text>
  <line x1="108.4" y1="460.0" x2="160.0" y2="400.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="160.0" cy="400.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="450.0" y="575.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">human cells have no cell wall, different (80S) ribosomes and take folate from food: so these drugs spare them</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
