<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original diagram after Table 30.2: a proton with n neighbouring protons on the adjacent carbon gives n + 1 sub-peaks: singlet (0), doublet (1, 1:1), triplet (2, 1:2:1) and quartet (3, 1:3:3:1). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Splitting patterns: the n + 1 rule</text>
  <rect x="15.0" y="55.0" width="205.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="117.0" y="90.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">n = 0 neighbours</text>
  <line x1="117.0" y1="240.0" x2="117.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="57.0" y1="240.0" x2="177.0" y2="240.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="117.0" y="275.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">singlet (s)</text>
  <text x="117.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">1 sub-peaks</text>
  <text x="117.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">heights 1</text>
  <rect x="235.0" y="55.0" width="205.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="337.0" y="90.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">n = 1 neighbours</text>
  <line x1="329.0" y1="240.0" x2="329.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="345.0" y1="240.0" x2="345.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="277.0" y1="240.0" x2="397.0" y2="240.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="337.0" y="275.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">doublet (d)</text>
  <text x="337.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">2 sub-peaks</text>
  <text x="337.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">heights 1:1</text>
  <rect x="455.0" y="55.0" width="205.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="557.0" y="90.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">n = 2 neighbours</text>
  <line x1="541.0" y1="240.0" x2="541.0" y2="185.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="557.0" y1="240.0" x2="557.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="573.0" y1="240.0" x2="573.0" y2="185.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="497.0" y1="240.0" x2="617.0" y2="240.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="557.0" y="275.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">triplet (t)</text>
  <text x="557.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">3 sub-peaks</text>
  <text x="557.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">heights 1:2:1</text>
  <rect x="675.0" y="55.0" width="205.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="777.0" y="90.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">n = 3 neighbours</text>
  <line x1="753.0" y1="240.0" x2="753.0" y2="203.3" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="769.0" y1="240.0" x2="769.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="785.0" y1="240.0" x2="785.0" y2="130.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="801.0" y1="240.0" x2="801.0" y2="203.3" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="717.0" y1="240.0" x2="837.0" y2="240.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="777.0" y="275.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">quartet (q)</text>
  <text x="777.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">4 sub-peaks</text>
  <text x="777.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">heights 1:3:3:1</text>
  <text x="450.0" y="368.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">equivalent protons do not split each other; O-H and N-H protons usually appear as singlets</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
