<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1100" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.15: the steps of glycolysis. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563}
      .b{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
      .p{font-size:22px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="box"><rect x="-170" y="-24" width="340" height="48" rx="10" fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"/></g>
    <g id="box2"><rect x="-170" y="-24" width="340" height="48" rx="10" fill="#e8dff7" stroke="#5b3fb5" stroke-width="3"/></g>
  </defs>
  <text class="h" x="500" y="40">Glycolysis: glucose to two pyruvic acids (in the cytosol)</text>
  <text class="p" x="150" y="110" style="fill:#0f7a62">Preparatory phase</text>
  <text class="s" x="40" y="136">energy spent</text>
  <g transform="translate(500,110)"><use href="#box"/><text class="b" x="0" y="7">Glucose (6C)</text></g>
  <path d="M500 134 V176" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="162">ATP to ADP: phosphate added</text>
  <g transform="translate(500,200)"><use href="#box"/><text class="b" x="0" y="7">Glucose 6-phosphate</text></g>
  <path d="M500 224 V266" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="252">isomerisation</text>
  <g transform="translate(500,290)"><use href="#box"/><text class="b" x="0" y="7">Fructose 6-phosphate</text></g>
  <path d="M500 314 V356" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="342">ATP to ADP: second phosphate</text>
  <g transform="translate(500,380)"><use href="#box"/><text class="b" x="0" y="7">Fructose 1,6-biphosphate</text></g>
  <path d="M500 404 V446" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="432">splits into two 3C sugars</text>
  <g transform="translate(330,470)"><rect x="-150" y="-24" width="300" height="48" rx="10" fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"/><text class="b" x="0" y="7">G3P (3C)</text></g>
  <g transform="translate(670,470)"><rect x="-150" y="-24" width="300" height="48" rx="10" fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"/><text class="b" x="0" y="7">Dihydroxyacetone phosphate</text></g>
  <path d="M515 470 H485" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/><text class="s" x="520" y="525">DAP converts to G3P: 2 G3P</text>
  <text class="p" x="150" y="570" style="fill:#5b3fb5">Oxidative phase</text>
  <text class="s" x="40" y="596">energy packed as ATP (x2)</text>
  <path d="M500 494 V546" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g transform="translate(500,570)"><use href="#box2"/><text class="b" x="0" y="7">2 Glyceraldehyde 3-phosphate</text></g>
  <path d="M500 594 V636" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="622">2 NAD+ to 2 NADH; Pi added</text>
  <g transform="translate(500,660)"><use href="#box2"/><text class="b" x="0" y="7">2 1,3-Biphosphoglyceric acid</text></g>
  <path d="M500 684 V726" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="712">2 ADP to 2 ATP</text>
  <g transform="translate(500,750)"><use href="#box2"/><text class="b" x="0" y="7">2 3-Phosphoglyceric acid</text></g>
  <path d="M500 774 V816" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="802">phosphate moves</text>
  <g transform="translate(500,840)"><use href="#box2"/><text class="b" x="0" y="7">2 2-Phosphoglyceric acid</text></g>
  <path d="M500 864 V906" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="892">2 H2O removed</text>
  <g transform="translate(500,930)"><use href="#box2"/><text class="b" x="0" y="7">2 Phosphoenol pyruvic acid</text></g>
  <path d="M500 954 V996" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="520" y="982">2 ADP to 2 ATP</text>
  <g transform="translate(500,1020)"><rect x="-170" y="-24" width="340" height="48" rx="10" fill="#5b3fb5"/><text class="b" x="0" y="7" style="fill:#fff">2 Pyruvic acid (3C)</text></g>
  <text class="s" x="40" y="1080">Balance: 2 ATP spent, 4 ATP made (net 2 ATP), 2 NADH; all enzymes dissolved in the cytosol.</text>
</svg>
