<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.7: the five arrangements of bacterial flagella. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563;text-anchor:middle}
      .cell{fill:#dbe9f5;stroke:#1f6fb5;stroke-width:6}
      .fl{fill:none;stroke:#14181f;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>
  <!-- Atrichous -->
  <g transform="translate(120,120)">
    <rect class="cell" x="-60" y="-35" width="120" height="70" rx="35"/>
    <text class="t" x="0" y="100">Atrichous</text><text class="s" x="0" y="130">no flagella</text>
  </g>
  <!-- Monotrichous -->
  <g transform="translate(380,120)">
    <rect class="cell" x="-60" y="-35" width="120" height="70" rx="35"/>
    <path class="fl" d="M60 0 c25 -25 35 25 60 0 s35 25 60 0"/>
    <text class="t" x="0" y="100">Monotrichous</text><text class="s" x="0" y="130">one polar flagellum</text>
  </g>
  <!-- Lophotrichous -->
  <g transform="translate(700,120)">
    <rect class="cell" x="-60" y="-35" width="120" height="70" rx="35"/>
    <path class="fl" d="M60 -12 c25 -40 45 10 70 -30"/>
    <path class="fl" d="M60 -4 c30 -20 50 20 80 -5"/>
    <path class="fl" d="M60 4 c30 20 50 -20 80 5"/>
    <path class="fl" d="M60 12 c25 40 45 -10 70 30"/>
    <text class="t" x="0" y="100">Lophotrichous</text><text class="s" x="0" y="130">a tuft at one pole</text>
  </g>
  <!-- Amphitrichous -->
  <g transform="translate(260,420)">
    <rect class="cell" x="-60" y="-35" width="120" height="70" rx="35"/>
    <path class="fl" d="M60 0 c25 -25 35 25 60 0 s35 25 60 0"/>
    <path class="fl" d="M-60 0 c-25 -25 -35 25 -60 0 s-35 25 -60 0"/>
    <text class="t" x="0" y="100">Amphitrichous</text><text class="s" x="0" y="130">one at each pole</text>
  </g>
  <!-- Peritrichous -->
  <g transform="translate(680,420)">
    <rect class="cell" x="-60" y="-35" width="120" height="70" rx="35"/>
    <path class="fl" d="M-30 -35 c-10 -30 10 -40 0 -70"/>
    <path class="fl" d="M10 -35 c-10 -30 10 -40 0 -70"/>
    <path class="fl" d="M45 -30 c15 -25 35 -20 45 -50"/>
    <path class="fl" d="M60 10 c30 0 40 25 70 20"/>
    <path class="fl" d="M30 35 c10 30 -10 40 0 70"/>
    <path class="fl" d="M-15 35 c10 30 -10 40 0 70"/>
    <path class="fl" d="M-50 30 c-15 25 -35 20 -45 50"/>
    <path class="fl" d="M-60 -10 c-30 0 -40 -25 -70 -20"/>
    <text class="t" x="0" y="130">Peritrichous</text><text class="s" x="0" y="160">flagella all round the cell</text>
  </g>
  <text class="s" x="500" y="740">Bacteria are named by where their flagella are: a-, mono-, lopho-, amphi-, peri-trichous.</text>
</svg>
