<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: developers, users, governments and communities around an AI system, with four ethical principles. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Stakeholders and ethical principles in AI (after Fig 8.5)</text>
  <circle cx="450.0" cy="210.0" r="70.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="450.0" y="205.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">AI</text>
  <text x="450.0" y="225.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">system</text>
  <rect x="55.0" y="80.0" width="230.0" height="60.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="170.0" y="108.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">developers</text>
  <text x="170.0" y="124.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">accurate, fair systems</text>
  <line x1="285.0" y1="110.0" x2="390.0" y2="174.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <rect x="615.0" y="80.0" width="230.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="730.0" y="108.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">users</text>
  <text x="730.0" y="124.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">ease, privacy, correct results</text>
  <line x1="615.0" y1="110.0" x2="510.0" y2="174.0" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <rect x="55.0" y="280.0" width="230.0" height="60.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="170.0" y="308.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">governments</text>
  <text x="170.0" y="324.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">laws, public interest</text>
  <line x1="285.0" y1="310.0" x2="390.0" y2="246.0" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <rect x="615.0" y="280.0" width="230.0" height="60.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="730.0" y="308.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">communities</text>
  <text x="730.0" y="324.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">social and cultural values</text>
  <line x1="615.0" y1="310.0" x2="510.0" y2="246.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="60.0" y="385.0" width="780.0" height="66.0" rx="8" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="158.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">fairness</text>
  <text x="158.0" y="432.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">no discrimination</text>
  <text x="353.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">accountability</text>
  <text x="353.0" y="432.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">someone is responsible</text>
  <text x="548.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">transparency</text>
  <text x="548.0" y="432.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">decisions can be explained</text>
  <text x="743.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">safety</text>
  <text x="743.0" y="432.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">no harm to users</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
