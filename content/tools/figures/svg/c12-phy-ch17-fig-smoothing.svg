  <text x="450.0" y="395.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ripple voltage V</tspan><tspan dy="4.8" font-size="10.5">ripple</tspan><tspan dy="-4.8"> = I</tspan><tspan dy="4.8" font-size="10.5">DC</tspan><tspan dy="-4.8"> / (f</tspan><tspan dy="4.8" font-size="10.5">ripple</tspan><tspan dy="-4.8"> C) = I</tspan><tspan dy="4.8" font-size="10.5">DC</tspan><tspan dy="-4.8"> / (2fC)   (full wave: f</tspan><tspan dy="4.8" font-size="10.5">ripple</tspan><tspan dy="-4.8"> = 2f)</tspan></text>
  <text x="450.0" y="430.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">A larger capacitor or a smaller load current gives less ripple.</text>
