  <text x="500.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700">2</text>
  <text x="500.0" y="290.0" font-family="Consolas, 'Courier New', monospace" font-size="30" fill="#b91c1c" text-anchor="middle" font-weight="700">-3</text>
  <rect x="590.0" y="150.0" width="180.0" height="90.0" rx="0" stroke="#111111" stroke-width="2.6" fill="#fff1dc"/>
