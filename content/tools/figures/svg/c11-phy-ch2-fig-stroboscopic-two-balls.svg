  <!-- Interesting Information (C11-PHY, PDF p35): stroboscopic photograph of two balls released together from a mechanism at the top left: the red ball drops straight down while the yellow ball is projected horizontally; at every flash both balls are at the same level, against a black background ruled with horizontal white lines. Flat drawing after the printed photograph. No photograph is reproduced. -->
