<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 27.14 and 27.17: genome, chromosome, gene, DNA and codon; and DNA copied by replication (DNA polymerase), transcribed into mRNA (RNA polymerase) in the nucleus, and translated into protein at ribosomes with tRNA. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">From DNA to protein</text>
  <rect x="15.0" y="55.0" width="870.0" height="170.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">where genetic information is stored</text>
  <rect x="20.0" y="95.0" width="160.0" height="100.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ccfbf1"/>
  <text x="100.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">genome</text>
  <text x="100.0" y="155.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">all the DNA,</text>
  <text x="100.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">in the nucleus</text>
  <line x1="182.0" y1="145.0" x2="186.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M193.0 145.0 L185.7 148.4 L185.7 141.6 Z" fill="#14181f"/>
  <rect x="195.0" y="95.0" width="160.0" height="100.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ccfbf1"/>
  <text x="275.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">chromosome</text>
  <text x="275.0" y="155.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">23 pairs in a</text>
  <text x="275.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">human cell</text>
  <line x1="357.0" y1="145.0" x2="361.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M368.0 145.0 L360.7 148.4 L360.7 141.6 Z" fill="#14181f"/>
  <rect x="370.0" y="95.0" width="160.0" height="100.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ccfbf1"/>
  <text x="450.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">gene</text>
  <text x="450.0" y="155.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a section of DNA</text>
  <text x="450.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">for one protein</text>
  <line x1="532.0" y1="145.0" x2="536.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M543.0 145.0 L535.7 148.4 L535.7 141.6 Z" fill="#14181f"/>
  <rect x="545.0" y="95.0" width="160.0" height="100.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ccfbf1"/>
  <text x="625.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">DNA</text>
  <text x="625.0" y="155.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bases on a sugar-</text>
  <text x="625.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">phosphate chain</text>
  <line x1="707.0" y1="145.0" x2="711.6" y2="145.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M718.0 145.0 L710.7 148.4 L710.7 141.6 Z" fill="#14181f"/>
  <rect x="720.0" y="95.0" width="160.0" height="100.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ccfbf1"/>
  <text x="800.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">codon</text>
  <text x="800.0" y="155.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">three bases code</text>
  <text x="800.0" y="172.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">for one amino acid</text>
  <rect x="15.0" y="235.0" width="870.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="265.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the flow of information</text>
  <rect x="50.0" y="360.0" width="140.0" height="50.0" rx="10" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="120.0" y="391.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700">DNA</text>
  <rect x="230.0" y="360.0" width="140.0" height="50.0" rx="10" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="300.0" y="391.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700">DNA</text>
  <rect x="430.0" y="360.0" width="140.0" height="50.0" rx="10" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="500.0" y="391.0" font-size="16" fill="#d98b2b" text-anchor="middle" font-weight="700">mRNA</text>
  <rect x="660.0" y="360.0" width="140.0" height="50.0" rx="10" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="730.0" y="391.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700">protein</text>
  <line x1="190.0" y1="385.0" x2="222.0" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230.0 385.0 L220.9 389.2 L220.9 380.8 Z" fill="#14181f"/>
  <text x="210.0" y="345.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">replication</text>
  <text x="210.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">DNA polymerase</text>
  <line x1="370.0" y1="385.0" x2="422.0" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M430.0 385.0 L420.9 389.2 L420.9 380.8 Z" fill="#14181f"/>
  <text x="400.0" y="345.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">transcription</text>
  <text x="400.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">RNA polymerase</text>
  <line x1="570.0" y1="385.0" x2="652.0" y2="385.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M660.0 385.0 L650.9 389.2 L650.9 380.8 Z" fill="#14181f"/>
  <text x="615.0" y="345.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">translation</text>
  <text x="615.0" y="432.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ribosome + tRNA</text>
  <text x="210.0" y="470.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">in the nucleus</text>
  <text x="610.0" y="470.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">in the cytoplasm, at ribosomes</text>
  <text x="450.0" y="510.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mRNA carries the copy of a gene; tRNA brings amino acids in the order of the codons</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
