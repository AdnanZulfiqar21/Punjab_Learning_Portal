<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="'Times New Roman', Times, serif">
  <!-- Order of the product AB (C11-MATH, PDF p56): Order of A m x n, Order of B n x p, Order of AB m x p in pale blue boxes, with curved magenta arrows from m to m and from p to p. Original drawing after the printed figure. -->
  <rect width="1100" height="400" fill="#ffffff"/>
  <text x="60" y="114" font-size="48.0" text-anchor="start" fill="#1a1a1a">Order of <tspan font-style="italic">A</tspan></text>
  <rect x="610" y="60" width="200" height="78" fill="#cfe6f6"/>
  <text x="710" y="116" font-size="52.8" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">m</tspan>× <tspan font-style="italic">n</tspan></text>
  <text x="60" y="229" font-size="48.0" text-anchor="start" fill="#1a1a1a">Order of <tspan font-style="italic">B</tspan></text>
  <rect x="610" y="175" width="200" height="78" fill="#cfe6f6"/>
  <text x="710" y="231" font-size="52.8" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">n</tspan>× <tspan font-style="italic">p</tspan></text>
  <text x="60" y="344" font-size="48.0" text-anchor="start" fill="#1a1a1a">Order of <tspan font-style="italic">AB</tspan></text>
  <rect x="610" y="290" width="200" height="78" fill="#cfe6f6"/>
  <text x="710" y="346" font-size="52.8" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">m</tspan>× <tspan font-style="italic">p</tspan></text>
  <path d="M600 70 C 470 90, 470 300, 590 325" stroke="#e0197d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M604 330 L580.2 333.9 L588.1 325.7 L585.3 314.7 Z" fill="#e0197d"/>
  <path d="M830 175 C 960 175, 960 320, 830 330" stroke="#e0197d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M822 331 L843.6 320.3 L838.5 330.4 L844.3 340.1 Z" fill="#e0197d"/>
</svg>
