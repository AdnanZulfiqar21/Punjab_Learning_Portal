<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Inter, Arial, sans-serif">
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<text x="90" y="180" font-size="30" fill="#1f2937">Order of A</text>
<rect x="430" y="138" width="170" height="56" rx="8" fill="#e6f2fa" stroke="#1d7fb8" stroke-width="2"/>
<text x="465" y="180" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">m</text>
<text x="515" y="180" font-size="30" fill="#1f2937" text-anchor="middle">×</text>
<text x="565" y="180" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">n</text>
<text x="90" y="310" font-size="30" fill="#1f2937">Order of B</text>
<rect x="430" y="268" width="170" height="56" rx="8" fill="#e6f2fa" stroke="#1d7fb8" stroke-width="2"/>
<text x="465" y="310" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">n</text>
<text x="515" y="310" font-size="30" fill="#1f2937" text-anchor="middle">×</text>
<text x="565" y="310" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">p</text>
<text x="90" y="440" font-size="30" fill="#1f2937">Order of AB</text>
<rect x="430" y="398" width="170" height="56" rx="8" fill="#e6f2fa" stroke="#1d7fb8" stroke-width="2"/>
<text x="465" y="440" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">m</text>
<text x="515" y="440" font-size="30" fill="#1f2937" text-anchor="middle">×</text>
<text x="565" y="440" font-size="32" font-style="italic" fill="#1f2937" text-anchor="middle">p</text>
<path d="M 425 165 C 330 200, 330 400, 420 428" fill="none" stroke="#e0457b" stroke-width="4"/>
<polygon points="428,431 408,438 413,418" fill="#e0457b"/>
<path d="M 605 296 C 680 320, 680 410, 608 428" fill="none" stroke="#e0457b" stroke-width="4"/>
<polygon points="600,431 616,417 620,437" fill="#e0457b"/>
<ellipse cx="565" cy="178" rx="28" ry="26" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5"/>
<ellipse cx="465" cy="308" rx="28" ry="26" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="590" y1="190" x2="680" y2="230" stroke="#16a34a" stroke-width="2"/>
<line x1="490" y1="300" x2="680" y2="245" stroke="#16a34a" stroke-width="2"/>
<text x="690" y="236" font-size="24" fill="#16a34a">equal</text>
<text x="400" y="540" font-size="24" fill="#1f2937" text-anchor="middle">columns of A = rows of B; AB takes rows of A, columns of B</text>
</svg>
