  <text x="320.0" y="436.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <text x="380.0" y="436.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">4 spermatids</text>
  <ellipse cx="140.0" cy="480.0" rx="8.0" ry="12.0" stroke="#1f6fb5" stroke-width="1.5" fill="#bfdbfe"/>
  <path d="M140 492 Q146 510 140 528 Q134 546 140 560" stroke="#1f6fb5" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
