<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 17.2 and 17.5: spermatogenesis from germline cell to four sperms, the parts of a sperm, and oogenesis from oogonium to one ovum and polar bodies. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making sperm and eggs (spermatogenesis and oogenesis)</text>
  <rect x="15.0" y="55.0" width="430.0" height="570.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">spermatogenesis (testis)</text>
  <circle cx="230.0" cy="110.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="230.0" y="114.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2n</text>
  <text x="265.0" y="106.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">germline cell</text>
  <text x="265.0" y="122.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">(mitosis)</text>
  <line x1="230.0" y1="134.0" x2="230.0" y2="159.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 166.0 L226.6 158.7 L233.4 158.7 Z" fill="#14181f"/>
