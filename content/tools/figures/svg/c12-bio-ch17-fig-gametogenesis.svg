  <text x="265.0" y="276.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">primary spermatocyte</text>
  <text x="150.0" y="318.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">meiosis I</text>
  <line x1="230.0" y1="300.0" x2="175.5" y2="332.7" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M170.0 336.0 L174.5 329.4 L178.0 335.2 Z" fill="#7c3aed"/>
  <circle cx="170.0" cy="356.0" r="18.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="170.0" y="360.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <line x1="230.0" y1="300.0" x2="284.5" y2="332.7" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M290.0 336.0 L282.0 335.2 L285.5 329.4 Z" fill="#7c3aed"/>
  <circle cx="290.0" cy="356.0" r="18.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="290.0" y="360.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <text x="380.0" y="360.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">secondary</text>
  <text x="380.0" y="374.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">spermatocytes</text>
  <text x="100.0" y="404.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">meiosis II</text>
  <line x1="170.0" y1="376.0" x2="143.3" y2="413.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
