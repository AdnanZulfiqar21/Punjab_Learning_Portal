  <circle cx="200.0" cy="432.0" r="13.0" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="200.0" y="436.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <line x1="290.0" y1="376.0" x2="263.3" y2="413.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M260.0 418.0 L261.3 411.1 L266.1 414.6 Z" fill="#7c3aed"/>
  <circle cx="260.0" cy="432.0" r="13.0" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="260.0" y="436.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <line x1="290.0" y1="376.0" x2="316.7" y2="413.4" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M320.0 418.0 L313.9 414.6 L318.7 411.1 Z" fill="#7c3aed"/>
