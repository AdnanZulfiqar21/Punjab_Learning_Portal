  <path d="M320 492 Q326 510 320 528 Q314 546 320 560" stroke="#1f6fb5" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="380.0" y="484.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">4 sperms</text>
  <rect x="30.0" y="572.0" width="400.0" height="44.0" rx="6" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
  <ellipse cx="70.0" cy="594.0" rx="18.0" ry="12.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <path d="M52 594 Q56 580 70 582 Q84 580 88 594" stroke="#d7322f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="88.0" y="588.0" width="40.0" height="12.0" rx="4" stroke="#d98b2b" stroke-width="1.5" fill="#fed7aa"/>
  <path d="M128 594 Q160 584 190 594 Q220 604 250 594" stroke="#1f6fb5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="260.0" y="590.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">head (acrosome red), midpiece</text>
  <text x="260.0" y="604.0" font-size="11" fill="#14181f" text-anchor="start" font-weight="700">(mitochondria), tail</text>
  <rect x="460.0" y="55.0" width="425.0" height="570.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">oogenesis (ovary)</text>
  <circle cx="640.0" cy="110.0" r="22.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <text x="640.0" y="114.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2n</text>
  <text x="675.0" y="106.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">oogonium</text>
  <text x="675.0" y="122.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">(mitosis, before birth)</text>
  <line x1="640.0" y1="134.0" x2="640.0" y2="159.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M640.0 166.0 L636.6 158.7 L643.4 158.7 Z" fill="#14181f"/>
  <circle cx="640.0" cy="196.0" r="28.0" stroke="#be185d" stroke-width="2" fill="#fbcfe8"/>
  <text x="640.0" y="200.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2n</text>
  <text x="680.0" y="190.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">primary oocyte: stops</text>
  <text x="680.0" y="206.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">in prophase I until puberty</text>
  <text x="560.0" y="250.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">meiosis I</text>
  <line x1="640.0" y1="226.0" x2="622.0" y2="279.9" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M620.0 286.0 L619.1 278.1 L625.5 280.2 Z" fill="#7c3aed"/>
  <line x1="660.0" y1="222.0" x2="734.5" y2="266.7" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M740.0 270.0 L732.0 269.2 L735.5 263.4 Z" fill="#7c3aed"/>
  <circle cx="610.0" cy="310.0" r="26.0" stroke="#be185d" stroke-width="2" fill="#f9a8d4"/>
  <text x="610.0" y="314.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <circle cx="750.0" cy="280.0" r="9.0" stroke="#4b5563" stroke-width="1.5" fill="#f1f5f9"/>
  <text x="765.0" y="284.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">first polar body</text>
  <text x="690.0" y="326.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">secondary oocyte: stops</text>
  <text x="690.0" y="342.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">in metaphase II; released</text>
  <text x="690.0" y="358.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">at ovulation</text>
  <text x="700.0" y="404.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">if a sperm enters:</text>
  <text x="700.0" y="420.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">meiosis II</text>
  <line x1="610.0" y1="340.0" x2="610.0" y2="437.6" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M610.0 444.0 L606.6 436.7 L613.4 436.7 Z" fill="#7c3aed"/>
  <line x1="628.0" y1="332.0" x2="691.2" y2="460.3" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M694.0 466.0 L687.8 461.0 L693.8 458.0 Z" fill="#7c3aed"/>
  <circle cx="610.0" cy="476.0" r="30.0" stroke="#be185d" stroke-width="2" fill="#f472b6"/>
  <text x="610.0" y="480.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1n</text>
  <circle cx="702.0" cy="476.0" r="8.0" stroke="#4b5563" stroke-width="1.5" fill="#f1f5f9"/>
  <text x="716.0" y="480.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">second polar body</text>
  <text x="610.0" y="528.0" font-size="13" fill="#be185d" text-anchor="middle" font-weight="700">ovum</text>
  <text x="672.0" y="570.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">one oogonium gives one ovum; one</text>
  <text x="672.0" y="588.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">spermatogonium gives four sperms</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
