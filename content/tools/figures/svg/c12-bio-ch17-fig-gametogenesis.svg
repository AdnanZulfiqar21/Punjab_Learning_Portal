  <text x="265.0" y="194.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">spermatogonium</text>
  <line x1="230.0" y1="214.0" x2="230.0" y2="239.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 246.0 L226.6 238.7 L233.4 238.7 Z" fill="#14181f"/>
  <circle cx="230.0" cy="272.0" r="26.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
