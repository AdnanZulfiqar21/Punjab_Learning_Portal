<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="615" fill="#ffffff"/>
  <!-- Answer figure (original): blood group A (IAi) x blood group B (IBi), Punnett square. -->
  <text x="225" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Father: group A (I<tspan dy="-10.9" font-size="17.7">A</tspan><tspan dy="10.9">i)</tspan></text>
  <text x="450" y="54" font-size="34" text-anchor="middle" font-weight="700" fill="#14181f">&#215;</text>
  <text x="675" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Mother: group B (I<tspan dy="-10.9" font-size="17.7">B</tspan><tspan dy="10.9">i)</tspan></text>
  <text x="560" y="118" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563">Gametes of mother</text>
  <text x="232" y="335" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563" transform="rotate(-90 232 335)">Gametes of father</text>
  <circle cx="445.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">I<tspan dy="-10.9" font-size="17.7">B</tspan><tspan dy="10.9"> </tspan></text>
  <circle cx="675.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">i</text>
  <circle cx="290" cy="275.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="284.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">I<tspan dy="-10.9" font-size="17.7">A</tspan><tspan dy="10.9"> </tspan></text>
  <circle cx="290" cy="395.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="404.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">i</text>
  <rect x="330" y="215" width="230" height="120" fill="#efe7fd" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">I<tspan dy="-12.6" font-size="20.4">A</tspan><tspan dy="12.6">I</tspan><tspan dy="-12.6" font-size="20.4">B</tspan><tspan dy="12.6"> </tspan></text>
  <text x="445.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Group AB</text>
  <rect x="560" y="215" width="230" height="120" fill="#dbe9f5" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">I<tspan dy="-12.6" font-size="20.4">A</tspan><tspan dy="12.6">i</tspan></text>
  <text x="675.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Group A</text>
  <rect x="330" y="335" width="230" height="120" fill="#e6f4ef" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">I<tspan dy="-12.6" font-size="20.4">B</tspan><tspan dy="12.6">i</tspan></text>
  <text x="445.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Group B</text>
  <rect x="560" y="335" width="230" height="120" fill="#fff7cc" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">ii</text>
  <text x="675.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Group O</text>
  <text x="450.0" y="515" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Four children, four blood groups:</text>
  <text x="450.0" y="555" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">AB : A : B : O = 1 : 1 : 1 : 1</text>
</svg>
