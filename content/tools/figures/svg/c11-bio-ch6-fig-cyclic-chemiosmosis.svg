<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.10 and 5.11: cyclic photophosphorylation, and chemiosmosis across the thylakoid membrane. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .n{font-size:18px;fill:#14181f;text-anchor:middle;font-weight:700}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <!-- cyclic -->
  <text class="h" x="280" y="40">Cyclic photophosphorylation</text>
  <text class="s" x="280" y="70">PS-I only; electrons return to P700; ATP but no NADPH, no O2</text>
  <rect x="200" y="500" width="130" height="70" rx="12" fill="#5b3fb5"/><text class="b" x="265" y="530">PS-I</text><text class="b" x="265" y="554">P700</text>
  <rect x="200" y="150" width="130" height="50" rx="10" fill="#d98b2b"/><text class="b" x="265" y="182">acceptor</text>
  <path d="M265 495 L265 205" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g stroke="#f2b134" stroke-width="5" marker-end="url(#ary)"><path d="M120 420 L200 520"/></g><text class="n" x="100" y="410">light</text>
  <!-- loop through carriers back to P700 -->
  <path d="M335 175 q180 20 180 180 q0 160 -175 170" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g fill="#9ca3af"><circle cx="470" cy="230" r="18"/><circle cx="515" cy="355" r="18"/><circle cx="470" cy="480" r="18"/></g>
  <text class="s" x="530" y="235" style="text-anchor:start">electron transport chain</text>
  <rect x="560" y="560" width="70" height="34" rx="8" fill="#0f7a62"/><text class="b" x="595" y="584">ATP</text>
  <path d="M500 500 L560 570" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="s" x="280" y="660">happens when the Calvin cycle slows and NADPH accumulates</text>
  <!-- chemiosmosis -->
  <text class="h" x="880" y="40">Chemiosmosis in the thylakoid</text>
  <text class="s" x="880" y="70">electron transport pumps H+ into the lumen;</text><text class="s" x="880" y="94">H+ flows back out through ATP synthase</text>
  <text class="s" x="880" y="150">stroma (low H+)</text>
  <rect x="620" y="300" width="520" height="130" fill="#dbe9f5"/>
  <rect x="620" y="300" width="520" height="16" fill="#1f6fb5"/><rect x="620" y="414" width="520" height="16" fill="#1f6fb5"/>
  <text class="s" x="880" y="560">thylakoid lumen (high H+)</text>
  <!-- carriers pumping H+ -->
  <rect x="660" y="310" width="90" height="110" rx="10" fill="#0f7a62"/><text class="b" x="705" y="358" style="font-size:16px">PS-II</text>
  <rect x="780" y="310" width="90" height="110" rx="10" fill="#9ca3af"/><text class="b" x="825" y="352" style="font-size:15px">cyt</text><text class="b" x="825" y="372" style="font-size:15px">complex</text>
  <rect x="900" y="310" width="90" height="110" rx="10" fill="#5b3fb5"/><text class="b" x="945" y="358" style="font-size:16px">PS-I</text>
  <path d="M750 365 H775 M870 365 H895" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M825 250 L825 300" stroke="#d7322f" stroke-width="4" marker-end="url(#ar)"/><text class="n" x="825" y="240" style="fill:#d7322f">H+</text>
  <path d="M705 445 L705 490" stroke="#d7322f" stroke-width="3" marker-end="url(#ar)"/><text class="n" x="705" y="515" style="fill:#d7322f">H+ from photolysis</text>
  <g fill="#d7322f" font-size="16" font-weight="700" text-anchor="middle"><text x="760" y="480">H+</text><text x="860" y="500">H+</text><text x="960" y="480">H+</text><text x="1040" y="500">H+</text></g>
  <!-- ATP synthase -->
  <path d="M1040 300 h60 v130 h-60 z" fill="#d98b2b"/><circle cx="1070" cy="290" r="26" fill="#d98b2b"/>
  <text class="n" x="1070" y="475">ATP synthase</text>
  <path d="M1070 490 L1070 330" stroke="#d7322f" stroke-width="5" marker-end="url(#ar)"/>
  <text class="n" x="1070" y="230">ADP + Pi to ATP</text>
  <text class="s" x="880" y="620">the H+ gradient stores potential energy;</text><text class="s" x="880" y="646">its flow through ATP synthase bonds Pi to ADP</text>
  <text class="s" x="600" y="720">Mitochondria and chloroplasts make ATP by the same chemiosmotic mechanism.</text>
</svg>
