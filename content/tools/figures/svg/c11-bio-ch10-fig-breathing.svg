<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 10.7: inspiration and expiration. Schematic chest with diaphragm and rib cage. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- inspiration -->
  <text class="h" x="300" y="40">Inspiration (breathing in)</text>
  <path d="M300 80 v60" stroke="#b5463a" stroke-width="14"/>
  <rect x="150" y="140" width="300" height="260" rx="40" fill="#fff4e2" stroke="#8a4b00" stroke-width="5"/>
  <g stroke="#c9b27a" stroke-width="6" fill="none"><path d="M160 190 h280 M160 240 h280 M160 290 h280 M160 340 h280"/></g>
  <path d="M190 160 q-40 100 0 220 q110 40 220 0 q40 -120 0 -220 q-110 -30 -220 0 z" fill="#f6d5cf" stroke="#b5463a" stroke-width="4" opacity="0.9"/>
  <path d="M150 400 q150 10 300 0" stroke="#0f7a62" stroke-width="8" fill="none"/>
  <g stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"><path d="M300 420 v40"/><path d="M130 270 h-40"/><path d="M470 270 h40"/><path d="M300 50 v40" stroke="#1f6fb5"/></g>
  <text class="s" x="300" y="490">diaphragm contracts and flattens</text>
  <text class="s" x="300" y="520">intercostal muscles contract: ribs rise, rib cage expands</text>
  <text class="s" x="300" y="550">thorax larger; lungs expand with it (pleurae adhere)</text>
  <text class="s" x="300" y="580">pressure in the lungs falls below atmospheric: air flows in</text>
  <!-- expiration -->
  <text class="h" x="900" y="40">Expiration (breathing out)</text>
  <path d="M900 80 v60" stroke="#b5463a" stroke-width="14"/>
  <rect x="770" y="140" width="260" height="240" rx="40" fill="#fff4e2" stroke="#8a4b00" stroke-width="5"/>
  <g stroke="#c9b27a" stroke-width="6" fill="none"><path d="M780 185 h240 M780 230 h240 M780 275 h240 M780 320 h240"/></g>
  <path d="M815 160 q-25 80 0 170 q85 30 170 0 q25 -90 0 -170 q-85 -25 -170 0 z" fill="#f6d5cf" stroke="#b5463a" stroke-width="4" opacity="0.9"/>
  <path d="M770 380 q130 -70 260 0" stroke="#0f7a62" stroke-width="8" fill="none"/>
  <g stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"><path d="M900 400 v-40"/><path d="M740 270 h30"/><path d="M1060 270 h-30"/><path d="M900 90 v-40" stroke="#1f6fb5"/></g>
  <text class="s" x="900" y="490">diaphragm relaxes and domes upward</text>
  <text class="s" x="900" y="520">intercostal muscles relax: ribs lower, rib cage moves in</text>
  <text class="s" x="900" y="550">thorax smaller; the stretched lungs recoil</text>
  <text class="s" x="900" y="580">pressure in the lungs rises above atmospheric: air flows out</text>
  <text class="s" x="600" y="625">Green: diaphragm. Cream bars: ribs. Pink: lungs. Each breath is started by the respiratory centre in the medulla oblongata.</text>
</svg>
