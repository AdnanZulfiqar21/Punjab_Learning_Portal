<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <!-- Figure 18.12 (Class XII Chemistry, PDF page 32): geometrical isomers of [Co(NH3)4(H2O)2]3+. The book prints four drawings, of which (i), (ii) and (iv) are the same cis isomer; drawn as the two real isomers, cis (book's i) and trans (book's iii). -->
  <text x="500.0" y="46.0" font-size="30" fill="#d1206b" text-anchor="middle" font-weight="700"><tspan dy="0.0">OCTAHEDRAL COMPLEX ION</tspan></text>
  <line x1="260.0" y1="210.0" x2="260.0" y2="148.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M200.0 210.0 L390.0 210.0 L320.0 310.0 L130.0 310.0 Z" stroke="#14181f" stroke-width="3.5" fill="#fbef9f" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="260.0" y1="210.0" x2="260.0" y2="244.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="260.0" y1="310.0" x2="260.0" y2="372.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="260.0" y="271.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Co</tspan></text>
  <text x="260.0" y="138.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0">O</tspan></text>
  <text x="260.0" y="406.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">NH</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <text x="194.0" y="212.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0">N</tspan></text>
  <text x="396.0" y="212.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">OH</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"></tspan></text>
  <text x="326.0" y="332.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">NH</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <text x="124.0" y="332.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0">N</tspan></text>
  <text x="260" y="456" font-size="30" fill="#d1206b" text-anchor="middle" font-weight="700"><tspan font-style="italic">cis</tspan>-isomer</text>
  <line x1="740.0" y1="210.0" x2="740.0" y2="148.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M680.0 210.0 L870.0 210.0 L800.0 310.0 L610.0 310.0 Z" stroke="#14181f" stroke-width="3.5" fill="#fbef9f" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="740.0" y1="210.0" x2="740.0" y2="244.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="740.0" y1="310.0" x2="740.0" y2="372.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="740.0" y="271.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Co</tspan></text>
  <text x="740.0" y="138.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">NH</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <text x="740.0" y="406.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">NH</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <text x="674.0" y="212.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0">N</tspan></text>
  <text x="876.0" y="212.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">OH</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"></tspan></text>
  <text x="806.0" y="332.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">NH</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <text x="604.0" y="332.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0">O</tspan></text>
  <text x="740" y="456" font-size="30" fill="#d1206b" text-anchor="middle" font-weight="700"><tspan font-style="italic">trans</tspan>-isomer</text>
</svg>
