<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1150" height="600" fill="#ffffff"/>
  <!-- Friedel-Crafts alkylation and acylation as printed on p67: benzene + CH3CH2Cl (heat, AlCl3 catalyst) gives ethylbenzene + HCl; benzene + CH3CH2COCl (heat, AlCl3 catalyst) gives C6H5-CO-CH2CH3 + HCl. -->
  <text x="30.0" y="42.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Friedel&#8211;Crafts Alkylation</tspan></text>
  <path d="M100.0 148.0 L145.0 174.0 L145.0 226.0 L100.0 252.0 L55.0 226.0 L55.0 174.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
