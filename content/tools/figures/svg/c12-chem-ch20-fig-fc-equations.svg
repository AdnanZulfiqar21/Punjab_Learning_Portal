  <text x="530.0" y="568.2" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">catalyst</tspan></text>
  <path d="M760.0 448.0 L805.0 474.0 L805.0 526.0 L760.0 552.0 L715.0 526.0 L715.0 474.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="760.0" cy="500.0" r="30.2" stroke="#14181f" stroke-width="3" fill="none"/>
  <text x="760.0" y="414.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">C</tspan></text>
  <text x="704.0" y="380.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">O</tspan></text>
  <text x="854.0" y="380.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">CH</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="760.0" y1="448.0" x2="760.0" y2="423.1" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="743.1" y1="398.4" x2="716.8" y2="382.4" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="747.2" y1="391.6" x2="720.9" y2="375.6" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="774.5" y1="394.1" x2="802.0" y2="375.4" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="840.0" y="510.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ HCl</tspan></text>
