  <text x="840.0" y="210.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ HCl</tspan></text>
  <text x="760.0" y="295.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethylbenzene</tspan></text>
  <text x="30.0" y="362.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Friedel&#8211;Crafts Acylation</tspan></text>
  <path d="M100.0 448.0 L145.0 474.0 L145.0 526.0 L100.0 552.0 L55.0 526.0 L55.0 474.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="500.0" r="30.2" stroke="#14181f" stroke-width="3" fill="none"/>
  <text x="175.0" y="510.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ CH</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4">CH</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">COCl</tspan></text>
  <line x1="420.0" y1="500.0" x2="627.2" y2="500.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M640.0 500.0 L625.5 506.8 L625.5 493.2 Z" fill="#14181f"/>
