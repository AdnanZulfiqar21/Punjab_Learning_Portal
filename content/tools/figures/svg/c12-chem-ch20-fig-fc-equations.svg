  <text x="175.0" y="210.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ CH</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4">CH</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">Cl</tspan></text>
  <line x1="390.0" y1="200.0" x2="627.2" y2="200.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M640.0 200.0 L625.5 206.8 L625.5 193.2 Z" fill="#14181f"/>
