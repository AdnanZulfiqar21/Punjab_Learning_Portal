  <text x="515.0" y="236.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">AlCl</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"></tspan></text>
  <text x="515.0" y="268.2" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">catalyst</tspan></text>
  <path d="M760.0 148.0 L805.0 174.0 L805.0 226.0 L760.0 252.0 L715.0 226.0 L715.0 174.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="760.0" cy="200.0" r="30.2" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="760.0" y1="148.0" x2="760.0" y2="114.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
