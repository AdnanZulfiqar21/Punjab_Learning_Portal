<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 12.18 (C11-BIO, PDF p272): four numbered pictures. 1 Immobilize the affected area: gloved hands bandage an injured ankle; a woman wears an arm sling. 2 Apply ice: a hand holds an ice pack on a knee. 3 Elevate the affected limb: a man lies on a pillow with the injured arm raised and the bandaged leg resting up. 4 Seek medical attention: a doctor puts a hand on a patient's shoulder in a hospital. Clean flat drawings after the printed pictures; no photograph reproduced. -->
  <rect width="1000" height="790" fill="#ffffff"/>
  <defs>
    <clipPath id="c1"><rect x="0" y="10" width="490" height="370"/></clipPath>
    <clipPath id="c2"><rect x="505" y="10" width="495" height="370"/></clipPath>
    <clipPath id="c3"><rect x="0" y="395" width="490" height="380"/></clipPath>
    <clipPath id="c4"><rect x="505" y="395" width="495" height="380"/></clipPath>
  </defs>

  <!-- 1: immobilize -->
  <g clip-path="url(#c1)">
    <rect x="0" y="10" width="490" height="370" fill="#dbeaf6"/>
    <path d="M0 380 L0 290 L490 330 L490 380 Z" fill="#c6dcef"/>
    <!-- leg on the ground with bandaged ankle -->
    <path d="M60 300 C120 290 180 280 230 282 L240 330 C180 336 120 340 60 345 Z" fill="#3a4a6a"/>
    <path d="M230 278 L300 270 C320 268 330 285 316 300 L300 318 C290 330 265 332 240 330 Z" fill="#f4f4f4" stroke="#b8c4d0" stroke-width="2"/>
    <path d="M300 270 C320 250 340 235 352 238 C362 242 355 262 330 282 Z" fill="#f4f4f4" stroke="#b8c4d0" stroke-width="2"/>
    <path d="M250 284 L262 330 M270 280 L284 326 M290 276 L300 318" stroke="#c8d2dc" stroke-width="2"/>
    <!-- gloved hands -->
    <path d="M120 150 C130 200 150 240 200 262 L222 252 C190 220 170 190 160 140 Z" fill="#e8b48a"/>
    <path d="M190 252 C205 238 228 236 240 248 C246 262 232 280 212 284 C196 284 186 268 190 252 Z" fill="#5a8ab0" stroke="#3a6a90" stroke-width="2"/>
    <path d="M300 150 C300 200 292 240 280 262 L258 258 C268 230 270 190 266 150 Z" fill="#e8b48a"/>
    <path d="M250 254 C262 240 284 242 292 256 C296 272 282 290 262 290 C248 288 242 270 250 254 Z" fill="#5a8ab0" stroke="#3a6a90" stroke-width="2"/>
    <path d="M110 150 L175 150 L175 210 L120 210 Z" fill="#4a5a78"/>
    <path d="M250 150 L310 150 L305 210 L255 210 Z" fill="#4a5a78"/>
    <!-- woman with arm sling -->
    <path d="M360 380 L360 170 C360 130 380 105 410 100 L450 100 C478 104 490 130 490 170 L490 380 Z" fill="#e0405a"/>
    <path d="M400 100 C405 80 445 80 452 100 L440 118 L410 118 Z" fill="#f0c8a8"/>
    <path d="M396 100 L376 60 M456 100 L470 60" stroke="#e0405a" stroke-width="10"/>
    <path d="M372 180 C372 220 380 260 400 262 L470 262 C480 258 484 240 476 230 L410 230 C400 215 398 195 400 175 Z" fill="#f0c8a8"/>
    <path d="M380 236 L478 214 L486 268 L392 286 Z" fill="#c8d0dc" stroke="#8a98aa" stroke-width="2"/>
    <path d="M380 236 L450 90 M478 214 L452 92" stroke="#8a98aa" stroke-width="8"/>
  </g>
  <rect x="0" y="22" width="300" height="34" fill="#d4ccec"/>
  <text x="10" y="47" font-size="22" fill="#222">Immobilize the affected area</text>
  <circle cx="14" cy="14" r="12" fill="#3a3a7a"/><text x="14" y="21" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">1</text>

  <!-- 2: apply ice -->
  <g clip-path="url(#c2)">
    <rect x="505" y="10" width="495" height="370" fill="#cfe6b4"/>
    <path d="M505 210 C600 190 700 170 760 160 C820 150 870 180 900 230 C930 280 960 330 1000 360 L1000 380 L930 380 C900 340 870 300 840 270 C800 250 740 262 680 270 L505 300 Z" fill="#a8603a"/>
    <path d="M505 160 L560 150 L560 200 L505 210 Z" fill="#4a4a6a"/>
    <!-- ice pack -->
    <path d="M700 120 C760 100 830 110 870 140 C880 180 870 220 840 240 C790 262 730 258 700 230 C680 200 684 150 700 120 Z" fill="#f4f6fa" stroke="#b0b8c8" stroke-width="3"/>
    <g fill="#dfe6f2" stroke="#b8c2d4" stroke-width="1.5"><rect x="730" y="150" width="22" height="18" rx="4"/><rect x="760" y="140" width="24" height="18" rx="4"/><rect x="790" y="160" width="22" height="20" rx="4"/><rect x="742" y="182" width="24" height="18" rx="4"/><rect x="774" y="196" width="22" height="18" rx="4"/><rect x="810" y="190" width="22" height="18" rx="4"/></g>
    <!-- hand -->
    <path d="M720 120 C760 90 820 80 860 92 L1000 60 L1000 120 L880 140 C850 150 800 150 760 140 C740 136 722 132 720 120 Z" fill="#f2c8a8" stroke="#c89878" stroke-width="2"/>
    <path d="M760 112 C780 106 800 106 820 110 M770 128 C790 124 810 124 830 128" stroke="#c89878" stroke-width="2" fill="none"/>
    <path d="M940 10 L1000 10 L1000 70 L930 84 Z" fill="#cfe8e4" stroke="#8ab0aa" stroke-width="2"/>
  </g>
  <rect x="505" y="22" width="300" height="34" fill="#d4ccec"/>
  <text x="515" y="47" font-size="22" fill="#222">Apply ice</text>
  <circle cx="519" cy="14" r="12" fill="#3a3a7a"/><text x="519" y="21" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">2</text>

  <!-- 3: elevate -->
  <g clip-path="url(#c3)">
    <rect x="0" y="395" width="490" height="380" fill="#e2eef8"/>
    <path d="M150 440 C200 420 280 420 330 440 C350 460 340 490 320 500 L160 500 C130 490 130 455 150 440 Z" fill="#ffffff" stroke="#c8d4e0" stroke-width="3"/>
    <!-- man lying -->
    <path d="M150 540 C160 500 200 488 240 492 C280 496 330 510 360 540 C380 570 360 610 320 620 L170 620 C140 600 140 570 150 540 Z" fill="#b8784a"/>
    <circle cx="230" cy="470" r="36" fill="#b8784a"/>
    <path d="M196 456 C200 430 250 424 266 450 C250 444 220 444 196 456 Z" fill="#2a1a10"/>
    <path d="M150 540 C120 520 80 490 60 470 L74 452 C100 470 140 498 168 515 Z" fill="#b8784a"/>
    <path d="M60 470 L40 440 L58 432 L76 452 Z" fill="#a8d4ec" stroke="#6a9ab8" stroke-width="2"/>
    <path d="M0 470 L50 452 L60 470 L0 492 Z" fill="#f2c8a8"/>
    <circle cx="44" cy="424" r="16" fill="#b8784a"/>
    <!-- raised leg -->
    <path d="M140 700 C220 690 300 690 360 700 L370 730 C300 730 220 730 150 740 Z" fill="#c8844a"/>
    <path d="M330 690 L420 680 C440 680 450 700 436 716 L360 730 Z" fill="#a8d4ec" stroke="#6a9ab8" stroke-width="2"/>
    <path d="M420 680 C440 670 460 676 470 690 L440 716 Z" fill="#f2c8a8"/>
    <path d="M340 735 L470 718 L490 760 L350 775 Z" fill="#ffffff" stroke="#c8d4e0" stroke-width="2"/>
  </g>
  <rect x="0" y="736" width="300" height="34" fill="#d4ccec"/>
  <text x="10" y="761" font-size="22" fill="#222">Elevate the affected limb</text>
  <circle cx="14" cy="722" r="12" fill="#3a3a7a"/><text x="14" y="729" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">3</text>

  <!-- 4: medical attention -->
  <g clip-path="url(#c4)">
    <rect x="505" y="395" width="495" height="380" fill="#d8dce2"/>
    <rect x="505" y="395" width="495" height="40" fill="#7a8494"/>
    <g stroke="#b8bec8" stroke-width="3"><path d="M760 440 L760 620 M800 440 L800 620 M840 440 L840 620 M880 440 L880 620 M920 440 L920 620 M960 440 L960 620"/></g>
    <rect x="530" y="450" width="80" height="80" fill="#1a3a8a"/>
    <path d="M570 460 L600 490 L570 520 L540 490 Z" fill="#ffffff" stroke="#c82020" stroke-width="4"/>
    <circle cx="570" cy="490" r="9" fill="#c82020"/>
    <!-- doctor -->
    <path d="M800 775 L800 620 C800 580 830 560 870 560 L920 560 C960 560 990 590 1000 620 L1000 775 Z" fill="#6a8ac8"/>
    <path d="M860 560 L885 620 L910 560 Z" fill="#e8eef8"/>
    <circle cx="885" cy="510" r="40" fill="#f2c8a8"/>
    <path d="M845 500 C845 460 925 455 928 500 C910 486 870 484 845 500 Z" fill="#5a3a22"/>
    <path d="M800 620 C760 600 720 590 690 590 L688 612 C720 616 760 626 800 650 Z" fill="#6a8ac8"/>
    <path d="M664 584 C680 576 700 584 702 596 C700 612 680 618 666 612 Z" fill="#f2c8a8"/>
    <!-- patient -->
    <path d="M560 775 L560 680 C560 640 600 610 650 608 L720 608 C770 612 800 650 800 690 L800 775 Z" fill="#7ac8a0"/>
    <path d="M640 608 L680 650 L720 608" stroke="#4a9a74" stroke-width="5" fill="none"/>
    <circle cx="680" cy="555" r="44" fill="#f2c8a8"/>
    <path d="M636 548 C632 500 720 494 726 545 C706 528 664 526 636 548 Z" fill="#5a3a22"/>
    <path d="M660 560 L674 560 M690 560 L704 560" stroke="#3a2a1a" stroke-width="3"/>
  </g>
  <rect x="505" y="736" width="300" height="34" fill="#d4ccec"/>
  <text x="515" y="761" font-size="22" fill="#222">Seek medical attention</text>
  <circle cx="519" cy="722" r="12" fill="#3a3a7a"/><text x="519" y="729" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">4</text>
</svg>
