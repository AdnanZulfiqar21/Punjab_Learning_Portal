<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original sketch for Example 30.2: signals at 3.9 ppm (2H, quartet), 2.2 ppm (3H, singlet) and 1.3 ppm (3H, triplet) fit ethyl ethanoate, CH3-CO-O-CH2-CH3. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Example 30.2: deducing the structure of an ester</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">sketch of the spectrum from the book's values</text>
  <line x1="80.0" y1="255.0" x2="840.0" y2="255.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="80.0" y1="255.0" x2="80.0" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80.0" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <line x1="206.7" y1="255.0" x2="206.7" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="206.7" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <line x1="333.3" y1="255.0" x2="333.3" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="333.3" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <line x1="460.0" y1="255.0" x2="460.0" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460.0" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <line x1="586.7" y1="255.0" x2="586.7" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="586.7" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2</text>
  <line x1="713.3" y1="255.0" x2="713.3" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="713.3" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <line x1="840.0" y1="255.0" x2="840.0" y2="261.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="840.0" y="275.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <text x="460.0" y="293.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">chemical shift, delta (ppm)</text>
  <line x1="335.5" y1="255.0" x2="335.5" y2="231.7" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="342.5" y1="255.0" x2="342.5" y2="185.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="349.5" y1="255.0" x2="349.5" y2="185.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="356.5" y1="255.0" x2="356.5" y2="231.7" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="346.0" y="173.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">3.9, 2H, quartet</text>
  <line x1="561.3" y1="255.0" x2="561.3" y2="115.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="561.3" y="103.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">2.2, 3H, singlet</text>
  <line x1="668.3" y1="255.0" x2="668.3" y2="200.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="675.3" y1="255.0" x2="675.3" y2="145.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="682.3" y1="255.0" x2="682.3" y2="200.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="675.3" y="133.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">1.3, 3H, triplet</text>
  <rect x="15.0" y="315.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="345.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the structure: ethyl ethanoate</text>
  <text x="300.0" y="391.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="7.0" font-size="15.4">3</tspan><tspan dy="-7.0">-CO-O-CH</tspan><tspan dy="7.0" font-size="15.4">2</tspan><tspan dy="-7.0">-CH</tspan><tspan dy="7.0" font-size="15.4">3</tspan></text>
  <text x="680.0" y="355.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">CH3 next to C=O: 2.2, singlet</text>
  <text x="680.0" y="373.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">CH2 next to O: 3.9, quartet</text>
  <text x="680.0" y="391.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(3 neighbours, CH3)</text>
  <text x="680.0" y="409.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">CH3 next to CH2: 1.3, triplet</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
