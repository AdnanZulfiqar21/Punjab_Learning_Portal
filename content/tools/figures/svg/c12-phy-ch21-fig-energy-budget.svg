  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 21.12: sunlight reaches the Earth, about 30 per cent is reflected by clouds, ice and deserts, the surface and atmosphere absorb the rest and radiate infrared; some infrared escapes to space and greenhouse gases send some back down; a balance keeps the temperature steady. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Earth's energy budget (after Fig 21.12)</text>
