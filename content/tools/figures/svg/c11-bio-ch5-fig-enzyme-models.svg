<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.3 and 5.4: the lock-and-key model and the induced fit model. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .l{font-size:18px;fill:#14181f;text-anchor:middle;font-weight:700}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <!-- rigid enzyme with a square notch -->
    <g id="rigid"><path d="M-110 90 V-70 q0 -40 40 -40 h140 q40 0 40 40 V90 z M-40 -110 h80 v60 h-80 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round" fill-rule="evenodd"/></g>
    <g id="sub"><rect x="-38" y="-30" width="76" height="60" rx="4" fill="#f2b134" stroke="#8a4b00" stroke-width="5"/></g>
  </defs>
  <text class="h" x="600" y="50">Lock-and-key model (Emil Fischer, 1894)</text>
  <text class="s" x="600" y="80">the active site is rigid; only the one substrate that matches it fits, like a key in a lock</text>
  <g transform="translate(200,250)"><use href="#rigid"/><text class="l" x="0" y="50">enzyme</text></g>
  <g transform="translate(200,135)"><use href="#sub"/><text class="l" x="0" y="8">substrate</text></g>
  <path d="M340 230 H420" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g transform="translate(560,250)"><use href="#rigid"/><use href="#sub" x="0" y="-80"/><text class="l" x="0" y="50">enzyme-substrate</text><text class="l" x="0" y="74">complex</text></g>
  <path d="M700 230 H780" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g transform="translate(920,250)"><use href="#rigid"/><text class="l" x="0" y="50">enzyme unchanged</text></g>
  <g transform="translate(900,135)"><rect x="-38" y="-30" width="36" height="60" rx="4" fill="#d98b2b" stroke="#8a4b00" stroke-width="4"/><rect x="4" y="-30" width="36" height="60" rx="4" fill="#d98b2b" stroke="#8a4b00" stroke-width="4"/><text class="l" x="60" y="8" style="text-anchor:start">products</text></g>
    <!-- induced fit -->
  <text class="h" x="600" y="440">Induced fit model (Daniel Koshland, 1958)</text>
  <text class="s" x="600" y="470">the active site is flexible; binding the substrate changes the enzyme's shape so it fits and catalyses better</text>
  <!-- enzyme with a rounded, loosely matching notch -->
  <g transform="translate(200,650)"><path d="M-110 90 V-70 q0 -40 40 -40 h140 q40 0 40 40 V90 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/><path d="M-50 -110 q50 70 100 0" fill="#fff" stroke="#0f7a62" stroke-width="6"/><text class="l" x="0" y="50">enzyme, loose site</text></g>
  <g transform="translate(200,510)"><path d="M-38 -30 h76 v40 q-38 40 -76 0 z" fill="#f2b134" stroke="#8a4b00" stroke-width="5"/><text class="l" x="0" y="0">substrate</text></g>
  <path d="M340 630 H420" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- enzyme closes around the substrate -->
  <g transform="translate(560,650)"><path d="M-110 90 V-70 q0 -40 40 -40 h30 q40 70 80 0 h30 q40 0 40 40 V90 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/><path d="M-38 -140 h76 v40 q-38 40 -76 0 z" fill="#f2b134" stroke="#8a4b00" stroke-width="5"/><path d="M-70 -120 q-20 20 -10 40 M70 -120 q20 20 10 40" stroke="#0f7a62" stroke-width="4" fill="none"/><text class="l" x="0" y="50">site changes shape</text><text class="l" x="0" y="74">to grip the substrate</text></g>
  <path d="M700 630 H780" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g transform="translate(920,650)"><path d="M-110 90 V-70 q0 -40 40 -40 h140 q40 0 40 40 V90 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/><path d="M-50 -110 q50 70 100 0" fill="#fff" stroke="#0f7a62" stroke-width="6"/><text class="l" x="0" y="50">enzyme released,</text><text class="l" x="0" y="74">site relaxes</text></g>
  <g transform="translate(900,510)"><path d="M-40 -30 h36 v40 q-18 30 -36 0 z" fill="#d98b2b" stroke="#8a4b00" stroke-width="4"/><path d="M6 -30 h36 v40 q-18 30 -36 0 z" fill="#d98b2b" stroke="#8a4b00" stroke-width="4"/><text class="l" x="60" y="0" style="text-anchor:start">products</text></g>
</svg>
