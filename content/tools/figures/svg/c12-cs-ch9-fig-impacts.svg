<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: ethical, legal and environmental impacts of computing in three columns, with a note on social impact. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ethical, legal and environmental impacts of computing (after 9.5)</text>
  <rect x="25.0" y="70.0" width="270.0" height="300.0" rx="12" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="160.0" y="100.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">ethical</text>
  <text x="43.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">respect privacy and fairness</text>
  <text x="43.0" y="170.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">respect intellectual property:</text>
  <text x="43.0" y="200.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">ask before copying</text>
  <text x="43.0" y="230.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">no hacking, false news</text>
  <text x="43.0" y="260.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">or cyberbullying</text>
  <rect x="315.0" y="70.0" width="270.0" height="300.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="450.0" y="100.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">legal</text>
  <text x="333.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">GDPR (European Union):</text>
  <text x="333.0" y="170.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">consent, access, deletion</text>
  <text x="333.0" y="200.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">PECA 2016 (Pakistan):</text>
  <text x="333.0" y="230.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">hacking, identity theft,</text>
  <text x="333.0" y="260.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">online fraud, illegal access</text>
  <rect x="605.0" y="70.0" width="270.0" height="300.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="740.0" y="100.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">environmental</text>
  <text x="623.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">energy use and e-waste</text>
  <text x="623.0" y="170.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">reduce: keep devices longer</text>
  <text x="623.0" y="200.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">reuse: repair, donate</text>
  <text x="623.0" y="230.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">recycle: certified e-waste</text>
  <text x="623.0" y="260.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">collectors, not the bin</text>
  <text x="450.0" y="405.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Social impact: technology improves education, health and business, but can widen</text>
  <text x="450.0" y="423.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the digital divide and reduce privacy if used carelessly.</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
