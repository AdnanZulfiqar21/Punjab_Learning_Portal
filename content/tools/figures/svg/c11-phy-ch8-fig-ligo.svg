<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original redraw after Figure 8.9: a Michelson interferometer with two long arms, as used to detect gravitational waves. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Laser interferometer for gravitational waves (LIGO)</text>
  <rect x="40.0" y="402.0" width="60.0" height="36.0" rx="4" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="70.0" y="460.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">laser</text>
  <line x1="100.0" y1="420.0" x2="230.0" y2="420.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="204.0" y1="446.0" x2="256.0" y2="394.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <text x="216.0" y="470.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">beam splitter</text>
  <line x1="230.0" y1="420.0" x2="800.0" y2="420.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <line x1="230.0" y1="420.0" x2="230.0" y2="90.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <rect x="324.0" y="390.0" width="12.0" height="60.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <rect x="754.0" y="390.0" width="12.0" height="60.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <rect x="200.0" y="324.0" width="60.0" height="12.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <rect x="200.0" y="104.0" width="60.0" height="12.0" rx="0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="330.0" y="380.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">input mirror</text>
  <text x="760.0" y="380.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">end mirror</text>
  <text x="270.0" y="334.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">input mirror</text>
  <text x="270.0" y="114.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">end mirror</text>
  <line x1="355.4" y1="480.0" x2="734.6" y2="480.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M745.0 480.0 L733.2 485.5 L733.2 474.5 Z" fill="#4b5563"/>
  <path d="M345.0 480.0 L356.8 474.5 L356.8 485.5 Z" fill="#4b5563"/>
  <text x="545.0" y="505.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700">arm: about 4 km (Fabry-Perot cavity)</text>
  <line x1="160.0" y1="135.4" x2="160.0" y2="304.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M160.0 315.0 L154.5 303.2 L165.5 303.2 Z" fill="#4b5563"/>
  <path d="M160.0 125.0 L165.5 136.8 L154.5 136.8 Z" fill="#4b5563"/>
  <text x="150.0" y="220.0" font-size="15" fill="#4b5563" text-anchor="end" font-weight="700">arm 2</text>
  <line x1="230.0" y1="420.0" x2="230.0" y2="520.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <rect x="208.0" y="520.0" width="44.0" height="34.0" rx="4" stroke="#0f7a62" stroke-width="2.5" fill="#e6f4ef"/>
  <text x="264.0" y="544.0" font-size="15" fill="#0f7a62" text-anchor="start" font-weight="700">photodetector</text>
  <rect x="500.0" y="120.0" width="370.0" height="160.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="516.0" y="150.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">The two beams return and interfere.</text>
  <text x="516.0" y="169.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">A passing gravitational wave</text>
  <text x="516.0" y="189.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">stretches one arm and squeezes</text>
  <text x="516.0" y="208.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">the other by a tiny amount,</text>
  <text x="516.0" y="228.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">changing the pattern at the detector.</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
