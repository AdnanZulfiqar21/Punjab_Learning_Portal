<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.17 to 10.20 and topics 10.9 and 10.10: a ferrofluid with and without a magnet, its uses, and a seismometer with a magnet on a spring inside a coil. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Ferrofluids and the seismometer</text>
  <rect x="50" y="55" width="540" height="640" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Ferrofluids (10.9, Figs. 10.17, 10.18)</text>
  <path d="M90 260 H330" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M100 260 L110 256 L118 239 L127 256 L136 234 L144 256 L152 225 L161 256 L170 212 L178 256 L186 199 L195 256 L204 191 L212 256 L220 192 L229 256 L238 202 L246 256 L254 215 L263 256 L272 227 L280 256 L288 235 L297 256 L306 239 L314 256 L320 260 Z" fill="#14181f" opacity="0.85"/>
  <rect x="165" y="270" width="90" height="34" fill="#f8c8b8" stroke="#d7322f"/><text class="l" x="196" y="292">N</text>
  <text class="r" x="100" y="324">magnet below: spikes along the field lines</text>
  <path d="M380 210 Q 420 200 460 210 Q 500 220 540 210" fill="none" stroke="#14181f" stroke-width="3"/>
  <text class="r" x="380" y="236">no magnet: flat liquid</text>
  <circle cx="395" cy="140" r="7" fill="#4b5563"/><circle cx="395" cy="140" r="11" fill="none" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="425" cy="140" r="7" fill="#4b5563"/><circle cx="425" cy="140" r="11" fill="none" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="455" cy="140" r="7" fill="#4b5563"/><circle cx="455" cy="140" r="11" fill="none" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="485" cy="140" r="7" fill="#4b5563"/><circle cx="485" cy="140" r="11" fill="none" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="515" cy="140" r="7" fill="#4b5563"/><circle cx="515" cy="140" r="11" fill="none" stroke="#d98b2b" stroke-width="2"/>
  <text class="r" x="380" y="170">iron oxide grains, about</text>
  <text class="r" x="380" y="183">10 nm, coated with surfactant</text>
  <g class="t">
    <text x="70" y="360">a colloidal suspension of magnetic nanoparticles in a carrier fluid (oil or water);</text>
    <text x="70" y="377">the surfactant stops the grains clumping; viscosity, tiny size and constant motion</text>
    <text x="70" y="394">stop them settling</text>
    <text x="70" y="428">no magnet: it flows like a liquid; near a magnet the grains are magnetized, chains</text>
    <text x="70" y="445">form along the field and it acts more like a solid; magnetic forces compete with</text>
    <text x="70" y="462">surface tension and gravity, giving spikes where magnetism wins</text>
    <text x="70" y="496">first made at NASA in 1960 (as printed) from ground magnetite, to move liquids</text>
    <text x="70" y="513">in space</text>
    <text x="70" y="547">uses: rotary seals in hard drives and shaft motors; cooling and damping</text>
    <text x="70" y="564">loudspeaker voice coils; targeted drug delivery steered by magnets;</text>
    <text x="70" y="581">MRI contrast agents; damping and controlling liquid flow</text>
    <text x="70" y="615">experiment: laser printer toner (40% nanometre iron oxide) mixed with cooking oil</text>
    <text x="70" y="632">jumps towards a magnet and forms spikes on the side of the bottle</text>
  </g>
  <rect x="610" y="55" width="540" height="640" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">A seismometer (10.10, Figs. 10.19, 10.20)</text>
  <path d="M650 340 H900" stroke="#4b5563" stroke-width="5"/>
  <path d="M670 340 V110 H800" stroke="#4b5563" stroke-width="4" fill="none"/>
  <path d="M800 110 L790 112 L810 118 L790 124 L810 130 L790 136 L810 142 L790 148 L810 154 L790 160 L810 166 L790 172 L810 178 L800 184" fill="none" stroke="#14181f" stroke-width="2"/>
  <rect x="780" y="184" width="40" height="70" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/><text class="l" x="792" y="214">N</text><text class="l" x="794" y="246">S</text>
  <ellipse cx="800" cy="232" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="800" cy="244" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="800" cy="256" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="800" cy="268" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="800" cy="280" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="800" cy="292" rx="34" ry="5" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <path d="M834 260 H880 V300" stroke="#d98b2b" stroke-width="1.5" fill="none"/>
  <rect x="860" y="300" width="60" height="30" rx="4" fill="#ffffff" stroke="#4b5563"/>
  <path d="M866 315 l6 -8 l6 14 l6 -16 l6 18 l6 -12 l6 6" fill="none" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="822" y="150">spring</text>
  <text class="r" x="732" y="214">magnet</text>
  <text class="r" x="850" y="244">coil fixed to frame</text>
  <text class="r" x="926" y="320">recorder</text>
  <path d="M760 360 L840 360" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M840 360 L760 360" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="740" y="380">ground and frame shake</text>
  <g class="t">
    <text x="630" y="412">the weight (a magnet on a spring) stays nearly still by inertia while</text>
    <text x="630" y="429">the frame and coil move with the ground: the relative motion changes</text>
    <text x="630" y="446">the flux through the coil and induces an emf (Faraday's law)</text>
    <text x="630" y="463">the induced current is proportional to the velocity of the ground;</text>
    <text x="630" y="480">the signal is amplified and recorded, giving the amplitude, frequency</text>
    <text x="630" y="497">and duration of the waves, and so the location, magnitude and depth</text>
    <text x="630" y="531">buried 50 to 1000 m down in a vault: a steel tank about 1 m wide</text>
    <text x="630" y="548">and 2 m deep on a concrete pad; solar panels charge its batteries,</text>
    <text x="630" y="565">GPS gives location and the data go to a computer</text>
    <text x="630" y="599">P-waves (primary) are longitudinal; S-waves (secondary) are</text>
    <text x="630" y="616">transverse; most earthquakes come from plate tectonics</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
