  <text x="32.0" y="487.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">5  Isomerases</text>
  <text x="435.0" y="527.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">rearrange a molecule into its isomer</text>
