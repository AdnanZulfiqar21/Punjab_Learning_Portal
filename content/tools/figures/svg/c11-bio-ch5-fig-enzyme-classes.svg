  <text x="490.0" y="138.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="515.0" y="138.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="540.0" cy="133.0" r="15.0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <text x="540.0" y="138.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="540.0" y="113.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700">H</text>
  <text x="300.0" y="165.0" font-size="10" fill="#4b5563" text-anchor="middle" font-weight="400">reduced</text>
  <text x="350.0" y="165.0" font-size="10" fill="#4b5563" text-anchor="middle" font-weight="400">oxidised</text>
  <rect x="20.0" y="183.0" width="860.0" height="88.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#ffffff"/>
  <text x="32.0" y="223.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">2  Transferases</text>
  <text x="435.0" y="263.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">move a group between molecules</text>
  <text x="660.0" y="209.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">phosphotransferases</text>
  <text x="660.0" y="229.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">aminotransferases</text>
  <text x="660.0" y="249.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">acyltransferases</text>
