  <text x="505.0" y="314.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">-H</text>
  <text x="530.0" y="314.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
