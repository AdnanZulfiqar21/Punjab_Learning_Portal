  <text x="495.0" y="402.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="518.0" cy="397.0" r="7.0" stroke="#0e7490" stroke-width="1.5" fill="#67e8f9"/>
  <text x="532.0" y="402.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">(e.g. CO2)</text>
