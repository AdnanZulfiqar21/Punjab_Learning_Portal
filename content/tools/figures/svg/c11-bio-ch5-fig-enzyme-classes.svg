  <text x="660.0" y="297.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">peptidases</text>
  <text x="660.0" y="317.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">lipases</text>
  <text x="660.0" y="337.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">glycosidases</text>
