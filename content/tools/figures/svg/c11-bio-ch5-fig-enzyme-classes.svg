<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <!-- Original redraw after Figure 5.12: the six classes of enzymes with a simple picture of each reaction type and example subclasses. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The six classes of enzymes</text>
  <rect x="20.0" y="55.0" width="860.0" height="40.0" rx="0" stroke="#14181f" stroke-width="1.5" fill="#fef3c7"/>
  <text x="125.0" y="81.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">class</text>
  <text x="435.0" y="81.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">reaction type</text>
  <text x="760.0" y="81.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">examples</text>
  <rect x="20.0" y="95.0" width="860.0" height="88.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f8fafc"/>
  <text x="32.0" y="135.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">1  Oxidoreductases</text>
  <text x="435.0" y="175.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">oxidation or reduction</text>
  <text x="660.0" y="121.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">dehydrogenases</text>
  <text x="660.0" y="141.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">oxidases</text>
  <text x="660.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">reductases</text>
  <circle cx="300.0" cy="133.0" r="15.0" stroke="#15803d" stroke-width="2" fill="#86efac"/>
  <text x="300.0" y="138.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="300.0" y="113.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700">H</text>
  <text x="325.0" y="138.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="350.0" cy="133.0" r="15.0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <text x="350.0" y="138.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
