  <text x="563.0" y="226.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <rect x="20.0" y="271.0" width="860.0" height="88.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f8fafc"/>
