  <text x="510.0" y="226.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="535.0" cy="221.0" r="15.0" stroke="#6d28d9" stroke-width="2" fill="#c4b5fd"/>
  <text x="535.0" y="226.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
