<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Inter, Arial, sans-serif" font-size="26">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="540" fill="#ffffff"/>

  <!-- divider lines -->
  <line x1="180" y1="78" x2="180" y2="325" stroke="#333" stroke-width="2.5"/>
  <line x1="110" y1="220" x2="575" y2="220" stroke="#c2185b" stroke-width="2.5"/>

  <!-- first line: a | p q c d -->
  <text x="145" y="120" text-anchor="middle" font-style="italic">a</text>
  <text x="230" y="120" text-anchor="middle" font-style="italic">p</text>
  <text x="330" y="120" text-anchor="middle" font-style="italic">q</text>
  <text x="430" y="120" text-anchor="middle" font-style="italic">c</text>
  <text x="530" y="120" text-anchor="middle" font-style="italic">d</text>

  <!-- second line: boxes under q, c, d -->
  <rect x="300" y="153" width="60" height="44" fill="#fff8e1" stroke="#333" stroke-width="2"/>
  <text x="330" y="184" text-anchor="middle" font-size="24" font-style="italic">ap</text>
  <rect x="400" y="153" width="60" height="44" fill="#fff8e1" stroke="#333" stroke-width="2"/>
  <rect x="500" y="153" width="60" height="44" fill="#fff8e1" stroke="#333" stroke-width="2"/>

  <!-- third line: p and boxes -->
  <text x="230" y="300" text-anchor="middle" font-style="italic">p</text>
  <rect x="300" y="268" width="60" height="44" fill="#e3f2fd" stroke="#333" stroke-width="2"/>
  <rect x="400" y="268" width="60" height="44" fill="#e3f2fd" stroke="#333" stroke-width="2"/>
  <rect x="500" y="268" width="60" height="44" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>

  <!-- vertical (add) arrows -->
  <line x1="230" y1="132" x2="230" y2="270" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="322" y1="202" x2="322" y2="264" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="422" y1="202" x2="422" y2="264" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="522" y1="202" x2="522" y2="264" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- diagonal (multiply by a) arrows -->
  <line x1="246" y1="276" x2="300" y2="204" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="352" y1="266" x2="400" y2="204" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="452" y1="266" x2="500" y2="204" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- line labels -->
  <line x1="640" y1="111" x2="585" y2="111" stroke="#333" stroke-width="2" marker-end="url(#ak)"/>
  <text x="650" y="120">first line</text>
  <line x1="640" y1="175" x2="572" y2="175" stroke="#333" stroke-width="2" marker-end="url(#ak)"/>
  <text x="650" y="184">second line</text>
  <line x1="640" y1="290" x2="572" y2="290" stroke="#333" stroke-width="2" marker-end="url(#ak)"/>
  <text x="650" y="299">third line</text>

  <!-- quotient bracket -->
  <path d="M205,330 L205,342 L455,342 L455,330" fill="none" stroke="#333" stroke-width="2"/>
  <text x="330" y="376" text-anchor="middle" font-size="22">Coefficients of quotient</text>

  <!-- remainder label -->
  <path d="M640,372 Q560,372 534,320" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ak)"/>
  <text x="650" y="380" fill="#2e7d32" font-size="24">Remainder</text>

  <!-- legend -->
  <line x1="120" y1="420" x2="120" y2="462" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="150" y="450" font-size="24">Vertical pattern: add the two numbers</text>
  <line x1="106" y1="512" x2="138" y2="478" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="150" y="504" font-size="24">Diagonal pattern: multiply by <tspan font-style="italic">a</tspan></text>
</svg>
