<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for topic 29.1: hex-1-ene and cyclohexane are both C6H12, two hydrogen atoms short of C6H14, so each has IHD 1 (one C=C or one ring); and the book's table relating CnH2n+2, CnH2n and CnH2n-2 to IHD 0, 1 and 2. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Index of hydrogen deficiency (IHD)</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">two isomers of C6H12, each two H atoms short of hexane (C6H14)</text>
  <line x1="110.0" y1="132.0" x2="148.0" y2="168.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148.0" y1="168.0" x2="186.0" y2="132.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="186.0" y1="132.0" x2="224.0" y2="168.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="224.0" y1="168.0" x2="262.0" y2="132.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="264.4" y1="129.5" x2="302.4" y2="165.5" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="259.6" y1="134.5" x2="297.6" y2="170.5" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="205.0" y="210.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">hex-1-ene: one C=C</text>
  <path d="M450.0 110.0 L484.6 130.0 L484.6 170.0 L450.0 190.0 L415.4 170.0 L415.4 130.0 Z" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="222.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">cyclohexane: one ring</text>
  <text x="720.0" y="120.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">each C=C or ring:</text>
  <text x="720.0" y="140.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">IHD 1</text>
  <text x="720.0" y="160.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">a triple bond: IHD 2</text>
  <text x="720.0" y="180.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="720.0" y="200.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">both have IHD = 1</text>
  <rect x="15.0" y="265.0" width="870.0" height="180.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">IHD from the formula of a hydrocarbon (book's Table 29.1)</text>
  <text x="110.0" y="310.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">n</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">2n+2</tspan></text>
  <text x="210.0" y="315.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">0</text>
  <text x="250.0" y="315.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">open-chain alkane only</text>
  <text x="110.0" y="346.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">n</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">2n</tspan></text>
  <text x="210.0" y="351.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">1</text>
  <text x="250.0" y="351.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">one double bond or one ring</text>
  <text x="110.0" y="382.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">n</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">2n-2</tspan></text>
  <text x="210.0" y="387.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">2</text>
  <text x="250.0" y="387.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">two double bonds, two rings, one of each, or one triple bond</text>
  <text x="450.0" y="430.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">for a hydrocarbon: IHD = (2 x carbons + 2 - hydrogens) / 2</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
