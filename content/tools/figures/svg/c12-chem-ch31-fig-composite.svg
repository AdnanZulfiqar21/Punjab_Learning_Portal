  <text x="518.0" y="297.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">good strength-to-weight ratio</text>
  <text x="518.0" y="323.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">strong resistance to corrosion</text>
