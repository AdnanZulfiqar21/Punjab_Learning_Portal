  <text x="160.0" y="330.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">matrix (e.g. a polymer):</text>
  <text x="160.0" y="348.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">holds the reinforcement</text>
  <text x="330.0" y="330.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">reinforcement (fibres):</text>
  <text x="330.0" y="348.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">gives high strength</text>
  <rect x="500.0" y="55.0" width="385.0" height="345.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="692.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">examples and properties</text>
  <text x="518.0" y="115.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">fibreglass: polymer matrix +</text>
  <text x="518.0" y="141.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">glass fibres; boat hulls, car bodies,</text>
  <text x="518.0" y="167.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">insulation of walls and ceilings</text>
  <text x="518.0" y="193.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
