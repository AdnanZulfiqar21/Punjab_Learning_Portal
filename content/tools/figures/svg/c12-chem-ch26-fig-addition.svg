  <text x="740.0" y="176.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">nothing is lost; n can be</text>
  <text x="740.0" y="194.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">up to about 10 000</text>
