  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram for topic 26.1.1: n ethene molecules join with an initiator under heat and pressure to give poly(ethene), repeat unit -CH2-CH2-; chloroethene gives PVC with Cl on every second carbon. -->
