<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram for topic 23.4: the carboxyl group RCOOH and the hydrogen-bonded dimer of ethanoic acid, which explains its high boiling point. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Carboxylic acids</text>
  <rect x="15.0" y="55.0" width="300.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="165.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the carboxyl group</text>
  <line x1="162.0" y1="200.0" x2="162.0" y2="165.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="168.0" y1="200.0" x2="168.0" y2="165.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="165.0" y="150.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="156.3" y1="215.0" x2="125.8" y2="232.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="103.2" y="251.1" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="173.7" y1="215.0" x2="204.2" y2="232.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="230.8" y="251.1" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="165.0" y="215.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="181.0" y="212.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="183.0" y="143.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="165.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">-COOH: a C=O and an</text>
  <text x="165.0" y="319.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">-OH on the same carbon</text>
  <rect x="330.0" y="55.0" width="555.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="607.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ethanoic acid forms hydrogen-bonded pairs</text>
  <text x="470.0" y="216.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="460.0" y1="210.0" x2="425.0" y2="210.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="388.0" y="215.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">C</tspan></text>
  <line x1="474.5" y1="200.6" x2="516.0" y2="155.3" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="479.0" y1="204.7" x2="520.5" y2="159.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="476.8" y1="217.4" x2="518.2" y2="262.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="525.0" y="155.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="525.0" y="275.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="750.0" y="216.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="760.0" y1="210.0" x2="795.0" y2="210.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="832.0" y="215.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <line x1="743.2" y1="202.6" x2="701.8" y2="157.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="745.5" y1="219.4" x2="704.0" y2="264.7" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="741.0" y1="215.3" x2="699.5" y2="260.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="695.0" y="155.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="695.0" y="275.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="437.0" y1="150.0" x2="784.0" y2="150.0" stroke="#ffffff" stroke-width="0" stroke-linecap="round"/>
  <line x1="540.0" y1="150.0" x2="675.0" y2="150.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="545.0" y1="270.0" x2="680.0" y2="270.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="610.0" y="140.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">hydrogen bond</text>
  <text x="610.0" y="320.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">two hydrogen bonds hold two molecules together:</text>
  <text x="610.0" y="339.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">high boiling point (118 C); small acids mix with water</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
