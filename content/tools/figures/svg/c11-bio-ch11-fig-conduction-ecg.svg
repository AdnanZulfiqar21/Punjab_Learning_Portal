<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1340" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.4 and 11.5: the conducting system of the heart and the waves of an ECG. Schematic. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563}
      .k{font-size:17px;font-weight:700;fill:#14181f}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="300" y="40">How the heartbeat is conducted</text>
  <g transform="translate(0,40)">
  <!-- heart outline -->
  <path d="M300 110 q-120 -60 -180 60 q-40 120 60 220 q60 60 120 110 q60 -50 120 -110 q100 -100 60 -220 q-60 -120 -180 -60 z" fill="#f6d5cf" stroke="#b5463a" stroke-width="4"/>
  <path d="M130 270 H470" stroke="#b5463a" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M300 110 V500" stroke="#b5463a" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- SA node -->
  <circle cx="220" cy="150" r="14" fill="#d98b2b"/>
  <!-- impulse across atria -->
  <g stroke="#d98b2b" stroke-width="3" fill="none" marker-end="url(#ay)"><path d="M230 160 q40 40 60 90"/><path d="M230 160 q-40 30 -60 80"/><path d="M235 150 q80 10 130 60"/></g>
  <!-- AV node -->
  <circle cx="300" cy="265" r="14" fill="#5b3fb5"/>
  <text class="k" x="470" y="230">AV node</text><text class="s" x="470" y="252">at the lower part of the</text><text class="s" x="470" y="272">interatrial septum; delay</text><text class="s" x="470" y="292">of about 0.15 s</text>
  <path class="lead" d="M465 245 L316 262"/>
  <!-- bundle of His and branches -->
  <path d="M300 280 V400" stroke="#5b3fb5" stroke-width="6"/>
  <path d="M300 400 q-40 30 -60 80 M300 400 q40 30 60 80" fill="none" stroke="#5b3fb5" stroke-width="5"/>
  <g stroke="#0f7a62" stroke-width="3" fill="none"><path d="M240 480 q-40 -40 -60 -90 M240 480 q-10 -60 -30 -120 M360 480 q40 -40 60 -90 M360 480 q10 -60 30 -120"/></g>
  <text class="k" x="470" y="350">Bundle of His</text><text class="s" x="470" y="372">AV bundle in the</text><text class="s" x="470" y="392">interventricular septum;</text><text class="s" x="470" y="412">left and right branches</text>
  <path class="lead" d="M465 365 L306 350"/>
  <text class="k" x="470" y="440">Purkinje fibres</text><text class="s" x="470" y="462">in the ventricle walls; both</text><text class="s" x="470" y="482">ventricles contract together</text>
  <path class="lead" d="M465 455 L410 440"/>
  </g>
  <text class="k" x="60" y="85">SA node (pacemaker)</text><text class="s" x="60" y="107">cluster of cardiac muscle cells</text><text class="s" x="60" y="127">in the upper wall of the right atrium</text>
  <path class="lead" d="M200 135 L215 180"/>
  <text class="s" x="60" y="560">Orange: impulse spreads over both atria, which contract together.</text>
  <text class="s" x="60" y="582">Purple and green: the path to the ventricles. The delay at the AV node lets</text><text class="s" x="60" y="604">atrial systole finish before ventricular systole begins.</text>
  <text class="s" x="60" y="636">A weak SA node can be replaced by an artificial pacemaker near the AV node.</text>
  <!-- ECG -->
  <text class="h" x="900" y="40">ECG of one heartbeat</text>
  <rect x="660" y="70" width="480" height="300" fill="#fff8f6" stroke="#f2b7af" stroke-width="2"/>
  <g stroke="#f6d5cf" stroke-width="1"><path d="M660 110 h480 M660 150 h480 M660 190 h480 M660 230 h480 M660 270 h480 M660 310 h480 M660 350 h480 M700 70 v300 M740 70 v300 M780 70 v300 M820 70 v300 M860 70 v300 M900 70 v300 M940 70 v300 M980 70 v300 M1020 70 v300 M1060 70 v300 M1100 70 v300"/></g>
  <path d="M670 270 H720 q20 -40 40 0 H800 l10 10 l15 -160 l15 180 l10 -30 H900 q30 -50 60 0 H1130" fill="none" stroke="#d7322f" stroke-width="4"/>
  <g font-size="18" font-weight="700" fill="#14181f" text-anchor="middle"><text x="740" y="222">P</text><text x="808" y="305">Q</text><text x="825" y="108">R</text><text x="842" y="320">S</text><text x="930" y="215">T</text></g>
  <g font-size="15" fill="#4b5563">
    <text x="680" y="400">P wave: atria depolarise and contract (started by the SA node); irregular or absent in arrhythmia</text>
    <text x="680" y="424">PR segment: atrial depolarisation complete, 0.12-0.20 s; prolonged in first-degree heart block</text>
    <text x="680" y="448">QRS: ventricles begin to depolarise (atria repolarise); abnormal in bundle branch block or</text><text x="700" y="468">ventricular tachycardia</text>
    <text x="680" y="492">ST segment: ventricular depolarisation complete, about 0.08 s; depressed in ischaemia,</text><text x="700" y="512">elevated in myocardial infarction</text>
    <text x="680" y="536">T wave: ventricles begin to repolarise; abnormal in electrolyte disturbance; hyper-acute T</text><text x="700" y="556">is the earliest sign of acute myocardial infarction</text>
    <text x="680" y="580">QT interval: start of QRS to end of T, normally about 0.40 s</text>
    <text x="680" y="616">Electrodes on the skin on opposite sides of the heart feed an electrocardiograph, which records</text><text x="680" y="636">the minute current that spreads from the heart to the body surface.</text>
  </g>
</svg>
