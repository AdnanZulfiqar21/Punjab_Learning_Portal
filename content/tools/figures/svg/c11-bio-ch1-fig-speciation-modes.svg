<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1100" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.32: four modes of speciation read downward through the same four stages. -->
  <defs>
    <style>
      .h{font-size:30px;font-weight:700;fill:#14181f;text-anchor:middle}
      .r{font-size:24px;font-weight:700;fill:#4b5563}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .pop{fill:#b2dbcc;stroke:#0f7a62;stroke-width:4}
      .new{fill:#f3c98b;stroke:#b26a00;stroke-width:4}
      .bar{stroke:#14181f;stroke-width:8}
    </style>
  </defs>
  <!-- row labels -->
  <text class="r" x="20" y="200">Original</text><text class="r" x="20" y="228">population</text>
  <text class="r" x="20" y="450">Initial</text><text class="r" x="20" y="478">step</text>
  <text class="r" x="20" y="700">Reproductive</text><text class="r" x="20" y="728">isolation</text>
  <text class="r" x="20" y="950">Speciation</text>
  <g stroke="#e3e8ee" stroke-width="3"><path d="M190 120 H990 M190 370 H990 M190 620 H990 M190 870 H990"/></g>
  <!-- column headers -->
  <text class="h" x="300" y="80">Allopatric</text>
  <text class="h" x="500" y="80">Peripatric</text>
  <text class="h" x="700" y="80">Parapatric</text>
  <text class="h" x="900" y="80">Sympatric</text>
  <!-- Row 1: original population (same in every column) -->
  <g><ellipse class="pop" cx="300" cy="215" rx="70" ry="45"/><ellipse class="pop" cx="500" cy="215" rx="70" ry="45"/><ellipse class="pop" cx="700" cy="215" rx="70" ry="45"/><ellipse class="pop" cx="900" cy="215" rx="70" ry="45"/></g>
  <!-- Row 2: initial step -->
  <!-- allopatric: a barrier splits the population -->
  <ellipse class="pop" cx="262" cy="465" rx="40" ry="45"/><ellipse class="pop" cx="338" cy="465" rx="40" ry="45"/>
  <path class="bar" d="M300 410 V520"/>
  <text class="s" x="300" y="555">geographical</text><text class="s" x="300" y="580">barrier</text>
  <!-- peripatric: a small group at the edge becomes isolated -->
  <ellipse class="pop" cx="490" cy="465" rx="62" ry="45"/><circle class="new" cx="575" cy="440" r="16"/>
  <text class="s" x="500" y="555">small edge group</text><text class="s" x="500" y="580">isolated</text>
  <!-- parapatric: adjacent niche along a gradient, limited gene flow -->
  <ellipse class="pop" cx="670" cy="465" rx="55" ry="45"/><ellipse class="new" cx="745" cy="465" rx="40" ry="38"/>
  <path d="M700 420 V510" stroke="#14181f" stroke-width="4" stroke-dasharray="10 8"/>
  <text class="s" x="700" y="555">adjacent niche;</text><text class="s" x="700" y="580">little gene flow</text>
  <!-- sympatric: a new niche inside the same area -->
  <ellipse class="pop" cx="900" cy="465" rx="70" ry="45"/><circle class="new" cx="920" cy="470" r="18"/>
  <text class="s" x="900" y="555">new niche in</text><text class="s" x="900" y="580">the same area</text>
  <!-- Row 3: reproductive isolation -->
  <ellipse class="pop" cx="255" cy="715" rx="40" ry="42"/><ellipse class="new" cx="345" cy="715" rx="40" ry="42"/><path class="bar" d="M300 660 V770"/>
  <text class="s" x="300" y="805">evolve apart</text><text class="s" x="300" y="830">in isolation</text>
  <ellipse class="pop" cx="480" cy="715" rx="55" ry="42"/><circle class="new" cx="585" cy="700" r="28"/>
  <text class="s" x="500" y="805">rapid change</text><text class="s" x="500" y="830">in isolation</text>
  <ellipse class="pop" cx="665" cy="715" rx="50" ry="42"/><ellipse class="new" cx="750" cy="715" rx="42" ry="42"/>
  <text class="s" x="700" y="805">adapted to each</text><text class="s" x="700" y="830">environment</text>
  <ellipse class="pop" cx="885" cy="715" rx="60" ry="42"/><circle class="new" cx="935" cy="715" r="30"/>
  <text class="s" x="900" y="805">polyploidy or</text><text class="s" x="900" y="830">niche differentiation</text>
  <!-- Row 4: two species -->
  <g>
    <ellipse class="pop" cx="255" cy="960" rx="40" ry="40"/><ellipse class="new" cx="345" cy="960" rx="40" ry="40"/>
    <ellipse class="pop" cx="455" cy="960" rx="40" ry="40"/><ellipse class="new" cx="545" cy="960" rx="40" ry="40"/>
    <ellipse class="pop" cx="655" cy="960" rx="40" ry="40"/><ellipse class="new" cx="745" cy="960" rx="40" ry="40"/>
    <ellipse class="pop" cx="855" cy="960" rx="40" ry="40"/><ellipse class="new" cx="945" cy="960" rx="40" ry="40"/>
  </g>
  <text class="s" x="600" y="1050">green: the original species · amber: the new species</text>
</svg>
