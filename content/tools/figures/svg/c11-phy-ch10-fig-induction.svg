<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.13 to 10.16 and topics 10.6 to 10.8: motional emf in a rod on rails, Faraday's law, Lenz's law with a magnet and coil, and the factors affecting the induced emf. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Motional emf, Faraday's law and Lenz's law</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Motional emf (10.6, Figs. 10.13, 10.14)</text>
  <rect x="110" y="100" width="380" height="170" fill="#e6f4ef" opacity="0.7"/>
  <text class="r" x="130" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="164" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="198" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="232" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="266" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="300" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="334" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="436" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="470" y="140" style="fill:#1f6fb5">x</text>
  <text class="r" x="130" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="164" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="198" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="232" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="266" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="300" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="334" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="436" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="470" y="174" style="fill:#1f6fb5">x</text>
  <text class="r" x="130" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="164" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="198" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="232" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="266" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="300" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="334" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="436" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="470" y="208" style="fill:#1f6fb5">x</text>
  <text class="r" x="130" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="164" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="198" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="232" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="266" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="300" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="334" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="436" y="242" style="fill:#1f6fb5">x</text>
  <text class="r" x="470" y="242" style="fill:#1f6fb5">x</text>
  <path d="M110 100 H500" stroke="#14181f" stroke-width="3"/>
  <path d="M110 270 H500" stroke="#14181f" stroke-width="3"/>
  <path d="M110 100 V160" stroke="#14181f" stroke-width="2"/>
  <path d="M110 210 V270" stroke="#14181f" stroke-width="2"/>
  <circle cx="110" cy="185" r="13" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="110" y="189" style="text-anchor:middle">G</text>
  <rect x="372" y="92" width="14" height="186" rx="6" fill="#fbe7c6" stroke="#d98b2b" stroke-width="2"/>
  <path d="M392 185 L450 185" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="l" x="440" y="176">v</text>
  <path d="M379 250 L379 200" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="358" y="232" style="fill:#d7322f">I</text>
  <text class="r" x="392" y="114">b</text>
  <text class="r" x="384" y="294">a</text>
  <text class="r" x="394" y="160">L</text>
  <path d="M300 100 L220 100" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M220 270 L300 270" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <g class="r">
    <text x="70" y="310">charges in the moving rod feel qvB along it and pile up at b until qE = qvB (10.17);</text>
    <text x="70" y="324">emf = vBL (printed epsilon = -LvB, 10.19); at angle theta: vBL sin theta (10.20)</text>
    <text x="70" y="338">current anticlockwise round abcda; Ex 10.6: 25 cm, 0.5 m s^-1, 0.25 T: 3.13 x 10^-2 V</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Faraday's law (10.6)</text>
  <g class="f">
    <text x="630" y="104">v = delta x / delta t            (10.21)</text>
    <text x="630" y="124">emf = -(delta x/delta t) B L     (10.22)</text>
    <text x="630" y="144">delta A = L delta x; delta phi = B delta A</text>
    <text x="630" y="164">emf = -delta phi / delta t       (10.23)</text>
    <text x="630" y="184">emf = -N delta phi / delta t     (10.24)</text>
  </g>
  <g class="t">
    <text x="630" y="220">the average emf induced in a coil of N loops equals the negative</text>
    <text x="630" y="237">of the rate at which the magnetic flux through it changes;</text>
    <text x="630" y="254">the minus sign: the emf opposes the change in flux</text>
    <text x="630" y="288">Ex 10.7: a loop in 0.6 T shrinking at 0.8 m^2 s^-1:</text>
    <text x="630" y="305">emf = N B (delta A/delta t) = 0.6 x 0.8 = 0.48 V</text>
    <text x="630" y="322">wireless chargers and induction heaters use induction</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Lenz's law (10.7, Fig. 10.15)</text>
  <rect x="80" y="480" width="70" height="36" fill="#bcdcf0" stroke="#1f6fb5"/><text class="l" x="108" y="503">S</text>
  <rect x="150" y="480" width="70" height="36" fill="#f8c8b8" stroke="#d7322f"/><text class="l" x="178" y="503">N</text>
  <path d="M150 468 L200 468" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="r" x="150" y="452">pushed in</text>
  <ellipse cx="300" cy="498" rx="10" ry="40" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="318" cy="498" rx="10" ry="40" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="336" cy="498" rx="10" ry="40" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="354" cy="498" rx="10" ry="40" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="372" cy="498" rx="10" ry="40" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <text class="l" x="284" y="554">N</text>
  <text class="r" x="250" y="568">face towards the magnet</text>
  <text class="r" x="250" y="581">becomes N: they repel</text>
  <g class="r">
    <text x="410" y="470">seen from the magnet the</text>
    <text x="410" y="485">current is anticlockwise;</text>
    <text x="410" y="500">pulling out makes that</text>
    <text x="410" y="515">face S, opposing the pull</text>
  </g>
  <g class="t">
    <text x="70" y="612">the induced current always opposes the change that caused it (Lenz, 1834);</text>
    <text x="70" y="629">it applies to currents, so for an open loop imagine it closed; it is energy</text>
    <text x="70" y="646">conservation: the rod is braked, so an external force must do the work</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Factors affecting the emf (10.8) and energy</text>
  <g class="t">
    <text x="630" y="452">1 rate of change of flux: a faster change gives a larger emf</text>
    <text x="630" y="469">2 number of turns: the emf is proportional to N</text>
    <text x="630" y="486">3 relative speed: a faster coil or magnet changes the flux faster</text>
    <text x="630" y="520">if the current in Fig. 10.16 flowed clockwise, the force on the rod</text>
    <text x="630" y="537">would push it along v; it would speed up, induce more current and</text>
    <text x="630" y="554">gain kinetic energy from nothing: Lenz's law forbids this</text>
    <text x="630" y="588">a copper ring crossing a field region: current while entering</text>
    <text x="630" y="605">and leaving (opposite senses), none while wholly inside</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
