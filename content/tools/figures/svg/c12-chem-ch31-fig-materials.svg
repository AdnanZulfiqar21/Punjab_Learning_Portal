<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original overview for topic 31.1: metals and alloys, ceramics, polymers, composites and semiconductors, with the properties and examples given in the text; Figure 31.1 (a photograph of a phone) is described, not reproduced. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Classes of materials</text>
  <text x="450.0" y="64.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">A mobile phone (Figure 31.1) combines metals, plastics, composites and a Li-ion battery.</text>
  <rect x="15.0" y="85.0" width="280.0" height="205.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="155.0" y="113.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700">Metals and alloys</text>
  <text x="29.0" y="141.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">hard, strong, malleable, ductile</text>
  <text x="29.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">conduct heat and electricity well</text>
  <text x="29.0" y="181.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">examples:</text>
  <text x="29.0" y="201.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">steel in bridges and buildings</text>
  <text x="29.0" y="221.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">aluminium in aircraft bodies</text>
  <text x="29.0" y="241.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">copper in electric wires</text>
  <rect x="310.0" y="85.0" width="280.0" height="205.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="450.0" y="113.0" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700">Ceramics</text>
  <text x="324.0" y="141.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">silicates and metal oxides</text>
  <text x="324.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">hard but brittle</text>
  <text x="324.0" y="181.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">very high melting points</text>
  <text x="324.0" y="201.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">insulate heat and electricity</text>
  <text x="324.0" y="221.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">e.g. bricks, porcelain, glass,</text>
  <text x="324.0" y="241.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">alumina spark plugs</text>
  <rect x="605.0" y="85.0" width="280.0" height="205.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="745.0" y="113.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700">Polymers</text>
  <text x="619.0" y="141.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">very large molecules built from</text>
  <text x="619.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">small units (see Chapter 26)</text>
  <text x="619.0" y="181.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">organic polymers are more common</text>
  <text x="619.0" y="201.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">e.g. plastics and rubbers</text>
  <rect x="162.0" y="305.0" width="280.0" height="205.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="302.0" y="333.0" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="700">Composites</text>
  <text x="176.0" y="361.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">a matrix holds a reinforcement</text>
  <text x="176.0" y="381.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">strong for their weight</text>
  <text x="176.0" y="401.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">resist corrosion</text>
  <text x="176.0" y="421.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">e.g. fibreglass boat hulls,</text>
  <text x="176.0" y="441.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">carbon fibre aircraft parts</text>
  <rect x="457.0" y="305.0" width="280.0" height="205.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#dff4f5"/>
  <text x="597.0" y="333.0" font-size="17" fill="#0e9aa7" text-anchor="middle" font-weight="700">Semiconductors</text>
  <text x="471.0" y="361.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">conduct only under certain conditions</text>
  <text x="471.0" y="381.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the current can be controlled</text>
  <text x="471.0" y="401.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">Si: microchips, solar panels</text>
  <text x="471.0" y="421.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">GaAs: 5G wireless devices</text>
  <text x="471.0" y="441.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">GaN: fast charging in electric cars</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
