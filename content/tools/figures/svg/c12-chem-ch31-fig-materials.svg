<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <!-- Classes of materials (our own summary tiles for topic 31.1; not a textbook figure). -->
  <rect x="20.0" y="20.0" width="310.0" height="175.0" rx="14" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="175.0" y="99.1" font-size="28" fill="#1f6fb5" text-anchor="middle" font-weight="800"><tspan dy="0.0">Metals and alloys</tspan></text>
  <text x="175.0" y="135.5" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">steel, aluminium</tspan></text>
  <rect x="345.0" y="20.0" width="310.0" height="175.0" rx="14" stroke="#d98b2b" stroke-width="3" fill="#fff1dc"/>
  <text x="500.0" y="99.1" font-size="28" fill="#d98b2b" text-anchor="middle" font-weight="800"><tspan dy="0.0">Ceramics</tspan></text>
  <text x="500.0" y="135.5" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">bricks, glass</tspan></text>
  <rect x="670.0" y="20.0" width="310.0" height="175.0" rx="14" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="825.0" y="99.1" font-size="28" fill="#0f7a62" text-anchor="middle" font-weight="800"><tspan dy="0.0">Polymers</tspan></text>
  <text x="825.0" y="135.5" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">plastics, rubber</tspan></text>
  <rect x="182.0" y="225.0" width="310.0" height="175.0" rx="14" stroke="#7c3aed" stroke-width="3" fill="#efe7fd"/>
  <text x="337.0" y="304.1" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="800"><tspan dy="0.0">Composites</tspan></text>
  <text x="337.0" y="340.5" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">fibreglass</tspan></text>
  <rect x="507.0" y="225.0" width="310.0" height="175.0" rx="14" stroke="#0e9aa7" stroke-width="3" fill="#dff4f6"/>
  <text x="662.0" y="304.1" font-size="28" fill="#0e9aa7" text-anchor="middle" font-weight="800"><tspan dy="0.0">Semiconductors</tspan></text>
  <text x="662.0" y="340.5" font-size="28" fill="#14181f" text-anchor="middle" font-weight="500"><tspan dy="0.0">Si, GaAs, GaN</tspan></text>
</svg>
