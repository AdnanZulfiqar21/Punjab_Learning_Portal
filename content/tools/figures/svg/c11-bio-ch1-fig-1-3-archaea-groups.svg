<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 1.3 (C11-BIO, PDF p6): flat drawing after the four printed micrographs in a row, left to right: Methanogens (green rods on a brown background), Halobacteria (blue rounded rods on dark blue), Thermoplasmata (one grey irregular lobed cell with a scale bar on grey), Thermococci (one dark green round cell with a pale halo on yellow-green). No photograph is reproduced. -->
  <rect width="1200" height="330" fill="#ffffff"/>
  <defs>
    <clipPath id="p1"><rect x="10" y="10" width="285" height="235"/></clipPath>
    <clipPath id="p2"><rect x="305" y="10" width="285" height="235"/></clipPath>
    <clipPath id="p3"><rect x="600" y="10" width="290" height="235"/></clipPath>
    <clipPath id="p4"><rect x="900" y="10" width="290" height="235"/></clipPath>
  </defs>
  <!-- Methanogens -->
  <g clip-path="url(#p1)">
    <rect x="10" y="10" width="285" height="235" fill="#9a6a4a"/>
    <path d="M10 60 C80 40 140 90 210 60 S290 80 300 70 M10 150 C70 130 120 170 190 150 S280 170 300 160 M20 220 C90 200 150 240 220 215" stroke="#b98262" stroke-width="18" fill="none" opacity="0.7"/>
    <g fill="#7fd64a" stroke="#4f9a2a" stroke-width="3">
      <rect x="120" y="40" width="26" height="80" rx="13" transform="rotate(25 133 80)"/>
      <rect x="150" y="90" width="26" height="70" rx="13" transform="rotate(-35 163 125)"/>
      <rect x="95" y="120" width="26" height="85" rx="13" transform="rotate(40 108 162)"/>
      <rect x="210" y="70" width="26" height="70" rx="13" transform="rotate(70 223 105)"/>
      <rect x="200" y="140" width="26" height="80" rx="13" transform="rotate(-20 213 180)"/>
      <rect x="40" y="110" width="24" height="70" rx="12" transform="rotate(80 52 145)"/>
      <rect x="250" y="160" width="24" height="60" rx="12" transform="rotate(10 262 190)"/>
      <rect x="140" y="20" width="22" height="50" rx="11" transform="rotate(-60 151 45)"/>
    </g>
  </g>
  <!-- Halobacteria -->
  <g clip-path="url(#p2)">
    <rect x="305" y="10" width="285" height="235" fill="#1c2f7a"/>
    <g fill="#5d8fd8" stroke="#a9c6f2" stroke-width="3">
      <rect x="320" y="40" width="70" height="210" rx="35" transform="rotate(-30 355 145)"/>
      <rect x="420" y="0" width="80" height="200" rx="40" transform="rotate(55 460 100)"/>
      <rect x="470" y="120" width="70" height="170" rx="35" transform="rotate(-10 505 205)"/>
      <rect x="530" y="20" width="60" height="130" rx="30" transform="rotate(20 560 85)"/>
    </g>
    <g fill="#c5d9f6" opacity="0.6">
      <circle cx="350" cy="110" r="3"/><circle cx="365" cy="140" r="3"/><circle cx="340" cy="170" r="3"/><circle cx="455" cy="80" r="3"/><circle cx="480" cy="110" r="3"/><circle cx="500" cy="200" r="3"/><circle cx="510" cy="230" r="3"/><circle cx="555" cy="70" r="3"/>
    </g>
  </g>
  <!-- Thermoplasmata -->
  <g clip-path="url(#p3)">
    <rect x="600" y="10" width="290" height="235" fill="#8c8c8c"/>
    <path d="M655 120 C650 90 690 70 715 85 C730 60 770 65 785 85 C810 75 835 95 828 120 C850 135 840 165 815 168 C812 190 785 198 770 185 C750 205 715 200 705 180 C680 190 655 170 668 150 C645 145 640 128 655 120 Z" fill="#e6e6e6" stroke="#ffffff" stroke-width="3"/>
    <path d="M690 115 C720 105 760 110 790 125 M700 150 C730 140 770 145 800 155" stroke="#bdbdbd" stroke-width="4" fill="none"/>
    <rect x="725" y="215" width="55" height="5" fill="#ffffff"/>
  </g>
  <!-- Thermococci -->
  <g clip-path="url(#p4)">
    <rect x="900" y="10" width="290" height="235" fill="#c9e07a"/>
    <circle cx="1045" cy="125" r="100" fill="#a8d05a"/>
    <circle cx="1045" cy="125" r="78" fill="#3f8a3a"/>
    <circle cx="1040" cy="120" r="55" fill="#1f5a2a"/>
    <g fill="#e6f2b0" opacity="0.8"><circle cx="925" cy="40" r="8"/><circle cx="1170" cy="60" r="10"/><circle cx="930" cy="220" r="9"/><circle cx="1165" cy="215" r="7"/></g>
  </g>
  <g font-size="24" fill="#1a1a1a" text-anchor="middle">
    <text x="152" y="285">Methanogens</text>
    <text x="447" y="285">Halobacteria</text>
    <text x="745" y="285">Thermoplasmata</text>
    <text x="1045" y="285">Thermococci</text>
  </g>
</svg>
