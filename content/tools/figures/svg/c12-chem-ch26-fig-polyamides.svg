<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="625" fill="#ffffff"/>
  <!-- Original summary of the book's general equations for polyamides: diamine + dicarboxylic acid (water lost), diamine + dioyl chloride (HCl lost), a single amino acid, and an acyl chloride with an amine giving an amide. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Polyamides: amide links -CO-NH-</text>
  <rect x="15.0" y="60.0" width="870.0" height="118.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">diamine + dicarboxylic acid (water lost)</text>
  <text x="450.0" y="138.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">n H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + n HOOC-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-COOH -&gt; [-HN-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-NH-CO-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CO-]</tspan><tspan dy="4.8" font-size="10.5">n</tspan><tspan dy="-4.8"> + n H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <rect x="15.0" y="190.0" width="870.0" height="118.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="220.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">diamine + dioyl chloride (HCl lost; dioyl chlorides are more reactive)</text>
  <text x="450.0" y="268.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">n H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + n ClOC-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-COCl -&gt; [-HN-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-NH-CO-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CO-]</tspan><tspan dy="4.8" font-size="10.5">n</tspan><tspan dy="-4.8"> + n HCl</tspan></text>
  <rect x="15.0" y="320.0" width="870.0" height="118.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="350.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">one amino acid (both groups in one molecule)</text>
  <text x="450.0" y="398.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">n H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-COOH -&gt; [-HN-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CO-]</tspan><tspan dy="4.8" font-size="10.5">n</tspan><tspan dy="-4.8"> + n H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <rect x="15.0" y="450.0" width="870.0" height="118.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="480.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">acyl chloride + amine at room temperature (a single amide)</text>
  <text x="450.0" y="528.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-COCl + R'-NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> -&gt; R-CO-NH-R' + HCl</tspan></text>
  <text x="450.0" y="592.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the book writes simplified monomers with CH2 between the groups; real examples have longer chains (nylon-6,6)</text>
  <text x="450.0" y="616" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
