<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.20 to 9.26 and topics 9.10 to 9.15: electric current and drift velocity, Ohm's law, resistivity and its temperature dependence, electrical power, emf and internal resistance. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Electric current, resistance and resistivity, power, emf and internal resistance</text>
  <rect x="50" y="55" width="540" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Current and drift velocity (9.10, 9.11, Figs. 9.20, 9.21)</text>
  <rect x="80" y="110" width="300" height="70" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <ellipse cx="380" cy="145" rx="14" ry="35" fill="#e5e7eb" stroke="#4b5563"/>
  <circle cx="120" cy="130" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="117" y="134">-</text>
  <path d="M111 130 L90 130" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="170" cy="160" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="167" y="164">-</text>
  <path d="M161 160 L140 160" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="220" cy="128" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="217" y="132">-</text>
  <path d="M211 128 L190 128" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="270" cy="158" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="267" y="162">-</text>
  <path d="M261 158 L240 158" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="320" cy="132" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="317" y="136">-</text>
  <path d="M311 132 L290 132" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="140" cy="152" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="137" y="156">-</text>
  <path d="M131 152 L110 152" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="300" cy="162" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="297" y="166">-</text>
  <path d="M291 162 L270 162" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <circle cx="245" cy="140" r="7" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="242" y="144">-</text>
  <path d="M236 140 L215 140" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <path d="M400 145 L450 145" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="440" y="135" style="fill:#d7322f">I</text>
  <path d="M80 196 H380" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text class="r" x="222" y="210">L</text>
  <text class="r" x="394" y="196">area A</text>
  <text class="r" x="90" y="104">electrons drift left (against E); conventional current flows right</text>
  <g class="f">
    <text x="470" y="120">I = Q/t</text>
    <text x="470" y="138">  (9.28)</text>
    <text x="470" y="156">Q = nALq</text>
    <text x="470" y="174">  (9.29)</text>
    <text x="470" y="192">I = nAvq</text>
    <text x="470" y="210">  (9.30)</text>
  </g>
  <g class="r">
    <text x="70" y="236">drift velocity about 10^-3 m s^-1, yet a bulb lights at once: all free electrons</text>
    <text x="70" y="251">start drifting together; 1 A = 1 C s^-1; DC flows one way (batteries);</text>
    <text x="70" y="266">AC reverses regularly (generators, mains); conventional current: the flow</text>
    <text x="70" y="281">of positive charge with the same effect, + to - outside the cell</text>
    <text x="70" y="296">Example: copper, A = 2 x 10^-6 m^2, I = 3 A, n = 8.5 x 10^28 m^-3: v = 1.1 x 10^-4 m s^-1</text>
    <text x="70" y="311">current: a flow of charge, pushed by voltage and hampered by resistance</text>
  </g>
  <rect x="610" y="55" width="540" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Ohm's law and resistivity (9.12, 9.13, Fig. 9.22)</text>
  <path d="M640 270 H800" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M650 280 V105" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M650 270 L780 130" stroke="#d7322f" stroke-width="2.5"/>
  <text class="r" x="790" y="286">I</text>
  <text class="r" x="636" y="112">V</text>
  <text class="r" x="700" y="246">slope = R</text>
  <path d="M830 270 H1000" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M870 280 V105" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M845 262 L990 135" stroke="#1f6fb5" stroke-width="2.5"/>
  <text class="r" x="960" y="286">T (C)</text>
  <text class="r" x="878" y="112">rho, copper</text>
  <text class="r" x="862" y="286">0</text>
  <g class="f">
    <text x="1012" y="120">V = IR</text>
    <text x="1012" y="138"> (9.31)</text>
    <text x="1012" y="156">R = rho L/A</text>
    <text x="1012" y="174"> (9.32)</text>
    <text x="1012" y="192">G = 1/R</text>
    <text x="1012" y="210">sigma =</text>
    <text x="1012" y="228"> 1/rho (9.34)</text>
  </g>
  <g class="r">
    <text x="630" y="312">alpha = (Rt - R0)/(R0 t) (9.35) = (rho_t - rho_0)/(rho_0 t) (9.37)</text>
    <text x="630" y="326">Ex 9.7: iron, 1.5 V, 0.75 A, 5.0 m, 2.5 x 10^-7 m^2: R = 2.0 ohm, rho = 1.0 x 10^-7 ohm m</text>
    <text x="630" y="340">Ex 9.8: platinum 10 ohm at 0 C, 20 ohm at 193 C: alpha = 5.18 x 10^-3 K^-1</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Table 9.2: resistivity and temperature coefficient</text>
  <text class="l" x="80" y="422">substance</text>
  <text class="l" x="240" y="422">rho (ohm m)</text>
  <text class="l" x="420" y="422">alpha (K^-1)</text>
  <text class="r" x="80" y="439">silver</text>
  <text class="r" x="240" y="439">1.52 x 10^-8</text>
  <text class="r" x="420" y="439">0.00380</text>
  <text class="r" x="80" y="456">copper</text>
  <text class="r" x="240" y="456">1.69 x 10^-8</text>
  <text class="r" x="420" y="456">0.00390</text>
  <text class="r" x="80" y="473">gold</text>
  <text class="r" x="240" y="473">2.27 x 10^-8</text>
  <text class="r" x="420" y="473">0.00340</text>
  <text class="r" x="80" y="490">aluminium</text>
  <text class="r" x="240" y="490">2.63 x 10^-8</text>
  <text class="r" x="420" y="490">0.00390</text>
  <text class="r" x="80" y="507">tungsten</text>
  <text class="r" x="240" y="507">5.00 x 10^-8</text>
  <text class="r" x="420" y="507">0.00460</text>
  <text class="r" x="80" y="524">iron</text>
  <text class="r" x="240" y="524">11.00 x 10^-8</text>
  <text class="r" x="420" y="524">0.00520</text>
  <text class="r" x="80" y="541">platinum</text>
  <text class="r" x="240" y="541">11.00 x 10^-8</text>
  <text class="r" x="420" y="541">0.00520</text>
  <text class="r" x="80" y="558">constantan</text>
  <text class="r" x="240" y="558">49.00 x 10^-8</text>
  <text class="r" x="420" y="558">0.00001</text>
  <text class="r" x="80" y="575">mercury</text>
  <text class="r" x="240" y="575">94.00 x 10^-8</text>
  <text class="r" x="420" y="575">0.00091</text>
  <text class="r" x="80" y="592">nichrome</text>
  <text class="r" x="240" y="592">100.0 x 10^-8</text>
  <text class="r" x="420" y="592">0.00020</text>
  <text class="r" x="80" y="609">carbon</text>
  <text class="r" x="240" y="609">3.5 x 10^-5</text>
  <text class="r" x="420" y="609">-0.00005</text>
  <text class="r" x="80" y="626">germanium</text>
  <text class="r" x="240" y="626">0.5</text>
  <text class="r" x="420" y="626">-0.05</text>
  <text class="r" x="80" y="643">silicon</text>
  <text class="r" x="240" y="643">20 - 2300</text>
  <text class="r" x="420" y="643">-0.07</text>
  <g class="r">
    <text x="80" y="666">silver and copper conduct best, so wires are copper; carbon, germanium</text>
    <text x="80" y="680">and silicon have negative alpha: their resistance falls as they warm</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="403">Power, emf and internal resistance (9.14, 9.15, Figs. 9.23 to 9.26)</text>
  <rect x="660" y="415" width="120" height="44" rx="6" fill="none" stroke="#4b5563" stroke-dasharray="5 3"/>
  <path d="M687 425 V449" stroke="#14181f" stroke-width="2"/>
  <path d="M694 431 V443" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="684" y="476">E</text>
  <path d="M705 437 L716 437 L720 443 L728 431 L737 443 L745 431 L749 437 L760 437" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="726" y="426">r</text>
  <path d="M660 437 L640 437 L640 600 L700 600" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M700 600 L724 600 L730 607 L742 593 L754 607 L766 593 L778 607 L790 593 L796 600 L820 600" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M820 600 L880 600 L880 437 L780 437" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <text class="l" x="752" y="626">R</text>
  <path d="M640 520 L740 520" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <circle cx="753" cy="520" r="13" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="753" y="524" style="text-anchor:middle">V</text>
  <path d="M766 520 L880 520" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M850 437 L866 426" stroke="#14181f" stroke-width="1.8"/><circle cx="848" cy="437" r="2.5" fill="#14181f"/><text class="r" x="852" y="418">S</text>
  <path d="M800 586 L760 586" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <text class="r" x="796" y="580" style="fill:#d7322f">I</text>
  <g class="r">
    <text x="900" y="420">P = VI (9.39) = I^2 R = V^2/R (9.40)</text>
    <text x="900" y="435">W = VQ (9.38); watts from volts and amperes</text>
    <text x="900" y="465">emf E = W / Q (9.41): energy given to</text>
    <text x="900" y="480">unit charge by the cell; in volts, not N</text>
    <text x="900" y="495">internal resistance r of the electrolyte:</text>
    <text x="900" y="510">I = E/(R + r); E = IR + Ir (9.42)</text>
    <text x="900" y="525">terminal voltage V = IR = E - Ir</text>
    <text x="900" y="540">switch open: no current, voltmeter reads E</text>
    <text x="900" y="570">Ex 9.9: 2.2 V open, 1.8 V across 5.0 ohm:</text>
    <text x="900" y="585">I = 0.36 A, r = 0.4/0.36 = 1.1 ohm</text>
    <text x="900" y="600">emf is the cause, p.d. the effect</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
