<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.6 to 3.14 and topics 3.2 and 3.3: centripetal force, its sources and applications, orbital velocity, weightlessness and artificial gravity. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Centripetal force, artificial satellites, weightlessness and artificial gravity</text>
  <!-- centripetal -->
  <rect x="50" y="55" width="360" height="310" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Centripetal force (Figs. 3.6, 3.7)</text>
  <circle cx="190" cy="200" r="80" fill="none" stroke="#4b5563" stroke-width="2"/>
  <circle cx="190" cy="200" r="3" fill="#4b5563"/>
  <circle cx="270" cy="200" r="7" fill="#d7322f"/>
  <path d="M270 200 L205 200" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M270 200 V130" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M270 200 L270 110" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="l" x="178" y="218">O</text>
  <text class="l" x="280" y="206">A</text>
  <text class="l" x="222" y="192" style="fill:#1f6fb5">Fc</text>
  <text class="l" x="278" y="150" style="fill:#d7322f">v</text>
  <text class="r" x="282" y="118">tangent AB: path if</text>
  <text class="r" x="282" y="132">the string snaps</text>
  <g class="f">
    <text x="70" y="300">Fc = m a_c = m v^2 / r   (3.12)</text>
    <text x="70" y="320">Fc = m r omega^2         (3.13)</text>
  </g>
  <text class="r" x="70" y="344">a_c = v^2/r to the centre; Fc perpendicular to v bends the path</text>
  <!-- sources -->
  <rect x="430" y="55" width="360" height="310" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="610" y="83">What supplies it, and where it is used</text>
  <g class="t">
    <text x="450" y="110"><tspan class="b">1</tspan> ball on a string: tension in the string</text>
    <text x="450" y="128"><tspan class="b">2</tspan> object on a turntable: friction</text>
    <text x="450" y="146"><tspan class="b">3</tspan> Earth round the Sun, Moon and satellites round</text>
    <text x="450" y="162">the Earth: gravitational force</text>
    <text x="450" y="180"><tspan class="b">4</tspan> charge moving across a magnetic field: the normal</text>
    <text x="450" y="196">(perpendicular) magnetic force</text>
    <text x="450" y="214"><tspan class="b">5</tspan> vehicle turning: friction between tyres and road; on a</text>
    <text x="450" y="230">slippery road at speed it may skid or topple, so turns are</text>
    <text x="450" y="246">banked (outer edge higher)</text>
    <text x="450" y="274"><tspan class="b">applications:</tspan> centrifuge (denser particles settle at the</text>
    <text x="450" y="290">bottom of the spun tubes, Fig. 3.8); washing-machine dryer</text>
    <text x="450" y="306">(water flung out through holes in the spinning drum, Fig. 3.9);</text>
    <text x="450" y="322">cream separator (heavy particles go outward, light cream</text>
    <text x="450" y="338">stays near the axis, Fig. 3.10)</text>
  </g>
  <!-- vertical circle -->
  <rect x="810" y="55" width="340" height="310" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Vertical circle, top point (Fig. 3.7)</text>
  <circle cx="980" cy="230" r="75" fill="none" stroke="#4b5563" stroke-width="2"/>
  <circle cx="980" cy="155" r="7" fill="#d7322f"/>
  <path d="M980 155 V200" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M996 155 V215" stroke="#0f7a62" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M980 155 H1050" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="958" y="150">A</text>
  <text class="l" x="960" y="190" style="fill:#1f6fb5">T</text>
  <text class="l" x="1004" y="224" style="fill:#0f7a62">w = mg</text>
  <text class="l" x="1040" y="148" style="fill:#d7322f">v</text>
  <text class="l" x="968" y="248">O</text>
  <g class="f">
    <text x="830" y="328">T + mg = m v^2 / r  ->  T = m (v^2/r - g)</text>
  </g>
  <text class="r" x="830" y="350">if v^2/r = g the tension is zero: weight alone supplies Fc</text>
  <!-- satellites -->
  <rect x="50" y="385" width="560" height="310" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="330" y="413">Artificial satellites (Figs. 3.11, 3.12)</text>
  <circle cx="170" cy="540" r="40" fill="#bcdcf0" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="170" cy="540" r="100" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="270" cy="540" r="6" fill="#d7322f"/>
  <path d="M270 540 L215 540" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M270 540 V490" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="155" y="545">Earth</text>
  <text class="l" x="230" y="532" style="fill:#1f6fb5">F</text>
  <text class="l" x="278" y="500" style="fill:#d7322f">v</text>
  <text class="r" x="90" y="656">M = 6.0 x 10^24 kg, R = 6400 km</text>
  <g class="f">
    <text x="300" y="445">g = v^2 / R  (3.14)</text>
    <text x="300" y="465">v = sqrt(g R) = sqrt(9.8 x 6.4 x 10^6 m)</text>
    <text x="300" y="483">  = 7.9 x 10^3 m s^-1 = 7.9 km s^-1</text>
    <text x="300" y="501">T = 2 pi R / v = 5060 s = 84 min</text>
    <text x="300" y="523">G m M / r^2 = m v^2 / r  ->  v = sqrt(G M / r) (3.15)</text>
  </g>
  <g class="t">
    <text x="300" y="546">7.9 km s^-1 is the critical (minimum) velocity for a low</text>
    <text x="300" y="562">orbit; a lower speed brings the satellite tumbling back</text>
    <text x="300" y="580">higher orbit: g falls as 1/r^2, so the speed needed is</text>
    <text x="300" y="596">lower and the period longer; the satellite mass is irrelevant</text>
    <text x="300" y="620"><tspan class="b">Example 3.4:</tspan> h = 384 000 km, r = 390 400 km:</text>
    <text x="300" y="636">v = sqrt(6.67 x 10^-11 x 6 x 10^24 / 3.904 x 10^8)</text>
    <text x="300" y="652">  = 1.025 km s^-1; T = 2 pi r / v = 27.7 days</text>
    <text x="70" y="680">orbits box: escape 11 km s^-1 (40 000 km h^-1); circular 27 000 km h^-1; elliptical 30 000 km h^-1</text>
  </g>
  <!-- weightlessness and artificial gravity -->
  <rect x="630" y="385" width="520" height="310" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="890" y="413">Weightlessness (Fig. 3.13) and artificial gravity (Fig. 3.14)</text>
  <g class="f">
    <text x="650" y="442">Fc = m g - F_N  (3.16);  m v^2 / r = m g - F_N  (3.16-a)</text>
    <text x="650" y="462">for the satellite: M g = M v^2 / r, so g = v^2 / r, hence F_N = 0</text>
  </g>
  <g class="t">
    <text x="650" y="488">a mass hung from a spring balance in an orbiting satellite feels weight mg</text>
    <text x="650" y="504">down and the normal force F_N up; their resultant is the centripetal force,</text>
    <text x="650" y="520">and since gravity alone supplies it, F_N = 0: apparent weightlessness, as in</text>
    <text x="650" y="536">a freely falling body (astronauts float in the cabin)</text>
  </g>
  <g class="f">
    <text x="650" y="566">a_c = R omega^2 = R (2 pi / T)^2 = 4 pi^2 R f^2</text>
    <text x="650" y="586">a_c = g  ->  f = (1/(2 pi)) sqrt(g / R)  (3.17)</text>
  </g>
  <g class="t">
    <text x="650" y="612">a wheel-shaped spaceship of outer radius R spun at this frequency presses</text>
    <text x="650" y="628">the astronaut against the outer rim, which supplies the centripetal force,</text>
    <text x="650" y="644">so the rim feels like a floor with gravity like the Earth's</text>
    <text x="650" y="668"><tspan class="b">side notes:</tspan> weight changes only while a lift's velocity changes; water stays in a</text>
    <text x="650" y="684">bucket whirled fast in a vertical circle; Newton predicted artificial satellites in the Principia</text>
  </g>
  <text class="s" x="600" y="712" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
