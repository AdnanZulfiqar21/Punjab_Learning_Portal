<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original redraw after Figure 2.16: two bodies collide and stick together. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Perfectly inelastic collision in one dimension</text>
  <text x="40.0" y="130.0" font-size="18" fill="#4b5563" text-anchor="start" font-weight="700">before</text>
  <circle cx="230.0" cy="125.0" r="34.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="230.0" y="131.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">m1</text>
  <line x1="272.0" y1="125.0" x2="369.6" y2="125.0" stroke="#1f6fb5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M380.0 125.0 L368.2 130.5 L368.2 119.5 Z" fill="#1f6fb5"/>
  <text x="326.0" y="110.0" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700">v1i</text>
  <circle cx="560.0" cy="125.0" r="34.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="560.0" y="131.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">m2</text>
  <line x1="602.0" y1="125.0" x2="659.6" y2="125.0" stroke="#d7322f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M670.0 125.0 L658.2 130.5 L658.2 119.5 Z" fill="#d7322f"/>
  <text x="636.0" y="110.0" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700">v2i</text>
  <text x="790.0" y="131.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="400">v1i &gt; v2i</text>
  <line x1="40.0" y1="190.0" x2="860.0" y2="190.0" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <text x="40.0" y="270.0" font-size="18" fill="#4b5563" text-anchor="start" font-weight="700">after</text>
  <circle cx="420.0" cy="265.0" r="46.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <circle cx="380.0" cy="265.0" r="34.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="400.0" y="272.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">m1 + m2</text>
  <line x1="470.0" y1="265.0" x2="579.6" y2="265.0" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M590.0 265.0 L578.2 270.5 L578.2 259.5 Z" fill="#7c3aed"/>
  <text x="530.0" y="250.0" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="700">vf</text>
  <text x="450.0" y="345.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">The bodies stick together: m1 v1i + m2 v2i = (m1 + m2) vf</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
