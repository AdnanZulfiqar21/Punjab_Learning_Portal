<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 2.16 (PDF page 45), original drawing after the printed figure: m1 with v1i and m2 with v2i before the collision; after it the two stick together as m1 + m2 moving with vf. -->
  <defs><radialGradient id="ballB" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#f2fbff"/><stop offset="0.45" stop-color="#7fd3f3"/><stop offset="1" stop-color="#1e98cf"/></radialGradient><radialGradient id="ballR" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#fff1ea"/><stop offset="0.45" stop-color="#f6a184"/><stop offset="1" stop-color="#d9603d"/></radialGradient></defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450.0" y="44.0" font-size="30" fill="#2b8fc9" text-anchor="middle" font-weight="400">Before collision</text>
  <circle cx="120.0" cy="150.0" r="48.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <text x="120.0" y="82.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <line x1="168.0" y1="150.0" x2="310.8" y2="150.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M330.0 150.0 L306.0 160.1 L306.0 139.9 Z" fill="#1a1a1a"/>
  <text x="300.0" y="124.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1i</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="620.0" cy="150.0" r="64.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <text x="620.0" y="66.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <line x1="684.0" y1="150.0" x2="790.8" y2="150.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M810.0 150.0 L786.0 160.1 L786.0 139.9 Z" fill="#1a1a1a"/>
  <text x="800.0" y="124.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">2i</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="450.0" y="300.0" font-size="30" fill="#2b8fc9" text-anchor="middle" font-weight="400">After collision</text>
  <circle cx="430.0" cy="430.0" r="84.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <circle cx="430.0" cy="430.0" r="34.0" stroke="#111" stroke-width="2" fill="#1d1d1d"/>
  <line x1="430.0" y1="430.0" x2="620.8" y2="430.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M640.0 430.0 L616.0 440.1 L616.0 419.9 Z" fill="#1a1a1a"/>
  <text x="600.0" y="404.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">f</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="330.0" y="410.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan> + <tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
</svg>
