<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original: a predictive model forecasting grades beside a cause-and-effect arrow. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Prediction and causation (after 6.9)</text>
  <rect x="15.0" y="55.0" width="420.0" height="340.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">prediction: what will happen?</text>
  <rect x="40.0" y="125.0" width="160.0" height="50.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="120.0" y="148.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">past data</text>
  <text x="120.0" y="164.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">marks, attendance</text>
  <rect x="250.0" y="125.0" width="140.0" height="50.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="320.0" y="155.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">model</text>
  <line x1="202.0" y1="150.0" x2="240.8" y2="150.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M248.0 150.0 L239.8 153.8 L239.8 146.2 Z" fill="#14181f"/>
  <line x1="320.0" y1="177.0" x2="320.0" y2="222.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M320.0 230.0 L316.2 221.8 L323.8 221.8 Z" fill="#14181f"/>
  <rect x="235.0" y="232.0" width="170.0" height="46.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="320.0" y="253.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">forecast</text>
  <text x="320.0" y="269.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">likely final grade</text>
  <text x="225.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">can be accurate without</text>
  <text x="225.0" y="348.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">knowing the reason</text>
  <rect x="450.0" y="55.0" width="435.0" height="340.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="667.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">causation: why does it happen?</text>
  <rect x="475.0" y="125.0" width="170.0" height="50.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="560.0" y="148.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">cause</text>
  <text x="560.0" y="164.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">regular study hours</text>
  <rect x="715.0" y="125.0" width="150.0" height="50.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="790.0" y="148.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">effect</text>
  <text x="790.0" y="164.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">better grades</text>
  <line x1="647.0" y1="150.0" x2="703.2" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M712.0 150.0 L702.0 154.6 L702.0 145.4 Z" fill="#14181f"/>
  <text x="667.0" y="240.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">shown by experiments that change</text>
  <text x="667.0" y="258.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">one factor and keep others fixed;</text>
  <text x="667.0" y="276.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">e.g. smoking causes lung disease</text>
  <text x="667.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">two things rising together</text>
  <text x="667.0" y="348.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">is not enough to prove cause</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
