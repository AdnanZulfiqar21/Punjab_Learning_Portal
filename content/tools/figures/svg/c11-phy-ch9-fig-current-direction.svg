<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original redraw after Figure 9.20: conventional current flows from the positive terminal round the circuit; electrons flow the opposite way. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Conventional current and electron flow</text>
  <path d="M150.0 110.0 L750.0 110.0 L750.0 330.0 L150.0 330.0 L150.0 110.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="380.0" y="85.0" width="140.0" height="50.0" rx="6" stroke="#14181f" stroke-width="2.5" fill="#e5e7eb"/>
  <text x="450.0" y="116.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">device</text>
  <rect x="430" y="318" width="40" height="24" fill="#ffffff"/>
  <line x1="446.0" y1="314.0" x2="446.0" y2="346.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="455.0" y1="322.0" x2="455.0" y2="338.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="436.0" y="366.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="466.0" y="366.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <path d="M285.6 160.1 A175 175 0 0 1 614.4 160.1" stroke="#d7322f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M614.4 160.1 L606.7 152.4 L615.4 149.2 Z" fill="#d7322f"/>
  <text x="230.0" y="195.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">conventional current</text>
  <text x="230.0" y="215.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="400">(from + to - outside the cell)</text>
  <path d="M323.1 266.2 A135 135 0 0 0 576.9 266.2" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M576.9 266.2 L577.8 277.1 L569.1 274.0 Z" fill="#1f6fb5"/>
