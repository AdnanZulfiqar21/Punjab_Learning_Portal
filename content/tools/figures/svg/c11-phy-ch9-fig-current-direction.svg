  <text x="670.0" y="280.0" font-size="14" fill="#1f6fb5" text-anchor="end" font-weight="400">(from - to +)</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
