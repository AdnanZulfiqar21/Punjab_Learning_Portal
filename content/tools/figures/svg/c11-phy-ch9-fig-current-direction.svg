<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig. 9.20: a circuit with a device at the top and a battery (+ left, - right) at the bottom; conventional current (solid arrow) leaves the + terminal and goes up the left side; electron flow (dashed arrow) leaves the - terminal and goes up the right side. -->
  <rect width="1000" height="470" fill="#ffffff"/>
  <path d="M400.0 110.0 L80.0 110.0 L80.0 400.0 L920.0 400.0 L920.0 110.0 L600.0 110.0" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="400.0" y="50.0" width="200.0" height="120.0" rx="0" stroke="#1a1a1a" stroke-width="3" fill="#ffffff"/>
  <text x="500.0" y="122.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">Device</text>
  <rect x="486.0" y="370.0" width="28.0" height="60.0" rx="0" stroke="none" stroke-width="0" fill="#ffffff"/>
  <line x1="493.0" y1="372.0" x2="493.0" y2="428.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="507.0" y1="386.0" x2="507.0" y2="414.0" stroke="#1a1a1a" stroke-width="7" stroke-linecap="butt"/>
  <text x="470.0" y="450.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">+</text>
  <text x="530.0" y="450.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">−</text>
  <path d="M440 350 L150 350 Q125 350 125 325 L125 180" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M125.0 168.0 L134.2 190.0 L115.8 190.0 Z" fill="#1a1a1a"/>
  <path d="M560 350 L850 350 Q875 350 875 325 L875 180" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-dasharray="10 7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M875.0 168.0 L884.2 190.0 L865.8 190.0 Z" fill="#1a1a1a"/>
  <text x="170.0" y="240.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">Conventional</text>
  <text x="170.0" y="278.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="400">current</text>
  <text x="830.0" y="240.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400">Electron</text>
  <text x="830.0" y="278.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400">flow</text>
</svg>
