<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Interesting Information box on the Rubens tube (C12-PHY, PDF p39): the portrait printed in the box, drawn as a flat greyscale picture in an oval vignette as printed: head and shoulders of a man turned slightly to the viewer's left, thick dark hair swept up, long sideburns, a high white collar with a large dark bow tie, a white shirt front and a dark coat. No picture is reproduced. -->
  <rect width="800" height="1000" fill="#ffffff"/>
  <defs>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#8c8c8c"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <clipPath id="oval"><ellipse cx="400" cy="500" rx="330" ry="450"/></clipPath>
  </defs>
  <ellipse cx="400" cy="500" rx="340" ry="460" fill="url(#vig)"/>
  <g clip-path="url(#oval)">
    <ellipse cx="400" cy="430" rx="300" ry="380" fill="#9a9a9a" opacity="0.6"/>
    <!-- dark coat -->
    <path d="M60 1000 C 80 780 170 690 300 650 L 400 720 L 500 650 C 630 690 720 780 740 1000 Z" fill="#232323"/>
    <path d="M300 650 L 360 1000 L 300 1000 L 230 760 Z M500 650 L 440 1000 L 500 1000 L 570 760 Z" fill="#3a3a3a"/>
    <!-- white shirt front -->
    <path d="M345 700 L 400 720 L 455 700 L 440 1000 L 360 1000 Z" fill="#ececec"/>
    <path d="M400 760 V1000" stroke="#c8c8c8" stroke-width="3"/>
    <!-- neck and high white collar -->
    <path d="M350 560 L 345 660 L 455 660 L 450 560 Z" fill="#cfcfcf"/>
    <path d="M330 610 L 355 690 L 400 680 L 445 690 L 470 610 L 455 600 L 445 650 L 400 655 L 355 650 L 345 600 Z" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="3"/>
    <!-- large dark bow tie -->
    <path d="M400 690 L 320 650 L 300 720 L 400 705 Z M400 690 L 480 650 L 500 720 L 400 705 Z" fill="#141414"/>
    <ellipse cx="400" cy="698" rx="20" ry="16" fill="#0c0c0c"/>
    <!-- head -->
    <path d="M285 330 C 285 230 340 180 405 180 C 475 180 520 230 522 320 C 530 420 510 500 475 545 C 450 580 420 590 395 588 C 360 586 330 570 310 535 C 290 495 280 420 285 330 Z" fill="#d9d9d9"/>
    <!-- thick dark hair swept up, long sideburns -->
    <path d="M270 330 C 250 220 320 130 410 128 C 500 126 560 200 545 320 C 535 290 520 260 500 245 C 470 225 430 222 400 228 C 360 232 330 245 310 270 C 300 300 300 380 305 450 C 285 420 272 380 270 330 Z" fill="#2a2a2a"/>
    <path d="M300 330 C 290 380 295 440 315 480 L 325 470 C 315 420 312 370 318 330 Z" fill="#2a2a2a"/>
    <path d="M522 320 C 530 370 525 420 510 460 L 498 452 C 508 410 510 365 505 325 Z" fill="#2a2a2a"/>
    <path d="M340 175 C 380 150 440 150 480 175 M320 210 C 370 180 450 178 500 205" stroke="#4a4a4a" stroke-width="6" fill="none"/>
    <!-- ears -->
    <path d="M300 380 C 282 375 278 405 286 425 C 292 440 304 442 310 432 Z" fill="#c4c4c4"/>
    <!-- brows, eyes -->
    <path d="M335 335 C 355 322 380 322 395 332 M425 330 C 442 320 468 320 485 332" stroke="#3a3a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="368" cy="358" rx="16" ry="7" fill="#f4f4f4"/><ellipse cx="455" cy="356" rx="16" ry="7" fill="#f4f4f4"/>
    <circle cx="366" cy="358" r="6" fill="#2e2e2e"/><circle cx="453" cy="356" r="6" fill="#2e2e2e"/>
    <!-- nose -->
    <path d="M410 360 C 405 400 400 430 392 450 C 405 462 425 462 432 452" stroke="#9a9a9a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- mouth and chin -->
    <path d="M375 500 C 395 508 420 508 440 498" stroke="#7a7a7a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M370 550 C 395 565 425 565 448 548" stroke="#b5b5b5" stroke-width="3" fill="none"/>
    <!-- cheek shading -->
    <path d="M310 420 C 320 480 345 530 380 560 C 345 550 318 500 308 460 Z" fill="#c2c2c2"/>
  </g>
</svg>
