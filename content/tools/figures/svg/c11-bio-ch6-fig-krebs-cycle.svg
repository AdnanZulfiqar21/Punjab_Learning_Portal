<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.16 and 5.17: pyruvic acid oxidation and the Krebs cycle. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .w{font-size:17px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Pyruvic acid oxidation and the Krebs (citric acid) cycle, in the mitochondrion</text>
  <!-- pyruvate oxidation strip -->
  <rect x="40" y="90" width="150" height="50" rx="10" fill="#5b3fb5"/><text class="w" x="115" y="121">Pyruvic acid (3C)</text>
  <path d="M195 115 H250" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="222" y="80">CO2 out</text>
  <rect x="255" y="90" width="150" height="50" rx="10" fill="#9ca3af"/><text class="w" x="330" y="121">Acetaldehyde (2C)</text>
  <path d="M410 115 H465" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="437" y="80">NAD+ to NADH</text>
  <rect x="470" y="90" width="140" height="50" rx="10" fill="#9ca3af"/><text class="w" x="540" y="121">Acetyl group</text>
  <path d="M615 115 H670" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="642" y="80">+ CoA</text>
  <rect x="675" y="90" width="150" height="50" rx="10" fill="#0f7a62"/><text class="w" x="750" y="121">Acetyl-CoA (2C)</text>
  <path d="M750 145 L660 275" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- cycle -->
  <circle cx="600" cy="520" r="250" fill="none" stroke="#e5e7eb" stroke-width="36"/>
  <g fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)">
    <path d="M690 300 A250 250 0 0 1 830 440"/>
    <path d="M845 560 A250 250 0 0 1 760 715"/>
    <path d="M640 768 A250 250 0 0 1 450 740"/>
    <path d="M375 640 A250 250 0 0 1 360 450"/>
    <path d="M410 350 A250 250 0 0 1 520 285"/>
  </g>
  <!-- compounds -->
  <rect x="530" y="255" width="160" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="610" y="284">Citric acid (6C)</text>
  <rect x="770" y="455" width="190" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="865" y="484">Alpha-ketoglutaric (5C)</text>
  <rect x="700" y="690" width="160" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="780" y="719">Succinyl-CoA (4C)</text>
  <rect x="440" y="745" width="160" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="520" y="774">Succinic acid (4C)</text>
  <rect x="290" y="620" width="160" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="370" y="649">Fumaric acid (4C)</text>
  <rect x="270" y="430" width="160" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="350" y="459">Malic acid (4C)</text>
  <rect x="340" y="305" width="190" height="46" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="435" y="334">Oxaloacetic acid (4C)</text>
  <!-- step annotations -->
  <text class="s" x="920" y="360">CO2 out; NAD+ to NADH</text>
  <text class="s" x="960" y="620">CO2 out; NAD+ to NADH; + CoA</text>
  <text class="s" x="680" y="800">CoA released; ATP made</text>
  <text class="s" x="330" y="720">FAD to FADH2</text>
  <text class="s" x="240" y="550">+ H2O</text>
  <text class="s" x="300" y="390">NAD+ to NADH</text>
  <text class="s" x="540" y="230">acetyl (2C) + oxaloacetic (4C)</text>
  <!-- cycle label -->
  <text class="h" x="600" y="510" style="font-size:24px">Krebs cycle</text>
  <text class="s" x="600" y="540">per acetyl-CoA: 2 CO2, 3 NADH,</text><text class="s" x="600" y="562">1 FADH2, 1 ATP</text>
  <text class="s" x="1000" y="820">Sir Hans Krebs worked out most of this cycle.</text>
</svg>
