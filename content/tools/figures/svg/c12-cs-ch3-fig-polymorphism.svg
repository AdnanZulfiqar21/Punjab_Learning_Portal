<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original: compile-time (overloading imitated with defaults and *args) and runtime (overriding) polymorphism. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Polymorphism: one name, many forms (after Fig 3.6)</text>
  <rect x="350.0" y="68.0" width="200.0" height="44.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="450.0" y="95.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">polymorphism</text>
  <rect x="110.0" y="165.0" width="240.0" height="50.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="188.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">compile-time</text>
  <text x="230.0" y="204.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">method overloading</text>
  <rect x="550.0" y="165.0" width="240.0" height="50.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="188.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">runtime</text>
  <text x="670.0" y="204.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">method overriding</text>
  <line x1="450.0" y1="112.0" x2="450.0" y2="140.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="230.0" y1="140.0" x2="670.0" y2="140.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="230.0" y1="140.0" x2="230.0" y2="155.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 163.0 L226.2 154.8 L233.8 154.8 Z" fill="#14181f"/>
  <line x1="670.0" y1="140.0" x2="670.0" y2="155.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M670.0 163.0 L666.2 154.8 L673.8 154.8 Z" fill="#14181f"/>
  <rect x="40.0" y="250.0" width="380.0" height="180.0" rx="8" stroke="#1f6fb5" stroke-width="1.5" fill="#ffffff"/>
  <text x="55.0" y="278.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Python has no true overloading;</text>
  <text x="55.0" y="300.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">one method takes different inputs:</text>
  <text x="55.0" y="322.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">multiply()        -&gt; 1</text>
  <text x="55.0" y="344.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">multiply(4)       -&gt; 4</text>
  <text x="55.0" y="366.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">multiply(2, 3)    -&gt; 6</text>
  <text x="55.0" y="388.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">multiply(2, 3, 4) -&gt; 24</text>
  <rect x="480.0" y="250.0" width="380.0" height="180.0" rx="8" stroke="#0f7a62" stroke-width="1.5" fill="#ffffff"/>
  <text x="670.0" y="278.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">same call: animal.sound()</text>
  <rect x="510.0" y="300.0" width="100.0" height="30.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="560.0" y="319.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Dog</text>
  <line x1="612.0" y1="315.0" x2="643.6" y2="315.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M650.0 315.0 L642.7 318.4 L642.7 311.6 Z" fill="#14181f"/>
  <text x="660.0" y="320.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">"Bark"</text>
  <rect x="510.0" y="338.0" width="100.0" height="30.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="560.0" y="357.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Cat</text>
  <line x1="612.0" y1="353.0" x2="643.6" y2="353.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M650.0 353.0 L642.7 356.4 L642.7 349.6 Z" fill="#14181f"/>
  <text x="660.0" y="358.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">"Meow"</text>
  <rect x="510.0" y="376.0" width="100.0" height="30.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="560.0" y="395.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Animal</text>
  <line x1="612.0" y1="391.0" x2="643.6" y2="391.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M650.0 391.0 L642.7 394.4 L642.7 387.6 Z" fill="#14181f"/>
  <text x="660.0" y="396.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">"Some generic sound"</text>
  <text x="450.0" y="470.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">The object decides which version runs; the calling code stays the same.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
