<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram after Fig 21.8: a widening cone from the Big Bang through recombination (380 thousand years), the first stars (300 million years) and early galaxies (1 billion years) to today's galaxies about 13.8 billion years later. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Timeline of the universe (after Fig 21.8)</text>
  <path d="M60.0 230.0 L840.0 185.0 L840.0 275.0 Z" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="90.0" cy="230.0" r="9.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <text x="90.0" y="172.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Big Bang</text>
  <text x="90.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">0</text>
  <circle cx="240.0" cy="230.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="240.0" y="142.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">recombination: first</text>
  <text x="240.0" y="157.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">atoms, light travels</text>
  <text x="240.0" y="172.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">freely</text>
  <text x="240.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">380 thousand years</text>
  <circle cx="420.0" cy="230.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="420.0" y="172.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">first stars appear</text>
  <text x="420.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">300 million years</text>
  <circle cx="590.0" cy="230.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="590.0" y="172.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">early galaxies</text>
  <text x="590.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">1 billion years</text>
  <circle cx="780.0" cy="230.0" r="9.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="780.0" y="142.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">modern galaxies,</text>
  <text x="780.0" y="157.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">expansion</text>
  <text x="780.0" y="172.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">accelerating</text>
  <text x="780.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">today, about</text>
  <text x="780.0" y="315.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">13.8 billion years</text>
  <text x="450.0" y="385.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Running the expansion backwards: galaxies were once closer, and all matter began in a very small, hot, dense state.</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
