<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.4 to 3.7: electronegativity difference and bond type, the HF dipole, vector addition in H2O and SO2, and cancellation in symmetrical molecules. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .e{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#dbe9f5"/><stop offset="0.5" stop-color="#fff4e2"/><stop offset="1" stop-color="#f6d5cf"/></linearGradient>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Electronegativity difference, bond type and dipole moment</text>
  <!-- scale -->
  <rect x="100" y="60" width="1000" height="36" rx="8" fill="url(#g)" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#4b5563" stroke-width="2"><path d="M100 96 V110 M300 96 V110 M700 96 V110 M1100 96 V110"/></g>
  <g class="s"><text x="100" y="128">0</text><text x="300" y="128">0.4</text><text x="700" y="128">1.8</text><text x="1100" y="128">difference</text></g>
  <g class="k"><text x="200" y="84">pure covalent</text><text x="500" y="84">polar covalent</text><text x="900" y="84">ionic</text></g>
  <g class="s"><text x="200" y="150">H-H: 0</text><text x="500" y="150">H-Cl: 0.9</text><text x="900" y="150">NaCl: 2.1</text></g>
  <text class="s" x="600" y="178">covalent character decreases from left to right; above 1.8 the bond is counted as ionic</text>
  <!-- HF dipole -->
  <text class="k" x="200" y="225">HF: a dipole</text>
  <ellipse cx="200" cy="290" rx="95" ry="42" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/>
  <ellipse cx="235" cy="290" rx="55" ry="36" fill="#9fc3e4" stroke="none"/>
  <circle cx="140" cy="290" r="8" fill="#14181f"/><circle cx="245" cy="290" r="11" fill="#14181f"/>
  <text class="e" x="140" y="355">H  delta+</text><text class="e" x="245" y="355">F  delta-</text>
  <path d="M120 380 H280" stroke="#d7322f" stroke-width="3" marker-end="url(#ad)"/>
  <text class="s" x="200" y="405">dipole moment points from delta+ to delta-</text><text class="s" x="200" y="423">electron density is higher near F; unit: debye (D)</text>
  <!-- H2O and SO2 -->
  <text class="k" x="560" y="225">Angular molecules add their bond moments</text>
  <circle cx="470" cy="300" r="18" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="470" y="306">O</text>
  <circle cx="420" cy="350" r="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="420" y="355" style="fill:#14181f">H</text>
  <circle cx="520" cy="350" r="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="520" y="355" style="fill:#14181f">H</text>
  <g stroke="#4b5563" stroke-width="2"><path d="M430 340 L458 312 M510 340 L482 312"/></g>
  <path d="M500 372 V262" stroke="#d7322f" stroke-width="3" marker-end="url(#ad)"/>
  <text class="s" x="470" y="395">H2O: 1.85 D, towards O</text><text class="s" x="470" y="413">a linear H-O-H would be 0 D,</text><text class="s" x="470" y="431">so water is v-shaped</text>
  <circle cx="660" cy="300" r="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="e" x="660" y="306">S</text>
  <circle cx="605" cy="350" r="15" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="s" x="605" y="355" style="fill:#14181f">O</text>
  <circle cx="715" cy="350" r="15" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="s" x="715" y="355" style="fill:#14181f">O</text>
  <g stroke="#4b5563" stroke-width="2"><path d="M616 340 L648 312 M612 334 L644 306 M704 340 L672 312 M708 334 L676 306"/></g>
  <path d="M690 262 V372" stroke="#d7322f" stroke-width="3" marker-end="url(#ad)"/>
  <text class="s" x="660" y="395">SO2: 1.61 D, away from S</text><text class="s" x="660" y="413">bonds polar, do not cancel</text><text class="s" x="660" y="431">(H2S likewise non-linear, polar)</text>
  <!-- symmetrical zero -->
  <text class="k" x="960" y="225">Symmetrical molecules cancel: 0 D</text>
  <circle cx="880" cy="300" r="16" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="880" y="305" style="fill:#14181f;font-weight:700">Be</text>
  <circle cx="820" cy="300" r="13" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="s" x="820" y="305" style="fill:#14181f">Cl</text>
  <circle cx="940" cy="300" r="13" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="s" x="940" y="305" style="fill:#14181f">Cl</text>
  <path d="M870 285 H838" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#ab)"/><path d="M890 285 H922" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="s" x="880" y="340">BeCl2 linear, 180 degrees</text>
  <circle cx="1060" cy="300" r="16" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="1060" y="305" style="fill:#14181f;font-weight:700">B</text>
  <circle cx="1060" cy="248" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="s" x="1060" y="252" style="fill:#14181f">F</text>
  <circle cx="1015" cy="326" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="s" x="1015" y="330" style="fill:#14181f">F</text>
  <circle cx="1105" cy="326" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="s" x="1105" y="330" style="fill:#14181f">F</text>
  <g stroke="#1f6fb5" stroke-width="2.5"><path d="M1060 284 V268" marker-end="url(#ab)"/><path d="M1046 308 L1032 316" marker-end="url(#ab)"/><path d="M1074 308 L1088 316" marker-end="url(#ab)"/></g>
  <text class="s" x="1060" y="358">BF3 trigonal planar, 120 degrees</text>
  <text class="s" x="960" y="395">CCl4 and CH4: four equal bonds to the corners of a regular</text><text class="s" x="960" y="413">tetrahedron cancel; the molecule is non-polar although</text><text class="s" x="960" y="431">each C-Cl bond is polar (same ligands, regular geometry)</text>
  <rect x="60" y="470" width="1080" height="160" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="s">
    <text x="600" y="498" style="font-weight:700;fill:#14181f">Reading the chart</text>
    <text x="600" y="524">A difference below 0.4 gives a pure covalent bond, 0.4 to 1.8 a polar covalent bond, above 1.8 an ionic bond.</text>
    <text x="600" y="546">In a diatomic molecule the dipole moment runs from the delta+ end to the delta- end (HF, HCl, HBr, HI, NO).</text>
    <text x="600" y="568">In larger molecules the bond moments add as vectors: angular H2O and SO2 keep a net moment,</text>
    <text x="600" y="590">while BeCl2, BF3, CH4 and CCl4 with identical ligands in a regular geometry sum to zero and are non-polar.</text>
    <text x="600" y="612">Arrows: bond or net dipole moments. Values as printed: H2O 1.85 D, SO2 1.61 D.</text>
  </g>
</svg>
