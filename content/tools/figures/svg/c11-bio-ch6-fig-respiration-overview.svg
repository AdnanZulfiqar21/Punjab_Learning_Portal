<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.14: overview of cellular respiration. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:19px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Overview of cellular respiration</text>
  <!-- cytosol region -->
  <rect x="40" y="90" width="420" height="300" rx="18" fill="#eef6fb" stroke="#1f6fb5" stroke-width="3"/>
  <text class="s" x="250" y="120">cytosol: oxygen not essential</text>
  <rect x="80" y="180" width="160" height="56" rx="12" fill="#d98b2b"/><text class="b" x="160" y="215">Glucose</text>
  <path d="M245 208 H300" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="272" y="170">glycolysis</text>
  <rect x="305" y="180" width="140" height="56" rx="12" fill="#5b3fb5"/><text class="b" x="375" y="215">Pyruvic acid</text>
  <path d="M375 240 V300" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="240" y="305" width="210" height="60" rx="12" fill="#9ca3af"/><text class="b" x="345" y="330">anaerobic: lactic acid</text><text class="b" x="345" y="352">or ethanol + CO2</text>
  <!-- mitochondrion region -->
  <rect x="500" y="90" width="660" height="420" rx="120" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <rect x="520" y="110" width="620" height="380" rx="100" fill="none" stroke="#8a4b00" stroke-width="3"/>
  <text class="s" x="830" y="140">mitochondrion: oxygen essential (aerobic)</text>
  <path d="M450 208 H540" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="545" y="180" width="150" height="56" rx="12" fill="#0f7a62"/><text class="b" x="620" y="215">Acetyl-CoA</text>
  <text class="s" x="620" y="260">pyruvic acid oxidation; CO2 out</text>
  <path d="M700 208 H760" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="840" cy="208" r="60" fill="#e8dff7" stroke="#5b3fb5" stroke-width="5"/><text class="k" x="840" y="203">Krebs</text><text class="k" x="840" y="226">cycle</text>
  <text class="s" x="800" y="300">CO2 out; NADH,</text><text class="s" x="800" y="324">FADH2, ATP</text>
  <path d="M905 208 H960" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="965" y="160" width="160" height="96" rx="12" fill="#1f6fb5"/><text class="b" x="1045" y="198">Electron</text><text class="b" x="1045" y="222">transport chain</text>
  <text class="s" x="1045" y="300">chemiosmosis</text><text class="s" x="1045" y="324">makes most ATP</text>
  <rect x="990" y="380" width="110" height="46" rx="10" fill="#9ca3af"/><text class="b" x="1045" y="410">O2 in</text>
  <path d="M1045 375 V260" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="800" y="380" width="110" height="46" rx="10" fill="#dbe9f5"/><text class="b" x="855" y="410" style="fill:#14181f">H2O out</text>
  <path d="M990 240 L910 380" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="600" y="570">C6H12O6 + 6O2 gives 6CO2 + 6H2O + energy. Four stages: glycolysis, pyruvic acid oxidation, Krebs cycle, electron transport chain.</text>
  <text class="s" x="600" y="600">Respiration turns glucose into carbon dioxide and oxygen into water; CO2 is released before oxygen is involved.</text>
</svg>
