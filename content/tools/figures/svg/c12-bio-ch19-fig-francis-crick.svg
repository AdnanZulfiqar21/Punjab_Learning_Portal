  <path d="M432 520 L462 512 L470 600 L440 720 L415 700 L425 600 Z" fill="#d8d2c4"/>
  <g fill="#9c9282"><circle cx="445" cy="545" r="4"/><circle cx="455" cy="575" r="4"/><circle cx="440" cy="605" r="4"/><circle cx="450" cy="635" r="4"/><circle cx="435" cy="665" r="4"/><circle cx="430" cy="695" r="4"/></g>
  <!-- neck and head -->
  <path d="M405 430 L405 505 C430 515 460 505 470 490 L468 420 Z" fill="#c9c0b6"/>
  <path d="M340 290 C340 220 385 185 440 185 C500 185 540 225 538 300 C536 380 505 450 450 470 C390 465 345 400 340 290 Z" fill="#d9d1c7"/>
