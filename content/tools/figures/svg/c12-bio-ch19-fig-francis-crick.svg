<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Vis19-2 (C12-BIO, PDF p130): flat drawing after the printed black-and-white photograph of Francis Crick, beside the start of 19.4 Gene Expression: an elderly man seen from the waist up, turned slightly to the right and leaning forward, with untidy white hair, a lined face and a slight smile, a dark suit jacket over a white shirt and a light patterned tie, against a dark sky, with a tall stepped dark building at the left edge and a low skyline behind. No photograph is reproduced. -->
