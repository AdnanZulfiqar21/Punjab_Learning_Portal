  <path d="M405 418 C425 430 455 430 478 415" stroke="#7d7066" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M380 360 C385 385 395 400 405 405 M500 355 C495 385 488 400 478 405" stroke="#b5aa9e" stroke-width="3" fill="none"/>
