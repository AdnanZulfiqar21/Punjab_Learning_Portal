<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 16.7 and 16.8: the positive feedback loop of oxytocin in childbirth, and the negative feedback loops of insulin and glucagon round normal blood glucose. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Positive and negative feedback in hormones</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) positive feedback: oxytocin in childbirth</text>
  <rect x="40.0" y="128.0" width="200.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="140.0" y="155.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">uterus contracts</text>
  <rect x="280.0" y="128.0" width="200.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="380.0" y="147.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">sensory neurons signal</text>
  <text x="380.0" y="163.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the hypothalamus</text>
  <rect x="520.0" y="128.0" width="200.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="620.0" y="147.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">posterior pituitary</text>
  <text x="620.0" y="163.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">releases oxytocin</text>
  <line x1="242.0" y1="150.0" x2="270.0" y2="150.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M278.0 150.0 L268.9 154.2 L268.9 145.8 Z" fill="#d7322f"/>
  <line x1="482.0" y1="150.0" x2="510.0" y2="150.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M518.0 150.0 L508.9 154.2 L508.9 145.8 Z" fill="#d7322f"/>
  <path d="M620 174 C620 236 140 236 140 176" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M140.0 176.0 L144.6 186.0 L135.4 186.0 Z" fill="#d7322f"/>
  <text x="380.0" y="234.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">stronger contractions: more oxytocin, until the baby is born</text>
  <text x="800.0" y="150.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the response</text>
  <text x="800.0" y="166.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">speeds itself up</text>
  <rect x="15.0" y="270.0" width="870.0" height="275.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="300.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) negative feedback: insulin and glucagon</text>
  <rect x="340.0" y="383.0" width="220.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="450.0" y="410.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">normal blood glucose</text>
  <rect x="45.0" y="308.0" width="230.0" height="44.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="160.0" y="335.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">glucose rises (after a meal)</text>
  <rect x="45.0" y="458.0" width="230.0" height="44.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="160.0" y="485.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">beta cells release insulin</text>
  <rect x="625.0" y="458.0" width="230.0" height="44.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="740.0" y="485.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">glucose falls (fasting)</text>
  <rect x="625.0" y="308.0" width="230.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="740.0" y="335.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">alpha cells release glucagon</text>
  <line x1="340.0" y1="390.0" x2="284.5" y2="349.7" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M278.0 345.0 L287.8 346.9 L282.9 353.7 Z" fill="#d98b2b"/>
  <line x1="160.0" y1="352.0" x2="160.0" y2="448.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M160.0 456.0 L155.8 446.9 L164.2 446.9 Z" fill="#1f6fb5"/>
  <line x1="278.0" y1="470.0" x2="333.8" y2="425.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M340.0 420.0 L335.6 429.0 L330.3 422.4 Z" fill="#1f6fb5"/>
  <line x1="560.0" y1="420.0" x2="615.8" y2="465.0" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M622.0 470.0 L612.3 467.6 L617.6 461.0 Z" fill="#d98b2b"/>
  <line x1="740.0" y1="456.0" x2="740.0" y2="362.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M740.0 354.0 L744.2 363.1 L735.8 363.1 Z" fill="#d7322f"/>
  <line x1="622.0" y1="340.0" x2="566.2" y2="385.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M560.0 390.0 L564.4 381.0 L569.7 387.6 Z" fill="#d7322f"/>
  <text x="330.0" y="466.0" font-size="11" fill="#1f6fb5" text-anchor="start" font-weight="700">cells take up glucose,</text>
  <text x="330.0" y="480.0" font-size="11" fill="#1f6fb5" text-anchor="start" font-weight="700">liver stores glycogen</text>
  <text x="570.0" y="360.0" font-size="11" fill="#d7322f" text-anchor="end" font-weight="700">liver breaks down</text>
  <text x="570.0" y="374.0" font-size="11" fill="#d7322f" text-anchor="end" font-weight="700">glycogen</text>
  <text x="450.0" y="445.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">back to normal: the hormone is switched off</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
