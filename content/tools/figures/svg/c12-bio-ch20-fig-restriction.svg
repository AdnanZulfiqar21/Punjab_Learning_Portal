  <text x="700.0" y="320.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">C</text>
  <text x="640.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">G</text>
  <text x="660.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
  <text x="680.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">C</text>
  <text x="700.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">G</text>
  <rect x="219.0" y="340.0" width="82.0" height="30.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <rect x="549.0" y="300.0" width="82.0" height="30.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text x="210.0" y="415.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">sticky end</text>
  <line x1="206.0" y1="410.0" x2="260.0" y2="372.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="260.0" cy="372.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="600.0" y="275.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">sticky end</text>
  <line x1="596.0" y1="270.0" x2="590.0" y2="300.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="590.0" cy="300.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="60.0" y="440.0" width="780.0" height="60.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="466.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">single-stranded AATT and TTAA ends are complementary, so any two fragments cut by</text>
  <text x="450.0" y="486.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the same enzyme can pair up again (and DNA ligase can seal them)</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
