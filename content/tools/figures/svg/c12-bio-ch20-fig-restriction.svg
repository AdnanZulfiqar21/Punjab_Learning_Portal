  <text x="150.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">T</text>
  <text x="170.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">G</text>
  <text x="190.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">C</text>
  <text x="210.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">C</text>
  <text x="230.0" y="360.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">T</text>
