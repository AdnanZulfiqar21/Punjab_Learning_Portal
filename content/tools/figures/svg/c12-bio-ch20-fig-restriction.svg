<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 20.1: double-stranded DNA with the palindromic site GAATTC cut by EcoRI in a staggered way, giving two fragments with complementary single-stranded sticky ends. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A restriction endonuclease cuts at its recognition site</text>
  <text x="450.0" y="72.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">example: the site GAATTC (cut by the enzyme EcoRI) reads the same 5' to 3' on both strands</text>
  <text x="230.0" y="140.0" font-size="14" fill="#1e3a8a" text-anchor="end" font-weight="700">5'</text>
  <text x="230.0" y="180.0" font-size="14" fill="#2563eb" text-anchor="end" font-weight="700">3'</text>
  <text x="260.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
  <text x="280.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">C</text>
  <text x="300.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">G</text>
  <text x="320.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">G</text>
  <text x="340.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
