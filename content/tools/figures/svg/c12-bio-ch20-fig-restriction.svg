  <text x="320.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">C</text>
  <text x="340.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">T</text>
  <text x="360.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">T</text>
  <text x="380.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
  <text x="400.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
  <text x="420.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">G</text>
