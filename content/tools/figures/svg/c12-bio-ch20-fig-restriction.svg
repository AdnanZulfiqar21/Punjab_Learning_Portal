  <text x="400.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">T</text>
  <text x="420.0" y="140.0" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">C</text>
