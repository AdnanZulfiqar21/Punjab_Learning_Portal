  <text x="480.0" y="180.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">G</text>
  <rect x="308.0" y="116.0" width="124.0" height="76.0" rx="6" stroke="#d98b2b" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <text x="370.0" y="110.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">recognition (restriction) site</text>
  <path d="M330.0 122 L330.0 152 L410.0 158 L410.0 196" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/>
