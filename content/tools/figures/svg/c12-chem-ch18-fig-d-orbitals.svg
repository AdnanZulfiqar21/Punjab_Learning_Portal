<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <!-- Original sketch of the 3dxy (four lobes between the axes), 3dx2-y2 (four lobes along the axes) and 3dz2 (two lobes along z with a ring) orbitals. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Shapes of three of the five 3d orbitals</text>
  <rect x="15.0" y="55.0" width="280.0" height="340.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <line x1="40.0" y1="215.0" x2="270.0" y2="215.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="155.0" y1="90.0" x2="155.0" y2="340.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="275.0" y="220.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">x</text>
  <text x="163.0" y="103.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">y</text>
  <ellipse cx="190.4" cy="250.4" rx="46.0" ry="22.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe" transform="rotate(45 190.4 250.4)"/>
  <ellipse cx="119.6" cy="250.4" rx="46.0" ry="22.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa" transform="rotate(135 119.6 250.4)"/>
  <ellipse cx="119.6" cy="179.6" rx="46.0" ry="22.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe" transform="rotate(225 119.6 179.6)"/>
  <ellipse cx="190.4" cy="179.6" rx="46.0" ry="22.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa" transform="rotate(315 190.4 179.6)"/>
  <text x="155.0" y="365.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">d</tspan><tspan dy="6.4" font-size="14.0">xy</tspan></text>
  <text x="155.0" y="386.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">four lobes between the x and y axes</text>
  <rect x="310.0" y="55.0" width="280.0" height="340.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <line x1="335.0" y1="215.0" x2="565.0" y2="215.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="450.0" y1="90.0" x2="450.0" y2="340.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="570.0" y="220.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">x</text>
  <text x="458.0" y="103.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">y</text>
  <ellipse cx="500.0" cy="215.0" rx="46.0" ry="22.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <ellipse cx="450.0" cy="265.0" rx="46.0" ry="22.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa" transform="rotate(90 450.0 265.0)"/>
  <ellipse cx="400.0" cy="215.0" rx="46.0" ry="22.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe" transform="rotate(180 400.0 215.0)"/>
  <ellipse cx="450.0" cy="165.0" rx="46.0" ry="22.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa" transform="rotate(270 450.0 165.0)"/>
  <text x="450.0" y="365.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">d</tspan><tspan dy="6.4" font-size="14.0">x2-y2</tspan></text>
  <text x="450.0" y="386.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">four lobes along the x and y axes</text>
  <rect x="605.0" y="55.0" width="280.0" height="340.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <line x1="630.0" y1="215.0" x2="860.0" y2="215.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="745.0" y1="90.0" x2="745.0" y2="340.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="865.0" y="220.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">x</text>
  <text x="753.0" y="103.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700" font-style="italic">z</text>
  <ellipse cx="745.0" cy="159.0" rx="26.0" ry="52.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <ellipse cx="745.0" cy="215.0" rx="52.0" ry="15.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <ellipse cx="745.0" cy="271.0" rx="26.0" ry="52.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="745.0" y="365.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">d</tspan><tspan dy="6.4" font-size="14.0">z2</tspan></text>
  <text x="745.0" y="386.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">two lobes along z and a ring round it</text>
  <text x="450.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the two shades show the opposite signs (phases) of each orbital</text>
  <text x="450.0" y="441" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
