<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 2.5 to 2.8: list indexing and slicing with positive and negative indices, lists and tuples, modules and packages, and a class with two objects plus the main OOP ideas. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Lists, tuples, indexing and slicing, modules and object-oriented programming</text>
  <rect x="50" y="55" width="1100" height="260" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Indexing and slicing (2.6)</text>
  <rect x="90" y="120" width="120" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="130" y="144">"Apple"</text>
  <text class="l" x="150" y="110" style="fill:#1f6fb5;text-anchor:middle">0</text>
  <text class="l" x="150" y="180" style="fill:#d7322f;text-anchor:middle">-5</text>
  <rect x="220" y="120" width="120" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="258" y="144">"Banana"</text>
  <text class="l" x="280" y="110" style="fill:#1f6fb5;text-anchor:middle">1</text>
  <text class="l" x="280" y="180" style="fill:#d7322f;text-anchor:middle">-4</text>
  <rect x="350" y="120" width="120" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="388" y="144">"Cherry"</text>
  <text class="l" x="410" y="110" style="fill:#1f6fb5;text-anchor:middle">2</text>
  <text class="l" x="410" y="180" style="fill:#d7322f;text-anchor:middle">-3</text>
  <rect x="480" y="120" width="120" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="523" y="144">"Date"</text>
  <text class="l" x="540" y="110" style="fill:#1f6fb5;text-anchor:middle">3</text>
  <text class="l" x="540" y="180" style="fill:#d7322f;text-anchor:middle">-2</text>
  <rect x="610" y="120" width="120" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="636" y="144">"Elderberry"</text>
  <text class="l" x="670" y="110" style="fill:#1f6fb5;text-anchor:middle">4</text>
  <text class="l" x="670" y="180" style="fill:#d7322f;text-anchor:middle">-1</text>
  <text class="r" x="60" y="110" style="fill:#1f6fb5">index</text>
  <text class="r" x="60" y="180" style="fill:#d7322f">neg.</text>
  <path d="M220 196 H600" stroke="#0f7a62" stroke-width="3"/>
  <text class="r" x="410" y="214" style="fill:#0f7a62;text-anchor:middle">fruits[1:4]: items 1, 2, 3 (stop 4 not included)</text>
  <g class="r">
    <text x="760" y="112">fruits[0] is the first item, fruits[-1] the last</text>
    <text x="760" y="128">fruits[-4:-1] gives Banana, Cherry, Date</text>
    <text x="760" y="144">sequence[start:stop:step]; stop is excluded</text>
    <text x="760" y="176">list: [ ] , changeable: append, remove, sort, reverse,</text>
    <text x="760" y="192">+ joins lists: [2, 3, 4] + [6, 7]</text>
    <text x="760" y="208">tuple: ( ) , ordered but immutable (cannot change)</text>
    <text x="760" y="224">len(my_tuple) counts the items</text>
  </g>
  <g class="r">
    <text x="70" y="262">fruits[0] = "Orange" changes an item; fruits.append("Pineapple") adds one at the end; students.sort() puts names in order</text>
  </g>
  <rect x="50" y="335" width="540" height="360" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="363">Modules and packages (2.5, 2.7)</text>
  <rect x="80" y="380" width="150" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="131" y="401">main.py</text>
  <rect x="330" y="380" width="160" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="369" y="401">greetings.py</text>
  <path d="M230 397 L326 397" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="240" y="388">import greetings</text>
  <rect x="80" y="440" width="180" height="34" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="108" y="461">package ecommerce/</text>
  <rect x="110" y="494" width="130" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="144" y="512">products.py</text>
  <rect x="260" y="494" width="130" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="291" y="512">customers.py</text>
  <rect x="410" y="494" width="130" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="450" y="512">orders.py</text>
  <g class="r">
    <text x="70" y="556">module: a .py file of functions, variables and classes to reuse</text>
    <text x="70" y="572">package: a folder of related modules (from ecommerce import products)</text>
    <text x="70" y="588">import search order: current folder, then the standard library</text>
    <text x="70" y="604">standard library: random, datetime, statistics, ...</text>
    <text x="70" y="620">if __name__ == "__main__": main()  runs main only when the file</text>
    <text x="70" y="636">is run directly, not when it is imported</text>
    <text x="70" y="652">run a CLI program from the terminal: python main.py</text>
  </g>
  <rect x="610" y="335" width="540" height="360" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="363">Classes and objects (2.8)</text>
  <rect x="640" y="380" width="200" height="110" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M640 404 H840" stroke="#14181f"/>
  <path d="M640 456 H840" stroke="#14181f"/>
  <text class="l" x="740" y="397" style="text-anchor:middle">ToyCar (class)</text>
  <text class="r" x="650" y="422">color, size, wheels</text>
  <text class="r" x="650" y="440">(attributes)</text>
  <text class="r" x="650" y="474">describe()  (method)</text>
  <rect x="900" y="380" width="220" height="44" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="946" y="406">car1: "red", "small", 4</text>
  <path d="M844 430 L896 402" stroke="#0f7a62" stroke-width="1.5" marker-end="url(#g)"/>
  <rect x="900" y="440" width="220" height="44" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="943" y="466">car2: "blue", "large", 6</text>
  <path d="M844 430 L896 462" stroke="#0f7a62" stroke-width="1.5" marker-end="url(#g)"/>
  <g class="r">
    <text x="630" y="520">class: a template; object: one thing made from it (an instance)</text>
    <text x="630" y="536">__init__ (constructor) sets up attributes; __del__ (destructor) cleans up</text>
    <text x="630" y="552">self is the object itself inside its methods</text>
    <text x="630" y="568">public color, protected _color, private __color (use a getter)</text>
    <text x="630" y="584">aggregation: a Library holds Books that exist on their own</text>
    <text x="630" y="600">composition: a House owns its Rooms</text>
    <text x="630" y="616">inheritance: Dog(Animal) reuses Animal; polymorphism:</text>
    <text x="630" y="632">make_sound() barks for a Dog and meows for a Cat</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
