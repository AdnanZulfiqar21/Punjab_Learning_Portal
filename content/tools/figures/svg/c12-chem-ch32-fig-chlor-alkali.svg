<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="570" fill="#ffffff"/>
  <!-- Original diagram for the chlor-alkali process in topic 32.12: brine is electrolysed in a membrane cell; chlorine forms at the anode, hydrogen and hydroxide ions at the cathode, and Na+ crosses the membrane so sodium hydroxide solution collects on the cathode side. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The chlor-alkali membrane cell</text>
  <g transform="translate(0,28)">
  <rect x="150.0" y="140.0" width="600.0" height="250.0" rx="6" stroke="#475569" stroke-width="2.5" fill="#f8fafc"/>
  <rect x="152.0" y="200.0" width="297.0" height="188.0" rx="0" stroke="#1f6fb5" stroke-width="0" fill="#e5effa"/>
  <rect x="452.0" y="200.0" width="296.0" height="188.0" rx="0" stroke="#0f7a62" stroke-width="0" fill="#e6f4ef"/>
  <line x1="450.0" y1="130.0" x2="450.0" y2="392.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
  <text x="450.0" y="412.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">ion-exchange membrane</text>
  <rect x="225.0" y="165.0" width="20.0" height="200.0" rx="3" stroke="#d7322f" stroke-width="1.8" fill="#fca5a5"/>
  <rect x="655.0" y="165.0" width="20.0" height="200.0" rx="3" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <line x1="235.0" y1="165.0" x2="235.0" y2="90.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="665.0" y1="165.0" x2="665.0" y2="90.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="235.0" y1="90.0" x2="420.0" y2="90.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="480.0" y1="90.0" x2="665.0" y2="90.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="420.0" y="75.0" width="60.0" height="30.0" rx="4" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="95.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">d.c.</text>
  <text x="235.0" y="82.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">anode (+)</text>
  <text x="665.0" y="82.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">cathode (-)</text>
  <line x1="300.0" y1="135.0" x2="300.0" y2="67.2" stroke="#0f7a62" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M300.0 60.0 L303.8 68.2 L296.2 68.2 Z" fill="#0f7a62"/>
  <text x="300.0" y="52.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> gas</tspan></text>
  <line x1="600.0" y1="135.0" x2="600.0" y2="67.2" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M600.0 60.0 L603.8 68.2 L596.2 68.2 Z" fill="#1f6fb5"/>
  <text x="600.0" y="52.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> gas</tspan></text>
  <text x="330.0" y="240.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">saturated brine</text>
  <text x="330.0" y="258.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">(NaCl solution)</text>
  <text x="560.0" y="240.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">water in;</text>
  <text x="560.0" y="258.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">NaOH solution out</text>
  <line x1="395.0" y1="330.0" x2="497.8" y2="330.0" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M505.0 330.0 L496.8 333.8 L496.8 326.2 Z" fill="#7c3aed"/>
  <text x="470.0" y="320.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700"><tspan dy="0.0">Na</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="330.0" y="370.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2Cl</tspan><tspan dy="-5.9" font-size="9.8">-</tspan><tspan dy="5.9"> -&gt; Cl</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2e</tspan><tspan dy="-5.9" font-size="9.8">-</tspan></text>
  <text x="555.0" y="370.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + 2e</tspan><tspan dy="-5.9" font-size="9.8">-</tspan><tspan dy="5.9"> -&gt; H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2OH</tspan><tspan dy="-5.9" font-size="9.8">-</tspan></text>
  <text x="450.0" y="455.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">overall: 2NaCl + 2H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O -&gt; 2NaOH + Cl</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="450.0" y="490.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">products used for plastics, detergents, water treatment and the textile industry</text>
  </g>
  <text x="450.0" y="561" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
