<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- The chlor-alkali membrane cell (our own diagram for topic 32.12; not a textbook figure). -->
  <rect x="120.0" y="150.0" width="760.0" height="330.0" rx="10" stroke="#4b5563" stroke-width="4" fill="#f7f9fc"/>
  <rect x="124.0" y="210.0" width="376.0" height="266.0" rx="0" stroke="none" stroke-width="0" fill="#dbe9f5"/>
  <rect x="500.0" y="210.0" width="376.0" height="266.0" rx="0" stroke="none" stroke-width="0" fill="#e6f4ef"/>
  <line x1="500.0" y1="150.0" x2="500.0" y2="480.0" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>
  <rect x="190.0" y="180.0" width="36.0" height="260.0" rx="6" stroke="#d7322f" stroke-width="3" fill="#f9a8a8"/>
  <rect x="774.0" y="180.0" width="36.0" height="260.0" rx="6" stroke="#1f6fb5" stroke-width="3" fill="#bcd7f2"/>
  <path d="M208 180 L208 100 L792 100 L792 180" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="450.0" y="80.0" width="100.0" height="40.0" rx="6" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <text x="500.0" y="109.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">d.c.</tspan></text>
  <text x="150.0" y="80.0" font-size="26" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">anode (+)</tspan></text>
  <text x="850.0" y="80.0" font-size="26" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">cathode (-)</tspan></text>
  <line x1="300.0" y1="200.0" x2="300.0" y2="52.8" stroke="#0f7a62" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M300.0 40.0 L306.8 54.5 L293.2 54.5 Z" fill="#0f7a62"/>
  <text x="315.0" y="50.0" font-size="28" fill="#0f7a62" text-anchor="start" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
  <line x1="700.0" y1="200.0" x2="700.0" y2="52.8" stroke="#1f6fb5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M700.0 40.0 L706.8 54.5 L693.2 54.5 Z" fill="#1f6fb5"/>
  <text x="685.0" y="50.0" font-size="28" fill="#1f6fb5" text-anchor="end" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
  <text x="330.0" y="270.0" font-size="28" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">brine</tspan></text>
  <text x="330.0" y="305.0" font-size="26" fill="#1f6fb5" text-anchor="middle" font-weight="600"><tspan dy="0.0">(NaCl solution)</tspan></text>
  <text x="660.0" y="270.0" font-size="28" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaOH</tspan></text>
  <text x="660.0" y="305.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="600"><tspan dy="0.0">solution</tspan></text>
  <line x1="420.0" y1="370.0" x2="577.2" y2="370.0" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M590.0 370.0 L575.5 376.8 L575.5 363.2 Z" fill="#7c3aed"/>
  <text x="520.0" y="355.0" font-size="28" fill="#7c3aed" text-anchor="start" font-weight="700"><tspan dy="0.0">Na</tspan><tspan dy="-11.2" font-size="20.2">+</tspan><tspan dy="11.2"></tspan></text>
  <text x="330.0" y="450.0" font-size="26" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2Cl</tspan><tspan dy="-10.4" font-size="18.7">&#8722;</tspan><tspan dy="10.4"> &#8594; Cl</tspan><tspan dy="7.8" font-size="18.7">2</tspan><tspan dy="-7.8"> + 2e</tspan><tspan dy="-10.4" font-size="18.7">&#8722;</tspan><tspan dy="10.4"></tspan></text>
  <text x="641.0" y="450.0" font-size="21" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">2H</tspan><tspan dy="6.3" font-size="15.1">2</tspan><tspan dy="-6.3">O + 2e</tspan><tspan dy="-8.4" font-size="15.1">&#8722;</tspan><tspan dy="8.4"> &#8594; H</tspan><tspan dy="6.3" font-size="15.1">2</tspan><tspan dy="-6.3"> + 2OH</tspan><tspan dy="-8.4" font-size="15.1">&#8722;</tspan><tspan dy="8.4"></tspan></text>
  <text x="500.0" y="525.0" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">ion-exchange membrane</tspan></text>
  <text x="500.0" y="590.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2NaCl + 2H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">O &#8594; 2NaOH + Cl</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"> + H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4"></tspan></text>
</svg>
