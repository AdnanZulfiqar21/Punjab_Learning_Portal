<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: the predicate Helps(x, y) with variables, and propositional versus predicate form. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Predicate logic sees inside a statement (after Fig 2.7)</text>
  <rect x="15.0" y="55.0" width="420.0" height="360.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a predicate with variables</text>
  <rect x="140.0" y="105.0" width="170.0" height="50.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="225.0" y="136.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">Helps(x, y)</text>
  <text x="225.0" y="175.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">predicate: x helps y</text>
  <line x1="225.0" y1="185.0" x2="140.0" y2="250.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140.0" cy="275.0" r="26.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="140.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">x</text>
  <text x="140.0" y="325.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">variable</text>
  <line x1="225.0" y1="185.0" x2="310.0" y2="250.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <circle cx="310.0" cy="275.0" r="26.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="310.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">y</text>
  <text x="310.0" y="325.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">variable</text>
  <text x="225.0" y="370.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Helps(Ali, Sara) is true or false</text>
  <text x="225.0" y="390.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">once x and y are given values</text>
  <rect x="450.0" y="55.0" width="435.0" height="360.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="667.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">propositional vs predicate</text>
  <rect x="470.0" y="100.0" width="395.0" height="120.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="667.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">propositional:  A = "Ali is tall"</text>
  <text x="667.0" y="160.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one letter; cannot see inside</text>
  <text x="667.0" y="185.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">limited</text>
  <rect x="470.0" y="245.0" width="395.0" height="130.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="667.0" y="275.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">predicate:  Tall(Ali)</text>
  <text x="667.0" y="305.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">subject Ali + property Tall;</text>
  <text x="667.0" y="325.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Tall(Sara), Tall(x) use the same predicate</text>
  <text x="667.0" y="350.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">much more expressive</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
