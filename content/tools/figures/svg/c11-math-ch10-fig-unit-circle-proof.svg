<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'Times New Roman', Times, serif">
  <!-- Unit 10 proof figure (C11-MATH, PDF p183): unit circle centre O on the axis X'X only (no y-axis printed); terminal sides through A (about 145 deg), B (about 100 deg) and C (45 deg) drawn as arrows; dotted chords AB and CD; arcs alpha, beta, alpha - beta (AOB) and alpha - beta (XOC). -->
  <defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="1100" height="760" fill="#fffac2"/>
  <line x1="70" y1="450" x2="1000" y2="450" stroke="#1a1a1a" stroke-width="2.5" marker-start="url(#ah0)" marker-end="url(#ah0)"/>
  <circle cx="520" cy="450" r="255" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="520" y1="450" x2="192.3" y2="220.6" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah0)"/>
  <line x1="520" y1="450" x2="451.4" y2="61" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah0)"/>
  <line x1="520" y1="450" x2="809.9" y2="160.1" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah0)"/>
  <line x1="311.1" y1="303.7" x2="475.7" y2="198.9" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3 6"/>
  <line x1="700.3" y1="269.7" x2="775" y2="450" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3 6"/>
  <circle cx="520" cy="450" r="6" fill="#1a1a1a"/>
  <path d="M 590 447.6 A 70 70 0 0 0 464.1 407.9" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah0)"/>
  <path d="M 624.9 446.3 A 105 105 0 0 0 505.4 346" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah0)"/>
  <path d="M 489.9 308.2 A 145 145 0 0 0 404.2 362.7" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah0)"/>
  <path d="M 704.9 443.5 A 185 185 0 0 0 655.3 323.8" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah0)"/>
  <text x="473.4" y="383.4" font-size="26" text-anchor="middle" fill="#1a1a1a" font-style="italic">α</text>
  <text x="537" y="337.2" font-size="26" text-anchor="middle" fill="#1a1a1a" font-style="italic">β</text>
  <text x="428.9" y="312.1" font-size="24" text-anchor="middle" fill="#1a1a1a" font-style="italic" transform="rotate(-35 428.9 312.1)">α − β</text>
  <text x="719.2" y="369.3" font-size="24" text-anchor="middle" fill="#1a1a1a" font-style="italic" transform="rotate(-70 719.2 369.3)">α − β</text>
  <text x="305.1" y="291.7" font-size="26" text-anchor="end" fill="#1a1a1a" font-style="italic">A</text>
  <text x="277.1" y="329.7" font-size="24" text-anchor="end" fill="#1a1a1a" font-style="italic">(cos α, sin α)</text>
  <text x="485.7" y="184.9" font-size="24" text-anchor="start" fill="#1a1a1a" font-style="italic">B(cos β, sin β)</text>
  <text x="714.3" y="273.7" font-size="24" text-anchor="start" fill="#1a1a1a" font-style="italic">C(cos(α − β), sin(α − β))</text>
  <text x="783" y="480" font-size="24" text-anchor="start" fill="#1a1a1a" font-style="italic">D(1, 0)</text>
  <text x="520" y="486" font-size="26" text-anchor="middle" fill="#1a1a1a" font-style="italic">O</text>
  <text x="1008" y="459" font-size="26" text-anchor="start" fill="#1a1a1a" font-style="italic">X</text>
  <text x="62" y="459" font-size="26" text-anchor="end" fill="#1a1a1a" font-style="italic">X′</text>
</svg>
