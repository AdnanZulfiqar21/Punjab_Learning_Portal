<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.27 to 9.36 and topics 9.16 to 9.21: Kirchhoff's rules and Example 9.10, the Wheatstone bridge, the potentiometer, and a thermistor or LDR in a potential divider. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Kirchhoff's rules, the Wheatstone bridge, the potentiometer and sensors</text>
  <rect x="50" y="55" width="540" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Kirchhoff's rules (9.16, Figs. 9.27, 9.28)</text>
  <circle cx="160" cy="170" r="4" fill="#14181f"/>
  <path d="M75 170 L152 170" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M100 245 L154 176" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M164 164 L230 105" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M166 174 L240 225" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="l" x="76" y="160">I1</text>
  <text class="l" x="92" y="232">I2</text>
  <text class="l" x="226" y="100">I3</text>
  <text class="l" x="236" y="242">I4</text>
  <text class="l" x="150" y="160">A</text>
  <path d="M310 125 L520 125 L520 245 L310 245 L310 125" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M447 113 V137" stroke="#14181f" stroke-width="2"/>
  <path d="M454 119 V131" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="462" y="114">E1</text>
  <path d="M340 125 L356 125 L361 132 L370 118 L380 132 L390 118 L399 132 L404 125 L420 125" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M298 172 H322" stroke="#14181f" stroke-width="2"/>
  <path d="M304 179 H316" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="264" y="179">E2</text>
  <path d="M380 245 L400 245 L406 252 L418 238 L430 252 L442 238 L454 252 L460 245 L480 245" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="372" y="112">R1</text>
  <text class="l" x="420" y="266">R2</text>
  <path d="M445 160 A 30 30 0 1 0 430 196" fill="none" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="408" y="181">I</text>
  <g class="r">
    <text x="70" y="286">first rule (charge conserved): the currents meeting at a point add to zero; in = out:</text>
    <text x="70" y="301">I1 + I2 = I3 + I4 (9.44); currents in are +, out are -</text>
    <text x="70" y="316">second rule (energy conserved): potential changes round a closed loop add to zero:</text>
    <text x="70" y="331">E1 - IR1 - E2 - IR2 = 0 (9.45); a cell from - to + is +E; a resistor along I is -IR</text>
  </g>
  <rect x="610" y="55" width="540" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Example 9.10: loop currents (Fig. 9.29)</text>
  <path d="M680 105 L1080 105 L1080 245 L680 245 L680 105" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M880 105 L880 245" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <rect x="666" y="122" width="28" height="22" fill="#fff4e2"/>
  <path d="M668 130 H692" stroke="#14181f" stroke-width="2"/>
  <path d="M674 137 H686" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="694" y="132">E3</text>
  <rect x="670" y="170" width="20" height="56" fill="#fff4e2"/>
  <path d="M680 166 L680 179 L674 183 L686 190 L674 198 L686 206 L674 213 L680 217 L680 230" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="692" y="204">R3</text>
  <rect x="866" y="122" width="28" height="22" fill="#fff4e2"/>
  <path d="M868 130 H892" stroke="#14181f" stroke-width="2"/>
  <path d="M874 137 H886" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="894" y="132">E2</text>
  <rect x="870" y="170" width="20" height="56" fill="#fff4e2"/>
  <path d="M880 166 L880 179 L874 183 L886 190 L874 198 L886 206 L874 213 L880 217 L880 230" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="892" y="204">R2</text>
  <rect x="1066" y="122" width="28" height="22" fill="#fff4e2"/>
  <path d="M1068 130 H1092" stroke="#14181f" stroke-width="2"/>
  <path d="M1074 137 H1086" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="1094" y="132">E1</text>
  <rect x="1070" y="170" width="20" height="56" fill="#fff4e2"/>
  <path d="M1080 166 L1080 179 L1074 183 L1086 190 L1074 198 L1086 206 L1074 213 L1080 217 L1080 230" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="1092" y="204">R1</text>
  <path d="M800 160 A 28 28 0 1 1 772 188" fill="none" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="772" y="182">I2</text>
  <path d="M1000 160 A 28 28 0 1 1 972 188" fill="none" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="972" y="182">I1</text>
  <text class="r" x="672" y="98">e</text>
  <text class="r" x="872" y="98">b</text>
  <text class="r" x="1072" y="98">a</text>
  <text class="r" x="672" y="262">f</text>
  <text class="r" x="872" y="262">c</text>
  <text class="r" x="1072" y="262">d</text>
  <g class="r">
    <text x="630" y="286">R1 = 10, R2 = 30, R3 = 15 ohm; E1 = 40, E2 = 60, E3 = 50 V (printed 'R3 = 50 V')</text>
    <text x="630" y="301">abcda: 4 I1 - 3 I2 = 2 A; ebcfe: 6 I1 - 9 I2 = 2 A</text>
    <text x="630" y="316">I1 = 2/3 A = 0.66 A (R1), I2 = 2/9 A = 0.22 A (R3), R2 carries 4/9 A = 0.44 A</text>
    <text x="630" y="331">steps: draw, pick loops covering every resistor, same-sense loop currents, solve</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Wheatstone bridge and potentiometer (9.17, 9.18, Figs. 9.30 to 9.32)</text>
  <path d="M110 500 L128 485 L138 486 L140 466 L159 468 L161 448 L181 450 L182 440 L200 425" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M200 425 L218 440 L219 450 L239 448 L241 468 L260 466 L262 486 L272 485 L290 500" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M110 500 L128 515 L129 525 L149 523 L151 543 L170 541 L172 561 L182 560 L200 575" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M200 575 L218 560 L228 561 L230 541 L249 543 L251 523 L271 525 L272 515 L290 500" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <path d="M200 425 L200 487" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <circle cx="200" cy="500" r="13" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="200" y="504" style="text-anchor:middle">G</text>
  <path d="M200 513 L200 575" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M110 500 L110 640 L190 640" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M193 628 V652" stroke="#14181f" stroke-width="2"/>
  <path d="M200 634 V646" stroke="#14181f" stroke-width="4"/>
  <path d="M203 640 L290 640 L290 500" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <text class="l" x="96" y="504">A</text>
  <text class="l" x="210" y="426">B</text>
  <text class="l" x="296" y="504">C</text>
  <text class="l" x="196" y="594">D</text>
  <text class="l" x="140" y="452">R1</text>
  <text class="l" x="246" y="452">R2</text>
  <text class="l" x="132" y="562">R3</text>
  <text class="l" x="250" y="562">R4</text>
  <path d="M350 470 L350 430 L450 430" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M453 418 V442" stroke="#14181f" stroke-width="2"/>
  <path d="M460 424 V436" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="466" y="452">E</text>
  <path d="M463 430 L560 430 L560 470" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M350 470 H560" stroke="#1f6fb5" stroke-width="3"/>
  <text class="r" x="338" y="486">A</text>
  <text class="r" x="562" y="486">B</text>
  <path d="M470 515 L470 476" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="476" y="500">C</text>
  <path d="M350 470 L350 540 L380 540" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M383 528 V552" stroke="#14181f" stroke-width="2"/>
  <path d="M390 534 V546" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="380" y="528">Ex</text>
  <path d="M393 540 L425 540" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <circle cx="438" cy="540" r="13" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="438" y="544" style="text-anchor:middle">G</text>
  <path d="M451 540 L470 540 L470 516" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <g class="r">
    <text x="330" y="582">bridge balanced, G reads zero:</text>
    <text x="330" y="597">R1/R2 = R3/R4 (9.51), so R4</text>
    <text x="330" y="612">follows from R1, R2 and R3</text>
    <text x="330" y="627">potentiometer, at null:</text>
    <text x="330" y="642">Ex = E l / L (9.52)</text>
    <text x="330" y="657">E1/E2 = l1/l2 (9.53)</text>
    <text x="330" y="672">no current is drawn from Ex</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="880" y="403">Galvanometer, thermistor and LDR (9.19 to 9.21, Figs. 9.33 to 9.37)</text>
  <path d="M660 436 L700 436" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M703 424 V448" stroke="#14181f" stroke-width="2"/>
  <path d="M710 430 V442" stroke="#14181f" stroke-width="4"/>
  <path d="M713 436 L760 436 L760 440" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M660 436 L660 640 L760 640" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M760 440 L760 456 L753 461 L767 470 L753 480 L767 490 L753 499 L760 504 L760 520" fill="none" stroke="#14181f" stroke-width="1.8"/>
  <text class="r" x="770" y="485">fixed R (k ohm)</text>
  <rect x="748" y="545" width="24" height="60" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <path d="M744 600 L776 550" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M760 520 L760 545" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <path d="M760 605 L760 640" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <circle cx="760" cy="532" r="3" fill="#14181f"/><text class="l" x="740" y="536">B</text>
  <path d="M760 532 L820 532 L820 560" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <circle cx="820" cy="573" r="13" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
  <text class="l" x="820" y="577" style="text-anchor:middle">V</text>
  <path d="M820 586 L820 625 L760 625" stroke="#14181f" stroke-width="1.8" fill="none"/>
  <text class="r" x="700" y="658">thermistor or LDR (below B)</text>
  <g class="r">
    <text x="850" y="422">galvanometer: detects tiny currents</text>
    <text x="850" y="437">(about 10^-6 A); at null no current</text>
    <text x="850" y="452">flows, so its own resistance does not</text>
    <text x="850" y="467">matter (bridge, potentiometer)</text>
    <text x="850" y="482">thermistor: mostly negative temperature</text>
    <text x="850" y="497">coefficient; oxides of Mn, Ni, Co, Cu, Fe</text>
    <text x="850" y="512">baked as beads, rods or washers;</text>
    <text x="850" y="527">thermometers, engine coolant sensors,</text>
    <text x="850" y="542">compensation, inrush current limiting</text>
    <text x="850" y="557">LDR (cadmium sulphide): light frees</text>
    <text x="850" y="572">electrons, so R falls; street lights</text>
    <text x="850" y="587">switch on at dusk; camera exposure</text>
    <text x="850" y="602">divider: heat or dark changes V at B,</text>
    <text x="850" y="617">driving a NOT gate or transistor</text>
  </g>
  <g class="r">
    <text x="630" y="684">concrete bridge: embedded carbon fibres conduct; rising resistance shows cracks</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
