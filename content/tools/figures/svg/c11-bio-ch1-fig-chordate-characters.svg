<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.17: the four diagnostic characters of a generalised chordate, side view. -->
  <defs>
    <style>
      .t{font-size:32px;font-weight:700;fill:#14181f}
      .s{font-size:26px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- body outline, head on the left, tail on the right -->
  <path d="M90 400 C120 250 300 220 520 230 C700 235 780 300 860 300 C920 300 940 360 940 400 C940 440 920 500 860 500 C780 500 700 565 520 570 C300 580 120 550 90 400 Z"
        fill="#fbf1e2" stroke="#d9b88a" stroke-width="6"/>
  <!-- dorsal tubular nerve cord (top) -->
  <path d="M190 300 C300 285 600 285 880 325" stroke="#5b3fb5" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- notochord (below the nerve cord) -->
  <path d="M170 370 C300 360 620 360 900 395" stroke="#0f7a62" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- gut (below the notochord), ending at the anus before the tail -->
  <path d="M150 440 C300 450 560 450 760 440" stroke="#d98b2b" stroke-width="20" fill="none" stroke-linecap="round"/>
  <circle cx="760" cy="440" r="14" fill="#b26a00"/>
  <!-- pharyngeal slits at the front -->
  <g stroke="#1f6fb5" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M230 380 L222 470"/><path d="M270 376 L262 476"/><path d="M310 376 L302 478"/><path d="M350 378 L342 476"/>
  </g>
  <!-- post-anal tail region marker -->
  <path d="M790 430 L930 430" stroke="#4b5563" stroke-width="4" stroke-dasharray="12 10"/>
  <!-- labels -->
  <path class="lead" d="M420 290 L420 190"/>
  <text class="t" x="420" y="170" text-anchor="middle">Dorsal tubular nerve cord</text>
  <text class="s" x="420" y="140" text-anchor="middle">expands at the front as the brain</text>
  <path class="lead" d="M800 372 L800 110"/>
  <text class="t" x="700" y="100">Notochord</text>
  <text class="s" x="700" y="70">a semi-rigid rod of cells</text>
  <path class="lead" d="M290 420 L250 640"/>
  <text class="t" x="80" y="680">Pharyngeal gill slits</text>
  <text class="s" x="80" y="715">openings in the side walls of the pharynx</text>
  <path class="lead" d="M860 450 L820 640"/>
  <text class="t" x="600" y="680">Post-anal tail</text>
  <text class="s" x="600" y="715">the body behind the anus</text>
  <text class="s" x="110" y="400">head</text>
  <text class="s" x="860" y="690">tail</text>
  <text class="s" x="780" y="490">anus</text>
</svg>
