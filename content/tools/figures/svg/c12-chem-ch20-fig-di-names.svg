<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <!-- Original structures after the book's examples: 3-hydroxybenzoic acid, 4-isopropylphenol and 1-bromo-2-chlorobenzene with their numbering, and ortho- (1,2), meta- (1,3) and para- (1,4) dibromobenzene. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Naming disubstituted benzenes</text>
  <rect x="15.0" y="55.0" width="870.0" height="245.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <path d="M160.0 128.0 L187.7 144.0 L187.7 176.0 L160.0 192.0 L132.3 176.0 L132.3 144.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160.0" cy="160.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="160.0" y1="128.0" x2="160.0" y2="110.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="160.0" y="102.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <line x1="187.7" y1="176.0" x2="203.0" y2="184.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="206.4" y="196.4" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="160.0" y="262.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">3-hydroxybenzoic acid</text>
  <text x="160.0" y="282.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">COOH outranks OH: it is C-1</text>
  <path d="M450.0 128.0 L477.7 144.0 L477.7 176.0 L450.0 192.0 L422.3 176.0 L422.3 144.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="450.0" cy="160.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="450.0" y1="192.0" x2="450.0" y2="209.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450.0" y="227.6" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="450.0" y1="128.0" x2="450.0" y2="110.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450.0" y="102.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH(CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">)</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="450.0" y="262.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">4-isopropylphenol</text>
  <text x="450.0" y="282.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">OH is C-1 (phenol)</text>
  <path d="M740.0 128.0 L767.7 144.0 L767.7 176.0 L740.0 192.0 L712.3 176.0 L712.3 144.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="740.0" cy="160.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="740.0" y1="128.0" x2="740.0" y2="110.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="740.0" y="102.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="767.7" y1="144.0" x2="783.0" y2="135.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="786.4" y="134.1" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="740.0" y="262.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">1-bromo-2-chlorobenzene</text>
  <text x="740.0" y="282.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bromo comes before chloro</text>
  <rect x="15.0" y="310.0" width="870.0" height="240.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="340.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">two substituents: ortho, meta and para</text>
  <path d="M160.0 398.0 L187.7 414.0 L187.7 446.0 L160.0 462.0 L132.3 446.0 L132.3 414.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160.0" cy="430.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="160.0" y1="398.0" x2="160.0" y2="380.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="160.0" y="372.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="187.7" y1="414.0" x2="203.0" y2="405.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="206.4" y="404.1" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="160.0" y="532.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">ortho (1,2)</text>
  <path d="M450.0 398.0 L477.7 414.0 L477.7 446.0 L450.0 462.0 L422.3 446.0 L422.3 414.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="450.0" cy="430.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="450.0" y1="398.0" x2="450.0" y2="380.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450.0" y="372.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="477.7" y1="446.0" x2="493.0" y2="454.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="496.4" y="466.4" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="450.0" y="532.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">meta (1,3)</text>
  <path d="M740.0 398.0 L767.7 414.0 L767.7 446.0 L740.0 462.0 L712.3 446.0 L712.3 414.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="740.0" cy="430.0" r="18.6" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="740.0" y1="398.0" x2="740.0" y2="380.4" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="740.0" y="372.9" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="740.0" y1="462.0" x2="740.0" y2="479.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="740.0" y="497.6" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="740.0" y="532.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">para (1,4)</text>
  <text x="450.0" y="575.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">priority for C-1: -COOH &gt; -CN &gt; -CHO &gt; -COCH3 &gt; -OH &gt; -NH2 &gt; -OR &gt; -R; if equal, the substituent first in the alphabet</text>
  <text x="450.0" y="601" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
