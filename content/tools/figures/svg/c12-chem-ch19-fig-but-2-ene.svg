<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.6: in but-2-ene the side-by-side p orbitals form a pi bond that fixes the groups in one plane; a quarter turn would destroy the overlap, so cis-but-2-ene (CH3 groups on the same side) and trans-but-2-ene (opposite sides) cannot interconvert. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Why but-2-ene has cis and trans isomers</text>
  <rect x="15.0" y="55.0" width="425.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.0" y="82.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">pi bond: the p orbitals overlap</text>
  <rect x="175.0" y="118.0" width="105.0" height="30.0" rx="0" stroke="none" stroke-width="0" fill="#c7d2fe"/>
  <rect x="175.0" y="192.0" width="105.0" height="30.0" rx="0" stroke="none" stroke-width="0" fill="#c7d2fe"/>
  <ellipse cx="175.0" cy="136.0" rx="13.0" ry="26.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
