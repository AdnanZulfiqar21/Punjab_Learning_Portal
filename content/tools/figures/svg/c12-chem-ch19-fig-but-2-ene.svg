  <line x1="615.0" y1="170.0" x2="582.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="560.0" y="204.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <line x1="720.0" y1="170.0" x2="753.0" y2="152.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="775.0" y="144.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="720.0" y1="170.0" x2="753.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="775.0" y="204.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="667.0" y="255.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">breaking the pi bond needs about 263 kJ/mol</text>
  <rect x="15.0" y="285.0" width="425.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
