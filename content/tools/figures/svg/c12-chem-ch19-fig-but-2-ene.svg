  <ellipse cx="280.0" cy="204.0" rx="13.0" ry="26.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <circle cx="280.0" cy="170.0" r="9.0" stroke="#14181f" stroke-width="2" fill="#e2e8f0"/>
  <line x1="184.0" y1="170.0" x2="271.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175.0" y1="170.0" x2="142.0" y2="152.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="120.0" y="144.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="175.0" y1="170.0" x2="142.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="120.0" y="204.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <line x1="280.0" y1="170.0" x2="313.0" y2="152.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="335.0" y="144.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="280.0" y1="170.0" x2="313.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="335.0" y="204.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <text x="227.0" y="255.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the pi bond holds the groups in one plane</text>
  <rect x="455.0" y="55.0" width="425.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="667.0" y="82.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">after a quarter turn: no overlap</text>
