  <text x="309.0" y="426.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="227.0" y="310.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">cis-but-2-ene</text>
  <text x="227.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">CH3 groups on the same side</text>
  <rect x="455.0" y="285.0" width="425.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
