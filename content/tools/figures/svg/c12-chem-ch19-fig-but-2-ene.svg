  <line x1="190.3" y1="382.5" x2="169.7" y2="405.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="145.0" y="334.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">C</tspan></text>
  <text x="145.0" y="426.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
