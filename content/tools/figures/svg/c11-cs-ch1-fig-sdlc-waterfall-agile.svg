<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.1 to 1.3 and topics 1.2.2 and 1.1 (methodologies): the SDLC stages, the Waterfall model and the Agile cycle. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">The software development life cycle, the Waterfall model and Agile</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">SDLC stages (1.2.2, Fig. 1.1)</text>
  <rect x="70" y="100" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="124" y="118">Requirement</text>
  <path d="M240 114 H270 V140" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <rect x="136" y="140" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="199" y="158">Analysis</text>
  <path d="M306 154 H336 V180" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M136 160 H86 V130" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="202" y="180" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="270" y="198">Design</text>
  <path d="M372 194 H402 V220" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M202 200 H152 V170" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="268" y="220" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="289" y="238">Coding / Implementation</text>
  <path d="M438 234 H468 V260" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M268 240 H218 V210" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="334" y="260" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="399" y="278">Testing</text>
  <path d="M504 274 H534 V300" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M334 280 H284 V250" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="400" y="300" width="170" height="28" rx="6" fill="#d9f0d0" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="454" y="318">Maintenance</text>
  <path d="M400 320 H350 V290" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <g class="r">
    <text x="70" y="366">each stage has its own tasks and goals; grey arrows: feedback to the stage above</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Waterfall model (1.1.1.1, Fig. 1.2)</text>
  <rect x="630" y="96" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="661" y="113">Requirements</text>
  <path d="M760 109 H780 V130" stroke="#1f6fb5" stroke-width="2" fill="none" marker-end="url(#bl)"/>
  <rect x="692" y="130" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="740" y="147">Design</text>
  <path d="M822 143 H842 V164" stroke="#1f6fb5" stroke-width="2" fill="none" marker-end="url(#bl)"/>
  <rect x="754" y="164" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="780" y="181">Implementation</text>
  <path d="M884 177 H904 V198" stroke="#1f6fb5" stroke-width="2" fill="none" marker-end="url(#bl)"/>
  <rect x="816" y="198" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="861" y="215">Testing</text>
  <path d="M946 211 H966 V232" stroke="#1f6fb5" stroke-width="2" fill="none" marker-end="url(#bl)"/>
  <rect x="878" y="232" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="915" y="249">Deployment</text>
  <path d="M1008 245 H1028 V266" stroke="#1f6fb5" stroke-width="2" fill="none" marker-end="url(#bl)"/>
  <rect x="940" y="266" width="130" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="974" y="283">Maintenance</text>
  <g class="r">
    <text x="630" y="316">linear and sequential: finish one phase before the next; no going back</text>
    <text x="630" y="330">benefits: simple, easy to track, suits small projects with fixed requirements</text>
    <text x="630" y="344">limits: inflexible, poor for complex or changing projects, assumes all</text>
    <text x="630" y="358">requirements are known at the start (Royce, 1970)</text>
  </g>
  <rect x="50" y="405" width="1100" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="433">Agile methodology (1.1.1.1, Fig. 1.3)</text>
  <path d="M258 494 A 78 78 0 0 1 313 526" fill="none" stroke="#d7322f" stroke-width="10"/>
  <circle cx="317" cy="533" r="4" fill="#d7322f"/>
  <text class="l" x="311" y="482" style="text-anchor:middle;fill:#d7322f">1 Requirements</text>
  <path d="M321 540 A 78 78 0 0 1 321 604" fill="none" stroke="#d98b2b" stroke-width="10"/>
  <circle cx="318" cy="611" r="4" fill="#d98b2b"/>
  <text class="l" x="372" y="576" style="text-anchor:middle;fill:#d98b2b">2 Design</text>
  <path d="M313 618 A 78 78 0 0 1 258 650" fill="none" stroke="#c9a227" stroke-width="10"/>
  <circle cx="250" cy="650" r="4" fill="#c9a227"/>
  <text class="l" x="311" y="670" style="text-anchor:middle;fill:#c9a227">3 Development</text>
  <path d="M242 650 A 78 78 0 0 1 187 618" fill="none" stroke="#1f6fb5" stroke-width="10"/>
  <circle cx="183" cy="611" r="4" fill="#1f6fb5"/>
  <text class="l" x="189" y="670" style="text-anchor:middle;fill:#1f6fb5">4 Testing</text>
  <path d="M179 604 A 78 78 0 0 1 179 540" fill="none" stroke="#0f7a62" stroke-width="10"/>
  <circle cx="182" cy="533" r="4" fill="#0f7a62"/>
  <text class="l" x="128" y="576" style="text-anchor:middle;fill:#0f7a62">5 Deployment</text>
  <path d="M187 526 A 78 78 0 0 1 242 494" fill="none" stroke="#4b9b4f" stroke-width="10"/>
  <circle cx="250" cy="494" r="4" fill="#4b9b4f"/>
  <text class="l" x="189" y="482" style="text-anchor:middle;fill:#4b9b4f">6 Review</text>
  <text class="k" x="250" y="578">AGILE</text>
  <g class="t">
    <text x="460" y="452">work in short cycles (iterations or sprints), deliver small working parts quickly and adapt to change</text>
    <text x="460" y="470">practices: continuous integration (merge code into a shared repository often to catch issues early),</text>
    <text x="460" y="488">test-driven development (write the tests before the code), pair programming (one writes, one reviews)</text>
    <text x="460" y="524">benefits: high flexibility, changes accepted after development starts; customers see working</text>
    <text x="460" y="542">software often and give feedback</text>
    <text x="460" y="578">limits: hard to scale to many teams; needs active stakeholders; timeline and scope less predictable</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
