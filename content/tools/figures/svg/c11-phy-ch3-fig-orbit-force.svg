<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.12: a satellite in orbit with gravity towards the Earth and velocity along the orbit. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Gravity provides the centripetal force</text>
  <circle cx="380.0" cy="255.0" r="165.0" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-dasharray="9 7"/>
  <circle cx="380.0" cy="255.0" r="55.0" stroke="#1f6fb5" stroke-width="2.5" fill="#cfe6fa"/>
  <text x="380.0" y="262.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700">Earth</text>
  <circle cx="515.2" cy="160.4" r="13.0" stroke="#7c3aed" stroke-width="2.5" fill="#efe7fd"/>
  <line x1="502.1" y1="169.5" x2="450.0" y2="206.0" stroke="#0f7a62" stroke-width="3" stroke-linecap="round"/>
  <path d="M441.4 212.0 L447.9 200.7 L454.2 209.7 Z" fill="#0f7a62"/>
  <text x="480.0" y="252.0" font-size="18" fill="#0f7a62" text-anchor="start" font-weight="700">F = GMm / r^2</text>
  <line x1="515.2" y1="160.4" x2="452.3" y2="70.6" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M446.3 62.1 L457.6 68.6 L448.6 74.9 Z" fill="#d7322f"/>
  <text x="438.3" y="62.1" font-size="20" fill="#d7322f" text-anchor="end" font-weight="700">v</text>
  <text x="533.2" y="146.4" font-size="18" fill="#7c3aed" text-anchor="start" font-weight="700">satellite</text>
  <text x="380.0" y="452.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="400">orbit of radius r</text>
  <rect x="600.0" y="300.0" width="270.0" height="120.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="620.0" y="334.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">centripetal force = gravity</text>
  <text x="620.0" y="356.1" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">m v^2 / r = GMm / r^2</text>
  <text x="620.0" y="378.2" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">so  v = square root of (GM / r)</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
