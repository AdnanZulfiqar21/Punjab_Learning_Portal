<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis3-7 (C11-PHY, PDF p63): Tid-bits photograph of Bruce McCandless free-floating in space in 1984 (no printed caption number); flat, respectful drawing after the printed photograph: an astronaut in a white space suit with a backpack manoeuvring unit and gold visor floats against the black sky, body tilted, legs together and angled down to the left, with the blue curve of the Earth and white clouds across the bottom. No photograph is reproduced. -->
  <defs>
    <clipPath id="frame"><rect x="20" y="20" width="760" height="1060"/></clipPath>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f9fe0"/><stop offset="1" stop-color="#2a5fae"/></linearGradient>
  </defs>
  <rect width="800" height="1100" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="760" height="1060" fill="#0d1419"/>
    <!-- Earth with clouds -->
    <path d="M-100 900 Q400 760 900 880 L900 1100 L-100 1100 Z" fill="url(#earth)"/>
    <path d="M-100 900 Q400 760 900 880" stroke="#9fd0ff" stroke-width="10" fill="none" opacity="0.7"/>
    <g fill="#e8f1fb" opacity="0.85">
      <ellipse cx="200" cy="950" rx="150" ry="18"/><ellipse cx="520" cy="930" rx="120" ry="14"/><ellipse cx="420" cy="1010" rx="200" ry="20"/><ellipse cx="700" cy="990" rx="90" ry="12"/>
    </g>
    <!-- astronaut, tilted -->
    <g transform="translate(420 470) rotate(-22)" stroke="#9aa2ab" stroke-width="4" stroke-linejoin="round">
      <!-- backpack (manoeuvring unit) with arm controls -->
      <rect x="-150" y="-230" width="300" height="300" rx="30" fill="#d9dde2"/>
      <rect x="-200" y="-40" width="60" height="120" rx="14" fill="#cfd4da"/>
      <rect x="140" y="-40" width="60" height="120" rx="14" fill="#cfd4da"/>
      <circle cx="-120" cy="-200" r="22" fill="#c4cad1"/><circle cx="120" cy="-200" r="22" fill="#c4cad1"/>
      <!-- helmet -->
      <circle cx="0" cy="-230" r="78" fill="#f3f4f6"/>
      <ellipse cx="0" cy="-222" rx="56" ry="50" fill="#c9962f" stroke="#7a5a18"/>
      <ellipse cx="-16" cy="-236" rx="16" ry="12" fill="#f0d27a" stroke="none"/>
      <!-- torso -->
      <rect x="-110" y="-150" width="220" height="230" rx="40" fill="#f3f4f6"/>
      <rect x="-60" y="-110" width="120" height="70" rx="10" fill="#e3e6ea"/>
      <rect x="-40" y="-100" width="22" height="16" fill="#c73a3a" stroke="none"/><rect x="0" y="-100" width="40" height="16" fill="#3a67b8" stroke="none"/>
      <!-- arms bent forward to the hand controls -->
      <path d="M-110 -120 Q-190 -90 -185 0 L-150 10 Q-150 -60 -100 -70 Z" fill="#f3f4f6"/>
      <path d="M110 -120 Q190 -90 185 0 L150 10 Q150 -60 100 -70 Z" fill="#f3f4f6"/>
      <circle cx="-168" cy="10" r="22" fill="#e9ebee"/><circle cx="168" cy="10" r="22" fill="#e9ebee"/>
      <!-- legs together, angled down -->
      <path d="M-90 60 L-120 330 Q-120 360 -90 360 L-30 360 Q-10 360 -10 330 L0 60 Z" fill="#f3f4f6"/>
      <path d="M0 60 L10 330 Q10 360 40 360 L95 360 Q120 360 115 330 L90 60 Z" fill="#f3f4f6"/>
      <path d="M-110 200 L-20 200 M10 200 L100 200" stroke="#c73a3a" stroke-width="6"/>
      <!-- boots -->
      <path d="M-125 360 L-15 360 L-15 410 Q-60 425 -125 410 Z" fill="#e3e6ea"/>
      <path d="M5 360 L120 360 L120 410 Q60 425 5 410 Z" fill="#e3e6ea"/>
    </g>
  </g>
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#9aa3ad" stroke-width="2"/>
</svg>
