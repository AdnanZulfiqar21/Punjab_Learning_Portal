<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="530" fill="#ffffff"/>
  <!-- Original: clients over four layers: SaaS, PaaS and IaaS; management; public, private and hybrid deployment; infrastructure. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cloud computing in layers (after Fig 8.4)</text>
  <text x="450.0" y="72.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">clients: laptop, phone, tablet, desktop (through the Internet)</text>
  <rect x="30.0" y="95.0" width="840.0" height="82.0" rx="8" stroke="#1f6fb5" stroke-width="1.5" fill="none"/>
  <text x="45.0" y="117.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">service models</text>
  <rect x="170.0" y="107.0" width="220.0" height="58.0" rx="6" stroke="#1f6fb5" stroke-width="1.5" fill="#dbe9f5"/>
  <text x="280.0" y="131.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">SaaS</text>
  <text x="280.0" y="151.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">ready software, e.g. Gmail, Office 365</text>
  <rect x="405.0" y="107.0" width="220.0" height="58.0" rx="6" stroke="#1f6fb5" stroke-width="1.5" fill="#dbe9f5"/>
  <text x="515.0" y="131.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">PaaS</text>
  <text x="515.0" y="151.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">build apps, e.g. Google App Engine</text>
  <rect x="640.0" y="107.0" width="220.0" height="58.0" rx="6" stroke="#1f6fb5" stroke-width="1.5" fill="#dbe9f5"/>
  <text x="750.0" y="131.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">IaaS</text>
  <text x="750.0" y="151.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">raw computing, e.g. virtual machines</text>
  <rect x="30.0" y="190.0" width="840.0" height="82.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="none"/>
  <text x="45.0" y="212.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">management</text>
  <rect x="170.0" y="202.0" width="220.0" height="58.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="280.0" y="226.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">billing</text>
  <text x="280.0" y="246.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">pay as you go</text>
  <rect x="405.0" y="202.0" width="220.0" height="58.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="515.0" y="226.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">monitoring</text>
  <text x="515.0" y="246.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">and scaling</text>
  <rect x="640.0" y="202.0" width="220.0" height="58.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="750.0" y="226.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">security</text>
  <text x="750.0" y="246.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">access control</text>
  <rect x="30.0" y="285.0" width="840.0" height="82.0" rx="8" stroke="#0f7a62" stroke-width="1.5" fill="none"/>
  <text x="45.0" y="307.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">deployment</text>
  <rect x="170.0" y="297.0" width="220.0" height="58.0" rx="6" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="280.0" y="321.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">public cloud</text>
  <text x="280.0" y="341.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">shared, e.g. AWS, Azure</text>
  <rect x="405.0" y="297.0" width="220.0" height="58.0" rx="6" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="515.0" y="321.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">private cloud</text>
  <text x="515.0" y="341.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">one organisation</text>
  <rect x="640.0" y="297.0" width="220.0" height="58.0" rx="6" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="750.0" y="321.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">hybrid cloud</text>
  <text x="750.0" y="341.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">a mix of both</text>
  <rect x="30.0" y="380.0" width="840.0" height="82.0" rx="8" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <text x="45.0" y="402.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">infrastructure</text>
  <rect x="170.0" y="392.0" width="220.0" height="58.0" rx="6" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <text x="280.0" y="416.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">servers</text>
  <text x="280.0" y="436.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">and storage</text>
  <rect x="405.0" y="392.0" width="220.0" height="58.0" rx="6" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <text x="515.0" y="416.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">databases</text>
  <text x="515.0" y="436.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">and networking</text>
  <rect x="640.0" y="392.0" width="220.0" height="58.0" rx="6" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd"/>
  <text x="750.0" y="416.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">data centres</text>
  <text x="750.0" y="436.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">buildings full of servers</text>
  <text x="450.0" y="498.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Benefits: scalability (grow or shrink on demand), accessibility (anywhere), cost-effectiveness (pay for use).</text>
  <text x="450.0" y="521" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
