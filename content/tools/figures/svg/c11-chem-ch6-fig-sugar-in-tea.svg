<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690">
  <!-- Vis6-7 (C11-CHEM, PDF p137): sugar-in-tea margin photo; flat drawing after the printed photograph: a hand reaches in from the top left and stirs a clear double-walled glass of milky tea with a thin black stirrer; the glass stands on a grey place mat on a table, with a dark cloth beside it on the right; a wicker chair is faint in the warm background. No photograph is reproduced. -->
  <rect width="1100" height="690" fill="#ffffff"/>
  <clipPath id="card"><rect x="10" y="10" width="1080" height="670" rx="40"/></clipPath>
  <g clip-path="url(#card)">
    <!-- warm blurred background -->
    <rect x="10" y="10" width="1080" height="670" fill="#e6d8c6"/>
    <rect x="10" y="10" width="300" height="430" fill="#f1ebe2"/>
    <rect x="760" y="10" width="330" height="430" fill="#d8c3a8"/>
    <!-- wicker chair, faint -->
    <path d="M120 470 C 120 380 200 330 300 330 C 380 330 430 370 440 420 L 440 470 Z" fill="#c9a77d" opacity="0.7"/>
    <path d="M150 430 C 200 380 300 370 400 420 M160 455 C 220 410 320 405 420 445" stroke="#b08a5f" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M740 470 C 760 400 840 360 940 360 C 1020 360 1080 390 1090 420 L 1090 470 Z" fill="#c9a77d" opacity="0.6"/>
    <!-- table and grey place mat -->
    <rect x="10" y="470" width="1080" height="210" fill="#3a3b3d"/>
    <path d="M40 520 L 1060 490 L 1090 680 L 10 680 Z" fill="#6b6e72"/>
    <g stroke="#7d8084" stroke-width="3">
      <path d="M60 560 L 1070 530 M50 610 L 1080 580 M40 660 L 1085 630"/>
    </g>
    <!-- dark cloth on the right -->
    <path d="M760 560 C 820 520 900 520 960 540 C 1010 556 1020 580 990 600 C 920 620 820 610 770 590 Z" fill="#2c2a2a"/>
    <path d="M800 570 C 860 548 930 552 980 572" stroke="#4a4646" stroke-width="5" fill="none"/>
    <!-- double-walled glass of milky tea -->
    <path d="M420 260 L 680 260 L 662 590 C 600 606 500 606 438 590 Z" fill="#f4f6f7" opacity="0.6" stroke="#b9c1c5" stroke-width="5" stroke-linejoin="round"/>
    <path d="M436 300 L 664 300 L 650 576 C 590 590 510 590 450 576 Z" fill="#c69a74"/>
    <ellipse cx="550" cy="300" rx="114" ry="14" fill="#d8b392"/>
    <path d="M450 320 L 462 560" stroke="#e3c6aa" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="550" cy="260" rx="130" ry="16" fill="none" stroke="#b9c1c5" stroke-width="5"/>
    <!-- thin black stirrer -->
    <path d="M540 130 L 505 430" stroke="#1d1d1d" stroke-width="10" stroke-linecap="round"/>
    <!-- hand from the top left, fingers holding the stirrer -->
    <path d="M10 70 C 120 60 260 60 360 80 C 420 92 470 100 500 120 L 520 150 C 500 170 440 170 400 160 L 10 170 Z" fill="#e3b796" stroke="#c99677" stroke-width="3"/>
    <path d="M480 108 C 500 96 530 98 540 112 C 546 126 530 136 510 134 Z" fill="#e3b796" stroke="#c99677" stroke-width="3"/>
    <path d="M470 150 C 490 160 520 170 520 190 C 518 206 496 204 480 190 L 450 166 Z" fill="#e3b796" stroke="#c99677" stroke-width="3"/>
    <path d="M10 170 L 400 160 C 380 180 340 200 300 206 L 10 220 Z" fill="#d4a582"/>
  </g>
</svg>
