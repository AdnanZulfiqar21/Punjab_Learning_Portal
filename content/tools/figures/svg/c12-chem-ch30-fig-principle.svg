<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Figure 30.1: without a field nuclear spins point randomly with the same energy; in a strong field they align with (lower energy) or against (higher energy) it, and a radio wave of the right energy flips the spin. In methanol the CH3 and O-H hydrogens are in different environments. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The principle of proton NMR</text>
  <rect x="15.0" y="55.0" width="520.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="275.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">nuclear spins in a magnetic field (after Figure 30.1)</text>
  <line x1="50.0" y1="400.0" x2="50.0" y2="102.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M50.0 95.0 L53.8 103.2 L46.2 103.2 Z" fill="#14181f"/>
  <text x="38.0" y="250.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700" transform="rotate(-90 38.0 250.0)">energy</text>
  <circle cx="120.0" cy="240.0" r="13.0" stroke="#4b5563" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="120.0" cy="240.0" rx="13.0" ry="4.0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <line x1="120.0" y1="250.0" x2="120.0" y2="222.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M120.0 216.0 L123.4 223.3 L116.6 223.3 Z" fill="#4b5563"/>
  <circle cx="165.0" cy="225.0" r="13.0" stroke="#4b5563" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="165.0" cy="225.0" rx="13.0" ry="4.0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <line x1="165.0" y1="215.0" x2="165.0" y2="242.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M165.0 249.0 L161.6 241.7 L168.4 241.7 Z" fill="#4b5563"/>
  <circle cx="140.0" cy="270.0" r="13.0" stroke="#4b5563" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="140.0" cy="270.0" rx="13.0" ry="4.0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <line x1="140.0" y1="280.0" x2="140.0" y2="252.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M140.0 246.0 L143.4 253.3 L136.6 253.3 Z" fill="#4b5563"/>
  <text x="145.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">no field: random,</text>
  <text x="145.0" y="346.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">all the same energy</text>
  <line x1="220.0" y1="250.0" x2="300.0" y2="250.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="300.0" y1="250.0" x2="360.0" y2="160.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="300.0" y1="250.0" x2="360.0" y2="340.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="360.0" y1="160.0" x2="500.0" y2="160.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360.0" y1="340.0" x2="500.0" y2="340.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="390.0" cy="130.0" r="13.0" stroke="#d7322f" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="390.0" cy="130.0" rx="13.0" ry="4.0" stroke="#d7322f" stroke-width="1.5" fill="none"/>
  <line x1="390.0" y1="120.0" x2="390.0" y2="147.6" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M390.0 154.0 L386.6 146.7 L393.4 146.7 Z" fill="#d7322f"/>
  <circle cx="390.0" cy="312.0" r="13.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="390.0" cy="312.0" rx="13.0" ry="4.0" stroke="#1f6fb5" stroke-width="1.5" fill="none"/>
  <line x1="390.0" y1="322.0" x2="390.0" y2="294.4" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M390.0 288.0 L393.4 295.3 L386.6 295.3 Z" fill="#1f6fb5"/>
  <text x="505.0" y="150.0" font-size="12" fill="#d7322f" text-anchor="end" font-weight="700">against field</text>
  <text x="505.0" y="395.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">with field (lower energy)</text>
  <line x1="470.0" y1="335.0" x2="470.0" y2="174.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470.0 166.0 L474.2 175.1 L465.8 175.1 Z" fill="#7c3aed"/>
  <text x="462.0" y="255.0" font-size="11" fill="#7c3aed" text-anchor="end" font-weight="700">radio wave absorbed:</text>
  <text x="462.0" y="270.0" font-size="11" fill="#7c3aed" text-anchor="end" font-weight="700">spin flips</text>
  <rect x="550.0" y="55.0" width="335.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="717.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">different environments in methanol</text>
  <text x="690.0" y="237.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="760.0" y="237.0" font-size="20" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="702.0" y1="230.0" x2="748.0" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="690.0" y1="218.0" x2="690.0" y2="187.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="690.0" y="173.1" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="690.0" y1="242.0" x2="690.0" y2="273.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="690.0" y="299.6" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="678.0" y1="230.0" x2="642.0" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="621.0" y="236.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="772.0" y1="230.0" x2="803.0" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="830.0" y="236.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="717.0" y="340.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">three CH3 hydrogens (blue) and one</text>
  <text x="717.0" y="358.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">O-H hydrogen (red) absorb different</text>
  <text x="717.0" y="376.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">energies: two signals</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
