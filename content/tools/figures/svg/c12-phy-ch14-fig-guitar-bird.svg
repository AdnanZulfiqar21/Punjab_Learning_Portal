<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460">
  <!-- Pictures below the examples of oscillatory motion (C12-PHY, PDF p19, topic 14.1, items vii and viii), side by side as printed: left, hands playing an orange acoustic guitar (strumming hand over the sound hole, the other hand on the frets, dark sleeve at top left, pale blue background); right, a falcon in flight with its wings spread against a pale blue-grey sky. Flat drawings after the printed photographs; no photograph is reproduced. -->
  <rect width="1300" height="460" fill="#ffffff"/>
  <!-- left panel: guitar -->
  <clipPath id="gl"><rect x="0" y="0" width="735" height="460"/></clipPath>
  <g clip-path="url(#gl)">
    <rect x="0" y="0" width="735" height="460" fill="#eaf2fb"/>
    <path d="M430 330 Q520 260 600 330 Q660 390 735 360 L735 460 L430 460 Z" fill="#cfe2f6"/>
    <path d="M520 420 Q560 330 620 380 M600 300 Q640 250 690 290" stroke="#b4d0ee" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- dark sleeves -->
    <path d="M0 0 L330 0 Q350 60 300 110 Q230 170 150 150 Q60 130 0 160 Z" fill="#3c4250"/>
    <path d="M40 20 L70 140 M100 10 L130 130 M160 5 L190 140 M220 0 L250 120" stroke="#2c313c" stroke-width="5"/>
    <path d="M300 30 Q420 70 440 160 Q460 260 420 300 L360 320 Q380 230 360 170 Q330 110 280 90 Z" fill="#3c4250"/>
    <!-- guitar body -->
    <path d="M-20 170 Q90 110 200 150 Q300 190 320 280 Q340 360 300 460 L-20 460 Z" fill="#e2762a" stroke="#9c4512" stroke-width="5"/>
    <path d="M0 200 Q100 150 190 180 Q270 215 290 290 Q300 360 270 460 L0 460 Z" fill="#f08a34"/>
    <circle cx="150" cy="350" r="78" fill="#2a1408" stroke="#5a2a0c" stroke-width="10"/>
    <path d="M20 330 Q60 300 110 330 Q140 400 120 460 L20 460 Z" fill="#c4231c"/>
    <!-- neck with frets and strings -->
    <path d="M150 330 L640 140 L660 175 L170 375 Z" fill="#5a2d14"/>
    <g stroke="#d9d2c4" stroke-width="4">
      <line x1="300" y1="272" x2="315" y2="310"/><line x1="350" y1="252" x2="366" y2="290"/><line x1="398" y1="234" x2="414" y2="271"/><line x1="444" y1="216" x2="460" y2="252"/><line x1="488" y1="199" x2="504" y2="235"/><line x1="530" y1="183" x2="546" y2="218"/><line x1="570" y1="167" x2="586" y2="202"/><line x1="608" y1="153" x2="624" y2="187"/>
    </g>
    <g stroke="#f1ead9" stroke-width="1.6"><line x1="150" y1="338" x2="645" y2="146"/><line x1="155" y1="347" x2="650" y2="155"/><line x1="160" y1="356" x2="654" y2="163"/><line x1="165" y1="365" x2="658" y2="171"/></g>
    <!-- headstock -->
    <path d="M640 140 L700 110 L725 160 L660 178 Z" fill="#e2a050" stroke="#9c5a12" stroke-width="3"/>
    <circle cx="690" cy="105" r="9" fill="#bfc4cc"/><circle cx="715" cy="150" r="9" fill="#bfc4cc"/>
    <!-- strumming hand -->
    <path d="M110 160 Q200 140 240 200 Q270 250 250 300 Q235 330 205 330 L200 380 Q190 400 175 380 L170 320 L150 410 Q140 425 128 410 L135 320 L105 390 Q95 400 85 388 L100 300 Q70 230 110 160 Z" fill="#f1c7a4" stroke="#c9946e" stroke-width="3"/>
    <!-- fretting hand -->
    <path d="M450 150 Q520 130 560 160 L565 250 Q555 270 540 255 L535 205 L520 270 Q508 285 496 268 L505 200 L480 255 Q468 268 458 255 L470 190 Q440 180 450 150 Z" fill="#f1c7a4" stroke="#c9946e" stroke-width="3"/>
  </g>
  <!-- right panel: falcon -->
  <rect x="755" y="0" width="545" height="460" fill="#c9cfe0"/>
  <g stroke="#3b3a3a" stroke-width="3" stroke-linejoin="round">
    <path d="M1000 210 Q930 120 820 70 Q850 110 880 150 Q930 200 960 240 Z" fill="#7f7c78"/>
    <path d="M1060 230 Q1140 330 1230 430 Q1200 330 1150 270 Q1110 225 1085 205 Z" fill="#7f7c78"/>
    <path d="M960 230 Q900 260 870 300 Q920 300 975 262 Z" fill="#3e3a36"/>
    <path d="M950 240 Q1000 180 1080 160 Q1130 155 1150 185 Q1120 230 1060 245 Q1000 260 950 240 Z" fill="#a3a09b"/>
    <path d="M1110 160 Q1140 135 1170 150 Q1180 165 1165 180 L1135 190 Z" fill="#1f1d1c"/>
    <path d="M1125 175 Q1140 172 1150 185 Q1135 195 1120 190 Z" fill="#f2efe8"/>
    <path d="M1172 155 L1188 162 L1172 168 Z" fill="#f2c430"/>
    <path d="M1000 250 L990 280 M1015 250 L1010 282" stroke="#e8b528" stroke-width="7"/>
  </g>
  <g stroke="#55524e" stroke-width="2" fill="none">
    <path d="M850 95 L900 150 M880 90 L925 150 M910 105 L950 165 M940 130 L975 185"/>
    <path d="M1100 245 L1180 330 M1120 240 L1200 350 M1140 255 L1210 380"/>
    <path d="M990 220 Q1040 200 1090 195 M1000 235 Q1050 220 1100 215"/>
  </g>
</svg>
