<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="210" fill="#ffffff"/>
  <!-- Formation of the electrophile in bromination (p65): Br-Br polarised delta+ / delta- with a curly arrow from the delta- bromine to AlBr3, giving Br+ + [AlBr4]-. The book prints the partial charges as sigma+ and sigma-. -->
  <text x="70.0" y="151.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="98.0" y1="140.0" x2="168.0" y2="140.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="196.0" y="151.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="68.0" y="110.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">&#948;+</tspan></text>
  <text x="196.0" y="110.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">&#948;&#8722;</tspan></text>
  <path d="M214.0 112.0 C270.0 45.0 360.0 50.0 395.0 110.0" stroke="#14181f" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M395.0 110.0 L382.7 101.5 L393.6 95.1 Z" fill="#14181f"/>
  <text x="410.0" y="151.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">AlBr</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <line x1="490.0" y1="140.0" x2="677.2" y2="140.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M690.0 140.0 L675.5 146.8 L675.5 133.2 Z" fill="#14181f"/>
  <text x="705.0" y="151.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Br</tspan><tspan dy="-12.0" font-size="21.6">+</tspan><tspan dy="12.0"> + [AlBr</tspan><tspan dy="9.0" font-size="21.6">4</tspan><tspan dy="-9.0">]</tspan><tspan dy="-12.0" font-size="21.6">&#8722;</tspan><tspan dy="12.0"></tspan></text>
</svg>
