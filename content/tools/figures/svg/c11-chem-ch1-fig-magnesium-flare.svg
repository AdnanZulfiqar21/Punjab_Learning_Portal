<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1200">
  <!-- Vis1-2 (C11-CHEM, PDF p15): magnesium flare photo beside the margin note; flat drawing after the printed photograph: a person in a blue suit stands on a grassy hillside with patches of snow, seen from behind, holding up a burning flare in the right hand; the flare gives a bright white-pink flame and a trail of smoke; a yellow rescue helicopter flies at top left over snowy mountains under a grey sky. No photograph is reproduced. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f6670"/><stop offset="1" stop-color="#9aa3ad"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ffd6dc"/><stop offset="1" stop-color="#ff6b7d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="780" height="1200" fill="#ffffff"/>
  <clipPath id="card"><rect x="10" y="10" width="760" height="1180" rx="40"/></clipPath>
  <g clip-path="url(#card)">
    <rect x="10" y="10" width="760" height="1180" fill="url(#sky)"/>
    <!-- far snowy mountains -->
    <path d="M10 330 L 120 290 L 230 270 L 330 250 L 420 262 L 520 300 L 620 330 L 700 320 L 770 340 L 770 640 L 10 640 Z" fill="#5d6b5a"/>
    <path d="M90 300 L 150 285 L 230 270 L 330 250 L 420 262 L 470 285 L 400 300 L 330 290 L 260 310 L 190 305 Z" fill="#eef1f3"/>
    <path d="M620 330 L 700 320 L 770 340 L 770 380 L 700 370 L 650 360 Z" fill="#e3e8ec"/>
    <!-- grassy slope in front -->
    <path d="M10 560 C 200 600 450 600 770 560 L 770 1190 L 10 1190 Z" fill="#8a7a4e"/>
    <path d="M10 700 C 250 720 500 720 770 690 L 770 1190 L 10 1190 Z" fill="#7a6c42"/>
    <!-- snow patches -->
    <path d="M30 760 C 90 740 160 750 200 770 C 150 790 80 790 30 780 Z" fill="#f4f4f2"/>
    <path d="M530 680 C 600 665 680 670 740 690 C 690 710 600 712 530 700 Z" fill="#f4f4f2"/>
    <path d="M40 920 C 120 900 230 910 280 940 C 210 960 110 960 40 950 Z" fill="#f4f4f2"/>
    <path d="M560 880 C 640 860 720 870 770 890 L 770 930 C 700 940 620 930 560 910 Z" fill="#f4f4f2"/>
    <path d="M20 1110 C 120 1080 230 1090 290 1130 C 220 1160 110 1160 20 1150 Z" fill="#f4f4f2"/>
    <path d="M430 1080 C 470 1060 520 1065 540 1090 C 500 1110 460 1105 430 1095 Z" fill="#f4f4f2"/>
    <path d="M620 1050 C 680 1030 740 1040 770 1060 L 770 1100 C 720 1105 660 1090 620 1070 Z" fill="#f4f4f2"/>
    <!-- yellow helicopter, top left -->
    <g transform="translate(150 175)">
      <path d="M-110 -40 L 120 -48" stroke="#2b2b2b" stroke-width="5"/>
      <path d="M0 -44 L 0 -26" stroke="#2b2b2b" stroke-width="6"/>
      <path d="M-80 0 C -80 -24 -40 -30 0 -28 C 40 -26 70 -14 78 2 L 150 -8 L 158 4 L 76 22 C 50 34 -10 36 -50 30 C -76 26 -82 14 -80 0 Z" fill="#e1b62a" stroke="#8a6e14" stroke-width="3"/>
      <path d="M-66 -4 C -64 -18 -44 -22 -26 -20 L -26 4 L -64 6 Z" fill="#40505c"/>
      <path d="M150 -8 L 152 -30 L 162 -30 L 158 4 Z" fill="#e1b62a" stroke="#8a6e14" stroke-width="3"/>
      <path d="M-40 34 L -40 44 M 30 32 L 30 44 M -60 44 L 50 44" stroke="#2b2b2b" stroke-width="4"/>
    </g>
    <!-- smoke trail of the flare -->
    <path d="M500 330 C 560 250 650 190 770 140 L 770 230 C 670 260 590 300 530 350 Z" fill="#f7c9cf" opacity="0.9"/>
    <path d="M520 320 C 590 250 680 200 770 170" stroke="#fde4e7" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- bright flame -->
    <circle cx="500" cy="330" r="85" fill="url(#glow)"/>
    <circle cx="500" cy="330" r="22" fill="#ffffff"/>
    <!-- the person, seen from behind -->
    <g>
      <!-- raised right arm holding the flare -->
      <path d="M440 520 C 450 470 470 420 485 380 L 510 388 C 498 430 482 480 474 530 Z" fill="#3e64b6" stroke="#28468a" stroke-width="3"/>
      <rect x="482" y="340" width="20" height="50" rx="5" fill="#d9a73a" transform="rotate(18 492 365)"/>
      <ellipse cx="492" cy="385" rx="16" ry="14" fill="#e4bfa4"/>
      <!-- head with short brown hair -->
      <rect x="360" y="500" width="40" height="34" fill="#d7a98c"/>
      <ellipse cx="333" cy="478" rx="9" ry="16" fill="#d7a98c"/>
      <ellipse cx="380" cy="470" rx="46" ry="54" fill="#7a4e30"/>
      <path d="M350 440 C 365 430 395 430 410 440 M346 470 C 365 462 395 462 414 470" stroke="#5e3b23" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- hood and jacket -->
      <path d="M320 520 C 340 540 420 540 440 520 L 470 540 C 490 600 492 680 480 760 L 290 760 C 280 690 282 600 300 545 Z" fill="#4670c2" stroke="#28468a" stroke-width="3"/>
      <path d="M330 520 C 350 548 410 548 432 520" stroke="#28468a" stroke-width="4" fill="none"/>
      <!-- left arm hanging down -->
      <path d="M300 548 C 270 600 262 680 270 760 L 296 762 C 292 690 300 620 318 572 Z" fill="#3e64b6" stroke="#28468a" stroke-width="3"/>
      <!-- red pouch at the hip -->
      <rect x="380" y="700" width="56" height="74" rx="6" fill="#d33a4a" stroke="#8a1f2a" stroke-width="3"/>
      <!-- trousers of the suit -->
      <path d="M290 760 L 480 760 C 486 860 492 960 500 1090 L 440 1094 C 430 990 408 880 386 820 C 370 880 348 980 336 1080 L 276 1074 C 278 960 282 860 290 760 Z" fill="#4670c2" stroke="#28468a" stroke-width="3"/>
      <path d="M386 820 L 386 780" stroke="#28468a" stroke-width="3"/>
      <!-- boots -->
      <path d="M270 1070 L 340 1076 L 344 1110 L 300 1112 L 262 1104 Z" fill="#3a3027"/>
      <path d="M438 1090 L 502 1086 L 520 1124 L 450 1128 Z" fill="#3a3027"/>
    </g>
  </g>
</svg>
