<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 890" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="890" fill="#ffffff"/>
  <!-- Original diagram after Figures 19.18 to 19.20: the initiation complex with methionine tRNA at the P site on AUG, an elongation step with a peptide bond and translocation, and termination when a stop codon at the A site binds a release factor. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Translation: initiation, elongation, termination</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1. initiation complex</text>
  <rect x="320.0" y="140.0" width="260.0" height="100.0" rx="40" stroke="#475569" stroke-width="2.5" fill="#e2e8f0"/>
  <rect x="330.0" y="254.0" width="240.0" height="46.0" rx="22" stroke="#475569" stroke-width="2.5" fill="#f1f5f9"/>
  <text x="372.0" y="162.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">E</text>
  <text x="450.0" y="162.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">P</text>
  <text x="528.0" y="162.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">A</text>
  <line x1="40.0" y1="262.0" x2="860.0" y2="262.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="36.0" y="267.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="700">5'</text>
  <text x="866.0" y="267.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">3'</text>
  <text x="450.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">AUG</text>
  <text x="528.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">UUU</text>
  <text x="606.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">GGC</text>
  <text x="684.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">UAA</text>
  <rect x="432.4" y="168.0" width="35.2" height="48.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="429.2" y="216.0" width="41.6" height="17.6" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="228.8" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">UAC</text>
  <line x1="450.0" y1="168.0" x2="450.0" y2="158.4" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <circle cx="450.0" cy="148.8" r="10.4" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="450.0" y="152.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">Met</text>
  <text x="720.0" y="120.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">E: exit</text>
  <text x="720.0" y="142.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">P: peptidyl</text>
  <text x="720.0" y="164.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">A: aminoacyl</text>
  <text x="60.0" y="120.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">small subunit + mRNA (AUG)</text>
  <text x="60.0" y="140.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">+ first aa-tRNA (Met;</text>
  <text x="60.0" y="160.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">fMet in prokaryotes)</text>
  <text x="60.0" y="180.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">+ large subunit</text>
  <rect x="15.0" y="320.0" width="870.0" height="280.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="350.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">2. elongation (repeats for every codon)</text>
  <rect x="230.0" y="410.0" width="260.0" height="100.0" rx="40" stroke="#475569" stroke-width="2.5" fill="#e2e8f0"/>
  <rect x="240.0" y="524.0" width="240.0" height="46.0" rx="22" stroke="#475569" stroke-width="2.5" fill="#f1f5f9"/>
  <text x="282.0" y="432.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">E</text>
  <text x="360.0" y="432.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">P</text>
  <text x="438.0" y="432.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">A</text>
  <line x1="40.0" y1="532.0" x2="860.0" y2="532.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="36.0" y="537.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="700">5'</text>
  <text x="866.0" y="537.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">3'</text>
  <text x="360.0" y="556.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">AUG</text>
  <text x="438.0" y="556.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">UUU</text>
  <text x="516.0" y="556.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">GGC</text>
  <text x="594.0" y="556.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">UAA</text>
  <rect x="342.4" y="438.0" width="35.2" height="48.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="339.2" y="486.0" width="41.6" height="17.6" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="360.0" y="498.8" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">UAC</text>
  <line x1="360.0" y1="438.0" x2="360.0" y2="428.4" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <circle cx="360.0" cy="418.8" r="10.4" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="360.0" y="422.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">Met</text>
  <rect x="420.4" y="438.0" width="35.2" height="48.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="417.2" y="486.0" width="41.6" height="17.6" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="438.0" y="498.8" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">AAA</text>
  <line x1="438.0" y1="438.0" x2="438.0" y2="428.4" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <circle cx="438.0" cy="418.8" r="10.4" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="438.0" y="422.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">Phe</text>
  <path d="M368 410 Q400 380 430 410" stroke="#0f7a62" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="400.0" y="378.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">peptide bond</text>
  <text x="560.0" y="400.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">a. aa-tRNA enters the A site</text>
  <text x="560.0" y="419.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">   (elongation factor)</text>
  <text x="560.0" y="438.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">b. peptidyl transferase joins the</text>
  <text x="560.0" y="457.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">   chain to the new amino acid</text>
  <text x="560.0" y="476.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">c. ribosome moves 3 nucleotides</text>
  <text x="560.0" y="495.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">   to the 3' end (translocation)</text>
  <text x="560.0" y="514.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">d. empty tRNA leaves from E</text>
  <rect x="15.0" y="615.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="645.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">3. termination</text>
  <rect x="230.0" y="690.0" width="260.0" height="100.0" rx="40" stroke="#475569" stroke-width="2.5" fill="#e2e8f0"/>
  <rect x="240.0" y="804.0" width="240.0" height="46.0" rx="22" stroke="#475569" stroke-width="2.5" fill="#f1f5f9"/>
  <text x="282.0" y="712.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">E</text>
  <text x="360.0" y="712.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">P</text>
  <text x="438.0" y="712.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">A</text>
  <line x1="40.0" y1="812.0" x2="860.0" y2="812.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="36.0" y="817.0" font-size="12" fill="#dc2626" text-anchor="end" font-weight="700">5'</text>
  <text x="866.0" y="817.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">3'</text>
  <text x="360.0" y="836.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">GGC</text>
  <text x="438.0" y="836.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">UAA</text>
  <ellipse cx="438.0" cy="742.0" rx="30.0" ry="22.0" stroke="#be123c" stroke-width="2" fill="#ffe4e6"/>
  <text x="438.0" y="746.2" font-size="12" fill="#be123c" text-anchor="middle" font-weight="700">RF</text>
  <rect x="342.4" y="720.0" width="35.2" height="48.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="339.2" y="768.0" width="41.6" height="17.6" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="360.0" y="780.8" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">CCG</text>
  <line x1="360.0" y1="720.0" x2="360.0" y2="710.4" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <circle cx="360.0" cy="700.8" r="10.4" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="360.0" y="704.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">Gly</text>
  <circle cx="334.0" cy="692.0" r="11.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
  <circle cx="310.0" cy="686.0" r="11.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
  <circle cx="286.0" cy="680.0" r="11.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
  <circle cx="262.0" cy="674.0" r="11.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
  <line x1="250.0" y1="680.0" x2="206.3" y2="671.3" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <path d="M200.0 670.0 L207.8 668.1 L206.4 674.7 Z" fill="#0f7a62"/>
  <text x="150.0" y="660.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">polypeptide released</text>
  <text x="560.0" y="690.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">stop codon (UAA, UAG or UGA) at A:</text>
  <text x="560.0" y="709.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">no tRNA fits; a release factor frees</text>
  <text x="560.0" y="728.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the polypeptide; the subunits separate</text>
  <text x="450.0" y="881" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
