<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 12.25 (C11-BIO, PDF p279): two close-up side views of the knee bones. Left: the hamstrings at the back of the thigh contract and the lower leg (tibia and fibula) is bent back (flexed); the quadriceps are relaxed (not shown); the kneecap (patella) sits in front. Right: the quadriceps at the front contract, pulling through the patella, and the lower leg is straightened (extended); the hamstrings are relaxed (not shown). Blue curved arrows show the leg movement. Original flat drawing after the printed figure. -->
  <defs>
    <marker id="ka" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
    <marker id="ba" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ab8d8"/></marker>
  </defs>
  <rect width="1080" height="540" fill="#ffffff"/>
  <g transform="scale(1.3)" stroke-linejoin="round">
    <!-- LEFT: flexed -->
    <path d="M128 330 C150 360 210 372 262 362" stroke="#8ab8d8" stroke-width="16" fill="none" marker-end="url(#ba)" transform="rotate(180 196 350)"/>
    <path d="M175 28 L232 18 C240 70 252 140 278 196 C300 206 306 236 296 252 C284 266 262 262 250 254 C236 262 218 256 214 238 C212 208 214 186 210 166 C196 120 184 74 175 28 Z" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5"/>
    <path d="M222 30 C230 90 244 150 266 200" stroke="#b8ac78" stroke-width="3" fill="none"/>
    <path d="M140 52 C160 40 182 34 196 40 C206 80 214 120 220 150 C200 140 170 110 140 52 Z" fill="#a8604a" stroke="#6a3020" stroke-width="2"/>
    <path d="M156 60 C176 90 196 118 214 140 M172 50 C188 80 204 110 216 132" stroke="#c07a60" stroke-width="2" fill="none"/>
    <path d="M214 148 C222 190 226 230 232 268" stroke="#eef0f2" stroke-width="7" fill="none"/>
    <path d="M206 140 C210 180 216 230 222 262" stroke="#eef0f2" stroke-width="5" fill="none"/>
    <ellipse cx="318" cy="208" rx="11" ry="20" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5" transform="rotate(20 318 208)"/>
    <g transform="rotate(12 262 270)">
    <path d="M238 262 C256 254 286 254 298 264 C304 278 296 292 280 300 L262 392 L232 396 L238 300 C228 290 228 272 238 262 Z" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5"/>
    <path d="M222 274 C210 278 208 296 218 304 L210 392 L224 394 L232 302 Z" fill="#c8bc88" stroke="#8a7e50" stroke-width="2"/>
    <path d="M250 300 L262 300 M246 330 L258 330" stroke="#b8ac78" stroke-width="2"/>
    </g>
    <!-- RIGHT: extended -->
    <path d="M520 382 C560 386 600 372 618 336" stroke="#8ab8d8" stroke-width="16" fill="none" marker-end="url(#ba)"/>
    <path d="M430 30 L470 22 C480 80 500 150 520 200 C540 210 546 236 536 254 C524 268 502 266 492 258 C476 264 458 256 456 240 C454 210 460 180 458 160 C448 110 440 70 430 30 Z" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5"/>
    <path d="M460 36 C470 90 484 140 500 190" stroke="#b8ac78" stroke-width="3" fill="none"/>
    <path d="M428 70 C452 40 484 30 520 28 C522 60 526 110 528 150 C500 130 460 100 428 70 Z" fill="#a8604a" stroke="#6a3020" stroke-width="2"/>
    <path d="M450 64 C476 90 502 116 524 136 M470 46 C490 74 508 100 524 120" stroke="#c07a60" stroke-width="2" fill="none"/>
    <path d="M526 150 C534 172 542 190 548 206" stroke="#eef0f2" stroke-width="8" fill="none"/>
    <ellipse cx="550" cy="222" rx="11" ry="20" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5"/>
    <path d="M552 242 C552 256 548 266 540 276" stroke="#eef0f2" stroke-width="6" fill="none"/>
    <path d="M480 262 C498 254 528 256 540 268 C546 282 538 296 524 302 L556 400 L528 404 L490 304 C478 292 472 274 480 262 Z" fill="#d6cc9e" stroke="#8a7e50" stroke-width="2.5"/>
    <path d="M468 278 C456 284 458 302 470 308 L504 396 L516 392 L484 302 Z" fill="#c8bc88" stroke="#8a7e50" stroke-width="2"/>
    <!-- labels -->
    <g font-size="17" fill="#222">
      <text x="274" y="28">Relaxed</text><text x="274" y="52">quadriceps</text><text x="274" y="76">(not shown)</text>
      <text x="16" y="186">Hamstrings</text><text x="16" y="214">contract</text>
      <text x="12" y="270">Lower leg is</text><text x="12" y="298">flexed (bent)</text>
      <text x="362" y="222">Relaxed</text><text x="362" y="246">hamstrings</text><text x="362" y="270">(not shown)</text>
      <text x="544" y="82">Quadriceps</text><text x="544" y="110">contract</text>
      <text x="598" y="244">Lower leg</text><text x="598" y="272">is extended</text><text x="598" y="300">(straightened)</text>
    </g>
    <g stroke="#222" stroke-width="1.5" fill="none">
      <path d="M282 90 L262 110" marker-end="url(#ka)"/>
      <path d="M120 170 L176 132"/>
      <path d="M446 210 L466 192" marker-end="url(#ka)"/>
      <path d="M540 76 L512 72"/>
    </g>
  </g>
</svg>
