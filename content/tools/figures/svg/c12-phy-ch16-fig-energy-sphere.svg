<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Figs 16.4 and 16.5: charge Q is brought from infinity to A (no work), then q to B a distance r away (work kQq/r), giving Ep = kQq/r; and an isolated charged sphere of radius R with C = Q/V = 4 pi eo R. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Potential energy of two charges; an isolated sphere (after Figs 16.4 and 16.5)</text>
  <rect x="15.0" y="55.0" width="430.0" height="385.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">assembling two charges</text>
  <circle cx="110.0" cy="330.0" r="6.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="330.0" cy="330.0" r="6.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="110.0" y="356.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="330.0" y="356.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <line x1="123.6" y1="330.0" x2="316.4" y2="330.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M322.0 330.0 L315.7 333.0 L315.7 327.0 Z" fill="#4b5563"/>
  <path d="M118.0 330.0 L124.3 327.0 L124.3 333.0 Z" fill="#4b5563"/>
  <text x="220.0" y="322.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">r</text>
  <line x1="65.0" y1="120.0" x2="106.0" y2="318.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <path d="M106.0 318.0 L100.6 310.8 L108.1 309.2 Z" fill="#4b5563"/>
  <circle cx="65.0" cy="120.0" r="13.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="65.0" y="125.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Q</text>
  <line x1="390.0" y1="110.0" x2="334.0" y2="316.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <path d="M334.0 316.0 L332.5 307.1 L339.8 309.1 Z" fill="#4b5563"/>
  <circle cx="390.0" cy="110.0" r="13.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="390.0" y="115.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">q</text>
  <text x="120.0" y="135.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">1. bring Q from infinity to A:</text>
  <text x="120.0" y="153.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">   no field yet, so W_A = 0</text>
  <text x="120.0" y="171.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">2. bring q to B, where V = kQ/r:</text>
  <text x="120.0" y="189.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">   W_B = qV = kQq/r</text>
  <text x="230.0" y="410.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">E</tspan><tspan dy="5.1" font-size="11.2">p</tspan><tspan dy="-5.1"> = (1/4 pi e</tspan><tspan dy="5.1" font-size="11.2">o</tspan><tspan dy="-5.1">) Qq / r</tspan></text>
  <rect x="455.0" y="55.0" width="430.0" height="385.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">isolated spherical conductor</text>
  <circle cx="670.0" cy="215.0" r="95.0" stroke="#14181f" stroke-width="2.4" fill="#f8fafc"/>
  <text x="751.0" y="220.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="744.8" y="251.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="727.3" y="277.3" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="701.0" y="294.8" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="670.0" y="301.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="639.0" y="294.8" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="612.7" y="277.3" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="595.2" y="251.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="589.0" y="220.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="595.2" y="189.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="612.7" y="162.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="639.0" y="145.2" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="670.0" y="139.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="701.0" y="145.2" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="727.3" y="162.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="744.8" y="189.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="670.0" y1="215.0" x2="765.0" y2="215.0" stroke="#14181f" stroke-width="1.6" stroke-linecap="round"/>
  <text x="717.5" y="207.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">R</text>
  <text x="654.0" y="220.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">Q</text>
  <text x="480.0" y="345.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">C = Q / V;   V = (1/4 pi e</tspan><tspan dy="4.8" font-size="10.5">o</tspan><tspan dy="-4.8">) Q / R</tspan></text>
  <text x="480.0" y="375.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">C = 4 pi e</tspan><tspan dy="4.8" font-size="10.5">o</tspan><tspan dy="-4.8"> R</tspan></text>
  <text x="480.0" y="405.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">in a medium:  C = 4 pi e</tspan><tspan dy="4.8" font-size="10.5">o</tspan><tspan dy="-4.8"> e</tspan><tspan dy="4.8" font-size="10.5">r</tspan><tspan dy="-4.8"> R</tspan></text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
