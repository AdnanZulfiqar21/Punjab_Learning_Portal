<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Fig 21.13: sunlight strikes the equator directly and the poles at a low angle, so the equator is heated more; and air moving away from the equator over the rotating Earth is deflected to the right in the northern hemisphere and to the left in the southern hemisphere. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Uneven heating and the Coriolis deflection (after Fig 21.13)</text>
  <rect x="15.0" y="55.0" width="430.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">sunlight on the curved Earth</text>
  <circle cx="270.0" cy="250.0" r="120.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="150.0" y1="250.0" x2="390.0" y2="250.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="395.0" y="254.0" font-size="11" fill="#d7322f" text-anchor="start" font-weight="700">equator</text>
  <line x1="40.0" y1="150.0" x2="191.7" y2="150.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M199.7 150.0 L190.6 154.2 L190.6 145.8 Z" fill="#d98b2b"/>
  <text x="40.0" y="140.0" font-size="11" fill="#d98b2b" text-anchor="start" font-weight="700">spread out: cooler</text>
  <line x1="40.0" y1="250.0" x2="138.0" y2="250.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M146.0 250.0 L136.9 254.2 L136.9 245.8 Z" fill="#d98b2b"/>
  <text x="40.0" y="240.0" font-size="11" fill="#d98b2b" text-anchor="start" font-weight="700">direct: hotter</text>
  <line x1="40.0" y1="350.0" x2="191.7" y2="350.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M199.7 350.0 L190.6 354.2 L190.6 345.8 Z" fill="#d98b2b"/>
  <text x="40.0" y="340.0" font-size="11" fill="#d98b2b" text-anchor="start" font-weight="700">spread out: cooler</text>
  <text x="270.0" y="115.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">North Pole</text>
  <text x="270.0" y="395.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">South Pole</text>
  <rect x="455.0" y="55.0" width="430.0" height="390.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">air moving over a rotating Earth</text>
  <circle cx="670.0" cy="250.0" r="120.0" stroke="#4b5563" stroke-width="2" fill="#f8fafc"/>
  <line x1="550.0" y1="250.0" x2="790.0" y2="250.0" stroke="#d7322f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <path d="M640 230 Q660 170 700 150" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M700.0 150.0 L693.6 157.7 L690.0 150.0 Z" fill="#1f6fb5"/>
  <path d="M640 270 Q660 330 700 350" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M700.0 350.0 L690.0 350.0 L693.6 342.3 Z" fill="#1f6fb5"/>
  <line x1="640.0" y1="230.0" x2="640.0" y2="150.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="640.0" y1="270.0" x2="640.0" y2="350.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="710.0" y="140.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">deflected right (N)</text>
  <text x="710.0" y="365.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">deflected left (S)</text>
  <text x="670.0" y="398.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">the Earth turns from west to east</text>
  <text x="670.0" y="425.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">specific angular momentum  L = r v  (conserved)</tspan></text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
