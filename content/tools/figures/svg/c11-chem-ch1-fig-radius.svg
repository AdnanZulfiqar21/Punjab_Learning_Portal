<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.4 and 1.5: atomic radius across periods and down groups, and the sizes of ions against their atoms. Circles are schematic, not to scale. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .e{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="370" y="40">Atomic radius across a period and down a group</text>
  <!-- period 2 row -->
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2">
    <circle cx="100" cy="130" r="30"/><circle cx="190" cy="130" r="26"/><circle cx="280" cy="130" r="22"/><circle cx="370" cy="130" r="19"/><circle cx="460" cy="130" r="17"/><circle cx="550" cy="130" r="15"/><circle cx="640" cy="130" r="13"/>
  </g>
  <g class="e"><text x="100" y="135">Li</text><text x="190" y="135">Be</text><text x="280" y="135">B</text><text x="370" y="135">C</text><text x="460" y="135">N</text><text x="550" y="135">O</text><text x="640" y="135">F</text></g>
  <path d="M90 185 H650" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="370" y="210">across a period: nuclear charge rises, same shell, so the electron cloud is pulled in</text>
  <!-- group 1 column -->
  <g fill="#f6d5cf" stroke="#b5463a" stroke-width="2">
    <circle cx="100" cy="300" r="30"/><circle cx="100" cy="380" r="36"/><circle cx="100" cy="470" r="42"/><circle cx="100" cy="570" r="48"/>
  </g>
  <g class="e"><text x="100" y="305">Li</text><text x="100" y="385">Na</text><text x="100" y="475">K</text><text x="100" y="575">Rb</text></g>
  <path d="M170 280 V600" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="450" y="310">down a group: a new shell is added and</text><text class="s" x="450" y="332">the inner electrons shield the outer ones,</text><text class="s" x="450" y="354">so the atom grows although the nuclear</text><text class="s" x="450" y="376">charge also rises</text>
  <text class="s" x="450" y="420">radius = half the distance between two</text><text class="s" x="450" y="442">identical bonded atoms, in picometres (pm)</text><text class="s" x="450" y="464">or angstroms; it depends on the bond type</text>
  <text class="s" x="450" y="508">factors: atomic number, effective nuclear</text><text class="s" x="450" y="530">charge, shielding by inner electrons</text>
  <!-- ions -->
  <text class="h" x="900" y="40">Ionic radius against the atom</text>
  <circle cx="800" cy="150" r="48" fill="#fff4e2" stroke="#8a4b00" stroke-width="2"/><text class="e" x="800" y="155">Na</text>
  <circle cx="930" cy="150" r="30" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="930" y="155">Na+</text>
  <text class="s" x="900" y="225">a cation is smaller than its atom: electrons lost,</text><text class="s" x="900" y="247">less repulsion, the rest pulled closer to the nucleus</text>
  <circle cx="800" cy="340" r="30" fill="#fff4e2" stroke="#8a4b00" stroke-width="2"/><text class="e" x="800" y="345">Cl</text>
  <circle cx="930" cy="340" r="50" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="e" x="930" y="345">Cl-</text>
  <text class="s" x="900" y="420">an anion is larger than its atom: electrons gained,</text><text class="s" x="900" y="442">more repulsion, the cloud expands</text>
  <text class="s" x="900" y="490">across a period both cations and anions shrink</text><text class="s" x="900" y="512">(rising nuclear charge); down a group both grow</text><text class="s" x="900" y="534">(more shells outweigh the nuclear charge)</text>
  <text class="s" x="900" y="580">isoelectronic series: N3- larger than O2- larger than F-;</text><text class="s" x="900" y="602">Na+ larger than Mg2+ larger than Al3+</text>
</svg>
