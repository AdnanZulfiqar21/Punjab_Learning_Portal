  <text x="30.0" y="250.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">prostate gland:</text>
  <line x1="133.0" y1="245.0" x2="310.0" y2="245.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="310.0" cy="245.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
