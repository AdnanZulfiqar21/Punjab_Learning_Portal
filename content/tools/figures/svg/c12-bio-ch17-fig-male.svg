  <circle cx="340.0" cy="380.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="30.0" y="445.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">penis (erectile tissue)</text>
  <line x1="185.8" y1="440.0" x2="322.0" y2="440.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="322.0" cy="440.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="470.0" y="325.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">vas deferens</text>
  <line x1="466.0" y1="320.0" x2="410.0" y2="360.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="410.0" cy="360.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="450.0" y="435.0" font-size="12" fill="#7c2d12" text-anchor="start" font-weight="700">epididymis:</text>
  <line x1="446.0" y1="430.0" x2="386.0" y2="494.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="386.0" cy="494.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="450.0" y="451.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">sperm gain motility</text>
  <text x="450.0" y="467.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">(at least 18 h)</text>
  <text x="450.0" y="525.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="700">testis in the</text>
  <line x1="446.0" y1="520.0" x2="372.0" y2="510.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="372.0" cy="510.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="450.0" y="541.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">scrotum (about 34 C)</text>
