  <text x="30.0" y="310.0" font-size="12" fill="#0e7490" text-anchor="start" font-weight="700">bulbourethral gland:</text>
  <line x1="166.0" y1="305.0" x2="324.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="324.0" cy="290.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
