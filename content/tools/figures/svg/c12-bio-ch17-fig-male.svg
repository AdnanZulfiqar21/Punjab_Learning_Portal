  <text x="30.0" y="115.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">urinary bladder</text>
  <line x1="133.0" y1="110.0" x2="280.0" y2="130.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="280.0" cy="130.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="30.0" y="185.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">seminal vesicle:</text>
  <line x1="139.6" y1="180.0" x2="268.0" y2="210.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="268.0" cy="210.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
