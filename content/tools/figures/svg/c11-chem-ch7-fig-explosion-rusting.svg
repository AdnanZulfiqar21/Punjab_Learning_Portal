<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <!-- Vis7-1 (C11-CHEM, PDF p144): the two photographs in the box beside the chapter opening; flat drawing after them, side by side as printed: left, a huge explosion, a wall of orange-red fire and dark smoke rising from flat ground under a grey sky; right, a close-up of a rusty bolt with a hexagonal nut on a rust-brown iron plate. No photograph is reproduced. -->
  <rect width="1200" height="500" fill="#ffffff"/>
  <clipPath id="l"><rect x="10" y="10" width="580" height="480" rx="30"/></clipPath>
  <clipPath id="r"><rect x="610" y="10" width="580" height="480" rx="30"/></clipPath>
  <!-- left: explosion -->
  <g clip-path="url(#l)">
    <rect x="10" y="10" width="580" height="480" fill="#9ba3aa"/>
    <rect x="10" y="10" width="580" height="160" fill="#b9bfc4"/>
    <rect x="10" y="400" width="580" height="90" fill="#4b4a40"/>
    <g fill="#3a2f2a">
      <circle cx="90" cy="150" r="70"/><circle cx="200" cy="110" r="80"/><circle cx="330" cy="100" r="90"/><circle cx="460" cy="120" r="85"/><circle cx="560" cy="160" r="70"/>
    </g>
    <g fill="#c4421c">
      <circle cx="70" cy="260" r="90"/><circle cx="190" cy="220" r="100"/><circle cx="320" cy="210" r="110"/><circle cx="450" cy="230" r="100"/><circle cx="560" cy="270" r="90"/>
      <rect x="10" y="260" width="580" height="140"/>
    </g>
    <g fill="#ef7a1f">
      <circle cx="120" cy="290" r="70"/><circle cx="240" cy="260" r="80"/><circle cx="360" cy="250" r="85"/><circle cx="480" cy="280" r="75"/>
      <rect x="40" y="300" width="520" height="100"/>
    </g>
    <g fill="#fbc23c">
      <circle cx="180" cy="320" r="45"/><circle cx="290" cy="300" r="55"/><circle cx="400" cy="310" r="50"/><circle cx="500" cy="330" r="40"/>
      <rect x="120" y="330" width="410" height="60"/>
    </g>
    <path d="M10 398 L 590 398" stroke="#fde59a" stroke-width="10"/>
    <g fill="#2d2c26">
      <path d="M40 400 L 44 372 L 48 400 Z M120 400 L 124 368 L 128 400 Z M210 400 L 214 374 L 218 400 Z M300 400 L 304 366 L 308 400 Z M390 400 L 394 372 L 398 400 Z M480 400 L 484 368 L 488 400 Z M560 400 L 564 374 L 568 400 Z"/>
    </g>
  </g>
  <!-- right: rusty bolt and nut -->
  <g clip-path="url(#r)">
    <rect x="610" y="10" width="580" height="480" fill="#9a4f27"/>
    <g fill="#b8642f" opacity="0.8">
      <ellipse cx="690" cy="90" rx="100" ry="60"/><ellipse cx="1120" cy="420" rx="120" ry="70"/><ellipse cx="1110" cy="110" rx="90" ry="50"/>
    </g>
    <g fill="#6e3518" opacity="0.7">
      <ellipse cx="700" cy="400" rx="90" ry="50"/><ellipse cx="1060" cy="260" rx="60" ry="40"/><ellipse cx="880" cy="60" rx="70" ry="30"/>
    </g>
    <!-- hexagonal nut -->
    <path d="M690 230 L 760 140 L 880 140 L 940 230 L 880 330 L 760 330 Z" fill="#8a5a3a" stroke="#4e2a14" stroke-width="5" stroke-linejoin="round"/>
    <path d="M760 140 L 880 140 L 900 175 L 780 175 Z" fill="#b08766"/>
    <path d="M690 230 L 760 140 L 780 175 L 720 240 Z" fill="#a27454"/>
    <g fill="#5a2e14" opacity="0.6"><circle cx="740" cy="270" r="18"/><circle cx="860" cy="200" r="14"/><circle cx="820" cy="300" r="12"/></g>
    <!-- threaded bolt end sticking out to the right -->
    <rect x="920" y="175" width="150" height="110" rx="12" fill="#9c6a48" stroke="#4e2a14" stroke-width="5"/>
    <g stroke="#4e2a14" stroke-width="7" stroke-linecap="round">
      <path d="M945 178 L 960 282 M975 178 L 990 282 M1005 178 L 1020 282 M1035 178 L 1050 282"/>
    </g>
    <path d="M1070 185 C 1090 200 1090 260 1070 275" stroke="#4e2a14" stroke-width="5" fill="#8a5a3a"/>
  </g>
</svg>
