  <!-- Original diagram after Figs 16.17 to 16.19: a single-phase fan motor with a capacitor in series with its starting coil, a flashgun in which a battery charges a capacitor that discharges through a xenon tube, and a capacitor smoothing rectified pulses into a steadier voltage. -->
