<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.5 to 2.7 and topics 2.4 and 2.5: the velocity-time graph and the three equations of motion, with motion under gravity. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">The velocity-time graph and the three equations of motion</text>
  <!-- graph -->
  <rect x="50" y="55" width="420" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="260" y="83">Velocity-time graph (Figs. 2.5 to 2.7)</text>
  <path d="M100 330 H440" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M100 330 V100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M100 330 L100 250 L380 130 L380 330 Z" fill="#bcdcf0" opacity="0.5"/>
  <path d="M100 250 H380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M100 130 H380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M380 130 V330" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M100 250 L380 130" stroke="#d7322f" stroke-width="3"/>
  <text class="l" x="88" y="334">O</text>
  <text class="l" x="86" y="254">A</text>
  <text class="l" x="386" y="126">B</text>
  <text class="l" x="386" y="254">C</text>
  <text class="l" x="376" y="348">D</text>
  <text class="l" x="86" y="134">E</text>
  <text class="l" x="420" y="348">time</text>
  <text class="l" x="112" y="118">velocity</text>
  <text class="r" x="230" y="268">AC = t</text>
  <text class="r" x="392" y="196">BC = at</text>
  <text class="r" x="60" y="294">OA = vi</text>
  <text class="r" x="392" y="300">BD = vf</text>
  <text class="r" x="200" y="310">rectangle OACD = vi t</text>
  <text class="r" x="160" y="150">triangle ABC = (1/2) t (at)</text>
  <g class="t">
    <text x="70" y="370">slope of AB = a; area under the graph = displacement S</text>
  </g>
  <!-- derivations -->
  <rect x="490" y="55" width="660" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="820" y="83">The three equations (uniform acceleration along a straight line)</text>
  <g class="t"><text x="510" y="110"><tspan class="b">first (velocity-time):</tspan> a = (vf - vi)/t, and on the graph BD = BC + CD = at + vi</text></g>
  <text class="f" x="510" y="132">vf = vi + a t                                   ... (2.11)</text>
  <g class="t"><text x="510" y="160"><tspan class="b">second (position-time):</tspan> S = average velocity x time = (vi + vf) t / 2 with vf = vi + at;</text>
    <text x="510" y="178">on the graph S = area OABD = rectangle OACD + triangle ABC = vi t + (1/2) t (at)</text></g>
  <text class="f" x="510" y="200">S = vi t + (1/2) a t^2                          ... (2.14)</text>
  <g class="t"><text x="510" y="228"><tspan class="b">third (velocity-position):</tspan> 2S = (vi + vf) t with t = (vf - vi)/a;</text>
    <text x="510" y="246">on the graph S = (1/2)(OA + BD) x OD = (1/2)(vi + vf) t, the trapezium OABD</text></g>
  <text class="f" x="510" y="268">2 a S = vf^2 - vi^2                             ... (2.16)</text>
  <g class="t">
    <text x="510" y="298"><tspan class="b">signs:</tspan> if the direction of motion does not change, vectors are handled like scalars;</text>
    <text x="510" y="316">the initial velocity is positive and quantities opposite to it are negative</text>
    <text x="510" y="344"><tspan class="b">free fall:</tspan> replace a by g = 9.8 m s^-2 downward (no air resistance): vf = vi + g t,</text>
    <text x="510" y="362">h = vi t + (1/2) g t^2, vf^2 - vi^2 = 2 g h; g positive for a falling body, negative when thrown up</text>
  </g>
  <!-- examples -->
  <rect x="50" y="405" width="1100" height="250" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="433">Worked examples (2.2 to 2.4) and Galileo's result</text>
  <g class="t">
    <text x="70" y="460"><tspan class="b">2.2</tspan> car at 10 m s^-1, a = 2 m s^-2, t = 5 s: vf = 10 + 2 x 5 = 20 m s^-1</text>
    <text x="70" y="480"><tspan class="b">2.3</tspan> vi = 15 m s^-1, a = 2 m s^-2, t = 4 s: S = 15 x 4 + (1/2) x 2 x 16 = 76 m</text>
    <text x="70" y="500"><tspan class="b">2.4</tspan> from rest to 300 km h^-1 = 250/3 m s^-1 over 0.45 km = 450 m: a = (250/3)^2 / (2 x 450) = 6944.4 / 900 = 7.72 m s^-2</text>
    <text x="70" y="520"><tspan class="b">2.4 (second)</tspan> iron ball dropped from a tower, t = 3.34 s: vf = 9.8 x 3.34 = 32.7 m s^-1; h = (32.7)^2 / (2 x 9.8) = 1069.29 / 19.6 = 54.56 m</text>
    <text x="70" y="552"><tspan class="b">motion under gravity (2.5):</tspan> according to Galileo all bodies fall freely (in vacuum) with the same acceleration g, whose experimental</text>
    <text x="70" y="570">value is 9.8 m s^-2; bodies allowed to fall from the same height strike the ground with the same velocity</text>
    <text x="70" y="600"><tspan class="b">printed order:</tspan> the book calls the velocity-time, position-time and velocity-position relations the first, second and third equations of motion;</text>
    <text x="70" y="618">they apply only to objects moving in a straight line with constant acceleration; the example number 2.4 is printed twice</text>
    <text x="70" y="640">equation numbers as printed: (2.11) to (2.13) first equation; (2.14) second; (2.15) and (2.16) third</text>
  </g>
  <text class="s" x="600" y="672" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
