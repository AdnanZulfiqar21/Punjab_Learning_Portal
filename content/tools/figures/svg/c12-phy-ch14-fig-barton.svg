<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="455" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.17: pendulums P, A, B (length l1) and C, D (length l2) hang from one rod; when P swings, A and B of the same length resonate with large amplitude while C and D hardly move. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Resonance with coupled pendulums (after Fig 14.17)</text>
  <line x1="80.0" y1="90.0" x2="820.0" y2="90.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="100.0" y1="90.0" x2="100.0" y2="380.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="800.0" y1="90.0" x2="800.0" y2="380.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="200.0" y1="90.0" x2="174.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="200.0" y1="90.0" x2="226.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="200.0" y1="90.0" x2="200.0" y2="340.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="200.0" cy="340.0" r="16.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="200.0" y="378.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">P</text>
  <text x="210.0" y="215.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">l1 (driver)</text>
  <line x1="330.0" y1="90.0" x2="304.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="330.0" y1="90.0" x2="356.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="330.0" y1="90.0" x2="330.0" y2="340.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="330.0" cy="340.0" r="16.0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="330.0" y="378.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="340.0" y="215.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">l1</text>
  <line x1="450.0" y1="90.0" x2="450.0" y2="260.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="450.0" cy="260.0" r="16.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="450.0" y="298.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="460.0" y="175.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">l2</text>
  <line x1="570.0" y1="90.0" x2="544.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="570.0" y1="90.0" x2="596.0" y2="340.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="570.0" y1="90.0" x2="570.0" y2="340.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="570.0" cy="340.0" r="16.0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="570.0" y="378.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="580.0" y="215.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">l1</text>
  <line x1="690.0" y1="90.0" x2="690.0" y2="260.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="690.0" cy="260.0" r="16.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="690.0" y="298.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">D</text>
  <text x="700.0" y="175.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">l2</text>
  <text x="450.0" y="405.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">P has the same length as A and B, so A and B swing with large amplitude (resonance);</text>
  <text x="450.0" y="423.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C and D, of different length, hardly move. Set P to length l2 and C and D resonate instead.</text>
  <text x="450.0" y="446" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
