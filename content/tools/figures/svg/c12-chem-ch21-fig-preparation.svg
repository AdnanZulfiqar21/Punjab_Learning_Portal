<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original summary of the book's six methods: ethane + Cl2 in light; ethene + HBr; ethanol + HCl with ZnCl2; ethanol + SOCl2 with pyridine; ethanol + PBr3 or PCl5; ethanol + KBr + H2SO4 (H3PO4 for iodoalkanes). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ways of making halogenoalkanes</text>
  <rect x="345.0" y="257.0" width="210.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="292.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">-X</tspan></text>
  <rect x="15.0" y="65.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="150.0" y="91.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethane CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="150.0" y="113.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ Cl</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">, light</tspan></text>
  <text x="150.0" y="133.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">free-radical substitution</tspan></text>
  <line x1="150.0" y1="145.0" x2="338.1" y2="253.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M345.0 257.0 L335.0 256.2 L339.2 248.8 Z" fill="#4b5563"/>
  <rect x="315.0" y="50.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="76.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethene CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">=CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="450.0" y="98.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ HBr</tspan></text>
  <text x="450.0" y="118.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">electrophilic addition</tspan></text>
  <line x1="450.0" y1="130.0" x2="450.0" y2="249.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 257.0 L445.8 247.9 L454.2 247.9 Z" fill="#4b5563"/>
  <rect x="615.0" y="65.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="750.0" y="91.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethanol + HCl</tspan></text>
  <text x="750.0" y="113.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">ZnCl</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2"> catalyst</tspan></text>
  <text x="750.0" y="133.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">gives chloroethane + H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O</tspan></text>
  <line x1="750.0" y1="145.0" x2="561.9" y2="253.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M555.0 257.0 L560.8 248.8 L565.0 256.2 Z" fill="#4b5563"/>
  <rect x="15.0" y="425.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="150.0" y="451.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethanol + SOCl</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="150.0" y="473.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">pyridine</tspan></text>
  <text x="150.0" y="493.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">SO</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8"> and HCl escape as gases</tspan></text>
  <line x1="150.0" y1="425.0" x2="338.1" y2="317.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M345.0 313.0 L339.2 321.2 L335.0 313.8 Z" fill="#4b5563"/>
  <rect x="315.0" y="440.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="466.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethanol + PBr</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> or PCl</tspan><tspan dy="4.8" font-size="10.5">5</tspan></text>
  <text x="450.0" y="488.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">3ROH + PBr</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2"> -&gt; 3RBr + H</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">PO</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="450.0" y="508.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">ROH + PCl</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8"> -&gt; RCl + POCl</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8"> + HCl</tspan></text>
  <line x1="450.0" y1="440.0" x2="450.0" y2="321.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 313.0 L454.2 322.1 L445.8 322.1 Z" fill="#4b5563"/>
  <rect x="615.0" y="425.0" width="270.0" height="80.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="750.0" y="451.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethanol + KBr + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">SO</tspan><tspan dy="4.8" font-size="10.5">4</tspan></text>
  <text x="750.0" y="473.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">HBr made in the flask</tspan></text>
  <text x="750.0" y="493.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">PO</tspan><tspan dy="3.8" font-size="8.4">4</tspan><tspan dy="-3.8"> used for iodoalkanes</tspan></text>
  <line x1="750.0" y1="425.0" x2="561.9" y2="317.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M555.0 313.0 L565.0 313.8 L560.8 321.2 Z" fill="#4b5563"/>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
