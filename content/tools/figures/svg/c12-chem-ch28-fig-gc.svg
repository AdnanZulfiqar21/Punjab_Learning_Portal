<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 28.5: the sample is injected and vaporised, carried by helium or nitrogen through a long coiled column in an oven, and detected as peaks on a chromatogram; each peak's retention time identifies a component and its area (1/2 x base x height) gives its proportion. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Gas chromatography</text>
  <rect x="15.0" y="55.0" width="870.0" height="280.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the instrument</text>
  <rect x="250.0" y="110.0" width="300.0" height="200.0" rx="8" stroke="#475569" stroke-width="2.5" fill="#f8fafc"/>
  <text x="400.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">column oven</text>
  <ellipse cx="400.0" cy="205.0" rx="90.0" ry="70.0" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <ellipse cx="400.0" cy="205.0" rx="78.0" ry="58.0" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <ellipse cx="400.0" cy="205.0" rx="66.0" ry="46.0" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <rect x="225.0" y="150.0" width="45.0" height="22.0" rx="3" stroke="#475569" stroke-width="2" fill="#cbd5e1"/>
  <text x="150.0" y="160.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">sample injected</text>
  <line x1="150.0" y1="166.0" x2="214.8" y2="163.3" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M222.0 163.0 L214.0 167.1 L213.7 159.5 Z" fill="#14181f"/>
  <text x="150.0" y="205.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">injector port</text>
  <text x="150.0" y="221.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">(sample vaporised)</text>
  <line x1="248.0" y1="100.0" x2="248.0" y2="139.8" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M248.0 147.0 L244.2 138.8 L251.8 138.8 Z" fill="#1f6fb5"/>
  <text x="200.0" y="112.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">carrier gas in (He or N2):</text>
  <text x="200.0" y="127.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">the mobile phase</text>
  <rect x="530.0" y="230.0" width="45.0" height="22.0" rx="3" stroke="#475569" stroke-width="2" fill="#cbd5e1"/>
  <text x="600.0" y="278.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">detector</text>
  <line x1="575.0" y1="241.0" x2="617.8" y2="241.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M625.0 241.0 L616.8 244.8 L616.8 237.2 Z" fill="#14181f"/>
  <text x="632.0" y="245.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">exit</text>
  <rect x="700.0" y="100.0" width="160.0" height="110.0" rx="8" stroke="#475569" stroke-width="2" fill="#f1f5f9"/>
  <path d="M715.0 190.0 L735.0 190.0 L745.0 130.0 L755.0 190.0 L785.0 190.0 L795.0 150.0 L805.0 190.0 L845.0 190.0" stroke="#d7322f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="780.0" y="228.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">recorder: chromatogram</text>
  <line x1="575.0" y1="235.0" x2="700.0" y2="160.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="400.0" y="325.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">coiled column 1-5 m long, 3-6 mm wide, packed with particles coated with a non-volatile liquid (stationary phase)</text>
  <rect x="15.0" y="345.0" width="870.0" height="190.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="375.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the chromatogram: retention time and peak area</text>
  <line x1="70.0" y1="495.0" x2="70.0" y2="392.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M70.0 385.0 L73.8 393.2 L66.2 393.2 Z" fill="#14181f"/>
  <line x1="70.0" y1="495.0" x2="512.8" y2="495.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M520.0 495.0 L511.8 498.8 L511.8 491.2 Z" fill="#14181f"/>
  <text x="300.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">retention time</text>
  <text x="52.0" y="440.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700" transform="rotate(-90 52.0 440.0)">detector</text>
  <path d="M135.0 495.0 L150.0 445.0 L165.0 495.0 Z" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="150.0" y="437.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">A</text>
  <path d="M253.0 495.0 L270.0 420.0 L287.0 495.0 Z" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="270.0" y="412.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">B</text>
  <path d="M385.0 495.0 L400.0 455.0 L415.0 495.0 Z" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="400.0" y="447.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C</text>
  <text x="700.0" y="420.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">area of a peak = 1/2 x base x height</tspan></text>
  <text x="700.0" y="455.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">% of A = area of A / sum of areas x 100</tspan></text>
  <text x="700.0" y="488.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">narrow peaks: compare heights instead</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
