  <rect x="50" y="20" width="900" height="92" stroke="none" fill="url(#spec)"/>
  <text x="60" y="160" font-size="34" fill="#14181f" text-anchor="start" font-weight="400">Continuous spectrum</text>
  <rect x="50" y="200" width="900" height="92" stroke="none" fill="#050505"/>
  <line x1="131.0" y1="200" x2="131.0" y2="292" stroke="#5b2a9a" stroke-width="4"/>
  <line x1="209.3" y1="200" x2="209.3" y2="292" stroke="#3a55e0" stroke-width="4"/>
  <line x1="380.3" y1="200" x2="380.3" y2="292" stroke="#1fb86a" stroke-width="4"/>
  <line x1="855.5" y1="200" x2="855.5" y2="292" stroke="#d0262a" stroke-width="4"/>
  <text x="60" y="340" font-size="34" fill="#14181f" text-anchor="start" font-weight="400">Line spectrum</text>
  <rect x="50" y="380" width="900" height="92" stroke="none" fill="url(#spec)"/>
  <line x1="131.0" y1="380" x2="131.0" y2="472" stroke="#0a0a0a" stroke-width="5"/>
  <line x1="209.3" y1="380" x2="209.3" y2="472" stroke="#0a0a0a" stroke-width="5"/>
