<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topics 23.7.1 and 23.7.2: in esterification the acid loses OH and the alcohol loses H; acyl chlorides give esters completely (ethyl ethanoate, phenyl benzoate); esters such as ethyl and methyl benzoate are hydrolysed to benzoic acid and the alcohol. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making and hydrolysing esters</text>
  <rect x="15.0" y="55.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">esterification: which bonds break</text>
  <text x="160.0" y="146.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">R-CO-</tspan></text>
  <rect x="165.0" y="122.0" width="46.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#ffedd5"/>
  <text x="188.0" y="146.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="235.0" y="146.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <rect x="258.0" y="122.0" width="30.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#ffedd5"/>
  <text x="273.0" y="146.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="300.0" y="146.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">-O-R'</tspan></text>
  <line x1="393.8" y1="140.0" x2="461.2" y2="140.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470.0 140.0 L460.0 144.6 L460.0 135.4 Z" fill="#14181f"/>
  <path d="M385.0 140.0 L395.0 135.4 L395.0 144.6 Z" fill="#14181f"/>
  <text x="427.5" y="130.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-5.5" font-size="9.1">+</tspan></text>
  <text x="600.0" y="146.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-CO-O-R' + H</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">O</tspan></text>
  <text x="330.0" y="195.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the OH of the acid and the H of the alcohol (orange) leave as water</text>
  <text x="450.0" y="215.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">e.g. CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">COOH + CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH &lt;=&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">COOCH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2"> + H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O (ethyl propanoate)</tspan></text>
  <rect x="15.0" y="240.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="270.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">from acyl chlorides: fast and complete</text>
  <text x="450.0" y="295.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COCl + CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH -&gt; CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COOCH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1"> + HCl</tspan></text>
  <text x="450.0" y="330.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COCl + C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">OH -&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COOC</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1"> + HCl (phenyl benzoate)</tspan></text>
  <text x="450.0" y="360.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">no equilibrium mixture forms, unlike the acid + alcohol reaction</text>
  <rect x="15.0" y="390.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="420.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">hydrolysis (acid or base catalysed)</text>
  <text x="450.0" y="445.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COOC</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1"> + H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O -&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COOH + C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">OH (ethyl benzoate)</tspan></text>
  <text x="450.0" y="480.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COOCH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1"> + H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O -&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">COOH + CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">OH (methyl benzoate)</tspan></text>
  <text x="450.0" y="512.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">with NaOH the acid is first obtained as its sodium salt</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
