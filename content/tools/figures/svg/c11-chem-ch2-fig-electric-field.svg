<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.1 and Table 2.2: beams of protons, neutrons and electrons of the same speed in an electric field, and the particle properties as printed. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:15px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="360" y="36">Beams of the same speed in an electric field</text>
  <!-- plates -->
  <rect x="260" y="90" width="420" height="22" rx="4" fill="#d7322f"/><text class="k" x="470" y="80" style="fill:#d7322f">positive plate (+)</text>
  <rect x="260" y="470" width="420" height="22" rx="4" fill="#1f6fb5"/><text class="k" x="470" y="520" style="fill:#1f6fb5">negative plate (-)</text>
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"><path d="M300 115 V468 M400 115 V468 M500 115 V468 M600 115 V468"/></g>
  <!-- source -->
  <rect x="60" y="270" width="110" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="115" y="300">source</text>
  <!-- neutron straight -->
  <path d="M170 292 H700" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="t" x="350" y="280">neutron: no charge, no deflection</text>
  <!-- proton down slight -->
  <path d="M170 292 q260 10 440 120" fill="none" stroke="#d7322f" stroke-width="4" marker-end="url(#ad)"/>
  <text class="t" x="330" y="405" style="fill:#d7322f">proton: bends a little</text><text class="t" x="330" y="425" style="fill:#d7322f">towards the negative plate</text>
  <!-- electron up strong -->
  <path d="M170 292 q180 -20 280 -160" fill="none" stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"/>
  <text class="t" x="470" y="150" style="fill:#1f6fb5">electron: bends sharply towards the</text><text class="t" x="470" y="170" style="fill:#1f6fb5">positive plate (1/1836 of a proton's mass)</text>
  <text class="s" x="370" y="575">angle of deflection: charge over mass; radius of the curved path: mass over charge</text>
  <!-- table -->
  <text class="h" x="960" y="36">Table 2.2 as printed</text>
  <g font-size="14" fill="#4b5563">
    <text x="780" y="80" font-weight="700" fill="#14181f">Particle</text><text x="860" y="80" font-weight="700" fill="#14181f">Charge (C)</text><text x="990" y="80" font-weight="700" fill="#14181f">Relative</text><text x="1060" y="80" font-weight="700" fill="#14181f">Mass (kg)</text>
    <text x="780" y="108">Proton</text><text x="860" y="108">+1.6022 x 10^-19</text><text x="990" y="108">+1</text><text x="1060" y="108">1.6726 x 10^-27</text>
    <text x="780" y="134">Neutron</text><text x="860" y="134">0</text><text x="990" y="134">0</text><text x="1060" y="134">1.6750 x 10^-27</text>
    <text x="780" y="160">Electron</text><text x="860" y="160">-1.6022 x 10^-19</text><text x="990" y="160">-1</text><text x="1060" y="160">9.1095 x 10^-31</text>
    <text x="780" y="200" font-weight="700" fill="#14181f">Mass in amu</text><text x="780" y="224">proton 1.0073; neutron 1.0087; electron 5.4858 x 10^-4</text>
  </g>
  <path d="M770 90 H1190" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="15" fill="#4b5563">
    <text x="780" y="280" font-weight="700" fill="#14181f">Identity of an element</text>
    <text x="780" y="306">Z = proton number; A (mass number) = protons + neutrons</text>
    <text x="780" y="330">N = A - Z. Al-27: Z = 13, A = 27, N = 14</text>
    <text x="780" y="354">Al3+: 13 p, 14 n, 10 e. Cl-: 17 p, 18 n, 18 e</text>
    <text x="780" y="378">Table 2.1: O2- 8 n, 8 p, 10 e; S2- 16, 16, 18; P3- 16, 15, 18</text>
    <text x="780" y="414">Moseley (1913): the square root of an element's X-ray</text>
    <text x="780" y="436">frequency is proportional to Z, so the atomic number</text>
    <text x="780" y="458">is a fundamental property of the element</text>
  </g>
</svg>
