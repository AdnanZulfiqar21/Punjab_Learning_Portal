<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.23 to 4.26: an amino acid, glycine and alanine, and the peptide bond. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .c{font-size:24px;fill:#14181f;text-anchor:middle;font-family:Consolas, Courier New, monospace}
      .l{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="250" y="50">General structure of an amino acid</text>
  <!-- central alpha carbon with four groups -->
  <circle cx="250" cy="220" r="34" fill="#14181f"/><text x="250" y="229" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">C</text>
  <rect x="60" y="195" width="120" height="50" rx="10" fill="#1f6fb5"/><text class="c" x="120" y="228" style="fill:#fff">H2N</text>
  <rect x="320" y="195" width="130" height="50" rx="10" fill="#d7322f"/><text class="c" x="385" y="228" style="fill:#fff">COOH</text>
  <rect x="225" y="80" width="50" height="50" rx="10" fill="#9ca3af"/><text class="c" x="250" y="113" style="fill:#fff">H</text>
  <rect x="225" y="310" width="50" height="50" rx="10" fill="#d98b2b"/><text class="c" x="250" y="343" style="fill:#fff">R</text>
  <path d="M180 220 H216 M284 220 H320 M250 130 V186 M250 254 V310" stroke="#14181f" stroke-width="4"/>
  <text class="l" x="120" y="270">amino group</text><text class="l" x="385" y="270">carboxyl group</text><text class="l" x="250" y="390">side group (R)</text><text class="l" x="250" y="70">hydrogen</text>
  <text class="s" x="250" y="440">all four attach to the same alpha carbon;</text><text class="s" x="250" y="466">R decides which amino acid it is</text>
  <text class="s" x="250" y="500">glycine: R = H · alanine: R = CH3</text>
  <!-- peptide bond formation -->
  <text class="h" x="800" y="50">Peptide bond: glycine + alanine</text>
  <g class="c">
    <text x="590" y="200">H2N-CH-C</text><text x="548" y="240">H</text>
    <text x="660" y="170">O</text><text x="660" y="210">||</text>
    <text x="690" y="200">OH</text>
    <text x="770" y="200">H-N-CH-C</text><text x="754" y="240">H</text><text x="798" y="240">CH3</text>
    <text x="860" y="170">O</text><text x="860" y="210">||</text>
    <text x="900" y="200">OH</text>
  </g>
  <rect x="672" y="178" width="100" height="34" rx="8" fill="none" stroke="#5b3fb5" stroke-width="3" stroke-dasharray="6 4"/>
  <text class="l" x="722" y="150" style="fill:#5b3fb5">OH + H leave as water</text>
  <text class="l" x="590" y="280">glycine</text><text class="l" x="800" y="280">alanine</text>
  <path d="M800 300 L800 360" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="l" x="1000" y="335">dehydration synthesis, -H2O</text>
  <g class="c">
    <text x="640" y="430">H2N-CH-C</text><text x="598" y="470">H</text>
    <text x="710" y="400">O</text><text x="710" y="440">||</text>
    <text x="800" y="430">N-CH-C</text><text x="765" y="470">H</text><text x="815" y="470">CH3</text>
    <text x="860" y="400">O</text><text x="860" y="440">||</text>
    <text x="920" y="430">OH</text>
  </g>
  <rect x="718" y="408" width="72" height="34" rx="8" fill="none" stroke="#d98b2b" stroke-width="4"/>
  <text class="l" x="754" y="510" style="fill:#d98b2b;font-weight:700">peptide bond (C-N)</text>
  <text class="l" x="800" y="545">glycylalanine, a dipeptide: a free amino end and a free carboxyl end remain,</text>
  <text class="l" x="800" y="570">so more amino acids can be added to make a polypeptide chain</text>
  <text class="s" x="600" y="650">About 170 amino acids occur in living things; about 25 build proteins; most proteins use 20.</text>
  <text class="s" x="600" y="682">Our body makes 11 (non-essential); 9 essential ones must come from food (histidine only for babies).</text>
  <text class="s" x="600" y="730">Hydrolysis adds water back and breaks the peptide bond.</text>
</svg>
