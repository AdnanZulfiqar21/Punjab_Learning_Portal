<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.37 and 3.38: the sodium-potassium pump, endocytosis and exocytosis. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .l{font-size:19px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="260" y="50">Sodium-potassium pump</text>
  <text class="s" x="260" y="78">carrier protein using ATP</text>
  <text class="h" x="700" y="50">Endocytosis</text>
  <text class="s" x="700" y="78">bulky material taken in</text>
  <text class="h" x="1040" y="50">Exocytosis</text>
  <text class="s" x="1040" y="78">bulky material sent out</text>
  <!-- pump panel: membrane band -->
  <text class="l" x="40" y="250">outside: high Na+</text>
  <text class="l" x="40" y="520">inside: high K+</text>
  <rect x="40" y="330" width="440" height="100" fill="#dbe9f5"/>
  <rect x="40" y="330" width="440" height="14" fill="#1f6fb5"/><rect x="40" y="416" width="440" height="14" fill="#1f6fb5"/>
  <path d="M220 300 q40 -20 80 0 v160 q-40 20 -80 0 z" fill="#2f9a7e" stroke="#0a5a48" stroke-width="4"/>
  <!-- Na out (3), K in (2) -->
  <g fill="#d98b2b"><circle cx="240" cy="480" r="10"/><circle cx="260" cy="500" r="10"/><circle cx="280" cy="480" r="10"/></g>
  <text class="l" x="300" y="505">3 Na+</text>
  <path d="M250 470 L250 400 L250 270" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g fill="#5b3fb5"><circle cx="300" cy="200" r="10"/><circle cx="320" cy="220" r="10"/></g>
  <text class="l" x="335" y="205">2 K+</text>
  <path d="M290 240 L290 360 L290 490" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="160" cy="470" r="22" fill="#f2b134" stroke="#8a4b00" stroke-width="3"/><text class="s" x="160" y="476" style="font-weight:700">ATP</text>
  <path d="M185 465 L215 440" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="260" y="600">against the gradient: Na+ pumped out,</text><text class="s" x="260" y="624">K+ pumped in; keeps a resting nerve cell ready</text>
  <!-- endocytosis panel: membrane curving in to form a vesicle -->
  <text class="l" x="540" y="250">outside</text>
  <path d="M540 340 h80 q40 0 50 40 q10 60 30 70 q20 -10 30 -70 q10 -40 50 -40 h80" fill="#eef6fb" stroke="#1f6fb5" stroke-width="10"/>
  <rect x="540" y="350" width="320" height="300" fill="#eef6fb"/>
  <path d="M540 350 V650 M860 350 V650" stroke="none"/>
  <!-- particle entering the pocket -->
  <circle cx="700" cy="400" r="18" fill="#8a4b00"/>
  <path d="M700 300 L700 370" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- formed vesicle below -->
  <circle cx="700" cy="560" r="40" fill="#eef6fb" stroke="#1f6fb5" stroke-width="8"/>
  <circle cx="700" cy="560" r="18" fill="#8a4b00"/>
  <path d="M700 460 L700 505" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="700" y="690">membrane folds in, seals; vesicle moves in</text>
  <text class="s" x="700" y="716">phagocytosis: solids; pinocytosis: liquids</text>
  <text class="s" x="700" y="742">receptor-mediated: receptors pick cargo (LDL)</text>
  <!-- exocytosis panel: vesicle fusing with the membrane and releasing contents -->
  <text class="l" x="900" y="250">outside</text>
  <path d="M900 340 h80 q30 0 40 -30 q20 -50 40 -50 q20 0 40 50 q10 30 40 30 h40" fill="#eef6fb" stroke="#1f6fb5" stroke-width="10"/>
  <rect x="900" y="350" width="280" height="300" fill="#eef6fb"/>
  <g fill="#0f7a62"><circle cx="1040" cy="300" r="6"/><circle cx="1060" cy="320" r="6"/><circle cx="1020" cy="320" r="6"/></g>
  <g fill="#0f7a62"><circle cx="1000" cy="200" r="6"/><circle cx="1080" cy="180" r="6"/><circle cx="1120" cy="230" r="6"/><circle cx="1040" cy="150" r="6"/></g>
  <path d="M1040 290 L1040 230" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="1040" cy="560" r="40" fill="#eef6fb" stroke="#1f6fb5" stroke-width="8"/>
  <g fill="#0f7a62"><circle cx="1030" cy="555" r="6"/><circle cx="1050" cy="570" r="6"/><circle cx="1045" cy="545" r="6"/></g>
  <path d="M1040 510 L1040 400" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="1060" y="690">vesicle fuses with membrane;</text><text class="s" x="1060" y="716">contents released outside</text>
  <text class="s" x="600" y="785">Active transport: energy (ATP) is spent; carrier pumps move solutes against the gradient; vesicles move bulk material.</text>
</svg>
