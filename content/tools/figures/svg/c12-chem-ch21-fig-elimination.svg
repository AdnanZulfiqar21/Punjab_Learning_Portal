<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <!-- Original mechanisms after the book: E2, in which a base removes a beta-H of bromoethane as Br- leaves, giving ethene in one step; E1, in which 2-bromo-2-methylpropane first ionises to a carbocation and a base then removes a beta-H, giving 2-methylpropene. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Elimination: E2 and E1</text>
  <rect x="15.0" y="55.0" width="870.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">E2: one step (bromoethane)</text>
  <text x="60.0" y="141.7" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">B</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <circle cx="58.0" cy="117.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="66.0" cy="117.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="190.0" y="171.7" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="280.0" y="171.7" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="201.0" y1="165.0" x2="269.0" y2="165.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="190.0" y="113.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="190.0" y1="154.0" x2="190.0" y2="118.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="280.0" y="229.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="280.0" y1="176.0" x2="280.0" y2="212.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="183.6" y1="172.7" x2="166.4" y2="193.3" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="149.5" y="215.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="196.4" y1="172.7" x2="213.6" y2="193.3" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="230.5" y="215.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="273.6" y1="157.3" x2="256.4" y2="136.7" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="239.5" y="125.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="286.4" y1="157.3" x2="303.6" y2="136.7" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="320.5" y="125.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <path d="M78.0 125.0 Q120.0 85.0 178.0 105.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M178.0 105.0 L168.1 106.0 L170.8 98.1 Z" fill="#d7322f"/>
  <path d="M196.0 135.0 Q226.0 139.0 232.0 161.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M232.0 161.0 L225.5 153.4 L233.7 151.1 Z" fill="#d7322f"/>
  <path d="M284.0 193.0 Q300.0 205.0 290.0 215.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M290.0 215.0 L293.4 205.6 L299.4 211.6 Z" fill="#d7322f"/>
  <line x1="350.0" y1="165.0" x2="391.2" y2="165.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400.0 165.0 L390.0 169.6 L390.0 160.4 Z" fill="#14181f"/>
  <text x="540.0" y="171.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">=CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8"> + H-B + Br</tspan><tspan dy="-7.6" font-size="12.6">-</tspan></text>
  <text x="540.0" y="205.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">ethene</text>
  <text x="780.0" y="171.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">rate = k [RX] [base]</text>
  <text x="780.0" y="193.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">second order</text>
  <rect x="15.0" y="290.0" width="870.0" height="235.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="320.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">E1: two steps through a carbocation (2-bromo-2-methylpropane)</text>
  <text x="150.0" y="360.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">C-Br</tspan></text>
  <line x1="245.0" y1="354.0" x2="311.2" y2="354.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320.0 354.0 L310.0 358.6 L310.0 349.4 Z" fill="#14181f"/>
  <text x="282.5" y="344.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">slow</tspan></text>
  <text x="430.0" y="360.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">C</tspan><tspan dy="-8.0" font-size="13.3">+</tspan><tspan dy="8.0"> + Br</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <text x="150.0" y="450.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">C</tspan><tspan dy="-7.6" font-size="12.6">+-</tspan><tspan dy="7.6">CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8"> + B</tspan><tspan dy="-7.6" font-size="12.6">-</tspan></text>
  <line x1="285.0" y1="444.0" x2="346.2" y2="444.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M355.0 444.0 L345.0 448.6 L345.0 439.4 Z" fill="#14181f"/>
  <text x="320.0" y="434.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">fast</tspan></text>
  <text x="520.0" y="450.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">C=CH</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1"> + H-B</tspan></text>
  <text x="520.0" y="482.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">2-methylpropene</text>
  <text x="780.0" y="400.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">rate = k [RX]</text>
  <text x="780.0" y="422.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">first order</text>
  <text x="450.0" y="548.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">primary halogenoalkanes usually react by E2, tertiary by E1; secondary can do either, depending on the solvent</text>
  <text x="450.0" y="571" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
