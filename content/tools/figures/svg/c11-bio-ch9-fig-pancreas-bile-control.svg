<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="460" fill="#ffffff"/>
  <!-- Our own flowchart (Roman Urdu lesson only): secretin and CCK control pancreatic juice and bile; the textbook has no figure here -->
  <rect x="20.0" y="30.0" width="320.0" height="90.0" rx="14" stroke="#6d28d9" stroke-width="2.5" fill="#ede9fe"/>
  <text x="180.0" y="69.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Acidic chyme enters</text>
  <text x="180.0" y="99.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">the duodenum</text>
  <rect x="20.0" y="300.0" width="320.0" height="110.0" rx="14" stroke="#6d28d9" stroke-width="2.5" fill="#ede9fe"/>
  <text x="180.0" y="349.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Partly digested proteins</text>
  <text x="180.0" y="379.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">and fats in the chyme</text>
  <rect x="400.0" y="30.0" width="300.0" height="90.0" rx="14" stroke="#6d28d9" stroke-width="2.5" fill="#ede9fe"/>
  <text x="550.0" y="69.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Duodenal wall</text>
  <text x="550.0" y="99.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">releases secretin</text>
  <rect x="400.0" y="310.0" width="300.0" height="90.0" rx="14" stroke="#6d28d9" stroke-width="2.5" fill="#ede9fe"/>
  <text x="550.0" y="349.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Duodenal wall</text>
  <text x="550.0" y="379.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">releases CCK</text>
  <rect x="780.0" y="30.0" width="300.0" height="90.0" rx="14" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <text x="930.0" y="69.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Pancreas releases</text>
  <text x="930.0" y="99.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">pancreatic juice</text>
  <rect x="780.0" y="310.0" width="300.0" height="90.0" rx="14" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <text x="930.0" y="349.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Gallbladder</text>
  <text x="930.0" y="379.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">releases bile</text>
  <line x1="340.0" y1="75.0" x2="384.2" y2="75.0" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M395.0 75.0 L379.4 84.0 L379.4 66.0 Z" fill="#6d28d9"/>
  <line x1="340.0" y1="355.0" x2="384.2" y2="355.0" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M395.0 355.0 L379.4 364.0 L379.4 346.0 Z" fill="#6d28d9"/>
  <line x1="700.0" y1="75.0" x2="764.2" y2="75.0" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 75.0 L759.4 84.0 L759.4 66.0 Z" fill="#6d28d9"/>
  <line x1="700.0" y1="355.0" x2="764.2" y2="355.0" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 355.0 L759.4 364.0 L759.4 346.0 Z" fill="#6d28d9"/>
  <line x1="700.0" y1="100.0" x2="771.7" y2="319.7" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 330.0 L761.6 318.0 L778.7 312.4 Z" fill="#6d28d9"/>
  <line x1="700.0" y1="330.0" x2="771.7" y2="110.3" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 100.0 L778.7 117.6 L761.6 112.0 Z" fill="#6d28d9"/>
</svg>
