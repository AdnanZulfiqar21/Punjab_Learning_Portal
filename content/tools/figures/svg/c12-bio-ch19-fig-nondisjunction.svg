<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.27: XX and O eggs from non-disjunction in the mother combined with X and Y sperm give XXX (triple X), XXY (Klinefelter), XO (Turner) and OY (not viable). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Non-disjunction of X chromosomes in the mother</text>
  <text x="450.0" y="64.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">X chromosomes fail to separate in meiosis, giving eggs with XX or with no X (O)</text>
  <circle cx="415.0" cy="140.0" r="26.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="415.0" y="146.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">X</text>
  <circle cx="645.0" cy="140.0" r="26.0" stroke="#1f6fb5" stroke-width="2" fill="#99f6e4"/>
  <text x="645.0" y="146.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">Y</text>
  <text x="530.0" y="100.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">normal sperm</text>
  <circle cx="240.0" cy="265.0" r="42.0" stroke="#be185d" stroke-width="2" fill="#fbcfe8"/>
  <text x="240.0" y="271.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">XX</text>
  <rect x="308.0" y="188.0" width="214.0" height="154.0" rx="10" stroke="#94a3b8" stroke-width="1.5" fill="#f8fafc"/>
  <text x="415.0" y="250.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">44 + XXX</text>
  <text x="415.0" y="280.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">triple X female (47)</text>
  <rect x="538.0" y="188.0" width="214.0" height="154.0" rx="10" stroke="#94a3b8" stroke-width="1.5" fill="#fff1f2"/>
  <text x="645.0" y="250.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">44 + XXY</text>
  <text x="645.0" y="280.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Klinefelter male (47)</text>
  <circle cx="240.0" cy="435.0" r="42.0" stroke="#be185d" stroke-width="2" fill="#ffffff"/>
  <text x="240.0" y="441.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <rect x="308.0" y="358.0" width="214.0" height="154.0" rx="10" stroke="#94a3b8" stroke-width="1.5" fill="#fff1f2"/>
  <text x="415.0" y="420.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">44 + XO</text>
  <text x="415.0" y="450.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">Turner female (45)</text>
  <rect x="538.0" y="358.0" width="214.0" height="154.0" rx="10" stroke="#94a3b8" stroke-width="1.5" fill="#f8fafc"/>
  <text x="645.0" y="420.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">44 + OY</text>
  <text x="645.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">not viable: no X</text>
  <text x="240.0" y="160.0" font-size="13" fill="#be185d" text-anchor="middle" font-weight="700">abnormal eggs</text>
  <text x="450.0" y="548.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the same errors can happen in the father: an XY sperm with a normal egg also gives XXY</text>
  <text x="450.0" y="570.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">and a sperm with no sex chromosome with a normal egg gives XO</text>
  <text x="450.0" y="601" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
