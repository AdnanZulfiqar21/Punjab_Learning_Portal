<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="690" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.22 to 3.26: s-s, s-p and p-p overlap, H2S, and the sigma and pi bonds of O2. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .b{font-size:13px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Valence bond theory: bonds are overlapping half-filled orbitals</text>
  <!-- s-s H2 -->
  <g transform="translate(170 140)">
    <text class="k" x="0" y="-70">s-s overlap: H2</text>
    <circle cx="-60" cy="0" r="40" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><circle cx="60" cy="0" r="40" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <text class="b" x="-60" y="4">1s</text><text class="b" x="60" y="4">1s</text>
    <path d="M0 60 V80" stroke="#4b5563" stroke-width="2"/>
    <ellipse cx="0" cy="130" rx="95" ry="36" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <circle cx="-45" cy="130" r="5" fill="#14181f"/><circle cx="45" cy="130" r="5" fill="#14181f"/>
    <text class="s" x="0" y="185">sigma bond; density symmetrical about both nuclei</text>
  </g>
  <!-- s-p HCl -->
  <g transform="translate(520 140)">
    <text class="k" x="0" y="-70">s-p overlap: HCl</text>
    <circle cx="-90" cy="0" r="34" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="-90" y="4">H 1s</text>
    <ellipse cx="30" cy="0" rx="40" ry="20" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="120" cy="0" rx="40" ry="20" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="b" x="75" y="-30">Cl 3p</text>
    <path d="M0 60 V80" stroke="#4b5563" stroke-width="2"/>
    <circle cx="-70" cy="130" r="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><ellipse cx="0" cy="130" rx="50" ry="26" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="90" cy="130" rx="40" ry="20" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="b" x="-70" y="134">H</text><text class="b" x="40" y="134">Cl</text>
    <text class="s" x="0" y="185">density higher near Cl (more electronegative): polar</text>
  </g>
  <!-- p-p Cl2 -->
  <g transform="translate(900 140)">
    <text class="k" x="0" y="-70">p-p overlap: Cl2</text>
    <ellipse cx="-130" cy="0" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="-50" cy="0" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <ellipse cx="50" cy="0" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="130" cy="0" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="b" x="-90" y="-30">Cl 3p</text><text class="b" x="90" y="-30">Cl 3p</text>
    <path d="M0 60 V80" stroke="#4b5563" stroke-width="2"/>
    <ellipse cx="-120" cy="130" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="0" cy="130" rx="60" ry="26" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="120" cy="130" rx="36" ry="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="b" x="-60" y="134">Cl</text><text class="b" x="60" y="134">Cl</text>
    <text class="s" x="0" y="185">head-on along the nuclear axis; symmetrical, non-polar</text>
  </g>
  <!-- H2S -->
  <g transform="translate(250 490)">
    <text class="k" x="0" y="-135">H2S: two 3p orbitals of S meet two H 1s</text>
    <ellipse cx="0" cy="-50" rx="16" ry="34" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="0" cy="50" rx="16" ry="34" fill="#fff4e2" stroke="#d98b2b" stroke-width="2" opacity="0.4"/>
    <ellipse cx="-50" cy="0" rx="34" ry="16" fill="#fff4e2" stroke="#d98b2b" stroke-width="2" opacity="0.4"/><ellipse cx="50" cy="0" rx="34" ry="16" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="b" x="0" y="4">S</text>
    <circle cx="0" cy="-100" r="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="0" y="-96">H</text>
    <circle cx="100" cy="0" r="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="100" y="4">H</text>
    <path d="M0 -30 A30 30 0 0 1 30 0" fill="none" stroke="#d7322f" stroke-width="2"/><text class="s" x="34" y="-26" style="fill:#d7322f">92&#176;</text>
    <text class="s" x="0" y="140">3py and 3pz are at right angles, so H2S is v-shaped with a 92&#176; angle;</text>
    <text class="s" x="0" y="158">water opens to 104.5&#176;: smaller orbitals, stronger lone-pair repulsion</text>
  </g>
  <!-- O2 sigma and pi -->
  <g transform="translate(820 490)">
    <text class="k" x="0" y="-135">O=O: one sigma bond and one pi bond</text>
    <!-- px head on -->
    <ellipse cx="-130" cy="0" rx="30" ry="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="-70" cy="0" rx="30" ry="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <ellipse cx="70" cy="0" rx="30" ry="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="130" cy="0" rx="30" ry="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <!-- py parallel -->
    <ellipse cx="-100" cy="-50" rx="14" ry="30" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><ellipse cx="-100" cy="50" rx="14" ry="30" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/>
    <ellipse cx="100" cy="-50" rx="14" ry="30" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><ellipse cx="100" cy="50" rx="14" ry="30" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/>
    <path d="M-86 -50 H86" stroke="#5b3fb5" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M-86 50 H86" stroke="#5b3fb5" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="-100" cy="0" r="8" fill="#14181f"/><circle cx="100" cy="0" r="8" fill="#14181f"/>
    <text class="b" x="-100" y="-100">O</text><text class="b" x="100" y="-100">O</text>
    <text class="s" x="0" y="22" style="fill:#1f6fb5">px end to end: sigma</text>
    <text class="s" x="0" y="105" style="fill:#5b3fb5">py side by side, above and below the axis: pi</text>
    <text class="s" x="0" y="140">a sigma bond is a linear overlap on the nuclear axis; a pi bond is a sideways overlap</text>
    <text class="s" x="0" y="158">of parallel p orbitals; greater overlap, stronger bond; bonds are directional</text>
  </g>
  <text class="s" x="600" y="675">Orbitals drawn as flat boundary surfaces; shaded regions show where the half-filled orbitals overlap.</text>
</svg>
