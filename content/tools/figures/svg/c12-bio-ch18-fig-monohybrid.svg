  <text x="765.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">if Rr: 1 round : 1 wrinkled</text>
  <text x="490.0" y="360.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Each plant has two copies (alleles) of the</text>
  <text x="490.0" y="382.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">gene; a gamete gets only one, chosen at</text>
  <text x="490.0" y="404.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">random: the law of segregation.</text>
  <text x="490.0" y="426.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">R is dominant, r recessive: Rr looks round.</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
