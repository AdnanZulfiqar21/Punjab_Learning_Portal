  <text x="575.0" y="203.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Rr</text>
  <rect x="600.0" y="178.0" width="50.0" height="40.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fef9c3"/>
  <text x="625.0" y="203.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Rr</text>
  <rect x="550.0" y="218.0" width="50.0" height="40.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fef9c3"/>
  <text x="575.0" y="243.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Rr</text>
  <rect x="600.0" y="218.0" width="50.0" height="40.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fef9c3"/>
  <text x="625.0" y="243.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Rr</text>
  <text x="575.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">if RR: all round</text>
  <rect x="740.0" y="150.0" width="50.0" height="28.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f1f5f9"/>
  <text x="765.0" y="168.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">r</text>
  <rect x="790.0" y="150.0" width="50.0" height="28.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f1f5f9"/>
  <text x="815.0" y="168.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">r</text>
  <rect x="690.0" y="178.0" width="50.0" height="40.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f1f5f9"/>
  <text x="715.0" y="203.0" font-size="13" fill="#be185d" text-anchor="middle" font-weight="700">R</text>
  <rect x="690.0" y="218.0" width="50.0" height="40.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#f1f5f9"/>
