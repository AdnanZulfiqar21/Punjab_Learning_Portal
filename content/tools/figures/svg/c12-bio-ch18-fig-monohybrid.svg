<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.1: Mendel's cross of round (RR) and wrinkled (rr) peas, the F2 Punnett square giving 3 round to 1 wrinkled, and a testcross. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Mendel's monohybrid cross: round and wrinkled seeds</text>
  <text x="60.0" y="100.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">P</text>
  <circle cx="160.0" cy="95.0" r="13.0" stroke="#78716c" stroke-width="1.5" fill="#facc15"/>
  <text x="160.0" y="128.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">round RR</text>
  <text x="230.0" y="101.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">x</text>
  <path d="M287 95 Q290 82 297 84 Q300 88 303 83 Q313 85 312 95 Q309 98 311 101 Q307 108 300 106 Q289 108 289 100 Q292 97 287 95 Z" stroke="#78716c" stroke-width="1.5" fill="#facc15" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300.0" y="128.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">wrinkled rr</text>
