  <rect x="200.0" y="392.0" width="90.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fef9c3"/>
  <text x="245.0" y="427.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Rr</text>
