  <text x="245.0" y="510.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">genotypes 1 RR : 2 Rr : 1 rr</text>
  <rect x="470.0" y="70.0" width="415.0" height="470.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
