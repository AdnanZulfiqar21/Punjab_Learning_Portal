  <text x="230.0" y="238.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">all round Rr</text>
  <text x="60.0" y="300.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">F2</text>
  <text x="250.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">F1 x F1 (self-pollinated)</text>
