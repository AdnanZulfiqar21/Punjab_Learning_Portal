<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.13: alcoholic fermentation and lactic acid fermentation. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:19px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="50">Alcoholic fermentation</text>
  <text class="s" x="300" y="80">bacteria and yeast</text>
  <rect x="200" y="120" width="200" height="56" rx="12" fill="#d98b2b"/><text class="b" x="300" y="155">Glucose (6C)</text>
  <path d="M300 180 V230" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="380" y="212" style="text-anchor:start">glycolysis: 2 ATP, 2 NADH</text>
  <rect x="180" y="240" width="240" height="56" rx="12" fill="#5b3fb5"/><text class="b" x="300" y="275">2 Pyruvic acid (3C)</text>
  <path d="M300 300 V350" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="380" y="332" style="text-anchor:start">2 NADH give up H; 2 CO2 released</text>
  <rect x="180" y="360" width="240" height="56" rx="12" fill="#0f7a62"/><text class="b" x="300" y="395">2 Ethanol (2C) + 2 CO2</text>
  <text class="k" x="300" y="470">2 C3H4O3 gives 2 C2H5OH + 2 CO2</text>
  <text class="h" x="900" y="50">Lactic acid fermentation</text>
  <text class="s" x="900" y="80">muscle cells in hard exercise; many bacteria</text>
  <rect x="800" y="120" width="200" height="56" rx="12" fill="#d98b2b"/><text class="b" x="900" y="155">Glucose (6C)</text>
  <path d="M900 180 V230" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="980" y="212" style="text-anchor:start">glycolysis: 2 ATP, 2 NADH</text>
  <rect x="780" y="240" width="240" height="56" rx="12" fill="#5b3fb5"/><text class="b" x="900" y="275">2 Pyruvic acid (3C)</text>
  <path d="M900 300 V350" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="980" y="332" style="text-anchor:start">2 NADH give up H; no CO2</text>
  <rect x="780" y="360" width="240" height="56" rx="12" fill="#0f7a62"/><text class="b" x="900" y="395">2 Lactic acid (3C)</text>
  <text class="k" x="900" y="470">2 C3H4O3 gives 2 C3H6O3</text>
  <text class="s" x="600" y="540">Anaerobic respiration: glucose is not completely oxidised; only 2 ATP per glucose (about 2 percent of its energy, 14.6 kcal).</text>
  <text class="s" x="600" y="568">Reducing pyruvic acid regenerates the NAD+ that glycolysis needs, so glycolysis can continue without oxygen.</text>
</svg>
