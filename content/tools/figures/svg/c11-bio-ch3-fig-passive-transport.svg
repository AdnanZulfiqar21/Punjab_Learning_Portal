<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.34 to 3.36: simple diffusion, facilitated diffusion and osmosis. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="pu"><circle cx="0" cy="0" r="9" fill="#1f6fb5"/><path d="M-3 9 v34 M3 9 v34" stroke="#f2b134" stroke-width="3"/></g>
    <g id="pd"><circle cx="0" cy="0" r="9" fill="#1f6fb5"/><path d="M-3 -9 v-34 M3 -9 v-34" stroke="#f2b134" stroke-width="3"/></g>
  </defs>
  <text class="h" x="200" y="50">Simple diffusion</text>
  <text class="s" x="200" y="78">small, non-polar: O2, CO2</text>
  <text class="h" x="600" y="50">Facilitated diffusion</text>
  <text class="s" x="600" y="78">polar or charged: glucose, ions</text>
  <text class="h" x="1000" y="50">Osmosis</text>
  <text class="s" x="1000" y="78">water only; selectively permeable membrane</text>
  <text class="s" x="80" y="140">high</text><text class="s" x="80" y="620">low</text>
  <!-- bilayer bands at y 320 (upper heads) and 440 (lower heads) for all three panels -->
  <g>
    <use href="#pu" x="60" y="330"/><use href="#pu" x="82" y="330"/><use href="#pu" x="104" y="330"/><use href="#pu" x="126" y="330"/><use href="#pu" x="148" y="330"/><use href="#pu" x="170" y="330"/><use href="#pu" x="192" y="330"/><use href="#pu" x="214" y="330"/><use href="#pu" x="236" y="330"/><use href="#pu" x="258" y="330"/><use href="#pu" x="280" y="330"/><use href="#pu" x="302" y="330"/><use href="#pu" x="324" y="330"/>
    <use href="#pd" x="60" y="430"/><use href="#pd" x="82" y="430"/><use href="#pd" x="104" y="430"/><use href="#pd" x="126" y="430"/><use href="#pd" x="148" y="430"/><use href="#pd" x="170" y="430"/><use href="#pd" x="192" y="430"/><use href="#pd" x="214" y="430"/><use href="#pd" x="236" y="430"/><use href="#pd" x="258" y="430"/><use href="#pd" x="280" y="430"/><use href="#pd" x="302" y="430"/><use href="#pd" x="324" y="430"/>
  </g>
  <g>
    <use href="#pu" x="440" y="330"/><use href="#pu" x="462" y="330"/><use href="#pu" x="484" y="330"/><use href="#pu" x="506" y="330"/><use href="#pu" x="600" y="330"/><use href="#pu" x="700" y="330"/><use href="#pu" x="722" y="330"/><use href="#pu" x="744" y="330"/><use href="#pu" x="766" y="330"/>
    <use href="#pd" x="440" y="430"/><use href="#pd" x="462" y="430"/><use href="#pd" x="484" y="430"/><use href="#pd" x="506" y="430"/><use href="#pd" x="600" y="430"/><use href="#pd" x="700" y="430"/><use href="#pd" x="722" y="430"/><use href="#pd" x="744" y="430"/><use href="#pd" x="766" y="430"/>
  </g>
  <g>
    <use href="#pu" x="860" y="330"/><use href="#pu" x="882" y="330"/><use href="#pu" x="904" y="330"/><use href="#pu" x="926" y="330"/><use href="#pu" x="948" y="330"/><use href="#pu" x="1030" y="330"/><use href="#pu" x="1052" y="330"/><use href="#pu" x="1074" y="330"/><use href="#pu" x="1096" y="330"/><use href="#pu" x="1118" y="330"/><use href="#pu" x="1140" y="330"/>
    <use href="#pd" x="860" y="430"/><use href="#pd" x="882" y="430"/><use href="#pd" x="904" y="430"/><use href="#pd" x="926" y="430"/><use href="#pd" x="948" y="430"/><use href="#pd" x="1030" y="430"/><use href="#pd" x="1052" y="430"/><use href="#pd" x="1074" y="430"/><use href="#pd" x="1096" y="430"/><use href="#pd" x="1118" y="430"/><use href="#pd" x="1140" y="430"/>
  </g>
  <!-- panel 1: many molecules above, few below, arrows straight through -->
  <g fill="#0f7a62"><circle cx="120" cy="160" r="8"/><circle cx="170" cy="200" r="8"/><circle cx="230" cy="150" r="8"/><circle cx="280" cy="210" r="8"/><circle cx="150" cy="260" r="8"/><circle cx="250" cy="270" r="8"/><circle cx="200" cy="120" r="8"/><circle cx="300" cy="160" r="8"/><circle cx="180" cy="560" r="8"/><circle cx="270" cy="600" r="8"/></g>
  <path d="M200 240 L200 520" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="200" y="690">straight through the bilayer;</text><text class="s" x="200" y="714">no protein, no energy</text>
  <!-- panel 2: channel protein and carrier protein -->
  <path d="M530 310 h30 v150 h-30 z M575 310 h30 v150 h-30 z" fill="#0f7a62" stroke="#0a5a48" stroke-width="3"/>
  <path d="M567 220 L567 520" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g fill="#d98b2b"><circle cx="567" cy="190" r="8"/><circle cx="540" cy="150" r="8"/><circle cx="600" cy="160" r="8"/><circle cx="520" cy="230" r="8"/><circle cx="610" cy="240" r="8"/></g>
  <text class="s" x="505" y="590">channel</text><text class="s" x="505" y="614">(gated or open)</text>
  <path d="M625 310 q35 -15 70 0 v150 q-35 15 -70 0 z" fill="#2f9a7e" stroke="#0a5a48" stroke-width="3"/>
  <rect x="648" y="360" width="24" height="24" rx="6" fill="#5b3fb5"/>
  <path d="M660 240 L660 300" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M660 470 L660 520" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <g fill="#5b3fb5"><rect x="640" y="160" width="20" height="20" rx="5"/><rect x="680" y="200" width="20" height="20" rx="5"/><rect x="700" y="140" width="20" height="20" rx="5"/></g>
  <text class="s" x="705" y="590">carrier</text><text class="s" x="705" y="614">(binds, changes shape)</text>
  <text class="s" x="600" y="690">down the gradient through a</text><text class="s" x="600" y="714">transport protein; no energy</text>
  <!-- panel 3: osmosis: water molecules through aquaporin; solute large on the right side -->
  <path d="M970 310 h24 v150 h-24 z M1004 310 h24 v150 h-24 z" fill="#0f7a62" stroke="#0a5a48" stroke-width="3"/>
  <text class="s" x="1090" y="500" style="text-anchor:start">aquaporin</text>
  <g fill="#1f6fb5"><circle cx="900" cy="160" r="7"/><circle cx="940" cy="200" r="7"/><circle cx="980" cy="150" r="7"/><circle cx="1020" cy="210" r="7"/><circle cx="1060" cy="160" r="7"/><circle cx="1100" cy="200" r="7"/><circle cx="920" cy="260" r="7"/><circle cx="1080" cy="250" r="7"/><circle cx="1000" cy="250" r="7"/><circle cx="1130" cy="140" r="7"/></g>
  <g fill="#1f6fb5"><circle cx="900" cy="560" r="7"/><circle cx="1100" cy="600" r="7"/><circle cx="980" cy="620" r="7"/></g>
  <g fill="#d98b2b" stroke="#8a4b00" stroke-width="2"><circle cx="930" cy="600" r="14"/><circle cx="1060" cy="560" r="14"/><circle cx="1130" cy="640" r="14"/><circle cx="1000" cy="660" r="14"/></g>
  <path d="M999 230 L999 520" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="1000" y="690">water moves from hypotonic (less solute)</text><text class="s" x="1000" y="714">to hypertonic (more solute); no energy</text>
  <text class="s" x="860" y="120" style="text-anchor:start">hypotonic</text>
  <text class="s" x="860" y="650" style="text-anchor:start">hypertonic</text>
  <text class="s" x="600" y="750">Passive transport: along the concentration gradient, from high to low, with no ATP spent.</text>
</svg>
