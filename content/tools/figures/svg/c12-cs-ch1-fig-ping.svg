<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- Original: host A pings host B with ICMP echo request and reply, and a sample output line. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The ping command (after Fig 1.16)</text>
  <rect x="93.0" y="123.0" width="54.0" height="38.0" rx="4" stroke="#14181f" stroke-width="2" fill="#dbe9f5"/>
  <rect x="98.0" y="128.0" width="44.0" height="28.0" rx="2" stroke="#1f6fb5" stroke-width="1.2" fill="#ffffff"/>
  <line x1="120.0" y1="161.0" x2="120.0" y2="171.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="106.0" y1="172.0" x2="134.0" y2="172.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="120.0" y="191.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">host A</text>
  <rect x="753.0" y="123.0" width="54.0" height="38.0" rx="4" stroke="#14181f" stroke-width="2" fill="#dbe9f5"/>
  <rect x="758.0" y="128.0" width="44.0" height="28.0" rx="2" stroke="#1f6fb5" stroke-width="1.2" fill="#ffffff"/>
  <line x1="780.0" y1="161.0" x2="780.0" y2="171.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="766.0" y1="172.0" x2="794.0" y2="172.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="780.0" y="191.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">host B (192.168.0.1)</text>
  <line x1="160.0" y1="125.0" x2="730.4" y2="125.0" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M740.0 125.0 L729.1 130.1 L729.1 119.9 Z" fill="#1f6fb5"/>
  <text x="450.0" y="112.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">ICMP echo request: 'are you there?'</text>
  <line x1="740.0" y1="175.0" x2="169.6" y2="175.0" stroke="#0f7a62" stroke-width="3" stroke-linecap="round"/>
  <path d="M160.0 175.0 L170.9 169.9 L170.9 180.1 Z" fill="#0f7a62"/>
  <text x="450.0" y="200.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">ICMP echo reply: 'yes'</text>
  <rect x="110.0" y="235.0" width="680.0" height="90.0" rx="8" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="130.0" y="262.0" font-size="14" fill="#a7f3d0" text-anchor="start" font-weight="700">&gt; ping 192.168.0.1</text>
  <text x="130.0" y="287.0" font-size="13" fill="#e5e7eb" text-anchor="start" font-weight="400">Reply from 192.168.0.1: bytes=32 time=25ms TTL=118</text>
  <text x="130.0" y="310.0" font-size="13" fill="#fde68a" text-anchor="start" font-weight="400">time = round trip in milliseconds; no reply = not reachable</text>
  <text x="450.0" y="351" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
