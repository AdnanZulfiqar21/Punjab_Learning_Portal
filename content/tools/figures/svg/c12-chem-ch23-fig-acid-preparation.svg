<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original summary of topic 23.4.1: carboxylic acids from oxidation of primary alcohols and aldehydes, hydrolysis of nitriles and esters, and oxidation of methylbenzene to benzoic acid. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making carboxylic acids</text>
  <rect x="340.0" y="252.0" width="220.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="287.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-COOH</tspan></text>
  <rect x="5.0" y="52.0" width="320.0" height="96.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="165.0" y="80.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">oxidation</text>
  <text x="165.0" y="106.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">OH + 2[O] -&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">COOH + H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O</tspan></text>
  <text x="165.0" y="130.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">K</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">Cr</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O</tspan><tspan dy="3.8" font-size="8.4">7</tspan><tspan dy="-3.8"> / dil. H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">SO</tspan><tspan dy="3.8" font-size="8.4">4</tspan><tspan dy="-3.8">, reflux (also aldehydes)</tspan></text>
  <line x1="264.8" y1="175.6" x2="357.4" y2="222.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M364.5 226.0 L354.5 225.7 L358.3 218.1 Z" fill="#4b5563"/>
  <rect x="575.0" y="52.0" width="320.0" height="96.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="735.0" y="80.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">nitrile hydrolysis</text>
  <text x="735.0" y="106.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">CN + 2H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O + HCl -&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">COOH + NH</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2">Cl</tspan></text>
  <text x="735.0" y="130.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">or NaOH, then acidify</tspan></text>
  <line x1="635.2" y1="175.6" x2="542.6" y2="222.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M535.5 226.0 L541.7 218.1 L545.5 225.7 Z" fill="#4b5563"/>
  <rect x="5.0" y="412.0" width="320.0" height="96.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="165.0" y="440.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">ester hydrolysis</text>
  <text x="165.0" y="466.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">COOC</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">H</tspan><tspan dy="4.2" font-size="9.1">5</tspan><tspan dy="-4.2"> + H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O &lt;=&gt; CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">COOH + C</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">H</tspan><tspan dy="4.2" font-size="9.1">5</tspan><tspan dy="-4.2">OH</tspan></text>
  <text x="165.0" y="490.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">dilute acid; or alkali, then acidify</tspan></text>
  <line x1="264.8" y1="384.4" x2="357.4" y2="337.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M364.5 334.0 L358.3 341.9 L354.5 334.3 Z" fill="#4b5563"/>
  <rect x="575.0" y="412.0" width="320.0" height="96.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="735.0" y="440.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">side-chain oxidation</text>
  <text x="735.0" y="466.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.2" font-size="9.1">6</tspan><tspan dy="-4.2">H</tspan><tspan dy="4.2" font-size="9.1">5</tspan><tspan dy="-4.2">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2"> + 3[O] -&gt; C</tspan><tspan dy="4.2" font-size="9.1">6</tspan><tspan dy="-4.2">H</tspan><tspan dy="4.2" font-size="9.1">5</tspan><tspan dy="-4.2">COOH + H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">O</tspan></text>
  <text x="735.0" y="490.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">KMnO</tspan><tspan dy="3.8" font-size="8.4">4</tspan><tspan dy="-3.8">, heat: benzoic acid</tspan></text>
  <line x1="635.2" y1="384.4" x2="542.6" y2="337.6" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M535.5 334.0 L545.5 334.3 L541.7 341.9 Z" fill="#4b5563"/>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
