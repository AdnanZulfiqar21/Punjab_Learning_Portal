<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 866" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="866" fill="#ffffff"/>
  <!-- Figure 21.1 Lines of defence against infection: original drawing after the printed figure -->
  <ellipse cx="500.0" cy="56.0" rx="110.0" ry="44.0" stroke="#b65a12" stroke-width="2" fill="#ef8a2c"/>
  <text x="500.0" y="50.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400">Invasive</text>
  <text x="500.0" y="82.9" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400">microbe</text>
  <line x1="500.0" y1="100.0" x2="500.0" y2="133.2" stroke="#14181f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M500.0 146.0 L493.2 131.5 L506.8 131.5 Z" fill="#14181f"/>
  <rect x="40.0" y="150.0" width="920.0" height="92.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="500.0" y="188.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">FIRST LINE OF DEFENCE</text>
  <text x="500.0" y="224.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400">Non-specific</text>
  <rect x="40.0" y="242.0" width="153.3" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="116.7" y="278.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Skin</text>
  <rect x="193.3" y="242.0" width="364.2" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="375.4" y="278.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Digestive tract</text>
  <rect x="557.5" y="242.0" width="402.5" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="758.8" y="278.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Respiratory tract</text>
  <text x="500.0" y="324.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">If first line of defence is penetrated,</text>
  <text x="500.0" y="355.7" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">the body responds with</text>
  <line x1="500.0" y1="374.0" x2="500.0" y2="409.2" stroke="#14181f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M500.0 422.0 L493.2 407.5 L506.8 407.5 Z" fill="#14181f"/>
  <rect x="10.0" y="426.0" width="980.0" height="92.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="500.0" y="464.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">SECOND LINE OF DEFENCE</text>
  <text x="500.0" y="500.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400">Non-specific</text>
  <rect x="10.0" y="518.0" width="322.4" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="171.2" y="554.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Killer cells of blood</text>
  <rect x="332.4" y="518.0" width="335.3" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="500.0" y="554.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Antimicrobial proteins</text>
  <rect x="667.6" y="518.0" width="206.3" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="770.8" y="554.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Inflammation</text>
  <rect x="873.9" y="518.0" width="116.1" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="932.0" y="554.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Fever</text>
  <text x="500.0" y="600.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">If second line of defence is penetrated,</text>
  <text x="500.0" y="631.7" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">the body responds with</text>
  <line x1="500.0" y1="650.0" x2="500.0" y2="685.2" stroke="#14181f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M500.0 698.0 L493.2 683.5 L506.8 683.5 Z" fill="#14181f"/>
  <rect x="40.0" y="702.0" width="920.0" height="92.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="500.0" y="740.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700">THIRD LINE OF DEFENCE</text>
  <text x="500.0" y="776.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400">Specific</text>
  <rect x="40.0" y="794.0" width="427.1" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="253.6" y="830.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Cell-mediated immunity</text>
  <rect x="467.1" y="794.0" width="492.9" height="52.0" rx="0" stroke="#c0703a" stroke-width="2" fill="#f7cba4"/>
  <text x="713.6" y="830.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Antibody-mediated immunity</text>
</svg>
