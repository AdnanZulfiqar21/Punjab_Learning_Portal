<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.9 to 5.11: competitive inhibition, non-competitive inhibition and feedback inhibition. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .l{font-size:17px;fill:#14181f;text-anchor:middle;font-weight:700}
      .b{font-size:20px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="blk" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><circle cx="6" cy="6" r="5" fill="none" stroke="#d7322f" stroke-width="2"/><path d="M2.5 2.5 L9.5 9.5" stroke="#d7322f" stroke-width="2"/></marker>
    <g id="enz"><path d="M-100 80 V-60 q0 -40 40 -40 h120 q40 0 40 40 V80 z M-35 -100 h70 v55 h-70 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round" fill-rule="evenodd"/></g>
    <g id="sub"><rect x="-33" y="-26" width="66" height="52" rx="4" fill="#f2b134" stroke="#8a4b00" stroke-width="4"/></g>
    <g id="inh"><rect x="-33" y="-26" width="66" height="52" rx="4" fill="#d7322f" stroke="#7a1512" stroke-width="4"/></g>
  </defs>
  <text class="h" x="300" y="40">Competitive inhibition</text>
  <text class="s" x="300" y="68">the inhibitor resembles the substrate and</text><text class="s" x="300" y="90">competes for the same binding site</text>
  <g transform="translate(300,260)"><use href="#enz"/><use href="#inh" x="0" y="-72"/></g>
  <g transform="translate(140,120)"><use href="#sub"/><text class="l" x="0" y="48">substrate</text></g>
  <path d="M180 140 L250 180" stroke="#4b5563" stroke-width="3" marker-end="url(#blk)"/>
  <text class="s" x="300" y="380">active site blocked; the substrate cannot attach</text>
  <text class="s" x="300" y="420">e.g. malonic acid blocks succinic dehydrogenase;</text><text class="s" x="300" y="442">reversible: more substrate wins the site back</text>
  <!-- non-competitive -->
  <text class="h" x="900" y="40">Non-competitive inhibition</text>
  <text class="s" x="900" y="68">the inhibitor binds elsewhere and changes the</text><text class="s" x="900" y="90">enzyme's shape, so the active site no longer fits</text>
  <g transform="translate(900,260)"><path d="M-100 80 V-60 q0 -40 40 -40 h120 q40 0 40 40 V80 z M-35 -100 q35 50 70 0 v55 h-70 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round" fill-rule="evenodd"/><use href="#inh" x="95" y="30"/></g>
  <g transform="translate(760,120)"><use href="#sub"/><text class="l" x="0" y="48">substrate</text></g>
  <path d="M800 140 L860 175" stroke="#4b5563" stroke-width="3" marker-end="url(#blk)"/>
  <text class="s" x="900" y="380">site distorted; the substrate no longer fits</text>
  <text class="s" x="900" y="420">e.g. succinyl-CoA inhibits succinyl-CoA synthetase;</text><text class="s" x="900" y="442">ATP inhibits the enzyme of its own synthesis</text>
  <!-- feedback inhibition pathway -->
  <text class="h" x="600" y="530">Feedback inhibition</text>
  <rect x="80" y="580" width="150" height="60" rx="12" fill="#f2b134"/><text class="b" x="155" y="618" style="fill:#14181f">substrate</text>
  <path d="M235 610 H315" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="275" y="595">enzyme 1</text>
  <rect x="320" y="580" width="150" height="60" rx="12" fill="#b2dbcc"/><text class="b" x="395" y="618" style="fill:#14181f">product A</text>
  <path d="M475 610 H555" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="515" y="595">enzyme 2</text>
  <rect x="560" y="580" width="150" height="60" rx="12" fill="#b2dbcc"/><text class="b" x="635" y="618" style="fill:#14181f">product B</text>
  <path d="M715 610 H795" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="755" y="595">enzyme 3</text>
  <rect x="800" y="580" width="190" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="895" y="618">final product</text>
  <path d="M895 645 V720 H275 V650" stroke="#d7322f" stroke-width="4" fill="none" marker-end="url(#blk)"/>
  <text class="s" x="585" y="750" style="fill:#d7322f">the final product inhibits enzyme 1, so the pathway shuts down when enough has been made</text>
  <text class="s" x="600" y="820">Irreversible inhibitors bond covalently (penicillin, cyanide); reversible ones bond weakly and can be displaced (malonate).</text>
</svg>
