<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.13: XX-XY (humans, Drosophila), XX-XO (grasshopper) and ZW-ZZ (birds) sex determination, each with the parents' sex chromosomes, their gametes and a 1:1 ratio of female and male offspring. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Three systems of sex determination</text>
  <rect x="15.0" y="55.0" width="280.0" height="520.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">XX - XY</text>
  <text x="155.0" y="108.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">humans, Drosophila</text>
  <circle cx="95.0" cy="160.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <text x="95.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">XX</text>
  <text x="95.0" y="212.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <circle cx="215.0" cy="160.0" r="34.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="215.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">XY</text>
  <text x="215.0" y="212.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <text x="155.0" y="260.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">sperm</text>
  <text x="65.0" y="260.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">eggs</text>
  <rect x="85.0" y="270.0" width="70.0" height="30.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#dbeafe"/>
  <text x="120.0" y="291.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">X</text>
  <rect x="155.0" y="270.0" width="70.0" height="30.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#dbeafe"/>
  <text x="190.0" y="291.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">Y</text>
  <rect x="45.0" y="300.0" width="40.0" height="60.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#fce7f3"/>
  <text x="65.0" y="336.0" font-size="14" fill="#be185d" text-anchor="middle" font-weight="700">X</text>
  <rect x="85.0" y="300.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fdf2f8"/>
  <text x="120.0" y="326.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">XX</text>
  <text x="120.0" y="346.0" font-size="11" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <rect x="155.0" y="300.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#eff6ff"/>
  <text x="190.0" y="326.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">XY</text>
  <text x="190.0" y="346.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <text x="155.0" y="470.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 female : 1 male</text>
  <text x="155.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">male decides</text>
  <text x="155.0" y="523.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the sex</text>
  <rect x="307.0" y="55.0" width="280.0" height="520.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="447.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">XX - XO</text>
  <text x="447.0" y="108.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">grasshopper (22 autosomes)</text>
  <circle cx="387.0" cy="160.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <text x="387.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">XX (24)</text>
  <text x="387.0" y="212.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <circle cx="507.0" cy="160.0" r="34.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="507.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">XO (23)</text>
  <text x="507.0" y="212.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <text x="447.0" y="260.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">sperm</text>
  <text x="357.0" y="260.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">eggs</text>
  <rect x="377.0" y="270.0" width="70.0" height="30.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#dbeafe"/>
  <text x="412.0" y="291.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">X</text>
  <rect x="447.0" y="270.0" width="70.0" height="30.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#dbeafe"/>
  <text x="482.0" y="291.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">O</text>
  <rect x="337.0" y="300.0" width="40.0" height="60.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#fce7f3"/>
  <text x="357.0" y="336.0" font-size="14" fill="#be185d" text-anchor="middle" font-weight="700">X</text>
  <rect x="377.0" y="300.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fdf2f8"/>
  <text x="412.0" y="326.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">XX</text>
  <text x="412.0" y="346.0" font-size="11" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <rect x="447.0" y="300.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#eff6ff"/>
  <text x="482.0" y="326.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">XO</text>
  <text x="482.0" y="346.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <text x="447.0" y="470.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 female : 1 male</text>
  <text x="447.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">O = sperm with no</text>
  <text x="447.0" y="523.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">sex chromosome (nullo)</text>
  <rect x="599.0" y="55.0" width="280.0" height="520.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="739.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ZW - ZZ</text>
  <text x="739.0" y="108.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">birds</text>
  <circle cx="679.0" cy="160.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <text x="679.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ZW</text>
  <text x="679.0" y="212.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <circle cx="799.0" cy="160.0" r="34.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="799.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ZZ</text>
  <text x="799.0" y="212.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <text x="739.0" y="260.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">sperm</text>
  <text x="684.0" y="260.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">eggs</text>
  <rect x="704.0" y="270.0" width="70.0" height="30.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#dbeafe"/>
  <text x="739.0" y="291.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">Z</text>
  <rect x="664.0" y="300.0" width="40.0" height="60.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#fce7f3"/>
  <text x="684.0" y="336.0" font-size="14" fill="#be185d" text-anchor="middle" font-weight="700">Z</text>
  <rect x="704.0" y="300.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#eff6ff"/>
  <text x="739.0" y="326.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">ZZ</text>
  <text x="739.0" y="346.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">male</text>
  <rect x="664.0" y="360.0" width="40.0" height="60.0" rx="0" stroke="#cbd5e1" stroke-width="1" fill="#fce7f3"/>
  <text x="684.0" y="396.0" font-size="14" fill="#be185d" text-anchor="middle" font-weight="700">W</text>
  <rect x="704.0" y="360.0" width="70.0" height="60.0" rx="0" stroke="#94a3b8" stroke-width="1" fill="#fdf2f8"/>
  <text x="739.0" y="386.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">ZW</text>
  <text x="739.0" y="406.0" font-size="11" fill="#be185d" text-anchor="middle" font-weight="700">female</text>
  <text x="739.0" y="470.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1 female : 1 male</text>
  <text x="739.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">female decides</text>
  <text x="739.0" y="523.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the sex</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
