<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="515" fill="#ffffff"/>
  <!-- Original diagram for topic 32.4: stages of viral replication (entry, copying genetic material, making and cutting viral proteins, release) with the stages blocked by antiviral drugs, interferons, and the reasons viral infections are hard to treat. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Where antiviral drugs act</text>
  <rect x="30.0" y="80.0" width="195.0" height="80.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="127.5" y="115.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the virus</text>
  <text x="127.5" y="134.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">enters the cell</text>
  <line x1="227.0" y1="120.0" x2="236.6" y2="120.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M243.0 120.0 L235.7 123.4 L235.7 116.6 Z" fill="#14181f"/>
  <line x1="127.0" y1="162.0" x2="127.0" y2="205.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="127.0" y="192.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">X</text>
  <rect x="30.0" y="210.0" width="195.0" height="64.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="127.5" y="237.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">some antivirals stop</text>
  <text x="127.5" y="255.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the virus entering</text>
  <rect x="245.0" y="80.0" width="195.0" height="80.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="342.5" y="115.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">its genetic material</text>
  <text x="342.5" y="134.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">is copied</text>
  <line x1="442.0" y1="120.0" x2="451.6" y2="120.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M458.0 120.0 L450.7 123.4 L450.7 116.6 Z" fill="#14181f"/>
  <line x1="342.0" y1="162.0" x2="342.0" y2="205.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="342.0" y="192.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">X</text>
  <rect x="245.0" y="210.0" width="195.0" height="64.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="342.5" y="237.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">others stop copies</text>
  <text x="342.5" y="255.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">of genetic material</text>
  <rect x="460.0" y="80.0" width="195.0" height="80.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="557.5" y="115.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">viral proteins made as one</text>
  <text x="557.5" y="134.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">long strand, cut to size</text>
  <line x1="657.0" y1="120.0" x2="666.6" y2="120.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M673.0 120.0 L665.7 123.4 L665.7 116.6 Z" fill="#14181f"/>
  <line x1="557.0" y1="162.0" x2="557.0" y2="205.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="557.0" y="192.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">X</text>
  <rect x="460.0" y="210.0" width="195.0" height="64.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="557.5" y="237.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">protease inhibitors stop</text>
  <text x="557.5" y="255.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the strand being cut</text>
  <rect x="675.0" y="80.0" width="195.0" height="80.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="772.5" y="115.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">new viruses</text>
  <text x="772.5" y="134.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">leave the cell</text>
  <text x="450.0" y="312.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Interferons are proteins that boost the immune system against viruses.</text>
  <rect x="15.0" y="330.0" width="870.0" height="155.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="360.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">why viral infections are hard to treat</text>
  <text x="40.0" y="395.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">viruses live inside our cells and use our own DNA/RNA machinery, so drugs can harm healthy cells too;</text>
  <text x="40.0" y="419.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">viruses mutate quickly, so a drug or vaccine may stop working (flu vaccines are updated every year);</text>
  <text x="40.0" y="443.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">some viruses stay inactive inside cells for years, and drugs act only on active viruses</text>
  <text x="450.0" y="506" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
