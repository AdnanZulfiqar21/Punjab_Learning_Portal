<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 7.3: the steps of X-ray crystallography. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">X-ray crystallography (W. H. and W. L. Bragg, 1912)</text>
  <!-- step 1: crystal -->
  <text class="k" x="150" y="110">1 Protein crystal</text>
  <g fill="#c9b6ea" stroke="#5b3fb5" stroke-width="3">
    <rect x="90" y="150" width="30" height="30"/><rect x="125" y="150" width="30" height="30"/><rect x="160" y="150" width="30" height="30"/>
    <rect x="90" y="185" width="30" height="30"/><rect x="125" y="185" width="30" height="30"/><rect x="160" y="185" width="30" height="30"/>
    <rect x="90" y="220" width="30" height="30"/><rect x="125" y="220" width="30" height="30"/><rect x="160" y="220" width="30" height="30"/>
  </g>
  <text class="s" x="150" y="290">purified protein packed in a</text><text class="s" x="150" y="312">regular repeating pattern</text>
  <text class="s" x="150" y="340">hours to weeks; temperature,</text><text class="s" x="150" y="362">pH and salt controlled</text>
  <!-- X-ray source -->
  <rect x="300" y="170" width="90" height="60" rx="10" fill="#5b3fb5"/><text class="k" x="345" y="207" style="fill:#fff">X-rays</text>
  <path d="M300 200 L195 200" stroke="#8f78d9" stroke-width="8" marker-end="url(#ar)"/>
  <!-- diffracted beams to detector -->
  <g stroke="#8f78d9" stroke-width="3">
    <path d="M140 200 L420 110"/><path d="M140 200 L420 150"/><path d="M140 200 L420 250"/><path d="M140 200 L420 290"/>
  </g>
  <text class="k" x="520" y="110">2 Diffraction pattern</text>
  <rect x="440" y="130" width="160" height="200" rx="6" fill="#14181f"/>
  <g fill="#ffffff">
    <circle cx="520" cy="230" r="7"/><circle cx="480" cy="190" r="4"/><circle cx="560" cy="190" r="4"/><circle cx="480" cy="270" r="4"/><circle cx="560" cy="270" r="4"/><circle cx="520" cy="160" r="3"/><circle cx="520" cy="300" r="3"/><circle cx="460" cy="230" r="3"/><circle cx="580" cy="230" r="3"/><circle cx="500" cy="210" r="2"/><circle cx="540" cy="250" r="2"/><circle cx="500" cy="250" r="2"/><circle cx="540" cy="210" r="2"/>
  </g>
  <text class="s" x="520" y="360">the atoms diffract the beam;</text><text class="s" x="520" y="382">spots recorded at many angles</text>
  <path d="M610 230 H660" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- density map -->
  <text class="k" x="760" y="110">3 Density map</text>
  <g fill="none" stroke="#0f7a62" stroke-width="3">
    <path d="M700 230 q30 -60 70 -40 q40 20 50 60 q-20 50 -70 40 q-50 -10 -50 -60 z"/>
    <path d="M715 230 q25 -45 55 -30 q30 15 38 45 q-15 38 -53 30 q-38 -8 -40 -45 z"/>
    <path d="M730 230 q18 -30 40 -20 q20 10 25 30 q-10 25 -35 20 q-28 -6 -30 -30 z"/>
  </g>
  <text class="s" x="760" y="360">angles and intensities of the spots</text><text class="s" x="760" y="382">give the electron density</text>
  <path d="M840 230 H890" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- 3D structure -->
  <text class="k" x="1030" y="110">4 3D structure</text>
  <path d="M940 260 q20 -80 70 -70 q50 10 60 50 q10 50 -30 70 q-50 20 -80 -10 q-30 -20 -20 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="5"/>
  <path d="M960 230 q20 -20 40 0 t40 0 t20 20" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <text class="s" x="1030" y="360">computer programs turn the</text><text class="s" x="1030" y="382">density into the atomic model</text>
  <text class="s" x="600" y="460">Used since 1912 for minerals, salts, metals, proteins, carbohydrates, nucleic acids and vitamins; the Braggs won the 1915 Nobel Prize in Physics.</text>
  <text class="s" x="600" y="520">Crystals are needed because their regular pattern gives a clear diffraction image.</text>
</svg>
