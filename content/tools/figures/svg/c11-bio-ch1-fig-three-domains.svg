<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.1: the tree of the three domains. -->
  <g stroke="#0f7a62" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk from common ancestor -->
    <path d="M500 720 L500 560"/>
    <!-- first split: Bacteria left, Archaea+Eukarya right -->
    <path d="M500 560 C500 480 380 470 300 400 L220 230"/>
    <path d="M500 560 C500 480 620 470 700 400"/>
    <!-- second split: Archaea and Eukarya -->
    <path d="M700 400 C700 330 640 300 560 230"/>
    <path d="M700 400 C700 330 760 300 840 230"/>
  </g>
  <!-- branch end markers -->
  <g fill="#0f7a62">
    <circle cx="220" cy="230" r="16"/><circle cx="560" cy="230" r="16"/><circle cx="840" cy="230" r="16"/>
  </g>
  <circle cx="500" cy="720" r="22" fill="#b26a00"/>
  <!-- labels -->
  <g font-size="40" font-weight="700" fill="#14181f" text-anchor="middle">
    <text x="220" y="170">Domain</text><text x="220" y="118">Bacteria</text>
    <text x="560" y="170">Domain</text><text x="560" y="118">Archaea</text>
    <text x="840" y="170">Domain</text><text x="840" y="118">Eukarya</text>
  </g>
  <g font-size="34" fill="#4b5563" text-anchor="middle">
    <text x="500" y="780">Common ancestor</text>
  </g>
  <!-- the second split is annotated -->
  <g font-size="28" fill="#4b5563">
    <text x="720" y="455">Archaea and Eukarya</text>
    <text x="720" y="490">share a later branch</text>
  </g>
  <g font-size="28" fill="#4b5563" text-anchor="end">
    <text x="470" y="640">Bacteria split</text>
    <text x="470" y="675">off first</text>
  </g>
</svg>
