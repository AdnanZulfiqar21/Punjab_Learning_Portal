<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original redraw after Figure 5.4: Searle's apparatus with a reference wire and a test wire, spirit level and micrometer. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Searle's apparatus for Young's modulus</text>
  <rect x="150.0" y="70.0" width="360.0" height="18.0" rx="0" stroke="#64748b" stroke-width="2" fill="#94a3b8"/>
  <text x="330.0" y="64.0" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="400">rigid support</text>
  <line x1="250.0" y1="88.0" x2="250.0" y2="440.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="410.0" y1="88.0" x2="410.0" y2="440.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="240.0" y="160.0" font-size="16" fill="#1f6fb5" text-anchor="end" font-weight="700">reference wire</text>
  <text x="420.0" y="160.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">test wire</text>
  <rect x="220.0" y="240.0" width="60.0" height="110.0" rx="0" stroke="#8a5a2b" stroke-width="2" fill="#e9d5b7"/>
  <rect x="380.0" y="240.0" width="60.0" height="110.0" rx="0" stroke="#8a5a2b" stroke-width="2" fill="#e9d5b7"/>
  <rect x="280.0" y="270.0" width="100.0" height="14.0" rx="0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <circle cx="330.0" cy="260.0" r="12.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="330.0" y="230.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700">spirit level</text>
  <rect x="395.0" y="300.0" width="30.0" height="40.0" rx="3" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <line x1="410.0" y1="340.0" x2="410.0" y2="365.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <text x="445.0" y="330.0" font-size="16" fill="#d98b2b" text-anchor="start" font-weight="700">micrometer screw</text>
  <rect x="225.0" y="440.0" width="50.0" height="50.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#cbd5e1"/>
  <text x="250.0" y="515.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="400">constant weight</text>
  <rect x="385.0" y="440.0" width="50.0" height="12.0" rx="2" stroke="#14181f" stroke-width="1.5" fill="#94a3b8"/>
  <rect x="385.0" y="454.0" width="50.0" height="12.0" rx="2" stroke="#14181f" stroke-width="1.5" fill="#94a3b8"/>
  <rect x="385.0" y="468.0" width="50.0" height="12.0" rx="2" stroke="#14181f" stroke-width="1.5" fill="#94a3b8"/>
  <rect x="385.0" y="482.0" width="50.0" height="12.0" rx="2" stroke="#14181f" stroke-width="1.5" fill="#94a3b8"/>
  <line x1="410.0" y1="440.0" x2="410.0" y2="430.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="470.0" y="470.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">hanger with slotted</text>
  <text x="470.0" y="490.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">weights (load F)</text>
  <rect x="600.0" y="120.0" width="270.0" height="210.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="616.0" y="150.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">Add a load: the test wire</text>
  <text x="616.0" y="172.1" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">stretches by delta L.</text>
  <text x="616.0" y="194.2" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">Turn the micrometer until</text>
  <text x="616.0" y="216.3" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">the spirit level is level</text>
  <text x="616.0" y="238.4" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">again; read delta L.</text>
  <text x="616.0" y="260.5" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">Y = (F / A) / (delta L / L)</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
