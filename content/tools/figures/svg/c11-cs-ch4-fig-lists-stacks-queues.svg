<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 4.1.1 to 4.1.5: a list with indexes and operations, a stack of three books with push and pop, a queue with enqueue and dequeue, and the stack states while evaluating the postfix expression 3 4 5 * +. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Lists, stacks and queues</text>
  <rect x="50" y="55" width="540" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">List: ordered, indexed, changeable (4.1.1)</text>
  <rect x="70" y="120" width="96" height="34" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="87" y="141">Decorations</text>
  <text class="l" x="118" y="112" style="fill:#1f6fb5;text-anchor:middle">0</text>
  <rect x="172" y="120" width="96" height="34" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="203" y="141">Snacks</text>
  <text class="l" x="220" y="112" style="fill:#1f6fb5;text-anchor:middle">1</text>
  <rect x="274" y="120" width="96" height="34" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="291" y="141">Cold drinks</text>
  <text class="l" x="322" y="112" style="fill:#1f6fb5;text-anchor:middle">2</text>
  <rect x="376" y="120" width="96" height="34" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="407" y="141">Plates</text>
  <text class="l" x="424" y="112" style="fill:#1f6fb5;text-anchor:middle">3</text>
  <rect x="478" y="120" width="96" height="34" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="504" y="141">Balloons</text>
  <text class="l" x="526" y="112" style="fill:#1f6fb5;text-anchor:middle">4</text>
  <g class="r">
    <text x="70" y="186">insert(0, x) puts x at the front; append(x) adds at the end;</text>
    <text x="70" y="202">extend([x, y]) adds several items at once</text>
    <text x="70" y="218">remove(x) deletes the first x; pop(i) deletes index i; clear() empties</text>
    <text x="70" y="234">x in list checks if x is there; index(x) gives its position</text>
    <text x="70" y="250">properties: dynamic size, index from 0, ordered, mixed types,</text>
    <text x="70" y="266">changeable, duplicates allowed; lists can be nested</text>
  </g>
  <rect x="610" y="55" width="540" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Stack: last in, first out (4.1.2)</text>
  <rect x="660" y="290" width="150" height="38" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="718" y="313">Book A</text>
  <rect x="660" y="244" width="150" height="38" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="718" y="267">Book B</text>
  <rect x="660" y="198" width="150" height="38" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="714" y="221">Book C</text>
  <text class="r" x="652" y="314" style="text-anchor:end">bottom</text>
  <text class="l" x="840" y="210" style="fill:#d98b2b">top</text>
  <path d="M900 150 C860 150 840 170 830 196" stroke="#0f7a62" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text class="r" x="906" y="154" style="fill:#0f7a62">push: append()</text>
  <path d="M816 214 C860 240 880 250 900 252" stroke="#d7322f" stroke-width="2" fill="none" marker-end="url(#p)"/>
  <text class="r" x="906" y="256" style="fill:#d7322f">pop(): removes Book C</text>
  <g class="r">
    <text x="870" y="296">peek: stack[-1] (look only)</text>
    <text x="870" y="312">uses: postfix evaluation, function</text>
    <text x="870" y="328">calls, parentheses, undo, DFS</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Queue: first in, first out (4.1.4)</text>
  <rect x="140" y="470" width="90" height="38" rx="6" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="171" y="493">Ahmed</text>
  <rect x="240" y="470" width="90" height="38" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="268" y="493">Fatima</text>
  <rect x="340" y="470" width="90" height="38" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="377" y="493">Ali</text>
  <rect x="440" y="470" width="90" height="38" rx="6" fill="#fff4e2" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="474" y="493">Sara</text>
  <path d="M136 489 L74 489" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="70" y="530" style="fill:#d7322f">dequeue: get()</text>
  <path d="M560 489 L538 489" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <text class="r" x="420" y="530" style="fill:#0f7a62">enqueue: put()</text>
  <text class="r" x="185" y="460" style="text-anchor:middle">front</text>
  <text class="r" x="485" y="460" style="text-anchor:middle">back</text>
  <g class="r">
    <text x="70" y="570">q.queue[0] peeks at the front (Ahmed) without removing it</text>
    <text x="70" y="586">get() serves Ahmed; put("Sara") joins at the back:</text>
    <text x="70" y="602">the queue becomes Fatima, Ali, Sara</text>
    <text x="70" y="618">uses: BFS, task scheduling, print spooling, video buffering</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="403">Evaluating 3 4 5 * + with a stack (4.1.3)</text>
  <text class="l" x="680" y="430" style="fill:#7a2f86;text-anchor:middle">read 3</text>
  <rect x="650" y="560" width="60" height="28" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="677" y="578">3</text>
  <text class="l" x="780" y="430" style="fill:#7a2f86;text-anchor:middle">read 4</text>
  <rect x="750" y="560" width="60" height="28" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="777" y="578">3</text>
  <rect x="750" y="528" width="60" height="28" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="777" y="546">4</text>
  <text class="l" x="880" y="430" style="fill:#7a2f86;text-anchor:middle">read 5</text>
  <rect x="850" y="560" width="60" height="28" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="877" y="578">3</text>
  <rect x="850" y="528" width="60" height="28" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="877" y="546">4</text>
  <rect x="850" y="496" width="60" height="28" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="877" y="514">5</text>
  <text class="l" x="980" y="430" style="fill:#7a2f86;text-anchor:middle">read *</text>
  <rect x="950" y="560" width="60" height="28" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="977" y="578">3</text>
  <rect x="950" y="528" width="60" height="28" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="974" y="546">20</text>
  <text class="l" x="1080" y="430" style="fill:#7a2f86;text-anchor:middle">read +</text>
  <rect x="1050" y="560" width="60" height="28" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="1074" y="578">23</text>
  <g class="r">
    <text x="630" y="616">* pops 5 and 4 and pushes 20; + pops 20 and 3 and pushes 23</text>
    <text x="630" y="632">infix 3 + 4 * 2 becomes postfix 3 4 2 * + and prefix + 3 * 4 2</text>
    <text x="630" y="648">postfix and prefix need no parentheses</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
