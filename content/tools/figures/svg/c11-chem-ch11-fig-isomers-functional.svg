<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Times New Roman, Georgia, serif">
  <!-- Functional group isomers of C2H6O: methoxy methane H3C-O-CH3 and ethanol H3C-CH2-OH (original drawing after the structures printed on p267 of the textbook) -->
  <rect width="1000" height="200" fill="#ffffff"/>
  <text x="240.0" y="142.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Methoxy methane</tspan></text>
  <text x="745.0" y="142.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Ethanol</tspan></text>
  <line x1="154.7" y1="80.0" x2="221.5" y2="80.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="258.5" y1="80.0" x2="325.3" y2="80.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="654.7" y1="80.0" x2="710.3" y2="80.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="779.7" y1="80.0" x2="840.0" y2="80.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="120.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>H</tspan><tspan dy="8.0" font-size="21.8">3</tspan><tspan dy="-8.0">C</tspan></text>
  <text x="240.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>O</tspan></text>
  <text x="360.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>CH</tspan><tspan dy="8.0" font-size="21.8">3</tspan><tspan dy="-8.0"> </tspan></text>
  <text x="620.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>H</tspan><tspan dy="8.0" font-size="21.8">3</tspan><tspan dy="-8.0">C</tspan></text>
  <text x="745.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>CH</tspan><tspan dy="8.0" font-size="21.8">2</tspan><tspan dy="-8.0"> </tspan></text>
  <text x="870.0" y="91.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>OH</tspan></text>
</svg>
