<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 6.4: three blocks each holding the previous block's hash, a timestamp and transactions, a six-node peer-to-peer network, and the core principles and components of a blockchain. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Blockchain: a shared notebook of linked blocks</text>
  <rect x="50" y="55" width="1100" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Blocks linked by hashes (6.4.1.2)</text>
  <rect x="90" y="100" width="260" height="190" rx="8" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
  <text class="l" x="220" y="125" style="fill:#1f6fb5;text-anchor:middle">Block 0</text>
  <g class="r">
    <text x="104" y="155">previous hash: -</text>
    <text x="104" y="177">timestamp</text>
    <text x="104" y="199">transactions: A pays B ...</text>
    <text x="104" y="221">this block's hash: 0a9f</text>
  </g>
  <path d="M352 195 L446 195" stroke="#1f6fb5" stroke-width="2.2" marker-end="url(#bl)"/>
  <rect x="450" y="100" width="260" height="190" rx="8" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
  <text class="l" x="580" y="125" style="fill:#1f6fb5;text-anchor:middle">Block 1</text>
  <g class="r">
    <text x="464" y="155">previous hash: 0a9f</text>
    <text x="464" y="177">timestamp</text>
    <text x="464" y="199">transactions: A pays B ...</text>
    <text x="464" y="221">this block's hash: 7c21</text>
  </g>
  <path d="M712 195 L806 195" stroke="#1f6fb5" stroke-width="2.2" marker-end="url(#bl)"/>
  <rect x="810" y="100" width="260" height="190" rx="8" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
  <text class="l" x="940" y="125" style="fill:#1f6fb5;text-anchor:middle">Block 2</text>
  <g class="r">
    <text x="824" y="155">previous hash: 7c21</text>
    <text x="824" y="177">timestamp</text>
    <text x="824" y="199">transactions: A pays B ...</text>
    <text x="824" y="221">this block's hash: e5d0</text>
  </g>
  <g class="r">
    <text x="90" y="318">each block stores the hash of the block before it; changing an old block changes its hash and breaks every later link,</text>
    <text x="90" y="334">so tampering is easy to detect (the hash values shown are made-up placeholders)</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Peer-to-peer network (6.4.1.3)</text>
  <path d="M320 448 L441 498" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 448 L441 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 448 L320 648" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 448 L199 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 448 L199 498" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 498 L441 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 498 L320 648" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 498 L199 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 498 L199 498" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 598 L320 648" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 598 L199 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M441 598 L199 498" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 648 L199 598" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M320 648 L199 498" stroke="#9aa3ad" stroke-width="1"/>
  <path d="M199 598 L199 498" stroke="#9aa3ad" stroke-width="1"/>
  <circle cx="320" cy="448" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="320" y="453" style="text-anchor:middle">N1</text>
  <circle cx="441" cy="498" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="441" y="503" style="text-anchor:middle">N2</text>
  <circle cx="441" cy="598" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="441" y="603" style="text-anchor:middle">N3</text>
  <circle cx="320" cy="648" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="320" y="653" style="text-anchor:middle">N4</text>
  <circle cx="199" cy="598" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="199" y="603" style="text-anchor:middle">N5</text>
  <circle cx="199" cy="498" r="22" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.6"/>
  <text class="l" x="199" y="503" style="text-anchor:middle">N6</text>
  <g class="r">
    <text x="70" y="686">every node keeps a full copy of the ledger; no central server</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="403">Core principles and terms (6.4.1)</text>
  <g class="r">
    <text x="630" y="436">decentralization: many nodes, no single owner</text>
    <text x="630" y="453">immutability: added blocks cannot be altered</text>
    <text x="630" y="470">consensus: nodes agree before a block is added</text>
    <text x="630" y="487">(Proof of Work, Proof of Stake)</text>
    <text x="630" y="504">transparency: participants see the same ledger</text>
    <text x="630" y="521">security: cryptography locks the records</text>
    <text x="630" y="555">node: a computer in the network</text>
    <text x="630" y="572">ledger: the record of all transactions</text>
    <text x="630" y="589">block: a bundle of transactions with hashes</text>
    <text x="630" y="606">transaction: one transfer of assets or data</text>
    <text x="630" y="623">protocol: the rules for validating and adding</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
