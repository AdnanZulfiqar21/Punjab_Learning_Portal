<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.6 and 5.7: the open hydrogen-bonded structure of ice, and the boiling points and heats of vaporization of the group 16 hydrides with water's anomaly. Values schematic except where printed. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .e{font-size:12px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Hydrogen bonding explains the odd properties of water</text>
  <!-- ice lattice: hexagonal open ring of O atoms -->
  <text class="k" x="260" y="72">Ice: an open hexagonal network</text>
  <g stroke="#1f6fb5" stroke-width="2" stroke-dasharray="4 3" fill="none">
    <path d="M160 150 L210 120 L260 150 L260 210 L210 240 L160 210 Z"/>
    <path d="M260 150 L310 120 L360 150 L360 210 L310 240 L260 210"/>
    <path d="M210 240 L210 300 L260 330 L310 300 L310 240"/>
  </g>
  <g fill="#f6d5cf" stroke="#d7322f" stroke-width="2">
    <circle cx="160" cy="150" r="11"/><circle cx="210" cy="120" r="11"/><circle cx="260" cy="150" r="11"/><circle cx="260" cy="210" r="11"/><circle cx="210" cy="240" r="11"/><circle cx="160" cy="210" r="11"/>
    <circle cx="310" cy="120" r="11"/><circle cx="360" cy="150" r="11"/><circle cx="360" cy="210" r="11"/><circle cx="310" cy="240" r="11"/><circle cx="210" cy="300" r="11"/><circle cx="260" cy="330" r="11"/><circle cx="310" cy="300" r="11"/>
  </g>
  <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5">
    <circle cx="183" cy="136" r="6"/><circle cx="237" cy="136" r="6"/><circle cx="260" cy="180" r="6"/><circle cx="237" cy="226" r="6"/><circle cx="183" cy="226" r="6"/><circle cx="160" cy="180" r="6"/><circle cx="285" cy="136" r="6"/><circle cx="337" cy="136" r="6"/><circle cx="360" cy="180" r="6"/><circle cx="337" cy="226" r="6"/><circle cx="210" cy="270" r="6"/><circle cx="237" cy="316" r="6"/><circle cx="285" cy="316" r="6"/><circle cx="310" cy="270" r="6"/>
  </g>
  <text class="s" x="260" y="365">each O (red) holds two H (grey) and makes two hydrogen bonds (dotted)</text>
  <text class="s" x="260" y="383">a tetrahedral, regular network with empty spaces inside</text>
  <g class="t">
    <text x="60" y="420">ice takes 9 % more space than the water it came from,</text>
    <text x="60" y="438">so its density is lower and it floats; a lake freezes from</text>
    <text x="60" y="456">the top and the ice blanket insulates the water below,</text>
    <text x="60" y="474">so fish survive under frozen lakes and oceans</text>
    <text x="60" y="504">the same bonds give water a high specific heat capacity,</text>
    <text x="60" y="522">high surface tension and high viscosity (hexane and</text>
    <text x="60" y="540">ethanol flow more easily; hydrocarbons cannot H-bond)</text>
  </g>
  <!-- group 16 hydrides plot -->
  <text class="k" x="860" y="72">Group 16 hydrides: the trend and water's exception</text>
  <path d="M600 420 V100 M600 420 H1120" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="560" y="260" transform="rotate(-90 560 260)" text-anchor="middle">boiling point or heat of vaporization</text>
  <g class="s"><text x="680" y="442">H2O</text><text x="790" y="442">H2S</text><text x="900" y="442">H2Se</text><text x="1010" y="442">H2Te</text><text x="1100" y="442">H2Po</text></g>
  <!-- expected trend line (dashed) and actual -->
  <path d="M680 390 L790 350 L900 310 L1010 270 L1100 240" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M790 350 L900 310 L1010 270 L1100 240" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M680 130 L790 350" fill="none" stroke="#d7322f" stroke-width="3"/>
  <g fill="#1f6fb5"><circle cx="790" cy="350" r="6"/><circle cx="900" cy="310" r="6"/><circle cx="1010" cy="270" r="6"/><circle cx="1100" cy="240" r="6"/></g>
  <circle cx="680" cy="130" r="7" fill="#d7322f"/><circle cx="680" cy="390" r="6" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="700" y="118" style="fill:#d7322f;font-weight:700">water: 100 degrees C, 41 kJ per mol</text>
  <text class="s" x="730" y="408" style="fill:#9ca3af">where water would fall without H-bonds</text>
  <text class="s" x="950" y="222" style="fill:#1f6fb5">London forces grow with size: regular rise H2S to H2Po</text>
  <g class="t">
    <text x="600" y="480">down the group the molecules get bigger, their London (van der Waals) forces</text>
    <text x="600" y="498">stronger, and the boiling point and enthalpy of vaporization rise steadily;</text>
    <text x="600" y="516">water should be the lowest but is far the highest, because its extensive</text>
    <text x="600" y="534">hydrogen bonding must be broken before it can vaporize or boil</text>
  </g>
  <text class="s" x="600" y="590">Heights are schematic. Printed values: water boils at 100 degrees C with an enthalpy of vaporization of 41 kJ per mol (40.6 in topic 5.10).</text>
</svg>
