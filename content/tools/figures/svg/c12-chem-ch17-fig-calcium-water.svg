<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Figure 17.3: a lump of calcium in a beaker of water giving off bubbles of hydrogen, with a cloudy white precipitate of sparingly soluble calcium hydroxide. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Calcium reacting with cold water</text>
  <path d="M260 120 L260 380 Q260 400 280 400 L520 400 Q540 400 540 380 L540 120" stroke="#64748b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="262.0" y="180.0" width="276.0" height="218.0" rx="0" stroke="none" stroke-width="0" fill="#dbeafe"/>
  <rect x="372.0" y="330.0" width="56.0" height="40.0" rx="6" stroke="#57534e" stroke-width="2" fill="#d6d3d1"/>
  <text x="400.0" y="356.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Ca</text>
  <circle cx="390.0" cy="290.0" r="6.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="408.0" cy="260.0" r="6.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="396.0" cy="230.0" r="6.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="412.0" cy="200.0" r="6.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="392.0" cy="180.0" r="6.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="310.0" cy="380.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <circle cx="340.0" cy="386.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <circle cx="480.0" cy="384.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <circle cx="500.0" cy="378.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <circle cx="380.0" cy="388.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <circle cx="440.0" cy="390.0" r="4.0" stroke="#94a3b8" stroke-width="1" fill="#ffffff"/>
  <text x="400.0" y="90.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca(s) + 2H</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">O(l) -&gt; Ca(OH)</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8"> + H</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">(g)</tspan></text>
  <text x="600.0" y="220.0" font-size="13" fill="#0e7490" text-anchor="start" font-weight="700">bubbles of hydrogen</text>
  <text x="600.0" y="360.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">cloudy white: Ca(OH)2 is only</text>
  <text x="600.0" y="380.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">sparingly soluble</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
