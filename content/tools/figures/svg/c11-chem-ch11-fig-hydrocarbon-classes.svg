<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.1 and 11.2 and Tables 11.1 to 11.3: aliphatic and aromatic hydrocarbons, the alkane series and alkyl groups. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f;text-anchor:middle}
      .n{font-size:12px;fill:#14181f;text-anchor:middle;font-weight:700}
    </style>
  </defs>
  <text class="h" x="600" y="32">Hydrocarbons: aliphatic (open chain and cyclic) and aromatic</text>
  <!-- aliphatic -->
  <rect x="50" y="55" width="700" height="290" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="400" y="83">Aliphatic hydrocarbons (Figure 11.1): not aromatic; saturated or unsaturated</text>
  <g class="f">
    <text x="130" y="130">CH4</text><text x="270" y="130">CH3-CH3</text><text x="430" y="130">CH2=CH2</text><text x="600" y="130">HC(triple bond)CH</text>
  </g>
  <g class="n">
    <text x="130" y="152">methane</text><text x="270" y="152">ethane</text><text x="430" y="152">ethene</text><text x="600" y="152">ethyne</text>
  </g>
  <g class="s" style="font-size:11px">
    <text x="130" y="168">alkane, saturated</text><text x="270" y="168">alkane, saturated</text><text x="430" y="168">alkene, C=C</text><text x="600" y="168">alkyne, triple bond</text>
  </g>
  <!-- rings -->
  <g fill="none" stroke="#14181f" stroke-width="2">
    <path d="M130 200 L160 250 L100 250 Z"/>
    <rect x="245" y="205" width="50" height="50"/>
    <path d="M430 198 L459 219 L448 253 L412 253 L401 219 Z"/>
    <path d="M600 196 L627 212 L627 244 L600 260 L573 244 L573 212 Z"/>
  </g>
  <g class="n">
    <text x="130" y="276">cyclopropane C3H6</text><text x="270" y="276">cyclobutane C4H8</text><text x="430" y="276">cyclopentane C5H10</text><text x="600" y="276">cyclohexane C6H12</text>
  </g>
  <text class="s" x="400" y="302">each corner is a CH2 group; cycloalkanes are cyclic, saturated aliphatic hydrocarbons</text>
  <text class="s" x="400" y="322">alkanes CnH2n+2 (acyclic); cycloalkanes CnH2n; alkenes and alkynes are acyclic and unsaturated</text>
  <!-- aromatic -->
  <rect x="770" y="55" width="380" height="290" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="960" y="83">Aromatic hydrocarbons (Figure 11.2)</text>
  <g fill="none" stroke="#14181f" stroke-width="2">
    <path d="M840 120 L867 136 L867 168 L840 184 L813 168 L813 136 Z"/><circle cx="840" cy="152" r="18"/>
    <path d="M960 120 L987 136 L987 168 L960 184 L933 168 L933 136 Z"/><circle cx="960" cy="152" r="18"/>
    <path d="M1080 120 L1107 136 L1107 168 L1080 184 L1053 168 L1053 136 Z"/><circle cx="1080" cy="152" r="18"/>
    <path d="M960 120 V104"/><path d="M1080 120 V104"/>
  </g>
  <g class="f" style="font-size:12px"><text x="960" y="100">CH3</text><text x="1080" y="100">CH2CH3</text></g>
  <g class="n">
    <text x="840" y="208">benzene C6H6</text><text x="960" y="208">methylbenzene</text><text x="1080" y="208">ethylbenzene</text>
    <text x="960" y="224" style="font-weight:400">(toluene)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="790" y="252">special class of cyclic hydrocarbons with a high</text>
    <text x="790" y="268">carbon to hydrogen ratio, based on benzene (C6H6)</text>
    <text x="790" y="284">or resembling compounds; toluene and phenol are</text>
    <text x="790" y="300">derivatives; 'aroma' (Greek) = fragrant, after their</text>
    <text x="790" y="316">characteristic odour</text>
  </g>
  <!-- alkane table -->
  <rect x="50" y="365" width="640" height="275" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="370" y="393">The alkane homologous series, CnH2n+2 (Table 11.1)</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="418">Name</text><text x="150" y="418">Formula</text><text x="240" y="418">Condensed structure</text></g>
    <text x="70" y="440">methane</text><text x="150" y="440">CH4</text><text x="240" y="440">CH4</text>
    <text x="70" y="458">ethane</text><text x="150" y="458">C2H6</text><text x="240" y="458">CH3CH3</text>
    <text x="70" y="476">propane</text><text x="150" y="476">C3H8</text><text x="240" y="476">CH3CH2CH3</text>
    <text x="70" y="494">butane</text><text x="150" y="494">C4H10</text><text x="240" y="494">CH3CH2CH2CH3</text>
    <text x="70" y="512">pentane</text><text x="150" y="512">C5H12</text><text x="240" y="512">CH3(CH2)3CH3</text>
    <text x="70" y="530">hexane</text><text x="150" y="530">C6H14</text><text x="240" y="530">CH3(CH2)4CH3</text>
    <text x="70" y="548">heptane</text><text x="150" y="548">C7H16</text><text x="240" y="548">CH3(CH2)5CH3 (printed C7H10)</text>
    <text x="70" y="566">octane</text><text x="150" y="566">C8H18</text><text x="240" y="566">CH3(CH2)6CH3</text>
    <text x="70" y="584">nonane</text><text x="150" y="584">C9H20</text><text x="240" y="584">CH3(CH2)7CH3</text>
    <text x="70" y="602">decane</text><text x="150" y="602">C10H22</text><text x="240" y="602">CH3(CH2)8CH3</text>
  </g>
  <path d="M60 426 H440" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="460" y="440" style="font-weight:700;fill:#14181f">Alkyl groups (Tables 11.2, 11.3)</text>
    <text x="460" y="460">remove one H; -ane becomes -yl</text>
    <text x="460" y="480">CH3- methyl (Me-); CH3CH2- ethyl (Et-)</text>
    <text x="460" y="500">propane: CH3CH2CH2- n-propyl (propyl)</text>
    <text x="460" y="516">CH3CH(CH3)- isopropyl (1-methylethyl)</text>
    <text x="460" y="536">butane: n-butyl, sec-butyl (1-methylpropyl),</text>
    <text x="460" y="552">isobutyl (2-methylpropyl), tert-butyl</text>
    <text x="460" y="568">(1,1-dimethylethyl; printed -propyl)</text>
    <text x="460" y="592">each member differs by CH2 from the next</text>
    <text x="460" y="608">(a homologous series)</text>
  </g>
  <!-- note -->
  <rect x="710" y="365" width="440" height="275" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="930" y="393">Why hydrocarbons matter</text>
  <g class="t" style="font-size:12px">
    <text x="730" y="420">only carbon and hydrogen; abundant in petroleum and</text>
    <text x="730" y="436">natural gas; domestic and industrial fuels</text>
    <text x="730" y="460">alkenes are starting materials for industrial products:</text>
    <text x="730" y="476">medicines, plastics, perfumes, polymers</text>
    <text x="730" y="500">butane fuels lighters; isobutane is a propellant in</text>
    <text x="730" y="516">shaving gel</text>
    <text x="730" y="540">combustion releases CO2 (a greenhouse gas); incomplete</text>
    <text x="730" y="556">combustion gives CO and particulate matter</text>
    <text x="730" y="580">two broad classes: aliphatic (alkanes, cycloalkanes,</text>
    <text x="730" y="596">alkenes, alkynes) and aromatic (benzene and relatives)</text>
  </g>
  <text class="s" x="600" y="655" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
