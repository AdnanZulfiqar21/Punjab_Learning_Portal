<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after topics 13.5 to 13.7 and 13.9 and Table 13.5: reactions of halogens with hydrogen, thermal stability of HX, halide ions as reducing agents and their reactions with concentrated sulfuric acid. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Hydrogen halides, halide ions as reducing agents, and halides with concentrated sulfuric acid</text>
  <!-- H2 + X2 -->
  <rect x="50" y="55" width="560" height="235" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="330" y="83">Halogens with hydrogen (13.5): H2 + X2 gives 2HX</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="110">Halogen</text><text x="150" y="110">Conditions</text><text x="400" y="110">Nature</text></g>
    <text x="70" y="132">F2</text><text x="150" y="132">low temperature, in the dark</text><text x="400" y="132">explosive</text>
    <text x="70" y="152">Cl2</text><text x="150" y="152">UV light or a spark</text><text x="400" y="152">readily, colourless HCl</text>
    <text x="70" y="172">Br2</text><text x="150" y="172">heating</text><text x="400" y="172">exothermic, less reactive</text>
    <text x="70" y="192">I2</text><text x="150" y="192">high temperature and a catalyst</text><text x="400" y="192">very slow, reversible</text>
  </g>
  <path d="M60 118 H600" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="70" y="222">reactivity with hydrogen falls F2 greater than Cl2 greater than Br2 greater than I2</text>
    <text x="70" y="240">hydrogen halides are colourless gases that dissolve in water as hydrohalic acids</text>
    <text x="70" y="258">(hydrofluoric, hydrochloric, hydrobromic, hydroiodic acid)</text>
  </g>
  <!-- thermal stability -->
  <rect x="630" y="55" width="520" height="235" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="890" y="83">Thermal stability of HX (13.6, Table 13.5)</text>
  <path d="M680 250 V105 M680 250 H900" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="700" y="108" width="36" height="142" fill="#d98b2b" opacity="0.85"/>
    <rect x="750" y="142" width="36" height="108" fill="#0f7a62" opacity="0.85"/>
    <rect x="800" y="159" width="36" height="91" fill="#b5600f" opacity="0.85"/>
    <rect x="850" y="175" width="36" height="75" fill="#5b3fb5" opacity="0.85"/>
  </g>
  <g class="r" style="font-weight:700;fill:#14181f"><text x="718" y="102">569</text><text x="768" y="136">431</text><text x="818" y="153">366</text><text x="868" y="169">299</text></g>
  <g class="r"><text x="718" y="266">H-F</text><text x="768" y="266">H-Cl</text><text x="818" y="266">H-Br</text><text x="868" y="266">H-I</text></g>
  <text class="r" x="660" y="180" transform="rotate(-90 660 180)">bond energy, kJ mol-1</text>
  <g class="t" style="font-size:12px">
    <text x="915" y="120">stability HF greater than HCl greater</text>
    <text x="915" y="136">than HBr greater than HI</text>
    <text x="915" y="160">small, very electronegative F gives</text>
    <text x="915" y="176">strong orbital overlap: strongest bond</text>
    <text x="915" y="200">larger halogen atoms overlap poorly</text>
    <text x="915" y="216">with H: longer, weaker bonds that</text>
    <text x="915" y="232">break on heating (HI decomposes)</text>
    <text x="915" y="256">acid strength in water rises HF to HI</text>
  </g>
  <!-- reducing agents -->
  <rect x="50" y="310" width="400" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="250" y="338">Halide ions as reducing agents (13.7)</text>
  <text class="f" x="70" y="366" style="font-size:13px">reducing power: I- &gt; Br- &gt; Cl- &gt; F-</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="394">down the group electronegativity falls and ionic</text>
    <text x="70" y="410">radius grows, so charge density falls and the</text>
    <text x="70" y="426">extra electron is given up more easily</text>
    <text x="70" y="450">F-: very electronegative, small, high charge</text>
    <text x="70" y="466">density, holds its electron: weakest reducer</text>
    <text x="70" y="486">Cl-: larger, less electronegative than F-</text>
    <text x="70" y="506">Br-: larger radius, lower charge density</text>
    <text x="70" y="526">I-: large, low electronegativity, lowest charge</text>
    <text x="70" y="542">density: strongest reducing agent</text>
    <text x="70" y="566">the oxidising power of X2 and the reducing</text>
    <text x="70" y="582">power of X- are opposite trends</text>
  </g>
  <!-- conc H2SO4 -->
  <rect x="470" y="310" width="680" height="300" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="810" y="338">Halides with concentrated sulfuric acid (13.9)</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="490" y="366">Halide</text><text x="560" y="366">Observation</text><text x="900" y="366">H2SO4 reduced to</text></g>
    <text x="490" y="388">NaF</text><text x="560" y="388">fumes of HF; no further reaction (HF weak reducer)</text><text x="900" y="388">not reduced</text>
    <text x="490" y="408">NaCl</text><text x="560" y="408">steamy fumes of HCl; no further reaction</text><text x="900" y="408">not reduced</text>
    <text x="490" y="428">NaBr</text><text x="560" y="428">steamy HBr, brown Br2 fumes, smell of SO2</text><text x="900" y="428">SO2 (S +6 to +4)</text>
    <text x="490" y="448">NaI</text><text x="560" y="448">HI fumes, purple I2, smell of H2S (rotten eggs)</text><text x="900" y="448">H2S (S +6 to -2)</text>
  </g>
  <path d="M480 374 H1140" stroke="#9ca3af" stroke-width="1"/>
  <g class="f">
    <text x="490" y="478">NaX + H2SO4 --> NaHSO4 + HX        (X = F, Cl, Br, I)</text>
    <text x="490" y="498">2HBr + H2SO4 --> Br2 + SO2 + 2H2O   (HBr reduces the acid, is oxidised to Br2)</text>
    <text x="490" y="518">8HI + H2SO4 --> 4I2 + H2S + 4H2O    (HI reduces the acid all the way to H2S)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="490" y="548">the stronger reducing power of the halide down the group gives more complex redox</text>
    <text x="490" y="564">products; fluoride and chloride give only the hydrogen halide (acid displacement)</text>
    <text x="490" y="588">the printed equations write 2HBr(s), 8HI(s) and 2SO2; the stoichiometry above is balanced</text>
  </g>
  <text class="s" x="600" y="632" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
