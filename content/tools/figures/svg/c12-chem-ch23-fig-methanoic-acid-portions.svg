  <line x1="467.3" y1="170.1" x2="467.3" y2="149.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="476.3" y1="170.1" x2="476.3" y2="149.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="471.8" y="144.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">O</tspan></text>
  <line x1="486.4" y1="188.4" x2="515.3" y2="188.4" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="519.4" y="200.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">OH</tspan></text>
  <text x="650.0" y="200.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">H</tspan></text>
  <line x1="678.3" y1="188.4" x2="707.2" y2="188.4" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="711.3" y="200.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">C</tspan></text>
  <line x1="717.3" y1="170.1" x2="717.3" y2="149.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="726.3" y1="170.1" x2="726.3" y2="149.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="721.8" y="144.2" font-size="34" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">O</tspan></text>
  <line x1="736.4" y1="188.4" x2="765.3" y2="188.4" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="769.4" y="200.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">OH</tspan></text>
  <rect x="390.0" y="90.0" width="103.8" height="128.0" rx="0" stroke="#e58fb6" stroke-width="3" fill="none"/>
  <rect x="699.8" y="90.0" width="129.6" height="128.0" rx="0" stroke="#e58fb6" stroke-width="3" fill="none"/>
  <rect x="10.0" y="40.0" width="290.0" height="250.0" rx="14" stroke="none" stroke-width="0" fill="#fbe3ee"/>
  <text x="22.0" y="80.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">Aldehydic portion</tspan></text>
  <text x="22.0" y="124.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">(-CHO) responsible</tspan></text>
  <text x="22.0" y="168.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">for its behaviour as</tspan></text>
  <text x="22.0" y="212.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">a powerful reducing</tspan></text>
  <text x="22.0" y="256.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">agent.</tspan></text>
  <line x1="395.0" y1="150.0" x2="319.2" y2="150.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
