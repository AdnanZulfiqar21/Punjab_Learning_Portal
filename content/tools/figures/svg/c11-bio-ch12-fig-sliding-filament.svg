<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.22 and 12.23: the sliding filament model and the cross-bridge (power-stroke) cycle. Schematic. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:15px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="40">Sliding filaments: relaxed and contracted</text>
  <!-- relaxed sarcomere -->
  <text class="k" x="60" y="80" style="text-anchor:start">relaxed</text>
  <g stroke="#14181f" stroke-width="5"><path d="M80 90 v90 M520 90 v90"/></g>
  <g stroke="#1f6fb5" stroke-width="5"><path d="M80 110 h170 M80 160 h170 M520 110 h-170 M520 160 h-170"/></g>
  <g stroke="#d7322f" stroke-width="9" stroke-linecap="round"><path d="M180 135 h240"/></g>
  <text class="s" x="300" y="205">H zone wide, I bands wide; myosin heads free, sites on actin blocked by tropomyosin</text>
  <!-- contracted -->
  <text class="k" x="60" y="250" style="text-anchor:start">contracted</text>
  <g stroke="#14181f" stroke-width="5"><path d="M140 260 v90 M460 260 v90"/></g>
  <g stroke="#1f6fb5" stroke-width="5"><path d="M140 280 h170 M140 330 h170 M460 280 h-170 M460 330 h-170"/></g>
  <g stroke="#d7322f" stroke-width="9" stroke-linecap="round"><path d="M180 305 h240"/></g>
  <g stroke="#d7322f" stroke-width="3"><path d="M200 300 l-8 -14 M230 300 l-8 -14 M370 300 l8 -14 M400 300 l8 -14 M200 310 l-8 14 M230 310 l-8 14 M370 310 l8 14 M400 310 l8 14"/></g>
  <text class="s" x="300" y="375">thin filaments pulled towards the centre: Z lines closer, H zone gone, I bands narrow,</text><text class="s" x="300" y="395">A band unchanged; the same in every sarcomere, so the whole muscle shortens</text>
  <!-- cross bridge cycle -->
  <text class="h" x="880" y="40">The cross-bridge (power-stroke) cycle</text>
  <rect x="640" y="70" width="480" height="92" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="655" y="95" style="text-anchor:start">1. Relaxed</text>
  <text class="b" x="655" y="117">sarcomeres at normal length; tropomyosin blocks the</text><text class="b" x="655" y="137">binding sites; myosin heads hold hydrolysed ATP (ADP + Pi)</text>
  <rect x="640" y="176" width="480" height="112" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="655" y="201" style="text-anchor:start">2. Nerve impulse arrives</text>
  <text class="b" x="655" y="223">acetylcholine at the synapse; the sarcolemma's own impulse</text><text class="b" x="655" y="243">runs down the T-tubules to the SR, which releases Ca2+;</text><text class="b" x="655" y="263">Ca2+ binds troponin, which shifts tropomyosin off the sites</text>
  <rect x="640" y="302" width="480" height="132" rx="12" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="655" y="327" style="text-anchor:start">3. Cross-bridges and power stroke</text>
  <text class="b" x="655" y="349">myosin heads bind the exposed sites (cross-bridges), release</text><text class="b" x="655" y="369">ADP and Pi, change shape and bend towards the centre of the</text><text class="b" x="655" y="389">sarcomere, pulling the actin with them: Z lines closer, H zone</text><text class="b" x="655" y="409">disappears, A bands approach but do not shorten</text>
  <rect x="640" y="448" width="480" height="92" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="655" y="473" style="text-anchor:start">4. Myosin heads detach</text>
  <text class="b" x="655" y="495">a new ATP binds the head and it lets go of actin; splitting the</text><text class="b" x="655" y="515">ATP to ADP + Pi resets the head, and the cycle can begin again</text>
  <path d="M1130 500 q40 -200 -20 -390" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <!-- heads illustration -->
  <g transform="translate(60,440)">
    <path d="M0 60 H260" stroke="#1f6fb5" stroke-width="6"/><path d="M0 10 H260" stroke="#d7322f" stroke-width="8"/>
    <path d="M60 14 q0 30 25 40" fill="none" stroke="#d7322f" stroke-width="4"/><circle cx="88" cy="56" r="8" fill="#d7322f"/>
    <path d="M160 14 q0 30 -25 40" fill="none" stroke="#d7322f" stroke-width="4"/><circle cx="132" cy="56" r="8" fill="#d7322f"/>
    <path d="M110 68 h-60" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
    <text class="s" x="250" y="100">heads bind, bend and pull the actin (blue) past the myosin (red)</text>
  </g>
  <text class="s" x="300" y="600">Rigor mortis: after death no ATP is made, so the heads cannot</text><text class="s" x="300" y="620">detach, and the cross-bridges lock the muscles stiff.</text>
  <text class="s" x="600" y="680">Muscles pull but never push: fibres can only shorten, pulling on tendons, and relax to let the bone move back.</text>
  <text class="s" x="600" y="710">The skeleton is a system of rods (bones) and levers: joints are fulcrums, muscles supply the effort, the weight is the load,</text>
  <text class="s" x="600" y="730">as when the biceps lifts a weight about the elbow.</text>
</svg>
