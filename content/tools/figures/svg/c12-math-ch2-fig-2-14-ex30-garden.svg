<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#c0392b" stroke-width="3"/></pattern></defs>
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<rect x="120" y="130" width="560" height="40" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
<text x="400.0" y="112.0" font-family="Inter, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#222222" >Wall (no fence needed)</text>
<rect x="150" y="170" width="500" height="250" fill="#e8f3e3"/>
<line x1="150.0" y1="170.0" x2="150.0" y2="420.0" stroke="#2e7d32" stroke-width="5" stroke-dasharray="14 8"/>
<line x1="150.0" y1="420.0" x2="650.0" y2="420.0" stroke="#2e7d32" stroke-width="5" stroke-dasharray="14 8"/>
<line x1="650.0" y1="420.0" x2="650.0" y2="170.0" stroke="#2e7d32" stroke-width="5" stroke-dasharray="14 8"/>
<text x="400.0" y="303.0" font-family="Inter, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#2e7d32" >Area A = xy</text>
<line x1="150.0" y1="460.0" x2="650.0" y2="460.0" stroke="#222222" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="400.0" y="500.0" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#222222" >x (side opposite the wall)</text>
<line x1="110.0" y1="170.0" x2="110.0" y2="420.0" stroke="#222222" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="94.0" y="303.0" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="end" fill="#222222" >y</text>
<line x1="690.0" y1="170.0" x2="690.0" y2="420.0" stroke="#222222" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="706.0" y="303.0" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="start" fill="#222222" >y</text>
<text x="400.0" y="560.0" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2e7d32" >Fence (dashed): x + 2y = 100 m</text>
