<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 25.9: sunlight passes through the atmosphere and warms the Earth; greenhouse gases trap part of the heat radiated back. With more greenhouse gases the layer is thicker, less heat escapes and the Earth warms. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The greenhouse effect: natural and enhanced</text>
  <rect x="15.0" y="55.0" width="430.0" height="445.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">natural greenhouse effect</text>
  <rect x="35.0" y="400.0" width="390.0" height="80.0" rx="4" stroke="#78350f" stroke-width="2" fill="#d6c4a8"/>
  <text x="230.0" y="450.0" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">Earth's surface</text>
  <rect x="35.0" y="240.0" width="390.0" height="10.0" rx="4" stroke="#64748b" stroke-width="1.5" fill="#cbd5e1"/>
  <text x="230.0" y="268.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">greenhouse gases</text>
  <circle cx="75.0" cy="110.0" r="26.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <line x1="95.0" y1="130.0" x2="182.4" y2="387.4" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M185.0 395.0 L178.1 387.8 L186.1 385.1 Z" fill="#d98b2b"/>
  <text x="135.0" y="340.0" font-size="12" fill="#d98b2b" text-anchor="end" font-weight="700">sunlight in</text>
  <path d="M245 395 L285 250" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="285.0" y1="250.0" x2="332.6" y2="383.2" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M335.0 390.0 L328.7 383.6 L335.8 381.0 Z" fill="#d7322f"/>
  <line x1="315.0" y1="240.0" x2="343.0" y2="156.1" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M345.0 150.0 L345.9 157.9 L339.5 155.8 Z" fill="#d7322f"/>
  <line x1="340.0" y1="240.0" x2="368.0" y2="156.1" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M370.0 150.0 L370.9 157.9 L364.5 155.8 Z" fill="#d7322f"/>
  <line x1="365.0" y1="240.0" x2="393.0" y2="156.1" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M395.0 150.0 L395.9 157.9 L389.5 155.8 Z" fill="#d7322f"/>
  <text x="355.0" y="140.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">heat escapes</text>
  <text x="360.0" y="330.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">heat trapped</text>
  <text x="230.0" y="487.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <rect x="455.0" y="55.0" width="430.0" height="445.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">enhanced greenhouse effect</text>
  <rect x="475.0" y="400.0" width="390.0" height="80.0" rx="4" stroke="#78350f" stroke-width="2" fill="#d6c4a8"/>
  <text x="670.0" y="450.0" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">Earth's surface</text>
  <rect x="475.0" y="240.0" width="390.0" height="22.0" rx="4" stroke="#64748b" stroke-width="1.5" fill="#cbd5e1"/>
  <text x="670.0" y="280.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">greenhouse gases (more CO2, CH4, N2O)</text>
  <circle cx="515.0" cy="110.0" r="26.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <line x1="535.0" y1="130.0" x2="622.4" y2="387.4" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M625.0 395.0 L618.1 387.8 L626.1 385.1 Z" fill="#d98b2b"/>
  <text x="575.0" y="340.0" font-size="12" fill="#d98b2b" text-anchor="end" font-weight="700">sunlight in</text>
  <path d="M685 395 L725 262" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="725.0" y1="262.0" x2="772.4" y2="383.3" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M775.0 390.0 L768.5 383.8 L775.6 381.0 Z" fill="#d7322f"/>
  <line x1="755.0" y1="240.0" x2="783.0" y2="156.1" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M785.0 150.0 L785.9 157.9 L779.5 155.8 Z" fill="#d7322f"/>
  <text x="795.0" y="140.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">less heat escapes</text>
  <text x="800.0" y="330.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">heat trapped</text>
  <text x="670.0" y="487.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
