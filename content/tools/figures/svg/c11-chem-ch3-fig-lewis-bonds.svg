<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.1 to 3.3 and the Lewis structures of the sulfate and tri-iodide ions: ionic, covalent and dative bonds, and expanded octets. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .e{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .m{font-family:Consolas, Courier New, monospace;font-size:20px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Lewis concept: bonds complete the octet</text>
  <!-- ionic -->
  <text class="k" x="200" y="72">Ionic bond: transfer (NaCl)</text>
  <circle cx="110" cy="150" r="40" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="110" y="158">Na</text>
  <circle cx="300" cy="150" r="44" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="e" x="300" y="158">Cl</text>
  <circle cx="156" cy="138" r="5" fill="#d7322f"/>
  <path d="M166 136 q50 -40 86 -12" fill="none" stroke="#d7322f" stroke-width="2.5" marker-end="url(#ar)"/>
  <g fill="#1f6fb5"><circle cx="300" cy="100" r="4"/><circle cx="312" cy="100" r="4"/><circle cx="300" cy="200" r="4"/><circle cx="312" cy="200" r="4"/><circle cx="250" cy="150" r="4"/><circle cx="250" cy="162" r="4"/><circle cx="350" cy="150" r="4"/></g>
  <text class="s" x="110" y="215">2, 8, 1: loses one electron</text><text class="s" x="110" y="233">low ionization energy</text>
  <text class="s" x="300" y="215">2, 8, 7: gains one electron</text><text class="s" x="300" y="233">high electron affinity</text>
  <text class="s" x="200" y="262">Na+ (like Ne) and Cl- (like Ar): strong attraction</text>
  <!-- covalent -->
  <text class="k" x="600" y="72">Covalent bond: sharing (Cl2)</text>
  <circle cx="540" cy="150" r="44" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="e" x="540" y="158">Cl</text>
  <circle cx="660" cy="150" r="44" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="e" x="660" y="158">Cl</text>
  <g fill="#1f6fb5"><circle cx="594" cy="150" r="4"/><circle cx="606" cy="150" r="4"/></g>
  <g fill="#9ca3af"><circle cx="534" cy="100" r="4"/><circle cx="546" cy="100" r="4"/><circle cx="534" cy="200" r="4"/><circle cx="546" cy="200" r="4"/><circle cx="490" cy="144" r="4"/><circle cx="490" cy="156" r="4"/><circle cx="654" cy="100" r="4"/><circle cx="666" cy="100" r="4"/><circle cx="654" cy="200" r="4"/><circle cx="666" cy="200" r="4"/><circle cx="710" cy="144" r="4"/><circle cx="710" cy="156" r="4"/></g>
  <text class="s" x="600" y="215">one shared pair, each Cl counts eight</text><text class="s" x="600" y="233">same electronegativity: non-polar</text>
  <text class="s" x="600" y="262">polar covalent when the atoms differ: H-Cl, H-Br, H2O</text>
  <!-- dative -->
  <text class="k" x="990" y="72">Dative bond: one atom donates the pair</text>
  <text class="m" x="900" y="130">H2O + H+</text><text class="m" x="900" y="160">H3O+</text>
  <text class="s" x="900" y="185">oxygen's lone pair</text><text class="s" x="900" y="203">goes to the proton</text>
  <text class="m" x="1080" y="130">C and O</text><text class="m" x="1080" y="160">CO</text>
  <text class="s" x="1080" y="185">double bond plus a pair</text><text class="s" x="1080" y="203">donated by oxygen</text>
  <text class="s" x="990" y="235">ozone O3: O2 + an oxygen free radical; the central O gives a pair</text>
  <text class="s" x="990" y="253">(central atom +, the accepting O -)</text>
  <!-- expanded octets -->
  <path d="M60 290 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="h" x="600" y="325">Expanded octets in polyatomic ions</text>
  <!-- sulfate -->
  <text class="k" x="230" y="365">Sulfate ion SO4 2-</text>
  <text class="e" x="230" y="470">S</text>
  <g font-size="20" font-weight="700" fill="#d7322f" text-anchor="middle"><text x="230" y="395">O</text><text x="230" y="552">O</text><text x="150" y="470">O</text><text x="310" y="470">O</text></g>
  <g stroke="#4b5563" stroke-width="2.5"><path d="M224 400 V450 M236 400 V450"/><path d="M224 482 V532 M236 482 V532"/><path d="M164 464 H214 M246 464 H296"/></g>
  <text class="s" x="230" y="585">two double bonds (8 e) + two single bonds (4 e) = 12 electrons on S</text>
  <text class="s" x="230" y="603">four beyond the octet: the 3d orbitals take them</text>
  <!-- S configuration -->
  <text class="k" x="600" y="365">Sulfur's valence shell</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle"><text x="470" y="400">3s</text><text x="580" y="400">3p</text><text x="740" y="400">3d</text></g>
  <g fill="none" stroke="#4b5563" stroke-width="2"><rect x="455" y="410" width="30" height="26"/><rect x="530" y="410" width="30" height="26"/><rect x="565" y="410" width="30" height="26"/><rect x="600" y="410" width="30" height="26"/><rect x="660" y="410" width="30" height="26"/><rect x="695" y="410" width="30" height="26"/><rect x="730" y="410" width="30" height="26"/><rect x="765" y="410" width="30" height="26"/><rect x="800" y="410" width="30" height="26"/></g>
  <g stroke="#14181f" stroke-width="2"><path d="M464 432 v-16 M476 416 v16 M539 432 v-16 M551 416 v16 M580 432 v-16 M615 432 v-16"/></g>
  <text class="s" x="600" y="458">ground state: two unpaired p electrons</text>
  <g fill="none" stroke="#4b5563" stroke-width="2"><rect x="455" y="475" width="30" height="26"/><rect x="530" y="475" width="30" height="26"/><rect x="565" y="475" width="30" height="26"/><rect x="600" y="475" width="30" height="26"/><rect x="660" y="475" width="30" height="26"/><rect x="695" y="475" width="30" height="26"/><rect x="730" y="475" width="30" height="26"/><rect x="765" y="475" width="30" height="26"/><rect x="800" y="475" width="30" height="26"/></g>
  <g stroke="#14181f" stroke-width="2"><path d="M464 497 v-16 M476 481 v16 M545 497 v-16 M580 497 v-16 M615 497 v-16"/></g>
  <path d="M675 497 v-16" stroke="#d7322f" stroke-width="2"/>
  <path d="M552 478 q60 -30 118 0" fill="none" stroke="#d7322f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text class="s" x="600" y="523">one 3p electron moves to 3d: four unpaired electrons</text>
  <text class="s" x="600" y="541">this explains the variable oxidation states of S</text>
  <text class="s" x="600" y="559">and its room for extra electrons</text>
  <!-- tri-iodide -->
  <text class="k" x="990" y="365">Tri-iodide ion I3-</text>
  <g font-size="22" font-weight="700" fill="#5b3fb5" text-anchor="middle"><text x="900" y="470">I</text><text x="990" y="470">I</text><text x="1080" y="470">I</text></g>
  <g stroke="#4b5563" stroke-width="2.5"><path d="M915 464 H975 M1005 464 H1065"/></g>
  <g fill="#5b3fb5"><circle cx="984" cy="430" r="4"/><circle cx="996" cy="430" r="4"/><circle cx="984" cy="490" r="4"/><circle cx="996" cy="490" r="4"/><circle cx="970" cy="440" r="4"/><circle cx="970" cy="452" r="4"/></g>
  <text class="s" x="990" y="530">central I: two single bonds (4 e)</text><text class="s" x="990" y="548">+ three lone pairs (6 e) = 10 electrons</text>
  <text class="s" x="990" y="566">two beyond the octet</text>
  <rect x="60" y="625" width="1080" height="70" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="652">Period 2 atoms (C, N, O, F) have no d orbitals, so they cannot expand their octet;</text>
  <text class="s" x="600" y="674">period 3 and heavier central atoms (S, P, Cl, I, Xe) can: SO4 2-, ClO4 -, PO4 3-, I3 -. Dots: lone pairs; lines: shared pairs.</text>
</svg>
