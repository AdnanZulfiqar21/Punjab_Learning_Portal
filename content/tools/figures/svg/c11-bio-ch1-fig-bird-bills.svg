<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Bird bills box (C11-BIO, PDF p26, unnumbered side box in Class Aves): flat drawing after the printed picture of three bird heads: top left a black head with a slender yellow-tipped bill ('Insect and seed eater'), top right a black head with a short thick conical bill ('Seed eater'), bottom centre a yellow-and-black head with a thin pointed orange bill ('Insect eater'). The box's printed note is given as the caption. No photograph is reproduced. -->
  <rect width="1000" height="460" fill="#ffffff"/>
  <!-- Insect and seed eater -->
  <path d="M40 150 C40 70 120 30 200 45 C250 55 280 90 290 120 L390 160 C340 175 300 180 280 175 C260 210 210 230 150 225 C80 220 40 200 40 150 Z" fill="#141414"/>
  <path d="M285 118 L392 160 L285 150 Z" fill="#2a2a2a"/>
  <path d="M285 150 L392 160 C350 180 310 185 282 178 Z" fill="#e8c020"/>
  <circle cx="225" cy="100" r="12" fill="#ffffff"/><circle cx="227" cy="100" r="6" fill="#101010"/>
  <!-- Seed eater -->
  <path d="M600 150 C600 70 680 25 760 40 C820 50 850 85 860 110 L940 165 L860 200 C840 225 790 240 730 232 C650 225 600 205 600 150 Z" fill="#141414"/>
  <path d="M858 108 L942 165 L860 202 C870 170 870 140 858 108 Z" fill="#3a3a3a"/>
  <path d="M860 160 L940 165" stroke="#6a6a6a" stroke-width="3"/>
  <circle cx="790" cy="100" r="13" fill="#7a1010"/><circle cx="790" cy="100" r="6" fill="#200404"/>
  <!-- Insect eater -->
  <path d="M330 380 C320 320 370 280 440 280 C490 280 520 300 535 325 L640 340 L535 352 C520 385 480 405 430 405 C380 405 335 400 330 380 Z" fill="#f2c020"/>
  <path d="M345 330 C380 300 430 292 470 300 C440 320 400 335 360 355 Z" fill="#1a1a1a"/>
  <path d="M420 340 C450 355 480 370 520 360" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <path d="M535 325 L640 340 L535 352 Z" fill="#e8502a"/>
  <circle cx="498" cy="318" r="9" fill="#101010"/>
  <!-- labels -->
  <g font-size="22" font-weight="bold" fill="#1a1a1a">
    <path d="M300 168 L250 245" stroke="#1a1a1a" stroke-width="2"/>
    <text x="160" y="270">Insect and</text><text x="160" y="296">seed eater</text>
    <path d="M915 175 L920 240" stroke="#1a1a1a" stroke-width="2"/>
    <text x="840" y="268">Seed eater</text>
    <path d="M600 345 L700 345" stroke="#1a1a1a" stroke-width="2"/>
    <text x="710" y="352">Insect eater</text>
  </g>
</svg>
