<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.11 and 15.12: the four lobes of the cerebrum with the motor, sensory, auditory and visual areas. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Lobes and functional areas of the cerebrum</text>
  <path d="M150.0 300.0 L135.0 250.0 L140.0 200.0 L165.0 150.0 L210.0 110.0 L270.0 85.0 L340.0 72.0 L400.0 70.0 L330.0 250.0 L220.0 290.0 L200.0 312.0 Z" stroke="#475569" stroke-width="2" fill="#bfdbfe" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400.0 70.0 L480.0 78.0 L545.0 98.0 L575.0 115.0 L560.0 250.0 L470.0 245.0 L330.0 250.0 Z" stroke="#475569" stroke-width="2" fill="#fde68a" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M575.0 115.0 L600.0 130.0 L640.0 175.0 L660.0 225.0 L662.0 270.0 L650.0 305.0 L620.0 325.0 L590.0 300.0 L560.0 250.0 Z" stroke="#475569" stroke-width="2" fill="#fbcfe8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M220.0 290.0 L330.0 250.0 L470.0 245.0 L560.0 250.0 L590.0 300.0 L620.0 325.0 L560.0 335.0 L500.0 350.0 L440.0 355.0 L380.0 345.0 L320.0 325.0 L260.0 315.0 L200.0 312.0 Z" stroke="#475569" stroke-width="2" fill="#bbf7d0" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="600.0" cy="380.0" rx="66.0" ry="36.0" stroke="#0f766e" stroke-width="2" fill="#ccfbf1"/>
  <path d="M500 350 L540 350 L530 450 L505 450 Z" stroke="#475569" stroke-width="2" fill="#e2e8f0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="392.0" y1="74.0" x2="322.0" y2="252.0" stroke="#d7322f" stroke-width="12" stroke-linecap="round"/>
  <line x1="410.0" y1="74.0" x2="342.0" y2="252.0" stroke="#1f6fb5" stroke-width="12" stroke-linecap="round"/>
  <line x1="400.0" y1="70.0" x2="330.0" y2="250.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="420.0" cy="285.0" rx="34.0" ry="14.0" stroke="#d98b2b" stroke-width="2" fill="#fed7aa"/>
  <ellipse cx="640.0" cy="245.0" rx="18.0" ry="32.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <text x="220.0" y="200.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700">frontal lobe</text>
  <text x="480.0" y="160.0" font-size="16" fill="#a16207" text-anchor="middle" font-weight="700">parietal lobe</text>
  <text x="605.0" y="205.0" font-size="14" fill="#9d174d" text-anchor="middle" font-weight="700">occipital</text>
  <text x="400.0" y="320.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">temporal lobe</text>
  <text x="600.0" y="386.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">cerebellum</text>
  <text x="60.0" y="55.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">motor area (red): commands to skeletal muscles</text>
  <line x1="56.0" y1="50.0" x2="360.0" y2="110.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="470.0" y="55.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">sensory area (blue): touch, body position</text>
  <line x1="466.0" y1="50.0" x2="390.0" y2="120.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="60.0" y="405.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">auditory cortex: sound</text>
  <line x1="221.3" y1="400.0" x2="410.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="700.0" y="305.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">visual cortex: sight</text>
  <line x1="696.0" y1="300.0" x2="650.0" y2="260.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <rect x="690.0" y="70.0" width="200.0" height="170.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="700.0" y="92.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">frontal: planning,</text>
  <text x="700.0" y="112.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">reasoning, self-control</text>
  <text x="700.0" y="132.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">parietal: senses, body</text>
  <text x="700.0" y="152.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">position, attention</text>
  <text x="700.0" y="172.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">temporal: memory,</text>
  <text x="700.0" y="192.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">language, emotion</text>
  <text x="700.0" y="212.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">occipital: vision</text>
  <text x="450.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">association areas (the rest of the cortex): thinking; language mostly on the left, visual-spatial skills on the right</text>
  <text x="450.0" y="490.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">left side of the brain shown; each hemisphere controls the opposite side of the body</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
