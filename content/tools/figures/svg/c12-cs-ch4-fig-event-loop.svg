  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Roman Urdu figure: the Tkinter event loop for the login example - mainloop waits, the Login click is an event, check_login runs, messagebox shows the message, then mainloop waits again. -->
  <rect x="300.0" y="25.0" width="400.0" height="110.0" rx="14" fill="#dbe8f6" stroke="#2f6fb0" stroke-width="3"/>
  <text x="500.0" y="72.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">mainloop()</text>
  <text x="500.0" y="108.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">event ka intezar</text>
  <rect x="637.0" y="265.0" width="350.0" height="110.0" rx="14" fill="#fdebd3" stroke="#d9892e" stroke-width="3"/>
  <text x="812.0" y="312.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Event:</text>
  <text x="812.0" y="348.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Login dabaya gaya</text>
  <rect x="300.0" y="505.0" width="400.0" height="110.0" rx="14" fill="#dcefe4" stroke="#1e7a4f" stroke-width="3"/>
  <text x="500.0" y="552.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">check_login()</text>
  <text x="500.0" y="588.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">chalta hai</text>
  <rect x="13.0" y="265.0" width="350.0" height="110.0" rx="14" fill="#ece3fa" stroke="#7a4fd0" stroke-width="3"/>
  <text x="188.0" y="312.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">messagebox</text>
  <text x="188.0" y="348.5" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">paigham dikhata hai</text>
