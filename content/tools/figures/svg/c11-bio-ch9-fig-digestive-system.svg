<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="940" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.1, 9.2 and 9.8: the gastrointestinal tract, the salivary glands and the accessory organs. Schematic, not anatomical. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">The human digestive system: a tube from mouth to anus, with accessory organs</text>
  <!-- oral cavity and pharynx -->
  <ellipse cx="520" cy="120" rx="70" ry="38" fill="#f6d5cf" stroke="#b5463a" stroke-width="4"/>
  <text class="s" x="520" y="126" text-anchor="middle">oral cavity</text>
  <!-- salivary glands -->
  <circle cx="612" cy="92" r="13" fill="#f2b134" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="598" cy="150" r="11" fill="#f2b134" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="545" cy="162" r="9" fill="#f2b134" stroke="#d98b2b" stroke-width="2"/>
  <path class="lead" d="M625 92 L700 70"/><text class="k" x="705" y="66">Salivary glands (3 pairs)</text>
  <text class="s" x="705" y="90">parotid, in front of the ear</text>
  <text class="s" x="705" y="112">submaxillary, behind the jaw</text>
  <text class="s" x="705" y="134">sublingual, below the tongue</text>
  <path class="lead" d="M608 150 L700 112"/><path class="lead" d="M553 168 L700 134"/>
  <!-- pharynx and oesophagus -->
  <path d="M520 158 V200" stroke="#b5463a" stroke-width="22" stroke-linecap="round"/>
  <text class="s" x="440" y="190" text-anchor="end">pharynx</text><path class="lead" d="M445 184 L508 184"/>
  <path d="M520 200 V380" stroke="#d98b2b" stroke-width="22"/>
  <text class="k" x="560" y="300">Oesophagus</text><text class="s" x="560" y="322">about 25 cm; peristalsis</text>
  <!-- stomach J shape -->
  <path d="M520 380 q-20 60 10 110 q40 60 110 50 q40 -10 40 -50" fill="none" stroke="#d7322f" stroke-width="40" stroke-linecap="round"/>
  <text class="k" x="660" y="380">Stomach</text><text class="s" x="660" y="402">J-shaped muscular bag;</text><text class="s" x="660" y="424">pepsin and HCl</text>
  <path class="lead" d="M655 390 L570 420"/>
  <!-- liver and gallbladder -->
  <path d="M250 330 q60 -40 180 -10 q20 40 -20 70 q-100 20 -160 -10 q-20 -30 0 -50 z" fill="#8a4b00" stroke="#5a2e00" stroke-width="3" opacity="0.85"/>
  <text class="k" x="150" y="330" text-anchor="end">Liver</text><text class="s" x="150" y="352" text-anchor="end">makes bile; stores</text><text class="s" x="150" y="374" text-anchor="end">glycogen; detoxifies</text>
  <path class="lead" d="M155 326 L250 340"/>
  <ellipse cx="330" cy="405" rx="22" ry="14" fill="#0f7a62" stroke="#0b5a48" stroke-width="2"/>
  <text class="s" x="240" y="445" text-anchor="end">gallbladder: stores bile</text><path class="lead" d="M245 439 L312 412"/>
  <!-- pancreas -->
  <path d="M470 560 q80 -30 180 -20 q30 10 10 30 q-100 20 -190 10 z" fill="#f2b134" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="760" y="560">Pancreas</text><text class="s" x="760" y="582">exocrine: pancreatic juice</text><text class="s" x="760" y="604">endocrine: insulin, glucagon</text>
  <path class="lead" d="M755 556 L660 548"/>
  <!-- bile duct and pancreatic duct into duodenum -->
  <path d="M340 418 q40 60 90 80 q30 20 70 40" fill="none" stroke="#0f7a62" stroke-width="5"/>
  <path d="M470 560 q20 -10 30 -22" fill="none" stroke="#d98b2b" stroke-width="5"/>
  <text class="s" x="330" y="600" text-anchor="end">bile duct and pancreatic duct</text><text class="s" x="330" y="622" text-anchor="end">join and open into the duodenum</text>
  <path class="lead" d="M335 594 L445 512"/>
  <!-- small intestine coils -->
  <path d="M680 490 q-30 80 -120 90 q-80 10 -100 70 q-10 60 60 70 q80 10 120 -40 q40 -40 110 -20 q60 30 20 90 q-50 60 -140 50 q-110 -10 -170 40" fill="none" stroke="#f2b134" stroke-width="26" stroke-linecap="round"/>
  <text class="k" x="560" y="825">Small intestine</text><text class="s" x="560" y="847">about 6 m: duodenum 20-25 cm,</text><text class="s" x="560" y="869">jejunum 2.4 m, ileum 3.5 m;</text><text class="s" x="560" y="891">final digestion and absorption of food</text>
  <path class="lead" d="M600 805 L640 745"/>
  <text class="s" x="700" y="470">duodenum</text><path class="lead" d="M695 476 L668 500"/>
  <!-- large intestine frame -->
  <path d="M300 770 V650 H900 V800" fill="none" stroke="#8a4b00" stroke-width="30" stroke-linecap="round" opacity="0.55"/>
  <circle cx="300" cy="780" r="22" fill="#c9b27a" stroke="#8a4b00" stroke-width="3"/>
  <path d="M300 800 q-10 30 -20 50" stroke="#8a4b00" stroke-width="6" stroke-linecap="round"/>
  <text class="s" x="200" y="800" text-anchor="end">cecum; vermiform</text><text class="s" x="200" y="822" text-anchor="end">appendix (vestigial)</text><path class="lead" d="M205 796 L278 782"/>
  <text class="s" x="240" y="690" text-anchor="end">ascending colon</text><path class="lead" d="M245 684 L286 684"/>
  <text class="s" x="960" y="632">transverse colon:</text><text class="s" x="960" y="654">absorbs water</text><path class="lead" d="M955 640 L905 650"/>
  <text class="s" x="960" y="690">descending colon</text><path class="lead" d="M955 684 L914 684"/>
  <path d="M900 800 V850" stroke="#8a4b00" stroke-width="30" stroke-linecap="round" opacity="0.75"/>
  <text class="s" x="960" y="830">rectum: stores faeces</text><path class="lead" d="M955 824 L915 824"/>
  <circle cx="900" cy="870" r="10" fill="#14181f"/><text class="s" x="960" y="876">anus: two sphincters</text>
  <text class="s" x="600" y="928" text-anchor="middle">Schematic: the large intestine (last metre) is shown as a frame around the coils of the small intestine; it absorbs water, salts and vitamin K.</text>
</svg>
