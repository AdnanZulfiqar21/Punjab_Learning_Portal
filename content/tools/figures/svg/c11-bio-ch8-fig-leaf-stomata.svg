<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 8.4 and 8.5: a leaf in cross-section, and open and closed stomata. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:21px;font-weight:700;fill:#14181f}
      .s{font-size:18px;fill:#4b5563}
      .c{font-size:18px;fill:#4b5563;text-anchor:middle}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="400" y="40">Leaf in cross-section</text>
  <!-- cuticle and upper epidermis -->
  <rect x="100" y="90" width="600" height="12" fill="#c9b27a"/>
  <g fill="#eef6fb" stroke="#1f6fb5" stroke-width="3"><rect x="100" y="102" width="60" height="40"/><rect x="160" y="102" width="60" height="40"/><rect x="220" y="102" width="60" height="40"/><rect x="280" y="102" width="60" height="40"/><rect x="340" y="102" width="60" height="40"/><rect x="400" y="102" width="60" height="40"/><rect x="460" y="102" width="60" height="40"/><rect x="520" y="102" width="60" height="40"/><rect x="580" y="102" width="60" height="40"/><rect x="640" y="102" width="60" height="40"/></g>
  <!-- palisade -->
  <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"><rect x="105" y="146" width="45" height="130" rx="8"/><rect x="160" y="146" width="45" height="130" rx="8"/><rect x="215" y="146" width="45" height="130" rx="8"/><rect x="270" y="146" width="45" height="130" rx="8"/><rect x="325" y="146" width="45" height="130" rx="8"/><rect x="380" y="146" width="45" height="130" rx="8"/><rect x="435" y="146" width="45" height="130" rx="8"/><rect x="490" y="146" width="45" height="130" rx="8"/><rect x="545" y="146" width="45" height="130" rx="8"/><rect x="600" y="146" width="45" height="130" rx="8"/><rect x="655" y="146" width="45" height="130" rx="8"/></g>
  <g fill="#0f7a62"><circle cx="120" cy="170" r="5"/><circle cx="135" cy="220" r="5"/><circle cx="178" cy="190" r="5"/><circle cx="232" cy="240" r="5"/><circle cx="290" cy="175" r="5"/><circle cx="345" cy="230" r="5"/><circle cx="400" cy="185" r="5"/><circle cx="455" cy="245" r="5"/><circle cx="510" cy="170" r="5"/><circle cx="565" cy="225" r="5"/><circle cx="620" cy="190" r="5"/><circle cx="675" cy="240" r="5"/></g>
  <!-- spongy -->
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="3">
    <ellipse cx="140" cy="320" rx="32" ry="24"/><ellipse cx="230" cy="340" rx="34" ry="22"/><ellipse cx="320" cy="315" rx="30" ry="26"/><ellipse cx="420" cy="345" rx="36" ry="22"/><ellipse cx="520" cy="318" rx="30" ry="24"/><ellipse cx="620" cy="340" rx="34" ry="24"/>
    <ellipse cx="180" cy="400" rx="30" ry="22"/><ellipse cx="290" cy="410" rx="34" ry="22"/><ellipse cx="380" cy="395" rx="28" ry="24"/><ellipse cx="480" cy="410" rx="32" ry="22"/><ellipse cx="580" cy="398" rx="30" ry="24"/><ellipse cx="660" cy="405" rx="26" ry="22"/>
  </g>
  <!-- vein -->
  <ellipse cx="400" cy="300" rx="0" ry="0"/>
  <!-- lower epidermis with stoma -->
  <g fill="#eef6fb" stroke="#1f6fb5" stroke-width="3"><rect x="100" y="440" width="70" height="40"/><rect x="170" y="440" width="70" height="40"/><rect x="240" y="440" width="70" height="40"/><rect x="440" y="440" width="70" height="40"/><rect x="510" y="440" width="70" height="40"/><rect x="580" y="440" width="60" height="40"/><rect x="640" y="440" width="60" height="40"/></g>
  <rect x="100" y="480" width="600" height="10" fill="#c9b27a"/>
  <!-- guard cells -->
  <path d="M320 440 q-20 20 0 40 q25 5 40 -5 q-10 -15 0 -30 q-15 -10 -40 -5 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <path d="M430 440 q20 20 0 40 q-25 5 -40 -5 q10 -15 0 -30 q15 -10 40 -5 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <g fill="#0f7a62"><circle cx="340" cy="460" r="4"/><circle cx="410" cy="460" r="4"/></g>
  <!-- gas arrows -->
  <path d="M400 540 L400 495" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="c" x="440" y="570">CO2 in</text>
  <path d="M350 495 L350 540" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="c" x="270" y="570">O2 and water out</text>
  <!-- labels -->
  <path class="lead" d="M700 96 L760 96"/><text class="t" x="765" y="102">Cuticle</text>
  <path class="lead" d="M700 122 L760 140"/><text class="t" x="765" y="146">Upper epidermis</text>
  <path class="lead" d="M700 210 L760 210"/><text class="t" x="765" y="205">Palisade mesophyll</text><text class="s" x="765" y="230">tightly packed, chloroplast-rich;</text><text class="s" x="765" y="252">most photosynthesis</text>
  <path class="lead" d="M700 360 L760 340"/><text class="t" x="765" y="335">Spongy mesophyll</text><text class="s" x="765" y="360">loose cells with air spaces</text>
  <path class="lead" d="M700 460 L760 440"/><text class="t" x="765" y="435">Lower epidermis</text>
  <path class="lead" d="M430 470 L560 640"/><text class="t" x="565" y="645">Guard cells and stoma</text>
  <!-- stomata open and closed -->
  <text class="h" x="960" y="520">Stoma open and closed</text>
  <path d="M860 600 q-40 40 0 80 q40 -10 40 -40 q0 -30 -40 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <path d="M940 600 q40 40 0 80 q-40 -10 -40 -40 q0 -30 40 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <text class="c" x="880" y="710">open: turgid</text>
  <path d="M1040 600 q-20 40 0 80 q20 -10 22 -40 q0 -30 -22 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <path d="M1084 600 q20 40 0 80 q-20 -10 -22 -40 q0 -30 22 -40 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <text class="c" x="1080" y="710">closed: flaccid</text>
  <text class="c" x="960" y="745">K+ and water in: open; K+ and water out: closed</text>
</svg>
