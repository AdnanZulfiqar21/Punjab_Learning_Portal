<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" font-family="'Times New Roman', Times, serif">
  <!-- Example 13(a) graph (C11-MATH, PDF p237): L-shaped axes from O, the line y = x + 3 through the dots (0, 3), (2, 5), (3, 6), (4, 7) and a dashed line from (3, 6) to the x-axis; no break. -->
  <rect width="760" height="860" fill="#fffac2"/>
  <line x1="220" y1="760" x2="734.8" y2="760" stroke="#d6247f" stroke-width="3.5"/>
  <line x1="220" y1="760" x2="220" y2="58" stroke="#d6247f" stroke-width="3.5"/>
  <text x="742.8" y="769" font-size="30" text-anchor="start" fill="#1a1a1a" font-style="italic">x</text>
  <text x="216" y="46" font-size="30" text-anchor="middle" fill="#1a1a1a" font-style="italic">y</text>
  <text x="212" y="798" font-size="30" text-anchor="middle" fill="#1a1a1a" font-style="italic">O</text>
  <line x1="40.6" y1="705.4" x2="625.6" y2="120.4" stroke="#1a9fd6" stroke-width="3.5"/>
  <line x1="454" y1="292" x2="454" y2="760" stroke="#1a9fd6" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="220" cy="526" r="7.5" fill="#1a1a1a"/>
  <text x="206" y="534" font-size="28" text-anchor="end" fill="#1a1a1a">(0, 3)</text>
  <circle cx="376" cy="370" r="7.5" fill="#1a1a1a"/>
  <text x="382" y="410" font-size="28" text-anchor="start" fill="#1a1a1a">(2, 5)</text>
  <circle cx="454" cy="292" r="7.5" fill="#1a1a1a"/>
  <text x="438" y="292" font-size="28" text-anchor="end" fill="#1a1a1a">(3, 6)</text>
  <circle cx="532" cy="214" r="7.5" fill="#1a1a1a"/>
  <text x="548" y="226" font-size="28" text-anchor="start" fill="#1a1a1a">(4, 7)</text>
</svg>
