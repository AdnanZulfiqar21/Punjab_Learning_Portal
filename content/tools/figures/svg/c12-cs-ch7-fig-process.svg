<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original: four steps followed by the decision to reject or fail to reject H0. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Steps in hypothesis testing (after Fig 7.1)</text>
  <rect x="240.0" y="52.0" width="420.0" height="46.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="80.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 state H0 and H1</text>
  <line x1="450.0" y1="99.0" x2="450.0" y2="114.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M450.0 121.0 L446.6 113.7 L453.4 113.7 Z" fill="#14181f"/>
  <rect x="240.0" y="122.0" width="420.0" height="46.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="150.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 set significance level alpha</text>
  <line x1="450.0" y1="169.0" x2="450.0" y2="184.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M450.0 191.0 L446.6 183.7 L453.4 183.7 Z" fill="#14181f"/>
  <rect x="240.0" y="192.0" width="420.0" height="46.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="220.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 collect sample data</text>
  <line x1="450.0" y1="239.0" x2="450.0" y2="254.6" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M450.0 261.0 L446.6 253.7 L453.4 253.7 Z" fill="#14181f"/>
  <rect x="240.0" y="262.0" width="420.0" height="46.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="290.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 compute test statistic and p-value</text>
  <line x1="380.0" y1="309.0" x2="236.9" y2="348.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M230.0 350.0 L236.9 344.2 L238.9 351.5 Z" fill="#14181f"/>
  <line x1="520.0" y1="309.0" x2="663.1" y2="348.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M670.0 350.0 L661.1 351.5 L663.1 344.2 Z" fill="#14181f"/>
  <rect x="80.0" y="352.0" width="300.0" height="56.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="230.0" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">p-value &lt; alpha</text>
  <text x="230.0" y="394.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">reject H0 (evidence for H1)</text>
  <rect x="520.0" y="352.0" width="300.0" height="56.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="378.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">p-value &gt;= alpha</text>
  <text x="670.0" y="394.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">fail to reject H0</text>
  <text x="450.0" y="450.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">'Fail to reject' is safer wording than 'accept': the data simply did not give enough evidence.</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
