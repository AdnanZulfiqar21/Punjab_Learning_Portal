<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="550" fill="#ffffff"/>
<rect x="265" y="20" width="370" height="56" rx="10" fill="#fbe38a" stroke="#b8961f" stroke-width="2.5"/>
<text x="450.0" y="57.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">1. State the Hypothesis</text>
<line x1="450" y1="80" x2="450" y2="106" stroke="#2c4f93" stroke-width="6"/>
<path d="M450.0 114.0 L440.0 96.7 L460.0 96.7 Z" fill="#2c4f93"/>
<rect x="265" y="116" width="370" height="56" rx="10" fill="#dde7f4" stroke="#5a7fa6" stroke-width="2.5"/>
<text x="450.0" y="153.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">2. Set Significance Level</text>
<line x1="450" y1="176" x2="450" y2="202" stroke="#2c4f93" stroke-width="6"/>
<path d="M450.0 210.0 L440.0 192.7 L460.0 192.7 Z" fill="#2c4f93"/>
<rect x="265" y="212" width="370" height="56" rx="10" fill="#bfe3a3" stroke="#4f8a33" stroke-width="2.5"/>
<text x="450.0" y="249.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">3. Collect Data</text>
<line x1="450" y1="272" x2="450" y2="298" stroke="#2c4f93" stroke-width="6"/>
<path d="M450.0 306.0 L440.0 288.7 L460.0 288.7 Z" fill="#2c4f93"/>
<rect x="265" y="308" width="370" height="56" rx="10" fill="#f6c9cc" stroke="#b5545c" stroke-width="2.5"/>
<text x="450.0" y="345.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">4. Perform a Test</text>
<path d="M440 366 Q400 420 200 448" stroke="#3a7cc0" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M176.0 452.0 L197.6 434.2 L202.2 461.8 Z" fill="#3a7cc0"/>
<path d="M460 366 Q500 420 690 444" stroke="#d6453d" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M714.0 448.0 L687.8 457.8 L692.4 430.2 Z" fill="#d6453d"/>
<text x="205.0" y="408.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">If p-value &gt; α</text>
<text x="700.0" y="408.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">If p-value &lt; α</text>
<rect x="40" y="466" width="300" height="60" rx="8" fill="#3f7d2c" stroke="#24521a" stroke-width="2.5"/>
<text x="190.0" y="505.0" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="400">Accept Hypothesis</text>
<rect x="560" y="466" width="300" height="60" rx="8" fill="#d0473f" stroke="#8e2520" stroke-width="2.5"/>
<text x="710.0" y="505.0" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="400">Reject Hypothesis</text>
</svg>
