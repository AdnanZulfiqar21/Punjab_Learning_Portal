<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original schematic for the book's embryonic screening box: a needle guided by an ultrasound probe draws amniotic fluid containing foetal cells, which are cultured and checked for an abnormal chromosome number. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Amniocentesis (weeks 15 to 20 of pregnancy)</text>
  <ellipse cx="330.0" cy="300.0" rx="200.0" ry="170.0" stroke="#be185d" stroke-width="3" fill="#fdf2f8"/>
  <ellipse cx="330.0" cy="300.0" rx="160.0" ry="130.0" stroke="#0ea5e9" stroke-width="2" fill="#e0f2fe"/>
  <circle cx="290.0" cy="270.0" r="38.0" stroke="#a16207" stroke-width="2" fill="#fde68a"/>
  <ellipse cx="350.0" cy="330.0" rx="62.0" ry="44.0" stroke="#a16207" stroke-width="2" fill="#fde68a" transform="rotate(25 350.0 330.0)"/>
  <path d="M380 360 Q410 380 400 400" stroke="#a16207" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M330 360 Q300 330 290 308" stroke="#be185d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="240.0" cy="400.0" rx="50.0" ry="22.0" stroke="#9d174d" stroke-width="2" fill="#fbcfe8"/>
  <rect x="455.0" y="150.0" width="80.0" height="34.0" rx="6" stroke="#475569" stroke-width="2" fill="#cbd5e1"/>
  <path d="M470 184 L360 262" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M500 186 L420 290" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="545.0" y="160.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">ultrasound probe</text>
  <text x="545.0" y="178.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">shows the foetus</text>
  <line x1="400.0" y1="95.0" x2="380.0" y2="215.0" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="392.0" y="65.0" width="16.0" height="32.0" rx="3" stroke="#334155" stroke-width="2" fill="#e2e8f0"/>
  <text x="385.0" y="82.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">long needle into the amniotic sac</text>
  <text x="560.0" y="230.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">1. a little amniotic fluid</text>
  <text x="560.0" y="254.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">   (with foetal cells) is drawn out</text>
  <text x="560.0" y="278.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">2. the cells are grown in a</text>
  <text x="560.0" y="302.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">   culture medium</text>
  <text x="560.0" y="326.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">3. their chromosomes are checked</text>
  <text x="560.0" y="350.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">   for an abnormal number</text>
  <text x="330.0" y="497.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">amniotic fluid (blue) around the foetus; placenta (pink, lower left)</text>
  <text x="560.0" y="410.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">other screening: ultrasound scan,</text>
  <text x="560.0" y="430.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">chorionic villus sampling</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
