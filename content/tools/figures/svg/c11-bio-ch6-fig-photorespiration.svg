<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.21: the reactions of photorespiration across chloroplast, peroxisome and mitochondrion. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .o{font-size:21px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Photorespiration: rubisco adds O2 instead of CO2</text>
  <!-- three organelles -->
  <rect x="40" y="90" width="380" height="560" rx="40" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5"/><text class="o" x="230" y="130">Chloroplast</text>
  <rect x="440" y="90" width="340" height="560" rx="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="5"/><text class="o" x="610" y="130">Peroxisome</text>
  <rect x="800" y="90" width="360" height="560" rx="40" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/><text class="o" x="980" y="130">Mitochondrion</text>
  <!-- chloroplast reactions -->
  <rect x="140" y="170" width="180" height="44" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="230" y="198">RuBP (5C)</text>
  <path d="M230 218 V260" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="320" y="245">+ O2 (rubisco)</text>
  <rect x="55" y="270" width="175" height="44" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="142" y="298">Phosphoglycerate</text>
  <rect x="245" y="270" width="175" height="44" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="332" y="298">Phosphoglycolate</text>
  <text class="s" x="140" y="340">re-enters the</text><text class="s" x="140" y="362">Calvin cycle</text><text class="s" x="620" y="540">2C; Pi removed</text>
  <path d="M325 318 V360" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="250" y="370" width="150" height="44" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="325" y="398">Glycolate</text>
  <path d="M405 392 H495" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- peroxisome reactions -->
  <rect x="500" y="370" width="150" height="44" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="3"/><text class="b" x="575" y="398">Glycolate</text>
  <path d="M575 418 V460" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="680" y="445">+ O2; H2O2 made</text>
  <rect x="500" y="470" width="150" height="44" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="3"/><text class="b" x="575" y="498">Glyoxylate</text>
  <path d="M575 518 V560" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="500" y="570" width="150" height="44" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="3"/><text class="b" x="575" y="598">Glycine</text>
  <path d="M655 592 H845" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- mitochondrion -->
  <rect x="850" y="570" width="170" height="44" rx="10" fill="#fff" stroke="#d98b2b" stroke-width="3"/><text class="b" x="935" y="598">2 Glycine</text>
  <path d="M935 565 V500" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="1040" y="540">CO2 released</text>
  <rect x="850" y="450" width="170" height="44" rx="10" fill="#fff" stroke="#d98b2b" stroke-width="3"/><text class="b" x="935" y="478">Serine</text>
  <path d="M845 472 L655 240" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- back through peroxisome to chloroplast -->
  <rect x="500" y="200" width="150" height="44" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="3"/><text class="b" x="575" y="228">Serine</text>
  <path d="M575 248 V290" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="500" y="300" width="150" height="44" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="3"/><text class="b" x="575" y="328">Glycerate</text>
  <path d="M495 322 L250 322 L142 318" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <text class="s" x="600" y="690">Needs O2, releases CO2 and H2O like respiration, but makes no ATP; C-3 plants lose 25 to 50 percent of fixed carbon, worse above 28 C.</text>
</svg>
