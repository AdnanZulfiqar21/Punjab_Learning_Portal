<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original redraw after Figure 15.10: a chromatogram in which mixture A separates into spots matching B and C; Rf(B) = x/y and Rf(C) = x'/y. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reading a paper chromatogram: Rf values</text>
  <rect x="520.0" y="60.0" width="250.0" height="370.0" rx="0" stroke="#14181f" stroke-width="2" fill="#fffbeb"/>
  <line x1="520.0" y1="390.0" x2="770.0" y2="390.0" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="520.0" y1="110.0" x2="770.0" y2="110.0" stroke="#1f6fb5" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="645.0" y="100.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">solvent front</text>
  <text x="645.0" y="412.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">baseline (pencil line)</text>
  <circle cx="570.0" cy="390.0" r="4.0" stroke="#4b5563" stroke-width="1.4" fill="none"/>
  <text x="570.0" y="455.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <circle cx="645.0" cy="390.0" r="4.0" stroke="#4b5563" stroke-width="1.4" fill="none"/>
  <text x="645.0" y="455.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <circle cx="720.0" cy="390.0" r="4.0" stroke="#4b5563" stroke-width="1.4" fill="none"/>
  <text x="720.0" y="455.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <ellipse cx="570.0" cy="300.0" rx="11.0" ry="8.0" stroke="#1f6fb5" stroke-width="1.5" fill="#60a5fa"/>
  <ellipse cx="645.0" cy="300.0" rx="11.0" ry="8.0" stroke="#1f6fb5" stroke-width="1.5" fill="#60a5fa"/>
  <ellipse cx="570.0" cy="170.0" rx="11.0" ry="8.0" stroke="#14181f" stroke-width="1.5" fill="#334155"/>
  <ellipse cx="720.0" cy="170.0" rx="11.0" ry="8.0" stroke="#14181f" stroke-width="1.5" fill="#334155"/>
  <line x1="495.0" y1="382.0" x2="495.0" y2="118.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M495.0 110.0 L499.2 119.1 L490.8 119.1 Z" fill="#14181f"/>
  <path d="M495.0 390.0 L490.8 380.9 L499.2 380.9 Z" fill="#14181f"/>
  <text x="485.0" y="255.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700" font-style="italic">y</text>
  <line x1="800.0" y1="382.0" x2="800.0" y2="308.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M800.0 300.0 L804.2 309.1 L795.8 309.1 Z" fill="#1f6fb5"/>
  <path d="M800.0 390.0 L795.8 380.9 L804.2 380.9 Z" fill="#1f6fb5"/>
  <text x="810.0" y="352.0" font-size="18" fill="#1f6fb5" text-anchor="start" font-weight="700" font-style="italic">x</text>
  <line x1="845.0" y1="382.0" x2="845.0" y2="178.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M845.0 170.0 L849.2 179.1 L840.8 179.1 Z" fill="#14181f"/>
  <path d="M845.0 390.0 L840.8 380.9 L849.2 380.9 Z" fill="#14181f"/>
  <text x="855.0" y="285.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700" font-style="italic">x'</text>
  <line x1="656.0" y1="300.0" x2="800.0" y2="300.0" stroke="#1f6fb5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <line x1="731.0" y1="170.0" x2="845.0" y2="170.0" stroke="#14181f" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <text x="40.0" y="140.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">Rf = distance moved by the spot</text>
  <text x="80.0" y="162.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">/ distance moved by the solvent</text>
  <text x="40.0" y="220.0" font-size="18" fill="#1f6fb5" text-anchor="start" font-weight="700">Rf(B) = x / y</text>
  <text x="40.0" y="260.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">Rf(C) = x' / y</text>
  <text x="40.0" y="320.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">A is impure: its two spots</text>
  <text x="40.0" y="340.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">match pure B and pure C</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
