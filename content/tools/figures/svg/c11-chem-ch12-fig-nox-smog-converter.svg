<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Table 12.2, Figures 12.4 to 12.6 and Table 12.3: oxides of nitrogen, sources, photochemical smog and PAN, the three-way catalytic converter, nitrification and denitrification. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Oxides of nitrogen: sources, photochemical smog and PAN, the catalytic converter, the nitrogen cycle</text>
  <!-- oxides -->
  <rect x="50" y="55" width="560" height="200" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="330" y="83">Oxides of nitrogen (12.3, Table 12.2)</text>
  <g font-size="11" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="108">Oxide</text><text x="175" y="108">N state</text><text x="225" y="108">Properties</text><text x="430" y="108">Uses</text></g>
    <text x="70" y="132">N2O nitrous oxide</text><text x="175" y="132">+1</text><text x="225" y="132">colourless, sweet, aids combustion</text><text x="430" y="132">anaesthetic, propellant</text>
    <text x="70" y="156">NO nitric oxide</text><text x="175" y="156">+2</text><text x="225" y="156">colourless, paramagnetic, redox</text><text x="430" y="156">biochemical messenger</text>
    <text x="70" y="180">NO2 / N2O4</text><text x="175" y="180">+4</text><text x="225" y="180">NO2 red-brown; N2O4 colourless</text><text x="430" y="180">rocket propellant, HNO3</text>
    <text x="70" y="204">N2O5</text><text x="175" y="204">+5</text><text x="225" y="204">decays to other oxides</text><text x="430" y="204">(Ostwald process via NO2)</text>
  </g>
  <path d="M60 116 H600" stroke="#9ca3af" stroke-width="1"/>
  <text class="f" x="70" y="232">2NO2 (brown) = N2O4 (colourless): cooling favours N2O4;  NO + NO2 = NOx</text>
  <!-- sources -->
  <rect x="630" y="55" width="520" height="200" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="890" y="83">Sources of NOx (12.4)</text>
  <g class="t" style="font-size:12px">
    <text x="650" y="110" style="font-weight:700;fill:#14181f">natural (12.4.1)</text>
    <text x="650" y="128">lightning (N2 + O2 give NO), volcanoes, biological</text>
    <text x="650" y="144">decay, forest fires, soil microorganisms, oceans</text>
    <text x="650" y="170" style="font-weight:700;fill:#14181f">anthropogenic (12.4.2)</text>
    <text x="650" y="188">combustion of fossil fuels in vehicles and power</text>
    <text x="650" y="204">plants; chemical plants, biomass burning, welding</text>
    <text x="650" y="230">Lahore smog: VOCs, NOx, ground-level O3, PM2.5, CO, SO2</text>
  </g>
  <!-- smog and PAN -->
  <rect x="50" y="275" width="560" height="235" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="330" y="303">Photochemical smog and PAN (12.5)</text>
  <g class="f">
    <text x="70" y="330">N2 + O2 --> 2NO</text><text x="300" y="330">2NO + O2 --> 2NO2</text>
    <text x="70" y="350">NO2 --(hv)--> NO + O</text><text x="300" y="350">O + O2 --> O3</text>
    <text x="70" y="370">alkene + O3 --> aldehyde RCHO</text>
    <text x="70" y="390">RCHO + HO. --> RC(=O). (acyl)  + O2 --> RC(=O)OO. (peroxyacyl)</text>
    <text x="70" y="410">RC(=O)OO. + NO2 --> RC(=O)OONO2   (PAN; R = CH3 in peroxyacetyl nitrate)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="438">Los Angeles smog: NOx + volatile organic compounds in sunlight; oxidising</text>
    <text x="70" y="454">(NO2, ozone, PANs); now commoner than classical London smog as NOx rises</text>
    <text x="70" y="474">ozone is the main oxidant: it oxidises hydrocarbons to aldehydes, which go</text>
    <text x="70" y="490">through acyl and peroxyacyl radicals to peroxyacyl nitrates (Figure 12.5)</text>
  </g>
  <!-- converter -->
  <rect x="630" y="275" width="520" height="235" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="890" y="303">Three-way catalytic converter (12.6, Figure 12.6)</text>
  <rect x="700" y="325" width="200" height="60" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <g stroke="#9ca3af" stroke-width="1"><path d="M700 340 H900 M700 355 H900 M700 370 H900 M725 325 V385 M750 325 V385 M775 325 V385 M800 325 V385 M825 325 V385 M850 325 V385 M875 325 V385"/></g>
  <path d="M650 355 H695" stroke="#d7322f" stroke-width="2" marker-end="url(#a)"/><path d="M905 355 H950" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" fill="#4b5563"><text x="636" y="345" style="fill:#d7322f;font-weight:700">HC, CO, NOx</text><text x="955" y="345" style="fill:#0f7a62;font-weight:700">CO2, N2, H2O</text><text x="700" y="400">honeycomb monolith, alumina washcoat, Pt / Pd / Rh dispersed on it</text></g>
  <g class="f">
    <text x="650" y="428">reduction: 2NO + 2CO --> N2 + 2CO2</text>
    <text x="650" y="448">oxidation: 2CO + O2 --> 2CO2</text>
    <text x="650" y="468">           C2H4 + 3O2 --> 2CO2 + 2H2O</text>
  </g>
  <text class="t" x="650" y="496" style="font-size:12px">noble metals catalyse the three redox reactions; they can be recycled</text>
  <!-- nitrogen cycle -->
  <rect x="50" y="530" width="1100" height="140" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="558">Nitrification and denitrification (12.7, Table 12.3)</text>
  <g class="f">
    <text x="70" y="586">nitrification (aerobic, pH 6.5-8.0, 20-30 C): NH4+ -> NO2- -> NO3-</text>
    <text x="70" y="604">2NH4+ + 3O2 --> 2NO2- + 4H+ + 2H2O;   2NO2- + O2 --> 2NO3-</text>
    <text x="620" y="586">denitrification (anaerobic, pH 7.0-9.0, 26-38 C):</text>
    <text x="620" y="604">NO3- -> NO2- -> NO -> N2O -> N2;  2NO3- + 10e- + 12H+ -> N2 + 6H2O</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="630">plants take up nitrite and nitrate (they cannot use N2 directly); nitrifying bacteria oxidise ammonium</text>
    <text x="620" y="630">returns nitrogen to the air; used in wastewater treatment to remove nitrogen</text>
    <text x="70" y="652">both are phases of the nitrogen cycle; both are used in wastewater treatment</text>
  </g>
  <text class="s" x="600" y="690" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
