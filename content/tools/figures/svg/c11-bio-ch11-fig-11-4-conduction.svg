<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 11.4 (C11-BIO, PDF p239): heart cut open from the front (aorta arching on top, superior vena cava at top left, pulmonary trunk in front), showing the SA node in the right atrium, the AV node, the AV bundle dividing into left and right branches in the septum, and Purkinje fibres in the ventricle walls. Original flat drawing after the printed figure. -->
