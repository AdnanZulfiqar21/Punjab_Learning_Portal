    <path d="M482 195 L520 188 M488 225 L522 222" stroke="#c8243c" stroke-width="16" stroke-linecap="round"/>
    <path d="M228 110 L228 260" stroke="#2a5a9a" stroke-width="58"/>
    <path d="M228 110 L228 260" stroke="#6aa0dc" stroke-width="50"/>
    <ellipse cx="228" cy="108" rx="29" ry="10" fill="#a8cdf0" stroke="#2a5a9a" stroke-width="3"/>
