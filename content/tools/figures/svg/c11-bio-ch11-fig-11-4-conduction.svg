    <!-- labels -->
    <g font-size="16" fill="#222">
      <text x="30" y="240">SA node</text>
      <text x="548" y="186">AV node</text>
      <text x="622" y="326">Left branch</text><text x="622" y="346">of AV bundle</text>
      <text x="30" y="530">Right branch</text><text x="30" y="550">of AV bundle</text>
      <text x="556" y="530">Purkinje</text><text x="556" y="550">fibres</text>
    </g>
    <g stroke="#333" stroke-width="1.5">
      <line x1="98" y1="235" x2="198" y2="260"/>
