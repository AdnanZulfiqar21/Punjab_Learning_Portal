    <path d="M378 215 C366 150 400 120 452 116" stroke="#6aa0dc" stroke-width="40" fill="none"/>
    <ellipse cx="458" cy="117" rx="9" ry="24" fill="#a8cdf0" stroke="#2a5a9a" stroke-width="3"/>
    <!-- heart wall (cut) -->
    <path d="M180 255 C168 330 175 420 210 490 C250 560 330 598 420 592 C480 582 540 520 560 430 C580 340 570 262 522 212 C472 190 400 192 320 200 C262 205 200 215 180 255 Z" fill="#f2c99a" stroke="#c08a58" stroke-width="3"/>
    <!-- chambers -->
    <g fill="#7a5232" stroke="#5a381e" stroke-width="2">
      <path d="M200 272 C230 236 290 230 322 246 C334 290 322 330 300 352 C258 362 216 356 200 330 Z"/>
      <path d="M342 232 C382 210 432 210 452 232 C458 270 442 300 412 312 C380 302 352 282 342 232 Z"/>
      <path d="M210 372 C252 378 302 372 342 348 C360 405 372 475 382 560 C320 568 252 532 226 472 C210 432 206 402 210 372 Z"/>
      <path d="M402 334 C442 322 482 312 520 302 C546 362 540 442 506 520 C476 552 442 562 414 556 C404 472 394 402 402 334 Z"/>
    </g>
    <path d="M246 300 C262 290 280 300 288 320 M420 260 C432 250 445 262 440 280" stroke="#9a7048" stroke-width="5" fill="none"/>
    <!-- conduction system -->
    <g stroke="#232a7a" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M206 262 C240 250 280 270 312 296"/>
      <path d="M206 262 C215 300 260 320 312 296"/>
      <path d="M206 262 C230 230 300 240 320 260 C330 275 322 290 312 296"/>
      <path d="M312 296 C330 315 350 330 372 350"/>
      <path d="M372 350 C360 420 362 500 382 560 C350 565 300 550 268 525 C245 500 228 450 230 400"/>
      <path d="M372 350 C392 410 404 480 414 552 C450 540 490 500 508 440 C520 400 522 350 515 315"/>
    </g>
    <g stroke="#232a7a" stroke-width="1.8" fill="none">
      <path d="M268 525 L262 545 M290 540 L288 560 M320 552 L322 572 M350 560 L352 580 M240 470 L222 480 M232 430 L214 432 M245 500 L230 515"/>
      <path d="M440 548 L446 566 M470 530 L482 545 M494 505 L512 516 M508 470 L528 474 M516 420 L538 420 M518 380 L540 375 M515 340 L536 332"/>
