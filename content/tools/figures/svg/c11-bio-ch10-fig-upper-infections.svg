<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.10 and 10.11: the sinuses around the nasal cavity, and the middle ear with the Eustachian tube. Schematic. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <!-- sinuses: front view of face -->
  <text class="h" x="300" y="40">Sinusitis: the sinuses</text>
  <path d="M300 90 q-150 0 -150 170 q0 190 150 230 q150 -40 150 -230 q0 -170 -150 -170 z" fill="#fff4e2" stroke="#d98b2b" stroke-width="4"/>
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3">
    <path d="M230 170 h50 v40 h-50 z M320 170 h50 v40 h-50 z"/>
    <ellipse cx="300" cy="140" rx="60" ry="18"/>
    <ellipse cx="245" cy="290" rx="35" ry="40"/><ellipse cx="355" cy="290" rx="35" ry="40"/>
    <rect x="285" y="225" width="30" height="30" rx="6"/>
  </g>
  <path d="M300 262 v68" stroke="#b5463a" stroke-width="6"/>
  <text class="s" x="300" y="146" style="font-size:14px;fill:#14181f">above the eyes</text>
  <text class="s" x="255" y="195" style="font-size:14px;fill:#14181f">eye</text><text class="s" x="345" y="195" style="font-size:14px;fill:#14181f">eye</text>
  <text class="s" x="300" y="246" style="font-size:13px;fill:#14181f">between</text>
  <text class="s" x="245" y="296" style="font-size:14px;fill:#14181f">under</text><text class="s" x="355" y="296" style="font-size:14px;fill:#14181f">under</text>
  <text class="s" x="300" y="360">nasal cavity</text>
  <text class="s" x="300" y="440">four paired air-filled spaces around the nasal cavity:</text><text class="s" x="300" y="462">under, above, between and behind the eyes</text>
  <text class="s" x="300" y="500">inflamed lining: acute (7-10 days) or chronic (over 12 weeks);</text><text class="s" x="300" y="522">mostly viral, some bacterial, rarely fungal</text>
  <text class="s" x="300" y="560">fever, blocked nose, pus-like discharge, lost smell, facial pain,</text><text class="s" x="300" y="582">post-nasal drip, headache worse on bending</text>
  <!-- otitis media: ear schematic -->
  <text class="h" x="880" y="40">Otitis media: the middle ear</text>
  <path d="M640 200 q40 -80 110 -20 q30 30 10 70 q-30 40 -70 30" fill="none" stroke="#d98b2b" stroke-width="10" stroke-linecap="round"/>
  <path d="M700 230 h110" stroke="#fff4e2" stroke-width="30"/><path d="M700 230 h110" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <text class="s" x="740" y="300">outer ear canal</text>
  <path d="M812 200 v60" stroke="#8a4b00" stroke-width="6"/><text class="s" x="785" y="180" style="font-size:14px">eardrum</text>
  <rect x="815" y="190" width="120" height="90" rx="14" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/>
  <text class="k" x="875" y="230">middle ear</text><text class="s" x="875" y="252" style="font-size:14px">fluid, bacteria,</text><text class="s" x="875" y="270" style="font-size:14px">viruses</text>
  <path d="M880 280 q-20 80 -80 110" fill="none" stroke="#0f7a62" stroke-width="12" stroke-linecap="round"/>
  <text class="s" x="760" y="420">Eustachian tube to the pharynx:</text><text class="s" x="760" y="442">if it cannot drain, fluid collects</text>
  <circle cx="990" cy="235" r="40" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="s" x="990" y="241" style="font-size:14px">inner ear</text>
  <text class="s" x="880" y="500">acute (rapid onset) or chronic (over six weeks)</text>
  <text class="s" x="880" y="540">severe ear pain, pulling at the ear, fever, fluid draining,</text><text class="s" x="880" y="562">loss of balance, hearing difficulty</text>
  <text class="s" x="880" y="600">treated with pain killers and, if bacterial, antibiotics</text>
</svg>
