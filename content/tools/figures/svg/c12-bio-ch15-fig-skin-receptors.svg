  <text x="362.0" y="201.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <circle cx="600.0" cy="260.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="600.0" y="265.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <text x="618.0" y="260.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Meissner's corpuscle</text>
  <text x="618.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">light touch, vibration</text>
  <circle cx="474.0" cy="286.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="474.0" y="291.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <circle cx="600.0" cy="310.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="600.0" y="315.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <text x="618.0" y="310.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Ruffini ending</text>
  <text x="618.0" y="328.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">stretching, sustained pressure</text>
  <circle cx="548.0" cy="400.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="548.0" y="405.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <circle cx="600.0" cy="360.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="600.0" y="365.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <text x="618.0" y="360.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Pacinian corpuscle</text>
  <text x="618.0" y="378.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">deep pressure, vibration</text>
  <text x="450.0" y="505.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">each ending belongs to a sensory neuron; signals go to the spinal cord and the brain</text>
