  <text x="618.0" y="178.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">pain (nociceptors), temperature</text>
  <circle cx="270.0" cy="166.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
