<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.8: overview of photosynthesis in the chloroplast. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .b{font-size:21px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .t{font-size:20px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Overview of photosynthesis</text>
  <!-- chloroplast outline -->
  <ellipse cx="600" cy="360" rx="520" ry="250" fill="#e1f3ec" stroke="#0f7a62" stroke-width="8"/>
  <text class="s" x="600" y="140">chloroplast</text>
  <!-- light-dependent box (grana) -->
  <rect x="170" y="230" width="340" height="260" rx="18" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <text class="t" x="340" y="270">Light-dependent reactions</text>
  <text class="s" x="340" y="298">in the thylakoids of the grana</text>
  <g fill="#2f9a7e" stroke="#0a5a48" stroke-width="2"><rect x="280" y="330" width="120" height="14" rx="7"/><rect x="280" y="350" width="120" height="14" rx="7"/><rect x="280" y="370" width="120" height="14" rx="7"/><rect x="280" y="390" width="120" height="14" rx="7"/></g>
  <text class="s" x="340" y="440">water is split; oxygen released;</text><text class="s" x="340" y="466">ATP and NADPH made</text>
  <!-- light-independent box (stroma) -->
  <rect x="690" y="230" width="340" height="260" rx="18" fill="#fff4e2" stroke="#d98b2b" stroke-width="4"/>
  <text class="t" x="860" y="270">Light-independent reactions</text>
  <text class="s" x="860" y="298">in the stroma (Calvin cycle)</text>
  <circle cx="860" cy="370" r="45" fill="none" stroke="#d98b2b" stroke-width="6" stroke-dasharray="20 10"/>
  <text class="s" x="860" y="440">CO2 is reduced to sugar using</text><text class="s" x="860" y="466">the ATP and NADPH</text>
  <!-- flows between -->
  <path d="M515 320 H685" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="600" y="310">ATP, NADPH</text>
  <path d="M685 420 H515" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="600" y="450">ADP + Pi, NADP+</text>
  <!-- inputs and outputs -->
  <rect x="30" y="200" width="110" height="46" rx="10" fill="#f2b134"/><text class="b" x="85" y="230" style="fill:#14181f">light</text>
  <path d="M145 223 L170 260" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="30" y="330" width="110" height="46" rx="10" fill="#1f6fb5"/><text class="b" x="85" y="360">H2O</text>
  <path d="M145 353 L170 353" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="30" y="460" width="110" height="46" rx="10" fill="#0f7a62"/><text class="b" x="85" y="490">O2</text>
  <path d="M170 450 L145 480" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="1060" y="300" width="110" height="46" rx="10" fill="#9ca3af"/><text class="b" x="1115" y="330">CO2</text>
  <path d="M1055 323 L1030 340" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="1060" y="420" width="110" height="46" rx="10" fill="#d98b2b"/><text class="b" x="1115" y="450">sugar</text>
  <path d="M1030 420 L1055 440" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="600" y="640">6CO2 + 12H2O + light gives C6H12O6 + 6O2 + 6H2O. Water is oxidised, carbon dioxide is reduced: a redox process.</text>
</svg>
