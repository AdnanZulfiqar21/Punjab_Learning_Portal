<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.6: the axial filament of a spirochaete, shown straightened for clarity. -->
  <defs>
    <style>
      .t{font-size:28px;font-weight:700;fill:#14181f}
      .s{font-size:22px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- outer membrane -->
  <rect x="100" y="250" width="800" height="200" rx="100" fill="#f3e9d2" stroke="#d98b2b" stroke-width="6"/>
  <!-- cell body -->
  <rect x="150" y="300" width="700" height="100" rx="50" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="6"/>
  <!-- fibrils anchored at the left pole, running right -->
  <g stroke="#0f7a62" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M165 282 C 300 275, 450 285, 600 278"/>
    <path d="M165 418 C 300 425, 450 415, 600 422"/>
  </g>
  <!-- fibrils anchored at the right pole, running left -->
  <g stroke="#5b3fb5" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M835 282 C 700 275, 550 285, 400 278"/>
    <path d="M835 418 C 700 425, 550 415, 400 422"/>
  </g>
  <circle cx="165" cy="282" r="8" fill="#0f7a62"/><circle cx="165" cy="418" r="8" fill="#0f7a62"/>
  <circle cx="835" cy="282" r="8" fill="#5b3fb5"/><circle cx="835" cy="418" r="8" fill="#5b3fb5"/>
  <!-- labels -->
  <path class="lead" d="M500 252 L500 150"/><text class="t" x="380" y="135">Outer membrane</text>
  <path class="lead" d="M700 350 L820 600"/><text class="t" x="760" y="640">Cell body</text>
  <path class="lead" d="M250 273 L180 160"/><text class="t" x="60" y="140">Periplasmic space</text>
  <path class="lead" d="M300 425 L220 590"/><text class="t" x="80" y="630">Fibrils from the left pole</text>
  <path class="lead" d="M560 425 L560 560"/><text class="t" x="430" y="600">Fibrils from the right pole</text>
  <text class="s" x="100" y="80">The two sets overlap along the middle of the cell: together they form the axial filament.</text>
  <text class="s" x="100" y="675">Drawn straightened; a real spirochaete is a long spiral.</text>
</svg>
