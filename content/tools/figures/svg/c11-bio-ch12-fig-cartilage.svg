<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 12.4: the three types of cartilage and the structure shared by all. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <!-- hyaline -->
  <text class="h" x="220" y="40">Hyaline cartilage</text>
  <rect x="80" y="70" width="280" height="200" rx="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
  <g fill="#ffffff" stroke="#1f6fb5" stroke-width="2"><ellipse cx="140" cy="120" rx="18" ry="13"/><ellipse cx="210" cy="150" rx="18" ry="13"/><ellipse cx="290" cy="110" rx="18" ry="13"/><ellipse cx="160" cy="210" rx="18" ry="13"/><ellipse cx="250" cy="225" rx="18" ry="13"/><ellipse cx="310" cy="180" rx="18" ry="13"/></g>
  <g fill="#1f6fb5"><circle cx="140" cy="120" r="5"/><circle cx="210" cy="150" r="5"/><circle cx="290" cy="110" r="5"/><circle cx="160" cy="210" r="5"/><circle cx="250" cy="225" r="5"/><circle cx="310" cy="180" r="5"/></g>
  <text class="s" x="220" y="300">most common; smooth, glassy matrix</text><text class="s" x="220" y="320">nose, trachea, and the articular</text><text class="s" x="220" y="340">surfaces of bones in joints</text>
  <!-- fibrocartilage -->
  <text class="h" x="600" y="40">Fibrocartilage</text>
  <rect x="460" y="70" width="280" height="200" rx="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <g stroke="#c9b27a" stroke-width="3" fill="none"><path d="M470 100 q70 20 140 0 q70 -20 130 0 M470 140 q70 20 140 0 q70 -20 130 0 M470 180 q70 20 140 0 q70 -20 130 0 M470 220 q70 20 140 0 q70 -20 130 0 M470 255 q70 20 140 0 q70 -20 130 0"/></g>
  <g fill="#ffffff" stroke="#d98b2b" stroke-width="2"><ellipse cx="540" cy="120" rx="16" ry="11"/><ellipse cx="660" cy="160" rx="16" ry="11"/><ellipse cx="560" cy="200" rx="16" ry="11"/><ellipse cx="680" cy="240" rx="16" ry="11"/></g>
  <g fill="#d98b2b"><circle cx="540" cy="120" r="4"/><circle cx="660" cy="160" r="4"/><circle cx="560" cy="200" r="4"/><circle cx="680" cy="240" r="4"/></g>
  <text class="s" x="600" y="300">dense bundles of collagen for high</text><text class="s" x="600" y="320">stress and tension: intervertebral</text><text class="s" x="600" y="340">discs and the pubic symphysis</text>
  <!-- elastic -->
  <text class="h" x="980" y="40">Elastic cartilage</text>
  <rect x="840" y="70" width="280" height="200" rx="14" fill="#f3e8ff" stroke="#5b3fb5" stroke-width="5"/>
  <g stroke="#5b3fb5" stroke-width="2" fill="none"><path d="M850 110 q30 -30 60 0 q30 30 60 0 q30 -30 60 0 q30 30 60 0 M850 170 q30 30 60 0 q30 -30 60 0 q30 30 60 0 q30 -30 60 0 M850 230 q30 -30 60 0 q30 30 60 0 q30 -30 60 0 q30 30 60 0"/></g>
  <g fill="#ffffff" stroke="#5b3fb5" stroke-width="2"><ellipse cx="900" cy="140" rx="16" ry="11"/><ellipse cx="1010" cy="130" rx="16" ry="11"/><ellipse cx="950" cy="200" rx="16" ry="11"/><ellipse cx="1060" cy="205" rx="16" ry="11"/></g>
  <g fill="#5b3fb5"><circle cx="900" cy="140" r="4"/><circle cx="1010" cy="130" r="4"/><circle cx="950" cy="200" r="4"/><circle cx="1060" cy="205" r="4"/></g>
  <text class="s" x="980" y="300">many elastic fibres: springs back</text><text class="s" x="980" y="320">into shape; the external ear</text><text class="s" x="980" y="340">and the epiglottis</text>
  <rect x="80" y="380" width="1040" height="150" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="410">What all cartilage shares</text>
  <text class="s" x="600" y="436">a perichondrium of connective tissue with blood vessels, lymph vessels and nerves surrounds it; inside is a matrix of</text>
  <text class="s" x="600" y="456">collagen, elastin, proteoglycans and other fibres (strength, flexibility, resistance to compression) with no blood vessels,</text>
  <text class="s" x="600" y="476">so its cells are fed by diffusion and it heals very slowly; the cells, chondrocytes, sit in lacunae and make and maintain the matrix.</text>
  <text class="s" x="600" y="508">Most foetal cartilage becomes bone; what remains gives flexibility between bones, at the nose tip, in the outer ear and along the trachea.</text>
  <text class="s" x="600" y="550">Ovals: chondrocytes in lacunae. Lines: collagen bundles (fibrocartilage) or elastic fibres (elastic cartilage).</text>
</svg>
