<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.1 and 11.2: the layers around the heart, its chambers, valves and the flow of blood. Schematic. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="640" y="40">The heart: chambers, valves and the path of blood</text>
  <!-- vessels above -->
  <rect x="330" y="80" width="70" height="120" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="s" x="365" y="70">superior vena cava</text>
  <rect x="520" y="80" width="70" height="120" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="s" x="555" y="70">pulmonary trunk</text>
  <rect x="700" y="80" width="70" height="120" fill="#f6d5cf" stroke="#d7322f" stroke-width="3"/><text class="s" x="735" y="70">aorta</text>
  <rect x="880" y="80" width="70" height="120" fill="#f6d5cf" stroke="#d7322f" stroke-width="3"/><text class="s" x="915" y="70">pulmonary veins</text>
  <!-- chambers -->
  <rect x="300" y="200" width="200" height="160" rx="16" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/><text class="k" x="400" y="240">Right atrium</text><text class="s" x="400" y="266">thin wall; receives</text><text class="s" x="400" y="288">deoxygenated blood</text><text class="s" x="400" y="310">from the venae cavae</text>
  <rect x="780" y="200" width="200" height="160" rx="16" fill="#f6d5cf" stroke="#d7322f" stroke-width="4"/><text class="k" x="880" y="240">Left atrium</text><text class="s" x="880" y="266">thin wall; receives</text><text class="s" x="880" y="288">oxygenated blood from</text><text class="s" x="880" y="310">the pulmonary veins</text>
  <rect x="300" y="420" width="300" height="220" rx="16" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="6"/><text class="k" x="420" y="470">Right ventricle</text><text class="s" x="420" y="496">thick wall; pumps to</text><text class="s" x="420" y="518">the lungs through the</text><text class="s" x="420" y="540">pulmonary trunk</text>
  <rect x="680" y="420" width="300" height="220" rx="16" fill="#f6d5cf" stroke="#d7322f" stroke-width="12"/><text class="k" x="860" y="470">Left ventricle</text><text class="s" x="860" y="496">wall about 3 times</text><text class="s" x="860" y="518">thicker; pumps to</text><text class="s" x="860" y="540">the whole body</text>
  <!-- septa -->
  <rect x="612" y="200" width="56" height="160" fill="#f2b134" opacity="0.6"/><text class="s" x="640" y="285" style="font-size:13px">interatrial</text><text class="s" x="640" y="301" style="font-size:13px">septum</text>
  <rect x="604" y="420" width="72" height="220" fill="#f2b134"/><text class="s" x="640" y="525" style="font-size:13px">interventricular</text><text class="s" x="640" y="541" style="font-size:13px">septum (thicker)</text>
  <rect x="300" y="365" width="680" height="50" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="640" y="395" style="font-size:14px">atrioventricular septum</text>
  <!-- AV valves -->
  <path d="M370 365 l30 40 l30 -40" fill="#14181f"/><text class="s" x="450" y="668" style="fill:#14181f;font-weight:700">tricuspid valve (3 cusps)</text>
  <path d="M850 365 l30 40 l30 -40" fill="#14181f"/><text class="s" x="830" y="668" style="fill:#14181f;font-weight:700">bicuspid (mitral) valve (2 cusps)</text>
  <!-- semilunar valves at exits -->
  <path d="M525 420 q30 -20 60 0" fill="none" stroke="#14181f" stroke-width="5"/><text class="s" x="500" y="408" style="font-size:13px;fill:#14181f">pulmonary valve</text>
  <path d="M705 420 q30 -20 60 0" fill="none" stroke="#14181f" stroke-width="5"/><text class="s" x="775" y="408" style="font-size:13px;fill:#14181f">aortic valve</text>
  <!-- flow arrows -->
    <g stroke="#1f6fb5" stroke-width="5" fill="none" marker-end="url(#ab)"><path d="M365 110 v80"/><path d="M400 330 v85"/><path d="M560 560 V110"/></g>
  <g stroke="#d7322f" stroke-width="5" fill="none" marker-end="url(#ar)"><path d="M915 110 v80"/><path d="M880 330 v85"/><path d="M735 560 V110"/></g>
  <text class="s" x="150" y="255">inferior</text><text class="s" x="150" y="275">vena cava</text><path d="M150 285 v30 h150" fill="none" stroke="#1f6fb5" stroke-width="6"/>
  <!-- pericardium and wall -->
  <text class="h" x="640" y="700">Around and in the wall of the heart</text>
  <g font-size="15" fill="#4b5563" text-anchor="middle">
    <text x="640" y="728">fibrous pericardium (outer, strong connective tissue: protects, limits dilation) then serous pericardium:</text>
    <text x="640" y="750">parietal layer, pericardial cavity with up to 50 mL fluid (lubricates, protects from infection), visceral layer = epicardium.</text>
    <text x="640" y="778">Wall: epicardium outside, myocardium (cardiac muscle, thickest) in the middle, endocardium (one layer of epithelium) lining the chambers.</text>
    <text x="640" y="804">Blue: deoxygenated blood (right side). Red: oxygenated blood (left side). The two never mix in a healthy heart.</text>
  </g>
</svg>
