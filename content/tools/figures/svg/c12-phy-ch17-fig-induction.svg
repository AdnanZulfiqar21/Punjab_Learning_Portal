  <text x="225.0" y="412.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the coil itself, inducing an opposing emf</text>
  <text x="225.0" y="440.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">N phi = L I;   e</tspan><tspan dy="4.5" font-size="9.8">L</tspan><tspan dy="-4.5"> = -L dI/dt;   U = (1/2) L I</tspan><tspan dy="-5.9" font-size="9.8">2</tspan></text>
  <rect x="455.0" y="55.0" width="430.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">mutual induction</text>
