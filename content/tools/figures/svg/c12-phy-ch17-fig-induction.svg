<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Figs 17.18 and 17.20: a coil in series with a switch, battery and rheostat whose changing current induces an emf in the coil itself (N phi = LI, emf = -L dI/dt, energy (1/2)LI2); and two neighbouring coils, a primary with a battery and rheostat and a secondary with a galvanometer, showing mutual induction (emf = -M dIp/dt). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Self-induction and mutual induction (after Figs 17.18 and 17.20)</text>
