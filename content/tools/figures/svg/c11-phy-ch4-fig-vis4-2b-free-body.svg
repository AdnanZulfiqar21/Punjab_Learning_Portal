  <!-- Class XI Physics Example 4.4 (PDF page 86), original drawing after the printed free-body diagram: on a 24-degree slope the weight mg resolves into mg sin 24 down the slope and mg cos 24 into the slope; F_N acts away from the slope and the friction f acts up the slope. -->
