<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 8.1 to 8.3: pitcher plant, Venus fly trap and sundew, drawn schematically. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <!-- pitcher -->
  <text class="h" x="200" y="40">Pitcher plant</text>
  <path d="M140 160 q-30 200 60 300 q90 -100 60 -300 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6"/>
  <path d="M150 400 q50 60 100 0 v60 q-50 20 -100 0 z" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M130 160 q70 -70 150 0 q-30 -40 -75 -40 q-45 0 -75 40 z" fill="#2f9a7e" stroke="#0f7a62" stroke-width="5"/>
  <g stroke="#0f7a62" stroke-width="3"><path d="M150 190 l10 15 M175 180 l6 16 M225 180 l-6 16 M250 190 l-10 15"/></g>
  <circle cx="200" cy="300" r="8" fill="#14181f"/>
  <text class="s" x="200" y="510">leaf modified into a water-filled</text><text class="s" x="200" y="534">sac with a hood; stiff hairs stop</text><text class="s" x="200" y="558">insects crawling out</text>
  <!-- venus fly trap -->
  <text class="h" x="600" y="40">Venus fly trap</text>
  <path d="M470 300 q50 -150 130 -100 q-20 60 -130 100 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6"/>
  <path d="M730 300 q-50 -150 -130 -100 q20 60 130 100 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6"/>
  <g stroke="#0f7a62" stroke-width="4"><path d="M500 210 l-10 -30 M530 190 l-5 -30 M670 190 l5 -30 M700 210 l10 -30"/></g>
  <g stroke="#d98b2b" stroke-width="3"><path d="M560 230 l8 20 M540 250 l8 20 M640 230 l-8 20 M660 250 l-8 20"/></g>
  <circle cx="600" cy="270" r="8" fill="#14181f"/>
  <path d="M600 300 v120" stroke="#0f7a62" stroke-width="8"/>
  <text class="s" x="600" y="510">two hinged lobes; trichomes (orange)</text><text class="s" x="600" y="534">trigger closure on contact; bristles</text><text class="s" x="600" y="558">interlock and glands digest the prey</text>
  <!-- sundew -->
  <text class="h" x="1000" y="40">Sundew</text>
  <ellipse cx="1000" cy="290" rx="110" ry="60" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6"/>
  <g stroke="#d98b2b" stroke-width="4">
    <path d="M920 260 l-30 -50 M950 245 l-15 -55 M985 238 l-5 -60 M1020 238 l5 -60 M1055 245 l15 -55 M1085 260 l30 -50 M910 300 l-55 0 M1090 300 l55 0 M930 325 l-30 40 M1070 325 l30 40"/>
  </g>
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2">
    <circle cx="890" cy="210" r="8"/><circle cx="935" cy="190" r="8"/><circle cx="980" cy="178" r="8"/><circle cx="1025" cy="178" r="8"/><circle cx="1070" cy="190" r="8"/><circle cx="1115" cy="210" r="8"/><circle cx="855" cy="300" r="8"/><circle cx="1145" cy="300" r="8"/><circle cx="900" cy="365" r="8"/><circle cx="1100" cy="365" r="8"/>
  </g>
  <circle cx="1000" cy="200" r="7" fill="#14181f"/>
  <text class="s" x="1000" y="510">tentacle-like hairs each tipped with a</text><text class="s" x="1000" y="534">drop of sticky dew; odour attracts</text><text class="s" x="1000" y="558">insects, enzymes digest them</text>
  <text class="s" x="600" y="615">All insectivorous plants are true autotrophs; the nitrogen of captured insects speeds their growth.</text>
</svg>
