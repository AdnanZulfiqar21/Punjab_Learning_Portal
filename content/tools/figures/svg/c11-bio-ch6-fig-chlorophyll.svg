<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.4: the chlorophyll molecule, with the one group that differs between chlorophyll a and b. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563}
      .t{font-size:22px;font-weight:700;fill:#14181f}
      .c{font-size:20px;fill:#14181f;text-anchor:middle;font-family:Consolas, Courier New, monospace}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <text class="h" x="600" y="50">Chlorophyll: a hydrophilic head and a hydrophobic tail</text>
  <!-- porphyrin head: four pyrrole rings around Mg -->
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="5" stroke-linejoin="round">
    <polygon points="330,210 380,180 430,210 415,265 345,265"/>
    <polygon points="470,250 525,235 555,285 520,330 465,310"/>
    <polygon points="430,390 415,335 345,335 330,390 380,420"/>
    <polygon points="290,250 235,235 205,285 240,330 295,310"/>
  </g>
  <g stroke="#0f7a62" stroke-width="4"><path d="M430 210 L470 250 M520 330 L430 390 M330 390 L240 330 M290 250 L330 210"/></g>
  <circle cx="380" cy="300" r="34" fill="#d98b2b"/><text class="c" x="380" y="308" style="fill:#fff;font-weight:700">Mg</text>
  <g stroke="#4b5563" stroke-width="2" stroke-dasharray="4 4"><path d="M380 266 V240 M414 300 H465 M380 334 V360 M346 300 H295"/></g>
  <!-- the differing group on ring II -->
  <rect x="560" y="200" width="150" height="40" rx="8" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <text class="c" x="635" y="228">CH3 or CHO</text>
  <path d="M555 240 L530 255" stroke="#d98b2b" stroke-width="3"/>
  <text class="s" x="560" y="270">chlorophyll a: methyl (CH3)</text>
  <text class="s" x="560" y="296">chlorophyll b: aldehyde (CHO)</text>
  <!-- tail -->
  <path d="M380 420 V470" stroke="#14181f" stroke-width="5"/>
  <path d="M380 470 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20" fill="none" stroke="#14181f" stroke-width="6" stroke-linejoin="round"/>
  <!-- labels -->
  <path class="lead" d="M210 300 L120 300"/><text class="t" x="20" y="275">Porphyrin</text><text class="t" x="20" y="302">ring (head)</text><text class="s" x="20" y="330">four pyrrole rings</text><text class="s" x="20" y="354">round a magnesium</text><text class="s" x="20" y="378">atom; absorbs light</text>
  <text class="s" x="330" y="160">ring II</text>
  <text class="t" x="820" y="470">Hydrocarbon tail</text><text class="s" x="820" y="498">long chain; anchors the molecule</text><text class="s" x="820" y="522">in the thylakoid membrane</text>
  <text class="s" x="60" y="600">Chlorophyll is a lipid molecule. Chlorophylls a, b, c and d occur in plants and algae; bacteriochlorophylls in photosynthetic bacteria.</text>
  <text class="s" x="60" y="630">Chlorophylls absorb mainly violet-blue and orange-red light; green is least absorbed and is transmitted or reflected.</text>
  <text class="s" x="60" y="670">Pyrrole: a five-sided nitrogen-containing ring. The heads of the four rings are drawn schematically.</text>
</svg>
