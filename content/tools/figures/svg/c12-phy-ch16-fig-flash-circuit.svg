<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- Original Roman Urdu figure, not a textbook figure: a simplified flashgun circuit. A battery charges a capacitor; closing the switch connects the capacitor to a xenon flash tube, which it discharges through quickly. -->
  <path d="M140.0 251.0 L140.0 110.0 L600.0 110.0" stroke="#1a9fe0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M140.0 269.0 L140.0 430.0 L840.0 430.0 L840.0 360.0" stroke="#1a9fe0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="106.0" y1="251.0" x2="174.0" y2="251.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="122.0" y1="269.0" x2="158.0" y2="269.0" stroke="#14181f" stroke-width="9" stroke-linecap="round"/>
  <text x="170.0" y="238.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700">+</text>
  <text x="170.0" y="300.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700">&#8722;</text>
  <path d="M470.0 110.0 L470.0 256.0" stroke="#1a9fe0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M470.0 284.0 L470.0 430.0" stroke="#1a9fe0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="430.0" y1="256.0" x2="510.0" y2="256.0" stroke="#14181f" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="430.0" y1="284.0" x2="510.0" y2="284.0" stroke="#14181f" stroke-width="4.5" stroke-linecap="round"/>
  <text x="526.0" y="248.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" font-style="italic">C</text>
  <circle cx="600.0" cy="110.0" r="8.0" stroke="none" fill="#14181f"/>
  <line x1="600.0" y1="110.0" x2="670.0" y2="64.0" stroke="#e07b20" stroke-width="5" stroke-linecap="round"/>
  <circle cx="680.0" cy="110.0" r="8.0" stroke="none" fill="#14181f"/>
  <path d="M680.0 110.0 L840.0 110.0 L840.0 180.0" stroke="#1a9fe0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="790.0" y="180.0" width="100.0" height="180.0" rx="16" stroke="#7c3aed" stroke-width="3" fill="#efe7ff"/>
  <text x="840.0" y="284.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">xenon</text>
  <text x="90.0" y="360.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">battery</text>
  <text x="540.0" y="330.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">capacitor</text>
  <text x="640.0" y="160.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">switch</text>
  <text x="904.0" y="230.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">flash</text>
  <text x="904.0" y="264.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">tube</text>
</svg>
