<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.2: an enzyme lowers the activation energy of a reaction. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563}
      .a{font-size:20px;fill:#14181f;font-weight:700}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d7322f"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="550" y="50">Enzymes lower the activation energy</text>
  <!-- axes -->
  <path d="M120 600 V110" stroke="#14181f" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M120 600 H1000" stroke="#14181f" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="40" y="360" transform="rotate(-90 40 360)" text-anchor="middle">Energy</text>
  <text class="s" x="560" y="640" text-anchor="middle">Progress of the reaction</text>
  <!-- reactant and product levels -->
  <path d="M120 360 H300" stroke="#4b5563" stroke-width="4"/>
  <path d="M820 470 H1000" stroke="#4b5563" stroke-width="4"/>
  <text class="a" x="140" y="345">Reactants</text>
  <text class="a" x="830" y="455">Products</text>
  <!-- without enzyme: high hump -->
  <path d="M300 360 C 450 360, 450 150, 560 150 C 670 150, 700 470, 820 470" fill="none" stroke="#d7322f" stroke-width="7"/>
  <!-- with enzyme: low hump -->
  <path d="M300 360 C 450 360, 450 290, 560 290 C 670 290, 700 470, 820 470" fill="none" stroke="#0f7a62" stroke-width="7"/>
  <!-- activation energy arrows -->
  <path d="M560 356 L560 160" stroke="#d7322f" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
  <path d="M620 356 L620 300" stroke="#0f7a62" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar3)"/>
  <path d="M300 360 H660" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="s" x="580" y="135" style="fill:#d7322f;font-weight:700">activation energy without enzyme</text>
  <text class="s" x="640" y="285" style="fill:#0f7a62;font-weight:700">activation energy with enzyme</text>
  <!-- legend -->
  <path d="M640 540 H690" stroke="#d7322f" stroke-width="7"/><text class="s" x="700" y="546">uncatalysed reaction</text>
  <path d="M640 575 H690" stroke="#0f7a62" stroke-width="7"/><text class="s" x="700" y="581">enzyme-catalysed reaction</text>
  <text class="s" x="120" y="690">The enzyme changes neither reactants, products nor their energy difference; it only lowers the hill between.</text>
</svg>
