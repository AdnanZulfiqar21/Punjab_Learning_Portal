<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original pie chart from the book's survey of 100 students: blood group A 30 (108 degrees), B 20 (72 degrees), AB 10 (36 degrees) and O 40 (144 degrees), with a legend. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Distribution of blood types among 100 students</text>
  <path d="M300 260 L300.0 90.0 A170 170 0 0 1 461.7 312.5 Z" stroke="#ffffff" stroke-width="2" fill="#2563eb" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="385.3" y="203.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">A: 30%</text>
  <path d="M300 260 L461.7 312.5 A170 170 0 0 1 300.0 430.0 Z" stroke="#ffffff" stroke-width="2" fill="#16a34a" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="362.0" y="350.3" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">B: 20%</text>
  <path d="M300 260 L300.0 430.0 A170 170 0 0 1 200.1 397.5 Z" stroke="#ffffff" stroke-width="2" fill="#ca8a04" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="267.4" y="365.2" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">AB: 10%</text>
  <path d="M300 260 L200.1 397.5 A170 170 0 0 1 300.0 90.0 Z" stroke="#ffffff" stroke-width="2" fill="#dc2626" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="199.8" y="232.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">O: 40%</text>
  <rect x="560.0" y="124.0" width="26.0" height="26.0" rx="4" stroke="#2563eb" stroke-width="1" fill="#2563eb"/>
  <text x="600.0" y="143.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">A: 30 students</text>
  <text x="600.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">30/100 &#215; 360 = 108&#176;</text>
  <rect x="560.0" y="184.0" width="26.0" height="26.0" rx="4" stroke="#16a34a" stroke-width="1" fill="#16a34a"/>
  <text x="600.0" y="203.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">B: 20 students</text>
  <text x="600.0" y="222.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">20/100 &#215; 360 = 72&#176;</text>
  <rect x="560.0" y="244.0" width="26.0" height="26.0" rx="4" stroke="#ca8a04" stroke-width="1" fill="#ca8a04"/>
  <text x="600.0" y="263.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">AB: 10 students</text>
  <text x="600.0" y="282.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">10/100 &#215; 360 = 36&#176;</text>
  <rect x="560.0" y="304.0" width="26.0" height="26.0" rx="4" stroke="#dc2626" stroke-width="1" fill="#dc2626"/>
  <text x="600.0" y="323.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">O: 40 students</text>
  <text x="600.0" y="342.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">40/100 &#215; 360 = 144&#176;</text>
  <text x="450.0" y="470.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">whole circle = 100% = 360 degrees</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
