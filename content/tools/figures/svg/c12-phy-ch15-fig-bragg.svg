  <text x="612.0" y="268.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">d</text>
  <text x="302.0" y="222.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">theta</text>
  <text x="660.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">X-rays (wavelength about 10^-10 m)</text>
  <text x="660.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">reflect from planes of atoms a</text>
  <text x="660.0" y="182.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">distance d apart</text>
  <text x="660.0" y="203.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="660.0" y="224.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">the lower ray travels an extra</text>
  <text x="660.0" y="245.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">2 x d sin(theta) = 2d sin(theta)</text>
  <text x="660.0" y="266.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="660.0" y="287.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">reinforcement (Bragg equation):</text>
  <text x="660.0" y="330.0" font-size="20" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">2d sin(theta) = n lambda</tspan></text>
  <text x="660.0" y="370.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">n is the order of reflection;</text>
  <text x="660.0" y="387.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">used to find d, and the structures of</text>
  <text x="660.0" y="404.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">haemoglobin and DNA</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
