<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <!-- Roman Urdu figure for 2.10 (not in the book): the rule for all x, Student(x) -&gt; HasLibraryCard(x) and the fact Student(Ali) give the conclusion HasLibraryCard(Ali). -->
  <rect x="40.0" y="20.0" width="920.0" height="156.0" rx="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <text x="70.0" y="62.0" font-size="26" fill="#1f6fb5" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">qaida (rule)</text>
  <text x="70.0" y="112.0" font-size="30" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">for all x, Student(x) -&gt; HasLibraryCard(x)</text>
  <text x="70.0" y="154.0" font-size="26" fill="#374151" text-anchor="start" font-family="Arial, Helvetica, sans-serif">har talib-e-ilm ke paas library card hai</text>
  <rect x="40.0" y="190.0" width="920.0" height="156.0" rx="14" fill="#fdebd3" stroke="#c9761c" stroke-width="3"/>
  <text x="70.0" y="232.0" font-size="26" fill="#c9761c" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">haqeeqat (fact)</text>
  <text x="70.0" y="282.0" font-size="30" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Student(Ali)</text>
  <text x="70.0" y="324.0" font-size="26" fill="#374151" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Ali talib-e-ilm hai</text>
  <rect x="40.0" y="426.0" width="920.0" height="156.0" rx="14" fill="#e3f3ec" stroke="#0f7a62" stroke-width="3"/>
  <text x="70.0" y="468.0" font-size="26" fill="#0f7a62" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">nateeja (conclusion)</text>
  <text x="70.0" y="518.0" font-size="30" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">HasLibraryCard(Ali)</text>
  <text x="70.0" y="560.0" font-size="26" fill="#374151" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Ali ke paas library card hai</text>
  <line x1="40.0" y1="400.0" x2="960.0" y2="400.0" stroke="#1d2330" stroke-width="3" stroke-linecap="round"/>
  <text x="500.0" y="386.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">is liye (therefore)</text>
</svg>
