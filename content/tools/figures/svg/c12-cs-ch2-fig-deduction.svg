<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original: rule, fact and conclusion for the library card example, with two more deductions. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Deduction: from general rules and facts to a conclusion (after 2.10-2.11)</text>
  <rect x="60.0" y="80.0" width="520.0" height="76.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="80.0" y="104.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">rule (for all x)</text>
  <text x="80.0" y="130.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Student(x) -&gt; HasLibraryCard(x)</text>
  <text x="80.0" y="148.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">every student has a library card</text>
  <rect x="60.0" y="182.0" width="520.0" height="76.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="80.0" y="206.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">fact</text>
  <text x="80.0" y="232.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">Student(Ali)</text>
  <text x="80.0" y="250.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">Ali is a student</text>
  <rect x="60.0" y="306.0" width="520.0" height="76.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="80.0" y="330.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">conclusion</text>
  <text x="80.0" y="356.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">HasLibraryCard(Ali)</text>
  <text x="80.0" y="374.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">so Ali has a library card</text>
  <line x1="70.0" y1="283.0" x2="570.0" y2="283.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="320.0" y="300.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">therefore</text>
  <rect x="620.0" y="80.0" width="250.0" height="302.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="745.0" y="106.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">more examples</text>
  <text x="635.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">All humans are mortal.</text>
  <text x="635.0" y="160.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Socrates is a human.</text>
  <text x="635.0" y="180.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">So Socrates is mortal.</text>
  <text x="635.0" y="200.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="635.0" y="220.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">If it rains, the ground</text>
  <text x="635.0" y="240.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">gets wet. It is raining.</text>
  <text x="635.0" y="260.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">So the ground is wet.</text>
  <text x="450.0" y="425.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">If the premises are true, a deduction's conclusion is guaranteed to be true.</text>
  <text x="450.0" y="450.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(-&gt; is read 'if ... then')</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
