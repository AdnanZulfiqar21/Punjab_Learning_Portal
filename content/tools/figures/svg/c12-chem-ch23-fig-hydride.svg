<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original mechanism after the book: a hydride ion from NaBH4 or LiAlH4 attacks the carbonyl carbon, giving an alkoxide ion that takes H+ from water to form the alcohol; aldehydes give primary and ketones secondary alcohols. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reduction by hydride ions (NaBH4 or LiAlH4)</text>
  <text x="60.0" y="206.7" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <circle cx="42.0" cy="182.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="50.0" cy="182.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <line x1="167.0" y1="208.0" x2="167.0" y2="180.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="173.0" y1="208.0" x2="173.0" y2="180.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="170.0" y="165.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="161.3" y1="223.0" x2="136.9" y2="237.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="114.2" y="255.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="178.7" y1="223.0" x2="203.1" y2="237.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="225.8" y="255.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="170.0" y="223.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="186.0" y="220.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="188.0" y="158.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <path d="M72.0 188.0 Q110.0 168.0 156.0 210.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M156.0 210.0 L146.5 207.0 L152.2 200.8 Z" fill="#d7322f"/>
  <path d="M176.0 192.0 Q206.0 178.0 182.0 168.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M182.0 168.0 L192.0 167.6 L188.7 175.4 Z" fill="#d7322f"/>
  <line x1="255.0" y1="210.0" x2="301.2" y2="210.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M310.0 210.0 L300.0 214.6 L300.0 205.4 Z" fill="#14181f"/>
  <text x="390.0" y="224.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="390.0" y1="208.0" x2="390.0" y2="188.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="390.0" y="168.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-6.7" font-size="11.2">-</tspan></text>
  <line x1="380.0" y1="218.0" x2="364.0" y2="218.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="340.0" y="223.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="400.0" y1="218.0" x2="416.0" y2="218.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="440.0" y="223.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="390.0" y1="228.0" x2="390.0" y2="244.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="390.0" y="273.6" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="390.0" y="305.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">alkoxide ion</text>
  <text x="490.0" y="224.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ H-OH</tspan></text>
  <line x1="545.0" y1="210.0" x2="591.2" y2="210.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M600.0 210.0 L590.0 214.6 L590.0 205.4 Z" fill="#14181f"/>
  <text x="680.0" y="224.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="680.0" y1="208.0" x2="680.0" y2="188.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="680.0" y="168.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="670.0" y1="218.0" x2="654.0" y2="218.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="630.0" y="223.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="690.0" y1="218.0" x2="706.0" y2="218.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="730.0" y="223.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="680.0" y1="228.0" x2="680.0" y2="244.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="680.0" y="273.6" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="800.0" y="224.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ OH</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="680.0" y="305.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">alcohol</text>
  <rect x="15.0" y="350.0" width="870.0" height="70.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="380.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CHO + 2[H] -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">OH (primary);  CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COCH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> + 2[H] -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH(OH)CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> (secondary)</tspan></text>
  <text x="450.0" y="405.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">[H] stands for hydrogen supplied by the reducing agent; it is not atomic hydrogen</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
