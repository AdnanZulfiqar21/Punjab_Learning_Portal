<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <!-- Original redraw after Figure 9.25: a cell drawn as an emf E in series with its internal resistance r. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A real cell: an emf with internal resistance</text>
  <rect x="240.0" y="110.0" width="420.0" height="120.0" rx="30" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  <text x="450.0" y="98.0" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700">the cell</text>
  <line x1="120.0" y1="170.0" x2="330.0" y2="170.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="320" y="150" width="20" height="40" fill="#ffffff"/>
  <line x1="326.0" y1="154.0" x2="326.0" y2="186.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="335.0" y1="162.0" x2="335.0" y2="178.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <text x="330.0" y="140.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">E</text>
  <line x1="340.0" y1="170.0" x2="430.0" y2="170.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M430.0 170.0 L449.5 170.0 L457.1 180.0 L472.2 160.0 L487.4 180.0 L502.6 160.0 L517.8 180.0 L532.9 160.0 L540.5 170.0 L560.0 170.0" stroke="#d7322f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="495.0" y="145.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">r (internal)</text>
  <line x1="560.0" y1="170.0" x2="780.0" y2="170.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="120.0" cy="170.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <circle cx="780.0" cy="170.0" r="6.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="120.0" y="200.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="400">terminal</text>
  <text x="780.0" y="200.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="400">terminal</text>
  <text x="450.0" y="290.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">terminal voltage V = E - I r (less than E when a current flows)</text>
