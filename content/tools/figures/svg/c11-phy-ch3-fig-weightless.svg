<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.13: a mass on a spring balance inside an orbiting satellite reads zero. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Why things feel weightless in orbit</text>
  <circle cx="300.0" cy="280.0" r="175.0" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
  <circle cx="300.0" cy="280.0" r="55.0" stroke="#1f6fb5" stroke-width="2.5" fill="#cfe6fa"/>
  <text x="300.0" y="287.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700">Earth</text>
  <rect x="260.0" y="65.0" width="80.0" height="80.0" rx="6" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <line x1="300.0" y1="65.0" x2="300.0" y2="87.0" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300.0 87.0 L307.0 90.0 L293.0 93.0 L307.0 96.0 L293.0 99.0 L307.0 102.0 L293.0 105.0 L307.0 108.0 L300.0 111.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="288.0" y="111.0" width="24.0" height="20.0" rx="3" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <line x1="300.0" y1="149.0" x2="300.0" y2="207.6" stroke="#0f7a62" stroke-width="3" stroke-linecap="round"/>
  <path d="M300.0 218.0 L294.5 206.2 L305.5 206.2 Z" fill="#0f7a62"/>
  <text x="310.0" y="200.0" font-size="17" fill="#0f7a62" text-anchor="start" font-weight="700">F = GMm / r^2</text>
  <line x1="254.0" y1="105.0" x2="170.2" y2="122.8" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M160.0 125.0 L170.4 117.2 L172.7 127.9 Z" fill="#d98b2b"/>
  <text x="155.0" y="149.0" font-size="20" fill="#d98b2b" text-anchor="end" font-weight="700">v</text>
  <text x="350.0" y="75.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">spring balance</text>
  <text x="350.0" y="97.0" font-size="17" fill="#d7322f" text-anchor="start" font-weight="700">reads 0</text>
  <rect x="560.0" y="150.0" width="310.0" height="200.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="578.0" y="182.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">The satellite and the mass both</text>
  <text x="578.0" y="204.1" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">fall towards the Earth with the</text>
  <text x="578.0" y="226.2" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">same acceleration GM / r^2.</text>
  <text x="578.0" y="248.3" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">The spring does not stretch,</text>
  <text x="578.0" y="270.4" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">so the balance reads zero:</text>
  <text x="578.0" y="292.5" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">apparent weight = 0.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
