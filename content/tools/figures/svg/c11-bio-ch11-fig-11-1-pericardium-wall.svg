<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 11.1 (C11-BIO, PDF p236): heart inside the pericardial sac (left), enlarged square of its wall showing the pericardium layers (middle), and a block of heart wall with endocardium, myocardium, pericardial fluid and the two serous layers (right). Original flat drawing after the printed figure. -->
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e8942a"/></marker>
    <pattern id="cells" width="26" height="22" patternUnits="userSpaceOnUse"><rect width="26" height="22" fill="#c94a62"/><path d="M0 11 C6 4 20 4 26 11 M13 0 C10 6 10 16 13 22" stroke="#a83350" stroke-width="2" fill="none"/><circle cx="7" cy="15" r="2" fill="#7e2240"/></pattern>
    <pattern id="cells2" width="24" height="20" patternUnits="userSpaceOnUse"><rect width="24" height="20" fill="#d9644a"/><path d="M0 10 C6 3 18 3 24 10 M12 0 C9 6 9 14 12 20" stroke="#b84a36" stroke-width="2" fill="none"/><circle cx="17" cy="6" r="2" fill="#8e3426"/></pattern>
    <pattern id="purp" width="22" height="18" patternUnits="userSpaceOnUse"><rect width="22" height="18" fill="#7a4fa8"/><ellipse cx="11" cy="9" rx="8" ry="6" fill="#9468c0" stroke="#5a3485" stroke-width="1.5"/></pattern>
    <clipPath id="box"><rect x="380" y="178" width="132" height="202"/></clipPath>
  </defs>
  <rect width="1240" height="660" fill="#ffffff"/>

  <!-- LEFT: heart inside the pericardium -->
  <path d="M120 150 C112 110 118 70 138 52 L160 52 C150 80 150 115 158 150 Z" fill="#6f8fd0" stroke="#3a5aa0" stroke-width="3"/>
  <path d="M150 165 C140 100 175 50 225 52 C262 54 275 85 268 120 L246 120 C250 95 240 78 222 78 C192 78 178 115 186 165 Z" fill="#d8434a" stroke="#97202a" stroke-width="3"/>
  <path d="M198 118 L200 56 L216 56 L216 118 Z M226 100 L240 62 L254 68 L242 108 Z" fill="#d8434a" stroke="#97202a" stroke-width="3"/>
  <path d="M190 190 C200 150 240 140 268 158 L276 180 C252 168 222 172 210 196 Z" fill="#7d9ad8" stroke="#3a5aa0" stroke-width="3"/>
  <!-- heart body -->
  <path d="M95 210 C110 175 160 160 205 172 C250 180 285 210 290 260 C296 330 282 420 240 500 C215 545 185 575 165 580 C135 560 100 480 85 400 C72 330 78 250 95 210 Z" fill="#d6574e" stroke="#9a2a2a" stroke-width="3"/>
  <path d="M150 190 C175 260 190 360 168 560" stroke="#9a2a2a" stroke-width="3" fill="none"/>
  <path d="M175 230 C205 225 228 250 236 285 C240 310 225 330 205 325 C185 320 172 295 175 230 Z" fill="#e8c25a" stroke="#b88a2a" stroke-width="2"/>
  <!-- pericardial sac (translucent) -->
  <path d="M60 230 C70 180 130 150 190 158 C255 165 300 200 308 260 C318 340 300 440 255 520 C225 572 190 605 160 610 C115 600 72 520 56 430 C45 360 48 280 60 230 Z" fill="#dfe6f0" fill-opacity="0.3" stroke="#8a9ab8" stroke-width="3"/>
  <rect x="255" y="322" width="38" height="38" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="40" y="640" font-size="22" fill="#222">Pericardium</text>
  <line x1="98" y1="618" x2="120" y2="520" stroke="#333" stroke-width="2"/>
  <!-- arrow heart -> middle panel -->
  <path d="M296 362 C318 382 340 378 362 358" stroke="#e8942a" stroke-width="12" fill="none" marker-end="url(#oa)"/>

  <!-- MIDDLE: enlarged wall -->
  <g clip-path="url(#box)">
    <rect x="380" y="178" width="132" height="202" fill="#a8202e"/>
    <path d="M440 170 C470 230 486 300 492 390 L540 390 L540 170 Z" fill="#f2f2ea"/>
    <path d="M440 170 C470 230 486 300 492 390" stroke="#e8d8c8" stroke-width="10" fill="none"/>
    <path d="M451 170 C481 230 497 300 503 390" stroke="#1d2a5a" stroke-width="5" fill="none"/>
    <path d="M459 170 C489 230 505 300 511 390" stroke="#cfe8d0" stroke-width="7" fill="none"/>
    <path d="M467 170 C497 230 513 300 519 390" stroke="#3a4a78" stroke-width="3" fill="none"/>
    <path d="M400 178 C420 240 430 300 432 380" stroke="#c43440" stroke-width="6" fill="none"/>
  </g>
  <rect x="380" y="178" width="132" height="202" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="552" y="50" font-size="22" fill="#222" text-anchor="middle">Pericardium</text>
  <path d="M378 76 L378 66 L700 66 L700 76" stroke="#333" stroke-width="2" fill="none"/>
  <text x="372" y="102" font-size="22" fill="#222">Fibrous</text>
  <text x="372" y="128" font-size="22" fill="#222">pericardium</text>
  <line x1="440" y1="136" x2="498" y2="230" stroke="#333" stroke-width="2"/>
  <text x="652" y="102" font-size="22" fill="#222">Serous</text>
  <text x="652" y="128" font-size="22" fill="#222">pericardium</text>
  <text x="560" y="182" font-size="22" fill="#222">Parietal</text>
  <text x="560" y="208" font-size="22" fill="#222">pericardium</text>
  <path d="M694 172 L704 172 L704 212 L694 212" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="556" y1="200" x2="496" y2="262" stroke="#333" stroke-width="2"/>
  <text x="560" y="300" font-size="22" fill="#222">Visceral</text>
  <text x="560" y="326" font-size="22" fill="#222">pericardium</text>
  <path d="M694 290 L704 290 L704 330 L694 330" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="556" y1="316" x2="486" y2="318" stroke="#333" stroke-width="2"/>
  <path d="M704 192 L726 192 L726 136 L712 136 M704 310 L726 310 L726 192" stroke="#333" stroke-width="2" fill="none"/>
  <!-- arrow middle -> block -->
  <path d="M470 384 C510 440 590 450 680 430" stroke="#e8942a" stroke-width="12" fill="none" marker-end="url(#oa)"/>

  <!-- RIGHT: block of heart wall -->
  <path d="M807 201 L1072 244 L1078 452 L1056 452 L1053 263 L794 234 Z" fill="url(#purp)" stroke="#4a2a78" stroke-width="2"/>
  <path d="M1053 263 L1056 452" stroke="#f4e6f0" stroke-width="5"/>
  <path d="M735 263 L794 234 L1053 263 L896 393 L866 384 Z" fill="url(#cells2)" stroke="#8e3426" stroke-width="2"/>
