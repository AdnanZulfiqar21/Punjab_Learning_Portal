  <path d="M896 393 L1053 263 L1049 448 L892 563 Z" fill="url(#cells2)" stroke="#8e3426" stroke-width="2"/>
  <text x="840" y="110" font-size="22" fill="#222">Parietal</text>
  <text x="840" y="136" font-size="22" fill="#222">pericardium</text>
  <line x1="884" y1="144" x2="870" y2="218" stroke="#333" stroke-width="2"/>
  <text x="1000" y="110" font-size="22" fill="#222">Visceral</text>
  <text x="1000" y="136" font-size="22" fill="#222">pericardium</text>
  <line x1="1040" y1="144" x2="1012" y2="246" stroke="#333" stroke-width="2"/>
  <text x="640" y="508" font-size="22" fill="#222">Myocardium</text>
  <line x1="720" y1="490" x2="800" y2="420" stroke="#333" stroke-width="2"/>
  <text x="690" y="600" font-size="22" fill="#222">Endocardium</text>
  <line x1="780" y1="580" x2="874" y2="500" stroke="#333" stroke-width="2"/>
  <text x="1086" y="510" font-size="22" fill="#222">Pericardial</text>
  <text x="1086" y="536" font-size="22" fill="#222">fluid</text>
  <line x1="1096" y1="488" x2="1058" y2="440" stroke="#333" stroke-width="2"/>
</svg>
