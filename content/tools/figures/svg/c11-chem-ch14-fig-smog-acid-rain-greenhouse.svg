<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 14.2 to 14.5 and topics 14.5 to 14.7: impacts of burning fuels and deforestation, the two smogs, acid rain and the greenhouse effect. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .l{font-size:11px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">Effects of air pollutants: smog, acid rain and the greenhouse effect</text>
  <!-- smog -->
  <rect x="50" y="55" width="560" height="270" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="330" y="83">Two kinds of smog (14.6.1)</text>
  <g font-size="12" fill="#4b5563">
    <g font-weight="700" fill="#14181f"><text x="70" y="110">Feature</text><text x="200" y="110">Classical (London) smog</text><text x="410" y="110">Photochemical (Los Angeles)</text></g>
    <text x="70" y="134">cause</text><text x="200" y="134">high SOx from coal; reducing</text><text x="410" y="134">NOx + VOCs in sunlight; oxidising</text>
    <text x="70" y="156">also called</text><text x="200" y="156">industrial, sulfurous, reducing</text><text x="410" y="156">photochemical, oxidising</text>
    <text x="70" y="178">products</text><text x="200" y="178">SO2, soot, fog</text><text x="410" y="178">ozone, PAN (secondary)</text>
    <text x="70" y="200">harm</text><text x="200" y="200">respiratory</text><text x="410" y="200">palpitations, pneumonia, lung cancer</text>
  </g>
  <path d="M60 118 H600" stroke="#9ca3af" stroke-width="1"/>
  <g class="t" style="font-size:12px">
    <text x="70" y="232">smog: a thick haze in urban areas from vehicles and industry; fine dust and soot,</text>
    <text x="70" y="248">condensed water vapour, SO2, NOx, O3, CO, CO2, unburnt hydrocarbons, VOCs and</text>
    <text x="70" y="264">PM of 10 to 2.5 micrometres (Figure 14.3: smog around Lahore Fort)</text>
    <text x="70" y="290">photochemical smog (Figure 14.4): NOx and VOCs undergo photochemical reactions in</text>
    <text x="70" y="306">sunlight to give the secondary pollutants ozone and peroxyacetyl nitrate</text>
  </g>
  <!-- acid rain -->
  <rect x="630" y="55" width="520" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="890" y="83">Acid rain (14.6.2): rain with pH below 5 to 6</text>
  <g class="f">
    <text x="650" y="112">2SO2 + O2 --> 2SO3</text>
    <text x="650" y="134">SO3(g) + H2O(l) --> H2SO4(aq)</text>
    <text x="650" y="156">2NO2 + H2O --> HNO3 + HNO2   (printed with NO)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="650" y="186">burning fossil fuels releases SOx and NOx; they mix with</text>
    <text x="650" y="202">moisture to form acids; wind carries the droplets far</text>
    <text x="650" y="218">and they return as acid rain, hail, snow or fog</text>
    <text x="650" y="242">acid rain looks, feels and tastes like clean rain, but its</text>
    <text x="650" y="258">corrosive nature damages ecosystems, crops, buildings</text>
    <text x="650" y="274">and bridges</text>
    <text x="650" y="300">precipitation of any kind: rain, snow, sleet or hail</text>
  </g>
  <!-- greenhouse -->
  <rect x="50" y="345" width="620" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="360" y="373">Greenhouse effect and global warming (14.7, after Figure 14.5)</text>
  <circle cx="110" cy="420" r="22" fill="#f3d94a" stroke="#d98b2b" stroke-width="2"/>
  <text class="l" x="110" y="424">sun</text>
  <path d="M135 430 L250 540" stroke="#d98b2b" stroke-width="3" marker-end="url(#ay)"/>
  <text font-size="11" fill="#b5600f" x="140" y="470">short-wave solar</text><text font-size="11" fill="#b5600f" x="140" y="484">radiation passes in</text>
  <path d="M90 560 Q360 540 630 560" fill="none" stroke="#2fa36b" stroke-width="6"/>
  <text class="l" x="360" y="585" style="fill:#0f7a62">warmed earth surface</text>
  <path d="M300 545 L300 420" stroke="#d7322f" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M330 545 L380 480 L330 430" stroke="#d7322f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M100 400 Q360 370 640 400" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text font-size="11" fill="#4b5563" x="470" y="408">CO2, H2O, CH4, N2O layer</text>
  <text font-size="11" fill="#d7322f" x="205" y="440">long-wave IR</text><text font-size="11" fill="#d7322f" x="205" y="454">escapes</text>
  <text font-size="11" fill="#d7322f" x="390" y="500">some IR is absorbed</text><text font-size="11" fill="#d7322f" x="390" y="514">and sent back down</text>
  <g class="t" style="font-size:12px">
    <text x="420" y="430">greenhouse gases transmit short-wave</text>
    <text x="420" y="446">sunlight but absorb the long-wave heat</text>
    <text x="420" y="462">radiated by the earth at night</text>
    <text x="70" y="612">more CO2 and other gases, more thermal radiation absorbed, higher global temperature: global warming</text>
  </g>
  <!-- human impact -->
  <rect x="690" y="345" width="460" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="920" y="373">Human impact (14.5)</text>
  <g class="t" style="font-size:12px">
    <text x="710" y="400" style="font-weight:700;fill:#14181f">burning fossil fuels (14.5.1)</text>
    <text x="710" y="418">the primary cause of current climate change: greenhouse</text>
    <text x="710" y="434">gas emissions, air pollution, VOCs; alters ecosystems and</text>
    <text x="710" y="450">harms human and environmental health (Figure 14.2)</text>
    <text x="710" y="478" style="font-weight:700;fill:#14181f">deforestation (14.5.2)</text>
    <text x="710" y="496">purposeful clearing or thinning of forests; forests absorb</text>
    <text x="710" y="512">CO2 and clean the air; loss gives biodiversity loss, climate</text>
    <text x="710" y="528">change, soil degradation and water-cycle disruption</text>
    <text x="710" y="556">urban air pollution is mostly human-made: mobile sources</text>
    <text x="710" y="572">(cars, trucks, aircraft, marine engines) and point sources</text>
    <text x="710" y="588">(factories, power plants)</text>
    <text x="710" y="614">greenhouse gases: CO2, CH4, N2O, water vapour, CFCs</text>
  </g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
