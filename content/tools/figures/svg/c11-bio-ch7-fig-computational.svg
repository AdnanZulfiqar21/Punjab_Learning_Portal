<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram for topic 7.3: the areas, databases and algorithms of computational biology (the textbook shows screenshots). -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .b{font-size:19px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Computational biology: areas, databases and tools</text>
  <rect x="340" y="80" width="520" height="60" rx="14" fill="#5b3fb5"/><text class="b" x="600" y="117">biology + computer science + maths + statistics</text>
  <!-- three areas -->
  <g>
    <rect x="80" y="200" width="300" height="70" rx="12" fill="#0f7a62"/><text class="b" x="230" y="230">Genomics</text><text class="b" x="230" y="256" style="font-size:15px">whole DNA set of a cell</text>
    <rect x="450" y="200" width="300" height="70" rx="12" fill="#d98b2b"/><text class="b" x="600" y="230">Proteomics</text><text class="b" x="600" y="256" style="font-size:15px">all the proteins an organism makes</text>
    <rect x="820" y="200" width="300" height="70" rx="12" fill="#1f6fb5"/><text class="b" x="970" y="230">Bioinformatics</text><text class="b" x="970" y="256" style="font-size:15px">store, retrieve, analyse sequences</text>
  </g>
  <g stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"><path d="M520 145 L260 195"/><path d="M600 145 L600 195"/><path d="M680 145 L940 195"/></g>
  <!-- databases -->
  <text class="k" x="300" y="330">Key databases</text>
  <rect x="60" y="350" width="480" height="40" rx="8" fill="#e1f3ec" stroke="#0f7a62" stroke-width="2"/><text class="s" x="300" y="376" style="fill:#14181f">GenBank: nucleotide sequences with annotations</text>
  <rect x="60" y="400" width="480" height="40" rx="8" fill="#e1f3ec" stroke="#0f7a62" stroke-width="2"/><text class="s" x="300" y="426" style="fill:#14181f">Protein Data Bank (PDB): 3D structures of macromolecules</text>
  <rect x="60" y="450" width="480" height="40" rx="8" fill="#e1f3ec" stroke="#0f7a62" stroke-width="2"/><text class="s" x="300" y="476" style="fill:#14181f">Ensembl: genome browser; genes and comparative genomics</text>
  <!-- algorithms -->
  <text class="k" x="900" y="330">Key algorithms</text>
  <rect x="660" y="350" width="480" height="40" rx="8" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="900" y="376" style="fill:#14181f">BLAST: compares a sequence to find homologues</text>
  <rect x="660" y="400" width="480" height="40" rx="8" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="s" x="900" y="426" style="fill:#14181f">FASTA: aligns a query against a database of sequences</text>
  <text class="k" x="900" y="500">Applications</text>
  <text class="s" x="900" y="526">drug discovery; genetic research and personalised</text><text class="s" x="900" y="550">medicine; evolutionary biology</text>
  <text class="s" x="600" y="600">Large data sets, hidden patterns and predictive models lead to new biological insight.</text>
</svg>
