<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.5b, 2.6 and 2.7: the shapes of s, p and d orbitals drawn as 2D boundary surfaces. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="34">Shapes of atomic orbitals (boundary surfaces, drawn flat)</text>
  <!-- s orbitals -->
  <text class="k" x="170" y="80">s orbitals: spherical</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M100 170 H240 M170 100 V240"/></g>
  <circle cx="170" cy="170" r="28" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="s" x="170" y="260">1s</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M100 390 H240 M170 320 V460"/></g>
  <circle cx="170" cy="390" r="55" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><circle cx="170" cy="390" r="28" fill="none" stroke="#1f6fb5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="170" y="480">2s: larger, same shape</text>
  <text class="s" x="170" y="530">density uniform in all</text><text class="s" x="170" y="552">directions; size grows with n</text>
  <!-- p orbitals -->
  <text class="k" x="520" y="80">p orbitals: two lobes on an axis</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M400 170 H640 M520 100 V240"/></g>
  <ellipse cx="470" cy="170" rx="42" ry="22" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="570" cy="170" rx="42" ry="22" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="s" x="520" y="262">px: along the x axis</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M400 390 H640 M520 320 V460"/></g>
  <ellipse cx="520" cy="345" rx="22" ry="42" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="520" cy="435" rx="22" ry="42" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="s" x="520" y="494">py (or pz): along the y (or z) axis</text>
  <text class="s" x="520" y="530">three p orbitals, px, py, pz, named by</text><text class="s" x="520" y="552">their axes and mutually perpendicular</text>
  <!-- d orbitals -->
  <text class="k" x="920" y="80">d orbitals: four lobes (clover leaf)</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M800 170 H1040 M920 100 V240"/></g>
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="2">
    <ellipse cx="885" cy="135" rx="30" ry="18" transform="rotate(-45 885 135)"/><ellipse cx="955" cy="135" rx="30" ry="18" transform="rotate(45 955 135)"/><ellipse cx="885" cy="205" rx="30" ry="18" transform="rotate(45 885 205)"/><ellipse cx="955" cy="205" rx="30" ry="18" transform="rotate(-45 955 205)"/>
  </g>
  <text class="s" x="920" y="262">dxy: lobes between the axes (also dxz, dyz)</text>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M800 390 H1040 M920 320 V460"/></g>
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="2">
    <ellipse cx="920" cy="345" rx="18" ry="34"/><ellipse cx="920" cy="435" rx="18" ry="34"/><ellipse cx="920" cy="390" rx="60" ry="14"/>
  </g>
  <text class="s" x="920" y="494">dz2: two lobes on z and a doughnut in the xy plane</text>
  <text class="s" x="920" y="530">dx2-y2 has its lobes along the x and y axes;</text><text class="s" x="920" y="552">five d orbitals in all; the seven f orbitals are complicated</text>
  <text class="s" x="600" y="600">An orbital is the three-dimensional region around the nucleus where the probability of finding the electron is greatest; these are flat sketches of that region.</text>
</svg>
