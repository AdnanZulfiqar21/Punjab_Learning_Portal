  <path d="M305 150 L305 270 L410 270 L410 150" stroke="#475569" stroke-width="2.2" fill="#e0f2fe" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="307.0" y="175.0" width="101.0" height="93.0" rx="0" stroke="#1f6fb5" stroke-width="0" fill="#bfdbfe"/>
  <text x="357.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">flocculation</text>
