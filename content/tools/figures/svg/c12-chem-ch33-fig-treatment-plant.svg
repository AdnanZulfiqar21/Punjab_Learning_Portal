  <!-- Original diagram after Figure 33.4: waste water passes through screening, coagulation (chemicals added), flocculation, sedimentation (sludge removed), filtration through sand and gravel, and disinfection with chlorine, sodium hypochlorite or ozone, giving treated water. -->
