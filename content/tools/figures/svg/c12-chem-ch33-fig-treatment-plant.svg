  <text x="637.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">filtration</text>
  <line x1="692.0" y1="190.0" x2="716.6" y2="190.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M723.0 190.0 L715.7 193.4 L715.7 186.6 Z" fill="#14181f"/>
