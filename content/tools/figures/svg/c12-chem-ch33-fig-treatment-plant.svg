  <text x="777.0" y="300.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">disinfection</text>
  <line x1="777.0" y1="110.0" x2="777.0" y2="161.6" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M777.0 168.0 L773.6 160.7 L780.4 160.7 Z" fill="#0f7a62"/>
  <text x="777.0" y="102.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">Cl2, NaOCl or O3</text>
  <line x1="5.0" y1="190.0" x2="17.4" y2="190.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M23.0 190.0 L16.7 193.0 L16.7 187.0 Z" fill="#14181f"/>
  <text x="25.0" y="140.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">waste water</text>
  <line x1="832.0" y1="230.0" x2="873.6" y2="230.0" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M880.0 230.0 L872.7 233.4 L872.7 226.6 Z" fill="#1f6fb5"/>
  <text x="855.0" y="255.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">treated</text>
  <text x="855.0" y="270.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">water</text>
  <text x="450.0" y="385.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">screening and sedimentation remove large and suspended solids; coagulation and flocculation make floc;</text>
  <text x="450.0" y="405.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">filtration through graded sand and gravel (or activated carbon) removes fine matter;</text>
  <text x="450.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">disinfection: Cl2 + H2O -&gt; HOCl + HCl; HOCl gets into bacteria and viruses and disrupts them</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
