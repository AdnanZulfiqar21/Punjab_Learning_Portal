<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="730" fill="#ffffff"/>
  <!-- Original diagram after topics 14.3.2 and 14.3.3: shockwave lithotripsy and percutaneous nephrolithotripsy, the kinds of kidney stone, haemodialysis with counter-flowing blood and dialysate, and peritoneal dialysis. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">Treating kidney stones and kidney failure</text>
  <rect x="50" y="55" width="540" height="320" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="83">Breaking kidney stones (14.3.2)</text>
  <rect x="80" y="110" width="210" height="150" rx="40" fill="#fde9d9" stroke="#9ca3af" stroke-width="2"/>
  <path d="M185 120 C143 120 143 210 185 210 C219 210 219 181 202 165 C219 149 219 120 185 120 Z" fill="#f2c4a8" stroke="#8a4b2f" stroke-width="2.5"/>
  <path d="M178 160 L190 152 L198 164 L188 174 Z" fill="#374151"/>
  <path d="M130 300 Q185 268 240 300 Z" fill="#cfd8e3" stroke="#4b5563" stroke-width="2"/>
  <path d="M145 290 L188 170" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M185 290 L188 170" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M225 290 L188 170" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text class="r" x="248" y="300">lithotripter</text>
  <g class="r">
    <text x="70" y="322">ECSWL: a lithotripter outside the body sends</text>
    <text x="70" y="337">shockwaves; the pieces pass out in urine</text>
  </g>
  <path d="M340 260 H570" stroke="#9ca3af" stroke-width="2"/>
  <text class="r" x="560" y="276" style="text-anchor:end">skin of the back</text>
  <path d="M462 128 C508 128 508 228 462 228 C424 228 424 196 443 178 C424 160 424 128 462 128 Z" fill="#f2c4a8" stroke="#8a4b2f" stroke-width="2.5"/>
  <path d="M457 168 L470 160 L478 174 L466 184 Z" fill="#374151"/>
  <path d="M445 282 L462 192" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <path d="M445 282 L462 192" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
  <g class="r">
    <text x="345" y="112">PNL, for larger stones:</text>
  </g>
  <g class="r">
    <text x="345" y="304">tube from the back; a nephroscope</text>
    <text x="345" y="319">sees the stone, ultrasound breaks it,</text>
    <text x="345" y="334">pieces are pulled out</text>
  </g>
  <rect x="610" y="55" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">Kinds of stone (14.3.2)</text>
  <text class="l" x="630" y="115">stone</text>
  <text class="l" x="800" y="115">cause</text>
  <text class="l" x="980" y="115">urine test</text>
  <text class="r" x="630" y="149">calcium oxalate, about 70%</text>
  <text class="r" x="800" y="149">hypercalciuria, hyperoxaluria</text>
  <text class="r" x="980" y="149">acidic</text>
  <text class="r" x="630" y="183">uric acid, about 10%</text>
  <text class="r" x="800" y="183">hyperuricemia</text>
  <text class="r" x="980" y="183">persistently acidic</text>
  <text class="r" x="630" y="217">calcium phosphate</text>
  <text class="r" x="800" y="217"></text>
  <text class="r" x="980" y="217">alkaline</text>
  <text class="r" x="630" y="251">cystine, phosphates</text>
  <text class="r" x="800" y="251">high levels in urine</text>
  <text class="r" x="980" y="251"></text>
  <g class="r">
    <text x="630" y="300">continued dehydration raises the risk of stones;</text>
    <text x="630" y="316">lithotripsy means breaking the stone</text>
  </g>
  <rect x="50" y="395" width="540" height="315" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="423">Haemodialysis (14.3.3)</text>
  <rect x="250" y="470" width="200" height="90" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M258 515 H442" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 4" stroke-linecap="round"/>
  <path d="M262 492 L438 492" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M438 540 L262 540" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <text class="r" x="350" y="486" style="fill:#d7322f;text-anchor:middle">blood</text>
  <text class="r" x="350" y="556" style="fill:#1f6fb5;text-anchor:middle">dialysate</text>
  <path d="M90 492 H248" fill="none" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M452 492 H520 V620 H90" fill="none" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="492" r="14" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text class="l" x="170" y="496" style="text-anchor:middle">P</text>
  <text class="r" x="80" y="470">from an artery (arm)</text>
  <text class="r" x="90" y="640">clean blood back to a vein</text>
  <g class="r">
    <text x="262" y="595">dialyzer: cellulose semipermeable membrane</text>
  </g>
  <g class="r">
    <text x="70" y="668">wastes, extra water and salts cross into the dialysate; the two</text>
    <text x="70" y="683">flow in opposite directions to keep a gradient all along</text>
  </g>
  <rect x="610" y="395" width="540" height="315" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="423">Peritoneal dialysis (14.3.3)</text>
  <ellipse cx="830" cy="560" rx="120" ry="90" fill="#fde9d9" stroke="#9ca3af" stroke-width="2"/>
  <ellipse cx="830" cy="565" rx="95" ry="65" fill="none" stroke="#d7322f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="660" y="440" width="60" height="40" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="2"/>
  <text class="r" x="690" y="464" style="fill:#1f6fb5;text-anchor:middle">fresh</text>
  <path d="M720 460 C780 460 800 480 815 520" fill="none" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="660" y="650" width="60" height="40" rx="6" fill="#fff1c9" stroke="#d98b2b" stroke-width="2"/>
  <text class="r" x="690" y="674" style="fill:#d98b2b;text-anchor:middle">used</text>
  <path d="M815 600 C800 650 760 670 722 670" fill="none" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <text class="r" x="830" y="562" style="fill:#d7322f;text-anchor:middle">peritoneum (dashed)</text>
  <text class="r" x="830" y="577" style="text-anchor:middle">lines the abdomen</text>
  <g class="r">
    <text x="975" y="450">1.5 to 2 L of dialysate</text>
    <text x="975" y="465">stays 4 to 6 hours;</text>
    <text x="975" y="480">wastes and fluid pass</text>
    <text x="975" y="495">from the peritoneal</text>
    <text x="975" y="510">capillaries into it;</text>
    <text x="975" y="525">drained and repeated</text>
    <text x="975" y="540">several times a day</text>
  </g>
  <text class="s" x="600" y="722" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
