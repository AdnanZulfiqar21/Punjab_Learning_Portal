<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.20: the ATP yield from the aerobic oxidation of one glucose. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:20px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Energy extracted from one glucose in aerobic respiration</text>
  <!-- stages -->
  <rect x="60" y="120" width="220" height="80" rx="14" fill="#1f6fb5"/><text class="b" x="170" y="155">Glycolysis</text><text class="b" x="170" y="180" style="font-size:15px">cytosol</text>
  <path d="M285 160 H340" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="345" y="120" width="220" height="80" rx="14" fill="#0f7a62"/><text class="b" x="455" y="155">Pyruvic acid oxidation</text><text class="b" x="455" y="180" style="font-size:15px">2 pyruvic acids</text>
  <path d="M570 160 H625" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="630" y="120" width="220" height="80" rx="14" fill="#5b3fb5"/><text class="b" x="740" y="155">Krebs cycle</text><text class="b" x="740" y="180" style="font-size:15px">2 turns</text>
  <path d="M855 160 H910" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="915" y="120" width="220" height="80" rx="14" fill="#d98b2b"/><text class="b" x="1025" y="155">Electron transport</text><text class="b" x="1025" y="180" style="font-size:15px">chemiosmosis</text>
  <!-- yields -->
  <g class="s">
    <text x="170" y="250">2 ATP (substrate-level)</text><text x="170" y="276">2 NADH</text>
    <text x="455" y="250">2 NADH</text>
    <text x="740" y="250">2 ATP (substrate-level)</text><text x="740" y="276">6 NADH, 2 FADH2</text>
    <text x="1025" y="250">10 NADH and 2 FADH2</text><text x="1025" y="276">pass electrons to the chain</text>
  </g>
  <!-- table -->
  <g font-size="18" fill="#14181f">
    <rect x="150" y="330" width="900" height="44" fill="#f3f4f6"/>
    <text x="170" y="358" font-weight="700">Source</text><text x="600" y="358" font-weight="700">ATP</text><text x="760" y="358" font-weight="700">Note</text>
    <text x="170" y="402">Glycolysis, substrate-level</text><text x="600" y="402">2</text>
    <text x="170" y="440">2 NADH from glycolysis</text><text x="600" y="440">4</text><text x="760" y="440">2 each: 1 ATP spent moving each one in</text>
    <text x="170" y="478">2 NADH from pyruvic acid oxidation</text><text x="600" y="478">6</text><text x="760" y="478">3 each</text>
    <text x="170" y="516">Krebs cycle, substrate-level</text><text x="600" y="516">2</text>
    <text x="170" y="554">6 NADH from the Krebs cycle</text><text x="600" y="554">18</text><text x="760" y="554">3 each</text>
    <text x="170" y="592">2 FADH2 from the Krebs cycle</text><text x="600" y="592">4</text><text x="760" y="592">2 each</text>
    <path d="M150 606 H1050" stroke="#14181f" stroke-width="2"/>
    <text x="170" y="636" font-weight="700">Net total</text><text x="600" y="636" font-weight="700">36 ATP</text><text x="760" y="636">against 2 ATP in anaerobic respiration: 18 times more</text>
  </g>
</svg>
