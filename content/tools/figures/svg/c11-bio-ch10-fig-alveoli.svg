<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.1 and 10.6: a cluster of alveoli with its capillaries, and the properties of a respiratory surface. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="380" y="40">A cluster of alveoli: the respiratory surface</text>
  <!-- alveolar duct -->
  <path d="M380 70 v120" stroke="#d98b2b" stroke-width="26" stroke-linecap="round"/>
  <text class="s" x="410" y="110">terminal bronchiole</text><text class="s" x="410" y="132">and alveolar duct</text>
  <!-- cluster -->
  <g fill="#fff4e2" stroke="#d98b2b" stroke-width="4">
    <circle cx="300" cy="260" r="55"/><circle cx="400" cy="250" r="55"/><circle cx="480" cy="320" r="55"/><circle cx="250" cy="360" r="55"/><circle cx="350" cy="370" r="55"/><circle cx="440" cy="420" r="55"/><circle cx="330" cy="470" r="55"/>
  </g>
  <!-- capillary net -->
  <g fill="none" stroke-width="4">
    <path d="M120 220 q100 -40 170 20 q60 40 130 0 q60 -30 120 20" stroke="#1f6fb5"/>
    <path d="M540 260 q30 60 -10 120 q-30 60 40 110" stroke="#d7322f"/>
    <path d="M150 300 q60 60 20 120 q-30 60 60 90 q80 20 160 -10" stroke="#1f6fb5" opacity="0.8"/>
    <path d="M200 440 q80 60 170 50 q80 -10 140 30" stroke="#d7322f" opacity="0.8"/>
  </g>
  <!-- exchange arrows in one alveolus -->
  <path d="M400 250 L440 215" stroke="#d7322f" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="445" y="205" style="fill:#d7322f">O2 into blood</text>
  <path d="M470 290 L430 320" stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"/><rect x="553" y="286" width="150" height="24" fill="#ffffff"/><text class="s" x="560" y="304" style="fill:#1f6fb5">CO2 out of blood</text>
  <text class="s" x="100" y="560">each cluster has 20-30 alveoli; the two lungs hold up to 700 million;</text><text class="s" x="100" y="582">the wall is moist epithelium only 0.1 micrometre thick</text>
  <text class="s" x="100" y="620">deoxygenated blood arrives in the pulmonary arteries (blue),</text><text class="s" x="100" y="642">oxygenated blood leaves in the pulmonary veins (red)</text>
  <text class="s" x="100" y="680">surfactant lines the inside and stops the alveoli collapsing and sticking together</text>
  <!-- properties -->
  <text class="h" x="930" y="40">Properties of a respiratory surface</text>
  <g font-size="17" fill="#4b5563">
    <text x="720" y="90">1. moist and permeable, so gases pass through</text>
    <text x="720" y="124">2. thin, so gases travel the least distance</text>
    <text x="720" y="158">3. a blood supply, so gases diffuse in and out of blood</text>
    <text x="720" y="192">4. structural support, so it stays open</text>
    <text x="720" y="226">5. located internally, so it does not dry out</text>
    <text x="720" y="260">6. ventilated: air moves to and from it</text>
    <text x="720" y="294">7. reached through branched tubes, so the air</text><text x="740" y="316">arrives saturated with water vapour</text>
  </g>
  <rect x="720" y="360" width="440" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="735" y="390">Gas exchange by diffusion</text>
  <text class="s" x="735" y="416">oxygen in the alveolar air diffuses into the</text><text class="s" x="735" y="438">capillaries; carbon dioxide diffuses from the</text><text class="s" x="735" y="460">blood into the alveolar air and leaves with the</text><text class="s" x="735" y="482">next breath out</text>
  <text class="s" x="720" y="560">External respiration: uptake of O2 and disposal of CO2</text><text class="s" x="720" y="582">at the body-system level (breathing and exchange in</text><text class="s" x="720" y="604">the capillaries). Cellular respiration uses the O2 inside cells.</text>
</svg>
