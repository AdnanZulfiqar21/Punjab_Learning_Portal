<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.1 and the property lists of 5.1, 5.3 and 5.11: particles in a gas, a liquid and a solid, and the effect of doubling the pressure. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="600" y="32">Gas, liquid and solid: particles, spaces and compression</text>
  <!-- gas -->
  <text class="k" x="200" y="72">Gas</text>
  <rect x="100" y="90" width="200" height="200" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#1f6fb5"><circle cx="130" cy="120" r="7"/><circle cx="250" cy="140" r="7"/><circle cx="180" cy="200" r="7"/><circle cx="270" cy="250" r="7"/><circle cx="140" cy="260" r="7"/><circle cx="215" cy="110" r="7"/></g>
  <g stroke="#1f6fb5" stroke-width="1.5"><path d="M137 114 L160 100 M243 146 L222 165 M187 194 L210 180 M263 244 L245 230 M147 254 L165 238 M222 116 L240 128"/></g>
  <g class="t"><text x="100" y="315">no fixed shape or volume: fills the container</text><text x="100" y="333">about 99.9 % empty space; compresses easily</text><text x="100" y="351">pressure = collisions with the walls</text><text x="100" y="369">ideal gas: zero particle volume, negligible forces</text><text x="100" y="387">sudden expansion cools (Joule-Thomson effect)</text></g>
  <!-- liquid -->
  <text class="k" x="600" y="72">Liquid</text>
  <rect x="500" y="90" width="200" height="200" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="502" y="170" width="196" height="118" fill="#dbe9f5"/>
  <g fill="#1f6fb5"><circle cx="520" cy="190" r="8"/><circle cx="545" cy="210" r="8"/><circle cx="570" cy="188" r="8"/><circle cx="595" cy="212" r="8"/><circle cx="620" cy="190" r="8"/><circle cx="648" cy="208" r="8"/><circle cx="675" cy="188" r="8"/><circle cx="530" cy="235" r="8"/><circle cx="558" cy="255" r="8"/><circle cx="585" cy="238" r="8"/><circle cx="612" cy="258" r="8"/><circle cx="640" cy="236" r="8"/><circle cx="668" cy="256" r="8"/><circle cx="520" cy="275" r="8"/><circle cx="572" cy="276" r="8"/><circle cx="625" cy="278" r="8"/><circle cx="680" cy="276" r="8"/></g>
  <g class="t"><text x="500" y="315">fixed volume, takes the shape of its container</text><text x="500" y="333">little space between molecules; forces stronger</text><text x="500" y="351">10^5 times less compressible than a gas,</text><text x="500" y="369">about 10 times more than a solid; flows, diffuses</text><text x="500" y="387">random motion, slower than in a gas; expands little</text></g>
  <!-- solid -->
  <text class="k" x="1000" y="72">Solid</text>
  <rect x="900" y="90" width="200" height="200" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#5b3fb5">
    <circle cx="925" cy="115" r="9"/><circle cx="955" cy="115" r="9"/><circle cx="985" cy="115" r="9"/><circle cx="1015" cy="115" r="9"/><circle cx="1045" cy="115" r="9"/><circle cx="1075" cy="115" r="9"/>
    <circle cx="925" cy="145" r="9"/><circle cx="955" cy="145" r="9"/><circle cx="985" cy="145" r="9"/><circle cx="1015" cy="145" r="9"/><circle cx="1045" cy="145" r="9"/><circle cx="1075" cy="145" r="9"/>
    <circle cx="925" cy="175" r="9"/><circle cx="955" cy="175" r="9"/><circle cx="985" cy="175" r="9"/><circle cx="1015" cy="175" r="9"/><circle cx="1045" cy="175" r="9"/><circle cx="1075" cy="175" r="9"/>
    <circle cx="925" cy="205" r="9"/><circle cx="955" cy="205" r="9"/><circle cx="985" cy="205" r="9"/><circle cx="1015" cy="205" r="9"/><circle cx="1045" cy="205" r="9"/><circle cx="1075" cy="205" r="9"/>
    <circle cx="925" cy="235" r="9"/><circle cx="955" cy="235" r="9"/><circle cx="985" cy="235" r="9"/><circle cx="1015" cy="235" r="9"/><circle cx="1045" cy="235" r="9"/><circle cx="1075" cy="235" r="9"/>
    <circle cx="925" cy="265" r="9"/><circle cx="955" cy="265" r="9"/><circle cx="985" cy="265" r="9"/><circle cx="1015" cy="265" r="9"/><circle cx="1045" cy="265" r="9"/><circle cx="1075" cy="265" r="9"/>
  </g>
  <g class="t"><text x="900" y="315">rigid, hard; definite shape and volume</text><text x="900" y="333">closely packed, strong cohesive forces</text><text x="900" y="351">particles only vibrate about mean positions</text><text x="900" y="369">spheres fill at most 74 % of space (hcp, ccp)</text><text x="900" y="387">cannot be compressed; expands very little</text></g>
  <!-- pressure effect -->
  <path d="M60 410 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="600" y="440">Doubling the pressure (Figure 5.1)</text>
  <rect x="200" y="460" width="90" height="120" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/><rect x="202" y="462" width="86" height="116" fill="#e8f1fa"/>
  <text class="s" x="245" y="600">air, 1 atm</text>
  <rect x="320" y="460" width="90" height="120" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/><rect x="322" y="520" width="86" height="58" fill="#e8f1fa"/><rect x="322" y="462" width="86" height="58" fill="#9ca3af" opacity="0.5"/>
  <text class="s" x="365" y="600">air, 2 atm: half</text>
  <text class="s" x="305" y="480" style="font-weight:700;fill:#14181f">(a)</text>
  <rect x="700" y="460" width="90" height="120" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/><rect x="702" y="462" width="86" height="116" fill="#dbe9f5"/>
  <text class="s" x="745" y="600">water, 1 atm</text>
  <rect x="820" y="460" width="90" height="120" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/><rect x="822" y="462" width="86" height="116" fill="#dbe9f5"/>
  <text class="s" x="865" y="600">water, 2 atm: 0.0045 % less</text>
  <text class="s" x="805" y="480" style="font-weight:700;fill:#14181f">(b)</text>
  <text class="s" x="600" y="500">a gas halves its volume;</text><text class="s" x="600" y="518">a liquid barely changes</text>
</svg>
