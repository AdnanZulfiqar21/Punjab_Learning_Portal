<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1360" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 9.3: the passages at the back of the mouth before and during swallowing. Schematic. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <g id="passages">
    <!-- nasal cavity top-left, oral cavity left, pharynx centre, trachea bottom-left, oesophagus bottom-right -->
    <rect x="60" y="90" width="200" height="90" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
    <rect x="60" y="240" width="200" height="110" rx="12" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/>
    <rect x="300" y="90" width="120" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
    <rect x="300" y="420" width="50" height="150" rx="8" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
    <rect x="380" y="420" width="50" height="150" rx="8" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/>
  </g>
  <use href="#passages" x="620"/>
  <!-- labels left panel -->
  <text class="h" x="260" y="50">Before swallowing</text>
  <text class="k" x="160" y="140">nasal cavity</text>
  <text class="k" x="160" y="290">oral cavity</text><text class="s" x="160" y="316">tongue shapes the bolus</text>
  <text class="k" x="360" y="140">pharynx</text><text class="s" x="360" y="166">shared by</text><text class="s" x="360" y="188">food and air</text>
  <text class="k" x="325" y="600">trachea</text>
  <text class="k" x="445" y="600">oesophagus</text>
  <!-- flaps open left: soft palate hangs down, epiglottis up -->
  <path d="M275 180 q20 20 10 50" stroke="#b5463a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text class="s" x="200" y="203" text-anchor="end">soft palate down:</text><text class="s" x="200" y="225" text-anchor="end">nose open to pharynx</text>
  <path d="M352 420 q-10 -40 10 -60" stroke="#0f7a62" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text class="s" x="200" y="440" text-anchor="end">epiglottis up:</text><text class="s" x="200" y="462" text-anchor="end">trachea open for air</text>
  <circle cx="230" cy="325" r="16" fill="#8a4b00"/><text class="s" x="230" y="370">bolus</text>
  <!-- right panel -->
  <text class="h" x="880" y="50">During swallowing</text>
  <text class="k" x="780" y="140">nasal cavity</text>
  <text class="k" x="780" y="290">oral cavity</text><text class="s" x="780" y="316">tongue up and back</text>
  <text class="k" x="980" y="140">pharynx</text>
  <text class="k" x="945" y="600">trachea</text>
  <text class="k" x="1065" y="600">oesophagus</text>
  <!-- soft palate raised: seals nasal cavity -->
  <path d="M882 180 q30 -10 38 0" stroke="#b5463a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="920" y="170" width="20" height="24" fill="#b5463a"/>
  <text class="s" x="1190" y="200" text-anchor="middle">soft palate raised against</text><text class="s" x="1190" y="222" text-anchor="middle">the back wall: nasal</text><text class="s" x="1190" y="244" text-anchor="middle">passage closed</text>
  <!-- larynx up, epiglottis lowered over trachea -->
  <path d="M920 412 h60" stroke="#0f7a62" stroke-width="10" stroke-linecap="round"/>
  <text class="s" x="1190" y="400" text-anchor="middle">larynx moves up; the</text><text class="s" x="1190" y="422" text-anchor="middle">epiglottis (cartilage flap)</text><text class="s" x="1190" y="444" text-anchor="middle">lowers and closes the trachea</text>
  <!-- bolus path -->
  <path d="M850 325 q90 -70 130 -10 q20 60 20 110 q0 50 5 110" stroke="#d7322f" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <circle cx="1002" cy="480" r="16" fill="#8a4b00"/>
  <text class="s" x="1190" y="500" text-anchor="middle">bolus passes over the</text><text class="s" x="1190" y="522" text-anchor="middle">trachea into the oesophagus</text>
  <text class="s" x="680" y="628">The start of swallowing is voluntary; once the bolus reaches the back of the mouth it becomes automatic.</text>
</svg>
