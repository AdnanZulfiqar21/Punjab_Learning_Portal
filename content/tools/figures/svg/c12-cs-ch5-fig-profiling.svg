<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: a sample cProfile report with slow_sum highlighted, and a timeit bar chart. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Profiling finds the bottleneck (after Fig 5.3 and the profiling example)</text>
  <text x="225.0" y="78.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">cProfile report (sample)</text>
  <rect x="40.0" y="88.0" width="400.0" height="34.0" rx="0" stroke="#14181f" stroke-width="1" fill="#e5e7eb"/>
  <text x="50.0" y="110.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">function</text>
  <text x="190.0" y="110.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">calls</text>
  <text x="260.0" y="110.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">tottime (s)</text>
  <text x="360.0" y="110.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">cumtime (s)</text>
  <rect x="40.0" y="122.0" width="400.0" height="34.0" rx="0" stroke="#14181f" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="144.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">main</text>
  <text x="190.0" y="144.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">1</text>
  <text x="260.0" y="144.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.000</text>
  <text x="360.0" y="144.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.080</text>
  <rect x="40.0" y="156.0" width="400.0" height="34.0" rx="0" stroke="#14181f" stroke-width="1" fill="#fde2e1"/>
  <text x="50.0" y="178.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">slow_sum</text>
  <text x="190.0" y="178.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">1</text>
  <text x="260.0" y="178.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.050</text>
  <text x="360.0" y="178.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.050</text>
  <rect x="40.0" y="190.0" width="400.0" height="34.0" rx="0" stroke="#14181f" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="212.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">fast_sum</text>
  <text x="190.0" y="212.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">1</text>
  <text x="260.0" y="212.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.010</text>
  <text x="360.0" y="212.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.010</text>
  <rect x="40.0" y="224.0" width="400.0" height="34.0" rx="0" stroke="#14181f" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="246.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">built-in sum</text>
  <text x="190.0" y="246.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">1</text>
  <text x="260.0" y="246.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.010</text>
  <text x="360.0" y="246.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">0.010</text>
  <text x="240.0" y="300.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">slow_sum takes the most time: the bottleneck</text>
  <text x="680.0" y="78.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">timeit: 10 runs each (sample)</text>
  <rect x="560.0" y="130.0" width="80.0" height="250.0" rx="0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="600.0" y="122.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">0.42 s</text>
  <text x="600.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">slow_sum (loop)</text>
  <rect x="700.0" y="326.4" width="80.0" height="53.6" rx="0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="740.0" y="318.4" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">0.09 s</text>
  <text x="740.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">fast_sum (sum())</text>
  <line x1="540.0" y1="380.0" x2="820.0" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="420.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Both give 499999500000; times differ on every computer.</text>
  <text x="450.0" y="438.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Replacing the loop with built-in sum() removes the bottleneck.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
