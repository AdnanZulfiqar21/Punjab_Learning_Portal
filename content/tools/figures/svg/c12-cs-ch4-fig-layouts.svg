  <text x="510.0" y="150.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="400">Button 2</text>
  <rect x="340.0" y="200.0" width="220.0" height="30.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
