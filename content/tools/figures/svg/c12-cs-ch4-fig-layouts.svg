  <rect x="530.0" y="82.0" width="12.0" height="2.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="548.0" y="79.0" width="9.0" height="9.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <rect x="340.0" y="130.0" width="100.0" height="30.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
