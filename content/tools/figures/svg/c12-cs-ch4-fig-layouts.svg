  <text x="627.0" y="91.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">place()</text>
  <text x="861.0" y="91.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">x</text>
  <rect x="825.0" y="82.0" width="12.0" height="2.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="843.0" y="79.0" width="9.0" height="9.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <rect x="641.6" y="129.0" width="90.0" height="28.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
  <text x="686.6" y="148.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="400">Button 1</text>
  <text x="686.6" y="173.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">x=30, y=40</text>
  <rect x="742.4" y="171.8" width="90.0" height="28.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
  <text x="787.4" y="190.8" font-size="13" fill="#14181f" text-anchor="middle" font-weight="400">Button 2</text>
  <text x="787.4" y="215.8" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">x=170, y=85</text>
  <rect x="641.6" y="224.0" width="90.0" height="28.0" rx="4" stroke="#4b5563" stroke-width="1.5" fill="#f1f3f6"/>
  <text x="686.6" y="243.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="400">Button 3</text>
  <text x="686.6" y="268.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">x=30, y=140</text>
  <text x="155.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">stacks widgets in order,</text>
  <text x="155.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">top to bottom (or side by side)</text>
  <text x="450.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">rows and columns like a table;</text>
  <text x="450.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">columnspan=2 lets a widget cross columns</text>
  <text x="745.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">exact x and y positions;</text>
  <text x="745.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">most control, needs care</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
