  <text x="770.0" y="336.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">down: the earth</text>
  <text x="770.0" y="354.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">warms</text>
