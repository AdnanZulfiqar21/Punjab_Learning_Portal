<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <!-- Original redraw after Figure 14.5: short-wave sunlight passes through the atmosphere and warms the ground; the ground's long-wave infrared is partly trapped by greenhouse gases and sent back down. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The greenhouse effect</text>
  <rect x="0.0" y="160.0" width="900.0" height="90.0" rx="0" stroke="none" stroke-width="0" fill="#dbeafe"/>
  <line x1="0.0" y1="160.0" x2="900.0" y2="160.0" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="0.0" y1="250.0" x2="900.0" y2="250.0" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="890.0" y="192.0" font-size="14" fill="#1f6fb5" text-anchor="end" font-weight="700">greenhouse gases: CO2, CH4, H2O vapour, SF6</text>
  <text x="890.0" y="212.0" font-size="13" fill="#1f6fb5" text-anchor="end" font-weight="400">absorb infrared (heat) radiation</text>
