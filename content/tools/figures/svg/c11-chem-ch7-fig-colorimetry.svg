<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original simple drawing after Figure 7.3: samples taken at intervals fade as a coloured reactant is used up; a colorimeter measures how much light each absorbs. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Following a reaction by its colour (colorimetry)</text>
  <rect x="15.0" y="55.0" width="400.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="215.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) samples taken over time</text>
  <rect x="430.0" y="55.0" width="455.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="657.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) inside a colorimeter</text>
  <path d="M55 140 L55 330 Q55 350 70 350 Q85 350 85 330 L85 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M56.5 200 L56.5 330 Q56.5 348 70 348 Q83.5 348 83.5 330 L83.5 200 Z" stroke="none" stroke-width="0" fill="#b91c1c" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="70.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <path d="M115 140 L115 330 Q115 350 130 350 Q145 350 145 330 L145 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M116.5 200 L116.5 330 Q116.5 348 130 348 Q143.5 348 143.5 330 L143.5 200 Z" stroke="none" stroke-width="0" fill="#c2410c" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="130.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">2</text>
  <path d="M175 140 L175 330 Q175 350 190 350 Q205 350 205 330 L205 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M176.5 200 L176.5 330 Q176.5 348 190 348 Q203.5 348 203.5 330 L203.5 200 Z" stroke="none" stroke-width="0" fill="#ea580c" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="190.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <path d="M235 140 L235 330 Q235 350 250 350 Q265 350 265 330 L265 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M236.5 200 L236.5 330 Q236.5 348 250 348 Q263.5 348 263.5 330 L263.5 200 Z" stroke="none" stroke-width="0" fill="#f59e0b" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <path d="M295 140 L295 330 Q295 350 310 350 Q325 350 325 330 L325 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M296.5 200 L296.5 330 Q296.5 348 310 348 Q323.5 348 323.5 330 L323.5 200 Z" stroke="none" stroke-width="0" fill="#fbbf24" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="310.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">8</text>
  <path d="M355 140 L355 330 Q355 350 370 350 Q385 350 385 330 L385 140" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M356.5 200 L356.5 330 Q356.5 348 370 348 Q383.5 348 383.5 330 L383.5 200 Z" stroke="none" stroke-width="0" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="370.0" y="375.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">10</text>
  <line x1="40.0" y1="250.0" x2="395.0" y2="250.0" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <text x="215.0" y="398.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">time / min</text>
  <line x1="60.0" y1="425.0" x2="369.6" y2="425.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380.0 425.0 L368.2 430.5 L368.2 419.5 Z" fill="#7c3aed"/>
  <text x="215.0" y="452.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">the coloured reactant is used up</text>
  <circle cx="480.0" cy="210.0" r="18.0" stroke="#d98b2b" stroke-width="2" fill="#fde047"/>
  <text x="480.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">lamp</text>
  <rect x="540.0" y="185.0" width="14.0" height="50.0" rx="0" stroke="#14181f" stroke-width="1.5" fill="#93c5fd"/>
  <text x="547.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">filter</text>
  <rect x="610.0" y="170.0" width="40.0" height="80.0" rx="0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <rect x="612.0" y="190.0" width="36.0" height="58.0" rx="0" stroke="none" stroke-width="0" fill="#ea580c"/>
  <text x="630.0" y="275.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sample</text>
  <rect x="710.0" y="185.0" width="20.0" height="50.0" rx="0" stroke="#14181f" stroke-width="1.5" fill="#334155"/>
  <text x="720.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">detector</text>
  <line x1="500.0" y1="210.0" x2="529.2" y2="210.0" stroke="#d98b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M538.0 210.0 L528.0 214.6 L528.0 205.4 Z" fill="#d98b2b"/>
  <line x1="556.0" y1="210.0" x2="599.2" y2="210.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <path d="M608.0 210.0 L598.0 214.6 L598.0 205.4 Z" fill="#1f6fb5"/>
  <line x1="652.0" y1="210.0" x2="700.8" y2="210.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M708.0 210.0 L699.8 213.8 L699.8 206.2 Z" fill="#1f6fb5"/>
  <rect x="770.0" y="170.0" width="90.0" height="70.0" rx="6" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="815.0" y="212.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">0.42</text>
  <line x1="730.0" y1="210.0" x2="770.0" y2="205.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="815.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">absorbance</text>
  <text x="450.0" y="330.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Deeper colour absorbs more light,</text>
  <text x="450.0" y="354.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">so less reaches the detector.</text>
  <text x="450.0" y="378.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Readings at regular times show how</text>
  <text x="450.0" y="402.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">fast the concentration changes.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
