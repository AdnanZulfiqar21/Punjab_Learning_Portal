<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis3-4 (C11-PHY, PDF p60): Do You Know? photograph of stunt aircraft in curved flight (no printed caption number); flat drawing after the printed photograph: against a deep blue sky, a tight formation of small jets near the bottom trails white smoke that rises in a tall arch, curves over at the top and falls away on the left, showing the curved path of the formation. No photograph is reproduced. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2f8a"/><stop offset="1" stop-color="#14206a"/></linearGradient>
  </defs>
  <rect width="800" height="1100" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="1060" fill="url(#sky)"/>
  <!-- smoke trails: rise from the formation and arch over to the left -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#7fa8ea" stroke-width="22" opacity="0.45">
      <path d="M430 880 C 440 600 470 300 400 170 C 340 70 230 90 190 190 C 150 290 150 480 160 700"/>
      <path d="M465 885 C 475 610 500 320 435 200 C 380 105 265 120 225 215 C 190 300 190 480 195 700"/>
      <path d="M500 880 C 510 620 530 340 470 230 C 420 140 300 150 262 240 C 230 320 228 480 232 700"/>
      <path d="M535 885 C 545 630 560 360 505 262 C 460 180 340 185 300 268 C 270 340 268 480 270 700"/>
    </g>
    <g stroke="#dfe9ff" stroke-width="6" opacity="0.9" stroke-dasharray="14 8">
      <path d="M430 880 C 440 600 470 300 400 170 C 340 70 230 90 190 190 C 150 290 150 480 160 700"/>
      <path d="M465 885 C 475 610 500 320 435 200 C 380 105 265 120 225 215 C 190 300 190 480 195 700"/>
      <path d="M500 880 C 510 620 530 340 470 230 C 420 140 300 150 262 240 C 230 320 228 480 232 700"/>
      <path d="M535 885 C 545 630 560 360 505 262 C 460 180 340 185 300 268 C 270 340 268 480 270 700"/>
    </g>
  </g>
  <!-- the formation of jets (seen from below) -->
  <g fill="#e9ecf4" stroke="#b9c2d6" stroke-width="2">
    <g transform="translate(480 900)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(430 930)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(530 930)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(480 960)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(380 960)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(580 960)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
    <g transform="translate(480 1010)"><path d="M0 -26 L6 -6 L28 4 L6 6 L4 20 L12 26 L0 24 L-12 26 L-4 20 L-6 6 L-28 4 L-6 -6 Z"/><circle r="3" cy="-8" fill="#d23a2e" stroke="none"/></g>
  </g>
</svg>
