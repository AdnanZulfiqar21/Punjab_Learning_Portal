<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.22: one pre-mRNA with four exons is spliced as exons 1-2-4 in one cell type and 1-3-4 in another, giving two different proteins. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Alternative splicing: one gene, more than one protein</text>
  <rect x="120.0" y="100.0" width="110.0" height="36.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="175.0" y="124.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">exon 1</text>
  <line x1="230.0" y1="118.0" x2="290.0" y2="118.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <rect x="290.0" y="100.0" width="110.0" height="36.0" rx="4" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="345.0" y="124.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">exon 2</text>
  <line x1="400.0" y1="118.0" x2="460.0" y2="118.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <rect x="460.0" y="100.0" width="110.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="515.0" y="124.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">exon 3</text>
  <line x1="570.0" y1="118.0" x2="630.0" y2="118.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <rect x="630.0" y="100.0" width="110.0" height="36.0" rx="4" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="685.0" y="124.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">exon 4</text>
  <text x="450.0" y="80.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one pre-mRNA (introns as grey lines)</text>
  <line x1="450.0" y1="150.0" x2="246.9" y2="208.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M240.0 210.0 L246.8 204.1 L248.9 211.4 Z" fill="#14181f"/>
  <text x="240.0" y="236.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cell type A: regulatory proteins splice</text>
  <rect x="75.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="130.0" y="280.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">exon 1</text>
  <rect x="185.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="240.0" y="280.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">exon 2</text>
  <rect x="295.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="350.0" y="280.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">exon 4</text>
  <line x1="240.0" y1="300.0" x2="240.0" y2="332.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M240.0 340.0 L236.2 331.8 L243.8 331.8 Z" fill="#14181f"/>
  <circle cx="190.0" cy="370.0" r="20.0" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="240.0" cy="370.0" r="20.0" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="290.0" cy="370.0" r="20.0" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="240.0" y="420.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">protein A</text>
  <line x1="450.0" y1="150.0" x2="653.1" y2="208.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M660.0 210.0 L651.1 211.4 L653.2 204.1 Z" fill="#14181f"/>
  <text x="660.0" y="236.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cell type B: regulatory proteins splice</text>
  <rect x="495.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="550.0" y="280.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">exon 1</text>
  <rect x="605.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="660.0" y="280.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">exon 3</text>
  <rect x="715.0" y="256.0" width="110.0" height="36.0" rx="4" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="770.0" y="280.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">exon 4</text>
  <line x1="660.0" y1="300.0" x2="660.0" y2="332.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M660.0 340.0 L656.2 331.8 L663.8 331.8 Z" fill="#14181f"/>
  <circle cx="610.0" cy="370.0" r="20.0" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="660.0" cy="370.0" r="20.0" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="710.0" cy="370.0" r="20.0" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="660.0" y="420.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">protein B</text>
  <text x="450.0" y="470.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">different exons kept give mRNAs of different lengths and different polypeptides</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
