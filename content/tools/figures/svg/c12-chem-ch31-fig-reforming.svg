  <rect x="15.0" y="55.0" width="870.0" height="150.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">1. isomerisation: straight chain to branched chain</text>
