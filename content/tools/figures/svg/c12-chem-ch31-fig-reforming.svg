  <circle cx="390.0" cy="470.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="475.0" y="476.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ 4H</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="390.0" y="515.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">benzene</text>
  <text x="710.0" y="468.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">14</tspan><tspan dy="-5.4"> -&gt; C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4"> + 4H</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="710.0" y="494.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">hexane -&gt; benzene</text>
  <text x="450.0" y="553.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Reforming turns low-octane straight chains into high-octane branched or aromatic fuels.</text>
