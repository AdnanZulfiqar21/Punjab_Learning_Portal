  <text x="390.0" y="355.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cyclohexane</text>
  <text x="710.0" y="308.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">14</tspan><tspan dy="-5.4"> -&gt; C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">12</tspan><tspan dy="-5.4"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
