<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="'Times New Roman', Times, serif">
  <!-- Unit 11 even/odd figure (C11-MATH, PDF p208): unit circle (cyan), magenta axes with arrows up and right only; OP at theta and OP' at -theta, dotted vertical PP', right-angle mark, curved double arrow theta / -theta; no O, x or y labels and no point dots, as printed. -->
  <defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6247f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
  <rect width="1000" height="760" fill="#fffac2"/>
  <line x1="60" y1="380" x2="760" y2="380" stroke="#d6247f" stroke-width="3" marker-end="url(#ah0)"/>
  <line x1="380" y1="720" x2="380" y2="40" stroke="#d6247f" stroke-width="3" marker-end="url(#ah0)"/>
  <circle cx="380" cy="380" r="250" fill="none" stroke="#1a9fd6" stroke-width="3"/>
  <line x1="380" y1="380" x2="565.8" y2="212.7" stroke="#1a9fd6" stroke-width="3"/>
  <line x1="380" y1="380" x2="565.8" y2="547.3" stroke="#1a9fd6" stroke-width="3"/>
  <line x1="565.8" y1="212.7" x2="565.8" y2="547.3" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3 6"/>
  <path d="M 545.8 380 L 545.8 360 L 565.8 360" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 454.9 321.5 A 95 95 0 0 1 454.9 438.5" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
  <text x="448.5" y="365.8" font-size="24" text-anchor="middle" fill="#1a1a1a">θ</text>
  <text x="446.6" y="409.6" font-size="24" text-anchor="middle" fill="#1a1a1a">−θ</text>
  <text x="392" y="118" font-size="26" text-anchor="start" fill="#1a1a1a">(0, 1)</text>
  <text x="392" y="664" font-size="26" text-anchor="start" fill="#1a1a1a">(0, −1)</text>
  <text x="642" y="364" font-size="26" text-anchor="start" fill="#1a1a1a">(1, 0)</text>
  <text x="118" y="364" font-size="26" text-anchor="end" fill="#1a1a1a">(−1, 0)</text>
  <text x="579.8" y="208.7" font-size="26" text-anchor="start" fill="#1a1a1a">(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>) = (cos θ, sin θ)</text>
  <text x="579.8" y="571.3" font-size="26" text-anchor="start" fill="#1a1a1a">(<tspan font-style="italic">x</tspan>, −<tspan font-style="italic">y</tspan>) = (cos θ, −sin θ)</text>
</svg>
