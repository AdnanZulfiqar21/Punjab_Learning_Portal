<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.15 to 4.17: maltose, lactose and sucrose. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .t{font-size:20px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:17px;fill:#ffffff;text-anchor:middle;font-weight:700}
    </style>
    <g id="hex"><polygon points="-62,0 -31,-40 31,-40 62,0 31,40 -31,40" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5" stroke-linejoin="round"/></g>
    <g id="pent"><polygon points="-55,8 -32,-38 32,-38 55,8 0,42" fill="#fff4e2" stroke="#d98b2b" stroke-width="5" stroke-linejoin="round"/></g>
    <g id="hexp"><polygon points="-62,0 -31,-40 31,-40 62,0 31,40 -31,40" fill="#e8dff7" stroke="#5b3fb5" stroke-width="5" stroke-linejoin="round"/></g>
  </defs>
  <!-- maltose -->
  <text class="h" x="200" y="50">Maltose (malt sugar)</text>
  <g transform="translate(130,200)"><use href="#hex"/><text class="t" x="0" y="7">glucose</text></g>
  <circle cx="200" cy="200" r="18" fill="#d98b2b"/><text class="b" x="200" y="206">O</text>
  <g transform="translate(270,200)"><use href="#hex"/><text class="t" x="0" y="7">glucose</text></g>
  <text class="s" x="200" y="290">glucose 1-4 glucose</text>
  <text class="s" x="200" y="316">1,4-glycosidic bond</text>
  <text class="s" x="200" y="360">cereals; made while</text><text class="s" x="200" y="386">starch is digested</text>
  <!-- lactose -->
  <text class="h" x="600" y="50">Lactose (milk sugar)</text>
  <g transform="translate(530,200)"><use href="#hexp"/><text class="t" x="0" y="7">galactose</text></g>
  <circle cx="600" cy="200" r="18" fill="#d98b2b"/><text class="b" x="600" y="206">O</text>
  <g transform="translate(670,200)"><use href="#hex"/><text class="t" x="0" y="7">glucose</text></g>
  <text class="s" x="600" y="290">galactose 1-4 glucose</text>
  <text class="s" x="600" y="316">1,4-glycosidic bond</text>
  <text class="s" x="600" y="360">only in mammalian milk;</text><text class="s" x="600" y="386">energy for infant mammals</text>
  <!-- sucrose -->
  <text class="h" x="1000" y="50">Sucrose (cane sugar)</text>
  <g transform="translate(930,200)"><use href="#hex"/><text class="t" x="0" y="7">glucose</text></g>
  <circle cx="1000" cy="200" r="18" fill="#d98b2b"/><text class="b" x="1000" y="206">O</text>
  <g transform="translate(1070,205)"><use href="#pent"/><text class="t" x="0" y="7">fructose</text></g>
  <text class="s" x="1000" y="290">glucose 1-2 fructose</text>
  <text class="s" x="1000" y="316">1,2-glycosidic bond</text>
  <text class="s" x="1000" y="360">table sugar; transport sugar</text><text class="s" x="1000" y="386">in phloem of higher plants</text>
  <text class="s" x="600" y="470">Each disaccharide forms by dehydration synthesis: two monosaccharides join through an oxygen bridge,</text>
  <text class="s" x="600" y="498">the glycosidic bond, and a water molecule is released. Hydrolysis splits them back into their monomers.</text>
  <text class="s" x="600" y="560">Disaccharides dissolve less readily in water than monosaccharides.</text>
  <text class="s" x="600" y="630">Sucrose is C12H22O11: carbon 1 of glucose bonds to carbon 2 of fructose.</text>
</svg>
