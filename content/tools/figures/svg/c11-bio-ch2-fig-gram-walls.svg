<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.3: Gram-positive and Gram-negative cell walls in cross-section. -->
  <defs>
    <style>
      .h{font-size:32px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:24px;font-weight:700;fill:#14181f}
      .s{font-size:20px;fill:#4b5563}
    </style>
    <pattern id="pg" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#c9b6ea"/>
      <path d="M0 13 H26 M13 0 V26" stroke="#5b3fb5" stroke-width="3"/>
    </pattern>
  </defs>
  <text class="h" x="260" y="70">Gram-positive</text>
  <text class="h" x="740" y="70">Gram-negative</text>
  <!-- Gram-positive stack -->
  <rect x="80" y="130" width="360" height="200" fill="url(#pg)" stroke="#5b3fb5" stroke-width="3"/>
  <text class="t" x="100" y="245">Thick peptidoglycan</text>
  <rect x="80" y="330" width="360" height="24" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="100" y="348">periplasmic space (narrow)</text>
  <rect x="80" y="354" width="360" height="46" fill="#1f6fb5"/>
  <text class="t" x="100" y="385" fill="#ffffff" style="fill:#ffffff">Cell membrane</text>
  <rect x="80" y="400" width="360" height="60" fill="#eef6fb"/>
  <text class="s" x="100" y="440">cytoplasm</text>
  <!-- Gram-negative stack -->
  <rect x="560" y="130" width="360" height="56" fill="#d98b2b"/>
  <text class="t" x="580" y="166" style="fill:#ffffff">Outer membrane</text>
  <g fill="#8a4b00">
    <circle cx="600" cy="124" r="9"/><circle cx="650" cy="124" r="9"/><circle cx="700" cy="124" r="9"/><circle cx="800" cy="124" r="9"/><circle cx="820" cy="124" r="9"/>
  </g>
  <rect x="868" y="128" width="30" height="60" rx="8" fill="#fff4e2" stroke="#8a4b00" stroke-width="3"/>
  <text class="s" x="840" y="112">porin</text>
  <text class="s" x="580" y="110">lipopolysaccharide</text>
  <rect x="560" y="186" width="360" height="110" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="580" y="215">periplasmic space (wide)</text>
  <rect x="560" y="236" width="360" height="30" fill="url(#pg)" stroke="#5b3fb5" stroke-width="3"/>
  <text class="t" x="580" y="290">Thin peptidoglycan</text>
  <rect x="560" y="296" width="360" height="46" fill="#1f6fb5"/>
  <text class="t" x="580" y="327" style="fill:#ffffff">Cell membrane</text>
  <rect x="560" y="342" width="360" height="60" fill="#eef6fb"/>
  <text class="s" x="580" y="382">cytoplasm</text>
  <!-- summary -->
  <text class="s" x="80" y="540">Less lipid · retains violet dye (purple)</text>
  <text class="s" x="560" y="540">More lipid · outer membrane resists antibiotics</text>
  <text class="s" x="80" y="580">Both: peptidoglycan = glycan chains cross-linked by short peptides</text>
</svg>
