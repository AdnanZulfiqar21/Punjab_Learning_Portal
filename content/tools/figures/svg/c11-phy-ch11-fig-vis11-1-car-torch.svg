<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f5d7c"/><stop offset="100%" stop-color="#b9c8c4"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff6c7" stop-opacity="0.95"/><stop offset="100%" stop-color="#fff6c7" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0465a"/><stop offset="100%" stop-color="#b8162b"/></linearGradient>
  </defs>
  <!-- Vis11-1 (C11-PHY, PDF p253): flat drawing after the photograph in the Do You Know? box of topic 11.3: a car on a road at dusk shines its light forward (labelled c); a man stands on the road ahead. Only the label c is printed. -->
  <rect width="1000" height="520" fill="url(#sky)"/>
  <!-- distant trees -->
  <path d="M0 330 C60 290 110 300 160 280 C220 260 260 300 320 285 C380 270 430 300 500 290 C560 280 620 300 700 285 C780 270 860 300 1000 290 L1000 360 L0 360 Z" fill="#7d9590" opacity="0.7"/>
  <!-- road -->
  <rect x="0" y="360" width="1000" height="160" fill="#3a3f46"/>
  <rect x="0" y="356" width="1000" height="8" fill="#9aa3ab"/>
  <g fill="#e9edf0"><rect x="40" y="455" width="90" height="8"/><rect x="200" y="455" width="90" height="8"/><rect x="360" y="455" width="90" height="8"/><rect x="520" y="455" width="90" height="8"/><rect x="680" y="455" width="90" height="8"/><rect x="840" y="455" width="90" height="8"/></g>
  <!-- street lamps -->
  <g stroke="#2a2f36" stroke-width="7" fill="none"><line x1="110" y1="360" x2="110" y2="95"/><path d="M110 95 Q110 80 128 80 L150 80"/><line x1="660" y1="360" x2="660" y2="95"/><path d="M660 95 Q660 80 678 80 L700 80"/></g>
  <rect x="140" y="74" width="40" height="12" rx="4" fill="#fffbe3"/>
  <rect x="690" y="74" width="40" height="12" rx="4" fill="#fffbe3"/>
  <!-- light beam from the car -->
  <path d="M455 372 L860 300 L860 440 Z" fill="url(#beam)"/>
  <!-- light c arrow -->
  <line x1="520" y1="372" x2="640" y2="372" stroke="#14181f" stroke-width="3"/>
  <path d="M656 372 L636 363 L636 381 Z" fill="#14181f"/>
  <text x="585" y="358" font-size="34" font-style="italic" fill="#14181f" text-anchor="middle">c</text>
  <!-- car -->
  <path d="M130 410 L130 365 Q132 350 150 347 L215 340 L262 300 Q272 292 290 292 L370 292 Q388 292 400 304 L432 340 L452 345 Q462 348 462 360 L462 410 Z" fill="url(#body)" stroke="#7d0f1e" stroke-width="2"/>
  <path d="M232 340 L272 304 L318 304 L318 340 Z" fill="#a9c6d6" stroke="#5a7180" stroke-width="2"/>
  <path d="M330 340 L330 304 L380 304 Q390 304 397 312 L420 340 Z" fill="#a9c6d6" stroke="#5a7180" stroke-width="2"/>
  <rect x="446" y="356" width="16" height="14" rx="3" fill="#fff6c7"/>
  <circle cx="205" cy="410" r="34" fill="#1d2126"/><circle cx="205" cy="410" r="15" fill="#c3c8cd"/>
  <circle cx="395" cy="410" r="34" fill="#1d2126"/><circle cx="395" cy="410" r="15" fill="#c3c8cd"/>
  <!-- standing observer -->
  <g stroke="#3b2a20" stroke-width="2">
    <circle cx="820" cy="215" r="17" fill="#e2b58f"/>
    <rect x="800" y="234" width="40" height="66" rx="10" fill="#8a5a3c"/>
    <rect x="804" y="298" width="14" height="60" fill="#4d6a8a"/>
    <rect x="822" y="298" width="14" height="60" fill="#4d6a8a"/>
  </g>
</svg>
