<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram for topic 7.10 (movements in plants): the four tropisms, drawn schematically; the textbook has no figure here. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- phototropism -->
  <text class="h" x="160" y="40">Phototropism</text>
  <rect x="60" y="330" width="200" height="60" rx="10" fill="#c9b27a"/>
  <path d="M160 330 q0 -120 90 -170" fill="none" stroke="#0f7a62" stroke-width="9"/>
  <path d="M250 160 q30 -30 50 0 q-30 20 -50 0 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <circle cx="290" cy="80" r="26" fill="#f2b134"/>
  <g stroke="#f2b134" stroke-width="4" marker-end="url(#ay)"><path d="M265 100 L215 150"/><path d="M250 115 L200 170"/></g>
  <path d="M160 390 q0 60 -40 110" fill="none" stroke="#8a4b00" stroke-width="6"/>
  <text class="s" x="160" y="540">shoot bends towards light</text><text class="s" x="160" y="562">(positive); root away (negative)</text>
  <!-- geotropism -->
  <text class="h" x="460" y="40">Geotropism</text>
  <rect x="360" y="300" width="200" height="60" rx="10" fill="#c9b27a"/>
  <path d="M400 320 q60 -20 60 -150" fill="none" stroke="#0f7a62" stroke-width="9"/>
  <path d="M400 340 q60 20 70 160" fill="none" stroke="#8a4b00" stroke-width="7"/>
  <path d="M560 180 V260" stroke="#4b5563" stroke-width="4" marker-end="url(#ag)"/><text class="s" x="560" y="170">gravity</text>
  <text class="s" x="460" y="540">root grows down (positive);</text><text class="s" x="460" y="562">shoot grows up (negative)</text>
  <!-- thigmotropism -->
  <text class="h" x="760" y="40">Thigmotropism</text>
  <rect x="755" y="120" width="14" height="300" fill="#9ca3af"/>
  <path d="M680 420 q20 -80 60 -100 q40 -20 45 -60 q-30 -10 -40 20 q-10 30 20 40 q40 10 30 -40 q-20 -20 -40 10 q-10 30 25 30 q35 0 25 -40" fill="none" stroke="#0f7a62" stroke-width="7"/>
  <text class="s" x="760" y="540">tendril touches a support and</text><text class="s" x="760" y="562">coils round it: climbing vines</text>
  <!-- chemotropism -->
  <text class="h" x="1040" y="40">Chemotropism</text>
  <g stroke="#8a4b00" stroke-width="5" fill="none"><path d="M960 400 q30 -80 80 -120 q30 -30 70 -40"/><path d="M960 400 q40 -40 100 -60 q40 -10 60 -30"/><path d="M960 400 q50 -20 110 -20 q30 0 50 -10"/></g>
  <circle cx="1120" cy="220" r="30" fill="#e8dff7" stroke="#5b3fb5" stroke-width="3"/>
  <text class="s" x="1120" y="226" style="fill:#5b3fb5">chemical</text>
  <text class="s" x="1040" y="540">growth towards a chemical:</text><text class="s" x="1040" y="562">fungal hyphae are chemotropic</text>
  <text class="s" x="600" y="620">Tropisms are growth movements: the whole organ curves towards or away from light, gravity, touch or a chemical.</text>
</svg>
