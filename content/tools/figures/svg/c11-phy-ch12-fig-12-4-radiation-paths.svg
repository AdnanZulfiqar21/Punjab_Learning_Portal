  <rect width="1100" height="560" fill="#ffffff"/>
  <!-- Original drawing after Figure 12.4 of the Class XI Physics textbook (PDF page 266): radiation from a radioactive substance in a lead block passes between electrically charged plates; beta rays bend to the + plate, alpha rays bend a little to the - plate and gamma rays go straight to the photographic plate. -->
