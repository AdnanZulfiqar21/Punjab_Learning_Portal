  <rect x="560.0" y="60.0" width="325.0" height="380.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#ffffff"/>
  <text x="576.0" y="92.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">where</text>
  <text x="584.0" y="112.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Indus delta (Keti Bandar, Mirpur</text>
  <text x="584.0" y="130.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Sakro); Balochistan coast</text>
  <text x="576.0" y="156.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">water and soil</text>
  <text x="584.0" y="176.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">brackish water; oxygen-poor mud;</text>
  <text x="584.0" y="194.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">trees have breathing roots</text>
  <text x="576.0" y="220.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">plants</text>
  <text x="584.0" y="240.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Avicennia marina (timmar),</text>
  <text x="584.0" y="258.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">about 95% of the forest</text>
  <text x="576.0" y="284.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">animals</text>
  <text x="584.0" y="304.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">shrimps, crabs, mudskippers, turtles,</text>
  <text x="584.0" y="322.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dolphins; flamingo, crane, pelican</text>
  <text x="576.0" y="348.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">status</text>
  <text x="584.0" y="368.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">threatened: less river water,</text>
  <text x="584.0" y="386.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Karachi pollution; restoration helps</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
