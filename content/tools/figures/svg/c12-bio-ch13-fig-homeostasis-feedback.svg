<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 13.1: the receptor, control centre and effector chain, a negative feedback loop for overheating and a positive feedback loop for childbirth. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">Homeostasis: receptors, control centre, effectors and feedback</text>
  <rect x="50" y="55" width="1100" height="210" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Three elements of homeostasis (13.1.1)</text>
  <rect x="75" y="110" width="185" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="147" y="134">Change</text>
  <text class="r" x="167" y="175" style="text-anchor:middle">temperature rises or falls</text>
  <path d="M262 130 L286 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="290" y="110" width="185" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="351" y="134">Receptors</text>
  <text class="r" x="382" y="175" style="text-anchor:middle">skin, blood vessels, hypothalamus</text>
  <path d="M477 130 L501 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="505" y="110" width="185" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="549" y="134">Control centre</text>
  <text class="r" x="597" y="175" style="text-anchor:middle">brain, spinal cord, glands</text>
  <path d="M692 130 L716 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="720" y="110" width="185" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="781" y="134">Effectors</text>
  <text class="r" x="812" y="175" style="text-anchor:middle">muscles contract, glands secrete</text>
  <path d="M907 130 L931 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="935" y="110" width="185" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="965" y="134">Set point restored</text>
  <text class="r" x="1027" y="175" style="text-anchor:middle">e.g. 37 C</text>
  <path d="M1042 190 V225 H85 V154" stroke="#d7322f" stroke-width="1.8" fill="none" marker-end="url(#p)"/>
  <text class="r" x="600" y="245" style="fill:#d7322f;text-anchor:middle">the response feeds back to the receptors</text>
  <rect x="50" y="285" width="540" height="410" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="313">Negative feedback: body too hot (13.1.2)</text>
  <rect x="110" y="320" width="300" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="184" y="344">body temperature above 37 C</text>
  <rect x="110" y="390" width="300" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="162" y="414">thermoreceptors in the hypothalamus</text>
  <rect x="110" y="460" width="300" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="182" y="484">control centre: hypothalamus</text>
  <rect x="110" y="530" width="300" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="156" y="554">effectors: sweat glands produce sweat</text>
  <rect x="110" y="600" width="300" height="40" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="176" y="624">temperature falls back to 37 C</text>
  <path d="M260 360 L260 388" stroke="#0f7a62" stroke-width="1.8" marker-end="url(#g)"/>
  <path d="M260 430 L260 458" stroke="#0f7a62" stroke-width="1.8" marker-end="url(#g)"/>
  <path d="M260 500 L260 528" stroke="#0f7a62" stroke-width="1.8" marker-end="url(#g)"/>
  <path d="M260 570 L260 598" stroke="#0f7a62" stroke-width="1.8" marker-end="url(#g)"/>
  <path d="M410 620 H470 V340 H414" stroke="#d7322f" stroke-width="1.8" fill="none" marker-end="url(#p)"/>
  <g class="r">
    <text x="478" y="470">output</text>
    <text x="478" y="486">switches</text>
    <text x="478" y="502">the signal</text>
    <text x="478" y="518">off</text>
  </g>
  <g class="r">
    <text x="70" y="670">most common: temperature, blood glucose, hormone levels</text>
  </g>
  <rect x="610" y="285" width="540" height="410" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="313">Positive feedback: childbirth (13.1.2)</text>
  <rect x="670" y="320" width="300" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="775" y="344">uterus contracts</text>
  <rect x="670" y="390" width="300" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="725" y="414">nerve impulses to the hypothalamus</text>
  <rect x="670" y="460" width="300" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="744" y="484">pituitary releases oxytocin</text>
  <rect x="670" y="530" width="300" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="761" y="554">stronger contractions</text>
  <path d="M820 360 L820 388" stroke="#d98b2b" stroke-width="1.8" marker-end="url(#o)"/>
  <path d="M820 430 L820 458" stroke="#d98b2b" stroke-width="1.8" marker-end="url(#o)"/>
  <path d="M820 500 L820 528" stroke="#d98b2b" stroke-width="1.8" marker-end="url(#o)"/>
  <path d="M970 550 H1030 V340 H974" stroke="#d7322f" stroke-width="1.8" fill="none" marker-end="url(#p)"/>
  <g class="r">
    <text x="1038" y="430">output</text>
    <text x="1038" y="446">boosts the</text>
    <text x="1038" y="462">signal</text>
  </g>
  <g class="r">
    <text x="630" y="610">the loop repeats until the baby is born; also blood clotting</text>
    <text x="630" y="626">unregulated positive feedback is harmful: cytokines in severe</text>
    <text x="630" y="642">infection can drive excessive inflammation and tissue damage</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
