<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Do You Know? (C11-PHY, PDF p40): photograph of a red hatchback car seen from the side after a crash test, its front (right) crumpled against a barrier, a test dummy inside, on a grey track in front of dark trees; flat drawing after the printed photograph. No photograph is reproduced. -->
  <rect width="1100" height="720" fill="#ffffff"/>
  <!-- background trees and track -->
  <rect x="0" y="0" width="1100" height="420" fill="#2f3a2c"/>
  <path d="M0 160 Q80 90 160 150 Q240 70 330 140 Q420 60 520 130 Q610 80 700 140 Q800 70 900 130 Q1000 80 1100 120 L1100 0 L0 0 Z" fill="#1f281d"/>
  <rect x="0" y="420" width="1100" height="300" fill="#8e8e8a"/>
  <rect x="0" y="560" width="1100" height="8" fill="#a8a8a4"/>
  <!-- barrier at the right -->
  <rect x="1000" y="250" width="100" height="320" fill="#5a5a58"/>
  <!-- shadow -->
  <ellipse cx="520" cy="585" rx="470" ry="28" fill="#5c5c58"/>
  <!-- car body: hatchback facing right, front crushed -->
  <path d="M70 470 L80 380 Q90 330 150 315 L300 245 Q360 215 470 212 L690 214 Q760 218 820 270 L880 300 Q930 300 955 330 L985 350 Q1000 380 990 420 L1000 470 Q1000 520 960 530 L120 545 Q75 545 70 500 Z" fill="#e8542f" stroke="#8a2a12" stroke-width="5" stroke-linejoin="round"/>
  <!-- crumpled bonnet and wing -->
  <path d="M820 270 L860 262 L900 300 L935 285 L960 330 L990 345 L975 370 L1000 400 L985 430 L1000 470" fill="none" stroke="#8a2a12" stroke-width="5" stroke-linejoin="round"/>
  <path d="M880 300 L905 340 L940 335 L950 380 L985 395" fill="none" stroke="#b33d1f" stroke-width="4"/>
  <path d="M900 420 L940 405 L960 445 L990 440" fill="none" stroke="#b33d1f" stroke-width="4"/>
  <!-- windows -->
  <path d="M175 320 L305 262 Q350 240 420 236 L420 330 L170 345 Z" fill="#3c4650" stroke="#8a2a12" stroke-width="4"/>
  <path d="M440 236 L640 236 Q690 238 730 290 L740 322 L440 330 Z" fill="#4a5560" stroke="#8a2a12" stroke-width="4"/>
  <line x1="430" y1="232" x2="430" y2="335" stroke="#8a2a12" stroke-width="10"/>
  <!-- test dummy inside -->
  <circle cx="610" cy="270" r="26" fill="#e3c04a" stroke="#6a5612" stroke-width="3"/>
  <path d="M575 330 L585 300 Q610 288 635 300 L645 330 Z" fill="#e3c04a"/>
  <!-- doors and side line -->
  <line x1="430" y1="335" x2="440" y2="530" stroke="#8a2a12" stroke-width="4"/>
  <line x1="740" y1="322" x2="760" y2="528" stroke="#8a2a12" stroke-width="4"/>
  <path d="M90 420 L980 400" stroke="#b33d1f" stroke-width="4"/>
  <rect x="580" y="360" width="50" height="12" rx="5" fill="#8a2a12"/>
  <rect x="320" y="370" width="50" height="12" rx="5" fill="#8a2a12"/>
  <!-- wheels -->
  <circle cx="215" cy="535" r="68" fill="#1e1e1e"/>
  <circle cx="215" cy="535" r="36" fill="#bdbdbd" stroke="#6d6d6d" stroke-width="4"/>
  <circle cx="835" cy="530" r="66" fill="#1e1e1e" transform="rotate(-8 835 530)"/>
  <circle cx="830" cy="528" r="34" fill="#bdbdbd" stroke="#6d6d6d" stroke-width="4"/>
  <!-- wheel arches -->
  <path d="M135 520 Q140 450 215 448 Q290 450 298 515" fill="none" stroke="#8a2a12" stroke-width="5"/>
  <path d="M755 515 Q760 445 832 444 Q905 448 915 505" fill="none" stroke="#8a2a12" stroke-width="5"/>
</svg>
