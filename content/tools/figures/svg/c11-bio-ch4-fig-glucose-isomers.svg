<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Consolas, Courier New, monospace">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figure 4.12: open-chain (Fischer) structures of glucose, fructose and galactose. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle;font-family:Segoe UI, Helvetica, Arial, sans-serif}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle;font-family:Segoe UI, Helvetica, Arial, sans-serif}
      .c{font-size:24px;fill:#14181f;text-anchor:middle}
      .n{font-size:16px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="200" y="50">Glucose</text><text class="s" x="200" y="78">aldose (C=O on carbon 1)</text>
  <text class="h" x="600" y="50">Fructose</text><text class="s" x="600" y="78">ketose (C=O on carbon 2)</text>
  <text class="h" x="1000" y="50">Galactose</text><text class="s" x="1000" y="78">aldose; OH on carbon 4 flipped</text>
  <!-- glucose chain -->
  <g class="c">
    <text x="200" y="140">H-C=O</text>
    <text x="200" y="210">H-C-OH</text>
    <text x="200" y="280">HO-C-H</text>
    <text x="200" y="350">H-C-OH</text>
    <text x="200" y="420">H-C-OH</text>
    <text x="200" y="490">CH2OH</text>
  </g>
  <g class="n"><text x="100" y="140">1</text><text x="100" y="210">2</text><text x="100" y="280">3</text><text x="100" y="350">4</text><text x="100" y="420">5</text><text x="100" y="490">6</text></g>
  <path d="M200 148 V190 M200 218 V260 M200 288 V330 M200 358 V400 M200 428 V470" stroke="#14181f" stroke-width="3"/>
  <!-- fructose chain -->
  <g class="c">
    <text x="600" y="140">CH2OH</text>
    <text x="600" y="210">C=O</text>
    <text x="600" y="280">HO-C-H</text>
    <text x="600" y="350">H-C-OH</text>
    <text x="600" y="420">H-C-OH</text>
    <text x="600" y="490">CH2OH</text>
  </g>
  <g class="n"><text x="500" y="140">1</text><text x="500" y="210">2</text><text x="500" y="280">3</text><text x="500" y="350">4</text><text x="500" y="420">5</text><text x="500" y="490">6</text></g>
  <path d="M600 148 V190 M600 218 V260 M600 288 V330 M600 358 V400 M600 428 V470" stroke="#14181f" stroke-width="3"/>
  <rect x="540" y="185" width="120" height="36" rx="8" fill="none" stroke="#d98b2b" stroke-width="4"/>
  <!-- galactose chain -->
  <g class="c">
    <text x="1000" y="140">H-C=O</text>
    <text x="1000" y="210">H-C-OH</text>
    <text x="1000" y="280">HO-C-H</text>
    <text x="1000" y="350">HO-C-H</text>
    <text x="1000" y="420">H-C-OH</text>
    <text x="1000" y="490">CH2OH</text>
  </g>
  <g class="n"><text x="900" y="140">1</text><text x="900" y="210">2</text><text x="900" y="280">3</text><text x="900" y="350">4</text><text x="900" y="420">5</text><text x="900" y="490">6</text></g>
  <path d="M1000 148 V190 M1000 218 V260 M1000 288 V330 M1000 358 V400 M1000 428 V470" stroke="#14181f" stroke-width="3"/>
  <rect x="930" y="325" width="140" height="36" rx="8" fill="none" stroke="#5b3fb5" stroke-width="4"/>
  <rect x="130" y="325" width="140" height="36" rx="8" fill="none" stroke="#5b3fb5" stroke-width="4"/>
  <text class="s" x="600" y="580">All three are C6H12O6. Glucose and fructose are structural isomers: the carbonyl (C=O) sits on a different carbon.</text>
  <text class="s" x="600" y="612">Glucose and galactose are stereoisomers: the same groups, but the OH on carbon 4 points the other way.</text>
  <text class="s" x="600" y="680">Open-chain drawings like these are Fischer projections (Emil Fischer, 1891); ring drawings are Haworth projections.</text>
  <text class="s" x="600" y="740">Pentoses: ribose C5H10O5 and deoxyribose C5H10O4 (nucleic acids, ATP); ribulose (photosynthesis).</text>
</svg>
