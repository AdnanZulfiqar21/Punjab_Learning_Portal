<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original formula card for topic 22.2: the mean of ungrouped and grouped data, the median, the mode of grouped data, the standard deviation, the range and the percentile rank. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Key formulas of biostatistics</text>
  <rect x="30.0" y="80.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="50.0" y="117.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">mean (ungrouped)</text>
  <text x="250.0" y="110.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">mean = &#931;x / n</text>
  <text x="250.0" y="132.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">sum of values / number of values</text>
  <rect x="30.0" y="152.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="189.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">mean (grouped)</text>
  <text x="250.0" y="182.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">mean = &#931;(f x) / &#931;f</text>
  <text x="250.0" y="204.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">x = class midpoint, f = frequency</text>
  <rect x="30.0" y="224.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="50.0" y="261.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">median</text>
  <text x="250.0" y="254.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">middle value of the ordered data</text>
  <text x="250.0" y="276.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">even n: average of the two middle values</text>
  <rect x="30.0" y="296.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="333.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">mode (grouped)</text>
  <text x="250.0" y="326.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">l + [(f<tspan font-size='12' dy='4'>m</tspan><tspan dy='-4'> &#8722; f</tspan><tspan font-size='12' dy='4'>1</tspan><tspan dy='-4'>) / ((f</tspan><tspan font-size='12' dy='4'>m</tspan><tspan dy='-4'> &#8722; f</tspan><tspan font-size='12' dy='4'>1</tspan><tspan dy='-4'>) + (f</tspan><tspan font-size='12' dy='4'>m</tspan><tspan dy='-4'> &#8722; f</tspan><tspan font-size='12' dy='4'>2</tspan><tspan dy='-4'>))] &#215; h</tspan></text>
  <text x="250.0" y="348.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">l = lower boundary of modal class, h = class width</text>
  <rect x="30.0" y="368.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="50.0" y="405.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">standard deviation</text>
  <text x="250.0" y="398.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">&#963; = &#8730;[ &#931;(x &#8722; &#956;)<tspan font-size='12' dy='-7'>2</tspan><tspan dy='7'> / N ]</tspan></text>
  <text x="250.0" y="420.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">&#956; = mean, N = number of values</text>
  <rect x="30.0" y="440.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#ffffff"/>
  <text x="50.0" y="477.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">range</text>
  <text x="250.0" y="470.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">range = X<tspan font-size='12' dy='4'>max</tspan><tspan dy='-4'> &#8722; X</tspan><tspan font-size='12' dy='4'>min</tspan></text>
  <text x="250.0" y="492.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">largest value minus smallest value</text>
  <rect x="30.0" y="512.0" width="840.0" height="62.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="50.0" y="549.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">percentile rank</text>
  <text x="250.0" y="542.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">R = (P / 100) &#215; (n + 1)</text>
  <text x="250.0" y="564.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">interpolate if R is not a whole number</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
