<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Table 5.5 and topic 5.13: crystalline and amorphous solids compared with liquid crystals, and the energetics of phase changes. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Crystalline solids, amorphous solids and liquid crystals</text>
  <!-- crystalline -->
  <text class="k" x="200" y="72">Crystalline: long-range order</text>
  <rect x="110" y="90" width="180" height="150" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#5b3fb5">
    <circle cx="130" cy="110" r="7"/><circle cx="165" cy="110" r="7"/><circle cx="200" cy="110" r="7"/><circle cx="235" cy="110" r="7"/><circle cx="270" cy="110" r="7"/>
    <circle cx="130" cy="145" r="7"/><circle cx="165" cy="145" r="7"/><circle cx="200" cy="145" r="7"/><circle cx="235" cy="145" r="7"/><circle cx="270" cy="145" r="7"/>
    <circle cx="130" cy="180" r="7"/><circle cx="165" cy="180" r="7"/><circle cx="200" cy="180" r="7"/><circle cx="235" cy="180" r="7"/><circle cx="270" cy="180" r="7"/>
    <circle cx="130" cy="215" r="7"/><circle cx="165" cy="215" r="7"/><circle cx="200" cy="215" r="7"/><circle cx="235" cy="215" r="7"/><circle cx="270" cy="215" r="7"/>
  </g>
  <g class="t">
    <text x="60" y="268">diamond, NaCl, ice: a regular 3D crystal lattice</text>
    <text x="60" y="286">definite geometrical shape; interfacial angles fixed</text>
    <text x="60" y="304">sharp melting point; cleavage along definite planes</text>
    <text x="60" y="322">anisotropic: properties depend on direction</text>
    <text x="60" y="340">grown from saturated solution by slow evaporation</text>
    <text x="60" y="358">or seeding (Na2S2O3: 231 g/100 cm3 at 100 degrees C,</text>
    <text x="60" y="376">50 at room temperature); habit: usual shape</text>
    <text x="60" y="394">(NaCl cubes become needles with 10 % urea)</text>
  </g>
  <!-- amorphous -->
  <text class="k" x="600" y="72">Amorphous: no long-range order</text>
  <rect x="510" y="90" width="180" height="150" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#d98b2b">
    <circle cx="530" cy="112" r="7"/><circle cx="560" cy="100" r="7"/><circle cx="595" cy="118" r="7"/><circle cx="630" cy="104" r="7"/><circle cx="668" cy="120" r="7"/>
    <circle cx="540" cy="150" r="7"/><circle cx="575" cy="140" r="7"/><circle cx="612" cy="152" r="7"/><circle cx="650" cy="142" r="7"/>
    <circle cx="525" cy="190" r="7"/><circle cx="560" cy="178" r="7"/><circle cx="598" cy="192" r="7"/><circle cx="640" cy="176" r="7"/><circle cx="672" cy="196" r="7"/>
    <circle cx="545" cy="222" r="7"/><circle cx="585" cy="228" r="7"/><circle cx="625" cy="218" r="7"/><circle cx="660" cy="228" r="7"/>
  </g>
  <rect x="555" y="130" width="60" height="60" fill="none" stroke="#d7322f" stroke-width="1.5" stroke-dasharray="4 3"/><text class="s" x="585" y="206" style="fill:#d7322f;font-size:11px">crystallite</text>
  <g class="t">
    <text x="470" y="268">glass, wood, plastic sulfur, charcoal, coal, coke</text>
    <text x="470" y="286">lumps or powder; small ordered regions (crystallites)</text>
    <text x="470" y="304">melt over a range of temperature; no definite</text>
    <text x="470" y="322">heat of fusion; can be moulded and blown</text>
    <text x="470" y="340">isotropic: the same in every direction</text>
  </g>
  <!-- liquid crystal -->
  <text class="k" x="1000" y="72">Liquid crystal: in between</text>
  <rect x="910" y="90" width="180" height="150" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#b2dbcc" stroke="#0f7a62" stroke-width="1.5">
    <rect x="922" y="100" width="10" height="40" rx="5" transform="rotate(8 927 120)"/><rect x="945" y="104" width="10" height="40" rx="5" transform="rotate(-6 950 124)"/><rect x="968" y="98" width="10" height="40" rx="5" transform="rotate(5 973 118)"/><rect x="991" y="106" width="10" height="40" rx="5" transform="rotate(-8 996 126)"/><rect x="1014" y="100" width="10" height="40" rx="5" transform="rotate(7 1019 120)"/><rect x="1037" y="104" width="10" height="40" rx="5" transform="rotate(-5 1042 124)"/><rect x="1060" y="99" width="10" height="40" rx="5" transform="rotate(6 1065 119)"/>
    <rect x="930" y="170" width="10" height="40" rx="5" transform="rotate(-7 935 190)"/><rect x="953" y="176" width="10" height="40" rx="5" transform="rotate(6 958 196)"/><rect x="976" y="168" width="10" height="40" rx="5" transform="rotate(-4 981 188)"/><rect x="999" y="174" width="10" height="40" rx="5" transform="rotate(8 1004 194)"/><rect x="1022" y="170" width="10" height="40" rx="5" transform="rotate(-6 1027 190)"/><rect x="1045" y="176" width="10" height="40" rx="5" transform="rotate(5 1050 196)"/><rect x="1068" y="169" width="10" height="40" rx="5" transform="rotate(-7 1073 189)"/>
  </g>
  <g class="t">
    <text x="880" y="268">rigid rod-like molecules, 4 to 8 times longer than wide,</text>
    <text x="880" y="286">lying roughly parallel like stacked firewood;</text>
    <text x="880" y="304">they migrate and spin on their long axis but</text>
    <text x="880" y="322">cannot tumble end over end</text>
    <text x="880" y="340">flow and viscosity like a liquid; optical properties</text>
    <text x="880" y="358">like a crystal; somewhat rigid; always anisotropic</text>
    <text x="880" y="376">crystal, then cloudy liquid crystal, then clear liquid</text>
    <text x="880" y="394">uses: LCD screens, thermometers, circuit-board</text>
    <text x="880" y="412">fault finding, locating warmer tumours (cholesteric)</text>
  </g>
  <!-- phase change energetics -->
  <path d="M60 430 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="600" y="458">Energetics of phase changes (topic 5.10)</text>
  <rect x="150" y="480" width="150" height="50" rx="10" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><text class="k" x="225" y="510">solid</text>
  <path d="M300 505 H440" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/><text class="s" x="375" y="470">molar heat of fusion</text><text class="s" x="375" y="552">ice: 4.6 kJ per mol (as printed)</text>
  <rect x="450" y="480" width="150" height="50" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="k" x="525" y="510">liquid</text>
  <path d="M600 505 H740" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/><text class="s" x="675" y="470">molar heat of vaporization</text><text class="s" x="675" y="552">water 40.6; NH3 21.7; HCl 15.6 kJ per mol</text>
  <rect x="750" y="480" width="150" height="50" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text class="k" x="825" y="510">gas</text>
  <text class="s" x="600" y="582">heat absorbed by one mole at the melting or boiling point at 1 atm; it gives the particles enough energy to move apart,</text>
  <text class="s" x="600" y="600">so they gain freedom to move and rotate; the size of the change measures the strength of the intermolecular forces (water highest).</text>
  <text class="s" x="600" y="624">The heat of fusion of ice matters for glaciers and polar ice sheets: melting a mole of ice takes energy without a rise in temperature.</text>
</svg>
