<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 9.7: the intestinal wall, a villus and the routes of absorption. Schematic. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- wall with folds -->
  <text class="h" x="190" y="40">Intestinal wall</text>
  <rect x="60" y="80" width="260" height="60" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/>
  <path d="M60 140 h20 q20 -60 40 0 h20 q20 -60 40 0 h20 q20 -60 40 0 h20 q20 -60 40 0 h20" fill="#f2b134" stroke="#d98b2b" stroke-width="3"/>
  <g fill="#f2b134" stroke="#d98b2b" stroke-width="2">
    <path d="M90 140 q0 -45 8 -45 q8 0 8 45 M130 140 q0 -45 8 -45 q8 0 8 45 M170 140 q0 -45 8 -45 q8 0 8 45 M210 140 q0 -45 8 -45 q8 0 8 45 M250 140 q0 -45 8 -45 q8 0 8 45 M290 140 q0 -45 8 -45 q8 0 8 45"/>
  </g>
  <text class="s" x="60" y="190">large circular folds carry</text><text class="s" x="60" y="212">countless finger-like villi;</text><text class="s" x="60" y="234">the lining looks velvety</text>
  <text class="s" x="60" y="270">lumen above, muscle wall below</text>
  <!-- villus -->
  <text class="h" x="560" y="40">One villus</text>
  <path d="M470 700 V200 q0 -110 90 -110 q90 0 90 110 V700" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <!-- epithelium -->
  <path d="M482 700 V200 q0 -98 78 -98 q78 0 78 98 V700" fill="none" stroke="#f2b134" stroke-width="10"/>
  <!-- lacteal -->
  <rect x="546" y="200" width="28" height="500" rx="14" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/>
  <!-- capillaries -->
  <path d="M505 700 V230 q0 -40 25 -40 q20 0 20 40 V330 M615 700 V230 q0 -40 -25 -40 q-20 0 -20 40 V330" fill="none" stroke="#d7322f" stroke-width="4"/>
  <path d="M505 330 q25 40 0 80 q-25 40 0 80 q25 40 0 80 M615 330 q-25 40 0 80 q25 40 0 80 q-25 40 0 80" fill="none" stroke="#1f6fb5" stroke-width="4"/>
  <path class="lead" d="M560 100 L700 80"/><text class="k" x="705" y="76">Epithelium</text><text class="s" x="705" y="98">one cell thick, with microvilli</text>
  <path class="lead" d="M575 300 L700 300"/><text class="k" x="705" y="296">Lacteal</text><text class="s" x="705" y="318">lymph vessel: takes chylomicrons</text>
  <path class="lead" d="M615 440 L700 440"/><text class="k" x="705" y="436">Blood capillaries</text><text class="s" x="705" y="458">take sugars and amino acids</text>
  <text class="s" x="470" y="785">arteriole, venule and lymph vessel at the base of the villus</text>
  <!-- microvilli inset -->
  <rect x="60" y="330" width="300" height="180" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="75" y="358">Microvilli (brush border)</text>
  <rect x="80" y="470" width="260" height="28" fill="#f2b134"/>
  <g stroke="#d98b2b" stroke-width="6" stroke-linecap="round"><path d="M100 470 v-45 M120 470 v-45 M140 470 v-45 M160 470 v-45 M180 470 v-45 M200 470 v-45 M220 470 v-45 M240 470 v-45 M260 470 v-45 M280 470 v-45 M300 470 v-45 M320 470 v-45"/></g>
  <text class="s" x="75" y="380">cytoplasmic projections of each epithelial cell;</text><text class="s" x="75" y="402">with the villi they make the surface vast</text>
  <!-- absorption routes -->
  <text class="h" x="980" y="540">Routes of absorption</text>
  <rect x="780" y="560" width="400" height="80" rx="12" fill="#f6d5cf" stroke="#b5463a" stroke-width="2"/>
  <text class="k" x="795" y="585">Sugars and amino acids</text>
  <text class="s" x="795" y="607">diffusion or active transport into the cell, then</text><text class="s" x="795" y="629">capillaries, hepatic portal vein, liver, hepatic vein</text>
  <rect x="780" y="655" width="400" height="110" rx="12" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="795" y="680">Fatty acids and glycerol</text>
  <text class="s" x="795" y="702">passive transport; rebuilt into triglycerides,</text><text class="s" x="795" y="724">coated with protein as chylomicrons;</text><text class="s" x="795" y="746">lacteal, thoracic lymphatic duct, then blood</text>
  <text class="s" x="60" y="600">Red and blue: blood capillaries.</text><text class="s" x="60" y="622">Green: lacteal. Orange: epithelium.</text>
</svg>
