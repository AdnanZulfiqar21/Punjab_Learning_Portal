<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- Original redraw after Figure 11.12: chlorine withdraws electrons from C1, which pulls on C2 and so on, the partial charges weakening along the chain. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Negative inductive effect (-I) along a carbon chain</text>
  <text x="130.0" y="180.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="144.0" y="195.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">4</text>
  <text x="280.0" y="180.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="294.0" y="195.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">3</text>
  <text x="430.0" y="180.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="444.0" y="195.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">2</text>
  <text x="580.0" y="180.1" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="594.0" y="195.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">1</text>
  <text x="730.0" y="180.1" font-size="28" fill="#0f7a62" text-anchor="middle" font-weight="700">Cl</text>
  <line x1="152.0" y1="170.0" x2="258.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M215.0 170.0 L205.9 174.2 L205.9 165.8 Z" fill="#d7322f"/>
  <line x1="302.0" y1="170.0" x2="408.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M365.0 170.0 L355.9 174.2 L355.9 165.8 Z" fill="#d7322f"/>
  <line x1="452.0" y1="170.0" x2="558.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M515.0 170.0 L505.9 174.2 L505.9 165.8 Z" fill="#d7322f"/>
  <path d="M525.0 170.0 L515.9 174.2 L515.9 165.8 Z" fill="#d7322f"/>
  <line x1="602.0" y1="170.0" x2="708.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M665.0 170.0 L655.9 174.2 L655.9 165.8 Z" fill="#d7322f"/>
  <path d="M675.0 170.0 L665.9 174.2 L665.9 165.8 Z" fill="#d7322f"/>
  <path d="M685.0 170.0 L675.9 174.2 L675.9 165.8 Z" fill="#d7322f"/>
  <text x="730.0" y="130.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">d-</text>
  <text x="580.0" y="130.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">d+</text>
  <text x="430.0" y="130.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">dd+</text>
  <text x="280.0" y="130.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">ddd+</text>
  <text x="450.0" y="250.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Cl pulls the C1-Cl electrons; electron-deficient C1 pulls on the C1-C2 bond, and so on.</text>
  <text x="450.0" y="274.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">The effect weakens along the chain: d+ &gt; dd+ &gt; ddd+ (d means a small partial charge).</text>
  <text x="450.0" y="351" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
