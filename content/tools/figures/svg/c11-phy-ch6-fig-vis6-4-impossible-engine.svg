<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Tidbits box (PDF page 130), original drawing after the printed picture: a heat engine taking heat from a single reservoir at temperature T and turning it all into work, crossed out by a prohibition sign marked IMPOSSIBLE. -->
  <defs><path id="imp" d="M125.2 637.5 A 375 375 0 0 0 774.8 637.5"/></defs>
  <rect width="900" height="900" fill="#ffffff"/>
  <rect x="200.0" y="220.0" width="400.0" height="90.0" rx="0" stroke="#b5121b" stroke-width="0" fill="#e8202a"/>
  <text x="400.0" y="278.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="400">Temperature <tspan font-style="italic">T</tspan></text>
  <rect x="280.0" y="310.0" width="150.0" height="230.0" rx="0" stroke="none" stroke-width="0" fill="#f08a24"/>
  <text x="355.0" y="370.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400">Heat in</text>
  <line x1="355.0" y1="390.0" x2="355.0" y2="444.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M355.0 460.0 L346.6 440.0 L363.4 440.0 Z" fill="#1a1a1a"/>
  <rect x="430.0" y="520.0" width="250.0" height="130.0" rx="0" stroke="none" stroke-width="0" fill="#f08a24"/>
  <circle cx="400.0" cy="590.0" r="110.0" stroke="#111" stroke-width="2" fill="#111"/>
  <text x="410.0" y="580.0" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="400">Heat</text>
  <text x="410.0" y="618.0" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="400">engine</text>
  <line x1="520.0" y1="592.0" x2="555.6" y2="592.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M570.0 592.0 L552.0 599.6 L552.0 584.4 Z" fill="#1a1a1a"/>
  <text x="578.0" y="603.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">work</text>
  <circle cx="450.0" cy="450.0" r="360.0" stroke="#26318f" stroke-width="56" fill="none"/>
  <line x1="704.6" y1="195.4" x2="195.4" y2="704.6" stroke="#26318f" stroke-width="56" stroke-linecap="butt"/>
  <text font-size="38" font-weight="700" fill="#ffffff" letter-spacing="3"><textPath href="#imp" startOffset="50%" text-anchor="middle">IMPOSSIBLE</textPath></text>
</svg>
