<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for topic 26.1.2: ethane-1,2-diol and benzene-1,4-dicarboxylic acid lose water to form PET (Terylene), repeat unit -O-CH2CH2-O-CO-C6H4-CO-, joined by ester links. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Polyesters: PET (Terylene)</text>
  <text x="150.0" y="110.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOCH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">OH</tspan></text>
  <text x="150.0" y="138.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">ethane-1,2-diol</text>
  <text x="310.0" y="116.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <text x="420.0" y="116.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">HOOC-</tspan></text>
  <path d="M481.0 110.0 L468.0 132.5 L442.0 132.5 L429.0 110.0 L442.0 87.5 L468.0 87.5 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="455.0" cy="110.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="490.0" y="116.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">-COOH</tspan></text>
  <text x="455.0" y="158.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">benzene-1,4-dicarboxylic acid</text>
  <line x1="450.0" y1="180.0" x2="450.0" y2="221.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 230.0 L445.4 220.0 L454.6 220.0 Z" fill="#14181f"/>
  <text x="470.0" y="210.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">H from the diol and -OH from the acid leave as water</text>
  <path d="M298.0 260.0 L290.0 260.0 L290.0 340.0 L298.0 340.0" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M632.0 260.0 L640.0 260.0 L640.0 340.0 L632.0 340.0" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="646.0" y="342.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">n</text>
  <text x="508.0" y="306.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">-O-CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">-O-CO-</tspan></text>
  <path d="M561.0 300.0 L548.0 322.5 L522.0 322.5 L509.0 300.0 L522.0 277.5 L548.0 277.5 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="535.0" cy="300.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="565.0" y="306.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">-CO-</tspan></text>
  <text x="440.0" y="370.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">repeat unit of poly(ethylene terephthalate), PET; the -COO- groups are ester links</text>
  <text x="450.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">strong fibres that resist creasing (an alternative to cotton); PET bottles for drinks and food;</text>
  <text x="450.0" y="428.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">glass-fibre-reinforced cross-linked polyesters are hard plastics</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
