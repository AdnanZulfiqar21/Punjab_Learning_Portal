<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 18.4 and 18.5: the four ABO groups with their genotypes, red-cell antigens and plasma antibodies, the Rh groups, and the universal donor and recipient. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">ABO and Rh blood groups</text>
  <text x="160.0" y="92.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">group</text>
  <text x="310.0" y="92.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">genotype</text>
  <text x="470.0" y="92.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">antigens on red cells</text>
  <text x="690.0" y="92.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">antibodies in plasma</text>
  <rect x="40.0" y="104.0" width="820.0" height="72.0" rx="6" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="160.0" y="148.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="310.0" y="145.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">IA IA or IA i</text>
  <circle cx="470.0" cy="140.0" r="26.0" stroke="#991b1b" stroke-width="2" fill="#fecaca"/>
  <rect x="496.0" y="135.0" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <rect x="480.5" y="161.8" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <rect x="449.5" y="161.8" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <rect x="434.0" y="135.0" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <rect x="449.5" y="108.2" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <rect x="480.5" y="108.2" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <text x="690.0" y="145.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">anti-B</text>
  <rect x="40.0" y="186.0" width="820.0" height="72.0" rx="6" stroke="#e2e8f0" stroke-width="1" fill="#ffffff"/>
  <text x="160.0" y="230.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="310.0" y="227.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">IB IB or IB i</text>
  <circle cx="470.0" cy="222.0" r="26.0" stroke="#991b1b" stroke-width="2" fill="#fecaca"/>
  <path d="M501.0 215.0 L507.0 227.0 L495.0 227.0 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M485.5 241.8 L491.5 253.8 L479.5 253.8 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M454.5 241.8 L460.5 253.8 L448.5 253.8 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M439.0 215.0 L445.0 227.0 L433.0 227.0 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M454.5 188.2 L460.5 200.2 L448.5 200.2 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M485.5 188.2 L491.5 200.2 L479.5 200.2 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="690.0" y="227.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">anti-A</text>
  <rect x="40.0" y="268.0" width="820.0" height="72.0" rx="6" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <text x="160.0" y="312.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">AB</text>
  <text x="310.0" y="309.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">IA IB</text>
  <circle cx="470.0" cy="304.0" r="26.0" stroke="#991b1b" stroke-width="2" fill="#fecaca"/>
  <rect x="496.0" y="299.0" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <path d="M485.5 323.8 L491.5 335.8 L479.5 335.8 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="449.5" y="325.8" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <path d="M439.0 297.0 L445.0 309.0 L433.0 309.0 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="449.5" y="272.2" width="10.0" height="10.0" rx="2" stroke="#1f6fb5" stroke-width="1" fill="#93c5fd"/>
  <path d="M485.5 270.2 L491.5 282.2 L479.5 282.2 Z" stroke="#d98b2b" stroke-width="1" fill="#fdba74" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="690.0" y="309.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">none</text>
  <rect x="40.0" y="350.0" width="820.0" height="72.0" rx="6" stroke="#e2e8f0" stroke-width="1" fill="#ffffff"/>
  <text x="160.0" y="394.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <text x="310.0" y="391.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">i i</text>
  <circle cx="470.0" cy="386.0" r="26.0" stroke="#991b1b" stroke-width="2" fill="#fecaca"/>
  <text x="690.0" y="391.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">anti-A and anti-B</text>
  <text x="450.0" y="470.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Rh system: DD or Dd = Rh-positive (antigen D present); dd = Rh-negative</text>
  <text x="450.0" y="494.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Rh-negative people make anti-Rh antibodies only after receiving Rh-positive blood</text>
  <rect x="140.0" y="520.0" width="620.0" height="76.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="450.0" y="548.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">O-negative: no A, B or Rh antigen: universal donor</text>
  <text x="450.0" y="574.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">AB-positive: no anti-A, anti-B or anti-Rh antibody: universal recipient</text>
  <text x="450.0" y="611" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
