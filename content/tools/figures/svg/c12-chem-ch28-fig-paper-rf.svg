  <line x1="680.0" y1="380.0" x2="680.0" y2="239.2" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <path d="M680.0 232.0 L683.8 240.2 L676.2 240.2 Z" fill="#7c3aed"/>
  <text x="690.0" y="310.0" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="700">x</text>
  <line x1="735.0" y1="380.0" x2="735.0" y2="149.2" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M735.0 142.0 L738.8 150.2 L731.2 150.2 Z" fill="#d7322f"/>
  <text x="745.0" y="265.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">y</text>
  <text x="600.0" y="128.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700">solvent front</text>
  <text x="600.0" y="400.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">starting point</text>
  <text x="780.0" y="430.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">Rf = x / y</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
