<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram after Figures 28.2 and 28.3: paper in a covered tank with the solvent below the pencil baseline; the sample separates into spots A, B and C; Rf is the distance moved by the spot (x) divided by the distance moved by the solvent front (y). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Paper chromatography and the Rf value</text>
  <rect x="15.0" y="55.0" width="440.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="235.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the apparatus</text>
  <rect x="80.0" y="110.0" width="220.0" height="300.0" rx="4" stroke="#475569" stroke-width="2.5" fill="none"/>
  <rect x="82.0" y="355.0" width="216.0" height="53.0" rx="0" stroke="none" stroke-width="0" fill="#bfdbfe"/>
  <line x1="86.0" y1="361.0" x2="294.0" y2="361.0" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="86.0" y1="369.0" x2="294.0" y2="369.0" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="86.0" y1="377.0" x2="294.0" y2="377.0" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <rect x="72.0" y="100.0" width="236.0" height="10.0" rx="2" stroke="#475569" stroke-width="2" fill="#cbd5e1"/>
  <rect x="150.0" y="100.0" width="60.0" height="290.0" rx="0" stroke="#a8a29e" stroke-width="1.5" fill="#fafaf9"/>
  <line x1="150.0" y1="335.0" x2="210.0" y2="335.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="180.0" cy="335.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <line x1="150.0" y1="150.0" x2="210.0" y2="150.0" stroke="#d7322f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="180.0" cy="285.0" r="6.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <text x="130.0" y="290.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">A</text>
  <circle cx="180.0" cy="240.0" r="6.0" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="130.0" y="245.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">B</text>
  <circle cx="180.0" cy="190.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <text x="130.0" y="195.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">C</text>
  <text x="320.0" y="103.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">lid</text>
  <text x="320.0" y="154.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">solvent front</text>
  <text x="320.0" y="339.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">baseline (pencil)</text>
  <text x="320.0" y="380.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">solvent below the</text>
  <text x="320.0" y="396.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">baseline at the start</text>
  <text x="235.0" y="435.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the sample spot separates into A, B and C</text>
  <rect x="470.0" y="55.0" width="415.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="677.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">measuring Rf</text>
  <rect x="540.0" y="100.0" width="110.0" height="310.0" rx="0" stroke="#a8a29e" stroke-width="1.5" fill="#fafaf9"/>
