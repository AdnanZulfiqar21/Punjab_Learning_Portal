<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original: a confusion matrix with TP 40, FN 5, FP 10, TN 50 and the four metric calculations. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Confusion matrix and evaluation metrics (after 6.7)</text>
  <text x="250.0" y="80.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">predicted</text>
  <text x="180.0" y="108.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">positive</text>
  <text x="320.0" y="108.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">negative</text>
  <text x="55.0" y="200.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 55.0 200.0)">actual</text>
  <text x="95.0" y="165.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 95.0 165.0)">positive</text>
  <text x="95.0" y="275.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 95.0 275.0)">negative</text>
  <rect x="110.0" y="120.0" width="140.0" height="110.0" rx="0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="180.0" y="170.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">TP = 40</text>
  <text x="180.0" y="195.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">correct positive</text>
  <rect x="250.0" y="120.0" width="140.0" height="110.0" rx="0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="320.0" y="170.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">FN = 5</text>
  <text x="320.0" y="195.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">missed positive</text>
  <rect x="110.0" y="230.0" width="140.0" height="110.0" rx="0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="180.0" y="280.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">FP = 10</text>
  <text x="180.0" y="305.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">false alarm</text>
  <rect x="250.0" y="230.0" width="140.0" height="110.0" rx="0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="320.0" y="280.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">TN = 50</text>
  <text x="320.0" y="305.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">correct negative</text>
  <rect x="450.0" y="110.0" width="420.0" height="250.0" rx="10" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="470.0" y="145.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">accuracy = (TP + TN) / all</text>
  <text x="470.0" y="175.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">  = 90 / 105 = 0.857</text>
  <text x="470.0" y="205.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">precision = TP / (TP + FP)</text>
  <text x="470.0" y="235.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">  = 40 / 50 = 0.8</text>
  <text x="470.0" y="265.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">recall = TP / (TP + FN)</text>
  <text x="470.0" y="295.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">  = 40 / 45 = 0.8889</text>
  <text x="470.0" y="325.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">F1 = 2 x P x R / (P + R) = 0.8421</text>
  <text x="450.0" y="395.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Precision: of the cases called positive, how many really are.</text>
  <text x="450.0" y="413.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Recall: of the real positive cases, how many were found.</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
