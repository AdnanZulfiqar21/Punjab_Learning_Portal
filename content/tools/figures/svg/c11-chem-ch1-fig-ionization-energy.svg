<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.6: the pattern of first ionization energies across periods 1 to 3, drawn qualitatively (heights are not measured values), with the textbook's values where it gives them. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .e{font-size:14px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:15px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="36">First ionization energy across periods 1 to 3 (shape of the trend)</text>
  <!-- axes -->
  <path d="M80 400 V70 M80 400 H1140" stroke="#4b5563" stroke-width="2"/>
  <text class="t" x="20" y="90" transform="rotate(-90 20 90)" text-anchor="end">first ionization energy, kJ per mol</text>
  <text class="s" x="600" y="440">atomic number, period 1 (H, He), period 2 (Li to Ne), period 3 (Na to Ar)</text>
  <!-- qualitative heights: noble gases peaks, alkali metals troughs; dips at B/Al (p starts) and O/S (pairing) -->
  <g stroke="#d7322f" stroke-width="3" fill="none">
    <polyline points="110,220 170,90 230,330 290,280 350,290 410,250 470,210 530,215 590,170 650,120 710,340 770,310 830,330 890,300 950,275 1010,278 1070,245 1130,210"/>
  </g>
  <g fill="#d7322f"><circle cx="110" cy="220" r="5"/><circle cx="170" cy="90" r="5"/><circle cx="230" cy="330" r="5"/><circle cx="290" cy="280" r="5"/><circle cx="350" cy="290" r="5"/><circle cx="410" cy="250" r="5"/><circle cx="470" cy="210" r="5"/><circle cx="530" cy="215" r="5"/><circle cx="590" cy="170" r="5"/><circle cx="650" cy="120" r="5"/><circle cx="710" cy="340" r="5"/><circle cx="770" cy="310" r="5"/><circle cx="830" cy="330" r="5"/><circle cx="890" cy="300" r="5"/><circle cx="950" cy="275" r="5"/><circle cx="1010" cy="278" r="5"/><circle cx="1070" cy="245" r="5"/><circle cx="1130" cy="210" r="5"/></g>
  <g class="e">
    <text x="110" y="420">H</text><text x="170" y="420">He</text><text x="230" y="420">Li</text><text x="290" y="420">Be</text><text x="350" y="420">B</text><text x="410" y="420">C</text><text x="470" y="420">N</text><text x="530" y="420">O</text><text x="590" y="420">F</text><text x="650" y="420">Ne</text><text x="710" y="420">Na</text><text x="770" y="420">Mg</text><text x="830" y="420">Al</text><text x="890" y="420">Si</text><text x="950" y="420">P</text><text x="1010" y="420">S</text><text x="1070" y="420">Cl</text><text x="1130" y="420">Ar</text>
  </g>
  <text class="t" x="180" y="80">He: highest</text>
  <text class="t" x="655" y="110">Ne</text>
  <text class="t" x="1135" y="200">Ar</text>
  <text class="t" x="215" y="360">Li: lowest in period 2</text>
  <text class="t" x="700" y="370">Na: 494 kJ/mol (lowest in period 3)</text>
  <text class="t" x="440" y="200">N 1403</text><text class="t" x="520" y="245">O 1365</text>
  <!-- notes -->
  <g font-size="15" fill="#4b5563">
    <text x="80" y="480">Across a period the value rises: same shell, more nuclear charge, electrons held harder; the noble gas (full ns2 np6) is the peak.</text>
    <text x="80" y="505">Down a group it falls (Li greater than Na greater than K greater than Rb greater than Cs): bigger atom, more shielding.</text>
    <text x="80" y="530">Two dips in each period: after Be and Mg, when the next electron goes into a higher p subshell (B, Al);</text>
    <text x="80" y="555">and after N and P, when the next electron pairs up in a p orbital (O, S) and spin-pair repulsion makes it easier to remove.</text>
    <text x="80" y="580">Half-filled and fully filled subshells are stable: nitrogen (2p3, 1403 kJ/mol) is harder to ionise than oxygen (2p4, 1365 kJ/mol).</text>
    <text x="80" y="615">Ionization energies of one element rise with each electron removed: Ca 590, then 1150, then 4940 kJ/mol (the third pulls from a full shell).</text>
  </g>
  <text class="s" x="600" y="648">Heights follow the trend only; values printed are those given in the text.</text>
</svg>
