<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: virus, phishing, ransomware, spyware and DDoS with one-line descriptions, and the harm they cause. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Common cyberattacks and their harm (after 9.2)</text>
  <rect x="40.0" y="75.0" width="520.0" height="54.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="98.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">virus</text>
  <text x="60.0" y="118.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">spreads through infected files; damages or deletes data</text>
  <rect x="40.0" y="141.0" width="520.0" height="54.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="164.0" font-size="15" fill="#d98b2b" text-anchor="start" font-weight="700">phishing</text>
  <text x="60.0" y="184.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">fake emails or sites trick you into giving passwords</text>
  <rect x="40.0" y="207.0" width="520.0" height="54.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="230.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">ransomware</text>
  <text x="60.0" y="250.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">locks your files and demands payment</text>
  <rect x="40.0" y="273.0" width="520.0" height="54.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="296.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">spyware</text>
  <text x="60.0" y="316.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">secretly collects your information</text>
  <rect x="40.0" y="339.0" width="520.0" height="54.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#ffffff"/>
  <text x="60.0" y="362.0" font-size="15" fill="#0e9aa7" text-anchor="start" font-weight="700">DDoS attack</text>
  <text x="60.0" y="382.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">floods a website with traffic until it crashes</text>
  <rect x="590.0" y="75.0" width="280.0" height="320.0" rx="10" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="730.0" y="102.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">harm caused</text>
  <text x="605.0" y="135.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">people: lost files,</text>
  <text x="605.0" y="157.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">passwords or money;</text>
  <text x="605.0" y="179.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">identity theft</text>
  <text x="605.0" y="201.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="605.0" y="223.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">organisations: data</text>
  <text x="605.0" y="245.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">breaches, stopped</text>
  <text x="605.0" y="267.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">services, lost trust,</text>
  <text x="605.0" y="289.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">money and reputation</text>
  <text x="450.0" y="445.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Most attacks are avoided by safe browsing, antivirus software and care with emails and links.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
