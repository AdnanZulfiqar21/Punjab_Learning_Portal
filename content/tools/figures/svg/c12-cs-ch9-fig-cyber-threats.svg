<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1210" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="1210" fill="#ffffff"/>
  <!-- Roman Urdu only: the five attacks of section 9.2 and who they harm (our own figure, not a book figure). -->
  <rect x="30.0" y="20.0" width="940.0" height="128.0" rx="16" fill="#fdecea" stroke="#c23a32" stroke-width="4"/>
  <rect x="30.0" y="20.0" width="18.0" height="128.0" rx="8" fill="#c23a32" stroke="none" stroke-width="0"/>
  <text x="74.0" y="78.0" font-size="42" fill="#c23a32" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Virus</text>
  <text x="74.0" y="120.0" font-size="32" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">mutasira files se phail kar data kharab</text>
  <rect x="30.0" y="170.0" width="940.0" height="128.0" rx="16" fill="#fdf3e3" stroke="#c27a14" stroke-width="4"/>
  <rect x="30.0" y="170.0" width="18.0" height="128.0" rx="8" fill="#c27a14" stroke="none" stroke-width="0"/>
  <text x="74.0" y="228.0" font-size="42" fill="#c27a14" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Phishing</text>
  <text x="74.0" y="270.0" font-size="32" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">jaali email ya website, password ki chori</text>
  <rect x="30.0" y="320.0" width="940.0" height="128.0" rx="16" fill="#f1ebfb" stroke="#7240c4" stroke-width="4"/>
  <rect x="30.0" y="320.0" width="18.0" height="128.0" rx="8" fill="#7240c4" stroke="none" stroke-width="0"/>
  <text x="74.0" y="378.0" font-size="42" fill="#7240c4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Ransomware</text>
  <text x="74.0" y="420.0" font-size="32" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">data band, kholne ke liye paisay ki maang</text>
  <rect x="30.0" y="470.0" width="940.0" height="128.0" rx="16" fill="#e8f1fb" stroke="#2a6db0" stroke-width="4"/>
  <rect x="30.0" y="470.0" width="18.0" height="128.0" rx="8" fill="#2a6db0" stroke="none" stroke-width="0"/>
  <text x="74.0" y="528.0" font-size="42" fill="#2a6db0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Spyware</text>
  <text x="74.0" y="570.0" font-size="32" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">chupke se user ki maloomat jama</text>
  <rect x="30.0" y="620.0" width="940.0" height="128.0" rx="16" fill="#e5f5f6" stroke="#13838f" stroke-width="4"/>
  <rect x="30.0" y="620.0" width="18.0" height="128.0" rx="8" fill="#13838f" stroke="none" stroke-width="0"/>
  <text x="74.0" y="678.0" font-size="42" fill="#13838f" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">DDoS</text>
  <text x="74.0" y="720.0" font-size="32" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">website par itna bojh ke crash</text>
  <rect x="30.0" y="790.0" width="940.0" height="400.0" rx="18" fill="#f5f6f8" stroke="#1d2330" stroke-width="4"/>
  <text x="500.0" y="856.0" font-size="42" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Nuqsan kis ko?</text>
  <text x="70.0" y="940.0" font-size="38" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Afraad:</text>
  <text x="70.0" y="990.0" font-size="34" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">files, passwords ya paisa kho sakte</text>
  <text x="70.0" y="1070.0" font-size="38" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Idare:</text>
  <text x="70.0" y="1120.0" font-size="34" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">data breach, rukay kaam, gahakon ka bharosa,</text>
  <text x="70.0" y="1165.0" font-size="34" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">saakh aur maali nuqsan</text>
</svg>
