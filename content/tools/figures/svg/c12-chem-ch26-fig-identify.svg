<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Table 26.1 and the book's examples: the backbone shows the polymer type; for poly(phenylethene) the repeat unit -CH2-CH(C6H5)- gives the monomer phenylethene; for Kevlar adding water across the amide links gives benzene-1,4-diamine and benzene-1,4-dicarboxylic acid (or its dioyl chloride). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Identifying a polymer from a section</text>
  <rect x="15.0" y="55.0" width="870.0" height="180.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">step 1: look at the backbone</text>
  <rect x="20.0" y="95.0" width="200.0" height="120.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="120.0" y="125.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">only C-C bonds in the chain</text>
  <text x="120.0" y="160.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">addition polymer</text>
  <text x="120.0" y="190.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">poly(ethene), PVC, PTFE</text>
  <rect x="240.0" y="95.0" width="200.0" height="120.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="340.0" y="125.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">-COO- (ester) links</text>
  <text x="340.0" y="160.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">polyester</text>
  <text x="340.0" y="190.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Terylene (PET), PLA</text>
  <rect x="460.0" y="95.0" width="200.0" height="120.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="560.0" y="125.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">-CONH- (amide) links</text>
  <text x="560.0" y="160.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">polyamide</text>
  <text x="560.0" y="190.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">nylon-6,6, Kevlar</text>
  <rect x="680.0" y="95.0" width="200.0" height="120.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="780.0" y="125.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">benzene rings in the chain</text>
  <text x="780.0" y="160.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">aromatic polymer</text>
  <text x="780.0" y="190.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">PET, Kevlar</text>
  <rect x="15.0" y="245.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="275.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">steps 2 and 3 for an addition polymer: poly(phenylethene)</text>
  <text x="170.0" y="341.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CH(C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8">)-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CH(C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8">)-</tspan></text>
  <line x1="320.0" y1="335.0" x2="352.0" y2="335.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M360.0 335.0 L350.9 339.2 L350.9 330.8 Z" fill="#14181f"/>
  <text x="470.0" y="341.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[-CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">-CH(C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">)-]</tspan><tspan dy="5.4" font-size="11.9">n</tspan></text>
  <text x="470.0" y="369.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">repeat unit</text>
  <line x1="575.0" y1="335.0" x2="607.0" y2="335.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M615.0 335.0 L605.9 339.2 L605.9 330.8 Z" fill="#14181f"/>
  <text x="730.0" y="341.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">=CH(C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">)</tspan></text>
  <text x="730.0" y="369.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">monomer: put back the C=C</text>
  <rect x="15.0" y="430.0" width="870.0" height="185.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="460.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">for a condensation polymer: Kevlar</text>
  <text x="450.0" y="485.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">repeat unit [-NH-C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">-NH-CO-C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">-CO-]</tspan><tspan dy="5.1" font-size="11.2">n</tspan></text>
  <text x="450.0" y="515.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">add water back across each amide link: -OH to C=O, -H to N</text>
  <text x="450.0" y="549.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">monomers: H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> and HOOC-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-COOH (or ClOC-C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">-COCl)</tspan></text>
  <text x="450.0" y="577.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(the rings are joined at the 1,4-positions)</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
