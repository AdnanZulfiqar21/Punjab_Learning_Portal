<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 860" font-family="'Times New Roman', Times, serif">
  <!-- Example 13(b) graph (C11-MATH, PDF p238): axes with arrows (no letters printed), the line y = x + 3 with an arrow, points (0, 3), (2, 5), (4, 7) and a dashed line at x = 3. The book draws (3, 6) as a solid dot; it is drawn as an open circle (a hole), since g(3) is not defined (existing Book correction). -->
  <defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6247f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a9fd6"/></marker></defs>
  <rect width="780" height="860" fill="#fffac2"/>
  <line x1="220" y1="740" x2="750.4" y2="740" stroke="#d6247f" stroke-width="3.5" marker-end="url(#ah0)"/>
  <line x1="220" y1="740" x2="220" y2="22.4" stroke="#d6247f" stroke-width="3.5" marker-end="url(#ah0)"/>
  <line x1="17.2" y1="708.8" x2="633.4" y2="92.6" stroke="#1a9fd6" stroke-width="3.5" marker-end="url(#ah1)"/>
  <line x1="454" y1="281" x2="454" y2="740" stroke="#1a9fd6" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="220" cy="506" r="7.5" fill="#1a1a1a"/>
  <text x="206" y="514" font-size="28" text-anchor="end" fill="#1a1a1a">(0, 3)</text>
  <circle cx="376" cy="350" r="7.5" fill="#1a1a1a"/>
  <text x="362" y="340" font-size="28" text-anchor="end" fill="#1a1a1a">(2, 5)</text>
  <circle cx="532" cy="194" r="7.5" fill="#1a1a1a"/>
  <text x="516" y="184" font-size="28" text-anchor="end" fill="#1a1a1a">(4, 7)</text>
  <circle cx="454" cy="272" r="8.5" fill="#fffac2" stroke="#1a1a1a" stroke-width="3"/>
  <text x="470" y="284" font-size="28" text-anchor="start" fill="#1a1a1a">(3, 6)</text>
</svg>
