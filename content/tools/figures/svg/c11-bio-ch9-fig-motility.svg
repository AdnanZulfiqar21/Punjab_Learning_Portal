<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1260" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.4 and 9.5: peristalsis, segmentation, and the oesophagus with its sphincter. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <!-- peristalsis -->
  <text class="h" x="260" y="40">Peristalsis</text>
  <text class="s" x="260" y="68">a wave of contraction travels along the tube</text>
  <path d="M60 130 h120 q30 0 40 25 q10 25 40 25 h180 M60 230 h120 q30 0 40 -25 q10 -25 40 -25 h180" fill="none" stroke="#d98b2b" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 130 h120 q30 0 40 25 q10 25 40 25 h180 v-50 h-180 q-30 0 -40 -25 q-10 -25 -40 -25 h-120 z" fill="#fff4e2" opacity="0.6"/>
  <circle cx="330" cy="180" r="24" fill="#8a4b00"/>
  <path d="M390 180 h60" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="200" y="290">muscle contracts behind the bolus,</text><text class="s" x="200" y="312">relaxes ahead: food is squeezed along</text>
  <text class="s" x="260" y="350">rhythmic waves in the smooth muscle of the wall,</text><text class="s" x="260" y="372">from the oesophagus to the rectum</text>
  <!-- segmentation -->
  <text class="h" x="700" y="40">Segmentation</text>
  <text class="s" x="700" y="68">rings of muscle contract and relax in place</text>
  <path d="M520 130 h50 q30 0 30 25 q0 25 30 25 h30 q30 0 30 -25 q0 -25 30 -25 h30 q30 0 30 25 q0 25 30 25 h40 M520 230 h50 q30 0 30 -25 q0 -25 30 -25 h30 q30 0 30 25 q0 25 30 25 h30 q30 0 30 -25 q0 -25 30 -25 h40" fill="none" stroke="#d98b2b" stroke-width="8" stroke-linecap="round"/>
  <g fill="#8a4b00"><circle cx="580" cy="180" r="12"/><circle cx="700" cy="180" r="12"/><circle cx="820" cy="180" r="12"/></g>
  <g stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"><path d="M640 160 h-30"/><path d="M640 200 h30"/><path d="M760 160 h-30"/><path d="M760 200 h30"/></g>
  <text class="s" x="700" y="290">back-and-forth movement in the same place</text><text class="s" x="700" y="312">mixes food with digestive juices and</text><text class="s" x="700" y="334">improves absorption in the intestines</text>
  <!-- oesophagus and sphincter -->
  <text class="h" x="1030" y="40">Oesophagus</text>
  <rect x="990" y="80" width="80" height="60" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="s" x="1030" y="116">pharynx</text>
  <path d="M1030 140 V330" stroke="#d98b2b" stroke-width="26"/>
  <text class="s" x="1150" y="230">about 25 cm;</text><text class="s" x="1150" y="252">saliva keeps acting</text>
  <path d="M1000 330 h60" stroke="#d7322f" stroke-width="10" stroke-linecap="round"/>
  <text class="s" x="905" y="330" text-anchor="end">cardiac (lower</text><text class="s" x="905" y="352" text-anchor="end">oesophageal) sphincter</text><path d="M910 336 L995 331" stroke="#4b5563" stroke-width="2.5"/>
  <path d="M1030 350 q-20 50 10 90 q40 40 90 20" fill="none" stroke="#d7322f" stroke-width="30" stroke-linecap="round"/>
  <text class="s" x="1030" y="500">stomach</text>
  <path d="M1030 150 V300" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M1060 300 V170" stroke="#d7322f" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text class="s" x="1150" y="290" style="fill:#d7322f">antiperistalsis</text><text class="s" x="1150" y="312" style="fill:#d7322f">(vomiting)</text>
  <text class="s" x="600" y="440">The sphincter opens under the pressure of food and prevents backflow of stomach contents.</text>
  <text class="s" x="600" y="480">Backflush of acidic chyme into the oesophagus burns: pyrosis or heartburn.</text>
  <text class="s" x="600" y="520">Hunger contractions are peristaltic movements triggered by low blood glucose: hunger pangs.</text>
  <text class="s" x="600" y="590">Brown: bolus. Orange: wall of the alimentary canal.</text>
</svg>
