<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <!-- Original diagram for topic 26.5: poly(alkene)s are inert and persist; polyesters and polyamides biodegrade by hydrolysis of their ester and amide links; polymers with C=O groups absorb UV and are photodegradable, with limitations. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Degradable and non-degradable polymers</text>
  <rect x="15.0" y="55.0" width="280.0" height="295.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">poly(alkene)s</text>
  <text x="155.0" y="120.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-</tspan></text>
  <text x="155.0" y="165.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">only strong, non-polar</text>
  <text x="155.0" y="185.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">C-C and C-H bonds:</text>
  <text x="155.0" y="205.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">chemically inert</text>
  <text x="155.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="155.0" y="245.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">stay for a very long time;</text>
  <text x="155.0" y="265.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">landfill, litter, harm to</text>
  <text x="155.0" y="285.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">animals, microplastics</text>
  <rect x="310.0" y="55.0" width="280.0" height="295.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">biodegradable</text>
  <text x="450.0" y="120.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-CO-O-  -CO-NH-</tspan></text>
  <text x="450.0" y="165.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">ester and amide links are</text>
  <text x="450.0" y="185.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">hydrolysed by acids, alkalis</text>
  <text x="450.0" y="205.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">and soil microorganisms</text>
  <text x="450.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="450.0" y="245.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">polyesters give acids and</text>
  <text x="450.0" y="265.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">alcohols; polyamides give</text>
  <text x="450.0" y="285.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">acids and amines (e.g. PLA)</text>
  <rect x="605.0" y="55.0" width="280.0" height="295.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">photodegradable</text>
  <text x="745.0" y="120.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-CO-CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-</tspan></text>
  <path d="M660.0 160.0 L660.4 159.1 L660.8 158.3 L661.2 157.4 L661.6 156.6 L662.0 155.9 L662.4 155.2 L662.8 154.6 L663.2 154.1 L663.6 153.7 L664.0 153.3 L664.4 153.1 L664.8 153.0 L665.2 153.0 L665.6 153.1 L666.0 153.3 L666.4 153.7 L666.8 154.1 L667.2 154.6 L667.6 155.2 L668.0 155.9 L668.4 156.6 L668.8 157.4 L669.2 158.3 L669.6 159.1 L670.0 160.0 L670.4 160.9 L670.8 161.7 L671.2 162.6 L671.6 163.4 L672.0 164.1 L672.4 164.8 L672.8 165.4 L673.2 165.9 L673.6 166.3 L674.0 166.7 L674.4 166.9 L674.8 167.0 L675.2 167.0 L675.6 166.9 L676.0 166.7 L676.4 166.3 L676.8 165.9 L677.2 165.4 L677.6 164.8 L678.0 164.1 L678.4 163.4 L678.8 162.6 L679.2 161.7 L679.6 160.9 L680.0 160.0 L680.4 159.1 L680.8 158.3 L681.2 157.4 L681.6 156.6 L682.0 155.9 L682.4 155.2 L682.8 154.6 L683.2 154.1 L683.6 153.7 L684.0 153.3 L684.4 153.1 L684.8 153.0 L685.2 153.0 L685.6 153.1 L686.0 153.3 L686.4 153.7 L686.8 154.1 L687.2 154.6 L687.6 155.2 L688.0 155.9 L688.4 156.6 L688.8 157.4 L689.2 158.3 L689.6 159.1 L690.0 160.0 L690.4 160.9 L690.8 161.7 L691.2 162.6 L691.6 163.4 L692.0 164.1 L692.4 164.8 L692.8 165.4 L693.2 165.9 L693.6 166.3 L694.0 166.7 L694.4 166.9 L694.8 167.0 L695.2 167.0 L695.6 166.9 L696.0 166.7 L696.4 166.3 L696.8 165.9 L697.2 165.4 L697.6 164.8 L698.0 164.1 L698.4 163.4 L698.8 162.6 L699.2 161.7 L699.6 160.9 L700.0 160.0 L700.4 159.1 L700.8 158.3 L701.2 157.4 L701.6 156.6 L702.0 155.9 L702.4 155.2 L702.8 154.6 L703.2 154.1 L703.6 153.7 L704.0 153.3 L704.4 153.1 L704.8 153.0 L705.2 153.0 L705.6 153.1 L706.0 153.3 L706.4 153.7 L706.8 154.1 L707.2 154.6 L707.6 155.2 L708.0 155.9 L708.4 156.6 L708.8 157.4 L709.2 158.3 L709.6 159.1 L710.0 160.0 L710.4 160.9 L710.8 161.7 L711.2 162.6 L711.6 163.4 L712.0 164.1 L712.4 164.8 L712.8 165.4 L713.2 165.9 L713.6 166.3 L714.0 166.7 L714.4 166.9 L714.8 167.0 L715.2 167.0 L715.6 166.9 L716.0 166.7 L716.4 166.3 L716.8 165.9 L717.2 165.4 L717.6 164.8 L718.0 164.1 L718.4 163.4 L718.8 162.6 L719.2 161.7 L719.6 160.9 L720.0 160.0 L720.4 159.1 L720.8 158.3 L721.2 157.4 L721.6 156.6 L722.0 155.9 L722.4 155.2 L722.8 154.6 L723.2 154.1 L723.6 153.7 L724.0 153.3 L724.4 153.1 L724.8 153.0 L725.2 153.0 L725.6 153.1 L726.0 153.3 L726.4 153.7 L726.8 154.1 L727.2 154.6 L727.6 155.2 L728.0 155.9 L728.4 156.6 L728.8 157.4 L729.2 158.3 L729.6 159.1 L730.0 160.0 L730.4 160.9 L730.8 161.7 L731.2 162.6 L731.6 163.4 L732.0 164.1 L732.4 164.8 L732.8 165.4 L733.2 165.9 L733.6 166.3 L734.0 166.7 L734.4 166.9 L734.8 167.0 L735.2 167.0 L735.6 166.9 L736.0 166.7 L736.4 166.3 L736.8 165.9 L737.2 165.4 L737.6 164.8 L738.0 164.1 L738.4 163.4 L738.8 162.6 L739.2 161.7 L739.6 160.9 L740.0 160.0" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="740.0" y1="160.0" x2="752.0" y2="160.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M760.0 160.0 L750.9 164.2 L750.9 155.8 Z" fill="#7c3aed"/>
  <text x="700.0" y="145.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">UV</text>
  <text x="745.0" y="210.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">C=O groups absorb UV</text>
  <text x="745.0" y="230.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">light, weakening bonds</text>
  <text x="745.0" y="250.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">in and between chains</text>
  <text x="745.0" y="270.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="745.0" y="290.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">but: short life, poor</text>
  <text x="745.0" y="310.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">recycling, and no light</text>
  <text x="745.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">reaches buried plastic</text>
  <text x="450.0" y="371" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
