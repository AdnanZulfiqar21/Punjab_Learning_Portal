<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.1 to 12.3 and Table 12.1: the nitrogen triple bond, properties of nitrogen, ammonia and ammonium, basicity and laboratory synthesis. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .l{font-size:12px;font-weight:700;text-anchor:middle;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Nitrogen: the inert triple bond, ammonia and the ammonium ion</text>
  <!-- N2 -->
  <rect x="50" y="55" width="380" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="83">Why N2 is unreactive (12.1, Figure 12.1)</text>
  <circle cx="170" cy="150" r="26" fill="#1f6fb5"/><circle cx="310" cy="150" r="26" fill="#1f6fb5"/>
  <g stroke="#14181f" stroke-width="3"><path d="M196 140 H284 M196 150 H284 M196 160 H284"/></g>
  <g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><text x="170" y="157">N</text><text x="310" y="157">N</text></g>
  <g font-size="11" fill="#14181f" text-anchor="middle"><text x="130" y="128">..</text><text x="350" y="128">..</text></g>
  <text class="l" x="240" y="196">triple bond: bond enthalpy +944 kJ mol-1</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="222">1s2 2s2 2p3: each N shares three electrons to</text>
    <text x="70" y="238">complete its octet; very strong bond to break</text>
    <text x="70" y="258">both atoms identical: zero electronegativity</text>
    <text x="70" y="274">difference, non-polar bond, no attack site</text>
    <text x="70" y="294">small atoms, symmetrical electron cloud; N2 dilutes</text>
    <text x="70" y="310">O2 in air and blankets oils and reactions (inert)</text>
  </g>
  <!-- properties -->
  <rect x="450" y="55" width="330" height="270" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="615" y="83">Nitrogen (Table 12.1)</text>
  <g font-size="12" fill="#4b5563">
    <text x="470" y="108">atomic number 7; Ar 14.007</text>
    <text x="470" y="126">colourless gas; [He] 2s2 2p3</text>
    <text x="470" y="144">m.p. -210 C; b.p. -195.8 C</text>
    <text x="470" y="162">covalent radius 74 pm; ionic (3-) 171 pm</text>
    <text x="470" y="180">1st ionization energy 1402 kJ mol-1</text>
    <text x="470" y="198">electronegativity 3.0; electron affinity -8.0 kJ mol-1</text>
    <text x="470" y="216">density 0.001145 g cm-3</text>
    <text x="470" y="234">principal oxidation states 3+ and 5+ (as printed)</text>
    <text x="470" y="262" style="font-weight:700;fill:#14181f">sources: cool air to a liquid (industry);</text>
    <text x="470" y="280" style="font-weight:700;fill:#14181f">heat ammonium nitrite (laboratory):</text>
  </g>
  <text class="f" x="470" y="304">NH4NO2(aq) --> N2(g) + 2H2O(l)</text>
  <!-- ammonia / ammonium -->
  <rect x="800" y="55" width="350" height="270" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="975" y="83">Ammonia and ammonium (Figure 12.2)</text>
  <circle cx="880" cy="170" r="16" fill="#1f6fb5"/><text font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" x="880" y="175">N</text>
  <g stroke="#14181f" stroke-width="2"><path d="M880 186 L850 215 M880 186 L910 215 M880 186 L880 222"/></g>
  <g font-size="11" font-weight="700" fill="#14181f" text-anchor="middle"><text x="844" y="228">H</text><text x="916" y="228">H</text><text x="880" y="236">H</text><text x="880" y="146">: lone pair</text></g>
  <text class="l" x="880" y="256">NH3: pyramidal</text>
  <circle cx="1060" cy="170" r="16" fill="#1f6fb5"/><text font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" x="1060" y="175">N</text>
  <g stroke="#14181f" stroke-width="2"><path d="M1060 154 L1060 128 M1060 186 L1030 212 M1060 186 L1090 212 M1060 186 L1068 222" /></g>
  <g font-size="11" font-weight="700" fill="#14181f" text-anchor="middle"><text x="1060" y="122">H</text><text x="1024" y="224">H</text><text x="1096" y="224">H</text><text x="1072" y="236">H</text><text x="1095" y="150">+</text></g>
  <text class="l" x="1060" y="256">NH4+: tetrahedral</text>
  <g class="t" style="font-size:12px">
    <text x="820" y="282">the lone pair of N accepts H+; all four N-H bonds</text>
    <text x="820" y="298">in NH4+ are then equal in length and strength</text>
    <text x="820" y="314">(IUPAC also: azane and azanium)</text>
  </g>
  <!-- basicity and synthesis -->
  <rect x="50" y="345" width="540" height="270" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="373">Ammonia: a weak Bronsted-Lowry base (12.2, 12.2.1)</text>
  <g class="f">
    <text x="70" y="402">N2 + 3H2  =  2NH3            (Haber-Bosch process)</text>
    <text x="70" y="428">NH3(aq) + H+(aq)  -->  NH4+(aq)     (accepts a proton)</text>
    <text x="70" y="454">NH3 + H2O  =  NH4+ + OH-     Kb = 1.8 x 10^-5</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="482">mainly used as a fertiliser; in water the equilibrium lies far to the</text>
    <text x="70" y="498">left (small Kb), so ammonia solution (NH4OH) is a weak base</text>
    <text x="70" y="522">Bronsted-Lowry: a base accepts a proton; the N lone pair takes H+</text>
    <text x="70" y="538">from an acid, giving the ammonium ion</text>
    <text x="70" y="562">ammonium salts such as (NH4)2SO4 are fertilisers; lime (a base)</text>
    <text x="70" y="578">applied at the same time would release the ammonia as gas</text>
  </g>
  <!-- lab synthesis -->
  <rect x="610" y="345" width="540" height="270" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="373">Ammonia from an ammonium salt (12.2.3, Figure 12.3)</text>
  <text class="f" x="630" y="402">2NH4Cl(s) + Ca(OH)2  --(heat)-->  CaCl2 + 2H2O + 2NH3(g)</text>
  <text class="s" x="880" y="422" style="font-size:11px">(the print writes NaCl for the salt; read as calcium chloride)</text>
  <!-- small apparatus sketch -->
  <path d="M660 520 L660 470 Q660 460 670 460 L740 460 Q750 460 750 470 L750 520 Z" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
  <rect x="668" y="498" width="74" height="20" fill="#d98b2b"/>
  <path d="M750 475 H800 V450 H840" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M690 548 L705 528 L720 548" stroke="#d7322f" stroke-width="2" fill="none"/>
  <g font-size="11" fill="#4b5563"><text x="630" y="574">NH4Cl + Ca(OH)2 heated</text><text x="850" y="455">NH3 gas: pungent, turns</text><text x="850" y="470">damp red litmus blue</text><text x="698" y="562">heat</text></g>
  <g class="t" style="font-size:12px">
    <text x="850" y="500">acid-base reaction: NH4+ donates H+</text>
    <text x="850" y="516">(acid), OH- accepts it (base); the</text>
    <text x="850" y="532">ammonia is displaced from the salt</text>
    <text x="850" y="556">used to identify ammonium in</text>
    <text x="850" y="572">salt analysis</text>
  </g>
  <text class="s" x="600" y="632" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
