<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original chart after the book's classification: constitutional isomers (chain, position, functional group, metamers, tautomers) and stereoisomers (conformational; configurational: optical, giving enantiomers or diastereomers, and geometrical cis-trans). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Classification of isomers</text>
  <rect x="320.0" y="60.0" width="260.0" height="40.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="84.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">isomers: same molecular formula</text>
  <rect x="65.0" y="145.0" width="270.0" height="40.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="200.0" y="169.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">constitutional (structural)</text>
  <rect x="565.0" y="145.0" width="230.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="680.0" y="169.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">stereoisomers</text>
  <line x1="450.0" y1="100.0" x2="200.0" y2="145.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="450.0" y1="100.0" x2="680.0" y2="145.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="205.0" y="118.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">atoms joined differently</text>
  <text x="735.0" y="118.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">same connections, arranged differently in space</text>
  <line x1="90.0" y1="185.0" x2="90.0" y2="230.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.0" y1="230.0" x2="110.0" y2="230.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="110.0" y="212.0" width="210.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#faf5ff"/>
  <text x="215.0" y="234.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">chain isomers</text>
  <line x1="90.0" y1="185.0" x2="90.0" y2="282.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.0" y1="282.0" x2="110.0" y2="282.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="110.0" y="264.0" width="210.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#faf5ff"/>
  <text x="215.0" y="286.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">position isomers</text>
  <line x1="90.0" y1="185.0" x2="90.0" y2="334.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.0" y1="334.0" x2="110.0" y2="334.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="110.0" y="316.0" width="210.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#faf5ff"/>
  <text x="215.0" y="338.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">functional group isomers</text>
  <line x1="90.0" y1="185.0" x2="90.0" y2="386.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.0" y1="386.0" x2="110.0" y2="386.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="110.0" y="368.0" width="210.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#faf5ff"/>
  <text x="215.0" y="390.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">metamers</text>
  <line x1="90.0" y1="185.0" x2="90.0" y2="438.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.0" y1="438.0" x2="110.0" y2="438.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <rect x="110.0" y="420.0" width="210.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#faf5ff"/>
  <text x="215.0" y="442.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">tautomers</text>
  <rect x="455.0" y="235.0" width="210.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="560.0" y="259.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">configurational</text>
  <rect x="715.0" y="235.0" width="170.0" height="40.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="800.0" y="259.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">conformational</text>
  <line x1="680.0" y1="185.0" x2="560.0" y2="235.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="680.0" y1="185.0" x2="800.0" y2="235.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="800.0" y="300.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">interconvert by rotation</text>
  <text x="800.0" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">about single bonds</text>
  <rect x="405.0" y="335.0" width="170.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="490.0" y="359.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">optical isomers</text>
  <rect x="610.0" y="335.0" width="210.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="715.0" y="359.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">geometrical (cis-trans)</text>
  <line x1="560.0" y1="275.0" x2="490.0" y2="335.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="560.0" y1="275.0" x2="715.0" y2="335.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="735.0" y="392.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">restricted rotation (C=C)</text>
  <rect x="365.0" y="435.0" width="170.0" height="40.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fef2f2"/>
  <text x="450.0" y="459.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">enantiomers</text>
  <rect x="555.0" y="435.0" width="170.0" height="40.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="640.0" y="459.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">diastereomers</text>
  <line x1="490.0" y1="375.0" x2="450.0" y2="435.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="490.0" y1="375.0" x2="640.0" y2="435.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="495.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">non-superimposable</text>
  <text x="450.0" y="511.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mirror images</text>
  <text x="640.0" y="495.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">not mirror images</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
