  <path d="M78.0 504.0 L67.1 509.1 L67.1 498.9 Z" fill="#14181f"/>
  <rect x="80.0" y="480.0" width="300.0" height="48.0" rx="6" stroke="#b0436e" stroke-width="2.2" fill="#fde2ec"/>
  <text x="96.0" y="513.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">iv. Metamers</tspan></text>
  <line x1="45.0" y1="562.0" x2="68.4" y2="562.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M78.0 562.0 L67.1 567.1 L67.1 556.9 Z" fill="#14181f"/>
  <rect x="80.0" y="538.0" width="300.0" height="48.0" rx="6" stroke="#b0436e" stroke-width="2.2" fill="#fde2ec"/>
  <text x="96.0" y="571.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">v. Tautomers</tspan></text>
  <rect x="635.0" y="241.8" width="210.0" height="52.5" rx="6" stroke="#b59a00" stroke-width="2.2" fill="#fff3b0"/>
  <text x="740.0" y="277.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Stereoisomers</tspan></text>
  <line x1="740.0" y1="294.0" x2="740.0" y2="420.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
