  <text x="96.0" y="397.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">ii. Position Isomers</tspan></text>
  <line x1="45.0" y1="446.0" x2="68.4" y2="446.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
