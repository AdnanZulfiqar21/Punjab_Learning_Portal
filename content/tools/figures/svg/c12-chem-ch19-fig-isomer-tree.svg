  <path d="M580.0 458.0 L574.5 446.2 L585.5 446.2 Z" fill="#14181f"/>
  <line x1="875.0" y1="420.0" x2="875.0" y2="447.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M875.0 458.0 L869.5 446.2 L880.5 446.2 Z" fill="#14181f"/>
  <text x="595.0" y="448.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">No</tspan></text>
  <text x="860.0" y="448.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">Yes</tspan></text>
  <rect x="472.5" y="453.5" width="215.0" height="83.0" rx="6" stroke="#2b7bb9" stroke-width="2.2" fill="#d4ebfa"/>
  <text x="580.0" y="488.8" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Configurational</tspan></text>
  <text x="580.0" y="519.2" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">isomers</tspan></text>
  <rect x="770.0" y="453.5" width="210.0" height="83.0" rx="6" stroke="#6b8e23" stroke-width="2.2" fill="#e2f0c4"/>
  <text x="875.0" y="488.8" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Conformational</tspan></text>
  <text x="875.0" y="519.2" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">isomers</tspan></text>
  <line x1="580.0" y1="532.0" x2="580.0" y2="600.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="595.0" y="575.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">restricted rotation</tspan></text>
