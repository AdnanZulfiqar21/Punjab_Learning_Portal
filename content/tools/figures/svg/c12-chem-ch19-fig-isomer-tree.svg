  <line x1="330.0" y1="790.0" x2="330.0" y2="817.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 828.0 L324.5 816.2 L335.5 816.2 Z" fill="#14181f"/>
  <line x1="610.0" y1="790.0" x2="610.0" y2="817.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M610.0 828.0 L604.5 816.2 L615.5 816.2 Z" fill="#14181f"/>
  <text x="315.0" y="820.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">Yes</tspan></text>
  <text x="625.0" y="820.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">No</tspan></text>
  <rect x="240.0" y="830.8" width="180.0" height="52.5" rx="6" stroke="#2b7bb9" stroke-width="2.2" fill="#d4ebfa"/>
  <text x="330.0" y="866.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Enantiomers</tspan></text>
