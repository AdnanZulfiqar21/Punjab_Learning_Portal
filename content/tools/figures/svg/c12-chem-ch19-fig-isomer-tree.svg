  <path d="M700.0 640.0 L694.5 628.2 L705.5 628.2 Z" fill="#14181f"/>
  <text x="485.0" y="630.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">No</tspan></text>
  <text x="685.0" y="630.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">Yes</tspan></text>
  <rect x="385.0" y="635.5" width="170.0" height="83.0" rx="6" stroke="#2b7bb9" stroke-width="2.2" fill="#d4ebfa"/>
  <text x="470.0" y="670.8" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Optical</tspan></text>
  <text x="470.0" y="701.2" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">isomers</tspan></text>
  <rect x="610.0" y="635.5" width="180.0" height="83.0" rx="6" stroke="#2b7bb9" stroke-width="2.2" fill="#d4ebfa"/>
  <text x="700.0" y="670.8" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Geometrical</tspan></text>
  <text x="700.0" y="701.2" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">isomers</tspan></text>
  <line x1="470.0" y1="714.0" x2="470.0" y2="790.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="485.0" y="760.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">nonsuperimposable mirror image</tspan></text>
