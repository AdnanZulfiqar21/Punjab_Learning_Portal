  <text x="725.0" y="361.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">to rotation without</tspan></text>
  <text x="725.0" y="392.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">breaking the bonds</tspan></text>
