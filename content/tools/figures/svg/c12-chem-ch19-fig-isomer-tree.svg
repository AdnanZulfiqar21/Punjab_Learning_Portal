  <path d="M740.0 240.0 L734.1 227.3 L745.9 227.3 Z" fill="#14181f"/>
  <text x="60.0" y="160.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">different bond</tspan></text>
  <text x="60.0" y="191.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">connectivity of</tspan></text>
  <text x="60.0" y="222.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">substituents</tspan></text>
  <text x="726.0" y="160.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">same bond connectivity of</tspan></text>
  <text x="726.0" y="191.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">substituents (different</tspan></text>
  <text x="726.0" y="222.0" font-size="25" fill="#14181f" text-anchor="end" font-weight="400"><tspan dy="0.0">spatial orientation)</tspan></text>
  <rect x="20.0" y="241.8" width="310.0" height="52.5" rx="6" stroke="#b59a00" stroke-width="2.2" fill="#fff3b0"/>
  <text x="175.0" y="277.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Constitutional isomers</tspan></text>
  <line x1="45.0" y1="294.0" x2="45.0" y2="560.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45.0" y1="330.0" x2="68.4" y2="330.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
