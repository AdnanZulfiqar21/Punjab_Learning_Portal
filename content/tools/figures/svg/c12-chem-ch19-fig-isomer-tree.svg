<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <!-- The book's classification of isomers on p49: constitutional isomers (chain, position, functional, metamers, tautomers) and stereoisomers, split by the book's Yes/No questions into configurational/conformational, optical/geometrical and enantiomers/diastereomers. -->
  <rect x="415.0" y="17.5" width="170.0" height="54.9" rx="6" stroke="#b59a00" stroke-width="2.2" fill="#ffd98a"/>
  <text x="500.0" y="54.7" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Isomers</tspan></text>
  <line x1="500.0" y1="72.0" x2="500.0" y2="125.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="515.0" y="108.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">same molecular formula</tspan></text>
  <line x1="45.0" y1="125.0" x2="740.0" y2="125.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45.0" y1="125.0" x2="45.0" y2="228.8" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
