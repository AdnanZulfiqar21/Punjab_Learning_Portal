<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="585" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.24 (sickle cell): template CTC, coding GAG and mRNA GAG for glutamic acid in the normal allele against CAC, GTG and GUG for valine in the sickle allele, with round and sickle-shaped red cells. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Sickle cell anaemia: one base change in the beta-globin gene</text>
  <rect x="15.0" y="55.0" width="420.0" height="470.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">normal allele</text>
  <text x="40.0" y="120.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA template strand</text>
  <rect x="245.0" y="102.0" width="90.0" height="30.0" rx="5" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="290.0" y="123.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">CTC</text>
  <text x="40.0" y="160.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA coding strand</text>
  <rect x="245.0" y="142.0" width="90.0" height="30.0" rx="5" stroke="#1e3a8a" stroke-width="1.5" fill="#eff6ff"/>
  <text x="290.0" y="163.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">GAG</text>
  <text x="40.0" y="200.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">mRNA codon</text>
  <rect x="245.0" y="182.0" width="90.0" height="30.0" rx="5" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2"/>
  <text x="290.0" y="203.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">GAG</text>
  <text x="40.0" y="240.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">amino acid 6</text>
  <text x="290.0" y="243.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">glutamic acid</text>
  <ellipse cx="165.0" cy="340.0" rx="38.0" ry="30.0" stroke="#b91c1c" stroke-width="2" fill="#fca5a5"/>
  <ellipse cx="165.0" cy="340.0" rx="16.0" ry="11.0" stroke="#b91c1c" stroke-width="1" fill="#fecaca"/>
  <ellipse cx="265.0" cy="330.0" rx="38.0" ry="30.0" stroke="#b91c1c" stroke-width="2" fill="#fca5a5"/>
  <ellipse cx="265.0" cy="330.0" rx="16.0" ry="11.0" stroke="#b91c1c" stroke-width="1" fill="#fecaca"/>
  <ellipse cx="215.0" cy="420.0" rx="38.0" ry="30.0" stroke="#b91c1c" stroke-width="2" fill="#fca5a5"/>
  <ellipse cx="215.0" cy="420.0" rx="16.0" ry="11.0" stroke="#b91c1c" stroke-width="1" fill="#fecaca"/>
  <ellipse cx="315.0" cy="410.0" rx="38.0" ry="30.0" stroke="#b91c1c" stroke-width="2" fill="#fca5a5"/>
  <ellipse cx="315.0" cy="410.0" rx="16.0" ry="11.0" stroke="#b91c1c" stroke-width="1" fill="#fecaca"/>
  <text x="225.0" y="480.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">round, flexible red cells</text>
  <rect x="445.0" y="55.0" width="420.0" height="470.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="655.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">sickle allele</text>
  <text x="470.0" y="120.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA template strand</text>
  <rect x="675.0" y="102.0" width="90.0" height="30.0" rx="5" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="720.0" y="123.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">CAC</text>
  <text x="470.0" y="160.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA coding strand</text>
  <rect x="675.0" y="142.0" width="90.0" height="30.0" rx="5" stroke="#1e3a8a" stroke-width="1.5" fill="#eff6ff"/>
  <text x="720.0" y="163.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">GTG</text>
  <text x="470.0" y="200.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">mRNA codon</text>
  <rect x="675.0" y="182.0" width="90.0" height="30.0" rx="5" stroke="#d7322f" stroke-width="1.5" fill="#fee2e2"/>
  <text x="720.0" y="203.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">GUG</text>
  <text x="470.0" y="240.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">amino acid 6</text>
  <text x="720.0" y="243.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">valine</text>
  <path d="M555 340 Q595 294 635 340 Q595 322 555 340 Z" stroke="#b91c1c" stroke-width="2" fill="#fca5a5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M655 330 Q695 284 735 330 Q695 312 655 330 Z" stroke="#b91c1c" stroke-width="2" fill="#fca5a5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M605 420 Q645 374 685 420 Q645 402 605 420 Z" stroke="#b91c1c" stroke-width="2" fill="#fca5a5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M705 410 Q745 364 785 410 Q745 392 705 410 Z" stroke="#b91c1c" stroke-width="2" fill="#fca5a5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="655.0" y="480.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sickle-shaped red cells</text>
  <text x="450.0" y="552.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the book's 'T to A' (template, CTC to CAC) and 'A to T' (coding strand, GAG to GTG) are the same change</text>
  <text x="450.0" y="576" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
