  <circle cx="881.0" cy="125.0" r="10.0" stroke="#14181f" stroke-width="2.4" fill="#ffffff"/>
  <line x1="875.5" y1="125.0" x2="886.5" y2="125.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="881.0" y1="119.5" x2="881.0" y2="130.5" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
