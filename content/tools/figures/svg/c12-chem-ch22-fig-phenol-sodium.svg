  <text x="219.0" y="161.0" font-size="30" fill="#e07b1f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="251.0" y="160.8" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">+ 2Na</tspan></text>
  <line x1="400.0" y1="150.0" x2="547.2" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M560.0 150.0 L545.5 156.8 L545.5 143.2 Z" fill="#14181f"/>
  <text x="600.0" y="161.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2</tspan></text>
  <path d="M725.0 150.0 L700.0 193.3 L650.0 193.3 L625.0 150.0 L650.0 106.7 L700.0 106.7 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="675.0" cy="150.0" r="29.0" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="725.0" y1="150.0" x2="759.0" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="781.0" y="160.8" font-size="30" fill="#e07b1f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
