  <text x="450.0" y="451.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">angular momentum L = I omega stays constant</text>
  <text x="450.0" y="486" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
