<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="495" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.18: a diver tucks to spin faster and stretches out to slow down, keeping I omega constant. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A diver changes shape to spin faster</text>
  <line x1="40.0" y1="380.0" x2="200.0" y2="380.0" stroke="#8a5a2b" stroke-width="8" stroke-linecap="round"/>
  <line x1="40.0" y1="392.0" x2="860.0" y2="392.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8"/>
  <text x="860.0" y="418.0" font-size="17" fill="#1f6fb5" text-anchor="end" font-weight="700">water</text>
  <circle cx="160.0" cy="207.0" r="10.8" stroke="#14181f" stroke-width="2" fill="#ffe7cf"/>
  <line x1="160.0" y1="217.8" x2="160.0" y2="297.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="160.0" y1="297.0" x2="152.8" y2="342.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="160.0" y1="297.0" x2="167.2" y2="342.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="160.0" y1="225.0" x2="151.0" y2="180.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="160.0" y1="225.0" x2="169.0" y2="180.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <text x="160.0" y="140.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">stretched</text>
  <text x="160.0" y="160.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="400">I large, omega small</text>
  <circle cx="400.0" cy="220.0" r="37.4" stroke="#14181f" stroke-width="5" fill="none"/>
  <circle cx="419.8" cy="198.0" r="13.2" stroke="#14181f" stroke-width="2" fill="#ffe7cf"/>
  <path d="M343.6 199.5 A60 60 0 1 1 343.6 240.5" stroke="#d98b2b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M343.6 240.5 L351.4 248.3 L342.7 251.5 Z" fill="#d98b2b"/>
  <text x="400.0" y="120.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">tucked into a ball</text>
  <text x="400.0" y="140.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="400">I small, omega large</text>
  <circle cx="671.5" cy="354.6" r="10.8" stroke="#14181f" stroke-width="2" fill="#ffe7cf"/>
  <line x1="666.1" y1="345.2" x2="626.5" y2="276.6" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="626.5" y1="276.6" x2="610.2" y2="234.0" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="626.5" y1="276.6" x2="597.8" y2="241.2" stroke="#14181f" stroke-width="5" stroke-linecap="round"/>
  <line x1="662.5" y1="339.0" x2="692.8" y2="373.4" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="662.5" y1="339.0" x2="677.2" y2="382.4" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <text x="700.0" y="160.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">stretched again</text>
  <text x="700.0" y="180.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="400">slows the spin for entry</text>
  <path d="M220 300 Q300 120 360 200" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M450 230 Q560 200 610 260" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linejoin="round" stroke-linecap="round"/>
