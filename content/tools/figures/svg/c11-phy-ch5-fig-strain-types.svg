<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original redraw after Figure 5.3: tensile, volumetric and shear strain. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Three kinds of strain</text>
  <rect x="15.0" y="55.0" width="280.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) Tensile</text>
  <rect x="310.0" y="55.0" width="280.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) Volumetric</text>
  <rect x="605.0" y="55.0" width="280.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(c) Shear</text>
  <rect x="85.0" y="210.0" width="140.0" height="60.0" rx="0" stroke="#4b5563" stroke-width="2" fill="#e5e7eb" stroke-dasharray="6 5"/>
  <rect x="85.0" y="210.0" width="175.0" height="60.0" rx="0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <line x1="85.0" y1="240.0" x2="45.4" y2="240.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M35.0 240.0 L46.8 234.5 L46.8 245.5 Z" fill="#d7322f"/>
  <line x1="260.0" y1="240.0" x2="274.6" y2="240.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M285.0 240.0 L273.2 245.5 L273.2 234.5 Z" fill="#d7322f"/>
  <text x="155.0" y="300.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="400">original length L</text>
  <line x1="232.2" y1="320.0" x2="252.8" y2="320.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M260.0 320.0 L251.8 323.8 L251.8 316.2 Z" fill="#14181f"/>
  <path d="M225.0 320.0 L233.2 316.2 L233.2 323.8 Z" fill="#14181f"/>
