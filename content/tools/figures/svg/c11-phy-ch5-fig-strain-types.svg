  <text x="842.0" y="166.0" font-size="18" fill="#0f7a62" text-anchor="end" font-weight="700">F</text>
  <path d="M670.0 200.0 A90 90 0 0 1 696.3 203.9" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="690.0" y="182.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">theta</text>
  <text x="745.0" y="410.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">strain = angle theta</text>
  <text x="745.0" y="310.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="400">base fixed</text>
  <text x="450.0" y="493.0" font-size="10" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
