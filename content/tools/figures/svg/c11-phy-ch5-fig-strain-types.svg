  <path d="M397.0 225.0 L385.2 230.5 L385.2 219.5 Z" fill="#1f6fb5"/>
  <line x1="555.0" y1="225.0" x2="513.4" y2="225.0" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M503.0 225.0 L514.8 219.5 L514.8 230.5 Z" fill="#1f6fb5"/>
  <text x="450.0" y="360.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="400">V shrinks to V - delta V</text>
  <text x="450.0" y="410.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">strain = delta V / V</text>
  <path d="M670.0 290.0 L790.0 290.0 L820.0 190.0 L700.0 190.0 Z" stroke="#0f7a62" stroke-width="2.5" fill="#e6f4ef" stroke-linejoin="round" stroke-linecap="round"/>
