  <text x="155.0" y="410.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">strain = delta L / L</text>
  <rect x="390.0" y="165.0" width="120.0" height="120.0" rx="0" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <rect x="405.0" y="180.0" width="90.0" height="90.0" rx="0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <line x1="450.0" y1="120.0" x2="450.0" y2="161.6" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 172.0 L444.5 160.2 L455.5 160.2 Z" fill="#1f6fb5"/>
  <line x1="450.0" y1="330.0" x2="450.0" y2="288.4" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 278.0 L455.5 289.8 L444.5 289.8 Z" fill="#1f6fb5"/>
