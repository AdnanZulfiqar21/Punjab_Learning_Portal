<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.3: a pendulum bob displaced through angle theta with tension T along the string and weight mg resolved into mg cos(theta) along the string and mg sin(theta) towards O; for small angles a = -(g/l)x and T = 2 pi sqrt(l/g). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Forces on a simple pendulum (after Fig 14.3)</text>
  <rect x="15.0" y="55.0" width="480.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="255.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">forces at displacement theta</text>
  <line x1="170.0" y1="95.0" x2="340.0" y2="95.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="255.0" y1="95.0" x2="255.0" y2="385.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="255.0" y1="95.0" x2="360.8" y2="332.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M255 155 A60 60 0 0 0 279.4 149.8" stroke="#14181f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="267.0" y="177.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">theta</text>
  <circle cx="360.8" cy="332.5" r="16.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="360.8" y1="332.5" x2="360.8" y2="444.5" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M360.8 452.5 L356.5 443.5 L365.0 443.5 Z" fill="#14181f"/>
  <text x="368.8" y="464.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">mg</text>
  <line x1="360.8" y1="332.5" x2="325.4" y2="253.0" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M322.1 245.7 L329.7 252.3 L321.9 255.7 Z" fill="#7c3aed"/>
  <text x="314.1" y="241.2" font-size="13" fill="#7c3aed" text-anchor="end" font-weight="700">T (tension)</text>
  <line x1="360.8" y1="332.5" x2="402.4" y2="426.1" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M405.3 432.7 L398.5 426.8 L405.5 423.7 Z" fill="#0f7a62"/>
  <text x="411.3" y="450.7" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700"><tspan dy="0.0">mg cos(theta)</tspan></text>
  <line x1="360.8" y1="332.5" x2="323.5" y2="349.1" stroke="#d7322f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M316.2 352.4 L322.7 344.8 L326.2 352.5 Z" fill="#d7322f"/>
  <text x="310.2" y="374.4" font-size="13" fill="#d7322f" text-anchor="end" font-weight="700">mg sin(theta)</text>
  <text x="255.0" y="401.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <text x="321.9" y="213.8" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">l</text>
  <rect x="510.0" y="55.0" width="375.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="697.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the result</text>
  <text x="530.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">T and mg cos(theta) cancel along</text>
  <text x="530.0" y="132.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">the string; mg sin(theta) pulls the</text>
  <text x="530.0" y="154.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">bob back towards O:</text>
  <text x="530.0" y="200.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">F = -mg sin(theta)   so   a = -g sin(theta)</tspan></text>
  <text x="530.0" y="242.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">small angles: sin(theta) = theta = x/l</tspan></text>
  <text x="530.0" y="284.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">a = -(g/l) x = -w</tspan><tspan dy="-6.3" font-size="10.5">2</tspan><tspan dy="6.3"> x</tspan></text>
  <text x="530.0" y="326.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">w = sqrt(g/l)</tspan></text>
  <text x="530.0" y="368.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">T = 2 pi sqrt(l/g)</tspan></text>
  <text x="530.0" y="410.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">g = 4 pi</tspan><tspan dy="-6.3" font-size="10.5">2</tspan><tspan dy="6.3"> l / T</tspan><tspan dy="-6.3" font-size="10.5">2</tspan></text>
  <text x="530.0" y="455.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">T does not depend on the mass or (for</text>
  <text x="530.0" y="471.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">small swings) on the amplitude</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
