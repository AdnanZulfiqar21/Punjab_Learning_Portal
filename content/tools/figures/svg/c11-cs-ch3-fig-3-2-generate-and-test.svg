<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 3.2 (C11-CS, PDF p72): Flowchart of the Generate and Test Algorithm Process; orange panel, white boxes with orange words, white labels, loop on the left, as printed -->
  <rect width="900" height="960" fill="#ec6b23"/>
  <rect x="200" y="40" width="530" height="150" fill="#ffffff"/>
  <text x="465" y="140" font-size="62" fill="#e8681a" text-anchor="middle" font-weight="800">GENERATOR</text>
  <rect x="200" y="365" width="530" height="150" fill="#ffffff"/>
  <text x="465" y="465" font-size="62" fill="#e8681a" text-anchor="middle" font-weight="800">TESTER</text>
  <rect x="520" y="705" width="350" height="125" fill="#ffffff"/>
  <text x="695" y="790" font-size="62" fill="#e8681a" text-anchor="middle" font-weight="800">STOP</text>
  <path d="M440 190 L440 345" stroke="#1a1a1a" stroke-width="5" fill="none"/>
  <path d="M440 362 L431 340 L449 340 Z" fill="#1a1a1a"/>
  <text x="475" y="265" font-size="32" fill="#ffffff" font-weight="700">Possible</text>
  <text x="475" y="305" font-size="32" fill="#ffffff" font-weight="700">Solution</text>
  <path d="M600 515 L600 685" stroke="#1a1a1a" stroke-width="5" fill="none"/>
  <path d="M600 702 L591 680 L609 680 Z" fill="#1a1a1a"/>
  <text x="680" y="600" font-size="32" fill="#ffffff" font-weight="700">Correct</text>
  <text x="680" y="640" font-size="32" fill="#ffffff" font-weight="700">Solution</text>
  <path d="M275 515 L275 735 L80 735 L80 75 L178 75" stroke="#1a1a1a" stroke-width="7" fill="none" stroke-linejoin="miter"/>
  <path d="M198 75 L172 62 L172 88 Z" fill="#1a1a1a"/>
  <path d="M80 545 L66 572 L94 572 Z" fill="#1a1a1a"/>
  <text x="70" y="810" font-size="32" fill="#ffffff" font-weight="700">Incorrect</text>
  <text x="70" y="852" font-size="32" fill="#ffffff" font-weight="700">Solution</text>
</svg>
