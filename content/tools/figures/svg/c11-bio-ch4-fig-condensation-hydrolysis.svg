<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.4 and 4.5: dehydration synthesis and hydrolysis, maltose from two glucose. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563;text-anchor:middle}
      .c{font-size:20px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="hex"><polygon points="0,-52 50,-26 50,26 0,52 -50,26 -50,-26" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5" stroke-linejoin="round"/><text x="30" y="-28" font-size="18" fill="#14181f" text-anchor="middle">O</text></g>
  </defs>
  <text class="h" x="600" y="50">Condensation (dehydration synthesis)</text>
  <!-- two monomers -->
  <g transform="translate(200,200)"><use href="#hex"/><text class="t" x="0" y="8">glucose</text></g>
  <text class="c" x="275" y="208">OH</text>
  <text class="c" x="340" y="208">HO</text>
  <g transform="translate(415,200)"><use href="#hex"/><text class="t" x="0" y="8">glucose</text></g>
  <path d="M520 200 L640 200" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="580" y="180">-H2O</text>
  <text class="s" x="580" y="240">energy in</text>
  <!-- product: maltose with O bridge -->
  <g transform="translate(760,200)"><use href="#hex"/></g>
  <circle cx="835" cy="200" r="16" fill="#d98b2b"/><text class="c" x="835" y="207" style="fill:#fff;font-weight:700">O</text>
  <g transform="translate(910,200)"><use href="#hex"/></g>
  <text class="t" x="835" y="300">maltose</text>
  <text class="s" x="835" y="328">1,4-glycosidic bond</text>
  <circle cx="1090" cy="200" r="36" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/><text class="c" x="1090" y="208" style="font-weight:700">H2O</text>
  <text class="s" x="1090" y="265">water released</text>
  <text class="s" x="600" y="385">OH is removed from one monomer and H from the other; the monomers join and a water molecule leaves.</text>
  <text class="h" x="600" y="450">Hydrolysis</text>
  <g transform="translate(200,590)"><use href="#hex"/></g>
  <circle cx="275" cy="590" r="16" fill="#d98b2b"/><text class="c" x="275" y="597" style="fill:#fff;font-weight:700">O</text>
  <g transform="translate(350,590)"><use href="#hex"/></g>
  <text class="t" x="275" y="680">maltose</text>
  <circle cx="470" cy="520" r="36" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/><text class="c" x="470" y="528" style="font-weight:700">H2O</text>
  <text class="s" x="470" y="580">water added</text>
  <path d="M520 590 L640 590" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="580" y="570">+H2O</text>
  <g transform="translate(760,590)"><use href="#hex"/><text class="t" x="0" y="8">glucose</text></g>
  <text class="c" x="835" y="598">OH</text>
  <text class="c" x="900" y="598">HO</text>
  <g transform="translate(975,590)"><use href="#hex"/><text class="t" x="0" y="8">glucose</text></g>
  <text class="s" x="600" y="730">Water is added: OH joins one monomer and H the other, and the bond between them breaks (digestion, respiration).</text>
</svg>
