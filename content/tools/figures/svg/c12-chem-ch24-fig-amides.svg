<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <!-- Original diagram for topic 24.5: amides from acyl chlorides with ammonia or amines; the delocalisation of the nitrogen lone pair onto the carbonyl oxygen that makes amides nearly neutral and shortens the C-N bond (132 pm against 147 pm); acid and alkaline hydrolysis and reduction by LiAlH4. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Amides</text>
  <rect x="15.0" y="55.0" width="870.0" height="180.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">making amides from acyl chlorides (room temperature)</text>
  <text x="450.0" y="115.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCl + NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HCl (ethanamide)</tspan></text>
  <text x="450.0" y="145.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">COCl + NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HCl (benzamide)</tspan></text>
  <text x="450.0" y="175.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCl + CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONHCH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + HCl (N-ethylethanamide)</tspan></text>
  <text x="450.0" y="205.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCl + C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONHC</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5"> + HCl (N-phenylethanamide)</tspan></text>
  <rect x="15.0" y="245.0" width="425.0" height="210.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="275.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">why amides are hardly basic</text>
  <text x="70.0" y="365.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="80.0" y1="360.0" x2="120.0" y2="360.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="365.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="127.0" y1="350.0" x2="127.0" y2="322.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="133.0" y1="350.0" x2="133.0" y2="322.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="130.0" y="307.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="140.0" y1="360.0" x2="180.0" y2="360.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="200.0" y="365.9" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <circle cx="192.0" cy="342.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="200.0" cy="342.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M196.0 338.0 Q170.0 330.0 150.0 354.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M150.0 354.0 L152.6 344.3 L159.0 349.7 Z" fill="#d7322f"/>
  <path d="M134.0 330.0 Q150.0 310.0 140.0 296.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M140.0 296.0 L148.7 300.9 L141.8 305.8 Z" fill="#d7322f"/>
  <line x1="247.2" y1="350.0" x2="282.8" y2="350.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M290.0 350.0 L281.8 353.8 L281.8 346.2 Z" fill="#14181f"/>
  <path d="M240.0 350.0 L248.2 346.2 L248.2 353.8 Z" fill="#14181f"/>
  <text x="360.0" y="356.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-C(O</tspan><tspan dy="-6.3" font-size="10.5">-</tspan><tspan dy="6.3">)=NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="227.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the N lone pair is delocalised onto the C=O</text>
  <text x="227.0" y="435.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">oxygen: amides give neutral solutions</text>
  <rect x="460.0" y="245.0" width="425.0" height="210.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="275.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">partial double bond: shorter C-N</text>
  <text x="570.0" y="340.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-CO-NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="570.0" y="372.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">C-N 132 pm</text>
  <text x="780.0" y="340.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R-CH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">-NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="780.0" y="372.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">C-N 147 pm</text>
  <text x="672.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the amide C-N is shorter than a normal C-N single bond</text>
  <rect x="15.0" y="465.0" width="870.0" height="155.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="495.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">reactions: slow, need heating or a catalyst</text>
  <text x="450.0" y="520.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + HCl -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOH + NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">Cl (acid hydrolysis)</tspan></text>
  <text x="450.0" y="550.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + NaOH -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COONa + NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> (alkaline hydrolysis; then add HCl for the acid)</tspan></text>
  <text x="450.0" y="580.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O (LiAlH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5"> in dry ether)</tspan></text>
  <text x="450.0" y="641" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
