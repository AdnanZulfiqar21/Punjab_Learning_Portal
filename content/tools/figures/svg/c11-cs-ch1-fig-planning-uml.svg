<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.9 and 1.10 and topics 1.5 to 1.4.3, 1.1.1 (risk) and the UML topics: the five project phases, cost and risk notes, a use case diagram and a class diagram. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Project planning, risk management, use case and class diagrams</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Project management (1.5, 1.4.1 to 1.4.3)</text>
  <rect x="70" y="95" width="200" height="26" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="136" y="112">1 Initiation</text>
  <rect x="70" y="129" width="200" height="26" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="142" y="146">2 Planning</text>
  <rect x="70" y="163" width="200" height="26" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="139" y="180">3 Execution</text>
  <rect x="70" y="197" width="200" height="26" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="103" y="214">4 Performance monitoring</text>
  <rect x="70" y="231" width="200" height="26" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="122" y="248">5 Project closure</text>
  <g class="r">
    <text x="290" y="104">planning: what, who and how; timelines:</text>
    <text x="290" y="119">time for each part; costs: team, stack,</text>
    <text x="290" y="134">duration, risk, quality assurance</text>
    <text x="290" y="164">Example (6 months, 24 weeks):</text>
    <text x="290" y="179">PM 2,400,000; frontend 5,040,000</text>
    <text x="290" y="194">backend 5,760,000; UI/UX 1,440,000</text>
    <text x="290" y="209">QA 2,400,000; cloud 1,000,000</text>
    <text x="290" y="224">sum 18,040,000 PKR; 10% contingency</text>
    <text x="290" y="239">1,804,000; total 19,844,000 (print:</text>
    <text x="290" y="254">1,604,000 and 19,644,000)</text>
  </g>
  <g class="r">
    <text x="70" y="296">risk steps: 1 identify (technical, operational, external)</text>
    <text x="70" y="311">2 analyse likelihood and impact  3 mitigate (buffers,</text>
    <text x="70" y="326">backups, pilot tests)  4 monitor and review</text>
    <text x="70" y="341">quality assurance: tests, code reviews, feedback, checks</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">Use case diagram (Fig. 1.9)</text>
  <rect x="760" y="100" width="240" height="250" rx="14" fill="#ffffff" stroke="#14181f" stroke-width="2"/>
  <text class="l" x="880" y="122" style="text-anchor:middle">Library system</text>
  <ellipse cx="880" cy="180" rx="80" ry="24" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <text class="r" x="880" y="184" style="text-anchor:middle">Borrow book</text>
  <ellipse cx="880" cy="280" rx="80" ry="24" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <text class="r" x="880" y="284" style="text-anchor:middle">Return book</text>
  <circle cx="680" cy="200" r="8" fill="none" stroke="#14181f" stroke-width="1.5"/>
  <path d="M680 208 V230 M668 216 H692 M680 230 L670 244 M680 230 L690 244" stroke="#14181f" stroke-width="1.5" fill="none"/>
  <text class="r" x="680" y="260" style="text-anchor:middle">Librarian</text>
  <circle cx="1080" cy="200" r="8" fill="none" stroke="#14181f" stroke-width="1.5"/>
  <path d="M1080 208 V230 M1068 216 H1092 M1080 230 L1070 244 M1080 230 L1090 244" stroke="#14181f" stroke-width="1.5" fill="none"/>
  <text class="r" x="1080" y="260" style="text-anchor:middle">Student</text>
  <path d="M692 224 L800 180" stroke="#14181f" stroke-width="1.2"/>
  <path d="M692 224 L800 280" stroke="#14181f" stroke-width="1.2"/>
  <path d="M1068 224 L960 180" stroke="#14181f" stroke-width="1.2"/>
  <path d="M1068 224 L960 280" stroke="#14181f" stroke-width="1.2"/>
  <g class="r">
    <text x="630" y="372">actors (people or systems) outside the box; use cases (goals) as ovals</text>
  </g>
  <rect x="50" y="405" width="1100" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="433">Class diagram: organizing your room (Fig. 1.10)</text>
  <rect x="260" y="440" width="170" height="62" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M260 464 H430" stroke="#14181f"/>
  <text class="l" x="345.0" y="457" style="text-anchor:middle">Room</text>
  <text class="r" x="270" y="480">- name: String</text>
  <text class="r" x="270" y="496">- size: String</text>
  <rect x="260" y="530" width="170" height="78" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M260 554 H430" stroke="#14181f"/>
  <text class="l" x="345.0" y="547" style="text-anchor:middle">Box</text>
  <text class="r" x="270" y="570">- label: String</text>
  <text class="r" x="270" y="586">- contents: String</text>
  <text class="r" x="270" y="602">+ open(), + close()</text>
  <path d="M345 502 V530" stroke="#14181f" stroke-width="1.5"/>
  <rect x="80" y="630" width="160" height="46" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M80 654 H240" stroke="#14181f"/>
  <text class="l" x="160.0" y="647" style="text-anchor:middle">ToyBox</text>
  <text class="r" x="90" y="670">- toys: List</text>
  <path d="M160 630 L345 612" stroke="#14181f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="270" y="630" width="160" height="46" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M270 654 H430" stroke="#14181f"/>
  <text class="l" x="350.0" y="647" style="text-anchor:middle">BookBox</text>
  <text class="r" x="280" y="670">- books: List</text>
  <path d="M350 630 L345 612" stroke="#14181f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="460" y="630" width="160" height="46" fill="#ffffff" stroke="#14181f" stroke-width="1.5"/>
  <path d="M460 654 H620" stroke="#14181f"/>
  <text class="l" x="540.0" y="647" style="text-anchor:middle">ClothesBox</text>
  <text class="r" x="470" y="670">- clothes: List</text>
  <path d="M540 630 L345 612" stroke="#14181f" stroke-width="1.5" marker-end="url(#a)"/>
  <g class="t">
    <text x="660" y="452">a class diagram shows the classes of a system, their attributes (data)</text>
    <text x="660" y="470">and methods (actions) and how they are related</text>
    <text x="660" y="506">the Room contains Boxes; a Box has a label and contents and can</text>
    <text x="660" y="524">open() and close(); ToyBox, BookBox and ClothesBox are special</text>
    <text x="660" y="542">kinds of Box (the arrows point to the general class)</text>
    <text x="660" y="578">class box: name on top, attributes (- private), methods (+ public)</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
