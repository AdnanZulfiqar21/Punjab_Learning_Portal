<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.6: an Rh-negative mother sensitised by her Rh-positive baby's red cells at birth, whose anti-Rh antibodies attack the red cells of a later Rh-positive baby; prevention with anti-Rh serum. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Erythroblastosis foetalis: Rh-negative mother, Rh-positive baby</text>
  <rect x="20.0" y="55.0" width="280.0" height="400.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="160.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">first pregnancy</text>
  <ellipse cx="160.0" cy="230.0" rx="90.0" ry="120.0" stroke="#be185d" stroke-width="2" fill="#fdf2f8"/>
  <circle cx="160.0" cy="250.0" r="40.0" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
  <text x="160.0" y="254.0" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">Rh+</text>
  <text x="160.0" y="140.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">mother Rh- (dd)</text>
  <rect x="310.0" y="55.0" width="280.0" height="400.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">after the first birth</text>
  <ellipse cx="450.0" cy="230.0" rx="90.0" ry="120.0" stroke="#be185d" stroke-width="2" fill="#fdf2f8"/>
  <circle cx="450.0" cy="250.0" r="40.0" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
  <text x="450.0" y="254.0" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">Rh+</text>
  <text x="450.0" y="140.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">mother Rh- (dd)</text>
  <rect x="600.0" y="55.0" width="280.0" height="400.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="740.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">next pregnancy</text>
  <ellipse cx="740.0" cy="230.0" rx="90.0" ry="120.0" stroke="#be185d" stroke-width="2" fill="#fdf2f8"/>
  <circle cx="740.0" cy="250.0" r="40.0" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
  <text x="740.0" y="254.0" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">Rh+</text>
  <text x="740.0" y="140.0" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">mother Rh- (dd)</text>
  <text x="160.0" y="380.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a few baby red cells</text>
  <text x="160.0" y="398.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">reach the mother at birth</text>
  <circle cx="100.0" cy="180.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#fca5a5"/>
  <circle cx="110.0" cy="200.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#fca5a5"/>
  <circle cx="220.0" cy="190.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#fca5a5"/>
  <path d="M390 178 L390 170 L384 163 M390 170 L396 163" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M410 208 L410 200 L404 193 M410 200 L416 193" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M510 188 L510 180 L504 173 M510 180 L516 173" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M500 218 L500 210 L494 203 M500 210 L506 203" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M380 288 L380 280 L374 273 M380 280 L386 273" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M520 298 L520 290 L514 283 M520 290 L526 283" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="380.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">she makes anti-Rh</text>
  <text x="450.0" y="398.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">antibodies (Y shapes)</text>
  <path d="M690 230 L690 222 L684 215 M690 222 L696 215" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M792 244 L792 236 L786 229 M792 236 L798 229" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M710 308 L710 300 L704 293 M710 300 L716 293" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M776 304 L776 296 L770 289 M776 296 L782 289" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="740.0" y="374.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">antibodies cross the</text>
  <text x="740.0" y="392.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">placenta, destroy baby's</text>
  <text x="740.0" y="410.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">red cells: anaemia, jaundice</text>
  <line x1="300.0" y1="230.0" x2="304.8" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M312.0 230.0 L303.8 233.8 L303.8 226.2 Z" fill="#14181f"/>
  <line x1="590.0" y1="230.0" x2="594.8" y2="230.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M602.0 230.0 L593.8 233.8 L593.8 226.2 Z" fill="#14181f"/>
  <rect x="60.0" y="470.0" width="780.0" height="56.0" rx="8" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="450.0" y="494.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">prevention: anti-Rh serum given to the mother in early pregnancy and just after birth</text>
  <text x="450.0" y="514.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">destroys any baby red cells in her blood before her own immune system is sensitised</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
