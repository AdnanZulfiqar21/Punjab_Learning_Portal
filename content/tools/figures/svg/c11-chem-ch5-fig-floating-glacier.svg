<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640">
  <!-- Vis5-1 (C11-CHEM, PDF p102): floating glacier margin photo; flat drawing after the printed photograph: a wide, flat-topped slab of white ice floats in dark blue-grey sea; its steep sides show pale blue ice and a turquoise band at the waterline; far ice on the horizon at left; pale grey sky. No photograph is reproduced. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d4dc"/><stop offset="1" stop-color="#e6ecf0"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f6b7c"/><stop offset="1" stop-color="#25404f"/></linearGradient>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="640" fill="url(#sky)"/>
  <rect x="0" y="235" width="1100" height="405" fill="url(#sea)"/>
  <!-- far ice on the horizon -->
  <path d="M0 236 L 0 226 L 60 222 L 140 226 L 200 236 Z" fill="#f2f6f8"/>
  <path d="M300 236 L 330 231 L 370 233 L 390 236 Z" fill="#f2f6f8"/>
  <!-- ripples on the sea -->
  <g stroke="#6d8899" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M60 300 L 140 300 M220 280 L 300 280 M850 290 L 930 290 M960 330 L 1040 330 M80 560 L 190 560 M300 600 L 420 600 M780 590 L 900 590 M940 520 L 1060 520"/>
  </g>
  <!-- glacier slab: flat top, steep sides -->
  <path d="M110 395 L 160 345 L 330 330 L 470 300 L 650 290 L 820 300 L 960 322 L 1000 345 L 990 395 L 930 430 L 700 450 L 420 452 L 200 440 Z" fill="#cfe3ef"/>
  <!-- top surface -->
  <path d="M160 345 L 330 330 L 470 300 L 650 290 L 820 300 L 960 322 L 1000 345 L 880 362 L 620 370 L 380 368 L 200 360 Z" fill="#f8fbfd"/>
  <path d="M330 330 L 470 300 L 520 318 L 400 335 Z" fill="#eef4f8"/>
  <!-- shaded front face with vertical ice texture -->
  <path d="M200 360 L 380 368 L 620 370 L 880 362 L 1000 345 L 990 395 L 930 430 L 700 450 L 420 452 L 200 440 L 110 395 L 160 345 Z" fill="#a9cde2"/>
  <g stroke="#8ab8d3" stroke-width="5" stroke-linecap="round">
    <path d="M250 372 L 245 430 M330 375 L 328 440 M430 378 L 428 446 M530 378 L 532 448 M640 376 L 640 446 M740 372 L 742 440 M840 366 L 838 430 M930 356 L 925 410"/>
  </g>
  <!-- turquoise band at the waterline -->
  <path d="M120 400 L 200 440 L 420 452 L 700 450 L 930 430 L 990 395 L 1010 410 L 950 452 L 700 474 L 420 476 L 190 464 L 100 418 Z" fill="#3fc1c4"/>
  <path d="M100 418 L 190 464 L 420 476 L 700 474 L 950 452 L 1010 410 L 1030 430 L 950 480 L 700 498 L 420 498 L 180 486 L 80 440 Z" fill="#2a8e9a" opacity="0.8"/>
</svg>
