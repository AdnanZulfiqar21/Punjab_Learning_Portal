<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 22.1.1: six components of biostatistics in a cycle: study design, data collection, data management, data analysis, interpretation and presentation. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Components of biostatistics</text>
  <rect x="355.0" y="67.0" width="190.0" height="76.0" rx="12" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="450.0" y="93.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">1. study design</text>
  <text x="450.0" y="113.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">question, variables,</text>
  <text x="450.0" y="129.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">sample size</text>
  <circle cx="532.5" cy="137.1" r="0.1" stroke="#4b5563" stroke-width="0.1" fill="#4b5563"/>
  <rect x="506.6" y="154.5" width="190.0" height="76.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="601.6" y="180.5" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">2. data collection</text>
  <text x="601.6" y="200.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">primary or</text>
  <text x="601.6" y="216.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">secondary data</text>
  <circle cx="615.0" cy="280.0" r="0.1" stroke="#4b5563" stroke-width="0.1" fill="#4b5563"/>
  <rect x="506.6" y="329.5" width="190.0" height="76.0" rx="12" stroke="#0e9aa7" stroke-width="2.5" fill="#ffffff"/>
  <text x="601.6" y="355.5" font-size="14" fill="#0e9aa7" text-anchor="middle" font-weight="700">3. data management</text>
  <text x="601.6" y="375.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">cleaning, coding,</text>
  <text x="601.6" y="391.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">storage</text>
  <circle cx="532.5" cy="422.9" r="0.1" stroke="#4b5563" stroke-width="0.1" fill="#4b5563"/>
  <rect x="355.0" y="417.0" width="190.0" height="76.0" rx="12" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="450.0" y="443.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">4. data analysis</text>
  <text x="450.0" y="463.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">descriptive and</text>
  <text x="450.0" y="479.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">inferential</text>
  <circle cx="367.5" cy="422.9" r="0.1" stroke="#4b5563" stroke-width="0.1" fill="#4b5563"/>
  <rect x="203.4" y="329.5" width="190.0" height="76.0" rx="12" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <text x="298.4" y="355.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">5. interpretation</text>
  <text x="298.4" y="375.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">meaning, limits,</text>
  <text x="298.4" y="391.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">assumptions</text>
  <circle cx="285.0" cy="280.0" r="0.1" stroke="#4b5563" stroke-width="0.1" fill="#4b5563"/>
  <rect x="203.4" y="154.5" width="190.0" height="76.0" rx="12" stroke="#d7322f" stroke-width="2.5" fill="#ffffff"/>
  <text x="298.4" y="180.5" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">6. presentation</text>
  <text x="298.4" y="200.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">charts, graphs,</text>
  <text x="298.4" y="216.5" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">clear language</text>
