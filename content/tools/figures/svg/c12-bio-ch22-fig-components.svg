<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 816" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="816" fill="#ffffff"/>
  <!-- Original RU-only overview of the six components of biostatistics named in topic 22.1.1 (not a textbook figure). -->
  <rect x="40" y="20" width="860" height="96" rx="14" stroke="#1f6fb5" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="60" font-size="28" fill="#1f6fb5" text-anchor="middle" font-weight="700">1. Study Design and Experimental Planning</text>
  <text x="470" y="96" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">question, variables, sample size</text>
  <line x1="470" y1="120" x2="470" y2="140.8" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M470 152 L462.5 137.9 L477.5 137.9 Z" fill="#4a4f57"/>
  <rect x="40" y="156" width="860" height="96" rx="14" stroke="#137a5a" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="196" font-size="28" fill="#137a5a" text-anchor="middle" font-weight="700">2. Data Collection</text>
  <text x="470" y="232" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">primary or secondary data</text>
  <line x1="470" y1="256" x2="470" y2="276.8" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M470 288 L462.5 273.9 L477.5 273.9 Z" fill="#4a4f57"/>
  <rect x="40" y="292" width="860" height="96" rx="14" stroke="#138a99" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="332" font-size="28" fill="#138a99" text-anchor="middle" font-weight="700">3. Data Management and Processing</text>
  <text x="470" y="368" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">cleaning, coding, storage</text>
  <line x1="470" y1="392" x2="470" y2="412.8" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M470 424 L462.5 409.9 L477.5 409.9 Z" fill="#4a4f57"/>
  <rect x="40" y="428" width="860" height="96" rx="14" stroke="#c7781a" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="468" font-size="28" fill="#c7781a" text-anchor="middle" font-weight="700">4. Data Analysis</text>
  <text x="470" y="504" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">descriptive and inferential</text>
  <line x1="470" y1="528" x2="470" y2="548.8" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M470 560 L462.5 545.9 L477.5 545.9 Z" fill="#4a4f57"/>
  <rect x="40" y="564" width="860" height="96" rx="14" stroke="#7a3fd6" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="604" font-size="28" fill="#7a3fd6" text-anchor="middle" font-weight="700">5. Interpretation of Results</text>
  <text x="470" y="640" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">meaning, limits, assumptions</text>
  <line x1="470" y1="664" x2="470" y2="684.8" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M470 696 L462.5 681.9 L477.5 681.9 Z" fill="#4a4f57"/>
  <rect x="40" y="700" width="860" height="96" rx="14" stroke="#d0322f" stroke-width="3.5" fill="#ffffff"/>
  <text x="470" y="740" font-size="28" fill="#d0322f" text-anchor="middle" font-weight="700">6. Presentation and Communication</text>
  <text x="470" y="776" font-size="25" fill="#1d2430" text-anchor="middle" font-weight="400">charts, graphs, clear language</text>
</svg>
