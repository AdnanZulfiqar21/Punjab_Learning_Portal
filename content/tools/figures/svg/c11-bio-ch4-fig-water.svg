<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.6 to 4.9: polarity of water, hydrogen bonding, water as a solvent and hydrophobic exclusion. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .a{font-size:20px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .e{font-size:17px;fill:#14181f;text-anchor:middle}
    </style>
    <g id="w"><circle cx="0" cy="0" r="22" fill="#d7322f"/><circle cx="-24" cy="20" r="13" fill="#1f6fb5"/><circle cx="24" cy="20" r="13" fill="#1f6fb5"/></g>
  </defs>
  <!-- panel 1: polar molecule -->
  <text class="h" x="200" y="50">A polar molecule</text>
  <circle cx="200" cy="200" r="60" fill="#d7322f"/><text class="a" x="200" y="208" style="font-size:30px">O</text>
  <circle cx="130" cy="265" r="34" fill="#1f6fb5"/><text class="a" x="130" y="273">H</text>
  <circle cx="270" cy="265" r="34" fill="#1f6fb5"/><text class="a" x="270" y="273">H</text>
  <text class="e" x="200" y="120">partial negative end</text>
  <text class="e" x="200" y="335">partial positive ends</text>
  <text class="s" x="200" y="400">H2O: oxygen pulls the shared</text><text class="s" x="200" y="426">electrons, so each end carries</text><text class="s" x="200" y="452">a partial charge</text>
  <!-- panel 2: hydrogen-bond network -->
  <text class="h" x="600" y="50">Hydrogen-bond network</text>
  <use href="#w" x="520" y="170"/><use href="#w" x="680" y="150"/><use href="#w" x="600" y="280"/><use href="#w" x="470" y="300"/><use href="#w" x="730" y="290"/>
  <g stroke="#4b5563" stroke-width="3" stroke-dasharray="7 5">
    <path d="M544 190 L660 160"/><path d="M576 300 L500 310"/><path d="M624 300 L706 300"/><path d="M600 258 L530 195"/><path d="M604 258 L690 175"/>
  </g>
  <text class="s" x="600" y="400">each molecule bonds with its neighbours;</text><text class="s" x="600" y="426">this gives cohesion, surface tension,</text><text class="s" x="600" y="452">high specific heat and heat of vaporisation</text>
  <!-- panel 3: solvent -->
  <text class="h" x="1000" y="50">Water as a solvent</text>
  <circle cx="1000" cy="220" r="34" fill="#d98b2b"/><text class="a" x="1000" y="228">Na+</text>
  <g transform="translate(1000,140) rotate(180)"><use href="#w"/></g>
  <g transform="translate(1080,220) rotate(90)"><use href="#w"/></g>
  <g transform="translate(1000,300)"><use href="#w"/></g>
  <g transform="translate(920,220) rotate(-90)"><use href="#w"/></g>
  <text class="s" x="1000" y="400">the negative ends of water face</text><text class="s" x="1000" y="426">an ion (Na+ shown); polar hydroxyl</text><text class="s" x="1000" y="452">groups of glucose bond the same way</text>
  <!-- bottom: hydrophobic exclusion -->
  <text class="h" x="600" y="540">Hydrophobic exclusion</text>
  <rect x="300" y="580" width="600" height="160" rx="20" fill="#dbe9f5"/>
  <ellipse cx="600" cy="660" rx="130" ry="50" fill="#f2b134" stroke="#8a4b00" stroke-width="4"/>
  <text class="e" x="600" y="667" style="font-weight:700">oil (lipid)</text>
  <g>
    <use href="#w" x="360" y="620"/><use href="#w" x="420" y="700"/><use href="#w" x="780" y="700"/><use href="#w" x="840" y="620"/><use href="#w" x="600" y="596"/><use href="#w" x="470" y="612"/><use href="#w" x="730" y="612"/>
  </g>
  <text class="s" x="600" y="780">Non-polar molecules cannot hydrogen-bond with water, so water pushes them together; lipids cluster and build membranes.</text>
</svg>
