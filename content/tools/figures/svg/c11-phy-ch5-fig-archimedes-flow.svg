<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.8 to 5.15 and topics 5.7 to 5.10: upthrust and floatation, streamline and turbulent flow, rate of flow and the equation of continuity. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Archimedes' principle, floatation, streamline flow and the equation of continuity</text>
  <!-- archimedes -->
  <rect x="50" y="55" width="380" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="83">Upthrust on a cylinder (5.7, Fig. 5.8)</text>
  <rect x="90" y="110" width="160" height="230" fill="#bcdcf0" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="135" y="180" width="70" height="90" fill="#f8c8b8" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M170 150 V175" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M170 300 V275" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <text class="l" x="182" y="150" style="fill:#d7322f">F1 = P1 A</text>
  <text class="l" x="182" y="318" style="fill:#1f6fb5">F2 = P2 A</text>
  <path d="M260 110 V180" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="266" y="150">h1</text>
  <path d="M290 110 V270" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="296" y="200">h2</text>
  <path d="M215 180 V270" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="220" y="230">h</text>
  <text class="r" x="150" y="228">area A</text>
  <g class="f" style="font-size:11px">
    <text x="310" y="120">h2 - h1 = h (5.11)</text>
    <text x="310" y="138">P1 = rho g h1</text>
    <text x="310" y="156">P2 = rho g h2</text>
    <text x="310" y="174">F2 - F1 =</text>
    <text x="310" y="192"> rho g A (h2-h1)</text>
    <text x="310" y="210"> (5.12)</text>
    <text x="310" y="228">upthrust = rho g V</text>
    <text x="310" y="246"> (5.13)</text>
  </g>
  <g class="t">
    <text x="70" y="360">upthrust = weight of liquid displaced (Archimedes); floats if weight is at most upthrust</text>
    <text x="70" y="376">Example 5.2: 10 cm cube in water: 1000 x 9.8 x 10^-3 = 9.8 N</text>
  </g>
  <!-- floatation apps -->
  <rect x="450" y="55" width="340" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="620" y="83">Floatation and its uses (Figs. 5.9, 5.10)</text>
  <g class="t">
    <text x="470" y="110"><tspan class="b">principle:</tspan> a floating object displaces a fluid whose</text>
    <text x="470" y="126">weight equals the weight of the object; applies to gases too</text>
    <text x="470" y="150"><tspan class="b">1 hot-air balloon:</tspan> hot air is less dense than the air</text>
    <text x="470" y="166">around, so the buoyant force exceeds the weight</text>
    <text x="470" y="188"><tspan class="b">2 wooden block:</tspan> an equal volume of water weighs more</text>
    <text x="470" y="204">than the block, so it floats partly immersed</text>
    <text x="470" y="226"><tspan class="b">3 ships and boats:</tspan> sink only if weight plus cargo</text>
    <text x="470" y="242">exceeds the upthrust of water</text>
    <text x="470" y="264"><tspan class="b">4 submarine:</tspan> tanks filled with seawater raise its weight</text>
    <text x="470" y="280">above the upthrust, so it dives; emptied, it rises</text>
    <text x="470" y="308"><tspan class="b">Example 5.3:</tspan> balloon 80 N with 10 m^3 of hydrogen:</text>
    <text x="470" y="324">upthrust = 1.3 x 9.8 x 10 = 127.4 N; hydrogen weighs</text>
    <text x="470" y="340">0.09 x 9.8 x 10 = 8.82 N; contents w2 = 127.4 - 80 - 8.82</text>
    <text x="470" y="356">= 38.6 N (printed 38 N, then '41 N' in the closing line)</text>
    <text x="470" y="376">Archimedes: born about 287 BCE in Syracuse, Sicily</text>
  </g>
  <!-- flow -->
  <rect x="810" y="55" width="340" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Streamline and turbulent flow (5.8)</text>
  <g stroke="#1f6fb5" stroke-width="1.5" fill="none">
    <path d="M830 110 H960 Q 1000 110 1030 125"/><path d="M830 125 H960 Q 1000 125 1030 135"/><path d="M830 140 H960 Q 1000 140 1030 145"/><path d="M830 155 H960 Q 1000 155 1030 155"/>
  </g>
  <text class="r" x="1040" y="176">streamlines never cross</text>
  <rect x="930" y="186" width="10" height="50" fill="#4b5563"/>
  <path d="M860 200 H920" stroke="#1f6fb5" stroke-width="1.5" marker-end="url(#bl)"/>
  <path d="M950 195 Q 990 180 1010 210 Q 990 240 950 225" fill="none" stroke="#d7322f" stroke-width="1.5"/>
  <path d="M950 230 Q 985 250 1000 232" fill="none" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="1020" y="206">eddies: turbulent</text>
  <g class="t">
    <text x="830" y="266"><tspan class="b">streamline (laminar):</tspan> every particle through a point</text>
    <text x="830" y="282">follows the same path as those before it; smooth,</text>
    <text x="830" y="298">regular; the streamline's tangent gives the flow direction</text>
    <text x="830" y="320"><tspan class="b">turbulent:</tspan> above a certain speed the flow is unsteady</text>
    <text x="830" y="336">and irregular, with eddies and whirlpools</text>
    <text x="830" y="358"><tspan class="b">ideal fluid:</tspan> non-viscous, incompressible, steady flow;</text>
    <text x="830" y="374">Formula One cars and dolphins are streamlined</text>
  </g>
  <!-- continuity -->
  <rect x="50" y="405" width="1100" height="270" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="433">Rate of flow and the equation of continuity (5.8 to 5.10, Figs. 5.14, 5.15)</text>
  <path d="M90 470 H250 Q 300 470 320 500 Q 340 530 400 530 H480" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M90 560 H250 Q 300 560 320 580 Q 340 600 400 600 H480" fill="none" stroke="#4b5563" stroke-width="2"/>
  <rect x="120" y="470" width="30" height="90" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="1"/>
  <rect x="420" y="530" width="20" height="70" fill="#f8c8b8" stroke="#d7322f" stroke-width="1"/>
  <path d="M160 515 H210" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M445 565 H475" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="100" y="462">A1</text><text class="l" x="175" y="508" style="fill:#1f6fb5">v1</text><text class="r" x="112" y="580">delta x1 = v1 delta t</text>
  <text class="l" x="420" y="522">A2</text><text class="l" x="480" y="556" style="fill:#d7322f">v2</text><text class="r" x="400" y="620">delta x2 = v2 delta t</text>
  <g class="f">
    <text x="520" y="468">rate of flow = volume / time = A v t / t = A v  (5.14), m^3 s^-1 or L s^-1</text>
    <text x="520" y="492">delta m1 = A1 v1 delta t rho1;  delta m2 = A2 v2 delta t rho2;  delta m1 = delta m2 (5.16)</text>
    <text x="520" y="516">A1 v1 rho1 = A2 v2 rho2 (5.17)  ->  A1 v1 = A2 v2 (5.18) for an incompressible fluid</text>
  </g>
  <g class="t">
    <text x="520" y="544"><tspan class="b">statement:</tspan> the product of cross-sectional area and fluid speed (Av) is the same at every point along the</text>
    <text x="520" y="560">pipe, equal to the volume flow per second; it expresses conservation of mass (Euler, 1752)</text>
    <text x="520" y="584"><tspan class="b">squeezing a rubber pipe (5.10):</tspan> A2 smaller than A1 forces v2 larger than v1: the flow speeds up</text>
    <text x="520" y="608"><tspan class="b">Example 5.4:</tspan> hose of 20 mm diameter discharging 30 kg in 60 s: A = 3.14 x 10^-4 m^2,</text>
    <text x="520" y="624">v = (mass/second)/(rho A) = 0.5/(1000 x 3.14 x 10^-4) = 1.6 m s^-1 (printed as 0.6 m)</text>
    <text x="520" y="648">a stream from a tap narrows as it falls; applied to blood in arteries, water in rivers and pipes, air in ducts</text>
    <text x="70" y="652">steady flow: the overall pattern does not change with time</text>
  </g>
  <text class="s" x="600" y="692" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
