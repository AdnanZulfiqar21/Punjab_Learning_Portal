  <circle cx="325.0" cy="286.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="335.0" cy="287.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="330.0" cy="296.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="280.0" cy="320.0" r="16.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <circle cx="275.0" cy="316.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="285.0" cy="317.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="280.0" cy="326.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="350.0" cy="240.0" r="16.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <circle cx="345.0" cy="236.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="355.0" cy="237.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <circle cx="350.0" cy="246.0" r="2.2" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <path d="M418 200 Q440 200 440 215 L440 285 Q440 300 418 300" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="410.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">synaptic vesicles full of neurotransmitter</text>
  <rect x="470.0" y="120.0" width="30.0" height="260.0" rx="0" stroke="none" stroke-width="0" fill="#f0f9ff"/>
  <text x="485.0" y="105.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">cleft</text>
  <circle cx="455.0" cy="230.0" r="3.5" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
