  <rect width="900" height="590" fill="#ffffff"/>
  <!-- Original diagram after Figure 15.7: a synapse, with vesicles releasing neurotransmitter across the cleft onto receptors, and the six steps of transmission. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A synapse and how it passes the signal on</text>
  <path d="M60 120 L300 120 C380 120 430 160 430 250 C430 340 380 380 300 380 L60 380" stroke="#a16207" stroke-width="3" fill="#fde68a" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="150.0" y="105.0" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">presynaptic axon terminal</text>
  <line x1="80.0" y1="250.0" x2="169.6" y2="250.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M180.0 250.0 L168.2 255.5 L168.2 244.5 Z" fill="#d7322f"/>
  <text x="130.0" y="238.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">impulse</text>
