  <circle cx="488.0" cy="262.0" r="3.5" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <path d="M520 120 L520 380 L840 380 L840 120 Z" stroke="#0f766e" stroke-width="3" fill="#ccfbf1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="680.0" y="105.0" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">postsynaptic cell</text>
  <rect x="512.0" y="190.0" width="16.0" height="20.0" rx="4" stroke="#0f766e" stroke-width="1.5" fill="#5eead4"/>
  <rect x="512.0" y="230.0" width="16.0" height="20.0" rx="4" stroke="#0f766e" stroke-width="1.5" fill="#5eead4"/>
  <rect x="512.0" y="270.0" width="16.0" height="20.0" rx="4" stroke="#0f766e" stroke-width="1.5" fill="#5eead4"/>
  <text x="540.0" y="255.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">receptors</text>
  <line x1="560.0" y1="300.0" x2="632.0" y2="300.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M640.0 300.0 L630.9 304.2 L630.9 295.8 Z" fill="#1f6fb5"/>
  <text x="650.0" y="305.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">Na+ in: new impulse</text>
  <text x="430.0" y="150.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">Ca2+</text>
  <line x1="470.0" y1="160.0" x2="427.7" y2="172.7" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M420.0 175.0 L427.5 168.3 L429.9 176.4 Z" fill="#d98b2b"/>
  <text x="60.0" y="444.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">1 the impulse reaches the synaptic knob; calcium gates open</text>
  <text x="60.0" y="464.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">2 Ca2+ diffuses in from the cleft</text>
  <text x="60.0" y="484.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">3 vesicles fuse with the membrane and release neurotransmitter (exocytosis)</text>
  <text x="60.0" y="504.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">4 the neurotransmitter diffuses across and binds to receptor proteins</text>
  <text x="60.0" y="524.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">5 Na+ gates open: an action potential starts in the next cell</text>
  <text x="60.0" y="544.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">6 the transmitter is taken back up, or broken down by enzymes</text>
  <text x="450.0" y="581" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
