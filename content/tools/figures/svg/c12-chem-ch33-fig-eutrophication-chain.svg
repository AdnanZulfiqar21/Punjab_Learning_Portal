<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="560" fill="#ffffff"/>
  <!-- Eutrophication chain (our own drawing for the Roman Urdu lesson; the book's Fig 33.3a is a photograph). -->
  <rect x="40.0" y="40.0" width="320.0" height="200.0" rx="16" stroke="#0f7a62" stroke-width="3.5" fill="#e6f4ef"/>
  <text x="200.0" y="132.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">zyada N aur P</text>
  <text x="200.0" y="176.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">(khaad, sewage)</text>
  <rect x="390.0" y="40.0" width="320.0" height="200.0" rx="16" stroke="#0f7a62" stroke-width="3.5" fill="#e6f4ef"/>
  <text x="550.0" y="132.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">algae ki tez</text>
  <text x="550.0" y="176.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">barhotri (bloom)</text>
  <rect x="740.0" y="40.0" width="320.0" height="200.0" rx="16" stroke="#d98b2b" stroke-width="3.5" fill="#fff1dc"/>
  <text x="900.0" y="132.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">bloom dhoop</text>
  <text x="900.0" y="176.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">rok leta hai</text>
  <rect x="740.0" y="320.0" width="320.0" height="200.0" rx="16" stroke="#d98b2b" stroke-width="3.5" fill="#fff1dc"/>
  <text x="900.0" y="412.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">murda algae gal kar</text>
  <text x="900.0" y="456.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">oxygen kharch karti</text>
  <rect x="390.0" y="320.0" width="320.0" height="200.0" rx="16" stroke="#d7322f" stroke-width="3.5" fill="#fde2e1"/>
  <text x="550.0" y="412.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">dead zone: aabi</text>
  <text x="550.0" y="456.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="700">zindagi mar jati</text>
  <line x1="362.0" y1="140.0" x2="375.2" y2="140.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M388.0 140.0 L373.5 146.8 L373.5 133.2 Z" fill="#14181f"/>
  <line x1="712.0" y1="140.0" x2="725.2" y2="140.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M738.0 140.0 L723.5 146.8 L723.5 133.2 Z" fill="#14181f"/>
  <line x1="900.0" y1="242.0" x2="900.0" y2="305.2" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M900.0 318.0 L893.2 303.5 L906.8 303.5 Z" fill="#14181f"/>
  <line x1="738.0" y1="420.0" x2="724.8" y2="420.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <path d="M712.0 420.0 L726.5 413.2 L726.5 426.8 Z" fill="#14181f"/>
</svg>
