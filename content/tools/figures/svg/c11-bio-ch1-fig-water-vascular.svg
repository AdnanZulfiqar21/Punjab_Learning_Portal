<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.16: a sea star from above with its water-vascular system. -->
  <defs>
    <style>
      .t{font-size:32px;font-weight:700;fill:#14181f}
      .s{font-size:26px;fill:#4b5563}
      .canal{stroke:#1f6fb5;stroke-width:12;fill:none;stroke-linecap:round}
      .lat{stroke:#1f6fb5;stroke-width:6;fill:none;stroke-linecap:round}
      .foot{fill:#1f6fb5}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- star body: five arms -->
  <g transform="translate(500 500)">
    <path d="M0 -330 L85 -110 L315 -100 L135 55 L195 285 L0 150 L-195 285 L-135 55 L-315 -100 L-85 -110 Z"
          fill="#f6e3c8" stroke="#d9b88a" stroke-width="6" stroke-linejoin="round"/>
    <!-- ring canal -->
    <circle r="60" class="canal"/>
    <!-- radial canals along the five arms -->
    <g class="canal">
      <path d="M0 -60 L0 -300"/>
      <path d="M57 -19 L285 -92"/>
      <path d="M35 49 L176 258"/>
      <path d="M-35 49 L-176 258"/>
      <path d="M-57 -19 L-285 -92"/>
    </g>
    <!-- lateral canals and tube feet on the top arm (shown fully) -->
    <g class="lat">
      <path d="M0 -120 h-30 M0 -120 h30 M0 -160 h-30 M0 -160 h30 M0 -200 h-30 M0 -200 h30 M0 -240 h-30 M0 -240 h30 M0 -280 h-30 M0 -280 h30"/>
    </g>
    <g class="foot">
      <circle cx="-30" cy="-120" r="7"/><circle cx="30" cy="-120" r="7"/><circle cx="-30" cy="-160" r="7"/><circle cx="30" cy="-160" r="7"/>
      <circle cx="-30" cy="-200" r="7"/><circle cx="30" cy="-200" r="7"/><circle cx="-30" cy="-240" r="7"/><circle cx="30" cy="-240" r="7"/>
      <circle cx="-30" cy="-280" r="7"/><circle cx="30" cy="-280" r="7"/>
    </g>
    <!-- madreporite (sieve plate) off-centre on the upper surface -->
    <path d="M60 -19 L110 -70" class="canal"/>
    <circle cx="120" cy="-80" r="26" fill="#ffffff" stroke="#1f6fb5" stroke-width="8"/>
    <g fill="#1f6fb5"><circle cx="112" cy="-88" r="3"/><circle cx="128" cy="-88" r="3"/><circle cx="120" cy="-76" r="3"/><circle cx="110" cy="-72" r="3"/><circle cx="130" cy="-72" r="3"/></g>
    <!-- mouth marker (on the underside, shown as a ring) -->
    <circle r="14" fill="#ffffff" stroke="#b26a00" stroke-width="6"/>
  </g>
  <!-- labels with leaders -->
  <path class="lead" d="M620 420 L740 330"/>
  <text class="t" x="750" y="325">Madreporite</text>
  <text class="s" x="750" y="360">sieve-like plate</text>
  <path class="lead" d="M560 500 L740 560"/>
  <text class="t" x="750" y="565">Ring canal</text>
  <text class="s" x="750" y="600">around the mouth</text>
  <path class="lead" d="M500 320 L330 240"/>
  <text class="t" x="60" y="235">Radial canal</text>
  <text class="s" x="60" y="270">one along each arm</text>
  <path class="lead" d="M470 220 L330 140"/>
  <text class="t" x="60" y="135">Lateral canals</text>
  <text class="s" x="60" y="170">end in tube feet</text>
  <path class="lead" d="M500 500 L330 720"/>
  <text class="t" x="60" y="755">Mouth (underside)</text>
  <text class="s" x="60" y="790">leads to the gut</text>
  <text class="s" x="500" y="950" text-anchor="middle">Water: madreporite → ring canal → radial canals → lateral canals → tube feet</text>
</svg>
