<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.1: the first line of defence (skin, mucous membranes, acid, lysozyme, cilia), the second (germ-killer cells, protective proteins, inflammation, fever) and the third, specific line (T cells, B cells, antibodies, memory). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Three lines of defence against infection</text>
  <rect x="30.0" y="70.0" width="260.0" height="340.0" rx="16" stroke="#0e7490" stroke-width="3" fill="#ecfeff"/>
  <text x="160.0" y="108.0" font-size="22" fill="#0e7490" text-anchor="middle" font-weight="700">1st line</text>
  <text x="160.0" y="134.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">non-specific</text>
  <text x="160.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">barriers</text>
  <rect x="55.0" y="185.0" width="210.0" height="46.0" rx="10" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <text x="160.0" y="214.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">skin</text>
  <rect x="55.0" y="250.0" width="210.0" height="46.0" rx="10" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <text x="160.0" y="279.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">mucous membranes</text>
  <rect x="55.0" y="315.0" width="210.0" height="46.0" rx="10" stroke="#0e7490" stroke-width="1.5" fill="#ffffff"/>
  <text x="160.0" y="344.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">acid, lysozyme, cilia</text>
  <line x1="292.0" y1="240.0" x2="310.8" y2="240.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M318.0 240.0 L309.8 243.8 L309.8 236.2 Z" fill="#14181f"/>
  <rect x="320.0" y="70.0" width="260.0" height="340.0" rx="16" stroke="#d98b2b" stroke-width="3" fill="#fff7ed"/>
  <text x="450.0" y="108.0" font-size="22" fill="#d98b2b" text-anchor="middle" font-weight="700">2nd line</text>
  <text x="450.0" y="134.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">non-specific</text>
  <text x="450.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">inside the body</text>
  <rect x="345.0" y="185.0" width="210.0" height="46.0" rx="10" stroke="#d98b2b" stroke-width="1.5" fill="#ffffff"/>
  <text x="450.0" y="214.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">germ-killer cells</text>
  <rect x="345.0" y="250.0" width="210.0" height="46.0" rx="10" stroke="#d98b2b" stroke-width="1.5" fill="#ffffff"/>
  <text x="450.0" y="279.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">protective proteins</text>
  <rect x="345.0" y="315.0" width="210.0" height="46.0" rx="10" stroke="#d98b2b" stroke-width="1.5" fill="#ffffff"/>
  <text x="450.0" y="344.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">inflammation, fever</text>
  <line x1="582.0" y1="240.0" x2="600.8" y2="240.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M608.0 240.0 L599.8 243.8 L599.8 236.2 Z" fill="#14181f"/>
  <rect x="610.0" y="70.0" width="260.0" height="340.0" rx="16" stroke="#7c3aed" stroke-width="3" fill="#f5f3ff"/>
  <text x="740.0" y="108.0" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="700">3rd line</text>
  <text x="740.0" y="134.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">specific</text>
  <text x="740.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">immune system</text>
  <rect x="635.0" y="185.0" width="210.0" height="46.0" rx="10" stroke="#7c3aed" stroke-width="1.5" fill="#ffffff"/>
  <text x="740.0" y="214.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">T cells</text>
  <rect x="635.0" y="250.0" width="210.0" height="46.0" rx="10" stroke="#7c3aed" stroke-width="1.5" fill="#ffffff"/>
  <text x="740.0" y="279.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">B cells and antibodies</text>
  <rect x="635.0" y="315.0" width="210.0" height="46.0" rx="10" stroke="#7c3aed" stroke-width="1.5" fill="#ffffff"/>
  <text x="740.0" y="344.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">memory</text>
  <text x="450.0" y="445.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">microbes that get past one line meet the next</text>
  <text x="450.0" y="470.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">1st and 2nd lines act on any invader; the 3rd targets particular germs and remembers them</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
