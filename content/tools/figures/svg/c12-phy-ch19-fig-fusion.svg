<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Fig 19.6: three fusion reactions drawn with protons and neutrons: 2H + 2H -&gt; 3H + 1H + 4.0 MeV, 2H + 2H -&gt; 3He + n + 3.3 MeV, and 2H + 3H -&gt; 4He + n + 17.6 MeV. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Fusion of hydrogen isotopes (after Fig 19.6)</text>
  <rect x="760.0" y="70.0" width="120.0" height="80.0" rx="6" stroke="#4b5563" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="780.0" cy="95.0" r="9.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <text x="796.0" y="100.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">proton</text>
  <circle cx="780.0" cy="125.0" r="9.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="796.0" y="130.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">neutron</text>
  <circle cx="71.0" cy="114.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="89.0" cy="126.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="120.0" y="126.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="151.0" cy="114.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="169.0" cy="126.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <line x1="200.0" y1="120.0" x2="261.2" y2="120.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M270.0 120.0 L260.0 124.6 L260.0 115.4 Z" fill="#d98b2b"/>
  <circle cx="301.0" cy="114.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="319.0" cy="126.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <circle cx="319.0" cy="112.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="350.0" y="126.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="381.0" cy="114.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <text x="430.0" y="126.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">+ energy</text>
  <text x="530.0" y="126.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">2H + 2H -&gt; 3H + 1H + 4.0 MeV</tspan></text>
  <circle cx="71.0" cy="224.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="89.0" cy="236.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="120.0" y="236.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="151.0" cy="224.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="169.0" cy="236.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <line x1="200.0" y1="230.0" x2="261.2" y2="230.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M270.0 230.0 L260.0 234.6 L260.0 225.4 Z" fill="#d98b2b"/>
  <circle cx="301.0" cy="224.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="319.0" cy="236.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="319.0" cy="222.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="350.0" y="236.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="381.0" cy="224.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="430.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">+ energy</text>
  <text x="530.0" y="236.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">2H + 2H -&gt; 3He + n + 3.3 MeV</tspan></text>
  <circle cx="71.0" cy="334.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="89.0" cy="346.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="120.0" y="346.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="151.0" cy="334.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="169.0" cy="346.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <circle cx="169.0" cy="332.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <line x1="200.0" y1="340.0" x2="261.2" y2="340.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M270.0 340.0 L260.0 344.6 L260.0 335.4 Z" fill="#d98b2b"/>
  <circle cx="301.0" cy="334.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="319.0" cy="346.0" r="10.0" stroke="#d7322f" stroke-width="1.5" fill="#fbcfe8"/>
  <circle cx="319.0" cy="332.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <circle cx="302.0" cy="348.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="350.0" y="346.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="381.0" cy="334.0" r="10.0" stroke="#1f6fb5" stroke-width="1.5" fill="#93c5fd"/>
  <text x="430.0" y="346.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">+ energy</text>
  <text x="530.0" y="346.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">2H + 3H -&gt; 4He + n + 17.6 MeV</tspan></text>
  <text x="450.0" y="430.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">The nuclei must be forced together against their electric repulsion: about 10 million degrees</text>
  <text x="450.0" y="448.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(the Sun's core), or experimental reactors heated to over 100 million degrees.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
