<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="472" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.7: complement proteins activating each other in sequence, the last five forming a membrane-attack complex that makes a pore in a microbe's membrane so fluid and salts rush in. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The complement system: a cascade that punches holes</text>
  <circle cx="90.0" cy="130.0" r="26.0" stroke="#a16207" stroke-width="2" fill="#fde68a"/>
  <text x="90.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C1</text>
  <line x1="118.0" y1="130.0" x2="163.6" y2="130.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M170.0 130.0 L162.7 133.4 L162.7 126.6 Z" fill="#14181f"/>
  <circle cx="200.0" cy="130.0" r="26.0" stroke="#a16207" stroke-width="2" fill="#fef9c3"/>
  <text x="200.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C2</text>
  <line x1="228.0" y1="130.0" x2="273.6" y2="130.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M280.0 130.0 L272.7 133.4 L272.7 126.6 Z" fill="#14181f"/>
  <circle cx="310.0" cy="130.0" r="26.0" stroke="#a16207" stroke-width="2" fill="#fef9c3"/>
  <text x="310.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C3</text>
  <line x1="338.0" y1="130.0" x2="383.6" y2="130.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M390.0 130.0 L382.7 133.4 L382.7 126.6 Z" fill="#14181f"/>
  <circle cx="420.0" cy="130.0" r="26.0" stroke="#a16207" stroke-width="2" fill="#fef9c3"/>
  <text x="420.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C4</text>
  <line x1="448.0" y1="130.0" x2="493.6" y2="130.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M500.0 130.0 L492.7 133.4 L492.7 126.6 Z" fill="#14181f"/>
  <circle cx="530.0" cy="130.0" r="26.0" stroke="#a16207" stroke-width="2" fill="#fef9c3"/>
  <text x="530.0" y="135.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C5</text>
  <text x="330.0" y="84.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">inactive proteins from the liver switch each other on in sequence</text>
  <line x1="560.0" y1="150.0" x2="634.6" y2="215.3" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M640.0 220.0 L631.4 217.5 L636.4 211.8 Z" fill="#14181f"/>
  <rect x="560.0" y="230.0" width="300.0" height="26.0" rx="4" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <rect x="560.0" y="256.0" width="300.0" height="26.0" rx="4" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="552.0" y="262.0" font-size="12" fill="#0f7a62" text-anchor="end" font-weight="700">microbe membrane</text>
  <ellipse cx="732.0" cy="256.0" rx="9.0" ry="32.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <ellipse cx="716.8" cy="265.5" rx="9.0" ry="32.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <ellipse cx="692.2" cy="261.9" rx="9.0" ry="32.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <ellipse cx="692.2" cy="250.1" rx="9.0" ry="32.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <ellipse cx="716.8" cy="246.5" rx="9.0" ry="32.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <rect x="700.0" y="226.0" width="20.0" height="60.0" rx="4" stroke="#ffffff" stroke-width="1" fill="#ffffff"/>
  <line x1="710.0" y1="330.0" x2="710.0" y2="297.2" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
