  <text x="560.0" y="195.0" font-size="13" fill="#a16207" text-anchor="end" font-weight="700">membrane-attack complex</text>
  <line x1="564.0" y1="190.0" x2="690.0" y2="228.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="690.0" cy="228.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="208.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">(the last five proteins)</text>
  <rect x="40.0" y="390.0" width="820.0" height="52.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="413.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">more than a dozen proteins circulate inactive; meeting a microbe sets off the chain</text>
  <text x="450.0" y="433.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the microbe swells and bursts</text>
  <text x="450.0" y="463" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
