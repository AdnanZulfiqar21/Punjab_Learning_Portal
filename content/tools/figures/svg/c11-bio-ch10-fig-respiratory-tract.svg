<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="880" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.2 to 10.5: the respiratory tract from nasal cavity to alveoli, the branching tree and the two lungs. Schematic. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:19px;font-weight:700;fill:#14181f}
      .s{font-size:17px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <text class="h" x="600" y="40">The human respiratory tract</text>
  <!-- upper tract -->
  <rect x="520" y="70" width="160" height="50" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="s" x="600" y="102" text-anchor="middle">nasal cavity</text>
  <rect x="540" y="130" width="120" height="44" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="s" x="600" y="159" text-anchor="middle">pharynx</text>
  <rect x="555" y="184" width="90" height="44" rx="10" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text class="s" x="600" y="213" text-anchor="middle">larynx</text>
  <path d="M575 182 h50" stroke="#0f7a62" stroke-width="7" stroke-linecap="round"/>
  <text class="k" x="140" y="90">Upper respiratory tract</text>
  <text class="s" x="140" y="114">nasal cavity, pharynx, larynx:</text><text class="s" x="140" y="136">move, clean, humidify and warm</text><text class="s" x="140" y="158">the air; no gas exchange</text>
  <path class="lead" d="M440 110 L515 100"/>
  <text class="s" x="700" y="190">epiglottis: flap over the glottis;</text><text class="s" x="700" y="212">closes the larynx on swallowing</text>
  <text class="s" x="700" y="250">larynx (voice box): muscles,</text><text class="s" x="700" y="272">cartilages and the vocal cords</text>
  <!-- trachea -->
  <rect x="580" y="228" width="40" height="150" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/>
  <g stroke="#9ca3af" stroke-width="4" fill="none"><path d="M584 250 h32 M584 275 h32 M584 300 h32 M584 325 h32 M584 350 h32"/></g>
  <text class="k" x="140" y="260">Lower respiratory tract</text>
  <text class="s" x="140" y="284">trachea, bronchi, bronchioles,</text><text class="s" x="140" y="306">alveoli; branching like a tree,</text><text class="s" x="140" y="328">2,414 km of airways in all</text>
  <text class="s" x="700" y="320">trachea: about 1 inch wide,</text><text class="s" x="700" y="342">4-6 inches long; smooth muscle</text><text class="s" x="700" y="364">and C-shaped cartilage rings;</text><text class="s" x="700" y="386">mucus and cilia</text>
  <path class="lead" d="M695 330 L622 320"/>
  <!-- lungs -->
  <path d="M560 400 q-200 20 -230 240 q-10 120 120 150 q110 10 130 -120 z" fill="#f6d5cf" stroke="#b5463a" stroke-width="4"/>
  <path d="M640 400 q200 20 230 240 q10 120 -120 150 q-110 10 -130 -120 z" fill="#f6d5cf" stroke="#b5463a" stroke-width="4"/>
  <!-- lobes -->
  <g stroke="#b5463a" stroke-width="2" fill="none" stroke-dasharray="7 5"><path d="M345 560 q110 -20 220 40 M380 680 q100 -30 190 20"/><path d="M640 620 q100 -40 200 -10"/></g>
  <!-- bronchial tree -->
  <g stroke="#b5463a" stroke-width="10" fill="none" stroke-linecap="round"><path d="M600 378 v25 M600 403 l-80 60 M600 403 l80 60"/></g>
  <g stroke="#b5463a" stroke-width="6" fill="none" stroke-linecap="round"><path d="M520 463 l-60 40 M520 463 l-10 70 M520 463 l40 60 M680 463 l60 40 M680 463 l10 70"/></g>
  <g stroke="#d98b2b" stroke-width="3" fill="none" stroke-linecap="round"><path d="M460 503 l-40 30 M460 503 l-10 50 M510 533 l-30 40 M510 533 l20 50 M560 523 l-10 50 M560 523 l30 40 M740 503 l40 30 M740 503 l10 50 M690 533 l30 40 M690 533 l-20 50"/></g>
  <g fill="#f2b134" stroke="#d98b2b" stroke-width="2"><circle cx="420" cy="540" r="8"/><circle cx="448" cy="560" r="8"/><circle cx="478" cy="580" r="8"/><circle cx="530" cy="590" r="8"/><circle cx="548" cy="580" r="8"/><circle cx="592" cy="570" r="8"/><circle cx="782" cy="540" r="8"/><circle cx="752" cy="560" r="8"/><circle cx="722" cy="580" r="8"/><circle cx="668" cy="590" r="8"/></g>
  <text class="s" x="330" y="812" text-anchor="middle">right lung: larger,</text><text class="s" x="330" y="834" text-anchor="middle">three lobes</text>
  <text class="s" x="870" y="812" text-anchor="middle">left lung: smaller, two lobes;</text><text class="s" x="870" y="834" text-anchor="middle">room for the heart</text>
  <text class="k" x="900" y="430">Branching</text>
  <text class="s" x="900" y="454">primary bronchi (one per lung)</text><text class="s" x="900" y="476">secondary bronchi: 3 right, 2 left,</text><text class="s" x="900" y="498">with cartilage plates</text><text class="s" x="900" y="520">tertiary bronchi, bronchioles</text><text class="s" x="900" y="542">(no cartilage), terminal</text><text class="s" x="900" y="564">bronchioles, alveolar ducts,</text><text class="s" x="900" y="586">clusters of alveoli (dots)</text>
  <path class="lead" d="M895 470 L750 505"/>
  <text class="k" x="60" y="430">Pleura</text>
  <text class="s" x="60" y="454">visceral pleura on the lung,</text><text class="s" x="60" y="476">parietal pleura on the chest wall;</text><text class="s" x="60" y="498">fluid in the pleural cavity lets</text><text class="s" x="60" y="520">the lungs expand and recoil</text>
  <path class="lead" d="M300 470 L340 520"/>
  <text class="s" x="600" y="868" text-anchor="middle">Schematic: the left lung is drawn on the right of the picture as in a chest X-ray view. Gas exchange happens only in the alveoli.</text>
</svg>
