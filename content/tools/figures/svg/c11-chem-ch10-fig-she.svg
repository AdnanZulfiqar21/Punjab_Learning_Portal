<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.4: the standard hydrogen electrode, hydrogen gas at 1 atm bubbled over platinum in 1 mol dm-3 H+ at 298 K. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The standard hydrogen electrode (SHE)</text>
  <path d="M294 210 L300 216 L300 430 Q300 440 310 440 L530 440 Q540 440 540 430 L540 216 L546 210" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M301.5 274.4 L301.5 430 Q301.5 438.5 310 438.5 L530 438.5 Q538.5 438.5 538.5 430 L538.5 274.4 Z" stroke="none" stroke-width="0" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="301.5" y1="274.4" x2="538.5" y2="274.4" stroke="#14181f" stroke-width="1" stroke-linecap="round"/>
  <path d="M408 70 L408 350 Q390 360 390 380 L390 400 M432 70 L432 100 L456 100 M432 116 L456 116 M432 116 L432 350 Q450 360 450 380 L450 400" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="420.0" y1="60.0" x2="420.0" y2="394.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M410.0 396.0 L428.0 386.0 L436.0 404.0 L418.0 414.0 Z" stroke="#14181f" stroke-width="1.5" fill="#334155" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="462.0" cy="370.0" r="4.0" stroke="#1f6fb5" stroke-width="1.4" fill="#ffffff"/>
  <circle cx="470.0" cy="350.0" r="4.0" stroke="#1f6fb5" stroke-width="1.4" fill="#ffffff"/>
  <circle cx="458.0" cy="336.0" r="4.0" stroke="#1f6fb5" stroke-width="1.4" fill="#ffffff"/>
  <line x1="560.0" y1="108.0" x2="470.4" y2="108.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M460.0 108.0 L471.8 102.5 L471.8 113.5 Z" fill="#1f6fb5"/>
  <text x="570.0" y="102.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">H2 gas at 1 atm</text>
  <text x="570.0" y="122.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="400">(bubbles over the platinum)</text>
  <line x1="420.0" y1="150.0" x2="600.0" y2="170.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="606.0" y="175.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">platinum wire</text>
  <line x1="430.0" y1="404.0" x2="600.0" y2="420.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="606.0" y="425.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">platinum electrode (platinum black)</text>
  <line x1="390.0" y1="360.0" x2="260.0" y2="330.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="254.0" y="326.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">glass bell with holes</text>
  <text x="254.0" y="344.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="400">for the H2 to bubble out</text>
  <text x="330.0" y="425.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">H+ 1 mol dm-3, 298 K</text>
  <rect x="40.0" y="70.0" width="230.0" height="100.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="54.0" y="98.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">2H+(aq) + 2e- = H2(g)</text>
  <text x="54.0" y="117.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">E standard = 0.00 V</text>
  <text x="54.0" y="137.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">(reference electrode)</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
