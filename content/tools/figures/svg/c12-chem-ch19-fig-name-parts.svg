<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- The book's scheme beside 'iii) Prefix' on p41: Prefix - Stem/Root name - Primary Suffix - Secondary Suffix, with what each part tells. -->
  <circle cx="120.0" cy="225.0" r="100.0" stroke="#b59a00" stroke-width="2.5" fill="#fff6b8"/>
  <text x="120.0" y="234.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Prefix</tspan></text>
  <path d="M215.0 225.0 L253.4 161.0 L436.6 161.0 L475.0 225.0 L436.6 289.0 L253.4 289.0 Z" stroke="#2b7bb9" stroke-width="2.5" fill="#cfe8f7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="345.0" y="219.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Stem/Root</tspan></text>
  <text x="345.0" y="253.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">name</tspan></text>
  <path d="M470.0 225.0 L508.4 161.0 L721.6 161.0 L760.0 225.0 L721.6 289.0 L508.4 289.0 Z" stroke="#2b7bb9" stroke-width="2.5" fill="#cfe8f7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="615.0" y="211.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Primary Suffix</tspan></text>
  <text x="615.0" y="241.0" font-size="23" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">(Suffix of Stem/</tspan></text>
  <text x="615.0" y="267.0" font-size="23" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">root)</tspan></text>
  <circle cx="870.0" cy="225.0" r="112.0" stroke="#b59a00" stroke-width="2.5" fill="#fff6b8"/>
  <text x="870.0" y="185.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Secondary</tspan></text>
  <text x="870.0" y="215.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Suffix</tspan></text>
  <text x="870.0" y="245.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">(Suffix of</tspan></text>
  <text x="870.0" y="275.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">F.G.)</tspan></text>
  <line x1="120.0" y1="125.0" x2="120.0" y2="102.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M120.0 90.0 L126.8 104.5 L113.2 104.5 Z" fill="#14181f"/>
  <text x="30.0" y="40.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">substituent and its position</tspan></text>
  <text x="30.0" y="72.0" font-size="25" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">on the parent chain</tspan></text>
  <line x1="870.0" y1="113.0" x2="870.0" y2="82.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M870.0 70.0 L876.8 84.5 L863.2 84.5 Z" fill="#14181f"/>
  <text x="870.0" y="52.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">family name</tspan></text>
  <line x1="345.0" y1="289.0" x2="345.0" y2="322.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M345.0 335.0 L338.2 320.5 L351.8 320.5 Z" fill="#14181f"/>
  <text x="300.0" y="368.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">No. of carbon atoms</tspan></text>
  <text x="300.0" y="400.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">in the parent chain</tspan></text>
  <line x1="615.0" y1="289.0" x2="615.0" y2="322.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M615.0 335.0 L608.2 320.5 L621.8 320.5 Z" fill="#14181f"/>
  <text x="640.0" y="368.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">saturation or</tspan></text>
  <text x="640.0" y="400.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">unsaturation in the</tspan></text>
  <text x="640.0" y="432.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">parent chain (an, en, yn)</tspan></text>
</svg>
