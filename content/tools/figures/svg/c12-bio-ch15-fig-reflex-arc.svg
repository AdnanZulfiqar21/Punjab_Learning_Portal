<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 15.3: the knee-jerk reflex, receptor, sensory neuron, spinal cord, motor neuron to the quadriceps, and an inter-neuron that relaxes the hamstrings. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The knee-jerk reflex arc</text>
  <path d="M80 160 L470 150 L520 230 L470 300 L90 300 Z" stroke="#9a3412" stroke-width="2" fill="#fed7aa" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="325.0" font-size="14" fill="#4b5563" text-anchor="start" font-weight="700">thigh</text>
  <rect x="120.0" y="175.0" width="320.0" height="50.0" rx="22" stroke="#b91c1c" stroke-width="2" fill="#fecaca"/>
  <text x="260.0" y="206.0" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">quadriceps (effector)</text>
  <rect x="120.0" y="240.0" width="320.0" height="45.0" rx="20" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="260.0" y="268.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">hamstrings (relax)</text>
  <circle cx="520.0" cy="270.0" r="26.0" stroke="#14181f" stroke-width="2.5" fill="#f5f5f4"/>
  <text x="456.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="end" font-weight="700">knee</text>
  <path d="M500 290 L470 470 L500 470 L528 292" stroke="#9a3412" stroke-width="2" fill="#fed7aa" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="500.0" y="330.0" width="24.0" height="40.0" rx="4" stroke="#14181f" stroke-width="1.5" fill="#fef3c7"/>
  <text x="540.0" y="335.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">patellar tendon</text>
  <path d="M572 352 L642 372 L652 362 L587 338 Z" stroke="#4b5563" stroke-width="1.5" fill="#cbd5e1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="660.0" y="380.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">tap with a hammer (stimulus)</text>
  <line x1="505.0" y1="460.0" x2="575.3" y2="433.7" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M585.0 430.0 L575.9 439.3 L572.0 429.0 Z" fill="#d98b2b"/>
  <text x="600.0" y="452.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">lower leg kicks forward</text>
  <circle cx="640.0" cy="150.0" r="70.0" stroke="#4b5563" stroke-width="2.5" fill="#f8fafc"/>
  <path d="M610 110 Q632 140 610 190 M670 110 Q648 140 670 190 M626 150 L654 150" stroke="#4b5563" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="720.0" y="100.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">spinal cord</text>
  <path d="M300 190 C360 120 480 70 590 120" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="470.0" cy="96.0" r="10.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="470.0" y="76.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">sensory neuron</text>
  <circle cx="300.0" cy="192.0" r="6.0" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="240.0" y="120.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">receptor in the muscle</text>
  <line x1="270.0" y1="126.0" x2="296.0" y2="186.0" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <path d="M620 170 C600 230 420 210 360 205" stroke="#d7322f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M360.0 205.0 L371.3 200.9 L370.4 211.0 Z" fill="#d7322f"/>
  <text x="720.0" y="160.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">motor neuron to the</text>
  <text x="720.0" y="176.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">quadriceps: contracts</text>
  <circle cx="650.0" cy="180.0" r="7.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <path d="M650 186 Q560 200 440 262" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="720.0" y="210.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">inter-neuron inhibits</text>
  <text x="720.0" y="226.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">the hamstrings' motor</text>
  <text x="720.0" y="242.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">neuron: they relax</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
