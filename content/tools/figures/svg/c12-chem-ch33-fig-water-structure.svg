<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram for topic 33.1: a bent water molecule with partial charges hydrogen-bonded to three neighbours, and the properties that follow: thermal stability, solvent ability, amphoteric nature, dissolved oxygen and redox potential. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Water: a polar molecule and its properties</text>
  <rect x="15.0" y="55.0" width="430.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">polarity and hydrogen bonds</text>
  <line x1="220.0" y1="215.0" x2="263.5" y2="248.7" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="220.0" y1="215.0" x2="176.5" y2="248.7" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220.0" cy="215.0" r="24.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="220.0" y="220.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <circle cx="263.5" cy="248.7" r="13.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="263.5" y="252.7" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <circle cx="176.5" cy="248.7" r="13.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="176.5" y="252.7" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <line x1="273.8" y1="256.6" x2="292.7" y2="271.3" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="304.6" y1="280.5" x2="329.1" y2="248.9" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="304.6" y1="280.5" x2="329.1" y2="312.1" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="304.6" cy="280.5" r="15.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="304.6" y="285.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <circle cx="329.1" cy="248.9" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="329.1" y="252.9" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <circle cx="329.1" cy="312.1" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="329.1" y="316.1" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <line x1="166.2" y1="256.6" x2="147.3" y2="271.3" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="135.4" y1="280.5" x2="110.9" y2="312.1" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="135.4" y1="280.5" x2="110.9" y2="248.9" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="135.4" cy="280.5" r="15.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="135.4" y="285.5" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <circle cx="110.9" cy="312.1" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="110.9" y="316.1" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <circle cx="110.9" cy="248.9" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="110.9" y="252.9" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <line x1="220.0" y1="108.0" x2="220.0" y2="148.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <line x1="220.0" y1="108.0" x2="181.3" y2="98.0" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220.0" cy="108.0" r="15.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="220.0" y="113.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <circle cx="220.0" cy="148.0" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="220.0" y="152.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <circle cx="181.3" cy="98.0" r="10.0" stroke="#1f6fb5" stroke-width="1.8" fill="#bfdbfe"/>
  <text x="181.3" y="102.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <line x1="220.0" y1="158.0" x2="220.0" y2="191.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="262.0" y="205.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="268.0" y="238.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">&#948;+</text>
  <text x="172.0" y="238.0" font-size="14" fill="#1f6fb5" text-anchor="end" font-weight="700">&#948;+</text>
  <text x="230.0" y="370.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the O end is partly negative and the H ends</text>
  <text x="230.0" y="389.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">partly positive: water is a permanent dipole;</text>
  <text x="230.0" y="408.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">dashed lines: hydrogen bonds</text>
  <rect x="460.0" y="55.0" width="425.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">properties that follow</text>
  <text x="478.0" y="108.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">thermal stability</text>
  <text x="478.0" y="127.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">H-bonds: high specific heat capacity and</text>
  <text x="478.0" y="144.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">heat of vaporisation; slow temperature change</text>
  <text x="478.0" y="174.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">solvent</text>
  <text x="478.0" y="193.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">dissolves ions such as NO3- and PO4 3-, and</text>
  <text x="478.0" y="210.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">polar organic compounds (some pesticides)</text>
  <text x="478.0" y="240.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">amphoteric</text>
  <text x="478.0" y="259.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">acts as acid and base; Kw = 1.0 x 10^-14</text>
  <text x="478.0" y="276.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">at 25 C sets the pH scale</text>
  <text x="478.0" y="306.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">oxygen</text>
  <text x="478.0" y="325.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">DO, BOD and COD measure water quality</text>
  <text x="478.0" y="342.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">and organic pollution</text>
  <text x="478.0" y="372.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">redox potential</text>
  <text x="478.0" y="391.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">oxygenated: SO4 2- and CO2; oxygen-poor:</text>
  <text x="478.0" y="408.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">toxic H2S and NH3 form</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
