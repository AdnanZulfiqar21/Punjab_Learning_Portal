<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 12.11 (C11-BIO, PDF p269): back of a person (trunk, right shoulder and arm) with the spine showing; the lower (lumbar) part is boxed and glows red. At top right an enlarged pair of vertebrae shows a herniated (bulging) disc pressing on a nerve, which is inflamed (red). Labels as printed: Vertebra, Herniated disc, Pressed nerve, Lumbar vertebrae. Original flat drawing after the printed figure. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8202a"/><stop offset="0.6" stop-color="#f05040" stop-opacity="0.7"/><stop offset="1" stop-color="#f08060" stop-opacity="0"/></radialGradient>
    <radialGradient id="inf" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c81820"/><stop offset="1" stop-color="#e86050" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="780" fill="#ffffff"/>
  <g transform="scale(1.5)">
    <!-- back of the trunk and right arm -->
    <path d="M0 60 C40 40 80 30 110 25 C130 10 160 8 180 20 C220 40 270 60 300 100 C330 140 345 200 350 280 C355 360 345 440 330 520 L240 520 C235 450 230 400 220 350 C215 420 215 470 220 520 L0 520 Z" fill="#f2b89a"/>
    <path d="M300 100 C330 140 345 200 350 280 C355 360 345 440 330 520" stroke="#d8906a" stroke-width="3" fill="none"/>
    <path d="M220 350 C215 420 215 470 220 520" stroke="#d8906a" stroke-width="3" fill="none"/>
    <path d="M0 60 C40 40 80 30 110 25 C130 10 160 8 180 20 C220 40 270 60 300 100" stroke="#d8906a" stroke-width="3" fill="none"/>
    <path d="M255 120 C240 200 228 280 222 350" stroke="#e8a080" stroke-width="3" fill="none"/>
    <!-- spine -->
    <g fill="#f4e6c8" stroke="#c8b088" stroke-width="1.5">
      <rect x="115" y="40" width="34" height="14" rx="5"/><rect x="113" y="60" width="36" height="15" rx="5"/>
      <rect x="111" y="82" width="38" height="16" rx="5"/><rect x="109" y="105" width="40" height="17" rx="5"/>
      <rect x="107" y="130" width="42" height="18" rx="5"/><rect x="106" y="156" width="43" height="19" rx="5"/>
      <rect x="105" y="183" width="44" height="20" rx="5"/><rect x="104" y="211" width="45" height="21" rx="5"/>
      <rect x="104" y="240" width="46" height="22" rx="5"/><rect x="104" y="270" width="47" height="22" rx="5"/>
      <rect x="105" y="300" width="48" height="23" rx="5"/><rect x="106" y="331" width="50" height="24" rx="5"/>
      <rect x="108" y="363" width="52" height="25" rx="5"/><rect x="110" y="396" width="53" height="26" rx="5"/>
      <rect x="112" y="430" width="54" height="26" rx="5"/><path d="M108 466 L172 466 L160 515 L120 515 Z"/>
    </g>
    <g stroke="#c8b088" stroke-width="5" stroke-linecap="round">
      <path d="M100 136 L82 140 M100 160 L80 166 M100 188 L80 194 M100 216 L80 222 M100 245 L80 250 M100 274 L82 279"/>
      <path d="M154 136 L172 140 M154 160 L174 166 M154 188 L174 194 M154 216 L174 222 M154 245 L174 250 M154 274 L172 279"/>
    </g>
    <ellipse cx="136" cy="395" rx="42" ry="40" fill="url(#glow)"/>
    <rect x="92" y="318" width="86" height="126" fill="none" stroke="#555" stroke-width="2"/>
    <!-- enlarged vertebrae with herniated disc -->
    <path d="M440 20 C445 70 452 120 470 170 C485 210 492 260 496 320" stroke="#e8c84a" stroke-width="12" fill="none"/>
    <path d="M440 20 C445 70 452 120 470 170 C485 210 492 260 496 320" stroke="#b89a2a" stroke-width="2" fill="none"/>
    <path d="M470 60 L560 40 C590 40 600 70 585 85 L520 110 L560 140 C590 150 585 180 560 182 L475 170 Z" fill="#d8bfa0" stroke="#9a7a58" stroke-width="2"/>
    <path d="M478 215 L560 210 C590 212 600 240 580 255 L520 270 L555 295 C580 305 570 330 548 328 L480 300 Z" fill="#d8bfa0" stroke="#9a7a58" stroke-width="2"/>
    <ellipse cx="505" cy="200" rx="58" ry="62" fill="url(#inf)"/>
    <path d="M330 80 C330 65 360 58 400 58 C440 58 470 65 472 80 L470 175 C470 186 440 192 400 192 C360 192 332 186 330 175 Z" fill="#e2cfa8" stroke="#9a7a58" stroke-width="2.5"/>
    <ellipse cx="400" cy="74" rx="70" ry="15" fill="#efe2c4" stroke="#9a7a58" stroke-width="2"/>
    <path d="M332 192 C360 202 440 202 468 192 L490 196 C505 205 505 225 488 232 L468 230 C440 240 360 240 332 230 Z" fill="#4a7ac8" stroke="#1a3a7a" stroke-width="2.5"/>
    <path d="M466 196 C486 192 506 205 504 220 C502 236 482 238 466 232" fill="#3a62b0" stroke="#1a3a7a" stroke-width="2.5"/>
    <path d="M332 236 C360 244 440 244 468 236 L468 300 C440 310 360 310 332 300 Z" fill="#e2cfa8" stroke="#9a7a58" stroke-width="2.5"/>
    <path d="M490 200 C500 230 505 260 500 300" stroke="#c81820" stroke-width="4" fill="none"/>
    <path d="M318 78 L310 78 L310 188 L318 188" stroke="#444" stroke-width="2" fill="none"/>
    <!-- labels -->
    <g font-size="15" fill="#222">
      <text x="210" y="38">Vertebra</text>
      <text x="336" y="345">Herniated</text><text x="336" y="364">disc</text>
      <text x="478" y="380">Pressed</text><text x="478" y="399">nerve</text>
      <text x="360" y="478">Lumbar vertebrae</text>
    </g>
    <g stroke="#444" stroke-width="1.4">
      <line x1="250" y1="44" x2="310" y2="110"/>
      <line x1="370" y1="332" x2="484" y2="222"/>
      <line x1="492" y1="366" x2="496" y2="290"/>
      <line x1="356" y1="473" x2="178" y2="380"/>
    </g>
  </g>
</svg>
