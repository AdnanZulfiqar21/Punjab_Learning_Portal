<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.8 and Table 1.1: Pauling electronegativities of the main-group elements of periods 1 to 4 as printed, and the electron affinities of groups 1 and 17 as printed. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .e{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
      .v{font-size:14px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="400" y="36">Electronegativity (Pauling scale)</text>
  <defs>
    <linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#fff4e2"/><stop offset="1" stop-color="#f6b8ae"/></linearGradient>
  </defs>
  <!-- grid: columns groups 1,2,13,14,15,16,17 ; rows periods 1-4 -->
  <g fill="url(#gr)" stroke="#9ca3af" stroke-width="1.5">
    <rect x="80" y="70" width="80" height="60"/>
    <rect x="80" y="135" width="80" height="60"/><rect x="165" y="135" width="80" height="60"/><rect x="330" y="135" width="80" height="60"/><rect x="415" y="135" width="80" height="60"/><rect x="500" y="135" width="80" height="60"/><rect x="585" y="135" width="80" height="60"/><rect x="670" y="135" width="80" height="60"/>
    <rect x="80" y="200" width="80" height="60"/><rect x="165" y="200" width="80" height="60"/><rect x="330" y="200" width="80" height="60"/><rect x="415" y="200" width="80" height="60"/><rect x="500" y="200" width="80" height="60"/><rect x="585" y="200" width="80" height="60"/><rect x="670" y="200" width="80" height="60"/>
    <rect x="80" y="265" width="80" height="60"/><rect x="165" y="265" width="80" height="60"/><rect x="670" y="265" width="80" height="60"/>
    <rect x="80" y="330" width="80" height="60"/><rect x="165" y="330" width="80" height="60"/><rect x="670" y="330" width="80" height="60"/>
  </g>
  <g class="e">
    <text x="120" y="95">H</text>
    <text x="120" y="160">Li</text><text x="205" y="160">Be</text><text x="370" y="160">B</text><text x="455" y="160">C</text><text x="540" y="160">N</text><text x="625" y="160">O</text><text x="710" y="160">F</text>
    <text x="120" y="225">Na</text><text x="205" y="225">Mg</text><text x="370" y="225">Al</text><text x="455" y="225">Si</text><text x="540" y="225">P</text><text x="625" y="225">S</text><text x="710" y="225">Cl</text>
    <text x="120" y="290">K</text><text x="205" y="290">Ca</text><text x="710" y="290">Br</text>
    <text x="120" y="355">Rb</text><text x="205" y="355">Sr</text><text x="710" y="355">I</text>
  </g>
  <g class="v">
    <text x="120" y="118">2.1</text>
    <text x="120" y="183">1.0</text><text x="205" y="183">1.5</text><text x="370" y="183">2.0</text><text x="455" y="183">2.5</text><text x="540" y="183">3.0</text><text x="625" y="183">3.5</text><text x="710" y="183">4.0</text>
    <text x="120" y="248">0.9</text><text x="205" y="248">1.2</text><text x="370" y="248">1.5</text><text x="455" y="248">1.8</text><text x="540" y="248">2.1</text><text x="625" y="248">2.5</text><text x="710" y="248">3.0</text>
    <text x="120" y="313">0.8</text><text x="205" y="313">1.0</text><text x="710" y="313">2.8</text>
    <text x="120" y="378">0.8</text><text x="205" y="378">1.0</text><text x="710" y="378">2.5</text>
  </g>
  <path d="M80 415 H750" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/><text class="s" x="415" y="440">increases across a period (more nuclear charge, smaller atom)</text>
  <path d="M40 390 V140" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/><text class="s" x="30" y="265" transform="rotate(-90 30 265)">increases up a group</text>
  <text class="s" x="400" y="480">the power of an atom to attract the shared pair of electrons in a molecule;</text>
  <text class="s" x="400" y="502">just under 1 for alkali metals, 4 for fluorine; metals on the left are</text>
  <text class="s" x="400" y="524">electropositive, non-metals on the right electronegative</text>
  <!-- electron affinity table -->
  <text class="h" x="990" y="36">Electron affinity, kJ per mol</text>
  <g font-size="15" fill="#4b5563">
    <text x="830" y="80" font-weight="700" fill="#14181f">Group 17</text><text x="1020" y="80" font-weight="700" fill="#14181f">Group 1</text>
    <text x="830" y="106">Fluorine -328.0</text><text x="1020" y="106">Lithium -60.0</text>
    <text x="830" y="130">Chlorine -349.0</text><text x="1020" y="130">Sodium -53.0</text>
    <text x="830" y="154">Bromine -324.0</text><text x="1020" y="154">Potassium -48.0</text>
    <text x="830" y="178">Iodine -295.0</text><text x="1020" y="178">Rubidium -47.0</text>
    <text x="830" y="202">Astatine -270.1</text><text x="1020" y="202">Cesium -46.0</text>
  </g>
  <path d="M810 70 V215" stroke="#9ca3af" stroke-width="2"/><path d="M1000 70 V215" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="15" fill="#4b5563">
    <text x="830" y="250">enthalpy change when 1 mol of gaseous atoms gains</text><text x="830" y="272">1 mol of electrons; energy released, so the first</text><text x="830" y="294">value is negative (Cl: -348.8 kJ/mol)</text>
    <text x="830" y="330">a second electron must be forced onto a negative ion:</text><text x="830" y="352">O to O- releases 141 kJ/mol, O- to O2- absorbs 798,</text><text x="830" y="374">so O to O2- costs +657 kJ/mol in all</text>
    <text x="830" y="410">more negative across a period (more nuclear charge,</text><text x="830" y="432">smaller atom); less negative down a group (bigger</text><text x="830" y="454">atom); fluorine is lower than chlorine because its</text><text x="830" y="476">tiny 2p shell repels the incoming electron</text>
    <text x="830" y="512">half-filled np3 (N, P) and full ns2 np6 (noble gases)</text><text x="830" y="534">resist an extra electron: low or positive values</text>
  </g>
  <text class="s" x="600" y="600">Values as printed in the textbook (Figure 1.8; the table is Table 1.1).</text>
</svg>
