<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram for topic 25.3: retrosynthesis of paracetamol (amide C-N disconnection to 4-aminophenol and ethanoyl chloride, FGI to 4-nitrophenol, C-N disconnection to phenol and nitric acid) and the forward synthesis phenol, 4-nitrophenol, 4-aminophenol, paracetamol. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Retrosynthesis and synthesis of paracetamol</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">retrosynthesis (working back from the target)</text>
  <text x="40.0" y="110.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">1 disconnection (amide C-N)</text>
  <text x="580.0" y="110.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NHCOCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> =&gt; HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NH</tspan><tspan dy="-5.9" font-size="9.8">-</tspan><tspan dy="5.9"> + CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CO</tspan><tspan dy="-5.9" font-size="9.8">+</tspan></text>
  <text x="40.0" y="150.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">2 synthetic equivalents</text>
  <text x="580.0" y="150.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">4-aminophenol, HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">, and ethanoyl chloride, CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COCl</tspan></text>
  <text x="40.0" y="190.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">3 FGI</text>
  <text x="580.0" y="190.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> =&gt; HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> (4-nitrophenol)</tspan></text>
  <text x="40.0" y="230.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">4 disconnection (C-N)</text>
  <text x="580.0" y="230.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">-NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> =&gt; HO-C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-10.4" font-size="9.8">-</tspan><tspan dy="5.9"> + NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-10.4" font-size="9.8">+</tspan></text>
  <text x="40.0" y="270.0" font-size="13" fill="#db2777" text-anchor="start" font-weight="700">5 synthetic equivalents</text>
  <text x="580.0" y="270.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">phenol, C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">OH, and nitric acid, HNO</tspan><tspan dy="4.5" font-size="9.8">3</tspan></text>
  <rect x="15.0" y="315.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="345.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">synthesis (forward)</text>
  <path d="M144.0 425.0 L132.0 445.8 L108.0 445.8 L96.0 425.0 L108.0 404.2 L132.0 404.2 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="120.0" cy="425.0" r="13.9" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="96.0" y1="425.0" x2="82.8" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="78.8" y="429.9" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <text x="120.0" y="475.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">phenol</text>
  <line x1="165.0" y1="425.0" x2="231.2" y2="425.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M240.0 425.0 L230.0 429.6 L230.0 420.4 Z" fill="#14181f"/>
  <text x="202.5" y="415.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HNO</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="202.5" y="447.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">SO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <path d="M339.0 425.0 L327.0 445.8 L303.0 445.8 L291.0 425.0 L303.0 404.2 L327.0 404.2 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="315.0" cy="425.0" r="13.9" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="291.0" y1="425.0" x2="277.8" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="273.8" y="429.9" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <line x1="339.0" y1="425.0" x2="352.2" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="356.2" y="429.9" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="315.0" y="475.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">4-nitrophenol</text>
  <line x1="385.0" y1="425.0" x2="451.2" y2="425.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M460.0 425.0 L450.0 429.6 L450.0 420.4 Z" fill="#14181f"/>
  <text x="422.5" y="415.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Sn + HCl</tspan></text>
  <path d="M554.0 425.0 L542.0 445.8 L518.0 445.8 L506.0 425.0 L518.0 404.2 L542.0 404.2 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="530.0" cy="425.0" r="13.9" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="506.0" y1="425.0" x2="492.8" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="488.8" y="429.9" font-size="14" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <line x1="554.0" y1="425.0" x2="567.2" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="571.2" y="429.9" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="530.0" y="475.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">4-aminophenol</text>
  <line x1="600.0" y1="425.0" x2="666.2" y2="425.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M675.0 425.0 L665.0 429.6 L665.0 420.4 Z" fill="#14181f"/>
  <text x="637.5" y="415.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">COCl</tspan></text>
  <path d="M769.0 425.0 L757.0 445.8 L733.0 445.8 L721.0 425.0 L733.0 404.2 L757.0 404.2 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="745.0" cy="425.0" r="13.9" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="721.0" y1="425.0" x2="707.8" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="703.8" y="429.6" font-size="13" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <line x1="769.0" y1="425.0" x2="782.2" y2="425.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="786.2" y="429.6" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">NHCOCH</tspan><tspan dy="4.2" font-size="9.1">3</tspan></text>
  <text x="760.0" y="475.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">paracetamol (TM)</text>
  <text x="450.0" y="545.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">nitration of phenol also gives 2-nitrophenol, which is separated off</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
