<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 10.9: haemoglobin with four chains and four haem groups, and myoglobin with one chain and one haem. Schematic, not a rendering. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="330" y="40">Haemoglobin (in red blood cells)</text>
  <!-- four chains as blobs -->
  <path d="M200 120 q90 -50 150 20 q10 70 -60 90 q-100 10 -110 -60 q0 -40 20 -50 z" fill="#d7322f" opacity="0.85"/>
  <path d="M370 120 q90 -50 150 20 q10 70 -60 90 q-100 10 -110 -60 q0 -40 20 -50 z" fill="#8a1c1a" opacity="0.85"/>
  <path d="M200 260 q90 -50 150 20 q10 70 -60 90 q-100 10 -110 -60 q0 -40 20 -50 z" fill="#8a1c1a" opacity="0.85"/>
  <path d="M370 260 q90 -50 150 20 q10 70 -60 90 q-100 10 -110 -60 q0 -40 20 -50 z" fill="#d7322f" opacity="0.85"/>
  <text class="b" x="265" y="160">alpha chain</text><text class="b" x="265" y="182" style="font-size:14px">141 amino acids</text>
  <text class="b" x="435" y="160">beta chain</text><text class="b" x="435" y="182" style="font-size:14px">146 amino acids</text>
  <text class="b" x="265" y="300">beta chain</text><text class="b" x="435" y="300">alpha chain</text>
  <!-- haem groups: squares with Fe -->
  <g fill="#f2b134" stroke="#8a4b00" stroke-width="2">
    <rect x="300" y="195" width="34" height="34" rx="4"/><rect x="470" y="195" width="34" height="34" rx="4"/><rect x="300" y="335" width="34" height="34" rx="4"/><rect x="470" y="335" width="34" height="34" rx="4"/>
  </g>
  <g font-size="13" font-weight="700" fill="#14181f" text-anchor="middle"><text x="317" y="217">Fe</text><text x="487" y="217">Fe</text><text x="317" y="357">Fe</text><text x="487" y="357">Fe</text></g>
  <text class="s" x="330" y="420">four globin chains (two alpha, two beta), each folded with a pocket</text><text class="s" x="330" y="442">holding one haem group: an iron ion in a porphyrin ring</text>
  <text class="s" x="330" y="480">the iron binds one O2 at high PO2, so one molecule carries up to four O2;</text><text class="s" x="330" y="502">the chains are held together by salt bridges,</text><text class="s" x="330" y="524">hydrogen bonds and the hydrophobic effect</text>
  <!-- myoglobin -->
  <text class="h" x="900" y="40">Myoglobin (in muscle cells)</text>
  <path d="M820 150 q110 -70 190 20 q20 90 -70 120 q-130 10 -150 -70 q0 -50 30 -70 z" fill="#8a4b00" opacity="0.9"/>
  <text class="b" x="905" y="200">one chain</text><text class="b" x="905" y="222" style="font-size:14px">153 amino acids</text>
  <rect x="945" y="235" width="34" height="34" rx="4" fill="#f2b134" stroke="#8a4b00" stroke-width="2"/><text x="962" y="257" font-size="13" font-weight="700" fill="#14181f" text-anchor="middle">Fe</text>
  <text class="s" x="900" y="340">a monomer with a single haem group, so it binds one O2</text>
  <text class="s" x="900" y="380">binds oxygen more tightly than haemoglobin, so it stores</text><text class="s" x="900" y="402">oxygen in skeletal and cardiac muscle and releases it only</text><text class="s" x="900" y="424">when the PO2 falls below 20 mm Hg (haemoglobin: 60 mm Hg)</text>
  <text class="s" x="900" y="464">gives muscle its red or dark grey colour</text>
  <text class="s" x="600" y="560">Respiratory pigments are proteins of blood or tissue that transport oxygen, and also store O2,</text><text class="s" x="600" y="582">carry CO2 and transport other substances. Haem groups are drawn as orange squares.</text>
</svg>
