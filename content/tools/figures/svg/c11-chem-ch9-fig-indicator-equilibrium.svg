<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- Original redraw after the printed second Figure 9.1: an indicator HIn is in equilibrium with H+ and In-; base pulls it to In-, acid pushes it back to HIn. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">An indicator is a weak acid: HIn = H+ + In-</text>
  <circle cx="170.0" cy="170.0" r="62.0" stroke="#4b5563" stroke-width="3" fill="#e5e7eb"/>
  <text x="170.0" y="180.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">HIn</text>
  <text x="170.0" y="270.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">acid colour</text>
  <line x1="270.0" y1="150.0" x2="489.6" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500.0 150.0 L488.2 155.5 L488.2 144.5 Z" fill="#14181f"/>
  <line x1="500.0" y1="192.0" x2="280.4" y2="192.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M270.0 192.0 L281.8 186.5 L281.8 197.5 Z" fill="#14181f"/>
  <text x="385.0" y="135.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700">in basic solution</text>
  <text x="385.0" y="222.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">in acidic solution</text>
  <circle cx="570.0" cy="170.0" r="26.0" stroke="#1f6fb5" stroke-width="2.5" fill="#bfdbfe"/>
  <text x="570.0" y="178.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">H+</text>
  <text x="630.0" y="180.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <circle cx="730.0" cy="170.0" r="62.0" stroke="#7c3aed" stroke-width="3" fill="#f5d0fe"/>
  <text x="730.0" y="180.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">In-</text>
  <text x="730.0" y="270.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700">base colour</text>
  <text x="450.0" y="320.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">OH- removes H+ and pulls the equilibrium right; added H+ pushes it left</text>
  <text x="450.0" y="351" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
