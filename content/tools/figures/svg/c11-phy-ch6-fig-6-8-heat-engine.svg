<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 6.8 (PDF page 129; printed with the number 'Fig. 6.10'), original drawing after the printed schematic: heat Q1 flows from the hot reservoir at T1 into the heat engine, which gives output work W and rejects heat Q2 to the cold reservoir at T2. -->
  <defs><linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a7a"/><stop offset="1" stop-color="#f0442c"/></linearGradient><linearGradient id="cold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cdf5"/><stop offset="1" stop-color="#5b9be0"/></linearGradient><linearGradient id="work" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9a3a"/><stop offset="0.5" stop-color="#cfe8b8"/><stop offset="1" stop-color="#3d7f2c"/></linearGradient></defs>
  <rect width="1000" height="900" fill="#ffffff"/>
  <rect x="220.0" y="30.0" width="420.0" height="130.0" rx="0" stroke="#c23a22" stroke-width="3" fill="url(#hot)"/>
  <text x="430.0" y="85.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Hot reservoir</text>
  <text x="430.0" y="130.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">T</tspan><tspan dy="10.9" font-size="23.1">1</tspan><tspan dy="-10.9">​</tspan></text>
  <path d="M330 160 L530 160 L530 240 L580 240 L430 330 L280 240 L330 240 Z" fill="url(#hot)" stroke="#c23a22" stroke-width="3"/>
  <text x="430.0" y="215.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">Q</tspan><tspan dy="10.9" font-size="23.1">1</tspan><tspan dy="-10.9">​</tspan></text>
  <rect x="400.0" y="480.0" width="60.0" height="230.0" rx="0" stroke="#2c64a8" stroke-width="3" fill="#5b9be0"/>
  <text x="384.0" y="640.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">Q</tspan><tspan dy="10.9" font-size="23.1">2</tspan><tspan dy="-10.9">​</tspan></text>
  <rect x="220.0" y="710.0" width="420.0" height="130.0" rx="0" stroke="#2c64a8" stroke-width="3" fill="url(#cold)"/>
  <text x="430.0" y="765.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Cold reservoir</text>
  <text x="430.0" y="810.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">T</tspan><tspan dy="10.9" font-size="23.1">2</tspan><tspan dy="-10.9">​</tspan></text>
  <path d="M500 400 L760 400 L760 520 L500 520 Z" fill="url(#work)" stroke="#2f6b22" stroke-width="3"/>
  <path d="M760 430 C 900 430 900 640 760 640" fill="none" stroke="#2f6b22" stroke-width="46"/>
  <path d="M760 430 C 900 430 900 640 760 640" fill="none" stroke="#7cbc5c" stroke-width="40"/>
  <path d="M770 590 L770 690 L690 640 Z" fill="#7cbc5c" stroke="#2f6b22" stroke-width="3"/>
  <text x="640.0" y="450.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">Output</text>
  <text x="640.0" y="492.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">Work = <tspan font-style="italic">W</tspan></text>
  <path d="M430.0 270.0 L458.5 313.7 L505.0 290.1 L507.8 342.2 L559.9 345.0 L536.3 391.5 L580.0 420.0 L536.3 448.5 L559.9 495.0 L507.8 497.8 L505.0 549.9 L458.5 526.3 L430.0 570.0 L401.5 526.3 L355.0 549.9 L352.2 497.8 L300.1 495.0 L323.7 448.5 L280.0 420.0 L323.7 391.5 L300.1 345.0 L352.2 342.2 L355.0 290.1 L401.5 313.7 Z" stroke="#c4560f" stroke-width="3" fill="#f7922e" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="430.0" y="410.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Heat</text>
  <text x="430.0" y="452.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">engine</text>
