<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 2.2 (a) (C11-PHY, PDF p25): A and B brought to a common origin at angle theta; a dashed line drops from the tip of B to A, and B cos theta marks the projection of B on A. Printed on its own beside the definition of the scalar product. Original drawing after the printed figure. -->
  <rect width="480" height="440" fill="#ffffff"/>
  <line x1="248.0" y1="64.7" x2="248.0" y2="370.0" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10"/>
  <line x1="30.0" y1="370.0" x2="413.0" y2="370.0" stroke="#1d9fe0" stroke-width="6" stroke-linecap="butt"/>
  <path d="M440.0 370.0 L410.0 386.0 L410.0 354.0 Z" fill="#1d9fe0"/>
  <line x1="30.0" y1="370.0" x2="232.5" y2="80.8" stroke="#e0197d" stroke-width="5" stroke-linecap="butt"/>
  <path d="M248.0 58.7 L243.9 92.5 L217.6 74.1 Z" fill="#e0197d"/>
  <path d="M72.0 370.0 A42.0 42.0 0 0 0 54.1 335.6" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="86.0" y="356.0" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="400">θ</text>
  <text x="238.0" y="356.0" font-size="28" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">B</tspan> cos θ</text>
  <text x="440.0" y="410.0" font-size="32" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-weight="700">A</tspan></text>
  <text x="238.0" y="48.7" font-size="32" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-weight="700">B</tspan></text>
</svg>
