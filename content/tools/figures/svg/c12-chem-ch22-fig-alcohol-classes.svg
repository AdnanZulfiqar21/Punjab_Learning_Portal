<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="575" fill="#ffffff"/>
  <!-- Original diagram for topic 22.1: monohydric (ethanol, propan-1-ol), dihydric (glycol) and trihydric (glycerol) alcohols; primary RCH2OH, secondary R2CHOH and tertiary R3COH alcohols. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Classifying alcohols</text>
  <rect x="15.0" y="55.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">by the number of OH groups</text>
  <text x="120.0" y="160.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <text x="120.0" y="192.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">ethanol</text>
  <text x="120.0" y="214.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">monohydric</text>
  <text x="340.0" y="160.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <text x="340.0" y="192.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">propan-1-ol</text>
  <text x="340.0" y="214.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">monohydric</text>
  <text x="560.0" y="160.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOCH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">-CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <text x="560.0" y="192.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">ethane-1,2-diol (glycol)</text>
  <text x="560.0" y="214.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">dihydric</text>
  <text x="780.0" y="160.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOCH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">-CHOH-CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <text x="780.0" y="192.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">propane-1,2,3-triol (glycerol)</text>
  <text x="780.0" y="214.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">trihydric</text>
  <rect x="15.0" y="270.0" width="870.0" height="265.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="300.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">by the carbon carrying OH: joined to 1, 2 or 3 other C</text>
  <line x1="160.0" y1="374.0" x2="160.0" y2="352.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="338.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="171.0" y1="385.0" x2="193.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="219.0" y="390.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="160.0" y1="396.0" x2="160.0" y2="418.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="160.0" y="442.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="149.0" y1="385.0" x2="127.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="105.5" y="390.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="160.0" y="390.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="160.0" y="470.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">primary (1)</text>
  <text x="160.0" y="494.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">RCH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">OH</tspan></text>
  <text x="160.0" y="514.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">e.g. ethanol</text>
  <line x1="450.0" y1="374.0" x2="450.0" y2="352.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="338.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="461.0" y1="385.0" x2="483.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="509.0" y="390.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="450.0" y1="396.0" x2="450.0" y2="418.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="442.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="439.0" y1="385.0" x2="417.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="395.5" y="390.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="450.0" y="390.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="450.0" y="470.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">secondary (2)</text>
  <text x="450.0" y="494.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CHOH</tspan></text>
  <text x="450.0" y="514.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">e.g. propan-2-ol</text>
  <line x1="740.0" y1="374.0" x2="740.0" y2="352.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="740.0" y="338.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="751.0" y1="385.0" x2="773.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="799.0" y="390.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="740.0" y1="396.0" x2="740.0" y2="418.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="740.0" y="442.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="729.0" y1="385.0" x2="707.0" y2="385.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="685.5" y="390.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="740.0" y="390.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="740.0" y="470.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">tertiary (3)</text>
  <text x="740.0" y="494.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COH</tspan></text>
  <text x="740.0" y="514.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">e.g. 2-methylpropan-2-ol</text>
  <text x="450.0" y="566" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
