<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="740" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.22: C-3 photosynthesis against C-4 photosynthesis. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .o{font-size:20px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="280" y="40">C-3 photosynthesis</text>
  <rect x="60" y="80" width="440" height="560" rx="30" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5"/><text class="o" x="280" y="120">Mesophyll cell</text>
  <rect x="100" y="170" width="110" height="46" rx="10" fill="#9ca3af"/><text class="b" x="155" y="200" style="fill:#fff">CO2</text>
  <path d="M215 193 H270" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="275" y="170" width="150" height="46" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="350" y="200">RuBP (5C)</text>
  <circle cx="280" cy="400" r="110" fill="#fff" stroke="#d98b2b" stroke-width="6" stroke-dasharray="20 10"/><text class="o" x="280" y="395">Calvin</text><text class="o" x="280" y="420">cycle</text>
  <path d="M350 220 L320 290" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M280 515 V560" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="220" y="565" width="120" height="46" rx="10" fill="#d98b2b"/><text class="b" x="280" y="595" style="fill:#fff">Sugar</text>
  <text class="s" x="280" y="660">rubisco fixes CO2 directly; photorespiration</text><text class="s" x="280" y="684">when CO2 is low and O2 is high</text>
  <!-- C4 -->
  <text class="h" x="880" y="40">C-4 photosynthesis</text>
  <rect x="560" y="80" width="300" height="560" rx="30" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5"/><text class="o" x="710" y="120">Mesophyll cell</text>
  <rect x="880" y="80" width="280" height="560" rx="30" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/><text class="o" x="1020" y="120">Bundle-sheath cell</text>
  <rect x="590" y="170" width="100" height="46" rx="10" fill="#9ca3af"/><text class="b" x="640" y="200" style="fill:#fff">CO2</text>
  <path d="M640 220 V270" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="590" y="275" width="230" height="60" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="705" y="300">PEP (3C) + CO2</text><text class="s" x="705" y="322">phosphoenol pyruvic acid</text>
  <path d="M705 340 V380" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="590" y="385" width="230" height="46" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="705" y="414">Oxaloacetic acid (4C)</text>
  <path d="M705 435 V475" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="770" y="462">NADH</text>
  <rect x="590" y="480" width="230" height="46" rx="10" fill="#fff" stroke="#0f7a62" stroke-width="3"/><text class="b" x="705" y="509">Malic acid (4C)</text>
  <path d="M825 503 H900" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="905" y="480" width="230" height="46" rx="10" fill="#fff" stroke="#d98b2b" stroke-width="3"/><text class="b" x="1020" y="509">Malic acid to pyruvic + CO2</text>
  <circle cx="1020" cy="320" r="90" fill="#fff" stroke="#d98b2b" stroke-width="6" stroke-dasharray="20 10"/><text class="o" x="1020" y="315">Calvin</text><text class="o" x="1020" y="340">cycle</text>
  <path d="M1020 475 V415" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="1100" y="450">CO2 high</text>
  <path d="M1020 230 V200" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="960" y="150" width="120" height="46" rx="10" fill="#d98b2b"/><text class="b" x="1020" y="180" style="fill:#fff">Sugar</text>
  <path d="M905 540 q-150 60 -200 20 L640 530" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-dasharray="8 6"/>
  <text class="s" x="760" y="600">pyruvic acid returns; ATP remakes PEP</text>
  <text class="s" x="860" y="660">corn, sugarcane, sorghum: CO2 is pumped into bundle-sheath</text><text class="s" x="860" y="684">cells, so rubisco meets high CO2 and skips photorespiration</text>
  <text class="s" x="600" y="722">CAM plants (cacti, pineapple) open stomata at night, store CO2 in organic acids and run the Calvin cycle by day with stomata shut.</text>
</svg>
