<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 6.2 (PDF page 123), original drawing after the printed graph: Charles' law, volume V against temperature T at constant pressure, a straight line that meets the temperature axis at -273 °C. -->
  <rect width="900" height="640" fill="#ffffff"/>
  <line x1="60.0" y1="540.0" x2="840.8" y2="540.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M860.0 540.0 L836.0 550.1 L836.0 529.9 Z" fill="#1a1a1a"/>
  <line x1="360.0" y1="580.0" x2="360.0" y2="59.2" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M360.0 40.0 L370.1 64.0 L349.9 64.0 Z" fill="#1a1a1a"/>
  <line x1="190.0" y1="540.0" x2="780.0" y2="70.0" stroke="#e0197d" stroke-width="5" stroke-linecap="round"/>
  <text x="334.0" y="110.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">V</tspan></text>
  <text x="190.0" y="590.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">−273 °C</text>
  <text x="780.0" y="590.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">T</tspan></text>
</svg>
