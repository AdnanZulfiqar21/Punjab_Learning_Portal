<line x1="204.8" y1="84.1" x2="800.0" y2="242.0" stroke="#00AEEF" stroke-width="5" stroke-linecap="round"/>
<line x1="777.2" y1="79.3" x2="172.0" y2="242.0" stroke="#231F20" stroke-width="5" stroke-linecap="round"/>
