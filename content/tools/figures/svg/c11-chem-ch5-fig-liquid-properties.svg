<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.8 and 5.9 and Tables 5.3 and 5.4: surface tension, viscosity, evaporation-condensation equilibrium, and vapour pressure against temperature with the normal boiling points. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Surface tension, viscosity, vapour pressure and boiling point</text>
  <!-- surface tension -->
  <text class="k" x="170" y="72">Surface tension</text>
  <rect x="70" y="90" width="200" height="110" fill="#dbe9f5" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#1f6fb5"><circle cx="100" cy="100" r="6"/><circle cx="140" cy="100" r="6"/><circle cx="180" cy="100" r="6"/><circle cx="220" cy="100" r="6"/><circle cx="120" cy="150" r="6"/><circle cx="170" cy="150" r="6"/><circle cx="220" cy="150" r="6"/></g>
  <g stroke="#d7322f" stroke-width="2"><path d="M140 106 V130" marker-end="url(#a)"/><path d="M180 106 V130" marker-end="url(#a)"/></g>
  <g stroke="#9ca3af" stroke-width="1.5"><path d="M170 144 L130 150 M170 144 L210 150 M170 144 L160 175 M170 144 L185 175"/></g>
  <text class="s" x="170" y="222">surface molecules are pulled inward only;</text><text class="s" x="170" y="240">the surface acts like a stretched skin</text>
  <g class="t">
    <text x="60" y="270">drops are spheres (least surface); capillary action,</text>
    <text x="60" y="288">wetting, bubbles; a mosquito stands on water</text>
    <text x="60" y="306">falls as temperature rises; rises with stronger forces</text>
    <text x="60" y="334" style="font-weight:700;fill:#14181f">Table 5.3 at 20 degrees C (10^-3 N/m)</text>
    <text x="60" y="354">water 72.75; benzene 28.85; CCl4 26.95;</text>
    <text x="60" y="372">acetone 23.70; ethanol 22.75; methanol 22.61</text>
  </g>
  <!-- viscosity -->
  <text class="k" x="470" y="72">Viscosity</text>
  <rect x="380" y="90" width="180" height="110" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g stroke="#1f6fb5" stroke-width="3"><path d="M390 105 H400"/><path d="M390 125 H430"/><path d="M390 145 H460"/><path d="M390 165 H430"/><path d="M390 185 H400"/></g>
  <text class="s" x="470" y="222">layers slide past each other;</text><text class="s" x="470" y="240">the wall layer stops first, the centre last</text>
  <g class="t">
    <text x="380" y="270">resistance to flow: friction between layers</text>
    <text x="380" y="288">SI unit kg per m per s; CGS unit poise</text>
    <text x="380" y="306">falls as temperature rises (more kinetic energy)</text>
    <text x="380" y="324">rises with stronger intermolecular forces</text>
    <text x="380" y="342">water, glycerine, honey: high (hydrogen bonds)</text>
    <text x="380" y="360">hexane, ethanol: lower</text>
  </g>
  <!-- evaporation equilibrium -->
  <text class="k" x="870" y="72">Evaporation and condensation in a closed vessel</text>
  <g>
    <rect x="700" y="90" width="90" height="110" fill="none" stroke="#4b5563" stroke-width="2"/><rect x="702" y="150" width="86" height="48" fill="#dbe9f5"/>
    <text class="s" x="745" y="125">vacuum</text><text class="s" x="745" y="222">(a) start</text>
    <rect x="820" y="90" width="90" height="110" fill="none" stroke="#4b5563" stroke-width="2"/><rect x="822" y="150" width="86" height="48" fill="#dbe9f5"/>
    <g fill="#1f6fb5"><circle cx="840" cy="110" r="3"/><circle cx="880" cy="130" r="3"/><circle cx="860" cy="100" r="3"/></g>
    <text class="s" x="865" y="222">(b) building</text>
    <rect x="940" y="90" width="90" height="110" fill="none" stroke="#4b5563" stroke-width="2"/><rect x="942" y="150" width="86" height="48" fill="#dbe9f5"/>
    <g fill="#1f6fb5"><circle cx="955" cy="105" r="3"/><circle cx="975" cy="125" r="3"/><circle cx="1000" cy="100" r="3"/><circle cx="1015" cy="135" r="3"/><circle cx="985" cy="140" r="3"/><circle cx="1010" cy="112" r="3"/></g>
    <path d="M960 148 V118" stroke="#d7322f" stroke-width="2" marker-end="url(#a)"/><path d="M1012 118 V148" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
    <text class="s" x="985" y="222">(c) equilibrium</text>
  </g>
  <g class="t">
    <text x="700" y="252">rate of evaporation = rate of condensation: the vapour's pressure</text>
    <text x="700" y="270">is the vapour pressure; it depends on temperature and the liquid,</text>
    <text x="700" y="288">not on the amount of liquid, the vessel's volume or the surface area</text>
    <text x="700" y="316">evaporation cools: the fastest molecules leave and take energy with them</text>
    <text x="700" y="334">(a wet body in a breeze; porous earthenware keeps water cool)</text>
  </g>
  <!-- vapour pressure curves -->
  <path d="M60 400 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="k" x="400" y="428">Vapour pressure against temperature (Figure 5.9)</text>
  <path d="M100 630 V450 M100 630 H700" stroke="#4b5563" stroke-width="2"/>
  <path d="M100 486 H700" stroke="#d7322f" stroke-width="1.5" stroke-dasharray="6 4"/><text class="t" x="705" y="490" style="fill:#d7322f">760 torr</text>
  <text class="t" x="80" y="455" text-anchor="end">800</text><text class="t" x="80" y="634" text-anchor="end">0</text>
  <g class="s"><text x="100" y="650">0</text><text x="220" y="650">20</text><text x="340" y="650">40</text><text x="460" y="650">60</text><text x="580" y="650">80</text><text x="700" y="650">100</text></g>
  <text class="s" x="400" y="612" style="font-size:11px">temperature, degrees C</text>
  <g fill="none" stroke-width="2.5">
    <path d="M100 600 Q220 560 308 486" stroke="#d98b2b"/>
    <path d="M100 622 Q450 600 570 486" stroke="#5b3fb5"/>
    <path d="M100 627 Q560 615 700 486" stroke="#1f6fb5"/>
    <path d="M100 630 Q600 629 700 622" stroke="#0f7a62"/>
  </g>
  <g class="t"><text x="150" y="560" style="fill:#d98b2b">diethyl ether 34.6</text><text x="430" y="560" style="fill:#5b3fb5">ethanol 78.3</text><text x="590" y="545" style="fill:#1f6fb5">water 100</text><text x="560" y="612" style="fill:#0f7a62">ethylene glycol</text></g>
  <g class="t">
    <text x="760" y="440" style="font-weight:700;fill:#14181f">Boiling point</text>
    <text x="760" y="462">a liquid boils when its vapour pressure equals the</text>
    <text x="760" y="480">external pressure: bubbles form inside and escape;</text>
    <text x="760" y="498">normal boiling point at 760 torr (1 atm)</text>
    <text x="760" y="526" style="font-weight:700;fill:#14181f">Stronger forces: lower vapour pressure, higher b.p.</text>
    <text x="760" y="546">water 100, ethanol 78.3, acetone 56.0, CS2 46.3,</text>
    <text x="760" y="564">acetic acid 118.5, benzene 80.15, naphthalene 218 (degrees C)</text>
    <text x="760" y="592" style="font-weight:700;fill:#14181f">External pressure changes the b.p.</text>
    <text x="760" y="612">water: 120 at 1489 torr, 98 at Murree (700 torr),</text>
    <text x="760" y="630">69 on Everest (323 torr), 25 at 23.7 torr; pressure cooker</text>
  </g>
</svg>
