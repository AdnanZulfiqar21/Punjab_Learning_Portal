<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="590" fill="#ffffff"/>
  <!-- Original summary after the book's examples: bromoethane gives ethanol with aqueous NaOH, ethene with ethanolic NaOH, propanenitrile with KCN in ethanol, ethylamine with ammonia under pressure, and a cream AgBr precipitate with aqueous silver nitrate. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reactions of bromoethane</text>
  <rect x="350.0" y="252.0" width="200.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="450.0" y="287.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">Br</tspan></text>
  <rect x="35.0" y="65.0" width="270.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="170.0" y="93.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaOH(aq), heat</tspan></text>
  <text x="170.0" y="118.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">OH + NaBr</tspan></text>
  <text x="170.0" y="140.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">substitution: ethanol</text>
  <line x1="388.4" y1="242.6" x2="269.2" y2="170.3" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M262.4 166.1 L272.3 167.2 L268.0 174.4 Z" fill="#4b5563"/>
  <rect x="595.0" y="65.0" width="270.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="730.0" y="93.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NaOH in ethanol, heat</tspan></text>
  <text x="730.0" y="118.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">=CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O + NaBr</tspan></text>
  <text x="730.0" y="140.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">elimination: ethene</text>
  <line x1="511.6" y1="242.6" x2="630.8" y2="170.3" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M637.6 166.1 L632.0 174.4 L627.7 167.2 Z" fill="#4b5563"/>
  <rect x="25.0" y="410.0" width="270.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="160.0" y="438.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">KCN in ethanol, reflux</tspan></text>
  <text x="160.0" y="463.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">CN + KBr</tspan></text>
  <text x="160.0" y="485.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">substitution: propanenitrile</text>
  <line x1="386.2" y1="318.5" x2="262.5" y2="393.1" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M255.7 397.2 L261.3 388.9 L265.6 396.2 Z" fill="#4b5563"/>
  <rect x="605.0" y="410.0" width="270.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="740.0" y="438.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> in ethanol, heat, pressure</tspan></text>
  <text x="740.0" y="463.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">CH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + HBr</tspan></text>
  <text x="740.0" y="485.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">substitution: ethylamine</text>
  <line x1="513.8" y1="318.5" x2="637.5" y2="393.1" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M644.3 397.2 L634.4 396.2 L638.7 388.9 Z" fill="#4b5563"/>
  <rect x="320.0" y="425.0" width="260.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="453.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">AgNO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> in water and ethanol</tspan></text>
  <text x="450.0" y="478.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan><tspan dy="-6.3" font-size="10.5">-</tspan><tspan dy="6.3"> + Ag</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3"> -&gt; AgBr(s)</tspan></text>
  <text x="450.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cream precipitate shows Br</text>
  <line x1="450.0" y1="321.8" x2="450.0" y2="399.3" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 407.3 L445.8 398.2 L454.2 398.2 Z" fill="#4b5563"/>
  <text x="450.0" y="560.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">OH- can act as a nucleophile (water) or as a base (ethanol); CN- and NH3 are nucleophiles</text>
  <text x="450.0" y="581" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
