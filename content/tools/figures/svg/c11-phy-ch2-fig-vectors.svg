<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.1 to 2.4 and topics 2.1 to 2.3: rectangular components, the scalar (dot) product and work, the vector (cross) product and the right-hand rule. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Vectors: rectangular components, scalar product and vector product</text>
  <!-- components -->
  <rect x="50" y="55" width="360" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Rectangular components (Fig. 2.1)</text>
  <path d="M90 300 H330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M90 300 V110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M90 300 L290 160" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/>
  <path d="M90 300 H290" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/>
  <path d="M90 300 V160" stroke="#0f7a62" stroke-width="3" marker-end="url(#g)"/>
  <path d="M290 300 V160 M90 160 H290" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M130 300 A 40 40 0 0 0 123 277" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="135" y="292">theta</text>
  <text class="l" x="200" y="222" style="fill:#d7322f">A</text>
  <text class="l" x="300" y="152" style="fill:#d7322f">P</text>
  <text class="l" x="78" y="305">O</text>
  <text class="l" x="285" y="318">M</text>
  <text class="l" x="72" y="165">N</text>
  <text class="l" x="330" y="318">X</text>
  <text class="l" x="78" y="108">Y</text>
  <text class="l" x="180" y="318" style="fill:#1f6fb5">Ax = A cos theta</text>
  <text class="l" x="96" y="236" style="fill:#0f7a62">Ay = A sin theta</text>
  <g class="f">
    <text x="70" y="338">A = Ax + Ay;  A = sqrt(Ax^2 + Ay^2)</text>
    <text x="70" y="352" style="font-size:11px">theta = tan^-1(Ay/Ax)</text>
  </g>
  <!-- dot product -->
  <rect x="430" y="55" width="360" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="610" y="83">Scalar (dot) product (Figs. 2.2, 2.3)</text>
  <path d="M460 200 H700" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/>
  <path d="M460 200 L640 110" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/>
  <path d="M640 110 V200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M460 200 H640" stroke="#0f7a62" stroke-width="5" opacity="0.5"/>
  <path d="M500 200 A 40 40 0 0 0 494 180" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="504" y="194">theta</text>
  <text class="l" x="706" y="196" style="fill:#1f6fb5">A</text>
  <text class="l" x="640" y="104" style="fill:#d7322f">B</text>
  <text class="l" x="470" y="222" style="fill:#0f7a62">B cos theta (projection of B on A)</text>
  <g class="f">
    <text x="450" y="252">A.B = A B cos theta = A (B cos theta)</text>
    <text x="450" y="272">A.B = AxBx + AyBy + AzBz</text>
    <text x="450" y="292">cos theta = (AxBx + AyBy + AzBz) / (A B)</text>
  </g>
  <g class="t">
    <text x="450" y="318">commutative; perpendicular: 0; parallel: AB; antiparallel: -AB;</text>
    <text x="450" y="336">A.A = A^2; work done W = F.d = F d cos theta</text>
  </g>
  <!-- cross product -->
  <rect x="810" y="55" width="340" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Vector (cross) product (Fig. 2.4)</text>
  <path d="M860 230 L1060 200 L1110 250 L910 280 Z" fill="#fdf6e3" stroke="#9ca3af" stroke-width="1"/>
  <path d="M960 250 L1080 232" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/>
  <path d="M960 250 L1010 212" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/>
  <path d="M960 250 V110" stroke="#0f7a62" stroke-width="3" marker-end="url(#g)"/>
  <path d="M985 246 A 25 25 0 0 0 980 234" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="992" y="262">theta</text>
  <text class="l" x="1080" y="226" style="fill:#1f6fb5">A</text>
  <text class="l" x="1012" y="206" style="fill:#d7322f">B</text>
  <text class="l" x="975" y="104" style="fill:#0f7a62">A x B (along n-hat)</text>
  <path d="M935 160 A 25 12 0 1 0 985 160" fill="none" stroke="#4b5563" stroke-width="1" marker-end="url(#a)"/>
  <text class="r" x="880" y="300">plane of A and B; right-hand rule: curl the fingers</text>
  <text class="r" x="880" y="314">from A into B through the smaller angle, the</text>
  <text class="r" x="880" y="328">erect thumb gives the direction of A x B</text>
  <text class="f" x="830" y="348">A x B = A B sin theta n-hat;  A x B = -B x A</text>
  <!-- bottom -->
  <rect x="50" y="375" width="1100" height="300" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Scalars, vectors and the characteristics of the two products</text>
  <g class="t">
    <text x="70" y="430"><tspan class="b">scalar:</tspan> magnitude only: mass 2 kg, distance 50 m, speed 40 km h^-1, time 20 s, energy 25 J, temperature 20 degrees C</text>
    <text x="70" y="448"><tspan class="b">vector:</tspan> magnitude and direction: displacement 10 m towards west, velocity 50 km h^-1 west, acceleration 10 m s^-2 upward, force 20 N to the right</text>
    <text x="70" y="466"><tspan class="b">vector diagram:</tspan> an arrow whose length gives the magnitude and whose head gives the direction; bold letters (V, F) or an arrow over the symbol</text>
    <text x="70" y="498"><tspan class="b">scalar product:</tspan> A.B = B.A (commutative); A.B = 0 for perpendicular vectors; A.B = AB for parallel, -AB for antiparallel;</text>
    <text x="70" y="516">A.A = A^2; A.B = AxBx + AyBy + AzBz; the angle between vectors from cos theta = (AxBx + AyBy + AzBz)/AB</text>
    <text x="70" y="548"><tspan class="b">vector product:</tspan> A x B = -B x A (not commutative); maximum magnitude AB for perpendicular vectors; null vector for parallel or</text>
    <text x="70" y="566">antiparallel vectors, so A x A = 0; the magnitude of A x B is the area of the parallelogram with A and B as adjacent sides</text>
    <text x="70" y="598"><tspan class="b">examples:</tspan> torque = r x F (turning effect of a force F applied at position vector r); F = q (v x B) (force on a charge q moving with velocity v in a magnetic field B)</text>
    <text x="70" y="630"><tspan class="b">Example 2.1:</tspan> two forces of equal magnitude F whose resultant also has magnitude F: Rx = F + F cos theta, Ry = F sin theta, R^2 = Rx^2 + Ry^2 gives</text>
    <text x="70" y="648">F^2 = F^2 + F^2 cos^2 theta + 2F^2 cos theta + F^2 sin^2 theta, so 0 = 2F^2 cos theta + F^2, cos theta = -0.5, theta = 120 degrees</text>
  </g>
  <text class="s" x="600" y="692" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
