<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.7 to 10.10 and topics 10.15 to 10.17.3 and 10.21: the Zn-Cu galvanic cell, standard cell potentials, direction of electron flow and feasibility. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .l{font-size:12px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">The galvanic (voltaic) cell: chemical energy to electrical energy</text>
  <!-- Daniell cell -->
  <text class="k" x="320" y="66">Zn-Cu electrochemical cell (after Figure 10.7)</text>
  <circle cx="320" cy="120" r="24" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text class="l" x="320" y="125" style="fill:#14181f;font-size:14px">V</text>
  <text class="l" x="320" y="88" style="fill:#0f7a62">+1.10 V</text>
  <path d="M150 170 V120 H296 M344 120 H490 V170" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M190 112 H270" stroke="#0f7a62" stroke-width="2" marker-end="url(#ag)"/>
  <text class="l" x="230" y="98" style="fill:#0f7a62">electron flow</text>
  <rect x="60" y="210" width="220" height="220" rx="8" fill="#e6f4ef" stroke="#4b5563" stroke-width="2"/>
  <rect x="60" y="210" width="220" height="30" fill="#ffffff"/>
  <path d="M60 240 H280" stroke="#9ca3af" stroke-width="1"/>
  <rect x="360" y="210" width="220" height="220" rx="8" fill="#dbe9f5" stroke="#4b5563" stroke-width="2"/>
  <rect x="360" y="210" width="220" height="30" fill="#ffffff"/>
  <path d="M360 240 H580" stroke="#9ca3af" stroke-width="1"/>
  <rect x="138" y="170" width="24" height="220" fill="#6b7280"/>
  <rect x="478" y="170" width="24" height="220" fill="#b5600f"/>
  <text class="l" x="90" y="195" style="fill:#14181f">Zn (anode, -)</text>
  <text class="l" x="560" y="195" style="fill:#14181f">Cu (cathode, +)</text>
  <text class="s" x="208" y="360" style="font-size:10px">ZnSO4(aq)</text><text class="s" x="208" y="376" style="font-size:10px">Zn2+ 1.00 mol dm-3</text>
  <text class="s" x="425" y="360" style="font-size:10px">CuSO4(aq)</text><text class="s" x="425" y="376" style="font-size:10px">Cu2+ 1.00 mol dm-3</text>
  <path d="M240 300 V200 H400 V300" stroke="#d98b2b" stroke-width="14" fill="none" stroke-linecap="round"/>
  <text class="l" x="320" y="190" style="fill:#b5600f">salt bridge (KNO3)</text>
  <text class="s" x="320" y="443" style="font-size:10px;fill:#b5600f">salt bridge: ions move; electrons do not</text>
  <g class="f">
    <text x="60" y="460" style="fill:#d7322f">anode (-):   Zn gives Zn2+ + 2e-          E = -0.76 V</text>
    <text x="60" y="482" style="fill:#1f6fb5">cathode (+): Cu2+ + 2e- gives Cu          E = +0.34 V</text>
    <text x="60" y="504">overall:     Zn + Cu2+ gives Zn2+ + Cu    E cell = +1.10 V</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="60" y="532">spontaneous, exothermic redox: oxidation at the anode, reduction at the cathode</text>
    <text x="60" y="548">electrons flow in the wire from the more negative E (Zn) to the more positive (Cu)</text>
    <text x="60" y="564">salt bridge: filter paper soaked in saturated KNO3 keeps the ionic balance</text>
    <text x="60" y="580">examples of galvanic cells: Daniell cell, dry cell</text>
  </g>
  <!-- E cell -->
  <rect x="620" y="55" width="530" height="225" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="885" y="83">Standard cell potential (10.16, 10.17.1)</text>
  <text class="f" x="640" y="112">E cell = E(more positive half-cell) - E(more negative half-cell)</text>
  <g class="t">
    <text x="640" y="140">Cu2+/Cu with Zn2+/Zn: +0.34 - (-0.76) = +1.10 V</text>
    <text x="640" y="160">Ag+/Ag with Zn2+/Zn: +0.80 - (-0.76) = +1.56 V (Figure 10.8)</text>
    <text x="640" y="180">Cu2+/Cu with Fe2+/Fe: +0.34 - (-0.44) = +0.78 V (Quick Check 10.7)</text>
    <text x="640" y="208">the half-cell with the more positive E is the positive pole; electrons</text>
    <text x="640" y="228">flow through the wires from the negative pole to the positive pole,</text>
    <text x="640" y="248">never through the electrolyte (Zn2+/Zn to Ag+/Ag in Figure 10.9)</text>
  </g>
  <!-- feasibility -->
  <rect x="620" y="300" width="530" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="885" y="328">Feasibility from E standard (10.17.2, 10.17.3, 10.21)</text>
  <g class="t">
    <text x="640" y="356">E cell positive: the reaction is feasible; negative: it is not</text>
    <text x="640" y="384">Mg2+ + Ag: E cell = (-2.32) - (+0.80) = -1.52 V, not feasible</text>
    <text x="640" y="404">Ag+ + Mg: E cell = (+0.80) - (-2.32) = +1.52 V, feasible</text>
    <text x="640" y="424">Fe + 2Ag+: E cell = 0.80 - (-0.44) = +1.24 V, feasible</text>
    <text x="640" y="444">Al3+ + Ag: negative, not feasible (silver cannot reduce Al3+)</text>
    <text x="640" y="472">rule: the stronger oxidising agent (left side of the more positive</text>
    <text x="640" y="492">half-equation) reacts with the stronger reducing agent (right side</text>
    <text x="640" y="512">of the more negative one): Zn + Cu2+ goes, Cu + Zn2+ does not</text>
    <text x="640" y="540">to reduce Zn2+ (E -0.76 V) use a stronger reducing agent such as</text>
    <text x="640" y="560">Mg (E -2.38 V); KMnO4 and K2Cr2O7 (+1.33 V) are oxidising</text>
    <text x="640" y="580">agents, KI and FeSO4 reducing agents, H2O2 can be either</text>
  </g>
  <text class="s" x="600" y="638">Original diagram for this lesson; the textbook's pictures are not reproduced. Printed E values are kept as printed.</text>
</svg>
