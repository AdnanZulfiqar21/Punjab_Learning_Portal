<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <!-- Original chart after Figure 1.8: the major groups of kingdom Plantae. -->
  <defs>
    <style>
      .box{fill:#eaf5f1;stroke:#0f7a62;stroke-width:4;rx:20}
      .leaf{fill:#ffffff;stroke:#cfd6de;stroke-width:4;rx:18}
      .t{font-size:36px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:28px;fill:#4b5563;text-anchor:middle}
      .ln{stroke:#0f7a62;stroke-width:6;fill:none}
    </style>
  </defs>
  <rect class="box" x="320" y="40" width="360" height="100"/>
  <text class="t" x="500" y="102">Kingdom Plantae</text>
  <path class="ln" d="M500 140 V190 M500 190 H250 V240 M500 190 H750 V240"/>
  <rect class="box" x="60" y="240" width="380" height="130"/>
  <text class="t" x="250" y="290">Non-vascular plants</text>
  <text class="s" x="250" y="335">bryophytes: no xylem or phloem</text>
  <rect class="box" x="560" y="240" width="380" height="130"/>
  <text class="t" x="750" y="290">Vascular plants</text>
  <text class="s" x="750" y="335">have conducting tissues</text>
  <path class="ln" d="M250 370 V430 M750 370 V420 M750 420 H620 V470 M750 420 H880 V470"/>
  <rect class="leaf" x="60" y="430" width="380" height="150"/>
  <text class="t" x="250" y="485">Mosses, liverworts,</text>
  <text class="t" x="250" y="530">hornworts</text>
  <rect class="leaf" x="500" y="470" width="240" height="130"/>
  <text class="t" x="620" y="520">Seedless</text>
  <text class="s" x="620" y="565">ferns</text>
  <rect class="leaf" x="760" y="470" width="220" height="130"/>
  <text class="t" x="870" y="520">Seed plants</text>
  <text class="s" x="870" y="565">two kinds</text>
  <path class="ln" d="M870 600 V640 M870 640 H690 V680 M870 640 H900 V680"/>
  <rect class="leaf" x="560" y="680" width="260" height="170"/>
  <text class="t" x="690" y="735">Conifers</text>
  <text class="s" x="690" y="780">pine, Cedrus,</text>
  <text class="s" x="690" y="815">Ginkgo</text>
  <rect class="leaf" x="840" y="680" width="150" height="170"/>
  <text class="t" x="915" y="735">Flowering</text>
  <text class="s" x="915" y="780">capsicum,</text>
  <text class="s" x="915" y="815">mustard</text>
</svg>
