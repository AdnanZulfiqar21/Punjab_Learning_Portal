  <text x="280.0" y="90.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">moist mountain slopes, four seasons</text>
  <rect x="560.0" y="60.0" width="325.0" height="380.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#ffffff"/>
  <text x="576.0" y="92.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">where</text>
  <text x="584.0" y="112.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Shogran, Neelam Valley, Murree, Kaghan</text>
  <text x="576.0" y="138.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">climate and soil</text>
  <text x="584.0" y="158.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">4 to 30 C; 750-1500 mm rain a year;</text>
  <text x="584.0" y="176.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">grey-brown soil rich in humus</text>
  <text x="576.0" y="202.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">plants</text>
  <text x="584.0" y="222.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">yew, blue pine, Himalayan cedar,</text>
  <text x="584.0" y="240.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">shrubs such as Berberis lyceum</text>
  <text x="576.0" y="266.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">animals</text>
  <text x="584.0" y="286.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">rhesus monkey, black bear, leopard</text>
  <text x="584.0" y="304.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">cat, wolves, many birds</text>
  <text x="576.0" y="330.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">status</text>
  <text x="584.0" y="350.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">degraded: timber and farming</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
