<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.20: a chloroplast cut lengthwise. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <ellipse cx="550" cy="380" rx="420" ry="200" fill="#0f7a62"/>
  <ellipse cx="550" cy="380" rx="404" ry="184" fill="#e1f3ec"/>
  <ellipse cx="550" cy="380" rx="386" ry="166" fill="#0f7a62"/>
  <ellipse cx="550" cy="380" rx="372" ry="152" fill="#b2dbcc"/>
  <!-- grana: stacks of thylakoid discs -->
  <g fill="#2f9a7e" stroke="#0a5a48" stroke-width="2">
    <rect x="300" y="300" width="90" height="12" rx="6"/><rect x="300" y="316" width="90" height="12" rx="6"/><rect x="300" y="332" width="90" height="12" rx="6"/><rect x="300" y="348" width="90" height="12" rx="6"/><rect x="300" y="364" width="90" height="12" rx="6"/>
    <rect x="500" y="340" width="90" height="12" rx="6"/><rect x="500" y="356" width="90" height="12" rx="6"/><rect x="500" y="372" width="90" height="12" rx="6"/><rect x="500" y="388" width="90" height="12" rx="6"/><rect x="500" y="404" width="90" height="12" rx="6"/><rect x="500" y="420" width="90" height="12" rx="6"/>
    <rect x="700" y="300" width="90" height="12" rx="6"/><rect x="700" y="316" width="90" height="12" rx="6"/><rect x="700" y="332" width="90" height="12" rx="6"/><rect x="700" y="348" width="90" height="12" rx="6"/>
      </g>
  <!-- lamellae connecting grana -->
  <g stroke="#0a5a48" stroke-width="4" fill="none">
    <path d="M390 340 q55 20 110 30"/><path d="M590 380 q55 -20 110 -40"/>
  </g>
  <!-- DNA and ribosomes in stroma -->
  <ellipse cx="640" cy="260" rx="30" ry="16" fill="none" stroke="#5b3fb5" stroke-width="4"/>
  <g fill="#d98b2b"><circle cx="720" cy="440" r="5"/><circle cx="740" cy="460" r="5"/><circle cx="700" cy="470" r="5"/></g>
  <!-- labels -->
  <path class="lead" d="M550 180 L550 90"/><text class="t" x="430" y="70">Outer membrane</text><text class="s" x="400" y="95">more permeable than the inner one</text>
  <path class="lead" d="M190 300 L90 220"/><text class="t" x="20" y="200">Inner membrane</text>
  <path class="lead" d="M164 400 L90 500"/><text class="t" x="20" y="530" style="font-size:22px">Intermembrane</text><text class="t" x="20" y="556" style="font-size:22px">space</text>
  <path class="lead" d="M345 364 L260 640"/><text class="t" x="150" y="670">Granum</text><text class="s" x="110" y="695">a stack of thylakoids; chlorophyll a and b</text>
  <path class="lead" d="M450 352 L420 620"/><text class="t" x="380" y="650">Lamella</text><text class="s" x="340" y="675">connects two grana</text>
  <path class="lead" d="M640 260 L760 160"/><text class="t" x="760" y="150">Circular DNA</text><text class="s" x="760" y="175">and ribosomes</text>
  <path class="lead" d="M820 400 L860 560"/><text class="t" x="840" y="590">Stroma</text><text class="s" x="760" y="615">fluid with enzymes; glucose made here</text>
  <path class="lead" d="M545 426 L590 600"/><text class="t" x="545" y="628" style="font-size:22px">Thylakoid</text>
  <text class="s" x="30" y="740">Light is absorbed in the thylakoids and makes ATP; the stroma uses that ATP to turn carbon dioxide into glucose.</text>
</svg>
