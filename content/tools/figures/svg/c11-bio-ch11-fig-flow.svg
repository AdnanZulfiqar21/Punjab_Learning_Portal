<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.11 and 11.12: vasoconstriction and vasodilation of an arteriole, and the velocity of blood in the vessels. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="300" y="40">Arterioles: vasoconstriction and vasodilation</text>
  <!-- constricted -->
  <rect x="80" y="90" width="200" height="120" rx="20" fill="#d7322f"/><rect x="80" y="130" width="200" height="40" rx="10" fill="#f6d5cf"/>
  <text class="k" x="180" y="250">Vasoconstriction</text>
  <text class="s" x="180" y="276">circular muscles contract:</text><text class="s" x="180" y="298">narrow lumen, less flow</text>
  <text class="s" x="180" y="330">when metabolic activity falls</text>
  <!-- dilated -->
  <rect x="340" y="90" width="200" height="120" rx="20" fill="#d7322f"/><rect x="340" y="104" width="200" height="92" rx="14" fill="#f6d5cf"/>
  <text class="k" x="440" y="250">Vasodilation</text>
  <text class="s" x="440" y="276">circular muscles relax:</text><text class="s" x="440" y="298">wide lumen, more flow</text>
  <text class="s" x="440" y="330">when a tissue works harder: O2 falls,</text><text class="s" x="440" y="352">CO2 rises in its interstitial fluid</text>
  <text class="s" x="300" y="400">arteriole walls have more circular muscle than elastic tissue;</text><text class="s" x="300" y="422">the nervous and endocrine systems control the contraction</text>
  <!-- velocity chart -->
  <text class="h" x="880" y="40">Velocity of blood in the vessels</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <rect x="640" y="90" width="60" height="250" fill="#d7322f"/><text x="670" y="360">aorta</text><text x="670" y="80" font-weight="700">450-500</text>
    <rect x="720" y="170" width="60" height="170" fill="#e0665f"/><text x="750" y="360">arteries</text>
    <rect x="800" y="250" width="60" height="90" fill="#e89a90"/><text x="830" y="360">arterioles</text>
    <rect x="880" y="335" width="60" height="5" fill="#d98b2b"/><text x="910" y="360">capillaries</text><text x="910" y="325" font-weight="700">about 1</text>
    <rect x="960" y="260" width="60" height="80" fill="#9fc3e3"/><text x="990" y="360">venules</text>
    <rect x="1040" y="200" width="60" height="140" fill="#5f98cf"/><text x="1070" y="360">veins</text>
    <rect x="1120" y="190" width="60" height="150" fill="#1f6fb5"/><text x="1150" y="360">venae cavae</text><text x="1150" y="180" font-weight="700">250-300</text>
  </g>
  <text class="s" x="910" y="390">mm per second</text>
  <text class="s" x="910" y="430">highest in the aorta, falling along the arteries and arterioles to the lowest</text><text class="s" x="910" y="452">in the capillaries, then rising again in the venules, veins and venae cavae</text>
  <text class="s" x="910" y="484">the changes follow the total cross-section of the vessel system:</text><text class="s" x="910" y="506">the capillaries together have by far the largest, so flow there is slowest</text>
  <text class="s" x="600" y="570">Red: oxygenated side. Blue: deoxygenated side. Bar heights are not to scale between the two extremes.</text>
</svg>
