<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.10 and 15.13: the brain cut down the middle, showing the cerebrum, corpus callosum, diencephalon, limbic structures, brainstem and cerebellum. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Major parts of the human brain</text>
  <g transform="translate(200,10)">
  <path d="M190 330 C140 230 220 105 400 98 C580 92 690 185 672 300 C666 336 640 350 600 344 L500 336 C460 362 400 368 350 352 L250 350 C220 350 200 345 190 330 Z" stroke="#9d174d" stroke-width="3" fill="#fbcfe8" stroke-linejoin="round" stroke-linecap="round"/>
