  </g>
  <text x="20.0" y="85.0" font-size="12" fill="#9d174d" text-anchor="start" font-weight="700">cerebrum (two hemispheres)</text>
  <line x1="195.6" y1="80.0" x2="500.0" y2="150.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="125.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">corpus callosum</text>
  <line x1="123.0" y1="120.0" x2="530.0" y2="255.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="165.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">thalamus: sensory relay</text>
  <line x1="175.8" y1="160.0" x2="610.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="205.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">pineal gland: melatonin</text>
  <line x1="175.8" y1="200.0" x2="668.0" y2="276.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="245.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">hypothalamus: temperature,</text>
  <line x1="195.6" y1="240.0" x2="572.0" y2="325.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="263.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">thirst, hunger; controls</text>
  <text x="20.0" y="279.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the pituitary</text>
  <text x="20.0" y="325.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">limbic system: amygdala (pink)</text>
  <line x1="222.0" y1="320.0" x2="700.0" y2="332.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="343.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">for emotions, hippocampus</text>
  <text x="20.0" y="359.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(green) for memory</text>
  <text x="20.0" y="405.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">pituitary gland</text>
  <line x1="123.0" y1="400.0" x2="565.0" y2="366.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="445.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">midbrain: visual, auditory relay</text>
  <line x1="235.2" y1="440.0" x2="645.0" y2="340.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="485.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">pons: cerebrum to cerebellum</text>
  <line x1="208.8" y1="480.0" x2="640.0" y2="382.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="20.0" y="525.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">medulla: heart rate, breathing</text>
  <line x1="222.0" y1="520.0" x2="652.0" y2="428.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="720.0" y="565.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">spinal cord</text>
  <line x1="716.0" y1="560.0" x2="685.0" y2="540.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="735.0" y="475.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">cerebellum: posture and</text>
  <line x1="731.0" y1="470.0" x2="800.0" y2="430.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <text x="735.0" y="492.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">coordination</text>
  <text x="20.0" y="566.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">brainstem = midbrain + pons + medulla; diencephalon = thalamus + hypothalamus</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
