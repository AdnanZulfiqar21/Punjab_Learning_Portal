  <path d="M500 318 C520 312 540 322 548 334" stroke="#047857" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="500.0" cy="322.0" r="7.0" stroke="#be185d" stroke-width="1.5" fill="#f472b6"/>
