  <path d="M549.4811640609572 166.64099554492032 q12 -14 24 0 q12 14 24 0" stroke="#db2777" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300 262 C350 205 480 200 540 255 C520 236 460 226 420 230 C370 234 330 246 300 262 Z" stroke="#64748b" stroke-width="2" fill="#e2e8f0" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="430.0" cy="285.0" rx="36.0" ry="22.0" stroke="#7c2d12" stroke-width="2" fill="#fdba74"/>
