<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original mechanism after the book: KCN with a little HCl gives HCN and free CN-; CN- attacks the delta+ carbonyl carbon, the C=O electrons move onto O, and the anion takes H+ from HCN, giving the hydroxynitrile and regenerating CN-. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Addition of HCN: nucleophilic addition</text>
  <rect x="15.0" y="55.0" width="870.0" height="80.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="102.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KCN (excess) + HCl -&gt; HCN + KCl: the leftover CN</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> ions start the reaction</tspan></text>
  <line x1="147.0" y1="255.0" x2="147.0" y2="225.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="153.0" y1="255.0" x2="153.0" y2="225.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150.0" y="210.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="141.3" y1="270.0" x2="115.2" y2="285.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="92.5" y="303.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="158.7" y1="270.0" x2="184.8" y2="285.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="207.5" y="303.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="150.0" y="270.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="166.0" y="267.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="168.0" y="203.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="50.0" y="261.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan><tspan dy="-7.6" font-size="12.6">-</tspan></text>
  <circle cx="28.0" cy="237.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="36.0" cy="237.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M52.0 239.0 Q90.0 215.0 138.0 257.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M138.0 257.0 L128.4 254.2 L134.0 247.9 Z" fill="#d7322f"/>
  <path d="M156.0 235.0 Q186.0 219.0 162.0 211.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M162.0 211.0 L171.9 209.9 L169.3 217.9 Z" fill="#d7322f"/>
  <line x1="245.0" y1="255.0" x2="291.2" y2="255.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300.0 255.0 L290.0 259.6 L290.0 250.4 Z" fill="#14181f"/>
  <text x="380.0" y="271.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="380.0" y1="255.0" x2="380.0" y2="233.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="380.0" y="212.8" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-6.7" font-size="11.2">-</tspan></text>
  <line x1="372.1" y1="271.1" x2="354.1" y2="285.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="332.8" y="307.4" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="387.9" y1="271.1" x2="405.9" y2="285.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="427.2" y="307.4" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="390.0" y1="264.1" x2="411.3" y2="262.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="443.2" y="265.4" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <text x="380.0" y="350.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">intermediate anion</text>
  <text x="505.0" y="271.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ H-CN</tspan></text>
  <line x1="555.0" y1="255.0" x2="596.2" y2="255.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M605.0 255.0 L595.0 259.6 L595.0 250.4 Z" fill="#14181f"/>
  <text x="685.0" y="271.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="685.0" y1="255.0" x2="685.0" y2="233.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="685.0" y="212.8" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="677.1" y1="271.1" x2="659.1" y2="285.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="637.8" y="307.4" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="692.9" y1="271.1" x2="710.9" y2="285.1" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="732.2" y="307.4" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="695.0" y1="264.1" x2="716.3" y2="262.2" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="748.2" y="265.4" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CN</tspan></text>
  <text x="825.0" y="271.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">+ CN</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="685.0" y="350.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">hydroxynitrile (cyanohydrin)</text>
  <text x="450.0" y="445.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ethanal gives 2-hydroxypropanenitrile; propanone gives 2-hydroxy-2-methylpropanenitrile</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
