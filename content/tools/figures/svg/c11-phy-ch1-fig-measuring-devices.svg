<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="Arial, Helvetica, sans-serif">
  <!-- For your information (C11-PHY, PDF p12): photograph of measuring devices on a green cloth: a grey digital timer at the top, a black analogue meter with a white dial and red terminal (left), a black digital meter with a lead (right), a yellow metre rule and a glass thermometer below; flat drawing after the printed photograph. No photograph is reproduced. -->
  <rect width="900" height="1200" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="1200" fill="#9aa25a"/>
  <!-- grey digital timer at the top -->
  <g transform="rotate(4 400 140)">
    <rect x="150" y="40" width="500" height="210" rx="18" fill="#a9a9a2" stroke="#6f6f68" stroke-width="5"/>
    <rect x="175" y="65" width="450" height="110" rx="8" fill="#8d8d86"/>
    <rect x="205" y="85" width="110" height="60" fill="#2d2f6e"/>
    <rect x="222" y="100" width="76" height="10" fill="#c9cbe0"/>
    <rect x="222" y="120" width="50" height="8" fill="#c9cbe0"/>
    <rect x="335" y="95" width="250" height="45" fill="#c9cdbf" stroke="#5f625a" stroke-width="3"/>
    <rect x="175" y="195" width="450" height="30" fill="#d9d9d2"/>
  </g>
  <!-- lead from the black meter -->
  <path d="M500 420 Q560 300 700 300 Q830 300 840 200 Q845 150 800 140" stroke="#151515" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M420 470 L560 380" stroke="#e8e8e8" stroke-width="10" stroke-linecap="round"/>
  <!-- black analogue meter (left) -->
  <g transform="rotate(-14 260 560)">
    <rect x="90" y="420" width="340" height="300" rx="22" fill="#1d1d1f" stroke="#000" stroke-width="5"/>
    <path d="M130 600 Q130 470 260 465 Q390 470 390 600 Z" fill="#f4f4ee" stroke="#9a9a92" stroke-width="3"/>
    <g stroke="#333" stroke-width="3">
      <line x1="160" y1="560" x2="172" y2="570"/><line x1="190" y1="525" x2="200" y2="538"/><line x1="226" y1="503" x2="232" y2="518"/><line x1="260" y1="496" x2="260" y2="512"/><line x1="294" y1="503" x2="288" y2="518"/><line x1="330" y1="525" x2="320" y2="538"/><line x1="360" y1="560" x2="348" y2="570"/>
    </g>
    <line x1="260" y1="595" x2="215" y2="510" stroke="#c0141c" stroke-width="4"/>
    <circle cx="380" cy="660" r="22" fill="#d01a24" stroke="#7a0a10" stroke-width="4"/>
    <circle cx="380" cy="660" r="8" fill="#3a0306"/>
  </g>
  <!-- black digital meter (right) -->
  <g transform="rotate(-8 640 520)">
    <rect x="480" y="380" width="300" height="300" rx="30" fill="#141416" stroke="#000" stroke-width="5"/>
    <rect x="560" y="440" width="160" height="120" rx="10" fill="#cfd6d8" stroke="#6c7476" stroke-width="4"/>
    <rect x="600" y="470" width="80" height="60" fill="#9aa8ae"/>
    <rect x="510" y="410" width="40" height="240" rx="12" fill="#2a2a2e"/>
  </g>
  <!-- yellow metre rule -->
  <g transform="rotate(-6 450 860)">
    <rect x="-40" y="820" width="980" height="70" fill="#f2d21e" stroke="#b39a0e" stroke-width="4"/>
    <g fill="#3a3a10"><rect x="130" y="850" width="40" height="7"/><rect x="380" y="850" width="40" height="7"/><rect x="600" y="850" width="45" height="7"/><rect x="660" y="850" width="45" height="7"/><circle cx="800" cy="852" r="7"/></g>
  </g>
  <!-- glass thermometer -->
  <g transform="rotate(-11 450 1000)">
    <rect x="40" y="985" width="840" height="30" rx="15" fill="#e7ece8" stroke="#a9b0aa" stroke-width="4"/>
    <rect x="80" y="996" width="620" height="8" fill="#b9c1bb"/>
    <rect x="780" y="985" width="100" height="30" rx="15" fill="#8a3b3b" stroke="#5e2424" stroke-width="4"/>
  </g>
</svg>
