  <text x="482.0" y="360.1" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <path d="M205.6 387.8 L211.6 390.2 L217.5 392.4 L223.6 394.5 L229.6 396.5 L235.7 398.3 L241.8 400.1 L248.0 401.7 L254.2 403.2 L260.4 404.6 L266.7 405.9 L272.9 407.1 L279.2 408.1 L285.5 409.0 L291.8 409.8 L298.2 410.5 L304.5 411.0 L310.9 411.4 L317.3 411.8 L323.6 411.9 L330.0 412.0 L336.4 411.9 L342.7 411.8 L349.1 411.4 L355.5 411.0 L361.8 410.5 L368.2 409.8 L374.5 409.0 L380.8 408.1 L387.1 407.1 L393.3 405.9 L399.6 404.6 L405.8 403.2 L412.0 401.7 L418.2 400.1 L424.3 398.3 L430.4 396.5 L436.4 394.5 L442.5 392.4 L448.4 390.2 L454.4 387.8" stroke="#1f6fb5" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M454.4 387.8 L446.8 395.8 L443.4 387.1 Z" fill="#1f6fb5"/>
  <path d="M205.6 387.8 L216.6 387.1 L213.2 395.8 Z" fill="#1f6fb5"/>
  <rect x="560.0" y="70.0" width="325.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="722.5" y="100.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">free oscillation</text>
  <text x="578.0" y="120.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Displaced slightly and released,</text>
  <text x="578.0" y="142.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">the bob swings A -&gt; B -&gt; C -&gt; B -&gt; A</text>
  <text x="578.0" y="164.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">with its natural frequency.</text>
  <text x="578.0" y="186.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="578.0" y="208.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">No external force acts on it.</text>
  <text x="578.0" y="230.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">With no resistance its energy and</text>
  <text x="578.0" y="252.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">amplitude stay constant.</text>
  <text x="722.0" y="330.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">f = (1 / 2 pi) sqrt(g / l)</tspan></text>
  <text x="722.0" y="360.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">depends only on the length l</text>
  <text x="722.0" y="378.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">(for a given g)</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
