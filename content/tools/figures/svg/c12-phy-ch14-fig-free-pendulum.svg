  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.12: a simple pendulum hung from O swinging freely between A and C through the mean position B at its natural frequency. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Free oscillation of a simple pendulum (after Fig 14.12)</text>
  <line x1="230.0" y1="80.0" x2="430.0" y2="80.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
