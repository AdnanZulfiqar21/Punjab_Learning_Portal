  <line x1="326.0" y1="80.0" x2="336.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="342.0" y1="80.0" x2="352.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="358.0" y1="80.0" x2="368.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="374.0" y1="80.0" x2="384.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="390.0" y1="80.0" x2="400.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="406.0" y1="80.0" x2="416.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="422.0" y1="80.0" x2="432.0" y2="70.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="330.0" cy="80.0" r="5.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="316.0" y="102.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="700">O</text>
  <line x1="330.0" y1="80.0" x2="208.0" y2="354.1" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
  <circle cx="208.0" cy="354.1" r="18.0" stroke="#d98b2b" stroke-width="2.5" fill="#fff1dc"/>
  <text x="178.0" y="360.1" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <line x1="330.0" y1="80.0" x2="330.0" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="330.0" cy="380.0" r="18.0" stroke="#d98b2b" stroke-width="2.5" fill="#fff1dc"/>
  <text x="330.0" y="452.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <line x1="330.0" y1="80.0" x2="452.0" y2="354.1" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
