  <path d="M582.0 460.0 L569.3 465.9 L569.3 454.1 Z" fill="#111111"/>
  <text x="543.5" y="448.0" font-size="24" fill="#0f7a62" text-anchor="middle" font-weight="700">True</text>
  <rect x="584.0" y="428.0" width="340.0" height="64.0" rx="10" stroke="#0f7a62" stroke-width="2.6" fill="#e6f4ef"/>
