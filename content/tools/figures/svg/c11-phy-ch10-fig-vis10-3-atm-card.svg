<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a6fc0"/><stop offset="100%" stop-color="#174a8c"/></linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e9edf2"/><stop offset="50%" stop-color="#b9c3cf"/><stop offset="100%" stop-color="#eef1f5"/></linearGradient>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- Original drawing after the picture in the For Your Information box of topic 10.3 (PDF page 234): the back of a credit/ATM card with six numbered parts: 1 magnetic stripe, 2 hologram, 3 bank contact info, 4 signature area, 5 security code, 6 network logo. -->
  <!-- card -->
  <rect x="250" y="70" width="500" height="315" rx="28" fill="url(#card)" stroke="#123a6e" stroke-width="2"/>
  <!-- 1 magnetic stripe -->
  <rect x="250" y="112" width="500" height="58" fill="#14181f"/>
  <!-- 2 hologram -->
  <rect x="282" y="200" width="70" height="56" rx="6" fill="url(#holo)" stroke="#8a95a3" stroke-width="1.5"/>
  <circle cx="317" cy="228" r="16" fill="none" stroke="#8a95a3" stroke-width="2"/>
  <!-- 4 signature panel -->
  <rect x="375" y="204" width="235" height="46" fill="#f6f2e6" stroke="#c9c0a6" stroke-width="1.5"/>
  <path d="M392 236 C402 214 410 244 420 226 C428 212 436 240 446 228 C454 218 462 238 474 230" fill="none" stroke="#2b3a55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 5 security code -->
  <rect x="628" y="204" width="86" height="46" fill="#ffffff" stroke="#c9c0a6" stroke-width="1.5"/>
  <text x="671" y="234" font-size="20" fill="#14181f" text-anchor="middle" font-style="italic">123</text>
  <!-- 3 bank contact info -->
  <line x1="282" y1="330" x2="560" y2="330" stroke="#cfe0f5" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="282" y1="346" x2="470" y2="346" stroke="#cfe0f5" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- 6 network logo -->
  <rect x="650" y="305" width="70" height="50" rx="8" fill="#0f2240"/>
  <rect x="664" y="318" width="42" height="24" rx="4" fill="none" stroke="#e8edf3" stroke-width="2.5"/>
  <path d="M672 336 L682 324 L690 332 L698 322" fill="none" stroke="#e8edf3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- labels, left -->
  <g font-size="22" fill="#14181f">
    <g>
      <rect x="30" y="112" width="170" height="58" rx="6" fill="#e8384f"/>
      <circle cx="30" cy="112" r="15" fill="#14181f"/><text x="30" y="119" font-size="18" fill="#ffffff" text-anchor="middle">1</text>
      <text x="115" y="148" fill="#ffffff" text-anchor="middle">Magnetic stripe</text>
      <line x1="200" y1="141" x2="262" y2="141" stroke="#14181f" stroke-width="2"/>
    </g>
    <g>
      <rect x="30" y="199" width="170" height="58" rx="6" fill="#e8384f"/>
      <circle cx="30" cy="199" r="15" fill="#14181f"/><text x="30" y="206" font-size="18" fill="#ffffff" text-anchor="middle">2</text>
      <text x="115" y="235" fill="#ffffff" text-anchor="middle">Hologram</text>
      <line x1="200" y1="228" x2="282" y2="228" stroke="#14181f" stroke-width="2"/>
    </g>
    <g>
      <rect x="30" y="300" width="170" height="70" rx="6" fill="#e8384f"/>
      <circle cx="30" cy="300" r="15" fill="#14181f"/><text x="30" y="307" font-size="18" fill="#ffffff" text-anchor="middle">3</text>
      <text x="115" y="330" fill="#ffffff" text-anchor="middle">Bank contact</text>
      <text x="115" y="356" fill="#ffffff" text-anchor="middle">info</text>
      <line x1="200" y1="335" x2="282" y2="335" stroke="#14181f" stroke-width="2"/>
    </g>
    <!-- labels, right -->
    <g>
      <rect x="800" y="112" width="170" height="58" rx="6" fill="#e8384f"/>
      <circle cx="800" cy="112" r="15" fill="#14181f"/><text x="800" y="119" font-size="18" fill="#ffffff" text-anchor="middle">4</text>
      <text x="885" y="148" fill="#ffffff" text-anchor="middle">Signature area</text>
      <polyline points="800,141 772,141 772,188 600,206" fill="none" stroke="#14181f" stroke-width="2"/>
    </g>
    <g>
      <rect x="800" y="199" width="170" height="58" rx="6" fill="#e8384f"/>
      <circle cx="800" cy="199" r="15" fill="#14181f"/><text x="800" y="206" font-size="18" fill="#ffffff" text-anchor="middle">5</text>
      <text x="885" y="235" fill="#ffffff" text-anchor="middle">Security code</text>
      <line x1="800" y1="228" x2="714" y2="228" stroke="#14181f" stroke-width="2"/>
    </g>
    <g>
      <rect x="800" y="300" width="170" height="58" rx="6" fill="#e8384f"/>
      <circle cx="800" cy="300" r="15" fill="#14181f"/><text x="800" y="307" font-size="18" fill="#ffffff" text-anchor="middle">6</text>
      <text x="885" y="336" fill="#ffffff" text-anchor="middle">Network logo</text>
      <line x1="800" y1="330" x2="720" y2="330" stroke="#14181f" stroke-width="2"/>
    </g>
  </g>
</svg>
