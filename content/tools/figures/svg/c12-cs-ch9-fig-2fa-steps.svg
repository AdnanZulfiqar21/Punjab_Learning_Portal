  <text x="104.0" y="440.0" font-size="34" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">phone ya email par aaya</text>
  <text x="104.0" y="485.0" font-size="34" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif">doosri tasdeeq</text>
