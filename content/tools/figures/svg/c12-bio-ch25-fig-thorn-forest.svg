  <text x="250.0" y="110.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">flat, dry plains; hot summers</text>
  <text x="250.0" y="130.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">up to 50 C</text>
  <rect x="560.0" y="60.0" width="325.0" height="380.0" rx="12" stroke="#cbd5e1" stroke-width="2" fill="#ffffff"/>
  <text x="576.0" y="92.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">where</text>
  <text x="584.0" y="112.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Indus plains of Punjab, Sindh</text>
  <text x="584.0" y="130.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">and western Balochistan</text>
  <text x="576.0" y="156.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">climate</text>
  <text x="584.0" y="176.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">arid to semi-arid; 200-750 mm rain;</text>
  <text x="584.0" y="194.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">summers up to 50 C</text>
  <text x="576.0" y="220.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">plants</text>
  <text x="584.0" y="240.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">jhand, peelu (wan), karir, kikar:</text>
  <text x="584.0" y="258.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">thorny, drought-resistant</text>
  <text x="576.0" y="284.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">animals</text>
  <text x="584.0" y="304.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">camel, houbara bustard, chinkara,</text>
  <text x="584.0" y="322.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">golden jackal, gerbil, porcupine</text>
  <text x="576.0" y="348.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">status</text>
  <text x="584.0" y="368.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">heavily degraded: farms and canals</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
