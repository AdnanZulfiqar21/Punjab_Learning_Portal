<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Fig 13.3 (C12-PHY, PDF p11): popcorn, as printed beside the daily-life examples of kinetic theory: yellow corn cobs lying across the top left, a heap of white popped corn across the middle and right, and loose yellow kernels in the front, on grey-beige sacking. Flat drawing after the printed photograph; no photograph is reproduced. -->
  <defs>
    <pattern id="kern" width="34" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="34" height="30" fill="#e8a20c"/>
      <rect x="2" y="2" width="30" height="26" rx="10" fill="#f8c62a"/>
      <ellipse cx="13" cy="10" rx="7" ry="4" fill="#fde27a"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="#c9c0b2"/>
  <g stroke="#b2a896" stroke-width="2" opacity="0.6"><path d="M0 100 H1000 M0 220 H1000 M0 340 H1000 M0 460 H1000 M0 580 H1000 M0 700 H1000 M0 820 H1000 M0 940 H1000"/><path d="M100 0 V1000 M250 0 V1000 M400 0 V1000 M550 0 V1000 M700 0 V1000 M850 0 V1000"/></g>
  <!-- corn cobs -->
  <g stroke="#b97a05" stroke-width="4">
    <path d="M-40 60 Q200 0 470 90 Q520 120 470 160 Q230 210 -40 210 Z" fill="url(#kern)"/>
    <path d="M-40 220 Q260 160 560 250 Q610 285 560 320 Q280 380 -40 380 Z" fill="url(#kern)"/>
    <path d="M-40 400 Q170 350 400 420 Q450 455 400 495 Q190 545 -40 545 Z" fill="url(#kern)"/>
    <path d="M-40 560 Q120 530 300 590 Q340 620 300 660 Q140 700 -40 690 Z" fill="url(#kern)"/>
  </g>
  <g fill="#f3efe4" stroke="#e7dccb" stroke-width="3">
    <ellipse cx="490" cy="130" rx="40" ry="34"/><ellipse cx="590" cy="280" rx="40" ry="34"/><ellipse cx="430" cy="460" rx="40" ry="34"/><ellipse cx="320" cy="625" rx="36" ry="32"/>
  </g>
  <!-- popped corn heap -->
  <g stroke="#d8c8a6" stroke-width="3">
    <g fill="#fbf8ef">
      <circle cx="560" cy="420" r="40"/><circle cx="630" cy="390" r="44"/><circle cx="700" cy="420" r="40"/><circle cx="770" cy="400" r="38"/><circle cx="840" cy="430" r="42"/><circle cx="910" cy="420" r="40"/><circle cx="980" cy="440" r="40"/>
      <circle cx="500" cy="500" r="42"/><circle cx="580" cy="490" r="44"/><circle cx="660" cy="480" r="42"/><circle cx="740" cy="490" r="44"/><circle cx="820" cy="500" r="40"/><circle cx="900" cy="490" r="44"/><circle cx="975" cy="510" r="40"/>
      <circle cx="420" cy="580" r="40"/><circle cx="500" cy="580" r="42"/><circle cx="580" cy="570" r="44"/><circle cx="660" cy="570" r="40"/><circle cx="740" cy="580" r="42"/><circle cx="820" cy="580" r="44"/><circle cx="900" cy="570" r="40"/><circle cx="975" cy="590" r="42"/>
      <circle cx="380" cy="660" r="40"/><circle cx="460" cy="660" r="44"/><circle cx="540" cy="650" r="40"/><circle cx="620" cy="660" r="42"/><circle cx="700" cy="660" r="44"/><circle cx="780" cy="660" r="40"/><circle cx="860" cy="650" r="42"/><circle cx="940" cy="660" r="44"/>
      <circle cx="560" cy="740" r="40"/><circle cx="640" cy="740" r="42"/><circle cx="720" cy="740" r="40"/><circle cx="800" cy="730" r="42"/><circle cx="880" cy="740" r="40"/><circle cx="960" cy="740" r="42"/>
    </g>
    <g fill="#efe1bf"><circle cx="610" cy="440" r="16"/><circle cx="760" cy="520" r="15"/><circle cx="520" cy="620" r="16"/><circle cx="840" cy="610" r="15"/><circle cx="680" cy="700" r="16"/><circle cx="900" cy="700" r="14"/><circle cx="440" cy="690" r="14"/></g>
    <g fill="#c98a3a" stroke="none"><circle cx="645" cy="505" r="9"/><circle cx="870" cy="455" r="8"/><circle cx="560" cy="595" r="8"/><circle cx="745" cy="625" r="9"/><circle cx="925" cy="610" r="8"/><circle cx="600" cy="760" r="8"/></g>
  </g>
  <!-- loose kernels in front -->
  <g fill="#f5b81c" stroke="#c8840a" stroke-width="3">
    <ellipse cx="60" cy="800" rx="24" ry="20"/><ellipse cx="120" cy="830" rx="24" ry="20"/><ellipse cx="180" cy="800" rx="24" ry="20"/><ellipse cx="240" cy="840" rx="24" ry="20"/><ellipse cx="300" cy="810" rx="24" ry="20"/><ellipse cx="360" cy="850" rx="24" ry="20"/><ellipse cx="420" cy="820" rx="24" ry="20"/><ellipse cx="480" cy="860" rx="24" ry="20"/>
    <ellipse cx="40" cy="880" rx="24" ry="20"/><ellipse cx="100" cy="900" rx="24" ry="20"/><ellipse cx="160" cy="870" rx="24" ry="20"/><ellipse cx="220" cy="910" rx="24" ry="20"/><ellipse cx="280" cy="880" rx="24" ry="20"/><ellipse cx="340" cy="920" rx="24" ry="20"/><ellipse cx="400" cy="890" rx="24" ry="20"/><ellipse cx="460" cy="930" rx="24" ry="20"/><ellipse cx="520" cy="900" rx="24" ry="20"/>
    <ellipse cx="70" cy="960" rx="24" ry="20"/><ellipse cx="190" cy="965" rx="24" ry="20"/><ellipse cx="310" cy="975" rx="24" ry="20"/><ellipse cx="430" cy="975" rx="24" ry="20"/><ellipse cx="560" cy="960" rx="24" ry="20"/><ellipse cx="620" cy="880" rx="24" ry="20"/>
    <ellipse cx="80" cy="740" rx="24" ry="20"/><ellipse cx="200" cy="730" rx="24" ry="20"/>
  </g>
</svg>
