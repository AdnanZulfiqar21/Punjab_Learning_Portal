<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 31.7: sunlight falling on a silicon panel frees electrons at the junction between two layers, giving direct current; an inverter changes it to alternating current for homes, and a battery stores energy for night and cloudy days. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">How a solar (photovoltaic) system works</text>
  <circle cx="85.0" cy="120.0" r="40.0" stroke="#d98b2b" stroke-width="2.2" fill="#fde68a"/>
  <line x1="133.0" y1="120.0" x2="147.0" y2="120.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="126.6" y1="144.0" x2="138.7" y2="151.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="109.0" y1="161.6" x2="116.0" y2="173.7" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="85.0" y1="168.0" x2="85.0" y2="182.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="61.0" y1="161.6" x2="54.0" y2="173.7" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="43.4" y1="144.0" x2="31.3" y2="151.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37.0" y1="120.0" x2="23.0" y2="120.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="43.4" y1="96.0" x2="31.3" y2="89.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="61.0" y1="78.4" x2="54.0" y2="66.3" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="85.0" y1="72.0" x2="85.0" y2="58.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="109.0" y1="78.4" x2="116.0" y2="66.3" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="126.6" y1="96.0" x2="138.7" y2="89.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="85.0" y="205.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">sunlight</text>
  <line x1="140.0" y1="110.0" x2="218.5" y2="146.9" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M225.0 150.0 L216.0 150.0 L219.2 143.1 Z" fill="#d7322f"/>
  <line x1="148.0" y1="135.0" x2="226.4" y2="169.1" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M233.0 172.0 L224.0 172.2 L227.0 165.3 Z" fill="#d7322f"/>
  <line x1="156.0" y1="160.0" x2="234.3" y2="191.3" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M241.0 194.0 L232.0 194.5 L234.8 187.4 Z" fill="#d7322f"/>
  <path d="M240.0 230.0 L300.0 110.0 L440.0 110.0 L380.0 230.0 Z" stroke="#1f6fb5" stroke-width="2.2" fill="#1e3a8a" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="255.0" y1="200.0" x2="395.0" y2="200.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="275.0" y1="230.0" x2="335.0" y2="110.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="270.0" y1="170.0" x2="410.0" y2="170.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="310.0" y1="230.0" x2="370.0" y2="110.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="285.0" y1="140.0" x2="425.0" y2="140.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="345.0" y1="230.0" x2="405.0" y2="110.0" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <text x="340.0" y="100.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">silicon solar panel</text>
  <line x1="310.0" y1="232.0" x2="310.0" y2="290.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/>
  <rect x="200.0" y="290.0" width="230.0" height="110.0" rx="8" stroke="#4b5563" stroke-width="1.8" fill="#ffffff"/>
  <rect x="215.0" y="302.0" width="200.0" height="26.0" rx="0" stroke="#1f6fb5" stroke-width="1.5" fill="#dbe9f5"/>
  <text x="225.0" y="320.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(-) layer</text>
  <line x1="215.0" y1="349.0" x2="415.0" y2="349.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="225.0" y="341.0" font-size="12" fill="#d7322f" text-anchor="start" font-weight="700">junction (diode)</text>
  <rect x="215.0" y="360.0" width="200.0" height="26.0" rx="0" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="225.0" y="378.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(+) layer</text>
  <circle cx="330.0" cy="315.0" r="3.5" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="355.0" cy="315.0" r="3.5" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="380.0" cy="315.0" r="3.5" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="400.0" cy="315.0" r="3.5" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="315.0" y="420.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">light frees electrons in the silicon</text>
  <line x1="440.0" y1="160.0" x2="560.0" y2="160.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="500.0" y="148.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">direct current (DC)</text>
  <rect x="560.0" y="138.0" width="110.0" height="44.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="615.0" y="165.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">inverter</text>
  <line x1="670.0" y1="160.0" x2="770.0" y2="160.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="720.0" y="148.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">alternating (AC)</text>
  <circle cx="800.0" cy="150.0" r="24.0" stroke="#d98b2b" stroke-width="2" fill="#fef3c7"/>
  <rect x="790.0" y="174.0" width="20.0" height="14.0" rx="0" stroke="#4b5563" stroke-width="1.5" fill="#d1d5db"/>
  <text x="800.0" y="212.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">homes, schools,</text>
  <text x="800.0" y="229.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">offices, industry</text>
  <line x1="500.0" y1="160.0" x2="500.0" y2="280.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="470.0" y="280.0" width="140.0" height="60.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="540.0" y="316.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">battery</text>
  <text x="540.0" y="362.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">stores energy for night and cloudy</text>
  <text x="540.0" y="379.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">days; steadies the voltage</text>
  <text x="450.0" y="458.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Silicon cells turn sunlight into DC electricity (the photovoltaic effect);</text>
  <text x="450.0" y="477.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">an inverter changes DC into AC for ordinary appliances.</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
