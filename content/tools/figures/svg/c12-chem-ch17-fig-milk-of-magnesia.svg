<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 940" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis17-5 (C12-CHEM, PDF p14): photograph of a bottle of milk of magnesia beside the medicine text (no printed caption); flat drawing after the printed photograph: a dark amber-brown medicine bottle with a white ribbed screw cap and a white label between blue and green bands reading "Milk of" (red), "Magnesia" (blue) and "Mg(OH)2". No photograph is reproduced. -->
  <rect width="600" height="940" fill="#ffffff"/>
  <ellipse cx="300" cy="900" rx="210" ry="18" fill="#e6e6e6"/>
  <!-- cap -->
  <rect x="200" y="30" width="200" height="120" rx="14" fill="#f7f8fa" stroke="#c9ced6" stroke-width="3"/>
  <g stroke="#dde1e7" stroke-width="4"><line x1="222" y1="40" x2="222" y2="140"/><line x1="250" y1="40" x2="250" y2="140"/><line x1="278" y1="40" x2="278" y2="140"/><line x1="306" y1="40" x2="306" y2="140"/><line x1="334" y1="40" x2="334" y2="140"/><line x1="362" y1="40" x2="362" y2="140"/><line x1="388" y1="40" x2="388" y2="140"/></g>
  <!-- bottle -->
  <path d="M210 150 L390 150 L390 190 Q500 215 505 300 L505 860 Q505 895 470 895 L130 895 Q95 895 95 860 L95 300 Q100 215 210 190 Z" fill="#2a1408" stroke="#170a03" stroke-width="3"/>
  <path d="M130 300 Q135 240 210 220" stroke="#6b3f22" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M125 330 L125 840" stroke="#5a3218" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <!-- label -->
  <rect x="95" y="400" width="410" height="60" fill="#2b3aa8"/>
  <rect x="95" y="460" width="410" height="14" fill="#9fd04a"/>
  <rect x="95" y="474" width="410" height="250" fill="#ffffff"/>
  <rect x="95" y="724" width="410" height="14" fill="#9fd04a"/>
  <rect x="95" y="738" width="410" height="60" fill="#2b3aa8"/>
  <text x="300" y="560" font-size="56" font-weight="bold" fill="#e0242a" text-anchor="middle">Milk of</text>
  <text x="300" y="640" font-size="72" font-weight="bold" fill="#2b3aa8" text-anchor="middle">Magnesia</text>
  <text x="430" y="690" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Mg(OH)<tspan font-size="18" dy="6">2</tspan></text>
</svg>
