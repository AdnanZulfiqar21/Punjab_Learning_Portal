<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.17 and 2.18: a pure silicon lattice and the doping that makes p-type and n-type semiconductors. Schematic 2D lattice. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .e{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <defs>
    <g id="lat">
      <g stroke="#9ca3af" stroke-width="2"><path d="M60 60 H260 M60 140 H260 M60 220 H260 M60 60 V220 M160 60 V220 M260 60 V220"/></g>
      <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="60" cy="60" r="18"/><circle cx="160" cy="60" r="18"/><circle cx="260" cy="60" r="18"/><circle cx="60" cy="140" r="18"/><circle cx="260" cy="140" r="18"/><circle cx="60" cy="220" r="18"/><circle cx="160" cy="220" r="18"/><circle cx="260" cy="220" r="18"/></g>
      <g fill="#14181f"><circle cx="110" cy="60" r="4"/><circle cx="210" cy="60" r="4"/><circle cx="110" cy="220" r="4"/><circle cx="210" cy="220" r="4"/><circle cx="60" cy="100" r="4"/><circle cx="60" cy="180" r="4"/><circle cx="260" cy="100" r="4"/><circle cx="260" cy="180" r="4"/><circle cx="110" cy="140" r="4"/><circle cx="210" cy="140" r="4"/><circle cx="160" cy="100" r="4"/><circle cx="160" cy="180" r="4"/></g>
    </g>
  </defs>
  <!-- pure -->
  <text class="h" x="200" y="34">Pure silicon</text>
  <use href="#lat" x="40" y="0"/>
  <circle cx="200" cy="140" r="18" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <g class="e" style="font-size:12px"><text x="100" y="64">Si</text><text x="200" y="64">Si</text><text x="300" y="64">Si</text><text x="100" y="144">Si</text><text x="200" y="144">Si</text><text x="300" y="144">Si</text><text x="100" y="224">Si</text><text x="200" y="224">Si</text><text x="300" y="224">Si</text></g>
  <text class="s" x="200" y="280">Si = 2, 8, 4: four valence electrons,</text><text class="s" x="200" y="302">each atom bonded to four neighbours;</text><text class="s" x="200" y="324">every electron is held in a bond, so</text><text class="s" x="200" y="346">the pure crystal does not conduct</text>
  <!-- p type -->
  <text class="h" x="600" y="34">p-type: trivalent impurity (B, Al)</text>
  <use href="#lat" x="440" y="0"/>
  <circle cx="600" cy="140" r="18" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/>
  <g class="e" style="font-size:12px"><text x="500" y="64">Si</text><text x="600" y="64">Si</text><text x="700" y="64">Si</text><text x="500" y="144">Si</text><text x="600" y="144">Al</text><text x="700" y="144">Si</text><text x="500" y="224">Si</text><text x="600" y="224">Si</text><text x="700" y="224">Si</text></g>
  <circle cx="600" cy="100" r="7" fill="#ffffff" stroke="#d7322f" stroke-width="2"/><text class="s" x="640" y="104" style="fill:#d7322f;font-size:13px">hole (+)</text>
  <text class="s" x="600" y="280">the impurity has only three valence</text><text class="s" x="600" y="302">electrons, so one bond is missing: a hole</text><text class="s" x="600" y="324">that acts as a positive charge carrier;</text><text class="s" x="600" y="346">electrons from a source hop into it</text>
  <!-- n type -->
  <text class="h" x="1000" y="34">n-type: pentavalent impurity (P, As)</text>
  <use href="#lat" x="840" y="0"/>
  <circle cx="1000" cy="140" r="18" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/>
  <g class="e" style="font-size:12px"><text x="900" y="64">Si</text><text x="1000" y="64">Si</text><text x="1100" y="64">Si</text><text x="900" y="144">Si</text><text x="1000" y="144">P</text><text x="1100" y="144">Si</text><text x="900" y="224">Si</text><text x="1000" y="224">Si</text><text x="1100" y="224">Si</text></g>
  <circle cx="1050" cy="165" r="5" fill="#0f7a62"/><text class="s" x="1050" y="183" style="fill:#0f7a62;font-size:12px">extra</text><text class="s" x="1050" y="197" style="fill:#0f7a62;font-size:12px">electron (-)</text>
  <text class="s" x="1000" y="280">the impurity has five valence electrons:</text><text class="s" x="1000" y="302">four make bonds and the fifth is free</text><text class="s" x="1000" y="324">to move as a negative charge carrier,</text><text class="s" x="1000" y="346">so the crystal conducts</text>
  <rect x="100" y="390" width="1000" height="150" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="600" y="420" style="font-weight:700;fill:#14181f">Doping</text>
  <text class="s" x="600" y="448">Semiconductors (silicon, germanium, arsenic) conduct electricity under some conditions and are used in smartphones, laptops and cars.</text>
  <text class="s" x="600" y="472">Adding impurity atoms to a pure semiconductor is doping: trivalent atoms give a p-type (holes, positive carriers),</text>
  <text class="s" x="600" y="496">pentavalent atoms an n-type (extra electrons, negative carriers). Either conducts when connected to an external source.</text>
  <text class="s" x="600" y="520">The possibility rests on the unique electronic configuration of these elements, four valence electrons.</text>
  <text class="s" x="600" y="580">Blue: silicon atoms. Dots: bonding electron pairs. Red: trivalent impurity with a hole. Green: pentavalent impurity with a free electron.</text>
</svg>
