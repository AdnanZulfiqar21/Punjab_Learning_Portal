<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram after Figure 27.1: D-glucose as an open chain (CHO at C1; OH right, left, right, right on C2 to C5; CH2OH at C6), its six-membered ring form (alpha-D-glucopyranose), and the open chain of fructose, a ketose with C=O at C2. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Glucose: open chain and ring</text>
  <rect x="15.0" y="55.0" width="270.0" height="430.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="150.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">glucose: open chain</text>
  <text x="150.0" y="115.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CHO</tspan></text>
  <text x="150.0" y="159.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="120.0" y1="154.0" x2="140.0" y2="154.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="160.0" y1="154.0" x2="180.0" y2="154.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="110.0" y="159.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="190.0" y="159.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="150.0" y1="120.0" x2="150.0" y2="144.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="203.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="120.0" y1="198.0" x2="140.0" y2="198.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="160.0" y1="198.0" x2="180.0" y2="198.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="110.0" y="203.2" font-size="15" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <text x="190.0" y="203.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="150.0" y1="164.0" x2="150.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="247.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="120.0" y1="242.0" x2="140.0" y2="242.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="160.0" y1="242.0" x2="180.0" y2="242.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="110.0" y="247.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="190.0" y="247.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="150.0" y1="208.0" x2="150.0" y2="232.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="291.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="120.0" y1="286.0" x2="140.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="160.0" y1="286.0" x2="180.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="110.0" y="291.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="190.0" y="291.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="150.0" y1="252.0" x2="150.0" y2="276.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="335.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <line x1="150.0" y1="296.0" x2="150.0" y2="320.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="118.0" y="102.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">1</text>
  <text x="118.0" y="146.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">2</text>
  <text x="118.0" y="190.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">3</text>
  <text x="118.0" y="234.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">4</text>
  <text x="118.0" y="278.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">5</text>
  <text x="118.0" y="322.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">6</text>
  <text x="150.0" y="400.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">an aldose (CHO group)</text>
  <text x="150.0" y="420.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">C6H12O6</text>
  <rect x="300.0" y="55.0" width="300.0" height="430.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">glucose: ring (pyranose)</text>
  <line x1="388.0" y1="260.0" x2="419.0" y2="234.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="512.0" y1="260.0" x2="481.0" y2="286.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="481.0" y1="286.0" x2="419.0" y2="286.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="419.0" y1="286.0" x2="388.0" y2="260.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="419.0" y1="234.0" x2="470.0" y2="234.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="489.4" y1="241.1" x2="512.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="481.0" y="239.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="419.0" y1="234.0" x2="419.0" y2="208.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="419.0" y="202.9" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">OH</tspan></text>
  <line x1="419.0" y1="286.0" x2="419.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="419.0" y="254.9" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="388.0" y1="260.0" x2="388.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="388.0" y="300.9" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="512.0" y1="260.0" x2="512.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="512.0" y="300.9" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="481.0" y1="286.0" x2="481.0" y2="312.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="481.0" y="326.9" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="450.0" y="375.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the OH on C5 adds to the C=O of C1,</text>
  <text x="450.0" y="393.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">closing a six-membered ring with O;</text>
  <text x="450.0" y="411.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">this is the alpha form (C1 OH down)</text>
  <rect x="615.0" y="55.0" width="270.0" height="430.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="750.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">fructose: open chain</text>
  <text x="750.0" y="115.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <text x="750.0" y="159.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="750.0" y1="120.0" x2="750.0" y2="144.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="203.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="720.0" y1="198.0" x2="740.0" y2="198.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="760.0" y1="198.0" x2="780.0" y2="198.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="710.0" y="203.2" font-size="15" fill="#d7322f" text-anchor="end" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <text x="790.0" y="203.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="750.0" y1="164.0" x2="750.0" y2="188.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="247.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="720.0" y1="242.0" x2="740.0" y2="242.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="760.0" y1="242.0" x2="780.0" y2="242.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="710.0" y="247.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="790.0" y="247.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="750.0" y1="208.0" x2="750.0" y2="232.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="291.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="720.0" y1="286.0" x2="740.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="760.0" y1="286.0" x2="780.0" y2="286.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="710.0" y="291.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="790.0" y="291.2" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="750.0" y1="252.0" x2="750.0" y2="276.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="750.0" y="335.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <line x1="750.0" y1="296.0" x2="750.0" y2="320.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="762.0" y1="151.5" x2="796.0" y2="151.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="762.0" y1="156.5" x2="796.0" y2="156.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="806.0" y="159.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="750.0" y="400.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">a ketose (C=O on C2)</text>
  <text x="750.0" y="420.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">forms a five-membered ring (furanose)</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
