<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <!-- Roman Urdu lesson only (not a book figure): monomers with C=C that undergo addition polymerisation, as listed in 26.4.1: ethene, propene, phenylethene (styrene) and propenoic acid (copolymer with ethene). -->
  <text x="177.6" y="83.7" font-size="38" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="11.4" font-size="27.4">2</tspan><tspan dy="-11.4">=CH</tspan><tspan dy="11.4" font-size="27.4">2</tspan><tspan dy="-11.4"></tspan></text>
  <text x="260.0" y="136.0" font-size="27" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">ethene</tspan></text>
  <text x="631.0" y="83.7" font-size="38" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="11.4" font-size="27.4">2</tspan><tspan dy="-11.4">=CHCH</tspan><tspan dy="11.4" font-size="27.4">3</tspan><tspan dy="-11.4"></tspan></text>
  <text x="740.0" y="136.0" font-size="27" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">propene</tspan></text>
  <text x="142.4" y="263.7" font-size="38" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="11.4" font-size="27.4">2</tspan><tspan dy="-11.4">=CHC</tspan><tspan dy="11.4" font-size="27.4">6</tspan><tspan dy="-11.4">H</tspan><tspan dy="11.4" font-size="27.4">5</tspan><tspan dy="-11.4"></tspan></text>
  <text x="260.0" y="316.0" font-size="27" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">phenylethene (styrene)</tspan></text>
  <text x="613.0" y="263.7" font-size="38" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="11.4" font-size="27.4">2</tspan><tspan dy="-11.4">=CHCOOH</tspan></text>
  <text x="740.0" y="316.0" font-size="27" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">propenoic acid</tspan></text>
  <text x="740.0" y="352.0" font-size="27" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan dy="0.0">(with ethene: copolymer)</tspan></text>
</svg>
