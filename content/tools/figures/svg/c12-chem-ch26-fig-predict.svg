<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original summary of topic 26.4: monomers with C=C (ethene, propene, phenylethene, propenoic acid) undergo addition polymerisation; monomers with two reactive groups condense: amine + acid or acyl chloride gives a polyamide, alcohol + acid or acyl chloride gives a polyester, losing H2O or HCl. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Predicting the type of polymerisation from the monomers</text>
  <rect x="15.0" y="55.0" width="425.0" height="430.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">C=C present: addition</text>
  <text x="227.0" y="125.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">=CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="227.0" y="151.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">ethene</text>
  <text x="227.0" y="210.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">=CHCH</tspan><tspan dy="5.8" font-size="12.6">3</tspan></text>
  <text x="227.0" y="236.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">propene</text>
  <text x="227.0" y="295.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">=CHC</tspan><tspan dy="5.8" font-size="12.6">6</tspan><tspan dy="-5.8">H</tspan><tspan dy="5.8" font-size="12.6">5</tspan></text>
  <text x="227.0" y="321.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">phenylethene (styrene)</text>
  <text x="227.0" y="380.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">=CHCOOH</tspan></text>
  <text x="227.0" y="406.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">propenoic acid (with ethene: a copolymer)</text>
  <rect x="460.0" y="55.0" width="425.0" height="430.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">two reactive groups: condensation</text>
  <text x="580.0" y="125.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + -COOH</tspan></text>
  <text x="780.0" y="125.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">polyamide + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="580.0" y="195.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-NH</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + -COCl</tspan></text>
  <text x="780.0" y="195.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">polyamide + HCl</tspan></text>
  <text x="580.0" y="265.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-OH + -COOH</tspan></text>
  <text x="780.0" y="265.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">polyester + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="580.0" y="335.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-OH + -COCl</tspan></text>
  <text x="780.0" y="335.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">polyester + HCl</tspan></text>
  <text x="672.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the two groups can be in one molecule</text>
  <text x="672.0" y="443.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(lactic acid, an amino acid) or in two</text>
  <text x="672.0" y="461.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">different monomers (nylon-6,6)</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
