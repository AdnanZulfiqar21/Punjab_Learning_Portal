  <text x="540.8" y="219.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="608.7" y1="185.0" x2="636.6" y2="201.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="659.2" y="219.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <text x="600.0" y="185.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="616.0" y="182.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="618.0" y="116.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="780.0" y="130.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C and O are both sp2</text>
  <text x="780.0" y="151.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">bond angles about 120</text>
  <text x="780.0" y="172.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">O is more electronegative:</text>
  <text x="780.0" y="193.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C delta+, O delta-</text>
