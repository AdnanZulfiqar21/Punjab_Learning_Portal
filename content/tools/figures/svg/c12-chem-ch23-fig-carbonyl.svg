  <text x="510.0" y="505.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">a ketone</text>
  <line x1="530.0" y1="352.0" x2="108.8" y2="352.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100.0 352.0 L110.0 347.4 L110.0 356.6 Z" fill="#1f6fb5"/>
  <text x="545.0" y="357.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">more reactive</text>
  <text x="745.0" y="420.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">alkyl groups push electrons</text>
  <text x="745.0" y="438.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(less delta+) and crowd the</text>
  <text x="745.0" y="456.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">carbon (steric hindrance)</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
