  <text x="82.9" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="138.7" y1="455.0" x2="154.4" y2="464.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="177.1" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="130.0" y="455.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="130.0" y="505.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">methanal</text>
  <line x1="317.0" y1="440.0" x2="317.0" y2="422.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="323.0" y1="440.0" x2="323.0" y2="422.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="320.0" y="407.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="311.3" y1="455.0" x2="295.6" y2="464.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="272.9" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="328.7" y1="455.0" x2="344.4" y2="464.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="367.1" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="320.0" y="455.2" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="320.0" y="505.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">an aldehyde</text>
