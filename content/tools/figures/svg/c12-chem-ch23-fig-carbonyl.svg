  <text x="120.0" y="180.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="136.0" y="177.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="138.0" y="117.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="120.0" y="250.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">aldehyde: RCHO</text>
  <line x1="317.0" y1="165.0" x2="317.0" y2="139.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="323.0" y1="165.0" x2="323.0" y2="139.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="320.0" y="125.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="311.3" y1="180.0" x2="288.7" y2="193.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="266.0" y="211.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="328.7" y1="180.0" x2="351.3" y2="193.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="378.0" y="211.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R'</tspan></text>
  <text x="320.0" y="180.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="336.0" y="177.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="338.0" y="117.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <text x="320.0" y="250.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">ketone: RCOR'</text>
  <rect x="460.0" y="55.0" width="425.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a polar, flat group</text>
  <line x1="597.0" y1="170.0" x2="597.0" y2="138.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="603.0" y1="170.0" x2="603.0" y2="138.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
