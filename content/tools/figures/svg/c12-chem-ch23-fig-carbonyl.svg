  <line x1="513.0" y1="440.0" x2="513.0" y2="422.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="510.0" y="407.2" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="501.3" y1="455.0" x2="485.6" y2="464.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="462.9" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
  <line x1="518.7" y1="455.0" x2="534.4" y2="464.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="557.1" y="481.9" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">R</tspan></text>
