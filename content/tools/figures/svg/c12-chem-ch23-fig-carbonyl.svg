<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topics 23.1 and 23.2.1: general aldehyde RCHO and ketone RCOR'; the flat, polar C=O group (sp2, delta+ C and delta- O); and reactivity towards nucleophiles methanal &gt; aldehyde &gt; ketone. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The carbonyl group</text>
  <rect x="15.0" y="55.0" width="425.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">aldehydes and ketones</text>
  <line x1="117.0" y1="165.0" x2="117.0" y2="139.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="123.0" y1="165.0" x2="123.0" y2="139.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="120.0" y="125.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
