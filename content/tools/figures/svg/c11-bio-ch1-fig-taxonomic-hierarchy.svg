<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.5: nested ranks, each inside the one above. -->
  <g stroke="#0f7a62" stroke-width="4">
    <rect x="40" y="40" width="920" height="920" rx="28" fill="#eaf5f1"/>
    <rect x="100" y="150" width="800" height="750" rx="26" fill="#dcefe7"/>
    <rect x="160" y="260" width="680" height="580" rx="24" fill="#cfe9df"/>
    <rect x="220" y="370" width="560" height="410" rx="22" fill="#c1e2d6"/>
    <rect x="280" y="480" width="440" height="240" rx="20" fill="#b2dbcc"/>
    <rect x="340" y="590" width="320" height="70" rx="18" fill="#a2d3c2"/>
  </g>
  <g font-size="40" font-weight="700" fill="#14181f">
    <text x="80" y="118">Domain</text>
    <text x="140" y="228">Kingdom</text>
    <text x="200" y="338">Phylum</text>
    <text x="260" y="448">Class</text>
    <text x="320" y="558">Order</text>
  </g>
  <g font-size="30" fill="#4b5563">
    <text x="270" y="118">all organisms</text>
  </g>
  <!-- the three innermost ranks are listed in the last box, with arrows showing they continue to nest -->
  <g font-size="36" font-weight="700" fill="#14181f">
    <text x="370" y="640">Family</text>
    <text x="520" y="640">› Genus</text>
    <text x="370" y="760">› Species</text>
  </g>
  <g font-size="30" fill="#4b5563">
    <text x="370" y="805">one kind of organism</text>
  </g>
  <!-- side scale -->
  <g font-size="30" fill="#4b5563" text-anchor="end">
    <text x="950" y="118">broadest</text>
  </g>
  <g font-size="30" fill="#4b5563" text-anchor="end">
    <text x="950" y="945">most specific</text>
  </g>
</svg>
