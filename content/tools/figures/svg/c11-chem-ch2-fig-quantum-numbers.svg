<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Tables 2.3 to 2.5 and Figure 2.4 (spins): shells, subshells, orbitals and the four quantum numbers. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
      .t{font-size:15px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="600" y="34">Shells, subshells and orbitals: the four quantum numbers</text>
  <!-- shells as nested arcs -->
  <g fill="none" stroke-width="3">
    <circle cx="230" cy="300" r="40" stroke="#d7322f"/><circle cx="230" cy="300" r="85" stroke="#d98b2b"/><circle cx="230" cy="300" r="135" stroke="#0f7a62"/><circle cx="230" cy="300" r="190" stroke="#1f6fb5"/>
  </g>
  <circle cx="230" cy="300" r="10" fill="#14181f"/>
  <g font-size="15" font-weight="700" fill="#14181f" text-anchor="middle">
    <text x="257" y="305">K</text><text x="292" y="305">L</text><text x="340" y="305">M</text><text x="392" y="305">N</text>
  </g>
  <g font-size="14" fill="#4b5563">
    <text x="60" y="530"><tspan font-weight="700" fill="#d7322f">K</tspan> n = 1: 1s, 2 electrons</text>
    <text x="60" y="552"><tspan font-weight="700" fill="#d98b2b">L</tspan> n = 2: 2s 2p, 8 electrons</text>
    <text x="60" y="574"><tspan font-weight="700" fill="#0f7a62">M</tspan> n = 3: 3s 3p 3d, 18 electrons</text>
    <text x="60" y="596"><tspan font-weight="700" fill="#1f6fb5">N</tspan> n = 4: 4s 4p 4d 4f, 32 electrons</text>
  </g>
  <!-- quantum numbers -->
  <g class="t">
    <text class="k" x="480" y="90">n, principal: size and energy of the orbital; the shell (K, L, M, N = 1, 2, 3, 4)</text>
    <text x="480" y="112">larger n: larger orbital, higher energy, electron less tightly bound; at most 2n2 electrons</text>
    <text class="k" x="480" y="150">l, azimuthal (angular momentum): shape of the orbital; 0 to n - 1</text>
    <text x="480" y="172">l = 0 s (spherical), 1 p (dumb-bell), 2 d (clover leaf), 3 f (complicated); a subshell holds 2(2l + 1) electrons</text>
    <text class="k" x="480" y="210">m, magnetic: orientation of the orbital in space; -l to +l, so 2l + 1 orbitals in the subshell</text>
    <text x="480" y="232">s 1 orbital; p 3 (m = -1, 0, +1); d 5 (-2 to +2); f 7 (-3 to +3); orbitals of a subshell are degenerate</text>
    <text class="k" x="480" y="270">s, spin: the electron's own spin, +1/2 (arrow up) or -1/2 (arrow down)</text>
    <text x="480" y="292">an orbital takes at most two electrons, and only with opposite spins</text>
  </g>
  <!-- spin pictures -->
  <g>
    <circle cx="520" cy="360" r="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><path d="M520 338 a22 22 0 1 1 -0.1 0" fill="none" stroke="#1f6fb5" stroke-width="2"/><text class="t" x="555" y="355">clockwise, +1/2</text>
    <circle cx="760" cy="360" r="22" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="t" x="795" y="355">anticlockwise, -1/2</text>
    <path d="M520 348 v24 M516 352 l4 -6 l4 6" stroke="#1f6fb5" stroke-width="3" fill="none"/>
    <path d="M760 348 v24 M756 368 l4 6 l4 -6" stroke="#d7322f" stroke-width="3" fill="none"/>
  </g>
  <!-- table -->
  <rect x="480" y="400" width="680" height="190" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="15" fill="#4b5563">
    <text x="500" y="428" font-weight="700" fill="#14181f">Shell</text><text x="580" y="428" font-weight="700" fill="#14181f">n</text><text x="640" y="428" font-weight="700" fill="#14181f">l values</text><text x="760" y="428" font-weight="700" fill="#14181f">Subshells</text><text x="900" y="428" font-weight="700" fill="#14181f">Orbitals</text><text x="1075" y="428" font-weight="700" fill="#14181f">Electrons</text>
    <text x="500" y="456">K</text><text x="580" y="456">1</text><text x="640" y="456">0</text><text x="760" y="456">1s</text><text x="900" y="456">1</text><text x="1075" y="456">2</text>
    <text x="500" y="484">L</text><text x="580" y="484">2</text><text x="640" y="484">0, 1</text><text x="760" y="484">2s, 2p</text><text x="900" y="484">1 + 3 = 4</text><text x="1075" y="484">8</text>
    <text x="500" y="512">M</text><text x="580" y="512">3</text><text x="640" y="512">0, 1, 2</text><text x="760" y="512">3s, 3p, 3d</text><text x="900" y="512">1 + 3 + 5 = 9</text><text x="1075" y="512">18</text>
    <text x="500" y="540">N</text><text x="580" y="540">4</text><text x="640" y="540">0, 1, 2, 3</text><text x="760" y="540">4s, 4p, 4d, 4f</text><text x="900" y="540">1 + 3 + 5 + 7 = 16</text><text x="1075" y="540">32</text>
    <text x="500" y="575">the nth shell has n subshells, n2 orbitals and at most 2n2 electrons</text>
  </g>
  <text class="s" x="600" y="640">Three quantum numbers describe an orbital; the fourth tells the two electrons in it apart. The letters s, p, d, f come from</text>
  <text class="s" x="600" y="662">the spectral terms sharp, principal, diffuse and fundamental; the magnetic number is named for the splitting of lines in a magnetic field.</text>
</svg>
