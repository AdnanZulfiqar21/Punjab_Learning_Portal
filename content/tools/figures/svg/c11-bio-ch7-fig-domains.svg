<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 7.1 and 7.2: domains of a protein, and a drug blocking a virus spike from its receptor. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="blk" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><circle cx="6" cy="6" r="5" fill="none" stroke="#d7322f" stroke-width="2"/><path d="M2.5 2.5 L9.5 9.5" stroke="#d7322f" stroke-width="2"/></marker>
  </defs>
  <text class="h" x="300" y="40">Domains of an enzyme</text>
  <text class="s" x="300" y="68">HIV-1 reverse transcriptase, drawn as two structural units</text>
  <path d="M90 180 q40 -90 150 -80 q110 10 130 90 q10 90 -80 120 q-120 30 -190 -30 q-40 -50 -10 -100 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round"/>
  <path d="M360 200 q60 -70 140 -40 q80 40 50 120 q-40 80 -130 60 q-90 -30 -60 -140 z" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="6" stroke-linejoin="round"/>
  <text class="k" x="220" y="200">Polymerase domain</text><text class="s" x="220" y="226">synthesises DNA</text>
  <text class="k" x="450" y="240">RNase H domain</text><text class="s" x="450" y="266">breaks the RNA strand of</text><text class="s" x="450" y="290">RNA-DNA hybrids</text>
  <circle cx="200" cy="140" r="14" fill="#f2b134" stroke="#8a4b00" stroke-width="3"/><text class="s" x="200" y="178">active site</text>
  <text class="s" x="300" y="400">A domain is a distinct structural unit of a</text><text class="s" x="300" y="424">macromolecule with its own function. Knowing</text><text class="s" x="300" y="448">where each domain is lets drugs target it.</text>
  <!-- virus receptor -->
  <text class="h" x="900" y="40">Blocking the spike from its receptor</text>
  <text class="s" x="900" y="68">SARS-CoV-2 and a human cell</text>
  <circle cx="760" cy="230" r="80" fill="#f3e9d2" stroke="#d98b2b" stroke-width="6"/>
  <g stroke="#8a4b00" stroke-width="5" fill="#d98b2b"><path d="M840 230 h40"/><circle cx="892" cy="230" r="14"/><path d="M820 170 l30 -30"/><circle cx="860" cy="130" r="12"/><path d="M820 290 l30 30"/><circle cx="860" cy="330" r="12"/><path d="M700 160 l-30 -30"/><circle cx="660" cy="120" r="12"/><path d="M700 300 l-30 30"/><circle cx="660" cy="340" r="12"/></g>
  <text class="k" x="760" y="236">virus</text>
  <text class="s" x="905" y="280">spike protein</text>
  <rect x="1000" y="130" width="180" height="220" rx="20" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
  <text class="k" x="1090" y="320">human cell</text>
  <path d="M1000 215 h-30 v30 h30" fill="#fff" stroke="#1f6fb5" stroke-width="5"/>
  <text class="s" x="1060" y="200">receptor</text>
  <path d="M910 230 L960 230" stroke="#4b5563" stroke-width="4" marker-end="url(#blk)"/>
  <rect x="930" y="300" width="60" height="30" rx="8" fill="#d7322f"/><text class="b" x="960" y="321" style="font-size:15px">drug</text>
  <path d="M960 300 L975 245" stroke="#d7322f" stroke-width="3" stroke-dasharray="5 4"/>
  <text class="s" x="900" y="400">The 3D structure of the spike and of its receptor</text><text class="s" x="900" y="424">showed exactly how the virus enters cells. Drugs and</text><text class="s" x="900" y="448">vaccines designed against that structure block the entry.</text>
  <text class="s" x="600" y="520">Structural biology also shows how misfolding causes disease (cystic fibrosis, Parkinson's, Alzheimer's).</text>
  <text class="s" x="600" y="580">Shapes are schematic; the real structures are in the Protein Data Bank.</text>
</svg>
