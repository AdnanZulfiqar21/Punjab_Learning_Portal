<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.5: absorption spectra of the pigments and the action spectrum of photosynthesis. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .n{font-size:17px;fill:#14181f;font-weight:700}
      .a{font-size:16px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#14181f"/></marker>
    <linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.2" stop-color="#2563eb"/><stop offset="0.4" stop-color="#16a34a"/><stop offset="0.6" stop-color="#eab308"/><stop offset="0.8" stop-color="#f97316"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
  </defs>
  <!-- (a) absorption spectrum -->
  <text class="h" x="320" y="40">(a) Absorption spectrum</text>
  <rect x="100" y="470" width="440" height="16" fill="url(#vis)"/>
  <path d="M100 470 V80" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M100 470 H560" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <g class="a"><text x="100" y="515">400</text><text x="210" y="515">500</text><text x="320" y="515">600</text><text x="430" y="515">700</text></g>
  <text class="s" x="320" y="545">wavelength (nm)</text>
  <text class="s" x="40" y="280" transform="rotate(-90 40 280)">absorption of light</text>
  <!-- chlorophyll a: peaks ~430 and ~670 -->
  <path d="M105 440 C 120 300, 125 120, 140 130 C 160 150, 175 420, 220 450 C 300 460, 360 455, 390 420 C 410 350, 420 170, 435 160 C 450 180, 460 400, 500 455" fill="none" stroke="#0f7a62" stroke-width="5"/>
  <!-- chlorophyll b: peaks ~455 and ~640 -->
  <path d="M105 450 C 130 380, 150 160, 170 170 C 190 200, 200 420, 250 452 C 310 462, 340 455, 360 420 C 380 330, 385 240, 395 235 C 410 250, 420 410, 460 455" fill="none" stroke="#1f6fb5" stroke-width="5"/>
  <!-- carotenoids: peaks in blue-green, ~450-500 -->
  <path d="M105 445 C 130 360, 150 220, 180 210 C 210 205, 225 230, 250 300 C 280 400, 320 450, 360 458" fill="none" stroke="#d98b2b" stroke-width="5"/>
  <text class="n" x="150" y="110" style="fill:#0f7a62">chlorophyll a</text>
  <text class="n" x="200" y="155" style="fill:#1f6fb5">chlorophyll b</text>
  <text class="n" x="190" y="200" style="fill:#d98b2b">carotenoids</text>
  <text class="s" x="320" y="590">chlorophylls absorb most at about</text><text class="s" x="320" y="614">430 nm (blue) and 670 nm (red)</text>
  <!-- (b) action spectrum -->
  <text class="h" x="900" y="40">(b) Action spectrum</text>
  <rect x="680" y="470" width="440" height="16" fill="url(#vis)"/>
  <path d="M680 470 V80" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M680 470 H1140" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <g class="a"><text x="680" y="515">400</text><text x="790" y="515">500</text><text x="900" y="515">600</text><text x="1010" y="515">700</text></g>
  <text class="s" x="900" y="545">wavelength (nm)</text>
  <text class="s" x="620" y="280" transform="rotate(-90 620 280)">rate of photosynthesis</text>
  <path d="M685 420 C 700 250, 720 150, 745 150 C 780 160, 800 330, 850 380 C 900 410, 940 400, 970 330 C 990 250, 1000 170, 1020 170 C 1040 190, 1050 380, 1090 455" fill="none" stroke="#d7322f" stroke-width="5"/>
  <text class="n" x="740" y="130" style="fill:#d7322f">photosynthesis</text>
  <text class="s" x="900" y="590">blue and red light are the most effective;</text><text class="s" x="900" y="614">the action spectrum matches the absorption spectrum</text>
  <text class="s" x="600" y="645">Engelmann (1883) made the first action spectrum with Spirogyra: cells lit by blue and red released the most oxygen.</text>
</svg>
