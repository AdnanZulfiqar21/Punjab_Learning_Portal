<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <!-- Roman Urdu figure: the book's sample timeit result as bars - slow code 0.42, fast code 0.09. -->
  <text x="500.0" y="40.0" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Time Comparison Report</text>
  <text x="240.0" y="158.0" font-size="28" fill="#1d2330" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700">Slow code</text>
  <text x="240.0" y="192.0" font-size="24" fill="#6b7280" text-anchor="end" font-family="Consolas, Courier New, monospace">(slow_sum)</text>
  <rect x="260.0" y="120.0" width="630.0" height="80.0" rx="6" fill="#d2452f" stroke="none" stroke-width="0"/>
  <text x="906.0" y="172.0" font-size="30" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">0.42</text>
  <text x="240.0" y="308.0" font-size="28" fill="#1d2330" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700">Fast code</text>
  <text x="240.0" y="342.0" font-size="24" fill="#6b7280" text-anchor="end" font-family="Consolas, Courier New, monospace">(fast_sum)</text>
  <rect x="260.0" y="270.0" width="135.0" height="80.0" rx="6" fill="#2f8f5a" stroke="none" stroke-width="0"/>
  <text x="411.0" y="322.0" font-size="30" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">0.09</text>
  <line x1="260.0" y1="100.0" x2="260.0" y2="400.0" stroke="#1d2330" stroke-width="3" stroke-linecap="round"/>
</svg>
