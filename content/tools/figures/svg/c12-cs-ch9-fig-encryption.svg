<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- Original: HELLO encrypted with a key to KHOOR and decrypted back, with an attacker seeing only the code. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cryptography: encryption and decryption (after 9.2)</text>
  <rect x="35.0" y="105.0" width="150.0" height="50.0" rx="8" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="110.0" y="128.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">HELLO</text>
  <text x="110.0" y="144.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">readable (plaintext)</text>
  <rect x="265.0" y="105.0" width="130.0" height="50.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="330.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">encrypt</text>
  <text x="330.0" y="144.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">with a key</text>
  <rect x="485.0" y="105.0" width="150.0" height="50.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="560.0" y="128.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">KHOOR</text>
  <text x="560.0" y="144.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">coded (ciphertext)</text>
  <rect x="715.0" y="105.0" width="130.0" height="50.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="780.0" y="128.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">decrypt</text>
  <text x="780.0" y="144.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">with the key</text>
  <line x1="186.0" y1="130.0" x2="256.8" y2="130.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M264.0 130.0 L255.8 133.8 L255.8 126.2 Z" fill="#14181f"/>
  <line x1="396.0" y1="130.0" x2="476.8" y2="130.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M484.0 130.0 L475.8 133.8 L475.8 126.2 Z" fill="#14181f"/>
  <line x1="636.0" y1="130.0" x2="706.8" y2="130.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M714.0 130.0 L705.8 133.8 L705.8 126.2 Z" fill="#14181f"/>
  <text x="780.0" y="205.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">HELLO again</text>
  <line x1="560.0" y1="160.0" x2="560.0" y2="233.6" stroke="#d7322f" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <path d="M560.0 240.0 L556.6 232.7 L563.4 232.7 Z" fill="#d7322f"/>
  <text x="560.0" y="262.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">an attacker who intercepts it</text>
  <text x="560.0" y="278.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">sees only KHOOR</text>
  <text x="450.0" y="320.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Toy example: each letter shifted 3 places (key = 3). Real systems use long secret keys and</text>
  <text x="450.0" y="338.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">strong mathematics, as in HTTPS websites, online banking and messaging apps.</text>
  <text x="450.0" y="391" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
