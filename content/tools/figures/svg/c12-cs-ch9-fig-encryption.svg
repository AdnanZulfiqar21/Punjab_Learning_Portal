<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="1100" fill="#ffffff"/>
  <!-- Roman Urdu only: HELLO encrypted with a key to KHOOR and decrypted back to HELLO; an interceptor sees only KHOOR (our own figure). -->
  <rect x="200.0" y="20.0" width="600.0" height="170.0" rx="16" fill="#e6f4ee" stroke="#1f7a5a" stroke-width="4"/>
  <text x="500.0" y="102.0" font-size="64" fill="#1f7a5a" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="700">HELLO</text>
  <text x="500.0" y="160.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">parhne ke qabil data (plaintext)</text>
  <line x1="500.0" y1="196.0" x2="500.0" y2="309.6" stroke="#1d2330" stroke-width="5" stroke-linecap="butt"/>
  <path d="M500.0 330.0 L489.6 308.4 L510.4 308.4 Z" fill="#1d2330"/>
  <text x="530.0" y="268.0" font-size="36" fill="#2a6db0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Encryption (key se)</text>
  <rect x="200.0" y="340.0" width="600.0" height="170.0" rx="16" fill="#fdecea" stroke="#c23a32" stroke-width="4"/>
  <text x="500.0" y="422.0" font-size="64" fill="#c23a32" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="700">KHOOR</text>
  <text x="500.0" y="480.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">coded matn (ciphertext)</text>
  <line x1="500.0" y1="516.0" x2="500.0" y2="629.6" stroke="#1d2330" stroke-width="5" stroke-linecap="butt"/>
  <path d="M500.0 650.0 L489.6 628.4 L510.4 628.4 Z" fill="#1d2330"/>
  <text x="530.0" y="588.0" font-size="36" fill="#2a6db0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Decryption (key se)</text>
  <rect x="200.0" y="660.0" width="600.0" height="170.0" rx="16" fill="#e6f4ee" stroke="#1f7a5a" stroke-width="4"/>
  <text x="500.0" y="742.0" font-size="64" fill="#1f7a5a" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="700">HELLO</text>
  <text x="500.0" y="800.0" font-size="32" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">asal data wapas</text>
  <rect x="200.0" y="900.0" width="600.0" height="170.0" rx="16" fill="#f5f6f8" stroke="#4a5260" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="500.0" y="970.0" font-size="36" fill="#1d2330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Raaste mein pakarne wala</text>
  <text x="500.0" y="1025.0" font-size="34" fill="#c23a32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">sirf KHOOR dekhta hai</text>
  <path d="M800 425 C930 425 930 985 806 985" fill="none" stroke="#4a5260" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 10"/>
  <path d="M806.0 985.0 L825.3 974.5 L825.3 995.5 Z" fill="#4a5260"/>
</svg>
