<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.10: Cu2+ (higher E standard, left) reacts with Zn (lower E standard, right), following a clockwise pattern. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Which way does the reaction go? The clockwise rule</text>
  <rect x="200.0" y="80.0" width="520.0" height="300.0" rx="10" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="120.0" y="150.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">+0.34 V</text>
  <text x="120.0" y="320.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700">-0.76 V</text>
  <line x1="60.0" y1="360.0" x2="60.0" y2="120.4" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <path d="M60.0 110.0 L65.5 121.8 L54.5 121.8 Z" fill="#4b5563"/>
  <text x="44.0" y="235.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700" transform="rotate(-90 44.0 235.0)">E standard</text>
  <text x="290.0" y="150.0" font-size="22" fill="#d7322f" text-anchor="middle" font-weight="700">Cu2+</text>
  <text x="380.0" y="150.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+  2e-  =</text>
  <text x="600.0" y="150.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cu</text>
  <text x="290.0" y="180.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">better oxidant (reacts)</text>
  <text x="600.0" y="180.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">product</text>
  <text x="290.0" y="320.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Zn2+</text>
  <text x="380.0" y="320.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+  2e-  =</text>
  <text x="600.0" y="320.0" font-size="22" fill="#1f6fb5" text-anchor="middle" font-weight="700">Zn</text>
  <text x="600.0" y="286.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">better reductant (reacts)</text>
  <text x="290.0" y="286.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">product</text>
  <path d="M 320 118 Q 450 60 575 118" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M575.0 118.0 L563.4 114.9 L569.9 107.1 Z" fill="#7c3aed"/>
  <path d="M 600 290 Q 600 240 600 200" stroke="#7c3aed" stroke-width="0" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 575 335 Q 450 400 320 335" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M320.0 335.0 L331.6 338.1 L325.1 345.9 Z" fill="#7c3aed"/>
  <text x="450.0" y="425.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Cu2+ + Zn -&gt; Cu + Zn2+: the upper left reacts with the lower right (clockwise)</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
