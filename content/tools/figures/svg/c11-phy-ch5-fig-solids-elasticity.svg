<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="740" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.1 to 5.7 and topics 5.1 to 5.6: classes of solids, stress and strain, Searle's apparatus, the stress-strain curve and strain energy. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="32">Solids: classes, stress and strain, Young's modulus, the stress-strain curve and strain energy</text>
  <!-- classes -->
  <rect x="50" y="55" width="330" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="215" y="83">Three classes of solid (5.1)</text>
  <g fill="#1f6fb5"><circle cx="90" cy="120" r="6"/><circle cx="110" cy="120" r="6"/><circle cx="130" cy="120" r="6"/><circle cx="150" cy="120" r="6"/><circle cx="90" cy="140" r="6"/><circle cx="110" cy="140" r="6"/><circle cx="130" cy="140" r="6"/><circle cx="150" cy="140" r="6"/><circle cx="90" cy="160" r="6"/><circle cx="110" cy="160" r="6"/><circle cx="130" cy="160" r="6"/><circle cx="150" cy="160" r="6"/></g>
  <text class="r" x="70" y="184">crystalline: long-range order</text>
  <g fill="#d98b2b"><circle cx="232" cy="118" r="6"/><circle cx="252" cy="126" r="6"/><circle cx="270" cy="115" r="6"/><circle cx="292" cy="128" r="6"/><circle cx="238" cy="142" r="6"/><circle cx="262" cy="150" r="6"/><circle cx="284" cy="146" r="6"/><circle cx="246" cy="166" r="6"/><circle cx="270" cy="170" r="6"/><circle cx="295" cy="164" r="6"/></g>
  <text class="r" x="226" y="184">amorphous: no order</text>
  <g class="t">
    <text x="70" y="212"><tspan class="b">crystalline:</tspan> metals, ceramics, quartz, calcite, sugar,</text>
    <text x="70" y="228">mica, diamond; studied by XRD and TEM; atoms vibrate</text>
    <text x="70" y="244">about fixed points; definite melting point (abrupt)</text>
    <text x="70" y="266"><tspan class="b">amorphous (glassy):</tspan> like liquids with the disorder frozen in;</text>
    <text x="70" y="282">glass softens gradually (viscous liquid near 800 C); no</text>
    <text x="70" y="298">definite melting point: plastic, glass, fused silicon</text>
    <text x="70" y="320"><tspan class="b">polymeric:</tspan> between order and disorder, partly</text>
    <text x="70" y="336">crystalline; long chains: polythene, polystyrene, nylon, PVC</text>
  </g>
  <!-- stress strain -->
  <rect x="400" y="55" width="400" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Stress, strain and Young's modulus (5.3)</text>
  <rect x="430" y="110" width="140" height="18" fill="#f8c8b8" stroke="#4b5563" stroke-width="1"/>
  <path d="M430 119 H400" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M570 119 H600" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="470" y="146">tensile: length changes</text>
  <rect x="640" y="100" width="50" height="50" fill="#f8c8b8" stroke="#4b5563" stroke-width="1"/>
  <g stroke="#d7322f" stroke-width="2" fill="none"><path d="M665 100 V84" marker-end="url(#p)"/><path d="M665 150 V166" marker-end="url(#p)"/><path d="M640 125 H624" marker-end="url(#p)"/><path d="M690 125 H706" marker-end="url(#p)"/></g>
  <text class="r" x="618" y="182">volume: V to V - delta V</text>
  <path d="M740 150 L760 100 H790 L770 150 Z" fill="#f8c8b8" stroke="#4b5563" stroke-width="1"/>
  <path d="M760 100 H785" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="730" y="166">shear: shape</text>
  <g class="f">
    <text x="420" y="210">stress = F / A  (5.1), pascal (N m^-2)</text>
    <text x="420" y="230">strain = delta L / L  (5.2);  delta V / V  (5.3)</text>
    <text x="420" y="250">gamma = delta x / y = tan theta (5.4) = theta (5.5)</text>
    <text x="420" y="270">Y = stress / strain = (F/A)/(delta L/L) (5.6)</text>
  </g>
  <g class="t">
    <text x="420" y="296">strain is a ratio of lengths, no units; tensile or compressive;</text>
    <text x="420" y="312">Y has the unit of stress (N m^-2 or Pa); named after Thomas Young</text>
    <text x="420" y="328">but developed by Leonhard Euler in 1727</text>
    <text x="420" y="346"><tspan class="b">Example 5.1:</tspan> 10 000 N on a 12 mm wire: 10000/(3.14 x 36 x 10^-6) = 88.46 MPa</text>
  </g>
  <!-- moduli table -->
  <rect x="820" y="55" width="330" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="985" y="83">Table 5.1 Elastic constants (10^9 N m^-2)</text>
  <g class="f" style="font-size:11px">
    <text x="835" y="108">material    Young  Bulk  Shear</text>
    <text x="835" y="126">aluminium    70     70    30</text>
    <text x="835" y="142">bone         15      -    80</text>
    <text x="835" y="158">brass        91     61    36</text>
    <text x="835" y="174">concrete     25      -     -</text>
    <text x="835" y="190">copper      110    140    44</text>
    <text x="835" y="206">diamond    1120    540   450</text>
    <text x="835" y="222">glass        55     31    23</text>
    <text x="835" y="238">ice          14      8     3</text>
    <text x="835" y="254">lead         15    7.7   5.6</text>
    <text x="835" y="270">mercury       0     27     0</text>
    <text x="835" y="286">steel       200    160    84</text>
    <text x="835" y="302">tungsten    390    200   150</text>
    <text x="835" y="318">water         0    2.2     0</text>
  </g>
  <text class="r" x="835" y="342">liquids have no Young's or shear modulus, only a bulk modulus</text>
  <!-- searle -->
  <rect x="50" y="375" width="360" height="340" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="230" y="403">Searle's apparatus (5.4, Fig. 5.4)</text>
  <rect x="80" y="420" width="200" height="8" fill="#4b5563"/>
  <path d="M130 428 V520 M230 428 V520" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="110" y="520" width="40" height="30" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><rect x="210" y="520" width="40" height="30" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M150 535 H210" stroke="#1f6fb5" stroke-width="3"/>
  <rect x="120" y="570" width="20" height="30" fill="#9ca3af"/><rect x="215" y="570" width="30" height="40" fill="#9ca3af"/>
  <path d="M130 550 V570 M230 550 V570" stroke="#4b5563" stroke-width="1.5"/>
  <text class="r" x="60" y="470">reference wire</text><text class="r" x="236" y="470">test wire</text>
  <text class="r" x="150" y="528" style="fill:#1f6fb5">spirit level</text>
  <text class="r" x="60" y="590">constant</text><text class="r" x="60" y="604">weight</text>
  <text class="r" x="250" y="590">hanger with</text><text class="r" x="250" y="604">slotted weights</text>
  <text class="r" x="236" y="508">micrometer screw</text>
  <g class="t">
    <text x="70" y="636">two equal wires of one material on a rigid support;</text>
    <text x="70" y="652">measure L (metre scale) and d (screw gauge, average);</text>
    <text x="70" y="668">level, read the micrometer; add load, re-level, read again:</text>
    <text x="70" y="684">extension; stress = mg/(pi r^2), strain = delta L/L; repeat;</text>
    <text x="70" y="700">the slope of the stress-strain line is Y</text>
  </g>
  <!-- curve -->
  <rect x="430" y="375" width="370" height="340" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="615" y="403">Stress-strain curve, ductile material (Fig. 5.5)</text>
  <path d="M470 660 H770" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470 660 V430" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470 660 L560 530 L600 500 Q 680 440 720 470 L745 500" fill="none" stroke="#d7322f" stroke-width="3"/>
  <circle cx="560" cy="530" r="4" fill="#14181f"/><circle cx="600" cy="500" r="4" fill="#14181f"/><circle cx="700" cy="458" r="4" fill="#14181f"/><circle cx="745" cy="500" r="4" fill="#14181f"/>
  <text class="l" x="540" y="548">A</text><text class="l" x="584" y="494">B</text><text class="l" x="696" y="448">C</text><text class="l" x="752" y="512">D</text>
  <text class="r" x="700" y="676">strain</text><text class="r" x="450" y="428">stress</text>
  <g class="t">
    <text x="450" y="700">O to A: Hooke's law, proportional limit; B: elastic limit, yield point;</text>
  </g>
  <text class="r" x="500" y="640">B to C: plastic; C: ultimate tensile strength; D: fracture</text>
  <!-- strain energy -->
  <rect x="820" y="375" width="330" height="340" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="985" y="403">Strain energy (5.6, Figs. 5.6, 5.7)</text>
  <path d="M850 540 H1000" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M850 540 V430" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M850 540 L960 450 V540 Z" fill="#9ca3af" opacity="0.5"/>
  <path d="M850 540 L960 450" stroke="#d7322f" stroke-width="2.5"/>
  <text class="l" x="964" y="446">P</text><text class="l" x="956" y="556">Q</text><text class="l" x="840" y="556">O</text>
  <text class="r" x="836" y="452">F</text><text class="r" x="900" y="556">delta x</text>
  <text class="r" x="1010" y="500">area OPQ = work</text>
  <g class="f" style="font-size:11px">
    <text x="840" y="582">W = (1/2) F delta x (5.7) = (1/2) k (delta x)^2</text>
    <text x="840" y="600">U/volume = (1/2)(F/A)(delta L/L) (5.8)</text>
    <text x="840" y="618">U = (1/2) stress x strain (5.9)</text>
    <text x="840" y="636">U = (1/2) Y (delta L/L)^2 (5.10)</text>
  </g>
  <g class="t">
    <text x="840" y="662">the force rises uniformly from 0 to F, so the</text>
    <text x="840" y="678">average force is F/2; the work is stored as</text>
    <text x="840" y="694">elastic PE of the displaced molecules</text>
  </g>
  <text class="s" x="600" y="732" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
