<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.5 and 3.6: the walls of two neighbouring plant cells with a plasmodesma. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:20px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect x="60" y="200" width="380" height="420" fill="#eef6fb"/>
  <rect x="560" y="200" width="380" height="420" fill="#eef6fb"/>
  <!-- secondary wall, primary wall, middle lamella, primary wall, secondary wall -->
  <rect x="400" y="200" width="40" height="420" fill="#8a4b00"/>
  <rect x="440" y="200" width="30" height="420" fill="#c9b27a"/>
  <rect x="470" y="200" width="60" height="420" fill="#f3e9d2" stroke="#9ca3af" stroke-width="2"/>
  <rect x="530" y="200" width="30" height="420" fill="#c9b27a"/>
  <rect x="560" y="200" width="40" height="420" fill="#8a4b00"/>
  <g stroke="#6b4a1d" stroke-width="2">
    <path d="M445 230 l20 10 M447 280 l18 -12 M444 340 l22 4 M446 460 l16 14 M445 520 l20 -8 M447 580 l18 10"/>
    <path d="M535 230 l20 -10 M537 290 l18 12 M534 350 l22 -4 M536 470 l16 -14 M535 530 l20 8 M537 590 l18 -10"/>
  </g>
  <!-- plasma membranes -->
  <rect x="380" y="200" width="20" height="420" fill="#1f6fb5"/>
  <rect x="600" y="200" width="20" height="420" fill="#1f6fb5"/>
  <!-- plasmodesma -->
  <rect x="380" y="390" width="240" height="40" fill="#eef6fb"/>
  <rect x="380" y="386" width="240" height="6" fill="#1f6fb5"/>
  <rect x="380" y="428" width="240" height="6" fill="#1f6fb5"/>
  <rect x="380" y="404" width="240" height="12" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="2"/>
  <text class="t" x="110" y="260">Cell A</text>
  <text class="s" x="110" y="290">cytoplasm (protoplast)</text>
  <text class="t" x="760" y="260">Cell B</text>
  <path class="lead" d="M500 230 L500 120"/><text class="t" x="400" y="105">Middle lamella</text><text class="s" x="330" y="135">Mg and Ca pectates; laid first, shared by both cells</text>
  <path class="lead" d="M455 300 L340 178"/><text class="t" x="110" y="130">Primary wall</text><text class="s" x="40" y="160">cellulose, hemicellulose, pectin</text>
  <path class="lead" d="M420 560 L300 700"/><text class="t" x="80" y="735">Secondary wall</text><text class="s" x="60" y="765">lignin; made inside the primary wall after maturation</text>
  <path class="lead" d="M610 560 L760 700"/><text class="t" x="640" y="735">Plasma membrane</text>
  <path class="lead" d="M500 410 L700 470"/><text class="t" x="640" y="500">Plasmodesma</text><text class="s" x="640" y="530">cytoplasm-to-cytoplasm channel</text>
  <text class="s" x="640" y="556">with a strand of ER inside</text>
</svg>
