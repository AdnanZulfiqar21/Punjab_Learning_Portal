<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" font-family="Times New Roman, Georgia, serif">
  <!-- Mass in grams, moles and number of particles (original drawing after the scheme printed on p77 of the textbook) -->
  <rect width="1180" height="330" fill="#ffffff"/>
  <rect x="30.0" y="140.0" width="270.0" height="150.0" rx="0" stroke="#26408b" stroke-width="3" fill="#ffffff"/>
  <rect x="40.0" y="150.0" width="250.0" height="130.0" rx="0" stroke="none" stroke-width="0" fill="#26408b"/>
  <text x="165.0" y="207.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Mass in</tspan></text>
  <text x="165.0" y="247.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>grams</tspan></text>
  <rect x="455.0" y="140.0" width="270.0" height="150.0" rx="0" stroke="#26408b" stroke-width="3" fill="#ffffff"/>
  <rect x="465.0" y="150.0" width="250.0" height="130.0" rx="0" stroke="none" stroke-width="0" fill="#26408b"/>
  <text x="590.0" y="227.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Moles</tspan></text>
  <rect x="880.0" y="140.0" width="270.0" height="150.0" rx="0" stroke="#26408b" stroke-width="3" fill="#ffffff"/>
  <rect x="890.0" y="150.0" width="250.0" height="130.0" rx="0" stroke="none" stroke-width="0" fill="#26408b"/>
  <text x="1015.0" y="207.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>No. of</tspan></text>
  <text x="1015.0" y="247.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Particles</tspan></text>
  <path d="M445.0 224.0 L354.0 224.0 L354.0 206.0 L312.0 240.0 L354.0 274.0 L354.0 256.0 L445.0 256.0 Z" stroke="#555555" stroke-width="2.5" fill="#e6e6e6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M735.0 224.0 L826.0 224.0 L826.0 206.0 L868.0 240.0 L826.0 274.0 L826.0 256.0 L735.0 256.0 Z" stroke="#555555" stroke-width="2.5" fill="#e6e6e6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="378.0" y="72.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>&#215; Molar</tspan></text>
  <text x="378.0" y="112.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>mass</tspan></text>
  <text x="803.0" y="72.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>&#215; Avogadro&#8217;s</tspan></text>
  <text x="803.0" y="112.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>number</tspan></text>
</svg>
