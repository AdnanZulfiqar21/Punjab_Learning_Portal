<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 10.11, Table 10.1, topics 10.18 to 10.22.2, Table 10.2 and Figure 10.12: concentration and E, the Nernst equation, the activity series, photovoltaic cells and BOD against DO. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .r{font-size:12px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Concentration and E, the Nernst equation, the activity series, and BOD against DO</text>
  <!-- graph -->
  <text class="k" x="320" y="66">E cell against log[Ag+] for Cu + 2Ag+ gives Cu2+ + 2Ag (after Figure 10.11)</text>
  <path d="M90 300 V90 M90 300 H420" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <g class="r" text-anchor="end"><text x="84" y="304">0</text><text x="84" y="262">0.1</text><text x="84" y="220">0.2</text><text x="84" y="178">0.3</text><text x="84" y="136">0.4</text><text x="84" y="94">0.5</text></g>
  <g class="r" text-anchor="middle"><text x="90" y="318">-8</text><text x="170" y="318">-6</text><text x="250" y="318">-4</text><text x="330" y="318">-2</text><text x="410" y="318">0</text></g>
  <text class="s" x="250" y="338">log [Ag+]</text>
  <text class="t" x="40" y="195" transform="rotate(-90 40 195)" style="text-anchor:middle">E cell / V</text>
  <path d="M90 296 L410 107" stroke="#d7322f" stroke-width="3" fill="none"/>
  <path d="M410 107 H90" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="410" cy="107" r="5" fill="#14181f"/>
  <text class="r" x="300" y="100" style="font-weight:700;fill:#14181f">E standard cell = +0.46 V at [Ag+] = 1</text>
  <text class="r" x="150" y="250">raising [Ag+] makes E cell more positive</text>
  <!-- Nernst -->
  <rect x="50" y="355" width="540" height="162" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="383">Nernst equation (10.19) and Table 10.1 (10.18)</text>
  <g class="f">
    <text x="70" y="410">E = E0 + (RT / zF) ln ([oxidised] / [reduced])</text>
    <text x="70" y="430">E = E0 + (0.059 / z) log ([oxidised] / [reduced])  at 298 K</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="454">R = 8.314 J K-1 mol-1, F = 96500 C mol-1, z = electrons transferred, ln x = 2.303 log x</text>
    <text x="70" y="470">Zn in 0.1 M Zn2+: E = -0.76 + 0.0128 ln 0.1 = -0.76 - 0.029 = -0.79 V (print -0.78 V)</text>
    <text x="70" y="486">Fe3+ + e- = Fe2+ (+0.77 V, Table 10.1): more Fe3+ or less Fe2+ gives +0.85 V;</text><text x="70" y="502">less Fe3+ or more Fe2+ gives +0.70 V</text>
  </g>
  <!-- BOD -->
  <rect x="50" y="525" width="540" height="160" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="553">BOD, DO and the Winkler method (10.27, after Figure 10.12)</text>
  <path d="M70 660 H250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="r" x="160" y="674" style="text-anchor:middle;font-size:10px">direction of river flow</text>
  <path d="M70 585 C 110 585, 130 640, 160 640 C 190 640, 220 600, 250 590" stroke="#1f6fb5" stroke-width="2.5" fill="none"/>
  <path d="M70 640 C 110 640, 130 585, 160 585 C 190 585, 220 625, 250 635" stroke="#d7322f" stroke-width="2.5" fill="none"/>
  <text class="r" x="76" y="580" style="fill:#1f6fb5;font-size:10px;font-weight:700">DO</text>
  <text class="r" x="76" y="652" style="fill:#d7322f;font-size:10px;font-weight:700">BOD</text>
  <g class="t" style="font-size:12px">
    <text x="258" y="578" style="font-size:11px">BOD: oxygen used in 5 days by microbial oxidation</text>
    <text x="258" y="594" style="font-size:11px">of dissolved organic matter (sealed, dark, 25 C)</text>
    <text x="258" y="612" style="font-size:11px">DO: from air or photosynthesis, 5 to 8 mg dm-3;</text>
    <text x="258" y="628" style="font-size:11px">below 5 mg dm-3: polluted; as BOD rises, DO falls</text>
    <text x="258" y="646" style="font-size:11px">Winkler: DO oxidises KI to I2; titrate with sodium</text>
    <text x="258" y="662" style="font-size:11px">thiosulfate, starch indicator; I2 proportional to DO</text>
  </g>
  <!-- activity series -->
  <rect x="620" y="55" width="530" height="470" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="885" y="83">Activity series of metals (Table 10.2, E standard in volts)</text>
  <g class="r">
    <g font-weight="700" fill="#14181f"><text x="650" y="108">Metal</text><text x="710" y="108">Ion</text><text x="800" y="108" text-anchor="end">E0 / V</text><text x="830" y="108">Reaction</text></g>
    <text x="650" y="128">Li</text><text x="710" y="128">Li+</text><text x="800" y="128" text-anchor="end">-3.05</text>
    <text x="650" y="146">K</text><text x="710" y="146">K+</text><text x="800" y="146" text-anchor="end">-2.93</text>
    <text x="650" y="164">Ba</text><text x="710" y="164">Ba2+</text><text x="800" y="164" text-anchor="end">-2.90</text>
    <text x="650" y="182">Sr</text><text x="710" y="182">Sr2+</text><text x="800" y="182" text-anchor="end">-2.89</text>
    <text x="650" y="200">Ca</text><text x="710" y="200">Ca2+</text><text x="800" y="200" text-anchor="end">-2.87</text>
    <text x="650" y="218">Na</text><text x="710" y="218">Na+</text><text x="800" y="218" text-anchor="end">-2.71</text>
    <text x="650" y="236">Mg</text><text x="710" y="236">Mg2+</text><text x="800" y="236" text-anchor="end">-2.37</text>
    <text x="650" y="254">Al</text><text x="710" y="254">Al3+</text><text x="800" y="254" text-anchor="end">-1.66</text>
    <text x="650" y="272">Zn</text><text x="710" y="272">Zn2+</text><text x="800" y="272" text-anchor="end">-0.76</text>
    <text x="650" y="290">Cr</text><text x="710" y="290">Cr3+</text><text x="800" y="290" text-anchor="end">-0.74</text>
    <text x="650" y="308">Fe</text><text x="710" y="308">Fe2+</text><text x="800" y="308" text-anchor="end">-0.44</text>
    <text x="650" y="326">Cd</text><text x="710" y="326">Cd2+</text><text x="800" y="326" text-anchor="end">-0.40</text>
    <text x="650" y="344">Co</text><text x="710" y="344">Co2+</text><text x="800" y="344" text-anchor="end">-0.28</text>
    <text x="650" y="362">Ni</text><text x="710" y="362">Ni2+</text><text x="800" y="362" text-anchor="end">-0.25</text>
    <text x="650" y="380">Sn</text><text x="710" y="380">Sn2+</text><text x="800" y="380" text-anchor="end">-0.14</text>
    <text x="650" y="398">Pb</text><text x="710" y="398">Pb2+</text><text x="800" y="398" text-anchor="end">-0.13</text>
    <text x="650" y="416" font-weight="700">H2</text><text x="710" y="416">H+</text><text x="800" y="416" text-anchor="end">0.00</text>
    <text x="650" y="434">Cu</text><text x="710" y="434">Cu2+</text><text x="800" y="434" text-anchor="end">+0.34</text>
    <text x="650" y="452">Hg</text><text x="710" y="452">Hg2+</text><text x="800" y="452" text-anchor="end">+0.92</text>
    <text x="650" y="470">Ag</text><text x="710" y="470">Ag+</text><text x="800" y="470" text-anchor="end">+0.80</text>
    <text x="650" y="488">Pt</text><text x="710" y="488">Pt2+</text><text x="800" y="488" text-anchor="end">+1.18</text>
    <text x="650" y="506">Au</text><text x="710" y="506">Au3+</text><text x="800" y="506" text-anchor="end">+1.50</text>
  </g>
  <path d="M640 114 H1130" stroke="#9ca3af" stroke-width="1"/>
  <g class="r">
    <text x="830" y="150">react with cold water, replacing hydrogen:</text>
    <text x="830" y="166">2M + 2H2O gives 2MOH + H2</text>
    <text x="830" y="231">react with steam, not cold water:</text><text x="830" y="246">M + H2O gives MO + H2</text>
    <text x="830" y="320">do not react with water; react with acids,</text>
    <text x="830" y="336">replacing hydrogen: M + 2HCl gives MCl2 + H2</text>
    <text x="830" y="416">hydrogen included as the reference</text>
    <text x="830" y="470">unreactive with water or acids</text>
  </g>
  <path d="M1100 125 V505" stroke="#d7322f" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="1112" y="320" transform="rotate(90 1112 320)" style="text-anchor:middle;fill:#d7322f;font-weight:700">decreasing ease of oxidation, reactivity and reducing power</text>
  <text class="s" x="885" y="520" style="font-size:11px">printed order kept (Hg +0.92 above Ag +0.80); a higher metal displaces a lower one from solution</text>
  <!-- PV -->
  <rect x="620" y="545" width="530" height="140" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="885" y="573">Photovoltaic cells (10.22): light energy to electrical energy</text>
  <g class="t" style="font-size:12px">
    <text x="640" y="598">photovoltaic effect: photons excite electrons from the valence band to the</text>
    <text x="640" y="614">conduction band of a semiconductor; a PN junction separates electrons</text>
    <text x="640" y="630">and holes, creating a voltage that drives a current</text>
    <text x="640" y="652">merits: works as long as light is present; renewable; uses the sun's</text>
    <text x="640" y="668">energy, independent of fossil fuels</text>
  </g>
</svg>
