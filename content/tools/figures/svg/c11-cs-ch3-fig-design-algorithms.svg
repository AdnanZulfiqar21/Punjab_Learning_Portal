  <text class="r" x="640" y="162">step 1: 43 &lt; 78: search the right half</text>
  <rect x="640" y="190" width="54" height="32" rx="6" fill="#eef0f3" stroke="#c4c9d0" stroke-width="1.5"/>
  <text class="r" x="661" y="210">21</text>
  <rect x="702" y="190" width="54" height="32" rx="6" fill="#eef0f3" stroke="#c4c9d0" stroke-width="1.5"/>
  <text class="r" x="723" y="210">34</text>
  <rect x="764" y="190" width="54" height="32" rx="6" fill="#eef0f3" stroke="#c4c9d0" stroke-width="1.5"/>
  <text class="r" x="785" y="210">43</text>
  <rect x="826" y="190" width="54" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="847" y="210">57</text>
