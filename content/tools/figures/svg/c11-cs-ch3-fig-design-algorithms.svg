  <path d="M200 297 L320 318" stroke="#0f7a62" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M440 297 L320 318" stroke="#0f7a62" stroke-width="1.4" marker-end="url(#g)"/>
  <text class="r" x="70" y="145" style="fill:#d98b2b">divide</text>
  <text class="r" x="70" y="255" style="fill:#0f7a62">merge</text>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="880" y="83">Binary search for 78 in a sorted list (3.7.2)</text>
  <rect x="640" y="110" width="54" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="661" y="130">21</text>
  <rect x="702" y="110" width="54" height="32" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
