  <text class="h" x="600" y="32">Algorithm design techniques, sorting, searching and graph traversal</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="83">Divide and conquer: merge sort (3.6.1)</text>
