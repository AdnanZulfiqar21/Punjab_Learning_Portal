<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Arial, Helvetica, sans-serif">
  <!-- Chapter 20 exercise, Constructed Response Q3(c) (C12-CHEM, PDF p74): benzoic acid + HNO3, with H2SO4 over the arrow, gives 3-nitrobenzoic acid (COOH at the top, NO2 at position 3) + H2O, names in pink. -->
  <rect width="800" height="280" fill="#ffffff"/>
  <polygon points="110.0,104.0 149.8,127.0 149.8,173.0 110.0,196.0 70.2,173.0 70.2,127.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="110.0" cy="150.0" r="28.5" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="110.0" y1="104.0" x2="110.0" y2="70.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="110.0" y="62.0" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">COOH</text>
  <text x="110.0" y="250.0" font-size="22" fill="#c2185b" text-anchor="middle" font-weight="bold">benzoic acid</text>
  <text x="240.0" y="160.0" font-size="24" fill="#111" text-anchor="middle" font-weight="bold">+ HNO<tspan baseline-shift="sub" font-size="75%">3</tspan></text>
  <text x="400.0" y="135.0" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">H<tspan baseline-shift="sub" font-size="75%">2</tspan>SO<tspan baseline-shift="sub" font-size="75%">4</tspan></text>
  <line x1="330" y1="150" x2="458" y2="150" stroke="#111" stroke-width="3"/><path d="M456 143 L 470 150 L 456 157 Z" fill="#111"/>
  <polygon points="570.0,104.0 609.8,127.0 609.8,173.0 570.0,196.0 530.2,173.0 530.2,127.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="570.0" cy="150.0" r="28.5" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="570.0" y1="104.0" x2="570.0" y2="70.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="570.0" y="62.0" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">COOH</text>
  <line x1="609.8" y1="173.0" x2="635.8" y2="188.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="661.8" y="202.0" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">NO<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
  <text x="700.0" y="160.0" font-size="24" fill="#111" text-anchor="middle" font-weight="bold">+ H<tspan baseline-shift="sub" font-size="75%">2</tspan>O</text>
  <text x="570.0" y="250.0" font-size="22" fill="#c2185b" text-anchor="middle" font-weight="bold">3-nitrobenzoic acid</text>
</svg>
