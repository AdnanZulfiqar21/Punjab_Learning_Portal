  <text x="690.0" y="92.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700">closed (Gaussian) surface</text>
  <rect x="110.0" y="405.0" width="680.0" height="36.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="450.0" y="429.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">total flux = (q1 + q2 + q3 + ... ) / epsilon0 = (sum of enclosed charge) / epsilon0</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
