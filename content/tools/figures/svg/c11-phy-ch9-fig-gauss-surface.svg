  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 9.14: several charges inside a closed surface; the total flux equals the enclosed charge over epsilon0. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Gauss's law: flux through a closed surface</text>
  <path d="M200 220 C 180 100 380 70 470 110 C 600 60 720 150 690 240 C 670 340 520 380 400 350 C 260 380 210 320 200 220 Z" stroke="#7c3aed" stroke-width="3" fill="#f3edfd" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="300.0" cy="180.0" r="14.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <line x1="293.7" y1="180.0" x2="306.3" y2="180.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="300.0" y1="173.7" x2="300.0" y2="186.3" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="318.0" y="168.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">q1</text>
  <circle cx="420.0" cy="150.0" r="14.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <line x1="413.7" y1="150.0" x2="426.3" y2="150.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="420.0" y1="143.7" x2="420.0" y2="156.3" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="438.0" y="138.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">q2</text>
  <circle cx="560.0" cy="170.0" r="14.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <line x1="553.7" y1="170.0" x2="566.3" y2="170.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <text x="578.0" y="158.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">q3</text>
  <circle cx="360.0" cy="280.0" r="14.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <line x1="353.7" y1="280.0" x2="366.3" y2="280.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <line x1="360.0" y1="273.7" x2="360.0" y2="286.3" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <text x="378.0" y="268.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">q4</text>
  <circle cx="520.0" cy="290.0" r="14.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <line x1="513.7" y1="290.0" x2="526.3" y2="290.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <text x="538.0" y="278.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">q5</text>
  <circle cx="620.0" cy="240.0" r="14.0" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <line x1="613.7" y1="240.0" x2="626.3" y2="240.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
