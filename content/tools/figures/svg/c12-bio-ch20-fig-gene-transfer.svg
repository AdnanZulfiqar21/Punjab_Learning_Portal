  <text x="155.0" y="293.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">electric pulse opens pores</text>
  <rect x="307.0" y="55.0" width="280.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="447.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">microinjection</text>
  <rect x="377.0" y="130.0" width="140.0" height="110.0" rx="24" stroke="#15803d" stroke-width="3" fill="#ecfdf5"/>
  <ellipse cx="447.0" cy="185.0" rx="58.0" ry="44.0" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
