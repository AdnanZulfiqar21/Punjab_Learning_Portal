  <text x="447.0" y="293.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">fine needle into the nucleus</text>
  <rect x="599.0" y="55.0" width="280.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="739.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">biolistic (gene gun)</text>
