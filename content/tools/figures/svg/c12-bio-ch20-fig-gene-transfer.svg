  <circle cx="407.0" cy="460.0" r="11.0" stroke="#0e7490" stroke-width="1.5" fill="#ffffff" stroke-dasharray="3 2"/>
  <text x="447.0" y="563.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">DNA + chemical, endocytosis</text>
