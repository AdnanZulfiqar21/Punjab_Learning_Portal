<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.17: an amino acid, ATP and its matching tRNA are joined by aminoacyl-tRNA synthetase into an aminoacyl-tRNA. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Activation of amino acids (making aminoacyl-tRNA)</text>
  <circle cx="90.0" cy="170.0" r="26.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="90.0" y="175.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">amino</text>
  <text x="90.0" y="230.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">amino acid</text>
  <text x="150.0" y="176.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <rect x="185.0" y="150.0" width="70.0" height="40.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="220.0" y="176.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">ATP</text>
  <text x="285.0" y="176.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <rect x="328.0" y="130.0" width="44.0" height="60.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="310.7" y="190.0" width="78.6" height="22.0" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="350.0" y="206.0" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">anticodon</text>
  <line x1="350.0" y1="130.0" x2="350.0" y2="118.0" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <text x="350.0" y="245.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">matching tRNA</text>
  <line x1="410.0" y1="170.0" x2="510.4" y2="170.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M520.0 170.0 L509.1 175.1 L509.1 164.9 Z" fill="#14181f"/>
  <ellipse cx="465.0" cy="110.0" rx="70.0" ry="30.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="465.0" y="114.2" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">synthetase</text>
  <text x="465.0" y="214.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">aminoacyl-tRNA synthetase</text>
  <text x="465.0" y="232.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">(20 kinds: one per amino acid)</text>
  <rect x="598.0" y="140.0" width="44.0" height="60.0" rx="8" stroke="#0e7490" stroke-width="2" fill="#cffafe"/>
  <rect x="580.7" y="200.0" width="78.6" height="22.0" rx="4" stroke="#0e7490" stroke-width="2" fill="#ffffff"/>
  <text x="620.0" y="216.0" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">anticodon</text>
  <line x1="620.0" y1="140.0" x2="620.0" y2="128.0" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <circle cx="620.0" cy="116.0" r="13.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="620.0" y="120.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700">aa</text>
  <text x="620.0" y="250.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">aminoacyl-tRNA</text>
  <text x="620.0" y="268.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(aa-tRNA)</text>
  <rect x="40.0" y="300.0" width="820.0" height="90.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="328.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Each synthetase recognises one amino acid and the tRNAs whose anticodons code for it,</text>
  <text x="60.0" y="352.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">and joins them; the aa-tRNA then carries its amino acid to the ribosome.</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
