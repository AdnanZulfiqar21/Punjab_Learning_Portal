<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.14: a Y-shaped antibody of two heavy and two light chains held by disulfide bridges, with constant regions and variable regions at the tips of the arms forming two antigen-binding sites. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Structure of an antibody</text>
  <line x1="346.0" y1="320.0" x2="346.0" y2="500.0" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
  <line x1="374.0" y1="320.0" x2="374.0" y2="500.0" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
  <line x1="346.0" y1="320.0" x2="240.0" y2="190.0" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
  <line x1="374.0" y1="320.0" x2="480.0" y2="190.0" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
  <line x1="310.0" y1="300.0" x2="210.0" y2="180.0" stroke="#16a34a" stroke-width="18" stroke-linecap="round"/>
  <line x1="410.0" y1="300.0" x2="510.0" y2="180.0" stroke="#16a34a" stroke-width="18" stroke-linecap="round"/>
  <line x1="240.0" y1="190.0" x2="276.0" y2="234.0" stroke="#d98b2b" stroke-width="19" stroke-linecap="butt"/>
  <line x1="480.0" y1="190.0" x2="444.0" y2="234.0" stroke="#d98b2b" stroke-width="19" stroke-linecap="butt"/>
  <line x1="210.0" y1="180.0" x2="246.0" y2="222.0" stroke="#d98b2b" stroke-width="19" stroke-linecap="butt"/>
  <line x1="510.0" y1="180.0" x2="474.0" y2="222.0" stroke="#d98b2b" stroke-width="19" stroke-linecap="butt"/>
  <line x1="352.0" y1="350.0" x2="368.0" y2="350.0" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <line x1="352.0" y1="364.0" x2="368.0" y2="364.0" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <line x1="286.0" y1="268.0" x2="302.0" y2="280.0" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <line x1="434.0" y1="268.0" x2="418.0" y2="280.0" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <circle cx="210.0" cy="140.0" r="18.0" stroke="#d7322f" stroke-width="2" fill="#fecaca"/>
  <circle cx="510.0" cy="140.0" r="18.0" stroke="#d7322f" stroke-width="2" fill="#fecaca"/>
  <text x="560.0" y="125.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">antigen-binding site</text>
  <line x1="556.0" y1="120.0" x2="510.0" y2="152.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="510.0" cy="152.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="140.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(variable regions of a heavy</text>
  <text x="560.0" y="156.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">and a light chain together)</text>
  <text x="560.0" y="215.0" font-size="13" fill="#d98b2b" text-anchor="start" font-weight="700">variable region (differs</text>
  <line x1="556.0" y1="210.0" x2="464.0" y2="208.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="464.0" cy="208.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="230.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">between antibodies)</text>
  <text x="560.0" y="285.0" font-size="13" fill="#16a34a" text-anchor="start" font-weight="700">light chain</text>
  <line x1="556.0" y1="280.0" x2="468.0" y2="250.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="468.0" cy="250.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="345.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">heavy chain</text>
  <line x1="556.0" y1="340.0" x2="384.0" y2="380.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="384.0" cy="380.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="405.0" font-size="13" fill="#ca8a04" text-anchor="start" font-weight="700">disulfide bridges</text>
  <line x1="556.0" y1="400.0" x2="370.0" y2="360.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="370.0" cy="360.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="465.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">constant region (same in</text>
  <line x1="556.0" y1="460.0" x2="384.0" y2="460.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="384.0" cy="460.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="480.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">antibodies of one class)</text>
  <text x="60.0" y="470.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Y-shaped protein:</text>
  <text x="60.0" y="490.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">2 heavy + 2 light chains</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
