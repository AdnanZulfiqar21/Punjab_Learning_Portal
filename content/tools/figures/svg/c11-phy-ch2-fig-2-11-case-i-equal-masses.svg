  <text x="340.0" y="278.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="240.0" y="324.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="700">Before collision</text>
  <circle cx="520.0" cy="480.0" r="52.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="477.5" y1="402.0" x2="546.5" y2="402.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M562.5 402.0 L542.5 410.4 L542.5 393.6 Z" fill="#1a1a1a"/>
