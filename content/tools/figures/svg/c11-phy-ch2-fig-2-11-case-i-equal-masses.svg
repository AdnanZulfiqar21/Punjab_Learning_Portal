  <text x="140.0" y="278.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="340.0" cy="190.0" r="52.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <line x1="297.5" y1="112.0" x2="366.5" y2="112.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M382.5 112.0 L362.5 120.4 L362.5 103.6 Z" fill="#1a1a1a"/>
