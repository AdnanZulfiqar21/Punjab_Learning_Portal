  <text x="520.0" y="568.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
