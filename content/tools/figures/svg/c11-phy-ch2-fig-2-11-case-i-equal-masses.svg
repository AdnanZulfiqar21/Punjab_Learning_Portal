  <circle cx="140.0" cy="190.0" r="52.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="80.0" y1="112.0" x2="184.0" y2="112.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
