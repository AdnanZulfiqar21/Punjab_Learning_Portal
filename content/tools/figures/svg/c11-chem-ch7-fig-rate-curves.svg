<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 7.1 and 7.2 and Table 7.1: concentration against time for a reactant and a product, and the tangent method on the HI data. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Rate of reaction: concentration against time</text>
  <!-- left: A to B -->
  <text class="k" x="300" y="70">A gives B (Figure 7.1)</text>
  <path d="M80 440 V90 M80 440 H540" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="40" y="265" transform="rotate(-90 40 265)" text-anchor="middle">concentration</text>
  <text class="s" x="310" y="465">time</text>
  <path d="M80 120 C 150 120, 200 330, 520 400" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M80 420 C 150 420, 200 210, 520 140" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <text class="t" x="440" y="395" style="fill:#d7322f">[A], reactant falls</text>
  <text class="t" x="430" y="135" style="fill:#1f6fb5">[B], product rises</text>
  <g class="t">
    <text x="60" y="500">rate = change in concentration / time taken = delta x / delta t</text>
    <text x="60" y="520">rate = - delta[A] / delta t = + delta[B] / delta t (minus for a falling reactant)</text>
    <text x="60" y="540">units mol dm-3 s-1 (or per min, per h for slow reactions; pressure for gases)</text>
    <text x="60" y="568">steepest at the start, flattening with time, parallel at completion:</text>
    <text x="60" y="586">the rate changes every moment; instantaneous rate = slope at one instant,</text>
    <text x="60" y="604">average rate = change over an interval (Haber sample: 2.7 / 3.0 = 0.90 mol dm-3 min-1)</text>
  </g>
  <!-- right: HI decomposition with tangent -->
  <text class="k" x="880" y="70">2HI gives H2 + I2 at 500 degrees C (Figure 7.2, Table 7.1)</text>
  <path d="M660 440 V90 M660 440 H1140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="620" y="265" transform="rotate(-90 620 265)" text-anchor="middle">[HI] in mol dm-3</text>
  <text class="s" x="900" y="465">time in s</text>
  <g class="s" style="font-size:11px"><text x="660" y="455">0</text><text x="735" y="455">50</text><text x="810" y="455">100</text><text x="885" y="455">150</text><text x="960" y="455">200</text><text x="1035" y="455">250</text><text x="1110" y="455">300</text></g>
  <g class="t" style="font-size:11px" text-anchor="end"><text x="652" y="124">0.10</text><text x="652" y="282">0.05</text><text x="652" y="444">0</text></g>
  <!-- points: y = 440 - c*3200 -->
  <path d="M660 120 L735 211 L810 261 L885 294 L960 316 L1035 332 L1110 345" fill="none" stroke="#d7322f" stroke-width="3"/>
  <g fill="#d7322f"><circle cx="660" cy="120" r="5"/><circle cx="735" cy="211" r="5"/><circle cx="810" cy="261" r="5"/><circle cx="885" cy="294" r="5"/><circle cx="960" cy="316" r="5"/><circle cx="1035" cy="332" r="5"/><circle cx="1110" cy="345" r="5"/></g>
  <!-- tangent at 100 s: slope 0.04 per 100 s -> 128 px per 150 px -->
  <path d="M700 167 L960 389" stroke="#1f6fb5" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M735 197 V325 H885" fill="none" stroke="#0f7a62" stroke-width="2"/>
  <g class="t" style="font-size:12px"><text x="740" y="270" style="fill:#0f7a62">0.04 mol dm-3</text><text x="780" y="342" style="fill:#0f7a62">100 s</text><text x="975" y="398" style="fill:#1f6fb5">tangent at 100 s</text></g>
  <g class="t">
    <text x="640" y="500">draw a tangent at the chosen time and complete a right-angled triangle:</text>
    <text x="640" y="520">rate at 100 s = 0.04 mol dm-3 / 100 s = 4 x 10^-4 mol dm-3 s-1</text>
    <text x="640" y="540">a product curve (H2 or I2) rises and gives the same rate</text>
    <text x="640" y="568">Table 7.1 (mol dm-3 at 0, 50 ... 300 s): 0.100, 0.0716, 0.0558,</text>
    <text x="640" y="586">0.0457, 0.0387, 0.0336, 0.0296; the slope, and so the rate,</text>
    <text x="640" y="604">is greatest at the highest concentration and falls with time</text>
  </g>
</svg>
