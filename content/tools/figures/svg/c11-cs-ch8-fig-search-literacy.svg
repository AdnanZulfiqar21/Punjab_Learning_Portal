<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 8.1: Venn diagrams for AND, OR and NOT searches with the book's examples, five types of online research and five components of digital literacy. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Searching well: Boolean operators, research types and digital literacy</text>
  <rect x="50" y="55" width="1100" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Boolean operators narrow or widen a search (8.1.5)</text>
  <clipPath id="cl0"><circle cx="185" cy="215" r="75"/></clipPath>
  <clipPath id="cr0"><circle cx="275" cy="215" r="75"/></clipPath>
  <circle cx="275" cy="215" r="75" fill="#1f6fb5" fill-opacity="0.55" clip-path="url(#cl0)"/>
  <circle cx="185" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <circle cx="275" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <text class="r" x="145" y="219" style="text-anchor:middle">agriculture</text>
  <text class="r" x="315" y="219" style="text-anchor:middle">irrigation</text>
  <text class="l" x="230" y="112" style="fill:#1f6fb5;text-anchor:middle">AND</text>
  <text class="f" x="230" y="318" style="text-anchor:middle">agriculture AND irrigation</text>
  <text class="r" x="230" y="340" style="text-anchor:middle">pages with both words</text>
  <clipPath id="cl1"><circle cx="555" cy="215" r="75"/></clipPath>
  <clipPath id="cr1"><circle cx="645" cy="215" r="75"/></clipPath>
  <circle cx="555" cy="215" r="75" fill="#1f6fb5" fill-opacity="0.55"/>
  <circle cx="645" cy="215" r="75" fill="#1f6fb5" fill-opacity="0.55" clip-path="url(#cl1)" style="opacity:0"/>
  <circle cx="645" cy="215" r="75" fill="#1f6fb5" fill-opacity="0.55"/>
  <circle cx="555" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <circle cx="645" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <text class="r" x="515" y="219" style="text-anchor:middle">crops</text>
  <text class="r" x="685" y="219" style="text-anchor:middle">vegetables</text>
  <text class="l" x="600" y="112" style="fill:#1f6fb5;text-anchor:middle">OR</text>
  <text class="f" x="600" y="318" style="text-anchor:middle">crops OR vegetables</text>
  <text class="r" x="600" y="340" style="text-anchor:middle">pages with either word</text>
  <clipPath id="cl2"><circle cx="925" cy="215" r="75"/></clipPath>
  <clipPath id="cr2"><circle cx="1015" cy="215" r="75"/></clipPath>
  <circle cx="925" cy="215" r="75" fill="#1f6fb5" fill-opacity="0.55"/>
  <circle cx="1015" cy="215" r="75" fill="#dbe8f6" clip-path="url(#cl2)"/>
  <circle cx="925" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <circle cx="1015" cy="215" r="75" fill="none" stroke="#14181f" stroke-width="1.6"/>
  <text class="r" x="885" y="219" style="text-anchor:middle">farming</text>
  <text class="r" x="1055" y="219" style="text-anchor:middle">pesticides</text>
  <text class="l" x="970" y="112" style="fill:#1f6fb5;text-anchor:middle">NOT</text>
  <text class="f" x="970" y="318" style="text-anchor:middle">farming NOT pesticides</text>
  <text class="r" x="970" y="340" style="text-anchor:middle">farming pages without pesticides</text>
  <g class="r">
    <text x="70" y="372">shaded area = results returned. Also: choose specific keywords (organic farming, not farming) and filter by date or place.</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Types of online research (8.1.2)</text>
  <rect x="70" y="450" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="104" y="471">General information</text>
  <text class="r" x="285" y="472">an overview from search engines</text>
  <rect x="70" y="496" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="142" y="517">Academic</text>
  <text class="r" x="285" y="518">books, papers, journals</text>
  <rect x="70" y="542" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="149" y="563">Market</text>
  <text class="r" x="285" y="564">trends, customers, competitors</text>
  <rect x="70" y="588" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="125" y="609">Fact-checking</text>
  <text class="r" x="285" y="610">confirm with several sources</text>
  <rect x="70" y="634" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="149" y="655">Health</text>
  <text class="r" x="285" y="656">symptoms, treatments, trusted sites</text>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="433">Digital literacy: five components (8.1.4)</text>
  <rect x="630" y="450" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="675" y="471">Using technology</text>
  <text class="r" x="845" y="472">devices, programs, websites</text>
  <rect x="630" y="496" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="699" y="517">Searching</text>
  <text class="r" x="845" y="518">keywords, refining results</text>
  <rect x="630" y="542" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="668" y="563">Evaluating sources</text>
  <text class="r" x="845" y="564">who made it? trustworthy?</text>
  <rect x="630" y="588" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="675" y="609">Creating content</text>
  <text class="r" x="845" y="610">documents, slides, images</text>
  <rect x="630" y="634" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="668" y="655">Safety and privacy</text>
  <text class="r" x="845" y="656">strong passwords, privacy settings</text>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
