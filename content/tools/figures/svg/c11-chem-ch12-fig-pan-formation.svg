<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff"/>
  <!-- Original redraw after Figure 12.5: a radical cycle oxidises a hydrocarbon to an aldehyde, which goes on through acyl and peroxyacyl radicals to PAN. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">How PAN forms in smog</text>
  <ellipse cx="330.0" cy="300.0" rx="220.0" ry="150.0" stroke="#4b5563" stroke-width="2.5" fill="none"/>
  <path d="M433.3 167.6 L420.3 168.7 L424.1 158.4 Z" fill="#14181f"/>
  <path d="M550.0 300.0 L544.5 288.2 L555.5 288.2 Z" fill="#14181f"/>
  <path d="M433.3 432.4 L442.5 423.3 L446.2 433.6 Z" fill="#14181f"/>
  <path d="M139.5 375.0 L151.3 380.4 L142.9 387.5 Z" fill="#14181f"/>
  <path d="M174.4 193.9 L167.8 205.1 L161.6 196.0 Z" fill="#14181f"/>
  <rect x="293.2" y="133.0" width="73.5" height="34.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="330.0" y="155.4" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">RCH2.</text>
  <rect x="474.3" y="208.0" width="92.5" height="34.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="520.5" y="230.4" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">RCH2O2.</text>
  <rect x="450.5" y="358.0" width="140.0" height="34.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="520.5" y="380.4" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">RCH2O. + NO2</text>
  <rect x="269.5" y="433.0" width="121.0" height="34.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="330.0" y="455.4" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">RCHO + HO2</text>
  <rect x="54.2" y="283.0" width="111.5" height="34.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="110.0" y="305.4" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">HO. + NO2</text>
  <text x="452.1" y="146.1" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">+ O2</text>
  <text x="590.0" y="305.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">+ NO</text>
  <text x="452.1" y="463.9" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">+ O2</text>
  <text x="104.8" y="395.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">+ NO</text>
  <text x="146.2" y="177.7" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">+ RCH3</text>
  <rect x="215.0" y="61.0" width="230.0" height="34.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="330.0" y="83.4" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">reactive hydrocarbon</text>
  <line x1="330.0" y1="96.0" x2="330.0" y2="119.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 130.0 L324.5 118.2 L335.5 118.2 Z" fill="#14181f"/>
  <text x="342.0" y="118.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">O3</text>
  <line x1="330.0" y1="470.0" x2="330.0" y2="529.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 540.0 L324.5 528.2 L335.5 528.2 Z" fill="#14181f"/>
  <text x="342.0" y="512.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">+ HO.</text>
  <rect x="235.0" y="542.0" width="190.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="330.0" y="565.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">RC.=O (acyl radical)</text>
  <line x1="427.0" y1="560.0" x2="459.6" y2="560.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470.0 560.0 L458.2 565.5 L458.2 554.5 Z" fill="#14181f"/>
  <text x="448.0" y="548.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">+ O2</text>
  <rect x="472.0" y="542.0" width="196.0" height="36.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="570.0" y="565.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">RC(O)OO. (peroxyacyl)</text>
  <line x1="670.0" y1="560.0" x2="701.6" y2="560.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M712.0 560.0 L700.2 565.5 L700.2 554.5 Z" fill="#14181f"/>
  <text x="691.0" y="548.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">+ NO2</text>
  <rect x="714.0" y="540.0" width="166.0" height="40.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#7c3aed"/>
  <text x="797.0" y="565.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">PAN: RC(O)OONO2</text>
  <rect x="600.0" y="100.0" width="280.0" height="150.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="614.0" y="128.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">The cycle turns NO into NO2</text>
  <text x="614.0" y="151.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">and keeps making HO. radicals.</text>
  <text x="614.0" y="174.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">Its aldehyde, RCHO, is turned</text>
  <text x="614.0" y="197.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">into PAN (bottom row).</text>
  <text x="614.0" y="220.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">The dot marks a free radical.</text>
  <text x="450.0" y="641" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
