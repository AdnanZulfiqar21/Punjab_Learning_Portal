<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Arial, Helvetica, sans-serif">
  <!-- Examples of phenols (C12-CHEM, PDF p95, 22.5): as printed in one row, each name to the left of its structure: phenol, 2-naphthol (OH at position 2) and 1-naphthol (OH at position 1). -->
  <rect width="1000" height="260" fill="#ffffff"/>
  <text x="105.0" y="185.0" font-size="26" fill="#c2185b" text-anchor="end" font-weight="bold">phenol</text>
  <polygon points="165.0,125.0 208.3,150.0 208.3,200.0 165.0,225.0 121.7,200.0 121.7,150.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="165.0" cy="175.0" r="31.0" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="165.0" y1="125.0" x2="165.0" y2="93.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="165.0" y="85.0" font-size="26" fill="#e07b1f" text-anchor="middle" font-weight="bold">OH</text>
  <text x="400.0" y="185.0" font-size="26" fill="#c2185b" text-anchor="end" font-weight="bold">2-naphthol</text>
  <polygon points="455.0,125.0 498.3,150.0 498.3,200.0 455.0,225.0 411.7,200.0 411.7,150.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="455.0" cy="175.0" r="31.0" fill="none" stroke="#111" stroke-width="3"/>
  <polygon points="541.6,125.0 584.9,150.0 584.9,200.0 541.6,225.0 498.3,200.0 498.3,150.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="541.6" cy="175.0" r="31.0" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="584.9" y1="150.0" x2="612.9" y2="134.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="640.9" y="136.0" font-size="26" fill="#e07b1f" text-anchor="middle" font-weight="bold">OH</text>
  <text x="735.0" y="185.0" font-size="26" fill="#c2185b" text-anchor="end" font-weight="bold">1-naphthol</text>
  <polygon points="790.0,125.0 833.3,150.0 833.3,200.0 790.0,225.0 746.7,200.0 746.7,150.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="790.0" cy="175.0" r="31.0" fill="none" stroke="#111" stroke-width="3"/>
  <polygon points="876.6,125.0 919.9,150.0 919.9,200.0 876.6,225.0 833.3,200.0 833.3,150.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="876.6" cy="175.0" r="31.0" fill="none" stroke="#111" stroke-width="3"/>
  <line x1="876.6" y1="125.0" x2="876.6" y2="93.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="876.6" y="85.0" font-size="26" fill="#e07b1f" text-anchor="middle" font-weight="bold">OH</text>
</svg>
