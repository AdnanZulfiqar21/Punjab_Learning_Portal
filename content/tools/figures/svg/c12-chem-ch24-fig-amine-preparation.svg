<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="690" fill="#ffffff"/>
  <!-- Original summary of topic 24.2: primary amines from halogenoalkanes and ammonia, reduction of nitriles, nitroalkanes and amides, and the Hofmann reaction; secondary amines from halogenoalkanes and primary amines and from N-substituted amides; phenylamine from chlorobenzene, nitrobenzene or benzamide. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making amines</text>
  <rect x="15.0" y="55.0" width="870.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">aliphatic primary amines</text>
  <text x="40.0" y="117.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">from halogenoalkanes</text>
  <text x="560.0" y="117.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">Br + NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + HBr</tspan></text>
  <text x="560.0" y="136.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">excess NH3 in ethanol, high pressure</tspan></text>
  <text x="40.0" y="167.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">from nitriles</text>
  <text x="560.0" y="167.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CN + 4[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="560.0" y="186.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">LiAlH4 (or H2/Ni)</tspan></text>
  <text x="40.0" y="217.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">from nitroalkanes</text>
  <text x="560.0" y="217.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 6[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="560.0" y="236.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">LiAlH4</tspan></text>
  <text x="40.0" y="267.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">from amides</text>
  <text x="560.0" y="267.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="560.0" y="286.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">LiAlH4, then H2O/H+</tspan></text>
  <text x="40.0" y="317.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">Hofmann reaction (one C fewer)</text>
  <text x="560.0" y="317.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + Br</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4NaOH -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2NaBr + Na</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <rect x="15.0" y="365.0" width="870.0" height="120.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="395.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">aliphatic secondary amines</text>
  <text x="450.0" y="420.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">Br + CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NHCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + HBr (ethanol, heat, sealed tube)</tspan></text>
  <text x="450.0" y="452.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CONHCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 4[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">NHCH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O (reduction of an N-substituted amide)</tspan></text>
  <rect x="15.0" y="495.0" width="870.0" height="160.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="525.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">phenylamine</text>
  <text x="450.0" y="550.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">Cl + 2NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> -&gt; C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + NH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">Cl (Cu</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O, 250 C, 50 atm)</tspan></text>
  <text x="450.0" y="582.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 6[H] -&gt; C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O (Sn + conc. HCl)</tspan></text>
  <text x="450.0" y="614.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">CONH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + Br</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4NaOH -&gt; C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 2NaBr + Na</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O (Hofmann)</tspan></text>
  <text x="450.0" y="681" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
