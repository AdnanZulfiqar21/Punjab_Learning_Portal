<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.4 to 1.6 and the methodology topics: the Scrum lifecycle, the seven Lean principles and the DevOps loop. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Scrum, Lean and DevOps</text>
  <rect x="50" y="55" width="1100" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="83">Scrum lifecycle (Fig. 1.4)</text>
  <rect x="80" y="150" width="120" height="40" rx="6" fill="#fde8e7" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="98" y="174">Product Backlog</text>
  <rect x="250" y="150" width="120" height="40" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="268" y="174">Sprint Planning</text>
  <rect x="420" y="150" width="120" height="40" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="r" x="441" y="174">Sprint Backlog</text>
  <circle cx="660" cy="170" r="48" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="l" x="660" y="166" style="text-anchor:middle">Sprint</text>
  <text class="r" x="660" y="182" style="text-anchor:middle">1 to 4 weeks</text>
  <rect x="600" y="92" width="120" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="r" x="629" y="111">Daily Scrum</text>
  <rect x="780" y="150" width="110" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="r" x="810" y="174">Increment</text>
  <rect x="940" y="150" width="120" height="40" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text class="r" x="964" y="174">Sprint Review</text>
  <rect x="600" y="240" width="140" height="34" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text class="r" x="614" y="261">Sprint Retrospective</text>
  <path d="M200 170 L246 170" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M370 170 L416 170" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M540 170 L608 170" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M708 170 L776 170" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M890 170 L936 170" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1000 190 V257 H744" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M600 257 H310 V194" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <g class="r">
    <text x="70" y="300">roles: Product Owner (owns the prioritized backlog), Scrum Master (runs the process, removes obstacles), Development Team (cross-functional, builds increments)</text>
    <text x="70" y="315">events: sprints, sprint planning, daily stand-ups, sprint review, retrospective; artifacts: product backlog, sprint backlog, increment</text>
    <text x="70" y="330">suits: mobile apps and web development with changing needs; not for embedded or safety-critical systems needing heavy documentation</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Lean software development (Fig. 1.5)</text>
  <rect x="80" y="420" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="150" y="436">1. Eliminate waste</text>
  <rect x="80" y="450" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="147" y="466">2. Amplify learning</text>
  <rect x="80" y="480" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="119" y="496">3. Decide as late as possible</text>
  <rect x="80" y="510" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="116" y="526">4. Deliver as fast as possible</text>
  <rect x="80" y="540" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="147" y="556">5. Empower the team</text>
  <rect x="80" y="570" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="141" y="586">6. Build integrity in</text>
  <rect x="80" y="600" width="240" height="24" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="155" y="616">7. See the whole</text>
  <g class="r">
    <text x="340" y="432">from Lean manufacturing:</text>
    <text x="340" y="447">deliver customer value,</text>
    <text x="340" y="462">optimize the flow of work,</text>
    <text x="340" y="477">remove what adds no value</text>
    <text x="340" y="507">suits: startups, mobile</text>
    <text x="340" y="522">apps, web services with</text>
    <text x="340" y="537">fast iterations</text>
    <text x="340" y="567">not: large regulated or</text>
    <text x="340" y="582">safety-critical systems</text>
    <text x="340" y="597">(e.g. aviation control)</text>
  </g>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="403">DevOps (Fig. 1.6)</text>
  <circle cx="760" cy="500" r="70" fill="none" stroke="#1f6fb5" stroke-width="12" opacity="0.85"/>
  <circle cx="960" cy="500" r="70" fill="none" stroke="#0f7a62" stroke-width="12" opacity="0.85"/>
  <text class="k" x="760" y="506" style="fill:#1f6fb5;text-anchor:middle">Dev</text>
  <text class="k" x="960" y="506" style="fill:#0f7a62;text-anchor:middle">Ops</text>
  <text class="r" x="700" y="418">plan</text>
  <text class="r" x="650" y="470">code</text>
  <text class="r" x="650" y="548">build</text>
  <text class="r" x="720" y="594">test</text>
  <text class="r" x="850" y="500">release</text>
  <text class="r" x="945" y="418">deploy</text>
  <text class="r" x="1040" y="470">operate</text>
  <text class="r" x="990" y="594">monitor</text>
  <g class="r">
    <text x="630" y="628">joins development and IT operations: shorter lifecycle, continuous delivery (CI/CD)</text>
    <text x="630" y="643">benefits: collaboration, faster time-to-market, quality, efficiency</text>
    <text x="630" y="658">suits web, mobile and cloud services (e.g. Amazon); less so regulated devices</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
