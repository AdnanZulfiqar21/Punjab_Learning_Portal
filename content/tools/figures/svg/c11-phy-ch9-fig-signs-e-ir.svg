<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <!-- For your information box "Signs for E and I" (C11-PHY, PDF p217), drawn as printed: two cells in the top row and two resistors in the bottom row, each between two end dots with the direction of travel shown by an arrow underneath and the potential change written below it. As printed, both resistors have the same travel arrow and no current is shown. -->
  <defs>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e9bd7"/></marker>
    <marker id="hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e0187a"/></marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222222"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- top left: cell crossed from - to + (blue) -->
  <text x="300" y="60" font-size="30" font-style="italic" text-anchor="middle" fill="#222222">E</text>
  <line x1="70" y1="130" x2="282" y2="130" stroke="#1e9bd7" stroke-width="5"/>
  <line x1="318" y1="130" x2="530" y2="130" stroke="#1e9bd7" stroke-width="5"/>
  <line x1="284" y1="108" x2="284" y2="152" stroke="#222222" stroke-width="6"/>
  <line x1="316" y1="80" x2="316" y2="180" stroke="#222222" stroke-width="3"/>
  <text x="262" y="182" font-size="28" text-anchor="middle" fill="#222222">−</text>
  <text x="340" y="182" font-size="28" text-anchor="middle" fill="#222222">+</text>
  <circle cx="70" cy="130" r="11" fill="#1e9bd7"/>
  <circle cx="530" cy="130" r="11" fill="#1e9bd7"/>
  <line x1="120" y1="212" x2="470" y2="212" stroke="#1e9bd7" stroke-width="5" marker-end="url(#hb)"/>
  <text x="300" y="258" font-size="30" text-anchor="middle" fill="#222222"><tspan font-style="italic">E</tspan> = +<tspan font-style="italic">E</tspan></text>

  <!-- top right: cell crossed from + to - (pink) -->
  <text x="900" y="60" font-size="30" font-style="italic" text-anchor="middle" fill="#222222">E</text>
  <line x1="670" y1="130" x2="884" y2="130" stroke="#e0187a" stroke-width="5"/>
  <line x1="916" y1="130" x2="1130" y2="130" stroke="#e0187a" stroke-width="5"/>
  <line x1="884" y1="80" x2="884" y2="180" stroke="#222222" stroke-width="3"/>
  <line x1="916" y1="108" x2="916" y2="152" stroke="#222222" stroke-width="6"/>
  <text x="862" y="182" font-size="28" text-anchor="middle" fill="#222222">+</text>
  <text x="940" y="182" font-size="28" text-anchor="middle" fill="#222222">−</text>
  <circle cx="670" cy="130" r="11" fill="#e0187a"/>
  <circle cx="1130" cy="130" r="11" fill="#e0187a"/>
  <line x1="720" y1="212" x2="1070" y2="212" stroke="#e0187a" stroke-width="5" marker-end="url(#hp)"/>
  <text x="900" y="258" font-size="30" text-anchor="middle" fill="#222222"><tspan font-style="italic">E</tspan> = −<tspan font-style="italic">E</tspan></text>

  <!-- bottom left: resistor (pink), V = -IR -->
  <line x1="70" y1="400" x2="225" y2="400" stroke="#e0187a" stroke-width="5"/>
  <polyline points="225,400 236,384 254,416 272,384 290,416 308,384 326,416 344,384 362,416 375,400" fill="none" stroke="#e0187a" stroke-width="5" stroke-linejoin="round"/>
  <line x1="375" y1="400" x2="530" y2="400" stroke="#e0187a" stroke-width="5"/>
  <circle cx="70" cy="400" r="11" fill="#e0187a"/>
  <circle cx="530" cy="400" r="11" fill="#e0187a"/>
  <line x1="120" y1="470" x2="470" y2="470" stroke="#e0187a" stroke-width="5" marker-end="url(#hp)"/>
  <text x="300" y="520" font-size="30" text-anchor="middle" fill="#222222"><tspan font-style="italic">V</tspan> = −<tspan font-style="italic">IR</tspan></text>

  <!-- bottom right: resistor (blue), V = +IR -->
  <line x1="670" y1="400" x2="825" y2="400" stroke="#1e9bd7" stroke-width="5"/>
  <polyline points="825,400 836,384 854,416 872,384 890,416 908,384 926,416 944,384 962,416 975,400" fill="none" stroke="#1e9bd7" stroke-width="5" stroke-linejoin="round"/>
  <line x1="975" y1="400" x2="1130" y2="400" stroke="#1e9bd7" stroke-width="5"/>
  <circle cx="670" cy="400" r="11" fill="#1e9bd7"/>
  <circle cx="1130" cy="400" r="11" fill="#1e9bd7"/>
  <line x1="720" y1="470" x2="1070" y2="470" stroke="#1e9bd7" stroke-width="5" marker-end="url(#hb)"/>
  <text x="900" y="520" font-size="30" text-anchor="middle" fill="#222222"><tspan font-style="italic">V</tspan> = +<tspan font-style="italic">IR</tspan></text>
</svg>
