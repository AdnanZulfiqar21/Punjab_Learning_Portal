<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram for topic 22.4: acidified dichromate oxidises primary alcohols to aldehydes and then carboxylic acids, secondary alcohols to ketones, and not tertiary alcohols; the orange solution turns green with propan-1-ol and propan-2-ol but not with 2-methylpropan-2-ol. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Oxidising alcohols with acidified dichromate</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="80.0" y="106.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">primary</text>
  <text x="230.0" y="106.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH</tspan></text>
  <line x1="320.0" y1="100.0" x2="371.2" y2="100.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380.0 100.0 L370.0 104.6 L370.0 95.4 Z" fill="#14181f"/>
  <text x="350.0" y="90.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[O]</tspan></text>
  <text x="440.0" y="106.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CHO</tspan></text>
  <line x1="505.0" y1="100.0" x2="556.2" y2="100.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M565.0 100.0 L555.0 104.6 L555.0 95.4 Z" fill="#14181f"/>
  <text x="535.0" y="90.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[O]</tspan></text>
  <text x="630.0" y="106.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COOH</tspan></text>
  <text x="450.0" y="132.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">aldehyde (distil it off), then carboxylic acid (reflux)</text>
  <text x="80.0" y="178.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">secondary</text>
  <text x="230.0" y="178.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH(OH)CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <line x1="320.0" y1="172.0" x2="371.2" y2="172.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380.0 172.0 L370.0 176.6 L370.0 167.4 Z" fill="#14181f"/>
  <text x="350.0" y="162.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">[O]</tspan></text>
  <text x="440.0" y="178.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COCH</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <text x="450.0" y="204.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ketone only</text>
  <text x="80.0" y="250.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">tertiary</text>
  <text x="230.0" y="250.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">COH</tspan></text>
  <text x="400.0" y="250.0" font-size="15" fill="#d7322f" text-anchor="start" font-weight="700">x  no reaction</text>
  <text x="450.0" y="276.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">no oxidation</text>
  <rect x="15.0" y="315.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="345.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">test: orange Cr2O7 2- turns green Cr3+ with primary and secondary alcohols</text>
  <path d="M154 400 L154 494 A26 26 0 0 0 206 494 L206 400 Z" stroke="none" stroke-width="0" fill="#14532d" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M154 355 L154 494 A26 26 0 0 0 206 494 L206 355" stroke="#475569" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="180.0" y="540.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">propan-1-ol (primary)</text>
  <text x="220.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">green</text>
  <path d="M424 400 L424 494 A26 26 0 0 0 476 494 L476 400 Z" stroke="none" stroke-width="0" fill="#166534" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M424 355 L424 494 A26 26 0 0 0 476 494 L476 355" stroke="#475569" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="540.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">propan-2-ol (secondary)</text>
  <text x="490.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">green</text>
  <path d="M694 400 L694 494 A26 26 0 0 0 746 494 L746 400 Z" stroke="none" stroke-width="0" fill="#f59e0b" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M694 355 L694 494 A26 26 0 0 0 746 494 L746 355" stroke="#475569" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="720.0" y="540.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">2-methylpropan-2-ol (tertiary)</text>
  <text x="760.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">stays orange</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
