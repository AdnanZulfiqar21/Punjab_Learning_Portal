<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="495" fill="#ffffff"/>
  <!-- Original diagram for topic 19.9.1: the two mirror-image forms of lactic acid around a chiral carbon bearing CH3, COOH, H and OH, and meso-tartaric acid with its internal plane of symmetry. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Enantiomers and a meso compound</text>
  <rect x="15.0" y="55.0" width="470.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="250.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">lactic acid: a pair of enantiomers</text>
  <text x="140.0" y="237.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="152.0" y="218.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700">*</text>
  <line x1="140.0" y1="218.0" x2="140.0" y2="172.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="140.0" y="153.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="128.9" y1="234.5" x2="89.1" y2="250.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="50.0" y="267.6" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">HOOC</tspan></text>
  <path d="M140.0 236.0 L192.9 255.6 L197.1 244.4 Z" stroke="#14181f" stroke-width="1" fill="#14181f" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="212.0" y="261.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="139.6" y1="245.5" x2="142.9" y2="245.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140.2" y1="253.0" x2="144.8" y2="253.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140.9" y1="260.5" x2="146.6" y2="260.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="141.5" y1="268.0" x2="148.5" y2="268.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142.1" y1="275.5" x2="150.4" y2="275.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142.8" y1="283.0" x2="152.2" y2="283.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="143.4" y1="290.5" x2="154.1" y2="290.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="154.0" y="321.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="140.0" y="360.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one enantiomer</text>
  <text x="360.0" y="237.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="372.0" y="218.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700">*</text>
  <line x1="360.0" y1="218.0" x2="360.0" y2="172.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="360.0" y="153.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan></text>
  <line x1="371.1" y1="234.5" x2="410.9" y2="250.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="450.0" y="267.6" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <path d="M360.0 236.0 L302.9 244.4 L307.1 255.6 Z" stroke="#14181f" stroke-width="1" fill="#14181f" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="288.0" y="261.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="357.1" y1="245.5" x2="360.4" y2="245.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="355.2" y1="253.0" x2="359.8" y2="253.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="353.4" y1="260.5" x2="359.1" y2="260.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="351.5" y1="268.0" x2="358.5" y2="268.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="349.6" y1="275.5" x2="357.9" y2="275.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="347.8" y1="283.0" x2="357.2" y2="283.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="345.9" y1="290.5" x2="356.6" y2="290.5" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="346.0" y="321.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="360.0" y="360.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">its mirror image</text>
  <line x1="250.0" y1="95.0" x2="250.0" y2="380.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="250.0" y="400.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mirror</text>
  <text x="250.0" y="422.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">* chiral carbon: four different groups</text>
  <rect x="500.0" y="55.0" width="385.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="692.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">meso-tartaric acid</text>
  <text x="690.0" y="126.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="690.0" y="345.9" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="690.0" y="201.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="628.0" y="200.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="756.0" y="200.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="679.0" y1="195.0" x2="639.0" y2="195.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="703.0" y1="195.0" x2="743.0" y2="195.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="690.0" y="276.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="628.0" y="275.6" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="756.0" y="275.6" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="679.0" y1="270.0" x2="639.0" y2="270.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="703.0" y1="270.0" x2="743.0" y2="270.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="690.0" y1="133.0" x2="690.0" y2="182.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="690.0" y1="206.0" x2="690.0" y2="259.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="690.0" y1="283.0" x2="690.0" y2="327.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="560.0" y1="232.0" x2="820.0" y2="232.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 5"/>
  <text x="830.0" y="237.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">plane of</text>
  <text x="830.0" y="253.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">symmetry</text>
  <text x="692.0" y="382.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the two halves cancel each other's</text>
  <text x="692.0" y="399.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">rotation: optically inactive</text>
  <text x="450.0" y="466.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a 50:50 mixture of the two lactic acid enantiomers (racemic mixture) is also optically inactive</text>
  <text x="450.0" y="486" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
