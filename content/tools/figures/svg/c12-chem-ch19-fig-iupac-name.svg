<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="535" fill="#ffffff"/>
  <!-- Original diagram after the book's naming scheme: prefix, stem, primary suffix and secondary suffix, worked for 4-chlorobutanal and 3-methylbut-2-en-1-ol with the chains numbered from the functional-group end. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Parts of a systematic (IUPAC) name</text>
  <rect x="20.0" y="65.0" width="200.0" height="46.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="120.0" y="95.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">prefix</text>
  <text x="120.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">substituents and their</text>
  <text x="120.0" y="152.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">positions: 4-chloro, 3-methyl</text>
  <rect x="240.0" y="65.0" width="200.0" height="46.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="340.0" y="95.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">stem (root)</text>
  <text x="340.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">carbons in the parent</text>
  <text x="340.0" y="152.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">chain: meth, eth, prop, but</text>
  <rect x="460.0" y="65.0" width="200.0" height="46.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="560.0" y="95.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">primary suffix</text>
  <text x="560.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">an, en or yn: saturated</text>
  <text x="560.0" y="152.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">or unsaturated chain</text>
  <rect x="680.0" y="65.0" width="200.0" height="46.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="780.0" y="95.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">secondary suffix</text>
  <text x="780.0" y="135.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">family name from the</text>
  <text x="780.0" y="152.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">functional group: -ol, -al</text>
  <rect x="15.0" y="185.0" width="425.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="77.0" y="266.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="152.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="152.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">4</text>
  <text x="227.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="227.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">3</text>
  <text x="302.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="302.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">2</text>
  <text x="377.0" y="266.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CHO</tspan></text>
  <text x="377.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">1</text>
  <line x1="99.0" y1="260.0" x2="130.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="174.0" y1="260.0" x2="205.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="249.0" y1="260.0" x2="280.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="324.0" y1="260.0" x2="355.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="63.0" y="335.0" width="112.0" height="40.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="119.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">4-chloro</text>
  <text x="119.0" y="394.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">prefix</text>
  <rect x="175.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="211.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">but</text>
  <text x="211.0" y="394.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">stem</text>
  <rect x="247.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="283.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">an</text>
  <text x="283.0" y="394.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">1st suffix</text>
  <rect x="319.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="355.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">al</text>
  <text x="355.0" y="394.0" font-size="11" fill="#d98b2b" text-anchor="middle" font-weight="700">2nd suffix</text>
  <text x="227.0" y="432.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">4-chlorobutanal</text>
  <text x="227.0" y="460.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">number from the end nearest the functional group</text>
  <rect x="455.0" y="185.0" width="425.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="517.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan></text>
  <text x="517.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">4</text>
  <text x="592.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="592.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">3</text>
  <text x="667.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan></text>
  <text x="667.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">2</text>
  <text x="742.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="742.0" y="236.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">1</text>
  <text x="817.0" y="266.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <line x1="539.0" y1="260.0" x2="570.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="614.0" y1="257.0" x2="645.0" y2="257.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="614.0" y1="263.0" x2="645.0" y2="263.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="689.0" y1="260.0" x2="720.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="764.0" y1="260.0" x2="795.0" y2="260.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="592.0" y1="272.0" x2="592.0" y2="292.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="592.0" y="312.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <rect x="503.0" y="335.0" width="112.0" height="40.0" rx="6" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="559.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">3-methyl</text>
  <text x="559.0" y="394.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">prefix</text>
  <rect x="615.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="651.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">but</text>
  <text x="651.0" y="394.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700">stem</text>
  <rect x="687.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="723.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">2-en</text>
  <text x="723.0" y="394.0" font-size="11" fill="#0f7a62" text-anchor="middle" font-weight="700">1st suffix</text>
  <rect x="759.0" y="335.0" width="72.0" height="40.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="795.0" y="361.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">1-ol</text>
  <text x="795.0" y="394.0" font-size="11" fill="#d98b2b" text-anchor="middle" font-weight="700">2nd suffix</text>
  <text x="667.0" y="432.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">3-methylbut-2-en-1-ol</text>
  <text x="667.0" y="460.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">number from the end nearest the functional group</text>
  <text x="450.0" y="508.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">without a prefix, the name is just stem + suffixes (e.g. butanal)</text>
  <text x="450.0" y="526" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
