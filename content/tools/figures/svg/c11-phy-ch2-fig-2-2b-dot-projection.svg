<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 2.2 (b) (C11-PHY, PDF p26): A along the base and B from the same origin at angle theta; a dashed line from the tip of A meets B at a right angle, and A cos theta is written along B, under it, up to that point. Printed on its own at the top of the next page. Original drawing after the printed figure. -->
  <rect width="560" height="490" fill="#ffffff"/>
  <line x1="480.0" y1="420.0" x2="270.0" y2="210.0" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10"/>
  <line x1="60.0" y1="420.0" x2="473.0" y2="420.0" stroke="#1d9fe0" stroke-width="6"/>
  <path d="M500.0 420.0 L470.0 436.0 L470.0 404.0 Z" fill="#1d9fe0"/>
  <line x1="60.0" y1="420.0" x2="337.9" y2="142.1" stroke="#e0197d" stroke-width="5"/>
  <path d="M357.0 123.0 L347.1 155.5 L324.5 132.9 Z" fill="#e0197d"/>
  <path d="M112.0 420.0 A52 52 0 0 0 96.8 383.2" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
  <text x="130.0" y="406.0" font-size="28" fill="#1a1a1a" text-anchor="middle">θ</text>
  <text x="196.1" y="346.1" font-size="28" fill="#1a1a1a" text-anchor="middle" transform="rotate(-45 196.1 346.1)"><tspan font-style="italic">A</tspan> cos θ</text>
  <text x="500.0" y="460.0" font-size="32" fill="#1a1a1a" text-anchor="end"><tspan font-weight="700">A</tspan></text>
  <text x="343.0" y="111.0" font-size="32" fill="#1a1a1a" text-anchor="end"><tspan font-weight="700">B</tspan></text>
</svg>
