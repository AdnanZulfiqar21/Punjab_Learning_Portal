<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 6.1 to 6.5 and topics 6.1 to 6.3: kinetic theory, the ideal gas equation, the gas laws, internal energy and work by a gas. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="32">Kinetic theory, the ideal gas equation, the gas laws, internal energy and work by a gas</text>
  <!-- assumptions -->
  <rect x="50" y="55" width="380" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="83">Kinetic theory of gases (6.1)</text>
  <rect x="70" y="100" width="120" height="90" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <g fill="#1f6fb5"><circle cx="90" cy="120" r="4"/><circle cx="130" cy="140" r="4"/><circle cx="170" cy="112" r="4"/><circle cx="100" cy="170" r="4"/><circle cx="150" cy="175" r="4"/><circle cx="120" cy="105" r="4"/></g>
  <g stroke="#1f6fb5" stroke-width="1" fill="none"><path d="M90 120 L110 108"/><path d="M130 140 L118 158"/><path d="M170 112 L158 128"/><path d="M100 170 L92 150"/><path d="M150 175 L166 162"/></g>
  <g class="t">
    <text x="200" y="112">1 constant random straight-line motion</text>
    <text x="200" y="128">2 negligible molecular volume</text>
    <text x="200" y="144">3 no forces except in collisions</text>
    <text x="200" y="160">4 perfectly elastic collisions</text>
    <text x="200" y="176">5 a very large number of particles</text>
    <text x="70" y="208">6 average KE proportional to absolute temperature</text>
    <text x="70" y="224">7 pressure from collisions with the walls</text>
    <text x="70" y="240">8 collision time negligible against the time between collisions</text>
    <text x="70" y="266"><tspan class="b">real gases</tspan> deviate (intermolecular forces, finite volume) at high</text>
    <text x="70" y="282">pressure and low temperature; they approach ideal behaviour</text>
    <text x="70" y="298">at low pressure and high temperature (low density, far apart)</text>
    <text x="70" y="322"><tspan class="b">thermal equilibrium:</tspan> same temperature, no net heat flow</text>
    <text x="70" y="338">(a metal spoon in hot coffee ends at one temperature)</text>
  </g>
  <!-- ideal gas -->
  <rect x="450" y="55" width="340" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="620" y="83">Equation of state</text>
  <g class="f">
    <text x="470" y="112">P V = n R T          (6.1)</text>
    <text x="470" y="132">R = 8.3145 J mol^-1 K^-1</text>
    <text x="470" y="152">n = m / M;  rho = P M / (R T)</text>
    <text x="470" y="180">n = N / N_A, N_A = 6.02 x 10^23</text>
    <text x="470" y="200">k_B = R / N_A           (6.2)</text>
    <text x="470" y="220">    = 1.38 x 10^-23 J K^-1</text>
    <text x="470" y="240">P V = N k_B T           (6.3)</text>
  </g>
  <g class="t">
    <text x="470" y="270"><tspan class="b">Example 6.1:</tspan> 1 mol at 300 K and 1 atm (101 325 Pa):</text>
    <text x="470" y="286">V = n N_A k_B T / P = 6.02 x 10^23 x 1.38 x 10^-23</text>
    <text x="470" y="302">x 300 / 101 325 = 0.03 m^3 (printed 0.03; 0.0246 m^3)</text>
    <text x="470" y="328">a gas obeying the kinetic theory is an ideal gas; its</text>
    <text x="470" y="344">molecules have only KE, no PE</text>
  </g>
  <!-- gas laws -->
  <rect x="810" y="55" width="340" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Gas laws (Figs. 6.1 to 6.3)</text>
  <!-- boyle -->
  <path d="M830 180 H920" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M830 180 V100" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M840 108 Q 850 170 915 172" fill="none" stroke="#d7322f" stroke-width="2"/>
  <text class="r" x="880" y="194">V</text><text class="r" x="820" y="104">P</text><text class="r" x="826" y="208">Boyle: PV const (T)</text>
  <!-- charles -->
  <path d="M940 180 H1030" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M960 190 V100" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M940 176 L1020 112" stroke="#d7322f" stroke-width="2"/>
  <text class="r" x="990" y="194">T</text><text class="r" x="950" y="104">V</text><text class="r" x="926" y="192">-273 C</text><text class="r" x="940" y="208">Charles: V/T const (P)</text>
  <!-- gay lussac -->
  <path d="M1050 180 H1140" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M1050 180 V100" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M1050 180 L1130 112" stroke="#d7322f" stroke-width="2"/>
  <text class="r" x="1100" y="194">T</text><text class="r" x="1040" y="104">P</text><text class="r" x="1056" y="208">G-L: P/T const (V)</text>
  <g class="t">
    <text x="830" y="236">state functions P, V, T: change one, a second changes while</text>
    <text x="830" y="252">the third is held constant</text>
    <text x="830" y="274">Boyle (1662): P proportional to 1/V at const T; P1 V1 = P2 V2</text>
    <text x="830" y="290">Charles (printed 1870): V proportional to T at constant P;</text>
    <text x="830" y="306">V1/T1 = V2/T2; the line extrapolates to -273 C</text>
    <text x="830" y="322">Gay-Lussac: P proportional to T at const V; P1/T1 = P2/T2</text>
    <text x="830" y="344">T is the absolute (kelvin) temperature in every law</text>
  </g>
  <!-- internal energy and work -->
  <rect x="50" y="375" width="560" height="300" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="330" y="403">Internal energy (6.2)</text>
  <g class="t">
    <text x="70" y="430">the sum of all molecular energies, kinetic and potential, of a substance;</text>
    <text x="70" y="446">ideal-gas molecules are mass points exerting no forces, so the internal</text>
    <text x="70" y="462">energy of an ideal gas is the translational KE of its molecules, and since</text>
    <text x="70" y="478">temperature is their average KE, U is proportional to T</text>
  </g>
  <text class="f" x="70" y="506">&lt;(1/2) m v^2&gt; = (3/2) k_B T</text>
  <g class="t">
    <text x="70" y="532">a rise in temperature reflects a rise in the internal kinetic energy of the</text>
    <text x="70" y="548">particles, for example by absorbing heat; a diatomic molecule also has</text>
    <text x="70" y="564">rotational and vibrational energy (spring-like bond)</text>
    <text x="70" y="590"><tspan class="b">U is a function of state:</tspan> it depends on the initial and final states, not the</text>
    <text x="70" y="606">path, like gravitational PE; the change delta U matters, not the absolute value</text>
    <text x="70" y="632">heating, adiabatic compression or expansion, and phase changes (heat changes</text>
    <text x="70" y="648">the state without changing temperature) all change internal energy and temperature</text>
  </g>
  <rect x="630" y="375" width="520" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="890" y="403">Work and heat (6.3, Figs. 6.4, 6.5)</text>
  <rect x="660" y="430" width="90" height="130" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="664" y="490" width="82" height="66" fill="#f8c8b8"/>
  <rect x="664" y="476" width="82" height="12" fill="#9ca3af"/>
  <path d="M705 476 V430" stroke="#4b5563" stroke-width="4"/>
  <path d="M705 430 V400" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M760 476 V520" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
  <text class="r" x="766" y="500">delta y</text>
  <text class="r" x="668" y="528">P, V, area A</text>
  <text class="r" x="716" y="408" style="fill:#d7322f">F = P A</text>
  <text class="r" x="660" y="580">gas expands slowly (stays in equilibrium)</text>
  <!-- PV graph -->
  <path d="M830 560 H960" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M830 560 V440" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="860" y="480" width="70" height="80" fill="#f8c8b8" opacity="0.6"/>
  <path d="M860 480 H930" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="r" x="852" y="470">B</text><text class="r" x="934" y="470">C</text><text class="r" x="852" y="574">A</text><text class="r" x="932" y="574">D</text>
  <text class="r" x="820" y="484">P</text><text class="r" x="878" y="588">delta V</text><text class="r" x="950" y="574">V</text>
  <text class="r" x="862" y="524">area = P delta V</text>
  <g class="f" style="font-size:11px">
    <text x="980" y="450">W = F delta y</text>
    <text x="980" y="468">  = P A delta y</text>
    <text x="980" y="486">A delta y = delta V</text>
    <text x="980" y="504">W = P delta V (6.4)</text>
  </g>
  <g class="t">
    <text x="980" y="530">work done BY the gas on</text>
    <text x="980" y="546">its surroundings: positive</text>
    <text x="980" y="562">work done ON the gas:</text>
    <text x="980" y="578">negative</text>
    <text x="660" y="612">heat Q entering the system may raise its internal energy or appear as work on</text>
    <text x="660" y="628">the surroundings, or both; the area under the P-V curve is the work done</text>
    <text x="660" y="650">these ideas lead to the laws of thermodynamics</text>
  </g>
  <text class="s" x="600" y="692" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
