<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: six safe digital habits with ticks, and a weak and a strong example password. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Safe digital habits (after Fig 9.2)</text>
  <circle cx="70.0" cy="98.0" r="15.0" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 98.0 L68.0 105.0 L79.0 90.0" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="94.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">strong, unique passwords</text>
  <text x="100.0" y="113.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">12+ characters; letters, numbers, symbols; one per account</text>
  <circle cx="70.0" cy="156.0" r="15.0" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 156.0 L68.0 163.0 L79.0 148.0" stroke="#1f6fb5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="152.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">keep software updated</text>
  <text x="100.0" y="171.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">updates close security gaps</text>
  <circle cx="70.0" cy="214.0" r="15.0" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 214.0 L68.0 221.0 L79.0 206.0" stroke="#d98b2b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="210.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">download only from trusted sources</text>
  <text x="100.0" y="229.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">unknown files can hide viruses or spyware</text>
  <circle cx="70.0" cy="272.0" r="15.0" stroke="#7c3aed" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 272.0 L68.0 279.0 L79.0 264.0" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="268.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">check privacy settings</text>
  <text x="100.0" y="287.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">private account; location off; limit app permissions</text>
  <circle cx="70.0" cy="330.0" r="15.0" stroke="#0e9aa7" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 330.0 L68.0 337.0 L79.0 322.0" stroke="#0e9aa7" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="326.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">turn on two-factor authentication</text>
  <text x="100.0" y="345.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">a code on your phone as well as the password</text>
  <circle cx="70.0" cy="388.0" r="15.0" stroke="#d7322f" stroke-width="2.5" fill="#ffffff"/>
  <path d="M62.0 388.0 L68.0 395.0 L79.0 380.0" stroke="#d7322f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="100.0" y="384.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">think before you share or click</text>
  <text x="100.0" y="403.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">fake sites and links lead to scams</text>
  <rect x="600.0" y="90.0" width="260.0" height="300.0" rx="10" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="730.0" y="118.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">password examples</text>
  <text x="620.0" y="158.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">weak:</text>
  <text x="620.0" y="180.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">ali2008</text>
  <text x="620.0" y="200.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">name + birth year, short</text>
  <text x="620.0" y="245.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">strong:</text>
  <text x="620.0" y="267.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">Kite!Rain7-Chai*Lake</text>
  <text x="620.0" y="287.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">long, mixed, nothing personal</text>
  <text x="620.0" y="330.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">(made-up examples:</text>
  <text x="620.0" y="345.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">never use a password</text>
  <text x="620.0" y="360.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">you have seen printed)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
