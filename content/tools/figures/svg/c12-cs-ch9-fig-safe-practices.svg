<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="960" fill="#ffffff"/>
  <!-- Roman Urdu only: six safe digital habits from section 9.1 (our own checklist, not a book figure). -->
  <circle cx="70.0" cy="92.0" r="42.0" fill="#ffffff" stroke="#1f7a5a" stroke-width="6"/>
  <path d="M48.0 96.4 L63.3 111.7 L92.2 76.0" fill="none" stroke="#1f7a5a" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="82.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Mazboot, munfarid passwords</text>
  <text x="140.0" y="132.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">har account ka alag password</text>
  <circle cx="70.0" cy="242.0" r="42.0" fill="#ffffff" stroke="#2a6db0" stroke-width="6"/>
  <path d="M48.0 246.4 L63.3 261.7 L92.2 226.0" fill="none" stroke="#2a6db0" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="232.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Software update rakhein</text>
  <text x="140.0" y="282.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">updates security ke khala band karti</text>
  <circle cx="70.0" cy="392.0" r="42.0" fill="#ffffff" stroke="#c27a14" stroke-width="6"/>
  <path d="M48.0 396.4 L63.3 411.7 L92.2 376.0" fill="none" stroke="#c27a14" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="382.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Sirf bharosemand downloads</text>
  <text x="140.0" y="432.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">na-maloom files mein virus ya spyware</text>
  <circle cx="70.0" cy="542.0" r="42.0" fill="#ffffff" stroke="#7240c4" stroke-width="6"/>
  <path d="M48.0 546.4 L63.3 561.7 L92.2 526.0" fill="none" stroke="#7240c4" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="532.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Privacy settings dekhein</text>
  <text x="140.0" y="582.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">kaun kya dekh sakta hai, aap tay karein</text>
  <circle cx="70.0" cy="692.0" r="42.0" fill="#ffffff" stroke="#13838f" stroke-width="6"/>
  <path d="M48.0 696.4 L63.3 711.7 L92.2 676.0" fill="none" stroke="#13838f" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="682.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Privacy policy parhein</text>
  <text x="140.0" y="732.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">data kaise jama aur share hoga</text>
  <circle cx="70.0" cy="842.0" r="42.0" fill="#ffffff" stroke="#c23a32" stroke-width="6"/>
  <path d="M48.0 846.4 L63.3 861.7 L92.2 826.0" fill="none" stroke="#c23a32" stroke-width="7.6499999999999995" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="832.0" font-size="42" fill="#1d2330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Click se pehle sochein</text>
  <text x="140.0" y="882.0" font-size="34" fill="#4a5260" text-anchor="start" font-family="Arial, Helvetica, sans-serif">jaali links aur websites se dhoka</text>
