<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.8 to 15.10 and topics 15.3 (chromatography) to 15.4: ascending paper chromatography, the Rf value, a chromatogram, and checking purity. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Paper chromatography, the Rf value, and checking the purity of a product</text>
  <!-- tank -->
  <rect x="50" y="55" width="380" height="380" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="83">Ascending paper chromatography (15.3.1)</text>
  <rect x="70" y="110" width="200" height="280" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="64" y="104" width="212" height="10" fill="#9ca3af"/>
  <rect x="72" y="350" width="196" height="38" fill="#bcdcf0"/>
  <rect x="145" y="120" width="50" height="250" fill="#fdf6e3" stroke="#9ca3af" stroke-width="1"/>
  <path d="M145 332 H195" stroke="#4b5563" stroke-width="1"/>
  <path d="M145 160 H195" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="170" cy="332" r="4" fill="#9ca3af"/>
  <circle cx="170" cy="250" r="5" fill="#d7322f"/><circle cx="170" cy="200" r="5" fill="#1f6fb5"/>
  <text class="r" x="285" y="130" style="text-anchor:start">clip holds the strip</text>
  <text class="r" x="285" y="186" style="text-anchor:start">solvent front,</text>
  <text class="r" x="285" y="200" style="text-anchor:start">marked in pencil</text>
  <text class="r" x="285" y="232" style="text-anchor:start">separated spots</text>
  <text class="r" x="285" y="336" style="text-anchor:start">pencil start line,</text>
  <text class="r" x="285" y="350" style="text-anchor:start">2.5 cm from the end</text>
  <text class="r" x="285" y="374" style="text-anchor:start">solvent mixture; paper</text>
  <text class="r" x="285" y="388" style="text-anchor:start">dips 5 to 6 mm into it</text>
  <text class="r" x="240" y="412">covered tank, atmosphere saturated with solvent</text>
  <text class="r" x="285" y="150" style="text-anchor:start">Whatman No. 1 paper,</text>
  <text class="r" x="285" y="164" style="text-anchor:start">about 20 cm long</text>
  <!-- Rf -->
  <rect x="450" y="55" width="330" height="200" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="615" y="83">Retardation factor (15.3.3)</text>
  <text class="f" x="470" y="116">Rf = distance moved by component</text>
  <text class="f" x="470" y="134">     / distance moved by solvent front</text>
  <g class="t" style="font-size:12px">
    <text x="470" y="164">both measured from the original spot;</text>
    <text x="470" y="180">Rf is always the same for a substance</text>
    <text x="470" y="196">with the same stationary and mobile</text>
    <text x="470" y="212">phases, so it identifies a substance by</text>
    <text x="470" y="228">comparison with known pure samples</text>
  </g>
  <!-- chromatogram -->
  <rect x="800" y="55" width="350" height="200" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="975" y="83">A chromatogram (Figure 15.10)</text>
  <rect x="860" y="100" width="180" height="130" fill="#fdf6e3" stroke="#9ca3af" stroke-width="1"/>
  <path d="M860 215 H1040" stroke="#4b5563" stroke-width="1"/>
  <path d="M860 110 H1040" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 2"/>
  <g>
    <circle cx="890" cy="180" r="5" fill="#1f6fb5"/><circle cx="890" cy="140" r="5" fill="#d7322f"/>
    <circle cx="950" cy="180" r="5" fill="#1f6fb5"/>
    <circle cx="1010" cy="140" r="5" fill="#d7322f"/>
  </g>
  <g class="r"><text x="890" y="246">A (mixture)</text><text x="950" y="246">B</text><text x="1010" y="246">C</text></g>
  <text class="r" x="1060" y="114" style="text-anchor:start">y</text><text class="r" x="1060" y="184" style="text-anchor:start">x</text>
  <path d="M1050 215 V110" stroke="#4b5563" stroke-width="1" marker-end="url(#a)"/>
  <!-- theory -->
  <rect x="450" y="275" width="700" height="160" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="800" y="303">Chromatography (printed 15.3): a solute distributed between two phases</text>
  <g class="t" style="font-size:12px">
    <text x="470" y="330"><tspan font-weight="700" fill="#14181f">stationary phase:</tspan> a solid, or a liquid held as a thin film on an inert solid; <tspan font-weight="700" fill="#14181f">mobile phase:</tspan> a gas or liquid flowing over it</text>
    <text x="470" y="350"><tspan font-weight="700" fill="#14181f">adsorption chromatography:</tspan> solid stationary phase; the substance leaves the mobile phase and sticks to the solid</text>
    <text x="470" y="366">surface (thin layer chromatography, column chromatography)</text>
    <text x="470" y="386"><tspan font-weight="700" fill="#14181f">partition chromatography:</tspan> liquid stationary phase; the substances distribute between both liquids (paper</text>
    <text x="470" y="402">chromatography, where the water held in the cellulose fibres is the stationary phase; gas-liquid chromatography)</text>
    <text x="470" y="424">three ways with paper: ascending, descending, radial; components move at different rates, which separates them</text>
  </g>
  <!-- purity -->
  <rect x="50" y="455" width="1100" height="180" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="600" y="483">Locating agents (15.3.2) and checking purity (15.3.3, 15.4)</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="510"><tspan font-weight="700" fill="#14181f">colourless spots:</tspan> view under a UV lamp, or spray a locating agent such as ninhydrin, which reacts with amino acids to give coloured products</text>
    <text x="70" y="532"><tspan font-weight="700" fill="#14181f">by chromatography:</tspan> a pure substance gives one spot; an impure one gives more; the same Rf as a known pure sample means the same substance</text>
    <text x="70" y="554"><tspan font-weight="700" fill="#14181f">by melting point:</tspan> a pure solid melts sharply (aspirin at exactly 136 C); an impure one melts over a range; a mixed melting point with a pure</text>
    <text x="70" y="570">sample that stays sharp confirms purity.  <tspan font-weight="700" fill="#14181f">liquids:</tspan> purified by distillation at normal pressure or under vacuum; compare the boiling point with the literature</text>
    <text x="70" y="596"><tspan font-weight="700" fill="#14181f">aspirin:</tspan> salicylic acid + excess acetic anhydride with a few drops of conc. H2SO4; water precipitates the crude product, filtered, crystallized from water;</text>
    <text x="70" y="612">possible impurity: unreacted salicylic acid; check by melting point, mixed melting point, or chromatography against pure aspirin and salicylic acid</text>
  </g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
