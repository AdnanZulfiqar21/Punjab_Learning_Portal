  <!-- Fig 9.7 (C11-BIO, PDF p212): intestinal wall and detailed structure of villi, three parts left to right as printed. Left: a bent piece of intestine with blood vessels over it, cut across to show serosa, longitudinal and circular muscles, submucosa, mucosa and the lumen, and opened below to show the villi with absorption arrows; one villus boxed. Centre: an enlarged villus cut open (epithelial cells, red and blue blood capillaries, yellow lacteal) beside an uncut villus; absorption arrow at its tip. Right: an enlarged epithelial cell with microvilli; nutrients enter at the top and leave at the base. -->
