<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="'Times New Roman', Times, serif">
  <!-- Function as a computing machine (C11-MATH, PDF p28): magenta input/output line through a cyan box marked Function f; Input x, Output f(x), Computing Machine. Original drawing after the printed figure. -->
  <rect width="1200" height="430" fill="#ffffff"/>
  <rect width="1200" height="430" fill="#FFFAC2"/>
  <line x1="40" y1="190" x2="1110" y2="190" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M150 190 L128 199.9 L133.5 190 L128 180.1 Z" fill="#e0197d"/>
  <path d="M1040 190 L1018 199.9 L1023.5 190 L1018 180.1 Z" fill="#e0197d"/>
  <rect x="390" y="60" width="420" height="270" fill="none" stroke="#1d9fe0" stroke-width="6"/>
  <text x="600" y="160" font-size="43.2" text-anchor="middle" fill="#1a1a1a">Function</text>
  <text x="600" y="260" font-size="48.0" text-anchor="middle" fill="#1a1a1a" font-style="italic">f</text>
  <text x="40" y="270" font-size="43.2" text-anchor="start" fill="#1a1a1a">Input <tspan font-style="italic">x</tspan></text>
  <text x="1160" y="270" font-size="43.2" text-anchor="end" fill="#1a1a1a">Output <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>)</text>
  <text x="600" y="400" font-size="43.2" text-anchor="middle" fill="#1a1a1a">Computing Machine</text>
</svg>
