<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Inter, Arial, sans-serif" font-size="24">
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="26" font-weight="bold">Right triangle for α = sin⁻¹ x</text>
<polygon points="150,470 486.0,470 486.0,218.0" fill="#2a5d8f" fill-opacity="0.12" stroke="#1f2937" stroke-width="3"/>
<polyline points="464.0,470 464.0,448 486.0,448" fill="none" stroke="#1f2937" stroke-width="2"/>
<path d="M 220,470 A 70 70 0 0 0 206.0,428.0" fill="none" stroke="#2a5d8f" stroke-width="3"/>
<text x="237.3" y="448.9" fill="#2a5d8f" font-style="italic" font-size="26">α</text>
<text x="318.0" y="506" text-anchor="middle">√(1 − x²)</text>
<text x="500.0" y="352.0">x</text>
<text x="300.0" y="328.0" text-anchor="end">1</text>
<circle cx="150" cy="470.0" r="5" fill="#1f2937"/>
<circle cx="486.0" cy="470.0" r="5" fill="#1f2937"/>
<circle cx="486.0" cy="218.0" r="5" fill="#1f2937"/>
<text x="400" y="560" text-anchor="middle">sin α = x,  cos α = √(1 − x²),  tan α = x / √(1 − x²)</text>
</svg>
