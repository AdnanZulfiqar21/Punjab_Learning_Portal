<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- Side-chain oxidation of toluene as printed on p70: toluene + 3[O] on heating gives benzoic acid + H2O (the book spells toluene 'toulene'). -->
  <path d="M110.0 104.0 L149.8 127.0 L149.8 173.0 L110.0 196.0 L70.2 173.0 L70.2 127.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="110.0" cy="150.0" r="26.7" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="110.0" y1="104.0" x2="110.0" y2="74.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="110.0" y="65.3" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="8.4" font-size="20.2">3</tspan><tspan dy="-8.4"></tspan></text>
  <text x="185.0" y="160.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ 3[O]</tspan></text>
  <line x1="320.0" y1="150.0" x2="487.2" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500.0 150.0 L485.5 156.8 L485.5 143.2 Z" fill="#14181f"/>
  <text x="410.0" y="136.0" font-size="24" fill="#d81b60" text-anchor="middle" font-weight="400"><tspan dy="0.0">Heat</tspan></text>
  <path d="M600.0 104.0 L639.8 127.0 L639.8 173.0 L600.0 196.0 L560.2 173.0 L560.2 127.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="600.0" cy="150.0" r="26.7" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="600.0" y1="104.0" x2="600.0" y2="74.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="600.0" y="65.3" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">COOH</tspan></text>
  <text x="675.0" y="160.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">+ H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">O</tspan></text>
  <text x="110.0" y="245.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">toluene</tspan></text>
  <text x="600.0" y="245.0" font-size="26" fill="#d81b60" text-anchor="middle" font-weight="700"><tspan dy="0.0">benzoic acid</tspan></text>
</svg>
