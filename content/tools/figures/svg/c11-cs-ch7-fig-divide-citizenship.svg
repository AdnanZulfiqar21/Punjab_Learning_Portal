<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 7.3 to 7.6: causes, impacts and bridges of the digital divide, a seven-point checklist for judging information sources, and habits of a good digital citizen. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">The digital divide, judging information and digital citizenship</text>
  <rect x="50" y="55" width="1100" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="83">The digital divide: causes, impacts and bridges (7.3)</text>
  <rect x="80" y="100" width="300" height="36" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="209" y="122">Causes</text>
  <g class="r">
    <text x="90" y="165">economic: cannot afford devices</text>
    <text x="90" y="187">geographical: no rural network</text>
    <text x="90" y="209">educational: low digital skills</text>
    <text x="90" y="231">social: age, gender, disability</text>
  </g>
  <path d="M382 118 L436 118" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="440" y="100" width="300" height="36" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="566" y="122">Impacts</text>
  <g class="r">
    <text x="450" y="165">education gap (online classes)</text>
    <text x="450" y="187">jobs and digital banking</text>
    <text x="450" y="209">civic: e-government access</text>
    <text x="450" y="231">health: telemedicine</text>
    <text x="450" y="253">digital literacy gap</text>
  </g>
  <path d="M742 118 L796 118" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="800" y="100" width="300" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="926" y="122">Bridges</text>
  <g class="r">
    <text x="810" y="165">government: Universal Service</text>
    <text x="810" y="187">Fund takes internet to villages</text>
    <text x="810" y="209">digital literacy programmes</text>
    <text x="810" y="231">public-private partnerships</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="403">Is this source reliable? (7.4)</text>
  <rect x="72" y="423" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 431 L80 436 L86 426" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="436">Source: who published it? (official sites)</text>
  <rect x="72" y="459" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 467 L80 472 L86 462" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="472">Credibility: an expert or authority?</text>
  <rect x="72" y="495" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 503 L80 508 L86 498" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="508">Provenance: where did the data come from?</text>
  <rect x="72" y="531" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 539 L80 544 L86 534" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="544">Primary or secondary source?</text>
  <rect x="72" y="567" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 575 L80 580 L86 570" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="580">Critical thinking: compare viewpoints</text>
  <rect x="72" y="603" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 611 L80 616 L86 606" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="616">Red flags: no author, sensational, no references</text>
  <rect x="72" y="639" width="16" height="16" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <path d="M75 647 L80 652 L86 642" stroke="#0f7a62" stroke-width="2" fill="none"/>
  <text class="r" x="100" y="652">Bias: does it show only one side?</text>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="403">Good digital citizen (7.6)</text>
  <g class="r">
    <text x="630" y="436">strong passwords (not password123)</text>
    <text x="630" y="454">ignore suspicious links; verify the sender</text>
    <text x="630" y="472">share personal data only with trusted, secure sites</text>
    <text x="630" y="490">respect copyright; cite sources, no plagiarism</text>
    <text x="630" y="508">use privacy settings; keep address and phone private</text>
    <text x="630" y="526">work with tools and teammates; share knowledge</text>
    <text x="630" y="544">accessible content: clear fonts, alt text for images,</text>
    <text x="630" y="562">ask users for feedback</text>
    <text x="630" y="580">be respectful: no bullying or false information</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
