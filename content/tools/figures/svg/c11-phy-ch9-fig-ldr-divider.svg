  <line x1="350.0" y1="316.0" x2="391.4" y2="333.2" stroke="#d98b2b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M398.0 336.0 L389.0 336.4 L391.9 329.4 Z" fill="#d98b2b"/>
  <text x="342.0" y="300.0" font-size="14" fill="#d98b2b" text-anchor="end" font-weight="700">light</text>
  <text x="442.0" y="330.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">LDR</text>
  <path d="M420.0 370.0 L420.0 410.0 L180.0 410.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M420.0 250.0 L600.0 250.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="600.0" y1="250.0" x2="649.6" y2="250.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M660.0 250.0 L648.2 255.5 L648.2 244.5 Z" fill="#7c3aed"/>
  <text x="670.0" y="246.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">output to a</text>
  <text x="670.0" y="264.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">transistor or</text>
  <text x="670.0" y="282.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">NOT gate</text>
  <path d="M420.0 410.0 L420.0 410.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
