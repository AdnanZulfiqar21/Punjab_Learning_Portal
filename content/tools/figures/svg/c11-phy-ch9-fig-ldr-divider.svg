  <text x="614.0" y="118.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">In the dark the LDR's</text>
  <text x="614.0" y="137.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">resistance is very high, so</text>
  <text x="614.0" y="157.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">the voltage across it (at B)</text>
  <text x="614.0" y="176.5" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">is high; in light it falls.</text>
  <text x="614.0" y="196.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="400">B can switch a transistor.</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
