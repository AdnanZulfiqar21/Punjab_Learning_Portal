<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original bar chart from the book's insect data: ladybug 45 (16%), ant 120 (41%), butterfly 30 (10%), bee 75 (26%) and dragonfly 20 (7%) individuals, on a y-axis from 0 to 140 in steps of 20. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Insect species abundance in a local forest</text>
  <line x1="120.0" y1="430.0" x2="820.0" y2="430.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="120.0" y1="430.0" x2="120.0" y2="100.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="114.0" y1="430.0" x2="120.0" y2="430.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="430.0" x2="820.0" y2="430.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="434.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">0</text>
  <line x1="114.0" y1="382.9" x2="120.0" y2="382.9" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="382.9" x2="820.0" y2="382.9" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="386.9" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">20</text>
  <line x1="114.0" y1="335.7" x2="120.0" y2="335.7" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="335.7" x2="820.0" y2="335.7" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="339.7" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">40</text>
  <line x1="114.0" y1="288.6" x2="120.0" y2="288.6" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="288.6" x2="820.0" y2="288.6" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="292.6" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">60</text>
  <line x1="114.0" y1="241.4" x2="120.0" y2="241.4" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="241.4" x2="820.0" y2="241.4" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="245.4" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">80</text>
  <line x1="114.0" y1="194.3" x2="120.0" y2="194.3" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="194.3" x2="820.0" y2="194.3" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="198.3" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">100</text>
  <line x1="114.0" y1="147.1" x2="120.0" y2="147.1" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="147.1" x2="820.0" y2="147.1" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="151.1" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">120</text>
  <line x1="114.0" y1="100.0" x2="120.0" y2="100.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="100.0" x2="820.0" y2="100.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="104.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">140</text>
  <text x="74.0" y="265.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 74.0 265.0)">Number of individuals</text>
  <text x="470.0" y="476.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Insect species</text>
  <rect x="160.0" y="323.9" width="80.0" height="106.1" rx="3" stroke="#d7322f" stroke-width="1.5" fill="#d7322f"/>
  <text x="200.0" y="315.9" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">45 (16%)</text>
  <text x="200.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Ladybug</text>
  <rect x="295.0" y="147.1" width="80.0" height="282.9" rx="3" stroke="#92400e" stroke-width="1.5" fill="#92400e"/>
  <text x="335.0" y="139.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">120 (41%)</text>
  <text x="335.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Ant</text>
  <rect x="430.0" y="359.3" width="80.0" height="70.7" rx="3" stroke="#d98b2b" stroke-width="1.5" fill="#d98b2b"/>
  <text x="470.0" y="351.3" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">30 (10%)</text>
  <text x="470.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Butterfly</text>
  <rect x="565.0" y="253.2" width="80.0" height="176.8" rx="3" stroke="#ca8a04" stroke-width="1.5" fill="#ca8a04"/>
  <text x="605.0" y="245.2" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">75 (26%)</text>
  <text x="605.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Bee</text>
  <rect x="700.0" y="382.9" width="80.0" height="47.1" rx="3" stroke="#0e9aa7" stroke-width="1.5" fill="#0e9aa7"/>
  <text x="740.0" y="374.9" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">20 (7%)</text>
  <text x="740.0" y="450.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Dragonfly</text>
  <text x="450.0" y="80.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bars of equal width, evenly spaced; y-axis 0 to 140 in steps of 20</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
