<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.11 and 12.12 and Table 12.5: the contact process flow, the structure of sulfuric acid, its physical and chemical properties and uses. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .b{font-size:12px;font-weight:700;fill:#14181f;text-anchor:middle}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Sulfuric acid: the contact process, structure, properties and uses</text>
  <!-- flow -->
  <rect x="50" y="55" width="1100" height="215" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">The contact process (12.13.1, after Figure 12.12)</text>
  <g fill="#ffffff" stroke="#4b5563" stroke-width="2">
    <rect x="70" y="105" width="190" height="56" rx="8"/><rect x="300" y="105" width="190" height="56" rx="8"/><rect x="530" y="105" width="210" height="56" rx="8"/><rect x="780" y="105" width="170" height="56" rx="8"/><rect x="990" y="105" width="140" height="56" rx="8"/>
  </g>
  <g class="b">
    <text x="165" y="128">1 Sulfur / pyrite burners</text><text x="165" y="146" style="font-weight:400">S or FeS + air gives SO2</text>
    <text x="395" y="128">2 Purification unit</text><text x="395" y="146" style="font-weight:400">dust, As2O3 removed by Fe(OH)3</text>
    <text x="635" y="128">3 Contact tower, V2O5</text><text x="635" y="146" style="font-weight:400">420-450 C, 1-2 atm: SO2 to SO3</text>
    <text x="865" y="128">4 Absorption tower</text><text x="865" y="146" style="font-weight:400">SO3 into 98.5% H2SO4: oleum</text>
    <text x="1060" y="128">5 Dilution</text><text x="1060" y="146" style="font-weight:400">oleum + water</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none"><path d="M260 133 H295" marker-end="url(#a)"/><path d="M490 133 H525" marker-end="url(#a)"/><path d="M740 133 H775" marker-end="url(#a)"/><path d="M950 133 H985" marker-end="url(#a)"/></g>
  <g class="f">
    <text x="70" y="188">S + O2 --> SO2  (dH -297.03 kJ/mol);  4FeS + 6O2 --> 2Fe2O3 + 4SO2;  As2O3 + 2Fe(OH)3 --> 2FeAsO3 + 3H2O</text>
    <text x="70" y="208">SO2 + 1/2 O2 = SO3  (dH -98.98 kJ/mol); catalyst: SO2 + V2O5 --> SO3 + V2O4,  V2O4 + 1/2 O2 --> V2O5 (regeneration)</text>
    <text x="70" y="228">H2O + SO3 --> H2SO4 (dH -176.6 kJ/mol, too violent: mist);  H2SO4 + SO3 --> H2S2O7 (oleum);  H2S2O7 + H2O --> 2H2SO4</text>
  </g>
  <text class="s" x="600" y="254" style="font-size:12px">heat exchangers preheat the gases and remove the heat of the exothermic steps; SO3 is dissolved in recirculating acid, not water</text>
  <!-- structure and physical -->
  <rect x="50" y="290" width="380" height="200" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="318">Structure and physical properties (12.13.2)</text>
  <circle cx="130" cy="400" r="16" fill="#b5600f"/><text font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" x="130" y="405">S</text>
  <g stroke="#14181f" stroke-width="2"><path d="M130 384 V350 M130 416 V450 M114 400 H80 M146 400 H180"/><path d="M126 384 V350 M134 384 V350" /><path d="M126 416 V450 M134 416 V450"/></g>
  <g font-size="11" font-weight="700" fill="#14181f" text-anchor="middle"><text x="130" y="344">O</text><text x="130" y="464">O</text><text x="68" y="404">HO</text><text x="194" y="404">OH</text></g>
  <text class="r" x="130" y="478">tetrahedral: 2 S=O, 2 S-OH</text>
  <g class="t" style="font-size:11px">
    <text x="215" y="344">M 98.08 g/mol; colourless, viscous,</text>
    <text x="215" y="360">odourless; m.p. 10 C; b.p. 290 C</text>
    <text x="215" y="376">sp. gravity 1.83 (15 C); viscosity</text>
    <text x="215" y="392">25.24 cP; v.p. 0.001 torr (25 C)</text>
    <text x="215" y="412">soluble in water; hygroscopic;</text>
    <text x="215" y="428">anhydrous acid very polar; highly</text>
    <text x="215" y="444">corrosive to skin, cloth, rubber</text>
    <text x="215" y="464">about 85% of sulfur goes to H2SO4</text>
  </g>
  <!-- chemical -->
  <rect x="450" y="290" width="700" height="200" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="800" y="318">Chemical properties (12.13.3)</text>
  <g class="f">
    <text x="470" y="344">autoprotolysis: 2H2SO4 = H3SO4+ + HSO4-  (K = 2.7 x 10^-4; a non-aqueous protic solvent)</text>
    <text x="470" y="362">strong acid: H2SO4 + H2O -> H3O+ + HSO4- (pKa1 -2);  HSO4- + H2O = H3O+ + SO4 2- (pKa2 1.92)</text>
    <text x="470" y="380">dehydrating: C12H22O11 --> 12C + 11H2O (carbon snake);  C2H5OH --> C2H4 + H2O (or ethoxyethane)</text>
    <text x="470" y="398">with NaCl: NaCl + H2SO4 --> NaHSO4 + HCl(g)</text>
    <text x="470" y="416">metals above H (Fe, Al, Zn, Mn, Ni, Mg): Zn + dil. H2SO4 --> H2 + Zn2+ + SO4 2-</text>
    <text x="470" y="434">cold conc.: Zn + 2H2SO4 --> SO2 + Zn2+ + SO4 2- + 2H2O (print: Fe2+)</text>
    <text x="470" y="452">hot conc. (oxidising): Cu + 2H2SO4 --> SO2 + 2H2O + Cu2+ + SO4 2-;  also Ag, Hg</text>
  </g>
  <text class="t" x="470" y="476" style="font-size:11px">SO4 2- itself is weakly oxidising; hot concentrated acid oxidises through high T, high [H+] and nascent oxygen</text>
  <!-- uses -->
  <rect x="50" y="510" width="1100" height="160" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="538">Uses: the king of chemicals (12.13.4)</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="564">fertilisers (about 77.67% of the acid digests phosphate rock, Ca3(PO4)2, to superphosphate and H3PO4; with NH3 gives ammonium sulfate)</text>
    <text x="70" y="582">metal extraction (Cu, Ni, steel); catalyst in oil and coal refining, polymers, synthetic rubber, plastics; pulp and paper</text>
    <text x="70" y="600">pesticides, herbicides, varnishes, dyes, pharmaceuticals, soaps and detergents; nitration for explosives (TNT, nitroglycerine, picric acid)</text>
    <text x="70" y="618">sugar, starch and corn syrup; TiO2 pigment for paint; drying gases; lead storage batteries (35.67% as printed); laboratory reagent</text>
    <text x="70" y="642">its consumption is an indicator of a country's industrial progress; it is rarely contained in the final product</text>
  </g>
  <text class="s" x="600" y="690" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced; printed figures kept as printed.</text>
</svg>
