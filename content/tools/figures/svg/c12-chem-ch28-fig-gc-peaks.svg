<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- Roman Urdu aid (not a textbook figure): a gas chromatogram with peaks A, B and C against retention time; each peak is close to a triangle (base and height). -->
  <line x1="110.0" y1="420.0" x2="110.0" y2="62.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M110.0 50.0 L116.8 64.5 L103.2 64.5 Z" fill="#14181f"/>
  <line x1="110.0" y1="420.0" x2="937.2" y2="420.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M950.0 420.0 L935.5 426.8 L935.5 413.2 Z" fill="#14181f"/>
  <text x="60.0" y="235.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="600" transform="rotate(-90 60.0 235.0)">detector response</text>
  <text x="530.0" y="480.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">retention time</tspan></text>
  <path d="M215.0 420.0 L260.0 220.0 L305.0 420.0 Z" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="260.0" y="204.5" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">A</tspan></text>
  <path d="M465.0 420.0 L520.0 120.0 L575.0 420.0 Z" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="520.0" y="104.5" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">B</tspan></text>
  <path d="M740.0 420.0 L780.0 280.0 L820.0 420.0 Z" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="780.0" y="264.5" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="520.0" y1="120.0" x2="520.0" y2="420.0" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <line x1="524.0" y1="270.0" x2="585.0" y2="270.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="592.0" y="279.1" font-size="26" fill="#4b5563" text-anchor="start" font-weight="600"><tspan dy="0.0">height</tspan></text>
  <line x1="465.0" y1="440.0" x2="575.0" y2="440.0" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <text x="455.0" y="449.1" font-size="26" fill="#4b5563" text-anchor="end" font-weight="600"><tspan dy="0.0">base</tspan></text>
</svg>
