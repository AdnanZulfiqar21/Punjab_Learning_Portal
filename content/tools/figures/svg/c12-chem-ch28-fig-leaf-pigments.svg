<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Original sketch after Figure 28.1: a green leaf extract separated by chromatography into bands of carotene, xanthophyll, chlorophyll a, chlorophyll b and pheophytin, in the order the book shows. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Chromatography separates a mixture of leaf pigments</text>
  <rect x="330.0" y="70.0" width="60.0" height="300.0" rx="6" stroke="#475569" stroke-width="2.5" fill="#f8fafc"/>
  <rect x="345.0" y="90.0" width="30.0" height="270.0" rx="0" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
  <rect x="347.0" y="130.0" width="26.0" height="9.0" rx="2" stroke="#f59e0b" stroke-width="1" fill="#f59e0b"/>
  <line x1="392.0" y1="134.0" x2="440.0" y2="134.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="448.0" y="139.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">carotene</text>
  <rect x="347.0" y="172.0" width="26.0" height="9.0" rx="2" stroke="#eab308" stroke-width="1" fill="#eab308"/>
  <line x1="392.0" y1="176.0" x2="440.0" y2="176.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="448.0" y="181.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">xanthophyll</text>
  <rect x="347.0" y="214.0" width="26.0" height="9.0" rx="2" stroke="#0f766e" stroke-width="1" fill="#0f766e"/>
  <line x1="392.0" y1="218.0" x2="440.0" y2="218.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="448.0" y="223.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">chlorophyll a</text>
  <rect x="347.0" y="256.0" width="26.0" height="9.0" rx="2" stroke="#65a30d" stroke-width="1" fill="#65a30d"/>
  <line x1="392.0" y1="260.0" x2="440.0" y2="260.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="448.0" y="265.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">chlorophyll b</text>
  <rect x="347.0" y="298.0" width="26.0" height="9.0" rx="2" stroke="#a3a35c" stroke-width="1" fill="#a3a35c"/>
  <line x1="392.0" y1="302.0" x2="440.0" y2="302.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <text x="448.0" y="307.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">pheophytin</text>
  <rect x="330.0" y="365.0" width="60.0" height="8.0" rx="0" stroke="#475569" stroke-width="1.5" fill="#bfdbfe"/>
  <ellipse cx="180.0" cy="210.0" rx="80.0" ry="45.0" stroke="#0f7a62" stroke-width="2.5" fill="#bbf7d0" transform="rotate(-25 180.0 210.0)"/>
  <line x1="120.0" y1="240.0" x2="240.0" y2="180.0" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <text x="180.0" y="285.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">green leaf extract</text>
  <line x1="260.0" y1="210.0" x2="306.2" y2="210.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M315.0 210.0 L305.0 214.6 L305.0 205.4 Z" fill="#14181f"/>
  <text x="740.0" y="140.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">one green extract is</text>
  <text x="740.0" y="160.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">separated into coloured</text>
  <text x="740.0" y="180.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">bands, because each</text>
  <text x="740.0" y="200.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">pigment is held back</text>
  <text x="740.0" y="220.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">to a different extent</text>
  <text x="740.0" y="240.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">by the two phases</text>
  <text x="450.0" y="411" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
