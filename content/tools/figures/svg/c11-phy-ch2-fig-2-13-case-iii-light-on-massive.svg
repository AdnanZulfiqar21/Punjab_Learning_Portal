<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 2.13 (PDF page 43), original drawing after the printed figure: case (iii), a light ball m1 hits a massive ball m2 at rest and bounces back with -v1 while m2 stays at rest. -->
  <defs><radialGradient id="ballB" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#f2fbff"/><stop offset="0.45" stop-color="#7fd3f3"/><stop offset="1" stop-color="#1e98cf"/></radialGradient><radialGradient id="ballR" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#fff1ea"/><stop offset="0.45" stop-color="#f6a184"/><stop offset="1" stop-color="#d9603d"/></radialGradient></defs>
  <rect width="900" height="670" fill="#ffffff"/>
  <text x="40.0" y="46.0" font-size="32" fill="#2b8fc9" text-anchor="start" font-weight="700">case (iii)</text>
  <circle cx="140.0" cy="200.0" r="24.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="85.0" y1="150.0" x2="179.0" y2="150.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M195.0 150.0 L175.0 158.4 L175.0 141.6 Z" fill="#1a1a1a"/>
  <text x="140.0" y="134.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="140.0" y="260.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="480.0" cy="180.0" r="66.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <text x="480.0" y="72.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan> = 0</text>
  <text x="480.0" y="282.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="310.0" y="328.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="700">Before collision</text>
  <circle cx="420.0" cy="490.0" r="24.0" stroke="#1b7fae" stroke-width="2" fill="url(#ballB)"/>
  <line x1="475.0" y1="440.0" x2="381.0" y2="440.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="butt"/>
  <path d="M365.0 440.0 L385.0 431.6 L385.0 448.4 Z" fill="#1a1a1a"/>
  <text x="420.0" y="424.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan>′<tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan> = −<tspan font-weight="700">v</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="420.0" y="550.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">1</tspan><tspan dy="-9.6">​</tspan></text>
  <circle cx="740.0" cy="470.0" r="66.0" stroke="#b9472a" stroke-width="2" fill="url(#ballR)"/>
  <text x="740.0" y="362.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-weight="700">v</tspan>′<tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan> = 0</text>
  <text x="740.0" y="572.0" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan><tspan dy="9.6" font-size="20.4">2</tspan><tspan dy="-9.6">​</tspan></text>
  <text x="580.0" y="618.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="700">After collision</text>
</svg>
