  <text x="332.0" y="330.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">alpha-helix (keratin)</text>
  <path d="M255.0 372.0 L277.0 388.0 L299.0 372.0 L321.0 388.0 L343.0 372.0 L365.0 388.0 L387.0 372.0" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M255.0 406.0 L277.0 422.0 L299.0 406.0 L321.0 422.0 L343.0 406.0 L365.0 422.0 L387.0 406.0" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M255.0 440.0 L277.0 456.0 L299.0 440.0 L321.0 456.0 L343.0 440.0 L365.0 456.0 L387.0 440.0" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="332.0" y="488.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">beta-pleated sheet (silk)</text>
  <text x="332.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">hydrogen bonds between</text>
  <text x="332.0" y="537.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">C=O and N-H groups</text>
  <rect x="445.0" y="215.0" width="205.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="547.5" y="245.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">tertiary</text>
  <path d="M500 300 C 560 250, 620 300, 580 340 S 500 380, 540 420 S 620 440, 600 470 S 510 480, 520 440" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="547.0" y="515.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the whole chain folds:</text>
  <text x="547.0" y="532.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">H bonds, ionic bonds,</text>
  <text x="547.0" y="549.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">hydrophobic, S-S bridges</text>
  <rect x="660.0" y="215.0" width="225.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="772.5" y="245.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">quaternary</text>
  <ellipse cx="742.0" cy="330.0" rx="32.0" ry="26.0" stroke="#7c3aed" stroke-width="3" fill="#ffffff"/>
  <ellipse cx="802.0" cy="330.0" rx="32.0" ry="26.0" stroke="#d98b2b" stroke-width="3" fill="#ffffff"/>
  <ellipse cx="742.0" cy="390.0" rx="32.0" ry="26.0" stroke="#d98b2b" stroke-width="3" fill="#ffffff"/>
  <ellipse cx="802.0" cy="390.0" rx="32.0" ry="26.0" stroke="#7c3aed" stroke-width="3" fill="#ffffff"/>
  <text x="772.0" y="470.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">two or more folded</text>
  <text x="772.0" y="487.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">chains (subunits)</text>
  <text x="772.0" y="504.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">together, e.g.</text>
  <text x="772.0" y="521.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">haemoglobin</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
