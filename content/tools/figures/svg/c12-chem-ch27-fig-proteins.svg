<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 27.4 to 27.6: the peptide bond; primary structure (amino acid sequence), secondary (alpha-helix and beta-pleated sheet held by hydrogen bonds), tertiary (folding by side-chain interactions) and quaternary (several chains together). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Levels of protein structure</text>
  <rect x="15.0" y="55.0" width="870.0" height="150.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the peptide bond</text>
  <text x="450.0" y="110.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH(R)-COOH + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH(R')-COOH -&gt; H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH(R)-CO-NH-CH(R')-COOH + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="450.0" y="145.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the -CO-NH- amide link joins amino acids into a polypeptide chain (about 20 kinds of amino acid)</text>
  <text x="450.0" y="175.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">a change of even one amino acid can alter the protein (e.g. sickle-cell haemoglobin)</text>
  <rect x="15.0" y="215.0" width="205.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="117.5" y="245.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">primary</text>
  <circle cx="90.0" cy="260.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#60a5fa"/>
  <circle cx="117.5" cy="284.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#f472b6"/>
  <circle cx="132.0" cy="308.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#34d399"/>
  <circle cx="128.3" cy="332.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#fbbf24"/>
  <circle cx="112.2" cy="356.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#a78bfa"/>
  <circle cx="97.3" cy="380.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#f87171"/>
  <circle cx="96.1" cy="404.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#22d3ee"/>
  <circle cx="113.1" cy="428.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#60a5fa"/>
  <circle cx="141.5" cy="452.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#f472b6"/>
  <circle cx="167.8" cy="476.0" r="11.0" stroke="#14181f" stroke-width="1.5" fill="#34d399"/>
  <text x="117.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the sequence of</text>
  <text x="117.0" y="537.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">amino acids</text>
  <rect x="230.0" y="215.0" width="205.0" height="350.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="332.5" y="245.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">secondary</text>
