<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topics 31.2.1 and 31.2.2: health, physical and environmental hazards, and the path of lead, mercury and cadmium from electronics and batteries through soil and water to living things. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Hazards of materials and the path of heavy metals</text>
  <rect x="15.0" y="55.0" width="870.0" height="165.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">three kinds of hazard</text>
  <rect x="30.0" y="95.0" width="270.0" height="112.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="165.0" y="118.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">health</text>
  <text x="42.0" y="142.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">harm to health on exposure</text>
  <text x="42.0" y="162.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">e.g. chromium: carcinogen, mutagen</text>
  <text x="42.0" y="182.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">plastic additives: hormones</text>
  <rect x="315.0" y="95.0" width="270.0" height="112.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="450.0" y="118.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">physical</text>
  <text x="327.0" y="142.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">from physical or chemical properties</text>
  <text x="327.0" y="162.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">e.g. flammable or explosive</text>
  <text x="327.0" y="182.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">materials damage buildings, forests</text>
  <rect x="600.0" y="95.0" width="270.0" height="112.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="735.0" y="118.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">environmental</text>
  <text x="612.0" y="142.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">long-term harm to aquatic life</text>
  <text x="612.0" y="162.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">or the environment</text>
  <text x="612.0" y="182.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">e.g. Pb, Hg, Cd leach into soil</text>
  <rect x="15.0" y="235.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="265.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">heavy metals (Pb, Hg, Cd) reaching living things</text>
  <rect x="35.0" y="285.0" width="150.0" height="105.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="110.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">electronics,</text>
  <text x="110.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">batteries,</text>
  <text x="110.0" y="356.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">fluorescent lights</text>
  <line x1="187.0" y1="337.0" x2="196.6" y2="337.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M203.0 337.0 L195.7 340.4 L195.7 333.6 Z" fill="#d7322f"/>
  <rect x="205.0" y="285.0" width="150.0" height="105.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="280.0" y="329.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">discarded</text>
  <text x="280.0" y="347.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">as waste</text>
  <line x1="357.0" y1="337.0" x2="366.6" y2="337.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M373.0 337.0 L365.7 340.4 L365.7 333.6 Z" fill="#d7322f"/>
  <rect x="375.0" y="285.0" width="150.0" height="105.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="450.0" y="329.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">leach into soil</text>
  <text x="450.0" y="347.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">and groundwater</text>
  <line x1="527.0" y1="337.0" x2="536.6" y2="337.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M543.0 337.0 L535.7 340.4 L535.7 333.6 Z" fill="#d7322f"/>
  <rect x="545.0" y="285.0" width="150.0" height="105.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="620.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">taken up by</text>
  <text x="620.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">plants, fish and</text>
  <text x="620.0" y="356.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">other organisms</text>
  <line x1="697.0" y1="337.0" x2="706.6" y2="337.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M713.0 337.0 L705.7 340.4 L705.7 333.6 Z" fill="#d7322f"/>
  <rect x="715.0" y="285.0" width="150.0" height="105.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="790.0" y="320.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">reach humans</text>
  <text x="790.0" y="338.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">through food</text>
  <text x="790.0" y="356.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">and water</text>
  <text x="450.0" y="420.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Plastics: additives such as phthalates and bisphenol A (BPA) can interfere with hormones;</text>
  <text x="450.0" y="438.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">microplastics are now found in oceans, soil and even food.</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
