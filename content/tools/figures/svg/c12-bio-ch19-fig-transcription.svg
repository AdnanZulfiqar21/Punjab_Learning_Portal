<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 19.14 and 19.15: RNA polymerase in a transcription bubble making RNA on the template strand with a short RNA-DNA helix, and termination where a GC hairpin in the RNA makes the polymerase pause and the weak U-A pairs let the RNA go. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Transcription: elongation and termination</text>
  <rect x="15.0" y="55.0" width="870.0" height="270.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">elongation: inside the transcription bubble</text>
  <line x1="40.0" y1="150.0" x2="300.0" y2="150.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <line x1="40.0" y1="230.0" x2="300.0" y2="230.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <path d="M300 150 Q380 100 470 100 Q560 100 620 150" stroke="#1e3a8a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300 230 Q380 250 470 250 Q560 250 620 230" stroke="#1e3a8a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="620.0" y1="150.0" x2="860.0" y2="150.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <line x1="620.0" y1="230.0" x2="860.0" y2="230.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <ellipse cx="470.0" cy="190.0" rx="170.0" ry="95.0" stroke="#7c3aed" stroke-width="3" fill="none" stroke-dasharray="8 5"/>
  <text x="680.0" y="125.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">RNA polymerase</text>
  <line x1="676.0" y1="120.0" x2="610.0" y2="150.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="610.0" cy="150.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <line x1="420.0" y1="232.0" x2="540.0" y2="232.0" stroke="#dc2626" stroke-width="6" stroke-linecap="butt"/>
  <path d="M420 226 Q370 190 330 150 Q300 120 250 110" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="240.0" y="102.0" font-size="13" fill="#dc2626" text-anchor="end" font-weight="700">5'</text>
  <text x="548.0" y="226.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">3'</text>
  <text x="480.0" y="218.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">RNA-DNA helix</text>
  <text x="80.0" y="140.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">coding strand</text>
  <text x="80.0" y="258.0" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">template strand</text>
  <line x1="640.0" y1="290.0" x2="752.8" y2="290.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M760.0 290.0 L751.8 293.8 L751.8 286.2 Z" fill="#4b5563"/>
  <text x="650.0" y="280.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">bubble moves along</text>
  <text x="60.0" y="300.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">rNTPs added 5' to 3'; two phosphates split off each for energy; DNA re-winds behind</text>
  <rect x="15.0" y="340.0" width="870.0" height="265.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="370.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">termination: the GC hairpin</text>
  <line x1="40.0" y1="520.0" x2="860.0" y2="520.0" stroke="#1e3a8a" stroke-width="7" stroke-linecap="butt"/>
  <text x="520.0" y="548.0" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
  <text x="546.0" y="548.0" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
  <text x="572.0" y="548.0" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
  <text x="598.0" y="548.0" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">A</text>
  <text x="380.0" y="548.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">GC-rich stop region on template</text>
  <path d="M120 470 L330 470" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M330 470 L360 470 L360 400 Q385 370 410 400 L410 470 L500 470" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="366.0" y1="455.0" x2="404.0" y2="455.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="366.0" y1="440.0" x2="404.0" y2="440.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="366.0" y1="425.0" x2="404.0" y2="425.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="366.0" y1="410.0" x2="404.0" y2="410.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <text x="520.0" y="458.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">U</text>
  <text x="546.0" y="458.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">U</text>
  <text x="572.0" y="458.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">U</text>
  <text x="598.0" y="458.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">U</text>
  <line x1="500.0" y1="470.0" x2="600.0" y2="470.0" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <text x="440.0" y="400.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">hairpin: G-C pairs within the RNA</text>
  <line x1="436.0" y1="395.0" x2="410.0" y2="410.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="410.0" cy="410.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="560.0" y="436.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">weak U-A pairs let go</text>
  <ellipse cx="790.0" cy="470.0" rx="62.0" ry="36.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="790.0" y="474.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">pauses</text>
  <line x1="140.0" y1="440.0" x2="140.0" y2="407.2" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <path d="M140.0 400.0 L143.8 408.2 L136.2 408.2 Z" fill="#dc2626"/>
  <text x="150.0" y="405.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">RNA released</text>
  <text x="450.0" y="611" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
