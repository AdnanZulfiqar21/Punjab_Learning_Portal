<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <!-- Original RU-only sketch of competitive inhibition by sulfonamides (topic 23.2.4; not a textbook figure). -->
  <text x="30" y="150" font-size="28" fill="#1d2430" text-anchor="start" font-weight="700">normal</text>
  <path d="M260 90 L460 90 L460 140 L385 140 L360 170 L335 140 L260 140 Z" stroke="#4a5160" stroke-width="3" fill="#e1e7ef" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M338 142 L382 142 L360 172 Z" stroke="#1f6fb5" stroke-width="3" fill="#d6e7fb" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="360" y="212" font-size="23" fill="#4a5160" text-anchor="middle" font-weight="700">bacterial enzyme</text>
  <text x="360" y="76" font-size="25" fill="#1f6fb5" text-anchor="middle" font-weight="700">PABA fits the site</text>
  <line x1="480" y1="140" x2="548.8" y2="140" stroke="#1d2430" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M560 140 L545.9 147.5 L545.9 132.5 Z" fill="#1d2430"/>
  <rect x="570" y="106" width="220" height="68" rx="12" stroke="#137a5a" stroke-width="3" fill="#e3f8ec"/>
  <text x="680" y="149" font-size="26" fill="#137a5a" text-anchor="middle" font-weight="700">folic acid made</text>
  <line x1="800" y1="140" x2="838.8" y2="140" stroke="#137a5a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M850 140 L835.9 147.5 L835.9 132.5 Z" fill="#137a5a"/>
  <text x="860" y="134" font-size="24" fill="#1d2430" text-anchor="start" font-weight="700">DNA,</text>
  <text x="860" y="164" font-size="24" fill="#1d2430" text-anchor="start" font-weight="700">growth</text>
  <text x="30" y="400" font-size="28" fill="#1d2430" text-anchor="start" font-weight="700">sulfonamide</text>
  <path d="M260 340 L460 340 L460 390 L385 390 L360 420 L335 390 L260 390 Z" stroke="#4a5160" stroke-width="3" fill="#e1e7ef" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M338 392 L382 392 L360 422 Z" stroke="#d0322f" stroke-width="3" fill="#fde2e2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="360" y="462" font-size="23" fill="#4a5160" text-anchor="middle" font-weight="700">bacterial enzyme</text>
  <text x="360" y="326" font-size="25" fill="#d0322f" text-anchor="middle" font-weight="700">sulfonamide takes the site</text>
  <line x1="480" y1="390" x2="548.8" y2="390" stroke="#1d2430" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M560 390 L545.9 397.5 L545.9 382.5 Z" fill="#1d2430"/>
  <rect x="570" y="356" width="220" height="68" rx="12" stroke="#d0322f" stroke-width="3" fill="#fde2e2"/>
  <text x="680" y="399" font-size="26" fill="#d0322f" text-anchor="middle" font-weight="700">no folic acid</text>
  <line x1="800" y1="390" x2="838.8" y2="390" stroke="#d0322f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M850 390 L835.9 397.5 L835.9 382.5 Z" fill="#d0322f"/>
  <text x="860" y="384" font-size="24" fill="#1d2430" text-anchor="start" font-weight="700">growth</text>
  <text x="860" y="414" font-size="24" fill="#1d2430" text-anchor="start" font-weight="700">stops</text>
</svg>
