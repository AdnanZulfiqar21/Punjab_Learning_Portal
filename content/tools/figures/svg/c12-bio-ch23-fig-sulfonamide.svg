<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original diagram for topic 23.2.4: PABA fits a bacterial enzyme so folic acid is made, while a sulfonamide, which looks like PABA, occupies the enzyme so no folic acid is made and bacterial growth stops. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Sulfonamides: a look-alike that blocks folate making</text>
  <text x="40.0" y="116.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">normal</text>
  <path d="M240 70 L380 70 L380 100 L350 100 L340 120 L320 120 L310 100 L240 100 Z" stroke="#475569" stroke-width="2" fill="#e2e8f0" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="310.0" y="150.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bacterial enzyme</text>
  <path d="M314 102 L330 126 L346 102 Z" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330.0" y="144.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700"></text>
  <text x="380.0" y="180.0" font-size="11" fill="#1f6fb5" text-anchor="middle" font-weight="700"></text>
  <text x="420.0" y="92.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">PABA fits the site</text>
  <line x1="420.0" y1="110.0" x2="513.6" y2="110.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M520.0 110.0 L512.7 113.4 L512.7 106.6 Z" fill="#14181f"/>
  <rect x="540.0" y="88.0" width="160.0" height="44.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="620.0" y="115.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">folic acid made</text>
  <text x="780.0" y="106.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">DNA, growth</text>
  <line x1="705.0" y1="110.0" x2="764.4" y2="110.0" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <path d="M770.0 110.0 L763.7 113.0 L763.7 107.0 Z" fill="#0f7a62"/>
  <text x="40.0" y="276.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700">with a sulfonamide</text>
  <path d="M240 230 L380 230 L380 260 L350 260 L340 280 L320 280 L310 260 L240 260 Z" stroke="#475569" stroke-width="2" fill="#e2e8f0" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="310.0" y="310.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bacterial enzyme</text>
  <path d="M314 262 L330 286 L346 262 Z" stroke="#d7322f" stroke-width="2" fill="#fee2e2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="330.0" y="304.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700"></text>
  <text x="380.0" y="340.0" font-size="11" fill="#d7322f" text-anchor="middle" font-weight="700"></text>
  <text x="420.0" y="252.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">sulfa takes the site</text>
  <line x1="420.0" y1="270.0" x2="513.6" y2="270.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M520.0 270.0 L512.7 273.4 L512.7 266.6 Z" fill="#14181f"/>
  <rect x="540.0" y="248.0" width="160.0" height="44.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#fee2e2"/>
  <text x="620.0" y="275.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">no folic acid</text>
  <text x="720.0" y="266.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">growth stops</text>
  <text x="720.0" y="284.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">(bacteriostatic)</text>
  <rect x="40.0" y="360.0" width="820.0" height="80.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="388.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Sulfonamides resemble PABA (para-aminobenzoic acid), which bacteria use to build folic acid; they compete for the enzyme.</text>
  <text x="60.0" y="410.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Humans get folate from food, so their cells are not harmed. Trimethoprim is often added for a stronger, bactericidal effect.</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
