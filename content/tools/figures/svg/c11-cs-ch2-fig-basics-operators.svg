<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 2.1 to 2.3: the steps from code to output, variables and naming rules, data types and input conversion, the operator families and operator precedence. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Programming steps, variables and data types, operators and precedence</text>
  <rect x="50" y="55" width="540" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">From code to output (2.1.1.1)</text>
  <rect x="70" y="110" width="112" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="98" y="134">Write code</text>
  <path d="M182 130 L196 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="198" y="110" width="112" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="201" y="134">Compile / interpret</text>
  <path d="M310 130 L324 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="326" y="110" width="112" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="362" y="134">Execute</text>
  <path d="M438 130 L452 130" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <rect x="454" y="110" width="112" height="40" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="493" y="134">Output</text>
  <g class="r">
    <text x="70" y="190">a variable is a named storage box in memory whose value can change:</text>
    <text x="70" y="206">age = 71  then  age = 60  (the same name, a new value)</text>
    <text x="70" y="238">naming rules: start with a letter or _, then letters, digits or _;</text>
    <text x="70" y="254">case-sensitive (age and Age differ); no keywords (for, while, if);</text>
    <text x="70" y="270">use meaningful snake_case names such as student_name</text>
    <text x="70" y="286">comments: # one line, or text between triple quotes for many lines</text>
  </g>
  <rect x="610" y="55" width="540" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Data types and input (2.2.1.3 to 2.2.1.5)</text>
  <text class="l" x="630" y="104">type</text>
  <text class="l" x="700" y="104">stores</text>
  <text class="l" x="850" y="104">example</text>
  <text class="r" x="630" y="126">int</text>
  <text class="r" x="700" y="126">whole numbers</text>
  <text class="f" x="850" y="126">age = 17</text>
  <text class="r" x="630" y="148">float</text>
  <text class="r" x="700" y="148">decimal numbers</text>
  <text class="f" x="850" y="148">price = 19.99</text>
  <text class="r" x="630" y="170">str</text>
  <text class="r" x="700" y="170">text in quotes</text>
  <text class="f" x="850" y="170">name = "Ali"</text>
  <text class="r" x="630" y="192">bool</text>
  <text class="r" x="700" y="192">True or False</text>
  <text class="f" x="850" y="192">is_student = True</text>
  <g class="r">
    <text x="630" y="230">input() always returns text: name = input("Enter your name: ")</text>
    <text x="630" y="246">convert numbers: int(input(...)) for whole numbers,</text>
    <text x="630" y="262">float(input(...)) for decimals; print() shows output</text>
    <text x="630" y="278">print("Your age is:", user_age)</text>
  </g>
  <rect x="50" y="375" width="540" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="403">Operators (2.3)</text>
  <text class="l" x="70" y="420">arithmetic</text>
  <text class="f" x="190" y="420">+  -  *  /  //  %  **</text>
  <text class="r" x="70" y="440">10 / 3 = 3.33..; 10 // 3 = 3; 10 % 3 = 1; 10 ** 3 = 1000</text>
  <text class="l" x="70" y="482">comparison</text>
  <text class="f" x="190" y="482">==  !=  &gt;  &lt;  &gt;=  &lt;=</text>
  <text class="r" x="70" y="502">10 &gt; 5 is True; 10 == 5 is False</text>
  <text class="l" x="70" y="544">assignment</text>
  <text class="f" x="190" y="544">=  +=  -=  *=  /=  //=  %=  **=</text>
  <text class="r" x="70" y="564">a = 10; a += 5 gives 15</text>
  <text class="l" x="70" y="606">logical</text>
  <text class="f" x="190" y="606">and  or  not</text>
  <text class="r" x="70" y="626">True and False is False; not True is False</text>
  <rect x="610" y="375" width="540" height="320" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="403">Operator precedence (2.3.6)</text>
  <rect x="700.0" y="420" width="360" height="34" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="825" y="441">( )  parentheses</text>
  <rect x="725.0" y="466" width="310" height="34" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="818" y="487">**  exponentiation</text>
  <rect x="750.0" y="512" width="260" height="34" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="842" y="533">*  /  //  %</text>
  <rect x="775.0" y="558" width="210" height="34" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="866" y="579">+  -</text>
  <text class="r" x="640" y="438">highest</text>
  <text class="r" x="640" y="576">lowest</text>
  <g class="f">
    <text x="630" y="630">3 + 2 * 5        = 3 + 10 = 13</text>
    <text x="630" y="648">(3 + 2) * 4      = 20;   2 ** 3 = 8</text>
    <text x="630" y="666">10 + 3 * 2 ** 2 - 5 / 5 = 21.0</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
