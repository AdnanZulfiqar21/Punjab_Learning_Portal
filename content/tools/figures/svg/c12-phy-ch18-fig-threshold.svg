  <text x="225.0" y="405.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">only photons above the threshold frequency f_o</text>
  <text x="225.0" y="422.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">can free an electron, whatever the intensity</text>
  <rect x="445.0" y="55.0" width="440.0" height="400.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="665.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">maximum KE against frequency</text>
