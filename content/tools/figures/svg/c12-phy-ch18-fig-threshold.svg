  <circle cx="600.0" cy="330.0" r="5.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="600.0" y="352.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">f</tspan><tspan dy="4.5" font-size="9.8">o</tspan></text>
  <text x="494.0" y="384.0" font-size="13" fill="#14181f" text-anchor="end" font-weight="700">-phi</text>
  <text x="680.0" y="395.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">slope = h (the same for every metal);</text>
  <text x="680.0" y="412.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">intercept on the f-axis = threshold frequency</text>
  <text x="670.0" y="170.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">KE</tspan><tspan dy="5.1" font-size="11.2">max</tspan><tspan dy="-5.1"> = hf - phi = hf - hf</tspan><tspan dy="5.1" font-size="11.2">o</tspan></text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
