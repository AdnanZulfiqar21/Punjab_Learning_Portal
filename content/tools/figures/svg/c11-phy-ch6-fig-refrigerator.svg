<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 6.10: a refrigerator uses work W to take heat Q2 from the cold compartment and give Q1 = Q2 + W to the surroundings. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A refrigerator moves heat from cold to hot</text>
  <rect x="200.0" y="60.0" width="500.0" height="70.0" rx="10" stroke="#d7322f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="450.0" y="102.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">hot surroundings (kitchen) at T1</text>
  <rect x="200.0" y="330.0" width="500.0" height="70.0" rx="10" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="450.0" y="372.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">cold compartment at T2</text>
  <circle cx="450.0" cy="230.0" r="62.0" stroke="#14181f" stroke-width="3" fill="#e5e7eb"/>
  <text x="450.0" y="236.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">refrigerator</text>
  <line x1="450.0" y1="328.0" x2="450.0" y2="306.4" stroke="#1f6fb5" stroke-width="5" stroke-linecap="round"/>
  <path d="M450.0 296.0 L455.5 307.8 L444.5 307.8 Z" fill="#1f6fb5"/>
  <text x="462.0" y="316.0" font-size="16" fill="#1f6fb5" text-anchor="start" font-weight="700">Q2 taken from the cold side</text>
  <line x1="450.0" y1="166.0" x2="450.0" y2="144.4" stroke="#d7322f" stroke-width="5" stroke-linecap="round"/>
  <path d="M450.0 134.0 L455.5 145.8 L444.5 145.8 Z" fill="#d7322f"/>
  <text x="462.0" y="156.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700">Q1 = Q2 + W given out</text>
  <line x1="700.0" y1="230.0" x2="526.4" y2="230.0" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <path d="M516.0 230.0 L527.8 224.5 L527.8 235.5 Z" fill="#7c3aed"/>
  <text x="710.0" y="224.0" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="700">work W</text>
  <text x="710.0" y="244.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="400">(electric motor)</text>
  <text x="450.0" y="435.0" font-size="16" fill="#4b5563" text-anchor="middle" font-weight="400">Heat does not flow from cold to hot by itself: work must be done.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
