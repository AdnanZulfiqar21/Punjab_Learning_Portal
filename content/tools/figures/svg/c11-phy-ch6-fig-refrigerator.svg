<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 6.10 (PDF page 132), original drawing after the printed schematic: the refrigerator takes heat Q_C in from the low temperature compartment, work W is done on it, and it gives heat Q_H out to the higher temperature surroundings. -->
  <rect width="900" height="940" fill="#ffffff"/>
  <rect x="290.0" y="120.0" width="180.0" height="680.0" rx="0" stroke="#8d99a6" stroke-width="3" fill="#c9d3dc"/>
  <rect x="460.0" y="410.0" width="380.0" height="110.0" rx="0" stroke="#8d99a6" stroke-width="3" fill="#c9d3dc"/>
  <rect x="450" y="413" width="30" height="104" fill="#c9d3dc"/>
  <rect x="100.0" y="30.0" width="700.0" height="90.0" rx="0" stroke="#b5121b" stroke-width="3" fill="#e8202a"/>
  <text x="450.0" y="88.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="400">Higher temperature surroundings</text>
  <rect x="100.0" y="800.0" width="700.0" height="90.0" rx="0" stroke="#c4600f" stroke-width="3" fill="#f39a2c"/>
  <text x="450.0" y="858.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="400">Low temperature compartment</text>
  <circle cx="380.0" cy="465.0" r="120.0" stroke="#7d8792" stroke-width="3" fill="#a9b3bd"/>
  <text x="380.0" y="476.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">Refrigerator</text>
  <text x="380.0" y="190.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">Heat out</text>
  <line x1="350.0" y1="300.0" x2="350.0" y2="237.6" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M350.0 220.0 L359.2 242.0 L340.8 242.0 Z" fill="#1a1a1a"/>
  <text x="372.0" y="270.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan font-style="italic">Q</tspan><tspan dy="10.9" font-size="23.1">H</tspan><tspan dy="-10.9">​</tspan></text>
  <line x1="350.0" y1="700.0" x2="350.0" y2="637.6" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M350.0 620.0 L359.2 642.0 L340.8 642.0 Z" fill="#1a1a1a"/>
  <text x="372.0" y="670.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan font-style="italic">Q</tspan><tspan dy="10.9" font-size="23.1">C</tspan><tspan dy="-10.9">​</tspan></text>
  <text x="380.0" y="760.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">Heat in</text>
  <line x1="720.0" y1="478.0" x2="577.6" y2="478.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt"/>
  <path d="M560.0 478.0 L582.0 468.8 L582.0 487.2 Z" fill="#1a1a1a"/>
  <text x="540.0" y="490.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">W</tspan></text>
  <text x="730.0" y="490.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">work</text>
</svg>
