<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram for topic 7.11: phytochrome interconversion and the critical night length; the textbook has a table only. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .b{font-size:22px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="320" y="40">Phytochrome: the plant's clock</text>
  <rect x="80" y="130" width="180" height="80" rx="16" fill="#9ca3af"/><text class="b" x="170" y="165">P660</text><text class="b" x="170" y="192" style="font-size:16px">quiescent form</text>
  <rect x="400" y="130" width="180" height="80" rx="16" fill="#d7322f"/><text class="b" x="490" y="165">P730</text><text class="b" x="490" y="192" style="font-size:16px">active form</text>
  <path d="M265 150 H395" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="330" y="118">red light, 660 nm (daylight)</text>
  <path d="M395 190 H265" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="330" y="240">far-red, 730 nm, or slowly in the dark</text>
  <text class="s" x="330" y="280">P730 builds up by day and decays at night;</text><text class="s" x="330" y="302">the rate of decay measures the length of darkness</text>
  <text class="s" x="330" y="340">enough P730 at dawn promotes flowering in long-day plants</text><text class="s" x="330" y="362">and inhibits it in short-day plants</text>
  <text class="s" x="330" y="400">the stimulated clock makes florigen in the leaves,</text><text class="s" x="330" y="422">which travels in the phloem to the floral buds</text>
  <!-- night length bars -->
  <text class="h" x="900" y="40">It is the night that counts</text>
  <g font-size="16" fill="#4b5563">
    <text x="700" y="110">short-day (long-night) plant, e.g. cocklebur: night over 8.5 h</text>
    <rect x="700" y="125" width="160" height="26" fill="#f2b134"/><rect x="860" y="125" width="240" height="26" fill="#14181f"/><text x="1110" y="144" fill="#0f7a62" font-weight="700">flowers</text>
    <rect x="700" y="160" width="160" height="26" fill="#f2b134"/><rect x="860" y="160" width="110" height="26" fill="#14181f"/><rect x="970" y="160" width="14" height="26" fill="#f2b134"/><rect x="984" y="160" width="116" height="26" fill="#14181f"/><text x="1110" y="179" fill="#d7322f" font-weight="700">no flowers</text>
    <text x="700" y="210">a flash of light in the long night resets the clock: flowering prevented</text>
    <text x="700" y="270">long-day (short-night) plant, e.g. henbane: night under 13 h</text>
    <rect x="700" y="285" width="260" height="26" fill="#f2b134"/><rect x="960" y="285" width="140" height="26" fill="#14181f"/><text x="1110" y="304" fill="#0f7a62" font-weight="700">flowers</text>
    <rect x="700" y="320" width="160" height="26" fill="#f2b134"/><rect x="860" y="320" width="110" height="26" fill="#14181f"/><rect x="970" y="320" width="14" height="26" fill="#f2b134"/><rect x="984" y="320" width="116" height="26" fill="#14181f"/><text x="1110" y="339" fill="#0f7a62" font-weight="700">flowers</text>
    <text x="700" y="370">interrupting a long night lets a long-day plant flower in short days</text>
    <text x="700" y="420">yellow: day · black: night</text>
  </g>
  <text class="s" x="600" y="500">Garner and Allard (1920) found that tobacco flowers only after a series of short days; later work showed the dark period is what matters.</text>
  <text class="s" x="600" y="540">Short-day plants: cocklebur, chrysanthemum, soya bean, tobacco, strawberry. Long-day: henbane, snapdragon, cabbage, spring wheat, spring barley.</text>
  <text class="s" x="600" y="580">Day-neutral: cucumber, tomato, garden pea, maize, cotton.</text>
  <text class="s" x="600" y="630">Vernalisation: cold (about 4 degrees Celsius, four days to three months) received by the shoot apex or embryo</text><text class="s" x="600" y="656">makes vernalin and induces flowering in biennials and perennials.</text>
</svg>
