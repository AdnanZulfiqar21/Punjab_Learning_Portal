<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Our own diagram (Roman Urdu lesson only): phytochrome forms and night length; the textbook has a table only -->
  <rect x="60.0" y="60.0" width="260.0" height="120.0" rx="60" stroke="#b45309" stroke-width="3" fill="#fde68a"/>
  <text x="190.0" y="132.0" font-size="40" fill="#14181f" text-anchor="middle" font-weight="700">P660</text>
  <rect x="880.0" y="60.0" width="260.0" height="120.0" rx="60" stroke="#7f1d1d" stroke-width="3" fill="#fecaca"/>
  <text x="1010.0" y="132.0" font-size="40" fill="#14181f" text-anchor="middle" font-weight="700">P730</text>
  <text x="190.0" y="215.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">quiescent form</text>
  <text x="1010.0" y="215.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">active form</text>
  <line x1="330.0" y1="95.0" x2="855.6" y2="95.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M870.0 95.0 L849.2 107.0 L849.2 83.0 Z" fill="#dc2626"/>
  <text x="600.0" y="80.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">red light, 660 nm (day light)</text>
  <line x1="870.0" y1="150.0" x2="344.4" y2="150.0" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <path d="M330.0 150.0 L350.8 138.0 L350.8 162.0 Z" fill="#7f1d1d"/>
  <text x="600.0" y="190.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400">far-red light, 730 nm; slowly in the dark</text>
  <text x="600.0" y="290.0" font-size="26" fill="#475569" text-anchor="middle" font-weight="400">24 hours</text>
  <text x="310.0" y="362.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="700">Short-day plant</text>
  <rect x="330.0" y="320.0" width="225.0" height="60.0" rx="0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <rect x="555.0" y="320.0" width="315.0" height="60.0" rx="0" stroke="#111827" stroke-width="2" fill="#1f2937"/>
  <text x="900.0" y="362.0" font-size="28" fill="#166534" text-anchor="start" font-weight="700">flowers</text>
  <text x="310.0" y="457.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="700">Short-day plant</text>
  <rect x="330.0" y="415.0" width="225.0" height="60.0" rx="0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <rect x="555.0" y="415.0" width="315.0" height="60.0" rx="0" stroke="#111827" stroke-width="2" fill="#1f2937"/>
  <rect x="706" y="407" width="12" height="76" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <text x="900.0" y="457.0" font-size="28" fill="#b91c1c" text-anchor="start" font-weight="700">no flowers</text>
  <text x="310.0" y="552.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="700">Long-day plant</text>
  <rect x="330.0" y="510.0" width="360.0" height="60.0" rx="0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <rect x="690.0" y="510.0" width="180.0" height="60.0" rx="0" stroke="#111827" stroke-width="2" fill="#1f2937"/>
  <text x="900.0" y="552.0" font-size="28" fill="#166534" text-anchor="start" font-weight="700">flowers</text>
  <text x="310.0" y="647.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="700">Long-day plant</text>
  <rect x="330.0" y="605.0" width="225.0" height="60.0" rx="0" stroke="#a16207" stroke-width="2" fill="#fde047"/>
  <rect x="555.0" y="605.0" width="315.0" height="60.0" rx="0" stroke="#111827" stroke-width="2" fill="#1f2937"/>
  <rect x="706" y="597" width="12" height="76" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <text x="900.0" y="647.0" font-size="28" fill="#166534" text-anchor="start" font-weight="700">flowers</text>
</svg>
