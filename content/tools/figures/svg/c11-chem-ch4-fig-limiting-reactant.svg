<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Sample Problem 4.19 and the hydrogen-oxygen example: finding the limiting reactant, the maximum product, the excess left over, and the percentage yield. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .t{font-size:14px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:17px;fill:#14181f;text-anchor:middle}
      .b{font-size:13px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Limiting reactant, excess reactant and percentage yield</text>
  <text class="f" x="330" y="72">CH4 + 2 O2 = CO2 + 2 H2O (30 g CH4 with 50 g O2)</text>
  <!-- bars: moles available and moles needed -->
  <text class="k" x="330" y="108">Moles available</text>
  <text class="t" x="80" y="150">CH4: 30 / 16 = 1.875 mol</text>
  <rect x="80" y="160" width="375" height="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="t" x="80" y="215">O2: 50 / 32 = 1.563 mol</text>
  <rect x="80" y="225" width="313" height="22" fill="#f6d5cf" stroke="#d7322f" stroke-width="1.5"/>
  <text class="k" x="330" y="290">CO2 each could make</text>
  <text class="t" x="80" y="320">from CH4: 1.875 x 1 = 1.875 mol</text>
  <rect x="80" y="330" width="375" height="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="t" x="80" y="380">from O2: 1.563 x 1/2 = 0.7815 mol (less: O2 limits)</text>
  <rect x="80" y="390" width="156" height="22" fill="#f6d5cf" stroke="#d7322f" stroke-width="1.5"/>
  <path d="M236 385 V420" stroke="#d7322f" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="b" x="300" y="440" style="fill:#d7322f">limiting reactant: O2</text>
  <g class="t">
    <text x="80" y="480">product: 0.7815 mol CO2 x 44 = 34.39 g (the maximum)</text>
    <text x="80" y="504">CH4 used: 1.563 x 1/2 = 0.7815 mol; left: 1.875 - 0.7815 = 1.0935 mol</text>
    <text x="80" y="528">excess CH4 unreacted: 1.0935 x 16.0 = 17.5 g</text>
  </g>
  <!-- right column: H2/O2 and yield -->
  <rect x="640" y="95" width="500" height="200" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="890" y="123">2 H2 + O2 = 2 H2O</text>
  <g class="t">
    <text x="660" y="152">2 mol H2 (4 g) + 2 mol O2 (64 g): only 2 mol (36 g) of water,</text>
    <text x="660" y="174">because 2 mol H2 need just 1 mol O2; H2 runs out first and limits,</text>
    <text x="660" y="196">1 mol O2 (32 g) is left in excess</text>
    <text x="660" y="228">1 mol H2 + 1 mol O2: all the H2 reacts with 1/2 mol O2,</text>
    <text x="660" y="250">the other 1/2 mol O2 stays unreacted</text>
    <text x="660" y="280">once the limiting reactant is used up, the reaction stops</text>
  </g>
  <rect x="640" y="320" width="500" height="230" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="890" y="348">Yield</text>
  <text class="f" x="890" y="382">% yield = actual yield / theoretical yield x 100</text>
  <g class="t">
    <text x="660" y="412">theoretical yield: the maximum product the balanced equation</text>
    <text x="660" y="434">allows from the limiting reactant; actual yield: what is obtained</text>
    <text x="660" y="464">actual is usually lower: losses in filtration, distillation, washing,</text>
    <text x="660" y="486">drying and crystallization; side reactions; reversible reactions</text>
    <text x="660" y="516">aspirin (Sample 4.20): 0.022 mol salicylic acid gives 3.96 g at most;</text>
    <text x="660" y="538">an actual 2.85 g is 2.85 / 3.96 x 100 = 72 %</text>
  </g>
  <text class="s" x="600" y="600">Why excess is used: to convert all of the expensive reactant, to get the most product, and to speed the reaction (more oxygen makes a fire burn faster).</text>
</svg>
