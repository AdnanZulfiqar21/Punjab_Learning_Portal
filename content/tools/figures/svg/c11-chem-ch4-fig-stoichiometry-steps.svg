<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after the printed approach to stoichiometric calculations (page 82) and the four readings of N2 + 3H2 = 2NH3. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .t{font-size:14px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:18px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Reading a balanced equation and the five steps of a stoichiometric calculation</text>
  <!-- equation readings -->
  <text class="f" x="300" y="85">N2(g) + 3H2(g) = 2NH3(g)</text>
  <rect x="60" y="105" width="480" height="200" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="t">
    <text x="80" y="135"><tspan font-weight="700" fill="#14181f">moles:</tspan> 1 mol N2 + 3 mol H2 give 2 mol NH3</text>
    <text x="80" y="165"><tspan font-weight="700" fill="#14181f">molecules:</tspan> 1 molecule + 3 molecules give 2 molecules</text>
    <text x="80" y="195"><tspan font-weight="700" fill="#14181f">volumes at STP:</tspan> 22.4 dm3 + 67.2 dm3 give 44.8 dm3</text>
    <text x="80" y="225"><tspan font-weight="700" fill="#14181f">masses:</tspan> 28.0 g + 6.0 g give 34.0 g</text>
    <text x="80" y="262">mass is conserved: 28.0 + 6.0 = 34.0 g on both sides;</text>
    <text x="80" y="284">the mole ratio 1 : 3 : 2 is the key to every conversion</text>
  </g>
  <!-- assumptions -->
  <rect x="60" y="330" width="480" height="150" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="300" y="358">Assumptions behind every calculation</text>
  <g class="t">
    <text x="80" y="388">1. all the reactants are completely converted into products</text>
    <text x="80" y="413">2. the laws of conservation of mass and definite proportions hold</text>
    <text x="80" y="438">3. no side reaction occurs</text>
  </g>
  <!-- steps flow -->
  <g>
    <rect x="620" y="70" width="520" height="62" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <text class="k" x="880" y="95">1. Known quantity</text><text class="s" x="880" y="118">mass of a solid, volume of a gas, or C and V of a solution</text>
    <path d="M880 132 V158" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="620" y="162" width="520" height="62" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <text class="k" x="880" y="187">2. Moles of the known</text><text class="s" x="880" y="210">n = m / M, n = V / 22.4, or n = C x V</text>
    <path d="M880 224 V250" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="620" y="254" width="520" height="62" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="k" x="880" y="279">3. Mole ratio from the balanced equation</text><text class="s" x="880" y="302">known : unknown, read from the coefficients</text>
    <path d="M880 316 V342" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="620" y="346" width="520" height="62" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <text class="k" x="880" y="371">4. Moles of the unknown</text><text class="s" x="880" y="394">moles of known x (unknown coefficient / known coefficient)</text>
    <path d="M880 408 V434" stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="620" y="438" width="520" height="62" rx="10" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/>
    <text class="k" x="880" y="463">5. Convert the unknown moles</text><text class="s" x="880" y="486">to mass (n x M), gas volume (n x 22.4 dm3) or concentration (n / V)</text>
  </g>
  <rect x="60" y="515" width="1080" height="100" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="543">Six relationships from one equation</text>
  <text class="s" x="600" y="570">mole-mole, mass-mass, volume-volume, mole-mass, mole-volume, mass-volume</text>
  <text class="s" x="600" y="596">example: 100 dm3 of H2 gives 100 x (2/3) = 66.7 dm3 of NH3 at STP; 20.0 mol LiOH gives 10.0 mol = 739.0 g of Li2CO3</text>
</svg>
