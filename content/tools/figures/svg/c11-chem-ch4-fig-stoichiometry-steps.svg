<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="Arial, Helvetica, sans-serif">
  <!-- Approach to do stoichiometric calculations (original drawing after the flowchart printed on p82 of the textbook) -->
  <rect width="1100" height="920" fill="#ffffff"/>
  <rect x="30.0" y="20.0" width="1040.0" height="120.0" rx="22" stroke="#f2d900" stroke-width="4" fill="#fffde8"/>
  <text x="60.0" y="68.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Mass of known solid or volume of a known gas, or molar concentration of</tspan></text>
  <text x="60.0" y="108.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>known solution</tspan></text>
  <line x1="550.0" y1="148.0" x2="550.0" y2="184.4" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <path d="M550.0 202.0 L539.7 182.6 L560.3 182.6 Z" fill="#111111"/>
  <rect x="30.0" y="210.0" width="1040.0" height="120.0" rx="22" stroke="#1e9e55" stroke-width="4" fill="#d7ecdd"/>
  <text x="60.0" y="258.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Calculate number of moles of known solid or volume of a known gas, or</tspan></text>
  <text x="60.0" y="298.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>molar concentration of known solution using the relevant formula</tspan></text>
  <line x1="550.0" y1="338.0" x2="550.0" y2="374.4" stroke="#1e9e55" stroke-width="4" stroke-linecap="round"/>
  <path d="M550.0 392.0 L539.7 372.6 L560.3 372.6 Z" fill="#1e9e55"/>
  <rect x="30.0" y="400.0" width="1040.0" height="120.0" rx="22" stroke="#d1232a" stroke-width="4" fill="#f5d0c5"/>
  <text x="60.0" y="448.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Find the ratio of the known and the unknown reactant or product from</tspan></text>
  <text x="60.0" y="488.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>the balanced chemical equation</tspan></text>
  <line x1="550.0" y1="528.0" x2="550.0" y2="564.4" stroke="#d1232a" stroke-width="4" stroke-linecap="round"/>
  <path d="M550.0 582.0 L539.7 562.6 L560.3 562.6 Z" fill="#d1232a"/>
  <rect x="30.0" y="590.0" width="1040.0" height="120.0" rx="22" stroke="#1aa1df" stroke-width="4" fill="#d7ece4"/>
  <text x="60.0" y="638.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Calculate the number of moles of the unknown reactant or product using</tspan></text>
  <text x="60.0" y="678.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>the relevant formula</tspan></text>
  <line x1="550.0" y1="718.0" x2="550.0" y2="754.4" stroke="#1aa1df" stroke-width="4" stroke-linecap="round"/>
  <path d="M550.0 772.0 L539.7 752.6 L560.3 752.6 Z" fill="#1aa1df"/>
  <rect x="30.0" y="780.0" width="1040.0" height="120.0" rx="22" stroke="#f0b323" stroke-width="4" fill="#fcf0d9"/>
  <text x="60.0" y="828.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Convert the number of moles of the unknown to mass, volume, or</tspan></text>
  <text x="60.0" y="868.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400"><tspan>concentration of the substance</tspan></text>
</svg>
