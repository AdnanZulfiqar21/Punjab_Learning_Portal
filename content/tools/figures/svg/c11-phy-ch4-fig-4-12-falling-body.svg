<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 4.12 (PDF page 87), original drawing after the printed figure: a body of mass m falls from A at height h; at B it has fallen x, and at C it reaches the ground; P.E and K.E are marked at A, B and C. -->
  <rect width="900" height="980" fill="#ffffff"/>
  <rect x="560.0" y="120.0" width="200.0" height="80.0" rx="0" stroke="#5a6a20" stroke-width="3" fill="#c7d878"/>
  <text x="660.0" y="172.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400"><tspan font-style="italic">m</tspan></text>
  <text x="776.0" y="172.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">A</text>
  <line x1="520.0" y1="880.0" x2="820.0" y2="880.0" stroke="#e8327a" stroke-width="5" stroke-linecap="round"/>
  <text x="600.0" y="924.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400">C</text>
  <line x1="660.0" y1="200.0" x2="660.0" y2="880.0" stroke="#2aa7d8" stroke-width="4" stroke-linecap="round"/>
  <path d="M660.0 380.0 L650.8 358.0 L669.2 358.0 Z" fill="#2aa7d8"/>
  <path d="M660.0 720.0 L650.8 698.0 L669.2 698.0 Z" fill="#2aa7d8"/>
  <line x1="600.0" y1="216.4" x2="600.0" y2="523.6" stroke="#e9a23b" stroke-width="3" stroke-linecap="butt"/>
  <path d="M600.0 202.0 L607.6 220.0 L592.4 220.0 Z" fill="#e9a23b"/>
  <path d="M600.0 538.0 L592.4 520.0 L607.6 520.0 Z" fill="#e9a23b"/>
  <line x1="600.0" y1="556.4" x2="600.0" y2="863.6" stroke="#e9a23b" stroke-width="3" stroke-linecap="butt"/>
  <path d="M600.0 542.0 L607.6 560.0 L592.4 560.0 Z" fill="#e9a23b"/>
  <path d="M600.0 878.0 L592.4 860.0 L607.6 860.0 Z" fill="#e9a23b"/>
  <line x1="722.0" y1="216.4" x2="722.0" y2="863.6" stroke="#e9a23b" stroke-width="3" stroke-linecap="butt"/>
  <path d="M722.0 202.0 L729.6 220.0 L714.4 220.0 Z" fill="#e9a23b"/>
  <path d="M722.0 878.0 L714.4 860.0 L729.6 860.0 Z" fill="#e9a23b"/>
  <text x="582.0" y="380.0" font-size="32" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">x</tspan></text>
  <text x="582.0" y="724.0" font-size="30" fill="#1a1a1a" text-anchor="end" font-weight="400">(<tspan font-style="italic">h</tspan> − <tspan font-style="italic">x</tspan>)</text>
  <text x="744.0" y="556.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400"><tspan font-style="italic">h</tspan></text>
  <text x="560.0" y="552.0" font-size="32" fill="#1a1a1a" text-anchor="end" font-weight="400">B</text>
  <text x="130.0" y="150.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">P.E = <tspan font-style="italic">mgh</tspan></text>
  <text x="130.0" y="196.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">K.E = 0</text>
  <text x="80.0" y="534.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">P.E = <tspan font-style="italic">mg</tspan> (<tspan font-style="italic">h</tspan> − <tspan font-style="italic">x</tspan>)</text>
  <text x="80.0" y="580.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">K.E = <tspan font-style="italic">mgx</tspan></text>
  <text x="250.0" y="834.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">P.E = 0</text>
  <text x="250.0" y="890.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">K.E = <tspan font-style="italic">mgh</tspan></text>
  <line x1="450.0" y1="880.0" x2="520.0" y2="880.0" stroke="#e8327a" stroke-width="3" stroke-linecap="round"/>
</svg>
