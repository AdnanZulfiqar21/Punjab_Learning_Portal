<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: full, incremental and differential backups over four days. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Full, incremental and differential backups (after 1.15)</text>
  <text x="300.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Sun</text>
  <text x="450.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Mon</text>
  <text x="600.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Tue</text>
  <text x="750.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Wed</text>
  <text x="40.0" y="145.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">full every day</text>
  <rect x="240.0" y="120.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="300.0" y="147.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <rect x="390.0" y="120.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="450.0" y="147.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <rect x="540.0" y="120.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="600.0" y="147.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <rect x="690.0" y="120.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="750.0" y="147.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <text x="40.0" y="240.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">incremental</text>
  <rect x="240.0" y="215.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="300.0" y="242.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <rect x="410.0" y="215.0" width="80.0" height="44.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="450.0" y="242.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">Mon only</text>
  <rect x="560.0" y="215.0" width="80.0" height="44.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="600.0" y="242.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">Tue only</text>
  <rect x="710.0" y="215.0" width="80.0" height="44.0" rx="6" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="750.0" y="242.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">Wed only</text>
  <text x="40.0" y="335.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">differential</text>
  <rect x="240.0" y="310.0" width="120.0" height="44.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="300.0" y="337.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">all data</text>
  <rect x="410.0" y="310.0" width="80.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="450.0" y="337.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">since Sun</text>
  <rect x="548.0" y="310.0" width="104.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="600.0" y="337.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">since Sun</text>
  <rect x="686.0" y="310.0" width="128.0" height="44.0" rx="6" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="750.0" y="337.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">since Sun</text>
  <text x="450.0" y="395.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Incremental: smallest and fastest, but restoring needs the full backup and every later piece.</text>
  <text x="450.0" y="412.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Differential: grows each day; restoring needs only the full backup and the latest differential.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
