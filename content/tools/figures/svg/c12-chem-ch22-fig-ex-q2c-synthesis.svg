<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" font-family="Arial, Helvetica, sans-serif">
  <!-- Chapter 22 exercise, Short Question 2(c) (C12-CHEM, PDF p99): cyclohexane, stage 1 (Cl2), compound A, stage 2, cyclohexanol (ring with OH), stage 3, cyclohexene (ring with one double bond). The book spells 'cyclohexannol'; drawn as cyclohexanol. -->
  <rect width="920" height="270" fill="#ffffff"/>
  <polygon points="90.0,106.0 128.1,128.0 128.1,172.0 90.0,194.0 51.9,172.0 51.9,128.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <text x="90.0" y="240.0" font-size="22" fill="#c2185b" text-anchor="middle" font-weight="bold">cyclohexane</text>
  <text x="205.0" y="138.0" font-size="20" fill="#111" text-anchor="middle" font-weight="normal">stage 1</text>
  <line x1="165" y1="150" x2="233" y2="150" stroke="#111" stroke-width="3"/><path d="M231 143 L 245 150 L 231 157 Z" fill="#111"/>
  <text x="205.0" y="176.0" font-size="20" fill="#111" text-anchor="middle" font-weight="normal">Cl<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
  <text x="255.0" y="158.0" font-size="22" fill="#111" text-anchor="start" font-weight="normal">compound A</text>
  <text x="440.0" y="138.0" font-size="20" fill="#111" text-anchor="middle" font-weight="normal">stage 2</text>
  <line x1="400" y1="150" x2="468" y2="150" stroke="#111" stroke-width="3"/><path d="M466 143 L 480 150 L 466 157 Z" fill="#111"/>
  <polygon points="560.0,106.0 598.1,128.0 598.1,172.0 560.0,194.0 521.9,172.0 521.9,128.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <line x1="560.0" y1="106.0" x2="560.0" y2="74.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="560.0" y="66.0" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">OH</text>
  <text x="560.0" y="240.0" font-size="22" fill="#c2185b" text-anchor="middle" font-weight="bold">cyclohexanol</text>
  <text x="700.0" y="138.0" font-size="20" fill="#111" text-anchor="middle" font-weight="normal">stage 3</text>
  <line x1="660" y1="150" x2="728" y2="150" stroke="#111" stroke-width="3"/><path d="M726 143 L 740 150 L 726 157 Z" fill="#111"/>
  <polygon points="830.0,106.0 868.1,128.0 868.1,172.0 830.0,194.0 791.9,172.0 791.9,128.0" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="834.5" y1="118.3" x2="855.3" y2="130.3" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="830.0" y="240.0" font-size="22" fill="#c2185b" text-anchor="middle" font-weight="bold">cyclohexene</text>
</svg>
