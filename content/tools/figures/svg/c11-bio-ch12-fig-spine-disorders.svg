<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.11 to 12.13: a slipped disc, spondylosis and sciatica. Schematic. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <!-- normal vs slipped disc -->
  <text class="h" x="200" y="40">Disc slip (herniation)</text>
  <g fill="#fff4e2" stroke="#c9b27a" stroke-width="4"><rect x="120" y="70" width="120" height="60" rx="8"/><rect x="120" y="170" width="120" height="60" rx="8"/><rect x="120" y="270" width="120" height="60" rx="8"/></g>
  <rect x="120" y="135" width="120" height="30" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M120 235 h120 q40 0 40 15 q0 15 -40 15 h-120 z" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <circle cx="280" cy="250" r="12" fill="#5b3fb5" opacity="0.8"/>
  <path d="M290 160 v180" stroke="#f2b134" stroke-width="6"/>
  <text class="s" x="200" y="370">the disc's outer layer tears and the</text><text class="s" x="200" y="390">inner gel leaks out, pressing on a</text><text class="s" x="200" y="410">nerve or the spinal cord</text>
  <text class="s" x="200" y="440">trauma, ageing or repeated strain;</text><text class="s" x="200" y="460">pain, numbness, tingling, weakness,</text><text class="s" x="200" y="480">in severe cases bowel or bladder trouble</text>
  <!-- spondylosis -->
  <text class="h" x="600" y="40">Spondylosis</text>
  <g fill="#fff4e2" stroke="#c9b27a" stroke-width="4"><rect x="520" y="70" width="120" height="60" rx="8"/><rect x="520" y="150" width="120" height="60" rx="8"/><rect x="520" y="250" width="120" height="60" rx="8"/></g>
  <rect x="520" y="135" width="120" height="12" rx="6" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <rect x="520" y="215" width="120" height="30" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <g fill="#c9b27a" stroke="#8a4b00" stroke-width="2"><path d="M640 125 l20 8 l-20 8 z M640 150 l20 8 l-20 8 z M520 205 l-20 8 l20 8 z"/></g>
  <path d="M690 100 v220" stroke="#f2b134" stroke-width="6"/>
  <text class="s" x="600" y="370">degeneration of vertebrae, discs,</text><text class="s" x="600" y="390">ligaments or cartilage: discs narrow</text><text class="s" x="600" y="410">or fuse, bone outgrowths press nerves</text>
  <text class="s" x="600" y="440">commonest in the lower back and neck;</text><text class="s" x="600" y="460">ageing, genes, trauma, poor posture, obesity;</text><text class="s" x="600" y="480">pain, stiffness, less range of motion</text>
  <!-- sciatica -->
  <text class="h" x="980" y="40">Sciatica</text>
  <g fill="#fff4e2" stroke="#c9b27a" stroke-width="4"><rect x="920" y="70" width="120" height="60" rx="8"/><rect x="920" y="160" width="120" height="60" rx="8"/></g>
  <path d="M920 135 h120 q40 0 40 12 q0 13 -40 13 h-120 z" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M1060 120 q20 40 10 90 q-10 60 -60 110 q-30 30 -40 90" fill="none" stroke="#f2b134" stroke-width="8" stroke-linecap="round"/>
  <path d="M1065 150 l10 -20" stroke="#d7322f" stroke-width="4"/><circle cx="1068" cy="148" r="9" fill="#d7322f"/>
  <text class="s" x="980" y="370">the sciatic nerve runs from the lower</text><text class="s" x="980" y="390">back through the buttock down each</text><text class="s" x="980" y="410">leg; a herniated or bulging disc,</text><text class="s" x="980" y="430">trauma, infection, inflammation or</text><text class="s" x="980" y="450">spondylosis compresses or irritates it</text>
  <text class="s" x="980" y="480">pain in the lower back, buttock, leg or foot;</text><text class="s" x="980" y="500">tingling, numbness or weakness in the leg</text>
  <text class="s" x="600" y="550">Cream: vertebrae. Blue: intervertebral discs (shock absorbers). Yellow: nerve or spinal cord. Purple: leaked disc gel. Red: the point of compression.</text>
</svg>
