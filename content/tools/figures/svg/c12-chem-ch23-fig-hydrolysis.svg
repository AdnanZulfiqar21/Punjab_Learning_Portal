<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="495" fill="#ffffff"/>
  <!-- Original comparison for topic 23.9: ethanoyl chloride is hydrolysed rapidly at room temperature (two electronegative atoms on the carbon), chloroethane only on heating under reflux, and chlorobenzene not at all (partial double-bond C-Cl). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ease of hydrolysis of three chlorides</text>
  <rect x="15.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ethanoyl chloride</text>
  <line x1="152.0" y1="180.0" x2="152.0" y2="150.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="158.0" y1="180.0" x2="158.0" y2="150.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="155.0" y="135.9" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <line x1="146.3" y1="195.0" x2="120.2" y2="210.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="89.5" y="228.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">C</tspan></text>
  <line x1="163.7" y1="195.0" x2="189.8" y2="210.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="216.5" y="228.6" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="155.0" y="195.9" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="173.0" y="196.0" font-size="15" fill="#1f6fb5" text-anchor="start" font-weight="700">&#948;+</text>
  <text x="155.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">two electronegative atoms</text>
  <text x="155.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(O and Cl) on the carbon:</text>
  <text x="155.0" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">large delta+, quick attack</text>
  <text x="155.0" y="334.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">by water</text>
  <text x="155.0" y="380.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">COCl + H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O -&gt; CH</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">COOH + HCl</tspan></text>
  <text x="155.0" y="412.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">fast at room temperature</text>
  <rect x="310.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">chloroethane</text>
  <text x="430.0" y="196.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">-</tspan></text>
  <text x="500.0" y="196.0" font-size="18" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="472.0" y="172.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="450.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">only Cl pulls electrons:</text>
  <text x="450.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">smaller delta+, slower</text>
  <text x="450.0" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">attack by water</text>
  <text x="450.0" y="380.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">CH</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">Cl + H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O -&gt; CH</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8">CH</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">OH + HCl</tspan></text>
  <text x="450.0" y="412.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">slow: heat under reflux</text>
  <rect x="605.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">chlorobenzene</text>
  <path d="M735.0 166.0 L764.4 183.0 L764.4 217.0 L735.0 234.0 L705.6 217.0 L705.6 183.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="735.0" cy="200.0" r="19.7" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="764.4" y1="183.0" x2="780.6" y2="173.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="784.1" y="172.4" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="745.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Cl lone pair delocalised</text>
  <text x="745.0" y="298.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">into the ring: C-Cl has</text>
  <text x="745.0" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">partial double-bond</text>
  <text x="745.0" y="334.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">character</text>
  <text x="745.0" y="380.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="3.8" font-size="8.4">6</tspan><tspan dy="-3.8">H</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">Cl + H</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">O -&gt; no reaction</tspan></text>
  <text x="745.0" y="412.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">no reaction</text>
  <text x="450.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ease of hydrolysis: acyl chloride &gt; alkyl chloride &gt; aryl chloride</text>
  <text x="450.0" y="486" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
