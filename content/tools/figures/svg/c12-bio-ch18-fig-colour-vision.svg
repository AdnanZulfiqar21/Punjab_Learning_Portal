<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.18: three cone types and where their opsin genes lie, the three kinds of dichromacy with one cone type missing, and monochromacy with two missing. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cone opsins, dichromacy and monochromacy</text>
  <rect x="15.0" y="55.0" width="870.0" height="185.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">normal (trichromatic) vision: three opsins</text>
  <text x="155.0" y="100.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">trichromat</text>
  <text x="155.0" y="118.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">all three cones</text>
  <path d="M81 210 L85 150 Q95 134 105 150 L109 210 Z" stroke="#57534e" stroke-width="1.5" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="95.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">red</text>
  <path d="M141 210 L145 150 Q155 134 165 150 L169 210 Z" stroke="#57534e" stroke-width="1.5" fill="#22c55e" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="155.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">green</text>
  <path d="M201 210 L205 150 Q215 134 225 150 L229 210 Z" stroke="#57534e" stroke-width="1.5" fill="#3b82f6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="215.0" y="230.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">blue</text>
  <rect x="330.0" y="110.0" width="160.0" height="80.0" rx="8" stroke="#ef4444" stroke-width="2" fill="#ffffff"/>
  <text x="410.0" y="142.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">red opsin gene</text>
  <text x="410.0" y="166.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">on X chromosome</text>
  <rect x="510.0" y="110.0" width="160.0" height="80.0" rx="8" stroke="#22c55e" stroke-width="2" fill="#ffffff"/>
  <text x="590.0" y="142.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">green opsin gene</text>
  <text x="590.0" y="166.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">on X chromosome</text>
  <rect x="690.0" y="110.0" width="160.0" height="80.0" rx="8" stroke="#3b82f6" stroke-width="2" fill="#ffffff"/>
  <text x="770.0" y="142.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">blue opsin gene</text>
  <text x="770.0" y="166.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">on chromosome 7</text>
  <rect x="15.0" y="255.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="285.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">dichromacy: one opsin missing</text>
  <text x="135.0" y="312.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">protanopia</text>
  <text x="135.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">red-blind</text>
  <path d="M61 422 L65 362 Q75 346 85 362 L89 422 Z" stroke="#d6d3d1" stroke-width="1.5" fill="#f5f5f4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="75.0" y="442.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">missing</text>
  <path d="M121 422 L125 362 Q135 346 145 362 L149 422 Z" stroke="#57534e" stroke-width="1.5" fill="#22c55e" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="135.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">green</text>
  <path d="M181 422 L185 362 Q195 346 205 362 L209 422 Z" stroke="#57534e" stroke-width="1.5" fill="#3b82f6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="195.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">blue</text>
  <text x="420.0" y="312.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">deuteranopia</text>
  <text x="420.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">green-blind</text>
  <path d="M346 422 L350 362 Q360 346 370 362 L374 422 Z" stroke="#57534e" stroke-width="1.5" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="360.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">red</text>
  <path d="M406 422 L410 362 Q420 346 430 362 L434 422 Z" stroke="#d6d3d1" stroke-width="1.5" fill="#f5f5f4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="420.0" y="442.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">missing</text>
  <path d="M466 422 L470 362 Q480 346 490 362 L494 422 Z" stroke="#57534e" stroke-width="1.5" fill="#3b82f6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="480.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">blue</text>
  <text x="705.0" y="312.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">tritanopia</text>
  <text x="705.0" y="330.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">blue-blind</text>
  <path d="M631 422 L635 362 Q645 346 655 362 L659 422 Z" stroke="#57534e" stroke-width="1.5" fill="#ef4444" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="645.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">red</text>
  <path d="M691 422 L695 362 Q705 346 715 362 L719 422 Z" stroke="#57534e" stroke-width="1.5" fill="#22c55e" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="705.0" y="442.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">green</text>
  <path d="M751 422 L755 362 Q765 346 775 362 L779 422 Z" stroke="#d6d3d1" stroke-width="1.5" fill="#f5f5f4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="765.0" y="442.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">missing</text>
  <rect x="15.0" y="485.0" width="870.0" height="90.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="515.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">monochromacy (total colour blindness): two opsins missing</text>
  <text x="450.0" y="541.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">blue-cone monochromacy: red and green opsins absent; red- and green-cone monochromacy are very rare</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
