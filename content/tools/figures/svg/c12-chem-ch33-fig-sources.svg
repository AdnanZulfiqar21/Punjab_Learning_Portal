  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">non-point source (diffuse)</text>
  <rect x="470.0" y="290.0" width="400.0" height="70.0" rx="6" stroke="#1f6fb5" stroke-width="0" fill="#bfdbfe"/>
  <text x="850.0" y="350.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">river</text>
