  <text x="670.0" y="122.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">rain or snowmelt washes</text>
  <text x="670.0" y="138.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">pollutants off a wide area</text>
  <text x="475.0" y="392.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">farms: NH4NO3, fertilisers, pesticides; roads: engine</text>
  <text x="475.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">oils, zinc from tyres, road salts; lower concentrations</text>
  <text x="475.0" y="428.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">over a wide area, depending on the weather</text>
