  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram for topic 33.2: a point source (a factory pipe making a concentrated plume in a river) and a non-point source (rain washing fertilisers, pesticides, oils, zinc and salts off farmland and roads along the whole river bank). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Point and non-point sources of water pollution</text>
  <rect x="15.0" y="55.0" width="430.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">point source</text>
  <rect x="30.0" y="290.0" width="400.0" height="70.0" rx="6" stroke="#1f6fb5" stroke-width="0" fill="#bfdbfe"/>
  <text x="410.0" y="350.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">river</text>
