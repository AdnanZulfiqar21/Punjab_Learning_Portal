  <text x="105.0" y="178.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">factory</text>
  <path d="M160 190 L215 190 L215 292" stroke="#475569" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M215 300 Q260 300 330 312 Q400 322 420 330 Q400 340 330 336 Q255 330 215 316 Z" stroke="#d98b2b" stroke-width="1.5" fill="#fdba74" fill-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="240.0" y="115.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">one identifiable pipe or point;</text>
  <text x="240.0" y="132.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the pollutant is most concentrated</text>
  <text x="240.0" y="149.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">near the outlet (a plume)</text>
  <text x="40.0" y="392.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">e.g. a factory pipe releasing lead or mercury salts;</text>
  <text x="40.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">a leaking storage tank at a chemical plant</text>
