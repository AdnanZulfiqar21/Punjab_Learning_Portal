<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original energy diagram after Figure 20.1: heats of hydrogenation to cyclohexane are 120 kJ/mol for cyclohexene, 240 for 1,3-cyclohexadiene, 360 expected for cyclohexatriene, but only 208 for benzene; the 152 kJ/mol difference is the resonance energy. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Heats of hydrogenation: benzene is extra stable</text>
  <line x1="80.0" y1="520.0" x2="790.0" y2="520.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="796.0" y="525.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">cyclohexane</text>
  <line x1="55.0" y1="520.0" x2="55.0" y2="128.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M55.0 120.0 L59.6 130.0 L50.4 130.0 Z" fill="#14181f"/>
  <text x="42.0" y="300.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 42.0 300.0)">energy</text>
  <line x1="110.0" y1="178.0" x2="230.0" y2="178.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M170.0 112.0 L190.8 124.0 L190.8 148.0 L170.0 160.0 L149.2 148.0 L149.2 124.0 Z" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="173.0" y1="118.5" x2="183.6" y2="124.7" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="183.6" y1="147.3" x2="173.0" y2="153.5" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="153.4" y1="142.1" x2="153.4" y2="129.9" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="170.0" y="98.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">cyclohexatriene (hypothetical)</text>
  <line x1="170.0" y1="182.0" x2="170.0" y2="508.0" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M170.0 516.0 L165.8 506.9 L174.2 506.9 Z" fill="#d7322f"/>
  <text x="178.0" y="354.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700">360 kJ mol<tspan dy='-6' font-size='10'>-1</tspan></text>
  <line x1="310.0" y1="292.0" x2="430.0" y2="292.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M370.0 226.0 L390.8 238.0 L390.8 262.0 L370.0 274.0 L349.2 262.0 L349.2 238.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="386.6" y1="243.9" x2="386.6" y2="256.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="367.0" y1="267.5" x2="356.4" y2="261.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="370.0" y="212.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">1,3-cyclohexadiene</text>
  <line x1="370.0" y1="296.0" x2="370.0" y2="508.0" stroke="#d98b2b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M370.0 516.0 L365.8 506.9 L374.2 506.9 Z" fill="#d98b2b"/>
  <text x="378.0" y="411.0" font-size="14" fill="#d98b2b" text-anchor="start" font-weight="700">240 kJ mol<tspan dy='-6' font-size='10'>-1</tspan></text>
  <line x1="510.0" y1="322.4" x2="630.0" y2="322.4" stroke="#1f6fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M570.0 256.4 L590.8 268.4 L590.8 292.4 L570.0 304.4 L549.2 292.4 L549.2 268.4 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="570.0" cy="280.4" r="13.9" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="570.0" y="242.4" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzene (actual)</text>
  <line x1="570.0" y1="326.4" x2="570.0" y2="508.0" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M570.0 516.0 L565.8 506.9 L574.2 506.9 Z" fill="#1f6fb5"/>
  <text x="578.0" y="426.2" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">208 kJ mol<tspan dy='-6' font-size='10'>-1</tspan></text>
  <line x1="680.0" y1="406.0" x2="800.0" y2="406.0" stroke="#0f7a62" stroke-width="3" stroke-linecap="round"/>
  <path d="M740.0 340.0 L760.8 352.0 L760.8 376.0 L740.0 388.0 L719.2 376.0 L719.2 352.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="756.6" y1="357.9" x2="756.6" y2="370.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="740.0" y="326.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">cyclohexene</text>
  <line x1="740.0" y1="410.0" x2="740.0" y2="508.0" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M740.0 516.0 L735.8 506.9 L744.2 506.9 Z" fill="#0f7a62"/>
  <text x="748.0" y="468.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">120 kJ mol<tspan dy='-6' font-size='10'>-1</tspan></text>
  <line x1="230.0" y1="178.0" x2="660.0" y2="178.0" stroke="#d7322f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="650.0" y1="189.0" x2="650.0" y2="311.4" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M650.0 319.4 L645.8 310.3 L654.2 310.3 Z" fill="#7c3aed"/>
  <path d="M650.0 181.0 L654.2 190.1 L645.8 190.1 Z" fill="#7c3aed"/>
  <text x="662.0" y="229.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">resonance energy</text>
  <text x="662.0" y="247.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">360 - 208 = 152 kJ/mol</text>
  <text x="450.0" y="562.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">each C=C releases about 120 kJ/mol on hydrogenation; benzene releases far less than 3 x 120</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
