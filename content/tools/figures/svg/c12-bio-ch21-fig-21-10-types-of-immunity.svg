<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 649" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="649" fill="#ffffff"/>
  <!-- Figure 21.10 Types of immunity and their mechanisms: original drawing after the printed figure -->
  <rect x="440.0" y="20.0" width="220.0" height="60.0" rx="0" stroke="#3a6ab0" stroke-width="2.4" fill="#dbe8f8"/>
  <text x="550.0" y="60.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">IMMUNITY</text>
  <line x1="550.0" y1="80.0" x2="550.0" y2="110.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="270.0" y1="110.0" x2="790.0" y2="110.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="270.0" y1="110.0" x2="270.0" y2="140.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="790.0" y1="110.0" x2="790.0" y2="140.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <rect x="35.0" y="140.0" width="470.0" height="112.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="270.0" y="174.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Innate Immunity</text>
  <text x="270.0" y="210.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">Non-Specific</text>
  <text x="270.0" y="243.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">First and second lines of defence</text>
  <rect x="580.0" y="140.0" width="420.0" height="112.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="790.0" y="174.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Acquired Immunity</text>
  <text x="790.0" y="210.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">Specific</text>
  <text x="790.0" y="243.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Third line of defence</text>
  <line x1="790.0" y1="252.0" x2="790.0" y2="282.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="595.0" y1="282.0" x2="945.0" y2="282.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="595.0" y1="282.0" x2="595.0" y2="312.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="945.0" y1="282.0" x2="945.0" y2="312.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <rect x="410.0" y="312.0" width="370.0" height="112.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="595.0" y="346.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Active Immunity</text>
  <text x="595.0" y="382.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Body itself prepares</text>
  <text x="595.0" y="415.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">antibodies against antigens.</text>
  <rect x="810.0" y="312.0" width="270.0" height="112.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="945.0" y="346.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Passive Immunity</text>
  <text x="945.0" y="382.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Individual is given</text>
  <text x="945.0" y="415.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">antibodies.</text>
  <line x1="595.0" y1="424.0" x2="595.0" y2="454.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="330.0" y1="454.0" x2="820.0" y2="454.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="330.0" y1="454.0" x2="330.0" y2="484.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <line x1="820.0" y1="454.0" x2="820.0" y2="484.0" stroke="#4a5a6a" stroke-width="2" stroke-linecap="round"/>
  <rect x="95.0" y="484.0" width="470.0" height="112.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="330.0" y="518.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Natural Active Immunity</text>
  <text x="330.0" y="554.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Body prepares antibodies</text>
  <text x="330.0" y="587.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">naturally.</text>
  <rect x="585.0" y="484.0" width="470.0" height="145.0" rx="0" stroke="#4a5a6a" stroke-width="2" fill="#f4f6f9"/>
  <text x="820.0" y="518.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="700">Artificial Active Immunity</text>
  <text x="820.0" y="554.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Achieved by vaccination.</text>
  <text x="820.0" y="587.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">Stimulates body to</text>
  <text x="820.0" y="620.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">prepare antibodies.</text>
</svg>
