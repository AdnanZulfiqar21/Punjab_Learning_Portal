  <text x="340.0" y="300.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">branched chain</text>
  <text x="340.0" y="322.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">2-methylpropane</text>
  <rect x="455.0" y="60.0" width="210.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
