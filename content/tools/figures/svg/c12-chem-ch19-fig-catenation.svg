  <text x="738.0" y="261.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="822.0" cy="255.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="822.0" y="261.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="780.0" cy="190.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="780.0" y="196.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="780.0" cy="120.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="780.0" y="126.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="780.0" y="300.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">ring with a branch</text>
  <text x="780.0" y="322.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">methylcyclopropane</text>
  <text x="450.0" y="384.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">carbon skeletons only: each carbon also carries enough H atoms to make four bonds</text>
  <text x="450.0" y="401" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
