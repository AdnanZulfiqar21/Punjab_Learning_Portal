  <text x="280.0" y="246.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="340.0" cy="210.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="340.0" y="216.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
