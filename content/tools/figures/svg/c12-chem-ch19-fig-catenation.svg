  <text x="520.0" y="181.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="600.0" cy="175.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="600.0" y="181.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="600.0" cy="255.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="600.0" y="261.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="520.0" cy="255.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
