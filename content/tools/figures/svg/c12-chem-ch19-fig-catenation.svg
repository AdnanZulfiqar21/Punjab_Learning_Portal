  <circle cx="45.0" cy="230.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="45.0" y="236.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="95.0" cy="200.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="95.0" y="206.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="145.0" cy="230.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="145.0" y="236.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="195.0" cy="200.0" r="16.0" stroke="#475569" stroke-width="2" fill="#e2e8f0"/>
  <text x="195.0" y="206.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <text x="120.0" y="300.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">straight chain</text>
  <text x="120.0" y="322.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">butane</text>
  <rect x="235.0" y="60.0" width="210.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
