<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>
  <!-- Original sketch after the book's four C4 arrangements: a straight chain (butane), a branched chain (2-methylpropane), a four-membered ring (cyclobutane) and a three-membered ring with a branch (methylcyclopropane). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Catenation: four ways to join four carbon atoms</text>
  <rect x="15.0" y="60.0" width="210.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
