<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.11: the pressure-flow theory of translocation. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:20px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .n{font-size:20px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b3fb5"/></marker>
  </defs>
  <text class="h" x="600" y="40">Pressure-flow (mass-flow) theory, Ernst Munch 1930</text>
  <!-- xylem and phloem tubes -->
  <rect x="300" y="120" width="90" height="500" fill="#dbe9f5" stroke="#8a4b00" stroke-width="5"/>
  <text class="k" x="345" y="100">xylem</text>
  <rect x="460" y="120" width="90" height="500" fill="#e8dff7" stroke="#5b3fb5" stroke-width="5"/>
  <text class="k" x="560" y="90">phloem (sieve tube)</text>
  <g stroke="#5b3fb5" stroke-width="3" stroke-dasharray="6 4"><path d="M460 245 h90 M460 370 h90 M460 495 h90"/></g>
  <!-- source leaf -->
  <path d="M120 150 q80 -60 140 0 q-60 70 -140 0 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="4"/>
  <text class="k" x="190" y="110">Source (leaf)</text>
  <text class="s" x="150" y="240">photosynthesis makes</text><text class="s" x="150" y="262">glucose; excess becomes</text><text class="s" x="150" y="284">sucrose</text>
  <!-- sucrose loading -->
  <path d="M260 160 L455 160" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="420" cy="145" r="12" fill="#d98b2b"/><text class="s" x="190" y="207">1-2 sucrose loaded (active)</text>
  <!-- water from xylem at source -->
  <path d="M395 210 L455 210" stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"/>
  <text class="s" x="565" y="216" style="fill:#1f6fb5;text-anchor:start">3 water in by osmosis</text>
  <!-- flow down -->
  <path d="M505 230 V560" stroke="#5b3fb5" stroke-width="8" marker-end="url(#ap)"/>
  <text class="s" x="680" y="380" style="fill:#5b3fb5">5 mass flow of sap from high</text><text class="s" x="680" y="402" style="fill:#5b3fb5">to low water potential;</text><text class="s" x="680" y="424" style="fill:#5b3fb5">sucrose carried along</text>
  <!-- sink -->
  <rect x="80" y="520" width="170" height="90" rx="20" fill="#fff4e2" stroke="#d98b2b" stroke-width="4"/>
  <text class="k" x="165" y="560">Sink</text><text class="s" x="165" y="586">root, fruit, store</text>
  <path d="M455 560 L260 560" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="380" cy="580" r="12" fill="#d98b2b"/><text class="s" x="330" y="640">4 sucrose unloaded (active)</text>
  <path d="M455 600 L395 600" stroke="#1f6fb5" stroke-width="4" marker-end="url(#ab)"/>
  <text class="s" x="330" y="662" style="fill:#1f6fb5">water follows out; back to xylem</text>
  <!-- water potential labels -->
  <rect x="780" y="140" width="330" height="70" rx="12" fill="#5b3fb5"/><text class="n" x="945" y="170">source end: high sucrose,</text><text class="n" x="945" y="196">water enters, high pressure</text>
  <rect x="780" y="520" width="330" height="70" rx="12" fill="#d98b2b"/><text class="n" x="945" y="550">sink end: sucrose removed,</text><text class="n" x="945" y="576">water leaves, low pressure</text>
  <path d="M945 215 V515" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="1030" y="370">pressure gradient</text>
  <text class="s" x="600" y="700">Diffusion alone is far too slow: sugar moves about 1 metre per hour in phloem, but by diffusion 1 metre would take eight years.</text>
</svg>
