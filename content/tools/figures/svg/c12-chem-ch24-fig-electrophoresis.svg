<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Figure 24.2: at pH 6 lysine (pI 9.74) moves to the cathode, alanine (pI 6.02) stays near the start and glutamic acid (pI 3.22) moves to the anode; ninhydrin reacts with amino acids to give a purple product that shows the spots. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Separating amino acids by electrophoresis at pH 6</text>
  <rect x="90.0" y="120.0" width="720.0" height="90.0" rx="6" stroke="#ca8a04" stroke-width="2.5" fill="#fde68a"/>
  <circle cx="55.0" cy="165.0" r="22.0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <line x1="45.0" y1="165.0" x2="65.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="845.0" cy="165.0" r="22.0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <line x1="835.0" y1="165.0" x2="855.0" y2="165.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="845.0" y1="155.0" x2="845.0" y2="175.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="55.0" y="105.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cathode</text>
  <text x="845.0" y="105.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">anode</text>
  <line x1="450.0" y1="115.0" x2="450.0" y2="215.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="450.0" y="232.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">start</text>
  <circle cx="190.0" cy="165.0" r="11.0" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="190.0" y="255.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">lysine (pI = 9.74)</text>
  <circle cx="455.0" cy="165.0" r="11.0" stroke="#7c3aed" stroke-width="1" fill="#7c3aed"/>
  <text x="455.0" y="255.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">alanine (pI = 6.02)</text>
  <circle cx="710.0" cy="165.0" r="11.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="710.0" y="255.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">glutamic acid (pI = 3.22)</text>
  <line x1="420.0" y1="140.0" x2="222.2" y2="140.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M215.0 140.0 L223.2 136.2 L223.2 143.8 Z" fill="#1f6fb5"/>
  <line x1="480.0" y1="140.0" x2="677.8" y2="140.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <path d="M685.0 140.0 L676.8 143.8 L676.8 136.2 Z" fill="#d7322f"/>
  <text x="450.0" y="290.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">pI &gt; pH: the amino acid is mostly positive and moves to the cathode (lysine)</text>
  <text x="450.0" y="310.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">pI close to pH: almost no overall charge, little movement (alanine)</text>
  <text x="450.0" y="330.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">pI &lt; pH: mostly negative, moves to the anode (glutamic acid); the bigger the difference, the faster</text>
  <rect x="15.0" y="360.0" width="870.0" height="85.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="395.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">amino acid + 2 ninhydrin -&gt; purple product + CO</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + RCHO + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="450.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the spots are colourless, so ninhydrin is sprayed on to show them as purple spots</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
