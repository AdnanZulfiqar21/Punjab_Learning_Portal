<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original apparatus diagram after Figure 23.1: acidified dichromate is dropped into warm ethanol in a flask in a warm water bath; ethanal vapour passes a thermometer and a water-cooled condenser and collects in a receiving tube. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Distilling off ethanal as it forms</text>
  <rect x="70.0" y="300.0" width="230.0" height="120.0" rx="6" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="185.0" y="440.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">warm water bath</text>
  <text x="185.0" y="458.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(above the b.p. of ethanal)</text>
  <circle cx="185.0" cy="300.0" r="70.0" stroke="#14181f" stroke-width="2.5" fill="#ecfccb"/>
  <rect x="170.0" y="175.0" width="30.0" height="70.0" rx="0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <rect x="150.0" y="160.0" width="22.0" height="16.0" rx="3" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <line x1="185.0" y1="90.0" x2="185.0" y2="300.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="185.0" cy="300.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="200.0" y="98.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">thermometer</text>
  <path d="M110 150 L130 150 L150 230 L135 270" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="110.0" cy="135.0" rx="22.0" ry="30.0" stroke="#14181f" stroke-width="2" fill="#fef9c3"/>
  <text x="25.0" y="60.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">acidified K2Cr2O7</text>
  <text x="25.0" y="76.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">dropped slowly into</text>
  <text x="25.0" y="92.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">warm ethanol</text>
  <line x1="200.0" y1="205.0" x2="330.0" y2="230.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200.0" y1="215.0" x2="330.0" y2="240.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 215.0 L640.0 275.0 L640.0 305.0 L330.0 245.0 Z" stroke="#0f7a62" stroke-width="2" fill="#dcfce7" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="330.0" y1="230.0" x2="700.0" y2="300.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330.0" y1="240.0" x2="700.0" y2="310.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="610.0" y1="340.0" x2="601.7" y2="307.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M600.0 300.0 L605.7 307.0 L598.3 308.8 Z" fill="#1f6fb5"/>
  <text x="612.0" y="358.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">water in</text>
  <line x1="370.0" y1="220.0" x2="378.0" y2="191.9" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M380.0 185.0 L381.4 193.9 L374.1 191.8 Z" fill="#1f6fb5"/>
  <text x="390.0" y="178.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">water out</text>
  <text x="485.0" y="240.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">condenser</text>
  <line x1="700.0" y1="300.0" x2="720.0" y2="380.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M714 440 L714 444 A26 26 0 0 0 766 444 L766 440 Z" stroke="none" stroke-width="0" fill="#fef9c3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M714 360 L714 444 A26 26 0 0 0 766 444 L766 360" stroke="#475569" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="740.0" y="492.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">ethanal (distillate)</text>
  <text x="185.0" y="345.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">reaction</text>
  <text x="185.0" y="361.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">mixture</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
