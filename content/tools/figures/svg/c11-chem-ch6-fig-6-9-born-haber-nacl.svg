  <line x1="240.0" y1="704.0" x2="240.0" y2="885.2" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M240.0 898.0 L232.5 883.9 L247.5 883.9 Z" fill="#14181f"/>
