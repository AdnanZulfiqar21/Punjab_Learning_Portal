  <path d="M990.0 898.0 L974.0 868.0 L1006.0 868.0 Z" fill="#14181f"/>
  <text x="990.0" y="605.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>&#916;H</tspan><tspan dy="7.5" font-size="20.4">latt</tspan><tspan dy="-7.5"> of Na</tspan><tspan dy="-11.4" font-size="20.4">+</tspan><tspan dy="11.4">Cl</tspan><tspan dy="-11.4" font-size="20.4">&#8722;</tspan><tspan dy="18.9" font-size="20.4">(s)</tspan><tspan dy="-7.5"> = </tspan><tspan font-weight="700">?</tspan></text>
  <text x="990.0" y="648.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>(Lattice Energy of NaCl)</tspan></text>
