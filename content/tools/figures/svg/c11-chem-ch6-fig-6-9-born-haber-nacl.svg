  <text x="560.0" y="274.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Na</tspan><tspan dy="-12.2" font-size="21.8">+</tspan><tspan dy="20.2" font-size="21.8">(g)</tspan><tspan dy="-8.0"> + e</tspan><tspan dy="-12.2" font-size="21.8">&#8722;</tspan><tspan dy="12.2"> + &#189; Cl</tspan><tspan dy="8.0" font-size="21.8">2(g)</tspan><tspan dy="-8.0"> </tspan></text>
