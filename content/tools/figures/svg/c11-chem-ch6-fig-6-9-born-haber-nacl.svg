  <text x="560.0" y="682.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan font-weight="700">Na</tspan><tspan dy="8.0" font-size="21.8">(s)</tspan><tspan dy="-8.0"> + &#189; Cl</tspan><tspan dy="8.0" font-size="21.8">2(g)</tspan><tspan dy="-8.0"> </tspan></text>
  <text x="770.0" y="712.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan>(REACTANTS)</tspan></text>
  <text x="560.0" y="884.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Na</tspan><tspan dy="-12.2" font-size="21.8">+</tspan><tspan dy="12.2">Cl</tspan><tspan dy="-12.2" font-size="21.8">&#8722;</tspan><tspan dy="20.2" font-size="21.8">(s)</tspan><tspan dy="-8.0"> </tspan></text>
