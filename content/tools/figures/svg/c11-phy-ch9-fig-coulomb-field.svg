<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 9.1 to 9.9 and topics 9.1 and 9.2: Coulomb's law, Example 9.1, electric field strength and the patterns of electric field lines. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Coulomb's law, electric field strength and electric field lines</text>
  <rect x="50" y="55" width="360" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Coulomb's law (9.1, Fig. 9.1)</text>
  <circle cx="130" cy="120" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="130" y="124" style="text-anchor:middle">+</text>
  <circle cx="310" cy="120" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="310" y="124" style="text-anchor:middle">+</text>
  <path d="M117 120 L75 120" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M323 120 L365 120" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="76" y="108">F12</text>
  <text class="r" x="345" y="108">F21</text>
  <text class="r" x="150" y="152">like charges repel</text>
  <circle cx="130" cy="190" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="130" y="194" style="text-anchor:middle">+</text>
  <circle cx="310" cy="190" r="13" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="310" y="194" style="text-anchor:middle">-</text>
  <path d="M145 190 L190 190" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M295 190 L250 190" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M130 214 H310" stroke="#9ca3af" stroke-dasharray="4 3"/><text class="r" x="216" y="228">r</text>
  <text class="r" x="150" y="244">unlike charges attract</text>
  <g class="r">
    <text x="70" y="268">F = k q1 q2 / r^2 (9.1), along the line joining them</text>
    <text x="70" y="283">k = 1/(4 pi eps0) = 9 x 10^9 N m^2 C^-2</text>
    <text x="70" y="298">eps0 = 8.85 x 10^-12 C^2 N^-1 m^-2; F12 = -F21 (9.4)</text>
    <text x="70" y="313">a dielectric reduces the force by eps_r (Table 9.1)</text>
    <text x="70" y="328">charge is quantized: q = Ne, e = 1.6 x 10^-19 C</text>
  </g>
  <rect x="430" y="55" width="340" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Example 9.1 (Fig. 9.2)</text>
  <g class="r">
    <text x="450" y="102">q1 = +40 uC; q2 = -60 uC at 0.15 m; q3 = -50 uC at</text>
    <text x="450" y="117">0.12 m, 60 deg above the line q1q2: both attract q1</text>
  </g>
  <path d="M470 300 L680 300" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <path d="M470 300 L560 144" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <circle cx="470" cy="300" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="470" y="304" style="text-anchor:middle">+</text>
  <circle cx="690" cy="300" r="13" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="690" y="304" style="text-anchor:middle">-</text>
  <circle cx="565" cy="136" r="13" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="565" y="140" style="text-anchor:middle">-</text>
  <path d="M483 300 L590 300" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M477 289 L535 189" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M470 300 L620 200" stroke="#0f7a62" stroke-width="2.5"/>
  <path d="M612 205 L620 200 L616 210" fill="none" stroke="#0f7a62" stroke-width="2.5"/>
  <text class="r" x="455" y="328">q1</text>
  <text class="r" x="680" y="328">q2</text>
  <text class="r" x="580" y="132">q3</text>
  <text class="r" x="560" y="318" style="fill:#d7322f">F12 = 960 N</text>
  <text class="r" x="430" y="232" style="fill:#d7322f" transform="translate(30 0)">F13</text>
  <text class="r" x="630" y="196" style="fill:#0f7a62">F</text>
  <g class="r">
    <text x="600" y="236">F13 = 1250 N</text>
    <text x="600" y="250">Fx = 960 + 625</text>
    <text x="600" y="264">  = 1585 N</text>
    <text x="600" y="278">Fy = 1075 N</text>
    <text x="600" y="292">F = 1915 N</text>
  </g>
  <g class="r">
    <text x="450" y="346">tan theta = 0.68: theta = 34 deg (print: 1975 N)</text>
  </g>
  <rect x="790" y="55" width="360" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Electric field strength (9.2)</text>
  <g class="r">
    <text x="810" y="102">E = F / q (9.8), in N C^-1; F = qE (9.9)</text>
    <text x="810" y="117">E = k q / r^2 for a point charge; a vector</text>
    <text x="810" y="132">along F; the force on a unit positive charge</text>
    <text x="810" y="162">Ex 9.2: +16 uC and +4 uC, 3.0 m apart:</text>
    <text x="810" y="177">E1 = E2 where 16/(3 - d)^2 = 4/d^2:</text>
    <text x="810" y="192">d^2 + 2d - 3 = 0, d = 1.0 m from the 4 uC</text>
    <text x="810" y="207">charge (the root -3 m is outside)</text>
    <text x="810" y="237">Ex 9.3: a proton whose weight is balanced:</text>
    <text x="810" y="252">E = mg / e = 1.0 x 10^-7 N C^-1</text>
  </g>
  <circle cx="830" cy="300" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="830" y="304" style="text-anchor:middle">+</text>
  <circle cx="1110" cy="300" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="1110" y="304" style="text-anchor:middle">+</text>
  <path d="M843 300 H1097" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <circle cx="1017" cy="300" r="4" fill="#14181f"/>
  <path d="M1017 300 L1057 300" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M1017 300 L977 300" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="1010" y="322">P: E = 0</text>
  <text class="r" x="815" y="330">16 uC</text>
  <text class="r" x="1095" y="330">4 uC</text>
  <rect x="50" y="375" width="1100" height="320" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Electric field lines (Figs. 9.5 to 9.9)</text>
  <path d="M158 490 L198 490" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M153 503 L181 531" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M140 508 L140 548" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M127 503 L99 531" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M122 490 L82 490" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M127 477 L99 449" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M140 472 L140 432" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M153 477 L181 449" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <circle cx="140" cy="490" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="140" y="494" style="text-anchor:middle">+</text>
  <path d="M358 490 L318 490" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M341 531 L313 503" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M300 548 L300 508" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M259 531 L287 503" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M242 490 L282 490" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M259 449 L287 477" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M300 432 L300 472" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <path d="M341 449 L313 477" stroke="#1f6fb5" stroke-width="1.6" marker-end="url(#bl)"/>
  <circle cx="300" cy="490" r="13" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="300" y="494" style="text-anchor:middle">-</text>
  <text class="r" x="100" y="570">radially outward</text>
  <text class="r" x="266" y="570">radially inward</text>
  <path d="M435 476 L421 438" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M428 481 L395 458" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M425 490 L385 490" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M428 499 L395 522" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M435 504 L421 542" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M448 478 Q 470 440 462 420" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M448 502 Q 470 540 462 560" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <circle cx="440" cy="490" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="440" y="494" style="text-anchor:middle">+</text>
  <path d="M565 476 L579 438" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M572 481 L605 458" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M575 490 L615 490" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M572 499 L605 522" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M565 504 L579 542" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M552 478 Q 530 440 538 420" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M552 502 Q 530 540 538 560" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <circle cx="560" cy="490" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="560" y="494" style="text-anchor:middle">+</text>
  <text class="l" x="494" y="495">x</text>
  <text class="r" x="420" y="578">two like charges: lines</text>
  <text class="r" x="420" y="591">repel; x = neutral point</text>
  <path d="M682 482 Q 750 370 818 482" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M682 482 Q 750 430 818 482" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M682 498 Q 750 550 818 498" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M682 498 Q 750 610 818 498" fill="none" stroke="#d7322f" stroke-width="1.6"/>
  <path d="M683 490 L812 490" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <circle cx="670" cy="490" r="13" fill="#f8c8b8" stroke="#d7322f" stroke-width="2"/>
  <text class="l" x="670" y="494" style="text-anchor:middle">+</text>
  <circle cx="830" cy="490" r="13" fill="#bcdcf0" stroke="#1f6fb5" stroke-width="2"/>
  <text class="l" x="830" y="494" style="text-anchor:middle">-</text>
  <text class="r" x="650" y="578">opposite charges: lines run</text>
  <text class="r" x="650" y="591">from + to -; tangent gives E</text>
  <rect x="900" y="425" width="10" height="130" fill="#f8c8b8" stroke="#d7322f"/>
  <rect x="1060" y="425" width="10" height="130" fill="#bcdcf0" stroke="#1f6fb5"/>
  <path d="M912 440 L1056 440" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M912 462 L1056 462" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M912 484 L1056 484" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M912 506 L1056 506" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M912 528 L1056 528" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M912 550 L1056 550" stroke="#d7322f" stroke-width="1.6" marker-end="url(#p)"/>
  <text class="r" x="900" y="578">parallel plates: uniform field</text>
  <text class="r" x="900" y="591">(lines parallel, equally spaced)</text>
  <g class="t">
    <text x="70" y="622">properties: 1 lines start on positive charges and end on negative charges; 2 the tangent at a point gives the direction of E;</text>
    <text x="70" y="639">3 lines are close where the field is strong and far apart where it is weak (lines per unit area across them is proportional to E);</text>
    <text x="70" y="656">4 no two lines cross, since E has only one direction at a point; Faraday's idea; there is no electric field inside a conductor</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
