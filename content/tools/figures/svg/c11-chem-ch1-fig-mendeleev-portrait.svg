    <ellipse cx="388" cy="394" rx="19" ry="9" fill="#f4f1ee"/>
    <ellipse cx="492" cy="394" rx="19" ry="9" fill="#f4f1ee"/>
    <circle cx="390" cy="394" r="8" fill="#4b4a48"/>
    <circle cx="490" cy="394" r="8" fill="#4b4a48"/>
