<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original chart after Figure 17.4 and Table 17.4: bars on a log scale show hydroxide solubility rising from Mg(OH)2 (2 x 10^-5) to Ba(OH)2 (1.5 x 10^-2) and sulphate solubility falling from MgSO4 (0.183) to BaSO4 (9.43 x 10^-7) mol per 100 g water. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Solubility of Group 2 hydroxides and sulphates</text>
  <rect x="30.0" y="55.0" width="420.0" height="440.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="240.0" y="85.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">hydroxides: solubility increases down the group</text>
  <rect x="80.0" y="324.9" width="60.0" height="115.1" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="110.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Mg(OH)</tspan><tspan dy="4.2" font-size="9.1">2</tspan></text>
  <text x="110.0" y="314.9" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2 x 10</tspan><tspan dy="-4.6" font-size="7.7">-5</tspan></text>
  <rect x="170.0" y="231.2" width="60.0" height="208.8" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="200.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca(OH)</tspan><tspan dy="4.2" font-size="9.1">2</tspan></text>
  <text x="200.0" y="221.2" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">1.5 x 10</tspan><tspan dy="-4.6" font-size="7.7">-3</tspan></text>
  <rect x="260.0" y="213.4" width="60.0" height="226.6" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="290.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Sr(OH)</tspan><tspan dy="4.2" font-size="9.1">2</tspan></text>
  <text x="290.0" y="203.4" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">3.4 x 10</tspan><tspan dy="-4.6" font-size="7.7">-3</tspan></text>
  <rect x="350.0" y="181.2" width="60.0" height="258.8" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="380.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ba(OH)</tspan><tspan dy="4.2" font-size="9.1">2</tspan></text>
  <text x="380.0" y="171.2" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">1.5 x 10</tspan><tspan dy="-4.6" font-size="7.7">-2</tspan></text>
  <line x1="60.0" y1="440.0" x2="430.0" y2="440.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <rect x="470.0" y="55.0" width="420.0" height="440.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="680.0" y="85.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">sulphates: solubility decreases down the group</text>
  <rect x="520.0" y="126.9" width="60.0" height="313.1" rx="3" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="550.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">MgSO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="550.0" y="116.9" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">1.83 x 10</tspan><tspan dy="-4.6" font-size="7.7">-1</tspan></text>
  <rect x="610.0" y="206.6" width="60.0" height="233.4" rx="3" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="640.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CaSO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="640.0" y="196.6" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">4.66 x 10</tspan><tspan dy="-4.6" font-size="7.7">-3</tspan></text>
  <rect x="700.0" y="297.4" width="60.0" height="142.6" rx="3" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="730.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">SrSO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="730.0" y="287.4" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">7.11 x 10</tspan><tspan dy="-4.6" font-size="7.7">-5</tspan></text>
  <rect x="790.0" y="391.3" width="60.0" height="48.7" rx="3" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="820.0" y="462.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">BaSO</tspan><tspan dy="4.2" font-size="9.1">4</tspan></text>
  <text x="820.0" y="381.3" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">9.43 x 10</tspan><tspan dy="-4.6" font-size="7.7">-7</tspan></text>
  <line x1="500.0" y1="440.0" x2="870.0" y2="440.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="450.0" y="525.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">solubility in mol per 100 g water at 298 K (book's Table 17.4), bars on a log scale</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
