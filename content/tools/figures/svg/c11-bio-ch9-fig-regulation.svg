<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram for the regulation of gastric, pancreatic and bile secretion; the textbook has no figure here. -->
  <defs>
    <style>
      .h{font-size:25px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:17px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="40">Control of gastric juice</text>
  <!-- nervous -->
  <rect x="60" y="80" width="250" height="60" rx="12" fill="#1f6fb5"/><text class="b" x="185" y="106">sight, smell or thought</text><text class="b" x="185" y="128">of food</text>
  <path d="M310 110 H375" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="380" y="80" width="200" height="60" rx="12" fill="#1f6fb5"/><text class="b" x="480" y="116">medulla of brain</text>
  <path d="M580 110 H635" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="640" y="80" width="220" height="60" rx="12" fill="#d98b2b"/><text class="b" x="750" y="106">gastric glands secrete</text><text class="b" x="750" y="128">a small amount of juice</text>
  <text class="s" x="1030" y="116">nervous control</text>
  <!-- distension -->
  <rect x="60" y="180" width="250" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="185" y="206">food arrives: stomach</text><text class="b" x="185" y="228">stretches, pH falls</text>
  <path d="M310 210 H635" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="640" y="180" width="220" height="60" rx="12" fill="#d98b2b"/><text class="b" x="750" y="206">more secretion and</text><text class="b" x="750" y="228">powerful contractions</text>
  <!-- gastrin -->
  <rect x="60" y="280" width="250" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="185" y="306">proteins in the food</text><text class="b" x="185" y="328">reach the mucosa</text>
  <path d="M310 310 H375" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="380" y="280" width="200" height="60" rx="12" fill="#0f7a62"/><text class="b" x="480" y="306">endocrine cells</text><text class="b" x="480" y="328">release gastrin</text>
  <path d="M580 310 H635" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="608" y="362">via blood</text>
  <rect x="640" y="280" width="220" height="60" rx="12" fill="#d98b2b"/><text class="b" x="750" y="306">gastric glands make and</text><text class="b" x="750" y="328">secrete more juice</text>
  <text class="s" x="1030" y="316">hormonal control</text>
  <!-- somatostatin -->
  <rect x="60" y="380" width="250" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="185" y="406">food moves on to the</text><text class="b" x="185" y="428">small intestine</text>
  <path d="M310 410 H375" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="380" y="380" width="200" height="60" rx="12" fill="#0f7a62"/><text class="b" x="480" y="416">somatostatin</text>
  <path d="M580 410 H635" stroke="#d7322f" stroke-width="4" marker-end="url(#ax)"/>
  <rect x="640" y="380" width="220" height="60" rx="12" fill="#d7322f"/><text class="b" x="750" y="416">HCl release stops</text>
  <!-- pancreas and liver -->
  <text class="h" x="600" y="500">Control of pancreatic juice and bile</text>
  <rect x="60" y="530" width="250" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="185" y="556">acid chyme enters</text><text class="b" x="185" y="578">the duodenum</text>
  <path d="M310 560 H375" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="380" y="530" width="200" height="60" rx="12" fill="#0f7a62"/><text class="b" x="480" y="556">duodenal wall</text><text class="b" x="480" y="578">releases secretin</text>
  <rect x="60" y="630" width="250" height="60" rx="12" fill="#5b3fb5"/><text class="b" x="185" y="656">partly digested proteins</text><text class="b" x="185" y="678">and fats in the chyme</text>
  <path d="M310 660 H375" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="380" y="630" width="200" height="60" rx="12" fill="#0f7a62"/><text class="b" x="480" y="656">duodenal wall releases</text><text class="b" x="480" y="678">cholecystokinin (CCK)</text>
  <path d="M580 560 q50 0 60 50" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <path d="M580 660 q50 0 60 -50" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <rect x="640" y="580" width="220" height="60" rx="12" fill="#d98b2b"/><text class="b" x="750" y="606">pancreas releases</text><text class="b" x="750" y="628">pancreatic juice</text>
  <path d="M860 610 H935" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="940" y="580" width="200" height="60" rx="12" fill="#8a4b00"/><text class="b" x="1040" y="606">gallbladder</text><text class="b" x="1040" y="628">releases bile</text>
  <text class="s" x="1040" y="540">both hormones act on</text><text class="s" x="1040" y="562">both organs</text>
</svg>
