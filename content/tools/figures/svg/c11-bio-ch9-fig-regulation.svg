<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="520" fill="#ffffff"/>
  <!-- Our own flowchart (Roman Urdu lesson only): control of gastric juice; the textbook has no figure here -->
  <rect x="20.0" y="30.0" width="300.0" height="90.0" rx="14" stroke="#1d4ed8" stroke-width="2.5" fill="#dbeafe"/>
  <text x="170.0" y="69.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Sight, smell or</text>
  <text x="170.0" y="99.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">thought of food</text>
  <rect x="400.0" y="30.0" width="300.0" height="90.0" rx="14" stroke="#1d4ed8" stroke-width="2.5" fill="#dbeafe"/>
  <text x="550.0" y="84.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Medulla of brain</text>
  <rect x="780.0" y="30.0" width="300.0" height="90.0" rx="14" stroke="#1d4ed8" stroke-width="2.5" fill="#dbeafe"/>
  <text x="930.0" y="69.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Gastric glands secrete</text>
  <text x="930.0" y="99.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">gastric juice</text>
  <line x1="320.0" y1="75.0" x2="384.2" y2="75.0" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <path d="M395.0 75.0 L379.4 84.0 L379.4 66.0 Z" fill="#1d4ed8"/>
  <line x1="700.0" y1="75.0" x2="764.2" y2="75.0" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 75.0 L759.4 84.0 L759.4 66.0 Z" fill="#1d4ed8"/>
  <text x="550.0" y="160.0" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="700">nervous control</text>
  <rect x="20.0" y="220.0" width="300.0" height="90.0" rx="14" stroke="#c2410c" stroke-width="2.5" fill="#ffedd5"/>
  <text x="170.0" y="259.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Food (proteins) in</text>
  <text x="170.0" y="289.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">the stomach</text>
  <rect x="400.0" y="220.0" width="300.0" height="90.0" rx="14" stroke="#c2410c" stroke-width="2.5" fill="#ffedd5"/>
  <text x="550.0" y="259.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Endocrine cells</text>
  <text x="550.0" y="289.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">release gastrin</text>
  <rect x="780.0" y="220.0" width="300.0" height="90.0" rx="14" stroke="#c2410c" stroke-width="2.5" fill="#ffedd5"/>
  <text x="930.0" y="259.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Gastrin reaches gastric</text>
  <text x="930.0" y="289.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">glands through blood</text>
  <line x1="320.0" y1="265.0" x2="384.2" y2="265.0" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <path d="M395.0 265.0 L379.4 274.0 L379.4 256.0 Z" fill="#c2410c"/>
  <line x1="700.0" y1="265.0" x2="764.2" y2="265.0" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 265.0 L759.4 274.0 L759.4 256.0 Z" fill="#c2410c"/>
  <line x1="930.0" y1="220.0" x2="930.0" y2="135.8" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <path d="M930.0 125.0 L939.0 140.6 L921.0 140.6 Z" fill="#c2410c"/>
  <text x="550.0" y="350.0" font-size="24" fill="#c2410c" text-anchor="middle" font-weight="700">hormonal control</text>
  <rect x="20.0" y="400.0" width="300.0" height="90.0" rx="14" stroke="#4b5563" stroke-width="2.5" fill="#f3f4f6"/>
  <text x="170.0" y="439.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Food moves on to the</text>
  <text x="170.0" y="469.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">small intestine</text>
  <rect x="400.0" y="400.0" width="300.0" height="90.0" rx="14" stroke="#4b5563" stroke-width="2.5" fill="#f3f4f6"/>
  <text x="550.0" y="454.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">Somatostatin</text>
  <rect x="780.0" y="400.0" width="300.0" height="90.0" rx="14" stroke="#4b5563" stroke-width="2.5" fill="#f3f4f6"/>
  <text x="930.0" y="454.0" font-size="25" fill="#14181f" text-anchor="middle" font-weight="400">HCl secretion stops</text>
  <line x1="320.0" y1="445.0" x2="384.2" y2="445.0" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <path d="M395.0 445.0 L379.4 454.0 L379.4 436.0 Z" fill="#4b5563"/>
  <line x1="700.0" y1="445.0" x2="764.2" y2="445.0" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <path d="M775.0 445.0 L759.4 454.0 L759.4 436.0 Z" fill="#4b5563"/>
</svg>
