<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Times New Roman', Times, serif">
  <!-- Example 5 lake figure (C11-MATH, PDF p220): P 100 m above L on the lake; PQ horizontal; A the peak, M on the surface, B its image; angle of elevation 15 deg and angle of depression 30 deg drawn exactly; dashed LM; cyan bar beside AM, as printed. -->
  <rect width="1000" height="640" fill="#fffac2"/>
  <line x1="150" y1="390" x2="690" y2="390" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="6 7"/>
  <line x1="150" y1="250" x2="150" y2="390" stroke="#1a9fd6" stroke-width="3.5"/>
  <line x1="150" y1="250" x2="690" y2="250" stroke="#1a9fd6" stroke-width="3.5"/>
  <line x1="150" y1="250" x2="690" y2="105.3" stroke="#d6247f" stroke-width="3.5"/>
  <line x1="150" y1="250" x2="690" y2="561.8" stroke="#d6247f" stroke-width="3.5"/>
  <line x1="690" y1="105.3" x2="690" y2="561.8" stroke="#d6247f" stroke-width="3.5"/>
  <line x1="780" y1="105.3" x2="780" y2="390" stroke="#1a9fd6" stroke-width="3"/>
  <line x1="768" y1="105.3" x2="792" y2="105.3" stroke="#1a9fd6" stroke-width="3"/>
  <line x1="768" y1="390" x2="792" y2="390" stroke="#1a9fd6" stroke-width="3"/>
  <path d="M 480 250 A 330 330 0 0 0 468.8 164.6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 400 250 A 250 250 0 0 0 391.5 185.3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 223.6 292.5 A 85 85 0 0 0 235 250" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="220" font-size="26" text-anchor="start" fill="#1a1a1a">15°</text>
  <text x="240" y="282" font-size="26" text-anchor="start" fill="#1a1a1a">30°</text>
  <text x="136" y="256" font-size="28" text-anchor="end" fill="#1a1a1a" font-style="italic">P</text>
  <text x="136" y="400" font-size="28" text-anchor="end" fill="#1a1a1a" font-style="italic">L</text>
  <text x="704" y="260" font-size="28" text-anchor="start" fill="#1a1a1a" font-style="italic">Q</text>
  <text x="698" y="93.3" font-size="28" text-anchor="start" fill="#1a1a1a" font-style="italic">A</text>
  <text x="704" y="400" font-size="28" text-anchor="start" fill="#1a1a1a" font-style="italic">M</text>
  <text x="686" y="595.8" font-size="28" text-anchor="middle" fill="#1a1a1a" font-style="italic">B</text>
  <text x="128" y="320" font-size="26" text-anchor="middle" fill="#1a1a1a" font-weight="bold" transform="rotate(-90 128 320)">100 m</text>
</svg>
