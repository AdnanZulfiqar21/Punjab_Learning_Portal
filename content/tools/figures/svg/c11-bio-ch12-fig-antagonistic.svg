<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.24 and 12.25: antagonistic muscles at the elbow and the knee. Schematic. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
      .t{font-size:15px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2;fill:none}
    </style>
  </defs>
  <!-- elbow -->
  <text class="h" x="300" y="40">Elbow: biceps and triceps</text>
  <path d="M120 120 H330" stroke="#c9b27a" stroke-width="18" stroke-linecap="round"/>
  <path d="M330 120 L420 320" stroke="#c9b27a" stroke-width="16" stroke-linecap="round"/>
  <path d="M340 125 L425 318" stroke="#c9b27a" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="330" cy="120" r="14" fill="#fff4e2" stroke="#8a4b00" stroke-width="3"/>
  <path d="M140 108 q90 -70 210 40" fill="none" stroke="#d7322f" stroke-width="22" stroke-linecap="round"/>
  <path d="M140 108 q90 -70 210 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 60"/>
  <path d="M140 132 q90 60 190 -5" fill="none" stroke="#e0a6a0" stroke-width="18" stroke-linecap="round"/>
  <text class="k" x="380" y="62">biceps (flexor), contracted:</text><text class="t" x="380" y="80">bends the elbow</text>
  <text class="t" x="60" y="310">triceps (extensor), relaxed</text>
  <path class="lead" d="M150 300 L230 160"/><path class="lead" d="M375 72 L330 82"/>
  <text class="t" x="420" y="124">origin on the scapula,</text><text class="t" x="420" y="142">belly in the middle,</text><text class="t" x="420" y="160">insertion on the radius</text>
  <path class="lead" d="M415 134 L365 148"/>
  <text class="t" x="430" y="290">forearm: radius and ulna</text>
  <text class="s" x="300" y="360">the end on the stationary bone is the origin, the end on the moving bone</text><text class="s" x="300" y="380">the insertion; muscles work in antagonistic pairs: when the flexor</text><text class="s" x="300" y="400">contracts the extensor relaxes, and vice versa; to extend, the triceps</text><text class="s" x="300" y="420">contracts and the biceps relaxes</text>
  <!-- knee -->
  <text class="h" x="880" y="40">Knee: hamstrings and quadriceps</text>
  <path d="M760 100 L880 280" stroke="#c9b27a" stroke-width="20" stroke-linecap="round"/>
  <path d="M880 280 L800 440" stroke="#c9b27a" stroke-width="16" stroke-linecap="round"/>
  <path d="M895 285 L820 445" stroke="#c9b27a" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <circle cx="880" cy="280" r="16" fill="#fff4e2" stroke="#8a4b00" stroke-width="3"/>
  <circle cx="900" cy="268" r="9" fill="#fff4e2" stroke="#8a4b00" stroke-width="3"/>
  <path d="M740 115 q70 90 110 190 q10 60 -20 110" fill="none" stroke="#d7322f" stroke-width="22" stroke-linecap="round"/>
  <path d="M790 85 q110 60 140 170" fill="none" stroke="#e0a6a0" stroke-width="18" stroke-linecap="round"/>
  <text class="k" x="620" y="200">hamstrings (flexors)</text><text class="t" x="620" y="220">three muscles at the back</text><text class="t" x="620" y="238">of the thigh; origin on the</text><text class="t" x="620" y="256">pelvic girdle and top of the</text><text class="t" x="620" y="274">femur, insertion on the upper</text><text class="t" x="620" y="292">tibia and fibula; contracted:</text><text class="t" x="620" y="310">the lower leg bends</text>
  <path class="lead" d="M790 230 L820 250"/>
  <text class="k" x="960" y="110">quadriceps (extensors)</text><text class="t" x="960" y="130">four muscles at the front</text><text class="t" x="960" y="148">of the thigh; origin on the</text><text class="t" x="960" y="166">ilium and femur, insertion</text><text class="t" x="960" y="184">on the patella and tibia;</text><text class="t" x="960" y="202">relaxed here; contracting</text><text class="t" x="960" y="220">them straightens the leg</text>
  <path class="lead" d="M955 150 L905 165"/>
  <text class="t" x="930" y="285">patella</text><path class="lead" d="M925 280 L910 270"/>
  <text class="t" x="930" y="400">tibia and fibula</text>
  <text class="s" x="880" y="470">femur above, tibia and fibula below;</text><text class="s" x="880" y="490">hamstrings contract and quadriceps relax to flex,</text><text class="s" x="880" y="510">quadriceps contract and hamstrings relax to extend</text>
  <text class="s" x="600" y="580">Cream: bones. Dark red: the contracted muscle. Pale red: the relaxed antagonist. Tendons attach muscle to bone at origin and insertion.</text>
</svg>
