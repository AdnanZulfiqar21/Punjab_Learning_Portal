<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after topics 8.8 to 8.9: the equilibrium constant from the law of mass action, its forms Kc, Kp, Kn and Kx, their relations, units, and the sample calculations. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">The equilibrium constant: from the law of mass action to Kc, Kp, Kn and Kx</text>
  <rect x="60" y="55" width="520" height="190" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="83">Where Kc comes from (A + B gives C + D)</text>
  <g class="f">
    <text x="200" y="112">forward rate = kf [A][B]</text><text x="440" y="112">reverse rate = kr [C][D]</text>
    <text x="320" y="142">at equilibrium: kf [A][B] = kr [C][D]</text>
    <text x="320" y="172">kf / kr = [C][D] / [A][B] = Kc</text>
    <text x="320" y="210">aA + bB gives cC + dD:  Kc = [C]^c [D]^d / [A]^a [B]^b</text>
  </g>
  <text class="s" x="320" y="233">Guldberg and Waage, 1864; brackets are mol dm-3; solids and liquids omitted</text>
  <rect x="620" y="55" width="520" height="190" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="880" y="83">Four forms and their relations</text>
  <g class="f">
    <text x="880" y="112">Kc conc.; Kp pressures; Kn moles; Kx mole fractions</text>
    <text x="720" y="146">Kp = Kc (RT)^dn</text><text x="880" y="146">Kp = Kx (P)^dn</text><text x="1040" y="146">Kp = Kn (N)^dn</text>
  </g>
  <g class="t">
    <text x="640" y="176">dn = delta n = moles of gaseous products - moles of gaseous reactants;</text>
    <text x="640" y="196">R gas constant, T absolute temperature, P total pressure, N total moles</text>
    <text x="640" y="226">delta n = 0: Kp = Kc = Kx = Kn, whatever units are used</text>
  </g>
  <!-- units -->
  <rect x="60" y="270" width="520" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="320" y="298">Units of Kc</text>
  <g class="t">
    <text x="80" y="326">equal moles both sides: units cancel, Kc has none</text>
    <text x="80" y="346">ester formation: (mol dm-3)^2 / (mol dm-3)^2, Kc = 4.03 (Sample 8.1)</text>
    <text x="80" y="376">unequal moles: units remain</text>
    <text x="80" y="396">N2 + 3H2 gives 2NH3: (mol dm-3)^2 / (mol dm-3)^4 = mol-2 dm6</text>
  </g>
  <!-- samples -->
  <rect x="620" y="270" width="520" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="880" y="298">Converting between constants</text>
  <g class="t">
    <text x="640" y="326">Sample 8.3: ammonia at 500 degrees C, Kc = 6.0 x 10^-2, delta n = 2 - 4 = -2</text>
    <text x="640" y="346">Kp = 6.0 x 10^-2 x (0.0821 x 773)^-2 = 0.06 / 4032 = 1.4 x 10^-5: Kp is smaller</text>
    <text x="640" y="376">Sample 8.4: 2SO2 + O2 gives 2SO3 with pSO2 1.0, pO2 7.0, pSO3 8.0 (x 10^6 Pa)</text>
    <text x="640" y="396">Kp = (8.0 x 10^6)^2 / ((1.0 x 10^6)^2 x 7.0 x 10^6) = 9.1 x 10^-6 Pa-1</text>
  </g>
  <!-- worked Kc -->
  <rect x="60" y="445" width="1080" height="160" rx="12" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="473">Worked Kc values</text>
  <g class="t">
    <text x="80" y="501">Sample 8.1: 500 cm3 at equilibrium holds 0.235 mol ethanoic acid, 0.0350 mol ethanol, 0.182 mol ester, 0.182 mol water</text>
    <text x="80" y="521">concentrations 0.470, 0.070, 0.364, 0.364 mol dm-3; Kc = (0.364 x 0.364) / (0.470 x 0.070) = 4.03, no units</text>
    <text x="80" y="551">Sample 8.2: propanone + HCN gives the cyanohydrin; start 0.0500 each, product 0.0233 at equilibrium, so each reactant 0.0267</text>
    <text x="80" y="571">Kc = 0.0233 / (0.0267 x 0.0267) = 32.7 mol-1 dm3 (printed as mol dm-3)</text>
    <text x="80" y="596">Kc depends on temperature only; it does not depend on the starting concentrations, and a catalyst does not change it</text>
  </g>
</svg>
