<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original redraw after the printed second Figure 2.4: an electron spinning clockwise or anticlockwise behaves like a small magnet pointing one way or the other. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Electron spin: two possible directions</text>
  <circle cx="260.0" cy="150.0" r="55.0" stroke="#14181f" stroke-width="2.5" fill="#cbd5e1"/>
  <ellipse cx="260.0" cy="150.0" rx="85.0" ry="22.0" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <path d="M345.0 156.0 L339.5 144.2 L350.5 144.2 Z" fill="#d98b2b"/>
  <rect x="238.0" y="240.0" width="44.0" height="120.0" rx="4" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <rect x="238.0" y="240.0" width="44.0" height="60.0" rx="4" stroke="#14181f" stroke-width="2.5" fill="#fde2e1"/>
  <text x="260.0" y="280.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">N</text>
  <text x="260.0" y="340.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">S</text>
  <line x1="320.0" y1="350.0" x2="320.0" y2="255.4" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M320.0 245.0 L325.5 256.8 L314.5 256.8 Z" fill="#d7322f"/>
  <text x="260.0" y="400.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">(a) clockwise spin: ms = +1/2</text>
  <circle cx="640.0" cy="150.0" r="55.0" stroke="#14181f" stroke-width="2.5" fill="#cbd5e1"/>
  <ellipse cx="640.0" cy="150.0" rx="85.0" ry="22.0" stroke="#d98b2b" stroke-width="3" fill="none"/>
  <path d="M555.0 156.0 L549.5 144.2 L560.5 144.2 Z" fill="#d98b2b"/>
  <rect x="618.0" y="240.0" width="44.0" height="120.0" rx="4" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <rect x="618.0" y="240.0" width="44.0" height="60.0" rx="4" stroke="#14181f" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="640.0" y="280.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">S</text>
  <text x="640.0" y="340.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">N</text>
  <line x1="700.0" y1="245.0" x2="700.0" y2="339.6" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M700.0 350.0 L694.5 338.2 L705.5 338.2 Z" fill="#d7322f"/>
  <text x="640.0" y="400.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">(b) anticlockwise spin: ms = -1/2</text>
  <text x="450.0" y="435.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400">a spinning charge behaves like a tiny magnet; the two spins act as magnets pointing opposite ways</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
