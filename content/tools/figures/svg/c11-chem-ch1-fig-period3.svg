<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Table 1.2 and the text of 1.8 to 1.10: the reactions of Na and Mg, the bonding and acid-base character of period 3 oxides and chlorides, and their oxidation numbers. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .t{font-size:15px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="34">Period 3: from ionic, basic sodium to covalent, acidic sulfur</text>
  <!-- element header -->
  <g class="k">
    <text x="150" y="80">Na</text><text x="300" y="80">Mg</text><text x="450" y="80">Al</text><text x="600" y="80">Si</text><text x="750" y="80">P</text><text x="900" y="80">S</text><text x="1050" y="80">Cl</text>
  </g>
  <!-- oxides row -->
  <rect x="60" y="100" width="1080" height="120" rx="10" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="t" x="70" y="122" font-weight="700" fill="#14181f">Oxides</text>
  <g class="s">
    <text x="150" y="150">Na2O</text><text x="300" y="150">MgO</text><text x="450" y="150">Al2O3</text><text x="600" y="150">SiO2</text><text x="750" y="150">P4O6, P4O10</text><text x="900" y="150">SO2, SO3</text><text x="1050" y="150">(Cl2O7)</text>
    <text x="150" y="175">+1</text><text x="300" y="175">+2</text><text x="450" y="175">+3</text><text x="600" y="175">+4</text><text x="750" y="175">+3, +5</text><text x="900" y="175">+4, +6</text>
    <text x="225" y="205" style="fill:#1f6fb5;font-weight:700">basic, ionic lattice</text><text x="450" y="205" style="fill:#5b3fb5;font-weight:700">amphoteric</text><text x="800" y="205" style="fill:#d7322f;font-weight:700">acidic, covalent molecules</text>
  </g>
  <!-- chlorides row -->
  <rect x="60" y="240" width="1080" height="120" rx="10" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="t" x="70" y="262" font-weight="700" fill="#14181f">Chlorides</text>
  <g class="s">
    <text x="150" y="290">NaCl</text><text x="300" y="290">MgCl2</text><text x="450" y="290">AlCl3</text><text x="600" y="290">SiCl4</text><text x="750" y="290">PCl3, PCl5</text><text x="900" y="290">SCl2</text>
    <text x="150" y="315">+1</text><text x="300" y="315">+2</text><text x="450" y="315">+3</text><text x="600" y="315">+4</text><text x="750" y="315">+3, +5</text><text x="900" y="315">-2 (as printed)</text>
    <text x="225" y="345" style="fill:#1f6fb5;font-weight:700">neutral in water (hydration), ionic</text><text x="750" y="345" style="fill:#d7322f;font-weight:700">hydrolyse to acidic solutions, covalent</text>
  </g>
  <path d="M80 380 H1120" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="600" y="405">electronegativity rises, the difference from O or Cl falls: ionic character gives way to covalent; oxidation number follows the group's valence electrons</text>
  <!-- reactions -->
  <rect x="60" y="430" width="530" height="270" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="325" y="458">Sodium and magnesium</text>
  <g class="t">
    <text x="80" y="486">water: 2Na + 2H2O gives 2NaOH + H2 (vigorous)</text>
    <text x="80" y="508">Mg + 2H2O gives Mg(OH)2 + H2 (slow); with steam, MgO + H2</text>
    <text x="80" y="536">oxygen: 2Na + O2 gives 2Na2O2 (golden flame; Na2O with limited O2)</text>
    <text x="80" y="558">2Mg + O2 gives 2MgO (intense white flame)</text>
    <text x="80" y="586">chlorine: 2Na + Cl2 gives 2NaCl; Mg + Cl2 gives MgCl2 (white solids)</text>
    <text x="80" y="620">Na is the more reactive: larger, lower ionization energy, more metallic;</text><text x="80" y="642">it is stored under kerosene. Both oxides are basic: Na2O + H2O gives 2NaOH.</text>
    <text x="80" y="676">Mg powder burns so brightly it is used in fireworks and flares.</text>
  </g>
  <!-- acid base examples -->
  <rect x="610" y="430" width="530" height="270" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="875" y="458">Acid-base behaviour in water and with NaOH</text>
  <g class="t">
    <text x="630" y="486">basic: Na2O + H2O gives 2NaOH; CaO + H2O gives Ca(OH)2</text>
    <text x="630" y="514">amphoteric: Al2O3 + 6HCl gives 2AlCl3 + 3H2O;</text><text x="630" y="536">Al2O3 + 2NaOH gives Na2Al2O4 + H2O</text>
    <text x="630" y="564">acidic: SO2 + H2O gives H2SO3; P2O3 + H2O gives H3PO3;</text><text x="630" y="586">SiO2 + 2NaOH gives Na2SiO3 + H2O</text>
    <text x="630" y="614">neutral chlorides: NaCl in water, pH 7; MgCl2, pH about 6.5</text>
    <text x="630" y="642">acidic chlorides hydrolyse: AlCl3 + 3H2O gives Al(OH)3 + 3HCl;</text><text x="630" y="664">SiCl4 + 2H2O gives SiO2 + 4HCl; PCl3 + 3H2O gives H3PO3 + 3HCl</text>
  </g>
</svg>
