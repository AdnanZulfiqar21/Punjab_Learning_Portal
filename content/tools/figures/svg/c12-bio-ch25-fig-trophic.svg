<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 25.4 and 25.6: a pyramid of four trophic levels, producers, primary, secondary and tertiary consumers, with the book's example energies of 10,000, 1,000, 100 and 10 kcal, about 10% passing up each step. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Trophic levels and the 10% rule</text>
  <rect x="245.0" y="80.0" width="230.0" height="78.0" rx="6" stroke="#d7322f" stroke-width="2.5" fill="#ffffff"/>
  <text x="360.0" y="110.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">level 4: tertiary consumers</text>
  <text x="360.0" y="132.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">hawk, wolf</text>
  <text x="770.0" y="124.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">10 kcal</text>
  <line x1="770.0" y1="186.0" x2="770.0" y2="160.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M770.0 154.0 L773.4 161.3 L766.6 161.3 Z" fill="#4b5563"/>
  <text x="790.0" y="176.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">about 10%</text>
  <rect x="175.0" y="170.0" width="370.0" height="78.0" rx="6" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="360.0" y="200.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">level 3: secondary consumers</text>
  <text x="360.0" y="222.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">frog, snake</text>
  <text x="770.0" y="214.0" font-size="16" fill="#d98b2b" text-anchor="middle" font-weight="700">100 kcal</text>
  <line x1="770.0" y1="276.0" x2="770.0" y2="250.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M770.0 244.0 L773.4 251.3 L766.6 251.3 Z" fill="#4b5563"/>
  <text x="790.0" y="266.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">about 10%</text>
  <rect x="105.0" y="260.0" width="510.0" height="78.0" rx="6" stroke="#ca8a04" stroke-width="2.5" fill="#ffffff"/>
  <text x="360.0" y="290.0" font-size="14" fill="#ca8a04" text-anchor="middle" font-weight="700">level 2: primary consumers</text>
  <text x="360.0" y="312.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">insects, rabbit</text>
  <text x="770.0" y="304.0" font-size="16" fill="#ca8a04" text-anchor="middle" font-weight="700">1,000 kcal</text>
  <line x1="770.0" y1="366.0" x2="770.0" y2="340.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M770.0 334.0 L773.4 341.3 L766.6 341.3 Z" fill="#4b5563"/>
  <text x="790.0" y="356.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">about 10%</text>
  <rect x="35.0" y="350.0" width="650.0" height="78.0" rx="6" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="360.0" y="380.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">level 1: producers</text>
  <text x="360.0" y="402.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">green plants, algae</text>
  <text x="770.0" y="394.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700">10,000 kcal</text>
  <text x="770.0" y="70.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">energy reaching each level</text>
  <rect x="40.0" y="450.0" width="820.0" height="90.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="476.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Producers store only about 1-2% of the sunlight they receive; about 10% passes to each next level.</text>
  <text x="60.0" y="498.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">The rest is lost as heat, used in respiration or not eaten, so food chains rarely have more than 3-4 levels.</text>
  <text x="60.0" y="520.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Decomposers and detritivores feed on dead matter from every level.</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
