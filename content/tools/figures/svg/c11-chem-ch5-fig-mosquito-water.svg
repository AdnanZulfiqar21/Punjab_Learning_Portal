<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <!-- Vis5-2 (C11-CHEM, PDF p103): mosquito on water margin photo; flat drawing after the printed photograph: a mosquito with a slender brown body and six long thin legs stands on light blue water; where each leg touches, the water surface dips in a small ring without breaking; its shadow falls on the water below. No photograph is reproduced. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb6d6"/><stop offset="1" stop-color="#9fdcef"/></linearGradient>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>
  <rect x="10" y="10" width="1080" height="680" fill="url(#water)" stroke="#222222" stroke-width="4"/>
  <!-- dimples in the surface where the legs touch -->
  <g fill="#c9eef9" stroke="#ffffff" stroke-width="4">
    <ellipse cx="120" cy="560" rx="55" ry="16"/>
    <ellipse cx="365" cy="610" rx="55" ry="16"/>
    <ellipse cx="520" cy="560" rx="55" ry="16"/>
    <ellipse cx="760" cy="420" rx="55" ry="16"/>
    <ellipse cx="960" cy="520" rx="60" ry="17"/>
    <ellipse cx="660" cy="300" rx="50" ry="14"/>
  </g>
  <g fill="#2f88ad" opacity="0.45">
    <ellipse cx="120" cy="566" rx="28" ry="6"/>
    <ellipse cx="365" cy="616" rx="28" ry="6"/>
    <ellipse cx="520" cy="566" rx="28" ry="6"/>
    <ellipse cx="760" cy="426" rx="28" ry="6"/>
    <ellipse cx="960" cy="526" rx="30" ry="6"/>
    <ellipse cx="660" cy="306" rx="26" ry="6"/>
  </g>
  <!-- shadow of the mosquito on the water -->
  <path d="M400 470 C 440 450 520 470 560 500 C 520 520 450 510 400 470 Z" fill="#2c6f8c" opacity="0.35"/>
  <!-- long thin legs -->
  <g stroke="#2a2420" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 250 L 260 330 L 120 556"/>
    <path d="M400 262 L 360 420 L 365 606"/>
    <path d="M420 262 L 470 420 L 520 556"/>
    <path d="M440 250 L 620 340 L 760 416"/>
    <path d="M450 240 L 720 400 L 960 516"/>
    <path d="M430 240 L 560 230 L 660 296"/>
  </g>
  <!-- body: head, thorax, long abdomen -->
  <ellipse cx="300" cy="150" rx="22" ry="20" fill="#3a2c22"/>
  <path d="M290 140 L 250 100" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
  <path d="M296 136 L 268 90 M304 136 L 296 86" stroke="#2a2420" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="350" cy="200" rx="58" ry="40" fill="#6b4a32" transform="rotate(35 350 200)"/>
  <path d="M390 230 C 440 250 520 300 640 380 C 650 392 640 400 628 396 C 520 330 430 280 384 250 Z" fill="#8a6446"/>
  <g stroke="#e8d9c5" stroke-width="4">
    <path d="M440 266 L 432 280 M480 290 L 472 304 M520 315 L 512 329 M560 340 L 552 354 M600 366 L 592 378"/>
  </g>
  <!-- folded wings -->
  <path d="M370 210 C 450 230 540 280 610 330 C 520 300 430 260 370 230 Z" fill="#d9e4e8" opacity="0.7" stroke="#9fb1b8" stroke-width="2"/>
</svg>
