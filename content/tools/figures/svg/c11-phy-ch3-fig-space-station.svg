<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.14: a wheel-shaped space station rotates so the rim's push on an astronaut acts as artificial gravity. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Artificial gravity in a rotating space station</text>
  <circle cx="300.0" cy="265.0" r="190.0" stroke="#0f7a62" stroke-width="26" fill="none"/>
  <circle cx="300.0" cy="265.0" r="190.0" stroke="#0b5e4b" stroke-width="2" fill="none"/>
  <line x1="300.0" y1="265.0" x2="475.0" y2="265.0" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="300.0" y1="265.0" x2="300.0" y2="440.0" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="300.0" y1="265.0" x2="125.0" y2="265.0" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="300.0" y1="265.0" x2="300.0" y2="90.0" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300.0" cy="265.0" r="34.0" stroke="#4b5563" stroke-width="2.5" fill="#e5e7eb"/>
  <path d="M83.9 186.3 A230 230 0 0 1 221.3 48.9" stroke="#d98b2b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M221.3 48.9 L213.6 56.6 L210.4 47.9 Z" fill="#d98b2b"/>
  <text x="90.0" y="65.0" font-size="18" fill="#d98b2b" text-anchor="start" font-weight="700">rotation</text>
  <circle cx="300.0" cy="396.0" r="8.0" stroke="#14181f" stroke-width="2" fill="#ffe7cf"/>
  <line x1="300.0" y1="404.0" x2="300.0" y2="428.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="300.0" y1="428.0" x2="292.0" y2="442.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="300.0" y1="428.0" x2="308.0" y2="442.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="330.0" y1="432.0" x2="330.0" y2="362.4" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M330.0 352.0 L335.5 363.8 L324.5 363.8 Z" fill="#d7322f"/>
  <line x1="334.0" y1="382.0" x2="555.0" y2="372.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="562.0" y="368.0" font-size="17" fill="#d7322f" text-anchor="start" font-weight="700">the floor pushes the astronaut</text>
  <text x="562.0" y="390.0" font-size="17" fill="#d7322f" text-anchor="start" font-weight="700">towards the centre</text>
  <rect x="560.0" y="120.0" width="310.0" height="180.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="578.0" y="152.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">The rim pushes the astronaut</text>
  <text x="578.0" y="174.1" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">towards the centre: this</text>
  <text x="578.0" y="196.2" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">centripetal force feels like</text>
  <text x="578.0" y="218.3" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">weight, with the floor on the</text>
  <text x="578.0" y="240.4" font-size="17" fill="#14181f" text-anchor="start" font-weight="400">outer rim.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
