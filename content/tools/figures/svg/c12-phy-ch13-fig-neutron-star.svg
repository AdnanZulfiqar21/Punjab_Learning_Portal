  <text x="505.0" y="200.0" font-size="27" fill="#ffffff" text-anchor="middle" font-weight="700">Neutron</text>
  <text x="505.0" y="232.0" font-size="27" fill="#ffffff" text-anchor="middle" font-weight="700">degeneracy</text>
  <text x="505.0" y="264.0" font-size="27" fill="#ffffff" text-anchor="middle" font-weight="700">pressure</text>
  <text x="725.6" y="104.3" font-size="30" fill="#14181f" text-anchor="start" font-weight="700">Gravitational</text>
  <text x="725.6" y="138.3" font-size="30" fill="#14181f" text-anchor="start" font-weight="700">force</text>
  <line x1="635.3" y1="404.3" x2="720.0" y2="438.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
