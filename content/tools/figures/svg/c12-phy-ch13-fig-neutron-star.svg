  <!-- Fig 13.6 (C12-PHY, PDF p14): Section of neutron star, as printed on a dark space background: a glowing blue-white neutron star with its right part cut away to show dark layers round a bright core; a white arrow from the centre outwards labelled Neutron degeneracy pressure meets an arrow from outside labelled Gravitational force (written slanting along the edge at the top right), and Thin atmosphere marks the outer layer; labels in white inside the picture. -->
  <defs><radialGradient id="surf" cx="0.42" cy="0.42" r="0.62"><stop offset="0" stop-color="#eef6ff"/><stop offset="0.7" stop-color="#b9d4f2"/><stop offset="1" stop-color="#7ea6d8"/></radialGradient><radialGradient id="core" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#bff3ff"/><stop offset="0.75" stop-color="#2a8fb3" stop-opacity="0.9"/><stop offset="1" stop-color="#1b3f73" stop-opacity="0"/></radialGradient><clipPath id="facecut"><path d="M380 100 A250 250 0 0 1 380 600 A90.0 250 0 0 1 380 100 Z"/></clipPath><radialGradient id="halo" r="0.5"><stop offset="0.7" stop-color="#cfe6ff" stop-opacity="0.95"/><stop offset="0.82" stop-color="#7fb4ef" stop-opacity="0.6"/><stop offset="1" stop-color="#1b3f73" stop-opacity="0"/></radialGradient></defs>
