  <rect width="1000" height="700" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Fig 13.6 (Section of neutron star): a cut-away neutron star with neutron degeneracy pressure acting outward, the gravitational force acting inward, and a thin atmosphere as the outer layer. -->
