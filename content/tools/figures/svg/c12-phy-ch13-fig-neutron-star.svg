<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 13.6: a section of a neutron star with neutron degeneracy pressure pushing outward against gravity and a thin atmosphere, with the facts given in the text about its density and pulsars. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A neutron star (after Fig 13.6)</text>
  <rect x="15.0" y="55.0" width="470.0" height="410.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="250.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">section</text>
  <circle cx="250.0" cy="250.0" r="150.0" stroke="#1f6fb5" stroke-width="2.2" fill="#e0f2fe"/>
  <circle cx="250.0" cy="250.0" r="138.0" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <circle cx="250.0" cy="250.0" r="80.0" stroke="#1f6fb5" stroke-width="1.2" fill="#93c5fd"/>
  <line x1="280.0" y1="250.0" x2="360.0" y2="250.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M368.0 250.0 L358.9 254.2 L358.9 245.8 Z" fill="#1f6fb5"/>
  <line x1="250.0" y1="280.0" x2="250.0" y2="360.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250.0 368.0 L245.8 358.9 L254.2 358.9 Z" fill="#1f6fb5"/>
  <line x1="220.0" y1="250.0" x2="140.0" y2="250.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M132.0 250.0 L141.1 245.8 L141.1 254.2 Z" fill="#1f6fb5"/>
  <line x1="250.0" y1="220.0" x2="250.0" y2="140.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250.0 132.0 L254.2 141.1 L245.8 141.1 Z" fill="#1f6fb5"/>
  <line x1="387.9" y1="387.9" x2="358.2" y2="358.2" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M352.5 352.5 L361.9 356.0 L356.0 361.9 Z" fill="#d7322f"/>
  <line x1="112.1" y1="387.9" x2="141.8" y2="358.2" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M147.5 352.5 L144.0 361.9 L138.1 356.0 Z" fill="#d7322f"/>
  <line x1="112.1" y1="112.1" x2="141.8" y2="141.8" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M147.5 147.5 L138.1 144.0 L144.0 138.1 Z" fill="#d7322f"/>
  <line x1="387.9" y1="112.1" x2="358.2" y2="141.8" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M352.5 147.5 L356.0 138.1 L361.9 144.0 Z" fill="#d7322f"/>
  <text x="250.0" y="255.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">neutrons</text>
  <text x="390.0" y="98.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">gravity</text>
  <text x="250.0" y="430.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">blue: neutron degeneracy pressure outward;</text>
  <text x="250.0" y="446.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">thin outer atmosphere</text>
  <rect x="500.0" y="55.0" width="385.0" height="410.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="692.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">facts from the text</text>
  <text x="520.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">among the densest objects; second</text>
  <text x="520.0" y="133.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">only to black holes</text>
  <text x="520.0" y="156.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="179.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">a teaspoon of its matter would have a</text>
  <text x="520.0" y="202.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">mass over 5.5 x 10^12 kg</text>
  <text x="520.0" y="225.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="248.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">the whole Earth at this density would fit</text>
  <text x="520.0" y="271.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">in a sphere about 305 m across</text>
  <text x="520.0" y="294.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400"></text>
  <text x="520.0" y="317.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">pulsars: young, fast-spinning neutron</text>
  <text x="520.0" y="340.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">stars sending beams of radiation from</text>
  <text x="520.0" y="363.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="400">their magnetic poles</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
