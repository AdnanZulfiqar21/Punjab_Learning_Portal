  <circle cx="380.0" cy="350.0" r="272.0" stroke="#7fb2e8" stroke-width="2" fill="#dceafa"/>
  <circle cx="380.0" cy="350.0" r="250.0" stroke="#3f6fae" stroke-width="3" fill="url(#surf)"/>
  <path d="M380 100 A250 250 0 0 1 380 600 A90.0 250 0 0 1 380 100 Z" stroke="#16325e" stroke-width="3" fill="#1d3d70" stroke-linejoin="round" stroke-linecap="round"/>
  <g clip-path="url(#facecut)">
  <circle cx="410.0" cy="350.0" r="230.0" stroke="#3a64a3" stroke-width="2" fill="none"/>
  <circle cx="410.0" cy="350.0" r="200.0" stroke="#3a64a3" stroke-width="2" fill="none"/>
  <circle cx="410.0" cy="350.0" r="170.0" stroke="#3a64a3" stroke-width="2" fill="none"/>
  <circle cx="410.0" cy="350.0" r="140.0" stroke="#3a64a3" stroke-width="2" fill="none"/>
  <circle cx="410.0" cy="360.0" r="130.0" stroke="none" fill="url(#core)"/>
  </g>
  <path d="M380 100 A250 250 0 0 1 380 600 A90.0 250 0 0 1 380 100 Z" stroke="#16325e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M449.5 338.4 L584.1 299.8 L587.4 311.3 L614.5 282.7 L576.4 272.9 L579.7 284.4 L445.1 323.0 Z" stroke="#16325e" stroke-width="2.5" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
