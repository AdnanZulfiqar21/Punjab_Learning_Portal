  <rect x="850.0" y="470.0" width="340.0" height="370.0" rx="0" stroke="none" stroke-width="0" fill="#fff6cf"/>
  <text x="862.0" y="506.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">The filter is washed with</text>
  <text x="862.0" y="541.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">a solution that denatures</text>
  <text x="862.0" y="576.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">DNA. The solution has</text>
  <text x="862.0" y="611.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">radioactively-labelled</text>
  <text x="862.0" y="646.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">probe (nucleotide</text>
  <text x="862.0" y="681.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">sequence complementary</text>
  <text x="862.0" y="716.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">to gene of interest). The</text>
  <text x="862.0" y="751.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">probe binds to the cells</text>
  <text x="862.0" y="786.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">which contain gene of</text>
  <text x="862.0" y="821.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">interest.</text>
  <circle cx="856.0" cy="456.0" r="17.0" stroke="#e0218a" stroke-width="1" fill="#e6007e"/>
  <text x="856.0" y="465.0" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
