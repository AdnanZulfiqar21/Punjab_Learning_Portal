  <text x="32.0" y="866.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">A replica of plate is made by pressing a filter against</text>
  <text x="32.0" y="901.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">the clones. Some cells from each clone attach with the filter.</text>
  <circle cx="26.0" cy="816.0" r="17.0" stroke="#e0218a" stroke-width="1" fill="#e6007e"/>
  <text x="26.0" y="825.0" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
