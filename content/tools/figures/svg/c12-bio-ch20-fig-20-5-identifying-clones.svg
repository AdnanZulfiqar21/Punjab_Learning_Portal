  <text x="42.0" y="491.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">have plasmid, are grown on agar.</text>
  <circle cx="36.0" cy="406.0" r="17.0" stroke="#e0218a" stroke-width="1" fill="#e6007e"/>
  <text x="36.0" y="415.0" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
