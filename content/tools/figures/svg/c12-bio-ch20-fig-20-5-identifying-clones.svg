  <text x="510.0" y="370.0" font-size="28" fill="#14181f" text-anchor="end" font-weight="400">Film</text>
  <rect x="850.0" y="170.0" width="340.0" height="195.0" rx="0" stroke="none" stroke-width="0" fill="#fff6cf"/>
  <text x="862.0" y="206.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">Only those clones which</text>
  <text x="862.0" y="241.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">contain gene of interest</text>
  <text x="862.0" y="276.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">retain the probe and emit</text>
  <text x="862.0" y="311.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">radioactivity on film</text>
  <text x="862.0" y="346.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="400">placed over the filter.</text>
