<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 14.19 (C12-PHY, PDF p38): Radio, as printed: an old portable radio standing on a wooden shelf against a dark wooden wall; a black speaker grille on the left with a small window at its top corner, a silver frame, a tuning dial with a scale and a red pointer on the right, and a hand at the right edge turning the tuning knob. Flat drawing after the printed photograph; no photograph is reproduced. -->
  <rect width="1200" height="560" fill="#6b2f1c"/>
  <g stroke="#4f2013" stroke-width="6"><path d="M80 0 V470 M210 0 V470 M330 0 V470 M470 0 V470 M600 0 V470 M720 0 V470 M860 0 V470 M990 0 V470 M1110 0 V470"/></g>
  <g stroke="#83402a" stroke-width="3" opacity="0.7"><path d="M140 0 V470 M270 40 V470 M400 0 V420 M540 20 V470 M660 0 V470 M790 0 V470 M930 30 V470 M1050 0 V470"/></g>
  <!-- shelf -->
  <rect x="0" y="470" width="1200" height="90" fill="#3a1a0f"/>
  <rect x="0" y="470" width="1200" height="14" fill="#5a2a18"/>
  <!-- handle -->
  <path d="M245 140 L245 105 Q245 92 260 92 L940 92 Q955 92 955 105 L955 140" fill="none" stroke="#9fa4ab" stroke-width="12"/>
  <!-- radio body -->
  <rect x="200" y="140" width="800" height="335" rx="16" fill="#c5c9cf" stroke="#6f747b" stroke-width="5"/>
  <rect x="220" y="160" width="520" height="295" rx="8" fill="#1d1e21"/>
  <g stroke="#2f3135" stroke-width="5"><path d="M230 180 H730 M230 200 H730 M230 220 H730 M230 240 H730 M230 260 H730 M230 280 H730 M230 300 H730 M230 320 H730 M230 340 H730 M230 360 H730 M230 380 H730 M230 400 H730 M230 420 H730 M230 440 H730"/></g>
  <rect x="260" y="185" width="120" height="40" rx="3" fill="#2e3034" stroke="#9fa4ab" stroke-width="4"/>
  <!-- tuning dial -->
  <rect x="760" y="165" width="170" height="285" rx="8" fill="#e9edf1" stroke="#7d838a" stroke-width="4"/>
  <g stroke="#5a7d9a" stroke-width="2.5">
    <path d="M785 190 V425 M815 190 V425 M845 190 V425 M875 190 V425 M905 190 V425"/>
    <path d="M775 210 H795 M775 240 H795 M775 270 H795 M775 300 H795 M775 330 H795 M775 360 H795 M775 390 H795 M805 225 H825 M805 285 H825 M805 345 H825 M805 405 H825 M865 215 H885 M865 265 H885 M865 315 H885 M865 365 H885 M895 240 H915 M895 330 H915 M895 410 H915"/>
  </g>
  <line x1="770" y1="300" x2="922" y2="300" stroke="#d62828" stroke-width="4"/>
  <!-- tuning knobs -->
  <rect x="940" y="200" width="40" height="70" rx="10" fill="#9fa4ab" stroke="#5a5e64" stroke-width="3"/>
  <rect x="940" y="330" width="40" height="70" rx="10" fill="#9fa4ab" stroke="#5a5e64" stroke-width="3"/>
  <!-- hand turning the knob -->
  <path d="M1200 160 L1080 170 Q1020 180 990 215 Q975 240 1000 250 L1050 240 Q1010 270 1000 300 Q1000 320 1030 315 L1070 300 Q1040 330 1045 350 Q1060 365 1090 345 L1120 330 Q1110 360 1130 370 Q1160 380 1200 350 Z" fill="#f0c3a3" stroke="#b98868" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1000 250 Q975 235 985 218 L1020 212" fill="none" stroke="#b98868" stroke-width="3"/>
</svg>
