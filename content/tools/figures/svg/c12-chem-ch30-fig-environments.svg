<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>
  <!-- Original diagram for topic 30.3 and Table 30.1: molecules with one, two and three proton environments, and bars of typical chemical shift ranges from alkyl (0.5-1.5 ppm) to carboxylic acid (9.0-13.0 ppm). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Proton environments and chemical shifts</text>
  <rect x="15.0" y="55.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">how many environments?</text>
  <text x="160.0" y="125.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">, C</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">, C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">, C</tspan><tspan dy="4.5" font-size="9.8">6</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">12</tspan></text>
  <text x="160.0" y="165.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700">1 each</text>
  <text x="450.0" y="125.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">, CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">OH</tspan></text>
  <text x="450.0" y="165.0" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700">2 each</text>
  <text x="740.0" y="125.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">ClCH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">, CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">OH</tspan></text>
  <text x="740.0" y="165.0" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="700">3 each</text>
  <text x="450.0" y="205.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">chemically equivalent protons (same surroundings) give a single signal</text>
  <rect x="15.0" y="240.0" width="870.0" height="385.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="270.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">typical chemical shift ranges (book's Table 30.1)</text>
  <text x="238.0" y="305.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">RCOOH</text>
  <rect x="250.0" y="292.0" width="184.6" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="331.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">RCHO</text>
  <rect x="388.5" y="318.0" width="46.2" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="357.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">Ar-H</text>
  <rect x="434.6" y="344.0" width="115.4" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="383.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">C=CH (vinylic)</text>
  <rect x="573.1" y="370.0" width="69.2" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="409.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">Ar-OH</text>
  <rect x="526.9" y="396.0" width="115.4" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="435.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">CH next to O, Cl</text>
  <rect x="642.3" y="422.0" width="69.2" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="461.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">CH next to Ar</text>
  <rect x="711.5" y="448.0" width="32.3" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="487.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">CH next to C=O</text>
  <rect x="730.0" y="474.0" width="27.7" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="513.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">R-OH</text>
  <rect x="573.1" y="500.0" width="253.8" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <text x="238.0" y="539.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">alkyl CH</text>
  <rect x="780.8" y="526.0" width="46.2" height="16.0" rx="4" stroke="#1f6fb5" stroke-width="1.2" fill="#bfdbfe"/>
  <line x1="250.0" y1="568.0" x2="850.0" y2="568.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="250.0" y1="568.0" x2="250.0" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250.0" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">13</text>
  <line x1="296.2" y1="568.0" x2="296.2" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="296.2" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">12</text>
  <line x1="342.3" y1="568.0" x2="342.3" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="342.3" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">11</text>
  <line x1="388.5" y1="568.0" x2="388.5" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="388.5" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">10</text>
  <line x1="434.6" y1="568.0" x2="434.6" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="434.6" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">9</text>
  <line x1="480.8" y1="568.0" x2="480.8" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="480.8" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">8</text>
  <line x1="526.9" y1="568.0" x2="526.9" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="526.9" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">7</text>
  <line x1="573.1" y1="568.0" x2="573.1" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="573.1" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">6</text>
  <line x1="619.2" y1="568.0" x2="619.2" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="619.2" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
  <line x1="665.4" y1="568.0" x2="665.4" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="665.4" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">4</text>
  <line x1="711.5" y1="568.0" x2="711.5" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="711.5" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <line x1="757.7" y1="568.0" x2="757.7" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="757.7" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">2</text>
  <line x1="803.8" y1="568.0" x2="803.8" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="803.8" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <line x1="850.0" y1="568.0" x2="850.0" y2="574.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="850.0" y="588.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">0</text>
  <text x="550.0" y="606.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">chemical shift, delta (ppm)</text>
  <text x="250.0" y="612.0" font-size="11" fill="#d7322f" text-anchor="start" font-weight="700">&lt;- low electron density (deshielded)</text>
  <text x="850.0" y="612.0" font-size="11" fill="#1f6fb5" text-anchor="end" font-weight="700">high electron density (shielded) -&gt;</text>
  <text x="450.0" y="651" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
