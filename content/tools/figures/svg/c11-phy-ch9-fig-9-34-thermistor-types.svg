<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <!-- Fig 9.34 (C11-PHY, PDF p222): Types of thermistors. Flat drawing after the printed photograph, same left-to-right order: a black disc on two long silver leads, a long thin black rod on a tan lead, a short black rod on tan leads, a dark brown oval bead, a small black bead with bent leads, a black body with a ring (washer) lug on top, a small grey block; then, after a gap, a large black disc and a large green disc, each on two leads. No photograph is reproduced. -->
  <rect width="1200" height="560" fill="#ffffff"/>
  <g stroke-linecap="round">
    <!-- 1: black disc on two long silver leads -->
    <line x1="72" y1="190" x2="68" y2="520" stroke="#9aa0a6" stroke-width="7"/>
    <line x1="108" y1="190" x2="112" y2="520" stroke="#9aa0a6" stroke-width="7"/>
    <ellipse cx="90" cy="150" rx="58" ry="55" fill="#1d1d1f"/>
    <ellipse cx="74" cy="132" rx="16" ry="11" fill="#3a3a3d"/>

    <!-- 2: long thin black rod on a tan lead -->
    <rect x="186" y="60" width="26" height="250" rx="10" fill="#1d1d1f"/>
    <line x1="199" y1="310" x2="199" y2="540" stroke="#c9a46a" stroke-width="12"/>
    <line x1="199" y1="310" x2="199" y2="540" stroke="#e2c58f" stroke-width="4"/>

    <!-- 3: short black rod on two tan leads -->
    <rect x="252" y="140" width="34" height="140" rx="14" fill="#1d1d1f"/>
    <line x1="262" y1="280" x2="262" y2="530" stroke="#c9a46a" stroke-width="7"/>
    <line x1="277" y1="280" x2="277" y2="530" stroke="#c9a46a" stroke-width="7"/>

    <!-- 4: dark brown oval bead on thin silver leads -->
    <line x1="352" y1="230" x2="350" y2="520" stroke="#a7adb3" stroke-width="5"/>
    <line x1="372" y1="230" x2="374" y2="520" stroke="#a7adb3" stroke-width="5"/>
    <ellipse cx="362" cy="190" rx="34" ry="52" fill="#3b2a24"/>
    <ellipse cx="352" cy="172" rx="9" ry="14" fill="#5a453c"/>

    <!-- 5: small black bead with leads that bend out and back -->
    <path d="M440 220 C 420 260 420 290 440 320 L 440 520" fill="none" stroke="#a7adb3" stroke-width="5"/>
    <path d="M466 220 C 486 260 486 290 466 320 L 466 520" fill="none" stroke="#a7adb3" stroke-width="5"/>
    <ellipse cx="453" cy="196" rx="28" ry="36" fill="#1d1d1f"/>

    <!-- 6: black body with a ring (washer) lug on top -->
    <circle cx="545" cy="100" r="30" fill="none" stroke="#9aa0a6" stroke-width="14"/>
    <rect x="537" y="126" width="16" height="40" fill="#9aa0a6"/>
    <rect x="522" y="160" width="46" height="80" rx="6" fill="#1d1d1f"/>
    <line x1="545" y1="240" x2="545" y2="520" stroke="#a7adb3" stroke-width="6"/>

    <!-- 7: small grey block -->
    <rect x="606" y="182" width="74" height="70" rx="6" fill="#77797d"/>
    <rect x="606" y="182" width="18" height="70" fill="#4c4e52"/>
    <rect x="662" y="182" width="18" height="70" fill="#4c4e52"/>

    <!-- 8: large black disc on two leads -->
    <line x1="850" y1="310" x2="838" y2="520" stroke="#a7adb3" stroke-width="6"/>
    <line x1="882" y1="310" x2="896" y2="520" stroke="#a7adb3" stroke-width="6"/>
    <path d="M866 120 C 930 120 960 170 958 225 C 955 290 905 330 866 330 C 822 330 776 290 774 225 C 772 170 805 120 866 120 Z" fill="#1d1d1f"/>
    <ellipse cx="830" cy="185" rx="20" ry="30" fill="#36363a"/>

    <!-- 9: large green disc on two leads -->
    <line x1="1020" y1="320" x2="1008" y2="520" stroke="#a7adb3" stroke-width="6"/>
    <line x1="1056" y1="320" x2="1070" y2="520" stroke="#a7adb3" stroke-width="6"/>
    <path d="M1040 120 C 1105 120 1138 168 1136 228 C 1133 292 1085 340 1040 340 C 995 340 948 292 946 228 C 944 168 975 120 1040 120 Z" fill="#4caf3c"/>
    <ellipse cx="1080" cy="180" rx="28" ry="38" fill="#7fcc6c"/>
  </g>
</svg>
