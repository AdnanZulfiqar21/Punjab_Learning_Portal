<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original redraw after Figure 10.1: a straight wire carrying current I through a card, with circular magnetic field lines round it. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A current produces a circular magnetic field</text>
  <ellipse cx="450.0" cy="295.0" rx="300.0" ry="70.0" stroke="#4b5563" stroke-width="2" fill="#f1f5f9"/>
  <text x="758.0" y="301.0" font-size="15" fill="#4b5563" text-anchor="start" font-weight="700">card</text>
  <ellipse cx="450.0" cy="295.0" rx="70.0" ry="16.1" stroke="#1f6fb5" stroke-width="2.2" fill="none"/>
  <path d="M520.0 295.0 L515.4 285.0 L524.6 285.0 Z" fill="#1f6fb5"/>
  <ellipse cx="450.0" cy="295.0" rx="130.0" ry="29.9" stroke="#1f6fb5" stroke-width="2.2" fill="none"/>
  <path d="M580.0 295.0 L575.4 285.0 L584.6 285.0 Z" fill="#1f6fb5"/>
  <ellipse cx="450.0" cy="295.0" rx="190.0" ry="43.7" stroke="#1f6fb5" stroke-width="2.2" fill="none"/>
  <path d="M640.0 295.0 L635.4 285.0 L644.6 285.0 Z" fill="#1f6fb5"/>
  <line x1="450.0" y1="70.0" x2="450.0" y2="440.0" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
  <line x1="450.0" y1="210.0" x2="450.0" y2="120.4" stroke="#d7322f" stroke-width="4" stroke-linecap="round"/>
  <path d="M450.0 110.0 L455.5 121.8 L444.5 121.8 Z" fill="#d7322f"/>
  <text x="464.0" y="130.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700">current I</text>
  <text x="40.0" y="140.0" font-size="16" fill="#1f6fb5" text-anchor="start" font-weight="700">magnetic field lines:</text>
  <text x="40.0" y="160.0" font-size="16" fill="#1f6fb5" text-anchor="start" font-weight="700">circles round the wire</text>
  <rect x="560.0" y="380.0" width="320.0" height="70.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="720.0" y="408.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="400">right-hand grip rule: thumb along I,</text>
  <text x="720.0" y="430.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="400">fingers curl the way B goes round</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
