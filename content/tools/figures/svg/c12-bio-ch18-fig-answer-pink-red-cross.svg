<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="615" fill="#ffffff"/>
  <!-- Answer figure (original): pink RW x red RR four-o'clock cross, Punnett square. -->
  <text x="225" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Pink flower (RW)</text>
  <text x="450" y="54" font-size="34" text-anchor="middle" font-weight="700" fill="#14181f">&#215;</text>
  <text x="675" y="52" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Red flower (RR)</text>
  <text x="560" y="118" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563">Gametes of red parent</text>
  <text x="232" y="335" font-size="22" text-anchor="middle" font-weight="400" fill="#4b5563" transform="rotate(-90 232 335)">Gametes of pink parent</text>
  <circle cx="445.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">R</text>
  <circle cx="675.0" cy="168" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="177" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">R</text>
  <circle cx="290" cy="275.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="284.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">R</text>
  <circle cx="290" cy="395.0" r="30" fill="#f1f3f6" stroke="#14181f" stroke-width="2"/>
  <text x="290" y="404.0" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">W</text>
  <rect x="330" y="215" width="230" height="120" fill="#f6c1c1" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">RR</text>
  <text x="445.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Red</text>
  <rect x="560" y="215" width="230" height="120" fill="#f6c1c1" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="267" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">RR</text>
  <text x="675.0" y="305" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Red</text>
  <rect x="330" y="335" width="230" height="120" fill="#fde0ef" stroke="#14181f" stroke-width="2"/>
  <text x="445.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">RW</text>
  <text x="445.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Pink</text>
  <rect x="560" y="335" width="230" height="120" fill="#fde0ef" stroke="#14181f" stroke-width="2"/>
  <text x="675.0" y="387" font-size="30" text-anchor="middle" font-weight="700" fill="#14181f">RW</text>
  <text x="675.0" y="425" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">Pink</text>
  <text x="450.0" y="515" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">(a) Red (RR) = 2/4 = 1/2      (b) Pink (RW) = 2/4 = 1/2</text>
  <text x="450.0" y="555" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">(c) Pink : Red = 1 : 1</text>
