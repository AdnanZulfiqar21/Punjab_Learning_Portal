  <path d="M241.0 125.0 Q256.0 147.4 280.0 135.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M280.0 135.0 L273.9 142.9 L270.0 135.4 Z" fill="#d7322f"/>
  <line x1="320.0" y1="175.0" x2="351.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M360.0 175.0 L350.0 179.6 L350.0 170.4 Z" fill="#14181f"/>
  <text x="450.0" y="181.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">C-CH</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-14.1" font-size="13.3">+</tspan></text>
  <text x="450.0" y="225.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <circle cx="432.0" cy="207.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="440.0" cy="207.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M436.0 201.0 Q477.3 208.5 484.0 167.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M484.0 167.0 L486.7 176.6 L478.4 175.3 Z" fill="#d7322f"/>
  <text x="450.0" y="255.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">carbocation and bromide ion</text>
  <line x1="540.0" y1="175.0" x2="571.2" y2="175.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M580.0 175.0 L570.0 179.6 L570.0 170.4 Z" fill="#14181f"/>
