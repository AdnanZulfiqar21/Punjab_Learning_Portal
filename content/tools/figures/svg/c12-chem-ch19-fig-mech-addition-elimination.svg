<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="575" fill="#ffffff"/>
  <!-- Original mechanisms after the book: the C=C pi electrons of ethene attack H of HBr, giving a carbocation that bromide attacks to form bromoethane; hydroxide removes H from one carbon of bromoethane as the C=C forms and Br- leaves, giving ethene. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Electrophilic addition and elimination</text>
  <rect x="15.0" y="55.0" width="870.0" height="225.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">electrophilic addition: HBr adds to ethene</text>
  <text x="60.0" y="181.7" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">C</tspan></text>
  <line x1="82.0" y1="171.5" x2="122.0" y2="171.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="82.0" y1="178.5" x2="122.0" y2="178.5" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="145.0" y="181.7" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.1" font-size="13.3">2</tspan></text>
  <text x="210.0" y="126.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="220.0" y1="120.0" x2="262.0" y2="120.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="282.0" y="126.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="214.0" y="101.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="284.0" y="97.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <path d="M102.0 167.0 Q141.6 118.3 204.0 125.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
