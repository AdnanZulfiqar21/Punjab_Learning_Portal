  <text x="710.0" y="215.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bromoethane</text>
  <rect x="15.0" y="295.0" width="870.0" height="230.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="325.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">elimination: OH- removes HBr from bromoethane</text>
  <text x="60.0" y="386.6" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <circle cx="62.0" cy="362.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="70.0" cy="362.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="170.0" y="426.6" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <text x="250.0" y="426.6" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="180.0" y1="420.0" x2="240.0" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="374.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="170.0" y1="410.0" x2="170.0" y2="378.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="250.0" y="480.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <line x1="250.0" y1="431.0" x2="250.0" y2="463.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="164.5" y1="428.3" x2="155.5" y2="441.7" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="142.0" y="466.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="175.5" y1="428.3" x2="184.5" y2="441.7" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="198.0" y="466.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="244.9" y1="411.4" x2="235.1" y2="394.6" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="222.0" y="380.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="255.1" y1="411.4" x2="264.9" y2="394.6" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="278.0" y="380.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <path d="M80.0 370.0 Q118.2 343.1 160.0 364.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M160.0 364.0 L150.0 363.7 L153.8 356.2 Z" fill="#d7322f"/>
  <path d="M174.0 392.0 Q180.1 419.8 208.0 414.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M208.0 414.0 L200.0 420.0 L198.3 411.7 Z" fill="#d7322f"/>
  <path d="M254.0 446.0 Q273.0 451.5 262.0 468.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M262.0 468.0 L263.5 458.1 L270.6 462.8 Z" fill="#d7322f"/>
  <line x1="330.0" y1="420.0" x2="361.2" y2="420.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M370.0 420.0 L360.0 424.6 L360.0 415.4 Z" fill="#14181f"/>
  <text x="560.0" y="426.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">=CH</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4"> + H</tspan><tspan dy="6.4" font-size="14.0">2</tspan><tspan dy="-6.4">O + Br</tspan><tspan dy="-8.4" font-size="14.0">-</tspan></text>
  <text x="560.0" y="462.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ethene, water and bromide ion</text>
  <text x="450.0" y="548.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">addition joins two molecules into one; elimination removes atoms from neighbouring carbons to make a double bond</text>
  <text x="450.0" y="566" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
