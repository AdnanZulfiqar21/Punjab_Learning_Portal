<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.16: a new eukaryotic mRNA of three exons and two introns gains a 5' cap and a 3' poly-A tail, then splicing removes the introns and joins the exons into mature mRNA. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Processing of eukaryotic mRNA in the nucleus</text>
  <text x="40.0" y="130.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">new (immature) mRNA</text>
  <rect x="210.0" y="110.0" width="90.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="255.0" y="132.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E1</text>
  <rect x="300.0" y="110.0" width="80.0" height="34.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#f1f5f9"/>
  <text x="340.0" y="132.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">intron</text>
  <rect x="380.0" y="110.0" width="110.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="435.0" y="132.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E2</text>
  <rect x="490.0" y="110.0" width="90.0" height="34.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#f1f5f9"/>
  <text x="535.0" y="132.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">intron</text>
  <rect x="580.0" y="110.0" width="100.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="630.0" y="132.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E3</text>
  <line x1="450.0" y1="156.0" x2="450.0" y2="188.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 196.0 L446.2 187.8 L453.8 187.8 Z" fill="#14181f"/>
  <text x="460.0" y="182.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">cap and tail added</text>
  <circle cx="190.0" cy="228.0" r="16.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="190.0" y="233.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">cap</text>
  <rect x="210.0" y="211.0" width="90.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="255.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E1</text>
  <rect x="300.0" y="211.0" width="80.0" height="34.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#f1f5f9"/>
  <text x="340.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">intron</text>
  <rect x="380.0" y="211.0" width="110.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="435.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E2</text>
  <rect x="490.0" y="211.0" width="90.0" height="34.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#f1f5f9"/>
  <text x="535.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">intron</text>
  <rect x="580.0" y="211.0" width="100.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="630.0" y="233.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E3</text>
  <rect x="684.0" y="214.0" width="120.0" height="28.0" rx="14" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="744.0" y="233.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">AAAA...A</text>
  <line x1="450.0" y1="256.0" x2="450.0" y2="292.8" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M450.0 300.0 L446.2 291.8 L453.8 291.8 Z" fill="#14181f"/>
  <text x="460.0" y="286.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">splicing: introns cut out, exons joined</text>
  <circle cx="240.0" cy="338.0" r="16.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <text x="240.0" y="343.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">cap</text>
  <rect x="260.0" y="321.0" width="90.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="305.0" y="343.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E1</text>
  <rect x="350.0" y="321.0" width="110.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="405.0" y="343.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E2</text>
  <rect x="460.0" y="321.0" width="100.0" height="34.0" rx="4" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="510.0" y="343.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">E3</text>
  <rect x="564.0" y="324.0" width="120.0" height="28.0" rx="14" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="624.0" y="343.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">AAAA...A</text>
  <text x="40.0" y="343.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">mature mRNA</text>
  <rect x="40.0" y="390.0" width="820.0" height="90.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="418.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">5' cap: a methylated G nucleotide joined 5' to 5'; protects mRNA from nucleases and phosphatases.</text>
  <text x="60.0" y="440.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">3' poly-A tail: about 250 A nucleotides; protects mRNA from breakdown.</text>
  <text x="60.0" y="462.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">Exons are translated; introns are removed. The mature mRNA then leaves the nucleus.</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
