<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.11 and 1.12 and topics 1.1.1.1 (sequence, activity), 1.7 and 1.8: a sequence diagram, an activity diagram, the levels of testing and the development tools. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Sequence and activity diagrams, the levels of testing and development tools</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Sequence diagram (Fig. 1.11)</text>
  <text class="l" x="100" y="110" style="text-anchor:middle">User</text>
  <path d="M100 116 V372" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <text class="l" x="240" y="110" style="text-anchor:middle">Toys Box</text>
  <path d="M240 116 V372" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <text class="l" x="380" y="110" style="text-anchor:middle">Books Box</text>
  <path d="M380 116 V372" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <text class="l" x="510" y="110" style="text-anchor:middle">Clothes Box</text>
  <path d="M510 116 V372" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <path d="M100 134 L236 134" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="130">open()</text>
  <path d="M100 160 L376 160" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="156">open()</text>
  <path d="M100 186 L506 186" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="182">open()</text>
  <path d="M100 212 L236 212" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="208">put toys inside</text>
  <path d="M100 238 L376 238" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="234">put books inside</text>
  <path d="M100 264 L506 264" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="260">put clothes inside</text>
  <path d="M100 290 L236 290" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="286">close()</text>
  <path d="M100 316 L376 316" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="312">close()</text>
  <path d="M100 342 L506 342" stroke="#1f6fb5" stroke-width="1.4" marker-end="url(#bl)"/>
  <text class="r" x="110" y="338">close()</text>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">Activity diagram (Fig. 1.12)</text>
  <ellipse cx="760" cy="100" rx="40" ry="14" fill="#fde8e7" stroke="#d7322f"/>
  <text class="r" x="760" y="104" style="text-anchor:middle">Start</text>
  <rect x="700" y="130" width="120" height="26" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="718" y="147">Order placement</text>
  <rect x="700" y="176" width="120" height="26" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="715" y="193">Food preparation</text>
  <path d="M760 220 L810 250 L760 280 L710 250 Z" fill="#e6f4ef" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="760" y="254" style="text-anchor:middle">ready?</text>
  <rect x="880" y="237" width="120" height="26" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="901" y="254">Order delivery</text>
  <rect x="630" y="300" width="120" height="26" rx="6" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="648" y="317">Re-prepare food</text>
  <ellipse cx="940" cy="340" rx="34" ry="14" fill="#fde8e7" stroke="#d7322f"/>
  <text class="r" x="940" y="344" style="text-anchor:middle">End</text>
  <path d="M760 114 L760 128" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M760 156 L760 174" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M760 202 L760 218" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M810 250 L876 250" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M940 263 L940 324" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M710 250 H690 V298" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M630 313 H616 V189 H696" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text class="r" x="840" y="244">yes</text>
  <text class="r" x="668" y="274">no</text>
  <g class="r">
    <text x="1010" y="110">start and end:</text>
    <text x="1010" y="125">rounded nodes</text>
    <text x="1010" y="140">steps: boxes</text>
    <text x="1010" y="155">decision:</text>
    <text x="1010" y="170">diamond</text>
    <text x="1010" y="185">arrows: order</text>
    <text x="1010" y="200">of the flow</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="433">Levels of testing (1.7)</text>
  <rect x="220.0" y="440" width="200" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="279" y="461">Unit testing</text>
  <rect x="190.0" y="484" width="260" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="254" y="505">Integration testing</text>
  <rect x="160.0" y="528" width="320" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="272" y="549">System testing</text>
  <rect x="130.0" y="572" width="380" height="34" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="258" y="593">Acceptance testing</text>
  <g class="r">
    <text x="70" y="628">small components first, then the whole system, then user acceptance</text>
    <text x="70" y="643">debugging: find and fix bugs with debuggers, print statements, code reviews</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Software development tools (1.8)</text>
  <text class="l" x="630" y="452">language editors</text>
  <text class="r" x="760" y="452">Notepad++, Sublime Text, VS Code</text>
  <text class="l" x="630" y="482">translators</text>
  <text class="r" x="760" y="482">interpreters (line by line), compilers</text>
  <text class="l" x="630" y="512">compilers</text>
  <text class="r" x="760" y="512">GCC (C/C++), javac (Java)</text>
  <text class="l" x="630" y="542">debuggers</text>
  <text class="r" x="760" y="542">GDB, Visual Studio Debugger</text>
  <text class="l" x="630" y="572">IDEs</text>
  <text class="r" x="760" y="572">Eclipse, Visual Studio, PyCharm</text>
  <text class="l" x="630" y="602">platforms</text>
  <text class="r" x="760" y="602">online: Repl.it, Gitpod; offline: local IDE</text>
  <text class="l" x="630" y="632">repositories</text>
  <text class="r" x="760" y="632">GitHub, Bitbucket: version control, history</text>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
