  <text class="r" x="72" y="530.0" transform="rotate(-90 72 530.0)" style="text-anchor:middle">marks</text>
  <circle cx="148.0" cy="560.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="186.0" cy="545.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="224.0" cy="515.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="262.0" cy="500.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="300.0" cy="485.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="338.0" cy="470.0" r="5" fill="#d7322f" stroke="#ffffff" stroke-width="1"/>
  <path d="M110.0 577.0 L376.0 448.1" stroke="#7a2f86" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
  <text class="r" x="70" y="682" style="fill:#7a2f86">best-fit line: marks = 14.3 + 6.14 x hours</text>
  <rect x="420" y="375" width="360" height="320" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Boxplot: spread and median</text>
  <path d="M598 470 H605 M625 470 H636 M598 460 V480 M636 460 V480" stroke="#1f6fb5" stroke-width="1.8"/>
  <rect x="605" y="452" width="20" height="36" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
  <path d="M617 452 V488" stroke="#14181f" stroke-width="2.5"/>
  <text class="l" x="482" y="475" style="fill:#1f6fb5;text-anchor:end">Class A</text>
  <path d="M520 560 H578 M695 560 H754 M520 550 V570 M754 550 V570" stroke="#d7322f" stroke-width="1.8"/>
  <rect x="578" y="542" width="117" height="36" fill="#ffffff" stroke="#d7322f" stroke-width="1.8"/>
  <path d="M617 542 V578" stroke="#14181f" stroke-width="2.5"/>
  <text class="l" x="482" y="565" style="fill:#d7322f;text-anchor:end">Class B</text>
  <text class="r" x="519.5" y="600" style="text-anchor:middle">30</text>
  <text class="r" x="597.5" y="600" style="text-anchor:middle">50</text>
  <text class="r" x="675.5" y="600" style="text-anchor:middle">70</text>
  <text class="r" x="753.5" y="600" style="text-anchor:middle">90</text>
  <g class="r">
    <text x="440" y="632">box = middle half (hinges), line = median 55;</text>
    <text x="440" y="648">whiskers reach the lowest and highest</text>
  </g>
  <rect x="790" y="375" width="360" height="320" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="970" y="403">Excel or Google Sheets (5.6)</text>
  <g class="r">
    <text x="810" y="436">1 enter data in columns</text>
    <text x="810" y="454">  (months and sales)</text>
    <text x="810" y="472">2 select the cells</text>
    <text x="810" y="490">3 Insert, then pick a chart</text>
    <text x="810" y="508">4 add a title and axis labels</text>
    <text x="810" y="526">5 read what it shows:</text>
    <text x="810" y="544">  bars compare categories,</text>
    <text x="810" y="562">  lines show trends,</text>
    <text x="810" y="580">  histograms show spread,</text>
    <text x="810" y="598">  scatterplots show links,</text>
    <text x="810" y="616">  boxplots compare groups</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
