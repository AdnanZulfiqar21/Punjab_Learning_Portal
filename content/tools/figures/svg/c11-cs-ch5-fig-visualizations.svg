  <text class="r" x="72" y="205.0" transform="rotate(-90 72 205.0)" style="text-anchor:middle">score</text>
  <rect x="122" y="205.0" width="20" height="85.0" fill="#1f6fb5"/>
  <rect x="142" y="239.0" width="20" height="51.0" fill="#d98b2b"/>
