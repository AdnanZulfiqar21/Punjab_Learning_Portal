  <circle cx="560.0" cy="211.9" r="5" fill="#0f7a62" stroke="#ffffff" stroke-width="1"/>
  <circle cx="615.0" cy="189.6" r="5" fill="#0f7a62" stroke="#ffffff" stroke-width="1"/>
  <circle cx="670.0" cy="167.3" r="5" fill="#0f7a62" stroke="#ffffff" stroke-width="1"/>
  <circle cx="725.0" cy="145.0" r="5" fill="#0f7a62" stroke="#ffffff" stroke-width="1"/>
  <rect x="790" y="55" width="360" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
