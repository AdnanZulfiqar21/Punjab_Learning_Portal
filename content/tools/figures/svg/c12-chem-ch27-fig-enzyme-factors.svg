  <line x1="176.0" y1="320.0" x2="176.0" y2="115.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="176.0" y="108.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">optimum about 37 C</text>
