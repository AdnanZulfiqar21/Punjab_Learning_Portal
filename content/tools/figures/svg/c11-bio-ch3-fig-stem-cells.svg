<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.39: stem cells by potency and by source. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .t{font-size:23px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="300" y="50">By potency: how many cell types?</text>
  <!-- potency ladder -->
  <g>
    <rect x="60" y="90" width="500" height="60" rx="10" fill="#5b3fb5"/><text class="t" x="80" y="128" style="fill:#fff">Totipotent</text><text class="s" x="250" y="128" style="fill:#fff">all cell types · zygote, first divisions</text>
    <rect x="60" y="170" width="500" height="60" rx="10" fill="#7a5ed1"/><text class="t" x="80" y="208" style="fill:#fff">Pluripotent</text><text class="s" x="250" y="208" style="fill:#fff">almost any cell · early embryo</text>
    <rect x="60" y="250" width="500" height="60" rx="10" fill="#9b84e0"/><text class="t" x="80" y="288" style="fill:#fff">Multipotent</text><text class="s" x="250" y="288" style="fill:#fff">a related family · blood stem cells</text>
    <rect x="60" y="330" width="500" height="60" rx="10" fill="#b8a7ea"/><text class="t" x="80" y="368">Oligopotent</text><text class="s" x="250" y="368">a few types · lymphoid, myeloid</text>
    <rect x="60" y="410" width="500" height="60" rx="10" fill="#d4caf3"/><text class="t" x="80" y="448">Unipotent</text><text class="s" x="250" y="448">one type · muscle stem cells</text>
  </g>
  <path d="M30 100 L30 470" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="10" y="500">narrower</text>
  <!-- sources -->
  <text class="h" x="880" y="50">By source</text>
  <!-- blastocyst -->
  <circle cx="700" cy="200" r="70" fill="#fff4e2" stroke="#d98b2b" stroke-width="6"/>
  <path d="M650 180 q30 30 70 10 q20 -10 20 -30" fill="#d98b2b"/>
  <text class="t" x="790" y="180">Embryonic (ESCs)</text><text class="s" x="790" y="205">inner cell mass of a blastocyst;</text><text class="s" x="790" y="228">pluripotent; ethical concerns,</text><text class="s" x="790" y="251">teratoma and rejection risk</text>
  <!-- adult tissue: bone -->
  <rect x="640" y="340" width="120" height="50" rx="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="5"/>
  <circle cx="700" cy="365" r="12" fill="#d98b2b"/>
  <text class="t" x="790" y="350">Adult (ASCs)</text><text class="s" x="790" y="375">bone marrow, fat, blood; multipotent;</text><text class="s" x="790" y="398">fewer ethical issues, low rejection</text><text class="s" x="790" y="421">if the patient's own; hard to culture</text>
  <!-- iPSC: skin cell reprogrammed -->
  <ellipse cx="660" cy="530" rx="36" ry="24" fill="#e1f3ec" stroke="#0f7a62" stroke-width="4"/>
  <path d="M700 530 L760 530" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="640" y="488">transcription factors</text>
  <circle cx="790" cy="530" r="26" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="4"/>
  <text class="t" x="840" y="520">Induced pluripotent (iPSCs)</text><text class="s" x="840" y="545">adult somatic cells reprogrammed</text><text class="s" x="840" y="568">in the lab; pluripotent</text>
  <text class="s" x="620" y="630">Advantages of iPSCs: no embryos destroyed; the patient's own cells,</text>
  <text class="s" x="620" y="654">so little rejection; can regenerate damaged tissues and organs.</text>
  <text class="s" x="620" y="690">Disadvantages: reprogramming may alter genes;</text>
  <text class="s" x="620" y="714">can form teratomas; hard to direct into fully working cell types.</text>
  <text class="s" x="40" y="560">Uses: regenerative medicine (spinal injury, type 1 diabetes,</text><text class="s" x="40" y="584">Parkinson's, heart disease), drug testing on disease models,</text><text class="s" x="40" y="608">personalised medicine from the patient's own cells.</text>
  <text class="s" x="40" y="760">A stem cell divides into cells that either stay stem cells or specialise, for example into muscle, blood or nerve cells.</text>
</svg>
