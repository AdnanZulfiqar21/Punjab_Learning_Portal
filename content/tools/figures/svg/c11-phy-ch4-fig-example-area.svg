  <text x="590.0" y="342.5" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">= 5 J</text>
  <rect x="560.0" y="90.0" width="300.0" height="60.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="710.0" y="127.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">total work = 20 J + 5 J = 25 J</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
