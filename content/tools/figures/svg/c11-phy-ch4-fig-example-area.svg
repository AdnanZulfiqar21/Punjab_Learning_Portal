  <line x1="720.0" y1="370.0" x2="720.0" y2="376.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="720.0" y="396.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="400">6</text>
  <line x1="114.0" y1="370.0" x2="120.0" y2="370.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="108.0" y="376.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="400">0</text>
  <line x1="114.0" y1="320.0" x2="120.0" y2="320.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="108.0" y="326.0" font-size="17" fill="#14181f" text-anchor="end" font-weight="400">1</text>
