<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 1.10 (C11-BIO, PDF p15): flat drawing after the printed plate: left, Hydra (a yellow-green polyp with long tentacles and a side bud, on black); middle, Obelia (a branched green colony with cup-shaped polyps, on white); right column, Sea anemone (pink tentacled disc, top) and Jellyfish (a pale pink bell with trailing arms on dark blue, bottom). No photograph is reproduced. -->
  <rect width="1000" height="640" fill="#ffffff"/>
  <!-- Hydra -->
  <rect x="10" y="10" width="350" height="570" fill="#0c0c0c"/>
  <g fill="none" stroke="#b8d84a" stroke-width="7" stroke-linecap="round">
    <path d="M150 150 L60 70"/><path d="M165 140 L215 40"/><path d="M175 160 L240 150"/><path d="M160 175 L120 165"/>
  </g>
