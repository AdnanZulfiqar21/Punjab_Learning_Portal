<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="260" fill="#ffffff"/>
  <!-- Nitration of benzene as printed on p66: benzene + HNO3 gives nitrobenzene + H2O, with H2SO4 over the arrow. -->
  <path d="M100.0 98.0 L145.0 124.0 L145.0 176.0 L100.0 202.0 L55.0 176.0 L55.0 124.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100.0" cy="150.0" r="30.2" stroke="#14181f" stroke-width="3" fill="none"/>
  <text x="170.0" y="161.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">+ HNO</tspan><tspan dy="9.0" font-size="21.6">3</tspan><tspan dy="-9.0"></tspan></text>
  <line x1="320.0" y1="150.0" x2="547.2" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M560.0 150.0 L545.5 156.8 L545.5 143.2 Z" fill="#14181f"/>
  <text x="440.0" y="136.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">H</tspan><tspan dy="8.4" font-size="20.2">2</tspan><tspan dy="-8.4">SO</tspan><tspan dy="8.4" font-size="20.2">4</tspan><tspan dy="-8.4"></tspan></text>
  <path d="M660.0 98.0 L705.0 124.0 L705.0 176.0 L660.0 202.0 L615.0 176.0 L615.0 124.0 Z" stroke="#14181f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="660.0" cy="150.0" r="30.2" stroke="#14181f" stroke-width="3" fill="none"/>
  <line x1="660.0" y1="98.0" x2="660.0" y2="62.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="660.0" y="53.2" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"></tspan></text>
  <text x="730.0" y="161.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">+ H</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0">O</tspan></text>
