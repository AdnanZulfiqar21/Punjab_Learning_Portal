<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 14.14: a swing whose successive swings get smaller because air resistance and friction take energy away, an example of damped oscillation. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Damped oscillation of a swing (after Fig 14.14)</text>
  <line x1="60.0" y1="110.0" x2="440.0" y2="110.0" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="60.0" y1="110.0" x2="20.0" y2="430.0" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <line x1="60.0" y1="110.0" x2="90.0" y2="430.0" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <line x1="440.0" y1="110.0" x2="480.0" y2="430.0" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <line x1="440.0" y1="110.0" x2="410.0" y2="430.0" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <line x1="0.0" y1="430.0" x2="500.0" y2="430.0" stroke="#7fb069" stroke-width="4" stroke-linecap="round"/>
  <line x1="250.0" y1="110.0" x2="149.2" y2="316.7" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <rect x="119.2" y="312.7" width="60.0" height="12.0" rx="3" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <line x1="250.0" y1="110.0" x2="321.1" y2="328.7" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <rect x="291.1" y="324.7" width="60.0" height="12.0" rx="3" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <line x1="250.0" y1="110.0" x2="210.1" y2="336.5" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <rect x="180.1" y="332.5" width="60.0" height="12.0" rx="3" stroke="#4b5563" stroke-width="2" fill="#ffffff"/>
  <line x1="250.0" y1="110.0" x2="250.0" y2="340.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <rect x="220.0" y="336.0" width="60.0" height="12.0" rx="3" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <path d="M140.4 334.7 L147.3 337.9 L154.2 340.9 L161.2 343.7 L168.3 346.3 L175.5 348.6 L182.8 350.8 L190.1 352.7 L197.5 354.4 L204.9 355.9 L212.3 357.1 L219.8 358.2 L227.3 359.0 L234.9 359.5 L242.4 359.9 L250.0 360.0 L257.6 359.9 L265.1 359.5 L272.7 359.0 L280.2 358.2 L287.7 357.1 L295.1 355.9 L302.5 354.4 L309.9 352.7 L317.2 350.8 L324.5 348.6 L331.7 346.3 L338.8 343.7 L345.8 340.9 L352.7 337.9 L359.6 334.7" stroke="#d98b2b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M167.8 363.0 L173.1 364.6 L178.5 366.2 L183.8 367.6 L189.3 369.0 L194.7 370.2 L200.2 371.3 L205.6 372.3 L211.1 373.1 L216.7 373.9 L222.2 374.5 L227.7 375.1 L233.3 375.5 L238.9 375.8 L244.4 375.9 L250.0 376.0 L255.6 375.9 L261.1 375.8 L266.7 375.5 L272.3 375.1 L277.8 374.5 L283.3 373.9 L288.9 373.1 L294.4 372.3 L299.8 371.3 L305.3 370.2 L310.7 369.0 L316.2 367.6 L321.5 366.2 L326.9 364.6 L332.2 363.0" stroke="#d98b2b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M201.0 387.7 L204.3 388.3 L207.5 388.8 L210.8 389.3 L214.0 389.7 L217.3 390.1 L220.5 390.5 L223.8 390.8 L227.1 391.1 L230.3 391.3 L233.6 391.5 L236.9 391.7 L240.2 391.8 L243.4 391.9 L246.7 392.0 L250.0 392.0 L253.3 392.0 L256.6 391.9 L259.8 391.8 L263.1 391.7 L266.4 391.5 L269.7 391.3 L272.9 391.1 L276.2 390.8 L279.5 390.5 L282.7 390.1 L286.0 389.7 L289.2 389.3 L292.5 388.8 L295.7 388.3 L299.0 387.7" stroke="#d98b2b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="470.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">each swing is smaller than the last</text>
  <rect x="520.0" y="70.0" width="365.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="702.5" y="100.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">why it dies away</text>
  <text x="538.0" y="120.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Air resistance and friction at the</text>
  <text x="538.0" y="142.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">hooks do work against the motion.</text>
  <text x="538.0" y="164.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="538.0" y="186.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Energy is taken away on every swing,</text>
  <text x="538.0" y="208.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">so the amplitude decreases and the</text>
  <text x="538.0" y="230.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">swing finally comes to rest.</text>
  <text x="538.0" y="252.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="538.0" y="274.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Light damping: amplitude falls slowly</text>
  <text x="538.0" y="296.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">(a playground swing).</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
