<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after the book's examples: homolysis of Cl-Cl into two chlorine free radicals (half-headed arrows) and heterolysis of (CH3)3C-Cl into a carbocation and a chloride ion (curly arrow). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two ways a covalent bond can break</text>
  <rect x="15.0" y="60.0" width="425.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">homolytic fission (homolysis)</text>
  <text x="95.0" y="187.7" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="205.0" y="187.7" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="115.0" y1="180.0" x2="185.0" y2="180.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M146.0 174.0 Q130.0 128.0 100.0 160.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="100.0" y1="160.0" x2="102.5" y2="149.3" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M154.0 174.0 Q170.0 128.0 200.0 160.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="200.0" y1="160.0" x2="189.5" y2="156.8" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="230.0" y1="180.0" x2="271.2" y2="180.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M280.0 180.0 L270.0 184.6 L270.0 175.4 Z" fill="#14181f"/>
  <text x="315.0" y="187.7" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <circle cx="333.0" cy="168.0" r="3.5" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="385.0" y="187.7" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <circle cx="367.0" cy="168.0" r="3.5" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="227.0" y="262.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">non-polar bond: each atom takes one</text>
  <text x="227.0" y="281.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">electron, giving two free radicals</text>
  <text x="227.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">(half-headed arrows move one electron)</text>
  <rect x="460.0" y="60.0" width="425.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">heterolytic fission (heterolysis)</text>
  <text x="540.0" y="187.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C</tspan></text>
  <text x="635.0" y="187.7" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="590.0" y1="180.0" x2="618.0" y2="180.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="598.0" y="162.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="640.0" y="158.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <path d="M604.0 186.0 Q613.7 208.9 636.0 198.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M636.0 198.0 L629.7 205.8 L626.0 198.2 Z" fill="#d7322f"/>
  <line x1="668.0" y1="180.0" x2="699.2" y2="180.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M708.0 180.0 L698.0 184.6 L698.0 175.4 Z" fill="#14181f"/>
  <text x="765.0" y="186.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">)</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">C</tspan><tspan dy="-7.6" font-size="12.6">+</tspan></text>
  <text x="845.0" y="187.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan><tspan dy="-8.4" font-size="14.0">-</tspan></text>
  <text x="672.0" y="262.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">polar bond: the more electronegative</text>
  <text x="672.0" y="281.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">atom takes both electrons, giving a</text>
  <text x="672.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">carbocation and an anion</text>
  <text x="450.0" y="418.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a full curly arrow shows a pair of electrons moving</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
