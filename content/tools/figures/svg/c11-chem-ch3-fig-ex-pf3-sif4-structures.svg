<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif">
  <!-- Vis3-9 (C11-CHEM, PDF p72), Short Q2(i): structures of PF3 and SiF4 as printed, side by side. PF3: P at the top bonded to F lower left, F lower right and F below. SiF4: Si in the centre bonded to F above, F to the left, F to the right and F to the lower right. Original drawing after the textbook. -->
