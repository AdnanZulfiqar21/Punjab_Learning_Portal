  <text x="180" y="62" font-size="40" text-anchor="middle" fill="#14181f">P</text>
  <line x1="165" y1="72" x2="105" y2="112" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="72" x2="255" y2="112" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="78" x2="166" y2="150" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="135" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <text x="272" y="135" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <text x="162" y="185" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <text x="520" y="132" font-size="40" text-anchor="middle" fill="#14181f">Si</text>
  <line x1="520" y1="94" x2="520" y2="56" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="520" y="48" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <line x1="492" y1="120" x2="440" y2="120" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="420" y="132" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <line x1="548" y1="120" x2="600" y2="120" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="620" y="132" font-size="40" text-anchor="middle" fill="#14181f">F</text>
  <line x1="532" y1="140" x2="562" y2="174" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="576" y="204" font-size="40" text-anchor="middle" fill="#14181f">F</text>
</svg>
