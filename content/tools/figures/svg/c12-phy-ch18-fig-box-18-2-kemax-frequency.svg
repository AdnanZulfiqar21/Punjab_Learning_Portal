  <line x1="220.0" y1="330.0" x2="860.0" y2="330.0" stroke="#1aa3e0" stroke-width="5" stroke-linecap="round"/>
  <line x1="80.0" y1="200.0" x2="80.0" y2="82.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M80.0 70.0 L87.5 84.1 L72.5 84.1 Z" fill="#14181f"/>
  <text x="40.0" y="250.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">K.E.<tspan dy="8.4" font-size="20.4">max</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="198.0" y="342.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400">0</text>
  <line x1="400.0" y1="330.0" x2="800.0" y2="82.0" stroke="#e0177d" stroke-width="5" stroke-linecap="round"/>
  <line x1="220.0" y1="441.6" x2="400.0" y2="330.0" stroke="#e0177d" stroke-width="5" stroke-linecap="butt" stroke-dasharray="22 14"/>
  <text x="394.0" y="378.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400" font-style="italic">f<tspan dy="8.4" font-size="20.4">o</tspan><tspan dy="-8.4">&#8203;</tspan></text>
  <text x="560.0" y="378.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400" font-style="italic">f</text>
  <line x1="590.0" y1="368.0" x2="688.0" y2="368.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M700.0 368.0 L685.9 375.5 L685.9 360.5 Z" fill="#14181f"/>
