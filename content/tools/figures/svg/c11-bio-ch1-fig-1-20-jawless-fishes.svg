<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 1.20 (C11-BIO, PDF p23): flat drawing after the two printed pictures side by side on white: left, Sea lamprey (a long brown eel-like fish with a row of gill pores and two low dorsal fins running to the tail, head at the left); right, Hagfish (an orange-brown eel-like fish bent back on itself, head at the left with short barbels). No photograph is reproduced. -->
  <rect width="1200" height="270" fill="#ffffff"/>
  <!-- Sea lamprey -->
  <path d="M30 120 C40 95 90 90 160 95 C280 100 400 105 480 112 C520 115 560 108 590 95 C600 110 590 125 560 130 C480 140 360 150 240 150 C140 150 70 148 40 140 C25 135 24 126 30 120 Z" fill="#8a6a3a" stroke="#4a3418" stroke-width="3"/>
  <path d="M60 135 C150 140 300 140 450 128" stroke="#c8a870" stroke-width="5" fill="none"/>
  <path d="M300 102 C340 80 380 85 420 104 M440 106 C480 88 530 85 575 98" stroke="#4a3418" stroke-width="3" fill="#7a5a2a"/>
  <g fill="#2a1a0a"><circle cx="100" cy="115" r="3"/><circle cx="112" cy="116" r="3"/><circle cx="124" cy="117" r="3"/><circle cx="136" cy="117" r="3"/><circle cx="148" cy="118" r="3"/><circle cx="160" cy="118" r="3"/><circle cx="172" cy="118" r="3"/></g>
  <circle cx="70" cy="112" r="6" fill="#1a1a1a"/>
