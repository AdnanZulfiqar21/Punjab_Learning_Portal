<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.20 and 12.21: from muscle to myofibril, a sarcomere with its bands, and the two myofilaments. Schematic. -->
  <defs>
    <style>
      .h{font-size:23px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563}
      .c{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">Ultrastructure of skeletal muscle</text>
  <!-- levels -->
  <g font-size="15" fill="#4b5563">
    <rect x="60" y="70" width="180" height="50" rx="25" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text x="150" y="100" text-anchor="middle" font-weight="700" fill="#14181f">muscle</text>
    <path d="M245 95 H285" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="290" y="70" width="180" height="50" rx="20" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text x="380" y="100" text-anchor="middle" font-weight="700" fill="#14181f">bundle of fibres</text>
    <path d="M475 95 H515" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="520" y="70" width="180" height="50" rx="16" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text x="610" y="100" text-anchor="middle" font-weight="700" fill="#14181f">muscle fibre (cell)</text>
    <path d="M705 95 H745" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="750" y="70" width="180" height="50" rx="12" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text x="840" y="100" text-anchor="middle" font-weight="700" fill="#14181f">myofibril</text>
    <path d="M935 95 H975" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="980" y="70" width="160" height="50" rx="8" fill="#f6d5cf" stroke="#b5463a" stroke-width="3"/><text x="1060" y="100" text-anchor="middle" font-weight="700" fill="#14181f">myofilaments</text>
    <text x="60" y="150">bundles wrapped in collagen and connective tissue; tendons at the ends attach muscle to bone</text>
    <text x="60" y="172">each fibre: a cylindrical multinucleated cell under the sarcolemma, with sarcoplasm, sarcoplasmic reticulum (SR) and T-tubules</text>
    <text x="60" y="194">(the sarcolemma folded inward to reach the SR); 4 to 20 myofibrils per fibre; each myofibril is thick (myosin) and thin (actin) filaments</text>
  </g>
  <!-- sarcomere -->
  <text class="h" x="500" y="250">One sarcomere (Z line to Z line)</text>
  <g stroke="#14181f" stroke-width="5"><path d="M150 280 v160 M850 280 v160"/></g>
  <path d="M500 290 v140" stroke="#9ca3af" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- thin filaments from Z lines -->
  <g stroke="#1f6fb5" stroke-width="5"><path d="M150 300 h280 M150 340 h280 M150 380 h280 M150 420 h280 M850 300 h-280 M850 340 h-280 M850 380 h-280 M850 420 h-280"/></g>
  <!-- thick filaments -->
  <g stroke="#d7322f" stroke-width="9" stroke-linecap="round"><path d="M300 320 h400 M300 360 h400 M300 400 h400"/></g>
  <g fill="#d7322f"><circle cx="320" cy="312" r="4"/><circle cx="350" cy="312" r="4"/><circle cx="380" cy="312" r="4"/><circle cx="410" cy="312" r="4"/><circle cx="590" cy="312" r="4"/><circle cx="620" cy="312" r="4"/><circle cx="650" cy="312" r="4"/><circle cx="680" cy="312" r="4"/></g>
  <!-- band brackets -->
  <g stroke="#4b5563" stroke-width="2" fill="none"><path d="M150 460 v10 h150 v-10 M300 460 v10 h400 v-10 M700 460 v10 h150 v-10 M430 490 v10 h140 v-10"/></g>
  <text class="c" x="225" y="492">I band (thin only)</text><text class="c" x="500" y="492" style="font-weight:700;fill:#14181f">A band (thick filaments)</text><text class="c" x="775" y="492">I band</text>
  <text class="c" x="500" y="522">H zone: thick only, no overlap; M line at its centre</text>
  <text class="s" x="880" y="290">Z line: protein disc</text><text class="s" x="880" y="308">that anchors the thin</text><text class="s" x="880" y="326">actin filaments</text>
  <text class="s" x="880" y="360">A bands look dark, I bands</text><text class="s" x="880" y="378">light: the striations</text>
  <text class="s" x="880" y="412">in contraction the thin filaments</text><text class="s" x="880" y="430">slide deeper into the A band: the</text><text class="s" x="880" y="448">H zone and I band narrow, the Z lines</text><text class="s" x="880" y="466">come closer, the A band does not shorten</text>
  <!-- myofilaments -->
  <text class="h" x="330" y="580">Thick filament (about 16 nm)</text>
  <path d="M100 630 H560" stroke="#d7322f" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#d7322f" stroke-width="4" fill="#d7322f"><path d="M140 625 l-10 -18 M180 625 l-10 -18 M220 625 l-10 -18 M480 625 l10 -18 M520 625 l10 -18 M540 625 l10 -18"/><circle cx="128" cy="605" r="6"/><circle cx="168" cy="605" r="6"/><circle cx="208" cy="605" r="6"/><circle cx="492" cy="605" r="6"/><circle cx="532" cy="605" r="6"/><circle cx="552" cy="605" r="6"/></g>
  <text class="c" x="330" y="665">many myosin molecules, each two twined polypeptide chains</text><text class="c" x="330" y="685">ending in a globular head that binds actin in contraction</text>
  <text class="h" x="880" y="580">Thin filament (7-8 nm)</text>
  <path d="M700 630 q40 -20 80 0 q40 20 80 0 q40 -20 80 0 q40 20 80 0 q40 -20 80 0" fill="none" stroke="#1f6fb5" stroke-width="7"/>
  <path d="M700 630 q40 20 80 0 q40 -20 80 0 q40 20 80 0 q40 -20 80 0 q40 20 80 0" fill="none" stroke="#1f6fb5" stroke-width="7"/>
  <path d="M700 622 H1100" stroke="#f2b134" stroke-width="3"/>
  <g fill="#0f7a62"><circle cx="760" cy="630" r="8"/><circle cx="900" cy="630" r="8"/><circle cx="1040" cy="630" r="8"/></g>
  <text class="c" x="880" y="665">two twisted strands of actin (blue); two strands of tropomyosin (yellow)</text><text class="c" x="880" y="685">that block the myosin-binding sites at rest; troponin (green) at intervals,</text><text class="c" x="880" y="705">three polypeptides: one binds actin, one tropomyosin, one calcium ions</text>
  <text class="c" x="600" y="745">Red: myosin. Blue: actin. Black: Z lines. The sarcomere is the smallest unit of contraction.</text>
</svg>
