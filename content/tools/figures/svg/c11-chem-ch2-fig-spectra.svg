<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 2.2 and 2.3: the emission and absorption spectra of hydrogen, schematic. The four visible hydrogen lines are at the wavelengths printed in the text. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f}
    </style>
    <linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#7b3fb5"/><stop offset="0.2" stop-color="#1f6fb5"/><stop offset="0.45" stop-color="#0f9a62"/><stop offset="0.65" stop-color="#e6c21a"/><stop offset="0.8" stop-color="#e8701a"/><stop offset="1" stop-color="#d7322f"/></linearGradient>
  </defs>
  <text class="h" x="600" y="36">Atomic spectra: the fingerprints of the elements</text>
  <!-- emission -->
  <text class="k" x="100" y="90">(a) Emission spectrum of hydrogen</text>
  <rect x="100" y="100" width="1000" height="70" fill="#14181f"/>
  <g stroke-width="5">
    <line x1="1040" y1="100" x2="1040" y2="170" stroke="#d7322f"/>
    <line x1="520" y1="100" x2="520" y2="170" stroke="#1fb5a6"/>
    <line x1="380" y1="100" x2="380" y2="170" stroke="#3a4fd7"/>
    <line x1="300" y1="100" x2="300" y2="170" stroke="#7b3fb5"/>
  </g>
  <g class="s" style="font-size:14px"><text x="1040" y="190">656 nm</text><text x="520" y="190">486 nm</text><text x="380" y="190">434 nm</text><text x="300" y="190">410 nm</text></g>
  <text class="s" x="600" y="220">a hot gas or an electrical discharge emits only certain wavelengths: bright coloured lines on a dark background</text>
  <!-- absorption -->
  <text class="k" x="100" y="270">(b) Absorption spectrum of hydrogen</text>
  <rect x="100" y="280" width="1000" height="70" fill="url(#vis)"/>
  <g stroke="#14181f" stroke-width="5">
    <line x1="1040" y1="280" x2="1040" y2="350"/><line x1="520" y1="280" x2="520" y2="350"/><line x1="380" y1="280" x2="380" y2="350"/><line x1="300" y1="280" x2="300" y2="350"/>
  </g>
  <text class="s" x="600" y="380">white light through the cold gas: the same wavelengths are absorbed and show as dark lines in the continuous spectrum</text>
  <text class="s" x="600" y="430">each element has its own arrangement of electrons and fixed energy levels, so the wavelengths emitted or absorbed when</text>
  <text class="s" x="600" y="452">electrons jump between levels are unique to it: every element is identified by its characteristic spectrum</text>
  <text class="s" x="600" y="500">The Bohr model and the later models rest on two kinds of evidence: atomic spectra and ionization energies.</text>
  <text class="s" x="600" y="540">Schematic: positions follow the printed wavelengths, from violet at the left to red at the right.</text>
</svg>
