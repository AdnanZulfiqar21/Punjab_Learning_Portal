<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Times New Roman', Times, serif">
  <!-- Fig 7.11 (C12-MATH, PDF p232): Aslam's velocity-time graph on the printed pale yellow panel with magenta axes; cyan line O(0, 0) to A(5, 8) to B(13, 8); dashed cyan lines from the 8 mark to A, from A down to D(5, 0) and from B down to C(13, 0), as printed. -->
  <title>Velocity-time graph of Aslam's run (Figure 7.11)</title>
  <rect width="1040" height="600" fill="#ffffff"/>
  <rect x="6" y="6" width="1028" height="588" fill="#FFFAC2" stroke="#231F20" stroke-width="1.5"/>
  <line x1="80" y1="540" x2="80" y2="26" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M85.7 37.7 L80 26 L74.3 37.7" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <line x1="60" y1="510" x2="1010" y2="510" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M998.3 515.7 L1010 510 L998.3 504.3" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <line x1="80" y1="78" x2="400" y2="78" stroke="#00AEEF" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="400" y1="78" x2="400" y2="510" stroke="#00AEEF" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="912" y1="78" x2="912" y2="510" stroke="#00AEEF" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M80 510 L400 78 L912 78" fill="none" stroke="#00AEEF" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="68" y="88" font-size="30" text-anchor="end" fill="#231F20">8</text>
  <text x="68" y="546" font-size="30" text-anchor="end" fill="#231F20">0</text>
  <text x="400" y="550" font-size="30" text-anchor="middle" fill="#231F20">5</text>
  <text x="912" y="550" font-size="30" text-anchor="middle" fill="#231F20">13</text>
  <text x="94" y="52" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">v</text>
  <text x="1000" y="550" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">t</text>
  <text x="400" y="64" font-size="30" text-anchor="middle" fill="#231F20" font-style="italic">A</text>
  <text x="912" y="64" font-size="30" text-anchor="middle" fill="#231F20" font-style="italic">B</text>
  <text x="94" y="496" font-size="30" text-anchor="start" fill="#231F20" font-style="italic">O</text>
  <text x="412" y="496" font-size="30" text-anchor="start" fill="#231F20" font-style="italic">D</text>
  <text x="902" y="496" font-size="30" text-anchor="end" fill="#231F20" font-style="italic">C</text>
</svg>
