<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis4-1 (C11-PHY, PDF p83): Do You Know? photograph of a sunset (no printed caption number); flat drawing after the printed photograph: a bright white-yellow Sun with an orange glow in an orange sky, darker bands of cloud across the top, and the dark silhouette of trees and bushes along the bottom. No photograph is reproduced. -->
  <defs>
    <clipPath id="frame"><rect x="20" y="20" width="760" height="1060"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8661f"/><stop offset="0.45" stop-color="#e48a2a"/><stop offset="1" stop-color="#c9661c"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8"/><stop offset="0.4" stop-color="#ffb347" stop-opacity="0.8"/><stop offset="1" stop-color="#e48a2a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1100" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="760" height="1060" fill="url(#sky)"/>
    <!-- cloud bands at the top -->
    <g fill="#7e4a20" opacity="0.75">
      <path d="M20 40 Q200 20 400 60 Q600 30 780 55 L780 120 Q600 100 420 130 Q220 95 20 125 Z"/>
      <path d="M20 190 Q300 170 520 200 Q660 185 780 205 L780 235 Q600 225 420 240 Q220 215 20 230 Z" opacity="0.6"/>
    </g>
    <!-- the Sun -->
    <circle cx="400" cy="560" r="260" fill="url(#glow)"/>
    <circle cx="400" cy="560" r="110" fill="#fff6d6"/>
    <!-- tree silhouettes along the bottom -->
    <path d="M20 900 Q60 860 100 880 Q120 820 170 840 Q200 780 250 820 Q280 790 310 830 Q350 800 380 850 Q420 820 450 860 Q500 760 560 830 Q600 800 640 850 Q680 780 730 840 Q760 820 780 850 L780 1080 L20 1080 Z" fill="#1a1208"/>
    <path d="M500 840 L505 760 M520 820 L540 740 M555 800 L548 720" stroke="#1a1208" stroke-width="10" stroke-linecap="round"/>
    <g fill="#1a1208"><circle cx="505" cy="760" r="34"/><circle cx="540" cy="740" r="30"/><circle cx="548" cy="718" r="26"/><circle cx="160" cy="830" r="30"/><circle cx="700" cy="820" r="32"/></g>
  </g>
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#9aa3ad" stroke-width="2"/>
</svg>
