<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.8 to 11.17 and topics 11.6.2 to 11.8.1: ethene structure, carbocation stability, inductive effect, preparation of ethene and electrophilic addition mechanisms. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Alkenes: the ethene double bond, carbocations and electrophilic addition</text>
  <!-- ethene structure -->
  <rect x="50" y="55" width="380" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="240" y="83">Ethene (11.7.1, Figures 11.8 to 11.10)</text>
  <g stroke="#14181f" stroke-width="2.5" fill="none">
    <path d="M160 170 L230 170 M160 178 L230 178" />
    <path d="M160 174 L120 150 M160 174 L120 198 M230 174 L270 150 M230 174 L270 198"/>
  </g>
  <ellipse cx="195" cy="150" rx="22" ry="12" fill="#d7322f" opacity="0.35"/>
  <ellipse cx="195" cy="198" rx="22" ry="12" fill="#d7322f" opacity="0.35"/>
  <g font-size="12" fill="#14181f" font-weight="700" text-anchor="middle">
    <text x="160" y="178" style="fill:#ffffff">C</text><text x="230" y="178" style="fill:#ffffff">C</text>
    <text x="110" y="146">H</text><text x="110" y="206">H</text><text x="280" y="146">H</text><text x="280" y="206">H</text>
  </g>
  <circle cx="160" cy="174" r="8" fill="#14181f"/><circle cx="230" cy="174" r="8" fill="#14181f"/>
  <text font-size="11" fill="#d7322f" x="195" y="130" text-anchor="middle">pi bond: sideways overlap of p orbitals</text>
  <text font-size="11" fill="#4b5563" x="195" y="228" text-anchor="middle">sigma bond: head-on overlap of sp2 orbitals</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="254">each C: sp2 (2s + two 2p), three orbitals in a plane at 120</text>
    <text x="70" y="270">degrees, one unhybridised p orbital at 90 degrees to it</text>
    <text x="70" y="286">C=C = one sigma + one pi; six atoms in one plane (trigonal planar)</text>
    <text x="70" y="302">pi electrons are held loosely, away from the nuclei: weaker,</text>
    <text x="70" y="318">exposed to electrophiles, so alkenes add electrophiles easily</text>
  </g>
  <!-- carbocations -->
  <rect x="450" y="55" width="340" height="270" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="620" y="83">Carbocation stability (11.7.2, Figure 11.11)</text>
  <g class="f" style="font-size:14px;text-anchor:middle">
    <text x="500" y="130">CH3+</text><text x="580" y="130">RCH2+</text><text x="660" y="130">R2CH+</text><text x="745" y="130">R3C+</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="500" y="148">methyl</text><text x="580" y="148">primary 1</text><text x="660" y="148">secondary 2</text><text x="745" y="148">tertiary 3</text>
    <text x="500" y="162">no alkyl</text><text x="580" y="162">one alkyl</text><text x="660" y="162">two alkyls</text><text x="745" y="162">three alkyls</text>
  </g>
  <path d="M480 180 H765" stroke="#0f7a62" stroke-width="3" marker-end="url(#a)"/>
  <text font-size="12" fill="#0f7a62" font-weight="700" x="620" y="200" text-anchor="middle">stability increases: more alkyl groups push electrons in (+I)</text>
  <g class="t" style="font-size:12px">
    <text x="470" y="226">inductive effect: polarisation of a sigma bond by</text>
    <text x="470" y="242">electron-donating (+I, alkyl) or withdrawing (-I,</text>
    <text x="470" y="258">halogen) neighbours; donating groups spread out the</text>
    <text x="470" y="274">positive charge, so 3 greater than 2 greater than 1</text>
    <text x="470" y="296">-I (11.7.3, Figure 11.12): Cl pulls electrons from C1,</text>
    <text x="470" y="312">C1 from C2, ... a permanent dipole along the chain</text>
  </g>
  <!-- preparation -->
  <rect x="810" y="55" width="340" height="270" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Preparing ethene (11.6.2): elimination</text>
  <g class="t" style="font-size:12px;font-weight:700;fill:#14181f">
    <text x="830" y="110">dehydration of ethanol</text>
    <text x="830" y="200">dehydrohalogenation of bromoethane</text>
  </g>
  <g class="f" style="font-size:12px">
    <text x="830" y="130" style="font-size:11px">C2H5OH --(conc. H2SO4, 180 C)--> C2H4 + H2O</text>
    <text x="830" y="152">via CH3CH2OSO3H (ethyl hydrogen sulfate),</text>
    <text x="830" y="168">which decomposes on heating</text>
    <text x="830" y="220" style="font-size:11px">C2H5Br + KOH(alc), heat --> C2H4 + KBr + H2O</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="830" y="248">a small molecule (H2O, HX) is removed from adjacent</text>
    <text x="830" y="264">carbons to create the double bond</text>
    <text x="830" y="288">naming (11.6.1): longest chain containing C=C, -ane</text>
    <text x="830" y="304">to -ene, number from the end nearer the double bond</text>
  </g>
  <!-- mechanisms -->
  <rect x="50" y="345" width="1100" height="340" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="373">Electrophilic addition (11.8.1, Figures 11.13 to 11.17): electrophile first, carbocation, then nucleophile</text>
  <g class="t" style="font-weight:700;fill:#14181f">
    <text x="70" y="402">Bromine and ethene (halogenation)</text>
    <text x="620" y="402">Hydrogen bromide and propene (Markovnikov)</text>
  </g>
  <g class="f">
    <text x="70" y="428">1. C=C repels the Br-Br electrons: induced dipole, Br(d+)-Br(d-)</text>
    <text x="70" y="450">2. pi electrons attack Br(d+): carbocation + Br-</text>
    <text x="70" y="472">3. Br- (nucleophile) attacks the carbocation</text>
    <text x="70" y="500">CH2=CH2 + Br2 --> BrCH2-CH2Br   (1,2-dibromoethane)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="526">red-brown bromine water is decolourised at once:</text>
    <text x="70" y="542">the test for unsaturation (in CCl4 as inert solvent)</text>
    <text x="70" y="566" style="font-weight:700;fill:#14181f">HBr and ethene (symmetrical: one product)</text>
  </g>
  <g class="f">
    <text x="70" y="590">pi electrons attack H(d+) of H-Br: CH3-CH2+ + Br-</text>
    <text x="70" y="612">Br- adds: CH3-CH2-Br (bromoethane)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="638">H-Br is a permanent dipole; rate HF less than HCl less than HBr less than HI</text>
    <text x="70" y="656">hydrogen halides add across C=C the same way at room temperature</text>
  </g>
  <g class="f">
    <text x="620" y="428">CH3-CH=CH2 + H-Br: H adds to the CH2 end (more H)</text>
    <text x="620" y="450">  --> CH3-CH(+)-CH3   secondary carbocation (stable)</text>
    <text x="620" y="472">  then Br-:  CH3-CHBr-CH3   2-bromopropane, MAJOR</text>
    <text x="620" y="500">H adds to the CH end --> CH3-CH2-CH2(+)  primary (less stable)</text>
    <text x="620" y="522">  then Br-:  CH3-CH2-CH2Br   1-bromopropane, minor</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="620" y="550" style="font-weight:700;fill:#14181f">Markovnikov's rule: when a polar reagent adds to an</text>
    <text x="620" y="566" style="font-weight:700;fill:#14181f">unsymmetrical alkene, the negative part attaches to the</text>
    <text x="620" y="582" style="font-weight:700;fill:#14181f">double-bonded carbon with fewer hydrogens</text>
    <text x="620" y="606">reason: the pathway through the more stable (more</text>
    <text x="620" y="622">substituted) carbocation, stabilised by +I alkyl groups, wins</text>
    <text x="620" y="646">electrophile (E+): electron-pair acceptor; nucleophile (Nu-):</text>
    <text x="620" y="662">electron-pair donor; the alkene's pi electrons make it a nucleophile</text>
  </g>
</svg>
