<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original structures of monosubstituted benzenes with their names: toluene, phenol, anisole, aniline, benzaldehyde, benzoic acid, benzenesulphonic acid, nitrobenzene and chlorobenzene. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Names of monosubstituted benzenes</text>
  <path d="M95.0 110.0 L121.0 125.0 L121.0 155.0 L95.0 170.0 L69.0 155.0 L69.0 125.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="95.0" cy="140.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="95.0" y1="110.0" x2="95.0" y2="93.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="95.0" y="86.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="95.0" y="202.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">toluene</text>
  <text x="95.0" y="220.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(methylbenzene)</text>
  <path d="M273.0 110.0 L299.0 125.0 L299.0 155.0 L273.0 170.0 L247.0 155.0 L247.0 125.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="273.0" cy="140.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="273.0" y1="110.0" x2="273.0" y2="93.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="273.0" y="86.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="273.0" y="202.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">phenol</text>
  <text x="273.0" y="220.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(benzenol)</text>
  <path d="M451.0 110.0 L477.0 125.0 L477.0 155.0 L451.0 170.0 L425.0 155.0 L425.0 125.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="451.0" cy="140.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="451.0" y1="110.0" x2="451.0" y2="93.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="451.0" y="86.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OCH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="451.0" y="202.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">anisole</text>
  <text x="451.0" y="220.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(methoxybenzene)</text>
  <path d="M629.0 110.0 L655.0 125.0 L655.0 155.0 L629.0 170.0 L603.0 155.0 L603.0 125.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="629.0" cy="140.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="629.0" y1="110.0" x2="629.0" y2="93.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="629.0" y="86.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="629.0" y="202.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">aniline</text>
  <text x="629.0" y="220.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(benzenamine)</text>
  <path d="M807.0 110.0 L833.0 125.0 L833.0 155.0 L807.0 170.0 L781.0 155.0 L781.0 125.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="807.0" cy="140.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="807.0" y1="110.0" x2="807.0" y2="93.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="807.0" y="86.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CHO</tspan></text>
  <text x="807.0" y="202.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzaldehyde</text>
  <text x="807.0" y="220.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(benzenecarbaldehyde)</text>
  <path d="M184.0 315.0 L210.0 330.0 L210.0 360.0 L184.0 375.0 L158.0 360.0 L158.0 330.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="184.0" cy="345.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="184.0" y1="315.0" x2="184.0" y2="298.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="184.0" y="291.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">COOH</tspan></text>
  <text x="184.0" y="407.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzoic acid</text>
  <text x="184.0" y="425.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(benzenecarboxylic acid)</text>
  <path d="M362.0 315.0 L388.0 330.0 L388.0 360.0 L362.0 375.0 L336.0 360.0 L336.0 330.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="362.0" cy="345.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="362.0" y1="315.0" x2="362.0" y2="298.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="362.0" y="291.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">SO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">H</tspan></text>
  <text x="362.0" y="407.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">benzenesulphonic acid</text>
  <path d="M540.0 315.0 L566.0 330.0 L566.0 360.0 L540.0 375.0 L514.0 360.0 L514.0 330.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="540.0" cy="345.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="540.0" y1="315.0" x2="540.0" y2="298.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="540.0" y="291.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="540.0" y="407.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">nitrobenzene</text>
  <path d="M718.0 315.0 L744.0 330.0 L744.0 360.0 L718.0 375.0 L692.0 360.0 L692.0 330.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="718.0" cy="345.0" r="17.4" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="718.0" y1="315.0" x2="718.0" y2="298.5" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="718.0" y="291.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <text x="718.0" y="407.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">chlorobenzene</text>
  <text x="450.0" y="462.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the substituent of a monosubstituted benzene is always on C-1, so no number is needed</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
