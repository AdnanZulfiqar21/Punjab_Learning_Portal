<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figures 12.7(a) and 12.7(b): the three quarks of a proton and a neutron carry red, green and blue; an antiproton's antiquarks carry the anti-colours; each total is colourless. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Hadrons are colourless</text>
  <rect x="15.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="155.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">proton (u u d)</text>
  <rect x="310.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">neutron (u d d)</text>
  <rect x="605.0" y="55.0" width="280.0" height="380.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="745.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">antiproton</text>
  <circle cx="155.0" cy="245.0" r="110.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <circle cx="155.0" cy="185.0" r="26.0" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <text x="155.0" y="192.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <text x="155.0" y="151.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">red</text>
  <circle cx="207.0" cy="275.0" r="26.0" stroke="#0f7a62" stroke-width="3" fill="#d1fae5"/>
  <text x="207.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <text x="207.0" y="319.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">green</text>
  <circle cx="103.0" cy="275.0" r="26.0" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="103.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <text x="103.0" y="319.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">blue</text>
  <circle cx="450.0" cy="245.0" r="110.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <circle cx="450.0" cy="185.0" r="26.0" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <text x="450.0" y="192.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <text x="450.0" y="151.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">red</text>
  <circle cx="502.0" cy="275.0" r="26.0" stroke="#0f7a62" stroke-width="3" fill="#d1fae5"/>
  <text x="502.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <text x="502.0" y="319.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">green</text>
  <circle cx="398.0" cy="275.0" r="26.0" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <text x="398.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <text x="398.0" y="319.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">blue</text>
  <circle cx="745.0" cy="245.0" r="110.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <circle cx="745.0" cy="185.0" r="26.0" stroke="#0e9aa7" stroke-width="3" fill="#cffafe"/>
  <text x="745.0" y="192.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">u bar</text>
  <text x="745.0" y="151.0" font-size="13" fill="#0e9aa7" text-anchor="middle" font-weight="700">anti-red</text>
  <circle cx="797.0" cy="275.0" r="26.0" stroke="#c026d3" stroke-width="3" fill="#fae8ff"/>
  <text x="797.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">u bar</text>
  <text x="797.0" y="319.0" font-size="13" fill="#c026d3" text-anchor="middle" font-weight="700">anti-green</text>
  <circle cx="693.0" cy="275.0" r="26.0" stroke="#d98b2b" stroke-width="3" fill="#fff1dc"/>
  <text x="693.0" y="282.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">d bar</text>
  <text x="693.0" y="319.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">anti-blue</text>
  <text x="155.0" y="385.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">red + green + blue</text>
  <text x="155.0" y="405.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">= colourless (white)</text>
  <text x="450.0" y="385.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">red + green + blue</text>
  <text x="450.0" y="405.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">= colourless (white)</text>
  <text x="745.0" y="385.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">anti-colours</text>
  <text x="745.0" y="405.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">= colourless (white)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
