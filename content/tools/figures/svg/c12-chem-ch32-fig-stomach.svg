<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for topic 32.2: stomach contents at pH 1.5-3.5, a mucus layer whose bicarbonate ions neutralise acid at the cell surface, and parietal cells pumping in H+; and a coated tablet that passes the acidic stomach intact and dissolves in the less acidic small intestine. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Acid in the stomach and coated tablets</text>
  <rect x="15.0" y="55.0" width="500.0" height="385.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="265.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the stomach lining</text>
  <rect x="40.0" y="100.0" width="450.0" height="105.0" rx="6" stroke="#1f6fb5" stroke-width="1.5" fill="#eaf2fb"/>
  <text x="265.0" y="125.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">stomach contents: pH 1.5-3.5</text>
  <text x="90.0" y="165.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="170.0" y="185.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="250.0" y="160.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="330.0" y="180.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="410.0" y="165.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <rect x="40.0" y="205.0" width="450.0" height="75.0" rx="0" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="265.0" y="232.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">thick mucus layer with bicarbonate ions</text>
  <text x="265.0" y="262.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HCO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-10.4" font-size="9.8">-</tspan><tspan dy="5.9"> + H</tspan><tspan dy="-5.9" font-size="9.8">+</tspan><tspan dy="5.9"> -&gt; H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <rect x="40.0" y="280.0" width="450.0" height="120.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <rect x="55.0" y="300.0" width="76.0" height="80.0" rx="6" stroke="#d98b2b" stroke-width="1.2" fill="#fde7c7"/>
  <rect x="143.0" y="300.0" width="76.0" height="80.0" rx="6" stroke="#d98b2b" stroke-width="1.2" fill="#fde7c7"/>
  <rect x="231.0" y="300.0" width="76.0" height="80.0" rx="6" stroke="#d98b2b" stroke-width="1.2" fill="#fde7c7"/>
  <rect x="319.0" y="300.0" width="76.0" height="80.0" rx="6" stroke="#d98b2b" stroke-width="1.2" fill="#fde7c7"/>
  <rect x="407.0" y="300.0" width="76.0" height="80.0" rx="6" stroke="#d98b2b" stroke-width="1.2" fill="#fde7c7"/>
  <text x="265.0" y="418.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">cells of the stomach wall; parietal cells pump in H+</text>
  <line x1="75.0" y1="300.0" x2="75.0" y2="197.2" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M75.0 190.0 L78.8 198.2 L71.2 198.2 Z" fill="#d7322f"/>
  <line x1="458.0" y1="300.0" x2="458.0" y2="197.2" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M458.0 190.0 L461.8 198.2 L454.2 198.2 Z" fill="#d7322f"/>
  <rect x="530.0" y="55.0" width="355.0" height="385.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="707.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a coated tablet</text>
  <rect x="560.0" y="95.0" width="295.0" height="120.0" rx="8" stroke="#1f6fb5" stroke-width="1.5" fill="#eaf2fb"/>
  <text x="707.0" y="118.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">stomach: strongly acidic</text>
  <rect x="670.0" y="135.0" width="74.0" height="42.0" rx="20" stroke="#d98b2b" stroke-width="5" fill="#fde7c7"/>
  <text x="707.0" y="200.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">coating does not dissolve</text>
  <line x1="707.0" y1="218.0" x2="707.0" y2="254.8" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M707.0 262.0 L703.2 253.8 L710.8 253.8 Z" fill="#4b5563"/>
  <rect x="560.0" y="265.0" width="295.0" height="150.0" rx="8" stroke="#0f7a62" stroke-width="1.5" fill="#e6f4ef"/>
  <text x="707.0" y="288.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">small intestine: less acidic</text>
  <rect x="680.0" y="300.0" width="54.0" height="34.0" rx="16" stroke="#d98b2b" stroke-width="1.5" fill="#fde7c7"/>
  <circle cx="677.0" cy="327.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="741.0" cy="323.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="685.0" cy="357.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="737.0" cy="359.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="707.0" cy="367.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <text x="707.0" y="384.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">coating dissolves; the drug is</text>
  <text x="707.0" y="401.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">released and absorbed</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
