  <text x="850.0" y="212.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">equator</text>
  <ellipse cx="200.0" cy="155.0" rx="110.0" ry="45.0" stroke="#4b5563" stroke-width="2.5" fill="none"/>
