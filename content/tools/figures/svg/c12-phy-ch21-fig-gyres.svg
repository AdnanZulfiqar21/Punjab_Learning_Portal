  <text x="450.0" y="400.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Warm currents (orange) carry heat from the equator towards the poles; cold currents (blue) return.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
