<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for topic 24.6.3: the -COOH of one amino acid and the -NH2 of another lose water to form a peptide link, -CO-NH-, giving a dipeptide; with definitions of tripeptide, polypeptide and isoelectric point. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two amino acids join: a dipeptide</text>
  <text x="160.0" y="156.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">N-CH(R)-CO</tspan></text>
  <rect x="237.0" y="132.0" width="46.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#ffedd5"/>
  <text x="260.0" y="156.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan></text>
  <text x="300.0" y="156.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">+</tspan></text>
  <rect x="318.0" y="132.0" width="30.0" height="32.0" rx="6" stroke="#d98b2b" stroke-width="1.5" fill="#ffedd5"/>
  <text x="333.0" y="156.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <text x="420.0" y="156.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">-NH-CH(R)-COOH</tspan></text>
  <text x="290.0" y="200.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">these atoms are lost as water</text>
  <line x1="450.0" y1="190.0" x2="450.0" y2="236.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 245.0 L445.4 235.0 L454.6 235.0 Z" fill="#14181f"/>
  <text x="470.0" y="222.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">- H2O (condensation)</text>
  <text x="300.0" y="306.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">N-CH(R)-</tspan></text>
  <rect x="305.0" y="278.0" width="110.0" height="40.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="360.0" y="306.0" font-size="19" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">CO-NH</tspan></text>
  <text x="420.0" y="306.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">-CH(R)-COOH</tspan></text>
  <text x="360.0" y="345.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">peptide link (an amide bond)</text>
  <rect x="15.0" y="375.0" width="870.0" height="75.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="402.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">dipeptide: two amino acids; tripeptide: three; polypeptide: many amino acids joined by peptide links</text>
  <text x="450.0" y="424.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">isoelectric point: the pH at which an amino acid has no overall charge in aqueous solution</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
