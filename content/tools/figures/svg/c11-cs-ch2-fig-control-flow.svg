<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topic 2.4: an if-elif-else flowchart for the weather example and a while-loop flowchart counting from 1, with notes on the decision statements, for loops and range(). -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Decision making and loops</text>
  <rect x="50" y="55" width="540" height="640" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">if, if-else and if-elif-else (2.4.1)</text>
  <path d="M220 110 L310 140 L220 170 L130 140 Z" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="220" y="144" style="text-anchor:middle">weather == "sunny"?</text>
  <rect x="380" y="125" width="170" height="30" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="398" y="144">print("Wear sunglasses")</text>
  <path d="M310 140 L376 140" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <text class="r" x="330" y="132">yes</text>
  <path d="M220 220 L310 250 L220 280 L130 250 Z" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="220" y="254" style="text-anchor:middle">weather == "rainy"?</text>
  <rect x="380" y="235" width="170" height="30" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="395" y="254">print("Take an umbrella")</text>
  <path d="M310 250 L376 250" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <text class="r" x="330" y="242">yes</text>
  <path d="M220 170 L220 216" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="228" y="196">no</text>
  <rect x="135" y="320" width="170" height="30" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="r" x="153" y="339">print("Enjoy your day!")</text>
  <path d="M220 280 L220 316" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="228" y="302">no (else)</text>
  <g class="r">
    <text x="70" y="390">if: run a block only when the condition is true</text>
    <text x="70" y="406">if-else: one block when true, another when false</text>
    <text x="70" y="422">short hand: print("hot") if t &gt; 30 else print("not hot")</text>
    <text x="70" y="438">if-elif-else: test conditions in order; the first true one runs;</text>
    <text x="70" y="454">else catches everything left</text>
    <text x="70" y="470">nested: an if inside another if (rainy and below 15 degrees:</text>
    <text x="70" y="486">raincoat; only rainy: umbrella; otherwise enjoy the day)</text>
    <text x="70" y="518">Python marks the block that belongs to an if, elif, else,</text>
    <text x="70" y="534">while, for or def by indenting it (usually 4 spaces) after a</text>
    <text x="70" y="550">line ending in a colon</text>
  </g>
  <rect x="610" y="55" width="540" height="640" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">while, for and range() (2.4.2)</text>
  <rect x="800" y="100" width="140" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="842" y="119">number = 1</text>
  <path d="M870 160 L960 190 L870 220 L780 190 Z" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="870" y="194" style="text-anchor:middle">number &lt; 10?</text>
  <rect x="1010" y="175" width="120" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="1034" y="194">print(number)</text>
  <rect x="1010" y="225" width="120" height="30" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="1039" y="244">number += 1</text>
  <path d="M870 130 L870 156" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M960 190 L1006 190" stroke="#0f7a62" stroke-width="2" marker-end="url(#g)"/>
  <text class="r" x="966" y="182">true</text>
  <path d="M1070 205 L1070 221" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1070 255 V280 H780 V190 H776" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M870 220 V320" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="878" y="300">false: stop</text>
  <g class="r">
    <text x="630" y="360">while repeats while the condition is true; it is checked before each</text>
    <text x="630" y="376">pass, so this loop prints 1 to 9</text>
    <text x="630" y="408">for takes each item of a sequence in turn:</text>
    <text x="630" y="424">for friend in ["Ahmad", "Ali", "Hassan"]: greet each friend</text>
    <text x="630" y="456">range(stop), range(start, stop), range(start, stop, step):</text>
    <text x="630" y="472">range(5) gives 0, 1, 2, 3, 4 (stop is not included)</text>
    <text x="630" y="488">range(2, 11, 2) gives 2, 4, 6, 8, 10</text>
    <text x="630" y="520">shopping cart: total_price += price * quantity for each item;</text>
    <text x="630" y="536">apples 2.00 + bananas 2.00 + oranges 2.25 = 6.25</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
