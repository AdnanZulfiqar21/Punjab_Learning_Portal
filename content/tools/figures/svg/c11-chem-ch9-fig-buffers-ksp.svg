<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after topics 9.6 to 9.8.1, Table 9.4 and the ionic product table: common ion effect, buffer action, Henderson equation, solubility product and prediction of precipitation. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Common ion effect, buffers and the solubility product</text>
  <!-- common ion -->
  <rect x="50" y="55" width="540" height="200" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="83">Common ion effect (9.6): a common ion suppresses ionization</text>
  <g class="f">
    <text x="70" y="112">NaCl(s) = Na+(aq) + Cl-(aq)    HCl(g) = H+(aq) + Cl-(aq)</text>
  </g>
  <g class="t">
    <text x="70" y="140">pass HCl into brine: extra Cl- pushes the equilibrium back and NaCl</text>
    <text x="70" y="160">crystallises out (purification of sodium chloride)</text>
    <text x="70" y="188">KClO3 is precipitated by KCl (common ion K+); H2S ionizes less in HCl</text>
    <text x="70" y="208">(common ion H+), giving the low [S2-] used for group II radicals;</text>
    <text x="70" y="228">NH4Cl added to NH3 lowers [OH-] (common ion NH4+), the group III reagent</text>
  </g>
  <!-- buffer -->
  <rect x="610" y="55" width="540" height="200" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="880" y="83">Acetate buffer: CH3COOH with CH3COONa (Table 9.4)</text>
  <path d="M660 225 V100 M660 225 H900" stroke="#4b5563" stroke-width="1.5"/>
  <g font-size="11" fill="#4b5563" text-anchor="end"><text x="654" y="229">0</text><text x="654" y="187">2</text><text x="654" y="145">4</text><text x="654" y="104">6</text></g>
  <text class="t" x="628" y="92" style="font-size:11px">pH</text>
  <g>
    <rect x="690" y="164.5" width="36" height="60.5" fill="#d7322f" opacity="0.8"/>
    <rect x="740" y="132" width="36" height="93" fill="#d98b2b" opacity="0.8"/>
    <rect x="790" y="126" width="36" height="99" fill="#0f7a62" opacity="0.8"/>
    <rect x="840" y="122" width="36" height="103" fill="#1f6fb5" opacity="0.8"/>
  </g>
  <g font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">
    <text x="708" y="158">2.89</text><text x="758" y="126">4.44</text><text x="808" y="120">4.74</text><text x="858" y="116">4.92</text>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="708" y="240">0.00</text><text x="758" y="240">0.05</text><text x="808" y="240">0.10</text><text x="858" y="240">0.15</text>
  </g>
  <text class="s" x="780" y="252" style="font-size:11px">[CH3COO-] added to 0.10 M CH3COOH, mol dm-3</text>
  <g class="t" style="font-size:12px">
    <text x="915" y="112">% dissociation falls:</text>
    <text x="915" y="130">1.3, 0.036, 0.018, 0.012</text>
    <text x="915" y="158">added H3O+ reacts with</text>
    <text x="915" y="176">CH3COO-; added OH- with</text>
    <text x="915" y="194">CH3COOH: pH almost fixed</text>
    <text x="915" y="222">basic buffer: NH4OH + NH4Cl</text>
  </g>
  <!-- Henderson -->
  <rect x="50" y="275" width="1100" height="80" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="600" y="302">Henderson's equation (9.7.1): pH = pKa + log ([salt] / [acid])</text>
  <text class="s" x="600" y="326">equal salt and acid: log 1 = 0, so pH = pKa; for acetic acid with sodium acetate pH = pKa = 4.74</text>
  <text class="s" x="600" y="344">two factors set the pH of a buffer: the pKa of the acid, and the ratio of salt to acid</text>
  <!-- Ksp -->
  <rect x="50" y="375" width="540" height="285" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="320" y="403">Solubility product Ksp (9.8) and solubility from Ksp</text>
  <g class="f">
    <text x="70" y="432">PbSO4(s) = Pb2+(aq) + SO4 2-(aq)</text>
    <text x="70" y="456">Ksp = Kc [PbSO4] = [Pb2+][SO4 2-] = 1.6 x 10^-8 at 25 C</text>
    <text x="70" y="480">PbCl2: Ksp = [Pb2+][Cl-]^2  (ions raised to coefficients)</text>
  </g>
  <g class="t">
    <text x="70" y="510">Sample: Ca(OH)2, Ksp = 6.5 x 10^-6, solubility S mol dm-3</text>
    <text x="70" y="530">Ca(OH)2 = Ca2+ + 2OH-: [Ca2+] = S, [OH-] = 2S</text>
    <text x="70" y="550">Ksp = S (2S)^2 = 4S^3, so S^3 = 6.5 x 10^-6 / 4 = 1.625 x 10^-6</text>
    <text x="70" y="570">S = 1.18 x 10^-2 mol dm-3; [OH-] = 2.36 x 10^-2 mol dm-3</text>
    <text x="70" y="600">Ksp values (Table 9.5): AgCl 1.8 x 10^-10, CaF2 3.2 x 10^-11,</text>
    <text x="70" y="620">MgCO3 3.5 x 10^-8, PbCrO4 2.3 x 10^-13, Fe2S3 1.4 x 10^-85</text>
    <text x="70" y="640">Ksp is small, depends on temperature, and measures dissociation</text>
  </g>
  <!-- precipitation -->
  <rect x="610" y="375" width="540" height="285" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="403">Applications of Ksp (9.8.1): common ion and precipitation</text>
  <g class="t">
    <text x="630" y="432">common ion: PbCrO4(s) = Pb2+ + CrO4 2-; adding Na2CrO4 raises</text>
    <text x="630" y="452">[CrO4 2-], the equilibrium shifts left and solubility falls (Ksp fixed)</text>
  </g>
  <g font-size="13" fill="#4b5563" text-anchor="middle">
    <g font-weight="700" fill="#14181f"><text x="720" y="484">Ionic product</text><text x="880" y="484">Solution</text><text x="1040" y="484">Precipitation</text></g>
    <text x="720" y="508">greater than Ksp</text><text x="880" y="508">supersaturated</text><text x="1040" y="508">yes</text>
    <text x="720" y="528">equal to Ksp</text><text x="880" y="528">saturated</text><text x="1040" y="528">no</text>
    <text x="720" y="548">less than Ksp</text><text x="880" y="548">unsaturated</text><text x="1040" y="548">no</text>
  </g>
  <path d="M640 492 H1120" stroke="#9ca3af" stroke-width="1"/>
  <g class="t">
    <text x="630" y="580">CaSO4, Ksp = 2 x 10^-5: mix equal volumes of 10^-2 mol dm-3 Ca2+</text>
    <text x="630" y="600">and SO4 2-; each becomes 5.0 x 10^-3 mol dm-3 on mixing</text>
    <text x="630" y="620">ionic product = (5.0 x 10^-3)^2 = 2.5 x 10^-5 mol2 dm-6, greater</text>
    <text x="630" y="640">than Ksp, so CaSO4 precipitates</text>
  </g>
</svg>
