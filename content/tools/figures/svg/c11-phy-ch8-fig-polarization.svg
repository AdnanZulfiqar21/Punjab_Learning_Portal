  <text class="r" x="600" y="99" style="text-anchor:middle">polarizing filter</text>
  <text class="r" x="566" y="214">axis vertical</text>
  <path d="M690 150 L690 178" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M690 150 L690 122" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="462" y="210">unpolarized</text>
  <text class="r" x="668" y="198">polarized</text>
  <g class="r">
    <text x="450" y="236">E vibrates in all planes in unpolarized light:</text>
    <text x="450" y="251">sunlight, bulbs, a candle or fire; the filter passes</text>
    <text x="450" y="266">only the component parallel to its axis</text>
    <text x="450" y="281">methods: 1 polarizing filter (polaroid sheet)</text>
    <text x="450" y="296">2 polarizing beam splitter</text>
    <text x="450" y="311">3 optical crystals (calcite, quartz)</text>
  </g>
  <rect x="790" y="55" width="360" height="310" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Types of polarization (8.2, Fig. 8.4)</text>
  <text class="r" x="810" y="104">E traced in a plane across the beam:</text>
  <path d="M860 160 L860 200" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M860 160 L860 120" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="l" x="822" y="230">linear</text>
  <circle cx="970" cy="160" r="40" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
  <path d="M1010 158 V170" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <text class="l" x="945" y="230">circular</text>
  <ellipse cx="1085" cy="160" rx="48" ry="24" transform="rotate(-30 1085 160)" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <text class="l" x="1050" y="230">elliptical</text>
  <g class="r">
    <text x="810" y="256">linear: E in one plane (polarizing filter, sunglasses)</text>
    <text x="810" y="271">circular: E rotates in a circle, clockwise (right-handed)</text>
    <text x="810" y="286">or anticlockwise (left-handed); reflected off a CD or DVD</text>
    <text x="810" y="301">elliptical: E traces an ellipse; E_x and E_y unequal</text>
    <text x="810" y="316">and/or out of phase by theta (stress plate, waveplate)</text>
    <text x="810" y="331">the direction of E is the basis of polarization</text>
  </g>
  <rect x="50" y="385" width="1100" height="310" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
