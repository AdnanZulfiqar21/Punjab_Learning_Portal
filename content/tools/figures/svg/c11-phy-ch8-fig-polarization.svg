  <text class="r" x="80" y="280">(b) vibrations in a horizontal plane (seen from above)</text>
  <g class="t">
    <text x="70" y="306">plane of polarization: contains the direction of</text>
    <text x="70" y="322">vibration and the direction of propagation; only</text>
    <text x="70" y="338">transverse waves can be polarized, not sound</text>
  </g>
