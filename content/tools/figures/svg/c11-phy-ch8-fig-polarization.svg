  <path d="M433 617 H447" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="480" y="594">no light: axes crossed</text>
  <text class="r" x="96" y="516">unpolarized beam</text>
  <g class="t">
    <text x="660" y="430">light from a bulb or the Sun is unpolarized: its vibrations are randomly</text>
    <text x="660" y="446">oriented; a polaroid sheet (the polarizer) transmits plane polarized light</text>
    <text x="660" y="478">a second polaroid (the analyzer) with its axis parallel lets it through;</text>
    <text x="660" y="494">rotating the analyzer about the beam makes the light dimmer and dimmer</text>
    <text x="660" y="510">until it disappears when the axes are perpendicular; turning further,</text>
    <text x="660" y="526">it reappears and is brightest when the axes are parallel again</text>
    <text x="660" y="558">this proves that light waves are transverse: a longitudinal wave</text>
    <text x="660" y="574">would never disappear, even with the polaroids crossed</text>
    <text x="660" y="606">Ponder Upon: light reflected from smooth water is partly polarized</text>
    <text x="660" y="622">parallel to the surface; Do You Know: two crossed polarizers let</text>
    <text x="660" y="638">very little light through</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
