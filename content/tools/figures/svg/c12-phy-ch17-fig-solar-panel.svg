<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Brain teaser box (C12-PHY, PDF p102): flat drawing after the printed photograph of a solar panel shown from two sides: the dark back (left) and the front face of small black cells in a silver frame, split across the middle (right), joined along a vertical edge. No photograph is reproduced. -->
  <defs>
    <pattern id="cells" width="40" height="30" patternUnits="userSpaceOnUse"><rect width="40" height="30" fill="#1b1e24"/><rect x="2" y="2" width="36" height="26" fill="#2a2f38"/></pattern>
  </defs>
  <rect width="1000" height="1000" fill="#ffffff"/>
  <path d="M120 120 L480 80 L480 940 L120 880 Z" fill="#14171c" stroke="#9aa0a8" stroke-width="10"/>
  <line x1="120" y1="500" x2="480" y2="505" stroke="#5a606a" stroke-width="6"/>
  <g stroke="#262a31" stroke-width="3"><line x1="210" y1="110" x2="210" y2="890"/><line x1="300" y1="100" x2="300" y2="905"/><line x1="390" y1="90" x2="390" y2="920"/></g>
  <path d="M500 80 L880 120 L880 880 L500 940 Z" fill="url(#cells)" stroke="#b8bcc2" stroke-width="10"/>
  <line x1="500" y1="505" x2="880" y2="500" stroke="#b8bcc2" stroke-width="8"/>
  <g stroke="#3d434d" stroke-width="2"><line x1="595" y1="95" x2="595" y2="925"/><line x1="690" y1="105" x2="690" y2="910"/><line x1="785" y1="112" x2="785" y2="895"/></g>
  <line x1="490" y1="80" x2="490" y2="940" stroke="#d9dce0" stroke-width="14"/>
