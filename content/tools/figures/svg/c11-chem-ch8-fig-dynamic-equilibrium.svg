<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 8.1 and 8.2: concentrations and rates approaching dynamic equilibrium, and a closed against an open system. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Dynamic equilibrium: concentrations level off, rates become equal</text>
  <!-- three small concentration graphs -->
  <g transform="translate(60 70)">
    <text class="k" x="150" y="0">(a) reactant = product</text>
    <path d="M20 200 V20 M20 200 H290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M20 40 C 80 40, 110 110, 290 110" fill="none" stroke="#d7322f" stroke-width="2.5"/>
    <path d="M20 190 C 80 190, 110 110, 290 110" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
    <path d="M150 20 V200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="t" x="30" y="35" style="fill:#d7322f">A</text><text class="t" x="30" y="185" style="fill:#1f6fb5">B</text><text class="s" x="155" y="215">equilibrium</text>
  </g>
  <g transform="translate(400 70)">
    <text class="k" x="150" y="0">(b) reactant less than product</text>
    <path d="M20 200 V20 M20 200 H290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M20 40 C 80 40, 110 150, 290 150" fill="none" stroke="#d7322f" stroke-width="2.5"/>
    <path d="M20 190 C 80 190, 110 70, 290 70" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
    <path d="M150 20 V200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="t" x="30" y="35" style="fill:#d7322f">A</text><text class="t" x="30" y="185" style="fill:#1f6fb5">B</text><text class="s" x="155" y="215">equilibrium</text>
  </g>
  <g transform="translate(740 70)">
    <text class="k" x="150" y="0">(c) reactant more than product</text>
    <path d="M20 200 V20 M20 200 H290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M20 40 C 80 40, 110 80, 290 80" fill="none" stroke="#d7322f" stroke-width="2.5"/>
    <path d="M20 190 C 80 190, 110 150, 290 150" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
    <path d="M150 20 V200" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="t" x="30" y="35" style="fill:#d7322f">A</text><text class="t" x="30" y="185" style="fill:#1f6fb5">B</text><text class="s" x="155" y="215">equilibrium</text>
  </g>
  <text class="s" x="600" y="312">concentration against time for A gives B (Figure 8.1): after equilibrium the concentrations stay constant, equal or not</text>
  <!-- rate graph -->
  <g transform="translate(60 350)">
    <text class="k" x="170" y="0">rates for H2O + CO gives H2 + CO2</text>
    <path d="M20 200 V20 M20 200 H330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M20 40 C 90 40, 130 120, 330 120" fill="none" stroke="#d7322f" stroke-width="2.5"/>
    <path d="M20 198 C 90 198, 130 120, 330 120" fill="none" stroke="#1f6fb5" stroke-width="2.5"/>
    <text class="t" x="30" y="35" style="fill:#d7322f">forward: fastest at the start, slows</text>
    <text class="t" x="110" y="190" style="fill:#1f6fb5">reverse: starts at zero, grows</text>
    <text class="t" x="200" y="112">equal rates: equilibrium</text>
    <text class="s" x="175" y="222">time</text>
  </g>
  <!-- closed vs open -->
  <g transform="translate(460 350)">
    <text class="k" x="150" y="0">closed system: equilibrium (Figure 8.2a)</text>
    <rect x="60" y="30" width="180" height="150" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="2.5"/>
    <rect x="70" y="140" width="160" height="35" fill="#e8dff7"/><text class="s" x="150" y="163">CaCO3(s) and CaO(s)</text>
    <g fill="#1f6fb5"><circle cx="100" cy="70" r="5"/><circle cx="150" cy="55" r="5"/><circle cx="200" cy="80" r="5"/><circle cx="125" cy="105" r="5"/><circle cx="180" cy="115" r="5"/></g>
    <text class="s" x="150" y="48" style="fill:#1f6fb5">CO2(g) kept in</text>
    <text class="s" x="150" y="205">CaCO3 gives and takes back CO2: both rates equal</text>
  </g>
  <g transform="translate(820 350)">
    <text class="k" x="150" y="0">open system: no equilibrium (Figure 8.2b)</text>
    <path d="M60 30 V180 H240 V30" fill="#f9fafb" stroke="#4b5563" stroke-width="2.5"/>
    <rect x="70" y="140" width="160" height="35" fill="#e8dff7"/><text class="s" x="150" y="163">CaCO3(s) and CaO(s)</text>
    <g fill="#1f6fb5"><circle cx="110" cy="40" r="5"/><circle cx="170" cy="20" r="5"/><circle cx="140" cy="10" r="5"/></g>
    <path d="M150 90 V15" stroke="#1f6fb5" stroke-width="2" marker-end="url(#a)"/>
    <text class="s" x="150" y="205">CO2 escapes, so CaCO3 decomposes completely</text>
  </g>
  <text class="s" x="600" y="610">Equilibrium needs a reversible reaction in a closed vessel; at the microscopic level molecules keep reacting both ways at equal rates.</text>
</svg>
