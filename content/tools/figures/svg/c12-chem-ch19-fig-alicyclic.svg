<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="260" fill="#ffffff"/>
  <!-- The book's small scheme on p39: Aliphatic + Cyclic joined to Alicyclic. -->
  <rect x="190.0" y="20.0" width="520.0" height="220.0" rx="16" stroke="#b59a00" stroke-width="2.5" fill="#fff6b8"/>
  <ellipse cx="330.0" cy="80.0" rx="105.0" ry="36.0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <text x="330.0" y="91.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Aliphatic</tspan></text>
  <text x="450.0" y="91.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">+</tspan></text>
  <ellipse cx="570.0" cy="80.0" rx="95.0" ry="36.0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <text x="570.0" y="91.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Cyclic</tspan></text>
  <line x1="450.0" y1="136.0" x2="450.0" y2="160.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330.0" y1="116.0" x2="330.0" y2="136.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="570.0" y1="116.0" x2="570.0" y2="136.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330.0" y1="136.0" x2="570.0" y2="136.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="360.0" y="160.0" width="180.0" height="58.0" rx="0" stroke="#14181f" stroke-width="2.5" fill="#ffffff"/>
  <text x="450.0" y="200.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Alicyclic</tspan></text>
</svg>
