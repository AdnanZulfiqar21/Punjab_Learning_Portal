<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="550" fill="#ffffff"/>
  <!-- Original drawing after Figure 12.6 of the Class XI Physics textbook (PDF page 269): number of beta particles against kinetic energy, a continuous curve that starts part-way up the axis, peaks at low energy and tails to zero at the maximum energy. -->
