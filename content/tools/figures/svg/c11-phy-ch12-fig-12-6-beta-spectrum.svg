  <line x1="120.0" y1="470.0" x2="120.0" y2="50.0" stroke="#8a8f96" stroke-width="5" stroke-linecap="round"/>
  <path d="M830.7 484.9 L852.0 470.0 L830.7 455.1" stroke="#8a8f96" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134.9 69.3 L120.0 48.0 L105.1 69.3" stroke="#8a8f96" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86.0" y="268.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400" transform="rotate(-90 86.0 268.0)">No. of &#946;-particles (N)</text>
  <text x="485.0" y="520.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="400">Kinetic Energy (eV)</text>
  <path d="M120 223 C150 140, 195 94, 248 94 C318 94, 340 182, 398 300 C453 410, 560 462, 782 467" stroke="#3d7cc9" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
