<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Fig 13.2 with the derivation of topic 13.3: a molecule of mass m moving with velocity vx in a cube of side L rebounds from a wall, changing its momentum by 2mvx every 2L/vx seconds; summing over N molecules and using &lt;v2&gt; = 3&lt;vx2&gt; gives PV = (1/3)Nm&lt;v2&gt;. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Pressure of a gas from molecular collisions</text>
  <rect x="15.0" y="55.0" width="420.0" height="475.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">a molecule in a cube (Fig 13.2)</text>
  <path d="M300.0 210.0 L390.0 140.0 L390.0 370.0 L300.0 440.0 Z" stroke="#d98b2b" stroke-width="2" fill="#fed7aa" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="70.0" y="210.0" width="230.0" height="230.0" rx="0" stroke="#14181f" stroke-width="2" fill="none"/>
  <path d="M70.0 210.0 L160.0 140.0 L390.0 140.0 L300.0 210.0 Z" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="160.0" y1="140.0" x2="160.0" y2="370.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="160.0" y1="370.0" x2="390.0" y2="370.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="440.0" x2="160.0" y2="370.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="200.0" cy="320.0" r="10.0" stroke="#1f6fb5" stroke-width="2" fill="#93c5fd"/>
  <text x="184.0" y="325.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">m</text>
  <line x1="212.0" y1="314.0" x2="307.0" y2="314.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M315.0 314.0 L305.9 318.2 L305.9 309.8 Z" fill="#d7322f"/>
  <text x="264.0" y="304.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">v</tspan><tspan dy="4.8" font-size="10.5">x</tspan></text>
  <line x1="315.0" y1="332.0" x2="220.0" y2="332.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212.0 332.0 L221.1 327.8 L221.1 336.2 Z" fill="#1f6fb5"/>
  <text x="264.0" y="356.0" font-size="15" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">-v</tspan><tspan dy="4.8" font-size="10.5">x</tspan></text>
  <text x="185.0" y="466.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">L</text>
  <text x="56.0" y="325.0" font-size="16" fill="#14181f" text-anchor="end" font-weight="700">L</text>
  <text x="398.0" y="250.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">shaded</text>
  <text x="398.0" y="265.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">wall</text>
  <text x="225.0" y="490.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">elastic collision: the molecule returns</text>
  <text x="225.0" y="507.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">with the same speed, reversed</text>
  <rect x="450.0" y="55.0" width="435.0" height="475.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="667.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the steps</text>
  <text x="470.0" y="105.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">change in momentum at the wall</text>
  <text x="470.0" y="133.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">dp = -mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-5.4"> - mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-5.4"> = -2mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan></text>
  <text x="470.0" y="175.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">time between hits on the same wall</text>
  <text x="470.0" y="203.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">t = 2L / v</tspan><tspan dy="5.4" font-size="11.9">x</tspan></text>
  <text x="470.0" y="245.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">force from one molecule</text>
  <text x="470.0" y="273.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">F = 2mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-5.4"> / (2L/v</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-5.4">) = mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-12.6" font-size="11.9">2</tspan><tspan dy="7.1">/L</tspan></text>
  <text x="470.0" y="315.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">pressure from one molecule</text>
  <text x="470.0" y="343.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">P = F/L</tspan><tspan dy="-7.1" font-size="11.9">2</tspan><tspan dy="7.1"> = mv</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-12.6" font-size="11.9">2</tspan><tspan dy="7.1">/V</tspan></text>
  <text x="470.0" y="385.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">N molecules, mean square speed</text>
  <text x="470.0" y="413.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">P = Nm&lt;v</tspan><tspan dy="5.4" font-size="11.9">x</tspan><tspan dy="-12.6" font-size="11.9">2</tspan><tspan dy="7.1">&gt;/V</tspan></text>
  <text x="470.0" y="455.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700"><tspan dy="0.0">random motion: &lt;v</tspan><tspan dy="-5.5" font-size="9.1">2</tspan><tspan dy="5.5">&gt; = 3&lt;v</tspan><tspan dy="4.2" font-size="9.1">x</tspan><tspan dy="-9.6" font-size="9.1">2</tspan><tspan dy="5.5">&gt;</tspan></text>
  <text x="470.0" y="483.0" font-size="17" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">PV = (1/3) Nm&lt;v</tspan><tspan dy="-7.1" font-size="11.9">2</tspan><tspan dy="7.1">&gt;</tspan></text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
