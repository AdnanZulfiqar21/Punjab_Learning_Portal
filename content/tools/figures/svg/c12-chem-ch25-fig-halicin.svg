<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 25.4: the structure of halicin (an amino-thiadiazole joined through sulfur to a nitrothiazole) and the steps of the AI search: a model trained on about 2500 molecules picked out halicin, then screened over 100 million molecules in three days, giving 23 candidates of which 8 were active. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Halicin: an antibiotic found with AI</text>
  <line x1="270.0" y1="119.0" x2="226.3" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="226.3" y1="150.8" x2="243.0" y2="202.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="243.0" y1="202.2" x2="297.0" y2="202.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="297.0" y1="202.2" x2="313.7" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="313.7" y1="150.8" x2="270.0" y2="119.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="238.2" y1="161.1" x2="246.6" y2="186.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="293.4" y1="186.8" x2="301.8" y2="161.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="270.0" cy="119.0" r="11.0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <text x="270.0" y="125.0" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700"><tspan dy="0.0">S</tspan></text>
  <circle cx="243.0" cy="202.2" r="11.0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <text x="243.0" y="208.2" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <circle cx="297.0" cy="202.2" r="11.0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <text x="297.0" y="208.2" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <line x1="600.0" y1="119.0" x2="556.3" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="556.3" y1="150.8" x2="573.0" y2="202.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="573.0" y1="202.2" x2="627.0" y2="202.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="627.0" y1="202.2" x2="643.7" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="643.7" y1="150.8" x2="600.0" y2="119.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="568.2" y1="161.1" x2="576.6" y2="186.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="623.4" y1="186.8" x2="631.8" y2="161.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="600.0" cy="119.0" r="11.0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <text x="600.0" y="125.0" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700"><tspan dy="0.0">S</tspan></text>
  <circle cx="573.0" cy="202.2" r="11.0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <text x="573.0" y="208.2" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">N</tspan></text>
  <line x1="226.3" y1="150.8" x2="198.3" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="176.3" y="156.7" font-size="17" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">N</tspan></text>
  <line x1="313.7" y1="150.8" x2="423.0" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="447.0" y1="150.8" x2="556.3" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="435.0" y="156.7" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700"><tspan dy="0.0">S</tspan></text>
  <line x1="643.7" y1="150.8" x2="671.7" y2="150.8" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="695.7" y="156.7" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="450.0" y="265.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">halicin: a 1,3,4-thiadiazole ring (left) joined through S to a nitrothiazole ring (right)</text>
  <rect x="22.0" y="320.0" width="156.0" height="70.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="100.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">train a model on</text>
  <text x="100.0" y="370.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">about 2500 molecules</text>
  <line x1="180.0" y1="355.0" x2="188.6" y2="355.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M195.0 355.0 L187.7 358.4 L187.7 351.6 Z" fill="#14181f"/>
  <rect x="197.0" y="320.0" width="156.0" height="70.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="275.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">it predicts which kill</text>
  <text x="275.0" y="370.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">E. coli bacteria</text>
  <line x1="355.0" y1="355.0" x2="363.6" y2="355.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M370.0 355.0 L362.7 358.4 L362.7 351.6 Z" fill="#14181f"/>
  <rect x="372.0" y="320.0" width="156.0" height="70.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="450.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">halicin picked out:</text>
  <text x="450.0" y="370.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a new structure</text>
  <line x1="530.0" y1="355.0" x2="538.6" y2="355.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M545.0 355.0 L537.7 358.4 L537.7 351.6 Z" fill="#14181f"/>
  <rect x="547.0" y="320.0" width="156.0" height="70.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="625.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">screen over 100 million</text>
  <text x="625.0" y="370.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">molecules in 3 days</text>
  <line x1="705.0" y1="355.0" x2="713.6" y2="355.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M720.0 355.0 L712.7 358.4 L712.7 351.6 Z" fill="#14181f"/>
  <rect x="722.0" y="320.0" width="156.0" height="70.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="800.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">23 candidates; 8 active,</text>
  <text x="800.0" y="370.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">2 very powerful</text>
  <text x="450.0" y="425.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">halicin was predicted to have low toxicity to human cells and was found to kill</text>
  <text x="450.0" y="445.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">many disease-causing bacteria that resist existing antibiotics</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
