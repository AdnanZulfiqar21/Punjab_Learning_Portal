<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Arial, Helvetica, sans-serif">
  <!-- Think over! (C11-PHY, PDF p4): photograph of a round silicon wafer of computer chips held between a thumb (top right) and a finger (bottom right); flat drawing after the printed photograph. No photograph is reproduced. -->
