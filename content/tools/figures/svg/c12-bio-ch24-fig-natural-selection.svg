  <ellipse cx="385" cy="644" rx="30" ry="20" stroke="#333333" stroke-width="2.5" fill="#1e7a3e"/>
  <ellipse cx="115" cy="708" rx="30" ry="20" stroke="#333333" stroke-width="2.5" fill="#14532d"/>
  <ellipse cx="205" cy="708" rx="30" ry="20" stroke="#555555" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
  <line x1="187" y1="692" x2="223" y2="724" stroke="#d0322f" stroke-width="4" stroke-linecap="round"/>
