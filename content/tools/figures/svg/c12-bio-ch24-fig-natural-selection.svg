  <ellipse cx="795" cy="644" rx="30" ry="20" stroke="#333333" stroke-width="2.5" fill="#14532d"/>
  <ellipse cx="885" cy="644" rx="30" ry="20" stroke="#333333" stroke-width="2.5" fill="#1e7a3e"/>
  <ellipse cx="615" cy="708" rx="30" ry="20" stroke="#333333" stroke-width="2.5" fill="#14532d"/>
