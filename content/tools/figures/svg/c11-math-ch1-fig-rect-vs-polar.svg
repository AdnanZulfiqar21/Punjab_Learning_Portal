<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Times New Roman', Times, serif">
  <!-- Rectangular coordinate P(x, y) and Polar coordinate P(r, theta), two figures side by side (C11-MATH, PDF p19). Original drawing after the printed figure. -->
  <rect width="1200" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="580" height="560" fill="#FFFAC2"/>
  <rect x="620" y="0" width="580" height="560" fill="#FFFAC2"/>
  <line x1="80" y1="530" x2="80" y2="54" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M80 40 L89 60 L80 55 L71 60 Z" fill="#e0197d"/>
  <line x1="30" y1="470" x2="506" y2="470" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M520 470 L500 479 L505 470 L500 461 Z" fill="#e0197d"/>
  <line x1="80" y1="200" x2="360" y2="200" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="butt" stroke-dasharray="8 6"/>
  <line x1="360" y1="200" x2="360" y2="470" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="360" cy="200" r="7" fill="#1a1a1a"/>
  <text x="374" y="208" font-size="39.1" text-anchor="start" fill="#1a1a1a"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>)</text>
  <text x="310" y="64" font-size="39.1" text-anchor="middle" fill="#1a1a1a">Rectangular coordinate</text>
  <text x="66" y="506" font-size="39.1" text-anchor="end" fill="#1a1a1a" font-style="italic">O</text>
  <text x="505" y="506" font-size="39.1" text-anchor="middle" fill="#1a1a1a" font-style="italic">x</text>
  <text x="64" y="64" font-size="39.1" text-anchor="end" fill="#1a1a1a" font-style="italic">y</text>
  <line x1="720" y1="530" x2="720" y2="54" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M720 40 L729 60 L720 55 L711 60 Z" fill="#e0197d"/>
  <line x1="670" y1="470" x2="1156" y2="470" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M1170 470 L1150 479 L1155 470 L1150 461 Z" fill="#e0197d"/>
  <line x1="720" y1="470" x2="1030" y2="160" stroke="#1d9fe0" stroke-width="4" stroke-linecap="butt"/>
  <circle cx="1030" cy="160" r="8" fill="#1d9fe0"/>
  <text x="1044" y="166" font-size="39.1" text-anchor="start" fill="#1a1a1a"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">r</tspan>, θ)</text>
  <text x="950" y="64" font-size="39.1" text-anchor="middle" fill="#1a1a1a" font-weight="700">Polar coordinate</text>
  <text x="885" y="301" font-size="39.1" text-anchor="middle" fill="#1a1a1a" font-style="italic">r</text>
  <path d="M815 470 A95 95 0 0 0 793.5 409.9" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M787.2 402.8 L802.6 408.7 L795.1 410.8 L793 418.2 Z" fill="#1a1a1a"/>
  <text x="837" y="440" font-size="39.1" text-anchor="middle" fill="#1a1a1a">θ</text>
  <text x="706" y="506" font-size="39.1" text-anchor="end" fill="#1a1a1a" font-style="italic">O</text>
  <text x="1160" y="510" font-size="39.1" text-anchor="end" fill="#1a1a1a">Polar axis</text>
</svg>
