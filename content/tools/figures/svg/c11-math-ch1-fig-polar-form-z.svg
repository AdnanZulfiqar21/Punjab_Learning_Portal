<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" font-family="'Times New Roman', Times, serif">
  <!-- Polar form of z = x + iy (C11-MATH, PDF p20): A(r, theta) with x = r cos theta along OM and y = r sin theta along MA; OA = sqrt(x^2 + y^2). Original drawing after the printed figure. -->
  <rect width="1000" height="860" fill="#ffffff"/>
  <rect width="1000" height="860" fill="#FFFAC2"/>
  <line x1="44" y1="560" x2="946" y2="560" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M960 560 L940 569 L945 560 L940 551 Z" fill="#e0197d"/>
  <path d="M30 560 L50 551 L45 560 L50 569 Z" fill="#e0197d"/>
  <line x1="300" y1="826" x2="300" y2="50" stroke="#e0197d" stroke-width="3.5" stroke-linecap="butt"/>
  <path d="M300 36 L309 56 L300 51 L291 56 Z" fill="#e0197d"/>
  <path d="M300 840 L291 820 L300 825 L309 820 Z" fill="#e0197d"/>
  <line x1="300" y1="560" x2="640" y2="200" stroke="#1d9fe0" stroke-width="4.5" stroke-linecap="butt"/>
  <line x1="640" y1="200" x2="640" y2="560" stroke="#1d9fe0" stroke-width="4.5" stroke-linecap="butt"/>
  <text x="630" y="174" font-size="41.6" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">A</tspan> (<tspan font-style="italic">r</tspan>, θ)</text>
  <text x="654" y="350" font-size="46.8" text-anchor="start" fill="#1a1a1a"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">r</tspan> sin θ</text>
  <path d="M410 560 A110 110 0 0 0 383.1 488" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M375.5 480 L391.1 485.4 L383.7 487.8 L381.8 495.2 Z" fill="#1a1a1a"/>
  <text x="392" y="538" font-size="39.0" text-anchor="middle" fill="#1a1a1a">θ</text>
  <text x="286" y="600" font-size="49.4" text-anchor="end" fill="#1a1a1a" font-style="italic">O</text>
  <text x="470" y="600" font-size="39.0" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">x</tspan> = <tspan font-style="italic">r</tspan> cos θ</text>
  <text x="640" y="600" font-size="49.4" text-anchor="middle" fill="#1a1a1a" font-style="italic">M</text>
  <text x="760" y="600" font-size="49.4" text-anchor="middle" fill="#1a1a1a" font-style="italic">x</text>
  <text x="284" y="60" font-size="49.4" text-anchor="end" fill="#1a1a1a" font-style="italic">y</text>
  <g transform="rotate(-46.63657704161672 406.4 415.3)"><path d="M406.4 398.9 L414.8 394.2 L425.1 420.9 L435.4 370.8 L569.2 370.8" stroke="#1a1a1a" stroke-width="2" fill="none"/><text x="439.2" y="415.3" font-size="46.800000000000004" fill="#1a1a1a"><tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> + <tspan font-style="italic">y</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text></g>
</svg>
