<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.5 to 12.9: the skeleton as a stick figure with the axial and appendicular bones labelled, the vertebral groups and the rib cage. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f}
      .s{font-size:15px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:2;fill:none}
    </style>
  </defs>
  <text class="h" x="600" y="40">The human skeleton: 206 bones</text>
  <!-- axial skeleton in blue, appendicular in orange -->
  <circle cx="600" cy="110" r="45" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
  <path d="M575 125 q25 15 50 0" fill="none" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M600 155 V520" stroke="#1f6fb5" stroke-width="10"/>
  <g stroke="#1f6fb5" stroke-width="2" fill="none"><path d="M600 170 h-1 M600 190 h-1"/></g>
  <g stroke="#1f6fb5" stroke-width="4" fill="none"><path d="M600 220 q-60 10 -70 50 M600 220 q60 10 70 50 M600 250 q-70 10 -75 50 M600 250 q70 10 75 50 M600 280 q-70 10 -70 50 M600 280 q70 10 70 50 M600 310 q-60 10 -55 45 M600 310 q60 10 55 45"/></g>
  <rect x="588" y="215" width="24" height="130" rx="6" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
  <!-- pectoral girdle and arms -->
  <path d="M520 205 H680" stroke="#d98b2b" stroke-width="8"/>
  <path d="M520 205 q-40 90 -50 170 q-10 80 -20 160" fill="none" stroke="#d98b2b" stroke-width="8"/>
  <path d="M680 205 q40 90 50 170 q10 80 20 160" fill="none" stroke="#d98b2b" stroke-width="8"/>
  <g fill="#d98b2b"><circle cx="470" cy="375" r="7"/><circle cx="730" cy="375" r="7"/><circle cx="450" cy="535" r="9"/><circle cx="750" cy="535" r="9"/></g>
  <!-- pelvis and legs -->
  <path d="M540 520 q60 40 120 0 q10 40 -60 50 q-70 -10 -60 -50 z" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <path d="M565 560 q-15 120 -20 240 M635 560 q15 120 20 240" fill="none" stroke="#d98b2b" stroke-width="9"/>
  <path d="M545 800 q-5 40 -20 60 M655 800 q5 40 20 60" fill="none" stroke="#d98b2b" stroke-width="9"/>
  <g fill="#d98b2b"><circle cx="548" cy="680" r="8"/><circle cx="652" cy="680" r="8"/></g>
  <!-- labels axial left -->
  <text class="k" x="60" y="90">Axial skeleton (blue)</text>
  <text class="s" x="60" y="112">skull: 22 bones (8 cranial, 14 facial)</text>
  <text class="s" x="60" y="130">plus 6 ear ossicles and the hyoid</text>
  <path class="lead" d="M330 108 L553 108"/>
  <text class="s" x="60" y="200">vertebral column: 33 vertebrae</text><text class="s" x="60" y="218">7 cervical (atlas, axis), 12 thoracic,</text><text class="s" x="60" y="236">5 lumbar, 5 sacral (sacrum),</text><text class="s" x="60" y="254">4 coccygeal (coccyx)</text>
  <path class="lead" d="M300 228 L594 400"/>
  <text class="s" x="60" y="320">rib cage: 12 pairs of ribs and the</text><text class="s" x="60" y="338">sternum; 7 true pairs on their own</text><text class="s" x="60" y="356">costal cartilage, 3 false pairs on a</text><text class="s" x="60" y="374">shared one, 2 floating pairs</text>
  <path class="lead" d="M320 345 L530 300"/>
  <!-- labels appendicular right -->
  <text class="k" x="800" y="90">Appendicular skeleton (orange)</text>
  <text class="s" x="800" y="112">pectoral girdle: 2 clavicles, 2 scapulae</text>
  <path class="lead" d="M795 108 L690 200"/>
  <text class="s" x="800" y="180">forelimb (30 bones): humerus, ulna</text><text class="s" x="800" y="198">(inner) and radius (thumb side),</text><text class="s" x="800" y="216">8 carpals, 5 metacarpals,</text><text class="s" x="800" y="234">14 phalanges (3 per finger, 2 in thumb)</text>
  <path class="lead" d="M795 210 L735 300"/>
  <text class="s" x="800" y="480">pelvic girdle: two hip bones, each of</text><text class="s" x="800" y="498">ilium, ischium and pubis fused at the</text><text class="s" x="800" y="516">acetabulum; joined in front at the</text><text class="s" x="800" y="534">pubic symphysis</text>
  <path class="lead" d="M795 505 L665 535"/>
  <text class="s" x="800" y="620">hindlimb (30 bones): femur (head in the</text><text class="s" x="800" y="638">acetabulum), patella, tibia (shin) and</text><text class="s" x="800" y="656">fibula, 7 tarsals, 5 metatarsals,</text><text class="s" x="800" y="674">14 phalanges (3 per toe, 2 in the big toe)</text>
  <path class="lead" d="M795 650 L660 700"/>
  <text class="s" x="60" y="620">joints: shoulder (glenoid cavity),</text><text class="s" x="60" y="638">elbow, wrist (upper carpals with the</text><text class="s" x="60" y="656">radius), hip, knee, ankle</text>
  <text class="s" x="60" y="720">bipedal posture: S-shaped spine, short</text><text class="s" x="60" y="738">broad pelvis, femur angled in to the</text><text class="s" x="60" y="756">knee, large buttock and calf muscles,</text><text class="s" x="60" y="774">arched foot, short non-grasping toes</text>
  <text class="s" x="600" y="890" text-anchor="middle">Stick-figure schematic, not to scale; cranial bones: frontal, occipital, ethmoid, sphenoid, paired parietal and temporal.</text>
</svg>
