<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.2 to 10.9 and topics 10.1 to 10.4: the force on a current-carrying conductor, Fleming's left-hand rule, magnetic flux and flux density, and flux linkage. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Force on a current in a magnetic field, magnetic flux and flux linkage</text>
  <rect x="50" y="55" width="360" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Force on a conductor (10.1)</text>
  <rect x="70" y="110" width="50" height="130" rx="4" fill="#f8c8b8" stroke="#d7322f"/><text class="k" x="95" y="182">N</text>
  <rect x="340" y="110" width="50" height="130" rx="4" fill="#bcdcf0" stroke="#1f6fb5"/><text class="k" x="365" y="182">S</text>
  <path d="M122 122 C 180 122, 200 116, 230 116 C 260 116, 280 122, 336 122" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M122 148 C 180 148, 200 138, 230 138 C 260 138, 280 148, 336 148" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M122 175 C 180 175, 200 175, 230 175 C 260 175, 280 175, 336 175" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M122 202 C 180 202, 200 212, 230 212 C 260 212, 280 202, 336 202" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M122 228 C 180 228, 200 234, 230 234 C 260 234, 280 228, 336 228" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="230" cy="175" r="22" fill="none" stroke="#0f7a62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="230" cy="175" r="11" fill="#ffffff" stroke="#14181f" stroke-width="2"/>
  <circle cx="230" cy="175" r="3" fill="#14181f"/>
  <path d="M230 160 L230 100" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/>
  <text class="l" x="238" y="108" style="fill:#d7322f">F</text>
  <text class="r" x="250" y="146">weaker</text>
  <text class="r" x="250" y="214">stronger</text>
  <text class="r" x="120" y="258">B from N to S; current out of the page</text>
  <g class="r">
    <text x="70" y="280">the wire's field cancels B above it and adds below,</text>
    <text x="70" y="294">so the wire is pushed towards the weaker side</text>
    <text x="70" y="308">F = BIL (10.1); BIL sin theta (10.2); I L x B (10.3)</text>
    <text x="70" y="322">maximum at 90 deg, zero along the field</text>
    <text x="70" y="336">B = F/IL: 1 T = 1 N A^-1 m^-1</text>
    <text x="70" y="350">Ex 10.1: 20.0 cm, 10.0 A, 0.30 T, 40 deg: F = 0.39 N</text>
  </g>
  <rect x="430" y="55" width="340" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Fleming's left-hand rule (Fig. 10.3)</text>
  <path d="M600 225 L600 115" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/>
  <text class="l" x="610" y="122" style="fill:#d7322f">thumb: force</text>
  <path d="M600 225 L720 225" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/>
  <text class="l" x="660" y="250" style="fill:#1f6fb5">first finger: field</text>
  <path d="M600 225 L520 295" stroke="#0f7a62" stroke-width="3" marker-end="url(#g)"/>
  <text class="l" x="456" y="312" style="fill:#0f7a62">second finger: current</text>
  <circle cx="600" cy="225" r="5" fill="#14181f"/>
  <g class="r">
    <text x="450" y="336">the three are at right angles to each other; or curl the</text>
    <text x="450" y="350">right-hand fingers from current to field: thumb gives F</text>
  </g>
  <rect x="790" y="55" width="360" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Magnetic flux and flux density (10.2)</text>
  <path d="M815 110 L905 110" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M815 140 L905 140" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M815 170 L905 170" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M815 200 L905 200" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M860 193 L860 117" stroke="#0f7a62" stroke-width="5"/>
  <path d="M860 155 L892 155" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="814" y="232">theta = 0: phi = BA</text>
  <path d="M925 110 L1015 110" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M925 140 L1015 140" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M925 170 L1015 170" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M925 200 L1015 200" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M937 174 L1003 136" stroke="#0f7a62" stroke-width="5"/>
  <path d="M970 155 L986 127" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="924" y="232">theta = 60 deg: BA/2</text>
  <path d="M1035 110 L1125 110" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M1035 140 L1125 140" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M1035 170 L1125 170" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M1035 200 L1125 200" stroke="#d7322f" stroke-width="1.3" marker-end="url(#p)"/>
  <path d="M1042 155 L1118 155" stroke="#0f7a62" stroke-width="5"/>
  <path d="M1080 155 L1080 123" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="1034" y="232">theta = 90 deg: 0</text>
  <g class="r">
    <text x="810" y="256">phi = BA cos theta (10.5) = B.A (10.6); a scalar; theta is</text>
    <text x="810" y="270">between B and the normal (blue) to the area</text>
    <text x="810" y="284">unit: weber, 1 Wb = 1 N m A^-1; B = phi/A (10.4) is the</text>
    <text x="810" y="298">flux density: 1 T = 1 Wb m^-2 = 1 N A^-1 m^-1</text>
    <text x="810" y="312">Ex 10.2: 25 x 20 cm loop in 1.2 T, theta = 60, 45, 30 deg,</text>
    <text x="810" y="326">give 3.0, 4.2 and 5.2 x 10^-2 Wb</text>
  </g>
  <rect x="50" y="405" width="1100" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="433">Magnetic flux linkage (10.3) and a current made of moving charges (10.4)</text>
  <ellipse cx="120" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="142" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="164" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="186" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="208" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="230" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <ellipse cx="252" cy="520" rx="12" ry="50" fill="none" stroke="#d98b2b" stroke-width="2.5"/>
  <path d="M80 485 L290 485" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M80 505 L290 505" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M80 525 L290 525" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <path d="M80 545 L290 545" stroke="#d7322f" stroke-width="1.2" marker-end="url(#p)"/>
  <text class="r" x="90" y="594">N turns, each with flux phi_B</text>
  <g class="t">
    <text x="330" y="448">flux linkage = N phi_B (10.7): the flux through one turn times the number of turns; central to</text>
    <text x="330" y="465">transformers, motors, generators and inductors, and to Faraday's law of induction</text>
    <text x="330" y="499">a current is moving charge: N charges q crossing a length L in t = L/v give I = Nqv/L (10.8);</text>
    <text x="330" y="516">with F = I L x B (10.9) this becomes F = Nq v x B (10.12), so one charge feels F = q v x B (10.13),</text>
    <text x="330" y="533">F = qvB sin theta (10.14): largest across the field, zero along it</text>
    <text x="330" y="550">credit and ATM cards store data in a strip of tiny magnetic domains held in a resin binder</text>
  </g>
  <g class="r">
    <text x="70" y="640">magnetic field lines, like electric ones, never cross; they push each other apart (Do You Know)</text>
    <text x="70" y="655">lodestone (magnetite, Fe3O4), found in ancient Turkiye, attracts iron and steel and aligns with the Earth's poles: the first compass</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
