  <rect x="30.0" y="295.0" width="250.0" height="34.0" rx="6" stroke="#d98b2b" stroke-width="1.8" fill="#fff1dc"/>
  <text x="155.0" y="317.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">liver: hepatic necrosis</text>
  <line x1="282.0" y1="312.0" x2="425.0" y2="270.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
