  <line x1="618.0" y1="422.0" x2="488.0" y2="470.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="488.0" cy="470.0" r="4.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <rect x="560.0" y="62.0" width="290.0" height="34.0" rx="6" stroke="#7c3aed" stroke-width="1.8" fill="#efe7fd"/>
  <text x="705.0" y="84.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">brain: Alzheimer's disease</text>
  <line x1="558.0" y1="79.0" x2="476.0" y2="112.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="470.0" cy="115.0" r="4.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <rect x="30.0" y="62.0" width="250.0" height="60.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="155.0" y="87.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">pesticides and heavy metals</text>
  <text x="155.0" y="105.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">(the figure shows Cd, Pb, Cu, Zn)</text>
  <text x="450.0" y="560.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Simple outline, not to scale; the book's figure does not say which effect comes from which substance.</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
