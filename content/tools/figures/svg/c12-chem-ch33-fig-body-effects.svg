  <rect x="620.0" y="240.0" width="255.0" height="34.0" rx="6" stroke="#7c3aed" stroke-width="1.8" fill="#efe7fd"/>
  <text x="747.0" y="262.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">blood: intravascular haemolysis</text>
  <line x1="618.0" y1="257.0" x2="360.0" y2="300.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
