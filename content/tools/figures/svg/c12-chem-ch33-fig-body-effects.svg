  <text x="155.0" y="207.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">heart: cardiac failure</text>
  <line x1="282.0" y1="202.0" x2="465.0" y2="215.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="465.0" cy="215.0" r="4.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <rect x="30.0" y="240.0" width="250.0" height="34.0" rx="6" stroke="#d98b2b" stroke-width="1.8" fill="#fff1dc"/>
  <text x="155.0" y="262.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">lungs: lung cancer</text>
  <line x1="282.0" y1="257.0" x2="425.0" y2="205.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
