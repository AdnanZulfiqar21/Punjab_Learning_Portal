  <text x="747.0" y="317.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">gut: vomiting, diarrhoea</text>
  <line x1="618.0" y1="312.0" x2="455.0" y2="310.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
