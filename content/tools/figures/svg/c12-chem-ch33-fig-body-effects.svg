  <text x="155.0" y="372.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ovaries: ovarian cancer</text>
  <line x1="282.0" y1="367.0" x2="440.0" y2="345.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
