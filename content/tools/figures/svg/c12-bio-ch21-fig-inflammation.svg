<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="578" fill="#ffffff"/>
  <!-- Original diagram after Figure 21.9: injured cells release histamine and prostaglandins, the capillary widens and leaks, causing redness, swelling and warmth, and phagocytes leave the blood to eat the microbes. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The inflammatory response</text>
  <path d="M40 160 L860 160" stroke="#a16207" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M380 160 L420 230 L460 160" stroke="#a16207" stroke-width="3" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="420.0" y="120.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">injury lets microbes in</text>
  <rect x="396.2" y="195.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <rect x="421.2" y="210.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <rect x="411.2" y="245.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <circle cx="300.0" cy="240.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <circle cx="305.1" cy="238.3" r="11.9" stroke="#be185d" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="340.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="350.0" cy="240.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="360.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="370.0" cy="240.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="380.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="540.0" cy="240.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <circle cx="545.1" cy="238.3" r="11.9" stroke="#be185d" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="580.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="590.0" cy="240.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="600.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="610.0" cy="240.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="620.0" cy="230.0" r="3.5" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <text x="40.0" y="255.0" font-size="12" fill="#be185d" text-anchor="start" font-weight="700">injured cells release histamine</text>
  <line x1="248.6" y1="250.0" x2="266.0" y2="240.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="266.0" cy="240.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="40.0" y="270.0" font-size="12" fill="#be185d" text-anchor="start" font-weight="700">and prostaglandins</text>
  <path d="M40 380 Q300 360 420 380 T860 380" stroke="#d7322f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40 460 Q300 480 420 460 T860 460" stroke="#d7322f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="80.0" y="425.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">widened capillary: more blood flow</text>
  <line x1="480.0" y1="378.0" x2="471.3" y2="336.3" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M470.0 330.0 L474.8 336.4 L468.2 337.8 Z" fill="#1f6fb5"/>
  <line x1="560.0" y1="378.0" x2="551.3" y2="336.3" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M550.0 330.0 L554.8 336.4 L548.2 337.8 Z" fill="#1f6fb5"/>
  <text x="600.0" y="345.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">leaky wall: fluid out (swelling)</text>
  <circle cx="640.0" cy="420.0" r="18.0" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
  <circle cx="700.0" cy="420.0" r="18.0" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
  <circle cx="760.0" cy="420.0" r="18.0" stroke="#0e7490" stroke-width="2" fill="#ecfeff"/>
  <line x1="700.0" y1="396.0" x2="643.2" y2="295.6" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
  <path d="M640.0 290.0 L646.5 294.6 L640.6 298.0 Z" fill="#0e7490"/>
  <text x="596.0" y="270.0" font-size="12" fill="#0e7490" text-anchor="start" font-weight="700">phagocytes squeeze out and eat microbes</text>
  <rect x="40.0" y="495.0" width="820.0" height="52.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="518.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">signs: redness, swelling, warmth (heat slows microbes, speeds white cells)</text>
  <text x="450.0" y="538.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">pus = dead neutrophils, broken tissue cells and dead microbes</text>
  <text x="450.0" y="569" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
