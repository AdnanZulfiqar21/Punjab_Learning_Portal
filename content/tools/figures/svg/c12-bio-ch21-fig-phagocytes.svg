<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 21.4 and 21.5: a macrophage engulfing bacteria with its pseudopodia and digesting them, and a neutrophil killing by phagocytosis, by releasing anti-microbial chemicals and by casting a net of DNA fibres. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Germ-killer cells: macrophages and neutrophils</text>
  <rect x="15.0" y="55.0" width="400.0" height="490.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="215.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">macrophage (from a monocyte)</text>
  <path d="M95 290 Q75 200 155 170 Q205 130 255 180 L325 140 L305 210 Q365 270 325 350 Q275 420 185 400 Q105 380 95 290 Z" stroke="#b45309" stroke-width="2.5" fill="#ffedd5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="185.0" cy="310.0" r="32.0" stroke="#b45309" stroke-width="2" fill="#ffffff"/>
  <circle cx="255.0" cy="260.0" r="22.0" stroke="#0f7a62" stroke-width="1.5" fill="#dcfce7"/>
  <rect x="247.3" y="255.8" width="15.4" height="8.4" rx="4.199999999999999" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <circle cx="275.0" cy="280.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#ddd6fe"/>
  <circle cx="267.0" cy="240.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#ddd6fe"/>
  <circle cx="285.0" cy="254.0" r="6.0" stroke="#7c3aed" stroke-width="1" fill="#ddd6fe"/>
  <rect x="332.0" y="116.0" width="22.0" height="12.0" rx="6" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <rect x="354.0" y="164.0" width="22.0" height="12.0" rx="6" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <text x="40.0" y="470.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">engulfs bacteria by endocytosis and</text>
  <text x="40.0" y="490.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">digests them with lysosome enzymes;</text>
  <text x="40.0" y="510.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">some stay fixed in lungs, liver, spleen, brain</text>
  <rect x="430.0" y="55.0" width="455.0" height="490.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="657.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">neutrophil: three ways to kill</text>
  <text x="460.0" y="125.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">1. phagocytosis</text>
  <circle cx="520.0" cy="185.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <circle cx="508.0" cy="179.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="520.0" cy="189.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="532.0" cy="179.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <path d="M554 171 q30 -10 40 10 q-10 22 -40 14" stroke="#be185d" stroke-width="2" fill="#fce7f3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="591.2" y="176.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <text x="460.0" y="255.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">2. releases anti-microbial chemicals</text>
  <circle cx="520.0" cy="315.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <circle cx="508.0" cy="309.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="520.0" cy="319.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="532.0" cy="309.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="580.0" cy="299.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="594.0" cy="321.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="584.0" cy="341.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <circle cx="610.0" cy="309.0" r="4.0" stroke="#d98b2b" stroke-width="1" fill="#d98b2b"/>
  <rect x="670.1" y="309.6" width="19.8" height="10.8" rx="5.4" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <text x="460.0" y="380.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">3. throws out a net of DNA fibres</text>
  <circle cx="520.0" cy="440.0" r="34.0" stroke="#be185d" stroke-width="2" fill="#fce7f3"/>
  <circle cx="508.0" cy="434.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="520.0" cy="444.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="532.0" cy="434.0" r="7.0" stroke="#be185d" stroke-width="1.2" fill="#ffffff"/>
  <path d="M552 440 q40 -40 120 -30" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 440 q52 -24 126 -16" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 440 q64 -8 132 -2" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 440 q76 8 138 12" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 440 q88 24 144 26" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 440 q100 40 150 40" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="681.2" y="425.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
  <rect x="711.2" y="455.2" width="17.6" height="9.6" rx="4.800000000000001" stroke="#15803d" stroke-width="1.5" fill="#86efac"/>
