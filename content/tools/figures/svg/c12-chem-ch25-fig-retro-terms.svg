<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="590" fill="#ffffff"/>
  <!-- Original diagram after Figures 25.1 and 25.2: retrosynthesis works back from the target molecule to starting materials and synthesis works forward; for aniline, FGI gives nitrobenzene, whose C-N disconnection gives a phenyl anion synthon (benzene as SE) and NO2+ (nitric acid as SE). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Synthesis and retrosynthesis</text>
  <rect x="15.0" y="55.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">two directions of planning (after Figure 25.1)</text>
  <rect x="70.0" y="118.0" width="220.0" height="50.0" rx="10" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="180.0" y="149.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">target molecule (TM)</text>
  <rect x="610.0" y="118.0" width="220.0" height="50.0" rx="10" stroke="#14181f" stroke-width="2" fill="#f1f5f9"/>
  <text x="720.0" y="149.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">starting materials</text>
  <line x1="305.0" y1="139.0" x2="433.0" y2="139.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="305.0" y1="147.0" x2="433.0" y2="147.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M427 131 L445 143 L427 155" stroke="#db2777" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="455.0" y1="139.0" x2="583.0" y2="139.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="455.0" y1="147.0" x2="583.0" y2="147.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M577 131 L595 143 L577 155" stroke="#db2777" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="108.0" font-size="13" fill="#db2777" text-anchor="middle" font-weight="700">retrosynthesis: break the TM down on paper</text>
  <line x1="610.0" y1="185.0" x2="298.8" y2="185.0" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M290.0 185.0 L300.0 180.4 L300.0 189.6 Z" fill="#1f6fb5"/>
  <text x="450.0" y="210.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">synthesis: build the TM up in the laboratory</text>
  <rect x="15.0" y="240.0" width="870.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="270.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the terms, using aniline as the target (after Figure 25.2)</text>
  <path d="M85.0 354.0 L107.5 367.0 L107.5 393.0 L85.0 406.0 L62.5 393.0 L62.5 367.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="85.0" cy="380.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="85.0" y1="354.0" x2="85.0" y2="339.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="85.0" y="332.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <text x="85.0" y="430.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">TM: aniline</text>
  <line x1="125.0" y1="376.0" x2="193.0" y2="376.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="125.0" y1="384.0" x2="193.0" y2="384.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M187 368 L205 380 L187 392" stroke="#db2777" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="165.0" y="366.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">FGI</text>
  <path d="M250.0 354.0 L272.5 367.0 L272.5 393.0 L250.0 406.0 L227.5 393.0 L227.5 367.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="250.0" cy="380.0" r="15.1" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="250.0" y1="354.0" x2="250.0" y2="339.7" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="250.0" y="332.7" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="4.5" font-size="9.8">2</tspan></text>
  <line x1="244.0" y1="346.0" x2="258.0" y2="358.0" stroke="#d7322f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="250.0" y="430.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">nitrobenzene</text>
  <line x1="290.0" y1="376.0" x2="378.0" y2="376.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="290.0" y1="384.0" x2="378.0" y2="384.0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M372 368 L390 380 L372 392" stroke="#db2777" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="340.0" y="366.0" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">disconnection</text>
  <path d="M450.0 318.0 L469.1 329.0 L469.1 351.0 L450.0 362.0 L430.9 351.0 L430.9 329.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="450.0" cy="340.0" r="12.8" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <circle cx="478.0" cy="314.0" r="8.0" stroke="#d7322f" stroke-width="1.5" fill="#ffffff"/>
  <line x1="474.0" y1="314.0" x2="482.0" y2="314.0" stroke="#d7322f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="510.0" y="346.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">synthon A</text>
  <text x="450.0" y="432.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NO</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-13.3" font-size="12.6">+</tspan></text>
  <text x="510.0" y="438.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">synthon B</text>
  <text x="630.0" y="346.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">=</text>
  <text x="630.0" y="438.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">=</text>
  <path d="M720.0 318.0 L739.1 329.0 L739.1 351.0 L720.0 362.0 L700.9 351.0 L700.9 329.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="720.0" cy="340.0" r="12.8" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <text x="800.0" y="346.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">benzene (SE)</text>
  <text x="720.0" y="438.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HNO</tspan><tspan dy="5.8" font-size="12.6">3</tspan></text>
  <text x="800.0" y="438.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">nitric acid (SE)</text>
  <text x="450.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">synthon: an (often ionic) fragment from a disconnection; synthetic equivalent (SE): the real reagent used for it</text>
  <text x="450.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">FGI: changing one functional group into another; the red slash marks the bond that is disconnected</text>
  <text x="450.0" y="581" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
