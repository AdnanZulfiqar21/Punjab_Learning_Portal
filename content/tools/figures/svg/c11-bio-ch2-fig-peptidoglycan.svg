  <text x="735.0" y="98.0" font-size="14" fill="#be185d" text-anchor="start" font-weight="700">glycan chain:</text>
  <text x="735.0" y="116.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">long sugar</text>
  <text x="735.0" y="132.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">(polysaccharide)</text>
  <text x="735.0" y="150.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">chain</text>
  <text x="735.0" y="285.0" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="700">peptide</text>
  <text x="735.0" y="303.0" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="700">cross-link:</text>
  <text x="735.0" y="321.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">short chain of</text>
  <text x="735.0" y="337.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">amino acids</text>
  <text x="450.0" y="410.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">Long glycan chains are tied together by short peptides into one strong mesh;</text>
  <text x="450.0" y="432.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">it gives the bacterium its shape and stops it bursting.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
