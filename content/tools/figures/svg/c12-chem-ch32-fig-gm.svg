  <circle cx="575.0" cy="160.0" r="34.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <circle cx="582.0" cy="164.0" r="12.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
