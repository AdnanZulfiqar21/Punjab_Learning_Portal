  <ellipse cx="796.0" cy="166.0" rx="18.0" ry="8.0" stroke="#0f7a62" stroke-width="1.5" fill="#86efac" transform="rotate(-25 796.0 166.0)"/>
  <circle cx="778.0" cy="124.0" r="9.0" stroke="#d7322f" stroke-width="1.5" fill="#fca5a5"/>
  <text x="778.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the plant makes the</text>
  <text x="778.0" y="243.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">new protein: it has</text>
  <text x="778.0" y="261.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the new trait</text>
  <rect x="15.0" y="315.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="345.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">examples and concerns</text>
  <text x="35.0" y="374.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">Bt cotton makes its own pesticide; Golden Rice is engineered with beta-carotene to help prevent blindness.</text>
  <text x="35.0" y="396.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">Concerns: genes spreading to wild plants, herbicide-resistant 'superweeds', resistant insects,</text>
  <text x="35.0" y="418.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">and long-term effects on human health and biodiversity.</text>
  <text x="450.0" y="476" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
