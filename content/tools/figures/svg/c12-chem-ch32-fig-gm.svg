  <path d="M459.0 185.0 L451.7 188.4 L451.7 181.6 Z" fill="#14181f"/>
  <rect x="461.0" y="70.0" width="198.0" height="230.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
