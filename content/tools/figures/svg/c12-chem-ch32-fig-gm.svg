  <text x="560.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a gene gun or a carrier</text>
  <text x="560.0" y="243.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">bacterium puts it into</text>
  <text x="560.0" y="261.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the plant's DNA</text>
