  <text x="124.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a useful gene, e.g. pest</text>
  <text x="124.0" y="243.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">resistance from a bacterium</text>
