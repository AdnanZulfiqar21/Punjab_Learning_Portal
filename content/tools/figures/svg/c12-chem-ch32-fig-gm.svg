  <line x1="359.0" y1="173.0" x2="317.0" y2="130.0" stroke="#14181f" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="377.0" y="126.0" width="26.0" height="12.0" rx="3" stroke="#d7322f" stroke-width="1.6" fill="#fca5a5"/>
  <text x="342.0" y="225.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the gene is cut out</text>
  <text x="342.0" y="243.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">of the organism's DNA</text>
