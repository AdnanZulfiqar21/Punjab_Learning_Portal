<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 1.22: a bony fish in side view with fins, operculum and swim bladder. -->
  <defs>
    <style>
      .t{font-size:30px;font-weight:700;fill:#14181f}
      .s{font-size:24px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
      .fin{fill:#9fcbe8;stroke:#1f6fb5;stroke-width:5;stroke-linejoin:round}
    </style>
  </defs>
  <!-- fins behind the body -->
  <path class="fin" d="M380 262 L420 150 L600 170 L640 262 Z"/>
  <path class="fin" d="M520 548 L560 650 L640 560 Z"/>
  <path class="fin" d="M790 330 L930 250 L900 410 L930 570 L790 480 Z"/>
  <!-- body -->
  <path d="M120 405 C170 280 420 250 600 265 C720 275 790 330 800 405 C790 480 720 535 600 545 C420 560 170 530 120 405 Z"
        fill="#dbe9f5" stroke="#1f6fb5" stroke-width="6"/>
  <!-- head line and operculum -->
  <path d="M290 300 C330 380 330 440 290 515" stroke="#1f6fb5" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="370" r="18" fill="#14181f"/><circle cx="206" cy="364" r="5" fill="#ffffff"/>
  <path d="M120 405 L160 430" stroke="#1f6fb5" stroke-width="6" fill="none"/>
  <!-- paired fins in front of the body -->
  <path class="fin" d="M330 450 L400 520 L430 450 Z"/>
  <path class="fin" d="M470 520 L520 600 L560 520 Z"/>
  <!-- internal organs (seen through the body): swim bladder above, stomach and intestine below -->
  <ellipse cx="560" cy="360" rx="140" ry="42" fill="#f3f4f6" stroke="#4b5563" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M400 440 C460 480 560 480 680 440" stroke="#d98b2b" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- labels -->
  <path class="lead" d="M510 170 L510 100"/><text class="t" x="400" y="80">Dorsal fin</text><text class="s" x="400" y="52">median</text>
  <path class="lead" d="M880 300 L880 180"/><text class="t" x="760" y="160">Caudal fin</text><text class="s" x="760" y="132">tail; median</text>
  <path class="lead" d="M300 420 L120 650"/><text class="t" x="40" y="690">Operculum</text><text class="s" x="40" y="720">bony flap over four pairs of gills</text>
  <path class="lead" d="M385 500 L330 700"/><text class="t" x="250" y="735">Pectoral fin</text><text class="s" x="250" y="762">paired</text>
  <path class="lead" d="M510 580 L540 700"/><text class="t" x="480" y="735">Pelvic fin</text><text class="s" x="480" y="762">paired</text>
  <path class="lead" d="M580 650 L680 700"/><text class="t" x="650" y="735">Ventral fin</text><text class="s" x="650" y="762">median</text>
  <path class="lead" d="M560 318 L660 230"/><text class="t" x="670" y="222">Swim bladder</text><text class="s" x="670" y="250">gives buoyancy</text>
  <path class="lead" d="M700 445 L860 600"/><text class="t" x="860" y="640">Gut</text>
  <text class="s" x="40" y="250">terminal mouth</text><text class="s" x="40" y="280">with jaws</text>
</svg>
