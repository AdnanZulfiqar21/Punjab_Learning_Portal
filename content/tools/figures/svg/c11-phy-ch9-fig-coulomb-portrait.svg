<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000">
  <!-- Vis9-1 (C11-PHY, PDF p193): portrait of Charles de Coulomb in the box beside the chapter opening; flat drawing after the printed colour portrait: head and shoulders, head turned a little to the viewer's right, white powdered hair swept back with a roll over the ear, pale face, white cravat, dark coat with a dark red lining at the collar and a red ribbon on the chest, dark background. No picture is reproduced. -->
  <rect width="900" height="1000" fill="#ffffff"/>
  <rect x="20" y="20" width="860" height="960" fill="#1f1a18" stroke="#222222" stroke-width="6"/>
  <clipPath id="frame"><rect x="23" y="23" width="854" height="954"/></clipPath>
  <g clip-path="url(#frame)">
    <!-- soft lighter area behind the head -->
    <ellipse cx="470" cy="360" rx="330" ry="300" fill="#2c2522"/>
    <!-- dark coat and shoulders -->
    <path d="M20 1000 C 40 820 140 720 300 680 L 470 760 L 650 690 C 790 730 870 830 880 1000 Z" fill="#141112" stroke="#3a3333" stroke-width="3"/>
    <!-- dark red lining showing at the collar -->
    <path d="M300 680 C 250 720 220 780 215 860 L 300 1000 L 360 1000 C 330 900 330 790 370 720 Z" fill="#6b1f22"/>
    <path d="M650 690 C 700 720 720 780 720 850 L 640 1000 L 600 1000 C 625 900 620 800 600 735 Z" fill="#5a1a1d"/>
    <!-- neck -->
    <path d="M415 560 L 405 720 L 555 720 L 545 560 Z" fill="#e3cdb8"/>
    <!-- high coat collar -->
    <path d="M330 640 C 300 690 300 740 330 790 L 390 740 C 380 700 380 670 395 640 Z" fill="#231d1d" stroke="#3a3333" stroke-width="3"/>
    <path d="M610 640 C 640 690 640 740 610 790 L 560 740 C 570 700 570 670 555 640 Z" fill="#231d1d" stroke="#3a3333" stroke-width="3"/>
    <!-- white cravat -->
    <path d="M395 640 C 420 690 450 710 480 705 C 510 700 540 680 555 640 L 560 740 C 540 800 510 840 478 850 C 445 840 410 800 390 740 Z" fill="#ece8e1" stroke="#c8c2b8" stroke-width="3"/>
    <path d="M430 720 C 450 750 470 760 480 790 M520 720 C 505 750 490 770 482 800" stroke="#cfc8bd" stroke-width="4" fill="none"/>
    <!-- red ribbon on the chest -->
    <path d="M690 810 L 740 800 L 760 880 L 728 868 L 705 895 Z" fill="#b3262b" stroke="#7d1a1e" stroke-width="3"/>
    <!-- white powdered hair, swept back, roll over the ear on the viewer's left -->
    <path d="M300 330 C 290 210 370 130 480 128 C 580 126 640 190 642 280 C 646 330 630 380 610 410 L 360 470 C 320 440 302 390 300 330 Z" fill="#ebe7e0"/>
    <path d="M300 360 C 270 380 262 430 285 465 C 300 490 335 495 352 478 C 368 455 360 420 340 405 C 322 392 305 395 300 360 Z" fill="#e2ddd5" stroke="#bdb6ab" stroke-width="3"/>
    <path d="M290 430 C 300 455 320 470 345 465" stroke="#bdb6ab" stroke-width="3" fill="none"/>
    <path d="M350 200 C 400 170 460 160 520 168 M330 260 C 390 225 460 215 540 222 M325 310 C 380 290 430 285 480 290" stroke="#c9c3b9" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- face turned slightly to the viewer's right -->
    <path d="M380 300 C 420 270 520 262 590 300 C 620 320 632 370 630 420 C 640 440 640 470 628 490 C 620 540 590 590 545 615 C 510 635 460 632 430 610 C 395 585 375 540 368 490 C 362 430 362 350 380 300 Z" fill="#efdccb"/>
    <!-- ear -->
    <path d="M378 420 C 355 410 345 440 352 470 C 358 495 375 505 385 495 Z" fill="#e6cdb6" stroke="#c9a98f" stroke-width="3"/>
    <!-- brows -->
    <path d="M450 370 C 475 356 505 356 525 366 M560 366 C 578 358 598 360 612 370" stroke="#a8998a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="490" cy="395" rx="18" ry="8" fill="#f6f1ec"/>
    <ellipse cx="588" cy="395" rx="15" ry="7" fill="#f6f1ec"/>
    <circle cx="494" cy="395" r="7" fill="#4a3c33"/>
    <circle cx="592" cy="395" r="6" fill="#4a3c33"/>
    <path d="M470 410 C 485 418 505 418 515 412 M572 410 C 582 416 598 416 606 410" stroke="#d2b39b" stroke-width="3" fill="none"/>
    <!-- nose -->
    <path d="M560 390 C 568 430 585 470 590 490 C 580 502 562 502 550 494" stroke="#c39c80" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- mouth and chin -->
    <path d="M520 545 C 540 552 565 552 580 543" stroke="#b07a68" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M500 600 C 525 612 555 610 575 595" stroke="#d6bba5" stroke-width="3" fill="none"/>
    <!-- cheek shading on the viewer's left -->
    <path d="M385 440 C 395 520 420 570 455 600 C 420 585 392 540 382 480 Z" fill="#dfc4ad"/>
  </g>
</svg>
