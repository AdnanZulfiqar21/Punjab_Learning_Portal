  <line x1="630.0" y1="270.0" x2="602.4" y2="270.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M592.0 270.0 L603.8 264.5 L603.8 275.5 Z" fill="#d98b2b"/>
  <line x1="725.0" y1="155.0" x2="815.0" y2="155.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
