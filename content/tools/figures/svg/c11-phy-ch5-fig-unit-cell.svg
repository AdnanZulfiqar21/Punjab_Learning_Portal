  <text x="560.0" y="382.0" font-size="17" fill="#d98b2b" text-anchor="middle" font-weight="700">atoms pushed closer</text>
  <line x1="490.0" y1="270.0" x2="517.6" y2="270.0" stroke="#d98b2b" stroke-width="3" stroke-linecap="round"/>
