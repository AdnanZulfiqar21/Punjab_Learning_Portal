  <circle cx="725.0" cy="155.0" r="17.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <circle cx="815.0" cy="155.0" r="17.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <circle cx="815.0" cy="245.0" r="17.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <circle cx="725.0" cy="245.0" r="17.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="770.0" y="360.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700">(d) force removed</text>
  <text x="770.0" y="382.0" font-size="17" fill="#0f7a62" text-anchor="middle" font-weight="700">spacing restored</text>
  <text x="450.0" y="420.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="400">Bonds act like tiny springs: they pull back or push back towards the equilibrium spacing</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
