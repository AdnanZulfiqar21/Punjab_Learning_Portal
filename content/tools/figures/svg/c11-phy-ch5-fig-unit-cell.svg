  <circle cx="275.0" cy="240.0" r="17.0" stroke="#1f6fb5" stroke-width="2.5" fill="#dbe9f5"/>
  <text x="345.0" y="360.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">(b) stretched</text>
  <text x="345.0" y="382.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700">atoms pulled apart</text>
  <line x1="305.0" y1="270.0" x2="240.4" y2="270.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
