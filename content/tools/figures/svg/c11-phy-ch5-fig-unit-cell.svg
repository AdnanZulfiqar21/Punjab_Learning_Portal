  <line x1="385.0" y1="270.0" x2="449.6" y2="270.0" stroke="#d7322f" stroke-width="3" stroke-linecap="round"/>
  <path d="M460.0 270.0 L448.2 275.5 L448.2 264.5 Z" fill="#d7322f"/>
  <line x1="530.0" y1="150.0" x2="590.0" y2="150.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
