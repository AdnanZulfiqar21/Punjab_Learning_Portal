  <text x="130.0" y="382.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700">equilibrium spacing</text>
  <line x1="275.0" y1="160.0" x2="415.0" y2="160.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
  <line x1="415.0" y1="160.0" x2="415.0" y2="240.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
  <line x1="415.0" y1="240.0" x2="275.0" y2="240.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
  <line x1="275.0" y1="240.0" x2="275.0" y2="160.0" stroke="#4b5563" stroke-width="3" stroke-dasharray="3 4"/>
