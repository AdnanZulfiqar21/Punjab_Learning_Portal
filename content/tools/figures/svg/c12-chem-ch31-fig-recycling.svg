<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topic 31.2.3 and Table 31.3: mechanical recycling of plastics (sort, clean, melt, re-form) and chemical recycling (depolymerisation to monomers), with metal, paper and glass recycling; aluminium recycling uses about 95% less energy. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Recycling routes (after Table 31.3)</text>
  <rect x="15.0" y="55.0" width="430.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">plastics: mechanical recycling</text>
  <rect x="65.0" y="94.0" width="330.0" height="36.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="117.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">collect and sort</text>
  <line x1="230.0" y1="130.0" x2="230.0" y2="139.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 145.0 L227.0 138.7 L233.0 138.7 Z" fill="#4b5563"/>
  <rect x="65.0" y="146.0" width="330.0" height="36.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="169.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">clean</text>
  <line x1="230.0" y1="182.0" x2="230.0" y2="191.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 197.0 L227.0 190.7 L233.0 190.7 Z" fill="#4b5563"/>
  <rect x="65.0" y="198.0" width="330.0" height="36.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="221.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">melt</text>
  <line x1="230.0" y1="234.0" x2="230.0" y2="243.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M230.0 249.0 L227.0 242.7 L233.0 242.7 Z" fill="#4b5563"/>
  <rect x="65.0" y="250.0" width="330.0" height="36.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="230.0" y="273.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">re-form into new items</text>
  <text x="230.0" y="318.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">polymer chains degrade a little each time;</text>
  <text x="230.0" y="335.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">limited by contamination</text>
  <rect x="455.0" y="55.0" width="430.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">plastics: chemical recycling</text>
  <rect x="505.0" y="94.0" width="330.0" height="36.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="117.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">polymer chains</text>
  <line x1="670.0" y1="130.0" x2="670.0" y2="139.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M670.0 145.0 L667.0 138.7 L673.0 138.7 Z" fill="#4b5563"/>
  <rect x="505.0" y="146.0" width="330.0" height="36.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="169.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">break down with heat, solvents or catalysts</text>
  <line x1="670.0" y1="182.0" x2="670.0" y2="191.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M670.0 197.0 L667.0 190.7 L673.0 190.7 Z" fill="#4b5563"/>
  <rect x="505.0" y="198.0" width="330.0" height="36.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="221.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">monomers or simple chemicals</text>
  <line x1="670.0" y1="234.0" x2="670.0" y2="243.4" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M670.0 249.0 L667.0 242.7 L673.0 242.7 Z" fill="#4b5563"/>
  <rect x="505.0" y="250.0" width="330.0" height="36.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="670.0" y="273.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">make new polymer</text>
  <text x="670.0" y="318.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">depolymerisation gives purer</text>
  <text x="670.0" y="335.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">starting materials</text>
  <rect x="15.0" y="370.0" width="870.0" height="160.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="400.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">other materials</text>
  <text x="40.0" y="425.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">metals (steel, aluminium):</text>
  <text x="40.0" y="447.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">melting and refining; recycled</text>
  <text x="40.0" y="465.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">aluminium needs about 95% less energy</text>
  <text x="40.0" y="483.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">than aluminium from its ore</text>
  <text x="330.0" y="425.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">paper:</text>
  <text x="330.0" y="447.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">fibres are separated (pulping), then</text>
  <text x="330.0" y="465.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">inks and dyes are removed with</text>
  <text x="330.0" y="483.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400"><tspan dy="0.0">NaOH or Na</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">CO</tspan><tspan dy="3.8" font-size="8.4">3</tspan><tspan dy="-3.8"> (de-inking)</tspan></text>
  <text x="620.0" y="425.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">glass:</text>
  <text x="620.0" y="447.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">scrap glass (cullet) is cleaned,</text>
  <text x="620.0" y="465.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="400">crushed and melted into new glass</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
