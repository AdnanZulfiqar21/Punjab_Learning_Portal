<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Times New Roman', Times, serif">
  <!-- Impedance triangle (C11-MATH, PDF p24): magenta right triangle with base R, vertical side X = (X_L) - (X_C) and hypotenuse Z. Original drawing after the printed figure. -->
  <rect width="1000" height="470" fill="#ffffff"/>
  <rect width="1000" height="470" fill="#FFFAC2"/>
  <path d="M60 380 L820 380 L820 50 Z" stroke="#e0197d" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="400" y="190" font-size="44.0" text-anchor="middle" fill="#1a1a1a" font-style="italic">Z</text>
  <text x="440" y="440" font-size="44.0" text-anchor="middle" fill="#1a1a1a" font-style="italic">R</text>
  <text x="880" y="215" font-size="36.0" text-anchor="middle" fill="#1a1a1a" transform="rotate(-90 880 215)"><tspan font-style="italic">X</tspan> = (<tspan font-style="italic">X</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">L</tspan></tspan>) − (<tspan font-style="italic">X</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">C</tspan></tspan>)</text>
</svg>
