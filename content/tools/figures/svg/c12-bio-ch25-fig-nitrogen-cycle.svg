<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figure 25.3: atmospheric nitrogen is fixed to ammonia by bacteria (and by lightning and industry), nitrified to nitrite and nitrate, assimilated by plants, returned to ammonia by decomposers and released as N2 by denitrifying bacteria. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The nitrogen cycle</text>
  <rect x="330.0" y="60.0" width="240.0" height="70.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="450.0" y="91.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">atmospheric N2 (78%)</text>
  <text x="450.0" y="109.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">strong triple bond</text>
  <rect x="40.0" y="230.0" width="220.0" height="90.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="150.0" y="262.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">1 nitrogen fixation</text>
  <text x="150.0" y="280.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Rhizobium in legume nodules,</text>
  <text x="150.0" y="298.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Azotobacter, cyanobacteria</text>
  <rect x="340.0" y="250.0" width="200.0" height="60.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="440.0" y="285.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">ammonia (NH3)</text>
  <rect x="600.0" y="230.0" width="260.0" height="90.0" rx="10" stroke="#0e9aa7" stroke-width="2" fill="#ecfeff"/>
  <text x="730.0" y="262.0" font-size="12" fill="#0e9aa7" text-anchor="middle" font-weight="700">2 nitrification</text>
  <text x="730.0" y="280.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Nitrosomonas: NH3 to nitrite;</text>
  <text x="730.0" y="298.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Nitrobacter: nitrite to nitrate</text>
  <rect x="600.0" y="410.0" width="260.0" height="90.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="730.0" y="442.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">3 assimilation</text>
  <text x="730.0" y="460.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">plants take up nitrate to make</text>
  <text x="730.0" y="478.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">proteins, DNA, chlorophyll</text>
  <rect x="340.0" y="420.0" width="200.0" height="80.0" rx="10" stroke="#92400e" stroke-width="2" fill="#fef3c7"/>
  <text x="440.0" y="447.0" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">4 ammonification</text>
  <text x="440.0" y="465.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">decomposers turn dead</text>
  <text x="440.0" y="483.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">matter back to NH3</text>
  <rect x="600.0" y="90.0" width="260.0" height="90.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="730.0" y="122.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">5 denitrification</text>
  <text x="730.0" y="140.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Pseudomonas, Thiobacillus in</text>
  <text x="730.0" y="158.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">waterlogged soil: nitrate to N2</text>
  <line x1="360.0" y1="135.0" x2="187.2" y2="221.4" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180.0 225.0 L186.2 217.2 L190.0 224.7 Z" fill="#0f7a62"/>
  <line x1="262.0" y1="280.0" x2="328.0" y2="280.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M336.0 280.0 L326.9 284.2 L326.9 275.8 Z" fill="#0f7a62"/>
  <line x1="544.0" y1="280.0" x2="588.0" y2="280.0" stroke="#0e9aa7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M596.0 280.0 L586.9 284.2 L586.9 275.8 Z" fill="#0e9aa7"/>
  <line x1="730.0" y1="324.0" x2="730.0" y2="398.0" stroke="#0f7a62" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730.0 406.0 L725.8 396.9 L734.2 396.9 Z" fill="#0f7a62"/>
  <line x1="596.0" y1="460.0" x2="552.0" y2="460.0" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M544.0 460.0 L553.1 455.8 L553.1 464.2 Z" fill="#92400e"/>
  <line x1="440.0" y1="416.0" x2="440.0" y2="322.0" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M440.0 314.0 L444.2 323.1 L435.8 323.1 Z" fill="#92400e"/>
  <line x1="730.0" y1="226.0" x2="730.0" y2="192.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730.0 184.0 L734.2 193.1 L725.8 193.1 Z" fill="#7c3aed"/>
  <line x1="596.0" y1="130.0" x2="579.3" y2="111.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M574.0 105.0 L583.2 109.0 L576.8 114.6 Z" fill="#7c3aed"/>
  <text x="40.0" y="80.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">lightning (5-10%) and</text>
  <text x="40.0" y="98.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">industrial fixation also</text>
  <text x="40.0" y="116.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">turn N2 into usable forms</text>
  <text x="450.0" y="560.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">animals get nitrogen by eating plants and other animals</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
