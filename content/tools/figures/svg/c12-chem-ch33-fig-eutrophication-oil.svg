<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="610" fill="#ffffff"/>
  <!-- Original diagram for topic 33.3: the steps of eutrophication from excess nitrogen and phosphorus to an algal bloom and an oxygen-poor dead zone, and an oil layer on the sea that blocks sunlight and oxygen exchange; Figure 33.3 (photographs) is described, not reproduced. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Eutrophication and oil pollution</text>
  <rect x="15.0" y="55.0" width="870.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">eutrophication (nutrient pollution)</text>
  <rect x="25.0" y="100.0" width="152.0" height="120.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="101.0" y="136.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">excess N and P</text>
  <text x="101.0" y="155.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">from fertiliser</text>
  <text x="101.0" y="174.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">runoff, sewage,</text>
  <text x="101.0" y="193.1" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">stormwater</text>
  <line x1="179.0" y1="160.0" x2="188.6" y2="160.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M195.0 160.0 L187.7 163.4 L187.7 156.6 Z" fill="#14181f"/>
  <rect x="197.0" y="100.0" width="152.0" height="120.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="273.0" y="145.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">algal bloom:</text>
  <text x="273.0" y="164.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">algae grow</text>
  <text x="273.0" y="183.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">very rapidly</text>
  <line x1="351.0" y1="160.0" x2="360.6" y2="160.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M367.0 160.0 L359.7 163.4 L359.7 156.6 Z" fill="#14181f"/>
  <rect x="369.0" y="100.0" width="152.0" height="120.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="445.0" y="145.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the bloom blocks</text>
  <text x="445.0" y="164.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sunlight from</text>
  <text x="445.0" y="183.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">underwater plants</text>
  <line x1="523.0" y1="160.0" x2="532.6" y2="160.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M539.0 160.0 L531.7 163.4 L531.7 156.6 Z" fill="#14181f"/>
  <rect x="541.0" y="100.0" width="152.0" height="120.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="617.0" y="145.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">dead algae</text>
  <text x="617.0" y="164.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">decompose and</text>
  <text x="617.0" y="183.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">use up oxygen</text>
  <line x1="695.0" y1="160.0" x2="704.6" y2="160.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M711.0 160.0 L703.7 163.4 L703.7 156.6 Z" fill="#14181f"/>
  <rect x="713.0" y="100.0" width="152.0" height="120.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="789.0" y="145.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">hypoxic</text>
  <text x="789.0" y="164.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">'dead zone':</text>
  <text x="789.0" y="183.6" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">aquatic life dies</text>
  <text x="450.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">High nitrate in drinking water causes 'blue baby syndrome' (methaemoglobinaemia) in infants.</text>
  <text x="450.0" y="283.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Eutrophication reduces biodiversity, harms fisheries and spoils water for drinking and recreation.</text>
  <rect x="15.0" y="320.0" width="870.0" height="265.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="350.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">oil spill</text>
  <rect x="40.0" y="460.0" width="820.0" height="100.0" rx="4" stroke="#1f6fb5" stroke-width="0" fill="#bfdbfe"/>
  <rect x="40.0" y="452.0" width="520.0" height="12.0" rx="4" stroke="#14181f" stroke-width="0" fill="#1f2937"/>
  <text x="300.0" y="492.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">oil spreads as a thin surface layer</text>
  <circle cx="120.0" cy="405.0" r="22.0" stroke="#d98b2b" stroke-width="2" fill="#fde68a"/>
  <line x1="145.0" y1="410.0" x2="214.2" y2="441.4" stroke="#d98b2b" stroke-width="2" stroke-linecap="round"/>
  <path d="M220.0 444.0 L212.0 444.1 L214.8 437.9 Z" fill="#d98b2b"/>
  <text x="232.0" y="425.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">X</text>
  <text x="150.0" y="387.0" font-size="12" fill="#d98b2b" text-anchor="start" font-weight="700">sunlight blocked</text>
  <text x="420.0" y="398.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <line x1="420.0" y1="406.0" x2="420.0" y2="435.6" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <path d="M420.0 442.0 L416.6 434.7 L423.4 434.7 Z" fill="#0f7a62"/>
  <text x="440.0" y="432.0" font-size="18" fill="#d7322f" text-anchor="start" font-weight="700">X</text>
  <text x="440.0" y="400.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">oxygen exchange reduced</text>
  <text x="600.0" y="488.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">harms fish, birds and marine</text>
  <text x="600.0" y="505.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">mammals (they swallow oil when</text>
  <text x="600.0" y="522.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">grooming); damages mangroves,</text>
  <text x="600.0" y="539.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">coral reefs and beaches</text>
  <text x="450.0" y="601" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
