  <text x="520.0" y="184.8" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">groundwater</tspan></text>
  <rect x="695.0" y="110.0" width="290.0" height="130.0" rx="14" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <text x="840.0" y="166.6" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">living</tspan></text>
  <text x="840.0" y="203.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">organisms</tspan></text>
