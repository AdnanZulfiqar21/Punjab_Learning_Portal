  <text x="180.0" y="149.3" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">electronics,</tspan></text>
  <text x="180.0" y="184.4" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">batteries,</tspan></text>
  <text x="180.0" y="219.5" font-size="27" fill="#14181f" text-anchor="middle" font-weight="600"><tspan dy="0.0">fluorescent lights</tspan></text>
