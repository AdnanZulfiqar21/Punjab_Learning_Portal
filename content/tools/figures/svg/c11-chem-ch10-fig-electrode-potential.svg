<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 10.3 to 10.6 and topics 10.11 to 10.14: the electrical double layer, the standard hydrogen electrode and measuring standard electrode potentials. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .l{font-size:12px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Electrode potentials: the double layer, the standard hydrogen electrode and E standard</text>
  <!-- double layer -->
  <text class="k" x="210" y="66">Electrical double layer (after Figure 10.3)</text>
  <rect x="60" y="150" width="300" height="270" rx="8" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
  <rect x="60" y="150" width="300" height="30" fill="#ffffff"/>
  <path d="M60 180 H360" stroke="#9ca3af" stroke-width="1"/>
  <rect x="130" y="100" width="50" height="300" fill="#9ca3af"/>
  <text class="l" x="155" y="92" style="fill:#14181f">zinc rod</text>
  <g font-size="14" font-weight="700" fill="#1f6fb5" text-anchor="middle">
    <text x="174" y="215">-</text><text x="174" y="245">-</text><text x="174" y="275">-</text><text x="174" y="305">-</text><text x="174" y="335">-</text><text x="174" y="365">-</text>
  </g>
  <g font-size="11" font-weight="700" fill="#d7322f" text-anchor="middle">
    <text x="200" y="215">Zn2+</text><text x="200" y="245">Zn2+</text><text x="200" y="275">Zn2+</text><text x="200" y="305">Zn2+</text><text x="200" y="335">Zn2+</text><text x="200" y="365">Zn2+</text>
    <text x="280" y="230">Zn2+</text><text x="310" y="290">Zn2+</text><text x="270" y="350">Zn2+</text>
  </g>
  <text class="s" x="300" y="200" style="font-size:11px">Zn2+ solution</text>
  <path d="M100 440 H330" stroke="#4b5563" stroke-width="1" fill="none"/>
  <g class="t" style="font-size:12px">
    <text x="60" y="460">a few Zn atoms leave as Zn2+, leaving excess</text>
    <text x="60" y="476">electrons on the metal; cations gather at the</text>
    <text x="60" y="492">surface: a double layer and a potential (voltage)</text>
    <text x="60" y="512">absolute potential cannot be measured; the</text>
    <text x="60" y="528">difference from another system can: E, in volts</text>
  </g>
  <text class="f" x="60" y="556">Zn  =  Zn2+ + 2e-   (equilibrium at the surface)</text>
  <!-- SHE -->
  <text class="k" x="580" y="66">Standard hydrogen electrode (Figure 10.4)</text>
  <rect x="440" y="170" width="280" height="250" rx="8" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
  <rect x="440" y="170" width="280" height="30" fill="#ffffff"/>
  <path d="M440 200 H720" stroke="#9ca3af" stroke-width="1"/>
  <rect x="530" y="110" width="100" height="200" rx="4" fill="none" stroke="#4b5563" stroke-width="2"/>
  <rect x="574" y="80" width="12" height="300" fill="#4b5563"/>
  <rect x="562" y="300" width="36" height="60" fill="#14181f"/>
  <path d="M500 95 H580 V110" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="t" x="446" y="86" style="font-size:11px">H2 in at 101 kPa</text>
  <text class="t" x="640" y="130" style="font-size:11px">glass bell with a hole</text>
  <text class="t" x="640" y="146" style="font-size:11px">for H2 to bubble out</text>
  <text class="t" x="604" y="345" style="font-size:11px">platinum electrode</text>
  <text class="t" x="604" y="361" style="font-size:11px">coated with platinum black</text>
  <text class="t" x="446" y="334" style="font-size:11px">H+ at 1.00 mol dm-3</text>
  <text class="t" x="446" y="350" style="font-size:11px">25 degrees C (298 K)</text>
  <g font-size="10" fill="#4b5563"><circle cx="560" cy="250" r="3" fill="none" stroke="#4b5563"/><circle cx="600" cy="280" r="3" fill="none" stroke="#4b5563"/><circle cx="555" cy="290" r="3" fill="none" stroke="#4b5563"/><circle cx="605" cy="235" r="3" fill="none" stroke="#4b5563"/></g>
  <text class="f" x="440" y="450">2H+(aq) + 2e-  =  H2(g)     E standard = 0.00 V</text>
  <g class="t" style="font-size:12px">
    <text x="440" y="476">voltage fixed arbitrarily at 0.00 V; the platinum is</text>
    <text x="440" y="492">inert; platinum black gives close contact of H2 and</text>
    <text x="440" y="508">H+ so equilibrium is reached quickly; all E standard</text>
    <text x="440" y="524">values are measured relative to this half-cell</text>
  </g>
  <!-- measuring -->
  <rect x="760" y="55" width="390" height="500" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="955" y="83">Measuring E standard (10.13, 10.14)</text>
  <g class="t" style="font-size:12px">
    <text x="780" y="110">standard conditions: ions at 1.00 mol dm-3, 298 K,</text>
    <text x="780" y="126">gases at 101 kPa, measured against the SHE</text>
    <text x="780" y="150">half-cell types: metal / metal ion (Cu2+/Cu),</text>
    <text x="780" y="166">non-metal / ion (Cl2/Cl-), ion / ion (Fe3+/Fe2+)</text>
  </g>
  <g class="f">
    <text x="780" y="198">Cu2+ + 2e- = Cu    E = +0.34 V</text>
    <text x="780" y="218">H+ + e- = 1/2 H2   E =  0.00 V</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="780" y="240">copper is the positive pole: Cu2+ is easier to</text>
    <text x="780" y="256">reduce than H+, so H2 loses electrons to Cu2+</text>
  </g>
  <g class="f">
    <text x="780" y="290">Zn2+ + 2e- = Zn    E = -0.76 V</text>
    <text x="780" y="310">H+ + e- = 1/2 H2   E =  0.00 V</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="780" y="332">zinc is the negative pole: Zn2+ is harder to</text>
    <text x="780" y="348">reduce than H+, so Zn loses electrons to H+</text>
    <text x="780" y="376">reduction at the positive terminal (2H+ + 2e- gives H2)</text>
    <text x="780" y="392">oxidation at the negative terminal (Zn gives Zn2+ + 2e-)</text>
    <text x="780" y="420">ease of reduction (10.11): for copper the equilibrium</text>
    <text x="780" y="436">Cu2+ + 2e- = Cu lies to the right (Cu2+ easy to reduce);</text>
    <text x="780" y="452">for vanadium V2+ + 2e- = V lies to the left</text>
    <text x="780" y="468">(V2+ hard to reduce)</text>
    <text x="780" y="496">the more positive E standard, the easier the species on</text>
    <text x="780" y="512">the left is reduced; the more negative, the easier the</text>
    <text x="780" y="528">species on the right is oxidised</text>
  </g>
  <text class="s" x="600" y="600">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
