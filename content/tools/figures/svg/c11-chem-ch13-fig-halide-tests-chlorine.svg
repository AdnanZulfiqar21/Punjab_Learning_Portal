<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 13.2, Table 13.6 and topics 13.8 to 13.11: the silver nitrate test with ammonia, chlorine with cold and hot sodium hydroxide, and chlorination of water. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Identifying halides, chlorine with sodium hydroxide, and chlorine in water purification</text>
  <!-- silver nitrate test -->
  <rect x="50" y="55" width="640" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="370" y="83">Silver nitrate test followed by ammonia (13.8, Table 13.6, Figure 13.2)</text>
  <!-- test tubes -->
  <g stroke="#4b5563" stroke-width="2" fill="#eef2f7">
    <path d="M100 110 V200 Q100 215 115 215 Q130 215 130 200 V110 Z"/>
    <path d="M250 110 V200 Q250 215 265 215 Q280 215 280 200 V110 Z"/>
    <path d="M400 110 V200 Q400 215 415 215 Q430 215 430 200 V110 Z"/>
    <path d="M550 110 V200 Q550 215 565 215 Q580 215 580 200 V110 Z"/>
  </g>
  <rect x="252" y="180" width="26" height="28" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="402" y="180" width="26" height="28" fill="#f5e6c8"/>
  <rect x="552" y="180" width="26" height="28" fill="#f3d94a"/>
  <g class="r" style="font-weight:700;fill:#14181f"><text x="115" y="236">F-</text><text x="265" y="236">Cl-</text><text x="415" y="236">Br-</text><text x="565" y="236">I-</text></g>
  <g class="r">
    <text x="115" y="252">no precipitate</text><text x="115" y="266">(AgF soluble)</text>
    <text x="265" y="252">white AgCl</text><text x="265" y="266">dissolves in dil. NH3</text>
    <text x="415" y="252">cream AgBr</text><text x="415" y="266">dissolves in conc. NH3</text>
    <text x="565" y="252">pale yellow AgI</text><text x="565" y="266">insoluble in NH3</text>
  </g>
  <g class="f">
    <text x="70" y="298">Ag+(aq) + X-(aq) --> AgX(s)</text><text x="330" y="298">AgCl + 2NH3 --> [Ag(NH3)2]+ + Cl- (colourless)</text>
    <text x="70" y="318">AgBr + 2NH3(conc) --> [Ag(NH3)2]+ + Br-</text><text x="400" y="318">AgI: no change with dilute or concentrated NH3</text>
  </g>
  <text class="s" x="370" y="338" style="font-size:11px">used in qualitative analysis to identify halide ions; the ammonia step distinguishes the three precipitates</text>
  <!-- NaOH -->
  <rect x="710" y="55" width="440" height="290" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="930" y="83">Chlorine with NaOH: disproportionation (13.10)</text>
  <g class="t" style="font-size:12px;font-weight:700;fill:#14181f">
    <text x="730" y="110">cold, dilute NaOH (13.10.1)</text>
    <text x="730" y="200">hot, concentrated NaOH (13.10.2)</text>
  </g>
  <g class="f">
    <text x="730" y="132">Cl2 + 2NaOH --> NaCl + NaClO + H2O</text>
    <text x="730" y="222">3Cl2 + 6NaOH --> 5NaCl + NaClO3 + 3H2O</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="730" y="154">Cl: 0 in Cl2; -1 in NaCl (reduced); +1 in NaClO (oxidised)</text>
    <text x="730" y="170">sodium chlorate(I), formerly sodium hypochlorite</text>
    <text x="730" y="244">Cl: 0 in Cl2; -1 in NaCl (reduced); +5 in NaClO3 (oxidised)</text>
    <text x="730" y="260">sodium chlorate(V); the print writes NaCl without the 5</text>
    <text x="730" y="288">one element is oxidised and reduced at the same time;</text>
    <text x="730" y="304">temperature decides the products</text>
    <text x="730" y="328">in cold alkali Cl2 gives chlorate(I), in hot alkali chlorate(V)</text>
  </g>
  <!-- water purification -->
  <rect x="50" y="365" width="1100" height="270" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="600" y="393">Chlorine in water purification (13.11): HOCl and OCl- kill bacteria</text>
  <g class="f">
    <text x="70" y="422">Cl2(g) + H2O(l) --> HCl(aq) + HClO(aq)</text><text x="420" y="422">HClO = H+ + OCl-  (chloric(I) acid, a weak acid, partly dissociates)</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="452">chlorine is poisonous, but a small dose is harmless to people and lethal to disease bacteria: a cheap disinfectant at</text>
    <text x="70" y="468">treatment plants; swimming pools use a slightly higher dose because they carry more bacteria</text>
    <text x="70" y="496" style="font-weight:700;fill:#14181f">how it disinfects (13.11.2)</text>
    <text x="70" y="514">HOCl is the more effective species: being neutral it passes through microbial cell walls; HOCl and OCl- oxidise</text>
    <text x="70" y="530">proteins, lipids and enzymes, and even DNA and RNA, so the cell dies or cannot replicate</text>
    <text x="70" y="558" style="font-weight:700;fill:#14181f">factors (13.11.3)</text>
    <text x="70" y="576">pH: at 6 to 7.5 HOCl predominates (most effective); above 7.5 OCl- predominates (less effective)</text>
    <text x="70" y="592">chlorine dose: more chlorine, more HOCl and OCl-, better disinfection</text>
    <text x="70" y="608">contact time: long enough for the disinfectant to penetrate and kill bacteria, viruses and protozoa</text>
  </g>
  <!-- small pH bar -->
  <rect x="820" y="470" width="300" height="18" rx="4" fill="#0f7a62" opacity="0.7"/><rect x="970" y="470" width="150" height="18" rx="4" fill="#1f6fb5" opacity="0.7"/>
  <g class="r" style="fill:#ffffff;font-weight:700"><text x="895" y="483">HOCl, pH 6-7.5</text><text x="1045" y="483">OCl-, above 7.5</text></g>
  <text class="s" x="600" y="652" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
