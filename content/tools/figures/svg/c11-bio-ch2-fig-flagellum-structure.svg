<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.8: basal body, hook and filament of a Gram-negative flagellum. -->
  <defs>
    <style>
      .t{font-size:28px;font-weight:700;fill:#14181f}
      .s{font-size:21px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- envelope layers -->
  <rect x="100" y="470" width="800" height="44" fill="#d98b2b"/>
  <rect x="100" y="530" width="800" height="36" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="3"/>
  <rect x="100" y="600" width="800" height="44" fill="#1f6fb5"/>
  <rect x="100" y="644" width="800" height="120" fill="#eef6fb"/>
  <text class="s" x="110" y="500" style="fill:#ffffff">outer membrane</text>
  <text class="s" x="110" y="556">peptidoglycan</text>
  <text class="s" x="110" y="590">periplasmic space</text>
  <text class="s" x="110" y="630" style="fill:#ffffff">cell membrane</text>
  <text class="s" x="110" y="720">cytoplasm</text>
  <!-- basal body rod and rings -->
  <rect x="490" y="440" width="20" height="300" fill="#4b5563"/>
  <g fill="#14181f">
    <rect x="440" y="480" width="120" height="22" rx="6"/>
    <rect x="440" y="536" width="120" height="22" rx="6"/>
    <rect x="440" y="606" width="120" height="22" rx="6"/>
    <rect x="440" y="660" width="120" height="22" rx="6"/>
  </g>
  <!-- hook -->
  <path d="M500 440 C 500 380, 560 360, 600 320" stroke="#0f7a62" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- filament -->
  <path d="M600 320 c40 -60 80 20 120 -40 s80 20 120 -40 s60 0 80 -30" stroke="#0f7a62" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- labels -->
  <path class="lead" d="M760 250 L760 150"/><text class="t" x="660" y="130">Filament</text><text class="s" x="660" y="100">flagellin, helical</text>
  <path class="lead" d="M548 372 L380 300"/><text class="t" x="250" y="290">Hook</text><text class="s" x="200" y="320">curved joint</text>
  <path class="lead" d="M440 560 L300 400"/><text class="t" x="160" y="385">Basal body</text><text class="s" x="110" y="415">rotating rings anchor it</text>
  <path class="lead" d="M560 491 L720 420"/><text class="s" x="725" y="415">outer pair of rings</text>
  <path class="lead" d="M440 671 L300 760"/><text class="s" x="110" y="790">inner pair of rings</text>
  <text class="s" x="100" y="860">Gram-negative: two pairs of rings (shown). Gram-positive: one pair, in the cell membrane.</text>
</svg>
