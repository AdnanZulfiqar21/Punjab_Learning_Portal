<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figures 19.1 and 19.2: a duplicated chromosome with sister chromatids, centromere, kinetochore, secondary constriction, satellite and telomeres, and metacentric, sub-metacentric, acrocentric and telocentric chromosomes. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Structure of a duplicated chromosome</text>
  <rect x="15.0" y="55.0" width="430.0" height="490.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) parts of a chromosome</text>
  <rect x="167.0" y="100.0" width="30.0" height="127.0" rx="15.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="167.0" y="233.0" width="30.0" height="237.0" rx="15.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="203.0" y="100.0" width="30.0" height="127.0" rx="15.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
