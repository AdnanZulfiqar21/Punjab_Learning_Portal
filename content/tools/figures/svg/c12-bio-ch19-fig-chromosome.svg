  <rect x="167.0" y="100.0" width="30.0" height="50.0" rx="15" stroke="#7c3aed" stroke-width="2" fill="#c4b5fd"/>
  <rect x="167.0" y="100.0" width="30.0" height="14.0" rx="7" stroke="#be185d" stroke-width="1.5" fill="#f9a8d4"/>
  <rect x="167.0" y="456.0" width="30.0" height="14.0" rx="7" stroke="#be185d" stroke-width="1.5" fill="#f9a8d4"/>
  <rect x="203.0" y="150.0" width="30.0" height="8.0" rx="0" stroke="#ffffff" stroke-width="0" fill="#ffffff"/>
  <rect x="203.0" y="100.0" width="30.0" height="50.0" rx="15" stroke="#7c3aed" stroke-width="2" fill="#c4b5fd"/>
