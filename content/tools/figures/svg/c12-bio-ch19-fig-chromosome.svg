  <text x="300.0" y="130.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">satellite</text>
  <line x1="296.0" y1="125.0" x2="233.0" y2="125.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="233.0" cy="125.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="300.0" y="161.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">secondary constriction</text>
  <line x1="296.0" y1="156.0" x2="233.0" y2="154.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="233.0" cy="154.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
