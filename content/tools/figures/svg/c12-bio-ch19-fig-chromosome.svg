  <text x="300.0" y="467.0" font-size="13" fill="#be185d" text-anchor="start" font-weight="700">telomere</text>
  <line x1="296.0" y1="462.0" x2="233.0" y2="462.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="233.0" cy="462.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="40.0" y="335.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">sister</text>
  <line x1="86.9" y1="330.0" x2="167.0" y2="340.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="167.0" cy="340.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="40.0" y="352.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">chromatids</text>
  <text x="230.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">two identical chromatids joined at the centromere</text>
  <rect x="460.0" y="55.0" width="425.0" height="490.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) position of the centromere</text>
  <rect x="493.0" y="140.0" width="20.0" height="127.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="493.0" y="273.0" width="20.0" height="127.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="517.0" y="140.0" width="20.0" height="127.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
