  <text x="515.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">metacentric</text>
  <rect x="593.0" y="140.0" width="20.0" height="88.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="593.0" y="234.0" width="20.0" height="166.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="617.0" y="140.0" width="20.0" height="88.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="617.0" y="234.0" width="20.0" height="166.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <ellipse cx="615.0" cy="231.0" rx="26.0" ry="6.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <text x="615.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">sub-</text>
  <text x="615.0" y="458.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">metacentric</text>
  <rect x="693.0" y="140.0" width="20.0" height="28.2" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="693.0" y="174.2" width="20.0" height="225.8" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="717.0" y="140.0" width="20.0" height="28.2" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="717.0" y="174.2" width="20.0" height="225.8" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <ellipse cx="715.0" cy="171.2" rx="26.0" ry="6.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <text x="715.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">acrocentric</text>
  <rect x="793.0" y="143.0" width="20.0" height="257.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <rect x="817.0" y="143.0" width="20.0" height="257.0" rx="10.0" stroke="#7c3aed" stroke-width="2" fill="#ddd6fe"/>
  <ellipse cx="815.0" cy="140.0" rx="26.0" ry="6.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <text x="815.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">telocentric</text>
  <text x="672.0" y="500.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">centromere: middle, off-centre, near the end, at the end</text>
