  <text x="300.0" y="235.0" font-size="13" fill="#a16207" text-anchor="start" font-weight="700">centromere</text>
  <line x1="296.0" y1="230.0" x2="236.0" y2="230.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="236.0" cy="230.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="300.0" y="265.0" font-size="13" fill="#a16207" text-anchor="start" font-weight="700">kinetochore (spindle</text>
  <line x1="296.0" y1="260.0" x2="230.0" y2="236.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="230.0" cy="236.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
