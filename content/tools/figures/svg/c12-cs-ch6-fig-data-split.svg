<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Original: an 80/20 train-test split and a 70/15/15 split with validation data. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Dividing the data: training, validation and testing (after 6.6 and 6.8)</text>
  <text x="40.0" y="95.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">train-test split</text>
  <rect x="200.0" y="75.0" width="520.0" height="40.0" rx="0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="460.0" y="101.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">training 80%: the model learns patterns</text>
  <rect x="720.0" y="75.0" width="130.0" height="40.0" rx="0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="785.0" y="101.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">test 20%</text>
  <text x="40.0" y="175.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">with validation</text>
  <rect x="200.0" y="155.0" width="455.0" height="40.0" rx="0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="427.0" y="181.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">training 70%</text>
  <rect x="655.0" y="155.0" width="98.0" height="40.0" rx="0" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="704.0" y="181.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">valid. 15%</text>
  <rect x="753.0" y="155.0" width="97.0" height="40.0" rx="0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="801.0" y="181.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">test 15%</text>
  <text x="450.0" y="240.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Validation data tunes settings (hyperparameters) and shows overfitting;</text>
  <text x="450.0" y="258.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">test data is kept unseen until the end, so the score shows real performance.</text>
  <text x="450.0" y="276.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">(70/15/15 is one common choice.)</text>
  <text x="450.0" y="321" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
