<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <!-- Original diagram after Figure 11.3: the three phases of one heartbeat, with their durations and the heart sounds. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <defs><g id="heart">
    <rect x="0" y="0" width="110" height="70" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/>
    <rect x="130" y="0" width="110" height="70" rx="12" fill="#f6d5cf" stroke="#d7322f" stroke-width="3"/>
    <rect x="0" y="90" width="110" height="110" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="5"/>
    <rect x="130" y="90" width="110" height="110" rx="12" fill="#f6d5cf" stroke="#d7322f" stroke-width="8"/>
  </g></defs>
  <!-- phase 1 diastole -->
  <text class="h" x="220" y="40">1. Diastole, about 0.4 s</text>
  <use href="#heart" x="100" y="90"/>
  <g stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M155 62 v22"/><path d="M285 62 v22"/></g>
  <text class="s" x="220" y="310">all four chambers relaxed;</text><text class="s" x="220" y="332">atria fill passively from the large veins;</text><text class="s" x="220" y="354">AV valves open, semilunar valves closed</text>
  <!-- phase 2 atrial systole -->
  <text class="h" x="600" y="40">2. Atrial systole, about 0.1 s</text>
  <use href="#heart" x="480" y="90"/>
  <g stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M535 150 v42"/><path d="M665 150 v42"/></g>
  <text class="s" x="600" y="310">the filled atria contract as their</text><text class="s" x="600" y="332">pressure rises, pushing blood through</text><text class="s" x="600" y="354">the tricuspid and bicuspid valves</text>
  <!-- phase 3 ventricular systole -->
  <text class="h" x="980" y="40">3. Ventricular systole, about 0.3 s</text>
  <use href="#heart" x="860" y="90"/>
  <g stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M915 270 v-200"/><path d="M1045 270 v-200"/></g>
  <path d="M895 180 h40 M1025 180 h40" stroke="#14181f" stroke-width="5"/>
  <text class="s" x="980" y="310">the filled ventricles contract and pump</text><text class="s" x="980" y="332">to the pulmonary arteries and aorta;</text><text class="s" x="980" y="354">AV valves close, semilunar valves open</text>
  <!-- sounds -->
  <rect x="100" y="400" width="1000" height="120" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="430">Sounds of a heartbeat</text>
  <text class="s" x="600" y="458">"lubb": the tricuspid and bicuspid valves close as the ventricles contract</text>
  <text class="s" x="600" y="482">"dubb": the pulmonary and aortic semilunar valves close as the ventricles relax</text>
  <text class="s" x="600" y="506">a hiss, or murmur, means a valve is not closing fully or opens narrowly, making turbulence</text>
  <text class="s" x="600" y="560">One cycle is one heartbeat: about 70 per minute in an adult, pumping the whole 5 litres of blood every minute, about 2.5 billion beats in a life.</text>
  <text class="s" x="600" y="595">Blue: right side (deoxygenated). Red: left side (oxygenated). Arrows: blood movement. Black bars: closed valves.</text>
</svg>
