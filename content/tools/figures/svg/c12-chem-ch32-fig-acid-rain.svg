<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 32.3: SO2 and NOx from industry are oxidised in clouds to H2SO4 and HNO3 (rain below pH 5.6); in soil, H+ replaces K+ and Ca2+ (leaching) and releases toxic Al3+, which damages roots and clogs fish gills. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Acid rain: formation and effects (after Figure 32.3)</text>
  <rect x="15.0" y="55.0" width="870.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="40.0" y="85.0" font-size="17" fill="#14181f" text-anchor="start" font-weight="700">formation</text>
  <rect x="60.0" y="215.0" width="120.0" height="70.0" rx="4" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <rect x="80.0" y="150.0" width="22.0" height="65.0" rx="2" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <rect x="130.0" y="165.0" width="22.0" height="50.0" rx="2" stroke="#4b5563" stroke-width="2" fill="#f1f3f6"/>
  <text x="120.0" y="258.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">industry</text>
  <line x1="95.0" y1="145.0" x2="144.2" y2="109.2" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M150.0 105.0 L145.6 112.9 L141.2 106.7 Z" fill="#4b5563"/>
  <text x="205.0" y="106.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">SO</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">, NO</tspan><tspan dy="4.8" font-size="10.5">x</tspan></text>
  <path d="M260 120 Q262 82 300 84 Q318 58 352 72 Q382 52 410 74 Q446 70 448 104 Q470 120 448 138 L270 138 Q246 132 260 120 Z" stroke="#1f6fb5" stroke-width="2" fill="#e5effa" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="355.0" y="104.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">oxidation, then</text>
  <text x="355.0" y="120.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">acids dissolve in droplets</text>
  <line x1="290.0" y1="148.0" x2="278.0" y2="188.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="330.0" y1="148.0" x2="318.0" y2="188.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="370.0" y1="148.0" x2="358.0" y2="188.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="410.0" y1="148.0" x2="398.0" y2="188.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <text x="355.0" y="212.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">SO</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">, HNO</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">: rain below pH 5.6</tspan></text>
  <text x="490.0" y="110.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">2SO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + O</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + 2H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O -&gt; 2H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">SO</tspan><tspan dy="5.1" font-size="11.2">4</tspan></text>
  <text x="490.0" y="150.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">4NO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + O</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + 2H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O -&gt; 4HNO</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <text x="490.0" y="195.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">normal rain is about pH 5.6 or above</text>
  <text x="490.0" y="214.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">(carbonic acid); rain below pH 5.6</text>
  <text x="490.0" y="233.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">is acid rain</text>
  <rect x="15.0" y="325.0" width="870.0" height="285.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="355.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">effects on soil, crops and lakes</text>
  <circle cx="130.0" cy="450.0" r="62.0" stroke="#d98b2b" stroke-width="2.2" fill="#fde7c7"/>
  <text x="130.0" y="455.0" font-size="15" fill="#d98b2b" text-anchor="middle" font-weight="700">soil</text>
  <circle cx="80.0" cy="395.0" r="20.0" stroke="#7c3aed" stroke-width="1.8" fill="#efe7fd"/>
  <text x="80.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">K</tspan><tspan dy="-5.0" font-size="8.4">+</tspan></text>
  <circle cx="185.0" cy="400.0" r="20.0" stroke="#7c3aed" stroke-width="1.8" fill="#efe7fd"/>
  <text x="185.0" y="405.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-5.0" font-size="8.4">2+</tspan></text>
  <circle cx="190.0" cy="505.0" r="20.0" stroke="#7c3aed" stroke-width="1.8" fill="#efe7fd"/>
  <text x="190.0" y="510.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Al</tspan><tspan dy="-5.0" font-size="8.4">3+</tspan></text>
  <line x1="245.0" y1="420.0" x2="211.2" y2="428.4" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M205.0 430.0 L211.2 425.0 L212.9 431.5 Z" fill="#d7322f"/>
  <text x="255.0" y="418.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-6.7" font-size="11.2">+</tspan></text>
  <text x="300.0" y="390.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">K</tspan><tspan dy="-6.3" font-size="10.5">+-</tspan><tspan dy="6.3">soil + H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3"> -&gt; H</tspan><tspan dy="-6.3" font-size="10.5">+-</tspan><tspan dy="6.3">soil + K</tspan><tspan dy="-6.3" font-size="10.5">+</tspan></text>
  <text x="300.0" y="425.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Ca</tspan><tspan dy="-6.3" font-size="10.5">2+</tspan><tspan dy="6.3">-soil + 2H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3"> -&gt; (H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3">)</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">-soil + Ca</tspan><tspan dy="-6.3" font-size="10.5">2+</tspan></text>
  <text x="300.0" y="460.0" font-size="15" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">Al</tspan><tspan dy="-6.3" font-size="10.5">3+</tspan><tspan dy="6.3">-soil + 3H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3"> -&gt; (H</tspan><tspan dy="-6.3" font-size="10.5">+</tspan><tspan dy="6.3">)</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">-soil + Al</tspan><tspan dy="-6.3" font-size="10.5">3+</tspan></text>
  <text x="300.0" y="500.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">K+, Ca2+ and Mg2+ are leached out and lost to plants;</text>
  <text x="300.0" y="521.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">toxic Al3+ is released and damages roots; leaves are damaged;</text>
  <text x="300.0" y="542.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="700">in lakes, Al3+ clogs fish gills and the fish suffocate</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
