<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Fig 18.8: electrons from a heated filament pass through a magnetic condenser lens onto a thin specimen; a magnetic objective lens forms a first image and a magnetic projector lens forms a second, magnified image on a screen or film. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">A transmission electron microscope (after Fig 18.8)</text>
  <rect x="315.0" y="70.0" width="30.0" height="30.0" rx="4" stroke="#14181f" stroke-width="2" fill="#e5e7eb"/>
  <text x="360.0" y="92.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">electron source (heated filament)</text>
  <line x1="330.0" y1="100.0" x2="330.0" y2="520.0" stroke="#1f6fb5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <rect x="240.0" y="148.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <rect x="380.0" y="148.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <text x="435.0" y="165.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">magnetic condenser lens</text>
  <rect x="240.0" y="238.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <rect x="380.0" y="238.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <text x="435.0" y="255.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">magnetic objective lens</text>
  <rect x="240.0" y="368.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <rect x="380.0" y="368.0" width="40.0" height="24.0" rx="4" stroke="#d98b2b" stroke-width="1.6" fill="#fed7aa"/>
  <text x="435.0" y="385.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">magnetic projector lens</text>
  <line x1="324.0" y1="100.0" x2="290.0" y2="150.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="336.0" y1="100.0" x2="370.0" y2="150.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="290.0" y1="170.0" x2="327.0" y2="210.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="370.0" y1="170.0" x2="333.0" y2="210.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="305.0" y="207.0" width="50.0" height="6.0" rx="0" stroke="#7c3aed" stroke-width="1" fill="#c4b5fd"/>
  <text x="435.0" y="214.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">specimen (thin)</text>
  <line x1="327.0" y1="213.0" x2="290.0" y2="240.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="333.0" y1="213.0" x2="370.0" y2="240.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="290.0" y1="262.0" x2="360.0" y2="320.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="370.0" y1="262.0" x2="300.0" y2="320.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <text x="435.0" y="322.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">first image</text>
  <line x1="300.0" y1="320.0" x2="290.0" y2="368.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="360.0" y1="320.0" x2="370.0" y2="368.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="290.0" y1="392.0" x2="220.0" y2="500.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="370.0" y1="392.0" x2="440.0" y2="500.0" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="200.0" y="500.0" width="260.0" height="10.0" rx="0" stroke="#14181f" stroke-width="1" fill="#374151"/>
  <text x="470.0" y="508.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">second, magnified image on a screen or film</text>
  <text x="760.0" y="330.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">electrons accelerated</text>
  <text x="760.0" y="350.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">through high voltages</text>
  <text x="760.0" y="370.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">have a de Broglie</text>
  <text x="760.0" y="390.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">wavelength far shorter</text>
  <text x="760.0" y="410.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">than visible light,</text>
  <text x="760.0" y="430.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">so finer detail is</text>
  <text x="760.0" y="450.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">resolved</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
