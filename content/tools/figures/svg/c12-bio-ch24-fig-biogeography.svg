<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram for topic 24.3.1: related animals on continents separated by ocean, unique animals such as kangaroos in Australia and Tasmania, and a group of islands with few but unique species. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Evidence from biogeography</text>
  <rect x="30.0" y="70.0" width="265.0" height="300.0" rx="14" stroke="#1f6fb5" stroke-width="2.5" fill="#ffffff"/>
  <text x="162.0" y="104.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">similar groups far apart</text>
  <text x="162.0" y="250.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">related animals live on</text>
  <text x="162.0" y="272.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">continents separated by</text>
  <text x="162.0" y="294.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">oceans: common ancestry,</text>
  <text x="162.0" y="316.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">then independent evolution</text>
  <ellipse cx="102.0" cy="170.0" rx="46.0" ry="36.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <ellipse cx="222.0" cy="170.0" rx="46.0" ry="36.0" stroke="#1f6fb5" stroke-width="2" fill="#dbeafe"/>
  <text x="162.0" y="175.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">ocean</text>
  <circle cx="102.0" cy="170.0" r="9.0" stroke="#92400e" stroke-width="1.5" fill="#fbbf24"/>
  <circle cx="222.0" cy="170.0" r="9.0" stroke="#92400e" stroke-width="1.5" fill="#fde68a"/>
  <rect x="315.0" y="70.0" width="265.0" height="300.0" rx="14" stroke="#0f7a62" stroke-width="2.5" fill="#ffffff"/>
  <text x="447.0" y="104.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">different animals, similar places</text>
  <text x="447.0" y="250.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Australia and Tasmania have</text>
  <text x="447.0" y="272.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">unique animals, such as</text>
  <text x="447.0" y="294.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">many kinds of kangaroo,</text>
  <text x="447.0" y="316.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the main herbivores there</text>
  <path d="M377 140 Q427 120 497 145 Q527 190 477 215 Q407 220 372 190 Z" stroke="#0f7a62" stroke-width="2" fill="#dcfce7" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="487.0" cy="228.0" rx="12.0" ry="8.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="442.0" y="180.0" font-size="12" fill="#0f7a62" text-anchor="middle" font-weight="700">Australia</text>
  <rect x="600.0" y="70.0" width="265.0" height="300.0" rx="14" stroke="#d98b2b" stroke-width="2.5" fill="#ffffff"/>
  <text x="732.0" y="104.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">islands</text>
  <text x="732.0" y="250.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">islands have few but</text>
  <text x="732.0" y="272.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">unique species, from</text>
  <text x="732.0" y="294.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">colonisation followed</text>
  <text x="732.0" y="316.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">by evolution on the island</text>
  <circle cx="672.0" cy="150.0" r="22.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <circle cx="732.0" cy="190.0" r="30.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <circle cx="792.0" cy="145.0" r="18.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <circle cx="772.0" cy="215.0" r="14.0" stroke="#d98b2b" stroke-width="2" fill="#ffedd5"/>
  <rect x="40.0" y="390.0" width="820.0" height="60.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="414.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">biogeography: the study of where plants and animals are found;</text>
  <text x="450.0" y="434.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">different parts of the world have their own evolutionary histories</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
