  <text x="125.0" y="278.5" font-size="30" fill="#c2187a" text-anchor="middle" font-weight="700"><tspan dy="0.0">Genome</tspan></text>
  <text x="125.0" y="318.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">In nucleus</text>
  <text x="125.0" y="354.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">of cell</text>
  <text x="362.0" y="278.5" font-size="30" fill="#c2187a" text-anchor="middle" font-weight="700"><tspan dy="0.0">Chromosome</tspan></text>
  <text x="362.0" y="318.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">23 pairs in a</text>
  <text x="362.0" y="354.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">human cell</text>
  <text x="600.0" y="278.5" font-size="30" fill="#c2187a" text-anchor="middle" font-weight="700"><tspan dy="0.0">Gene</tspan></text>
  <text x="600.0" y="318.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">section of a</text>
  <text x="600.0" y="354.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">chromosome</text>
  <text x="600.0" y="390.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">that makes a</text>
  <text x="600.0" y="426.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">single protein</text>
  <text x="838.0" y="278.5" font-size="30" fill="#c2187a" text-anchor="middle" font-weight="700"><tspan dy="0.0">DNA</tspan></text>
  <text x="838.0" y="318.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">Polymer chains</text>
  <text x="838.0" y="354.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">made up of</text>
  <text x="838.0" y="390.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">bases attached</text>
  <text x="838.0" y="426.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">to a sugar-</text>
  <text x="838.0" y="462.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">phosphate chain</text>
  <text x="1075.0" y="278.5" font-size="30" fill="#c2187a" text-anchor="middle" font-weight="700"><tspan dy="0.0">Codon</tspan></text>
  <text x="1075.0" y="318.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">group of three</text>
  <text x="1075.0" y="354.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">bases which</text>
  <text x="1075.0" y="390.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">codes for a</text>
  <text x="1075.0" y="426.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">specific amino</text>
  <text x="1075.0" y="462.0" font-size="27" fill="#14181f" text-anchor="middle" font-weight="500">acid</text>
</svg>
