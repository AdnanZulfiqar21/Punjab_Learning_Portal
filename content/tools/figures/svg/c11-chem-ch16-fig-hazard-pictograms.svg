  <g transform="translate(240,420)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <line x1="-38" y1="14" x2="38" y2="44" stroke="#14181f" stroke-width="9" stroke-linecap="round"/><line x1="38" y1="14" x2="-38" y2="44" stroke="#14181f" stroke-width="9" stroke-linecap="round"/><circle cx="0" cy="-12" r="26" fill="#14181f"/><rect x="-14" y="6" width="28" height="16" rx="3" fill="#14181f"/><circle cx="-10" cy="-14" r="7" fill="#fff"/><circle cx="10" cy="-14" r="7" fill="#fff"/><path d="M0 -4 L-4 4 L4 4 Z" fill="#fff"/>
  </g>
  <text x="240" y="553" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Toxic</text>
  <g transform="translate(480,420)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-9 -48 L9 -48 L6 20 L-6 20 Z" fill="#14181f"/><circle cx="0" cy="36" r="10" fill="#14181f"/>
  </g>
  <text x="480" y="553" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Irritant</text>
  <g transform="translate(720,420)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-48 40 L48 40" stroke="#14181f" stroke-width="6"/><path d="M-24 40 L-24 -40 M-24 -10 L-42 -30 M-24 -20 L-6 -42 M-24 0 L-6 -14 M-42 -30 L-48 -26 M-6 -42 L0 -46" stroke="#14181f" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-16 40 L-30 40 L-24 30 Z" fill="#14181f"/><ellipse cx="18" cy="26" rx="18" ry="8" fill="#14181f"/><path d="M34 26 L46 16 L46 36 Z" fill="#14181f"/><circle cx="8" cy="24" r="2.5" fill="#fff"/>
  </g>
  <text x="720" y="553" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Environmentally</text>
  <text x="720" y="581" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Damaging</text>
  <g transform="translate(960,420)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="0" cy="-34" r="14" fill="#14181f"/><path d="M-40 46 L-40 6 C-40 -12 -24 -20 0 -20 C24 -20 40 -12 40 6 L40 46 Z" fill="#14181f"/><path d="M0 -6 L5 8 L20 4 L10 16 L22 26 L6 24 L4 40 L-4 26 L-18 32 L-10 18 L-22 8 L-6 10 Z" fill="#fff"/>
  </g>
  <text x="960" y="553" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Health hazard</text>
</svg>
