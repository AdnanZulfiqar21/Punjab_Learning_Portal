  <g transform="translate(120,120)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="-14" cy="14" r="20" fill="#14181f"/><path d="M-2 -2 L10 -26 L14 -6 L34 -20 L24 2 L44 4 L22 14 Z" fill="#14181f"/><line x1="-30" y1="-10" x2="-44" y2="-24" stroke="#14181f" stroke-width="5" stroke-linecap="round"/><line x1="-14" y1="-14" x2="-16" y2="-34" stroke="#14181f" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="22" x2="46" y2="30" stroke="#14181f" stroke-width="5" stroke-linecap="round"/><line x1="10" y1="30" x2="20" y2="46" stroke="#14181f" stroke-width="5" stroke-linecap="round"/><line x1="-40" y1="30" x2="-52" y2="40" stroke="#14181f" stroke-width="5" stroke-linecap="round"/><circle cx="-44" cy="-6" r="5" fill="#14181f"/><circle cx="40" cy="-30" r="4" fill="#14181f"/><circle cx="-2" cy="-40" r="4" fill="#14181f"/><circle cx="36" cy="40" r="4" fill="#14181f"/>
  </g>
  <text x="120" y="253" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Explosive</text>
  <g transform="translate(360,120)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <path d="M0 32 C-30 28 -34 4 -20 -14 C-18 -2 -12 2 -8 0 C-14 -20 -4 -38 10 -48 C8 -28 22 -20 26 -4 C32 14 22 30 0 32 Z" fill="#14181f"/><path d="M0 24 C-10 22 -12 10 -6 2 C-4 8 2 8 4 4 C8 10 10 20 0 24 Z" fill="#fff"/><rect x="-40" y="38" width="80" height="9" fill="#14181f"/>
  </g>
  <text x="360" y="253" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Flammable</text>
  <g transform="translate(600,120)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <path d="M0 0 C-22 -2 -24 -18 -14 -32 C-12 -22 -6 -20 -4 -22 C-8 -36 0 -46 10 -54 C10 -40 20 -32 20 -20 C22 -8 14 0 0 0 Z" fill="#14181f"/><circle cx="0" cy="18" r="15" fill="none" stroke="#14181f" stroke-width="9"/><rect x="-40" y="40" width="80" height="9" fill="#14181f"/>
  </g>
  <text x="600" y="253" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Oxidizing</text>
  <g transform="translate(840,120)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <g transform="rotate(-28)"><rect x="-46" y="-14" width="84" height="28" rx="14" fill="#14181f"/><rect x="38" y="-6" width="10" height="12" fill="#14181f"/><rect x="48" y="-10" width="6" height="20" fill="#14181f"/></g>
  </g>
  <text x="840" y="253" font-size="24" font-weight="700" fill="#14181f" text-anchor="middle">Compressed Gas</text>
  <g transform="translate(1080,120)">
    <path d="M0 -95 L95 0 L0 95 L-95 0 Z" fill="#fff" stroke="#d7322f" stroke-width="12" stroke-linejoin="round"/>
    <g transform="translate(-24,-36) rotate(-30)"><rect x="-8" y="-16" width="16" height="30" rx="3" fill="none" stroke="#14181f" stroke-width="4"/></g><g transform="translate(24,-36) rotate(30)"><rect x="-8" y="-16" width="16" height="30" rx="3" fill="none" stroke="#14181f" stroke-width="4"/></g><circle cx="-18" cy="-10" r="3.5" fill="#14181f"/><circle cx="-18" cy="2" r="3.5" fill="#14181f"/><circle cx="18" cy="-10" r="3.5" fill="#14181f"/><circle cx="18" cy="2" r="3.5" fill="#14181f"/><path d="M-46 22 L-8 22 L-8 36 L-20 36 L-24 30 L-30 36 L-46 36 Z" fill="#14181f"/><path d="M6 20 L14 18 L18 24 L24 18 L46 22 L46 36 L6 36 Z" fill="#14181f"/><rect x="-52" y="40" width="104" height="6" fill="#14181f"/>
