<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fig 16.2 (C11-CHEM, PDF p338): Pictogram of chemical hazards; five pictograms in the top row, four in the bottom row, labels as printed -->
