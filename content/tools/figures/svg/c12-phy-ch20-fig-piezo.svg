<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after Fig 20.1: in the direct piezoelectric effect, pressure on a PZT crystal between metal plates separates charges and produces a voltage; in the converse effect an alternating voltage makes the crystal change shape and vibrate, sending out ultrasound. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The piezoelectric effect (after Fig 20.1)</text>
  <rect x="15.0" y="55.0" width="430.0" height="360.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">direct: pressure produces a voltage</text>
  <rect x="120.0" y="200.0" width="220.0" height="40.0" rx="4" stroke="#7c3aed" stroke-width="2" fill="#f0abfc"/>
  <text x="230.0" y="225.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">PZT crystal</text>
  <rect x="115.0" y="192.0" width="230.0" height="8.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#9ca3af"/>
  <rect x="115.0" y="240.0" width="230.0" height="8.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#9ca3af"/>
  <line x1="230.0" y1="105.0" x2="230.0" y2="174.6" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <path d="M230.0 185.0 L224.5 173.2 L235.5 173.2 Z" fill="#1f6fb5"/>
  <line x1="230.0" y1="335.0" x2="230.0" y2="265.4" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <path d="M230.0 255.0 L235.5 266.8 L224.5 266.8 Z" fill="#1f6fb5"/>
  <text x="244.0" y="125.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">pressure</text>
  <text x="140.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="140.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="176.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="176.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="212.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="212.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="248.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="248.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="284.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="284.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <text x="320.0" y="182.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <text x="320.0" y="268.0" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700">-</text>
  <path d="M115.0 196.0 L70.0 196.0 L70.0 300.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M115.0 244.0 L90.0 244.0 L90.0 300.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80.0" cy="320.0" r="18.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="80.0" y="325.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">V</text>
  <text x="230.0" y="390.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">compressing the crystal produces electricity</text>
  <rect x="455.0" y="55.0" width="430.0" height="360.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">converse: a voltage changes the shape</text>
  <rect x="560.0" y="200.0" width="220.0" height="40.0" rx="4" stroke="#7c3aed" stroke-width="2" fill="#f0abfc"/>
  <text x="670.0" y="225.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">PZT crystal</text>
  <rect x="555.0" y="192.0" width="230.0" height="8.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#9ca3af"/>
  <rect x="555.0" y="240.0" width="230.0" height="8.0" rx="0" stroke="#4b5563" stroke-width="1" fill="#9ca3af"/>
  <path d="M555.0 196.0 L510.0 196.0 L510.0 300.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M555.0 244.0 L530.0 244.0 L530.0 300.0" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="520.0" cy="320.0" r="18.0" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <path d="M510 320 q5 -8 10 0 t10 0" stroke="#14181f" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="550.0" y="352.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">alternating voltage</text>
  <rect x="545.0" y="196.0" width="250.0" height="48.0" rx="4" stroke="#7c3aed" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
  <path d="M600 150 a28 28 0 0 1 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M646 150 a28 28 0 0 1 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M692 150 a28 28 0 0 1 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M738 150 a28 28 0 0 1 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M600 290 a28 28 0 0 0 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M646 290 a28 28 0 0 0 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M692 290 a28 28 0 0 0 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M738 290 a28 28 0 0 0 30 0" stroke="#0e9aa7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="790.0" y="140.0" font-size="12" fill="#0e9aa7" text-anchor="end" font-weight="700">ultrasound waves</text>
  <text x="670.0" y="390.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the crystal vibrates and sends out ultrasound</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
