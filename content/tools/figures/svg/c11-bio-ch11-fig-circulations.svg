<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.13 to 11.16: pulmonary and systemic circulation, with the coronary, hepatic portal and renal circuits. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="40">Two circuits: pulmonary and systemic</text>
  <!-- lungs -->
  <rect x="450" y="70" width="300" height="70" rx="16" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="k" x="600" y="100">Lungs</text><text class="s" x="600" y="124">blood is oxygenated in the lung capillaries</text>
  <!-- heart -->
  <rect x="450" y="250" width="140" height="120" rx="14" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/><text class="b" x="520" y="300" style="fill:#14181f">right side</text><text class="s" x="520" y="324">RA, RV</text>
  <rect x="610" y="250" width="140" height="120" rx="14" fill="#f6d5cf" stroke="#d7322f" stroke-width="6"/><text class="b" x="680" y="300" style="fill:#14181f">left side</text><text class="s" x="680" y="324">LA, LV</text>
  <text class="k" x="330" y="310">Heart: a double pump</text>
  <!-- pulmonary loop -->
  <path d="M520 250 V148" fill="none" stroke="#1f6fb5" stroke-width="7" marker-end="url(#ab)"/>
  <path d="M680 140 V242" fill="none" stroke="#d7322f" stroke-width="7" marker-end="url(#ar)"/>
  <text class="s" x="380" y="200">pulmonary trunk, right and left</text><text class="s" x="380" y="220">pulmonary arteries (deoxygenated)</text>
  <text class="s" x="830" y="200">pulmonary veins to the</text><text class="s" x="830" y="220">left atrium (oxygenated)</text>
  <text class="k" x="600" y="190" style="fill:#1f6fb5;font-size:15px">pulmonary</text><text class="k" x="600" y="210" style="fill:#1f6fb5;font-size:15px">circulation</text>
  <!-- systemic -->
  <text class="k" x="600" y="452" style="fill:#d7322f">Systemic circulation: aorta to every organ except the lungs, venae cavae back</text>
  <path d="M680 370 V422" stroke="#d7322f" stroke-width="7" marker-end="url(#ar)"/>
  <path d="M520 428 V376" stroke="#1f6fb5" stroke-width="7" marker-end="url(#ab)"/>
  <!-- coronary -->
  <rect x="60" y="480" width="330" height="130" rx="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="225" y="510">Coronary circulation</text>
  <text class="s" x="225" y="534">right and left coronary arteries leave the aorta</text><text class="s" x="225" y="554">near its origin and supply the heart muscle;</text><text class="s" x="225" y="574">coronary veins join into the coronary sinus,</text><text class="s" x="225" y="594">which opens into the right atrium</text>
  <!-- hepatic portal -->
  <rect x="435" y="480" width="330" height="150" rx="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="600" y="510">Hepatic portal circulation</text>
  <text class="s" x="600" y="534">a portal system: veins end in capillaries. The</text><text class="s" x="600" y="554">hepatic portal vein collects blood from the spleen</text><text class="s" x="600" y="574">and alimentary canal (lower oesophagus to upper</text><text class="s" x="600" y="594">anal canal) and takes it to the liver, which cleans</text><text class="s" x="600" y="614">and stores; hepatic veins carry it on to the heart</text>
  <!-- renal -->
  <rect x="810" y="480" width="330" height="150" rx="14" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="975" y="510">Renal circulation</text>
  <text class="s" x="975" y="534">renal arteries branch into afferent arterioles,</text><text class="s" x="975" y="554">each making the capillaries of a glomerulus;</text><text class="s" x="975" y="574">these join into an efferent arteriole, which splits</text><text class="s" x="975" y="594">into peritubular capillaries (cortex) and vasa recta</text><text class="s" x="975" y="614">(medulla); venules join into the renal vein</text>
  <text class="s" x="600" y="670">All mammals and birds have this double circulation. The right side of the heart serves the pulmonary circuit, the left side the systemic circuit.</text>
  <text class="s" x="600" y="700">In an adult about 8,000 litres of blood move through 96,000 km of blood vessels every day.</text>
  <text class="s" x="600" y="740">Blue: deoxygenated blood. Red: oxygenated blood.</text>
</svg>
