<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.2 to 5.5 and Tables 5.1 and 5.2: London forces and their factors, dipole-dipole forces, and hydrogen bonding in water, ammonia and HF. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .e{font-size:14px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Three intermolecular forces, from weakest to strongest</text>
  <!-- London -->
  <text class="k" x="200" y="70">Instantaneous dipole-induced dipole (London)</text>
  <ellipse cx="130" cy="130" rx="50" ry="30" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="150" cy="130" rx="28" ry="24" fill="#9fc3e4"/>
  <ellipse cx="270" cy="130" rx="50" ry="30" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="290" cy="130" rx="28" ry="24" fill="#9fc3e4"/>
  <g class="e"><text x="100" y="135">+</text><text x="165" y="135">-</text><text x="240" y="135">+</text><text x="305" y="135">-</text></g>
  <path d="M185 130 H215" stroke="#d7322f" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="s" x="200" y="180">a momentary lopsided electron cloud</text>
  <text class="s" x="200" y="198">(instantaneous dipole) induces a dipole in its</text>
  <text class="s" x="200" y="216">neighbour: the only force in non-polar substances</text>
  <g class="t">
    <text x="40" y="246" style="font-weight:700;fill:#14181f">Stronger with molecular mass and size:</text>
    <text x="40" y="266">F2 85, Cl2 239, Br2 333, I2 458 K (mass 38 to 254)</text>
    <text x="40" y="284">He 4.2, Ne 27.1, Ar 87.3, Kr 120, Xe 165 K</text>
    <text x="40" y="312" style="font-weight:700;fill:#14181f">Stronger with surface area (shape):</text>
    <text x="40" y="332">CH4 -164, C2H6 -88.6, C4H10 -0.5,</text>
    <text x="40" y="350">C6H14 68.7, C10H22 174.1 (degrees C)</text>
    <text x="40" y="368">pentane isomers: n-pentane 36.2,</text>
    <text x="40" y="386">isopentane 28, neopentane 9.5 (degrees C)</text>
  </g>
  <!-- chains -->
  <g stroke="#4b5563" stroke-width="2.5" fill="none"><path d="M60 425 l22 -12 l22 12 l22 -12 l22 12"/><path d="M200 425 l22 -12 l22 12 M222 413 v-18 M244 425 l22 -12"/><path d="M325 413 h26 M338 400 v26 M338 413 l-10 12 M338 413 l10 12"/></g>
  <g class="s"><text x="110" y="452">n-pentane (most contacts)</text><text x="232" y="452">isopentane</text><text x="345" y="452">neopentane (compact)</text></g>
  <!-- dipole-dipole -->
  <text class="k" x="600" y="70">Permanent dipole-permanent dipole</text>
  <g>
    <rect x="490" y="105" width="90" height="34" rx="17" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="512" y="127">H +</text><text class="e" x="558" y="127">Cl -</text>
    <rect x="600" y="105" width="90" height="34" rx="17" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="622" y="127">H +</text><text class="e" x="668" y="127">Cl -</text>
    <rect x="545" y="150" width="90" height="34" rx="17" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="567" y="172">H +</text><text class="e" x="613" y="172">Cl -</text>
    <path d="M580 122 H600" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text class="s" x="600" y="210">polar molecules line up, + end to - end:</text><text class="s" x="600" y="228">HCl, chloroform CHCl3 (H end +, Cl end -)</text>
  <!-- hydrogen bonding -->
  <text class="k" x="600" y="275">Hydrogen bond: the strongest intermolecular force</text>
  <text class="s" x="600" y="298">H bonded to F, O or N, and the electronegative atom has a lone pair;</text>
  <text class="s" x="600" y="316">shown by a dotted line; about one tenth of a covalent bond</text>
  <!-- water network -->
  <g>
    <circle cx="520" cy="380" r="16" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="520" y="385">O</text>
    <circle cx="495" cy="405" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="495" y="409" style="fill:#14181f">H</text>
    <circle cx="548" cy="402" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="548" y="406" style="fill:#14181f">H</text>
    <circle cx="600" cy="440" r="16" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="600" y="445">O</text>
    <circle cx="628" cy="420" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="628" y="424" style="fill:#14181f">H</text>
    <circle cx="590" cy="470" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="590" y="474" style="fill:#14181f">H</text>
    <circle cx="680" cy="380" r="16" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="e" x="680" y="385">O</text>
    <circle cx="660" cy="355" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="660" y="359" style="fill:#14181f">H</text>
    <circle cx="708" cy="400" r="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="s" x="708" y="404" style="fill:#14181f">H</text>
    <g stroke="#1f6fb5" stroke-width="2" stroke-dasharray="4 3"><path d="M556 408 L588 432"/><path d="M636 414 L668 390"/></g>
  </g>
  <text class="s" x="600" y="505">water: two H and two lone pairs, two hydrogen bonds per molecule,</text><text class="s" x="600" y="523">an extensive three-dimensional network; boiling point 100 degrees C</text>
  <!-- NH3 and HF -->
  <g class="t">
    <text x="840" y="70" style="font-weight:700;fill:#14181f">Ammonia and hydrogen fluoride</text>
    <text x="840" y="95">NH3: three H but only one lone pair on N,</text>
    <text x="840" y="113">so one hydrogen bond per molecule;</text>
    <text x="840" y="131">weaker than in water; boils at -33 degrees C</text>
    <text x="840" y="161">HF: three lone pairs on F but only one H,</text>
    <text x="840" y="179">so again one bond per molecule, but a strong</text>
    <text x="840" y="197">one (F is very electronegative); boils at</text>
    <text x="840" y="215">19.9 degrees C; zig-zag chains in the solid</text>
    <text x="840" y="245">HF is a weak acid: its delta+ hydrogen is</text>
    <text x="840" y="263">trapped between two fluorine atoms</text>
  </g>
  <g>
    <g class="e"><text x="880" y="330">H</text><text x="930" y="300">F</text><text x="980" y="330">H</text><text x="1030" y="300">F</text><text x="1080" y="330">H</text><text x="1130" y="300">F</text></g>
    <g stroke="#4b5563" stroke-width="2"><path d="M890 322 L920 304"/><path d="M990 322 L1020 304"/><path d="M1090 322 L1120 304"/></g>
    <g stroke="#1f6fb5" stroke-width="2" stroke-dasharray="4 3"><path d="M940 304 L970 322"/><path d="M1040 304 L1070 322"/></g>
    <text class="s" x="1000" y="360">HF zig-zag: solid line covalent, dotted hydrogen bond</text>
  </g>
  <rect x="800" y="390" width="340" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="t">
    <text x="820" y="418" style="font-weight:700;fill:#14181f">Hydrogen bonds per molecule</text>
    <text x="820" y="444">limited by the smaller of: H atoms on the</text>
    <text x="820" y="462">electronegative atom, and lone pairs on it</text>
    <text x="820" y="490">H2O: 2 H, 2 lone pairs: 2 bonds</text>
    <text x="820" y="508">NH3: 3 H, 1 lone pair: 1 bond</text>
    <text x="820" y="526">HF: 1 H, 3 lone pairs: 1 bond</text>
  </g>
  <text class="s" x="600" y="575">London forces act between all molecules; dipole-dipole forces add in polar molecules; hydrogen bonds add when H is on F, O or N.</text>
  <text class="s" x="600" y="595">All three are weaker than ionic, metallic and covalent bonds. Boiling points and masses as printed in Tables 5.1 and 5.2 and Figure 5.2.</text>
</svg>
