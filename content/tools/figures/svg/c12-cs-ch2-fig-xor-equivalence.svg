  <text x="770.0" y="104.0" font-size="26" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">Expression 2</text>
  <rect x="30.0" y="132.0" width="430.0" height="66.0" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="41.8" y="175.0" font-size="25" font-family="Times New Roman, Times, serif" xml:space="preserve"><tspan fill="#1d2330">(A </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> B) </tspan><tspan fill="#6a3fb0" font-weight="700">OR</tspan><tspan fill="#1d2330"> (B </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> A)</tspan></text>
