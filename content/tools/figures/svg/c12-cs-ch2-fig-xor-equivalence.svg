<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" font-family="Times New Roman, Times, serif">
  <rect width="1300" height="880" fill="#ffffff"/>
  <!-- Fig 2.6 (C12-CS, PDF p29), laid out as printed (key swatch for A AND B (not included) hatched, as printed): Expression 1 (A AND NOT B) OR (B AND NOT A) and Expression 2 (A OR B) AND (NOT A OR NOT B) side by side, the XOR note, then the Venn diagram panel (with its four-item legend in two rows) and the truth table panel side by side, and the Therefore line. -->
  <defs><pattern id="hy" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3e3bd"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8a7a52" stroke-width="2"/></pattern><pattern id="hb" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#3f93d8"/><line x1="0" y1="0" x2="0" y2="12" stroke="#1d4f86" stroke-width="2"/></pattern><pattern id="hw" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6b7280" stroke-width="1.6"/></pattern></defs>
  <rect x="10" y="10" width="1280" height="860" rx="4" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="650.0" y="52" font-size="28" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">The following two propositional expressions are logically equivalent.</text>
  <rect x="110" y="70" width="340" height="46" rx="8" fill="#dfe9d8" stroke="#6b7280" stroke-width="2"/>
  <text x="280" y="102" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">Expression 1</text>
  <rect x="850" y="70" width="340" height="46" rx="8" fill="#dfe9d8" stroke="#6b7280" stroke-width="2"/>
  <text x="1020" y="102" font-size="27" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">Expression 2</text>
  <rect x="30" y="128" width="570" height="66" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="315" y="171" font-size="28" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:space="preserve"><tspan fill="#1d2330">(A </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> B) </tspan><tspan fill="#6a3fb0" font-weight="700">OR</tspan><tspan fill="#1d2330"> (B </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> A)</tspan></text>
  <line x1="634" y1="155" x2="666" y2="155" stroke="#1d2330" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="634" y1="167" x2="666" y2="167" stroke="#1d2330" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M640 145 L620 161 L640 177" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M660 145 L680 161 L660 177" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="700" y="128" width="570" height="66" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="985" y="171" font-size="28" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:space="preserve"><tspan fill="#1d2330">(A </tspan><tspan fill="#6a3fb0" font-weight="700">OR</tspan><tspan fill="#1d2330"> B) </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> (</tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> A </tspan><tspan fill="#6a3fb0" font-weight="700">OR</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> B)</tspan></text>
  <rect x="250" y="212" width="800" height="56" rx="8" fill="#d6e6f7" stroke="#4a7fc1" stroke-width="2"/>
  <text x="650" y="249" font-size="27" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:space="preserve"><tspan fill="#1d2330">Both expressions are true in the same cases (</tspan><tspan fill="#e0393e" font-weight="700">XOR</tspan><tspan fill="#1d2330">).</tspan></text>
