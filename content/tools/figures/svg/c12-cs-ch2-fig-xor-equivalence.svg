  <!-- Fig 2.6 (C12-CS, PDF p29): Expression 1 (A AND NOT B) OR (B AND NOT A) and Expression 2 (A OR B) AND (NOT A OR NOT B) are equivalent (XOR), shown by a Venn diagram and a truth table. -->
