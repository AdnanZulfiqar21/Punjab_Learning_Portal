  <text x="924.0" y="422" font-size="21" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">(A AND NOT B)</text>
  <text x="924.0" y="450" font-size="21" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">OR (B AND NOT A)</text>
  <rect x="1036" y="388" width="212" height="80" rx="0" fill="#cfe2f5" stroke="#1d2330" stroke-width="1.5"/>
  <text x="1142.0" y="422" font-size="21" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">(A OR B) AND</text>
  <text x="1142.0" y="450" font-size="21" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">(NOT A OR NOT B)</text>
  <rect x="672" y="468" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="707.0" y="511" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
