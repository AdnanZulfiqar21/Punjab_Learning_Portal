  <text x="777.0" y="511" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="812" y="468" width="224" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="924.0" y="511" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="1036" y="468" width="212" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="1142.0" y="511" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="672" y="532" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="707.0" y="575" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="742" y="532" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="777.0" y="575" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="812" y="532" width="224" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="924.0" y="575" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="1036" y="532" width="212" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="1142.0" y="575" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="672" y="596" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="707.0" y="639" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="742" y="596" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="777.0" y="639" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="812" y="596" width="224" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="924.0" y="639" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="1036" y="596" width="212" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="1142.0" y="639" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="672" y="660" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="707.0" y="703" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="742" y="660" width="70" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="777.0" y="703" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">T</text>
  <rect x="812" y="660" width="224" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="924.0" y="703" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="1036" y="660" width="212" height="64" rx="0" fill="#ffffff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="1142.0" y="703" font-size="30" fill="#1d2330" text-anchor="middle" font-family="Times New Roman, Times, serif">F</text>
  <rect x="40" y="772" width="1220" height="66" rx="8" fill="#eef1ec" stroke="#4b5563" stroke-width="2"/>
  <text x="706" y="815" font-size="27" text-anchor="end" font-family="Times New Roman, Times, serif" xml:space="preserve"><tspan fill="#1d2330">Therefore: (A </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> B) </tspan><tspan fill="#6a3fb0" font-weight="700">OR</tspan><tspan fill="#1d2330"> (B </tspan><tspan fill="#2b3fa8" font-weight="700">AND</tspan><tspan fill="#1d2330"> </tspan><tspan fill="#e0393e" font-weight="700">NOT</tspan><tspan fill="#1d2330"> A)</tspan></text>
