<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original: XOR Venn diagram and truth table showing two equivalent expressions. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Two equivalent expressions: exclusive OR (after Fig 2.6)</text>
  <rect x="30.0" y="62.0" width="840.0" height="56.0" rx="8" stroke="#14181f" stroke-width="1.5" fill="#f7f9fc"/>
  <text x="450.0" y="86.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700">(A AND NOT B) OR (B AND NOT A)</text>
  <text x="450.0" y="108.0" font-size="16" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#8801;   (A OR B) AND (NOT A OR NOT B)</text>
  <rect x="60.0" y="150.0" width="300.0" height="200.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <circle cx="170.0" cy="260.0" r="75.0" stroke="#14181f" stroke-width="2" fill="#f6c99a"/>
  <circle cx="250.0" cy="260.0" r="75.0" stroke="#14181f" stroke-width="2" fill="#f6c99a"/>
  <clipPath id="x1"><circle cx="170" cy="260" r="75"/></clipPath>
  <circle cx="250" cy="260" r="75" fill="#ffffff" clip-path="url(#x1)"/>
  <circle cx="170.0" cy="260.0" r="75.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <circle cx="250.0" cy="260.0" r="75.0" stroke="#14181f" stroke-width="2" fill="none"/>
  <text x="140.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="280.0" y="266.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="210.0" y="375.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">shaded: A or B, but not both</text>
  <rect x="410.0" y="150.0" width="440.0" height="210.0" rx="6" stroke="#14181f" stroke-width="1.5" fill="#ffffff"/>
  <text x="440.0" y="180.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <text x="500.0" y="180.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <text x="600.0" y="180.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">first</text>
  <text x="760.0" y="180.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">second</text>
  <line x1="410.0" y1="192.0" x2="850.0" y2="192.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="440.0" y="222.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="500.0" y="222.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="600.0" y="222.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="760.0" y="222.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="440.0" y="258.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="500.0" y="258.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="600.0" y="258.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="760.0" y="258.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="440.0" y="294.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="500.0" y="294.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="600.0" y="294.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="760.0" y="294.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="440.0" y="330.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="500.0" y="330.0" font-size="15" fill="#0f7a62" text-anchor="middle" font-weight="700">T</text>
  <text x="600.0" y="330.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="760.0" y="330.0" font-size="15" fill="#d7322f" text-anchor="middle" font-weight="700">F</text>
  <text x="630.0" y="385.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">the last two columns agree in every row</text>
  <text x="450.0" y="435.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">Same truth value in all cases, so the expressions are equivalent (both are XOR).</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
