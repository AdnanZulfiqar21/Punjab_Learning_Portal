<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.7: apoplast, symplast and vacuolar pathways through the root cortex to the xylem. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563}
      .k{font-size:19px;font-weight:700;fill:#14181f}
      .c{font-size:18px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b3fb5"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="40">Three pathways of water across the root</text>
  <!-- root hair -->
  <path d="M60 300 q-50 -40 0 -80 h80 v160 h-80 q-50 -40 0 -80 z" fill="#eef6fb" stroke="#1f6fb5" stroke-width="3"/>
  <path d="M60 300 q-70 -120 -50 -170 q10 -5 20 0 q0 60 60 120" fill="#eef6fb" stroke="#1f6fb5" stroke-width="3"/>
  <text class="s" x="20" y="470">root hair</text><text class="s" x="20" y="492">(epidermis)</text>
  <!-- cortex cells: 4 columns -->
  <g fill="#eef6fb" stroke="#1f6fb5" stroke-width="3">
    <rect x="160" y="220" width="140" height="160" rx="10"/><rect x="320" y="220" width="140" height="160" rx="10"/><rect x="480" y="220" width="140" height="160" rx="10"/><rect x="640" y="220" width="140" height="160" rx="10"/>
  </g>
  <!-- vacuoles -->
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><ellipse cx="230" cy="300" rx="50" ry="40"/><ellipse cx="390" cy="300" rx="50" ry="40"/><ellipse cx="550" cy="300" rx="50" ry="40"/><ellipse cx="710" cy="300" rx="50" ry="40"/></g>
  <!-- walls gap = apoplast -->
  <text class="c" x="470" y="200">cortex</text>
  <!-- endodermis with casparian strip -->
  <rect x="800" y="210" width="80" height="180" rx="8" fill="#e1f3ec" stroke="#0f7a62" stroke-width="3"/>
  <rect x="796" y="210" width="8" height="180" fill="#8a4b00"/><rect x="876" y="210" width="8" height="180" fill="#8a4b00"/>
  <text class="c" x="840" y="200">endodermis</text>
  <text class="s" x="790" y="420">Casparian strip</text><text class="s" x="790" y="442">blocks the apoplast</text>
  <!-- xylem -->
  <rect x="920" y="190" width="120" height="220" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="5"/>
  <text class="k" x="945" y="305">xylem</text>
  <path d="M980 410 V470" stroke="#d98b2b" stroke-width="6" marker-end="url(#ao)"/><text class="c" x="980" y="500">up the stem</text>
  <!-- apoplast path: along walls (top edge) -->
  <path d="M140 225 H300 M305 225 H460 M465 225 H620 M625 225 H780" stroke="#d98b2b" stroke-width="5" marker-end="url(#ao)"/>
  <path d="M780 225 L795 225" stroke="#d98b2b" stroke-width="5"/>
  <circle cx="800" cy="225" r="10" fill="none" stroke="#d7322f" stroke-width="3"/><path d="M793 218 L807 232" stroke="#d7322f" stroke-width="3"/>
  <!-- symplast path: through cytoplasm and plasmodesmata (mid height, above vacuole) -->
  <path d="M140 255 H780 M884 255 H915" stroke="#5b3fb5" stroke-width="5" marker-end="url(#ap)"/>
  <path d="M804 255 H876" stroke="#5b3fb5" stroke-width="5"/>
  <!-- vacuolar path: through vacuoles -->
  <path d="M140 300 H915" stroke="#1f6fb5" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ab)"/>
  <!-- legend -->
  <g font-size="19" font-weight="700">
    <path d="M100 560 H150" stroke="#d98b2b" stroke-width="6"/><text x="160" y="566" fill="#d98b2b">Apoplast: through cell walls; stopped at the endodermis by the Casparian strip</text>
    <path d="M100 595 H150" stroke="#5b3fb5" stroke-width="6"/><text x="160" y="601" fill="#5b3fb5">Symplast: cytoplasm to cytoplasm through plasmodesmata</text>
    <path d="M100 630 H150" stroke="#1f6fb5" stroke-width="4" stroke-dasharray="10 6"/><text x="160" y="636" fill="#1f6fb5">Vacuolar: vacuole to vacuole across membranes and tonoplasts; negligible</text>
  </g>
</svg>
