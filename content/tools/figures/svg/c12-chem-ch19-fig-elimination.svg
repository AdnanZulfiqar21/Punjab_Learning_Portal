  <text x="359.0" y="190.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"></tspan></text>
  <text x="480.0" y="190.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">Br</tspan></text>
  <text x="200.0" y="95.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">H</tspan></text>
