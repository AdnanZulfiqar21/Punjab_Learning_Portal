<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="575" fill="#ffffff"/>
  <!-- Original diagram after Figure 20.4: bacteria without a plasmid die on antibiotic; those with a plain plasmid grow into blue colonies because lacZ' works; those with a recombinant plasmid grow into white colonies because the insert breaks lacZ'. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Screening: which bacteria have the recombinant plasmid?</text>
  <rect x="20.0" y="70.0" width="520.0" height="110.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <ellipse cx="110.0" cy="124.0" rx="60.0" ry="32.0" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <text x="190.0" y="114.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">no plasmid</text>
  <text x="190.0" y="138.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">killed by the antibiotic</text>
  <rect x="20.0" y="200.0" width="520.0" height="110.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <ellipse cx="110.0" cy="254.0" rx="60.0" ry="32.0" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <circle cx="100.0" cy="254.0" r="18.0" stroke="#1f6fb5" stroke-width="5" fill="none"/>
  <path d="M93.8 237.1 A18 18 0 0 1 106.2 237.1" stroke="#a855f7" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="300.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700"></text>
  <text x="190.0" y="244.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">plasmid without the gene</text>
  <text x="190.0" y="268.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">grows; lacZ' works: BLUE colony</text>
  <rect x="20.0" y="330.0" width="520.0" height="110.0" rx="8" stroke="#e2e8f0" stroke-width="1" fill="#f8fafc"/>
  <ellipse cx="110.0" cy="384.0" rx="60.0" ry="32.0" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <circle cx="100.0" cy="384.0" r="18.0" stroke="#1f6fb5" stroke-width="5" fill="none"/>
  <path d="M93.8 367.1 A18 18 0 0 1 106.2 367.1" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="190.0" y="374.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">recombinant plasmid</text>
  <text x="190.0" y="398.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">grows; gene breaks lacZ': WHITE colony</text>
  <text x="110.0" y="470.0" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="700">purple bit = working lacZ' gene</text>
  <circle cx="720.0" cy="260.0" r="150.0" stroke="#94a3b8" stroke-width="3" fill="#fef9c3"/>
  <circle cx="720.0" cy="260.0" r="140.0" stroke="#cbd5e1" stroke-width="1" fill="none"/>
  <text x="720.0" y="92.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">plate: antibiotic (e.g. ampicillin)</text>
  <text x="720.0" y="108.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">+ the special sugar</text>
  <circle cx="650.0" cy="200.0" r="14.0" stroke="#475569" stroke-width="2" fill="#3b82f6"/>
  <circle cx="750.0" cy="180.0" r="14.0" stroke="#475569" stroke-width="2" fill="#ffffff"/>
  <circle cx="800.0" cy="250.0" r="14.0" stroke="#475569" stroke-width="2" fill="#3b82f6"/>
  <circle cx="680.0" cy="290.0" r="14.0" stroke="#475569" stroke-width="2" fill="#ffffff"/>
  <circle cx="760.0" cy="330.0" r="14.0" stroke="#475569" stroke-width="2" fill="#3b82f6"/>
  <circle cx="630.0" cy="340.0" r="14.0" stroke="#475569" stroke-width="2" fill="#3b82f6"/>
  <circle cx="820.0" cy="330.0" r="14.0" stroke="#475569" stroke-width="2" fill="#ffffff"/>
  <circle cx="710.0" cy="240.0" r="14.0" stroke="#475569" stroke-width="2" fill="#3b82f6"/>
  <text x="600.0" y="455.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">white = recombinant: keep</text>
  <line x1="596.0" y1="450.0" x2="680.0" y2="290.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="680.0" cy="290.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <rect x="40.0" y="495.0" width="820.0" height="50.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="516.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">antibiotic resistance gene: selects cells with any plasmid</text>
  <text x="450.0" y="536.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">blue-white test: picks out the plasmids that carry the inserted gene</text>
  <text x="450.0" y="566" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
