<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <!-- Original drawing after the textbook's Fig 15.17: laser light passes through a diffraction grating to a screen at distance p; bright orders n = 0, 1 and 2 appear on both sides, the first and second orders at angles theta1 and theta2. The printed figure labels the orders 'a = ...' and both angles theta1; drawn as n and theta1, theta2. -->
