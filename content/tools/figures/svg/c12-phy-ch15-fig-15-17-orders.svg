  <rect x="170.0" y="284.0" width="70.0" height="32.0" rx="4" stroke="#3a3f45" stroke-width="2" fill="#9aa0a6"/>
  <ellipse cx="260.0" cy="300.0" rx="9.0" ry="34.0" stroke="#14181f" stroke-width="2.5" fill="#e8e8e8"/>
  <line x1="800.0" y1="80.0" x2="800.0" y2="520.0" stroke="#14181f" stroke-width="6" stroke-linecap="round"/>
  <line x1="266.0" y1="300.0" x2="800.0" y2="140.0" stroke="#e0177d" stroke-width="4" stroke-linecap="round"/>
  <text x="870.0" y="150.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">n = 2</text>
  <line x1="266.0" y1="300.0" x2="800.0" y2="220.0" stroke="#e0177d" stroke-width="4" stroke-linecap="round"/>
  <text x="870.0" y="230.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">n = 1</text>
  <line x1="266.0" y1="300.0" x2="800.0" y2="300.0" stroke="#e0177d" stroke-width="4" stroke-linecap="round"/>
  <text x="870.0" y="310.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">n = 0</text>
  <line x1="266.0" y1="300.0" x2="800.0" y2="380.0" stroke="#e0177d" stroke-width="4" stroke-linecap="round"/>
  <text x="870.0" y="390.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">n = 1</text>
  <line x1="266.0" y1="300.0" x2="800.0" y2="460.0" stroke="#e0177d" stroke-width="4" stroke-linecap="round"/>
  <text x="870.0" y="470.0" font-size="30" fill="#14181f" text-anchor="start" font-weight="400">n = 2</text>
  <path d="M520.0 300.0 A260.0 260.0 0 0 0 517.2 261.9" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="538.0" y="282.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" font-style="italic">&#952;<tspan dy="7.8" font-size="19.0">1</tspan><tspan dy="-7.8">&#8203;</tspan></text>
  <path d="M457.8 270.7 A200.0 200.0 0 0 0 451.8 243.2" stroke="#14181f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="456.0" y="224.0" font-size="28" fill="#14181f" text-anchor="start" font-weight="700" font-style="italic">&#952;<tspan dy="7.8" font-size="19.0">2</tspan><tspan dy="-7.8">&#8203;</tspan></text>
  <text x="990.0" y="30.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="400">Orders of the</text>
  <text x="990.0" y="60.0" font-size="26" fill="#14181f" text-anchor="end" font-weight="400">Diffraction pattern</text>
  <text x="780.0" y="110.0" font-size="30" fill="#14181f" text-anchor="end" font-weight="400">Screen</text>
  <text x="70.0" y="370.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Laser</text>
  <text x="260.0" y="380.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">Diffraction</text>
  <text x="260.0" y="414.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400">grating</text>
