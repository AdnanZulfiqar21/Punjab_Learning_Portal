  <rect x="60.0" y="350.0" width="780.0" height="90.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="80.0" y="378.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Probe: a radioactive DNA strand complementary to the gene of interest.</text>
  <text x="80.0" y="400.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">It hybridizes only where the gene is present; autoradiography (photographic film) shows</text>
  <text x="80.0" y="422.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">those spots, which are matched back to living colonies on the master plate.</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
