<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram after Figures 20.2 and 20.3: a gene of interest cut from source DNA and a bacterial plasmid cut with the same restriction enzyme, joined by DNA ligase into a recombinant plasmid that is taken up and cloned by a bacterium. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Making a recombinant plasmid</text>
  <rect x="15.0" y="55.0" width="420.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="225.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">source DNA (e.g. human)</text>
  <line x1="40.0" y1="150.0" x2="410.0" y2="150.0" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
  <line x1="160.0" y1="150.0" x2="290.0" y2="150.0" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <text x="225.0" y="135.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">gene of interest</text>
  <path d="M160 120 l0 60" stroke="#d98b2b" stroke-width="2.5" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M290 120 l0 60" stroke="#d98b2b" stroke-width="2.5" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="225.0" y="210.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cut with a restriction enzyme</text>
  <line x1="160.0" y1="250.0" x2="290.0" y2="250.0" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <path d="M160 244 l-12 0 l0 12" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M290 256 l12 0 l0 -12" stroke="#0f7a62" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="225.0" y="282.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">gene with sticky ends</text>
  <rect x="465.0" y="55.0" width="420.0" height="250.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="675.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">vector: bacterial plasmid</text>
  <circle cx="600.0" cy="170.0" r="62.0" stroke="#1f6fb5" stroke-width="8" fill="none"/>
  <rect x="560.0" y="102.0" width="30.0" height="16.0" rx="3" stroke="#d98b2b" stroke-width="1.5" fill="#ffedd5"/>
  <text x="600.0" y="170.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">plasmid</text>
  <line x1="680.0" y1="170.0" x2="713.6" y2="170.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M720.0 170.0 L712.7 173.4 L712.7 166.6 Z" fill="#14181f"/>
  <path d="M811.2 111.7 A62 62 0 1 1 768.8 111.7" stroke="#1f6fb5" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="790.0" y="260.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cut with the SAME enzyme</text>
  <text x="790.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">(compatible sticky ends)</text>
  <line x1="450.0" y1="320.0" x2="450.0" y2="352.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 360.0 L445.8 350.9 L454.2 350.9 Z" fill="#14181f"/>
  <text x="462.0" y="346.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">mix with DNA ligase (phosphodiester bonds)</text>
  <circle cx="450.0" cy="460.0" r="72.0" stroke="#1f6fb5" stroke-width="8" fill="none"/>
  <path d="M419.6 394.7 A72 72 0 0 1 480.4 394.7" stroke="#dc2626" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450.0" y="466.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">recombinant</text>
  <text x="450.0" y="484.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">plasmid (rDNA)</text>
  <line x1="540.0" y1="460.0" x2="612.0" y2="460.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M620.0 460.0 L610.9 464.2 L610.9 455.8 Z" fill="#14181f"/>
  <ellipse cx="720.0" cy="460.0" rx="90.0" ry="50.0" stroke="#15803d" stroke-width="2.5" fill="#dcfce7"/>
  <circle cx="700.0" cy="460.0" r="22.0" stroke="#1f6fb5" stroke-width="5" fill="none"/>
  <path d="M689.0 440.9 A22 22 0 0 1 711.0 440.9" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="760.0" cy="455.0" rx="22.0" ry="10.0" stroke="#15803d" stroke-width="1.5" fill="none"/>
  <text x="720.0" y="540.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">taken up by a bacterium,</text>
  <text x="720.0" y="558.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">which copies it as it divides (cloning)</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
