<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1300" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 1.1, 10.2 (blocks) and 1.3 (metals, metalloids, non-metals): a schematic periodic table with periods, groups, blocks, families and the stair-step line. Element names and masses are not reproduced. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .g{font-size:13px;fill:#4b5563;text-anchor:middle}
      .e{font-size:13px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563}
      .k{font-size:16px;font-weight:700;fill:#14181f}
    </style>
  </defs>
  <text class="h" x="650" y="36">The modern periodic table: 7 periods, 18 groups, 4 blocks</text>
  <!-- group numbers -->
  <g class="g">
    <text x="80" y="72">1</text><text x="140" y="72">2</text>
    <text x="200" y="72">3</text><text x="260" y="72">4</text><text x="320" y="72">5</text><text x="380" y="72">6</text><text x="440" y="72">7</text><text x="500" y="72">8</text><text x="560" y="72">9</text><text x="620" y="72">10</text><text x="680" y="72">11</text><text x="740" y="72">12</text>
    <text x="800" y="72">13</text><text x="860" y="72">14</text><text x="920" y="72">15</text><text x="980" y="72">16</text><text x="1040" y="72">17</text><text x="1100" y="72">18</text>
    <text x="1130" y="60" style="font-weight:700">GROUP</text>
  </g>
  <!-- period numbers -->
  <g class="g"><text x="40" y="112">1</text><text x="40" y="162">2</text><text x="40" y="212">3</text><text x="40" y="262">4</text><text x="40" y="312">5</text><text x="40" y="362">6</text><text x="40" y="412">7</text><text x="22" y="92" style="font-weight:700;font-size:11px">PERIOD</text></g>
  <!-- s block: groups 1-2 (H in group 1), He in group 18 -->
  <g fill="#f6d5cf" stroke="#b5463a" stroke-width="1.5">
    <rect x="55" y="85" width="50" height="40"/>
    <rect x="55" y="135" width="50" height="40"/><rect x="115" y="135" width="50" height="40"/>
    <rect x="55" y="185" width="50" height="40"/><rect x="115" y="185" width="50" height="40"/>
    <rect x="55" y="235" width="50" height="40"/><rect x="115" y="235" width="50" height="40"/>
    <rect x="55" y="285" width="50" height="40"/><rect x="115" y="285" width="50" height="40"/>
    <rect x="55" y="335" width="50" height="40"/><rect x="115" y="335" width="50" height="40"/>
    <rect x="55" y="385" width="50" height="40"/><rect x="115" y="385" width="50" height="40"/>
    <rect x="1075" y="85" width="50" height="40"/>
  </g>
  <!-- d block: groups 3-12, periods 4-7 -->
  <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="1.5">
    <rect x="175" y="235" width="590" height="40"/><rect x="175" y="285" width="590" height="40"/><rect x="175" y="335" width="590" height="40"/><rect x="175" y="385" width="590" height="40"/>
  </g>
  <g stroke="#1f6fb5" stroke-width="1" opacity="0.5"><path d="M235 235 v190 M295 235 v190 M355 235 v190 M415 235 v190 M475 235 v190 M535 235 v190 M595 235 v190 M655 235 v190 M715 235 v190"/></g>
  <!-- p block: groups 13-18, periods 2-7 -->
  <g fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5">
    <rect x="775" y="135" width="350" height="40"/><rect x="775" y="185" width="350" height="40"/><rect x="775" y="235" width="350" height="40"/><rect x="775" y="285" width="350" height="40"/><rect x="775" y="335" width="350" height="40"/><rect x="775" y="385" width="350" height="40"/>
  </g>
  <g stroke="#d98b2b" stroke-width="1" opacity="0.6"><path d="M835 135 v290 M895 135 v290 M955 135 v290 M1015 135 v290 M1075 135 v290"/></g>
  <!-- f block below -->
  <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"><rect x="235" y="450" width="840" height="36"/><rect x="235" y="492" width="840" height="36"/></g>
  <text class="g" x="150" y="474">lanthanides (period 6)</text><text class="g" x="150" y="516">actinides (period 7)</text>
  <path d="M205 425 q0 40 30 45" fill="none" stroke="#5b3fb5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- stair-step line: B, Si, Ge, As, Sb, Te, Po -->
  <path d="M835 135 v50 h60 v50 h60 v50 h60 v50 h60 v50 h60 v40" fill="none" stroke="#14181f" stroke-width="4"/>
  <!-- element symbols for orientation -->
  <g class="e">
    <text x="80" y="110">H</text><text x="1100" y="110">He</text>
    <text x="80" y="160">Li</text><text x="140" y="160">Be</text><text x="800" y="160">B</text><text x="860" y="160">C</text><text x="920" y="160">N</text><text x="980" y="160">O</text><text x="1040" y="160">F</text><text x="1100" y="160">Ne</text>
    <text x="80" y="210">Na</text><text x="140" y="210">Mg</text><text x="800" y="210">Al</text><text x="860" y="210">Si</text><text x="920" y="210">P</text><text x="980" y="210">S</text><text x="1040" y="210">Cl</text><text x="1100" y="210">Ar</text>
    <text x="80" y="260">K</text><text x="140" y="260">Ca</text><text x="205" y="260">Sc</text><text x="745" y="260">Zn</text><text x="800" y="260">Ga</text><text x="860" y="260">Ge</text><text x="920" y="260">As</text><text x="980" y="260">Se</text><text x="1040" y="260">Br</text><text x="1100" y="260">Kr</text>
    <text x="80" y="310">Rb</text><text x="140" y="310">Sr</text><text x="860" y="310">Sn</text><text x="920" y="310">Sb</text><text x="980" y="310">Te</text><text x="1040" y="310">I</text><text x="1100" y="310">Xe</text>
    <text x="80" y="360">Cs</text><text x="140" y="360">Ba</text><text x="980" y="360">Po</text><text x="1040" y="360">At</text><text x="1100" y="360">Rn</text>
    <text x="80" y="410">Fr</text><text x="140" y="410">Ra</text><text x="1100" y="410">Og</text>
  </g>
  <!-- legend -->
  <g font-size="15" fill="#4b5563">
    <rect x="60" y="560" width="22" height="16" fill="#f6d5cf" stroke="#b5463a"/><text x="90" y="573">s block: groups 1 and 2 (and He); valence electrons in s</text>
    <rect x="60" y="586" width="22" height="16" fill="#fff4e2" stroke="#d98b2b"/><text x="90" y="599">p block: groups 13 to 18; valence electrons in p</text>
    <rect x="60" y="612" width="22" height="16" fill="#dbe9f5" stroke="#1f6fb5"/><text x="90" y="625">d block: transition metals, groups 3 to 12</text>
    <rect x="60" y="638" width="22" height="16" fill="#e8dff7" stroke="#5b3fb5"/><text x="90" y="651">f block: lanthanides and actinides</text>
    <path d="M60 674 h22" stroke="#14181f" stroke-width="4"/><text x="90" y="679">stair-step line from B to Po: metals to its left, metalloids (B, Si, Ge, As, Sb, Te) along it, non-metals to its right; H is the exception</text>
    <text x="60" y="706">Families: alkali metals (group 1), alkaline earth metals (group 2), transition metals (d and f blocks), chalcogens (group 16),</text>
    <text x="60" y="728">halogens (group 17), noble gases (group 18). Elements in a group share valence electrons; properties change gradually along a period.</text>
  </g>
  <text class="s" x="650" y="752" text-anchor="middle">Schematic after Figures 1.1 and 10.2; 118 elements in order of atomic number; symbols shown only at the edges of each block.</text>
</svg>
