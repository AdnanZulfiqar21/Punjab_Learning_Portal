<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- 2-Methylpropane: the three CH3 carbons in one colour, the CH carbon in another. -->
  <text x="240.0" y="216.1" font-size="46" fill="#1aa3d9" text-anchor="middle" font-weight="600"><tspan dy="0.0">H</tspan><tspan dy="14.7" font-size="32.2">3</tspan><tspan dy="-14.7">C</tspan></text>
  <text x="450.0" y="216.1" font-size="46" fill="#d6177d" text-anchor="middle" font-weight="600"><tspan dy="0.0">CH</tspan></text>
  <text x="650.0" y="216.1" font-size="46" fill="#1aa3d9" text-anchor="middle" font-weight="600"><tspan dy="0.0">CH</tspan><tspan dy="14.7" font-size="32.2">3</tspan></text>
  <text x="465.0" y="96.1" font-size="46" fill="#1aa3d9" text-anchor="middle" font-weight="600"><tspan dy="0.0">CH</tspan><tspan dy="14.7" font-size="32.2">3</tspan></text>
  <line x1="300.0" y1="200.0" x2="405.0" y2="200.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="497.0" y1="200.0" x2="597.0" y2="200.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="440.0" y1="170.0" x2="440.0" y2="110.0" stroke="#14181f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="450.0" y="320.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700">2-methylpropane</text>
</svg>
