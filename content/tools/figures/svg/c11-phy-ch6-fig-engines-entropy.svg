<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 6.8 to 6.10 and topics 6.6 to 6.11: the heat engine, the second law, the Carnot cycle and efficiency, the refrigerator and entropy. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Heat engine, second law, Carnot cycle, refrigerator and entropy</text>
  <!-- heat engine -->
  <rect x="50" y="55" width="300" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="200" y="83">Heat engine (6.6, 6.7, Fig. 6.8)</text>
  <rect x="120" y="100" width="160" height="30" rx="6" fill="#f8c8b8" stroke="#d7322f"/><text class="r" x="140" y="120">hot reservoir T1</text>
  <path d="M200 130 V175" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/><text class="l" x="214" y="150" style="fill:#d7322f">Q1</text>
  <circle cx="200" cy="210" r="32" fill="#fde8e7" stroke="#4b5563" stroke-width="1.5"/><text class="r" x="182" y="214">engine</text>
  <path d="M232 210 H300" stroke="#0f7a62" stroke-width="3" marker-end="url(#g)"/><text class="l" x="262" y="200" style="fill:#0f7a62">W</text>
  <path d="M200 242 V290" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/><text class="l" x="214" y="264" style="fill:#1f6fb5">Q2</text>
  <rect x="120" y="296" width="160" height="30" rx="6" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="136" y="316">cold reservoir T2</text>
  <text class="f" x="70" y="350">W = Q1 - Q2 (delta U = 0 per cycle)</text>
  <text class="r" x="70" y="370">petrol engines about 25%, diesel 35 to 40%</text>
  <!-- second law -->
  <rect x="370" y="55" width="400" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="570" y="83">Second law (6.7) and Carnot's theorem (6.8)</text>
  <g class="t">
    <text x="390" y="110"><tspan class="b">Kelvin:</tspan> it is impossible to devise a process which may convert</text>
    <text x="390" y="126">heat, extracted from a single reservoir, entirely into work without</text>
    <text x="390" y="142">leaving any change in the working system</text>
    <text x="390" y="164">a single reservoir, however much energy it holds (oceans, the</text>
    <text x="390" y="180">atmosphere), cannot be made to do work: a source at high T and</text>
    <text x="390" y="196">a sink at low T are both essential</text>
    <text x="390" y="220"><tspan class="b">Clausius:</tspan> heat cannot flow of itself from a cold to a hot body;</text>
    <text x="390" y="236">a refrigerator needs external work</text>
    <text x="390" y="260"><tspan class="b">Carnot's theorem:</tspan> no heat engine can be more efficient than a</text>
    <text x="390" y="276">Carnot engine operating between the same two temperatures;</text>
    <text x="390" y="292">all Carnot engines between the same two temperatures have the</text>
    <text x="390" y="308">same efficiency, whatever the working substance</text>
    <text x="390" y="332">the first law allows heat to become an equal amount of work but</text>
    <text x="390" y="348">is silent on the conditions; the second law gives them and the</text>
    <text x="390" y="364">direction of heat flow</text>
  </g>
  <!-- carnot cycle -->
  <rect x="790" y="55" width="360" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Carnot cycle (Fig. 6.9)</text>
  <path d="M820 300 H1130" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><path d="M820 300 V100" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M860 120 Q 900 170 960 180 L 1010 240 Q 950 230 900 200 L 860 120 Z" fill="#c7d9b0" opacity="0.6"/>
  <path d="M860 120 Q 900 170 960 180" fill="none" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M960 180 L1010 240" fill="none" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M1010 240 Q 950 230 900 200" fill="none" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M900 200 L860 120" fill="none" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <text class="l" x="848" y="116">A</text><text class="l" x="966" y="176">B</text><text class="l" x="1016" y="250">C</text><text class="l" x="884" y="210">D</text>
  <text class="r" x="905" y="148" style="fill:#d7322f">AB isothermal, T1, +Q1</text>
  <text class="r" x="1010" y="210" style="fill:#1f6fb5">BC adiabatic</text>
  <text class="r" x="930" y="262" style="fill:#d7322f">CD isothermal, T2, -Q2</text>
  <text class="r" x="828" y="190" style="fill:#1f6fb5">DA adiabatic</text>
  <text class="r" x="828" y="104">P</text><text class="r" x="1120" y="316">V</text>
  <g class="f" style="font-size:11px">
    <text x="810" y="338">eta = (Q1-Q2)/Q1 (6.6) = (T1-T2)/T1 = 1 - T2/T1 (6.7)</text>
    <text x="810" y="356">% efficiency = (1 - T2/T1) x 100; 100% only if T2 = 0 K</text>
    <text x="810" y="374">Ex 6.3: 427 C and 77 C: (700 - 350)/700 = 50%</text>
  </g>
  <!-- refrigerator -->
  <rect x="50" y="405" width="420" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="260" y="433">Refrigerator (6.9, Fig. 6.10)</text>
  <rect x="90" y="446" width="170" height="26" rx="6" fill="#f8c8b8" stroke="#d7322f"/><text class="r" x="96" y="463">hot surroundings (HTR) T2</text>
  <path d="M175 530 V474" stroke="#d7322f" stroke-width="3" marker-end="url(#p)"/><text class="l" x="186" y="500" style="fill:#d7322f">Q_H out</text>
  <circle cx="175" cy="560" r="28" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text class="r" x="160" y="564">fridge</text>
  <path d="M260 560 H205" stroke="#0f7a62" stroke-width="3" marker-end="url(#g)"/><text class="l" x="268" y="564" style="fill:#0f7a62">W in</text>
  <path d="M175 640 V590" stroke="#1f6fb5" stroke-width="3" marker-end="url(#bl)"/><text class="l" x="186" y="628" style="fill:#1f6fb5">Q_C in</text>
  <rect x="90" y="646" width="170" height="26" rx="6" fill="#bcdcf0" stroke="#1f6fb5"/><text class="r" x="96" y="663">cold compartment (LTR) T1</text>
  <g class="f" style="font-size:11px">
    <text x="300" y="490">Q_C + W = Q_H</text>
    <text x="300" y="508">E = Q_C / W</text>
    <text x="300" y="526">  = Q_C/(Q_H - Q_C)</text>
    <text x="300" y="544">  = T1/(T2 - T1)</text>
  </g>
  <g class="t">
    <text x="300" y="574">a heat engine in reverse</text>
    <text x="300" y="590">(Clausius); work done ON</text>
    <text x="300" y="606">the system</text>
    <text x="300" y="630">Ex 6.4: E = 8, T1 = 250 K:</text>
    <text x="300" y="646">T2 = 250/8 + 250 = 281.25 K</text>
    <text x="300" y="662">= 8.25 C</text>
  </g>
  <!-- entropy -->
  <rect x="490" y="405" width="660" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="820" y="433">Entropy (printed 6.11; 6.10 is skipped)</text>
  <text class="f" x="510" y="460">delta S = delta Q / T  (6.8), J K^-1 (Clausius, 1856)</text>
  <g class="t">
    <text x="510" y="486">a state variable alongside P, V, T and U; positive when heat is added, negative when removed;</text>
    <text x="510" y="502">only the change in entropy matters</text>
    <text x="510" y="524"><tspan class="b">heat Q from T1 to T2 (T1 greater):</tspan> hot reservoir loses Q/T1, cold gains Q/T2; Q/T2 is larger,</text>
    <text x="510" y="540">so the net change Q/T2 - Q/T1 is positive: natural heat flow always raises the total entropy</text>
    <text x="510" y="562"><tspan class="b">second law (entropy form):</tspan> a natural process goes in the direction that increases the</text>
    <text x="510" y="578">entropy of the system plus its environment; entropy stays constant only in a reversible process</text>
    <text x="510" y="600"><tspan class="b">disorder:</tspan> heat flow from hot to cold, adding heat, or free expansion all increase molecular</text>
    <text x="510" y="616">disorder; mixing hot and cold water loses the chance to extract work: energy is degraded from</text>
    <text x="510" y="632">a higher, more orderly level to thermal energy; the entropy of the universe always increases</text>
    <text x="510" y="658"><tspan class="b">Example 6.5:</tspan> 1.0 kg of ice melting at 0 C, L_f = 3.36 x 10^5 J kg^-1: delta S = m L_f / T</text>
    <text x="510" y="674">= 3.36 x 10^5 / 273 = 1.23 x 10^3 J K^-1, a measure of the greater disorder of liquid water</text>
  </g>
  <text class="s" x="600" y="712" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
