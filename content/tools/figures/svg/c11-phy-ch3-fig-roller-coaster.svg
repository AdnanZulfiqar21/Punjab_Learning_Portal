<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis3-2 (C11-PHY, PDF p58): Point to Ponder photograph of a roller coaster (no printed caption number); flat drawing after the printed photograph: a large red looping track in front, a train of cars running upside down along the top of the loop, a smaller orange loop inside it, a blue track crossing low, and a cream lattice support tower on the right against a pale sky. No photograph is reproduced. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d9e8"/><stop offset="1" stop-color="#eef2f5"/></linearGradient>
    <clipPath id="frame"><rect x="20" y="20" width="960" height="860"/></clipPath>
  </defs>
  <rect width="1000" height="900" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="960" height="860" fill="url(#sky)"/>
    <!-- lattice tower on the right -->
    <g stroke="#d8c7a6" stroke-width="16" fill="none">
      <line x1="760" y1="900" x2="930" y2="20"/>
      <line x1="860" y1="900" x2="1010" y2="60"/>
    </g>
    <g stroke="#cdb994" stroke-width="7" fill="none">
      <line x1="775" y1="820" x2="880" y2="840"/><line x1="790" y1="740" x2="895" y2="760"/><line x1="805" y1="660" x2="910" y2="680"/><line x1="820" y1="580" x2="925" y2="600"/><line x1="835" y1="500" x2="940" y2="520"/><line x1="850" y1="420" x2="955" y2="440"/><line x1="865" y1="340" x2="970" y2="360"/><line x1="880" y1="260" x2="985" y2="280"/><line x1="895" y1="180" x2="1000" y2="200"/><line x1="910" y1="100" x2="1000" y2="118"/>
      <line x1="775" y1="820" x2="895" y2="760"/><line x1="805" y1="660" x2="925" y2="600"/><line x1="835" y1="500" x2="955" y2="440"/><line x1="865" y1="340" x2="985" y2="280"/><line x1="895" y1="180" x2="1000" y2="130"/>
    </g>
    <!-- distant pale track -->
    <path d="M560 470 Q700 400 980 450" stroke="#e0d2bd" stroke-width="12" fill="none"/>
    <!-- inner orange loop -->
    <circle cx="470" cy="560" r="150" fill="none" stroke="#c4643a" stroke-width="22"/>
    <circle cx="470" cy="560" r="150" fill="none" stroke="#f0a97f" stroke-width="6" stroke-dasharray="4 18"/>
    <!-- blue track crossing low -->
    <path d="M140 690 Q400 640 980 690" stroke="#2f5fa8" stroke-width="30" fill="none"/>
    <path d="M140 690 Q400 640 980 690" stroke="#8fb3e3" stroke-width="6" fill="none"/>
    <!-- big red loop -->
    <path d="M560 800 C 820 760 760 300 520 170 C 300 60 80 220 90 470 C 100 700 300 820 560 800 Z" fill="none" stroke="#8e1f1f" stroke-width="44"/>
    <path d="M560 800 C 820 760 760 300 520 170 C 300 60 80 220 90 470 C 100 700 300 820 560 800 Z" fill="none" stroke="#d23a2e" stroke-width="22"/>
    <path d="M560 800 C 820 760 760 300 520 170 C 300 60 80 220 90 470 C 100 700 300 820 560 800 Z" fill="none" stroke="#3a0d0d" stroke-width="44" stroke-dasharray="6 26"/>
    <!-- lower red sweep in front -->
    <path d="M20 850 Q420 760 980 820" stroke="#8e1f1f" stroke-width="46" fill="none"/>
    <path d="M20 850 Q420 760 980 820" stroke="#c9372b" stroke-width="20" fill="none"/>
    <path d="M20 850 Q420 760 980 820" stroke="#3a0d0d" stroke-width="46" fill="none" stroke-dasharray="6 28"/>
    <!-- train of cars upside down along the top of the loop -->
    <g>
      <g transform="translate(205 225) rotate(-40)"><rect x="-55" y="-30" width="110" height="60" rx="12" fill="#2b2b33"/><circle cx="-20" cy="38" r="15" fill="#3b6fc4"/><circle cx="20" cy="38" r="15" fill="#c84040"/></g>
      <g transform="translate(305 160) rotate(-20)"><rect x="-55" y="-30" width="110" height="60" rx="12" fill="#2b2b33"/><circle cx="-20" cy="38" r="15" fill="#e2b04a"/><circle cx="20" cy="38" r="15" fill="#3b6fc4"/></g>
      <g transform="translate(420 135) rotate(0)"><rect x="-55" y="-30" width="110" height="60" rx="12" fill="#2b2b33"/><circle cx="-20" cy="38" r="15" fill="#c84040"/><circle cx="20" cy="38" r="15" fill="#5a8a3a"/></g>
      <g transform="translate(530 160) rotate(20)"><rect x="-55" y="-30" width="110" height="60" rx="12" fill="#2b2b33"/><circle cx="-20" cy="38" r="15" fill="#3b6fc4"/><circle cx="20" cy="38" r="15" fill="#e2b04a"/></g>
      <g transform="translate(625 225) rotate(40)"><rect x="-55" y="-30" width="110" height="60" rx="12" fill="#2b2b33"/><circle cx="-20" cy="38" r="15" fill="#c84040"/><circle cx="20" cy="38" r="15" fill="#3b6fc4"/></g>
    </g>
  </g>
  <rect x="20" y="20" width="960" height="860" fill="none" stroke="#9aa3ad" stroke-width="2"/>
</svg>
