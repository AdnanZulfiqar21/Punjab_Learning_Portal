<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 9.3 to 9.7: qualitative and quantitative market research with analysis examples, revenue, cost and profit bars, a bakery budget and loan repayments, and the design-share-feedback-refine iteration loop. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Market insight, money matters and improving through iteration</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Collecting and analysing market insight (9.3)</text>
  <rect x="70" y="100" width="240" height="36" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="152" y="122">Qualitative</text>
  <rect x="330" y="100" width="240" height="36" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="409" y="122">Quantitative</text>
  <g class="r">
    <text x="76" y="160">opinions and reasons:</text>
    <text x="76" y="176">interviews, focus groups,</text>
    <text x="76" y="192">observation</text>
  </g>
  <g class="r">
    <text x="336" y="160">numbers and trends:</text>
    <text x="336" y="176">surveys on how often and</text>
    <text x="336" y="192">how much people buy</text>
  </g>
  <g class="r">
    <text x="70" y="240">analysis: trends (most bakery sales at weekends)</text>
    <text x="70" y="258">segments (young: sweet pastries; older: whole-grain bread)</text>
    <text x="70" y="276">competitors (a rival known for artisanal bread)</text>
    <text x="70" y="294">prediction (rising demand: make more)</text>
    <text x="70" y="312">then decide: products, prices, promotions</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="880" y="83">Revenue, cost and profit (9.5.1)</text>
  <rect x="710" y="140" width="90" height="190" fill="#1f6fb5" fill-opacity="0.8"/>
  <text class="l" x="755" y="350" style="text-anchor:middle">revenue</text>
  <text class="r" x="755" y="132" style="text-anchor:middle">Rs 50,000</text>
  <rect x="850" y="216" width="90" height="114" fill="#d98b2b" fill-opacity="0.8"/>
  <text class="l" x="895" y="350" style="text-anchor:middle">costs</text>
  <text class="r" x="895" y="208" style="text-anchor:middle">Rs 30,000</text>
  <rect x="990" y="254" width="90" height="76" fill="#0f7a62" fill-opacity="0.8"/>
  <text class="l" x="1035" y="350" style="text-anchor:middle">profit</text>
  <text class="r" x="1035" y="246" style="text-anchor:middle">Rs 20,000</text>
  <path d="M680 330 H1130" stroke="#14181f" stroke-width="1.5"/>
  <text class="r" x="680" y="112">100 bags x Rs 500 = Rs 50,000; profit = 50,000 - 30,000</text>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="320" y="433">Budget and borrowing (9.5)</text>
  <rect x="70" y="455" width="133" height="40" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="137" y="472" style="text-anchor:middle">Rent</text>
  <text class="r" x="137" y="488" style="text-anchor:middle">200k</text>
  <rect x="203" y="455" width="100" height="40" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="253" y="472" style="text-anchor:middle">Ingredients</text>
  <text class="r" x="253" y="488" style="text-anchor:middle">150k</text>
  <rect x="303" y="455" width="167" height="40" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="387" y="472" style="text-anchor:middle">Salaries</text>
  <text class="r" x="387" y="488" style="text-anchor:middle">250k</text>
  <rect x="470" y="455" width="100" height="40" fill="#fff4e2" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="520" y="472" style="text-anchor:middle">Utilities</text>
  <text class="r" x="520" y="488" style="text-anchor:middle">150k</text>
  <text class="r" x="70" y="520">bakery monthly budget: total Rs 750,000; compare it with actual spending</text>
  <g class="r">
    <text x="70" y="560">loan Rs 100,000 at 10% a year: repay 100,000 + 10,000 = Rs 110,000</text>
    <text x="70" y="578">loan Rs 50,000 at 8% a year: repay 50,000 + 4,000 = Rs 54,000</text>
    <text x="70" y="596">saving Rs 10,000 a month for a year gives Rs 120,000 for a new oven</text>
    <text x="70" y="614">investment: spend now (new stock) to earn more later</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Collaboration and iteration (9.7)</text>
  <rect x="640" y="452" width="120" height="36" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="679" y="474">Design</text>
  <rect x="980" y="452" width="120" height="36" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="1023" y="474">Share</text>
  <rect x="980" y="572" width="120" height="36" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="1012" y="594">Feedback</text>
  <rect x="640" y="572" width="120" height="36" rx="6" fill="#ffffff" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="679" y="594">Refine</text>
  <path d="M762 470 L976 470" stroke="#d7322f" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M1040 490 L1040 568" stroke="#d7322f" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M978 590 L764 590" stroke="#d7322f" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M700 570 L700 492" stroke="#d7322f" stroke-width="1.8" marker-end="url(#p)"/>
  <text class="r" x="870" y="535" style="text-anchor:middle">repeat until everyone approves</text>
  <g class="r">
    <text x="630" y="650">collaboration combines strengths (drawing, building, explaining);</text>
    <text x="630" y="666">iteration improves the result one round at a time (a school logo)</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
