<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <!-- Original diagram after Figure 24.3: four finch heads with different beaks: a large ground finch with a heavy seed-cracking beak, a small ground finch, a cactus finch with a long probing beak and a warbler finch with a thin insect-catching beak. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Galapagos finches: beaks suited to different foods</text>
  <ellipse cx="120.0" cy="200.0" rx="46.0" ry="32.0" stroke="#78716c" stroke-width="2" fill="#e7e5e4"/>
  <circle cx="150.0" cy="160.0" r="26.0" stroke="#78716c" stroke-width="2" fill="#d6d3d1"/>
  <circle cx="158.0" cy="154.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M170.0 142.0 L204.0 162.0 L170.0 182.0 Z" stroke="#57534e" stroke-width="2" fill="#a8a29e" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="80.0" y1="200.0" x2="40.0" y2="212.0" stroke="#78716c" stroke-width="6" stroke-linecap="round"/>
  <text x="140.0" y="260.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">large ground finch</text>
  <text x="140.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">cracks big, hard seeds</text>
  <ellipse cx="330.0" cy="200.0" rx="46.0" ry="32.0" stroke="#78716c" stroke-width="2" fill="#e7e5e4"/>
  <circle cx="360.0" cy="160.0" r="26.0" stroke="#78716c" stroke-width="2" fill="#d6d3d1"/>
  <circle cx="368.0" cy="154.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M382.0 152.0 L402.0 162.0 L382.0 172.0 Z" stroke="#57534e" stroke-width="2" fill="#a8a29e" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="290.0" y1="200.0" x2="250.0" y2="212.0" stroke="#78716c" stroke-width="6" stroke-linecap="round"/>
  <text x="350.0" y="260.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">small ground finch</text>
  <text x="350.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">eats small seeds</text>
  <ellipse cx="540.0" cy="200.0" rx="46.0" ry="32.0" stroke="#78716c" stroke-width="2" fill="#e7e5e4"/>
  <circle cx="570.0" cy="160.0" r="26.0" stroke="#78716c" stroke-width="2" fill="#d6d3d1"/>
  <circle cx="578.0" cy="154.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M592.0 153.0 L640.0 164.0 L592.0 170.0 Z" stroke="#57534e" stroke-width="2" fill="#a8a29e" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="500.0" y1="200.0" x2="460.0" y2="212.0" stroke="#78716c" stroke-width="6" stroke-linecap="round"/>
  <text x="560.0" y="260.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">cactus finch</text>
  <text x="560.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">probes cactus flowers</text>
  <ellipse cx="750.0" cy="200.0" rx="46.0" ry="32.0" stroke="#78716c" stroke-width="2" fill="#e7e5e4"/>
  <circle cx="780.0" cy="160.0" r="26.0" stroke="#78716c" stroke-width="2" fill="#d6d3d1"/>
  <circle cx="788.0" cy="154.0" r="4.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <path d="M802.0 156.0 L834.0 161.0 L802.0 166.0 Z" stroke="#57534e" stroke-width="2" fill="#a8a29e" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="710.0" y1="200.0" x2="670.0" y2="212.0" stroke="#78716c" stroke-width="6" stroke-linecap="round"/>
  <text x="770.0" y="260.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">warbler finch</text>
  <text x="770.0" y="280.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">picks up insects</text>
  <rect x="40.0" y="330.0" width="820.0" height="120.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="60.0" y="360.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">Darwin found different finch species on different islands, with beaks of different sizes and shapes.</text>
  <text x="60.0" y="384.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">He saw these as adaptations for feeding on different foods, and reasoned that a new species could arise</text>
  <text x="60.0" y="408.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">from an ancestral form by the gradual build-up of adaptations in a separated population.</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
