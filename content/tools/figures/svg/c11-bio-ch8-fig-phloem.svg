  <text x="476.0" y="75.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">phloem fibre: thick walls, support</text>
  <line x1="470.0" y1="70.0" x2="130.0" y2="100.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="476.0" y="125.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">phloem parenchyma: stores sugars, resins, latex</text>
