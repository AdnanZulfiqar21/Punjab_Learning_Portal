  <text x="486.0" y="428.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">Sieve tubes carry sugars made in the leaves</text>
  <text x="486.0" y="450.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">to where they are used or stored (about</text>
  <text x="486.0" y="472.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">1 metre per hour). Companion cells supply</text>
  <text x="486.0" y="494.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">ATP and proteins.</text>
