  <text x="476.0" y="325.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">companion cell: nucleus and dense cytoplasm;</text>
  <line x1="470.0" y1="320.0" x2="430.0" y2="330.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <text x="476.0" y="345.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">feeds the sieve tube through plasmodesmata</text>
