<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure 14.1: layers of the atmosphere (original drawing after the textbook's Figure 14.1; heights 50-85 km and 85-600 km as in the book's text) -->
  <defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf4fb"/><stop offset="1" stop-color="#45b5ea"/></linearGradient><radialGradient id="earth" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#9aa6c8"/><stop offset="1" stop-color="#4f5b86"/></radialGradient></defs>
  <rect width="1000" height="820" fill="#ffffff"/>
  <rect x="0.0" y="0.0" width="1000.0" height="820.0" rx="0" stroke="none" stroke-width="0" fill="url(#sky)"/>
  <circle cx="1110.0" cy="1110.0" r="760.0" stroke="#c9d4ee" stroke-width="8" fill="url(#earth)"/>
  <ellipse cx="760.0" cy="560.0" rx="90.0" ry="40.0" stroke="none" stroke-width="0" fill="#dfe3ee" transform="rotate(-30 760.0 560.0)"/>
  <ellipse cx="880.0" cy="690.0" rx="120.0" ry="50.0" stroke="none" stroke-width="0" fill="#c7bfc6" transform="rotate(-30 880.0 690.0)"/>
  <ellipse cx="690.0" cy="760.0" rx="80.0" ry="34.0" stroke="none" stroke-width="0" fill="#e8ebf2" transform="rotate(-30 690.0 760.0)"/>
  <ellipse cx="950.0" cy="470.0" rx="70.0" ry="30.0" stroke="none" stroke-width="0" fill="#d8cfd3" transform="rotate(-30 950.0 470.0)"/>
  <ellipse cx="820.0" cy="790.0" rx="60.0" ry="26.0" stroke="none" stroke-width="0" fill="#aab3cc" transform="rotate(-30 820.0 790.0)"/>
  <line x1="200.0" y1="150.0" x2="520.0" y2="560.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="470.0" y1="520.0" x2="660.0" y2="330.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="462.0" y="532.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="400"><tspan>0-12 km</tspan></text>
  <text x="668.0" y="334.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Troposphere</tspan></text>
  <line x1="420.0" y1="455.0" x2="600.0" y2="270.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="412.0" y="467.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="400"><tspan>12-50 km</tspan></text>
  <text x="608.0" y="274.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Stratosphere</tspan></text>
  <line x1="380.0" y1="405.0" x2="540.0" y2="210.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="372.0" y="417.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="400"><tspan>50-85 km</tspan></text>
  <text x="548.0" y="214.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Mesosphere</tspan></text>
  <line x1="320.0" y1="330.0" x2="480.0" y2="140.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="312.0" y="342.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="400"><tspan>85-600 km</tspan></text>
  <text x="488.0" y="144.0" font-size="34" fill="#14181f" text-anchor="start" font-weight="400"><tspan>Thermosphere</tspan></text>
</svg>
