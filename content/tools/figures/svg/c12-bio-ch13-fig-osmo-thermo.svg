<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 13.2 and 13.3: water and salt movements in a freshwater and a marine bony fish, the water needed to excrete ammonia, urea and uric acid, and human responses to overheating and cooling. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">Osmoregulation, nitrogenous wastes and human thermoregulation</text>
  <rect x="50" y="55" width="540" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="320" y="83">Fresh water: the fish is hypertonic (13.2.2)</text>
  <ellipse cx="300" cy="200" rx="85.0" ry="30.0" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="2"/>
  <path d="M379.0 200 L430.0 170.0 L430.0 230.0 Z" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="2"/>
  <circle cx="240.0" cy="192.0" r="5.0" fill="#14181f"/>
  <path d="M265.0 180.0 Q277.0 200 265.0 220.0" stroke="#1f6fb5" stroke-width="2" fill="none"/>
  <path d="M230 120 L230 165" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M300 120 L300 165" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M370 120 L370 165" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="300" y="108" style="fill:#1f6fb5;text-anchor:middle">water enters by osmosis</text>
  <path d="M260 236 L260 285" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="260" y="302" style="fill:#1f6fb5;text-anchor:middle">large volume of dilute urine</text>
  <path d="M140 250 L190 222" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="80" y="268" style="fill:#d7322f">salts taken in</text>
  <text class="r" x="80" y="284" style="fill:#d7322f">by active transport</text>
  <g class="r">
    <text x="70" y="340">salts also diffuse out; the fish rarely drinks</text>
  </g>
  <rect x="610" y="55" width="540" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="880" y="83">Sea water: the bony fish is hypotonic (13.2.2)</text>
  <ellipse cx="860" cy="200" rx="85.0" ry="30.0" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <path d="M939.0 200 L990.0 170.0 L990.0 230.0 Z" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <circle cx="800.0" cy="192.0" r="5.0" fill="#14181f"/>
  <path d="M825.0 180.0 Q837.0 200 825.0 220.0" stroke="#d98b2b" stroke-width="2" fill="none"/>
  <path d="M800 165 L800 120" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M870 165 L870 120" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M940 165 L940 120" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="870" y="108" style="fill:#1f6fb5;text-anchor:middle">water lost by osmosis</text>
  <path d="M700 200 L768 200" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="640" y="190" style="fill:#1f6fb5">drinks</text>
  <text class="r" x="640" y="206" style="fill:#1f6fb5">sea water</text>
  <path d="M840 236 L840 285" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <text class="r" x="840" y="302" style="fill:#1f6fb5;text-anchor:middle">little, concentrated urine</text>
  <path d="M960 225 L1010 260" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="1015" y="280" style="fill:#d7322f">chloride cells in gills</text>
  <text class="r" x="1015" y="296" style="fill:#d7322f">pump salts out (ATP)</text>
  <g class="r">
    <text x="630" y="340">kidneys also remove salts; sharks and rays have a rectal salt gland</text>
  </g>
  <rect x="50" y="405" width="540" height="290" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="320" y="433">Nitrogenous waste and habitat (13.2.3)</text>
  <text class="l" x="70" y="455">waste</text>
  <text class="l" x="250" y="455">water per gram</text>
  <text class="l" x="400" y="455">animals</text>
  <text class="r" x="70" y="495">ammonia (NH3)</text>
  <text class="r" x="250" y="495">about 500 mL</text>
  <text class="r" x="400" y="495">freshwater: ammonotelic</text>
  <rect x="250" y="501" width="135" height="8" fill="#0f7a62" fill-opacity="0.6"/>
  <text class="r" x="70" y="535">urea</text>
  <text class="r" x="250" y="535">about 50 mL</text>
  <text class="r" x="400" y="535">terrestrial: ureotelic</text>
  <rect x="250" y="541" width="45" height="8" fill="#0f7a62" fill-opacity="0.6"/>
  <text class="r" x="70" y="575">uric acid</text>
  <text class="r" x="250" y="575">about 1 mL</text>
  <text class="r" x="400" y="575">birds, reptiles, insects</text>
  <rect x="250" y="581" width="6" height="8" fill="#0f7a62" fill-opacity="0.6"/>
  <g class="r">
    <text x="70" y="640">the less water an animal can spare, the less toxic and less</text>
    <text x="70" y="656">soluble its main waste; ammonia to urea and uric acid costs energy</text>
  </g>
  <rect x="610" y="405" width="540" height="290" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="880" y="433">Thermoregulation in humans (13.3.3)</text>
  <rect x="630" y="450" width="240" height="36" rx="6" fill="#fdecea" stroke="#d7322f" stroke-width="1.5"/>
  <text class="l" x="684" y="472">Too hot: above 37 C</text>
  <rect x="890" y="450" width="240" height="36" rx="6" fill="#e8f1fb" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="941" y="472">Too cold: below 37 C</text>
  <g class="r">
    <text x="640" y="510">vasodilation: more blood</text>
    <text x="640" y="528">near the skin loses heat</text>
    <text x="640" y="546">sweating cools by</text>
    <text x="640" y="564">evaporation</text>
    <text x="640" y="582">less thyroxine, lower</text>
    <text x="640" y="600">metabolic rate</text>
  </g>
  <g class="r">
    <text x="900" y="510">vasoconstriction: less</text>
    <text x="900" y="528">blood to the skin</text>
    <text x="900" y="546">shivering makes heat</text>
    <text x="900" y="564">goosebumps trap air</text>
    <text x="900" y="582">higher metabolic rate</text>
  </g>
  <text class="r" x="880" y="680" style="text-anchor:middle">control centre: hypothalamus, by negative feedback</text>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
