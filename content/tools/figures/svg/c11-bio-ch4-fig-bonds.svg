<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.1 to 4.3: covalent, ionic and hydrogen bonds. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .a{font-size:30px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563;text-anchor:middle}
      .e{font-size:18px;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="200" y="50">Covalent bond</text>
  <text class="s" x="200" y="80">two atoms share a pair of electrons</text>
  <circle cx="140" cy="260" r="70" fill="#1f6fb5"/><text class="a" x="140" y="270">H</text>
  <circle cx="260" cy="260" r="70" fill="#1f6fb5"/><text class="a" x="260" y="270">H</text>
  <ellipse cx="200" cy="260" rx="34" ry="20" fill="#ffffff" stroke="#14181f" stroke-width="3"/>
  <circle cx="190" cy="260" r="6" fill="#14181f"/><circle cx="210" cy="260" r="6" fill="#14181f"/>
  <text class="s" x="200" y="380">shared electron pair</text>
  <text class="s" x="200" y="430">strong; holds organic molecules</text><text class="s" x="200" y="456">together (proteins, nucleic acids)</text>
  <text class="s" x="200" y="500">C-H bonds store chemical energy</text>
  <text class="h" x="600" y="50">Ionic bond</text>
  <text class="s" x="600" y="80">one atom gives an electron, the other takes it</text>
  <circle cx="520" cy="260" r="70" fill="#d98b2b"/><text class="a" x="520" y="252">Na</text><text class="e" x="520" y="282" style="fill:#fff">+</text>
  <circle cx="690" cy="260" r="80" fill="#0f7a62"/><text class="a" x="690" y="252">Cl</text><text class="e" x="690" y="282" style="fill:#fff">-</text>
  <path d="M560 180 q65 -60 130 0" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <circle cx="560" cy="180" r="6" fill="#14181f"/>
  <text class="s" x="625" y="110">electron moves</text>
  <text class="s" x="600" y="380">cation (+) attracts anion (-)</text>
  <text class="s" x="600" y="430">strong in the solid state;</text><text class="s" x="600" y="456">mostly in inorganic molecules</text><text class="s" x="600" y="482">such as sodium chloride</text>
  <text class="h" x="1000" y="50">Hydrogen bond</text>
  <text class="s" x="1000" y="80">weak attraction of H to O or N</text>
  <!-- two water molecules -->
  <circle cx="940" cy="220" r="46" fill="#d7322f"/><text class="a" x="940" y="230">O</text>
  <circle cx="880" cy="270" r="28" fill="#1f6fb5"/><text class="a" x="880" y="280" style="font-size:24px">H</text>
  <circle cx="990" cy="270" r="28" fill="#1f6fb5"/><text class="a" x="990" y="280" style="font-size:24px">H</text>
  <path d="M1010 290 L1060 340" stroke="#4b5563" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="1100" cy="380" r="46" fill="#d7322f"/><text class="a" x="1100" y="390">O</text>
  <circle cx="1060" cy="440" r="28" fill="#1f6fb5"/><text class="a" x="1060" y="450" style="font-size:24px">H</text>
  <circle cx="1150" cy="430" r="28" fill="#1f6fb5"/><text class="a" x="1150" y="440" style="font-size:24px">H</text>
  <text class="e" x="940" y="165">partial -</text><text class="e" x="920" y="325">partial +</text>
  <text class="s" x="1000" y="520">dashed line: hydrogen bond</text>
  <text class="s" x="1000" y="560">holds protein shape and the DNA</text><text class="s" x="1000" y="586">double helix; links water molecules</text>
  <text class="s" x="600" y="680">Hydrophobic interactions: non-polar molecules cluster away from water (protein folding, lipid bilayers).</text>
  <text class="s" x="600" y="712">Hydrophilic interactions: polar molecules bond with water, so salts and sugars dissolve.</text>
</svg>
