<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 900" font-family="'Times New Roman', Times, serif">
  <!-- Fig 7.8 (C12-MATH, PDF p227): sketch of Ali's velocity-time graph on the printed pale yellow panel with magenta axes; cyan line A(0, u) to B(3, 70) to C(6, 70) to D(6.5, 0) with u = 45 (the value found in Example 6); black dotted lines from the 70 mark to B, from B down to E, from A across to F, and from C down to t = 6, as printed. -->
  <title>Velocity-time sketch of Ali's drive (Figure 7.8)</title>
  <rect width="780" height="900" fill="#ffffff"/>
  <rect x="6" y="6" width="768" height="888" fill="#FFFAC2" stroke="#231F20" stroke-width="1.5"/>
  <line x1="110" y1="840" x2="110" y2="30" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M115.7 41.7 L110 30 L104.3 41.7" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <line x1="80" y1="790" x2="755" y2="790" stroke="#EC008C" stroke-width="2.6"/>
  <path d="M743.3 795.7 L755 790 L743.3 784.3" fill="none" stroke="#EC008C" stroke-width="2.6" stroke-linejoin="miter"/>
  <line x1="110" y1="118" x2="365" y2="118" stroke="#231F20" stroke-width="2.4" stroke-dasharray="6 7"/>
  <line x1="365" y1="118" x2="365" y2="790" stroke="#231F20" stroke-width="2.4" stroke-dasharray="6 7"/>
  <line x1="110" y1="358" x2="365" y2="358" stroke="#231F20" stroke-width="2.4" stroke-dasharray="6 7"/>
  <line x1="620" y1="118" x2="620" y2="790" stroke="#231F20" stroke-width="2.4" stroke-dasharray="6 7"/>
  <path d="M110 358 L365 118 L620 118 L662.5 790" fill="none" stroke="#00AEEF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="126" y="62" font-size="34" text-anchor="start" fill="#231F20" font-style="italic">v</text>
  <text x="96" y="129" font-size="32" text-anchor="end" fill="#231F20">70</text>
  <text x="96" y="364" font-size="34" text-anchor="end" fill="#231F20" font-style="italic">u</text>
  <text x="112" y="396" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">A</text>
  <text x="365" y="102" font-size="32" text-anchor="middle" fill="#231F20" font-style="italic">B</text>
  <text x="620" y="102" font-size="32" text-anchor="middle" fill="#231F20" font-style="italic">C</text>
  <text x="375" y="390" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">F</text>
  <text x="124" y="774" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">O</text>
  <text x="375" y="774" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">E</text>
  <text x="365" y="834" font-size="32" text-anchor="middle" fill="#231F20">3</text>
  <text x="612" y="834" font-size="32" text-anchor="end" fill="#231F20">6</text>
  <text x="656.5" y="834" font-size="32" text-anchor="start" fill="#231F20" font-style="italic">D</text>
  <text x="666.5" y="768" font-size="30" text-anchor="start" fill="#231F20">6.5</text>
  <text x="740" y="834" font-size="34" text-anchor="start" fill="#231F20" font-style="italic">t</text>
</svg>
