<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Interesting Information box on Ernst Chladni (C12-PHY, PDF p40): the portrait printed in the box, drawn as a flat greyscale picture in an oval vignette as printed: head and shoulders of Ernst Chladni turned slightly to the viewer's right, short untidy dark hair, a long nose, a white cravat and high collar, and a dark coat with wide lapels. No picture is reproduced. -->
  <rect width="800" height="1000" fill="#ffffff"/>
  <defs>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <clipPath id="oval"><ellipse cx="400" cy="500" rx="330" ry="450"/></clipPath>
  </defs>
  <ellipse cx="400" cy="500" rx="340" ry="460" fill="url(#vig)"/>
  <g clip-path="url(#oval)">
    <ellipse cx="420" cy="420" rx="300" ry="360" fill="#b0b0b0" opacity="0.6"/>
    <!-- dark coat with wide lapels -->
    <path d="M40 1000 C 70 800 160 690 290 640 L 430 760 L 560 650 C 680 700 750 800 760 1000 Z" fill="#262626"/>
    <path d="M290 640 C 250 700 240 780 280 900 L 400 800 L 360 690 Z" fill="#3c3c3c" stroke="#161616" stroke-width="4"/>
    <path d="M560 650 C 600 710 610 790 580 880 L 470 790 L 500 700 Z" fill="#3c3c3c" stroke="#161616" stroke-width="4"/>
    <!-- white cravat and collar -->
    <path d="M360 600 C 360 650 380 700 420 720 C 460 700 490 660 495 610 L 520 640 C 510 700 480 760 430 800 C 380 770 345 700 340 630 Z" fill="#efefef" stroke="#bdbdbd" stroke-width="3"/>
    <path d="M395 690 C 410 730 430 750 430 790" stroke="#cfcfcf" stroke-width="4" fill="none"/>
    <!-- neck -->
    <path d="M380 540 L 375 620 L 480 620 L 470 540 Z" fill="#cfcfcf"/>
    <!-- head turned slightly to the viewer's right -->
    <path d="M320 320 C 330 230 400 190 460 195 C 530 200 570 260 568 340 C 570 420 550 500 515 545 C 490 575 455 590 425 585 C 385 578 350 545 335 500 C 318 450 314 380 320 320 Z" fill="#d6d6d6"/>
    <!-- untidy dark hair -->
    <path d="M300 320 C 280 240 330 160 420 150 C 500 140 580 190 582 280 C 575 260 560 245 545 240 C 548 262 540 280 530 290 C 520 265 500 250 480 248 C 470 270 450 285 430 288 C 432 270 425 255 410 248 C 390 262 370 270 350 268 C 342 300 340 340 345 380 C 325 370 308 350 300 320 Z" fill="#262626"/>
    <path d="M300 300 C 290 250 300 200 330 180 C 345 160 370 150 395 150 C 420 135 460 135 490 150 C 520 155 555 175 575 210 C 590 240 588 265 582 280 C 560 250 520 225 470 220 C 420 218 370 228 340 250 C 325 268 315 290 300 300 Z" fill="#262626"/>
    <path d="M310 260 C 300 290 305 330 325 360 M560 230 C 575 255 578 285 572 300" stroke="#262626" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- ear -->
    <path d="M340 380 C 318 372 312 405 320 428 C 327 446 342 448 348 436 Z" fill="#c4c4c4"/>
    <!-- brows, heavy-lidded eyes -->
    <path d="M395 345 C 415 333 440 333 455 342 M490 340 C 505 332 528 334 542 344" stroke="#3a3a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M405 370 C 420 362 440 362 452 370 C 440 378 420 378 405 370 Z M492 368 C 505 360 525 360 536 368 C 525 376 505 376 492 368 Z" fill="#f2f2f2" stroke="#5a5a5a" stroke-width="3"/>
    <circle cx="430" cy="370" r="5" fill="#2e2e2e"/><circle cx="515" cy="368" r="5" fill="#2e2e2e"/>
    <!-- long nose -->
    <path d="M478 370 C 485 410 495 445 505 470 C 495 482 475 482 465 474" stroke="#8e8e8e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- mouth and chin -->
    <path d="M445 520 C 465 528 490 527 508 516" stroke="#767676" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- shadow on the face, viewer's left -->
    <path d="M340 420 C 350 490 380 545 420 575 C 380 565 350 520 338 470 Z" fill="#b8b8b8"/>
  </g>
</svg>
