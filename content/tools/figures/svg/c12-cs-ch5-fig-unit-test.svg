<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: functions, pytest test functions using assert, and the pass report. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Unit testing with pytest (after the testing example)</text>
  <rect x="30.0" y="90.0" width="380.0" height="138.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="42.0" y="113.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def add(a, b):</text>
  <text x="72.8" y="137.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">return a + b</text>
  <text x="42.0" y="161.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400"></text>
  <text x="42.0" y="185.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def multiply(a, b):</text>
  <text x="72.8" y="209.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">return a * b</text>
  <text x="220.0" y="80.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">code under test (calc.py)</text>
  <rect x="30.0" y="262.0" width="380.0" height="138.0" rx="6" stroke="#14181f" stroke-width="1" fill="#1f2430"/>
  <text x="42.0" y="285.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def test_add():</text>
  <text x="72.8" y="309.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">assert add(2, 3) == 5</text>
  <text x="42.0" y="333.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400"></text>
  <text x="42.0" y="357.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">def test_multiply():</text>
  <text x="72.8" y="381.0" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="400">assert multiply(2, 3) == 6</text>
  <text x="220.0" y="252.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">tests (test_calc.py)</text>
  <rect x="480.0" y="145.0" width="160.0" height="50.0" rx="8" stroke="#14181f" stroke-width="2" fill="#f1f3f6"/>
  <text x="560.0" y="168.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">&gt; pytest</text>
  <text x="560.0" y="184.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">in the terminal</text>
  <line x1="415.0" y1="320.0" x2="481.4" y2="206.2" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M485.0 200.0 L484.2 209.0 L477.6 205.1 Z" fill="#14181f"/>
  <text x="455.0" y="260.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">finds test_</text>
  <text x="455.0" y="276.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">functions</text>
  <line x1="640.0" y1="170.0" x2="692.8" y2="170.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M700.0 170.0 L691.8 173.8 L691.8 166.2 Z" fill="#14181f"/>
  <rect x="705.0" y="110.0" width="170.0" height="130.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="720.0" y="140.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">test_add       PASS</text>
  <text x="720.0" y="162.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">test_multiply  PASS</text>
  <text x="720.0" y="184.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <text x="720.0" y="206.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">2 passed</text>
  <text x="560.0" y="300.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">assert checks one expected result.</text>
  <text x="560.0" y="320.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">If add() returned a - b, test_add</text>
  <text x="560.0" y="340.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">would FAIL and show both values.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
