<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- Roman Urdu figure: the two pytest test functions of the example, run with the pytest command, giving 2 passed. -->
  <text x="270.0" y="40.0" font-size="28" fill="#6b7280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Test functions</text>
  <rect x="20.0" y="60.0" width="500.0" height="320.0" rx="10" fill="#f6f7f9" stroke="#9aa3ad" stroke-width="2"/>
  <text x="44.0" y="130.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">def test_add():</text>
  <text x="44.0" y="170.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    assert add(2, 3) == 5</text>
  <text x="44.0" y="290.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">def test_multiply():</text>
  <text x="44.0" y="330.0" font-size="25" fill="#1d2330" font-family="Consolas, Courier New, monospace" xml:space="preserve">    assert multiply(2, 3) == 6</text>
  <line x1="530.0" y1="220.0" x2="583.0" y2="220.0" stroke="#1d2330" stroke-width="4" stroke-linecap="butt"/>
  <path d="M600.0 220.0 L582.0 228.7 L582.0 211.3 Z" fill="#1d2330"/>
  <text x="795.0" y="40.0" font-size="28" fill="#6b7280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">Terminal</text>
  <rect x="610.0" y="60.0" width="370.0" height="320.0" rx="10" fill="#1f2430" stroke="#1f2430" stroke-width="2"/>
  <text x="636.0" y="140.0" font-size="30" fill="#e8edf3" font-family="Consolas, Courier New, monospace" xml:space="preserve" font-weight="700">&gt; pytest</text>
  <text x="636.0" y="296.0" font-size="30" fill="#e8edf3" font-family="Consolas, Courier New, monospace" xml:space="preserve" font-weight="700">2 passed</text>
</svg>
