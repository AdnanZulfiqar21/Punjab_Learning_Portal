<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <!-- Original chart: the seven vertebrate classes in two groups. -->
  <defs>
    <style>
      .box{fill:#eaf5f1;stroke:#0f7a62;stroke-width:4;rx:20}
      .leaf{fill:#ffffff;stroke:#cfd6de;stroke-width:4;rx:18}
      .t{font-size:34px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:26px;fill:#4b5563;text-anchor:middle}
      .ln{stroke:#0f7a62;stroke-width:6;fill:none}
    </style>
  </defs>
  <rect class="box" x="300" y="40" width="400" height="110"/>
  <text class="t" x="500" y="88">Vertebrates</text>
  <text class="s" x="500" y="128">vertebral column and cranium</text>
  <path class="ln" d="M500 150 V200 M500 200 H230 V250 M500 200 H770 V250"/>
  <rect class="box" x="60" y="250" width="340" height="120"/>
  <text class="t" x="230" y="300">Group Pisces</text>
  <text class="s" x="230" y="345">fishes: no limbs</text>
  <rect class="box" x="600" y="250" width="340" height="120"/>
  <text class="t" x="770" y="300">Group Tetrapoda</text>
  <text class="s" x="770" y="345">four limbs</text>
  <path class="ln" d="M230 370 V410 M770 370 V410"/>
  <g>
    <rect class="leaf" x="60" y="410" width="340" height="110"/>
    <text class="t" x="230" y="455">1 Cyclostomata</text>
    <text class="s" x="230" y="495">jawless: lamprey, hagfish</text>
    <rect class="leaf" x="60" y="540" width="340" height="110"/>
    <text class="t" x="230" y="585">2 Chondrichthyes</text>
    <text class="s" x="230" y="625">cartilage: shark, ray</text>
    <rect class="leaf" x="60" y="670" width="340" height="110"/>
    <text class="t" x="230" y="715">3 Osteichthyes</text>
    <text class="s" x="230" y="755">bony fishes: rohu, trout</text>
  </g>
  <g>
    <rect class="leaf" x="600" y="410" width="340" height="100"/>
    <text class="t" x="770" y="452">4 Amphibia</text>
    <text class="s" x="770" y="490">frog, salamander</text>
    <rect class="leaf" x="600" y="525" width="340" height="100"/>
    <text class="t" x="770" y="567">5 Reptilia</text>
    <text class="s" x="770" y="605">lizard, snake, crocodile</text>
    <rect class="leaf" x="600" y="640" width="340" height="100"/>
    <text class="t" x="770" y="682">6 Aves</text>
    <text class="s" x="770" y="720">birds</text>
    <rect class="leaf" x="600" y="755" width="340" height="100"/>
    <text class="t" x="770" y="797">7 Mammalia</text>
    <text class="s" x="770" y="835">milk and hair</text>
  </g>
</svg>
