<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original bar chart from the book's bean plant data: mean heights 10, 15 and 19 cm under low, medium and high light, each with an error bar from the minimum to the maximum value (9-11, 14-16, 18-20 cm). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Average plant height in different light conditions, with error bars</text>
  <line x1="120.0" y1="420.0" x2="820.0" y2="420.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="120.0" y1="420.0" x2="120.0" y2="100.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="114.0" y1="420.0" x2="120.0" y2="420.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="420.0" x2="820.0" y2="420.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="424.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">0</text>
  <line x1="114.0" y1="356.0" x2="120.0" y2="356.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="356.0" x2="820.0" y2="356.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="360.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">5</text>
  <line x1="114.0" y1="292.0" x2="120.0" y2="292.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="292.0" x2="820.0" y2="292.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="296.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">10</text>
  <line x1="114.0" y1="228.0" x2="120.0" y2="228.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="228.0" x2="820.0" y2="228.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="232.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">15</text>
  <line x1="114.0" y1="164.0" x2="120.0" y2="164.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="164.0" x2="820.0" y2="164.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="168.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">20</text>
  <line x1="114.0" y1="100.0" x2="120.0" y2="100.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120.0" y1="100.0" x2="820.0" y2="100.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <text x="110.0" y="104.0" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">25</text>
  <text x="74.0" y="260.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 74.0 260.0)">Mean plant height (cm)</text>
  <text x="470.0" y="466.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Light condition</text>
  <rect x="210.0" y="292.0" width="110.0" height="128.0" rx="3" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <line x1="265.0" y1="304.8" x2="265.0" y2="279.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250.0" y1="304.8" x2="280.0" y2="304.8" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250.0" y1="279.2" x2="280.0" y2="279.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="265.0" y="269.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">10 (range 9-11)</text>
  <text x="265.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">A: low light</text>
  <rect x="420.0" y="228.0" width="110.0" height="192.0" rx="3" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <line x1="475.0" y1="240.8" x2="475.0" y2="215.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="460.0" y1="240.8" x2="490.0" y2="240.8" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="460.0" y1="215.2" x2="490.0" y2="215.2" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="475.0" y="205.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">15 (range 14-16)</text>
  <text x="475.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">B: medium light</text>
  <rect x="630.0" y="176.8" width="110.0" height="243.2" rx="3" stroke="#0f7a62" stroke-width="2" fill="#bbf7d0"/>
  <line x1="685.0" y1="189.6" x2="685.0" y2="164.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="670.0" y1="189.6" x2="700.0" y2="189.6" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="670.0" y1="164.0" x2="700.0" y2="164.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="685.0" y="154.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">19 (range 18-20)</text>
  <text x="685.0" y="440.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">C: high light</text>
  <text x="450.0" y="80.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">bar = group mean; error bar = range (min to max), here also about mean +/- 1 SD</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
