<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original redraw after Figure 12.8: the Standard Model table of quarks, leptons, force-carrying bosons and the Higgs boson. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The Standard Model of elementary particles</text>
  <text x="330.0" y="72.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">matter particles (fermions)</text>
  <text x="760.0" y="72.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">force carriers (bosons)</text>
  <text x="40.0" y="203.0" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700" transform="rotate(-90 40.0 203.0)">quarks</text>
  <rect x="130.0" y="95.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="190.0" y="143.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">u</text>
  <text x="190.0" y="173.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">up</text>
  <rect x="270.0" y="95.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="330.0" y="143.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">c</text>
  <text x="330.0" y="173.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">charm</text>
  <rect x="410.0" y="95.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="470.0" y="143.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">t</text>
  <text x="470.0" y="173.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">top</text>
  <rect x="130.0" y="200.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="190.0" y="248.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">d</text>
  <text x="190.0" y="278.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">down</text>
  <rect x="270.0" y="200.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="330.0" y="248.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">s</text>
  <text x="330.0" y="278.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">strange</text>
  <rect x="410.0" y="200.0" width="120.0" height="95.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="470.0" y="248.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">b</text>
  <text x="470.0" y="278.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">bottom</text>
  <text x="40.0" y="423.0" font-size="16" fill="#0f7a62" text-anchor="middle" font-weight="700" transform="rotate(-90 40.0 423.0)">leptons</text>
  <rect x="130.0" y="315.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="190.0" y="363.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">e</text>
  <text x="190.0" y="393.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">electron</text>
  <rect x="270.0" y="315.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="330.0" y="363.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">mu</text>
  <text x="330.0" y="393.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">muon</text>
  <rect x="410.0" y="315.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="470.0" y="363.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">tau</text>
  <text x="470.0" y="393.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">tau</text>
  <rect x="130.0" y="420.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="190.0" y="468.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">ve</text>
  <text x="190.0" y="498.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">e-neutrino</text>
  <rect x="270.0" y="420.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="330.0" y="468.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">vmu</text>
  <text x="330.0" y="498.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">mu-neutrino</text>
  <rect x="410.0" y="420.0" width="120.0" height="95.0" rx="10" stroke="#0f7a62" stroke-width="2" fill="#d1fae5"/>
  <text x="470.0" y="468.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">vtau</text>
  <text x="470.0" y="498.0" font-size="13" fill="#0f7a62" text-anchor="middle" font-weight="700">tau-neutrino</text>
  <text x="190.0" y="535.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">generation I</text>
  <text x="330.0" y="535.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">generation II</text>
  <text x="470.0" y="535.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">generation III</text>
  <rect x="620.0" y="95.0" width="220.0" height="75.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="680.0" y="141.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">g</text>
  <text x="790.0" y="141.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">gluon (strong)</text>
  <rect x="620.0" y="180.0" width="220.0" height="75.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="680.0" y="226.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">photon</text>
  <text x="790.0" y="226.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">electromagnetic</text>
  <rect x="620.0" y="265.0" width="220.0" height="75.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="680.0" y="311.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Z</text>
  <text x="790.0" y="311.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">Z boson (weak)</text>
  <rect x="620.0" y="350.0" width="220.0" height="75.0" rx="10" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="680.0" y="396.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">W</text>
  <text x="790.0" y="396.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">W boson (weak)</text>
  <rect x="620.0" y="445.0" width="220.0" height="70.0" rx="10" stroke="#a16207" stroke-width="2" fill="#fef3c7"/>
  <text x="680.0" y="488.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <text x="790.0" y="488.0" font-size="12" fill="#a16207" text-anchor="middle" font-weight="700">Higgs boson</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
