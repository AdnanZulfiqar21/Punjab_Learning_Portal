<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram for topic 22.2: ethanol ionises very little because its ethyl group pushes electrons onto the ethoxide oxygen; phenoxide is stabilised by spreading its charge into the ring; acid strength phenol &gt; water &gt; ethanol. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Acidity: phenol &gt; water &gt; ethanol</text>
  <rect x="15.0" y="55.0" width="425.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">ethanol: a very weak acid</text>
  <text x="227.0" y="125.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">OH &lt;=&gt; CH</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> + H</tspan><tspan dy="-6.7" font-size="11.2">+</tspan></text>
  <text x="120.0" y="216.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.8" font-size="12.6">3</tspan><tspan dy="-5.8">CH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="190.0" y="216.7" font-size="19" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <line x1="150.0" y1="238.0" x2="175.1" y2="230.1" stroke="#1f6fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M182.0 228.0 L175.3 234.1 L173.1 226.8 Z" fill="#1f6fb5"/>
  <text x="165.0" y="262.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">+I push</text>
  <text x="330.0" y="195.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the ethyl group pushes</text>
  <text x="330.0" y="214.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">electrons onto O-, so</text>
  <text x="330.0" y="233.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">it takes back H+ easily</text>
  <rect x="460.0" y="55.0" width="425.0" height="255.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">phenol: a weak acid</text>
  <text x="672.0" y="125.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">OH &lt;=&gt; C</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">O</tspan><tspan dy="-6.7" font-size="11.2">-</tspan><tspan dy="6.7"> + H</tspan><tspan dy="-6.7" font-size="11.2">+</tspan></text>
  <path d="M560.0 191.0 L589.4 208.0 L589.4 242.0 L560.0 259.0 L530.6 242.0 L530.6 208.0 Z" stroke="#14181f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="560.0" cy="225.0" r="19.7" stroke="#14181f" stroke-width="1.9800000000000002" fill="none"/>
  <line x1="560.0" y1="191.0" x2="560.0" y2="172.3" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="560.0" y="164.3" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan><tspan dy="-6.7" font-size="11.2">-</tspan></text>
  <circle cx="540.9" cy="214.0" r="5.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <circle cx="579.1" cy="214.0" r="5.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <circle cx="560.0" cy="247.0" r="5.0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="760.0" y="195.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the negative charge is</text>
  <text x="760.0" y="214.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">spread into the ring:</text>
  <text x="760.0" y="233.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">phenoxide is stabilised</text>
  <rect x="15.0" y="320.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="350.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">relative acid strength</text>
  <text x="110.0" y="386.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">phenol</text>
  <rect x="125.0" y="366.0" width="600.0" height="28.0" rx="6" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="110.0" y="431.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">water</text>
  <rect x="125.0" y="411.0" width="360.0" height="28.0" rx="6" stroke="#1f6fb5" stroke-width="1" fill="#1f6fb5"/>
  <text x="110.0" y="476.0" font-size="15" fill="#14181f" text-anchor="end" font-weight="700">ethanol</text>
  <rect x="125.0" y="456.0" width="260.0" height="28.0" rx="6" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="450.0" y="510.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">the more stable the anion left after losing H+, the stronger the acid</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
