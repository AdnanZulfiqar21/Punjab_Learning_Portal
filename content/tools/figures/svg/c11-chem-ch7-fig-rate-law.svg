<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Tables 7.2 and 7.3 and the units of the rate constant: reading orders from initial-rate data. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:15px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">Rate law, order of reaction and the units of the rate constant</text>
  <rect x="60" y="55" width="1080" height="70" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="f" x="600" y="85">aA + bB gives cC + dD        rate = k [A]^x [B]^y        order = x + y</text>
  <text class="s" x="600" y="110">x and y are found by experiment, not read from the coefficients; k is the rate when every concentration is 1 mol dm-3 (changes with temperature)</text>
  <!-- initial rates table NO + H2 -->
  <text class="k" x="330" y="160">Initial rates for 2NO + 2H2 gives N2 + 2H2O (Table 7.3)</text>
  <g font-size="13" fill="#4b5563">
    <text x="80" y="190" font-weight="700" fill="#14181f">[NO]</text><text x="180" y="190" font-weight="700" fill="#14181f">[H2]</text><text x="280" y="190" font-weight="700" fill="#14181f">initial rate</text><text x="400" y="190" font-weight="700" fill="#14181f">reading</text>
    <text x="80" y="214">0.006</text><text x="180" y="214">0.001</text><text x="280" y="214">0.025</text><text x="400" y="214">double [H2] ...</text>
    <text x="80" y="236">0.006</text><text x="180" y="236">0.002</text><text x="280" y="236">0.050</text><text x="400" y="236">... rate doubles: first order in H2</text>
    <text x="80" y="258">0.006</text><text x="180" y="258">0.003</text><text x="280" y="258">0.075</text><text x="400" y="258">triple: rate triples</text>
    <text x="80" y="288">0.001</text><text x="180" y="288">0.009</text><text x="280" y="288">0.0063</text><text x="400" y="288">double [NO] ...</text>
    <text x="80" y="310">0.002</text><text x="180" y="310">0.009</text><text x="280" y="310">0.025</text><text x="400" y="310">... rate x 4: second order in NO</text>
    <text x="80" y="332">0.003</text><text x="180" y="332">0.009</text><text x="280" y="332">0.056</text><text x="400" y="332">triple: rate x 9</text>
  </g>
  <path d="M70 200 H600" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="f" x="330" y="365">rate = k [H2] [NO]^2, third order overall</text>
  <text class="s" x="330" y="388">(values as printed, with the first rows read as 0.006/0.001/0.025 and 0.075)</text>
  <!-- H2O2 + I- -->
  <text class="k" x="880" y="160">Finding k by initial rates (Table 7.2)</text>
  <g font-size="13" fill="#4b5563">
    <text x="680" y="190" font-weight="700" fill="#14181f">[H2O2]</text><text x="770" y="190" font-weight="700" fill="#14181f">[I-]</text><text x="850" y="190" font-weight="700" fill="#14181f">[H+]</text><text x="940" y="190" font-weight="700" fill="#14181f">initial rate, mol dm-3 s-1</text>
    <text x="680" y="214">0.0200</text><text x="770" y="214">0.0100</text><text x="850" y="214">0.0100</text><text x="940" y="214">3.5 x 10^-6</text>
    <text x="680" y="236">0.0300</text><text x="770" y="236">0.0100</text><text x="850" y="236">0.0100</text><text x="940" y="236">5.3 x 10^-6</text>
    <text x="680" y="258">0.0050</text><text x="770" y="258">0.0200</text><text x="850" y="258">0.0200</text><text x="940" y="258">1.75 x 10^-6</text>
  </g>
  <path d="M670 200 H1140" stroke="#9ca3af" stroke-width="1.5"/>
  <g class="t">
    <text x="680" y="290">rate = k [H2O2] [I-]; [H+] does not appear: zero order in H+</text>
    <text x="680" y="312">k = rate / ([H2O2] [I-]) = 3.50 x 10^-6 / (0.0200 x 0.0100)</text>
    <text x="680" y="334">k = 1.75 x 10^-2 dm3 mol-1 s-1 (second order overall)</text>
    <text x="680" y="365" style="font-weight:700;fill:#14181f">Half-life method (first order only)</text>
    <text x="680" y="388">k = 0.693 / t1/2: H2O2 with t1/2 = 2 h = 7200 s gives k = 9.6 x 10^-5 s-1</text>
  </g>
  <!-- units table -->
  <rect x="60" y="415" width="1080" height="200" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="443">Units of k from k = (mol dm-3)^(1-n) s-1</text>
  <g font-size="13" fill="#4b5563">
    <text x="90" y="472" font-weight="700" fill="#14181f">Order n</text><text x="230" y="472" font-weight="700" fill="#14181f">Rate law</text><text x="480" y="472" font-weight="700" fill="#14181f">Units of k</text><text x="700" y="472" font-weight="700" fill="#14181f">Examples</text>
    <text x="90" y="498">0</text><text x="230" y="498">rate = k</text><text x="480" y="498">mol dm-3 s-1</text><text x="700" y="498">H2 + Cl2 (photochemical), 2NH3 on a surface</text>
    <text x="90" y="522">1</text><text x="230" y="522">rate = k [A]</text><text x="480" y="522">s-1</text><text x="700" y="522">2N2O5 gives 2N2O4 + O2; radioactive decay</text>
    <text x="90" y="546">2</text><text x="230" y="546">rate = k [A]^2 or k [A][B]</text><text x="480" y="546">dm3 mol-1 s-1</text><text x="700" y="546">NO + O3 gives NO2 + O2</text>
    <text x="90" y="570">3</text><text x="230" y="570">rate = k [A]^2 [B] etc.</text><text x="480" y="570">dm6 mol-2 s-1</text><text x="700" y="570">2NO + O2 gives 2NO2; FeCl3 + KI</text>
    <text x="90" y="594">1.5</text><text x="230" y="594">rate = k [CHCl3] [Cl2]^1/2</text><text x="480" y="594">fractional</text><text x="700" y="594">CHCl3 + Cl2 gives CCl4 + HCl (free radicals)</text>
  </g>
</svg>
