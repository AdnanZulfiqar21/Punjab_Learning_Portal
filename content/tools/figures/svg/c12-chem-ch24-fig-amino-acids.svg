<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original diagram for topics 24.6 and 24.6.1: an alpha-amino acid and its zwitterion; glycine (R = H) and alanine (R = CH3); and the cationic form at low pH, the dipolar ion at the isoelectric point and the anionic form at high pH. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Amino acids</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">general structure and zwitterion</text>
  <text x="150.0" y="135.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">N-CH(R)-COOH</tspan></text>
  <text x="150.0" y="165.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">an alpha-amino acid</text>
  <line x1="260.0" y1="128.0" x2="322.0" y2="128.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330.0 128.0 L320.9 132.2 L320.9 123.8 Z" fill="#14181f"/>
  <text x="295.0" y="115.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">H+ moves</text>
  <text x="440.0" y="135.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">N</tspan><tspan dy="-7.1" font-size="11.9">+-</tspan><tspan dy="7.1">CH(R)-COO</tspan><tspan dy="-7.1" font-size="11.9">-</tspan></text>
  <text x="440.0" y="165.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">zwitterion (internal salt)</text>
  <text x="690.0" y="120.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">glycine: R = H</tspan></text>
  <text x="690.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">alanine: R = CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="690.0" y="180.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">all except glycine are chiral</text>
  <text x="450.0" y="232.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the proton passes from -COOH to -NH2, so the molecule carries both + and - charges</text>
  <rect x="15.0" y="265.0" width="870.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="295.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">the form present depends on pH</text>
  <rect x="30.0" y="320.0" width="260.0" height="90.0" rx="10" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="160.0" y="360.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">N</tspan><tspan dy="-6.3" font-size="10.5">+-</tspan><tspan dy="6.3">CH(R)-COOH</tspan></text>
  <text x="160.0" y="390.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">cationic form</text>
  <text x="160.0" y="432.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">low pH</text>
  <rect x="320.0" y="320.0" width="260.0" height="90.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="360.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">N</tspan><tspan dy="-6.3" font-size="10.5">+-</tspan><tspan dy="6.3">CH(R)-COO</tspan><tspan dy="-6.3" font-size="10.5">-</tspan></text>
  <text x="450.0" y="390.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">dipolar ion</text>
  <text x="450.0" y="432.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">pH = pI</text>
  <rect x="610.0" y="320.0" width="260.0" height="90.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="740.0" y="360.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">N-CH(R)-COO</tspan><tspan dy="-6.3" font-size="10.5">-</tspan></text>
  <text x="740.0" y="390.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">anionic form</text>
  <text x="740.0" y="432.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">high pH</text>
  <line x1="292.0" y1="350.0" x2="310.8" y2="350.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M318.0 350.0 L309.8 353.8 L309.8 346.2 Z" fill="#14181f"/>
  <line x1="318.0" y1="372.0" x2="299.2" y2="372.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M292.0 372.0 L300.2 368.2 L300.2 375.8 Z" fill="#14181f"/>
  <text x="305.0" y="342.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan><tspan dy="-4.2" font-size="7.0">-</tspan></text>
  <text x="305.0" y="392.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-4.2" font-size="7.0">+</tspan></text>
  <line x1="582.0" y1="350.0" x2="600.8" y2="350.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M608.0 350.0 L599.8 353.8 L599.8 346.2 Z" fill="#14181f"/>
  <line x1="608.0" y1="372.0" x2="589.2" y2="372.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M582.0 372.0 L590.2 368.2 L590.2 375.8 Z" fill="#14181f"/>
  <text x="595.0" y="342.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">OH</tspan><tspan dy="-4.2" font-size="7.0">-</tspan></text>
  <text x="595.0" y="392.0" font-size="10" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan><tspan dy="-4.2" font-size="7.0">+</tspan></text>
  <line x1="60.0" y1="470.0" x2="831.2" y2="470.0" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M840.0 470.0 L830.0 474.6 L830.0 465.4 Z" fill="#4b5563"/>
  <text x="450.0" y="495.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">pH increases</text>
  <text x="450.0" y="535.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">isoelectric point (pI): the pH at which the zwitterion is at its maximum and the overall charge is zero</text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
