<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure 15.8 Paper chromatography: ink spot on paper above the solvent, then separated into orange, blue, green and red spots below the solvent front (original drawing after the textbook's figure) -->
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="250.0" y="560.0" width="230.0" height="140.0" rx="0" stroke="none" stroke-width="0" fill="#bfe6ee"/>
  <path d="M250 90 L250 700 L480 700 L480 90" stroke="#555" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M232.0 40.0 L498.0 40.0 L476.0 92.0 L254.0 92.0 Z" stroke="#8a6a45" stroke-width="2" fill="#c4a27a" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="335.0" y="92.0" width="60.0" height="520.0" rx="0" stroke="#d9cfa3" stroke-width="2" fill="#fbf7e6"/>
  <ellipse cx="365.0" cy="548.0" rx="17.0" ry="21.0" stroke="#3c3a88" stroke-width="2" fill="#5a55a8"/>
  <text x="150.0" y="250.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>Paper</tspan></text>
  <text x="150.0" y="284.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>(stationary</tspan></text>
  <text x="150.0" y="318.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>phase)</tspan></text>
  <line x1="225.0" y1="280.0" x2="362.0" y2="280.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="470.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>Ink spot</tspan></text>
  <text x="150.0" y="504.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>to be</tspan></text>
  <text x="150.0" y="538.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>separated</tspan></text>
  <line x1="225.0" y1="534.0" x2="348.0" y2="548.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="150.0" y="618.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>Solvent</tspan></text>
  <text x="150.0" y="652.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>(mobile</tspan></text>
  <text x="150.0" y="686.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400"><tspan>phase)</tspan></text>
  <line x1="560.0" y1="620.0" x2="560.0" y2="167.6" stroke="#3249a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M560.0 150.0 L570.3 169.4 L549.7 169.4 Z" fill="#3249a8"/>
  <text x="530.0" y="385.0" font-size="28" fill="#c2187a" text-anchor="middle" font-weight="400" transform="rotate(-90 530.0 385.0)"><tspan>Direction of solvent flow</tspan></text>
  <rect x="620.0" y="560.0" width="230.0" height="140.0" rx="0" stroke="none" stroke-width="0" fill="#bfe6ee"/>
  <path d="M620 90 L620 700 L850 700 L850 90" stroke="#555" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M602.0 40.0 L868.0 40.0 L846.0 92.0 L624.0 92.0 Z" stroke="#8a6a45" stroke-width="2" fill="#c4a27a" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="705.0" y="92.0" width="60.0" height="520.0" rx="0" stroke="#d9cfa3" stroke-width="2" fill="#fbf7e6"/>
  <rect x="706.0" y="175.0" width="58.0" height="436.0" rx="0" stroke="none" stroke-width="0" fill="#c3e6ee"/>
  <ellipse cx="735.0" cy="250.0" rx="18.0" ry="34.0" stroke="none" stroke-width="0" fill="#f07a23"/>
  <line x1="757.0" y1="250.0" x2="990.0" y2="250.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="1000.0" y="260.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Orange</tspan></text>
  <ellipse cx="735.0" cy="360.0" rx="18.0" ry="30.0" stroke="none" stroke-width="0" fill="#0b56a8"/>
