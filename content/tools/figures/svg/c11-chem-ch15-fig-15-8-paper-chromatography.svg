  <text x="1000.0" y="370.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Blue</tspan></text>
  <ellipse cx="735.0" cy="455.0" rx="18.0" ry="24.0" stroke="none" stroke-width="0" fill="#14a14b"/>
  <line x1="757.0" y1="455.0" x2="990.0" y2="455.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="1000.0" y="465.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Green</tspan></text>
  <ellipse cx="735.0" cy="530.0" rx="18.0" ry="19.0" stroke="none" stroke-width="0" fill="#e3222b"/>
  <line x1="757.0" y1="530.0" x2="990.0" y2="530.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="1000.0" y="540.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Red</tspan></text>
  <ellipse cx="735.0" cy="582.0" rx="17.0" ry="19.0" stroke="none" stroke-width="0" fill="#8f9ccc"/>
  <line x1="757.0" y1="582.0" x2="990.0" y2="582.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="1000.0" y="592.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Original</tspan></text>
  <text x="1000.0" y="624.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>ink spot</tspan></text>
  <text x="1000.0" y="656.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>separated</tspan></text>
  <text x="1000.0" y="688.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>into four</tspan></text>
  <text x="1000.0" y="720.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>colours</tspan></text>
  <line x1="765.0" y1="175.0" x2="990.0" y2="175.0" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="1000.0" y="168.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>Solvent</tspan></text>
  <text x="1000.0" y="200.0" font-size="28" fill="#c2187a" text-anchor="start" font-weight="400"><tspan>front</tspan></text>
</svg>
