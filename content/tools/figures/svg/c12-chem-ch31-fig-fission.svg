<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 31.8: a neutron splits a uranium-235 nucleus into barium-141 and krypton-92 with three neutrons and energy, the neutrons splitting further nuclei (chain reaction); and fusion, in which light nuclei join to form a heavier one. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Nuclear fission and fusion</text>
  <rect x="15.0" y="55.0" width="870.0" height="290.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">fission of uranium-235: a chain reaction</text>
  <circle cx="55.0" cy="200.0" r="7.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <text x="55.0" y="182.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">neutron</text>
  <line x1="64.0" y1="200.0" x2="151.6" y2="200.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M158.0 200.0 L150.7 203.4 L150.7 196.6 Z" fill="#1f6fb5"/>
  <circle cx="200.0" cy="200.0" r="36.0" stroke="#d98b2b" stroke-width="2.2" fill="#fed7aa"/>
  <text x="200.0" y="205.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">U-235</text>
  <line x1="240.0" y1="190.0" x2="323.4" y2="152.9" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M330.0 150.0 L324.1 156.8 L321.0 149.8 Z" fill="#14181f"/>
  <line x1="240.0" y1="210.0" x2="323.4" y2="247.1" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M330.0 250.0 L321.0 250.2 L324.1 243.2 Z" fill="#14181f"/>
  <text x="300.0" y="205.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">energy</text>
  <circle cx="370.0" cy="135.0" r="27.0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="370.0" y="140.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Ba-141</text>
  <circle cx="370.0" cy="265.0" r="22.0" stroke="#0e9aa7" stroke-width="2" fill="#dff4f5"/>
  <text x="370.0" y="270.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">Kr-92</text>
  <circle cx="500.0" cy="155.0" r="7.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="509.0" y1="155.0" x2="633.8" y2="121.7" stroke="#1f6fb5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M640.0 120.0 L633.9 125.1 L632.1 118.6 Z" fill="#1f6fb5"/>
  <circle cx="675.0" cy="120.0" r="24.0" stroke="#d98b2b" stroke-width="1.8" fill="#fed7aa"/>
  <text x="675.0" y="124.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">U-235</text>
  <circle cx="500.0" cy="200.0" r="7.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="509.0" y1="200.0" x2="633.6" y2="200.0" stroke="#1f6fb5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M640.0 200.0 L632.7 203.4 L632.7 196.6 Z" fill="#1f6fb5"/>
  <circle cx="675.0" cy="200.0" r="24.0" stroke="#d98b2b" stroke-width="1.8" fill="#fed7aa"/>
  <text x="675.0" y="204.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">U-235</text>
  <circle cx="500.0" cy="245.0" r="7.0" stroke="#1f6fb5" stroke-width="2" fill="#bfdbfe"/>
  <line x1="509.0" y1="245.0" x2="633.8" y2="278.3" stroke="#1f6fb5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M640.0 280.0 L632.1 281.4 L633.9 274.9 Z" fill="#1f6fb5"/>
  <circle cx="675.0" cy="280.0" r="24.0" stroke="#d98b2b" stroke-width="1.8" fill="#fed7aa"/>
  <text x="675.0" y="284.0" font-size="11" fill="#14181f" text-anchor="middle" font-weight="700">U-235</text>
  <text x="500.0" y="290.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">3 neutrons</text>
  <text x="720.0" y="185.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">each neutron can</text>
  <text x="720.0" y="202.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">split another</text>
  <text x="720.0" y="219.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">nucleus</text>
  <text x="450.0" y="330.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="-7.1" font-size="11.9">235</tspan><tspan dy="7.1">U + </tspan><tspan dy="-7.1" font-size="11.9">1</tspan><tspan dy="7.1">n -&gt; </tspan><tspan dy="-7.1" font-size="11.9">141</tspan><tspan dy="7.1">Ba + </tspan><tspan dy="-7.1" font-size="11.9">92</tspan><tspan dy="7.1">Kr + 3 </tspan><tspan dy="-7.1" font-size="11.9">1</tspan><tspan dy="7.1">n + energy</tspan></text>
  <rect x="15.0" y="355.0" width="870.0" height="135.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="385.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">fusion</text>
  <circle cx="110.0" cy="425.0" r="15.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <circle cx="150.0" cy="438.0" r="15.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <line x1="185.0" y1="430.0" x2="262.8" y2="430.0" stroke="#14181f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M270.0 430.0 L261.8 433.8 L261.8 426.2 Z" fill="#14181f"/>
  <circle cx="315.0" cy="430.0" r="24.0" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="380.0" y="435.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700">+ energy</text>
  <text x="490.0" y="422.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">light nuclei join to form a heavier nucleus,</text>
  <text x="490.0" y="442.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">releasing a very large amount of energy</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
