<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 3.10 (C11-PHY, PDF p62): a cream separator; flat drawing after the printed photograph: a wide silver milk bowl on top, a silver separator head below it with two curved spouts pointing out to the left (one for cream, one for skimmed milk), a blue motor housing, and a blue cylindrical stand on three splayed legs. No photograph is reproduced. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e959c"/><stop offset="0.45" stop-color="#e9edf0"/><stop offset="1" stop-color="#7d848b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6fb3"/><stop offset="0.45" stop-color="#4fb0e8"/><stop offset="1" stop-color="#1a5f9c"/></linearGradient>
  </defs>
  <rect width="900" height="1100" fill="#ffffff"/>
  <!-- milk bowl -->
  <path d="M250 60 L750 60 L610 300 L390 300 Z" fill="url(#steel)" stroke="#6d747b" stroke-width="4"/>
  <ellipse cx="500" cy="60" rx="250" ry="34" fill="#cfd5da" stroke="#6d747b" stroke-width="4"/>
  <ellipse cx="500" cy="300" rx="110" ry="20" fill="#a8afb5" stroke="#6d747b" stroke-width="3"/>
  <!-- ribbed collar under the bowl -->
  <rect x="400" y="300" width="200" height="40" fill="url(#steel)" stroke="#6d747b" stroke-width="3"/>
  <g stroke="#6d747b" stroke-width="3"><line x1="430" y1="300" x2="430" y2="340"/><line x1="460" y1="300" x2="460" y2="340"/><line x1="490" y1="300" x2="490" y2="340"/><line x1="520" y1="300" x2="520" y2="340"/><line x1="550" y1="300" x2="550" y2="340"/><line x1="580" y1="300" x2="580" y2="340"/></g>
  <!-- separator head with two spouts to the left -->
  <path d="M300 360 L420 360 L430 470 L290 470 Z" fill="url(#steel)" stroke="#6d747b" stroke-width="4"/>
  <ellipse cx="360" cy="360" rx="60" ry="14" fill="#d9dee2" stroke="#6d747b" stroke-width="3"/>
  <path d="M300 405 Q200 400 120 440" stroke="#6d747b" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M300 405 Q200 400 120 440" stroke="#dfe4e8" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M295 450 Q200 450 130 495" stroke="#6d747b" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M295 450 Q200 450 130 495" stroke="#dfe4e8" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- motor housing -->
  <path d="M440 350 L620 350 L640 480 L430 480 Z" fill="url(#blue)" stroke="#155088" stroke-width="4"/>
  <rect x="480" y="380" width="70" height="60" rx="8" fill="#1a5f9c"/>
  <!-- cylindrical stand -->
  <path d="M260 480 L700 480 L700 900 Q480 940 260 900 Z" fill="url(#blue)" stroke="#155088" stroke-width="4"/>
  <ellipse cx="480" cy="480" rx="220" ry="26" fill="#62b8ea" stroke="#155088" stroke-width="4"/>
  <path d="M260 900 Q480 940 700 900" stroke="#155088" stroke-width="6" fill="none"/>
  <!-- three splayed legs -->
  <g stroke="#155088" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M300 905 Q270 980 210 1030"/>
    <path d="M480 925 L480 1040"/>
    <path d="M660 905 Q690 980 750 1030"/>
  </g>
  <g fill="#155088"><ellipse cx="200" cy="1036" rx="34" ry="10"/><ellipse cx="480" cy="1046" rx="34" ry="10"/><ellipse cx="760" cy="1036" rx="34" ry="10"/></g>
</svg>
