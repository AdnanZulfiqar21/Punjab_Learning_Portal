<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#ffffff"/>
  <!-- Fig 16.19 (C12-PHY, PDF p81): a flat drawing after the printed photograph of a silver compact digital camera seen from the front, slightly from the left: the large round lens at the right of centre, the viewfinder and a small window above it, the flash window at the top right, a strap lug on the left with a beige wrist strap looping down and across the bottom. Brand names are not drawn. No photograph reproduced. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/><stop offset="0.5" stop-color="#c3c8ce"/><stop offset="1" stop-color="#a3a9b0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#5a6b80"/><stop offset="0.6" stop-color="#1e2733"/><stop offset="1" stop-color="#0d1218"/>
    </radialGradient>
  </defs>
  <!-- camera side (depth) -->
  <path d="M110 120 L150 90 L150 560 L110 590 Z" fill="#8f959c" stroke="#5d646d" stroke-width="2.5"/>
  <!-- body -->
  <rect x="150" y="90" width="860" height="470" rx="30" fill="url(#body)" stroke="#5d646d" stroke-width="3"/>
  <g stroke="#d9dde1" stroke-width="2" opacity="0.8">
    <line x1="180" y1="140" x2="990" y2="140"/><line x1="180" y1="230" x2="990" y2="230"/><line x1="180" y1="330" x2="990" y2="330"/><line x1="180" y1="440" x2="990" y2="440"/><line x1="180" y1="520" x2="990" y2="520"/>
  </g>
  <rect x="360" y="70" width="80" height="22" rx="6" fill="#b5bac0" stroke="#5d646d" stroke-width="2"/>
  <!-- lens ring and lens -->
  <circle cx="700" cy="350" r="190" fill="#d7dbe0" stroke="#7d858f" stroke-width="3"/>
  <circle cx="700" cy="350" r="150" fill="#bfc4ca" stroke="#7d858f" stroke-width="3"/>
  <circle cx="700" cy="350" r="118" fill="#9ea4ab" stroke="#5d646d" stroke-width="3"/>
  <circle cx="700" cy="350" r="92" fill="#6f767e" stroke="#3b4046" stroke-width="3"/>
  <rect x="640" y="296" width="120" height="104" rx="10" fill="url(#lens)" stroke="#0d1218" stroke-width="3"/>
  <path d="M664 312 L716 312 L700 336 L664 336 Z" fill="#8fa4bb" opacity="0.5"/>
  <!-- viewfinder and window -->
  <circle cx="610" cy="140" r="28" fill="#2a2f36" stroke="#5d646d" stroke-width="4"/>
  <circle cx="610" cy="140" r="12" fill="#56606c"/>
  <circle cx="680" cy="140" r="24" fill="#3a4048" stroke="#5d646d" stroke-width="4"/>
  <!-- flash window -->
  <rect x="820" y="115" width="120" height="50" rx="6" fill="#f3f1e8" stroke="#7d858f" stroke-width="2.5"/>
  <g stroke="#c9c6b8" stroke-width="2"><line x1="835" y1="125" x2="835" y2="155"/><line x1="855" y1="125" x2="855" y2="155"/><line x1="875" y1="125" x2="875" y2="155"/><line x1="895" y1="125" x2="895" y2="155"/><line x1="915" y1="125" x2="915" y2="155"/></g>
  <circle cx="960" cy="190" r="7" fill="#6b7178"/>
  <!-- strap lug -->
  <rect x="200" y="280" width="140" height="140" rx="10" fill="#b0b6bd" stroke="#5d646d" stroke-width="3"/>
  <rect x="178" y="300" width="36" height="40" rx="6" fill="#8f959c" stroke="#5d646d" stroke-width="2"/>
  <!-- wrist strap -->
  <path d="M196 320 C 120 340, 60 430, 70 520 C 80 640, 300 680, 600 640 C 820 610, 1000 590, 1060 610" fill="none" stroke="#d8c9a6" stroke-width="16" stroke-linecap="round"/>
  <path d="M196 336 C 140 360, 120 430, 150 500 C 180 560, 400 600, 640 580 C 840 560, 980 560, 1050 575" fill="none" stroke="#cdbd96" stroke-width="16" stroke-linecap="round"/>
  <rect x="70" y="400" width="54" height="96" rx="20" transform="rotate(-15 97 448)" fill="#8f959c" stroke="#5d646d" stroke-width="2.5"/>
</svg>
