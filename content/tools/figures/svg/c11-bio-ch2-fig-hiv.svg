<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.12: HIV in cross-section. -->
  <defs>
    <style>
      .t{font-size:28px;font-weight:700;fill:#14181f}
      .s{font-size:21px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
  </defs>
  <!-- envelope -->
  <circle cx="500" cy="400" r="230" fill="#f3e9d2" stroke="#d98b2b" stroke-width="10"/>
  <!-- spikes -->
  <g stroke="#8a4b00" stroke-width="6" fill="#d98b2b">
    <g transform="translate(500,400)">
      <g transform="rotate(0)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-232" x2="0" y2="-262"/><circle cx="0" cy="-272" r="12"/></g>
    </g>
  </g>
  <!-- capsid (cone) -->
  <polygon points="420,250 600,270 560,560 440,560" fill="#b2dbcc" stroke="#0f7a62" stroke-width="7" stroke-linejoin="round"/>
  <!-- RNA strands -->
  <path d="M470 300 c20 30 -20 60 0 90 s-20 60 0 90 s-20 40 0 60" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <path d="M540 310 c-20 30 20 60 0 90 s20 60 0 90 s20 40 0 50" fill="none" stroke="#5b3fb5" stroke-width="6" stroke-linecap="round"/>
  <!-- reverse transcriptase -->
  <g fill="#d98b2b" stroke="#8a4b00" stroke-width="3">
    <circle cx="505" cy="330" r="11"/><circle cx="500" cy="440" r="11"/><circle cx="510" cy="520" r="11"/>
  </g>
  <!-- labels -->
  <path class="lead" d="M700 240 L820 180"/><text class="t" x="770" y="150">Lipid envelope</text><text class="s" x="770" y="178">from the host cell</text>
  <path class="lead" d="M500 128 L500 60"/><text class="t" x="400" y="45">Glycoprotein spikes</text>
  <path class="lead" d="M440 300 L200 220"/><text class="t" x="60" y="205">Capsid</text><text class="s" x="40" y="233">cone-shaped, protein</text>
  <path class="lead" d="M470 480 L250 640"/><text class="t" x="150" y="680">RNA</text><text class="s" x="80" y="708">single-stranded genome</text>
  <path class="lead" d="M510 520 L700 660"/><text class="t" x="600" y="700">Reverse transcriptase</text><text class="s" x="600" y="728">makes DNA from the RNA</text>
  <text class="s" x="560" y="780">About 100 nm across; spherical</text>
</svg>
