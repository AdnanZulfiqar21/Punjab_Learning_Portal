<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="1050" fill="#ffffff"/>
  <!-- Answer figure (original): flowchart of a user registration process (long question 1). -->
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14181f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#14181f" stroke-width="1.6"/></marker></defs>
  <ellipse cx="400" cy="60" rx="110" ry="38" fill="#fde2e2" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="69" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">Start</text>
  <line x1="400" y1="98" x2="400" y2="148" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="220.0" y="156.0" width="360" height="68" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="198" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Open sign-up form</text>
  <line x1="400" y1="224" x2="400" y2="274" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <polygon points="240,279.0 620,279.0 560,381.0 180,381.0" fill="#fff4d6" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="321" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Enter name, email</text>
  <text x="400" y="355" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">and password</text>
  <line x1="400" y1="381" x2="400" y2="431" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <polygon points="400,433 630,545 400,657 170,545" fill="#dcf3e3" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="523" font-size="25" text-anchor="middle" font-weight="700" fill="#14181f">Details valid?</text>
  <text x="400" y="555" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">email not used,</text>
  <text x="400" y="583" font-size="22" text-anchor="middle" font-weight="400" fill="#14181f">password strong</text>
  <line x1="630" y1="545" x2="695" y2="545" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="665" y="533" font-size="24" text-anchor="middle" font-weight="700" fill="#14181f">No</text>
  <rect x="695.0" y="494.0" width="190" height="102" rx="6" fill="#fde2e2" stroke="#14181f" stroke-width="2.5"/>
  <text x="790" y="536" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Show error</text>
  <text x="790" y="570" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">message</text>
  <polyline points="790,494 790,330 610,330" fill="none" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="400" y1="657" x2="400" y2="712" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="432" y="693" font-size="24" text-anchor="start" font-weight="700" fill="#14181f">Yes</text>
  <rect x="220.0" y="711.0" width="360" height="68" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="753" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Save the new account</text>
  <line x1="400" y1="779" x2="400" y2="829" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="220.0" y="837.0" width="360" height="68" rx="6" fill="#e8f0fb" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="879" font-size="24" text-anchor="middle" font-weight="400" fill="#14181f">Send confirmation message</text>
  <line x1="400" y1="905" x2="400" y2="955" stroke="#14181f" stroke-width="2.5" marker-end="url(#ah)"/>
  <ellipse cx="400" cy="995" rx="110" ry="38" fill="#fde2e2" stroke="#14181f" stroke-width="2.5"/>
  <text x="400" y="1004" font-size="26" text-anchor="middle" font-weight="700" fill="#14181f">End</text>
</svg>
