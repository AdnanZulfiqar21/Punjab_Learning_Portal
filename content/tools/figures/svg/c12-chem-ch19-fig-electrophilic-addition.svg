  <text x="755.0" y="160.8" font-size="30" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">CH</tspan><tspan dy="9.0" font-size="21.6">2</tspan><tspan dy="-9.0"></tspan></text>
