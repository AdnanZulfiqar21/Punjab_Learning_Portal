  <text x="440.0" y="108.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="400"><tspan dy="0.0">&#8722;&#948;</tspan></text>
  <path d="M132.0 136.0 C140.0 45.0 290.0 40.0 322.0 118.0" stroke="#14181f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
