  <text x="160.0" y="362.0" font-size="28" fill="#111111" text-anchor="start" font-weight="700">Munfarid kyun (unique)</text>
  <text x="160.0" y="404.0" font-size="24" fill="#374151" text-anchor="start" font-weight="500">sasta, kisanon ki madad</text>
  <path d="M450.0 430.0 L450.0 447.6" stroke="#111111" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
