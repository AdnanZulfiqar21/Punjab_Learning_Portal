  <text x="160.0" y="214.0" font-size="28" fill="#111111" text-anchor="start" font-weight="700">Hal (solution)</text>
  <text x="160.0" y="256.0" font-size="24" fill="#374151" text-anchor="start" font-weight="500">maqami phalon ke taza juice</text>
  <path d="M450.0 282.0 L450.0 299.6" stroke="#111111" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
