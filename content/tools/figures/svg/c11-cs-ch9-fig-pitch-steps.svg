  <text x="160.0" y="66.0" font-size="28" fill="#111111" text-anchor="start" font-weight="700">Masla (problem)</text>
  <text x="160.0" y="108.0" font-size="24" fill="#374151" text-anchor="start" font-weight="500">taza juice ke mauqe kam hain</text>
