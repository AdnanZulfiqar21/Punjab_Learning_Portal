  <text x="100.0" y="531.0" font-size="32" fill="#b45309" text-anchor="middle" font-weight="800">4</text>
  <text x="160.0" y="510.0" font-size="28" fill="#111111" text-anchor="start" font-weight="700">Sameen (audience)</text>
  <text x="160.0" y="552.0" font-size="24" fill="#374151" text-anchor="start" font-weight="500">gahak: kyun pasand? investor: munafa?</text>
