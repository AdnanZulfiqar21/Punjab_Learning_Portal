<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Fig 5.7 (PDF page 100), original drawing after the printed figure: force F against extension delta x; the straight line OP and the shaded triangle OPQ under it. -->
  <rect width="900" height="720" fill="#ffffff"/>
  <path d="M140.0 600.0 L700.0 130.0 L700.0 600.0 Z" stroke="none" stroke-width="0" fill="#9a9ca0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="140.0" y1="600.0" x2="700.0" y2="130.0" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="140.0" y1="130.0" x2="700.0" y2="130.0" stroke="#555555" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <line x1="700.0" y1="130.0" x2="700.0" y2="600.0" stroke="#555555" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5"/>
  <line x1="140.0" y1="600.0" x2="140.0" y2="70.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M140.0 50.0 L149.2 72.0 L130.8 72.0 Z" fill="#1a1a1a"/>
  <line x1="140.0" y1="600.0" x2="840.0" y2="600.0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M860.0 600.0 L838.0 609.2 L838.0 590.8 Z" fill="#1a1a1a"/>
  <text x="120.0" y="630.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">O</text>
  <text x="120.0" y="142.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400"><tspan font-style="italic">F</tspan></text>
  <text x="714.0" y="122.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400">P</text>
  <text x="714.0" y="584.0" font-size="34" fill="#1a1a1a" text-anchor="start" font-weight="400">Q</text>
  <text x="420.0" y="648.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Δ<tspan font-style="italic">x</tspan></text>
</svg>
