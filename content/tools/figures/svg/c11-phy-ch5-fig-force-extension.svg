<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- Original redraw after Figure 5.7: the triangle OPQ under a force-extension line; its area is the energy stored. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Energy stored = area under the force-extension graph</text>
  <line x1="130.0" y1="380.0" x2="749.6" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M760.0 380.0 L748.2 385.5 L748.2 374.5 Z" fill="#14181f"/>
  <line x1="130.0" y1="380.0" x2="130.0" y2="80.4" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M130.0 70.0 L135.5 81.8 L124.5 81.8 Z" fill="#14181f"/>
  <text x="760.0" y="410.0" font-size="18" fill="#14181f" text-anchor="end" font-weight="700">extension x</text>
  <text x="140.0" y="84.0" font-size="18" fill="#14181f" text-anchor="start" font-weight="700">force F</text>
  <path d="M130.0 380.0 L600.0 130.0 L600.0 380.0 Z" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="130.0" y1="130.0" x2="600.0" y2="130.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="118.0" y="136.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700">F</text>
  <text x="610.0" y="124.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700">P</text>
  <text x="610.0" y="404.0" font-size="19" fill="#14181f" text-anchor="start" font-weight="700">Q</text>
  <text x="120.0" y="404.0" font-size="19" fill="#14181f" text-anchor="end" font-weight="700">O</text>
  <text x="600.0" y="426.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">x</text>
  <text x="470.0" y="320.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700">area OPQ = (1/2) F x</text>
  <text x="450.0" y="451" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
