<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <!-- Secondary halogenoalkanes as printed on p76: 2-chloropropane drawn as two CH3 groups joined to CH-Cl, and 2-chlorobutane CH3-CH(Cl)-CH2-CH3 with Cl above the second carbon. -->
  <text x="90.0" y="81.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="90.0" y="201.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="250.0" y="141.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan></text>
  <text x="390.0" y="141.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="140.0" y1="72.0" x2="216.0" y2="110.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="140.0" y1="188.0" x2="216.0" y2="150.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="278.0" y1="130.0" x2="366.9" y2="130.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="240.0" y="270.0" font-size="30" fill="#c2185b" text-anchor="middle" font-weight="700"><tspan dy="0.0">2-chloropropane</tspan></text>
  <text x="520.0" y="191.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="650.0" y="191.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan></text>
  <text x="780.0" y="191.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">2</tspan><tspan dy="-9.6"></tspan></text>
  <text x="910.0" y="191.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="9.6" font-size="23.0">3</tspan><tspan dy="-9.6"></tspan></text>
  <text x="650.0" y="76.5" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Cl</tspan></text>
  <line x1="554.5" y1="180.0" x2="622.0" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="678.0" y1="180.0" x2="745.5" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="814.5" y1="180.0" x2="875.5" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="650.0" y1="158.1" x2="650.0" y2="86.9" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
