<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original flow for topic 23.1: four stages of drug discovery (target identification, target validation, lead identification, lead optimization) and the development stages: preclinical research, clinical trial phases 1-3, regulatory review, manufacturing and post-marketing surveillance. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">From a disease target to a medicine</text>
  <rect x="15.0" y="55.0" width="870.0" height="200.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">drug discovery</text>
  <rect x="35.0" y="100.0" width="190.0" height="130.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="130.0" y="128.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">1 target</text>
  <text x="130.0" y="148.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">identification</text>
  <text x="130.0" y="180.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">a protein or enzyme</text>
  <text x="130.0" y="198.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">that causes disease</text>
  <line x1="227.0" y1="165.0" x2="239.4" y2="165.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M245.0 165.0 L238.7 168.0 L238.7 162.0 Z" fill="#14181f"/>
  <rect x="247.0" y="100.0" width="190.0" height="130.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="342.0" y="128.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">2 target</text>
  <text x="342.0" y="148.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">validation</text>
  <text x="342.0" y="180.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">show acting on it</text>
  <text x="342.0" y="198.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">can treat disease</text>
  <line x1="439.0" y1="165.0" x2="451.4" y2="165.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M457.0 165.0 L450.7 168.0 L450.7 162.0 Z" fill="#14181f"/>
  <rect x="459.0" y="100.0" width="190.0" height="130.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="554.0" y="128.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">3 lead compound</text>
  <text x="554.0" y="148.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">identification</text>
  <text x="554.0" y="180.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">screen thousands</text>
  <text x="554.0" y="198.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">of compounds</text>
  <line x1="651.0" y1="165.0" x2="663.4" y2="165.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M669.0 165.0 L662.7 168.0 L662.7 162.0 Z" fill="#14181f"/>
  <rect x="671.0" y="100.0" width="190.0" height="130.0" rx="12" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="766.0" y="128.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">4 lead</text>
  <text x="766.0" y="148.0" font-size="14" fill="#1f6fb5" text-anchor="middle" font-weight="700">optimization</text>
  <text x="766.0" y="180.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">more effective,</text>
  <text x="766.0" y="198.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">less toxic</text>
  <line x1="450.0" y1="258.0" x2="450.0" y2="277.8" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M450.0 285.0 L446.2 276.8 L453.8 276.8 Z" fill="#14181f"/>
  <rect x="15.0" y="290.0" width="870.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="320.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">drug development</text>
  <rect x="35.0" y="335.0" width="260.0" height="90.0" rx="12" stroke="#0f7a62" stroke-width="2" fill="#f0fdf4"/>
  <text x="165.0" y="362.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">preclinical research</text>
  <text x="165.0" y="384.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">in vitro (cells) and</text>
  <text x="165.0" y="402.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">in vivo (animals)</text>
  <line x1="297.0" y1="380.0" x2="314.4" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M320.0 380.0 L313.7 383.0 L313.7 377.0 Z" fill="#14181f"/>
  <rect x="325.0" y="335.0" width="168.0" height="90.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="409.0" y="360.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">phase 1</text>
  <text x="409.0" y="382.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">20-100 healthy</text>
  <text x="409.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">safety, dose</text>
  <line x1="495.0" y1="380.0" x2="500.2" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M505.0 380.0 L499.6 382.5 L499.6 377.5 Z" fill="#14181f"/>
  <rect x="507.0" y="335.0" width="168.0" height="90.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="591.0" y="360.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">phase 2</text>
  <text x="591.0" y="382.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">100-300 patients</text>
  <text x="591.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">effect, side effects</text>
  <line x1="677.0" y1="380.0" x2="682.2" y2="380.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M687.0 380.0 L681.6 382.5 L681.6 377.5 Z" fill="#14181f"/>
  <rect x="689.0" y="335.0" width="168.0" height="90.0" rx="12" stroke="#d98b2b" stroke-width="2" fill="#fff7ed"/>
  <text x="773.0" y="360.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">phase 3</text>
  <text x="773.0" y="382.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">1,000-3,000</text>
  <text x="773.0" y="400.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">confirm, adverse effects</text>
  <text x="600.0" y="448.0" font-size="13" fill="#d98b2b" text-anchor="middle" font-weight="700">clinical trials (people)</text>
  <rect x="35.0" y="480.0" width="265.0" height="110.0" rx="12" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="167.0" y="515.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">regulatory review</text>
  <text x="167.0" y="545.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">all data checked: approve or reject</text>
  <line x1="302.0" y1="535.0" x2="312.4" y2="535.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M318.0 535.0 L311.7 538.0 L311.7 532.0 Z" fill="#14181f"/>
  <rect x="320.0" y="480.0" width="265.0" height="110.0" rx="12" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="452.0" y="515.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">manufacturing and marketing</text>
  <text x="452.0" y="545.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">large-scale production</text>
  <line x1="587.0" y1="535.0" x2="597.4" y2="535.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M603.0 535.0 L596.7 538.0 L596.7 532.0 Z" fill="#14181f"/>
  <rect x="605.0" y="480.0" width="265.0" height="110.0" rx="12" stroke="#7c3aed" stroke-width="2" fill="#f5f3ff"/>
  <text x="737.0" y="515.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">post-marketing surveillance</text>
  <text x="737.0" y="545.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">watch for rare and long-term effects</text>
  <line x1="800.0" y1="427.0" x2="800.0" y2="469.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M800.0 476.0 L796.6 468.7 L803.4 468.7 Z" fill="#14181f"/>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
