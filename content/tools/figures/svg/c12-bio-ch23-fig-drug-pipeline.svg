<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1116" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1116" fill="#ffffff"/>
  <!-- Original RU-only overview of drug discovery and drug development (topics 23.1.1 and 23.1.2; not a textbook figure). -->
  <text x="500" y="60" font-size="30" fill="#1f6fb5" text-anchor="middle" font-weight="700">Drug discovery</text>
  <rect x="60" y="86" width="880" height="74" rx="12" stroke="#1f6fb5" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="133" font-size="27" fill="#1f6fb5" text-anchor="middle" font-weight="700">1. Target identification</text>
  <line x1="500" y1="163" x2="500" y2="177.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 187 L493.4 174.6 L506.6 174.6 Z" fill="#4a4f57"/>
  <rect x="60" y="190" width="880" height="74" rx="12" stroke="#1f6fb5" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="237" font-size="27" fill="#1f6fb5" text-anchor="middle" font-weight="700">2. Target validation</text>
  <line x1="500" y1="267" x2="500" y2="281.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 291 L493.4 278.6 L506.6 278.6 Z" fill="#4a4f57"/>
  <rect x="60" y="294" width="880" height="74" rx="12" stroke="#1f6fb5" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="341" font-size="27" fill="#1f6fb5" text-anchor="middle" font-weight="700">3. Lead compound identification</text>
  <line x1="500" y1="371" x2="500" y2="385.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 395 L493.4 382.6 L506.6 382.6 Z" fill="#4a4f57"/>
  <rect x="60" y="398" width="880" height="74" rx="12" stroke="#1f6fb5" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="445" font-size="27" fill="#1f6fb5" text-anchor="middle" font-weight="700">4. Lead optimization</text>
  <line x1="500" y1="475" x2="500" y2="489.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 499 L493.4 486.6 L506.6 486.6 Z" fill="#4a4f57"/>
  <text x="500" y="532" font-size="30" fill="#137a5a" text-anchor="middle" font-weight="700">Drug development</text>
  <rect x="60" y="558" width="880" height="74" rx="12" stroke="#137a5a" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="590" font-size="27" fill="#137a5a" text-anchor="middle" font-weight="700">1. Preclinical research</text>
  <text x="500" y="620" font-size="23" fill="#1d2430" text-anchor="middle" font-weight="400">in vitro and in vivo</text>
  <line x1="500" y1="635" x2="500" y2="649.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 659 L493.4 646.6 L506.6 646.6 Z" fill="#4a4f57"/>
  <rect x="60" y="662" width="880" height="74" rx="12" stroke="#137a5a" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="694" font-size="27" fill="#137a5a" text-anchor="middle" font-weight="700">2. Clinical trials</text>
  <text x="500" y="724" font-size="23" fill="#1d2430" text-anchor="middle" font-weight="400">Phase 1: 20-100 | Phase 2: 100-300 | Phase 3: 1,000-3,000</text>
  <line x1="500" y1="739" x2="500" y2="753.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 763 L493.4 750.6 L506.6 750.6 Z" fill="#4a4f57"/>
  <rect x="60" y="766" width="880" height="74" rx="12" stroke="#137a5a" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="798" font-size="27" fill="#137a5a" text-anchor="middle" font-weight="700">3. FDA drug review</text>
  <text x="500" y="828" font-size="23" fill="#1d2430" text-anchor="middle" font-weight="400">approve or reject</text>
  <line x1="500" y1="843" x2="500" y2="857.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 867 L493.4 854.6 L506.6 854.6 Z" fill="#4a4f57"/>
  <rect x="60" y="870" width="880" height="74" rx="12" stroke="#137a5a" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="917" font-size="27" fill="#137a5a" text-anchor="middle" font-weight="700">4. Manufacturing and marketing</text>
  <line x1="500" y1="947" x2="500" y2="961.2" stroke="#4a4f57" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M500 971 L493.4 958.6 L506.6 958.6 Z" fill="#4a4f57"/>
  <rect x="60" y="974" width="880" height="74" rx="12" stroke="#137a5a" stroke-width="3" fill="#ffffff"/>
  <text x="500" y="1021" font-size="27" fill="#137a5a" text-anchor="middle" font-weight="700">5. Post-marketing surveillance</text>
</svg>
