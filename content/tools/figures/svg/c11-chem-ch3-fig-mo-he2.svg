<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 3.36: the MO diagram of He2; two electrons in the bonding and two in the antibonding orbital give a bond order of zero. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Molecular orbital diagram of He2</text>
  <line x1="50.0" y1="420.0" x2="50.0" y2="90.4" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50.0 80.0 L55.5 91.8 L44.5 91.8 Z" fill="#4b5563"/>
  <text x="36.0" y="250.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700" transform="rotate(-90 36.0 250.0)">energy</text>
  <line x1="178.0" y1="250.0" x2="222.0" y2="250.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="193.0" y1="264.0" x2="193.0" y2="240.4" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M193.0 234.0 L196.4 241.3 L189.6 241.3 Z" fill="#1f6fb5"/>
  <line x1="207.0" y1="234.0" x2="207.0" y2="257.6" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M207.0 264.0 L203.6 256.7 L210.4 256.7 Z" fill="#1f6fb5"/>
  <text x="200.0" y="290.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1s (He)</text>
  <line x1="658.0" y1="250.0" x2="702.0" y2="250.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="673.0" y1="264.0" x2="673.0" y2="240.4" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M673.0 234.0 L676.4 241.3 L669.6 241.3 Z" fill="#1f6fb5"/>
  <line x1="687.0" y1="234.0" x2="687.0" y2="257.6" stroke="#1f6fb5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M687.0 264.0 L683.6 256.7 L690.4 256.7 Z" fill="#1f6fb5"/>
  <text x="680.0" y="290.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">1s (He)</text>
  <line x1="418.0" y1="140.0" x2="462.0" y2="140.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="433.0" y1="154.0" x2="433.0" y2="130.4" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M433.0 124.0 L436.4 131.3 L429.6 131.3 Z" fill="#d7322f"/>
  <line x1="447.0" y1="124.0" x2="447.0" y2="147.6" stroke="#d7322f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M447.0 154.0 L443.6 146.7 L450.4 146.7 Z" fill="#d7322f"/>
  <text x="476.0" y="145.0" font-size="14" fill="#d7322f" text-anchor="start" font-weight="700">sigma*1s (antibonding)</text>
  <line x1="418.0" y1="360.0" x2="462.0" y2="360.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="433.0" y1="374.0" x2="433.0" y2="350.4" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M433.0 344.0 L436.4 351.3 L429.6 351.3 Z" fill="#0f7a62"/>
  <line x1="447.0" y1="344.0" x2="447.0" y2="367.6" stroke="#0f7a62" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M447.0 374.0 L443.6 366.7 L450.4 366.7 Z" fill="#0f7a62"/>
  <text x="476.0" y="365.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">sigma1s (bonding)</text>
  <line x1="222.0" y1="250.0" x2="418.0" y2="140.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="222.0" y1="250.0" x2="418.0" y2="360.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="658.0" y1="250.0" x2="462.0" y2="140.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="658.0" y1="250.0" x2="462.0" y2="360.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <rect x="560.0" y="395.0" width="310.0" height="56.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="715.0" y="418.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">bond order = (2 - 2) / 2 = 0</text>
  <text x="715.0" y="440.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="400">so He2 does not exist</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
