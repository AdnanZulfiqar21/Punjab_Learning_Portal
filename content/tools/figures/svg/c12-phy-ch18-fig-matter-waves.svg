<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 18.7 and the book's box: electrons from a gun strike a nickel crystal and a movable detector finds diffraction peaks (lambda = h/sqrt(2meV)); and electrons passing through a double slit build up a pattern of bright and dark fringes, showing interference like waves. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Matter waves (after Fig 18.7 and the double-slit box)</text>
  <rect x="15.0" y="55.0" width="430.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="230.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">Davisson-Germer experiment</text>
  <rect x="80.0" y="110.0" width="40.0" height="60.0" rx="4" stroke="#14181f" stroke-width="2" fill="#e5e7eb"/>
  <circle cx="100.0" cy="150.0" r="6.0" stroke="#d98b2b" stroke-width="1" fill="#fdba74"/>
  <text x="130.0" y="128.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">electron gun</text>
  <line x1="100.0" y1="172.0" x2="195.1" y2="293.7" stroke="#0f7a62" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M200.0 300.0 L191.1 295.5 L197.8 290.3 Z" fill="#0f7a62"/>
  <text x="40.0" y="240.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">electrons,</text>
  <text x="40.0" y="256.0" font-size="12" fill="#0f7a62" text-anchor="start" font-weight="700">energy eV</text>
  <path d="M170.0 320.0 L230.0 300.0 L270.0 330.0 L250.0 380.0 L190.0 380.0 Z" stroke="#14181f" stroke-width="2" fill="#d1d5db" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="220.0" y="405.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">nickel crystal</text>
  <line x1="215.0" y1="300.0" x2="335.3" y2="136.4" stroke="#d7322f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M340.0 130.0 L338.0 139.8 L331.2 134.8 Z" fill="#d7322f"/>
  <path d="M300 90 A190 190 0 0 1 420 300" stroke="#1f6fb5" stroke-width="4" fill="none" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="395.0" y="120.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">detector</text>
  <text x="205.0" y="278.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">phi</text>
  <text x="230.0" y="440.0" font-size="16" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">lambda = h / sqrt(2meV)</tspan></text>
  <rect x="455.0" y="55.0" width="430.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="670.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">electrons through a double slit</text>
  <rect x="560.0" y="120.0" width="12.0" height="240.0" rx="0" stroke="#14181f" stroke-width="1" fill="#9ca3af"/>
