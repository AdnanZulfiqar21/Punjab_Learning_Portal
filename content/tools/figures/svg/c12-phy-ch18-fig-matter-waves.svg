  <rect x="831.0" y="214.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#839ce6"/>
  <rect x="831.0" y="232.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#375fd7"/>
  <rect x="831.0" y="250.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#839ce6"/>
  <rect x="831.0" y="268.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#e1e7f9"/>
  <rect x="831.0" y="286.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#fefefe"/>
  <rect x="831.0" y="304.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#dbe2f7"/>
  <rect x="831.0" y="322.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#b4c3f0"/>
  <rect x="831.0" y="340.0" width="16.0" height="16.0" rx="0" stroke="none" stroke-width="0" fill="#b7c5f0"/>
  <text x="700.0" y="395.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the screen shows bright and dark fringes:</text>
  <text x="700.0" y="412.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">the electrons interfere like waves</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
