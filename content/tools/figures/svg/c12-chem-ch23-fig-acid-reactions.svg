<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Original summary of topic 23.5: ethanoic acid with Na, NaOH, Na2CO3 and NaHCO3; with SOCl2 and PCl5 to ethanoyl chloride; esterification; reduction by LiAlH4; oxidation of methanoic acid by Tollens' reagent and of ethanedioic acid by acidified KMnO4. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reactions of carboxylic acids (ethanoic acid)</text>
  <rect x="15.0" y="55.0" width="870.0" height="175.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">A. the acidic hydrogen</text>
  <text x="450.0" y="105.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + 2Na -&gt; 2CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COONa + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="450.0" y="137.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + NaOH -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COONa + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="450.0" y="169.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + Na</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">CO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> -&gt; 2CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COONa + CO</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <text x="450.0" y="201.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + NaHCO</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8"> -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COONa + CO</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O</tspan></text>
  <rect x="15.0" y="240.0" width="870.0" height="165.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="270.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">B. replacing the -OH group</text>
  <text x="450.0" y="290.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + SOCl</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8"> -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COCl + HCl + SO</tspan><tspan dy="4.8" font-size="10.5">2</tspan></text>
  <text x="450.0" y="322.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + PCl</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8"> -&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COCl + HCl + POCl</tspan><tspan dy="4.8" font-size="10.5">3</tspan></text>
  <text x="450.0" y="354.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOH + C</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8">OH &lt;=&gt; CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">COOC</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8"> + H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">O (conc. H</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">SO</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">, heat)</tspan></text>
  <rect x="15.0" y="415.0" width="870.0" height="155.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="445.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">C. reduction, and oxidation of methanoic and ethanedioic acids</text>
  <text x="450.0" y="465.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOH + 4[H] -&gt; CH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">CH</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">OH + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O (LiAlH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">; not H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">/Ni or NaBH</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">)</tspan></text>
  <text x="450.0" y="497.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HCOOH + 2[Ag(NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">]OH -&gt; 2Ag + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 4NH</tspan><tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + 2H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="450.0" y="529.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2KMnO</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5"> + 3H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">SO</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5"> + 5(COOH)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> -&gt; K</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">SO</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5"> + 2MnSO</tspan><tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5"> + 10CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> + 8H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
  <text x="450.0" y="591" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
