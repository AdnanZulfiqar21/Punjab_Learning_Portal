<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" font-family="Arial, Helvetica, sans-serif">
  <!-- Do You Know? (C11-PHY, PDF p40): a magenta full-face motorcycle safety helmet seen from the front left, with dark stripes over the top, a grey rim round a large dark visor, a small yellow flash and two vents at the side, and dark stripes on the chin guard; flat drawing after the printed picture. -->
  <rect width="900" height="1000" fill="#ffffff"/>
  <!-- shell -->
  <path d="M190 560 Q120 300 300 140 Q450 40 620 110 Q800 190 820 420 Q835 610 760 760 Q690 880 520 900 L330 900 Q240 880 215 790 Z" fill="#c51c6b" stroke="#6e0a38" stroke-width="6" stroke-linejoin="round"/>
  <!-- top stripes -->
  <path d="M300 140 Q340 230 330 330 L380 325 Q395 210 360 110 Z" fill="#2a0a18"/>
  <path d="M420 85 Q470 200 465 315 L520 312 Q525 180 480 75 Z" fill="#2a0a18"/>
  <path d="M260 175 Q280 260 270 340 L300 338 Q310 250 290 155 Z" fill="#7a1042"/>
  <!-- grey rim and visor -->
  <path d="M200 430 Q420 330 720 350 Q770 360 775 420 L770 560 Q760 640 690 660 L260 690 Q205 690 200 630 Z" fill="#8c8f96" stroke="#4d5056" stroke-width="5"/>
  <path d="M230 465 Q430 385 700 400 Q735 405 738 440 L732 560 Q722 615 670 625 L280 650 Q235 650 232 610 Z" fill="#141418"/>
  <path d="M250 480 Q260 560 262 640" stroke="#bfe3f5" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M420 430 Q560 410 690 425" stroke="#3a3c46" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- yellow flash and side vents -->
  <path d="M640 360 L760 340 L735 420 L700 392 Z" fill="#f2d21e"/>
  <circle cx="790" cy="450" r="16" fill="#1a1a1a"/>
  <circle cx="790" cy="520" r="16" fill="#1a1a1a"/>
  <!-- chin guard stripes -->
  <path d="M300 720 Q320 800 310 890 L345 895 Q360 800 340 715 Z" fill="#2a0a18"/>
  <path d="M390 712 Q410 800 400 898 L440 898 Q452 800 430 708 Z" fill="#2a0a18"/>
  <path d="M480 705 Q520 800 520 895" stroke="#7a1042" stroke-width="10" fill="none"/>
</svg>
