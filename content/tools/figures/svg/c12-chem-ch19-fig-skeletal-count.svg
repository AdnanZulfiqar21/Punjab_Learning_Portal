<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original diagram after the book's worked example: but-2-ene (C4H8, empirical CH2) and ethanamide (C2H5NO, which is also its empirical formula), with the H atoms on each carbon counted. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Finding a molecular formula from a skeletal formula</text>
  <rect x="15.0" y="60.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="227.5" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(a) but-2-ene</text>
  <line x1="110.0" y1="230.0" x2="180.0" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="181.7" y1="187.0" x2="251.7" y2="227.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="178.3" y1="193.0" x2="248.3" y2="233.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="250.0" y1="230.0" x2="320.0" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="110.0" y="260.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C + 3H</text>
  <text x="180.0" y="172.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C + 1H</text>
  <text x="250.0" y="260.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C + 1H</text>
  <text x="320.0" y="172.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C + 3H</text>
  <text x="227.0" y="320.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">8</tspan><tspan dy="-5.1">; empirical formula CH</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <rect x="460.0" y="60.0" width="425.0" height="320.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="672.5" y="90.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">(b) ethanamide</text>
  <line x1="570.0" y1="245.0" x2="640.0" y2="205.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="636.5" y1="205.0" x2="636.5" y2="135.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="643.5" y1="205.0" x2="643.5" y2="135.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="648.7" y1="210.0" x2="701.3" y2="240.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="640.0" y="126.3" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">O</tspan></text>
  <text x="730.0" y="258.3" font-size="18" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.8" font-size="12.6">2</tspan></text>
  <text x="560.0" y="275.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">C + 3H</text>
  <text x="675.0" y="200.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">C (no H)</text>
  <text x="672.0" y="320.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">NO; empirical formula C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">NO</tspan></text>
  <text x="450.0" y="410.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">a carbon at a line end or corner takes as many H as it needs to make four bonds</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
