<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.4: the six stages of endospore formation. -->
  <defs>
    <style>
      .n{font-size:26px;font-weight:700;fill:#0f7a62}
      .s{font-size:20px;fill:#4b5563}
      .cell{fill:#eef6fb;stroke:#1f6fb5;stroke-width:5}
      .dna{fill:none;stroke:#5b3fb5;stroke-width:5}
    </style>
  </defs>
  <!-- row 1 -->
  <g transform="translate(40,60)">
    <text class="n" x="0" y="0">1</text>
    <rect class="cell" x="0" y="20" width="260" height="110" rx="55"/>
    <circle class="dna" cx="80" cy="75" r="26"/><circle class="dna" cx="180" cy="75" r="26"/>
    <text class="s" x="0" y="170">DNA replicates</text>
  </g>
  <g transform="translate(370,60)">
    <text class="n" x="0" y="0">2</text>
    <rect class="cell" x="0" y="20" width="260" height="110" rx="55"/>
    <circle class="dna" cx="80" cy="75" r="26"/><circle class="dna" cx="205" cy="75" r="22"/>
    <path d="M160 25 V125" stroke="#1f6fb5" stroke-width="6"/>
    <text class="s" x="0" y="170">septum isolates one copy</text>
  </g>
  <g transform="translate(700,60)">
    <text class="n" x="0" y="0">3</text>
    <rect class="cell" x="0" y="20" width="260" height="110" rx="55"/>
    <circle class="dna" cx="80" cy="75" r="26"/>
    <ellipse cx="200" cy="75" rx="42" ry="40" fill="none" stroke="#1f6fb5" stroke-width="5"/>
    <ellipse cx="200" cy="75" rx="32" ry="30" fill="none" stroke="#1f6fb5" stroke-width="5"/>
    <circle class="dna" cx="200" cy="75" r="16"/>
    <text class="s" x="0" y="170">second membrane wraps it</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(40,330)">
    <text class="n" x="0" y="0">4</text>
    <rect class="cell" x="10" y="25" width="240" height="100" rx="50" stroke-dasharray="10 8"/>
    <circle cx="80" cy="75" r="26" fill="none" stroke="#c9b6ea" stroke-width="5" stroke-dasharray="6 6"/>
    <ellipse cx="195" cy="75" rx="40" ry="38" fill="none" stroke="#1f6fb5" stroke-width="5"/>
    <ellipse cx="195" cy="75" rx="30" ry="28" fill="none" stroke="#1f6fb5" stroke-width="5"/>
    <circle class="dna" cx="195" cy="75" r="15"/>
    <text class="s" x="0" y="170">parent DNA disintegrates,</text><text class="s" x="0" y="196">cell dehydrates</text>
  </g>
  <g transform="translate(370,330)">
    <text class="n" x="0" y="0">5</text>
    <rect class="cell" x="10" y="25" width="240" height="100" rx="50" stroke-dasharray="10 8"/>
    <ellipse cx="195" cy="75" rx="46" ry="44" fill="none" stroke="#14181f" stroke-width="8"/>
    <ellipse cx="195" cy="75" rx="36" ry="34" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="4"/>
    <circle class="dna" cx="195" cy="75" r="14"/>
    <text class="s" x="0" y="170">peptidoglycan and</text><text class="s" x="0" y="196">spore coat form</text>
  </g>
  <g transform="translate(700,330)">
    <text class="n" x="0" y="0">6</text>
    <path d="M20 45 h70 M160 45 h60 M20 105 h40 M190 105 h40" stroke="#1f6fb5" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="130" cy="75" rx="46" ry="44" fill="none" stroke="#14181f" stroke-width="8"/>
    <ellipse cx="130" cy="75" rx="36" ry="34" fill="#c9b6ea" stroke="#5b3fb5" stroke-width="4"/>
    <circle class="dna" cx="130" cy="75" r="14"/>
    <text class="s" x="0" y="170">parent cell breaks:</text><text class="s" x="0" y="196">endospore released</text>
  </g>
  <!-- germination note -->
  <path d="M120 620 H880" stroke="#e3e8ee" stroke-width="3"/>
  <text class="s" x="120" y="680">When favourable conditions return, the endospore germinates into a new vegetative cell.</text>
  <text class="s" x="120" y="716">Blue: cell membrane · purple: DNA and peptidoglycan · black: spore coat</text>
</svg>
