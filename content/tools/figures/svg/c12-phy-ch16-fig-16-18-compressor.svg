<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#c9ccd0"/>
  <!-- Fig 16.18 (C12-PHY, PDF p81): a flat drawing after the printed photograph of the back of a refrigerator. Above, the grey metal back panel with a white label and a green drain tube held by a blue clip; below it, the open machine compartment with the black dome-shaped compressor (white label, copper pipes and wires) on the left, the black wire-grid condenser in the middle, and a blue valve and white wiring on the right; a grey floor in front. No photograph reproduced. -->
  <!-- back panel -->
  <rect x="0" y="0" width="1000" height="440" fill="#b3b8be"/>
  <g stroke="#c9cdd2" stroke-width="10" opacity="0.7">
    <line x1="0" y1="60" x2="1000" y2="40"/><line x1="0" y1="170" x2="1000" y2="150"/><line x1="0" y1="290" x2="1000" y2="270"/><line x1="0" y1="390" x2="1000" y2="372"/>
  </g>
  <rect x="270" y="210" width="190" height="118" fill="#f4f4f2" stroke="#9a9fa5" stroke-width="2"/>
  <g stroke="#b5b8bc" stroke-width="4">
    <line x1="290" y1="236" x2="440" y2="236"/><line x1="290" y1="256" x2="440" y2="256"/><line x1="290" y1="276" x2="440" y2="276"/><line x1="290" y1="296" x2="420" y2="296"/>
  </g>
  <!-- machine compartment -->
  <rect x="0" y="440" width="1000" height="300" fill="#1c1e22"/>
  <rect x="0" y="432" width="1000" height="16" fill="#8e949b"/>
  <!-- compressor -->
  <path d="M110 700 L110 560 C 110 470, 380 470, 380 560 L380 700 Z" fill="#0f1114" stroke="#3a3e44" stroke-width="3"/>
  <path d="M150 520 C 200 490, 290 488, 340 520" fill="none" stroke="#4a5058" stroke-width="10" stroke-linecap="round"/>
  <rect x="236" y="600" width="80" height="50" fill="#e8eef4" stroke="#7d858f" stroke-width="2"/>
  <rect x="246" y="610" width="34" height="8" fill="#3b6fb0"/>
  <path d="M40 470 C 60 560, 40 640, 110 690" fill="none" stroke="#c8752e" stroke-width="7"/>
  <path d="M80 720 C 170 735, 260 690, 380 650 C 430 635, 460 640, 470 610" fill="none" stroke="#c8752e" stroke-width="7"/>
  <path d="M60 640 C 150 700, 330 700, 440 600" fill="none" stroke="#e6d2a0" stroke-width="5"/>
  <!-- relay box -->
  <rect x="420" y="560" width="46" height="90" rx="6" fill="#ece9e1" stroke="#9a968c" stroke-width="2"/>
  <line x1="466" y1="600" x2="530" y2="600" stroke="#c9ccd0" stroke-width="5"/>
  <!-- condenser grid -->
  <rect x="540" y="510" width="270" height="200" fill="#0c0d10"/>
  <g stroke="#454a52" stroke-width="5">
    <line x1="540" y1="540" x2="810" y2="540"/><line x1="540" y1="575" x2="810" y2="575"/><line x1="540" y1="610" x2="810" y2="610"/><line x1="540" y1="645" x2="810" y2="645"/><line x1="540" y1="680" x2="810" y2="680"/>
    <line x1="570" y1="510" x2="570" y2="710"/><line x1="610" y1="510" x2="610" y2="710"/><line x1="650" y1="510" x2="650" y2="710"/><line x1="690" y1="510" x2="690" y2="710"/><line x1="730" y1="510" x2="730" y2="710"/><line x1="770" y1="510" x2="770" y2="710"/>
  </g>
  <!-- right side: valve and wiring -->
  <rect x="880" y="470" width="120" height="250" fill="#2a2d32"/>
  <path d="M860 520 C 900 520, 930 600, 900 700" fill="none" stroke="#f0eee6" stroke-width="6"/>
  <path d="M900 500 C 960 540, 940 640, 960 700" fill="none" stroke="#e8d78a" stroke-width="5"/>
  <path d="M840 560 L900 548 L920 566 L860 580 Z" fill="#2f6fd0" stroke="#1b4a8c" stroke-width="2"/>
  <circle cx="912" cy="556" r="14" fill="#2f6fd0" stroke="#1b4a8c" stroke-width="2"/>
  <!-- green drain tube with blue clip -->
  <path d="M760 0 L760 420 C 760 560, 800 620, 860 610 L900 600" fill="none" stroke="#5bc2b0" stroke-width="12" stroke-linecap="round"/>
  <path d="M760 0 L760 420" fill="none" stroke="#9fe0d4" stroke-width="3"/>
  <rect x="738" y="312" width="44" height="22" rx="5" fill="#2f6fd0"/>
  <!-- floor -->
  <rect x="0" y="740" width="1000" height="22" fill="#9ea3a9"/>
  <rect x="0" y="762" width="1000" height="238" fill="#8b8f93"/>
</svg>
