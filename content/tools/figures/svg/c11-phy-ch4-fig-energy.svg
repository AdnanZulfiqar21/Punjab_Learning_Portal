<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="740" fill="#ffffff"/>
  <!-- Original diagram after Figure 4.11 and topics 4.5 to 4.7: kinetic energy, absolute potential energy, escape velocity and the work-energy theorem. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
  </defs>
  <text class="h" x="600" y="32">Kinetic energy, absolute potential energy, escape velocity and the work-energy theorem</text>
  <!-- kinetic -->
  <rect x="50" y="55" width="360" height="320" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Kinetic energy (4.5)</text>
  <rect x="80" y="130" width="90" height="45" rx="8" fill="#f8c8b8" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="100" cy="180" r="8" fill="#4b5563"/><circle cx="150" cy="180" r="8" fill="#4b5563"/>
  <path d="M170 152 H250" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M80 165 L40 165" stroke="#d7322f" stroke-width="2.5" marker-end="url(#p)"/>
  <text class="l" x="180" y="124" style="fill:#1f6fb5">v, engine off</text>
  <text class="l" x="60" y="200" style="fill:#d7322f">f</text>
  <path d="M80 200 H330" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="r" x="200" y="216">stops after distance d</text>
  <g class="f">
    <text x="70" y="246">work against friction = f d = KE</text>
    <text x="70" y="266">f = -m a, a = -f/m; 2 a S = vf^2 - vi^2</text>
    <text x="70" y="286">2 (-f/m) d = 0 - v^2  ->  f d = (1/2) m v^2</text>
    <text x="70" y="306">KE = (1/2) m v^2  (4.9), in joules</text>
  </g>
  <g class="t">
    <text x="70" y="334"><tspan class="b">Example 4.3:</tspan> car of weight 18620 N (m = 1900 kg) at</text>
    <text x="70" y="350">16 m s^-1 stopped in 80 m: (1/2)(1900)(16)^2 = f x 80, f = 3040 N</text>
  </g>
  <!-- absolute PE -->
  <rect x="430" y="55" width="400" height="320" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="630" y="83">Absolute potential energy (Fig. 4.11)</text>
  <circle cx="500" cy="300" r="40" fill="#bcdcf0" stroke="#4b5563" stroke-width="1.5"/>
  <text class="l" x="486" y="304">Earth</text>
  <path d="M500 260 V110" stroke="#4b5563" stroke-width="1.5"/>
  <g stroke="#4b5563" stroke-width="1"><path d="M494 240 H506 M494 215 H506 M494 190 H506 M494 165 H506 M494 118 H506"/></g>
  <g class="r"><text x="512" y="244">1</text><text x="512" y="219">2</text><text x="512" y="194">3</text><text x="512" y="169">4</text><text x="512" y="122">N (infinity)</text></g>
  <path d="M470 240 V215" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="432" y="208" style="fill:#d7322f">delta r</text>
  <path d="M540 300 V240" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="546" y="276">r1</text>
  <path d="M565 300 V215" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="571" y="262">r2</text>
  <g class="f">
    <text x="600" y="120">r = r1 + delta r / 2 (4.10)</text>
    <text x="600" y="140">F = G M m / r^2 (4.11)</text>
    <text x="600" y="160">r^2 = r1^2 + r1 delta r = r1 r2</text>
    <text x="600" y="180">F = G M m / (r1 r2) (4.12)</text>
    <text x="600" y="200">W(1 to 2) = -G M m (1/r1 - 1/r2)</text>
    <text x="600" y="220">W_total = -G M m (1/r1 - 1/rN)</text>
    <text x="600" y="240">rN = infinity: U = -G M m / r</text>
    <text x="600" y="260">surface: U_g = -G M m / R (4.13)</text>
  </g>
  <g class="t">
    <text x="450" y="326">the work done by gravity in moving the body from its position</text>
    <text x="450" y="342">to infinity, where gravity is zero; mgh holds only near the</text>
    <text x="450" y="358">surface; U rises (less negative) with r</text>
  </g>
  <!-- escape -->
  <rect x="850" y="55" width="300" height="320" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="1000" y="83">Escape velocity (4.6)</text>
  <g class="f">
    <text x="870" y="112">(1/2) m v_esc^2 = G M m / R</text>
    <text x="870" y="132">v_esc = sqrt(2 G M / R) (4.14)</text>
    <text x="870" y="152">g = G M / R^2, g R = G M / R</text>
    <text x="870" y="172">v_esc = sqrt(2 g R) (4.15) = 11 km s^-1</text>
  </g>
  <g class="t">
    <text x="870" y="200">the initial velocity with which an object</text>
    <text x="870" y="216">leaves the Earth's gravitational field: its</text>
    <text x="870" y="232">initial KE equals the rise in PE to infinity</text>
  </g>
  <g class="t b"><text x="870" y="262">escape speeds (km s^-1)</text></g>
  <g class="f" style="font-size:11px">
    <text x="870" y="282">Moon 2.4    Mercury 4.3   Mars 5.0</text>
    <text x="870" y="300">Venus 10.4  Earth 11.2    Uranus 22.4</text>
    <text x="870" y="318">Neptune 25.4  Saturn 37.0  Jupiter 61</text>
  </g>
  <text class="r" x="870" y="350">more solar energy reaches Earth in 10 days than all fossil</text>
  <text class="r" x="870" y="364">fuels hold; more coal used since 1945 than before</text>
  <!-- work-energy -->
  <rect x="50" y="395" width="1100" height="320" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="423">Work-energy theorem (4.7) and Example 4.4</text>
  <g class="f">
    <text x="70" y="452">a = (vf^2 - vi^2) / (2 d) (4.16);  a = F / m (4.17);  F d = (1/2) m vf^2 - (1/2) m vi^2 (4.18)</text>
  </g>
  <g class="t">
    <text x="70" y="480"><tspan class="b">statement:</tspan> the change in kinetic energy of an object equals the work done on it by the net force, W = (KE)f - (KE)i; valid for any direction of the force</text>
    <text x="70" y="496">relative to the displacement, and even if the force varies from point to point; an object with KE pushing on another does work, so its KE falls (negative work)</text>
  </g>
  <!-- slope -->
  <path d="M90 620 L330 540" stroke="#4b5563" stroke-width="2.5"/>
  <path d="M90 620 H330" stroke="#9ca3af" stroke-width="1"/>
  <path d="M140 620 A 50 50 0 0 0 135 604" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="146" y="612">24</text>
  <rect x="210" y="560" width="40" height="22" transform="rotate(-18.4 230 571)" fill="#f8c8b8" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M230 571 L210 615" stroke="#0f7a62" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 571 L246 545" stroke="#1f6fb5" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 571 L286 553" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="196" y="634">mg</text><text class="r" x="236" y="536" style="fill:#1f6fb5">F_N</text><text class="r" x="290" y="560" style="fill:#d7322f">f = 100 N</text>
  <text class="r" x="70" y="662">rider 60 kg + motorcycle 30 kg,</text>
  <text class="r" x="70" y="676">vi = 3.2 m s^-1, 72 m downhill</text>
  <g class="t">
    <text x="360" y="540"><tspan class="b">Example 4.4:</tspan> F_N balances mg cos 24; net force along the slope F = mg sin 24 - f = 90 x 9.8 x 0.4 - 100 = 252.8 N;</text>
    <text x="360" y="558">W = F d = 252.8 x 72 = 18201.6 J (positive); (KE)f = W + (KE)i: (1/2)(90) vf^2 = 18201 + (1/2)(90)(3.2)^2,</text>
    <text x="360" y="576">vf^2 = 414.7 m^2 s^-2, vf = 20.4 m s^-1</text>
    <text x="360" y="606"><tspan class="b">approximate energies (J):</tspan> burning 1 ton of coal 30 x 10^9; burning 1 litre of petrol 5 x 10^7; KE of a car at 90 km h^-1 1 x 10^6;</text>
    <text x="360" y="622">running person at 10 km h^-1 3 x 10^3; fission of one uranium atom 1.8 x 10^-11; KE of a molecule of air 6 x 10^-21</text>
    <text x="360" y="662"><tspan class="b">potential energy:</tspan> energy because of position in a force field (gravitational) or a constrained state; a compressed or stretched</text>
    <text x="360" y="678">spring stores elastic potential energy.  <tspan class="b">Tid-bits:</tspan> all the food you eat in one day has about the same energy as 1/3 litre of petrol</text>
  </g>
  <text class="s" x="600" y="732" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
