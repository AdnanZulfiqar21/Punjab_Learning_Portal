  <text x="760.0" y="385.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">one placed on the other:</text>
  <text x="760.0" y="403.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">the thumbs point opposite ways</text>
  <text x="450.0" y="432.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">Chiral = non-superimposable on its mirror image ('cheir' = hand).</text>
  <text x="450.0" y="450.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">A carbon atom with four different groups makes a molecule chiral.</text>
  <text x="450.0" y="471" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
