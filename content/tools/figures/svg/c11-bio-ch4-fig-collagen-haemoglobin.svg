  <text x="225.0" y="300.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">three polypeptide chains wound</text>
  <text x="225.0" y="320.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">round each other (triple helix)</text>
  <text x="225.0" y="370.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">long, strong, insoluble fibres:</text>
  <text x="225.0" y="390.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">tendons, skin, cartilage</text>
