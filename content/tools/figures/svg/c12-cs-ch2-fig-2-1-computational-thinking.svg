<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" font-family="Times New Roman, Times, serif">
  <rect width="1000" height="510" fill="#ffffff"/>
  <!-- Fig 2.1 (C12-CS, printed p21; page missing from the project scan, read from a second copy): four steps of computational thinking along an arrow. Our own drawing; the pictures are original icons, not the book's. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24346e"/>
    </marker>
  </defs>
  <!-- title bar -->
  <line x1="60" y1="52" x2="940" y2="52" stroke="#1f2f6b" stroke-width="4" stroke-linecap="round"/>
  <rect x="230" y="20" width="540" height="64" rx="6" fill="#24346e" stroke="#16224d" stroke-width="2"/>
  <text x="500" y="63" font-size="32" fill="#ffffff" text-anchor="middle">Computational Thinking in Daily Life</text>

  <!-- step panels -->
  <rect x="40" y="120" width="200" height="200" rx="16" fill="#fdf1e2" stroke="#d9902e" stroke-width="2.5"/>
  <rect x="280" y="120" width="200" height="200" rx="16" fill="#eaf3dc" stroke="#89ad4e" stroke-width="2.5"/>
  <rect x="520" y="120" width="200" height="200" rx="16" fill="#e3eefa" stroke="#5b8fd0" stroke-width="2.5"/>
  <rect x="760" y="120" width="200" height="200" rx="16" fill="#fbe4e2" stroke="#b5332c" stroke-width="2.5"/>

  <!-- 1 Decomposition: one big box broken into four smaller parts -->
  <rect x="62" y="170" width="70" height="70" rx="6" fill="#f5c27a" stroke="#d9902e" stroke-width="2.5"/>
  <text x="97" y="214" font-size="22" fill="#1d2330" text-anchor="middle">Big</text>
  <line x1="138" y1="205" x2="160" y2="205" stroke="#24346e" stroke-width="3" marker-end="url(#head)"/>
  <rect x="166" y="160" width="28" height="28" rx="4" fill="#f5c27a" stroke="#d9902e" stroke-width="2"/>
  <rect x="200" y="160" width="28" height="28" rx="4" fill="#f5c27a" stroke="#d9902e" stroke-width="2"/>
  <rect x="166" y="194" width="28" height="28" rx="4" fill="#f5c27a" stroke="#d9902e" stroke-width="2"/>
  <rect x="200" y="194" width="28" height="28" rx="4" fill="#f5c27a" stroke="#d9902e" stroke-width="2"/>
  <text x="180" y="180" font-size="16" fill="#1d2330" text-anchor="middle">a</text>
  <text x="214" y="180" font-size="16" fill="#1d2330" text-anchor="middle">b</text>
  <text x="180" y="214" font-size="16" fill="#1d2330" text-anchor="middle">c</text>
  <text x="214" y="214" font-size="16" fill="#1d2330" text-anchor="middle">d</text>

  <!-- 2 Pattern Recognition: a repeating row of shapes with the repeat highlighted -->
  <circle cx="310" cy="190" r="14" fill="#5f9b55"/>
  <rect x="332" y="176" width="28" height="28" rx="3" fill="#3b7dd8"/>
  <circle cx="384" cy="190" r="14" fill="#5f9b55"/>
  <rect x="406" y="176" width="28" height="28" rx="3" fill="#3b7dd8"/>
  <circle cx="458" cy="190" r="14" fill="#5f9b55" opacity="0.35"/>
  <text x="458" y="197" font-size="22" fill="#1d2330" text-anchor="middle">?</text>
  <rect x="292" y="166" width="78" height="48" rx="8" fill="none" stroke="#e0703a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="368" y="166" width="78" height="48" rx="8" fill="none" stroke="#e0703a" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- 3 Abstraction: many details filtered down to the important one -->
  <circle cx="560" cy="160" r="8" fill="#9aa4b1"/>
  <rect x="584" y="152" width="16" height="16" fill="#9aa4b1"/>
  <path d="M630 150 L640 168 L620 168 Z" fill="#9aa4b1"/>
  <circle cx="664" cy="160" r="8" fill="#3b7dd8"/>
  <rect x="682" y="152" width="16" height="16" fill="#9aa4b1"/>
  <path d="M560 182 L700 182 L640 230 L640 262 L620 270 L620 230 Z" fill="#cfe0f3" stroke="#5b8fd0" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="630" cy="292" r="12" fill="#3b7dd8"/>

  <!-- 4 Algorithm Design: numbered step list -->
  <rect x="800" y="150" width="120" height="150" rx="8" fill="#ffffff" stroke="#b5332c" stroke-width="2.5"/>
  <text x="815" y="186" font-size="22" fill="#1d2330">1.</text>
  <line x1="842" y1="180" x2="905" y2="180" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <text x="815" y="222" font-size="22" fill="#1d2330">2.</text>
  <line x1="842" y1="216" x2="895" y2="216" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <text x="815" y="258" font-size="22" fill="#1d2330">3.</text>
  <line x1="842" y1="252" x2="905" y2="252" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <path d="M840 284 L852 294 L876 270" fill="none" stroke="#5f9b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow along the bottom -->
  <line x1="40" y1="360" x2="940" y2="360" stroke="#24346e" stroke-width="10" stroke-linecap="round"/>
  <path d="M975 360 L935 338 L935 382 Z" fill="#24346e"/>
  <circle cx="140" cy="360" r="20" fill="#d9902e" stroke="#ffffff" stroke-width="3"/>
  <text x="140" y="368" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="380" cy="360" r="20" fill="#89ad4e" stroke="#ffffff" stroke-width="3"/>
  <text x="380" y="368" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="620" cy="360" r="20" fill="#5b8fd0" stroke="#ffffff" stroke-width="3"/>
  <text x="620" y="368" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="860" cy="360" r="20" fill="#b5332c" stroke="#ffffff" stroke-width="3"/>
  <text x="860" y="368" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>

  <!-- labels as printed -->
  <text x="140" y="420" font-size="24" fill="#1d2330" text-anchor="middle" font-weight="bold">1. Decomposition</text>
  <text x="140" y="452" font-size="22" fill="#1d2330" text-anchor="middle">Break Down the Problem</text>
  <text x="380" y="420" font-size="24" fill="#1d2330" text-anchor="middle" font-weight="bold">2. Pattern Recognition</text>
  <text x="380" y="452" font-size="22" fill="#1d2330" text-anchor="middle">Find Patterns</text>
  <text x="620" y="420" font-size="24" fill="#1d2330" text-anchor="middle" font-weight="bold">3. Abstraction</text>
  <text x="620" y="452" font-size="22" fill="#1d2330" text-anchor="middle">Focus on What's Important</text>
  <text x="860" y="420" font-size="24" fill="#1d2330" text-anchor="middle" font-weight="bold">4. Algorithm Design</text>
  <text x="860" y="452" font-size="22" fill="#1d2330" text-anchor="middle">Create Step-by-Step</text>
  <text x="860" y="480" font-size="22" fill="#1d2330" text-anchor="middle">Solution</text>
</svg>
