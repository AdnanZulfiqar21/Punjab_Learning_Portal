<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Quick Check 28.1(c): chromatogram of hair dyes A, B and C: A gives one low spot, B one high spot, C both. -->
  <rect x="150.0" y="30.0" width="600.0" height="400.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="150.0" y1="430.0" x2="750.0" y2="430.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <rect x="150.0" y="430.0" width="600.0" height="70.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <text x="300.0" y="476.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">A</tspan></text>
  <text x="450.0" y="476.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">B</tspan></text>
  <text x="600.0" y="476.2" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <ellipse cx="300.0" cy="340.0" rx="17.0" ry="15.0" stroke="#14181f" stroke-width="0" fill="#14181f"/>
  <ellipse cx="450.0" cy="110.0" rx="17.0" ry="15.0" stroke="#14181f" stroke-width="0" fill="#14181f"/>
  <ellipse cx="600.0" cy="110.0" rx="17.0" ry="15.0" stroke="#14181f" stroke-width="0" fill="#14181f"/>
  <ellipse cx="600.0" cy="340.0" rx="17.0" ry="15.0" stroke="#14181f" stroke-width="0" fill="#14181f"/>
</svg>
