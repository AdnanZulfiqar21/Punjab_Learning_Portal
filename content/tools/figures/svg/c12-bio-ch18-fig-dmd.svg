<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.19: body outlines shading the muscles affected by Duchenne muscular dystrophy, first hips and legs, then shoulders and arms, then breathing and heart muscle, with the book's age timeline. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Duchenne muscular dystrophy: course of the disease</text>
  <text x="120.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">first</text>
  <circle cx="120.0" cy="122.0" r="20.0" stroke="#57534e" stroke-width="2" fill="#fef3c7"/>
  <path d="M86 152 Q120 140 154 152 L150 240 L150 270 L144 400 L126 400 L120 275 L114 400 L96 400 L90 270 L90 240 Z" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M86 152 L72 250 L82 252 L92 170 M154 152 L168 250 L158 252 L148 170" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M92 240 L148 240 L150 270 L90 270 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M92 270 L117 270 L114 335 L96 335 Z M123 270 L148 270 L144 335 L126 335 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M96 340 L114 340 L112 400 L100 400 Z M126 340 L144 340 L140 400 L128 400 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="120.0" y="425.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">hips, pelvis, thighs, calves</text>
  <text x="320.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">later</text>
  <circle cx="320.0" cy="122.0" r="20.0" stroke="#57534e" stroke-width="2" fill="#fef3c7"/>
  <path d="M286 152 Q320 140 354 152 L350 240 L350 270 L344 400 L326 400 L320 275 L314 400 L296 400 L290 270 L290 240 Z" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M286 152 L272 250 L282 252 L292 170 M354 152 L368 250 L358 252 L348 170" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M292 240 L348 240 L350 270 L290 270 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M292 270 L317 270 L314 335 L296 335 Z M323 270 L348 270 L344 335 L326 335 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M296 340 L314 340 L312 400 L300 400 Z M326 340 L344 340 L340 400 L328 400 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M286 152 Q320 140 354 152 L350 170 L290 170 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M284 156 L272 250 L282 252 L292 170 Z M356 156 L368 250 L358 252 L348 170 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="320.0" y="425.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">spreads to shoulders, neck, arms</text>
  <text x="520.0" y="85.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">late</text>
  <circle cx="520.0" cy="122.0" r="20.0" stroke="#57534e" stroke-width="2" fill="#fef3c7"/>
  <path d="M486 152 Q520 140 554 152 L550 240 L550 270 L544 400 L526 400 L520 275 L514 400 L496 400 L490 270 L490 240 Z" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M486 152 L472 250 L482 252 L492 170 M554 152 L568 250 L558 252 L548 170" stroke="#57534e" stroke-width="2" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M492 240 L548 240 L550 270 L490 270 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M492 270 L517 270 L514 335 L496 335 Z M523 270 L548 270 L544 335 L526 335 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M496 340 L514 340 L512 400 L500 400 Z M526 340 L544 340 L540 400 L528 400 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M486 152 Q520 140 554 152 L550 170 L490 170 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M484 156 L472 250 L482 252 L492 170 Z M556 156 L568 250 L558 252 L548 170 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M492 170 L548 170 L546 210 L494 210 Z" stroke="#7c3aed" stroke-width="1" fill="#7c3aed" fill-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="520.0" y="425.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">breathing and heart muscle</text>
  <rect x="640.0" y="55.0" width="245.0" height="395.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="762.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">timeline (book)</text>
  <circle cx="665.0" cy="115.0" r="8.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <line x1="665.0" y1="123.0" x2="665.0" y2="187.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="682.0" y="120.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">age about 4</text>
  <text x="682.0" y="140.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">weakness shows as</text>
  <text x="682.0" y="156.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">the child walks</text>
  <circle cx="665.0" cy="195.0" r="8.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <line x1="665.0" y1="203.0" x2="665.0" y2="267.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="682.0" y="200.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">age by 10</text>
  <text x="682.0" y="220.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">may need braces</text>
  <text x="682.0" y="236.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <circle cx="665.0" cy="275.0" r="8.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <line x1="665.0" y1="283.0" x2="665.0" y2="347.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="682.0" y="280.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">age by 12</text>
  <text x="682.0" y="300.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">most cannot walk;</text>
  <text x="682.0" y="316.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">wheelchair</text>
  <circle cx="665.0" cy="355.0" r="8.0" stroke="#7c3aed" stroke-width="2" fill="#ede9fe"/>
  <text x="682.0" y="360.0" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">age 15 to 45</text>
  <text x="682.0" y="380.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">typical lifespan</text>
  <text x="682.0" y="396.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700"></text>
  <rect x="40.0" y="465.0" width="820.0" height="72.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="490.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">X-linked recessive: no dystrophin protein, so muscle fibres die; about 2/3 of cases from the mother, 1/3 new mutations</text>
  <text x="450.0" y="514.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">no cure: physiotherapy, corticosteroids (short-term strength), pain relief, surgery for joint contractures</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
