<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.12: DNA to mRNA by transcription and mRNA to protein by translation, with replication of DNA, and a strip showing template triplets TAC, AAA, CCG, ATT read as mRNA codons AUG, UUU, GGC, UAA giving Met, Phe, Gly and stop. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The central dogma and the triplet code</text>
  <rect x="60.0" y="90.0" width="180.0" height="90.0" rx="12" stroke="#1e3a8a" stroke-width="2.5" fill="#dbeafe"/>
  <text x="150.0" y="130.0" font-size="22" fill="#1e3a8a" text-anchor="middle" font-weight="700">DNA</text>
  <text x="150.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">gene</text>
  <rect x="360.0" y="90.0" width="180.0" height="90.0" rx="12" stroke="#dc2626" stroke-width="2.5" fill="#fee2e2"/>
  <text x="450.0" y="130.0" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">mRNA</text>
  <text x="450.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">copy of the gene</text>
  <rect x="660.0" y="90.0" width="180.0" height="90.0" rx="12" stroke="#0f7a62" stroke-width="2.5" fill="#dcfce7"/>
  <text x="750.0" y="130.0" font-size="22" fill="#0f7a62" text-anchor="middle" font-weight="700">protein</text>
  <text x="750.0" y="156.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">chain of amino acids</text>
  <line x1="245.0" y1="135.0" x2="345.4" y2="135.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M355.0 135.0 L344.1 140.1 L344.1 129.9 Z" fill="#14181f"/>
  <text x="300.0" y="122.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">transcription</text>
  <line x1="545.0" y1="135.0" x2="645.4" y2="135.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M655.0 135.0 L644.1 140.1 L644.1 129.9 Z" fill="#14181f"/>
  <text x="600.0" y="122.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">translation</text>
  <path d="M125.6 71.1 A26 26 0 1 0 174.4 71.1" stroke="#1e3a8a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M174.4 71.1 L182.2 78.9 L173.5 82.1 Z" fill="#1e3a8a"/>
  <text x="150.0" y="44.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">replication</text>
  <text x="450.0" y="214.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">information flows one way: once it is in a protein it does not go back</text>
  <rect x="30.0" y="240.0" width="840.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="270.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">reading the code in triplets</text>
  <text x="60.0" y="310.0" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">DNA template 3'</text>
  <text x="60.0" y="380.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">mRNA 5'</text>
  <text x="60.0" y="450.0" font-size="13" fill="#0f7a62" text-anchor="start" font-weight="700">amino acid</text>
  <rect x="230.0" y="285.0" width="130.0" height="40.0" rx="6" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="295.0" y="312.0" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">TAC</text>
  <rect x="230.0" y="355.0" width="130.0" height="40.0" rx="6" stroke="#dc2626" stroke-width="1.5" fill="#fee2e2"/>
  <text x="295.0" y="382.0" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">AUG</text>
  <line x1="295.0" y1="328.0" x2="295.0" y2="346.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M295.0 352.0 L292.0 345.7 L298.0 345.7 Z" fill="#4b5563"/>
  <line x1="295.0" y1="398.0" x2="295.0" y2="422.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M295.0 428.0 L292.0 421.7 L298.0 421.7 Z" fill="#4b5563"/>
  <circle cx="295.0" cy="446.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="295.0" y="451.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Met</text>
  <rect x="380.0" y="285.0" width="130.0" height="40.0" rx="6" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="445.0" y="312.0" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">AAA</text>
  <rect x="380.0" y="355.0" width="130.0" height="40.0" rx="6" stroke="#dc2626" stroke-width="1.5" fill="#fee2e2"/>
  <text x="445.0" y="382.0" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">UUU</text>
  <line x1="445.0" y1="328.0" x2="445.0" y2="346.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M445.0 352.0 L442.0 345.7 L448.0 345.7 Z" fill="#4b5563"/>
  <line x1="445.0" y1="398.0" x2="445.0" y2="422.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M445.0 428.0 L442.0 421.7 L448.0 421.7 Z" fill="#4b5563"/>
  <circle cx="445.0" cy="446.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="445.0" y="451.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Phe</text>
  <rect x="530.0" y="285.0" width="130.0" height="40.0" rx="6" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="595.0" y="312.0" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">CCG</text>
  <rect x="530.0" y="355.0" width="130.0" height="40.0" rx="6" stroke="#dc2626" stroke-width="1.5" fill="#fee2e2"/>
  <text x="595.0" y="382.0" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">GGC</text>
  <line x1="595.0" y1="328.0" x2="595.0" y2="346.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M595.0 352.0 L592.0 345.7 L598.0 345.7 Z" fill="#4b5563"/>
  <line x1="595.0" y1="398.0" x2="595.0" y2="422.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M595.0 428.0 L592.0 421.7 L598.0 421.7 Z" fill="#4b5563"/>
  <circle cx="595.0" cy="446.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#dcfce7"/>
  <text x="595.0" y="451.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Gly</text>
  <rect x="680.0" y="285.0" width="130.0" height="40.0" rx="6" stroke="#1e3a8a" stroke-width="1.5" fill="#dbeafe"/>
  <text x="745.0" y="312.0" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">ATT</text>
  <rect x="680.0" y="355.0" width="130.0" height="40.0" rx="6" stroke="#dc2626" stroke-width="1.5" fill="#fee2e2"/>
  <text x="745.0" y="382.0" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">UAA</text>
  <line x1="745.0" y1="328.0" x2="745.0" y2="346.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M745.0 352.0 L742.0 345.7 L748.0 345.7 Z" fill="#4b5563"/>
  <line x1="745.0" y1="398.0" x2="745.0" y2="422.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M745.0 428.0 L742.0 421.7 L748.0 421.7 Z" fill="#4b5563"/>
  <circle cx="745.0" cy="446.0" r="22.0" stroke="#d7322f" stroke-width="2" fill="#fee2e2"/>
  <text x="745.0" y="451.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">stop</text>
  <text x="450.0" y="498.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">each codon = 3 nucleotides = 1 amino acid; read one after another, no gaps, no overlap</text>
  <text x="450.0" y="520.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">4 x 4 x 4 = 64 codons for 20 amino acids; AUG starts, UAA, UAG and UGA stop</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
