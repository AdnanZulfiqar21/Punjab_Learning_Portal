<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="690" fill="#ffffff"/>
  <!-- Original chart drawn from the text of Topic 10.2 (haemoglobin saturation at three partial pressures of oxygen); the book prints no figure here. -->
  <text x="60" y="70" font-size="27" fill="#1d2430" text-anchor="start" font-weight="700">Arterial blood: PO2 105 mm Hg</text>
  <rect x="60" y="90" width="700" height="60" rx="0" stroke="#9aa4ae" stroke-width="2" fill="#eef0f3"/>
  <rect x="60" y="90" width="679" height="60" rx="0" stroke="#d7322f" stroke-width="2" fill="#d7322f"/>
  <text x="76" y="131" font-size="30" fill="#ffffff" text-anchor="start" font-weight="700">97%</text>
  <text x="60" y="240" font-size="27" fill="#1d2430" text-anchor="start" font-weight="700">Venous blood, rest: PO2 40 mm Hg</text>
  <rect x="60" y="260" width="700" height="60" rx="0" stroke="#9aa4ae" stroke-width="2" fill="#eef0f3"/>
  <rect x="60" y="260" width="525" height="60" rx="0" stroke="#8a1c1c" stroke-width="2" fill="#8a1c1c"/>
  <text x="76" y="301" font-size="30" fill="#ffffff" text-anchor="start" font-weight="700">75%</text>
  <rect x="585" y="260" width="154" height="60" rx="0" stroke="#d7322f" stroke-width="3" fill="none" stroke-dasharray="10 6"/>
  <text x="780" y="301" font-size="27" fill="#1d2430" text-anchor="start" font-weight="400">22% unloaded</text>
  <text x="60" y="410" font-size="27" fill="#1d2430" text-anchor="start" font-weight="700">Venous blood, exercise: PO2 20 mm Hg</text>
  <rect x="60" y="430" width="700" height="60" rx="0" stroke="#9aa4ae" stroke-width="2" fill="#eef0f3"/>
  <rect x="60" y="430" width="245" height="60" rx="0" stroke="#8a1c1c" stroke-width="2" fill="#8a1c1c"/>
  <text x="76" y="471" font-size="30" fill="#ffffff" text-anchor="start" font-weight="700">35%</text>
  <rect x="305" y="430" width="434" height="60" rx="0" stroke="#d7322f" stroke-width="3" fill="none" stroke-dasharray="10 6"/>
  <text x="780" y="471" font-size="27" fill="#1d2430" text-anchor="start" font-weight="400">62% unloaded</text>
  <line x1="60" y1="590" x2="760" y2="590" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="584" x2="60" y2="598" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="628" font-size="24" fill="#1d2430" text-anchor="middle" font-weight="400">0%</text>
  <line x1="235" y1="584" x2="235" y2="598" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <text x="235" y="628" font-size="24" fill="#1d2430" text-anchor="middle" font-weight="400">25%</text>
  <line x1="410" y1="584" x2="410" y2="598" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <text x="410" y="628" font-size="24" fill="#1d2430" text-anchor="middle" font-weight="400">50%</text>
  <line x1="585" y1="584" x2="585" y2="598" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <text x="585" y="628" font-size="24" fill="#1d2430" text-anchor="middle" font-weight="400">75%</text>
  <line x1="760" y1="584" x2="760" y2="598" stroke="#3a3f47" stroke-width="2" stroke-linecap="round"/>
  <text x="760" y="628" font-size="24" fill="#1d2430" text-anchor="middle" font-weight="400">100%</text>
  <text x="410" y="674" font-size="26" fill="#1d2430" text-anchor="middle" font-weight="400">Haemoglobin saturated with oxygen</text>
</svg>
