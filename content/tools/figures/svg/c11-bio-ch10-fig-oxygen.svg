<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original chart for topic 10.2: how much oxygen haemoglobin carries and unloads, from the figures in the text. The textbook has no figure here. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .n{font-size:18px;font-weight:700;fill:#ffffff;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="40">Oxygen carried by haemoglobin</text>
  <text class="s" x="600" y="70">percentage of haemoglobin saturated with oxygen at three places</text>
  <!-- bars -->
  <g>
    <text class="k" x="250" y="130">Arterial blood</text><text class="s" x="250" y="154">leaving the lungs, PO2 about 105 mm Hg</text>
    <rect x="130" y="170" width="240" height="40" fill="#e5e7eb"/><rect x="130" y="170" width="233" height="40" fill="#d7322f"/><text class="n" x="250" y="197">97% oxyhaemoglobin</text>
    <text class="k" x="600" y="130">Venous blood at rest</text><text class="s" x="600" y="154">leaving the tissues, PO2 40 mm Hg</text>
    <rect x="480" y="170" width="240" height="40" fill="#e5e7eb"/><rect x="480" y="170" width="180" height="40" fill="#8a1c1a"/><text class="n" x="570" y="197">75%</text>
    <text class="s" x="600" y="235">22% unloaded; 78% of the</text><text class="s" x="600" y="257">oxyhaemoglobin stays as a reserve</text>
    <text class="k" x="950" y="130">Venous blood in exercise</text><text class="s" x="950" y="154">muscles use more; PO2 20 mm Hg</text>
    <rect x="830" y="170" width="240" height="40" fill="#e5e7eb"/><rect x="830" y="170" width="84" height="40" fill="#8a1c1a"/><text class="n" x="872" y="197">35%</text>
    <text class="s" x="950" y="235">62% unloaded (97 minus 35)</text><text class="s" x="950" y="257">instead of 22% at rest</text>
  </g>
  <!-- solubility -->
  <rect x="130" y="300" width="440" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="350" y="330">Why haemoglobin is needed</text>
  <text class="s" x="350" y="356">plasma dissolves only about 3 mL O2 per litre,</text><text class="s" x="350" y="378">but whole blood carries almost 200 mL per litre:</text><text class="s" x="350" y="400">nearly all of it bound to haemoglobin in the RBCs</text>
  <!-- Bohr -->
  <rect x="630" y="300" width="440" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="850" y="330">Bohr effect</text>
  <text class="s" x="850" y="356">CO2 from the tissues lowers the blood pH; the lower pH</text><text class="s" x="850" y="378">reduces haemoglobin's affinity for O2, so it unloads more.</text><text class="s" x="850" y="400">Higher temperature (working muscle) has the same effect.</text>
  <text class="s" x="600" y="470">Oxyhaemoglobin is bright red; deoxyhaemoglobin is dark red and gives tissues a bluish tinge,</text><text class="s" x="600" y="492">which is why oxygenated vessels are drawn red and oxygen-poor vessels blue.</text>
  <text class="s" x="600" y="540">The reserve keeps enough oxygen in the blood to maintain life for four to five minutes</text><text class="s" x="600" y="562">if breathing is interrupted or the heart stops pumping.</text>
  <text class="s" x="600" y="610">Carbon monoxide binds haemoglobin far more strongly than oxygen and so causes tissue hypoxia (CO poisoning).</text>
</svg>
