<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after topics 9.1 to 9.3: the five design-thinking stages in a cycle with the school-bag example, the seven parts of a business plan, and the five steps of a business pitch. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">From idea to pitch: design thinking, the business plan and the pitch</text>
  <rect x="50" y="55" width="560" height="400" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="330" y="83">Design thinking: five stages (9.1.1)</text>
  <path d="M364 151 L435 202" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M465 255 L428 369" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M341 397 L323 397" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M234 372 L197 258" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M222 205 L292 153" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <rect x="255" y="103" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="330" y="122" style="text-anchor:middle">Empathize</text>
  <text class="r" x="330" y="140" style="text-anchor:middle">talk to students</text>
  <rect x="398" y="207" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="473" y="226" style="text-anchor:middle">Define</text>
  <text class="r" x="473" y="244" style="text-anchor:middle">light, strong bag</text>
  <rect x="343" y="374" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="418" y="393" style="text-anchor:middle">Ideate</text>
  <text class="r" x="418" y="411" style="text-anchor:middle">padding, pockets</text>
  <rect x="167" y="374" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="242" y="393" style="text-anchor:middle">Prototype</text>
  <text class="r" x="242" y="411" style="text-anchor:middle">cardboard model</text>
  <rect x="112" y="207" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="l" x="187" y="226" style="text-anchor:middle">Test</text>
  <text class="r" x="187" y="244" style="text-anchor:middle">students try it</text>
  <text class="l" x="330" y="276" style="fill:#1f6fb5;text-anchor:middle">school bag</text>
  <text class="r" x="330" y="294" style="text-anchor:middle">example</text>
  <text class="r" x="90" y="440" style="fill:#d7322f">Test feedback loops back: improve until the product solves the problem</text>
  <rect x="630" y="55" width="520" height="400" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="890" y="83">Parts of a business plan (9.2.2)</text>
  <rect x="650" y="100" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="711" y="122">Executive summary</text>
  <text class="r" x="905" y="123">the idea, goals, how</text>
  <rect x="650" y="148" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="701" y="170">Business description</text>
  <text class="r" x="905" y="171">products, customers, what is unique</text>
  <rect x="650" y="196" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="718" y="218">Market analysis</text>
  <text class="r" x="905" y="219">customers, needs, competitors</text>
  <rect x="650" y="244" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="677" y="266">Organization and management</text>
  <text class="r" x="905" y="267">team and roles</text>
  <rect x="650" y="292" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="701" y="314">Products or services</text>
  <text class="r" x="905" y="315">features and benefits</text>
  <rect x="650" y="340" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="704" y="362">Marketing and sales</text>
  <text class="r" x="905" y="363">attract and keep customers</text>
  <rect x="650" y="388" width="240" height="36" rx="6" fill="#ffffff" stroke="#0f7a62" stroke-width="1.5"/>
  <text class="l" x="722" y="410">Financial plan</text>
  <text class="r" x="905" y="411">budget, funding, expected revenue</text>
  <rect x="50" y="475" width="1100" height="220" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="503">Steps of a business pitch (9.3.4), e.g. a juice shop</text>
  <rect x="75" y="525" width="190" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="139" y="549">1 Problem</text>
  <text class="r" x="170" y="590" style="text-anchor:middle">few fresh-juice options</text>
  <path d="M267 545 L283 545" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="287" y="525" width="190" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="348" y="549">2 Solution</text>
  <text class="r" x="382" y="590" style="text-anchor:middle">fresh juices from local fruit</text>
  <path d="M479 545 L495 545" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="499" y="525" width="190" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="566" y="549">3 Unique</text>
  <text class="r" x="594" y="590" style="text-anchor:middle">affordable, supports farmers</text>
  <path d="M691 545 L707 545" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="711" y="525" width="190" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="772" y="549">4 Audience</text>
  <text class="r" x="806" y="590" style="text-anchor:middle">customers or investors</text>
  <path d="M903 545 L919 545" stroke="#4b5563" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="923" y="525" width="190" height="40" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="l" x="980" y="549">5 Questions</text>
  <text class="r" x="1018" y="590" style="text-anchor:middle">price, location, details</text>
  <g class="r">
    <text x="75" y="640">a good pitch is short, clear and persuasive: what the idea is, who the customers are and why it will work</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
