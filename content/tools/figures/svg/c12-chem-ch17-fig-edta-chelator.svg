<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 860" font-family="Arial, Helvetica, sans-serif">
  <!-- Vis17-4 (C12-CHEM, PDF p12): photograph of an EDTA chelator product, printed note "Ca-EDTA complex is used in medicines to remove metal ions from the body"; flat drawing after the printed photograph: a white plastic supplement bottle with a white ribbed screw cap and a dark navy-blue wrap-around label reading "EDTA Chelator Complex", standing on a plain light background. No photograph or brand name is reproduced. -->
  <rect width="700" height="860" fill="#ffffff"/>
  <ellipse cx="350" cy="812" rx="250" ry="22" fill="#e6e9ee"/>
  <!-- cap -->
  <rect x="200" y="40" width="300" height="130" rx="20" fill="#f7f8fa" stroke="#c9ced6" stroke-width="3"/>
  <g stroke="#dde1e7" stroke-width="4">
    <line x1="225" y1="52" x2="225" y2="160"/><line x1="255" y1="52" x2="255" y2="160"/><line x1="285" y1="52" x2="285" y2="160"/><line x1="315" y1="52" x2="315" y2="160"/><line x1="345" y1="52" x2="345" y2="160"/><line x1="375" y1="52" x2="375" y2="160"/><line x1="405" y1="52" x2="405" y2="160"/><line x1="435" y1="52" x2="435" y2="160"/><line x1="465" y1="52" x2="465" y2="160"/>
  </g>
  <!-- neck and shoulder -->
  <path d="M215 170 L485 170 L485 190 Q585 205 590 270 L590 770 Q590 805 555 805 L145 805 Q110 805 110 770 L110 270 Q115 205 215 190 Z" fill="#fbfcfd" stroke="#c9ced6" stroke-width="3"/>
  <path d="M140 280 L140 760" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- label -->
  <rect x="110" y="300" width="480" height="440" fill="#123a68"/>
  <rect x="110" y="300" width="110" height="440" fill="#e9eef4"/>
  <g fill="#9fb1c6"><rect x="128" y="330" width="70" height="6"/><rect x="128" y="350" width="60" height="6"/><rect x="128" y="370" width="74" height="6"/><rect x="128" y="390" width="56" height="6"/><rect x="128" y="410" width="68" height="6"/><rect x="128" y="430" width="62" height="6"/><rect x="128" y="450" width="70" height="6"/></g>
  <rect x="220" y="300" width="370" height="440" fill="#1d4a7e"/>
  <rect x="220" y="680" width="370" height="60" fill="#ffffff"/>
  <rect x="250" y="345" width="160" height="10" fill="#cfe0f2"/>
  <text x="245" y="450" font-size="42" font-weight="bold" fill="#ffffff">EDTA Chelator</text>
  <text x="245" y="505" font-size="42" font-weight="bold" fill="#ffffff">Complex</text>
  <rect x="250" y="560" width="200" height="6" fill="#7fa6cf"/>
  <rect x="250" y="580" width="150" height="6" fill="#7fa6cf"/>
  <circle cx="250" cy="710" r="12" fill="none" stroke="#1d4a7e" stroke-width="3"/>
  <rect x="280" y="702" width="90" height="6" fill="#1d4a7e"/>
  <rect x="430" y="702" width="110" height="6" fill="#1d4a7e"/>
</svg>
