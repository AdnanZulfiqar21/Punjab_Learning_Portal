<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figs 15.8 to 15.10: slits S1 and S2 a distance d apart, a screen a distance L away and a point P at height y and angle theta; the extra path from S2 is d sin(theta); bright fringes where d sin(theta) = m lambda, dark where it is (m + 1/2) lambda, and fringe spacing L lambda / d. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Young's double-slit experiment (after Figs 15.8 to 15.10)</text>
  <rect x="15.0" y="55.0" width="870.0" height="300.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">geometry</text>
  <line x1="140.0" y1="70.0" x2="140.0" y2="152.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="140.0" y1="168.0" x2="140.0" y2="242.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="140.0" y1="258.0" x2="140.0" y2="340.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <text x="128.0" y="165.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">S1</text>
  <text x="128.0" y="255.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">S2</text>
  <line x1="90.0" y1="165.6" x2="90.0" y2="244.4" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M90.0 250.0 L87.0 243.7 L93.0 243.7 Z" fill="#4b5563"/>
  <path d="M90.0 160.0 L93.0 166.3 L87.0 166.3 Z" fill="#4b5563"/>
  <text x="82.0" y="210.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">d</text>
  <line x1="800.0" y1="70.0" x2="800.0" y2="340.0" stroke="#14181f" stroke-width="4" stroke-linecap="round"/>
  <line x1="140.0" y1="205.0" x2="800.0" y2="205.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <circle cx="800.0" cy="105.0" r="6.0" stroke="#d7322f" stroke-width="1" fill="#d7322f"/>
  <text x="812.0" y="110.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">P</text>
  <line x1="140.0" y1="160.0" x2="800.0" y2="105.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="140.0" y1="250.0" x2="800.0" y2="105.0" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="140.0" y1="205.0" x2="800.0" y2="105.0" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="140.0" y1="160.0" x2="153.3" y2="248.0" stroke="#d98b2b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="140.0" y1="250.0" x2="153.3" y2="248.0" stroke="#d7322f" stroke-width="4" stroke-linecap="round"/>
  <text x="167.3" y="266.0" font-size="13" fill="#d7322f" text-anchor="start" font-weight="700">path difference d sin(theta)</text>
  <path d="M260 205.0 A120 120 0 0 0 258.6 187.0" stroke="#14181f" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="268.0" y="193.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">theta</text>
  <line x1="830.0" y1="199.4" x2="830.0" y2="110.6" stroke="#0f7a62" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M830.0 105.0 L833.0 111.3 L827.0 111.3 Z" fill="#0f7a62"/>
  <path d="M830.0 205.0 L827.0 198.7 L833.0 198.7 Z" fill="#0f7a62"/>
  <text x="838.0" y="160.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">y</text>
  <line x1="145.6" y1="330.0" x2="794.4" y2="330.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M800.0 330.0 L793.7 333.0 L793.7 327.0 Z" fill="#4b5563"/>
  <path d="M140.0 330.0 L146.3 327.0 L146.3 333.0 Z" fill="#4b5563"/>
  <text x="470.0" y="324.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">L (much larger than d)</text>
  <rect x="15.0" y="370.0" width="870.0" height="165.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="400.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">results</text>
  <text x="40.0" y="436.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">path difference = d sin(theta)</tspan></text>
  <text x="40.0" y="470.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">bright: d sin(theta) = m x lambda;  dark: d sin(theta) = (m + 1/2) lambda</tspan></text>
  <text x="40.0" y="504.0" font-size="16" fill="#d7322f" text-anchor="start" font-weight="700"><tspan dy="0.0">small angles: y</tspan><tspan dy="5.1" font-size="11.2">m</tspan><tspan dy="-5.1"> = m L lambda / d;  fringe spacing  dy = L lambda / d</tspan></text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
