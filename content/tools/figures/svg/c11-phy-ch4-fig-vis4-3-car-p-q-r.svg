<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Arial, Helvetica, sans-serif">
  <!-- Class XI Physics Example 4.5 (PDF page 88), original drawing after the printed sketch: the road rises 1.5 m over 24 m from P to Q and then runs level to R. -->
  <rect width="1000" height="440" fill="#ffffff"/>
  <line x1="120.0" y1="350.0" x2="720.0" y2="110.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="720.0" y1="110.0" x2="940.0" y2="110.0" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="120.0" y1="350.0" x2="720.0" y2="350.0" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 7"/>
  <line x1="720.0" y1="128.4" x2="720.0" y2="333.6" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="butt"/>
  <path d="M720.0 114.0 L727.6 132.0 L712.4 132.0 Z" fill="#1a1a1a"/>
  <path d="M720.0 348.0 L712.4 330.0 L727.6 330.0 Z" fill="#1a1a1a"/>
  <text x="738.0" y="240.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="400">1.5 m</text>
  <text x="420.0" y="205.0" font-size="32" fill="#1a1a1a" text-anchor="middle" font-weight="400" transform="rotate(-21.80140948635181 420.0 205.0)">24 m</text>
  <text x="106.0" y="360.0" font-size="34" fill="#1a1a1a" text-anchor="end" font-weight="400">P</text>
  <text x="720.0" y="88.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">Q</text>
  <text x="940.0" y="88.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="400">R</text>
</svg>
