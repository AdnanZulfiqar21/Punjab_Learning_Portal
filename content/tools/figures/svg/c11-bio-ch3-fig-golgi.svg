<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.21: the Golgi apparatus and the path of a secretion. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f}
      .s{font-size:19px;fill:#4b5563}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- RER at the top -->
  <path d="M250 110 h380 q16 0 16 16 v10 q0 16 -16 16 h-380 z" fill="#e1f3ec" stroke="#0f7a62" stroke-width="5"/>
  <g fill="#d98b2b"><circle cx="290" cy="106" r="5"/><circle cx="350" cy="106" r="5"/><circle cx="410" cy="106" r="5"/><circle cx="470" cy="106" r="5"/><circle cx="530" cy="106" r="5"/><circle cx="590" cy="106" r="5"/></g>
  <text class="t" x="680" y="135">Rough ER</text>
  <!-- vesicles from ER to cis face -->
  <g fill="#e1f3ec" stroke="#0f7a62" stroke-width="4"><circle cx="330" cy="190" r="16"/><circle cx="440" cy="205" r="16"/></g>
  <path d="M350 200 L420 250" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M450 222 L450 250" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <!-- Golgi stack: cup-shaped cisternae, cis at top, trans at bottom -->
  <g fill="#fff4e2" stroke="#8a4b00" stroke-width="6">
    <path d="M300 280 q140 -30 280 0 q0 22 -10 24 q-130 -26 -260 0 q-10 -2 -10 -24 z"/>
    <path d="M290 330 q150 -34 300 0 q0 22 -10 24 q-140 -30 -280 0 q-10 -2 -10 -24 z"/>
    <path d="M280 380 q160 -38 320 0 q0 22 -10 24 q-150 -34 -300 0 q-10 -2 -10 -24 z"/>
    <path d="M270 430 q170 -42 340 0 q0 22 -10 24 q-160 -38 -320 0 q-10 -2 -10 -24 z"/>
    <path d="M260 480 q180 -46 360 0 q0 22 -10 24 q-170 -42 -340 0 q-10 -2 -10 -24 z"/>
  </g>
  <!-- secretory vesicles leaving the trans face -->
  <g fill="#fff4e2" stroke="#8a4b00" stroke-width="4"><circle cx="330" cy="560" r="18"/><circle cx="440" cy="580" r="18"/><circle cx="560" cy="560" r="18"/></g>
  <path d="M440 600 L440 660" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M575 575 L700 650" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <!-- plasma membrane at the bottom with exocytosis -->
  <rect x="150" y="690" width="800" height="18" fill="#1f6fb5"/>
  <path d="M420 690 q20 -40 40 0" fill="#fff4e2" stroke="#8a4b00" stroke-width="4"/>
  <text class="s" x="470" y="740">secretion released outside (exocytosis)</text>
  <!-- lysosome from the Golgi -->
  <circle cx="720" cy="680" r="22" fill="#f2b134" stroke="#8a4b00" stroke-width="4"/>
  <text class="s" x="755" y="686">lysosome</text>
  <!-- labels -->
  <path class="lead" d="M300 290 L240 245"/><text class="t" x="40" y="205">cis face</text><text class="s" x="40" y="230">receives vesicles from the ER</text>
  <path class="lead" d="M260 492 L160 540"/><text class="t" x="30" y="570">trans face</text><text class="s" x="30" y="595">near the plasma membrane; ships products</text>
  <path class="lead" d="M600 400 L760 400"/><text class="t" x="770" y="395">Cisternae</text><text class="s" x="770" y="420">five to eight cup-shaped sacs</text>
  <path class="lead" d="M380 185 L300 150"/><text class="s" x="60" y="150">transport vesicles</text>
  <path class="lead" d="M575 560 L760 500"/><text class="s" x="765" y="505">secretory vesicles</text>
  <text class="s" x="30" y="780">Proteins and lipids from the ER are modified here into glycoproteins and glycolipids, then sorted and shipped.</text>
</svg>
