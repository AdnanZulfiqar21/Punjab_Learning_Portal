<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="515" fill="#ffffff"/>
  <!-- Original diagram after the book: ammonia and bromoethane give ethanamine, which reacts again to give N-ethylethanamine, then N,N-diethylethanamine and finally tetraethylammonium bromide with excess bromoethane. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ammonia and bromoethane: a series of amines</text>
  <rect x="20.0" y="69.0" width="210.0" height="52.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="125.0" y="101.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">NH</tspan><tspan dy="5.1" font-size="11.2">3</tspan></text>
  <text x="240.0" y="91.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">ammonia</text>
  <text x="240.0" y="109.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700"></text>
  <line x1="125.0" y1="121.0" x2="219.3" y2="146.9" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M227.0 149.0 L217.1 150.7 L219.4 142.5 Z" fill="#4b5563"/>
  <text x="155.0" y="147.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">+ C</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">H</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">Br</tspan></text>
  <rect x="132.0" y="149.0" width="210.0" height="52.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="237.0" y="181.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">NH</tspan><tspan dy="5.1" font-size="11.2">2</tspan></text>
  <text x="352.0" y="171.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">ethanamine</text>
  <text x="352.0" y="189.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">primary amine</text>
  <line x1="237.0" y1="201.0" x2="331.3" y2="226.9" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M339.0 229.0 L329.1 230.7 L331.4 222.5 Z" fill="#4b5563"/>
  <text x="267.0" y="227.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">+ C</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">H</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">Br</tspan></text>
  <rect x="244.0" y="229.0" width="210.0" height="52.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="349.0" y="261.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">NH</tspan></text>
  <text x="464.0" y="251.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">N-ethylethanamine</text>
  <text x="464.0" y="269.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">secondary amine</text>
  <line x1="349.0" y1="281.0" x2="443.3" y2="306.9" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M451.0 309.0 L441.1 310.7 L443.4 302.5 Z" fill="#4b5563"/>
  <text x="379.0" y="307.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">+ C</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">H</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">Br</tspan></text>
  <rect x="356.0" y="309.0" width="210.0" height="52.0" rx="10" stroke="#1f6fb5" stroke-width="2" fill="#eff6ff"/>
  <text x="461.0" y="341.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">N</tspan></text>
  <text x="576.0" y="331.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">N,N-diethylethanamine</text>
  <text x="576.0" y="349.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">tertiary amine</text>
  <line x1="461.0" y1="361.0" x2="555.3" y2="386.9" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M563.0 389.0 L553.1 390.7 L555.4 382.5 Z" fill="#4b5563"/>
  <text x="491.0" y="387.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">+ C</tspan><tspan dy="3.8" font-size="8.4">2</tspan><tspan dy="-3.8">H</tspan><tspan dy="3.8" font-size="8.4">5</tspan><tspan dy="-3.8">Br</tspan></text>
  <rect x="468.0" y="389.0" width="210.0" height="52.0" rx="10" stroke="#7c3aed" stroke-width="2" fill="#f3e8ff"/>
  <text x="573.0" y="421.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">)</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">N</tspan><tspan dy="-6.7" font-size="11.2">+</tspan><tspan dy="6.7"> Br</tspan><tspan dy="-6.7" font-size="11.2">-</tspan></text>
  <text x="688.0" y="411.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">tetraethylammonium bromide</text>
  <text x="688.0" y="429.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">quaternary salt</text>
  <text x="450.0" y="478.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">each step also gives HBr; the amine formed is itself a nucleophile, so the amounts must be controlled</text>
  <text x="450.0" y="506" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
