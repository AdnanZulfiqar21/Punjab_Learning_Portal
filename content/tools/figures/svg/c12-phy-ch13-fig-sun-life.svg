  <line x1="517.1" y1="240.0" x2="517.1" y2="247.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="517.1" y="264.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">8</text>
  <line x1="574.3" y1="240.0" x2="574.3" y2="247.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
