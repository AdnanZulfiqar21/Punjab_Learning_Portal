  <line x1="345.7" y1="240.0" x2="345.7" y2="247.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="345.7" y="264.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">5</text>
