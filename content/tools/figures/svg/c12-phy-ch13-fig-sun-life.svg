<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- Original timeline after the book's figure: the Sun on the main sequence from birth to about 9 billion years (now about 4.6 billion), then a red giant near 10 billion years, a planetary nebula and finally a white dwarf. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Life cycle of the Sun (after the book's timeline)</text>
  <line x1="60.0" y1="240.0" x2="860.0" y2="240.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <line x1="60.0" y1="240.0" x2="60.0" y2="247.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60.0" y="264.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">birth</text>
  <line x1="117.1" y1="240.0" x2="117.1" y2="247.0" stroke="#14181f" stroke-width="1.5" stroke-linecap="round"/>
