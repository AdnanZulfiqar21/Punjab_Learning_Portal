  <circle cx="517.1" cy="170.0" r="17.2" stroke="#d98b2b" stroke-width="1.5" fill="#fde047"/>
  <circle cx="574.3" cy="170.0" r="18.1" stroke="#d98b2b" stroke-width="1.5" fill="#fde047"/>
  <circle cx="631.4" cy="160.0" r="38.0" stroke="#d7322f" stroke-width="2" fill="#fdba74"/>
  <text x="631.4" y="104.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">red giant</text>
  <circle cx="688.6" cy="170.0" r="16.0" stroke="#7c3aed" stroke-width="1.5" fill="#efe7fd" stroke-dasharray="3 3"/>
  <text x="690.6" y="132.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">planetary nebula</text>
  <circle cx="745.7" cy="170.0" r="5.0" stroke="#4b5563" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="802.9" cy="170.0" r="5.0" stroke="#4b5563" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="860.0" cy="170.0" r="5.0" stroke="#4b5563" stroke-width="1.5" fill="#e5e7eb"/>
  <text x="802.9" y="200.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">white dwarf</text>
  <line x1="322.9" y1="95.0" x2="322.9" y2="143.6" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M322.9 150.0 L319.5 142.7 L326.2 142.7 Z" fill="#1f6fb5"/>
  <text x="322.9" y="86.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">now (about 4.6)</text>
  <text x="460.0" y="135.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">gradual warming (main sequence)</text>
  <text x="450.0" y="321" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
