<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.14: chromatin condensing into a chromosome. -->
  <defs>
    <style>
      .t{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- 1: DNA double helix -->
  <g transform="translate(150,330)">
    <path d="M-60 -120 q40 60 0 120 q-40 60 0 120 M60 -120 q-40 60 0 120 q40 60 0 120" stroke="#5b3fb5" stroke-width="6" fill="none"/>
    <path d="M-40 -90 h80 M-20 -60 h40 M-20 60 h40 M-40 90 h80 M-10 0 h20" stroke="#8f78d9" stroke-width="4"/>
  </g>
  <text class="t" x="150" y="520">DNA double helix</text><text class="s" x="150" y="548">2 nm wide</text>
  <path d="M250 330 L320 330" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- 2: nucleosomes, beads on a string -->
  <g>
    <path d="M340 330 q60 -80 120 0 t120 0 t120 0" stroke="#5b3fb5" stroke-width="5" fill="none"/>
    <g fill="#d98b2b" stroke="#8a4b00" stroke-width="3"><circle cx="400" cy="300" r="26"/><circle cx="520" cy="360" r="26"/><circle cx="640" cy="300" r="26"/></g>
    <g fill="none" stroke="#5b3fb5" stroke-width="4"><circle cx="400" cy="300" r="32"/><circle cx="520" cy="360" r="32"/><circle cx="640" cy="300" r="32"/></g>
  </g>
  <text class="t" x="520" y="520">Nucleosomes</text><text class="s" x="520" y="548">DNA wound round a group of histones</text>
  <path d="M700 330 L770 330" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- 3: coiled fibre -->
  <path d="M790 240 q30 -30 40 0 t40 0 t40 0 t40 0 M790 300 q30 -30 40 0 t40 0 t40 0 t40 0 M790 360 q30 -30 40 0 t40 0 t40 0 t40 0 M790 420 q30 -30 40 0 t40 0 t40 0 t40 0" stroke="#5b3fb5" stroke-width="8" fill="none"/>
  <text class="t" x="870" y="520">Chromatin fibre</text><text class="s" x="870" y="548">dispersed in interphase</text>
  <path d="M960 330 L1010 330" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- 4: chromosome with two chromatids and centromere -->
  <g fill="#5b3fb5">
    <path d="M1045 190 q-25 0 -25 25 v70 q0 15 12 20 q-12 5 -12 20 v100 q0 25 25 25 q25 0 25 -25 v-100 q0 -15 -12 -20 q12 -5 12 -20 v-70 q0 -25 -25 -25 z"/>
    <path d="M1105 190 q-25 0 -25 25 v70 q0 15 12 20 q-12 5 -12 20 v100 q0 25 25 25 q25 0 25 -25 v-100 q0 -15 -12 -20 q12 -5 12 -20 v-70 q0 -25 -25 -25 z"/>
  </g>
  <circle cx="1075" cy="305" r="14" fill="#d98b2b" stroke="#8a4b00" stroke-width="3"/>
  <text class="t" x="1075" y="520">Chromosome</text><text class="s" x="1075" y="548">two chromatids joined</text><text class="s" x="1075" y="572">at the centromere</text>
  <text class="s" x="600" y="640">Chromatin is dispersed when the cell is working; it condenses into chromosomes when the cell divides.</text>
  <text class="s" x="600" y="668">Euchromatin is active (transcribed); heterochromatin is inactive.</text>
</svg>
