<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 29.6.2: the fragments of hexane (C6H14+ 86, C5H11+ 71, C4H9+ 57, C3H7+ 43, C2H5+ 29, CH3+ 15), and the mass spectrum of bromomethane with CH3+ at 15 and CH3(79Br)+ and CH3(81Br)+ at 94 and 96. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Fragmentation in the mass spectrometer</text>
  <rect x="15.0" y="55.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">hexane, C6H14 (M = 86): breaking C-C bonds gives the fragments</text>
  <text x="90.0" y="130.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">6</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">14</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="90.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">86</text>
  <text x="230.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">11</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="230.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">71</text>
  <text x="370.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">9</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="370.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">57</text>
  <text x="510.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">7</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="510.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">43</text>
  <text x="650.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="4.8" font-size="10.5">2</tspan><tspan dy="-4.8">H</tspan><tspan dy="4.8" font-size="10.5">5</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="650.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">29</text>
  <text x="790.0" y="150.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="4.8" font-size="10.5">3</tspan><tspan dy="-11.1" font-size="10.5">+</tspan></text>
  <text x="790.0" y="185.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">15</text>
  <text x="90.0" y="205.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">molecular ion</text>
  <text x="450.0" y="245.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">each fragment differs by CH2 (14): peaks at 86, 71, 57, 43, 29 and 15</text>
  <rect x="15.0" y="280.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="310.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">CH3Br (Quick Check 29.3): peaks at 15, 94 and 96, heights as drawn in the book</text>
  <line x1="60.0" y1="455.0" x2="60.0" y2="331.4" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M60.0 325.0 L63.4 332.3 L56.6 332.3 Z" fill="#14181f"/>
  <line x1="60.0" y1="455.0" x2="858.6" y2="455.0" stroke="#14181f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M865.0 455.0 L857.7 458.4 L857.7 451.6 Z" fill="#14181f"/>
  <text x="860.0" y="483.0" font-size="11" fill="#4b5563" text-anchor="end" font-weight="700">m/e</text>
  <line x1="92.5" y1="455.0" x2="92.5" y2="350.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="92.5" y="471.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">15</text>
  <text x="92.5" y="340.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">CH3+</text>
  <line x1="606.0" y1="455.0" x2="606.0" y2="370.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="598.0" y="471.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">94</text>
  <text x="576.0" y="360.0" font-size="12" fill="#1f6fb5" text-anchor="end" font-weight="700">CH3(79Br)+</text>
  <line x1="619.0" y1="455.0" x2="619.0" y2="370.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="627.0" y="471.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">96</text>
  <text x="649.0" y="360.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">CH3(81Br)+</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
