<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original SN2 mechanism after the book: OH- attacks the delta+ carbon of bromomethane from the side opposite Br; in the transition state HO...C...Br both bonds are partial; methanol and Br- form. Rate = k[halogenoalkane][nucleophile]. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">SN2: one step, attack from the back</text>
  <text x="60.0" y="197.0" font-size="20" fill="#1f6fb5" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO</tspan><tspan dy="-8.4" font-size="14.0">-</tspan></text>
  <circle cx="62.0" cy="172.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <circle cx="70.0" cy="172.0" r="2.0" stroke="#14181f" stroke-width="1" fill="#14181f"/>
  <text x="200.0" y="197.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="200.0" y1="179.0" x2="200.0" y2="151.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="200.0" y="134.2" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="205.7" y1="199.4" x2="218.3" y2="220.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="230.0" y="244.1" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="194.3" y1="199.4" x2="181.7" y2="220.6" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="170.0" y="244.1" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="211.0" y1="190.0" x2="259.0" y2="190.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="288.0" y="197.0" font-size="20" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <text x="218.0" y="176.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">&#948;+</text>
  <text x="300.0" y="172.0" font-size="13" fill="#d7322f" text-anchor="middle" font-weight="700">&#948;-</text>
  <path d="M80.0 174.0 Q130.0 142.0 184.0 182.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M184.0 182.0 L174.2 180.0 L179.2 173.2 Z" fill="#d7322f"/>
  <path d="M236.0 194.0 Q254.0 214.0 276.0 202.0" stroke="#d7322f" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M276.0 202.0 L270.1 210.1 L266.0 202.6 Z" fill="#d7322f"/>
  <text x="200.0" y="300.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">bromomethane</text>
  <line x1="320.0" y1="190.0" x2="351.2" y2="190.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M360.0 190.0 L350.0 194.6 L350.0 185.4 Z" fill="#14181f"/>
  <path d="M383.0 110.0 L375.0 110.0 L375.0 280.0 L383.0 280.0" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="410.0" y="196.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">HO</tspan></text>
  <line x1="430.0" y1="190.0" x2="470.0" y2="190.0" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="485.0" y="196.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan></text>
  <line x1="485.0" y1="180.0" x2="485.0" y2="154.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="485.0" y="137.4" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="490.9" y1="198.1" x2="505.1" y2="217.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="517.5" y="239.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="479.1" y1="198.1" x2="464.9" y2="217.9" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <text x="452.5" y="239.9" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan dy="0.0">H</tspan></text>
  <line x1="500.0" y1="190.0" x2="540.0" y2="190.0" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="558.0" y="196.3" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">Br</tspan></text>
  <path d="M582.0 110.0 L590.0 110.0 L590.0 280.0 L582.0 280.0" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="598.0" y="122.0" font-size="20" fill="#14181f" text-anchor="start" font-weight="700">-</text>
  <text x="485.0" y="300.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">transition state</text>
  <line x1="620.0" y1="190.0" x2="651.2" y2="190.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M660.0 190.0 L650.0 194.6 L650.0 185.4 Z" fill="#14181f"/>
  <text x="760.0" y="196.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">OH + Br</tspan><tspan dy="-8.0" font-size="13.3">-</tspan></text>
  <text x="760.0" y="300.0" font-size="13" fill="#1f6fb5" text-anchor="middle" font-weight="700">methanol</text>
  <rect x="15.0" y="340.0" width="870.0" height="100.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="372.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">rate = k [halogenoalkane] [nucleophile]: second order, bimolecular</text>
  <text x="450.0" y="400.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">bond making and bond breaking happen together; usual for primary halogenoalkanes (little crowding)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
