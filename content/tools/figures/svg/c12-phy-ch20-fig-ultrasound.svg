<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <!-- Original diagram after Fig 20.2: a transducer probe with gel on the skin sends ultrasound pulses into the body; echoes return from each tissue boundary; a trace of echo strength against time shows the pulse and echoes A and B, and the depth of each boundary is d = vt/2. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Ultrasound imaging by echoes (after Fig 20.2)</text>
  <rect x="15.0" y="55.0" width="470.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="35.0" y="90.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">pulses and echoes</text>
  <rect x="220.0" y="80.0" width="50.0" height="70.0" rx="8" stroke="#4b5563" stroke-width="2" fill="#e5e7eb"/>
  <text x="290.0" y="105.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">transducer</text>
  <text x="290.0" y="121.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">probe</text>
  <rect x="205.0" y="150.0" width="80.0" height="10.0" rx="2" stroke="#0e9aa7" stroke-width="1" fill="#99f6e4"/>
  <text x="300.0" y="160.0" font-size="11" fill="#0e9aa7" text-anchor="start" font-weight="700">gel</text>
  <rect x="40.0" y="160.0" width="430.0" height="30.0" rx="0" stroke="#d98b2b" stroke-width="1.5" fill="#fde68a"/>
  <text x="50.0" y="180.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">skin and fat</text>
  <rect x="40.0" y="190.0" width="430.0" height="120.0" rx="0" stroke="#d7322f" stroke-width="1.5" fill="#fecaca"/>
  <text x="50.0" y="210.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">soft tissue</text>
  <ellipse cx="245.0" cy="360.0" rx="120.0" ry="50.0" stroke="#7c3aed" stroke-width="2" fill="#e9d5ff"/>
  <text x="380.0" y="365.0" font-size="12" fill="#14181f" text-anchor="start" font-weight="700">organ</text>
  <line x1="235.0" y1="165.0" x2="235.0" y2="181.4" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M235.0 187.0 L232.0 180.7 L238.0 180.7 Z" fill="#1f6fb5"/>
  <line x1="235.0" y1="235.0" x2="235.0" y2="251.4" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M235.0 257.0 L232.0 250.7 L238.0 250.7 Z" fill="#1f6fb5"/>
  <line x1="235.0" y1="290.0" x2="235.0" y2="306.4" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M235.0 312.0 L232.0 305.7 L238.0 305.7 Z" fill="#1f6fb5"/>
  <line x1="258.0" y1="190.0" x2="258.0" y2="167.6" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <path d="M258.0 162.0 L261.0 168.3 L255.0 168.3 Z" fill="#0f7a62"/>
  <text x="266.0" y="184.0" font-size="11" fill="#0f7a62" text-anchor="start" font-weight="700">echo A</text>
  <line x1="258.0" y1="310.0" x2="258.0" y2="167.6" stroke="#0f7a62" stroke-width="2" stroke-linecap="round"/>
  <path d="M258.0 162.0 L261.0 168.3 L255.0 168.3 Z" fill="#0f7a62"/>
  <text x="266.0" y="304.0" font-size="11" fill="#0f7a62" text-anchor="start" font-weight="700">echo B</text>
  <text x="250.0" y="440.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">echoes come back from each boundary where the</text>
  <text x="250.0" y="456.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">acoustic impedance changes</text>
  <rect x="495.0" y="55.0" width="390.0" height="420.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="690.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">echo time gives depth</text>
  <line x1="520.0" y1="300.0" x2="863.6" y2="300.0" stroke="#14181f" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M870.0 300.0 L862.7 303.4 L862.7 296.6 Z" fill="#14181f"/>
  <text x="866.0" y="318.0" font-size="12" fill="#14181f" text-anchor="end" font-weight="700">time</text>
  <line x1="540.0" y1="300.0" x2="540.0" y2="150.0" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <text x="540.0" y="142.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">pulse sent</text>
  <line x1="640.0" y1="300.0" x2="640.0" y2="210.0" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <text x="640.0" y="202.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <line x1="780.0" y1="300.0" x2="780.0" y2="240.0" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <text x="780.0" y="232.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <line x1="545.6" y1="330.0" x2="774.4" y2="330.0" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M780.0 330.0 L773.7 333.0 L773.7 327.0 Z" fill="#4b5563"/>
  <path d="M540.0 330.0 L546.3 327.0 L546.3 333.0 Z" fill="#4b5563"/>
  <text x="660.0" y="350.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">delay t</text>
  <text x="690.0" y="395.0" font-size="17" fill="#d7322f" text-anchor="middle" font-weight="700"><tspan dy="0.0">depth d = v t / 2</tspan></text>
  <text x="690.0" y="425.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">(the pulse goes there and back; v is about 1540 m/s</text>
  <text x="690.0" y="440.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">in soft tissue; frequencies 1 to 15 MHz)</text>
  <text x="450.0" y="491" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
