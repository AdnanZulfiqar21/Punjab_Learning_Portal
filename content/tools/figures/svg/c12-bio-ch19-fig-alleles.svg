<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original diagram after Figure 19.5: a pair of homologous chromosomes, one from each parent, with alleles A and a, b and B, and D and D at matching loci. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Alleles sit at the same locus on homologous chromosomes</text>
  <rect x="308.0" y="90.0" width="44.0" height="320.0" rx="22" stroke="#2563eb" stroke-width="2.5" fill="#bfdbfe"/>
  <ellipse cx="330.0" cy="200.0" rx="26.0" ry="8.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <rect x="308.0" y="127.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="330.0" y="146.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">A</text>
  <rect x="308.0" y="257.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="330.0" y="276.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">b</text>
  <rect x="308.0" y="337.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="330.0" y="356.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">D</text>
  <rect x="448.0" y="90.0" width="44.0" height="320.0" rx="22" stroke="#dc2626" stroke-width="2.5" fill="#fecaca"/>
  <ellipse cx="470.0" cy="200.0" rx="26.0" ry="8.0" stroke="#a16207" stroke-width="1.5" fill="#fde68a"/>
  <rect x="448.0" y="127.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="470.0" y="146.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">a</text>
  <rect x="448.0" y="257.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="470.0" y="276.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <rect x="448.0" y="337.0" width="44.0" height="26.0" rx="0" stroke="#14181f" stroke-width="1.2" fill="#fde68a"/>
  <text x="470.0" y="356.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">D</text>
  <text x="330.0" y="440.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">from one parent</text>
  <text x="470.0" y="440.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">from the other parent</text>
  <text x="520.0" y="145.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">locus of one gene: alleles A and a</text>
  <line x1="516.0" y1="140.0" x2="492.0" y2="140.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="492.0" cy="140.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="520.0" y="275.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">another locus: b and B</text>
  <line x1="516.0" y1="270.0" x2="492.0" y2="270.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="492.0" cy="270.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="520.0" y="355.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">same allele on both: D and D</text>
  <line x1="516.0" y1="350.0" x2="492.0" y2="350.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="492.0" cy="350.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="60.0" y="225.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">homologous pair</text>
  <line x1="171.2" y1="220.0" x2="308.0" y2="230.0" stroke="#4b5563" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="308.0" cy="230.0" r="3.0" stroke="#4b5563" stroke-width="1" fill="#4b5563"/>
  <text x="60.0" y="244.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">(same genes, same order)</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
