<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <!-- Original diagram after Figures 5.5 to 5.8: temperature, pH, enzyme concentration and substrate concentration against the rate of enzyme action. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563}
      .c{font-size:18px;fill:#4b5563;text-anchor:middle}
      .n{font-size:17px;fill:#14181f;font-weight:700}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#14181f"/></marker>
  </defs>
  <!-- panel 1: temperature -->
  <text class="h" x="320" y="40">Temperature</text>
  <path d="M100 400 V90" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M100 400 H560" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <text class="c" x="330" y="455">temperature</text>
  <text class="s" x="40" y="250" transform="rotate(-90 40 250)" text-anchor="middle">rate of reaction</text>
  <path d="M110 395 C 250 380, 300 200, 340 130 C 370 180, 400 350, 420 395" fill="none" stroke="#d7322f" stroke-width="6"/>
  <path d="M340 130 V400" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="c" x="340" y="420">optimum (37 C in humans)</text>
  <text class="s" x="120" y="250">slow: bonds too</text><text class="s" x="120" y="272">stiff to flex</text>
  <text class="s" x="400" y="240">sharp fall:</text><text class="s" x="400" y="262">denaturation</text>
  <text class="s" x="110" y="470">thermophilic bacteria of hot springs: enzymes work at 70 C or higher</text>
  <!-- panel 2: pH -->
  <text class="h" x="900" y="40">pH</text>
  <path d="M680 400 V90" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M680 400 H1140" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <text class="c" x="910" y="435">pH 0 to 14</text>
  <text class="s" x="620" y="250" transform="rotate(-90 620 250)" text-anchor="middle">rate of reaction</text>
  <path d="M700 395 C 730 150, 760 150, 790 395" fill="none" stroke="#d98b2b" stroke-width="6"/>
  <path d="M880 395 C 920 130, 980 130, 1020 395" fill="none" stroke="#1f6fb5" stroke-width="6"/>
  <path d="M980 395 C 1010 150, 1040 150, 1070 395" fill="none" stroke="#0f7a62" stroke-width="6"/>
  <text class="n" x="705" y="130" style="fill:#d98b2b">pepsin</text><text class="s" x="705" y="152">optimum 1.5 to 1.6</text>
  <text class="n" x="880" y="110" style="fill:#1f6fb5">papain</text><text class="s" x="880" y="132">acidic and alkaline</text>
  <text class="n" x="1050" y="130" style="fill:#0f7a62">trypsin</text><text class="s" x="1030" y="152">optimum 7.8 to 8.7</text>
  <text class="s" x="690" y="470">each enzyme has a narrow optimum pH; extremes denature it</text>
  <!-- panel 3: enzyme concentration -->
  <text class="h" x="320" y="520">Enzyme concentration</text>
  <path d="M100 840 V570" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M100 840 H560" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <text class="c" x="330" y="875">enzyme concentration</text>
  <text class="s" x="40" y="700" transform="rotate(-90 40 700)" text-anchor="middle">rate of reaction</text>
  <path d="M110 835 L330 640 L540 640" fill="none" stroke="#5b3fb5" stroke-width="6"/>
  <text class="s" x="120" y="640">more enzyme, more</text><text class="s" x="120" y="662">active sites, faster</text>
  <text class="s" x="340" y="600">levels off: all substrate</text><text class="s" x="340" y="622">already being used</text>
  <!-- panel 4: substrate concentration -->
  <text class="h" x="900" y="520">Substrate concentration</text>
  <path d="M680 840 V570" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/><path d="M680 840 H1140" stroke="#14181f" stroke-width="3" marker-end="url(#ar)"/>
  <text class="c" x="910" y="875">substrate concentration</text>
  <text class="s" x="620" y="700" transform="rotate(-90 620 700)" text-anchor="middle">rate of reaction</text>
  <path d="M690 835 C 760 700, 850 640, 1120 635" fill="none" stroke="#0f7a62" stroke-width="6"/>
  <text class="s" x="700" y="680">free active sites:</text><text class="s" x="700" y="702">rate rises</text>
  <text class="s" x="900" y="610">all active sites occupied:</text><text class="s" x="900" y="632">rate stays constant</text>
</svg>
