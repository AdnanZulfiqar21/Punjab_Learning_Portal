<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Table 3.1 and Figures 3.9 to 3.20: VSEPR geometries and shapes drawn flat. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .a{font-size:15px;font-weight:700;fill:#14181f;text-anchor:middle}
      .b{font-size:12px;fill:#14181f;text-anchor:middle}
    </style>
  </defs>
  <text class="h" x="600" y="32">VSEPR: electron pairs keep as far apart as they can</text>
  <!-- row 1 -->
  <!-- AB2 linear -->
  <g transform="translate(150 150)">
    <text class="k" x="0" y="-88">AB2: linear, 180&#176;</text>
    <path d="M-70 0 H70" stroke="#4b5563" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">Be</text>
    <circle cx="-70" cy="0" r="13" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="-70" y="4">Cl</text>
    <circle cx="70" cy="0" r="13" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="70" y="4">Cl</text>
    <text class="s" x="0" y="45">BeCl2, CO2: 2 pairs, 0 lone</text>
  </g>
  <!-- AB3 trigonal -->
  <g transform="translate(400 150)">
    <text class="k" x="0" y="-88">AB3: trigonal planar, 120&#176;</text>
    <path d="M0 0 V-55 M0 0 L48 28 M0 0 L-48 28" stroke="#4b5563" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">B</text>
    <circle cx="0" cy="-55" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="0" y="-51">F</text>
    <circle cx="48" cy="28" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="48" y="32">F</text>
    <circle cx="-48" cy="28" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="-48" y="32">F</text>
    <text class="s" x="0" y="62">BF3, BCl3, SO3: 3 pairs, 0 lone</text>
  </g>
  <!-- AB3 one lone: v shaped -->
  <g transform="translate(650 150)">
    <text class="k" x="0" y="-88">3 pairs, 1 lone: v-shaped, under 120&#176;</text>
    <path d="M0 0 L50 32 M0 0 L-50 32" stroke="#4b5563" stroke-width="2.5"/>
    <ellipse cx="0" cy="-42" rx="16" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"/><g fill="#5b3fb5"><circle cx="-5" cy="-44" r="3"/><circle cx="5" cy="-44" r="3"/></g>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">Sn</text>
    <circle cx="50" cy="32" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="50" y="36">Cl</text>
    <circle cx="-50" cy="32" r="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="b" x="-50" y="36">Cl</text>
    <text class="s" x="0" y="62">SnCl2, SO2: the lone pair takes a corner</text>
  </g>
  <!-- AB4 tetrahedral -->
  <g transform="translate(930 150)">
    <text class="k" x="0" y="-88">AB4: tetrahedral, 109.5&#176;</text>
    <path d="M0 0 V-58 M0 0 L52 30 M0 0 L-52 30" stroke="#4b5563" stroke-width="2.5"/>
    <path d="M0 0 L8 44" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">C</text>
    <circle cx="0" cy="-58" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="0" y="-54">H</text>
    <circle cx="52" cy="30" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="52" y="34">H</text>
    <circle cx="-52" cy="30" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="-52" y="34">H</text>
    <circle cx="10" cy="52" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="10" y="56">H</text>
    <text class="s" x="0" y="82">CH4, CCl4, SiH4: 4 pairs, 0 lone (thick bond: towards you)</text>
  </g>
  <!-- row 2 -->
  <!-- NH3 pyramidal -->
  <g transform="translate(150 370)">
    <text class="k" x="0" y="-100">4 pairs, 1 lone: pyramidal, 107&#176;</text>
    <ellipse cx="0" cy="-42" rx="16" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"/><g fill="#5b3fb5"><circle cx="-5" cy="-44" r="3"/><circle cx="5" cy="-44" r="3"/></g>
    <path d="M0 0 L52 30 M0 0 L-52 30" stroke="#4b5563" stroke-width="2.5"/><path d="M0 0 L8 44" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="17" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><text class="a" x="0" y="5">N</text>
    <circle cx="52" cy="30" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="52" y="34">H</text>
    <circle cx="-52" cy="30" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="-52" y="34">H</text>
    <circle cx="10" cy="52" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="10" y="56">H</text>
    <text class="s" x="0" y="82">NH3, H3O+; NF3 102.5&#176;</text>
  </g>
  <!-- H2O v shaped -->
  <g transform="translate(400 370)">
    <text class="k" x="0" y="-100">4 pairs, 2 lone: v-shaped 104.5&#176;</text>
    <ellipse cx="-22" cy="-40" rx="14" ry="24" transform="rotate(-30 -22 -40)" fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"/><ellipse cx="22" cy="-40" rx="14" ry="24" transform="rotate(30 22 -40)" fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"/>
    <g fill="#5b3fb5"><circle cx="-26" cy="-44" r="3"/><circle cx="-18" cy="-40" r="3"/><circle cx="26" cy="-44" r="3"/><circle cx="18" cy="-40" r="3"/></g>
    <path d="M0 0 L50 32 M0 0 L-50 32" stroke="#4b5563" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><text class="a" x="0" y="5">O</text>
    <circle cx="50" cy="32" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="50" y="36">H</text>
    <circle cx="-50" cy="32" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text class="b" x="-50" y="36">H</text>
    <text class="s" x="0" y="92">H2O, OF2, NH2-: lone pairs squeeze bonds</text>
  </g>
  <!-- PCl5 TBP -->
  <g transform="translate(650 370)">
    <text class="k" x="0" y="-100">AB5: trigonal bipyramid, 120&#176;/90&#176;</text>
    <path d="M0 0 V-62 M0 0 V62 M0 0 H62 M0 0 L-40 22 M0 0 L-40 -22" stroke="#4b5563" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">P</text>
    <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="0" cy="-62" r="12"/><circle cx="0" cy="62" r="12"/><circle cx="62" cy="0" r="12"/><circle cx="-40" cy="22" r="12"/><circle cx="-40" cy="-22" r="12"/></g>
    <g class="b"><text x="0" y="-58">Cl</text><text x="0" y="66">Cl</text><text x="62" y="4">Cl</text><text x="-40" y="26">Cl</text><text x="-40" y="-18">Cl</text></g>
    <text class="s" x="0" y="92">PCl5: two axial, three in the plane</text>
  </g>
  <!-- I3- linear -->
  <g transform="translate(930 370)">
    <text class="k" x="0" y="-100">5 pairs, 3 lone: linear I3-, 180&#176;</text>
    <path d="M0 -62 V62" stroke="#4b5563" stroke-width="2.5"/>
    <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"><ellipse cx="52" cy="0" rx="24" ry="13"/><ellipse cx="-36" cy="-22" rx="24" ry="13" transform="rotate(30 -36 -22)"/><ellipse cx="-36" cy="22" rx="24" ry="13" transform="rotate(-30 -36 22)"/></g>
    <circle cx="0" cy="0" r="17" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><text class="a" x="0" y="5">I</text>
    <circle cx="0" cy="-62" r="13" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><text class="b" x="0" y="-58">I</text>
    <circle cx="0" cy="62" r="13" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><text class="b" x="0" y="66">I</text>
    <text class="s" x="0" y="92">lone pairs fill the plane; atoms on the axis</text>
  </g>
  <!-- row 3 -->
  <!-- SF6 octahedral -->
  <g transform="translate(300 600)">
    <text class="k" x="0" y="-95">AB6: octahedral, all 90&#176;</text>
    <path d="M0 0 V-62 M0 0 V62 M0 0 H62 M0 0 H-62 M0 0 L36 24 M0 0 L-36 -24" stroke="#4b5563" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">S</text>
    <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="0" cy="-62" r="12"/><circle cx="0" cy="62" r="12"/><circle cx="62" cy="0" r="12"/><circle cx="-62" cy="0" r="12"/><circle cx="36" cy="24" r="12"/><circle cx="-36" cy="-24" r="12"/></g>
    <g class="b"><text x="0" y="-58">F</text><text x="0" y="66">F</text><text x="62" y="4">F</text><text x="-62" y="4">F</text><text x="36" y="28">F</text><text x="-36" y="-20">F</text></g>
    <text class="s" x="0" y="92">SF6: four in a square, two on the axis</text>
  </g>
  <!-- XeF4 square planar -->
  <g transform="translate(600 600)">
    <text class="k" x="0" y="-95">6 pairs, 2 lone: square planar XeF4, 90&#176;</text>
    <path d="M0 0 H62 M0 0 H-62 M0 0 L36 24 M0 0 L-36 -24" stroke="#4b5563" stroke-width="2.5"/>
    <g fill="#e8dff7" stroke="#5b3fb5" stroke-width="1.5"><ellipse cx="0" cy="-48" rx="13" ry="22"/><ellipse cx="0" cy="48" rx="13" ry="22"/></g>
    <circle cx="0" cy="0" r="17" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><text class="a" x="0" y="5">Xe</text>
    <g fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"><circle cx="62" cy="0" r="12"/><circle cx="-62" cy="0" r="12"/><circle cx="36" cy="24" r="12"/><circle cx="-36" cy="-24" r="12"/></g>
    <g class="b"><text x="62" y="4">F</text><text x="-62" y="4">F</text><text x="36" y="28">F</text><text x="-36" y="-20">F</text></g>
    <text class="s" x="0" y="92">the two lone pairs sit opposite, 180&#176; apart</text>
  </g>
  <!-- repulsion order box -->
  <rect x="800" y="505" width="340" height="190" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g class="s">
    <text x="970" y="533" style="font-weight:700;fill:#14181f">Repulsion order</text>
    <text x="970" y="557">lone pair-lone pair &gt; lone pair-bond pair &gt; bond pair-bond pair</text>
    <text x="970" y="583">a lone pair, held by one nucleus, spreads wider than a bond pair;</text>
    <text x="970" y="601">double and triple bonds count as one region;</text>
    <text x="970" y="619">electronegative ligands pull bond pairs away and let them close up</text>
    <text x="970" y="649">geometry counts all pairs; shape counts atoms only</text>
    <text x="970" y="667">lone pairs in purple; wedge-free flat sketch of 3D shapes</text>
  </g>
  <text class="s" x="600" y="740">Sidgwick and Powell, 1940. Angles as printed in Table 3.1 and Figures 3.14, 3.15 and 3.17 to 3.20.</text>
</svg>
