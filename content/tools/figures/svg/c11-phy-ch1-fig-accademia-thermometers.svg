<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="Arial, Helvetica, sans-serif">
  <!-- For your information (C11-PHY, PDF p12): photograph of two glass thermometers of the Accademia del Cimento on a dark background: on the left a spiral (coiled) glass tube above a round bulb on a stand, on the right a crown of small glass beads above a small bulb on a round base; flat drawing after the printed photograph. No photograph is reproduced. -->
  <rect width="900" height="1200" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="1200" fill="#15161c"/>
  <!-- hanging threads in the background -->
  <g stroke="#5a5c66" stroke-width="3" stroke-dasharray="6 10">
    <line x1="160" y1="0" x2="160" y2="470"/><line x1="290" y1="0" x2="290" y2="130"/><line x1="560" y1="0" x2="560" y2="1080"/><line x1="660" y1="0" x2="660" y2="520"/><line x1="70" y1="0" x2="70" y2="700"/>
  </g>
  <!-- partial disk at the left edge -->
  <ellipse cx="20" cy="1010" rx="110" ry="40" fill="#8f949c" stroke="#c4c8ce" stroke-width="3"/>
  <!-- LEFT: spiral thermometer -->
  <g stroke="#e4e2d6" fill="none">
    <line x1="230" y1="300" x2="230" y2="760" stroke-width="5"/>
    <!-- small top bulb and stem -->
    <path d="M230 230 L230 330" stroke-width="6"/>
  </g>
  <ellipse cx="230" cy="250" rx="34" ry="40" fill="#c9c6b6" stroke="#f2f0e6" stroke-width="4"/>
  <ellipse cx="220" cy="240" rx="10" ry="14" fill="#f6f4ec"/>
  <path d="M230 200 L230 210" stroke="#e4e2d6" stroke-width="5"/>
  <!-- coil: ellipses drawn as a helix -->
  <g fill="none" stroke="#dcd6c2" stroke-width="7">
    <ellipse cx="230" cy="350" rx="140" ry="22"/>
    <ellipse cx="230" cy="390" rx="142" ry="22"/>
    <ellipse cx="230" cy="430" rx="144" ry="22"/>
    <ellipse cx="230" cy="470" rx="144" ry="22"/>
    <ellipse cx="230" cy="510" rx="142" ry="22"/>
    <ellipse cx="230" cy="550" rx="140" ry="22"/>
    <ellipse cx="230" cy="590" rx="136" ry="22"/>
  </g>
  <path d="M120 640 Q230 690 340 640" stroke="#dcd6c2" stroke-width="6" fill="none"/>
  <!-- neck and big bulb -->
  <path d="M215 640 Q225 700 222 760 L238 760 Q235 700 245 640 Z" fill="#cfcabb"/>
  <circle cx="230" cy="850" r="100" fill="#3a3c44" stroke="#e8e6dc" stroke-width="6"/>
  <ellipse cx="195" cy="810" rx="26" ry="36" fill="#9a9ca4"/>
  <!-- stand and base -->
  <path d="M222 950 L218 1010 L242 1010 L238 950 Z" fill="#cfcabb"/>
  <ellipse cx="230" cy="1030" rx="120" ry="34" fill="#9ea2a8" stroke="#e2e4e6" stroke-width="4"/>
  <!-- RIGHT: crown-of-beads thermometer -->
  <line x1="640" y1="420" x2="640" y2="1000" stroke="#e4e2d6" stroke-width="5"/>
  <ellipse cx="640" cy="560" rx="22" ry="26" fill="#cfcabb" stroke="#f2f0e6" stroke-width="3"/>
  <path d="M630 470 L640 430 L650 470 Z" fill="#e4e2d6"/>
  <g fill="#bdb9a8" stroke="#f4f2ea" stroke-width="2">
    <!-- arcs of beads forming a crown -->
    <circle cx="640" cy="600" r="14"/>
    <circle cx="612" cy="606" r="13"/><circle cx="668" cy="606" r="13"/>
    <circle cx="586" cy="620" r="13"/><circle cx="694" cy="620" r="13"/>
    <circle cx="564" cy="642" r="13"/><circle cx="716" cy="642" r="13"/>
    <circle cx="548" cy="668" r="13"/><circle cx="732" cy="668" r="13"/>
    <circle cx="540" cy="698" r="13"/><circle cx="740" cy="698" r="13"/>
    <circle cx="540" cy="728" r="13"/><circle cx="740" cy="728" r="13"/>
    <circle cx="548" cy="758" r="13"/><circle cx="732" cy="758" r="13"/>
    <circle cx="562" cy="786" r="13"/><circle cx="718" cy="786" r="13"/>
    <circle cx="584" cy="808" r="13"/><circle cx="696" cy="808" r="13"/>
    <circle cx="610" cy="822" r="13"/><circle cx="670" cy="822" r="13"/>
    <!-- inner arcs -->
    <circle cx="596" cy="650" r="11"/><circle cx="684" cy="650" r="11"/>
    <circle cx="582" cy="684" r="11"/><circle cx="698" cy="684" r="11"/>
    <circle cx="578" cy="720" r="11"/><circle cx="702" cy="720" r="11"/>
    <circle cx="584" cy="756" r="11"/><circle cx="696" cy="756" r="11"/>
    <circle cx="602" cy="786" r="11"/><circle cx="678" cy="786" r="11"/>
    <circle cx="616" cy="640" r="10"/><circle cx="664" cy="640" r="10"/>
    <circle cx="612" cy="700" r="10"/><circle cx="668" cy="700" r="10"/>
    <circle cx="616" cy="760" r="10"/><circle cx="664" cy="760" r="10"/>
  </g>
  <!-- small bulb below the crown -->
  <circle cx="640" cy="905" r="40" fill="#3a3c44" stroke="#e8e6dc" stroke-width="5"/>
  <ellipse cx="626" cy="892" rx="10" ry="14" fill="#9a9ca4"/>
  <ellipse cx="640" cy="1040" rx="170" ry="48" fill="#a6aab0" stroke="#e2e4e6" stroke-width="4"/>
  <path d="M632 945 L630 1000 L650 1000 L648 945 Z" fill="#cfcabb"/>
</svg>
