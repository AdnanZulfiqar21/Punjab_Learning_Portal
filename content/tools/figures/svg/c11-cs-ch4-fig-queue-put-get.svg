<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- Queue put and get with Ahmed, Fatima, Ali and Sara (Roman Urdu teaching figure) -->
  <text x="30.0" y="50.0" font-size="25" fill="#111111" text-anchor="start" font-weight="700">1) put() teen dafa: Ahmed, Fatima, Ali</text>
  <rect x="260.0" y="76.0" width="150.0" height="70.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#dbe9f5"/>
  <text x="335.0" y="120.7" font-size="27" fill="#111111" text-anchor="middle" font-weight="600">Ahmed</text>
  <rect x="430.0" y="76.0" width="150.0" height="70.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#dbe9f5"/>
  <text x="505.0" y="120.7" font-size="27" fill="#111111" text-anchor="middle" font-weight="600">Fatima</text>
  <rect x="600.0" y="76.0" width="150.0" height="70.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#dbe9f5"/>
  <text x="675.0" y="120.7" font-size="27" fill="#111111" text-anchor="middle" font-weight="600">Ali</text>
  <text x="335.0" y="186.0" font-size="25" fill="#b91c1c" text-anchor="middle" font-weight="700">aage (front)</text>
  <text x="675.0" y="186.0" font-size="25" fill="#0f7a62" text-anchor="middle" font-weight="700">peeche (back)</text>
  <text x="30.0" y="262.0" font-size="25" fill="#111111" text-anchor="start" font-weight="700">2) get() aage se Ahmed nikalta; put() peeche Sara jorta</text>
  <rect x="260.0" y="296.0" width="150.0" height="70.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#dbe9f5"/>
