  <text x="505.0" y="340.7" font-size="27" fill="#111111" text-anchor="middle" font-weight="600">Ali</text>
  <rect x="600.0" y="296.0" width="150.0" height="70.0" rx="10" stroke="#4b5563" stroke-width="2" fill="#fff1dc"/>
  <text x="675.0" y="340.7" font-size="27" fill="#111111" text-anchor="middle" font-weight="600">Sara</text>
