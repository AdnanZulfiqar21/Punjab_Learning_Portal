<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif">
  <!-- Vis3-9 (C11-CHEM, PDF p72), Short Q2(e): structure of propanone (acetone) as printed: a central C (the corner) double-bonded to O above and single-bonded to H3C on the left and CH3 on the right. Original drawing after the textbook. -->
  <rect width="500" height="240" fill="#ffffff"/>
  <text x="250" y="58" font-size="40" text-anchor="middle" fill="#14181f">O</text>
  <line x1="244.0" y1="72.0" x2="244.0" y2="140.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="256.0" y1="72.0" x2="256.0" y2="140.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="140" x2="180" y2="182" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="140" x2="320" y2="182" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="172" y="205" font-size="40" text-anchor="end" fill="#14181f">H<tspan dy="10" font-size="28">3</tspan><tspan dy="-10">C</tspan></text>
  <text x="328" y="205" font-size="40" text-anchor="start" fill="#14181f">CH<tspan dy="10" font-size="28">3</tspan></text>
</svg>
