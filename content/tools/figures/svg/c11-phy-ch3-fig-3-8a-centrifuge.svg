<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 3.8 (a) (C11-PHY, PDF p61): a laboratory centrifuge; flat drawing after the printed photograph: a white benchtop centrifuge with its dark grey lid raised at the back, a round grey chamber holding a ring of blue-capped sample tubes, and a blue control panel with a small display on the front. No photograph is reproduced. -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <ellipse cx="500" cy="930" rx="400" ry="30" fill="#e9eaec"/>
  <!-- raised lid -->
  <path d="M250 520 L220 140 Q230 60 330 50 L700 40 Q800 45 815 130 L800 520 Z" fill="#54585e" stroke="#33363a" stroke-width="4"/>
  <path d="M265 500 L240 150 Q248 85 335 78 L695 70 Q780 75 790 140 L778 500 Z" fill="#6b7077"/>
  <ellipse cx="520" cy="280" rx="190" ry="170" fill="#5e6369" stroke="#474b50" stroke-width="4"/>
  <circle cx="545" cy="270" r="36" fill="#c9ccd0" stroke="#8e9297" stroke-width="4"/>
  <circle cx="545" cy="270" r="14" fill="#9ea2a7"/>
  <!-- body -->
  <path d="M120 620 Q120 520 260 500 L760 500 Q890 510 900 620 L900 840 Q900 900 830 900 L180 900 Q120 900 120 840 Z" fill="#f4f5f7" stroke="#b9bdc3" stroke-width="4"/>
  <path d="M120 820 L900 820 L900 845 Q900 900 830 900 L180 900 Q120 900 120 845 Z" fill="#4c4f54"/>
  <!-- chamber with tubes -->
  <ellipse cx="520" cy="585" rx="300" ry="70" fill="#8a8f96" stroke="#62666c" stroke-width="4"/>
  <ellipse cx="520" cy="595" rx="260" ry="52" fill="#53575c"/>
  <g stroke="#123a8a" stroke-width="3">
    <g fill="#2f6fe0">
      <rect x="360" y="540" width="40" height="52" rx="10"/><rect x="410" y="525" width="40" height="52" rx="10"/><rect x="462" y="518" width="40" height="52" rx="10"/><rect x="514" y="518" width="40" height="52" rx="10"/><rect x="566" y="522" width="40" height="52" rx="10"/><rect x="618" y="534" width="40" height="52" rx="10"/>
    </g>
    <g fill="#3f86ff">
      <rect x="385" y="575" width="40" height="52" rx="10"/><rect x="440" y="582" width="40" height="52" rx="10"/><rect x="498" y="586" width="40" height="52" rx="10"/><rect x="556" y="582" width="40" height="52" rx="10"/><rect x="612" y="574" width="40" height="52" rx="10"/>
    </g>
  </g>
  <!-- control panel -->
  <path d="M170 650 L330 640 Q350 640 350 660 L350 790 Q350 810 330 810 L175 815 Q155 815 155 795 L155 668 Q155 652 170 650 Z" fill="#2f5fbf" stroke="#1e3f86" stroke-width="3"/>
  <rect x="185" y="672" width="130" height="50" rx="6" fill="#1a1d22"/>
  <g fill="#ff6a45"><rect x="200" y="688" width="26" height="18" rx="2"/><rect x="237" y="688" width="26" height="18" rx="2"/><rect x="274" y="688" width="26" height="18" rx="2"/></g>
  <circle cx="205" cy="765" r="16" fill="#e7ecf7"/><circle cx="255" cy="765" r="16" fill="#e7ecf7"/><circle cx="305" cy="765" r="16" fill="#e7ecf7"/>
</svg>
