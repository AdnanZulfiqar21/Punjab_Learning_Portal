  <line x1="280.7" y1="146.6" x2="321.3" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="225.0" y="275.0" font-size="26" fill="#c2185b" text-anchor="middle" font-weight="700">but-1-ene</text>
