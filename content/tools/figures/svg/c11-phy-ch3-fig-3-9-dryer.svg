<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 3.9 (C11-PHY, PDF p61): the dryer of a washing machine; flat drawing after the printed photograph: a round white spin-dryer tub seen from slightly above, its white lid raised at the back and a maroon rim round the opening, showing the perforated inner drum with clothes inside. No photograph is reproduced. -->
  <rect width="900" height="1100" fill="#ffffff"/>
  <ellipse cx="450" cy="1050" rx="320" ry="26" fill="#e9eaec"/>
  <!-- raised lid -->
  <path d="M190 470 Q170 120 450 80 Q730 120 710 470 Z" fill="#eceef0" stroke="#b5b9be" stroke-width="4"/>
  <path d="M230 455 Q215 160 450 125 Q685 160 670 455 Z" fill="#f7f8f9" stroke="#d3d6da" stroke-width="3"/>
  <ellipse cx="450" cy="125" rx="40" ry="10" fill="#d3d6da"/>
  <!-- body -->
  <path d="M150 560 L180 1000 Q182 1030 220 1030 L680 1030 Q718 1030 720 1000 L750 560 Z" fill="#f1f2f4" stroke="#b5b9be" stroke-width="4"/>
  <path d="M175 900 L725 900" stroke="#d8dbdf" stroke-width="3"/>
  <!-- maroon rim and opening -->
  <ellipse cx="450" cy="560" rx="310" ry="110" fill="#7d1020" stroke="#5a0b17" stroke-width="4"/>
  <ellipse cx="450" cy="572" rx="255" ry="82" fill="#f6f7f8"/>
  <!-- perforated inner drum -->
  <path d="M195 572 Q200 760 450 790 Q700 760 705 572 Q700 654 450 654 Q200 654 195 572 Z" fill="#e7e9ec" stroke="#c5c9ce" stroke-width="3"/>
  <ellipse cx="450" cy="600" rx="225" ry="62" fill="#dfe2e6"/>
  <g fill="#b9bec4">
    <circle cx="300" cy="690" r="5"/><circle cx="340" cy="705" r="5"/><circle cx="380" cy="714" r="5"/><circle cx="420" cy="719" r="5"/><circle cx="460" cy="720" r="5"/><circle cx="500" cy="718" r="5"/><circle cx="540" cy="712" r="5"/><circle cx="580" cy="702" r="5"/><circle cx="615" cy="688" r="5"/>
    <circle cx="320" cy="730" r="5"/><circle cx="360" cy="742" r="5"/><circle cx="400" cy="750" r="5"/><circle cx="440" cy="753" r="5"/><circle cx="480" cy="753" r="5"/><circle cx="520" cy="750" r="5"/><circle cx="560" cy="742" r="5"/><circle cx="598" cy="730" r="5"/>
  </g>
  <!-- clothes inside -->
  <path d="M330 610 Q360 570 410 590 Q440 560 480 590 Q520 565 560 600 Q590 610 570 635 Q520 650 450 648 Q370 648 335 635 Z" fill="#d6e6f5" stroke="#a9c3dc" stroke-width="3"/>
  <path d="M400 600 Q430 585 455 605" stroke="#a9c3dc" stroke-width="3" fill="none"/>
  <path d="M480 605 Q510 590 535 612" stroke="#a9c3dc" stroke-width="3" fill="none"/>
</svg>
