<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="730" fill="#ffffff"/>
  <!-- Original diagram after topics 14.1.3, 14.2.1 and 14.2.2: filtration at the glomerulus, reabsorption in the PCT and loop of Henle, secretion in the DCT, water leaving the collecting duct into the salty medulla, and the ADH and aldosterone control chains. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="32">Forming urine and controlling its concentration</text>
  <rect x="50" y="55" width="760" height="655" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="430" y="83">Filtration, reabsorption and secretion (14.1.3, 14.2.1)</text>
  <defs><linearGradient id="med" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeee6"/><stop offset="1" stop-color="#e8a98a"/></linearGradient></defs>
  <rect x="70" y="345" width="720" height="345" fill="url(#med)"/>
  <path d="M70 345 H790" fill="none" stroke="#8a4b2f" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text class="l" x="80" y="362" style="fill:#8a4b2f">medulla: saltier with depth</text>
  <circle cx="140" cy="190" r="38" fill="#fde9c8" stroke="#b45309" stroke-width="3"/>
  <circle cx="130" cy="184" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="148" cy="181" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="134" cy="199" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="150" cy="197" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <circle cx="140" cy="190" r="9" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <path d="M178 190 H330 V600 Q330 628 365 628 Q400 628 400 600 V250 H600" fill="none" stroke="#b45309" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 190 H330 V600 Q330 628 365 628 Q400 628 400 600 V250 H600" fill="none" stroke="#fde9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 110 V670" fill="none" stroke="#b45309" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 110 V670" fill="none" stroke="#fde9c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="l" x="80" y="338" style="fill:#8a4b2f">cortex</text>
  <g class="r">
    <text x="70" y="250">1 filtration (high pressure): water,</text>
    <text x="70" y="265">urea, glucose, amino acids, vitamins</text>
    <text x="70" y="280">and salts enter the capsule; about 20%</text>
    <text x="70" y="295">of the plasma; proteins and cells stay</text>
  </g>
  <path d="M210 182 L210 152" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M255 182 L255 152" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M300 182 L300 152" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <g class="r">
    <text x="185" y="110">2 reabsorption, mostly in the PCT: glucose, amino</text>
    <text x="185" y="125">acids and salts by active transport; about 75% of</text>
    <text x="185" y="140">the water by osmosis</text>
  </g>
  <path d="M322 430 L284 430" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M408 430 L446 430" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M322 520 L284 520" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M408 520 L446 520" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <text class="r" x="312" y="465" style="text-anchor:end">water leaves by osmosis</text>
  <text class="r" x="312" y="480" style="text-anchor:end">(permeable to water,</text>
  <text class="r" x="312" y="495" style="text-anchor:end">not to salts)</text>
  <g class="r">
    <text x="452" y="465">Na+ pumped out,</text>
    <text x="452" y="480">Cl- follows</text>
    <text x="452" y="495">(impermeable to water)</text>
  </g>
  <path d="M470 210 L470 238" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <path d="M540 210 L540 238" stroke="#d7322f" stroke-width="2" marker-end="url(#p)"/>
  <g class="r">
    <text x="420" y="180">3 secretion into the DCT: H+, NH4+, K+,</text>
    <text x="420" y="195">drugs such as penicillin</text>
  </g>
  <g class="r">
    <text x="420" y="280">some water and salts reabsorbed;</text>
    <text x="420" y="295">aldosterone acts here and in the duct</text>
  </g>
  <path d="M648 520 L690 520" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <path d="M648 600 L690 600" stroke="#1f6fb5" stroke-width="2" marker-end="url(#bl)"/>
  <g class="r">
    <text x="655" y="545">water out to the</text>
    <text x="655" y="560">salty medulla, then</text>
    <text x="655" y="575">to the vasa recta;</text>
    <text x="655" y="590">ADH opens the way</text>
  </g>
  <text class="l" x="640" y="690" style="fill:#d98b2b;text-anchor:middle">urine</text>
  <rect x="830" y="55" width="320" height="655" rx="12" fill="#fde8e7" stroke="#d7322f" stroke-width="2"/>
  <text class="k" x="990" y="83">Hormones (14.2.2)</text>
  <rect x="845" y="100" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="920" y="118">dehydration or salty food</text>
  <path d="M990 128 L990 138" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="140" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="909" y="158">osmoreceptors in hypothalamus</text>
  <path d="M990 168 L990 178" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="180" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="900" y="198">posterior pituitary releases ADH</text>
  <path d="M990 208 L990 218" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="220" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="906" y="238">collecting duct more permeable</text>
  <path d="M990 248 L990 258" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="260" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="912" y="278">more water back to the blood</text>
  <path d="M990 288 L990 298" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="300" width="290" height="28" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.5"/>
  <text class="r" x="923" y="318">less, concentrated urine</text>
  <g class="r">
    <text x="845" y="355">little ADH: dilute urine. No ADH from a damaged</text>
    <text x="845" y="370">pituitary: diabetes insipidus (much dilute urine)</text>
  </g>
  <rect x="845" y="410" width="290" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="909" y="428">blood pressure or Na+ too low</text>
  <path d="M990 438 L990 448" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="450" width="290" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="914" y="468">adrenal cortex: aldosterone</text>
  <path d="M990 478 L990 488" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="490" width="290" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="917" y="508">DCT and duct take back Na+</text>
  <path d="M990 518 L990 528" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="845" y="530" width="290" height="28" rx="6" fill="#ffffff" stroke="#d98b2b" stroke-width="1.5"/>
  <text class="r" x="917" y="548">water follows; K+ excreted</text>
  <g class="r">
    <text x="845" y="590">two capillary beds: glomerular capillaries filter</text>
    <text x="845" y="605">under high pressure; peritubular capillaries</text>
    <text x="845" y="620">reabsorb and secrete under low pressure</text>
  </g>
  <text class="s" x="600" y="722" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
