<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 3.27: the three fibres of the cytoskeleton. -->
  <defs>
    <style>
      .h{font-size:28px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:20px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <!-- microfilament: two twisted strands of actin beads, solid rod -->
  <text class="h" x="200" y="60">Microfilament</text>
  <text class="s" x="200" y="90">solid rod of actin, about 7 nm</text>
  <g fill="#d98b2b" stroke="#8a4b00" stroke-width="2">
    <circle cx="200" cy="140" r="12"/><circle cx="214" cy="164" r="12"/><circle cx="200" cy="188" r="12"/><circle cx="186" cy="212" r="12"/><circle cx="200" cy="236" r="12"/><circle cx="214" cy="260" r="12"/><circle cx="200" cy="284" r="12"/><circle cx="186" cy="308" r="12"/><circle cx="200" cy="332" r="12"/><circle cx="214" cy="356" r="12"/><circle cx="200" cy="380" r="12"/><circle cx="186" cy="404" r="12"/><circle cx="200" cy="428" r="12"/>
  </g>
  <text class="s" x="200" y="500">changes cell shape, movement,</text><text class="s" x="200" y="526">pinches a dividing cell in two,</text><text class="s" x="200" y="552">contraction with myosin</text>
  <!-- microtubule: hollow cylinder of tubulin dimers -->
  <text class="h" x="600" y="60">Microtubule</text>
  <text class="s" x="600" y="90">hollow cylinder of tubulin, about 25 nm</text>
  <rect x="540" y="130" width="120" height="300" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="4"/>
  <ellipse cx="600" cy="130" rx="60" ry="18" fill="#eef6fb" stroke="#1f6fb5" stroke-width="4"/>
  <ellipse cx="600" cy="130" rx="32" ry="9" fill="#fff" stroke="#1f6fb5" stroke-width="3"/>
  <g fill="#1f6fb5"><circle cx="556" cy="170" r="8"/><circle cx="556" cy="200" r="8"/><circle cx="556" cy="230" r="8"/><circle cx="556" cy="260" r="8"/><circle cx="556" cy="290" r="8"/><circle cx="556" cy="320" r="8"/><circle cx="556" cy="350" r="8"/><circle cx="556" cy="380" r="8"/><circle cx="556" cy="410" r="8"/></g>
  <g fill="#8f78d9"><circle cx="578" cy="160" r="8"/><circle cx="578" cy="190" r="8"/><circle cx="578" cy="220" r="8"/><circle cx="578" cy="250" r="8"/><circle cx="578" cy="280" r="8"/><circle cx="578" cy="310" r="8"/><circle cx="578" cy="340" r="8"/><circle cx="578" cy="370" r="8"/><circle cx="578" cy="400" r="8"/></g>
  <g fill="#1f6fb5"><circle cx="600" cy="170" r="8"/><circle cx="600" cy="200" r="8"/><circle cx="600" cy="230" r="8"/><circle cx="600" cy="260" r="8"/><circle cx="600" cy="290" r="8"/><circle cx="600" cy="320" r="8"/><circle cx="600" cy="350" r="8"/><circle cx="600" cy="380" r="8"/><circle cx="600" cy="410" r="8"/></g>
  <g fill="#8f78d9"><circle cx="622" cy="160" r="8"/><circle cx="622" cy="190" r="8"/><circle cx="622" cy="220" r="8"/><circle cx="622" cy="250" r="8"/><circle cx="622" cy="280" r="8"/><circle cx="622" cy="310" r="8"/><circle cx="622" cy="340" r="8"/><circle cx="622" cy="370" r="8"/><circle cx="622" cy="400" r="8"/></g>
  <g fill="#1f6fb5"><circle cx="644" cy="170" r="8"/><circle cx="644" cy="200" r="8"/><circle cx="644" cy="230" r="8"/><circle cx="644" cy="260" r="8"/><circle cx="644" cy="290" r="8"/><circle cx="644" cy="320" r="8"/><circle cx="644" cy="350" r="8"/><circle cx="644" cy="380" r="8"/><circle cx="644" cy="410" r="8"/></g>
  <text class="s" x="600" y="460">alpha-tubulin (blue) and beta-tubulin (purple)</text>
  <text class="s" x="600" y="500">shape and structure, highways for</text><text class="s" x="600" y="526">organelles, cilia and flagella,</text><text class="s" x="600" y="552">spindle fibres in division</text>
  <!-- intermediate filament: rope of coiled protein strands -->
  <text class="h" x="1000" y="60">Intermediate filament</text>
  <text class="s" x="1000" y="90">rope of fibrous proteins, about 10 nm</text>
  <g fill="none" stroke="#0f7a62" stroke-width="8" stroke-linecap="round">
    <path d="M980 130 q30 40 0 80 t0 80 t0 80 t0 60"/>
    <path d="M1020 130 q-30 40 0 80 t0 80 t0 80 t0 60"/>
    <path d="M1000 130 q20 40 0 80 t0 80 t0 80 t0 60" stroke="#2f9a7e"/>
  </g>
  <text class="s" x="1000" y="460">vimentin most common; keratin in skin</text>
  <text class="s" x="1000" y="500">keeps cell shape and rigidity,</text><text class="s" x="1000" y="526">anchors organelles including</text><text class="s" x="1000" y="552">the nucleus; some animals only</text>
  <text class="s" x="600" y="640">Together these protein fibres form the cytoskeleton, the cell's internal scaffold and transport network.</text>
</svg>
