<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Fig 9.37 (C11-PHY, PDF p224): Carbon fibre sheets. Flat drawing after the printed photograph: a stack of thin black carbon fibre sheets seen from above at an angle, the edges of the sheets showing as a fan of lines at the lower left, the top sheet covered with fine diagonal woven stripes, on a white background. No photograph is reproduced. -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <defs>
    <pattern id="weave" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(62)">
      <rect width="28" height="28" fill="#2a2a2d"/>
      <rect width="13" height="28" fill="#3d3d42"/>
      <rect x="13" width="2" height="28" fill="#1a1a1c"/>
    </pattern>
  </defs>
  <!-- lower sheets of the stack, each a little lower and to the left -->
  <path d="M80 330 L 900 60 L 960 880 L 330 960 Z" fill="#161618" stroke="#55555a" stroke-width="3"/>
  <path d="M100 300 L 905 50 L 962 845 L 320 930 Z" fill="#1c1c1e" stroke="#5c5c62" stroke-width="3"/>
  <path d="M120 270 L 910 40 L 964 810 L 310 900 Z" fill="#1a1a1c" stroke="#5c5c62" stroke-width="3"/>
  <path d="M140 240 L 915 30 L 966 775 L 300 870 Z" fill="#1d1d20" stroke="#606066" stroke-width="3"/>
  <path d="M160 210 L 920 20 L 968 740 L 290 840 Z" fill="#1b1b1d" stroke="#606066" stroke-width="3"/>
  <!-- top sheet with the woven stripes -->
  <path d="M180 180 L 925 10 L 970 705 L 280 810 Z" fill="url(#weave)" stroke="#6a6a70" stroke-width="3"/>
  <!-- soft light on the top sheet -->
  <path d="M520 100 L 925 10 L 950 400 Z" fill="#ffffff" opacity="0.06"/>
</svg>
