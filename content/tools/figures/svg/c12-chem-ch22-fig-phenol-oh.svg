<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original summary of topic 22.6.1: phenol + NaOH gives sodium phenoxide and water; phenol + Na gives sodium phenoxide and hydrogen; phenol + ethanoyl chloride with a base gives the ester phenyl ethanoate and HCl. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Reactions of the OH group of phenol</text>
  <rect x="15.0" y="70.0" width="870.0" height="105.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="100.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">with sodium hydroxide</text>
  <text x="450.0" y="132.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">OH + NaOH -&gt; C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan><tspan dy="7.1">Na</tspan><tspan dy="-7.1" font-size="11.9">+</tspan><tspan dy="7.1"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4">O</tspan></text>
  <text x="450.0" y="158.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">phenol dissolves as sodium phenoxide (an acid-base reaction)</text>
  <rect x="15.0" y="190.0" width="870.0" height="105.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="220.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">with sodium</text>
  <text x="450.0" y="252.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">2C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">OH + 2Na -&gt; 2C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">O</tspan><tspan dy="-7.1" font-size="11.9">-</tspan><tspan dy="7.1">Na</tspan><tspan dy="-7.1" font-size="11.9">+</tspan><tspan dy="7.1"> + H</tspan><tspan dy="5.4" font-size="11.9">2</tspan></text>
  <text x="450.0" y="278.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">molten phenol; hydrogen is given off</text>
  <rect x="15.0" y="310.0" width="870.0" height="105.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="340.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">with ethanoyl chloride</text>
  <text x="450.0" y="372.0" font-size="17" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">COCl + C</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4">OH -&gt; CH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">COOC</tspan><tspan dy="5.4" font-size="11.9">6</tspan><tspan dy="-5.4">H</tspan><tspan dy="5.4" font-size="11.9">5</tspan><tspan dy="-5.4"> + HCl</tspan></text>
  <text x="450.0" y="398.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">with a base (NaOH): the ester phenyl ethanoate forms</text>
  <text x="450.0" y="452.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">the base turns phenol into the phenoxide ion, a better nucleophile, which attacks the C=O carbon</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
