<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, Helvetica, sans-serif">
  <!-- Our own Roman Urdu overview of the four applications of Le Chatelier's principle (the textbook prints no such figure) -->
  <rect width="1100" height="700" fill="#ffffff"/>
  <rect x="40.0" y="40.0" width="500.0" height="300.0" rx="18" stroke="#1f6fb5" stroke-width="3" fill="#dbe9f5"/>
  <rect x="40.0" y="40.0" width="500.0" height="70.0" rx="18" stroke="none" stroke-width="0" fill="#1f6fb5"/>
  <rect x="40.0" y="90.0" width="500.0" height="20.0" rx="0" stroke="none" stroke-width="0" fill="#1f6fb5"/>
  <text x="290.0" y="87.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Concentration</tspan></text>
  <text x="290.0" y="170.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Reactant barhayein ya product</tspan></text>
  <text x="290.0" y="220.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>hatayein: equilibrium</tspan></text>
  <text x="290.0" y="270.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>aage (right) jata hai</tspan></text>
  <rect x="560.0" y="40.0" width="500.0" height="300.0" rx="18" stroke="#0f7a62" stroke-width="3" fill="#e6f4ef"/>
  <rect x="560.0" y="40.0" width="500.0" height="70.0" rx="18" stroke="none" stroke-width="0" fill="#0f7a62"/>
  <rect x="560.0" y="90.0" width="500.0" height="20.0" rx="0" stroke="none" stroke-width="0" fill="#0f7a62"/>
  <text x="810.0" y="87.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Dabao (pressure)</tspan></text>
  <text x="810.0" y="170.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Dabao barhayein: equilibrium</tspan></text>
  <text x="810.0" y="220.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>gas ke kam moles wali</tspan></text>
  <text x="810.0" y="270.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>taraf jata hai</tspan></text>
  <rect x="40.0" y="360.0" width="500.0" height="300.0" rx="18" stroke="#d7322f" stroke-width="3" fill="#fde2e1"/>
  <rect x="40.0" y="360.0" width="500.0" height="70.0" rx="18" stroke="none" stroke-width="0" fill="#d7322f"/>
  <rect x="40.0" y="410.0" width="500.0" height="20.0" rx="0" stroke="none" stroke-width="0" fill="#d7322f"/>
  <text x="290.0" y="407.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Darja hararat</tspan></text>
  <text x="290.0" y="490.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Garmi dein: endothermic</tspan></text>
  <text x="290.0" y="540.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>taraf; sirf yahi</tspan></text>
  <text x="290.0" y="590.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Kc badalta hai</tspan></text>
  <rect x="560.0" y="360.0" width="500.0" height="300.0" rx="18" stroke="#7c3aed" stroke-width="3" fill="#efe7fd"/>
  <rect x="560.0" y="360.0" width="500.0" height="70.0" rx="18" stroke="none" stroke-width="0" fill="#7c3aed"/>
  <rect x="560.0" y="410.0" width="500.0" height="20.0" rx="0" stroke="none" stroke-width="0" fill="#7c3aed"/>
  <text x="810.0" y="407.0" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan>Catalyst</tspan></text>
  <text x="810.0" y="490.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>Equilibrium jaldi aata hai;</tspan></text>
  <text x="810.0" y="540.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>position aur Kc</tspan></text>
  <text x="810.0" y="590.0" font-size="31" fill="#14181f" text-anchor="middle" font-weight="400"><tspan>nahi badalte</tspan></text>
</svg>
