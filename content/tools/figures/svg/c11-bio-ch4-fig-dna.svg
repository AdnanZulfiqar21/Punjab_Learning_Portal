<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figure 4.44: the Watson and Crick double helix, unwound as a ladder and as a helix. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;fill:#ffffff;text-anchor:middle;font-weight:700}
      .n{font-size:17px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <g id="S"><circle cx="0" cy="0" r="16" fill="#d98b2b"/><text x="0" y="6" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">S</text></g>
    <g id="P"><circle cx="0" cy="0" r="12" fill="#1f6fb5"/><text x="0" y="5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">P</text></g>
  </defs>
  <text class="h" x="330" y="50">The ladder, unwound</text>
  <!-- left strand: 5' at top going down -->
  <g>
    <use href="#P" x="150" y="110"/><use href="#S" x="150" y="150"/><use href="#P" x="150" y="190"/><use href="#S" x="150" y="230"/><use href="#P" x="150" y="270"/><use href="#S" x="150" y="310"/><use href="#P" x="150" y="350"/><use href="#S" x="150" y="390"/><use href="#P" x="150" y="430"/><use href="#S" x="150" y="470"/><use href="#P" x="150" y="510"/>
    <use href="#P" x="510" y="110"/><use href="#S" x="510" y="150"/><use href="#P" x="510" y="190"/><use href="#S" x="510" y="230"/><use href="#P" x="510" y="270"/><use href="#S" x="510" y="310"/><use href="#P" x="510" y="350"/><use href="#S" x="510" y="390"/><use href="#P" x="510" y="430"/><use href="#S" x="510" y="470"/><use href="#P" x="510" y="510"/>
  </g>
  <path d="M150 120 V500 M510 120 V500" stroke="#14181f" stroke-width="3"/>
  <!-- rungs: A-T (2 H bonds), G-C (3) -->
  <g>
    <rect x="170" y="136" width="120" height="28" rx="6" fill="#0f7a62"/><text class="b" x="230" y="156">A</text>
    <rect x="370" y="136" width="120" height="28" rx="6" fill="#d7322f"/><text class="b" x="430" y="156">T</text>
    <path d="M295 146 H365 M295 156 H365" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="170" y="216" width="120" height="28" rx="6" fill="#5b3fb5"/><text class="b" x="230" y="236">G</text>
    <rect x="370" y="216" width="120" height="28" rx="6" fill="#f2b134"/><text class="b" x="430" y="236">C</text>
    <path d="M295 222 H365 M295 230 H365 M295 238 H365" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="170" y="296" width="120" height="28" rx="6" fill="#d7322f"/><text class="b" x="230" y="316">T</text>
    <rect x="370" y="296" width="120" height="28" rx="6" fill="#0f7a62"/><text class="b" x="430" y="316">A</text>
    <path d="M295 306 H365 M295 316 H365" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="170" y="376" width="120" height="28" rx="6" fill="#f2b134"/><text class="b" x="230" y="396">C</text>
    <rect x="370" y="376" width="120" height="28" rx="6" fill="#5b3fb5"/><text class="b" x="430" y="396">G</text>
    <path d="M295 382 H365 M295 390 H365 M295 398 H365" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="170" y="456" width="120" height="28" rx="6" fill="#0f7a62"/><text class="b" x="230" y="476">A</text>
    <rect x="370" y="456" width="120" height="28" rx="6" fill="#d7322f"/><text class="b" x="430" y="476">T</text>
    <path d="M295 466 H365 M295 476 H365" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text class="n" x="150" y="90">5'</text><text class="n" x="150" y="545">3'</text><text class="n" x="510" y="90">3'</text><text class="n" x="510" y="545">5'</text>
  <path d="M100 130 L100 480" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/><path d="M560 480 L560 130" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="330" y="590">poles: sugar (S) and phosphate (P); rungs: base pairs</text>
  <text class="s" x="330" y="616">A pairs with T by two hydrogen bonds; G with C by three</text>
  <text class="s" x="330" y="642">each rung is one purine (A or G) with one pyrimidine (T or C)</text>
  <text class="s" x="330" y="668">the two strands run antiparallel (arrows)</text>
  <!-- helix on the right -->
  <text class="h" x="900" y="50">The double helix</text>
  <g fill="none" stroke-linecap="round">
    <path d="M820 100 q160 60 0 120 q-160 60 0 120 q160 60 0 120 q-160 60 0 120" stroke="#d98b2b" stroke-width="14"/>
    <path d="M980 100 q-160 60 0 120 q160 60 0 120 q-160 60 0 120 q160 60 0 120" stroke="#1f6fb5" stroke-width="14"/>
  </g>
  <g stroke="#4b5563" stroke-width="4">
    <path d="M860 130 H940 M840 150 H960 M860 190 H940 M840 250 H960 M860 290 H940 M840 370 H960 M860 410 H940 M840 490 H960 M860 530 H940"/>
  </g>
  <text class="s" x="900" y="620">two polynucleotide strands coiled round</text><text class="s" x="900" y="646">each other; Watson and Crick, 1953</text>
  <text class="s" x="900" y="690">built on Franklin and Wilkins' X-ray work,</text><text class="s" x="900" y="716">Pauling's helix idea and Chargaff's rule</text><text class="s" x="900" y="742">(A equals T, G equals C)</text>
  <text class="s" x="600" y="800">A gene is a sequence of DNA nucleotides that codes for a polypeptide; DNA is the hereditary material of all organisms except some viruses.</text>
</svg>
