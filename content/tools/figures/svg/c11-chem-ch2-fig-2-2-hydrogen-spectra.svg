  <rect x="298.6" y="58.0" width="10.0" height="86.0" rx="0" stroke="none" stroke-width="0" fill="#18d2f2"/>
  <rect x="740.6" y="58.0" width="10.0" height="86.0" rx="0" stroke="none" stroke-width="0" fill="#d0081b"/>
  <text x="500.0" y="206.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>(b) Absorption spectrum of Hydrogen</tspan></text>
  <rect x="60.0" y="224.0" width="890.0" height="86.0" rx="0" stroke="#111" stroke-width="3" fill="url(#vis)"/>
