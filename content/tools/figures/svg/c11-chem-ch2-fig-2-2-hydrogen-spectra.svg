<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Times New Roman, Georgia, serif">
  <!-- Original drawing after the textbook's Figure 2.2 ((a) emission and (b) absorption spectrum of hydrogen) -->
