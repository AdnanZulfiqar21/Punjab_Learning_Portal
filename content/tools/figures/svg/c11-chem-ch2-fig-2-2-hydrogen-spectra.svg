  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500.0" y="40.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>(a) Emission spectrum of Hydrogen</tspan></text>
