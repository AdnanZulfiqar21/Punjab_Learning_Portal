<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- Original diagram after Figures 11.6 to 11.10: artery, vein and capillary in section, and a capillary bed with precapillary sphincters. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:16px;fill:#4b5563;text-anchor:middle}
      .k{font-size:17px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <!-- artery -->
  <text class="h" x="200" y="40">Artery</text>
  <circle cx="200" cy="170" r="110" fill="#c9b27a"/><circle cx="200" cy="170" r="92" fill="#d7322f"/><circle cx="200" cy="170" r="48" fill="#f6d5cf" stroke="#14181f" stroke-width="3"/>
  <text class="s" x="200" y="176" style="font-size:14px">lumen</text>
  <text class="s" x="200" y="310">tunica externa (adventitia): connective</text><text class="s" x="200" y="332">and elastic tissue</text>
  <text class="s" x="200" y="356">tunica media: thick muscle and elastic</text><text class="s" x="200" y="378">fibres, withstands systolic pressure</text>
  <text class="s" x="200" y="402">tunica intima: thin endothelium</text>
  <text class="s" x="200" y="436">carries blood away from the heart;</text><text class="s" x="200" y="458">stays open when empty</text>
  <!-- vein -->
  <text class="h" x="500" y="40">Vein</text>
  <circle cx="500" cy="170" r="110" fill="#c9b27a"/><circle cx="500" cy="170" r="96" fill="#1f6fb5"/><circle cx="500" cy="170" r="82" fill="#dbe9f5" stroke="#14181f" stroke-width="3"/>
  <text class="s" x="500" y="176" style="font-size:14px">large lumen</text>
  <text class="s" x="500" y="310">same three layers, but the tunica</text><text class="s" x="500" y="332">media is thin and only slightly</text><text class="s" x="500" y="354">muscular with few elastic fibres</text>
  <text class="s" x="500" y="388">carries blood towards the heart;</text><text class="s" x="500" y="410">semilunar valves stop backflow;</text><text class="s" x="500" y="432">squeezed by surrounding muscles;</text><text class="s" x="500" y="454">collapses like a balloon when empty</text>
  <!-- capillary -->
  <text class="h" x="800" y="40">Capillary</text>
  <circle cx="800" cy="170" r="60" fill="#f6d5cf" stroke="#d98b2b" stroke-width="8"/>
  <g fill="none" stroke="#8a4b00" stroke-width="2"><path d="M800 110 v120 M740 170 h120"/></g>
  <ellipse cx="800" cy="170" rx="22" ry="14" fill="#d7322f"/>
  <text class="s" x="800" y="260">wall: a single layer of</text><text class="s" x="800" y="282">endothelial cells</text>
  <text class="s" x="800" y="316">internal diameter about</text><text class="s" x="800" y="338">8 micrometres: RBCs pass</text><text class="s" x="800" y="360">in single file</text>
  <text class="s" x="800" y="394">site of exchange by diffusion</text><text class="s" x="800" y="416">or active transport; through</text><text class="s" x="800" y="438">the cells or their gaps, or by</text><text class="s" x="800" y="460">endocytosis and exocytosis</text>
  <!-- capillary bed -->
  <text class="h" x="1040" y="40">Capillary bed</text>
  <path d="M960 110 v280" stroke="#d7322f" stroke-width="10"/><text class="s" x="960" y="100" style="font-size:14px">arteriole</text>
  <path d="M1120 110 v280" stroke="#1f6fb5" stroke-width="10"/><text class="s" x="1120" y="100" style="font-size:14px">venule</text>
  <g stroke="#d98b2b" stroke-width="4" fill="none"><path d="M965 150 q80 -20 150 0 M965 230 q80 30 150 0 M965 310 q80 -30 150 0 M965 370 q80 20 150 0"/></g>
  <g fill="#14181f"><circle cx="990" cy="146" r="7"/><circle cx="990" cy="238" r="7"/><circle cx="990" cy="300" r="7"/><circle cx="990" cy="377" r="7"/></g>
  <text class="s" x="1040" y="420">black rings: precapillary</text><text class="s" x="1040" y="442">sphincters guarding each</text><text class="s" x="1040" y="464">loop; nerves constrict,</text><text class="s" x="1040" y="486">histamine dilates</text>
  <!-- footer -->
  <rect x="60" y="510" width="1080" height="190" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="540">From artery to vein</text>
  <text class="s" x="600" y="566">arteries divide into arterioles, which divide repeatedly into a dense network of capillaries; capillaries join into venules,</text>
  <text class="s" x="600" y="588">venules into veins, veins into the venae cavae (to the right atrium); the pulmonary veins empty into the left atrium.</text>
  <text class="s" x="600" y="618">Pressure in the capillaries leaks fluid into the tissues as interstitial fluid (water, nutrients, hormones, gases, wastes,</text>
  <text class="s" x="600" y="640">small proteins); large proteins, RBCs and platelets stay in, but some WBCs squeeze out between the cells.</text>
  <text class="s" x="600" y="670">No body cell is more than 100 micrometres from a capillary; the capillaries of an adult total over 80,600 km.</text>
</svg>
