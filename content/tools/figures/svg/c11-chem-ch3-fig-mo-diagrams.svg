<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <!-- Original diagram after Figures 3.34 to 3.38: bonding and antibonding orbitals, and the molecular orbital diagrams of He2, N2 and O2 with bond orders. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .l{font-size:12px;fill:#14181f;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
    </style>
  </defs>
  <text class="h" x="600" y="32">Molecular orbital theory: two atomic orbitals give a bonding and an antibonding orbital</text>
  <!-- s-s combination picture -->
  <g transform="translate(170 150)">
    <text class="k" x="0" y="-80">s + s</text>
    <circle cx="-40" cy="-30" r="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><circle cx="40" cy="-30" r="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
    <text class="l" x="-40" y="-26">+</text><text class="l" x="40" y="-26">+</text>
    <ellipse cx="0" cy="30" rx="62" ry="24" fill="#b2dbcc" stroke="#0f7a62" stroke-width="2"/><circle cx="-30" cy="30" r="4" fill="#14181f"/><circle cx="30" cy="30" r="4" fill="#14181f"/>
    <text class="s" x="0" y="72">same sign: sigma 1s bonding,</text><text class="s" x="0" y="88">density between the nuclei, lower energy</text>
    <circle cx="-40" cy="130" r="22" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><circle cx="40" cy="130" r="22" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/>
    <text class="l" x="-40" y="134">+</text><text class="l" x="40" y="134">-</text>
    <ellipse cx="-42" cy="190" rx="30" ry="20" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><ellipse cx="42" cy="190" rx="30" ry="20" fill="#f6d5cf" stroke="#d7322f" stroke-width="2"/><path d="M0 165 V215" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="-30" cy="190" r="4" fill="#14181f"/><circle cx="30" cy="190" r="4" fill="#14181f"/>
    <text class="s" x="0" y="232">opposite sign: sigma* 1s antibonding,</text><text class="s" x="0" y="248">node between the nuclei, higher energy</text>
  </g>
  <!-- p combos -->
  <g transform="translate(470 150)">
    <text class="k" x="0" y="-80">p + p</text>
    <ellipse cx="-70" cy="-30" rx="26" ry="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/><ellipse cx="-20" cy="-30" rx="26" ry="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="20" cy="-30" rx="26" ry="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/><ellipse cx="70" cy="-30" rx="26" ry="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
    <text class="s" x="0" y="0">head-on along the axis: sigma 2px and sigma* 2px</text>
    <ellipse cx="-45" cy="70" rx="12" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><ellipse cx="-45" cy="130" rx="12" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/>
    <ellipse cx="45" cy="70" rx="12" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/><ellipse cx="45" cy="130" rx="12" ry="26" fill="#e8dff7" stroke="#5b3fb5" stroke-width="2"/>
    <path d="M-80 100 H80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="-45" cy="100" r="4" fill="#14181f"/><circle cx="45" cy="100" r="4" fill="#14181f"/>
    <text class="s" x="0" y="175">sideways, parallel axes: pi 2py, pi 2pz (bonding)</text><text class="s" x="0" y="191">and pi* 2py, pi* 2pz; the nuclear axis is a nodal plane</text>
    <text class="s" x="0" y="232">bond order = (bonding electrons - antibonding electrons) / 2</text><text class="s" x="0" y="248">one lobe of a p orbital carries + and the other -</text>
  </g>
  <!-- MO diagram He2 -->
  <g transform="translate(780 180)">
    <text class="k" x="0" y="-110">He2: bond order (2 - 2)/2 = 0</text>
    <g stroke="#4b5563" stroke-width="2"><path d="M-110 0 H-70 M70 0 H110 M-20 -60 H20 M-20 60 H20"/></g>
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"><path d="M-70 0 L-20 -60 M-70 0 L-20 60 M70 0 L20 -60 M70 0 L20 60"/></g>
    <g stroke="#14181f" stroke-width="2"><path d="M-96 -2 v-14 M-84 -16 v14 M84 -2 v-14 M96 -16 v14 M-6 58 v-14 M6 44 v14"/></g>
    <g stroke="#d7322f" stroke-width="2"><path d="M-6 -62 v-14 M6 -76 v14"/></g>
    <g class="l"><text x="-90" y="22">He 1s</text><text x="90" y="22">He 1s</text><text x="0" y="-84" style="fill:#d7322f">sigma* 1s</text><text x="0" y="84">sigma 1s</text></g>
    <text class="s" x="0" y="110">two bonding, two antibonding: no molecule</text>
  </g>
  <!-- N2 and O2 diagrams -->
  <path d="M60 440 H1140" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- helper function levels drawn manually -->
  <g transform="translate(300 600)">
    <text class="k" x="0" y="-135">N2: bond order (6 - 0)/2 = 3 (one sigma, two pi)</text>
    <!-- atomic 2p left/right -->
    <g stroke="#4b5563" stroke-width="2"><path d="M-190 -40 H-170 M-165 -40 H-145 M-140 -40 H-120 M120 -40 H140 M145 -40 H165 M170 -40 H190"/></g>
    <g stroke="#14181f" stroke-width="2"><path d="M-180 -42 v-12 M-155 -42 v-12 M-130 -42 v-12 M130 -42 v-12 M155 -42 v-12 M180 -42 v-12"/></g>
    <text class="l" x="-155" y="-20">N 2p</text><text class="l" x="155" y="-20">N 2p</text>
    <!-- molecular levels -->
    <g stroke="#d7322f" stroke-width="2"><path d="M-12 -110 H12"/><path d="M-50 -82 H-26 M26 -82 H50"/></g>
    <g stroke="#0f7a62" stroke-width="2"><path d="M-12 -2 H12"/><path d="M-50 20 H-26 M26 20 H50"/></g>
    <g stroke="#14181f" stroke-width="2"><path d="M-6 -4 v-12 M6 -16 v12 M-44 18 v-12 M-32 6 v12 M32 18 v-12 M44 6 v12"/></g>
    <g class="l" style="text-anchor:start"><text x="60" y="-106" style="fill:#d7322f">sigma* 2px</text><text x="60" y="-78" style="fill:#d7322f">pi* 2py, pi* 2pz</text><text x="60" y="2" style="fill:#0f7a62">sigma 2px</text><text x="60" y="24" style="fill:#0f7a62">pi 2py, pi 2pz</text></g>
    <text class="s" x="0" y="60">order: sigma 2s &lt; sigma* 2s (both full, cancel) &lt; pi 2py = pi 2pz</text>
    <text class="s" x="0" y="78">&lt; sigma 2px &lt; pi* 2py = pi* 2pz &lt; sigma* 2px</text>
    <text class="s" x="0" y="96">six 2p electrons fill pi 2py, pi 2pz and sigma 2px: triple bond, no unpaired electrons</text>
  </g>
  <g transform="translate(900 600)">
    <text class="k" x="0" y="-135">O2: bond order (8 - 4)/2 = 2 (one sigma, one pi)</text>
    <g stroke="#4b5563" stroke-width="2"><path d="M-190 -40 H-170 M-165 -40 H-145 M-140 -40 H-120 M120 -40 H140 M145 -40 H165 M170 -40 H190"/></g>
    <g stroke="#14181f" stroke-width="2"><path d="M-186 -42 v-12 M-174 -54 v12 M-155 -42 v-12 M-130 -42 v-12 M126 -42 v-12 M134 -54 v12 M155 -42 v-12 M180 -42 v-12"/></g>
    <text class="l" x="-155" y="-20">O 2p</text><text class="l" x="155" y="-20">O 2p</text>
    <g stroke="#d7322f" stroke-width="2"><path d="M-12 -110 H12"/><path d="M-50 -82 H-26 M26 -82 H50"/></g>
    <g stroke="#0f7a62" stroke-width="2"><path d="M-12 20 H12"/><path d="M-50 -2 H-26 M26 -2 H50"/></g>
    <g stroke="#14181f" stroke-width="2"><path d="M-6 18 v-12 M6 6 v12 M-44 -4 v-12 M-32 -16 v12 M32 -4 v-12 M44 -16 v12"/></g>
    <g stroke="#d7322f" stroke-width="2.5"><path d="M-38 -84 v-12 M38 -84 v-12"/></g>
    <g class="l" style="text-anchor:start"><text x="60" y="-106" style="fill:#d7322f">sigma* 2px</text><text x="60" y="-78" style="fill:#d7322f">pi* 2py, pi* 2pz</text><text x="60" y="2" style="fill:#0f7a62">pi 2py, pi 2pz</text><text x="60" y="24" style="fill:#0f7a62">sigma 2px</text></g>
    <text class="s" x="0" y="60">order: sigma 2s &lt; sigma* 2s &lt; sigma 2px &lt; pi 2py = pi 2pz</text>
    <text class="s" x="0" y="78">&lt; pi* 2py = pi* 2pz &lt; sigma* 2px</text>
    <text class="s" x="0" y="96">eight 2p electrons: two unpaired in pi* orbitals, so O2 is paramagnetic</text>
  </g>
  <text class="s" x="600" y="735">Energy rises upward. Green: bonding levels; red: antibonding levels. The sigma 2s and sigma* 2s levels, both filled, are left out of the pictures.</text>
</svg>
