<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="550" fill="#ffffff"/>
  <!-- Original diagram for topic 32.5: the macronutrients (C, H, O, N, P, S, K, Ca, Mg, with N, P and K as primary) and micronutrients (B, Fe, Cu, Cl, Mn, Mo, Zn) listed in the book; the roles of N, P and K; and the effects of excess fertiliser. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Plant nutrients and fertilisers</text>
  <rect x="15.0" y="55.0" width="870.0" height="180.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">essential elements (as listed in the book)</text>
  <text x="40.0" y="132.0" font-size="14" fill="#1f6fb5" text-anchor="start" font-weight="700">macronutrients:</text>
  <circle cx="200.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="200.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">C</text>
  <circle cx="264.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="264.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">H</text>
  <circle cx="328.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="328.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">O</text>
  <circle cx="392.0" cy="127.0" r="22.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="392.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">N</text>
  <circle cx="456.0" cy="127.0" r="22.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="456.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">P</text>
  <circle cx="520.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="520.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">S</text>
  <circle cx="584.0" cy="127.0" r="22.0" stroke="#d7322f" stroke-width="2" fill="#fde2e1"/>
  <text x="584.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">K</text>
  <circle cx="648.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="648.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Ca</text>
  <circle cx="712.0" cy="127.0" r="22.0" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="712.0" y="133.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Mg</text>
  <text x="40.0" y="192.0" font-size="14" fill="#0f7a62" text-anchor="start" font-weight="700">micronutrients:</text>
  <circle cx="200.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="200.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <circle cx="264.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="264.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Fe</text>
  <circle cx="328.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="328.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Cu</text>
  <circle cx="392.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="392.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Cl</text>
  <circle cx="456.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="456.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Mn</text>
  <circle cx="520.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="520.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Mo</text>
  <circle cx="584.0" cy="187.0" r="22.0" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="584.0" y="193.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">Zn</text>
  <text x="860.0" y="133.0" font-size="12" fill="#d7322f" text-anchor="end" font-weight="700">red: primary</text>
  <rect x="15.0" y="245.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="275.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">N-P-K: the primary macronutrients</text>
  <rect x="35.0" y="292.0" width="265.0" height="140.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="167.0" y="322.0" font-size="26" fill="#1f6fb5" text-anchor="middle" font-weight="700">N</text>
  <text x="167.0" y="354.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">often the most limiting factor;</text>
  <text x="167.0" y="374.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">part of amino acids (proteins)</text>
  <text x="167.0" y="394.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">and of chlorophyll</text>
  <rect x="320.0" y="292.0" width="265.0" height="140.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="452.0" y="322.0" font-size="26" fill="#d98b2b" text-anchor="middle" font-weight="700">P</text>
  <text x="452.0" y="354.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">supplied as superphosphates or</text>
  <text x="452.0" y="374.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ammonium phosphates; part of</text>
  <text x="452.0" y="394.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">ATP, which stores energy</text>
  <rect x="605.0" y="292.0" width="265.0" height="140.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#efe7fd"/>
  <text x="737.0" y="322.0" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700">K</text>
  <text x="737.0" y="354.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">not part of the plant's structure;</text>
  <text x="737.0" y="374.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">acts as an osmoregulator and</text>
  <text x="737.0" y="394.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">activates over sixty enzymes</text>
  <text x="450.0" y="482.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Too much fertiliser: the excess washes into rivers and lakes, algae overgrow and harm aquatic life;</text>
  <text x="450.0" y="504.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">long-term use of some synthetic fertilisers changes soil pH and kills useful microorganisms.</text>
  <text x="450.0" y="541" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
