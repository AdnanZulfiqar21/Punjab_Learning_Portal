<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Arial, Helvetica, sans-serif">
  <!-- Valence-shell box diagram of phosphorus (3s2 3p3). Original answer figure for a self-check of this lesson; not the textbook's picture. -->
  <rect width="900" height="370" fill="#ffffff"/>
  <text x="450.0" y="56.0" font-size="36" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>P (Z = 15):  [Ne] 3s</tspan><tspan dy="-13.7" font-size="24.5">2</tspan><tspan dy="13.7"> 3p</tspan><tspan dy="-13.7" font-size="24.5">3</tspan><tspan dy="13.7"> </tspan></text>
  <rect x="150.0" y="100.0" width="100.0" height="100.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="183.0" y1="183.0" x2="183.0" y2="128.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M183.0 117.0 L189.6 129.4 L176.4 129.4 Z" fill="#0f7a62"/>
  <line x1="217.0" y1="117.0" x2="217.0" y2="171.8" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M217.0 183.0 L210.4 170.6 L223.6 170.6 Z" fill="#0f7a62"/>
  <rect x="450.0" y="100.0" width="300.0" height="100.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="550.0" y1="100.0" x2="550.0" y2="200.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="650.0" y1="100.0" x2="650.0" y2="200.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="500.0" y1="183.0" x2="500.0" y2="128.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M500.0 117.0 L506.6 129.4 L493.4 129.4 Z" fill="#0f7a62"/>
  <line x1="600.0" y1="183.0" x2="600.0" y2="128.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M600.0 117.0 L606.6 129.4 L593.4 129.4 Z" fill="#0f7a62"/>
  <line x1="700.0" y1="183.0" x2="700.0" y2="128.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M700.0 117.0 L706.6 129.4 L693.4 129.4 Z" fill="#0f7a62"/>
  <text x="200.0" y="246.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>3s</tspan></text>
  <text x="500.0" y="246.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>3p</tspan><tspan dy="7.0" font-size="19.0">x</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="600.0" y="246.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>3p</tspan><tspan dy="7.0" font-size="19.0">y</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="700.0" y="246.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>3p</tspan><tspan dy="7.0" font-size="19.0">z</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="200.0" y="300.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan>paired: opposite</tspan></text>
  <text x="200.0" y="334.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan>spins (Pauli)</tspan></text>
  <text x="600.0" y="300.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan>3 unpaired electrons, same</tspan></text>
  <text x="600.0" y="334.0" font-size="26" fill="#0f7a62" text-anchor="middle" font-weight="700"><tspan>spin (Hund's rule)</tspan></text>
</svg>
