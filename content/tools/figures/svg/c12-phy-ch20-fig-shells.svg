<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="490" fill="#ffffff"/>
  <!-- Original diagram after Fig 20.3: a fast electron knocks an electron out of the K shell of a heavy atom; an electron from the L shell falls into the hole and a K-alpha X-ray photon of energy EL - EK is emitted (K-beta, from the M shell, has energy EM - EK). -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Inner-shell transitions and characteristic X-rays (after Fig 20.3)</text>
  <circle cx="260.0" cy="250.0" r="60.0" stroke="#4b5563" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="316.0" y="268.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">K</text>
  <circle cx="260.0" cy="250.0" r="110.0" stroke="#4b5563" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="366.0" y="268.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">L</text>
  <circle cx="260.0" cy="250.0" r="160.0" stroke="#4b5563" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="416.0" y="268.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">M</text>
  <circle cx="260.0" cy="250.0" r="200.0" stroke="#4b5563" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="456.0" y="268.0" font-size="14" fill="#14181f" text-anchor="end" font-weight="700">N</text>
  <circle cx="260.0" cy="250.0" r="24.0" stroke="#d7322f" stroke-width="2" fill="#fca5a5"/>
  <text x="260.0" y="255.0" font-size="18" fill="#d7322f" text-anchor="middle" font-weight="700">+</text>
  <line x1="50.0" y1="445.0" x2="204.4" y2="285.7" stroke="#1f6fb5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M210.0 280.0 L206.7 289.4 L200.7 283.6 Z" fill="#1f6fb5"/>
  <text x="70.0" y="455.0" font-size="12" fill="#1f6fb5" text-anchor="start" font-weight="700">fast electron in</text>
  <circle cx="202.0" cy="265.0" r="8.0" stroke="#1f6fb5" stroke-width="1.5" fill="#bfdbfe"/>
  <line x1="202.0" y1="255.0" x2="113.4" y2="86.4" stroke="#1f6fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M110.0 80.0 L117.2 85.4 L110.4 89.0 Z" fill="#1f6fb5"/>
  <text x="110.0" y="70.0" font-size="12" fill="#1f6fb5" text-anchor="middle" font-weight="700">K electron knocked out</text>
  <circle cx="355.3" cy="195.0" r="7.0" stroke="#0f7a62" stroke-width="1.5" fill="#bbf7d0"/>
  <line x1="350.9" y1="197.5" x2="321.7" y2="214.4" stroke="#0f7a62" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M315.4 218.0 L320.6 210.6 L324.4 217.2 Z" fill="#0f7a62"/>
  <path d="M315.0 210.0 L317.1 209.5 L319.6 209.5 L321.3 208.5 L321.4 205.2 L320.5 200.6 L321.1 198.0 L323.7 198.3 L327.9 200.5 L332.0 202.7 L334.6 202.9 L335.2 200.3 L334.3 195.7 L333.4 191.1 L333.9 188.5 L336.6 188.7 L340.7 191.0 L344.8 193.2 L347.5 193.4 L348.1 190.8 L347.1 186.2 L346.2 181.6 L346.8 179.0 L349.4 179.2 L353.6 181.4 L357.7 183.6 L360.4 183.9 L360.9 181.3 L360.0 176.7 L359.1 172.1 L359.6 169.5 L362.3 169.7 L366.4 171.9 L370.6 174.1 L373.2 174.3 L373.8 171.7 L372.9 167.1 L371.9 162.5 L372.5 159.9 L375.2 160.2 L379.3 162.4 L383.4 164.6 L386.1 164.8 L386.6 162.2 L385.7 157.6 L384.8 153.0 L385.4 150.4 L388.0 150.6 L392.1 152.9 L396.3 155.1 L398.9 155.3 L399.5 152.7 L398.6 148.1 L397.7 143.5 L398.2 140.9 L400.9 141.1 L405.0 143.3 L409.1 145.6 L411.8 145.8 L412.3 143.2 L411.4 138.6 L410.5 134.0 L411.1 131.4 L413.7 131.6 L417.9 133.8 L422.0 136.0 L424.6 136.2 L425.2 133.6 L424.3 129.0 L423.4 124.4 L423.9 121.8 L426.6 122.1 L430.7 124.3 L434.8 126.5 L437.5 126.7 L438.1 124.1 L437.1 119.5 L436.2 114.9 L436.8 112.3 L439.4 112.5 L443.6 114.8 L446.7 115.6 L448.2 114.3 L448.9 111.9 L450.0 110.0" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M450.0 110.0 L445.7 117.9 L441.2 111.8 Z" fill="#7c3aed"/>
  <text x="456.0" y="110.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">K-alpha X-ray</text>
  <rect x="580.0" y="80.0" width="305.0" height="330.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="732.5" y="110.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">photon energies</text>
  <text x="595.0" y="140.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">K-alpha:  hf = E</tspan><tspan dy="5.1" font-size="11.2">L</tspan><tspan dy="-5.1"> - E</tspan><tspan dy="5.1" font-size="11.2">K</tspan></text>
  <text x="595.0" y="176.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700"><tspan dy="0.0">K-beta:  hf = E</tspan><tspan dy="5.1" font-size="11.2">M</tspan><tspan dy="-5.1"> - E</tspan><tspan dy="5.1" font-size="11.2">K</tspan></text>
  <text x="595.0" y="212.0" font-size="16" fill="#4b5563" text-anchor="start" font-weight="700"><tspan dy="0.0">(K-beta has more energy)</tspan></text>
  <text x="595.0" y="270.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">These energies depend on the</text>
  <text x="595.0" y="291.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">target metal, so the lines are</text>
  <text x="595.0" y="312.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">called characteristic X-rays.</text>
  <text x="595.0" y="333.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">More lines follow as the L</text>
  <text x="595.0" y="354.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="400">and M holes fill.</text>
  <text x="450.0" y="481" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
