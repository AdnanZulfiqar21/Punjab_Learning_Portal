<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- Original: collection, exploring, modelling and decision making with a feedback loop. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">The data science workflow (after Fig 6.1)</text>
  <rect x="30.0" y="138.0" width="180.0" height="64.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#dbe9f5"/>
  <text x="120.0" y="168.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">1 collection</text>
  <text x="120.0" y="184.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">gather and process</text>
  <line x1="212.0" y1="170.0" x2="238.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M246.0 170.0 L236.9 174.2 L236.9 165.8 Z" fill="#14181f"/>
  <rect x="250.0" y="138.0" width="180.0" height="64.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#dff5f7"/>
  <text x="340.0" y="168.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">2 exploring</text>
  <text x="340.0" y="184.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">explore and clean</text>
  <line x1="432.0" y1="170.0" x2="458.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M466.0 170.0 L456.9 174.2 L456.9 165.8 Z" fill="#14181f"/>
  <rect x="470.0" y="138.0" width="180.0" height="64.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#fff1dc"/>
  <text x="560.0" y="168.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">3 modelling</text>
  <text x="560.0" y="184.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">train and test</text>
  <line x1="652.0" y1="170.0" x2="678.0" y2="170.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M686.0 170.0 L676.9 174.2 L676.9 165.8 Z" fill="#14181f"/>
  <rect x="690.0" y="138.0" width="180.0" height="64.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#e6f4ef"/>
  <text x="780.0" y="168.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">4 decision making</text>
  <text x="780.0" y="184.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">insights and actions</text>
  <path d="M780 205 Q780 320 450 320 Q120 320 120 205" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120.0 205.0 L124.6 215.0 L115.4 215.0 Z" fill="#7c3aed"/>
  <text x="450.0" y="348.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">feedback loop: results lead to new questions and new data</text>
  <text x="450.0" y="390.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Data science turns raw data into knowledge using mathematics, statistics,</text>
  <text x="450.0" y="408.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">computer science, knowledge of the subject area and clear communication.</text>
  <text x="450.0" y="431" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
