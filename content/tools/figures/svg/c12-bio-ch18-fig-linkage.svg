<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figure 18.10: an F1 fly with L and B on one chromosome and l and b on its homologue, the 9:3:3:1 expected if the genes assorted independently, the 3:1 of parental types only that Morgan observed, and how testcross results reveal linkage. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Gene linkage: genes on the same chromosome stay together</text>
  <rect x="15.0" y="55.0" width="330.0" height="400.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="180.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">F1 fly: LlBb</text>
  <rect x="129.0" y="110.0" width="22.0" height="270.0" rx="11" stroke="#2563eb" stroke-width="2" fill="#bfdbfe"/>
  <ellipse cx="140.0" cy="190.0" rx="13.0" ry="7.0" stroke="#2563eb" stroke-width="1.5" fill="#ffffff"/>
  <rect x="129.0" y="261.0" width="22.0" height="18.0" rx="0" stroke="#14181f" stroke-width="1" fill="#fde68a"/>
  <text x="140.0" y="275.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">L</text>
  <rect x="129.0" y="321.0" width="22.0" height="18.0" rx="0" stroke="#14181f" stroke-width="1" fill="#fde68a"/>
  <text x="140.0" y="335.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">B</text>
  <rect x="199.0" y="110.0" width="22.0" height="270.0" rx="11" stroke="#dc2626" stroke-width="2" fill="#fecaca"/>
  <ellipse cx="210.0" cy="190.0" rx="13.0" ry="7.0" stroke="#dc2626" stroke-width="1.5" fill="#ffffff"/>
  <rect x="199.0" y="261.0" width="22.0" height="18.0" rx="0" stroke="#14181f" stroke-width="1" fill="#fde68a"/>
  <text x="210.0" y="275.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">l</text>
  <rect x="199.0" y="321.0" width="22.0" height="18.0" rx="0" stroke="#14181f" stroke-width="1" fill="#fde68a"/>
  <text x="210.0" y="335.0" font-size="14" fill="#14181f" text-anchor="middle" font-weight="700">b</text>
  <text x="180.0" y="410.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">L (long wing) and B (broad abdomen)</text>
  <text x="180.0" y="428.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">sit on the same chromosome</text>
  <rect x="360.0" y="55.0" width="525.0" height="190.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="622.5" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">if the genes assorted independently</text>
  <rect x="400.0" y="100.0" width="112.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
  <text x="456.0" y="132.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">9</text>
  <text x="456.0" y="160.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">long, broad</text>
  <text x="456.0" y="182.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">parental</text>
  <rect x="522.0" y="100.0" width="112.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#fff1dc"/>
  <text x="578.0" y="132.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <text x="578.0" y="160.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">long, narrow</text>
  <text x="578.0" y="182.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">new</text>
  <rect x="644.0" y="100.0" width="112.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#fff1dc"/>
  <text x="700.0" y="132.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <text x="700.0" y="160.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">vestigial, broad</text>
  <text x="700.0" y="182.0" font-size="12" fill="#d98b2b" text-anchor="middle" font-weight="700">new</text>
  <rect x="766.0" y="100.0" width="112.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
  <text x="822.0" y="132.0" font-size="24" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <text x="822.0" y="160.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">vestigial, narrow</text>
  <text x="822.0" y="182.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">parental</text>
  <rect x="360.0" y="260.0" width="525.0" height="195.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="622.5" y="290.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">what Morgan observed in F2</text>
  <rect x="400.0" y="305.0" width="220.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
  <text x="510.0" y="345.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">3</text>
  <text x="510.0" y="375.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">long wings, broad abdomen</text>
  <text x="510.0" y="398.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">parental combination</text>
  <rect x="640.0" y="305.0" width="220.0" height="120.0" rx="8" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
  <text x="750.0" y="345.0" font-size="26" fill="#14181f" text-anchor="middle" font-weight="700">1</text>
  <text x="750.0" y="375.0" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">vestigial wings, narrow abdomen</text>
  <text x="750.0" y="398.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">parental combination</text>
  <rect x="40.0" y="475.0" width="820.0" height="140.0" rx="10" stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"/>
  <text x="450.0" y="502.0" font-size="15" fill="#14181f" text-anchor="middle" font-weight="700">how a cross detects linkage (testcross offspring)</text>
  <text x="70.0" y="534.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">parental and new types 1 : 1 : 1 : 1</text>
  <line x1="400.0" y1="529.0" x2="444.4" y2="529.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M450.0 529.0 L443.7 532.0 L443.7 526.0 Z" fill="#4b5563"/>
  <text x="465.0" y="534.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">not linked (independent assortment)</text>
  <text x="70.0" y="560.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">parental types many, new types few</text>
  <line x1="400.0" y1="555.0" x2="444.4" y2="555.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M450.0 555.0 L443.7 558.0 L443.7 552.0 Z" fill="#4b5563"/>
  <text x="465.0" y="560.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">incomplete linkage (crossing over)</text>
  <text x="70.0" y="586.0" font-size="13" fill="#14181f" text-anchor="start" font-weight="700">parental types only, no new types</text>
  <line x1="400.0" y1="581.0" x2="444.4" y2="581.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M450.0 581.0 L443.7 584.0 L443.7 578.0 Z" fill="#4b5563"/>
  <text x="465.0" y="586.0" font-size="13" fill="#1f6fb5" text-anchor="start" font-weight="700">complete linkage</text>
  <text x="450.0" y="631" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
