<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- Original diagram for topic 31.6.1(a): thermal cracking of decane, C10H22 -&gt; C8H18 + C2H4, drawn as carbon skeletons, and catalytic cracking of naphtha to ethene and propene over zeolite or silica-alumina at about 500 C. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Cracking: breaking large hydrocarbon molecules</text>
  <rect x="15.0" y="55.0" width="870.0" height="215.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">thermal cracking (example from the text)</text>
  <line x1="60.0" y1="135.0" x2="90.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="90.0" y1="118.0" x2="120.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="120.0" y1="135.0" x2="150.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="150.0" y1="118.0" x2="180.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="180.0" y1="135.0" x2="210.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="210.0" y1="118.0" x2="240.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="240.0" y1="135.0" x2="270.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="270.0" y1="118.0" x2="300.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="300.0" y1="135.0" x2="330.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="285.0" y1="98.0" x2="285.0" y2="150.0" stroke="#d7322f" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="365.0" y1="125.0" x2="436.2" y2="125.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M445.0 125.0 L435.0 129.6 L435.0 120.4 Z" fill="#14181f"/>
  <text x="405.0" y="112.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">heat</text>
  <line x1="480.0" y1="135.0" x2="510.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="510.0" y1="118.0" x2="540.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="540.0" y1="135.0" x2="570.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="570.0" y1="118.0" x2="600.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="600.0" y1="135.0" x2="630.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="630.0" y1="118.0" x2="660.0" y2="135.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="660.0" y1="135.0" x2="690.0" y2="118.0" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="715.0" y="132.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <line x1="750.0" y1="123.5" x2="800.0" y2="123.5" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="750.0" y1="128.5" x2="800.0" y2="128.5" stroke="#14181f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="195.0" y="183.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.8" font-size="12.6">10</tspan><tspan dy="-5.8">H</tspan><tspan dy="5.8" font-size="12.6">22</tspan></text>
  <text x="195.0" y="205.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">decane</text>
  <text x="585.0" y="183.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.8" font-size="12.6">8</tspan><tspan dy="-5.8">H</tspan><tspan dy="5.8" font-size="12.6">18</tspan></text>
  <text x="585.0" y="205.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">octane</text>
  <text x="775.0" y="183.0" font-size="18" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="5.8" font-size="12.6">2</tspan><tspan dy="-5.8">H</tspan><tspan dy="5.8" font-size="12.6">4</tspan></text>
  <text x="775.0" y="205.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">ethene</text>
  <text x="450.0" y="248.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">450-750 C and high pressure, no catalyst: needs much energy; gives a high percentage of alkenes</text>
  <rect x="15.0" y="285.0" width="870.0" height="205.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="315.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">catalytic cracking</text>
  <text x="190.0" y="355.0" font-size="16" fill="#14181f" text-anchor="middle" font-weight="700">naphtha (heavy hydrocarbons)</text>
  <line x1="355.0" y1="350.0" x2="461.2" y2="350.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M470.0 350.0 L460.0 354.6 L460.0 345.4 Z" fill="#14181f"/>
  <text x="412.0" y="337.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">catalyst</text>
  <text x="540.0" y="357.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">H</tspan><tspan dy="6.1" font-size="13.3">4</tspan></text>
  <text x="540.0" y="380.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">ethene</text>
  <text x="660.0" y="357.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">C</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">H</tspan><tspan dy="6.1" font-size="13.3">6</tspan></text>
  <text x="660.0" y="380.0" font-size="12" fill="#d7322f" text-anchor="middle" font-weight="700">propene</text>
  <text x="600.0" y="355.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700">+</text>
  <text x="450.0" y="420.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">catalyst: zeolites (aluminosilicates) or silica-alumina; about 500 C and lower pressures:</text>
  <text x="450.0" y="440.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">less energy, better control of products; the method used most in modern refineries</text>
  <text x="450.0" y="511" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
