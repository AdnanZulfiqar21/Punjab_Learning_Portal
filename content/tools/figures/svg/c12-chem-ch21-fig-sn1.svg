<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Original SN1 scheme after the book: 2-bromo-2-methylpropane ionises slowly to the tertiary carbocation and Br-, which OH- then joins quickly; rate = k[halogenoalkane]; carbocation stability tertiary &gt; secondary &gt; primary &gt; methyl. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">SN1: two steps through a carbocation</text>
  <rect x="15.0" y="55.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="85.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">step 1 (slow): ionisation</text>
  <text x="150.0" y="135.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C-Br</tspan></text>
  <line x1="255.0" y1="128.0" x2="336.2" y2="128.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M345.0 128.0 L335.0 132.6 L335.0 123.4 Z" fill="#14181f"/>
  <text x="300.0" y="118.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">slow</tspan></text>
  <text x="470.0" y="135.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C</tspan><tspan dy="-8.4" font-size="14.0">+</tspan><tspan dy="8.4"> + Br</tspan><tspan dy="-8.4" font-size="14.0">-</tspan></text>
  <text x="720.0" y="135.0" font-size="14" fill="#4b5563" text-anchor="start" font-weight="700">a tertiary carbocation</text>
  <rect x="15.0" y="205.0" width="870.0" height="140.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="235.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">step 2 (fast): the nucleophile joins the carbocation</text>
  <text x="150.0" y="285.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C</tspan><tspan dy="-8.4" font-size="14.0">+</tspan><tspan dy="8.4"> + OH</tspan><tspan dy="-8.4" font-size="14.0">-</tspan></text>
  <line x1="275.0" y1="278.0" x2="336.2" y2="278.0" stroke="#14181f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M345.0 278.0 L335.0 282.6 L335.0 273.4 Z" fill="#14181f"/>
  <text x="310.0" y="268.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">fast</tspan></text>
  <text x="450.0" y="285.0" font-size="20" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">)</tspan><tspan dy="6.4" font-size="14.0">3</tspan><tspan dy="-6.4">C-OH</tspan></text>
  <text x="620.0" y="285.0" font-size="14" fill="#14181f" text-anchor="start" font-weight="700">rate = k [halogenoalkane]: first order</text>
  <rect x="15.0" y="355.0" width="870.0" height="170.0" rx="14" stroke="#cbd5e1" stroke-width="2" fill="#f7f9fc"/>
  <text x="450.0" y="385.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700">carbocation stability (alkyl groups push electrons: +I effect)</text>
  <text x="125.0" y="440.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">C</tspan><tspan dy="-8.0" font-size="13.3">+</tspan></text>
  <text x="125.0" y="475.0" font-size="14" fill="#0f7a62" text-anchor="middle" font-weight="700">tertiary</text>
  <text x="233.0" y="445.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">&gt;</text>
  <text x="340.0" y="440.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">(CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">)</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-6.1">CH</tspan><tspan dy="-8.0" font-size="13.3">+</tspan></text>
  <text x="340.0" y="475.0" font-size="14" fill="#d98b2b" text-anchor="middle" font-weight="700">secondary</text>
  <text x="448.0" y="445.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">&gt;</text>
  <text x="555.0" y="440.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-6.1">CH</tspan><tspan dy="6.1" font-size="13.3">2</tspan><tspan dy="-14.1" font-size="13.3">+</tspan></text>
  <text x="555.0" y="475.0" font-size="14" fill="#d7322f" text-anchor="middle" font-weight="700">primary</text>
  <text x="663.0" y="445.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">&gt;</text>
  <text x="770.0" y="440.0" font-size="19" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">CH</tspan><tspan dy="6.1" font-size="13.3">3</tspan><tspan dy="-14.1" font-size="13.3">+</tspan></text>
  <text x="770.0" y="475.0" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="700">methyl</text>
  <text x="450.0" y="510.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">most stable  -&gt;  least stable: tertiary halogenoalkanes react by SN1</text>
  <text x="450.0" y="551" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
