<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="250" fill="#ffffff"/>
  <!-- Quick Check 19.5 (a) (C12-CHEM, PDF p47): the printed bond-line structure, as printed: Br at the left, a zig-zag of two carbons to the carboxyl carbon with C=O up and OH to the right (3-bromopropanoic acid). Original drawing after the printed structure. -->
  <text x="115.0" y="205.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400">Br</text>
  <line x1="145.0" y1="182.0" x2="250.0" y2="130.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="250.0" y1="130.0" x2="350.0" y2="190.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="350.0" y1="190.0" x2="450.0" y2="130.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="450.0" y1="130.0" x2="540.0" y2="182.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="443.0" y1="130.0" x2="443.0" y2="62.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="457.0" y1="130.0" x2="457.0" y2="62.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <text x="450.0" y="52.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400">O</text>
  <text x="578.0" y="207.0" font-size="32" fill="#14181f" text-anchor="middle" font-weight="400">OH</text>
</svg>
