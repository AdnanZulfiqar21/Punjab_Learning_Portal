<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.12 and 4.13 and topic 4.8: a falling body's potential and kinetic energy, with and without friction, and Examples 4.5 and 4.6. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Interconversion of potential energy and kinetic energy</text>
  <!-- falling body -->
  <rect x="50" y="55" width="420" height="380" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="260" y="83">A body falling from height h (Fig. 4.12)</text>
  <path d="M120 400 H400" stroke="#4b5563" stroke-width="3"/>
  <rect x="200" y="110" width="50" height="28" fill="#c7d9b0" stroke="#4b5563" stroke-width="1.5"/>
  <text class="l" x="218" y="129">m</text>
  <path d="M225 140 V392" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="225" cy="260" r="7" fill="#f8c8b8" stroke="#4b5563"/>
  <path d="M290 124 V252" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="296" y="192">x</text>
  <path d="M320 124 V392" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="326" y="262">h</text>
  <path d="M260 268 V392" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="236" y="336">h - x</text>
  <text class="l" x="256" y="118">A</text><text class="l" x="200" y="266">B</text><text class="l" x="236" y="418">C</text>
  <g class="f" style="font-size:11px">
    <text x="60" y="118">A: PE = m g h, KE = 0</text>
    <text x="60" y="258">B: PE = m g (h - x)</text>
    <text x="60" y="274">   vB^2 = 2 g x, KE = m g x</text>
    <text x="60" y="380">C: PE = 0, vC^2 = 2 g h</text>
    <text x="60" y="396">   KE = (1/2) m vC^2 = m g h</text>
  </g>
  <text class="f" x="70" y="430" style="font-size:11px">total at B = m g (h - x) + m g x = m g h (4.19)</text>
  <!-- loss = gain -->
  <rect x="490" y="55" width="330" height="380" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="655" y="83">Loss in PE = gain in KE (Fig. 4.13)</text>
  <path d="M560 400 H760" stroke="#4b5563" stroke-width="3"/>
  <rect x="600" y="120" width="50" height="28" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="600" y="230" width="50" height="28" fill="#c7d9b0" stroke="#4b5563" stroke-width="1.5"/>
  <text class="l" x="618" y="249">m</text>
  <path d="M625 150 V222" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="632" y="190">v1</text>
  <path d="M625 260 V392" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text class="r" x="632" y="330">v2</text>
  <path d="M690 134 V392" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="696" y="262">h1</text>
  <path d="M720 244 V392" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/><text class="r" x="726" y="320">h2</text>
  <g class="f" style="font-size:11px">
    <text x="505" y="420">m g (h1 - h2) = (1/2) m (v2^2 - v1^2) (4.20),</text>
    <text x="505" y="432">without friction</text>
  </g>
  <!-- friction -->
  <rect x="840" y="55" width="310" height="380" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="995" y="83">With friction f (4.21)</text>
  <g class="f">
    <text x="860" y="116">m g h - f h = (1/2) m v^2</text>
    <text x="860" y="136">m g h = (1/2) m v^2 + f h (4.21)</text>
  </g>
  <g class="t">
    <text x="860" y="166">a part f h of the PE is used in doing work</text>
    <text x="860" y="182">against friction; the rest becomes KE</text>
    <text x="860" y="210"><tspan class="b">loss in PE</tspan> = gain in KE + work against friction</text>
    <text x="860" y="230"><tspan class="b">loss of KE</tspan> = gain in PE + work against friction</text>
    <text x="860" y="262">as a body falls its velocity rises under gravity,</text>
    <text x="860" y="278">so its KE rises; its height falls, so its PE falls;</text>
    <text x="860" y="294">at C the KE equals the original PE</text>
    <text x="860" y="326"><tspan class="b">Example 4.6:</tspan> 3 kg falls 15 m and lands at 16 m s^-1:</text>
    <text x="860" y="342">3 x 9.8 x 15 = (1/2)(3)(16)^2 + f x 15</text>
    <text x="860" y="358">441 = 384 + 15 f, f = 3.8 N (average air friction)</text>
    <text x="860" y="390">kinetic and potential energy are both</text>
    <text x="860" y="406">forms of mechanical energy</text>
  </g>
  <!-- example 4.5 -->
  <rect x="50" y="455" width="1100" height="155" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="483">Example 4.5: car of 1100 kg at 12 m s^-1, engine stops at P, friction 120 N</text>
  <path d="M90 590 L330 550 H420" stroke="#4b5563" stroke-width="2.5" fill="none"/>
  <path d="M90 590 H330" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M330 590 V552" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/>
  <text class="r" x="80" y="604">P</text><text class="r" x="326" y="544">Q</text><text class="r" x="422" y="544">R</text>
  <text class="r" x="180" y="562">24 m</text><text class="r" x="338" y="578">1.5 m</text>
  <g class="t">
    <text x="460" y="512">P to Q: loss of KE = gain in PE + work against friction: (1/2) m (vi^2 - vf^2) = w h + f d</text>
    <text x="460" y="530">550 (144 - vf^2) = 1100 x 9.8 x 1.5 + 120 x 24 = 16170 + 2880, so 144 - vf^2 = 34.6, vf^2 = 109.4, vf = 10.5 m s^-1 at Q</text>
    <text x="460" y="558">Q to R (level): (1/2) m v^2 = f S, (1/2)(1100)(109.4) = 120 S, S = 501 m approximately before coming to rest</text>
    <text x="460" y="590">the KE at P is partly converted into PE and partly used up in doing work against friction up to Q</text>
  </g>
  <text class="s" x="600" y="632" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
