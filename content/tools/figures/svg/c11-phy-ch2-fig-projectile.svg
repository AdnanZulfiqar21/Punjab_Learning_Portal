<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figure 2.8 and topic 2.6: horizontal throw, a projectile fired at an angle, height, time of flight, range and the effect of air resistance. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:12px;fill:#4b5563}
      .b{font-weight:700;fill:#14181f}
      .f{font-family:Consolas, Courier New, monospace;font-size:12px;fill:#14181f}
      .r{font-size:11px;fill:#4b5563}
      .l{font-size:12px;font-weight:700;fill:#14181f}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a62"/></marker>
  </defs>
  <text class="h" x="600" y="32">Projectile motion: two-dimensional motion under constant acceleration g</text>
  <!-- horizontal throw -->
  <rect x="50" y="55" width="360" height="300" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">Thrown horizontally (Fig. 2.8a)</text>
  <path d="M90 300 H380" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M90 300 V100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M90 120 Q 250 130 340 300" fill="none" stroke="#d7322f" stroke-width="3"/>
  <g stroke="#1f6fb5" stroke-width="2.5" fill="none">
    <path d="M90 120 H140" marker-end="url(#bl)"/><path d="M196 145 H246" marker-end="url(#bl)"/><path d="M270 200 H320" marker-end="url(#bl)"/>
  </g>
  <g stroke="#0f7a62" stroke-width="2.5" fill="none">
    <path d="M196 145 V175" marker-end="url(#g)"/><path d="M270 200 V255" marker-end="url(#g)"/>
  </g>
  <text class="l" x="76" y="124">A</text>
  <text class="l" x="100" y="112" style="fill:#1f6fb5">vx</text>
  <text class="l" x="76" y="304">B</text>
  <text class="l" x="336" y="318">C</text>
  <text class="l" x="370" y="318">X</text>
  <text class="l" x="76" y="98">Y</text>
  <g class="t">
    <text x="70" y="326">x = vx t (constant horizontal velocity);</text>
    <text x="70" y="340">y = (1/2) g t^2 (free fall); the two motions are</text>
    <text x="70" y="354">independent; vx unchanged until the ball lands</text>
  </g>
  <!-- angled -->
  <rect x="430" y="55" width="360" height="300" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="610" y="83">Fired at angle theta (Fig. 2.8b)</text>
  <path d="M460 300 H770" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M460 300 V100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M460 300 Q 600 60 740 300" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M460 300 L520 240" stroke="#1f6fb5" stroke-width="2.5" marker-end="url(#bl)"/>
  <path d="M600 180 V300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M490 300 A 30 30 0 0 0 481 279" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text class="l" x="494" y="294">theta</text>
  <text class="l" x="520" y="236" style="fill:#1f6fb5">vi</text>
  <text class="l" x="606" y="246">h</text>
  <text class="l" x="590" y="318">R</text>
  <text class="l" x="448" y="304">O</text>
  <g class="t">
    <text x="450" y="326">vfx = vi cos theta (constant, ax = 0);</text>
    <text x="450" y="340">vfy = vi sin theta - g t (ay = -g upward);</text>
    <text x="450" y="354">v = sqrt(vfx^2 + vfy^2); tan phi = vfy / vfx</text>
  </g>
  <!-- formulas -->
  <rect x="810" y="55" width="340" height="300" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="980" y="83">Height, time of flight, range</text>
  <g class="t"><text x="830" y="110"><tspan class="b">height:</tspan> at the top vfy = 0, S = h, a = -g</text></g>
  <text class="f" x="830" y="132">h = vi^2 sin^2 theta / (2 g)      (2.22)</text>
  <g class="t"><text x="830" y="160"><tspan class="b">time of flight:</tspan> S = h = 0 on return</text></g>
  <text class="f" x="830" y="182">t = 2 vi sin theta / g            (2.23)</text>
  <g class="t"><text x="830" y="210"><tspan class="b">range:</tspan> R = vix x t = vi cos theta x 2 vi sin theta / g</text></g>
  <text class="f" x="830" y="232">R = vi^2 sin 2theta / g           (2.24)</text>
  <g class="t">
    <text x="830" y="260">maximum range when sin 2theta = 1, 2theta = 90 degrees,</text>
    <text x="830" y="276">theta = 45 degrees</text>
    <text x="830" y="300">below 45 degrees: lower height and shorter range;</text>
    <text x="830" y="316">above 45 degrees: greater height but again a shorter</text>
    <text x="830" y="332">range (Do You Know)</text>
  </g>
  <!-- bottom -->
  <rect x="50" y="375" width="1100" height="280" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="403">Example 2.5, air resistance and the two-ball photograph</text>
  <g class="t">
    <text x="70" y="430"><tspan class="b">Example 2.5:</tspan> a ball thrown at 30 m s^-1 at 30 degrees above the horizon: vix = 30 cos 30 = 25.98 m s^-1, viy = 30 sin 30 = 15 m s^-1</text>
    <text x="70" y="450">time of flight t = 2 x 15 / 9.8 = 3.1 s; height h = (30)^2 (0.5)^2 / 19.6 = 11.5 m; range R = (30)^2 sin 60 / 9.8 = 900 x 0.866 / 9.8 = 89.53 m (as printed)</text>
    <text x="70" y="482"><tspan class="b">air resistance:</tspan> slows the forward motion, reducing vi and so the range; it is not constant through the flight, since it falls as the</text>
    <text x="70" y="500">object slows, so the object retards more slowly and accelerates more slowly as it falls: the path is skewed, with a steeper descent than ascent,</text>
    <text x="70" y="518">and a high-speed projectile falls short of the parabolic path (For Your Information); the height also decreases in the presence of air resistance</text>
    <text x="70" y="550"><tspan class="b">photograph (Interesting Information):</tspan> two balls released at the same instant, one dropped freely and the other projected horizontally,</text>
    <text x="70" y="568">are at the same level at every moment: their vertical displacements are equal, because the horizontal velocity does not affect the vertical fall</text>
    <text x="70" y="600"><tspan class="b">projectiles:</tspan> a football kicked by a player, a ball thrown by a cricketer, a missile fired from a launching pad, all projected at some angle</text>
    <text x="70" y="618">with the horizontal; the only force during flight is gravity (air friction ignored), so there is no horizontal acceleration (Newton's first law)</text>
  </g>
  <text class="s" x="600" y="672" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
