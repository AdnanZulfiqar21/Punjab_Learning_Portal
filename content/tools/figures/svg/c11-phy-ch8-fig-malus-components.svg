<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- Original redraw after Figure 8.7(b): the amplitude A0 split into A0 cos theta along the analyzer axis and A0 sin theta across it. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Why I = I0 cos^2 theta: resolve the amplitude</text>
  <line x1="330.0" y1="400.0" x2="330.0" y2="70.0" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <text x="330.0" y="60.0" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="700">polarizer axis</text>
  <line x1="330.0" y1="400.0" x2="519.3" y2="129.7" stroke="#d98b2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <text x="525.3" y="129.7" font-size="15" fill="#d98b2b" text-anchor="start" font-weight="700">analyzer axis</text>
  <line x1="330.0" y1="400.0" x2="330.0" y2="120.4" stroke="#d7322f" stroke-width="4" stroke-linecap="round"/>
  <path d="M330.0 110.0 L335.5 121.8 L324.5 121.8 Z" fill="#d7322f"/>
  <text x="318.0" y="255.0" font-size="20" fill="#d7322f" text-anchor="end" font-weight="700">A0</text>
  <line x1="330.0" y1="400.0" x2="460.3" y2="213.9" stroke="#0f7a62" stroke-width="4" stroke-linecap="round"/>
  <path d="M466.3 205.4 L464.0 218.2 L455.0 211.9 Z" fill="#0f7a62"/>
  <text x="476.3" y="225.4" font-size="17" fill="#0f7a62" text-anchor="start" font-weight="700">A0 cos theta (passes)</text>
  <line x1="330.0" y1="110.0" x2="466.3" y2="205.4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="330.0" y1="400.0" x2="202.3" y2="310.6" stroke="#1f6fb5" stroke-width="4" stroke-linecap="round"/>
  <path d="M193.7 304.6 L206.5 306.9 L200.2 315.9 Z" fill="#1f6fb5"/>
  <text x="183.7" y="304.6" font-size="16" fill="#1f6fb5" text-anchor="end" font-weight="700">A0 sin theta (blocked)</text>
  <path d="M330.0 330.0 A70 70 0 0 1 370.2 342.7" stroke="#14181f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="348.0" y="318.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="700">theta</text>
  <rect x="600.0" y="330.0" width="270.0" height="110.0" rx="8" stroke="#d98b2b" stroke-width="1.5" fill="#fff1dc"/>
  <text x="616.0" y="360.0" font-size="16" fill="#14181f" text-anchor="start" font-weight="400">intensity is proportional</text>
  <text x="616.0" y="380.8" font-size="16" fill="#14181f" text-anchor="start" font-weight="400">to amplitude squared:</text>
  <text x="616.0" y="401.6" font-size="16" fill="#14181f" text-anchor="start" font-weight="400">I = I0 cos^2 theta</text>
  <text x="450.0" y="461" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
