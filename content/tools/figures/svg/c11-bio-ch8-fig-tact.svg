<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="900" fill="#ffffff"/>
  <!-- Original diagram after Figure 8.9: the TACT mechanism of water flow from root to leaf. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:21px;font-weight:700;fill:#14181f}
      .s{font-size:18px;fill:#4b5563}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="550" y="40">The TACT mechanism: water from root to leaf</text>
  <!-- stem xylem column -->
  <rect x="440" y="180" width="60" height="560" fill="#dbe9f5" stroke="#8a4b00" stroke-width="6"/>
  <!-- water molecules chain -->
  <g fill="#1f6fb5"><circle cx="470" cy="220" r="9"/><circle cx="470" cy="260" r="9"/><circle cx="470" cy="300" r="9"/><circle cx="470" cy="340" r="9"/><circle cx="470" cy="380" r="9"/><circle cx="470" cy="420" r="9"/><circle cx="470" cy="460" r="9"/><circle cx="470" cy="500" r="9"/><circle cx="470" cy="540" r="9"/><circle cx="470" cy="580" r="9"/><circle cx="470" cy="620" r="9"/><circle cx="470" cy="660" r="9"/><circle cx="470" cy="700" r="9"/></g>
  <g stroke="#1f6fb5" stroke-width="3" stroke-dasharray="4 3"><path d="M470 229 V251 M470 269 V291 M470 309 V331 M470 349 V371 M470 389 V411 M470 429 V451 M470 469 V491 M470 509 V531 M470 549 V571 M470 589 V611 M470 629 V651 M470 669 V691"/></g>
  <!-- adhesion ticks to walls -->
  <g stroke="#d98b2b" stroke-width="3"><path d="M461 300 L446 300 M479 300 L494 300 M461 460 L446 460 M479 460 L494 460 M461 620 L446 620 M479 620 L494 620"/></g>
  <!-- leaf at top -->
  <path d="M500 180 q120 -80 200 -20 q-60 90 -200 20 z" fill="#b2dbcc" stroke="#0f7a62" stroke-width="5"/>
  <g stroke="#1f6fb5" stroke-width="3" marker-end="url(#ar)"><path d="M600 130 L640 80"/><path d="M640 150 L690 110"/><path d="M560 120 L580 70"/></g>
  <text class="k" x="700" y="70">water vapour out</text>
  <!-- roots at bottom -->
  <path d="M440 740 q-80 40 -120 110 M500 740 q80 40 120 110 M470 740 v120" fill="none" stroke="#8a4b00" stroke-width="8"/>
  <g stroke="#1f6fb5" stroke-width="3" marker-end="url(#ar)"><path d="M300 800 L360 790"/><path d="M640 800 L580 790"/><path d="M420 870 L450 850"/></g>
  <text class="s" x="200" y="890">water enters root hairs by osmosis</text>
  <!-- pull arrow -->
  <path d="M400 700 V220" stroke="#4b5563" stroke-width="5" marker-end="url(#ag)"/>
  <text class="s" x="300" y="470" transform="rotate(-90 300 470)" text-anchor="middle">pull: water column rises against gravity</text>
  <!-- labels -->
  <text class="k" x="700" y="200">T  Transpiration</text><text class="s" x="700" y="226">evaporation through the stomata</text><text class="s" x="700" y="248">creates negative pressure in the leaf</text>
  <text class="k" x="700" y="320">A  Adhesion</text><text class="s" x="700" y="346">water sticks to the xylem walls</text><text class="s" x="700" y="368">(orange ticks); no break in the column</text>
  <text class="k" x="700" y="440">C  Cohesion</text><text class="s" x="700" y="466">water molecules stick together by</text><text class="s" x="700" y="488">hydrogen bonds: one unbroken column</text>
  <text class="k" x="700" y="560">T  Tension</text><text class="s" x="700" y="586">the negative pressure from the leaf</text><text class="s" x="700" y="608">pulls the whole column upwards</text>
  <text class="s" x="60" y="200">xylem vessel</text><text class="s" x="60" y="222">in the stem</text>
</svg>
