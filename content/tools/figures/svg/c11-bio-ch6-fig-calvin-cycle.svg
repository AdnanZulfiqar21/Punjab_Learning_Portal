<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.12: the Calvin cycle in three phases. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:18px;fill:#4b5563;text-anchor:middle}
      .b{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .p{font-size:21px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">The Calvin cycle (C-3 pathway), in the stroma</text>
  <!-- cycle circle -->
  <circle cx="600" cy="420" r="230" fill="none" stroke="#e5e7eb" stroke-width="40"/>
  <!-- arrows along the circle -->
  <g fill="none" stroke="#4b5563" stroke-width="5" marker-end="url(#ar)">
    <path d="M620 190 A230 230 0 0 1 822 350"/>
    <path d="M826 480 A230 230 0 0 1 640 648"/>
    <path d="M560 648 A230 230 0 0 1 375 480"/>
    <path d="M375 360 A230 230 0 0 1 580 190"/>
  </g>
  <!-- compounds -->
  <rect x="500" y="160" width="200" height="60" rx="12" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/><text class="b" x="600" y="186">3 RuBP (5C)</text><text class="s" x="600" y="208">ribulose biphosphate</text>
  <rect x="760" y="390" width="200" height="60" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="3"/><text class="b" x="860" y="416">6 3-PGA (3C)</text><text class="s" x="860" y="438">3-phosphoglyceric acid</text>
  <rect x="500" y="620" width="200" height="60" rx="12" fill="#e8dff7" stroke="#5b3fb5" stroke-width="3"/><text class="b" x="600" y="646">6 G3P (3C)</text><text class="s" x="600" y="668">glyceraldehyde 3-phosphate</text>
  <rect x="240" y="390" width="200" height="60" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="b" x="340" y="416">3 RuP (5C)</text><text class="s" x="340" y="438">ribulose phosphate</text>
  <!-- phase labels -->
  <text class="p" x="960" y="280" style="fill:#d98b2b">Phase I: carbon fixation</text>
  <text class="s" x="960" y="306">rubisco adds 3 CO2 to 3 RuBP</text>
  <rect x="750" y="150" width="110" height="46" rx="10" fill="#9ca3af"/><text class="b" x="805" y="180" style="fill:#fff">3 CO2</text>
  <path d="M805 200 L780 250" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="p" x="960" y="620" style="fill:#5b3fb5">Phase II: reduction</text>
  <text class="s" x="960" y="646">6 ATP then 6 NADPH</text>
  <text class="s" x="960" y="670">via 1,3-biphosphoglyceric acid</text>
  <text class="p" x="320" y="580" style="fill:#1f6fb5">Phase III: regeneration</text>
  <text class="s" x="320" y="606">5 G3P become 3 RuP;</text>
  <text class="s" x="320" y="630">3 ATP turn RuP into RuBP</text>
  <!-- output G3P -->
  <path d="M600 685 L600 725" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="b" x="600" y="752">1 G3P leaves: two G3P make one glucose</text>
  <!-- inputs -->
  <text class="s" x="1020" y="530">6 ATP, 6 NADPH in;</text><text class="s" x="1020" y="554">6 ADP, 6 NADP+ out</text>
  <text class="s" x="190" y="300">3 ATP in; 3 ADP out</text>
  <text class="s" x="230" y="120">Melvin Calvin and colleagues worked out these reactions</text><text class="s" x="230" y="146">(Nobel Prize 1961). Rubisco is probably the</text><text class="s" x="230" y="172">most abundant protein on Earth.</text>
</svg>
