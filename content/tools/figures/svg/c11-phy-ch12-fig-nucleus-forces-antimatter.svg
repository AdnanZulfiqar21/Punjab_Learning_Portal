  <text class="r" x="920" y="266">gamma 0.51 MeV</text>
  <text class="r" x="920" y="338">gamma 0.51 MeV</text>
  <g class="r">
    <text x="810" y="214">photon of at least 2 m0 c^2 = 1.02 MeV near a</text>
    <text x="810" y="228">nucleus (needed for momentum)</text>
  </g>
  <g class="r">
    <text x="1020" y="302">e- + e+ -&gt; 2 gamma</text>
  </g>
  <g class="r">
    <text x="810" y="370">charge, momentum and energy are conserved in both</text>
  </g>
  <rect x="50" y="405" width="1100" height="290" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="433">Matter and antimatter (12.3)</text>
  <g class="t">
    <text x="70" y="452">Dirac (1928) predicted that every particle has an antiparticle with the same rest mass but opposite charge; the positron (e+), the electron's</text>
    <text x="70" y="470">antiparticle, was found by Anderson in 1932 in a cloud chamber; antiparticles are written with a bar (antiproton p-bar, antineutrino nu-bar)</text>
    <text x="70" y="488">Nobel Prizes: Dirac 1933, Anderson 1936; Segre and Chamberlain found the antiproton with an accelerator in 1955 (Nobel Prize 1959)</text>
    <text x="70" y="506">quarks and leptons are the fundamental (elementary) particles, and they too have antiparticles</text>
    <text x="70" y="542">particle accelerators (linear accelerators, cyclotrons, betatrons) give charged particles energies and speeds approaching light;</text>
    <text x="70" y="560">collisions at CERN turn some mass into radiation and the rest into new particles (an 18-particle proton-proton event)</text>
    <text x="70" y="578">cosmic rays (mostly protons, neutrons and heavier nuclei from space) make showers of secondary particles in the atmosphere;</text>
    <text x="70" y="596">uranium-235 fission in reactors emits neutrons, neutrinos, alpha particles, photons, electrons and positrons;</text>
    <text x="70" y="614">accelerated electrons and protons striking hydrogen give pions, kaons, muons and even antiprotons</text>
  </g>
  <text class="s" x="600" y="707" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
