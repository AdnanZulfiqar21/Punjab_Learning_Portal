  <rect width="1200" height="715" fill="#ffffff"/>
  <!-- Original diagram after Figures 12.1 to 12.3 and topics 12.1 to 12.3: the nucleus and nucleon data, the four fundamental forces, pair production, electron-positron annihilation and antimatter. -->
  <defs>
