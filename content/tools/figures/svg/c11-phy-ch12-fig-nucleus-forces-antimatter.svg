  <text class="h" x="600" y="32">The nucleus, the four fundamental forces, pair production and annihilation</text>
  <rect x="50" y="55" width="360" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="230" y="83">The nucleus (12.1)</text>
  <circle cx="140" cy="150" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="125" cy="150" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="155" cy="150" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="132" cy="137" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="132" cy="163" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="148" cy="137" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="148" cy="163" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="118" cy="137" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="118" cy="163" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="162" cy="137" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="162" cy="163" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="140" cy="124" r="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="140" cy="176" r="8" fill="#f8c8b8" stroke="#d7322f" stroke-width="1.2"/>
  <circle cx="230" cy="120" r="9" fill="#f8c8b8" stroke="#d7322f"/><text class="r" x="246" y="124">proton: +e, 1.007276 u</text>
  <circle cx="230" cy="150" r="9" fill="#e5e7eb" stroke="#4b5563"/><text class="r" x="246" y="154">neutron: 0, 1.008665 u</text>
  <text class="r" x="230" y="182">electron: -e, 0.00055 u</text>
  <g class="r">
    <text x="70" y="222">nucleons: protons and neutrons (Chadwick, 1932)</text>
    <text x="70" y="237">Z = atomic number (protons); A = mass number</text>
    <text x="70" y="252">N = A - Z (12.1) neutrons; symbol A over Z X</text>
    <text x="70" y="267">1 u = 1/12 of a carbon-12 atom = 1.6606 x 10^-27 kg</text>
    <text x="70" y="282">  (equivalent to 931 MeV)</text>
    <text x="70" y="297">isotopes: same Z, different N: carbon-12, 13</text>
    <text x="70" y="312">and 14; carbon-14 is unstable and beta-decays</text>
    <text x="70" y="327">  into nitrogen</text>
  </g>
  <rect x="430" y="55" width="340" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="600" y="83">Four fundamental forces (12.2)</text>
  <text class="l" x="450" y="102">force</text>
  <text class="l" x="590" y="102">strength</text>
  <text class="l" x="670" y="102">range</text>
  <text class="r" x="450" y="122">strong</text>
  <text class="r" x="590" y="122">1</text>
  <text class="r" x="670" y="122">&lt; 10^-15 m</text>
  <text class="r" x="450" y="142">electromagnetic</text>
  <text class="r" x="590" y="142">10^-2</text>
  <text class="r" x="670" y="142">infinite</text>
  <text class="r" x="450" y="162">weak</text>
  <text class="r" x="590" y="162">10^-13</text>
  <text class="r" x="670" y="162">&lt; 10^-18 m</text>
  <text class="r" x="450" y="182">gravity</text>
  <text class="r" x="590" y="182">10^-38</text>
  <text class="r" x="670" y="182">infinite</text>
  <g class="r">
    <text x="450" y="216">strengths relative to the strong force (Table 12.1)</text>
    <text x="450" y="246">gravity: weakest, long range, attractive; matters</text>
    <text x="450" y="261">for stars and planets, negligible in atoms</text>
    <text x="450" y="276">electromagnetic: inverse square, much stronger than</text>
    <text x="450" y="291">gravity; Maxwell (1861) unified electricity, magnetism</text>
    <text x="450" y="306">strong: binds nucleons, p-p, n-n and p-n alike</text>
    <text x="450" y="321">weak: beta decay, neutrinos; changes particle identity</text>
  </g>
  <rect x="790" y="55" width="360" height="330" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="970" y="83">Pair production and annihilation (12.3)</text>
