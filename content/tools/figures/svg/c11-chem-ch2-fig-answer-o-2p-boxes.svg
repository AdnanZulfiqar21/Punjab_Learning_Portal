<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <!-- Orbital diagram of the four 2p electrons of oxygen, filled by Hund's rule and Pauli's principle. Original answer figure for a self-check of this lesson; not the textbook's picture. -->
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450.0" y="50.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Electrons 1, 2, 3: one in each box (Hund's rule)</tspan></text>
  <rect x="300.0" y="80.0" width="300.0" height="100.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="400.0" y1="80.0" x2="400.0" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="500.0" y1="80.0" x2="500.0" y2="180.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="350.0" y1="163.0" x2="350.0" y2="108.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M350.0 97.0 L356.6 109.4 L343.4 109.4 Z" fill="#0f7a62"/>
  <line x1="450.0" y1="163.0" x2="450.0" y2="108.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M450.0 97.0 L456.6 109.4 L443.4 109.4 Z" fill="#0f7a62"/>
  <line x1="550.0" y1="163.0" x2="550.0" y2="108.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M550.0 97.0 L556.6 109.4 L543.4 109.4 Z" fill="#0f7a62"/>
  <line x1="450.0" y1="200.0" x2="450.0" y2="249.2" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M450.0 262.0 L442.5 247.9 L457.5 247.9 Z" fill="#14181f"/>
  <text x="450.0" y="305.0" font-size="28" fill="#14181f" text-anchor="middle" font-weight="700"><tspan>Electron 4: pairs in 2p</tspan><tspan dy="7.0" font-size="19.0">x</tspan><tspan dy="-7.0"> with opposite spin (Pauli)</tspan></text>
  <rect x="300.0" y="335.0" width="300.0" height="100.0" rx="0" stroke="#14181f" stroke-width="3" fill="#ffffff"/>
  <line x1="400.0" y1="335.0" x2="400.0" y2="435.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="500.0" y1="335.0" x2="500.0" y2="435.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <line x1="333.0" y1="418.0" x2="333.0" y2="363.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M333.0 352.0 L339.6 364.4 L326.4 364.4 Z" fill="#0f7a62"/>
  <line x1="367.0" y1="352.0" x2="367.0" y2="406.8" stroke="#cc1f1f" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M367.0 418.0 L360.4 405.6 L373.6 405.6 Z" fill="#cc1f1f"/>
  <line x1="450.0" y1="418.0" x2="450.0" y2="363.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M450.0 352.0 L456.6 364.4 L443.4 364.4 Z" fill="#0f7a62"/>
  <line x1="550.0" y1="418.0" x2="550.0" y2="363.2" stroke="#0f7a62" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M550.0 352.0 L556.6 364.4 L543.4 364.4 Z" fill="#0f7a62"/>
  <text x="350.0" y="475.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>2p</tspan><tspan dy="7.0" font-size="19.0">x</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="450.0" y="475.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>2p</tspan><tspan dy="7.0" font-size="19.0">y</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="550.0" y="475.0" font-size="28" fill="#4b5563" text-anchor="middle" font-weight="700"><tspan>2p</tspan><tspan dy="7.0" font-size="19.0">z</tspan><tspan dy="-7.0"> </tspan></text>
  <text x="270.0" y="397.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="700"><tspan>2p</tspan></text>
  <text x="270.0" y="142.0" font-size="34" fill="#14181f" text-anchor="end" font-weight="700"><tspan>2p</tspan></text>
</svg>
