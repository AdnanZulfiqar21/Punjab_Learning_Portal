<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after Figure 10.1, topics 10.6 to 10.10.2 and Figure 10.2: an electrolytic cell for molten zinc chloride, the quantity of electricity, Sample 10.5 and Avogadro's constant from copper electrolysis. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:14px;fill:#14181f}
      .l{font-size:12px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7322f"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb5"/></marker>
  </defs>
  <text class="h" x="600" y="32">Electrolysis: the electrolytic cell, Faraday's quantity of electricity and Avogadro's constant</text>
  <!-- cell -->
  <text class="k" x="250" y="66">Electrolytic cell for molten ZnCl2 (after Figure 10.1)</text>
  <rect x="200" y="80" width="100" height="34" rx="6" fill="#f7f8fa" stroke="#4b5563" stroke-width="2"/>
  <text class="l" x="250" y="102" style="fill:#14181f">DC supply</text>
  <text class="l" x="188" y="104" style="fill:#d7322f">+</text><text class="l" x="312" y="104" style="fill:#1f6fb5">-</text>
  <path d="M200 97 H150 V150 M300 97 H350 V150" stroke="#4b5563" stroke-width="2" fill="none"/>
  <rect x="80" y="180" width="340" height="250" rx="8" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
  <rect x="80" y="180" width="340" height="40" fill="#ffffff"/>
  <path d="M80 220 H420" stroke="#9ca3af" stroke-width="1"/>
  <rect x="138" y="150" width="24" height="230" fill="#d7322f" opacity="0.85"/>
  <rect x="338" y="150" width="24" height="230" fill="#1f6fb5" opacity="0.85"/>
  <text class="l" x="150" y="398" style="fill:#d7322f">anode (+)</text>
  <text class="l" x="350" y="398" style="fill:#1f6fb5">cathode (-)</text>
  <text class="s" x="250" y="205">molten ZnCl2</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="250" y="262" fill="#d7322f">Cl-</text><text x="250" y="322" fill="#d7322f">Cl-</text>
    <text x="250" y="292" fill="#1f6fb5">Zn2+</text><text x="250" y="352" fill="#1f6fb5">Zn2+</text>
  </g>
  <path d="M235 258 H175" stroke="#d7322f" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M235 318 H175" stroke="#d7322f" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M270 288 H325" stroke="#1f6fb5" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M270 348 H325" stroke="#1f6fb5" stroke-width="2" marker-end="url(#ab)"/>
  <text class="l" x="109" y="418" style="fill:#d7322f;font-size:11px">Cl2 bubbles</text>
  <text class="l" x="391" y="418" style="fill:#1f6fb5;font-size:11px">Zn deposits</text>
  <text class="s" x="250" y="455">electrodes: graphite or metal; the power supply must be direct current</text>
  <g class="f">
    <text x="60" y="488" style="fill:#1f6fb5">cathode (-): Zn2+ + 2e- gives Zn      reduction</text>
    <text x="60" y="512" style="fill:#d7322f">anode (+):   2Cl- gives Cl2 + 2e-     oxidation</text>
    <text x="60" y="536">overall:     ZnCl2(l) gives Zn(s) + Cl2(g)</text>
  </g>
  <g class="t">
    <text x="60" y="566">cations go to the cathode and gain electrons (Cu2+ + 2e- gives Cu; 2H+ + 2e- gives H2);</text>
    <text x="60" y="586">anions go to the anode and lose electrons (2Cl- gives Cl2 + 2e-; 4OH- gives O2 + 2H2O + 4e-)</text>
    <text x="60" y="606">uses: sodium and chlorine from NaCl, refining and plating of metals, caustic soda</text>
  </g>
  <!-- Faraday -->
  <rect x="520" y="55" width="630" height="235" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="835" y="83">Quantity of electricity (10.8, 10.9)</text>
  <g class="f">
    <text x="540" y="112">Q = I x t     (coulombs = amperes x seconds)</text>
    <text x="540" y="136">1 Faraday = 96500 C mol-1 = charge on 1 mole of electrons</text>
    <text x="540" y="160">Ag+ + e- gives Ag: 1 F per mole;  Cu2+ + 2e- gives Cu: 2 F per mole</text>
  </g>
  <g class="t">
    <text x="540" y="190">Sample 10.5: 1.50 A for 20.0 min through molten PbBr2, Pb2+ + 2e- gives Pb</text>
    <text x="540" y="210">Q = 1.50 x 20 x 60 = 1800 C; 1 mol Pb (207 g) needs 2 F = 193000 C</text>
    <text x="540" y="230">mass of Pb = 1800 / 193000 x 207 = 1.93 g</text>
    <text x="540" y="258">number of Faradays = number of moles of electrons gained or lost</text>
    <text x="540" y="278">mass deposited is proportional to current, time and the charge passed</text>
  </g>
  <!-- Avogadro -->
  <rect x="520" y="310" width="630" height="235" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="835" y="338">Avogadro's constant by electrolysis (10.10, after Figure 10.2)</text>
  <g class="t">
    <text x="540" y="366">pure copper anode and cathode in aqueous CuSO4; variable resistor keeps I at 0.20 A</text>
    <text x="540" y="386">anode loses mass as Cu goes into solution; its loss is measured (copper may not</text>
    <text x="540" y="406">stick well to the cathode); electrodes washed with water and propanone, reweighed</text>
  </g>
  <g class="f">
    <text x="540" y="436">0.20 A for 34 min: Q = 0.20 x 34 x 60 = 408 C</text>
    <text x="540" y="460">anode 56.53 g to 56.40 g: 0.13 g Cu removed</text>
    <text x="540" y="484">63.5 g Cu needs 408 x 63.5 / 0.13 = 99646 C (as printed)</text>
    <text x="540" y="508">L = 99646 / (1.60 x 10^-19) = 6.2 x 10^23 mol-1</text>
  </g>
  <text class="s" x="835" y="534">L = charge on 1 mole of electrons / charge on 1 electron; accurate value 6.02 x 10^23 mol-1</text>
  <text class="s" x="600" y="638">Original diagram for this lesson; the textbook's pictures are not reproduced. Printed values are kept as printed.</text>
</svg>
