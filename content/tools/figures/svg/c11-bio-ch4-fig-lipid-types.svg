<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <!-- Original diagram after Figures 4.35 to 4.38: a phospholipid, terpenes, a steroid and a prostaglandin. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563;text-anchor:middle}
      .c{font-size:19px;fill:#14181f;text-anchor:middle;font-family:Consolas, Courier New, monospace}
    </style>
  </defs>
  <!-- phospholipid -->
  <text class="h" x="300" y="50">Phospholipid (phosphatidyl choline)</text>
  <rect x="80" y="100" width="120" height="50" rx="12" fill="#5b3fb5"/><text class="c" x="140" y="132" style="fill:#fff">choline</text>
  <rect x="80" y="160" width="120" height="50" rx="12" fill="#1f6fb5"/><text class="c" x="140" y="192" style="fill:#fff">phosphate</text>
  <rect x="80" y="220" width="120" height="50" rx="12" fill="#0f7a62"/><text class="c" x="140" y="252" style="fill:#fff">glycerol</text>
  <path d="M200 235 h40 M200 255 h40" stroke="#14181f" stroke-width="3"/>
  <path d="M240 232 q30 -20 60 0 t60 0 t60 0 t60 0 t60 0 M240 258 q30 20 60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#f2b134" stroke-width="7" stroke-linecap="round"/>
  <text class="s" x="140" y="310">polar head</text><text class="s" x="400" y="310">two fatty-acid tails (non-polar)</text>
  <text class="s" x="300" y="350">derivative of phosphatidic acid (glycerol + 2 fatty acids + phosphate)</text>
  <text class="s" x="300" y="376">plus a nitrogenous base: choline, ethanolamine or serine</text>
  <!-- terpene -->
  <text class="h" x="900" y="50">Terpenes: chains of isoprene units</text>
  <text class="c" x="900" y="110">CH2=C(CH3)-CH=CH2</text>
  <text class="s" x="900" y="140">one isoprene unit, a branched unsaturated hydrocarbon</text>
  <g fill="none" stroke="#0f7a62" stroke-width="6" stroke-linejoin="round">
    <path d="M700 220 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20 l30 -20 l30 20"/>
    <path d="M760 200 v-25 M850 200 v-25 M940 200 v-25 M1030 200 v-25"/>
  </g>
  <text class="s" x="900" y="280">repeated units with methyl branches</text>
  <text class="s" x="900" y="320">chlorophyll, retinal pigments of the eye,</text><text class="s" x="900" y="346">vitamin A and rubber are terpenes</text>
  <!-- steroid -->
  <text class="h" x="300" y="470">Steroid (cholesterol)</text>
  <g fill="#fff4e2" stroke="#d98b2b" stroke-width="5" stroke-linejoin="round">
    <polygon points="120,640 150,590 210,590 240,640 210,690 150,690"/>
    <polygon points="240,640 270,590 330,590 360,640 330,690 270,690"/>
    <polygon points="360,640 390,590 450,590 480,640 450,690 390,690"/>
    <polygon points="480,640 505,600 560,610 565,660 515,690"/>
  </g>
  <text class="c" x="90" y="650">HO</text>
  <text class="s" x="300" y="740">four fused rings: three six-cornered and one five-cornered</text>
  <text class="s" x="300" y="766">in animal membranes; the parent of sex hormones and vitamin D</text>
  <!-- prostaglandin -->
  <text class="h" x="900" y="470">Prostaglandin</text>
  <polygon points="860,640 885,595 940,595 965,640 912,680" fill="#e8dff7" stroke="#5b3fb5" stroke-width="5" stroke-linejoin="round"/>
  <path d="M885 595 l-30 -30 l-30 20 l-30 -20 l-30 20 l-30 -20" fill="none" stroke="#14181f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M940 595 l30 -30 l30 20 l30 -20 l30 20 l30 -20" fill="none" stroke="#14181f" stroke-width="5" stroke-linejoin="round"/>
  <text class="c" x="1095" y="560">COOH</text>
  <text class="s" x="900" y="740">a modified fatty acid: non-polar tails on a five-carbon ring</text>
  <text class="s" x="900" y="766">local messengers in vertebrate tissues (muscle, vessels, inflammation)</text>
</svg>
