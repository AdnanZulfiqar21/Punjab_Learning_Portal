<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- Operator precedence ladder (Roman Urdu teaching figure; the book prints no figure) -->
  <rect x="150.0" y="24.0" width="720.0" height="76.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#dbe9f5"/>
  <text x="260.0" y="72.0" font-family="Consolas, 'Courier New', monospace" font-size="32" fill="#111111" text-anchor="middle" font-weight="700">( )</text>
  <text x="390.0" y="72.0" font-size="27" fill="#111111" text-anchor="start" font-weight="500">Qausain (parentheses)</text>
  <rect x="150.0" y="116.0" width="720.0" height="76.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#e6f4ef"/>
  <text x="260.0" y="164.0" font-family="Consolas, 'Courier New', monospace" font-size="32" fill="#111111" text-anchor="middle" font-weight="700">**</text>
  <text x="390.0" y="164.0" font-size="27" fill="#111111" text-anchor="start" font-weight="500">Power (exponentiation)</text>
  <rect x="150.0" y="208.0" width="720.0" height="76.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#fff1dc"/>
  <text x="260.0" y="256.0" font-family="Consolas, 'Courier New', monospace" font-size="32" fill="#111111" text-anchor="middle" font-weight="700">*   /   %</text>
  <text x="390.0" y="256.0" font-size="27" fill="#111111" text-anchor="start" font-weight="500">Zarb, taqseem, modulus</text>
  <rect x="150.0" y="300.0" width="720.0" height="76.0" rx="10" stroke="#4b5563" stroke-width="2.4" fill="#f1f3f6"/>
  <text x="260.0" y="348.0" font-family="Consolas, 'Courier New', monospace" font-size="32" fill="#111111" text-anchor="middle" font-weight="700">+   -</text>
  <text x="390.0" y="348.0" font-size="27" fill="#111111" text-anchor="start" font-weight="500">Jama, tafreeq</text>
  <path d="M70.0 40.0 L70.0 364.0" stroke="#111111" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M70.0 380.0 L61.5 361.9 L78.5 361.9 Z" fill="#111111"/>
  <text x="70.0" y="31.0" font-size="25" fill="#111111" text-anchor="middle" font-weight="700">pehle</text>
  <text x="70.0" y="421.0" font-size="25" fill="#111111" text-anchor="middle" font-weight="700">baad mein</text>
  <rect x="150.0" y="422.0" width="720.0" height="116.0" rx="10" stroke="#0f7a62" stroke-width="2.4" fill="#e6f4ef"/>
  <text x="510.0" y="470.0" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#111111" text-anchor="middle" font-weight="600">3 + 2 * 5  -&gt;  3 + 10  -&gt;  13</text>
  <text x="510.0" y="516.0" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#111111" text-anchor="middle" font-weight="600">(3 + 2) * 4  -&gt;  5 * 4  -&gt;  20</text>
</svg>
