<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- Original diagram after Figures 15.6 and 15.7 and topics 15.3 and 15.2.1: simple and fractional distillation and the ethanol-water temperature record. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .r{font-size:11px;fill:#4b5563;text-anchor:middle}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Distillation: separating a solvent from a solution, and two miscible liquids</text>
  <!-- apparatus -->
  <rect x="50" y="55" width="640" height="400" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="500" y="83">Fractional distillation (after Figure 15.7)</text>
  <!-- flask -->
  <circle cx="170" cy="340" r="50" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M140 370 A 50 50 0 0 0 200 370 Z" fill="#bcdcf0"/>
  <rect x="160" y="250" width="20" height="45" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <!-- column -->
  <rect x="158" y="130" width="24" height="120" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <g fill="#9ca3af"><circle cx="165" cy="145" r="3"/><circle cx="175" cy="155" r="3"/><circle cx="165" cy="167" r="3"/><circle cx="175" cy="179" r="3"/><circle cx="165" cy="191" r="3"/><circle cx="175" cy="203" r="3"/><circle cx="165" cy="215" r="3"/><circle cx="175" cy="227" r="3"/><circle cx="165" cy="239" r="3"/></g>
  <!-- head and thermometer -->
  <rect x="158" y="110" width="24" height="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="167" y="70" width="6" height="60" fill="#d7322f"/>
  <text class="r" x="186" y="100" style="text-anchor:start">thermometer</text>
  <!-- side arm and condenser -->
  <path d="M182 120 L240 150 L420 240" stroke="#4b5563" stroke-width="3" fill="none"/>
  <rect x="250" y="146" width="150" height="40" rx="6" transform="rotate(26 325 166)" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M262 198 V214 M392 118 V96" stroke="#1f6fb5" stroke-width="3"/>
  <text class="r" x="262" y="222" style="text-anchor:end">cold water in</text><text class="r" x="400" y="104" style="text-anchor:start">water out</text>
  <!-- receiver -->
  <path d="M400 320 L410 250 H450 L460 320 Q460 332 448 332 H412 Q400 332 400 320 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="404" y="300" width="52" height="28" fill="#bcdcf0"/>
  <text class="r" x="430" y="350">receiver: distillate</text>
  <!-- burner -->
  <path d="M160 398 L170 388 L180 398" stroke="#d7322f" stroke-width="2" fill="none"/>
  <rect x="155" y="398" width="30" height="10" fill="#4b5563"/>
  <text class="r" x="170" y="424">heat; boiling chips in the flask</text>
  <g class="t" style="font-size:12px">
    <text x="200" y="236">fractionating column packed</text>
    <text x="200" y="252">with glass beads: a large</text>
    <text x="200" y="268">surface for vapour to</text>
    <text x="200" y="284">condense and re-boil</text>
    <text x="230" y="310">distilling flask: residue</text>
    <text x="230" y="326">(what does not distil) stays here</text>
    <text x="480" y="150">condenser: cold water circulates</text>
    <text x="480" y="166">around the inner tube and turns</text>
    <text x="480" y="182">the vapour back into liquid</text>
    <text x="480" y="210">simple distillation uses the same</text>
    <text x="480" y="226">set-up without the column</text>
  </g>
  <g class="t" style="font-size:12px">
    <text x="70" y="448">apparatus air-tight; boiling chips prevent bumping; the first drops of distillate come over at the lower boiling point</text>
  </g>
  <!-- graph -->
  <rect x="710" y="55" width="440" height="230" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="930" y="83">Thermometer reading against time (Figure 15.6)</text>
  <path d="M760 250 V100 M760 250 H1120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g class="r"><text x="752" y="135" style="text-anchor:end">100 C</text><text x="752" y="185" style="text-anchor:end">78 C</text></g>
  <text class="r" x="940" y="266">time</text>
  <path d="M760 240 L800 181 L900 181 L930 131 L1100 131" fill="none" stroke="#d7322f" stroke-width="3"/>
  <path d="M760 181 H800 M760 131 H930" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="r" x="850" y="172" style="fill:#d7322f;font-weight:700">ethanol distils</text>
  <text class="r" x="1015" y="122" style="fill:#d7322f;font-weight:700">water distils</text>
  <text class="r" x="915" y="205">change the receiver when</text><text class="r" x="915" y="219">the temperature starts to rise</text>
  <!-- text -->
  <rect x="710" y="305" width="440" height="150" rx="12" fill="#e6f4ef" stroke="#0f7a62" stroke-width="2"/>
  <text class="k" x="930" y="333">Simple against fractional (15.3, 15.2.1)</text>
  <g class="t" style="font-size:12px">
    <text x="730" y="358"><tspan font-weight="700" fill="#14181f">simple:</tspan> solvent from a solution of a solid (drinkable</text>
    <text x="730" y="374">water from sea water); vapour condenses to the distillate</text>
    <text x="730" y="396"><tspan font-weight="700" fill="#14181f">fractional:</tspan> two miscible liquids whose boiling points</text>
    <text x="730" y="412">differ by about 25 C (ethanol 78 C, water 100 C); the</text>
    <text x="730" y="428">column separates them; petroleum fractions, petrol,</text>
    <text x="730" y="444">diesel, kerosene, furnace oil are separated this way</text>
  </g>
  <!-- bottom -->
  <rect x="50" y="475" width="1100" height="130" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="503">Words to know</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="530"><tspan font-weight="700" fill="#14181f">distillate:</tspan> the condensed vapour collected in the receiver.  <tspan font-weight="700" fill="#14181f">residue:</tspan> the components left behind in the distilling flask.</text>
    <text x="70" y="552"><tspan font-weight="700" fill="#14181f">boiling chips:</tspan> prevent bumping.  <tspan font-weight="700" fill="#14181f">fractionating column:</tspan> glass beads give repeated condensation and re-boiling, so the lower-boiling liquid reaches the top first.</text>
    <text x="70" y="576">analytical chemistry (introduction): qualitative analysis identifies the elements present; quantitative analysis measures their relative amounts</text>
    <text x="70" y="592">in four steps: sample, separation, measurement and calculation, conclusion</text>
  </g>
  <text class="s" x="600" y="630" style="font-size:11px">Original diagram for this lesson; the textbook's pictures are not reproduced.</text>
</svg>
