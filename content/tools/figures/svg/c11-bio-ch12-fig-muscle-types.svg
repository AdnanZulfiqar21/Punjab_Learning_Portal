<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <!-- Original diagram after Figure 12.19: skeletal, smooth and cardiac muscle fibres. Schematic. -->
  <defs>
    <style>
      .h{font-size:24px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:15px;fill:#4b5563;text-anchor:middle}
    </style>
  </defs>
  <!-- skeletal -->
  <text class="h" x="220" y="40">Skeletal muscle</text>
  <g fill="#f6d5cf" stroke="#b5463a" stroke-width="3"><rect x="60" y="80" width="320" height="50" rx="20"/><rect x="60" y="150" width="320" height="50" rx="20"/></g>
  <g stroke="#b5463a" stroke-width="2"><path d="M80 80 v50 M100 80 v50 M120 80 v50 M140 80 v50 M160 80 v50 M180 80 v50 M200 80 v50 M220 80 v50 M240 80 v50 M260 80 v50 M280 80 v50 M300 80 v50 M320 80 v50 M340 80 v50 M360 80 v50 M80 150 v50 M100 150 v50 M120 150 v50 M140 150 v50 M160 150 v50 M180 150 v50 M200 150 v50 M220 150 v50 M240 150 v50 M260 150 v50 M280 150 v50 M300 150 v50 M320 150 v50 M340 150 v50 M360 150 v50"/></g>
  <g fill="#5b3fb5"><ellipse cx="110" cy="90" rx="10" ry="6"/><ellipse cx="250" cy="120" rx="10" ry="6"/><ellipse cx="330" cy="92" rx="10" ry="6"/><ellipse cx="150" cy="190" rx="10" ry="6"/><ellipse cx="300" cy="160" rx="10" ry="6"/></g>
  <text class="s" x="220" y="240">long cylindrical fibres with striations</text><text class="s" x="220" y="260">and many nuclei at the edge; voluntary;</text><text class="s" x="220" y="280">moves limbs, trunk and face</text>
  <!-- smooth -->
  <text class="h" x="600" y="40">Smooth muscle</text>
  <g fill="#f6d5cf" stroke="#b5463a" stroke-width="3">
    <path d="M450 110 q80 -40 160 0 q-80 40 -160 0 z"/><path d="M530 150 q80 -40 160 0 q-80 40 -160 0 z"/><path d="M450 190 q80 -40 160 0 q-80 40 -160 0 z"/><path d="M610 110 q80 -40 160 0 q-80 40 -160 0 z"/><path d="M610 190 q80 -40 160 0 q-80 40 -160 0 z"/>
  </g>
  <g fill="#5b3fb5"><ellipse cx="530" cy="110" rx="12" ry="6"/><ellipse cx="610" cy="150" rx="12" ry="6"/><ellipse cx="530" cy="190" rx="12" ry="6"/><ellipse cx="690" cy="110" rx="12" ry="6"/><ellipse cx="690" cy="190" rx="12" ry="6"/></g>
  <text class="s" x="600" y="240">spindle-shaped fibres, one nucleus,</text><text class="s" x="600" y="260">no striations, wrapped in connective</text><text class="s" x="600" y="280">tissue; involuntary; walls of the</text><text class="s" x="600" y="300">stomach, intestines, blood vessels</text>
  <!-- cardiac -->
  <text class="h" x="980" y="40">Cardiac muscle</text>
  <g fill="#f6d5cf" stroke="#b5463a" stroke-width="3">
    <path d="M840 100 h120 l40 30 l-40 30 h-120 z"/><path d="M1000 130 h120 l-40 -30 h-40 z"/><path d="M1000 130 h120 l-40 30 h-40 z"/><path d="M840 170 h120 l40 -10 l-40 50 h-120 z"/>
  </g>
  <g stroke="#b5463a" stroke-width="2"><path d="M860 100 v60 M880 100 v60 M900 100 v60 M920 100 v60 M940 100 v60 M860 170 v40 M880 170 v40 M900 170 v40 M920 170 v40 M940 170 v40 M1020 110 v40 M1040 110 v40 M1060 110 v40 M1080 110 v40"/></g>
  <g stroke="#14181f" stroke-width="4"><path d="M960 100 v60 M1000 112 v36"/></g>
  <g fill="#5b3fb5"><ellipse cx="900" cy="130" rx="9" ry="6"/><ellipse cx="1050" cy="130" rx="9" ry="6"/><ellipse cx="900" cy="190" rx="9" ry="6"/></g>
  <text class="s" x="980" y="240">branching striated fibres joined at</text><text class="s" x="980" y="260">intercalated discs (black), one central</text><text class="s" x="980" y="280">nucleus; involuntary; only in the heart</text>
  <rect x="60" y="340" width="1080" height="160" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="15" fill="#4b5563">
    <text x="80" y="368" font-weight="700" fill="#14181f">Property</text><text x="330" y="368" font-weight="700" fill="#14181f">Skeletal</text><text x="600" y="368" font-weight="700" fill="#14181f">Smooth</text><text x="900" y="368" font-weight="700" fill="#14181f">Cardiac</text>
    <text x="80" y="394">appearance</text><text x="330" y="394">regular striped</text><text x="600" y="394">unstriped</text><text x="900" y="394">irregular striped</text>
    <text x="80" y="418">cell shape</text><text x="330" y="418">spindle or cylindrical</text><text x="600" y="418">spindle</text><text x="900" y="418">branched</text>
    <text x="80" y="442">nuclei</text><text x="330" y="442">many per cell</text><text x="600" y="442">one per cell</text><text x="900" y="442">one per cell</text>
    <text x="80" y="466">control</text><text x="330" y="466">voluntary</text><text x="600" y="466">usually not voluntary</text><text x="900" y="466">not voluntary</text>
    <text x="80" y="490">function</text><text x="330" y="490">moves the skeleton</text><text x="600" y="490">moves substances in hollow organs</text><text x="900" y="490">pumps blood</text>
  </g>
  <text class="s" x="600" y="540">Muscle cells are muscle fibres (myofibres). Pink: fibres. Purple: nuclei. Lines: striations.</text>
</svg>
