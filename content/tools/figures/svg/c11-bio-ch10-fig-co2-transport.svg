<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- Original diagram after Figure 10.8: the three ways carbon dioxide travels in the blood, and the chloride shift. -->
  <defs>
    <style>
      .h{font-size:26px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:17px;fill:#4b5563;text-anchor:middle}
      .k{font-size:18px;font-weight:700;fill:#14181f;text-anchor:middle}
      .f{font-size:19px;font-weight:700;fill:#14181f;text-anchor:middle}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="40">How the blood carries carbon dioxide from the tissues to the lungs</text>
  <!-- tissue cell -->
  <rect x="40" y="120" width="150" height="200" rx="16" fill="#b2dbcc" stroke="#0f7a62" stroke-width="3"/><text class="k" x="115" y="200">tissue cell</text><text class="s" x="115" y="226">makes CO2</text>
  <path d="M190 220 H265" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="228" y="200">CO2</text>
  <!-- plasma -->
  <rect x="270" y="90" width="880" height="420" rx="20" fill="#fdf2e9" stroke="#d98b2b" stroke-width="3"/>
  <text class="k" x="330" y="120">blood plasma</text>
  <!-- RBC -->
  <rect x="330" y="150" width="520" height="300" rx="60" fill="#f6d5cf" stroke="#d7322f" stroke-width="4"/>
  <text class="k" x="590" y="180">red blood cell</text>
  <text class="f" x="420" y="240">CO2 + H2O</text>
  <path d="M480 234 H540" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/><text class="s" x="510" y="208" style="font-size:14px">carbonic anhydrase</text>
  <text class="f" x="600" y="240">H2CO3</text>
  <path d="M650 234 H710" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="f" x="778" y="240">H+ + HCO3-</text>
  <path d="M740 255 q-60 60 -120 70" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text class="s" x="520" y="350">H+ joins oxyhaemoglobin,</text><text class="s" x="520" y="372">which releases its O2 to the tissue</text>
  <path d="M790 255 v100" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text class="s" x="745" y="385">HCO3- leaves the cell;</text><text class="s" x="745" y="407">Cl- enters in exchange</text><text class="s" x="745" y="429">(chloride shift)</text>
  <text class="s" x="1000" y="300">1. as bicarbonate ions</text><text class="k" x="1000" y="326">about 72%</text>
  <text class="s" x="1000" y="380">2. as carboxyhaemoglobin</text><text class="k" x="1000" y="406">about 20%</text><text class="s" x="1000" y="430" style="font-size:15px">CO2 bound to the globin chains</text>
  <text class="s" x="1000" y="480">3. dissolved in plasma</text><text class="k" x="1000" y="506">about 8%</text>
  <!-- lungs -->
  <rect x="1010" y="560" width="150" height="110" rx="16" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="3"/><text class="k" x="1085" y="605">alveolus</text><text class="s" x="1085" y="631">low PCO2</text>
  <path d="M900 600 H1005" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <text class="s" x="560" y="580">in the lungs the low PCO2 of alveolar air reverses the reactions:</text><text class="s" x="560" y="602">H2CO3 becomes H2O and CO2, and the CO2 diffuses into the</text><text class="s" x="560" y="624">alveoli to leave with the next breath out</text>
  <text class="s" x="560" y="665">Bicarbonate is the main buffer of the plasma, so this chemistry also keeps the blood's acid-base balance.</text>
  <text class="s" x="140" y="420">CO2 binds the protein part of</text><text class="s" x="140" y="442">haemoglobin while O2 binds the</text><text class="s" x="140" y="464">haem iron, so the two do not</text><text class="s" x="140" y="486">compete for attachment</text>
</svg>
