<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1300" height="540" fill="#ffffff"/>
  <!-- Fig 10.8 (C11-BIO, PDF p226): transport of carbon dioxide by blood, two panels side by side as printed. Left: at the tissues, CO2 from the tissue cells dissolves in plasma, combines with haemoglobin, or enters the RBC where carbonic anhydrase makes H2CO3, which gives H+ (combines with Hb) and HCO3- (leaves in exchange for Cl-). Right: at the alveoli the reactions reverse and CO2 leaves the blood. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d2430"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/></marker>
  </defs>
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="620" height="500" fill="#f7d7da" stroke="#9aa4ae" stroke-width="2"/>
    <path d="M0 0 H 620 V 120 C 440 165 180 165 0 120 Z" fill="#f7ecc8"/>
    <line x1="210" y1="0" x2="210" y2="150" stroke="#8a7a4a" stroke-width="3"/><line x1="420" y1="0" x2="420" y2="150" stroke="#8a7a4a" stroke-width="3"/>
    <ellipse cx="105" cy="70" rx="22" ry="15" fill="#4a6a9a" stroke="#1f3a6a" stroke-width="2"/>
    <ellipse cx="315" cy="62" rx="22" ry="15" fill="#4a6a9a" stroke="#1f3a6a" stroke-width="2"/>
    <ellipse cx="515" cy="70" rx="22" ry="15" fill="#4a6a9a" stroke="#1f3a6a" stroke-width="2"/>
    <path d="M0 120 C 180 165 440 165 620 120" stroke="#7a5aa8" stroke-width="14" fill="none"/>
    <path d="M0 120 C 180 165 440 165 620 120" stroke="#c9b6e6" stroke-width="8" fill="none"/>
    <text x="16" y="32" font-size="22" fill="#1d2430" text-anchor="start" font-weight="700">Tissue cells</text>
    <ellipse cx="160" cy="340" rx="130" ry="70" fill="#d9535a" stroke="#8a1c24" stroke-width="3"/>
    <ellipse cx="440" cy="335" rx="170" ry="85" fill="#d9535a" stroke="#8a1c24" stroke-width="3"/>
    <rect x="520" y="404" width="22" height="22" rx="4" fill="#7a8a9a" stroke="#1d2430" stroke-width="2"/>
    <text x="310" y="192" font-size="22" fill="#1d2430" text-anchor="middle" font-weight="700">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan></text>
    <line x1="288" y1="198" x2="172" y2="212" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="300" y1="202" x2="190" y2="268" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="325" y1="202" x2="390" y2="252" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="16" y="222" font-size="22" fill="#1d2430" text-anchor="start">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan> dissolves</text>
    <text x="16" y="248" font-size="22" fill="#1d2430" text-anchor="start">in plasma</text>
    <text x="160" y="330" font-size="22" fill="#ffffff" text-anchor="middle">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan> combines</text>
    <text x="160" y="357" font-size="22" fill="#ffffff" text-anchor="middle">with haemoglobin</text>
    <text x="440" y="320" font-size="22" fill="#ffffff" text-anchor="middle">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan> + H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>O → H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>CO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan></text>
    <text x="440" y="352" font-size="22" fill="#ffffff" text-anchor="middle">H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>CO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan> → H<tspan dy="-8" font-size="15.4">+</tspan><tspan dy="8">&#8203;</tspan> + HCO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan><tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan></text>
    <text x="610" y="214" font-size="22" fill="#1d2430" text-anchor="end">Carbonic anhydrase</text>
    <line x1="470" y1="312" x2="540" y2="222" stroke="#3a3f47" stroke-width="2"/><circle cx="470" cy="312" r="3.5" fill="#3a3f47"/>
    <text x="300" y="470" font-size="22" fill="#1d2430" text-anchor="middle">H<tspan dy="-8" font-size="15.4">+</tspan><tspan dy="8">&#8203;</tspan> combines</text>
    <text x="300" y="494" font-size="22" fill="#1d2430" text-anchor="middle">with Hb</text>
    <line x1="420" y1="380" x2="345" y2="455" stroke="#3a3f47" stroke-width="2"/><circle cx="420" cy="380" r="3.5" fill="#3a3f47"/>
    <text x="500" y="478" font-size="22" fill="#1d2430" text-anchor="end">HCO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan><tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan></text>
    <line x1="522" y1="418" x2="490" y2="450" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="578" y="478" font-size="22" fill="#1d2430" text-anchor="start">Cl<tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan></text>
    <line x1="590" y1="452" x2="546" y2="422" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="16" y="480" font-size="22" fill="#1d2430" text-anchor="start">RBC</text>
    <line x1="80" y1="380" x2="50" y2="458" stroke="#3a3f47" stroke-width="2"/><circle cx="80" cy="380" r="3.5" fill="#3a3f47"/>
  </g>
  <g transform="translate(660 20)">
    <rect x="0" y="0" width="620" height="500" fill="#f7d7da" stroke="#9aa4ae" stroke-width="2"/>
    <path d="M0 0 H 620 V 120 C 440 165 180 165 0 120 Z" fill="#e6e0f2"/>
    <path d="M0 120 C 180 165 440 165 620 120" stroke="#7a5aa8" stroke-width="14" fill="none"/>
    <path d="M0 120 C 180 165 440 165 620 120" stroke="#c9b6e6" stroke-width="8" fill="none"/>
    <ellipse cx="120" cy="143" rx="16" ry="7" fill="#4a5a8a"/>
    <ellipse cx="300" cy="148" rx="16" ry="7" fill="#4a5a8a"/>
    <ellipse cx="470" cy="143" rx="16" ry="7" fill="#4a5a8a"/>
    <text x="16" y="32" font-size="22" fill="#1d2430" text-anchor="start" font-weight="700">Alveoli</text>
    <ellipse cx="160" cy="340" rx="130" ry="70" fill="#d9535a" stroke="#8a1c24" stroke-width="3"/>
    <ellipse cx="440" cy="335" rx="170" ry="85" fill="#d9535a" stroke="#8a1c24" stroke-width="3"/>
    <rect x="520" y="404" width="22" height="22" rx="4" fill="#7a8a9a" stroke="#1d2430" stroke-width="2"/>
    <text x="320" y="60" font-size="22" fill="#1d2430" text-anchor="middle" font-weight="700">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan></text>
    <line x1="130" y1="205" x2="292" y2="72" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="200" y1="290" x2="305" y2="74" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="405" y1="270" x2="335" y2="74" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="16" y="222" font-size="22" fill="#1d2430" text-anchor="start">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan> dissolved</text>
    <text x="16" y="248" font-size="22" fill="#1d2430" text-anchor="start">in plasma</text>
    <text x="160" y="348" font-size="22" fill="#ffffff" text-anchor="middle">Haemoglobin + CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan></text>
    <text x="440" y="318" font-size="22" fill="#ffffff" text-anchor="middle">CO<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan> + H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>O ← H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>CO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan></text>
    <line x1="525" y1="355" x2="525" y2="330" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="440" y="376" font-size="22" fill="#ffffff" text-anchor="middle">H<tspan dy="-8" font-size="15.4">+</tspan><tspan dy="8">&#8203;</tspan> + HCO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan><tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan> → H<tspan dy="6" font-size="15.4">2</tspan><tspan dy="-6">&#8203;</tspan>CO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan></text>
    <text x="500" y="478" font-size="22" fill="#1d2430" text-anchor="end">HCO<tspan dy="6" font-size="15.4">3</tspan><tspan dy="-6">&#8203;</tspan><tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan></text>
    <line x1="495" y1="452" x2="520" y2="424" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="578" y="478" font-size="22" fill="#1d2430" text-anchor="start">Cl<tspan dy="-8" font-size="15.4">−</tspan><tspan dy="8">&#8203;</tspan></text>
    <line x1="544" y1="424" x2="580" y2="452" stroke="#1d2430" stroke-width="2.5" marker-end="url(#ah)"/>
  </g>
</svg>
