  <line x1="170.0" y1="442.0" x2="170.0" y2="122.8" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M170.0 110.0 L176.8 124.5 L163.2 124.5 Z" fill="#14181f"/>
  <line x1="168.0" y1="440.0" x2="827.2" y2="440.0" stroke="#14181f" stroke-width="3" stroke-linecap="round"/>
  <path d="M840.0 440.0 L825.5 446.8 L825.5 433.2 Z" fill="#14181f"/>
  <text x="110.0" y="280.0" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700" transform="rotate(-90 110.0 280.0)">% Abundance</text>
  <rect x="316.0" y="370.4" width="28.0" height="69.6" rx="0" stroke="#14181f" stroke-width="2.5" fill="#ffe11a"/>
  <text x="330.0" y="354.9" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">19.9</tspan></text>
  <text x="330.0" y="482.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">10</tspan></text>
  <rect x="386.0" y="160.0" width="28.0" height="280.0" rx="0" stroke="#14181f" stroke-width="2.5" fill="#8cc63f"/>
  <text x="400.0" y="144.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">80.1</tspan></text>
  <text x="400.0" y="482.5" font-size="30" fill="#14181f" text-anchor="middle" font-weight="700"><tspan dy="0.0">11</tspan></text>
  <text x="820.0" y="490.5" font-size="30" fill="#14181f" text-anchor="end" font-weight="700"><tspan dy="0.0">m/e</tspan></text>
