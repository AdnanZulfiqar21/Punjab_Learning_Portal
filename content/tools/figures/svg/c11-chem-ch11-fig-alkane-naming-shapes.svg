<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <!-- Original diagram after topics 11.2.2 to 11.2.4, Figures 11.3 and 11.4 and Tables 11.4 and 11.5: IUPAC naming of branched alkanes and cycloalkanes, tetrahedral shape, and physical trends. -->
  <defs>
    <style>
      .h{font-size:22px;font-weight:700;fill:#14181f;text-anchor:middle}
      .k{font-size:16px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:13px;fill:#4b5563;text-anchor:middle}
      .t{font-size:13px;fill:#4b5563}
      .f{font-family:Consolas, Courier New, monospace;font-size:13px;fill:#14181f}
      .n{font-size:12px;fill:#14181f;text-anchor:middle;font-weight:700}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
  </defs>
  <text class="h" x="600" y="32">Naming alkanes and cycloalkanes, the tetrahedral carbon, and physical trends</text>
  <!-- naming -->
  <rect x="50" y="55" width="620" height="330" rx="12" fill="#fff4e2" stroke="#d98b2b" stroke-width="2"/>
  <text class="k" x="360" y="83">IUPAC rules for branched alkanes (11.2.2)</text>
  <g class="t" style="font-size:12px">
    <text x="70" y="108">1. find the longest continuous chain: it gives the parent name (hexane, heptane, ...)</text>
    <text x="70" y="126">2. number from the end nearest a substituent</text>
    <text x="70" y="144">3. put the substituent, with its number, before the parent name</text>
    <text x="70" y="162">4. several substituents: number each; list alphabetically (ethyl before methyl),</text>
    <text x="70" y="178">   ignoring di, tri, ...</text>
    <text x="70" y="196">5. two substituents on one carbon: use the number twice</text>
    <text x="70" y="214">6. identical substituents: di, tri, tetra, and a number for each</text>
    <text x="70" y="232">7. equal chains: choose the one with more substituents</text>
    <text x="70" y="250">8. equal first branch point: lower number at the first point of difference</text>
  </g>
  <!-- skeletal 4-ethyl-2-methylhexane: zigzag chain of 6 carbons -->
  <g fill="none" stroke="#14181f" stroke-width="2.5">
    <path d="M100 330 L140 305 L180 330 L220 305 L260 330 L300 305"/>
    <path d="M140 305 L140 275"/>
    <path d="M220 305 L220 275 L250 258"/>
  </g>
  <g font-size="11" fill="#4b5563" text-anchor="middle">
    <text x="100" y="348">1</text><text x="140" y="348">2</text><text x="180" y="348">3</text><text x="220" y="348">4</text><text x="260" y="348">5</text><text x="300" y="348">6</text>
    <text x="128" y="270">CH3</text><text x="276" y="264">ethyl</text>
  </g>
  <text class="n" x="200" y="372">4-ethyl-2-methylhexane (rule 4)</text>
  <g class="t" style="font-size:12px">
    <text x="340" y="290" style="font-weight:700;fill:#14181f">Cycloalkanes (11.2.3, Figure 11.3)</text>
    <text x="340" y="308">prefix cyclo- to the alkane name with the same</text>
    <text x="340" y="324">number of carbons: ethylcyclohexane,</text>
    <text x="340" y="340">(1-methylethyl)cyclohexane (isopropylcyclohexane),</text>
    <text x="340" y="356">propylcyclohexane, 1,1,4-trimethylcyclohexane</text>
    <text x="340" y="372">(ring numbered to give the lowest locants)</text>
  </g>
  <!-- tetrahedral -->
  <rect x="690" y="55" width="460" height="330" rx="12" fill="#dbe9f5" stroke="#1f6fb5" stroke-width="2"/>
  <text class="k" x="920" y="83">Shapes (11.2.3, Figure 11.4, Tables 11.4 and 11.5)</text>
  <g stroke="#14181f" stroke-width="2.5" fill="none">
    <path d="M790 190 L790 130"/>
    <path d="M790 190 L740 220"/>
    <path d="M790 190 L840 220"/>
    <path d="M790 190 L800 245" stroke-dasharray="5 3"/>
  </g>
  <circle cx="790" cy="190" r="9" fill="#14181f"/>
  <g font-size="12" fill="#14181f" font-weight="700" text-anchor="middle">
    <text x="790" y="122">H</text><text x="730" y="232">H</text><text x="850" y="232">H</text><text x="803" y="262">H</text><text x="812" y="186">C</text>
  </g>
  <path d="M770 205 A 25 25 0 0 1 793 214" fill="none" stroke="#d7322f" stroke-width="1.5"/>
  <text font-size="11" fill="#d7322f" x="760" y="258" text-anchor="middle">109.5 degrees</text>
  <g class="t" style="font-size:12px">
    <text x="880" y="120">carbon in an alkane: four sp3 hybrid orbitals,</text>
    <text x="880" y="136">four single (sigma) bonds equidistant from</text>
    <text x="880" y="152">each other: tetrahedral around each carbon</text>
    <text x="880" y="172">4 bonding pairs repel equally: 109.5 degree</text>
    <text x="880" y="188">angles, C-C bond length 1.54 angstrom</text>
    <text x="880" y="208">ethane: two tetrahedra joined C-C; propane</text>
    <text x="880" y="224">and butane: zigzag chains of tetrahedra</text>
    <text x="880" y="244">cyclopropane C3H6, cyclobutane C4H8 and</text>
    <text x="880" y="260">cyclopentane C5H10 (printed C4H10): carbons</text>
    <text x="880" y="276">in a ring, all singly bonded (saturated)</text>
  </g>
  <g fill="none" stroke="#14181f" stroke-width="2">
    <path d="M760 300 L790 350 L730 350 Z"/>
    <rect x="835" y="305" width="48" height="48"/>
    <path d="M980 298 L1009 319 L998 353 L962 353 L951 319 Z"/>
  </g>
  <g class="n" style="font-weight:400;font-size:11px"><text x="760" y="372">cyclopropane</text><text x="859" y="372">cyclobutane</text><text x="980" y="372">cyclopentane</text></g>
  <!-- physical -->
  <rect x="50" y="405" width="1100" height="235" rx="12" fill="#f7f8fa" stroke="#9ca3af" stroke-width="2"/>
  <text class="k" x="600" y="433">Physical properties of alkanes (11.2.4)</text>
  <g class="t">
    <text x="70" y="462">C1 to C4: colourless, odourless gases; C5 to C17: colourless, odourless liquids; C18 onwards: waxy solids</text>
    <text x="70" y="486">non-polar or very weakly polar: insoluble in water, soluble in non-polar solvents (hexane, benzene, ether)</text>
    <text x="70" y="510">boiling point, melting point and density rise with the number of carbons; solubility falls with molecular mass</text>
    <text x="70" y="534">branched isomers boil lower than straight chains: butane -0.5 degrees C, 2-methylpropane (isobutane) -11.7 degrees C</text>
  </g>
  <g fill="none" stroke="#4b5563" stroke-width="1.5"><path d="M700 620 V555 M700 620 H1100" marker-end="url(#a)"/></g>
  <g font-size="11" fill="#4b5563" text-anchor="middle"><text x="740" y="634">C1</text><text x="820" y="634">C4</text><text x="900" y="634">C8</text><text x="980" y="634">C12</text><text x="1060" y="634">C18</text><text x="690" y="560" text-anchor="end">b.p.</text></g>
  <path d="M740 612 C 800 600, 900 580, 1060 562" fill="none" stroke="#d7322f" stroke-width="2.5"/>
  <g font-size="11" fill="#4b5563"><text x="80" y="560">state at room temperature:</text><text x="80" y="578" style="fill:#1f6fb5;font-weight:700">gas C1-C4</text><text x="170" y="578" style="fill:#0f7a62;font-weight:700">liquid C5-C17</text><text x="290" y="578" style="fill:#b5600f;font-weight:700">waxy solid C18+</text></g>
  <rect x="80" y="590" width="80" height="14" fill="#1f6fb5" opacity="0.7"/><rect x="160" y="590" width="260" height="14" fill="#0f7a62" opacity="0.7"/><rect x="420" y="590" width="200" height="14" fill="#b5600f" opacity="0.7"/>
  <text font-size="11" fill="#4b5563" x="80" y="620">boiling point rises with chain length (schematic, right)</text>
</svg>
