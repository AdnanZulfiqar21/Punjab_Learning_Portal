<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#ffffff"/>
  <!-- Original diagram after Figure 5.7: a photosystem in the thylakoid membrane, with its antenna complex and reaction centre. -->
  <defs>
    <style>
      .h{font-size:27px;font-weight:700;fill:#14181f;text-anchor:middle}
      .s{font-size:19px;fill:#4b5563}
      .t{font-size:22px;font-weight:700;fill:#14181f}
      .lead{stroke:#4b5563;stroke-width:3;fill:none}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="ary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d98b2b"/></marker>
  </defs>
  <text class="h" x="600" y="50">A photosystem in the thylakoid membrane</text>
  <!-- membrane band -->
  <rect x="80" y="300" width="1040" height="130" fill="#dbe9f5"/>
  <rect x="80" y="300" width="1040" height="16" fill="#1f6fb5"/><rect x="80" y="414" width="1040" height="16" fill="#1f6fb5"/>
  <text class="s" x="90" y="280">thylakoid membrane</text>
  <!-- antenna complex: cluster of pigment molecules -->
  <path d="M260 310 q-40 60 0 110 h300 q40 -50 0 -110 z" fill="#e1f3ec" stroke="#0f7a62" stroke-width="4"/>
  <g fill="#0f7a62"><circle cx="300" cy="345" r="11"/><circle cx="340" cy="385" r="11"/><circle cx="380" cy="340" r="11"/><circle cx="420" cy="390" r="11"/><circle cx="460" cy="345" r="11"/><circle cx="500" cy="385" r="11"/><circle cx="360" cy="400" r="11"/><circle cx="440" cy="330" r="11"/></g>
  <g fill="#d98b2b"><circle cx="320" cy="400" r="9"/><circle cx="400" cy="360" r="9"/><circle cx="480" cy="400" r="9"/></g>
  <!-- energy passing arrows inside antenna -->
  <g stroke="#d98b2b" stroke-width="3" fill="none" marker-end="url(#ary)"><path d="M300 345 L335 380"/><path d="M380 340 L415 385"/><path d="M460 345 L495 380"/><path d="M500 385 L560 365"/></g>
  <!-- reaction centre -->
  <rect x="580" y="315" width="140" height="100" rx="14" fill="#5b3fb5"/>
  <text x="650" y="355" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">P700 or P680</text>
  <text x="650" y="385" font-size="17" fill="#fff" text-anchor="middle">chlorophyll a</text>
  <!-- primary electron acceptor -->
  <rect x="770" y="320" width="120" height="90" rx="12" fill="#d98b2b"/>
  <text x="830" y="358" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">primary</text><text x="830" y="382" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">acceptor</text>
  <path d="M720 365 H765" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- electron transport chain -->
  <g fill="#9ca3af"><circle cx="950" cy="365" r="18"/><circle cx="1010" cy="365" r="18"/><circle cx="1070" cy="365" r="18"/></g>
  <path d="M895 365 H928 M968 365 H988 M1028 365 H1048" stroke="#4b5563" stroke-width="4" marker-end="url(#ar)"/>
  <!-- light -->
  <g stroke="#f2b134" stroke-width="5" marker-end="url(#ary)"><path d="M250 150 L300 300"/><path d="M330 140 L370 300"/><path d="M410 140 L440 300"/><path d="M490 150 L500 300"/></g>
  <text class="t" x="230" y="120">Light (photons)</text>
  <!-- labels -->
  <path class="lead" d="M410 430 L410 520"/><text class="t" x="260" y="550">Antenna complex</text><text class="s" x="200" y="578">many pigment molecules capture</text><text class="s" x="200" y="602">light and pass the energy inwards</text>
  <path class="lead" d="M650 415 L650 520"/><text class="t" x="580" y="550">Reaction centre</text><text class="s" x="570" y="578">chlorophyll a passes the</text><text class="s" x="570" y="602">high-energy electrons on</text>
  <path class="lead" d="M1010 383 L1010 520"/><text class="t" x="900" y="550">Electron transport chain</text><text class="s" x="880" y="578">a series of electron carriers</text>
  <text class="s" x="80" y="655">PS-I has P700 chlorophyll a (absorbs best at 700 nm); PS-II has P680 (680 nm). Both are embedded in the thylakoid membranes.</text>
</svg>
