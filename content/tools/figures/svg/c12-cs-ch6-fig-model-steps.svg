<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>
  <!-- Original: the steps from collecting data to predicting, with a loop back to improve. -->
  <text x="450.0" y="34.0" font-size="22" fill="#14181f" text-anchor="middle" font-weight="700">Building a machine learning model (after Fig 6.6)</text>
  <rect x="19.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#1f6fb5" stroke-width="2" fill="#ffffff"/>
  <text x="75.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">collect data</text>
  <line x1="132.0" y1="150.0" x2="137.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M143.0 150.0 L136.7 153.0 L136.7 147.0 Z" fill="#14181f"/>
  <rect x="144.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#0e9aa7" stroke-width="2" fill="#ffffff"/>
  <text x="200.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">clean and prepare</text>
  <line x1="257.0" y1="150.0" x2="262.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M268.0 150.0 L261.7 153.0 L261.7 147.0 Z" fill="#14181f"/>
  <rect x="269.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#d98b2b" stroke-width="2" fill="#ffffff"/>
  <text x="325.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">select features</text>
  <line x1="382.0" y1="150.0" x2="387.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M393.0 150.0 L386.7 153.0 L386.7 147.0 Z" fill="#14181f"/>
  <rect x="394.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#7c3aed" stroke-width="2" fill="#ffffff"/>
  <text x="450.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">split train/test</text>
  <line x1="507.0" y1="150.0" x2="512.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M518.0 150.0 L511.7 153.0 L511.7 147.0 Z" fill="#14181f"/>
  <rect x="519.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#0f7a62" stroke-width="2" fill="#ffffff"/>
  <text x="575.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">train model</text>
  <line x1="632.0" y1="150.0" x2="637.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M643.0 150.0 L636.7 153.0 L636.7 147.0 Z" fill="#14181f"/>
  <rect x="644.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#d7322f" stroke-width="2" fill="#ffffff"/>
  <text x="700.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">test model</text>
  <line x1="757.0" y1="150.0" x2="762.4" y2="150.0" stroke="#14181f" stroke-width="2" stroke-linecap="round"/>
  <path d="M768.0 150.0 L761.7 153.0 L761.7 147.0 Z" fill="#14181f"/>
  <rect x="769.0" y="122.0" width="112.0" height="56.0" rx="8" stroke="#14181f" stroke-width="2" fill="#ffffff"/>
  <text x="825.0" y="154.2" font-size="12" fill="#14181f" text-anchor="middle" font-weight="700">predict</text>
  <path d="M700 180 Q600 280 450 280 Q330 280 325 182" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M325.0 182.0 L328.8 190.2 L321.2 190.2 Z" fill="#4b5563"/>
  <text x="450.0" y="302.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">not good enough? improve features or data and retrain</text>
  <text x="450.0" y="345.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">Example: attendance, quiz marks, assignment scores and study hours (features)</text>
  <text x="450.0" y="363.0" font-size="13" fill="#14181f" text-anchor="middle" font-weight="700">are used to predict a student's grade (target) before the final exam.</text>
  <text x="450.0" y="401" font-size="12" fill="#4b5563" text-anchor="middle">Original diagram for this lesson; the textbook's picture is not reproduced.</text>
</svg>
