[project]
name = "portal-api"
version = "0.1.0"
description = "Punjab Learning Portal — authoritative backend API (modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "pypdfium2==5.14.0",
    "sqlalchemy==2.1.3",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
portal-import-catalogue = "portal_api.modules.curriculum.importer:main"
portal-grant-role = "portal_api.modules.identity.cli:main"
portal-dev-seed-staff = "portal_api.modules.identity.dev_seed:main"
portal-expire-attempts = "portal_api.modules.assessment.cli:main"
portal-dev-seed-practice = "portal_api.modules.content.dev_fixtures:main"
portal-written-previews = "portal_api.modules.written.cli:previews"
portal-written-sweep-orphans = "portal_api.modules.written.cli:sweep"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pypdf==6.19.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["S105", "S106", "S107"]  # technical test credentials only

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true  # no type stubs published

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
