<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Punjab Learning Portal</title>
    <style>
      :root { --bg: #f7f8fa; --fg: #14181d; --muted: #5b6470; --card: #ffffff; --border: #dde2e8; --accent: #0b5d73; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1318; --fg: #e8ecf1; --muted: #a0a9b4; --card: #161b22; --border: #2a313b; --accent: #6cc4dc; }
      }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 36rem; margin: 0 auto; padding: 3rem 1rem; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0.5rem 0; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="status">
        <h1>You're offline</h1>
        <p>This page needs an internet connection. Nothing here was stored on your device.</p>
        <p>If you were in a test, the answers you chose are kept on your device and are sent automatically when you're back online. Don't clear your browser data until then.</p>
        <p><a href="">Try again</a></p>
        <p class="muted">Punjab Learning Portal</p>
      </div>
    </main>
  </body>
</html>
